<rect x="660" y="332" width="440" height="168" rx="8" fill="#f4faf7" stroke="#45666d" stroke-width="12"/>
<text x="880" y="442" font-size="72" font-weight="bold">銀行</text>
<path d="M40 510H1160" stroke="#9b8b6d" stroke-width="12"/>
<rect x="40" y="516" width="1120" height="246" rx="16" fill="#ded3bb"/>
<rect x="90" y="540" width="440" height="116" rx="18" fill="#fffaf0" stroke="#724f3d" stroke-width="8"/>
<rect x="660" y="540" width="440" height="116" rx="18" fill="#f4faf7" stroke="#45666d" stroke-width="8"/>
<text x="310" y="615" font-size="54">質屋の地下室</text>
<text x="880" y="615" font-size="54">銀行の地下室</text>
<path d="M310 660V712H880V676" fill="none" stroke="#9a6848" stroke-width="22" stroke-linejoin="round"/>
