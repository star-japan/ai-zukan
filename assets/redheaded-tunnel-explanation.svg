<g font-family="sans-serif" text-anchor="middle" fill="#263b48">
<rect x="48" y="34" width="1104" height="110" rx="22" fill="#e8d8ae"/>
<text x="600" y="108" font-size="58" font-weight="bold">店主は組合の仕事で不在</text>
<path d="M68 332L310 184 552 332" fill="#c78160" stroke="#724f3d" stroke-width="12" stroke-linejoin="round"/>
<rect x="90" y="332" width="440" height="168" rx="8" fill="#fffaf0" stroke="#724f3d" stroke-width="12"/>
