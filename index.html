const items = [
{id:'rashomon',cat:'literature',name:'羅生門',sub:'芥川龍之介｜1915年発表',motif:'gate',gist:'生き延びるためなら、悪事は許されるのか。悪を責めた男が、同じ理屈で悪へ踏み出す物語。',intro:'荒廃した京都。主人に暇を出された下人が、雨の降る夕方、羅生門の下で途方に暮れている。生活の当てはなく、このままでは飢え死にする。しかし、盗人になる決心もつかない。夜を過ごそうと門の楼へ上がると、そこには捨てられた死体が並び、老婆が女の死体から髪を抜いていた。下人は激しい怒りを覚え、老婆を捕らえて理由を問いただす。老婆は、抜いた髪でかつらを作るのだと答える。さらに、死んだ女も生前は蛇を干魚と偽って売っていたが、生きるためだったのだから仕方がない、自分の行為も同じだと弁明する。その言葉を聞くうち、下人の心に、それまでなかった勇気が生まれる。下人は、自分が着物を奪うのも飢え死にを避けるためだと言い放ち、老婆の着物をはぎ取って暗闇へ姿を消す。悪を憎んでいたはずの男は、他人の弁明を、自分の悪事を正当化する理由へと変えてしまった。',people:[['下人','失業し、生きる手段と善悪の間で揺れる男。'],['老婆','死体から髪を抜き、生計を立てようとする女。']],theme:'下人の怒りが、老婆の弁明を境に自分の悪事を支える理屈へ変わる。その転換を追うと、「生きるため」という言葉が、誰の立場から語られるかで異なる働きをすることが見えてくる。これは読み方の一例であり、作品の意味を一つに限定するものではない。',memory:'善悪の基準が揺れる、その瞬間に注目する。',links:['akutagawa','hana','spider'],sources:[{"title": "青空文庫「羅生門」本文", "url": "https://www.aozora.gr.jp/cards/000879/files/127_15260.html"}, {"title": "青空文庫 図書カード（初出：1915年11月）", "url": "https://www.aozora.gr.jp/cards/000879/card127.html"}]},
{id:'akutagawa',cat:'person',name:'芥川龍之介',sub:'1892–1927｜小説家',motif:'book',gist:'古い物語を手がかりに、人間の心を新しく描いた作家。『羅生門』『鼻』『蜘蛛の糸』をつなぐ人物。',intro:'芥川龍之介は、1892年に東京で生まれ、1927年に亡くなった小説家。『羅生門』『鼻』『蜘蛛の糸』などの短編で知られる。古典や説話を題材にしながら、他人の目を気にする心、利己心、善悪の揺らぎなどを描いた。ここではまず三つの作品を読み比べ、それぞれの人物が何を望み、どのように変化するのかをたどってみよう。',people:[['読む入口','『羅生門』では善悪の転換、『鼻』では自尊心と他人の視線、『蜘蛛の糸』では救いと利己心が読みどころとなる。']],theme:'同じ作家の作品を並べても、人物や結末は異なる。共通点を探すと同時に、作品ごとの語り方の違いにも目を向けたい。',memory:'作品を読み、作家に戻り、次の作品へ進む。',links:['rashomon','hana','spider'],sources:[{"title": "国立国会図書館「近代日本人の肖像」芥川龍之介", "url": "https://www.ndl.go.jp/portrait/datas/224/"}]},
{id:'hana',cat:'literature',name:'鼻',sub:'芥川龍之介｜1916年発表',motif:'ripple',gist:'悩みの種がなくなれば、幸せになれるはずだった。長い鼻をめぐり、自尊心と他人の視線が交錯する物語。',intro:'池の尾に住む僧・禅智内供には、あごの下まで垂れ下がる長い鼻があった。食事にも不便な鼻だが、内供が何より苦しんでいたのは、人からどう見られるかということだった。それでも、鼻を気にしていると思われたくない。経典に自分のような鼻の持ち主を探し、短くする方法を試しても、悩みは消えなかった。あるとき、弟子が鼻を短くする方法を聞いてくる。内供は平静を装いながら、その方法を試し、ついに普通の長さの鼻を手に入れる。ところが、願いがかなった後、人々は以前にも増して内供を笑うようになる。周囲の態度を理解できない内供は、いら立ちを募らせていく。ある朝、鼻は元の長さに戻っていた。鏡に映る自分を確かめた内供は、以前の姿に戻ったにもかかわらず、不思議な安心を感じる。これでもう誰も笑わないだろうと思う内供の心は、外見だけを変えても解けなかった悩みを浮かび上がらせる。',people:[['禅智内供','長い鼻と、人からの見られ方を気にする僧。'],['弟子・周囲の人々','鼻を短くする方法を伝えたり、変化した内供を笑ったりする人々。']],theme:'作品は、当人の自尊心だけでなく、他人の不幸には同情しても、その人が悩みから抜け出すと別の感情を抱く、周囲の複雑な心理も描く。内供の安心が本当に問題の解決なのか、結末から考えることもできる。',memory:'鼻の長さよりも、他人の目に心が揺れる。',links:['akutagawa','rashomon'],sources:[{"title": "青空文庫「鼻」本文", "url": "https://www.aozora.gr.jp/cards/000879/files/42_15228.html"}, {"title": "青空文庫 図書カード（初出：1916年2月）", "url": "https://www.aozora.gr.jp/cards/000879/card42.html"}]},
{id:'spider',cat:'literature',name:'蜘蛛の糸',sub:'芥川龍之介｜1918年発表',motif:'thread',gist:'一本の糸にすがった男は、後から来る人々を拒んだ。救いを独り占めしようとする心を描く物語。',intro:'ある朝、極楽の蓮池のほとりを歩いていた釈迦は、池の底に広がる地獄をのぞき見る。そこには、血の池で苦しむ犍陀多という男がいた。犍陀多は多くの悪事を働いたが、生前、一匹の蜘蛛を踏み殺さずに助けたことがあった。釈迦はその小さな善行を思い出し、極楽の蜘蛛の糸を地獄へ垂らす。糸を見つけた犍陀多は、これを登れば地獄から抜け出せると考え、夢中で上を目指す。しばらく登って休み、下を見ると、無数の罪人たちが同じ糸を伝って続いていた。犍陀多は、その重さで糸が切れれば自分も落ちてしまうと恐れる。そして、この糸は自分のものだ、下りろ、と叫ぶ。その瞬間、糸は犍陀多の上で切れ、男は再び地獄へ落ちていった。釈迦はその一部始終を見て悲しそうな顔をし、歩き続ける。極楽では、何事もなかったように蓮の花が香りを漂わせている。',people:[['犍陀多（かんだた）','地獄から逃れようと蜘蛛の糸を登る男。'],['釈迦','犍陀多の小さな善行を思い出し、救いの糸を垂らす。']],theme:'小さな善行によって与えられた救いの機会を、犍陀多はどう受け止めたのか。糸を「自分のもの」と考えた瞬間に注目すると、利己心と救済の関係を読み取れる。',memory:'登る高さよりも、他者に向ける心が問われる。',links:['akutagawa','rashomon'],sources:[{"title": "青空文庫「蜘蛛の糸」本文", "url": "https://www.aozora.gr.jp/cards/000879/files/92_14545.html"}, {"title": "青空文庫 図書カード（初出：1918年7月）", "url": "https://www.aozora.gr.jp/cards/000879/card92.html"}]},
{id:'kawasaki',cat:'region',name:'川崎区ゆるキャラ大図鑑',sub:'地域文化｜企画・準備中',motif:'town',gist:'地域の産業・歴史・文化を、オリジナルキャラクターから知る。これから育てる川崎区の図鑑。',intro:'川崎区に実在する、または歴史的に存在した題材を調べ、オリジナルキャラクターと解説を組み合わせる企画です。産業、港湾、交通、寺社、暮らしなどを入口に、人物や場所、時代のつながりを紹介する構成を考えています。現在は企画段階で、個別キャラクターや解説記事は未掲載です。公的資料などで事実と出典を確かめ、創作部分とは分けて追加していきます。',people:[['今後の掲載方針','題材の名称、確認した出典、史実と創作の区別、確認日を記録する。'],['キャラクターについて','このサイト独自の創作を予定。自治体公認や既存の公式キャラクターであることを意味しない。']],theme:'親しみやすい入口から、元になった地域の本当の姿へ進める図鑑を目指す。まだ確認できていない歴史、所在地、関係性は事実として掲載しない。',memory:'キャラクターの向こうにある、地域の物語をたどる。',links:[],sources:[{"title": "川崎市公式「川崎区の概要」", "url": "https://www.city.kawasaki.jp/kawasaki/page/0000026330.html"}]}
];

let category='all',query='',lastListHash='#/',isRouting=false;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function art(x){return `<svg viewBox="0 0 240 150" fill="none" aria-hidden="true"><circle cx="120" cy="77" r="61" stroke="#a18243" stroke-width=".6"/><g stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round">${motifs[x.motif]}</g></svg>`}
function card(x){return `<a class="card" href="#/article/${x.id}"><div class="card-visual">${art(x)}</div><div class="cardbody"><span class="label">${catNames[x.cat]}${x.id==='kawasaki'?' · 準備中':''}</span><h3>${esc(x.name)}</h3><span class="meta">${esc(x.sub)}</span><p>${esc(x.gist)}</p><span class="readmore">${x.id==='kawasaki'?'企画を読む':'詳しく読む'} <span aria-hidden="true">→</span></span></div></a>`}
function listHash(){const p=new URLSearchParams();if(category!=='all')p.set('cat',category);if(query)p.set('q',query);return '#/'+(p.size?'?'+p.toString():'')}
function renderList(){const q=query.normalize('NFKC').toLowerCase();const found=items.filter(x=>(category==='all'||x.cat===category)&&[x.name,x.sub,x.gist,x.intro].join(' ').normalize('NFKC').toLowerCase().includes(q));main.innerHTML=`<div class="sectionhead"><h2>知識の扉をひらく</h2><span class="count" role="status">${found.length}件${category==='all'&&!query?' · 企画を含む':''}</span></div>${found.length?`<div class="grid">${found.map(card).join('')}</div>`:'<div class="empty"><h2>該当する項目がありません</h2><p>別の言葉で検索するか、分野の絞り込みを外してみてください。</p><button class="reset" id="reset">すべての項目を見る</button></div>'}<aside class="editorial"><strong>この図鑑について</strong><p>短い要点から、あらすじ・解説・原典へ。文学の解説には読み方の一例を含みます。地域文化は企画段階です。図柄は本サイトの装飾で、実物の写真・史料を示すものではありません。</p></aside>`;document.getElementById('reset')?.addEventListener('click',reset)}
function renderArticle(x){const literary=x.cat==='literature';main.innerHTML=`<button class="back" id="back">← 一覧に戻る</button><article class="article"><header class="articleheader"><div><span class="label">${catNames[x.cat]} / ${literary?'名作を読み解く':x.cat==='person'?'作品と人物をつなぐ':'地域を知る入口'}</span><h2>${esc(x.name)}</h2><p class="meta">${esc(x.sub)}</p></div>${art(x)}</header><div class="content"><section class="gist"><h3>${literary?'この作品をひと言で':'この項目をひと言で'}</h3><p>${esc(x.gist)}</p></section><section><h3>${literary?'あらすじ':'概要'}${literary?'<span class="badge">結末を含みます</span>':''}</h3><p class="bodytext">${esc(x.intro)}</p></section><details><summary>${literary?'登場人物・作品の意味を読む':'関連情報をもっと読む'}</summary><div class="deep"><h3>${literary?'登場人物':'関連情報'}</h3><ul class="people">${x.people.map(([n,d])=>`<li><strong>${esc(n)}</strong>${esc(d)}</li>`).join('')}</ul><h3>${literary?'作品の意味・読み方の一例':x.id==='kawasaki'?'制作の考え方':'作品を読む視点'}</h3><p class="bodytext">${esc(x.theme)}</p><h3>記憶に残るポイント</h3><p>${esc(x.memory)}</p></div></details><details><summary>出典・確認情報</summary><p class="subnote">${x.id==='kawasaki'?'地域の調査に用いる公式情報の入口です。個別の地域記事の検証完了を意味しません。':'以下を確認し、本文は本サイト独自の言葉で要約しています。解釈は原典の事実記述と区別しています。'}</p><ul class="sources">${x.sources.map(s=>`<li><a href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">${esc(s.title)} ↗</a></li>`).join('')}</ul><p class="subnote">確認日：2026年11月1日。画像・写真の転載は行っていません。</p></details></div></article>${x.links.length?`<section class="related"><div class="sectionhead"><h2>知識をつなぐ、次の一冊・一人</h2></div><div class="grid">${x.links.map(id=>items.find(z=>z.id===id)).filter(Boolean).map(card).join('')}</div></section>`:''}`;document.getElementById('back').onclick=()=>{location.hash=lastListHash}}
function syncControls(){search.value=query;document.querySelectorAll('[data-cat]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.cat===category)))}
function route({focus=false}={}){isRouting=true;const hash=location.hash||'#/';if(hash.startsWith('#/article/')){const id=hash.slice(10);const x=items.find(i=>i.id===id);if(x){document.title=x.name+'｜知識の大図鑑';renderArticle(x);if(focus){main.focus({preventScroll:true});main.scrollIntoView({behavior:'auto',block:'start'})}}else{main.innerHTML='<div class="empty"><h2>項目が見つかりません</h2><p>URLを確認するか、一覧へ戻ってください。</p><a href="#/">一覧に戻る</a></div>';document.title='項目が見つかりません｜知識の大図鑑'}}else{const p=new URLSearchParams(hash.includes('?')?hash.split('?').slice(1).join('?'):'');category=['literature','person','region'].includes(p.get('cat'))?p.get('cat'):'all';query=p.get('q')||'';lastListHash=listHash();syncControls();renderList();document.title='知識の大図鑑｜知るほど、世界がつながる。';if(focus){main.focus({preventScroll:true});document.getElementById('browse').scrollIntoView({behavior:'auto',block:'start'})}}isRouting=false}
function showList(replace=false){const h=listHash();lastListHash=h;if(replace){history.replaceState(null,'',h);renderList();document.title='知識の大図鑑｜知るほど、世界がつながる。'}else if(location.hash===h)renderList();else location.hash=h;syncControls()}
function reset(){category='all';query='';showList();search.focus()}
search.addEventListener('input',()=>{query=search.value;const inArticle=location.hash.startsWith('#/article/');if(inArticle)history.pushState(null,'',listHash());showList(true)});
document.getElementById('clear').addEventListener('click',()=>{query='';showList();search.focus()});
document.querySelectorAll('[data-cat]').forEach(b=>b.addEventListener('click',()=>{category=b.dataset.cat;showList()}));
document.querySelector('.skip').addEventListener('click',e=>{e.preventDefault();main.focus({preventScroll:true});main.scrollIntoView({behavior:'auto',block:'start'})});
window.addEventListener('hashchange',()=>route({focus:true}));route();
</script>
</body></html>
