<script>
'use strict';
const preservedArticleItems=[{"id": "rashomon", "image": "assets/rashomon.webp", "imageAlt": "雨の羅生門を描いた作品イメージ", "synopsisSummary": ["荒廃した京都。主人に暇を出された下人が、雨の降る夕方、羅生門の下で途方に暮れている。生活の当てはなく、このままでは飢え死にする。しかし、盗人になる決心もつかない。", "夜を過ごそうと門の楼へ上がると、そこには捨てられた死体が並び、老婆が女の死体から髪を抜いていた。下人は激しい怒りを覚え、老婆を捕らえて理由を問いただす。老婆は、抜いた髪でかつらを作るのだと答える。さらに、死んだ女も生前は蛇を干魚と偽って売っていたが、生きるためだったのだから仕方がない、自分の行為も同じだと弁明する。", "その言葉を聞くうち、下人の心に、それまでなかった勇気が生まれる。下人は、自分が着物を奪うのも飢え死にを避けるためだと言い放ち、老婆の着物をはぎ取って暗闇へ姿を消す。悪を憎んでいたはずの男は、他人の弁明を、自分の悪事を正当化する理由へと変えてしまった。"], "questions": ["下人は、老婆のどの言葉を境に態度を変えたのだろう。本文からその前後を比べてみよう。", "自分と他人に同じ基準を当てているだろうか。日常の判断を振り返る手がかりになるだろうか。"], "cat": "literature", "name": "羅生門", "sub": "芥川龍之介｜1915年発表", "motif": "gate", "gist": "生き延びるためなら、悪事は許されるのか。悪を責めた男が、同じ理屈で悪へ踏み出す物語。", "intro": "仕事を失った下人が、荒れ果てた京都の羅生門で雨を避けている。このままでは飢えてしまうが、盗人になる決心もつかない。夜を過ごそうと門の楼へ上がると、死体のそばで何かをしている老婆を見つける。", "people": [["下人（げにん）", "失業し、生きる手段と善悪の間で揺れる男。"], ["老婆", "死体から髪を抜き、生計を立てようとする女。"]], "theme": "下人の怒りが、老婆の弁明を境に自分の悪事を支える理屈へ変わる。その転換を追うと、「生きるため」という言葉が、誰の立場から語られるかで異なる働きをすることが見えてくる。これは読み方の一例であり、作品の意味を一つに限定するものではない。", "memory": "善悪の基準が揺れる、その瞬間に注目する。", "links": ["akutagawa", "hana", "spider"], "sources": [{"title": "青空文庫「羅生門」本文", "url": "https://www.aozora.gr.jp/cards/000879/files/127_15260.html"}, {"title": "青空文庫 図書カード（初出：1915年11月）", "url": "https://www.aozora.gr.jp/cards/000879/card127.html"}], "reading": "らしょうもん", "bodyReadings": {"楼": "ろう", "干魚": "ほしうお", "盗人": "ぬすびと", "追い詰め": "おいつめ"}, "summaryReadings": {"下人": {"reading": "げにん", "key": "下人"}}, "primaryCategory": "japanese-literature", "genreLabel": "日本文学", "characterGallery": [{"name": "下人（げにん）", "role": "失業し、生きる手段と善悪の間で揺れる男。", "portraits": [{"src": "assets/rashomon-face-genin.webp", "label": "", "alt": "下人の創作イメージ", "width": 500, "height": 500}]}, {"name": "老婆", "role": "死体から髪を抜き、生計を立てようとする女。", "portraits": [{"src": "assets/rashomon-face-oldwoman.webp", "label": "", "alt": "老婆の創作イメージ", "width": 500, "height": 500}]}], "characterGalleryNote": "", "headerCaption": "雨の夕方、羅生門の下で行き場を失った下人。", "inlineIllustrations": [{"afterParagraph": 1, "src": "assets/rashomon.webp", "caption": "雨の夕方、羅生門の下で行き場を失った下人。", "alt": "雨の夕方、羅生門の下で行き場を失った下人。", "width": 1200, "height": 800}, {"afterParagraph": 2, "src": "assets/rashomon-oldwoman-explanation-scene.webp", "alt": "生きるためだったと語る老婆。その弁明を、下人は冷ややかに聞いています。", "caption": "生きるためだったと語る老婆。その弁明を、下人は冷ややかに聞いています。", "width": 1200, "height": 800}, {"afterParagraph": 3, "src": "assets/rashomon-stolen-robe-departure-scene.webp", "alt": "老婆の弁明を自分の口実に変えた下人は、奪った着物を抱え、暗闇へ駆け下ります。", "caption": "老婆の弁明を自分の口実に変えた下人は、奪った着物を抱え、暗闇へ駆け下ります。", "width": 1200, "height": 800}]}, {"id": "akutagawa", "reading": "あくたがわりゅうのすけ", "cat": "person", "name": "芥川龍之介", "sub": "1892–1927｜小説家", "motif": "book", "gist": "古い物語を読み直し、人が迷ったり、他人の目を気にしたりする心を描いた小説家。", "intro": "芥川龍之介は、1892年に東京で生まれ、1927年に亡くなった小説家です。『羅生門』『鼻』『蜘蛛の糸』などを書きました。昔から伝わる物語をもとにした作品だけでなく、自分と同じ時代の人々を描いた作品もあります。登場人物が何を望み、なぜ迷い、どう行動するかをたどると、その人の気持ちを考えながら読めます。", "people": [["読む入口", "まずは『鼻』で、人にどう見られるかを気にする主人公を読んでみましょう。次に『羅生門』『蜘蛛の糸』を読むと、登場人物の望みや選び方の違いを比べられます。"]], "theme": "同じ作家の作品を並べても、人物や結末は異なる。共通点を探すと同時に、作品ごとの語り方の違いにも目を向けたい。", "memory": "作品を読み、作家に戻り、次の作品へ進む。", "links": ["rashomon", "hana", "spider", "toshishun", "trolley", "mikan", "imogayu", "majutsu", "inutofue", "jigokuhen", "yabunonaka"], "sources": [{"title": "国立国会図書館「近代日本人の肖像」芥川龍之介", "url": "https://www.ndl.go.jp/portrait/datas/224/"}, {"title": "東北大学附属図書館・夏目漱石ライブラリ「2月19日」（芥川龍之介あて書簡）", "url": "https://www.library.tohoku.ac.jp/collection/collection/soseki/words/2_19.html"}], "image": "assets/akutagawa-ai.webp", "imageAlt": "芥川龍之介を描いたAIイラスト", "imageCaption": "人物を描いたAIイラスト（写真ではありません）", "portraitNote": "実在の人物を題材にしたAI生成の創作イラストです。本人の写真や、写真を忠実に復元した画像ではありません。", "primaryCategory": "person", "genreLabel": "人物", "backgroundDiagrams": true, "sourceNote": "「芥川龍之介の歩み」の年表は、国立国会図書館「近代日本人の肖像」、日本近代文学館の『羅生門』展解説、東北大学附属図書館の漱石書簡解説を照合しています（年表確認日：2026年11月3日）。1915年は短編『羅生門』の初出年で、短編集の刊行年ではありません。"}, {"id": "hana", "image": "assets/hana-longnose-corrected.webp", "imageAlt": "僧・禅智内供を描いた作品イメージ", "synopsisSummary": ["池の尾に住む僧・禅智内供には、あごの下まで垂れ下がる長い鼻があった。食事にも不便な鼻だが、内供が何より苦しんでいたのは、人からどう見られるかということだった。それでも、鼻を気にしていると思われたくない。経典に自分のような鼻の持ち主を探し、短くする方法を試しても、悩みは消えなかった。", "あるとき、弟子が鼻を短くする方法を聞いてくる。内供は平静を装いながら、その方法を試し、ついに普通の長さの鼻を手に入れる。", "ところが、願いがかなった後、人々は以前にも増して内供を笑うようになる。周囲の態度を理解できない内供は、いら立ちを募らせていく。", "ある朝、鼻は元の長さに戻っていた。手で鼻を確かめた内供は、以前の姿に戻ったにもかかわらず、不思議な安心を感じる。これでもう誰も笑わないだろうと思う内供の心は、外見だけを変えても解けなかった悩みを浮かび上がらせる。"], "questions": ["鼻を短くする前と後で、内供の願いと周囲の反応はどう食い違っているだろう。", "人の悩みが解消したとき、素直に喜べないことはあるだろうか。自分の気持ちと語り手の説明を比べてみよう。"], "cat": "literature", "name": "鼻", "sub": "芥川龍之介｜1916年発表", "motif": "ripple", "gist": "悩みの種がなくなれば、幸せになれるはずだった。長い鼻をめぐり、自尊心と他人の視線が交錯する物語。", "intro": "長い鼻に悩む僧の禅智内供は、人からどう見られているかが気になって仕方がない。それでも、鼻を気にしているとは知られたくない。そんな内供（ないぐ）のもとへ、弟子が鼻を短くする方法を持ち帰る。", "people": [["禅智内供（ぜんち ないぐ）", "長い鼻と、人からの見られ方を気にする僧。"], ["弟子・周囲の人々", "鼻を短くする方法を伝えたり、変化した内供を笑ったりする人々。"]], "theme": "作品は、当人の自尊心だけでなく、他人の不幸には同情しても、その人が悩みから抜け出すと別の感情を抱く、周囲の複雑な心理も描く。内供の安心が本当に問題の解決なのか、結末から考えることもできる。", "memory": "鼻の長さよりも、他人の目に心が揺れる。", "links": ["akutagawa", "rashomon"], "sources": [{"title": "青空文庫「鼻」本文", "url": "https://www.aozora.gr.jp/cards/000879/files/42_15228.html"}, {"title": "青空文庫 図書カード（初出：1916年2月）", "url": "https://www.aozora.gr.jp/cards/000879/card42.html"}], "reading": "はな", "bodyReadings": {"禅智内供": "ぜんちないぐ"}, "summaryReadings": {"禅智内供": {"reading": "ぜんち ないぐ", "key": "禅智内供"}, "内供": {"reading": "ないぐ", "key": "禅智内供"}}, "primaryCategory": "japanese-literature", "genreLabel": "日本文学", "characterGallery": [{"name": "禅智内供（ぜんち ないぐ）", "role": "長い鼻と、人からの見られ方を気にする僧。", "portraits": [{"src": "assets/hana-face-naigu.webp", "label": "", "alt": "禅智内供の創作イメージ", "width": 500, "height": 500}]}, {"name": "弟子・周囲の人々", "role": "鼻を短くする方法を伝えたり、変化した内供を笑ったりする人々。", "portraits": [{"src": "assets/hana-face-people.webp", "label": "左は弟子、右の二人は周囲の人々の代表像", "alt": "弟子・周囲の人々の創作イメージ", "width": 500, "height": 500}]}], "characterGalleryNote": "弟子と周囲の人々は役割を示す代表像で、描いた全員が同じ場面に集まったという意味ではありません。", "headerCaption": "長い鼻を気にしながら、人には気にしていないように振る舞う禅智内供。", "inlineIllustrations": [{"afterParagraph": 1, "src": "assets/hana-longnose-corrected.webp", "caption": "長い鼻を気にしながら、人には気にしていないように振る舞う禅智内供。", "alt": "長い鼻を気にしながら、人には気にしていないように振る舞う禅智内供。", "width": 1200, "height": 800}, {"afterParagraph": 2, "src": "assets/hana-shortnose-mirror-scene.webp", "alt": "弟子の差し出す鏡をのぞき、短くなった鼻を確かめる内供。これでもう笑われないだろうと思います。", "caption": "弟子の差し出す鏡をのぞき、短くなった鼻を確かめる内供。これでもう笑われないだろうと思います。", "width": 1200, "height": 800}, {"afterParagraph": 3, "src": "assets/hana-shortnose-reaction-scene.webp", "alt": "鼻は短くなったのに、人々の笑いは増えてしまいます。内供は周囲の態度に戸惑います。", "caption": "鼻は短くなったのに、人々の笑いは増えてしまいます。内供は周囲の態度に戸惑います。", "width": 1200, "height": 800}]}, {"id": "spider", "image": "assets/spider.webp", "imageAlt": "蓮池と蜘蛛の糸を描いた作品イメージ", "synopsisSummary": ["ある朝、極楽の蓮池のほとりを歩いていた釈迦は、池の底に広がる地獄をのぞき見る。そこには、血の池で苦しむ犍陀多という男がいた。犍陀多は多くの悪事を働いたが、生前、一匹の蜘蛛を踏み殺さずに助けたことがあった。", "釈迦はその小さな善行を思い出し、極楽の蜘蛛の糸を地獄へ垂らす。", "糸を見つけた犍陀多は、これを登れば地獄から抜け出せると考え、夢中で上を目指す。しばらく登って休み、下を見ると、無数の罪人たちが同じ糸を伝って続いていた。", "犍陀多は、その重さで糸が切れれば自分も落ちてしまうと恐れる。そして、この糸は自分のものだ、下りろ、と叫ぶ。その瞬間、糸は犍陀多がぶら下がっているところで切れ、男は再び地獄へ落ちていった。釈迦はその一部始終を見て悲しそうな顔をし、歩き続ける。極楽では、何事もなかったように蓮の花が香りを漂わせている。"], "questions": ["犍陀多は、与えられた糸をいつから「自分のもの」と考えたのだろう。言葉の変化に注目してみよう。", "限られた機会を他の人と分かち合う場面で、不安は判断にどう影響するだろう。作品と現実の違いにも目を向けよう。"], "cat": "literature", "name": "蜘蛛の糸", "sub": "芥川龍之介｜1918年発表", "motif": "thread", "gist": "一本の糸にすがった男は、後から来る人々を拒んだ。救いを独り占めしようとする心を描く物語。", "intro": "地獄で苦しむ犍陀多は、生前に多くの悪事を働いた男だった。けれども、一度だけ小さな蜘蛛の命を助けたことがある。極楽からその姿を見た釈迦は、その善行を思い出し、一本の蜘蛛の糸を垂らす。", "people": [["犍陀多（かんだた）", "地獄から逃れようと蜘蛛の糸を登る男。"], ["釈迦（しゃか）", "犍陀多の小さな善行を思い出し、救いの糸を垂らす。"]], "theme": "小さな善行によって与えられた救いの機会を、犍陀多はどう受け止めたのか。糸を「自分のもの」と考えた瞬間に注目すると、利己心と救済の関係を読み取れる。", "memory": "登る高さよりも、他者に向ける心が問われる。", "links": ["akutagawa", "rashomon"], "sources": [{"title": "青空文庫「蜘蛛の糸」本文", "url": "https://www.aozora.gr.jp/cards/000879/files/92_14545.html"}, {"title": "青空文庫 図書カード（初出：1918年7月）", "url": "https://www.aozora.gr.jp/cards/000879/card92.html"}], "reading": "くものいと", "bodyReadings": {"犍陀多": "かんだた", "釈迦": "しゃか", "蓮池": "はすいけ", "蜘蛛": "くも"}, "summaryReadings": {"犍陀多": {"reading": "かんだた", "key": "犍陀多"}, "釈迦": {"reading": "しゃか", "key": "釈迦"}}, "primaryCategory": "japanese-literature", "genreLabel": "日本文学", "characterGallery": [{"name": "犍陀多（かんだた）", "role": "地獄から逃れようと蜘蛛の糸を登る男。", "portraits": [{"src": "assets/spider-face-kandata-corrected.webp", "label": "", "alt": "犍陀多の創作イメージ", "width": 500, "height": 500}]}, {"name": "釈迦（しゃか）", "role": "犍陀多の小さな善行を思い出し、救いの糸を垂らす。", "portraits": [{"src": "assets/spider-face-shaka.webp", "label": "", "alt": "釈迦の創作イメージ", "width": 500, "height": 500}]}], "characterGalleryNote": "", "headerCaption": "極楽に咲く白い蓮と、地獄へ下ろされた蜘蛛の糸。", "inlineIllustrations": [{"afterParagraph": 1, "src": "assets/spider-forest-mercy-scene.webp", "alt": "生前の犍陀多。林の道で見つけた一匹の蜘蛛を、殺さずに助けたことがありました。", "caption": "生前の犍陀多。林の道で見つけた一匹の蜘蛛を、殺さずに助けたことがありました。", "width": 1200, "height": 800}, {"afterParagraph": 2, "src": "assets/spider.webp", "caption": "極楽に咲く白い蓮と、地獄へ下ろされた蜘蛛の糸。", "alt": "極楽に咲く白い蓮と、地獄へ下ろされた蜘蛛の糸。", "width": 1200, "height": 800}, {"afterParagraph": 4, "src": "assets/spider-shaka-walkaway-scene.webp", "alt": "結末の極楽。釈迦は悲しそうな顔で、蓮池のほとりを再び歩き始めます。", "caption": "結末の極楽。釈迦は悲しそうな顔で、蓮池のほとりを再び歩き始めます。", "width": 1200, "height": 800}]}, {"id": "kawasaki", "cat": "region", "name": "川崎区ゆるキャラ大図鑑", "sub": "地域文化｜企画・準備中", "motif": "town", "gist": "地域の産業・歴史・文化を、オリジナルキャラクターから知る。これから育てる川崎区の図鑑。", "intro": "川崎区に実在する、または歴史的に存在した題材を調べ、オリジナルキャラクターと解説を組み合わせる企画です。産業、港湾、交通、寺社、暮らしなどを入口に、人物や場所、時代のつながりを紹介する構成を考えています。現在は制作中のキャラクター案を紹介しています。名称とデザインは仮案で、完成版として正式登録したものではありません。公的資料などで事実と出典を確かめ、創作部分とは分けて追加していきます。", "people": [["今後の掲載方針", "題材の名称、確認した出典、史実と創作の区別、確認日を記録する。"], ["キャラクターについて", "このサイト独自の創作を予定。自治体公認や既存の公式キャラクターであることを意味しない。"]], "theme": "親しみやすい入口から、元になった地域の本当の姿へ進める図鑑を目指す。まだ確認できていない歴史、所在地、関係性は事実として掲載しない。", "memory": "キャラクターの向こうにある、地域の物語をたどる。", "links": [], "sources": [{"title": "川崎市公式「川崎区の概要」", "url": "https://www.city.kawasaki.jp/kawasaki/page/0000026330.html"}], "primaryCategory": "region", "genreLabel": "地域文化"}, {"id": "melos", "cat": "literature", "name": "走れメロス", "sub": "太宰治｜1940年発表", "motif": "road", "gist": "約束の時までに戻らなければ、友が処刑される。迷いと疲労の中を走る男を通して、信頼を問い直す物語。", "intro": "人を信じず、次々と人を殺す王に怒った羊飼いのメロスは、捕らえられて死刑を宣告される。妹の婚礼を済ませるため、友を身代わりに残して村へ帰ることになった。約束の期限は、三日目の日没である。", "synopsisSummary": ["羊飼いのメロスは、妹の婚礼の買い物に来た町で、王が人を信じず、多くの人々を殺していると知る。怒ったメロスは王城へ入り、捕らえられて死刑を宣告される。妹の結婚式を済ませたいと願い、友人セリヌンティウスを身代わりに残して、三日目の日没までに戻る約束をする。", "村へ帰ったメロスは妹の婚礼を見届け、再び町へ向かう。", "途中、川の氾濫や山賊に阻まれ、疲れ果てて一度は約束を投げ出しそうになる。", "それでも泉の水で力を取り戻し、待つ友のもとへ走る。", "処刑の直前に到着したメロスは、自分が途中で弱い心を抱いたことを友に告白する。友もまた、一度だけメロスを疑ったと打ち明ける。二人は互いを殴って抱き合い、その姿を見た王は、人の心の真実を認めて仲間に入れてほしいと願う。", "人々の歓声の中、メロスは少女からマントを差し出され、裸体を友に指摘されて赤面する。"], "people": [["メロス", "王に怒り、友との約束を守るために帰路を走る羊飼い。"], ["セリヌンティウス", "メロスの身代わりとして刑場で待つ友人。"], ["王ディオニス", "人を信じず、メロスが戻らないことを予想する王。"]], "theme": "信頼は、疑いや弱さが一度も生まれないことなのだろうか。二人が再会後に互いの揺らぎを告白する場面を読むと、信頼を支える行動や正直さにも目を向けられる。これは読み方の一例で、作品を単純な教訓だけに限定するものではない。", "memory": "走り切った結果だけでなく、途中の迷いと再会後の告白を読む。", "questions": ["メロスが走る理由は、出発時と泉の水を飲んだ後でどう変わっているだろう。", "相手を一度疑ったことと、信頼を失うことは同じだろうか。二人の告白を手がかりに考えてみよう。"], "links": ["rashomon", "gongitsune", "dazai"], "sources": [{"title": "青空文庫「走れメロス」本文", "url": "https://www.aozora.gr.jp/cards/000035/files/1567_14913.html"}, {"title": "青空文庫 図書カード", "url": "https://www.aozora.gr.jp/cards/000035/card1567.html"}, {"title": "国立国会図書館 レファレンス協同データベース（1940年5月の掲載調査）", "url": "https://crd.ndl.go.jp/reference/detail?page=ref_view&id=1000244878"}, {"title": "文化庁・保護期間延長Q&A（既消滅の権利は復活しない）", "url": "https://www.bunka.go.jp/seisaku/chosakuken/hokaisei/kantaiheiyo_chosakuken/1411890.html"}], "reading": "はしれメロス", "image": "assets/melos-six-01.webp", "imageAlt": "妹の婚礼を見届けたメロスは、友の待つ町へ向かって走り出します。", "primaryCategory": "japanese-literature", "genreLabel": "日本文学", "bodyReadings": {"告白": "こくはく", "太宰治": "だざいおさむ"}, "characterGallery": [{"name": "メロス", "role": "王に怒り、友との約束を守るために帰路を走る羊飼い。", "portraits": [{"src": "assets/melos-six-02.webp", "width": 500, "height": 500, "alt": "メロスの作品イメージ", "label": ""}]}, {"name": "セリヌンティウス", "role": "メロスの身代わりとして刑場で待つ友人。", "portraits": [{"src": "assets/melos-six-03.webp", "width": 500, "height": 500, "alt": "セリヌンティウスの作品イメージ", "label": ""}]}, {"name": "王ディオニス", "role": "人を信じず、メロスが戻らないことを予想する王。", "portraits": [{"src": "assets/melos-six-04.webp", "width": 500, "height": 500, "alt": "王ディオニスの作品イメージ", "label": ""}]}], "characterGalleryNote": "メロスは妹の婚礼後、身支度をして朝に走り出すころの姿です。", "headerCaption": "妹の婚礼を見届けたメロスは、友の待つ町へ向かって走り出します。", "inlineIllustrations": [{"src": "assets/melos-six-05.webp", "width": 1280, "height": 853, "afterParagraph": 0, "caption": "買い物を終えたメロスは、静まり返る町で王の非道を知ります。", "alt": "日没後の静かな町で、婚礼の買い物を抱えたメロスが老人の話に耳を傾ける。"}, {"src": "assets/melos-six-06.webp", "width": 1200, "height": 800, "afterParagraph": 1, "caption": "王の前で、メロスは友に事情を話します。セリヌンティウスはうなずき、身代わりとして残ることを受け入れます。", "alt": "王の前で、メロスは友に事情を話します。セリヌンティウスはうなずき、身代わりとして残ることを受け入れます。"}, {"src": "assets/melos-six-01.webp", "width": 1200, "height": 800, "afterParagraph": 2, "caption": "妹の婚礼を見届けたメロスは、友の待つ町へ向かって走り出します。", "alt": "妹の婚礼を見届けたメロスは、友の待つ町へ向かって走り出します。"}, {"src": "assets/melos-six-07.webp", "width": 1280, "height": 853, "afterParagraph": 3, "caption": "橋を失った川へ飛び込み、荒れ狂う濁流を泳ぎます。", "alt": "壊れた橋が見える川の濁流を泳ぎ、対岸の木に手をかけるメロス。"}, {"src": "assets/melos-six-08.webp", "width": 1280, "height": 853, "afterParagraph": 4, "caption": "沈む夕陽を見つめ、友の待つ刑場へ走ります。", "alt": "夕陽の中、汗を流しながら最後の力で走るメロスの顔、肩、腕の接写。"}, {"src": "assets/melos-six-09.webp", "width": 1200, "height": 800, "afterParagraph": 5, "caption": "間に合ったメロスとセリヌンティウス。互いに一度は心が揺れたことを認め、再会を喜びます。", "alt": "間に合ったメロスとセリヌンティウス。互いに一度は心が揺れたことを認め、再会を喜びます。"}], "width": 1200, "height": 800, "conclusion": "メロスは諦めかけても走って戻り、友も一度は疑いながら待ち続けました。再会した二人は、その弱さを隠さず話して抱き合います。信じ合うとは、一度も迷わないことだけではなく、迷ったあとに相手のために行動し、正直に向き合うことでもある。二人の姿から、そんな受け取り方のできる物語です。", "sourceNote": " 太宰治（1948年没）の本人原作は日本で保護期間終了確認済み。現代のシラー日本語訳・注釈・挿絵・写真・映像等は別権利で未確認です。原典・原作権利確認日：2026年11月6日。採用版は青空文庫No1567（新字新仮名）、ちくま文庫『太宰治全集3』1988年10月25日初版、校正使用1998年6月15日第2刷です。末尾のシラーへの言及は太宰原作と現代翻訳の権利を同一とする意味ではありません。冒頭は日没後、渡河は昼、最後の疾走は日没前です。最後の疾走の絵は、原典の衣服の状態を変えず、顔と肩・腕を中心に描いています。", "checkedDate": "2026年11月6日"}, {"id": "restaurant", "cat": "literature", "name": "注文の多い料理店", "sub": "宮沢賢治｜1924年・同名童話集収録の一編", "motif": "doors", "gist": "歓迎されていると思って進んだ料理店で、客自身が料理されようとしていた。言葉の受け取り方が逆転する物語。", "intro": "山奥へ狩りに来た二人の紳士は、案内人とはぐれ、空腹のまま道に迷ってしまう。そこへ現れたのが、西洋料理店「山猫軒（やまねこけん）」。歓迎の言葉に安心して入るが、奥へ進むたびに、扉には不思議な注文が書かれている。", "synopsisSummary": ["二人の若い紳士が、猟銃と犬を連れて山奥へ狩りに出かける。獲物は見つからず、案内人ともはぐれ、二匹の犬も倒れてしまう。腹をすかせた二人は、西洋料理店「山猫軒」を見つける。", "入口には歓迎の言葉があり、奥へ進むたびに、扉に次々と指示が書かれている。髪や靴をきれいにし、鉄砲を置き、帽子・外套・靴を脱ぎ、金属の品を外すこと。二人はどれも、立派な店の作法や、料理を食べるための準備だと都合よく考えて従う。", "さらにクリームを塗り、酢くさい香水を振りかけ、塩を体にもみ込むよう求められたところで、自分たちが食べられる側なのだと気づく。", "奥から聞こえる声におびえ、泣き出した二人の顔は、紙くずのようにしわくちゃになる。そこへ先ほどの犬が現れて奥へ飛び込み、料理店は消える。", "案内人と再会して東京へ帰った二人だが、その顔は元には戻らない。"], "people": [["二人の紳士（しんし）", "狩りに来た青年たち。店の注文を自分たちに都合よく理解する。"], ["山猫軒（やまねこけん）の奥の声", "二人を奥へ誘い、料理の準備を進める存在。"], ["二匹の犬", "店の奥へ飛び込み、危機の場面を変える。"]], "theme": "同じ言葉でも、受け手の期待によって意味が違って見える。二人が注文をどう説明しているかを追うと、危険の手がかりを見落とす仕組みが浮かぶ。また、動物を狩る人間が食べられる側になる逆転から、人と自然の関係を考える読み方もできる。", "memory": "扉の言葉を、客の側と店の側の両方から読み直す。", "questions": ["どの扉の言葉から、二人とは違う意味を読み取れただろう。初めに戻って確かめてみよう。", "期待していることに合う説明だけを選んでしまう場面は、日常にもあるだろうか。物語との違いも考えよう。"], "links": ["spider", "gongitsune", "kenji"], "sources": [{"title": "青空文庫「注文の多い料理店」本文", "url": "https://www.aozora.gr.jp/cards/000081/files/43754_17659.html"}, {"title": "青空文庫 図書カード（1924年刊行の童話集に収録）", "url": "https://www.aozora.gr.jp/cards/000081/card43754.html"}], "reading": "ちゅうもんのおおいりょうりてん", "image": "assets/restaurant-entrance-scene.webp", "imageAlt": "山奥で見つけた西洋料理店「山猫軒」。空腹の二人は、ここで食事ができると思って入ろうとします。", "summaryReadings": {"紳士": {"reading": "しんし", "key": "紳士"}, "山猫軒": {"reading": "やまねこけん", "key": "山猫軒"}}, "primaryCategory": "japanese-literature", "genreLabel": "日本文学", "bodyReadings": {}, "characterGallery": [{"name": "二人の紳士（しんし）", "role": "狩りに来た青年たち。店の注文を自分たちに都合よく理解する。", "portraits": [{"src": "assets/restaurant-face-gentlemen.webp", "label": "店に入る前", "alt": "二人の紳士（しんし）の作品イメージ", "width": 500, "height": 500}]}, {"name": "山猫軒（やまねこけん）の奥の声", "role": "二人を奥へ誘い、料理の準備を進める存在。", "portraits": [{"src": "assets/restaurant-face-voices.webp", "label": "姿は不明", "alt": "山猫軒（やまねこけん）の奥の声の作品イメージ", "width": 500, "height": 500}]}, {"name": "二匹の犬", "role": "店の奥へ飛び込み、危機の場面を変える。", "portraits": [{"src": "assets/restaurant-face-dogs.webp", "label": "", "alt": "二匹の犬の作品イメージ", "width": 500, "height": 500}]}], "characterGalleryNote": "『料理店』の奥の声は、姿が詳しく書かれていないため、鍵穴の目を手がかりに表しています。", "headerCaption": "山奥で見つけた西洋料理店「山猫軒」。空腹の二人は、ここで食事ができると思って入ろうとします。", "inlineIllustrations": [{"afterParagraph": 1, "src": "assets/restaurant-entrance-scene.webp", "alt": "山奥で見つけた西洋料理店「山猫軒」。空腹の二人は、ここで食事ができると思って入ろうとします。", "caption": "山奥で見つけた西洋料理店「山猫軒」。空腹の二人は、ここで食事ができると思って入ろうとします。", "width": 1200, "height": 800}, {"afterParagraph": 3, "src": "assets/restaurant-realization-scene.webp", "alt": "塩を体にもみ込むよう求められ、二人は自分たちが料理される側だと気づきます。", "caption": "塩を体にもみ込むよう求められ、二人は自分たちが料理される側だと気づきます。", "width": 1200, "height": 800}, {"afterParagraph": 4, "src": "assets/restaurant-dogs-arrival-scene.webp", "alt": "戻ってきた二匹の犬が、奥の扉へ飛び込みます。そのあと料理店は消え、二人は山の草の中に立っていました。", "caption": "戻ってきた二匹の犬が、奥の扉へ飛び込みます。そのあと料理店は消え、二人は山の草の中に立っていました。", "width": 1200, "height": 800}]}, {"id": "gongitsune", "cat": "literature", "name": "ごん狐", "sub": "新美南吉｜1932年発表", "motif": "fox", "gist": "いたずらを悔いた狐は、名乗らずに贈り物を届け続けた。思いが相手へ届くまでのすれ違いを描く物語。", "intro": "ひとりぼっちの小狐ごんは、村の人にいたずらをして暮らしている。ある日、兵十が川で捕った魚を逃がし、うなぎを持ち去ってしまった。しばらくして兵十の母の葬式を見たごんは、自分のしたことが気になり始める。", "synopsisSummary": ["村の近くに住む小狐のごんは、ひとりぼっちで、いたずらばかりしていた。ある日、兵十が川で捕った魚を逃がし、うなぎも持ち去る。", "やがて兵十の母の葬式を見たごんは、あのうなぎは病気の母に食べさせるものだったのではないかと思い、後悔する。自分と同じひとりぼっちになった兵十のために、ごんは償いを始める。最初は魚屋から盗んだいわしを家に入れるが、兵十は盗人と思われて殴られてしまう。その後、ごんは栗や松たけを届けるようになる。", "贈り主を知らない兵十は、加助から神様のしわざだと言われる。話を聞いたごんは、自分に礼を言ってもらえないことを面白くないと感じる。ある日、栗を持って家に入ったごんを見た兵十は、またいたずらに来たと思い、火縄銃で撃つ。土間に置かれた栗を見て初めて贈り主に気づいた兵十が問いかけると、ごんは目をつぶったままうなずく。銃口から青い煙が出る中、物語は終わる。"], "people": [["ごん", "ひとりぼっちの小狐。いたずらを悔い、兵十へ贈り物を届ける。"], ["兵十（ひょうじゅう）", "母を亡くした村人。贈り主がごんだとは知らない。"], ["加助（かすけ）", "不思議な贈り物は神様のしわざではないかと話す村人。"]], "theme": "ごんが知っていることと、兵十が知っていることは異なる。善意があっても、相手がその意図を知らなければ同じようには受け取れない。二人のすれ違いを情報の差から読むと、単にどちらか一方を責めるだけでは捉えきれない悲しさに気づける。", "memory": "何が起きたかに加えて、誰が何を知っていたかをたどる。", "questions": ["それぞれの場面で、ごんだけが知っていること、兵十だけが知っていることを分けてみよう。", "よかれと思った行動が違う意味に受け取られるのは、どんなときだろう。作品にない解決を正解とせず考えてみよう。"], "links": ["hana", "melos", "niimi-nankichi"], "sources": [{"title": "青空文庫「ごん狐」本文", "url": "https://www.aozora.gr.jp/cards/000121/files/628_14895.html"}, {"title": "青空文庫 図書カード（初出：1932年1月）", "url": "https://www.aozora.gr.jp/cards/000121/card628.html"}], "reading": "ごんぎつね", "image": "assets/gongitsune-chestnuts-corrected.webp", "imageAlt": "秋の里にいる狐のごんの作品イメージ", "summaryReadings": {"兵十": {"reading": "ひょうじゅう", "key": "兵十"}, "加助": {"reading": "かすけ", "key": "加助"}}, "primaryCategory": "japanese-literature", "genreLabel": "日本文学", "bodyReadings": {}, "characterGallery": [{"name": "ごん", "role": "ひとりぼっちの小狐。いたずらを悔い、兵十へ贈り物を届ける。", "portraits": [{"src": "assets/gon-face-gon.webp", "label": "", "alt": "ごんの創作イメージ", "width": 500, "height": 500}]}, {"name": "兵十（ひょうじゅう）", "role": "母を亡くした村人。贈り主がごんだとは知らない。", "portraits": [{"src": "assets/gon-face-hyoju.webp", "label": "", "alt": "兵十の創作イメージ", "width": 500, "height": 500}]}, {"name": "加助（かすけ）", "role": "不思議な贈り物は神様のしわざではないかと話す村人。", "portraits": [{"src": "assets/gon-face-kasuke.webp", "label": "", "alt": "加助の創作イメージ", "width": 500, "height": 500}]}], "characterGalleryNote": "", "headerCaption": "兵十に届ける栗を運ぶごん。贈り主が誰なのか、兵十はまだ知りません。", "inlineIllustrations": [{"afterParagraph": 1, "src": "assets/gon-fish-mischief-scene.webp", "alt": "兵十が離れたすきに、ごんはびくの魚を川へ投げ戻します。このいたずらを、後になって悔やみます。", "caption": "兵十が離れたすきに、ごんはびくの魚を川へ投げ戻します。このいたずらを、後になって悔やみます。", "width": 1200, "height": 800}, {"afterParagraph": 2, "src": "assets/gongitsune-chestnuts-corrected.webp", "caption": "兵十に届ける栗を運ぶごん。贈り主が誰なのか、兵十はまだ知りません。", "alt": "兵十に届ける栗を運ぶごん。贈り主が誰なのか、兵十はまだ知りません。", "width": 1200, "height": 800}, {"afterParagraph": 3, "src": "assets/gon-chestnuts-recognition-scene.webp", "alt": "ごんを撃ったあと、土間の栗を見た兵十は、いつも届けてくれたのがごんだったと気づきます。", "caption": "ごんを撃ったあと、土間の栗を見た兵十は、いつも届けてくれたのがごんだったと気づきます。", "width": 1200, "height": 800}]}, {"id": "gloves", "cat": "literature", "name": "手袋を買いに", "sub": "新美南吉｜1943年・没後発表", "motif": "gloves", "gist": "人間を怖がる母に代わり、子狐がひとりで手袋を買いに行く。小さな買い物を通して、思い込みと実際の出会いを描く物語。", "intro": "雪の中で遊んだ子狐は、手が冷たくなってしまう。母狐は手袋を買ってやろうとするが、人間の町へ近づくのが怖い。そこで子狐の片手を人間の子供の手に変え、店では必ずその手を出すよう言い聞かせる。", "synopsisSummary": ["雪で手を冷やした子狐に、母狐は手袋を買おうとする。しかし以前、人間に追われたことを思い出し、町へ進めなくなる。母は子狐の片手を人間の手に変え、二枚の硬貨を持たせる。", "店の戸をたたき、人間の手を差し出して手袋を頼むよう教え、ひとりで送り出す。", "ところが子狐は、戸の隙間から漏れる光に驚き、間違えて狐の手を出してしまう。", "帽子屋は狐だと気づくが、受け取ったお金が本物だと確かめ、手袋を売ってくれる。", "恐ろしい目に遭わなかった子狐は、帰り道で人間の母子の優しい会話を聞き、自分の母が恋しくなる。母狐のもとへ戻った子狐は、狐の手を出しても大丈夫だったと話す。母は驚き、喜びながら、人間は本当にいいものなのかと繰り返しつぶやく。子の体験は、母が抱いていた人間への見方を問い直すきっかけになった。"], "people": [["子狐", "雪遊びで手を冷やし、ひとりで町へ手袋を買いに行く。"], ["母狐", "人間を怖がりながら、子狐に買い物の仕方を教える。"], ["帽子屋", "子狐の差し出した硬貨を確かめ、手袋を売る店の主人。"]], "links": ["gongitsune", "restaurant", "niimi-nankichi"], "sources": [{"title": "青空文庫「手袋を買いに」本文", "url": "https://www.aozora.gr.jp/cards/000121/files/637_13341.html"}, {"title": "青空文庫 図書カード（1943年9月刊の童話集に収録）", "url": "https://www.aozora.gr.jp/cards/000121/card637.html"}, {"title": "東京外国語大学文書館 新美南吉展資料（1933年執筆と1943年発表を区別）", "url": "https://www.tufs.ac.jp/common/archives/pamphlet-niiminankichi.pdf"}], "reading": "てぶくろをかいに", "image": "assets/gloves-silverfox-corrected.webp", "imageAlt": "雪の夜に手袋を買いに行く子狐の作品イメージ", "primaryCategory": "japanese-literature", "genreLabel": "日本文学", "bodyReadings": {}, "characterGallery": [{"name": "子狐", "role": "雪遊びで手を冷やし、ひとりで町へ手袋を買いに行く。", "portraits": [{"src": "assets/gloves-face-cub.webp", "label": "", "alt": "子狐の創作イメージ", "width": 500, "height": 500}]}, {"name": "母狐", "role": "人間を怖がりながら、子狐に買い物の仕方を教える。", "portraits": [{"src": "assets/gloves-face-mother.webp", "label": "", "alt": "母狐の創作イメージ", "width": 500, "height": 500}]}, {"name": "帽子屋", "role": "子狐の差し出した硬貨を確かめ、手袋を売る店の主人。", "portraits": [{"src": "assets/gloves-face-shopkeeper.webp", "label": "", "alt": "帽子屋の創作イメージ", "width": 500, "height": 500}]}], "characterGalleryNote": "原作の親子の銀狐に合わせて毛色を描いています。", "headerCaption": "雪の夜、母狐と別れて一人で町の帽子屋へ来た子狐。", "inlineIllustrations": [{"afterParagraph": 1, "src": "assets/gloves-mother-humanhand-scene.webp", "alt": "母狐は子狐の片手だけを人間の手に変え、二枚のお金を持たせます。店では、その手を出すよう教えました。", "caption": "母狐は子狐の片手だけを人間の手に変え、二枚のお金を持たせます。店では、その手を出すよう教えました。", "width": 1200, "height": 800}, {"afterParagraph": 2, "src": "assets/gloves-silverfox-corrected.webp", "caption": "雪の夜、母狐と別れて一人で町の帽子屋へ来た子狐。", "alt": "雪の夜、母狐と別れて一人で町の帽子屋へ来た子狐。", "width": 1200, "height": 800}, {"afterParagraph": 4, "src": "assets/gloves-kind-sale-scene.webp", "alt": "狐の手だと気づいても、帽子屋は本物のお金を受け取り、子狐に毛糸の手袋を渡します。", "caption": "狐の手だと気づいても、帽子屋は本物のお金を受け取り、子狐に毛糸の手袋を渡します。", "width": 1200, "height": 800}]}, {"id": "goshu", "cat": "literature", "name": "セロ弾きのゴーシュ", "sub": "宮沢賢治｜1934年・没後発表", "motif": "cello", "gist": "楽団で叱られてばかりのセロ奏者の家に、毎晩動物がやって来る。思いがけない相手とのやり取りが、演奏と心を変えていく物語。", "intro": "楽団でセロを弾くゴーシュは、演奏がうまくいかず、楽長に叱られてばかりいる。夜、自宅でも一人で練習を続けていると、三毛猫が訪ねてきた。それを皮切りに、動物たちが次々と彼の家に現れる。", "synopsisSummary": ["ゴーシュは音楽会を前に、楽団で何度も演奏を注意される。", "夜も家で練習していると三毛猫が来て、曲を弾いてほしいと頼む。ゴーシュは腹を立て、激しい曲を弾いて追い返す。次の晩にはかっこうが来る。鳴き声に合わせるうちにその音程に感心するが、最後は怒って追い立ててしまう。その次の晩、狸の子は二本の棒でセロをたたいて拍子を取り、ゴーシュの弦の音が遅れるところを教える。", "続いて野ねずみの母子が訪れ、子の病気を治してほしいと頼む。ゴーシュが子をセロの中に入れて弾くと、子は元気になり、母は喜ぶ。やがて音楽会は成功し、アンコールで一人演奏したゴーシュは、楽長や仲間に認められる。動物との夜を重ねるうちに、演奏は変わっていた。", "帰宅したゴーシュは、かっこうを思い出し、遠くの空に向かって、あのときはすまなかったと語りかける。"], "people": [["ゴーシュ", "楽団でセロを弾く青年。自宅でも練習を続けている。"], ["訪ねてくる動物たち", "三毛猫、かっこう、狸の子、野ねずみの母子。それぞれ用事や願いを持って来る。"], ["楽長と楽団の仲間", "音楽会へ向けてゴーシュと合奏し、演奏を見守る。"]], "links": ["restaurant", "hana", "kenji"], "sources": [{"title": "青空文庫「セロ弾きのゴーシュ」本文", "url": "https://www.aozora.gr.jp/cards/000081/files/470_15407.html"}, {"title": "青空文庫 図書カード", "url": "https://www.aozora.gr.jp/cards/000081/card470.html"}, {"title": "川崎市アートセンター公演公式紹介（1934年発表の記載）", "url": "https://www.artericca-shinyuri.com/program2024/detail/0429-02.php"}], "reading": "セロひきのゴーシュ", "image": "assets/goshu-tanuki-practice-scene-moonless-f1d24a46.webp", "imageAlt": "狸の子は二本の棒で拍子を取り、ゴーシュの演奏に合わせます。", "primaryCategory": "japanese-literature", "genreLabel": "日本文学", "bodyReadings": {}, "characterGallery": [{"name": "ゴーシュ", "role": "楽団でセロを弾く青年。自宅でも練習を続けている。", "portraits": [{"src": "assets/goshu-face-goshu.webp", "label": "", "alt": "ゴーシュの創作イメージ", "width": 500, "height": 500}]}, {"name": "訪ねてくる動物たち", "role": "三毛猫、かっこう、狸の子、野ねずみの母子。それぞれ用事や願いを持って来る。", "portraits": [{"src": "assets/goshu-face-animals.webp", "label": "三毛猫・かっこう・狸の子・野ねずみの母子（別々の晩に訪れる）", "alt": "訪ねてくる動物たちの創作イメージ", "width": 500, "height": 500}]}, {"name": "楽長と楽団の仲間", "role": "音楽会へ向けてゴーシュと合奏し、演奏を見守る。", "portraits": [{"src": "assets/goshu-face-orchestra.webp", "label": "中央：楽長／左右：楽団の仲間の代表", "alt": "楽長と楽団の仲間の創作イメージ", "width": 500, "height": 500}]}], "characterGalleryNote": "動物の一覧は、別々の晩に訪れる相手をまとめて紹介しています。楽団の集合画像は、楽長と仲間の代表的なイメージです。", "headerCaption": "狸の子は二本の棒で拍子を取り、ゴーシュの演奏に合わせます。", "inlineIllustrations": [{"afterParagraph": 1, "src": "assets/goshu-rehearsal-stopped-scene.webp", "alt": "合奏の練習で、楽長に演奏を止められるゴーシュ。音の高さや拍子を、仲間とうまく合わせられません。", "caption": "合奏の練習で、楽長に演奏を止められるゴーシュ。音の高さや拍子を、仲間とうまく合わせられません。", "width": 1200, "height": 800}, {"afterParagraph": 2, "src": "assets/goshu-tanuki-practice-scene-moonless-f1d24a46.webp", "alt": "狸の子は二本の棒で拍子を取り、ゴーシュの演奏に合わせます。", "caption": "狸の子は二本の棒で拍子を取り、ゴーシュの演奏に合わせます。", "width": 1200, "height": 800}, {"afterParagraph": 3, "src": "assets/goshu-encore-performance-scene.webp", "alt": "音楽会のアンコールで、一人でセロを弾くゴーシュ。客席の人々は静かに聴き入り、演奏後には楽長や仲間も腕の上達を認めます。", "caption": "音楽会のアンコールで、一人でセロを弾くゴーシュ。客席の人々は静かに聴き入り、演奏後には楽長や仲間も腕の上達を認めます。", "width": 1200, "height": 800}]}, {"id": "toshishun", "cat": "literature", "name": "杜子春", "sub": "芥川龍之介｜1920年発表", "motif": "mountain", "gist": "お金があれば近づき、なくなると離れていく人々に疲れた青年が、仙人を目指す。厳しい試練の中で、手放せない思いに気づく物語。", "intro": "財産を使い果たした杜子春が、洛陽の町で途方に暮れていると、不思議な老人が声をかけてくる。老人は、ある場所を掘れば黄金が見つかると教える。一夜にして豊かになれる話を聞いた杜子春は、そこへ向かう。", "synopsisSummary": ["杜子春は、老人に黄金のありかを教えられ、大金持ちになる。", "だが浪費して財産を失い、寄りついていた人々も離れていく。老人にもう一度助けられても、同じことを繰り返す。金の有無で態度を変える人々に失望した杜子春は、三度目には金を求めず、老人のような仙人になりたいと願う。老人は鉄冠子と名乗り、どんなことがあっても声を出さないよう命じる。", "杜子春は恐ろしい目に遭い、地獄で責められても黙り続ける。しかし馬の姿にされた父母が打たれ、母が自分の苦しみより息子を気遣う声を聞くと、思わず母を呼ぶ。その瞬間、元の洛陽へ戻っていた。鉄冠子は、杜子春が苦しむ父母を見ても黙っていたなら、杜子春の命を絶つつもりだったと明かす。杜子春が人間らしい正直な暮らしを望むと、家と畑を与えると告げる。"], "people": [["杜子春（とししゅん）", "富を失って人々に失望し、仙人になりたいと願う青年。"], ["鉄冠子（てっかんし）", "老人の姿で現れ、杜子春を助けたあと試練を与える仙人。"], ["杜子春の父母", "試練の中で馬の姿となって現れる。母は責められながらも息子を気遣う。"]], "links": ["akutagawa", "spider", "rashomon"], "sources": [{"title": "青空文庫「杜子春」本文（末尾に1920年7月の初出）", "url": "https://www.aozora.gr.jp/cards/000879/files/43015_17432.html"}, {"title": "青空文庫 図書カード", "url": "https://www.aozora.gr.jp/cards/000879/card43015.html"}], "reading": "とししゅん", "image": "assets/toshishun-mountain-night-scene.webp", "imageAlt": "山へ来た杜子春に、鉄冠子は何が起きても声を出さないよう告げます。", "bodyReadings": {"鉄冠子": "てっかんし", "洛陽": "らくよう"}, "summaryReadings": {"杜子春": {"reading": "とししゅん", "key": "杜子春"}, "鉄冠子": {"reading": "てっかんし", "key": "鉄冠子"}}, "primaryCategory": "japanese-literature", "genreLabel": "日本文学", "characterGallery": [{"name": "杜子春（とししゅん）", "role": "富を失って人々に失望し、仙人になりたいと願う青年。", "portraits": [{"src": "assets/toshishun-face-toshishun.webp", "label": "", "alt": "杜子春（とししゅん）の創作イメージ", "width": 500, "height": 500}]}, {"name": "鉄冠子（てっかんし）", "role": "老人の姿で現れ、杜子春を助けたあと試練を与える仙人。", "portraits": [{"src": "assets/toshishun-face-tekkan.webp", "label": "", "alt": "鉄冠子（てっかんし）の創作イメージ", "width": 500, "height": 500}]}, {"name": "杜子春の父母", "role": "試練の中で馬の姿となって現れる。母は責められながらも息子を気遣う。", "portraits": [{"src": "assets/toshishun-face-parents.webp", "label": "左：父／右：母（生前を想像した姿）", "alt": "杜子春の父母の創作イメージ", "width": 500, "height": 500}]}], "characterGalleryNote": "父母の人物画像は、生前の姿を想像したものです。物語の試練では馬の姿で現れます。", "headerCaption": "山へ来た杜子春に、鉄冠子は何が起きても声を出さないよう告げます。", "inlineIllustrations": [{"afterParagraph": 1, "src": "assets/toshishun-gold-discovery-scene.webp", "alt": "老人の言葉を信じ、杜子春は夜中に地面を掘ります。そこから大量の黄金が見つかります。", "caption": "老人の言葉を信じ、杜子春は夜中に地面を掘ります。そこから大量の黄金が見つかります。", "width": 1200, "height": 800}, {"afterParagraph": 2, "src": "assets/toshishun-mountain-night-scene.webp", "alt": "山へ来た杜子春に、鉄冠子は何が起きても声を出さないよう告げます。", "caption": "山へ来た杜子春に、鉄冠子は何が起きても声を出さないよう告げます。", "width": 1200, "height": 800}, {"afterParagraph": 3, "src": "assets/toshishun-return-rakuyo-scene.webp", "alt": "母を呼んだ杜子春は、洛陽の門の下へ戻ります。鉄冠子と話し、人間らしく正直に暮らそうと決めます。", "caption": "母を呼んだ杜子春は、洛陽の門の下へ戻ります。鉄冠子と話し、人間らしく正直に暮らそうと決めます。", "width": 1200, "height": 800}]}, {"id":"yodaka","cat":"literature","name":"よだかの星","reading":"よだかのほし","sub":"宮沢賢治｜1934年・没後発表","motif":"starbird","gist":"見た目や名前を理由に追い詰められた鳥が、空の向こうに居場所を求める。孤独と、生きることの苦しさを描く物語。","intro":"よだかは、見た目を理由にほかの鳥から嫌われている。ある日、鷹から名前を変えろと脅され、従わなければ命まで奪うと言われる。自分が虫を食べて生きていることにも苦しむよだかは、遠い空を見上げる。","synopsisSummary":["よだかは、見た目のために鳥たちから嫌われ、鷹には名前を変えなければ殺すと脅される。","夜空で虫を捕らえるよだかは、自分もほかの命を奪っていることに気づき、苦しくなる。弟のかわせみに遠くへ行くと告げ、引き留められながらも別れる。そして太陽に、自分を連れていってほしいと頼むが、夜の鳥なのだから星に頼むよう言われる。","夜になり、よだかは星々に呼びかける。しかし返事をもらえなかったり、冷たく断られたりして、どこにも迎え入れてもらえない。","それでも何度も羽ばたき、息を切らしながら高い空へ昇っていく。力を使い果たしたその体は、やがて青く美しい光となる。よだかは星となって燃え続ける。"],"people":[["よだか","見た目や名前を理由に責められ、居場所を求める鳥。"],["鷹（たか）","自分と似た名前を使うなと、よだかを脅す鳥。"],["かわせみ","よだかの弟。別れを告げる兄を引き留める。"],["太陽・星々","よだかが、連れていってほしいと呼びかける相手。"]],"links":["goshu","restaurant","kenji"],"sources":[{"title":"青空文庫「よだかの星」本文","url":"https://www.aozora.gr.jp/cards/000081/files/473_42318.html"},{"title":"青空文庫 図書カード","url":"https://www.aozora.gr.jp/cards/000081/card473.html"},{"title":"国立音楽大学図書館 展示資料（1934年発表の確認・PDF）","url":"https://www.lib.kunitachi.ac.jp/wp-content/uploads/2024/01/tenji1012.pdf"}],"image":"assets/yodaka.webp","imageAlt":"よだかは夜空を飛び、星々に自分を連れていってほしいと呼びかけます。","summaryReadings":{"鷹":{"reading":"たか","key":"鷹"}},"primaryCategory":"japanese-literature","genreLabel":"日本文学","bodyReadings":{"追い詰め":"おいつめ"},"characterGallery":[{"name":"よだか","role":"見た目や名前を理由に責められ、居場所を求める鳥。","portraits":[{"src":"assets/yodaka-face-yodaka.webp","label":"","alt":"よだかの作品イメージ","width":500,"height":500}]},{"name":"鷹（たか）","role":"自分と似た名前を使うなと、よだかを脅す鳥。","portraits":[{"src":"assets/yodaka-face-hawk.webp","label":"","alt":"鷹（たか）の作品イメージ","width":500,"height":500}]},{"name":"かわせみ","role":"よだかの弟。別れを告げる兄を引き留める。","portraits":[{"src":"assets/yodaka-face-kingfisher.webp","label":"","alt":"かわせみの作品イメージ","width":500,"height":500}]},{"name":"太陽・星々","role":"よだかが、連れていってほしいと呼びかける相手。","portraits":[{"src":"assets/yodaka-face-sun-stars.webp","label":"昼と夜のイメージ","alt":"太陽・星々の作品イメージ","width":500,"height":500}]}],"characterGalleryNote":"太陽と星々は、昼と夜によだかが呼びかける相手です。","headerCaption":"よだかは夜空を飛び、星々に自分を連れていってほしいと呼びかけます。","inlineIllustrations":[{"afterParagraph":1,"src":"assets/yodaka-hawk-demand-scene.webp","alt":"鷹はよだかのすみかへ来て、名前を変えるよう迫ります。よだかは、自分が勝手につけた名前ではないと訴えます。","caption":"鷹はよだかのすみかへ来て、名前を変えるよう迫ります。よだかは、自分が勝手につけた名前ではないと訴えます。","width":1200,"height":800},{"afterParagraph":3,"src":"assets/yodaka.webp","alt":"よだかは夜空を飛び、星々に自分を連れていってほしいと呼びかけます。","caption":"よだかは夜空を飛び、星々に自分を連れていってほしいと呼びかけます。","width":1200,"height":800},{"afterParagraph":4,"src":"assets/yodaka-blue-star-ending-scene.webp","alt":"物語の終わりで、よだかは青い光の星になります。天の川を背に、その光は燃え続けます。","caption":"物語の終わりで、よだかは青い光の星になります。天の川を背に、その光は燃え続けます。","width":1200,"height":800}]}, {"id": "trolley", "cat": "literature", "name": "トロッコ", "reading": "トロッコ", "sub": "芥川龍之介｜1922年発表", "motif": "railcart", "gist": "憧れのトロッコで遠くへ来た少年は、帰り道を一人で走ることになる。楽しさが心細さへ変わる一日を描く物語。", "intro": "八歳の良平は、鉄道工事で使うトロッコに夢中だ。大人が車を押し、乗って走っていく姿を見て、自分も乗りたいと思っている。ある日、二人の若い作業員に頼んで車を押す手伝いを始めると、道は村から遠くへ続いていた。", "synopsisSummary": ["八歳の良平は、村の近くの鉄道工事で使うトロッコに憧れている。弟たちと勝手に動かして叱られたあとも、乗りたい気持ちは消えない。ある日、若い二人の作業員に車を押す手伝いを申し出る。", "下り坂では一緒に乗せてもらい、良平は夢がかなったように喜ぶ。しかし竹やぶや畑を通り、家から離れるほど、帰りが気になり始める。作業員たちが休んだり買い物をしたりしても、良平はなかなか帰りたいと言えない。", "やがて作業員たちは、今日は出先に泊まるので、もう一人で帰るよう告げる。良平は急に心細くなり、暗くなりかけた長い道を必死で走る。", "ようやく家の門口へ着くと、大声で泣き出す。", "その後、大人になった良平は東京で校正の仕事をしているが、今も時折、あの日の薄暗い道と心細さを思い出す。"], "people": [["良平（りょうへい）", "トロッコに憧れる八歳の少年。"], ["二人の作業員", "良平に車を押す手伝いをさせ、途中では一緒に乗せる。"], ["良平の弟・家族", "弟は良平と一緒にトロッコを動かす。父母は、帰宅して泣き出した良平のもとに集まる。"]], "links": ["akutagawa", "hana"], "sources": [{"title": "青空文庫「トロッコ」本文", "url": "https://www.aozora.gr.jp/cards/000879/files/43016_16836.html"}, {"title": "青空文庫 図書カード（新字新仮名）", "url": "https://www.aozora.gr.jp/cards/000879/card43016.html"}, {"title": "青空文庫 別版図書カード（初出：1922年3月『大観』）", "url": "https://www.aozora.gr.jp/cards/000879/card169.html"}], "image": "assets/trolley-sleepers-scene.webp", "imageAlt": "良平は若い二人の作業員に頼み、枕木を積んだトロッコを一緒に押し始めます。", "summaryReadings": {"良平": {"reading": "りょうへい", "key": "良平"}}, "primaryCategory": "japanese-literature", "genreLabel": "日本文学", "bodyReadings": {}, "characterGallery": [{"name": "良平（りょうへい）", "role": "トロッコに憧れる八歳の少年。", "portraits": [{"src": "assets/trolley-face-ryohei.webp", "label": "", "alt": "良平（りょうへい）の作品イメージ", "width": 500, "height": 500}]}, {"name": "二人の作業員", "role": "良平に車を押す手伝いをさせ、途中では一緒に乗せる。", "portraits": [{"src": "assets/trolley-face-workers.webp", "label": "", "alt": "二人の作業員の作品イメージ", "width": 500, "height": 500}]}, {"name": "良平の弟・家族", "role": "弟は良平と一緒にトロッコを動かす。父母は、帰宅して泣き出した良平のもとに集まる。", "portraits": [{"src": "assets/trolley-face-parents.webp", "label": "左：父／右：母", "alt": "良平の父と母の創作イメージ", "width": 500, "height": 500}]}], "characterGalleryNote": "家族欄の画像には、良平の父と母を描いています。", "headerCaption": "良平は若い二人の作業員に頼み、枕木を積んだトロッコを一緒に押し始めます。", "inlineIllustrations": [{"afterParagraph": 1, "src": "assets/trolley-sleepers-scene.webp", "alt": "良平は若い二人の作業員に頼み、枕木を積んだトロッコを一緒に押し始めます。", "caption": "良平は若い二人の作業員に頼み、枕木を積んだトロッコを一緒に押し始めます。", "width": 1200, "height": 800}, {"afterParagraph": 3, "src": "assets/trolley-lonely-return-scene.webp", "alt": "一人で帰ることになった良平は、暮れていく道を家へ向かって走ります。", "caption": "一人で帰ることになった良平は、暮れていく道を家へ向かって走ります。", "width": 1200, "height": 800}, {"afterParagraph": 4, "src": "assets/trolley-home-doorway-scene.webp", "alt": "家の門口にたどり着いた良平は、こらえていた涙を流します。父と母がそばへ集まり、母は良平の体を支えようとします。", "caption": "家の門口にたどり着いた良平は、こらえていた涙を流します。父と母がそばへ集まり、母は良平の体を支えようとします。", "width": 1200, "height": 800}]}, {"id": "lamp", "cat": "literature", "name": "おじいさんのランプ", "reading": "おじいさんのランプ", "sub": "新美南吉｜1942年・同名童話集収録", "motif": "oldlamp", "gist": "ランプで暮らしを築いた男は、電灯の時代を受け入れられずにいた。大切な仕事と別れ、次の道を選ぶ物語。", "intro": "東一が見つけた古いランプを見て、祖父は昔の話を始める。身寄りのなかった少年・巳之助は、ランプの明るさに魅せられ、村で売り歩いて暮らしを築いた。ところが町に電灯が現れ、村にも電気を引く話が持ち上がる。", "synopsisSummary": ["孫の東一が見つけたランプをきっかけに、祖父が若いころを語る。話に登場する巳之助は、この祖父の若いころの名前である。", "身寄りのない巳之助は、町で見たランプの明るさに驚き、村で売る仕事を始める。", "商売は暮らしを支え、家族も持つようになる。しかし電灯が広がり、村にも電気を引くことになると、仕事を失う不安から強く反対する。ついには区長を恨み、その家に火をつけようと考える。", "ところが持ち出した古い火打ち道具では、思うように火がつかない。不便さに腹を立てた巳之助は、自分も古い道具にしがみついていたのだと気づき、放火を思いとどまる。池のほとりでランプに火をともして別れを惜しみ、石で三つを割るが、涙が出て続けられない。", "その後は本屋になる。祖父は、ランプを売る方法もあったと処分を振り返りながら、仕事を変えた決断について孫に語る。"], "people": [["巳之助（みのすけ）", "ランプを売って暮らしを築く男。東一の祖父の若いころ。"], ["東一（とういち）", "古いランプを見つけ、祖父から昔の話を聞く孫。"], ["区長（くちょう）", "電気を引くかどうか決める村会で、議長を務めた人。巳之助から恨まれる。"]], "links": ["gloves", "gongitsune", "niimi-nankichi"], "sources": [{"title": "青空文庫「おじいさんのランプ」本文", "url": "https://www.aozora.gr.jp/cards/000121/files/635_14853.html"}, {"title": "青空文庫 図書カード（1942年10月刊『おぢいさんのランプ』収録）", "url": "https://www.aozora.gr.jp/cards/000121/card635.html"}], "image": "assets/lamp-bamboo-frame-scene.webp", "imageAlt": "古いランプをきっかけに、祖父は自分の若いころの話を始めます。", "bodyReadings": {"巳之助": "みのすけ"}, "summaryReadings": {"巳之助": {"reading": "みのすけ", "key": "巳之助"}, "東一": {"reading": "とういち", "key": "東一"}, "区長": {"reading": "くちょう", "key": "区長"}}, "primaryCategory": "japanese-literature", "genreLabel": "日本文学", "characterGallery": [{"name": "巳之助（みのすけ）", "role": "ランプを売って暮らしを築く男。東一の祖父の若いころ。", "portraits": [{"src": "assets/lamp-face-young.webp", "label": "少年のころ", "alt": "巳之助（みのすけ）の創作イメージ：少年のころ（商売を始めるころ）", "width": 500, "height": 500}, {"src": "assets/lamp-face-grandfather.webp", "label": "祖父になったころ", "alt": "巳之助（みのすけ）の創作イメージ：東一の祖父となった巳之助", "width": 500, "height": 500}]}, {"name": "東一（とういち）", "role": "古いランプを見つけ、祖父から昔の話を聞く孫。", "portraits": [{"src": "assets/lamp-face-toichi.webp", "label": "", "alt": "東一（とういち）の創作イメージ", "width": 500, "height": 500}]}, {"name": "区長（くちょう）", "role": "電気を引くかどうか決める村会で、議長を務めた人。巳之助から恨まれる。", "portraits": [{"src": "assets/lamp-face-headman.webp", "label": "", "alt": "区長（くちょう）の創作イメージ", "width": 500, "height": 500}]}], "characterGalleryNote": "少年の巳之助と東一の祖父は同じ人物で、ランプの商売を続けるうちに大人になります。祖父の場面は、孫に話す祖父の姿に視点を絞っています。", "headerCaption": "古いランプをきっかけに、祖父は自分の若いころの話を始めます。", "inlineIllustrations": [{"afterParagraph": 1, "src": "assets/lamp-bamboo-frame-scene.webp", "alt": "古いランプをきっかけに、祖父は自分の若いころの話を始めます。", "caption": "古いランプをきっかけに、祖父は自分の若いころの話を始めます。", "width": 1200, "height": 800}, {"afterParagraph": 2, "src": "assets/lamp-first-brightness-scene.webp", "alt": "十三歳の巳之助は、町の店先のランプに見とれます。この明るさを、暗い村にも届けたいと思うようになります。", "caption": "十三歳の巳之助は、町の店先のランプに見とれます。この明るさを、暗い村にも届けたいと思うようになります。", "width": 1200, "height": 800}, {"afterParagraph": 4, "src": "assets/lamp-farewell-lights-scene.webp", "alt": "仕事を変えると決めた巳之助は、池のほとりにともしたランプを見つめ、長く親しんだ灯との別れを惜しみます。", "caption": "仕事を変えると決めた巳之助は、池のほとりにともしたランプを見つめ、長く親しんだ灯との別れを惜しみます。", "width": 1200, "height": 800}]}, {"id": "ginga", "cat": "literature", "name": "銀河鉄道の夜", "reading": "ぎんがてつどうのよる", "sub": "宮沢賢治｜1934年・没後発表", "motif": "starrail", "textNote": "青空文庫の新潮文庫底本版に基づきます。未定稿の作品で、版によって本文に異同があります。", "gist": "祭りの夜、孤独な少年が友人と銀河を旅する。美しい景色と出会いの先で、別れと、人の幸せを考える物語。", "intro": "家計を助けて働くジョバンニは、学校でからかわれ、寂しさを抱えている。祭りの夜、病気の母のために牛乳を取りに出かけ、一人で丘へ上がる。すると、いつの間にか銀河を走る列車の中にいて、前の席には友人のカムパネルラが座っていた。", "synopsisSummary": ["ジョバンニは、病気の母と暮らし、学校へ通いながら働いている。父は長く家を空け、級友には父のことをからかわれていた。", "祭りの夜、母に届ける牛乳を求めて出かけたあと、一人で丘へ上がる。気づくと銀河を走る列車にいて、前の席には友人のカムパネルラが座っている。二人は光る川や化石の発掘場所を眺めながら、不思議な旅を始める。ジョバンニは、友人とこのままずっと一緒にいたいと願う。", "列車では、鳥を捕る男や、沈んだ船に乗っていた姉弟と青年に出会う。車内で聞くのは、他の生き物を食べて生きてきた蠍が、自分の命も誰かの役に立てたいと願い、夜を照らす火になった話だ。ジョバンニは、人のために生きることや、本当の幸せについて考える。姉弟たちが南十字で降り、再び二人きりになる。しかしカムパネルラは、遠くに母がいると言ったあと、突然姿を消してしまう。", "丘で目を覚ましたジョバンニは、牛乳を受け取って町へ戻ると、川で騒ぎが起きていた。そこでは、カムパネルラを捜す人たちが集まっていた。カムパネルラは、川に落ちたザネリを助けたあと、自分は戻らなかったのだ。カムパネルラの父は、時間がたちすぎたため息子の生存を諦めている。さらにカムパネルラの父は、ジョバンニの父から元気な便りがあり、間もなく帰るはずだと話す。それを聞いたジョバンニは、牛乳とその知らせを母へ届けようと走り出す。友人と二人で旅をした夜のあと、ジョバンニは一人で、母の待つ現実の暮らしへ戻っていく。"], "people": [["ジョバンニ", "母のために働きながら学校へ通う少年。銀河を旅する。"], ["カムパネルラ", "ジョバンニの友人。列車の前の席に現れる。"], ["ザネリ", "ジョバンニをからかう級友。祭りの夜に川へ落ちる。"], ["鳥捕り（とりとり）", "列車の中で出会う、鳥を捕る仕事の男。"], ["姉弟と青年", "沈んだ船に乗っていた人たち。列車で二人と出会う。"], ["ジョバンニの母", "病気で家にいる母。息子は牛乳を届けようとする。"]], "links": ["yodaka", "goshu", "kenji"], "sources": [{"title": "青空文庫「銀河鉄道の夜」本文（新潮文庫底本版）", "url": "https://www.aozora.gr.jp/cards/000081/files/456_15050.html"}, {"title": "青空文庫 図書カード（未定稿・1934年初出の確認）", "url": "https://www.aozora.gr.jp/cards/000081/card456.html"}, {"title": "青空文庫「銀河鉄道の夜」底本による異同", "url": "https://www.aozora.gr.jp/cards/000081/gingatetsudo_difference"}], "image": "assets/ginga-train-facing.webp", "imageAlt": "銀河の列車の向かい合う席で旅をするジョバンニとカムパネルラ", "bodyReadings": {"蠍": "さそり", "銀": "ぎん", "銀河": "ぎんが"}, "primaryCategory": "japanese-literature", "genreLabel": "日本文学", "sourceNote": " 途中の蠍の火の絵は、車内で語られる話のイメージです。実際の星の位置を示す図ではありません。", "inlineIllustrations": [{"afterParagraph": 1, "src": "assets/ginga-printing-scene.webp", "alt": "学校のあと、ジョバンニは印刷所で、小さな文字の部品を一つずつ拾う仕事をしています。", "caption": "学校のあと、ジョバンニは印刷所で、小さな文字の部品を一つずつ拾う仕事をしています。", "width": 1200, "height": 800}, {"afterParagraph": 2, "src": "assets/ginga-train-facing.webp", "caption": "銀河の列車で旅をするジョバンニと友人カムパネルラ。", "width": 1200, "height": 800, "alt": "銀河の列車の向かい合う席で旅をするジョバンニとカムパネルラ"}, {"afterParagraph": 3, "src": "assets/ginga-scorpion-scene.webp", "alt": "暗い夜を照らす、蠍の形をした光のイメージ", "caption": "車内で語られる、夜を照らす蠍の火のイメージ。", "width": 1200, "height": 800}, {"afterParagraph": 4, "src": "assets/ginga-river-scene.webp", "alt": "川原でジョバンニに話すのは、カムパネルラの父です。ジョバンニの父から元気な便りがあったと伝えます。", "caption": "川原でジョバンニに話すのは、カムパネルラの父です。ジョバンニの父から元気な便りがあったと伝えます。", "width": 1200, "height": 800}], "headerCaption": "銀河の列車で旅をするジョバンニと友人カムパネルラ。", "characterGallery": [{"name": "ジョバンニ", "role": "母のために働きながら学校へ通う少年。銀河を旅する。", "portraits": [{"src": "assets/ginga-face-giovanni.webp", "label": "", "alt": "ジョバンニの創作イメージ", "width": 500, "height": 500}]}, {"name": "カムパネルラ", "role": "ジョバンニの友人。列車の前の席に現れる。", "portraits": [{"src": "assets/ginga-face-campanella.webp", "label": "", "alt": "友人のカムパネルラの創作イメージ", "width": 500, "height": 500}]}, {"name": "ザネリ", "role": "ジョバンニをからかう級友。祭りの夜に川へ落ちる。", "portraits": [{"src": "assets/ginga-face-zanelli.webp", "label": "", "alt": "級友のザネリの創作イメージ", "width": 500, "height": 500}]}, {"name": "鳥捕り（とりとり）", "role": "列車の中で出会う、鳥を捕る仕事の男。", "portraits": [{"src": "assets/ginga-face-birdcatcher.webp", "label": "", "alt": "鳥を捕る仕事の男の創作イメージ", "width": 500, "height": 500}]}, {"name": "姉弟と青年", "role": "沈んだ船に乗っていた人たち。列車で二人と出会う。", "portraits": [{"src": "assets/ginga-face-children-tutor.webp", "label": "左は姉、中央は家庭教師の青年、右は弟", "alt": "姉・弟・家庭教師の青年の創作イメージ", "width": 500, "height": 500}]}, {"name": "ジョバンニの母", "role": "病気で家にいる母。息子は牛乳を届けようとする。", "portraits": [{"src": "assets/ginga-face-mother.webp", "label": "", "alt": "ジョバンニの母の創作イメージ", "width": 500, "height": 500}]}], "characterGalleryNote": "姉弟と一緒にいる青年は家庭教師で、二人の父や兄ではありません。"}, {"id": "botchan", "cat": "literature", "name": "坊っちゃん", "reading": "ぼっちゃん", "sub": "夏目漱石｜1906年発表", "motif": "classroom", "gist": "曲がったことが嫌いな青年が、四国の学校で人間関係にぶつかる。勢いのよい語りの奥に、不器用な正直さと人への愛着がある物語。", "intro": "子供のころから無鉄砲で、家族にも持て余されてきた青年。家の奉公人・清だけは、彼を大切にしてくれた。学校を出た青年は、四国の中学校へ数学教師として赴任する。ところが、生徒のいたずらや、同僚たちの腹の読めない言動に振り回される。", "synopsisSummary": ["無鉄砲な性格の主人公は、子供のころから騒ぎを起こし、家族からは持て余されていた。それでも家の奉公人・清は、彼の正直さを信じて大切にする。両親を失い、兄から受け取った金で物理学校へ進んだ主人公は、卒業後、四国の中学校の数学教師になる。", "生徒には食事や温泉での行動をからかわれ、宿直でもいたずらをされる。彼は同僚に山嵐、赤シャツ、うらなり、野だいこなどのあだ名を付け、学校の人間関係を自分なりに見ていく。", "初めは教頭の赤シャツの言葉を信じ、率直な数学教師・山嵐を疑う。しかし次第に誤解が解け、山嵐と親しくなる。一方、おとなしい英語教師・うらなりの婚約相手と赤シャツの関係や、うらなりの遠方への転任を知り、赤シャツへの不信を深める。祝勝会の日、主人公と山嵐は生徒のけんかを止めに入って巻き込まれるが、新聞では騒ぎを起こした側のように書かれてしまう。", "山嵐だけが辞職を求められ、二人は赤シャツたちに仕返しをしようと決める。宿から朝帰りする赤シャツと野だいこを待ち伏せして殴り、主人公も辞表を出して学校を去る。", "東京へ戻った主人公は、清と暮らし、街鉄の技手として働く。", "やがて清は肺炎で亡くなる。主人公は、彼女の願いどおり、自分の家の寺に葬ったと語って物語を閉じる。"], "people": [["坊っちゃん（ぼっちゃん）", "本名を明かさない語り手。四国の中学校へ赴任する若い数学教師。"], ["清（きよ）", "幼いころから主人公を信じ、大切にした家の奉公人。"], ["山嵐（やまあらし）", "数学教師の堀田（ほった）。率直な性格で、主人公と親しくなる。"], ["赤シャツ（あかシャツ）", "学校の教頭。柔らかな言葉遣いとは裏腹に、主人公の不信を招く。"], ["うらなり", "英語教師の古賀（こが）。おとなしい性格で、遠くへ転任する。"], ["野だいこ", "画学教師。赤シャツと行動を共にする。"], ["狸（たぬき）", "学校の校長に主人公が付けたあだ名。"]], "links": ["trolley", "hana", "soseki"], "sources": [{"title": "青空文庫「坊っちゃん」本文", "url": "https://www.aozora.gr.jp/cards/000148/files/752_14964.html"}, {"title": "青空文庫 図書カード（初出：1906年4月『ホトトギス』）", "url": "https://www.aozora.gr.jp/cards/000148/card752.html"}], "image": "assets/botchan.webp", "imageAlt": "四国の中学校で、数学を教えることになった坊っちゃん。", "summaryReadings": {"清": {"reading": "きよ", "key": "清"}, "山嵐": {"reading": "やまあらし", "key": "山嵐"}, "赤シャツ": {"reading": "あかシャツ", "key": "赤シャツ"}}, "primaryCategory": "japanese-literature", "genreLabel": "日本文学", "bodyReadings": {}, "characterGallery": [{"name": "坊っちゃん（ぼっちゃん）", "role": "本名を明かさない語り手。四国の中学校へ赴任する若い数学教師。", "portraits": [{"src": "assets/botchan-face-botchan.webp", "label": "", "alt": "坊っちゃん（ぼっちゃん）の創作イメージ", "width": 500, "height": 500}]}, {"name": "清（きよ）", "role": "幼いころから主人公を信じ、大切にした家の奉公人。", "portraits": [{"src": "assets/botchan-face-kiyo.webp", "label": "", "alt": "清（きよ）の創作イメージ", "width": 500, "height": 500}]}, {"name": "山嵐（やまあらし）", "role": "数学教師の堀田（ほった）。率直な性格で、主人公と親しくなる。", "portraits": [{"src": "assets/botchan-face-yamaarashi.webp", "label": "", "alt": "山嵐（やまあらし）の創作イメージ", "width": 500, "height": 500}]}, {"name": "赤シャツ（あかシャツ）", "role": "学校の教頭。柔らかな言葉遣いとは裏腹に、主人公の不信を招く。", "portraits": [{"src": "assets/botchan-face-redshirt.webp", "label": "", "alt": "赤シャツ（あかシャツ）の創作イメージ", "width": 500, "height": 500}]}, {"name": "うらなり", "role": "英語教師の古賀（こが）。おとなしい性格で、遠くへ転任する。", "portraits": [{"src": "assets/botchan-face-uranari.webp", "label": "", "alt": "うらなりの創作イメージ", "width": 500, "height": 500}]}, {"name": "野だいこ", "role": "画学教師。赤シャツと行動を共にする。", "portraits": [{"src": "assets/botchan-face-nodaiko.webp", "label": "", "alt": "野だいこの創作イメージ", "width": 500, "height": 500}]}, {"name": "狸（たぬき）", "role": "学校の校長に主人公が付けたあだ名。", "portraits": [{"src": "assets/botchan-face-tanuki.webp", "label": "", "alt": "狸（たぬき）の創作イメージ", "width": 500, "height": 500}]}], "characterGalleryNote": "教室の絵は、赴任後の坊っちゃんの教師姿を表しています。", "headerCaption": "四国の中学校で、数学を教えることになった坊っちゃん。", "inlineIllustrations": [{"afterParagraph": 1, "src": "assets/botchan.webp", "alt": "四国の中学校で、数学を教えることになった坊っちゃん。", "caption": "四国の中学校で、数学を教えることになった坊っちゃん。", "width": 1200, "height": 800}, {"afterParagraph": 2, "src": "assets/botchan-night-duty-scene.webp", "alt": "初めての宿直。坊っちゃんが寝床の毛布を払うと、虫が飛び出します。", "caption": "初めての宿直。坊っちゃんが寝床の毛布を払うと、虫が飛び出します。", "width": 1200, "height": 800}, {"afterParagraph": 5, "src": "assets/botchan-kiyo-reunion-scene.webp", "alt": "東京へ戻った坊っちゃんは、清と再会し、これから一緒に暮らすと話します。", "caption": "東京へ戻った坊っちゃんは、清と再会し、これから一緒に暮らすと話します。", "width": 1200, "height": 800}]}, {"id": "cat", "cat": "literature", "name": "吾輩は猫である", "reading": "わがはいはねこである", "sub": "夏目漱石｜1905–1906年発表", "motif": "classroom", "gist": "名前のない猫が、教師の家で人間たちを観察する。偉そうな言葉と日々の振る舞いの食い違いを、皮肉と笑いで見せる物語。", "intro": "名前もない一匹の猫が、教師の家に住みつく。主人は本を読んだり、気難しく振る舞ったりしているが、猫から見ると立派な人物とも言い切れない。家を訪れる客たちの会話を聞きながら、猫は人間という生き物を観察し始める。", "synopsisSummary": ["名前のない猫は、人間の世界で苦労した末、教師の苦沙弥の家に住みつく。主人は気難しく、胃の調子を気にし、学問や芸術を語る。猫はその姿を眺め、偉そうな言い方をする人間にも、滑稽で頼りないところがあると考える。", "主人の家には、冗談や作り話の得意な迷亭、学問に打ち込む寒月などが訪れ、猫は会話を聞きながら、人間の見栄や思い込みを評していく。", "話は、一つの事件だけを追うのではなく、日々の会話や騒動を重ねて進む。実業家の金田家の娘と寒月との縁談が持ち上がると、相手を調べようとする金田家と苦沙弥たちの間に対立が生まれる。猫も金田家へ出かけ、人間たちの思惑をうかがう。金や肩書きを重んじる人、理屈をこねる人、世間の評判を気にする人。それぞれの言い分を眺める猫自身も、かなり自信たっぷりに語る。", "やがて寒月は故郷の女性と結婚し、金田家の娘にも別の縁談が進む。主人の家では、仲間たちが集まって酒を飲み、話し合う。客が帰ったあと、猫は残ったビールを飲んで酔ってしまう。そして水の入った甕に落ち、はい上がろうとしても出られない。人間を批評してきた猫の語りは、突然訪れた自身の死を迎えるところで終わる。"], "people": [["吾輩（わがはい）", "名前のない猫。教師の家に住み、人間を観察する語り手。"], ["苦沙弥（くしゃみ）", "猫が住みついた家の主人。気難しい教師。"], ["迷亭（めいてい）", "苦沙弥の友人。冗談や作り話を交えて話す。"], ["寒月（かんげつ）", "主人の家へやって来る若い学者。縁談の話題の中心になる。"], ["金田（かねだ）家", "富や世間体を重んじる実業家の家。娘と寒月の縁談をめぐり主人たちと対立する。"]], "links": ["botchan", "hana", "soseki"], "sources": [{"title": "青空文庫「吾輩は猫である」本文", "url": "https://www.aozora.gr.jp/cards/000148/files/789_14547.html"}, {"title": "青空文庫 図書カード（1905–1906年『ホトトギス』初出）", "url": "https://www.aozora.gr.jp/cards/000148/card789.html"}], "image": "assets/cat.webp", "imageAlt": "教師の苦沙弥の家に住みついた猫は、主人の暮らしを観察します。", "bodyReadings": {"苦沙弥": "くしゃみ", "甕": "かめ"}, "sourceNote": "青空文庫の、ちくま文庫『夏目漱石全集1』底本版に基づきます。", "summaryReadings": {"苦沙弥": {"reading": "くしゃみ", "key": "苦沙弥"}, "迷亭": {"reading": "めいてい", "key": "迷亭"}, "寒月": {"reading": "かんげつ", "key": "寒月"}, "金田": {"reading": "かねだ", "key": "金田"}}, "primaryCategory": "japanese-literature", "genreLabel": "日本文学", "characterGallery": [{"name": "吾輩（わがはい）", "role": "名前のない猫。教師の家に住み、人間を観察する語り手。", "portraits": [{"src": "assets/cat-face-cat.webp", "label": "", "alt": "吾輩（わがはい）の創作イメージ", "width": 500, "height": 500}]}, {"name": "苦沙弥（くしゃみ）", "role": "猫が住みついた家の主人。気難しい教師。", "portraits": [{"src": "assets/cat-face-kushami.webp", "label": "", "alt": "苦沙弥（くしゃみ）の創作イメージ", "width": 500, "height": 500}]}, {"name": "迷亭（めいてい）", "role": "苦沙弥の友人。冗談や作り話を交えて話す。", "portraits": [{"src": "assets/cat-face-meitei.webp", "label": "", "alt": "迷亭（めいてい）の創作イメージ", "width": 500, "height": 500}]}, {"name": "寒月（かんげつ）", "role": "主人の家へやって来る若い学者。縁談の話題の中心になる。", "portraits": [{"src": "assets/cat-face-kangetsu.webp", "label": "", "alt": "寒月（かんげつ）の創作イメージ", "width": 500, "height": 500}]}, {"name": "金田（かねだ）家", "role": "富や世間体を重んじる実業家の家。娘と寒月の縁談をめぐり主人たちと対立する。", "portraits": [{"src": "assets/cat-face-kaneda.webp", "label": "左：父／中央：母／右：娘", "alt": "金田（かねだ）家の創作イメージ", "width": 500, "height": 500}]}], "characterGalleryNote": "書斎の絵は、苦沙弥の家に住む猫と主人の関係を表しています。金田家は、父・母・娘を見分けるために組み合わせた代表的なイメージです。", "headerCaption": "教師の苦沙弥の家に住みついた猫は、主人の暮らしを観察します。", "inlineIllustrations": [{"afterParagraph": 1, "src": "assets/cat.webp", "alt": "教師の苦沙弥の家に住みついた猫は、主人の暮らしを観察します。", "caption": "教師の苦沙弥の家に住みついた猫は、主人の暮らしを観察します。", "width": 1200, "height": 800}, {"afterParagraph": 2, "src": "assets/cat-meitei-conversation-scene.webp", "alt": "迷亭は、写生について話したことが作り話だったと明かします。猫は二人のやり取りを聞いています。", "caption": "迷亭は、写生について話したことが作り話だったと明かします。猫は二人のやり取りを聞いています。", "width": 1200, "height": 800}, {"afterParagraph": 3, "src": "assets/cat-kaneda-eavesdrop-scene.webp", "alt": "猫は金田家へ忍び込み、障子の向こうで話す夫婦の声に耳をすませます。", "caption": "猫は金田家へ忍び込み、障子の向こうで話す夫婦の声に耳をすませます。", "width": 1200, "height": 800}]}, {"id": "kokoro", "cat": "literature", "name": "こころ", "reading": "こころ", "sub": "夏目漱石｜1914年発表", "motif": "classroom", "textNote": "青空文庫の集英社文庫底本版に基づきます。要約では登場人物の自死に触れますが、方法の描写はしていません。", "gist": "青年が慕う「先生」は、なぜ孤独を抱え、人を信じきれないのか。一通の長い手紙が、友情と恋、言えなかった過去を明かす物語。", "intro": "学生の「私」は、鎌倉で出会った男性を「先生」と呼び、東京へ戻ってからも訪ねるようになる。先生には妻がいるが、どこか寂しげで、人を深く信じようとしない。毎月、友人の墓へ通う先生は、自分の過去をなかなか語らない。", "synopsisSummary": ["物語の初めに語る「私」は、若い学生です。鎌倉で出会った年上の男性を「先生」と呼んで慕い、東京へ戻ってからも家を訪ねます。先生は妻の静と暮らしていますが、人を深く信じようとせず、毎月一人で友人の墓へ通います。親しくなっても、先生は自分の過去をなかなか話してくれません。", "大学を卒業した「私」は、故郷へ帰って病気の父を看病します。明治天皇が亡くなり、続いて軍人の乃木希典と妻の死も伝わるころ、先生から長い手紙が届きました。手紙の末尾近くに、自らの死を予告する言葉を見つけた「私」は驚きます。命が危ない状態の父を残して東京行きの列車に乗り、先生の手紙を読み始めました。", "ここからは、手紙に書かれた先生の過去です。手紙の中の「私」は、学生ではなく先生本人を指します。若いころ、両親を亡くした先生は、財産を預けた叔父にだまされ、人を信じられなくなりました。その後、ある母娘の家に部屋を借り、娘を好きになります。この下宿の娘が、後に先生の妻になる静です。先生は、生活に困っていた友人のKも同じ家へ呼び寄せます。", "ところがKも、下宿の娘を好きになったと先生に打ち明けます。先生は、自分も娘を愛しているとはKに打ち明けません。先生は、厳しく自分を鍛えて理想を追うKの考え方を利用し、恋に迷うKを責めるような言葉を向けます。そしてKには知らせず、娘の母に結婚を申し込み、認められました。母から婚約を聞いたKは、その後、自ら命を絶ちます。Kが先生に残した手紙には、娘の名前は書かれていません。", "先生は自分の行動を悔やみ、娘と結婚した後も罪悪感を抱え続けます。妻となった静には、Kとの間で何があったのか話せません。先生自身もKの死について考え続け、失恋だけでは説明できないのではないかと思うようになります。学生の「私」が出会ったころ、先生が毎月通っていたのは、このKの墓でした。", "長い年月を経て、手紙は先生がこれを書いている時期の話へ戻ります。明治天皇の死に時代の終わりを感じ、乃木の死にも触れた先生は、自ら命を絶つと決めた経緯を学生の「私」に伝えます。静にはこの過去を知らせないでほしい、と頼んで手紙は終わります。学生が東京へ着いた後や、先生の死を確かめる場面は描かれていません。"], "people": [["私（わたくし）", "先生を慕う若い学生。先生から長い手紙を受け取る。"], ["先生（せんせい）", "本名は明かされない男性。「私」が敬って先生と呼ぶ。過去の出来事を抱えて生きる。"], ["K", "先生の若いころの友人。学問や精神的な理想を重んじる。"], ["静（しず）", "先生の妻。若いころは、先生とKが暮らす下宿の娘だった。"], ["静の母", "下宿を営む女性。先生から娘との結婚を申し込まれる。"], ["私の父", "故郷で病床にいる父。私の帰省後、病状が悪くなる。"]], "links": ["botchan", "ginga", "soseki"], "sources": [{"title": "青空文庫「こころ」本文", "url": "https://www.aozora.gr.jp/cards/000148/files/773_14560.html"}, {"title": "青空文庫 図書カード（初出：1914年4月20日–8月11日『朝日新聞』）", "url": "https://www.aozora.gr.jp/cards/000148/card773.html"}, {"title": "国立国会図書館「近代日本人の肖像」乃木希典（作中の歴史人物の補足）", "url": "https://www.ndl.go.jp/portrait/datas/160"}], "image": "assets/kokoro.webp", "imageAlt": "先生の家を訪ねる学生の「私」。左に先生、右に学生を描いた場面イメージ", "summaryReadings": {"私": {"reading": "わたくし", "key": "私"}, "先生": {"reading": "せんせい", "key": "先生"}}, "primaryCategory": "japanese-literature", "genreLabel": "日本文学", "bodyReadings": {"償う": "つぐなう", "困窮": "こんきゅう", "静": "しず", "叔父": "おじ", "婚約": "こんやく", "罪悪感": "ざいあくかん", "乃木": "のぎ", "下宿": "げしゅく", "遺書": "いしょ", "経緯": "けいい", "乃木希典": "のぎまれすけ", "軍人": "ぐんじん", "財産": "ざいさん", "看病": "かんびょう"}, "inlineIllustrations": [{"afterParagraph": 1, "src": "assets/kokoro.webp", "alt": "先生の家を訪ねる学生の「私」。左に先生、右に学生を描いた場面イメージ", "caption": "左は先生、右は学生の「私」。物語の前半、学生は東京の先生の家を訪ねるようになります。", "width": 1200, "height": 800}, {"afterParagraph": 2, "src": "assets/kokoro-letter-scene.webp", "alt": "東京へ向かう列車で、学生の「私」は先生からの長い手紙を読みます。ここから、先生の過去が語られます。", "caption": "東京へ向かう列車で、学生の「私」は先生からの長い手紙を読みます。ここから、先生の過去が語られます。", "width": 1200, "height": 800}, {"afterParagraph": 4, "src": "assets/kokoro-k-confession-scene.webp", "alt": "先生の若いころ。Kは、下宿の娘への恋を先生に打ち明けます。先生も同じ娘を好きですが、そのことをKには話しません。", "caption": "先生の若いころ。Kは、下宿の娘への恋を先生に打ち明けます。先生も同じ娘を好きですが、そのことをKには話しません。", "width": 1200, "height": 800}, {"afterParagraph": 5, "src": "assets/kokoro-grave-scene.webp", "alt": "先生が一人で通っていたのは、友人Kの墓でした。結婚した後も、先生は自分の行動を悔やみ続けます。", "caption": "先生が一人で通っていたのは、友人Kの墓でした。結婚した後も、先生は自分の行動を悔やみ続けます。", "width": 1200, "height": 800}], "headerCaption": "左は先生、右は学生の「私」。物語の前半、学生は東京の先生の家を訪ねるようになります。", "characterGallery": [{"name": "私（わたくし）", "role": "先生を慕う若い学生。先生から長い手紙を受け取る。", "portraits": [{"src": "assets/kokoro-face-student.webp", "label": "手紙を受け取る学生", "alt": "私（わたくし）の創作イメージ（手紙を受け取る学生）", "width": 500, "height": 500}]}, {"name": "先生（せんせい）", "role": "本名は明かされない男性。「私」が敬って先生と呼ぶ。過去の出来事を抱えて生きる。", "portraits": [{"src": "assets/kokoro-face-sensei-young.webp", "label": "若いころ", "alt": "先生（せんせい）の創作イメージ（若いころ）", "width": 500, "height": 500}, {"src": "assets/kokoro-face-sensei-current.webp", "label": "学生が出会ったころ", "alt": "先生（せんせい）の創作イメージ（学生が出会ったころ）", "width": 500, "height": 500}]}, {"name": "K", "role": "先生の若いころの友人。学問や精神的な理想を重んじる。", "portraits": [{"src": "assets/kokoro-face-k.webp", "label": "先生の友人", "alt": "Kの創作イメージ（先生の友人）", "width": 500, "height": 500}]}, {"name": "静（しず）", "role": "先生の妻。若いころは、先生とKが暮らす下宿の娘だった。", "portraits": [{"src": "assets/kokoro-face-shizu.webp", "label": "現在の妻・静", "alt": "静（しず）の創作イメージ（先生の妻）", "width": 500, "height": 500}]}, {"name": "静の母", "role": "下宿を営む女性。先生から娘との結婚を申し込まれる。", "portraits": [{"src": "assets/kokoro-face-shizu-mother.webp", "label": "先生が若いころの下宿の母", "alt": "静の母の創作イメージ（下宿を営む母）", "width": 500, "height": 500}]}, {"name": "私の父", "role": "故郷で病床にいる父。私の帰省後、病状が悪くなる。", "portraits": [{"src": "assets/kokoro-face-student-father.webp", "label": "学生の「私」の父", "alt": "私の父の創作イメージ（学生の父）", "width": 500, "height": 500}]}], "characterGalleryNote": "先生の若いころと、学生の「私」が出会ったころを分けて示しています。学生の「私」と、先生の手紙の中の「私」は別の人物です。静は、先生とKが暮らした下宿の娘と同じ人です。静の母は先生の過去に登場する姿、学生の父は現在の物語に登場する姿として描いています。"}, {"id":"lemon","cat":"literature","name":"檸檬","reading":"れもん","sub":"梶井基次郎｜1925年発表","motif":"oldlamp","textNote":"青空文庫の旺文社文庫底本版に基づきます。語り手の体験と想像を区別して紹介します。","gist":"重苦しい気分で京都を歩く青年が、一個の檸檬にひかれる。色や香り、冷たさと小さな空想が、世界の見え方を変える物語。","intro":"病気や借金を抱える「私」は、理由のつかめない重苦しさに苦しんでいる。以前好きだった音楽や詩にも心が動かず、京都の町を歩き回る。ある日、果物店に並ぶ檸檬の鮮やかな色が目に留まり、その一つを買い求める。","synopsisSummary":["語り手の「私」は、得体の知れない重苦しさに悩まされている。病気や借金もあるが、それだけでは言い表せない気分だった。以前は楽しめた音楽や詩にもひかれず、京都の裏通りを歩き回る。ある日、果物店で一個の檸檬を買う。手のひらに伝わる冷たさ、黄色い色、香りや重みを味わううちに、重苦しい気分が少しほどけていく。","私は、しばらく避けていた店の丸善（まるぜん）へ入る。しかし店内では再び気が沈み、画集を取り出しては重ねても満たされない。そこで手にしていた檸檬を思い出し、画集を城のように積み直して、その上に置く。鮮やかな黄色と本の取り合わせを眺めた私は、檸檬を置いたまま店を出る。","そして檸檬を爆弾に見立て、丸善が爆発したらと想像して笑みを浮かべ、通りを歩いていく。爆発は頭の中の空想で、現実に起きた出来事ではない。"],"people":[["私","名前を明かさない語り手。重苦しい気分を抱えて京都を歩き、一個の檸檬を買う。"]],"links":["cat","trolley","kajii-motojiro"],"sources":[{"title":"青空文庫「檸檬」本文","url":"https://www.aozora.gr.jp/cards/000074/files/424_19826.html"},{"title":"青空文庫 図書カード（初出：1925年1月『青空』創刊号）","url":"https://www.aozora.gr.jp/cards/000074/card424.html"}],"image":"assets/lemon.webp","imageAlt":"語り手は、積み上げた画集の上に一個の檸檬を置きます。","primaryCategory":"japanese-literature","genreLabel":"日本文学","bodyReadings":{},"characterGallery":[{"name":"私","role":"名前を明かさない語り手。重苦しい気分を抱えて京都を歩き、一個の檸檬を買う。","portraits":[{"src":"assets/lemon-face-narrator.webp","label":"物語の語り手のイメージ","alt":"私の創作イメージ：物語の語り手のイメージ","width":500,"height":500}]}],"characterGalleryNote":"","headerCaption":"語り手は、積み上げた画集の上に一個の檸檬を置きます。","inlineIllustrations":[{"afterParagraph":1,"src":"assets/lemon-cool-fruit-scene.webp","alt":"一個の檸檬の冷たさや香りを味わううちに、語り手の重い気分が少しほどけます。","caption":"一個の檸檬の冷たさや香りを味わううちに、語り手の重い気分が少しほどけます。","width":1200,"height":800},{"afterParagraph":2,"src":"assets/lemon.webp","alt":"語り手は、積み上げた画集の上に一個の檸檬を置きます。","caption":"語り手は、積み上げた画集の上に一個の檸檬を置きます。","width":1200,"height":800},{"afterParagraph":3,"src":"assets/lemon-kyogoku-walk-scene.webp","alt":"檸檬を丸善に残し、語り手は空想に微笑みながら通りを歩きます。爆発は現実の出来事ではありません。","caption":"檸檬を丸善に残し、語り手は空想に微笑みながら通りを歩きます。爆発は現実の出来事ではありません。","width":1200,"height":800}]}, {"id": "sangetsuki", "cat": "literature", "name": "山月記", "reading": "さんげつき", "sub": "中島敦｜1942年発表", "motif": "starbird", "textNote": "青空文庫の新潮文庫底本版に基づきます。李徴が語る自分への見方と、実際に起こる出来事を分けて紹介します。", "gist": "詩人として認められたいと願った男が、虎の姿となって旧友に語る。人に認められたい気持ちと、傷つくことを恐れる心を描く物語。", "intro": "唐の時代、才能に自信を持つ李徴は、役人を辞めて詩人として名を上げようとする。だが思うようにいかず、再び役人となったのち、旅先で姿を消す。翌年、旧友の袁傪が山道で出会った虎は、人の言葉をつぶやく。その声には聞き覚えがあった。", "synopsisSummary": ["李徴は自分の才能を頼み、役人を辞めて詩作に打ち込む。", "しかし名声は得られず、暮らしにも困り、妻子を養うために再び役人になる。かつての同輩の下で働くことを屈辱に感じていたある夜、旅先で自分を呼ぶ声を追って外へ出ると、いつの間にか虎になっていた。翌年、旧友の袁傪が山道で虎に襲われかける。虎は相手に気づいて身を隠し、その声を聞いた袁傪も、李徴だと分かる。", "李徴は草むらから、人間の心に戻れる時間がだんだん短くなると語る。そして自分の詩を後に残したいと頼み、袁傪は部下に書き取らせる。李徴は、才能がないと知られるのを恐れて人に学ばず、一方では自分に才能があると信じ、平凡な人々と交わることも嫌った自分を振り返る。人と交わって腕を磨くよりも、自尊心を守ろうとしていたというのだ。", "さらに妻子の世話を頼み、家族より先に詩のことを頼んだ自分を嘆く。人間の心を失えば友を襲うかもしれないため、帰りはこの道を通らないでほしいと告げる。別れた一行が丘から振り返ると、虎が姿を現し、明け方の月へ吠えたあと、草むらへ消える。李徴が人間に戻る場面は描かれない。"], "people": [["李徴（りちょう）", "詩人として名を上げようとした男。虎になり、旧友へ過去を語る。"], ["袁傪（えんさん）", "李徴の旧友。虎の声から友人と気づき、その話を聞く。"], ["李徴の妻子", "李徴が残してきた家族。彼は袁傪に世話を頼む。"]], "links": ["hana", "yodaka", "nakajima-atsushi"], "sources": [{"title": "青空文庫「山月記」本文（新潮文庫底本版）", "url": "https://www.aozora.gr.jp/cards/000119/files/624_14544.html"}, {"title": "青空文庫 図書カード", "url": "https://www.aozora.gr.jp/cards/000119/card624.html"}, {"title": "神奈川近代文学館 所蔵資料（初出：1942年2月『文學界』）", "url": "https://www.kanabun.or.jp/nakajima/pages/N06_120_555.html"}], "image": "assets/sangetsu-dawn-road-scene.webp", "imageAlt": "別れのあと、虎になった李徴は道へ姿を現し、明け方の月に向かって吠えます。", "bodyReadings": {"李徴": "りちょう", "袁傪": "えんさん", "養う": "やしなう"}, "summaryReadings": {"李徴": {"reading": "りちょう", "key": "李徴"}, "袁傪": {"reading": "えんさん", "key": "袁傪"}}, "primaryCategory": "japanese-literature", "genreLabel": "日本文学", "characterGallery": [{"name": "李徴（りちょう）", "role": "詩人として名を上げようとした男。虎になり、旧友へ過去を語る。", "portraits": [{"src": "assets/sangetsu-face-human.webp", "label": "人間だったころ", "alt": "李徴（りちょう）の創作イメージ：人間だったころ（詩作に苦しむ時期）", "width": 500, "height": 500}, {"src": "assets/sangetsu-face-tiger.webp", "label": "虎になった李徴", "alt": "李徴（りちょう）の創作イメージ：虎になった李徴", "width": 500, "height": 500}]}, {"name": "袁傪（えんさん）", "role": "李徴の旧友。虎の声から友人と気づき、その話を聞く。", "portraits": [{"src": "assets/sangetsu-face-ensan.webp", "label": "", "alt": "袁傪（えんさん）の創作イメージ", "width": 500, "height": 500}]}, {"name": "李徴の妻子", "role": "李徴が残してきた家族。彼は袁傪に世話を頼む。", "portraits": [{"src": "assets/sangetsu-face-family.webp", "label": "故郷に残された妻子の代表イメージ", "alt": "李徴の妻子の創作イメージ：故郷に残された妻子の代表イメージ", "width": 500, "height": 500}]}], "characterGalleryNote": "人間の李徴と虎は同じ人物です。妻子の画像は代表的なイメージで、子どもの人数や性別を確定するものではありません。 人間の李徴の画像は、詩作に苦しむ時期の姿を表しています。", "headerCaption": "別れのあと、虎になった李徴は道へ姿を現し、明け方の月に向かって吠えます。", "inlineIllustrations": [{"afterParagraph": 1, "src": "assets/sangetsu-human-poet-scene.webp", "alt": "役人を辞めた李徴は、人との付き合いを避け、詩を書くことに打ち込みます。", "caption": "役人を辞めた李徴は、人との付き合いを避け、詩を書くことに打ち込みます。", "width": 1200, "height": 800}, {"afterParagraph": 3, "src": "assets/sangetsu-poems-recorded-scene.webp", "alt": "草むらから聞こえる李徴の詩を、袁傪が部下に書き取らせます。李徴は姿を隠したまま語っています。", "caption": "草むらから聞こえる李徴の詩を、袁傪が部下に書き取らせます。李徴は姿を隠したまま語っています。", "width": 1200, "height": 800}, {"afterParagraph": 4, "src": "assets/sangetsu-dawn-road-scene.webp", "alt": "別れのあと、虎になった李徴は道へ姿を現し、明け方の月に向かって吠えます。", "caption": "別れのあと、虎になった李徴は道へ姿を現し、明け方の月に向かって吠えます。", "width": 1200, "height": 800}]}, {"id":"yumejuya","cat":"literature","name":"夢十夜","reading":"ゆめじゅうや","sub":"夏目漱石｜1908年発表","motif":"starbird","textNote":"青空文庫の、ちくま文庫『夏目漱石全集10』底本版に基づきます。十の独立した夢を話ごとに紹介します。一部に死や暴力の話題が含まれます。","imageCaption":"第一夜の白い百合をもとにしたAIイメージイラスト","gist":"百年待つ約束、話す子供、明治の町に現れた運慶。十の不思議な夢が、時間や記憶、言葉にしにくい不安を描く短編集。","intro":"目の前の女が、死んだあと百年待っていてほしいと言う。別の夢では、背負った子供が、自分の知らないはずの過去を語り始める。時間も人の姿も、現実の決まりに収まらない。十の夢が、それぞれ違う不思議な世界へ読者を連れていく。","synopsisSummary":["第一夜：死を前にした女に頼まれ、語り手は墓のそばで百年待つ。やがて白い百合が咲き、その花に触れたとき、百年がたっていたと気づく。","第二夜：侍が和尚の言葉に追い詰められ、悟りを得ようと焦る。時間ばかりが過ぎ、ついに時計が鳴ると、刀へ手をかけるところで夢は終わる。","第三夜：背負った目の見えない子供が、百年前に語り手がしたことを言い当てる。殺した相手への記憶が戻るとともに、子供は重くのしかかる。","第四夜：老人が、手拭を蛇に変えると言う。子供の語り手は見届けようと追いかけるが、老人は川の中へ進み、戻ってこない。","第五夜：捕らえられた男が、処刑の前に恋人を待つ。女は馬で急ぐが、偽の鶏の声を聞いて夜明けと思い込み、ついには淵へ落ちてしまう。","第六夜：明治の町で、運慶が仁王を彫っている。見ていた語り手も木を彫ってみるが、自分の木からは仁王が現れない。","第七夜：行き先の分からない船で、語り手は強い不安を抱く。自ら命を絶とうとした直後、生きて船にとどまればよかったと後悔する。","第八夜：床屋の鏡に、街を行き交う人々が映る。札を数え続ける女や、じっと動かない金魚売りの姿が、奇妙な時間の流れを感じさせる。","第九夜：幼い子を連れた母が、夫の無事を祈り続ける。しかし夫は、すでに殺されていた。語り手は夢の中で、母からその話を聞く。","第十夜：女について姿を消した庄太郎が、七日後に戻って寝込む。崖で次々と来る豚を追い払って力尽きた話を、語り手は健さんから聞く。庄太郎の死が確認される場面はない。"],"people":[["夢を語る人","夢によって立場や場面が変わる語り手。同じ人の連続した冒険ではない。"],["百年待つよう頼む女","第一夜に登場する、死を前にした女。語り手との詳しい関係は示されない。"],["運慶（うんけい）","第六夜で仁王（におう）を彫る人物。夢の中では明治の町に現れる。"],["庄太郎（しょうたろう）・健（けん）さん","第十夜に登場する男たち。健さんが庄太郎の不思議な体験を伝える。"]],"links":["ginga","kokoro","soseki"],"sources":[{"title":"青空文庫「夢十夜」本文","url":"https://www.aozora.gr.jp/cards/000148/files/799_14972.html"},{"title":"青空文庫 図書カード","url":"https://www.aozora.gr.jp/cards/000148/card799.html"},{"title":"二松学舎大学 漱石関連資料（1908年の新聞掲載を確認）","url":"https://www.nishogakusha-u.ac.jp/gakubugakka/event/souseki/index.html"}],"image":"assets/yumejuya.webp","imageAlt":"第一夜の白い百合と星空を描いた作品イメージ","summaryReadings":{"運慶":{"reading":"うんけい","key":"運慶"},"庄太郎":{"reading":"しょうたろう","key":"庄太郎"},"健":{"reading":"けん","key":"健"}},"primaryCategory":"japanese-literature","genreLabel":"日本文学","bodyReadings":{"追い詰め":"おいつめ"},"characterGallery":[{"name":"夢を語る人","role":"夢によって立場や場面が変わる語り手。同じ人の連続した冒険ではない。","portraits":[{"src":"assets/yume-face-narrator.webp","label":"第一夜の語り手のイメージ","alt":"夢を語る人の創作イメージ","width":500,"height":500}]},{"name":"百年待つよう頼む女","role":"第一夜に登場する、死を前にした女。語り手との詳しい関係は示されない。","portraits":[{"src":"assets/yume-face-woman.webp","label":"第一夜・生前の姿","alt":"百年待つよう頼む女の創作イメージ","width":500,"height":500}]},{"name":"運慶（うんけい）","role":"第六夜で仁王（におう）を彫る人物。夢の中では明治の町に現れる。","portraits":[{"src":"assets/yume-face-unkei.webp","label":"第六夜の運慶","alt":"運慶（うんけい）の創作イメージ","width":500,"height":500}]},{"name":"庄太郎（しょうたろう）・健（けん）さん","role":"第十夜に登場する男たち。健さんが庄太郎の不思議な体験を伝える。","portraits":[{"src":"assets/yume-face-shotaro.webp","label":"第十夜・庄太郎","alt":"庄太郎の創作イメージ","width":500,"height":500},{"src":"assets/yume-face-ken.webp","label":"第十夜・健さん","alt":"健さんの創作イメージ","width":500,"height":500}]}],"characterGalleryNote":"語り手の絵は第一夜のイメージです。庄太郎と健さんは別々の人物です。","inlineIllustrations":[{"afterParagraph":1,"src":"assets/yume-firstnight-lily-scene.webp","caption":"第一夜。長く待ち続けた語り手の前に、白い百合が咲きます。花に触れたあと、百年が過ぎていたと気づきます。","alt":"第一夜。長く待ち続けた語り手の前に、白い百合が咲きます。花に触れたあと、百年が過ぎていたと気づきます。","width":1200,"height":800},{"afterParagraph":6,"src":"assets/yume-sixthnight-unkei-carving-scene.webp","caption":"第六夜。明治の人々が見物する中、運慶は仁王を彫り進めます。語り手には、昔の彫刻家が今ここにいることが不思議です。","alt":"第六夜。明治の人々が見物する中、運慶は仁王を彫り進めます。語り手には、昔の彫刻家が今ここにいることが不思議です。","width":1200,"height":800},{"afterParagraph":10,"src":"assets/yume-tenthnight-ken-report-scene.webp","caption":"第十夜。健さんが語り手を訪ね、庄太郎が戻って寝込んでいることと、不思議な体験を伝えます。","alt":"第十夜。健さんが語り手を訪ね、庄太郎が戻って寝込んでいることと、不思議な体験を伝えます。","width":1200,"height":800}]}, {"id": "takasebune", "cat": "literature", "name": "高瀬舟", "reading": "たかせぶね", "sub": "森鴎外｜1916年発表", "motif": "railcart", "textNote": "青空文庫の岩波文庫『山椒大夫・高瀬舟』系底本に基づきます。要約では自死と死を助ける行為に触れますが、方法は描写しません。", "gist": "弟を死なせた罪で送られる男が、なぜ穏やかな顔をしているのか。護送する役人が、満ち足りることと、人を裁くことに迷う物語。", "intro": "春の夕方、弟を死なせた罪で遠島へ送られる喜助を、同心の庄兵衛が舟で護送する。ほかの罪人と違って、喜助はどこか晴れやかな顔をしている。庄兵衛がその理由を尋ねると、男は貧しかった暮らしと、弟との出来事を語り始める。", "synopsisSummary": ["京都の高瀬川を下る舟で、役人の羽田庄兵衛は、罪人の喜助を見張りながら送り届ける役目についている。喜助は弟殺しの罪で、遠い島へ送られる刑を受けた。それなのに、喜助の表情は穏やかだった。庄兵衛が尋ねると、喜助は、これまで住む所にも食べ物にも困り、金を手元に残せたことがなかったと話す。今は行く場所が決まり、渡された二百文を元手に持てることがうれしいと言う。庄兵衛は、自分の暮らしと比べながら、何をもって足りると感じるのか考え込む。", "次に庄兵衛は、弟の死について聞く。喜助たちは幼くして両親を失い、兄弟で助け合ってきた。しかし弟が病気で働けなくなり、兄の負担になっていると思い詰める。", "弟は自ら命を絶とうとして苦しみ、帰宅した喜助に、苦痛を終わらせる手助けを求めた。喜助は医者を呼ぼうとするが、弟の願いを断りきれずに応じ、その結果、弟は息を引き取る。", "話を聞いた庄兵衛は、人殺しという裁きと、苦しむ弟を救おうとした喜助の行為の間で迷う。自分には判断できず、上の者の考えに従おうとしても、疑問は消えない。喜助が許されたり、舟から解放されたりすることはなく、二人を乗せた舟は夜の川を進んでいく。"], "people": [["喜助（きすけ）", "弟を死なせた罪で遠島へ送られる男。貧しい暮らしを続けてきた。"], ["羽田庄兵衛（はねだ しょうべえ）", "喜助を護送する同心（どうしん）。話を聞くうち、裁きについて迷う。"], ["喜助の弟", "病気で働けなくなり、兄の負担になることを苦にしていた。"]], "links": ["kokoro", "gongitsune", "mori-ogai"], "sources": [{"title": "青空文庫「高瀬舟」本文", "url": "https://www.aozora.gr.jp/cards/000129/files/45245_22007.html"}, {"title": "青空文庫 図書カード（初出：1916年1月『中央公論』）", "url": "https://www.aozora.gr.jp/cards/000129/card45245.html"}], "image": "assets/takase-escort-corrected.webp", "imageAlt": "舟で送られる喜助（右）を、役人の庄兵衛（左）が見守ります。", "summaryReadings": {"喜助": {"reading": "きすけ", "key": "喜助"}, "羽田庄兵衛": {"reading": "はねだ しょうべえ", "key": "羽田庄兵衛"}, "庄兵衛": {"reading": "しょうべえ", "key": "羽田庄兵衛"}}, "primaryCategory": "japanese-literature", "genreLabel": "日本文学", "bodyReadings": {"貧しい": "まずしい"}, "characterGallery": [{"name": "喜助（きすけ）", "role": "弟を死なせた罪で遠島へ送られる男。貧しい暮らしを続けてきた。", "portraits": [{"src": "assets/takase-face-kisuke.webp", "label": "", "alt": "喜助（きすけ）の創作イメージ", "width": 500, "height": 500}]}, {"name": "羽田庄兵衛（はねだ しょうべえ）", "role": "喜助を護送する同心（どうしん）。話を聞くうち、裁きについて迷う。", "portraits": [{"src": "assets/takase-face-shobei.webp", "label": "", "alt": "羽田庄兵衛（はねだ しょうべえ）の創作イメージ", "width": 500, "height": 500}]}, {"name": "喜助の弟", "role": "病気で働けなくなり、兄の負担になることを苦にしていた。", "portraits": [{"src": "assets/takase-face-brother.webp", "label": "喜助の弟（生前の姿）", "alt": "喜助の弟の創作イメージ：喜助の弟（生前の姿）", "width": 500, "height": 500}]}], "characterGalleryNote": "舟の絵は喜助と庄兵衛の二人に視点を絞っています。弟の人物画像は生前の姿を想像したものです。", "headerCaption": "舟で送られる喜助（右）を、役人の庄兵衛（左）が見守ります。", "inlineIllustrations": [{"afterParagraph": 1, "src": "assets/takase-escort-corrected.webp", "alt": "舟で送られる喜助（右）を、役人の庄兵衛（左）が見守ります。", "caption": "舟で送られる喜助（右）を、役人の庄兵衛（左）が見守ります。", "width": 1200, "height": 800}, {"afterParagraph": 2, "src": "assets/takase-brothers-before-incident-scene.webp", "alt": "喜助が語る、事件より前の暮らし。病気になった弟を、働きに出る兄が支えていました。", "caption": "喜助が語る、事件より前の暮らし。病気になった弟を、働きに出る兄が支えていました。", "width": 1200, "height": 800}, {"afterParagraph": 4, "src": "assets/takase-final-silent-river-scene.webp", "alt": "話を聞いても、庄兵衛の迷いは消えません。二人を乗せた舟は、夜の川を進み続けます。", "caption": "話を聞いても、庄兵衛の迷いは消えません。二人を乗せた舟は、夜の川を進み続けます。", "width": 1200, "height": 800}]}, {"id":"maihime","cat":"literature","name":"舞姫","reading":"まいひめ","sub":"森鴎外｜1890年発表","motif":"classroom","sourceNote":"青空文庫の筑摩書房『現代日本文學大系7』底本版に基づきます。文語・旧仮名の原文を、本サイト独自の現代語で要約しています。","gist":"外国で出会った女性との暮らしと、国へ戻って出世する道。選べないまま約束を重ねた青年が、自分の決断を振り返る物語。","intro":"国の仕事でベルリンへ来た豊太郎は、勉強を続けるうち、決められた道だけを進む生き方に疑問を持ち始める。ある日、父の葬儀の費用に困る踊り手のエリスを助ける。二人は親しくなるが、豊太郎の仕事と将来にも変化が起きる。","synopsisSummary":["帰国する船の中で、太田豊太郎はベルリンでの出来事を振り返る。優秀な官吏として派遣された豊太郎は、現地で学ぶうちに自分の関心と官の求めるものが離れ始める。父の葬儀費に困っていた踊り手のエリスを助け、親しくなるが、同郷の人々の告げ口や上司の不興によって職を失う。さらに、日本の母が亡くなった知らせも届く。","親友が紹介してくれた新聞通信員の仕事をしながら、豊太郎はエリスとその母の家で暮らす。やがてエリスは子を身ごもる。一方、ベルリンへ来た親友の紹介で、日本の大臣の翻訳を手伝うことになり、豊太郎は信用を得る。大臣に付き添ってロシアへ行く。ベルリンへ戻った後、日本へ一緒に戻るよう誘われると、断りきれずに承諾してしまう。","しかし、エリスには帰国の決心を告げられない。思い悩んだ豊太郎は病に倒れ、看病していたエリスは、親友から別れと帰国の約束を聞く。","強い衝撃を受けた彼女は、心身を病んでしまう。回復した豊太郎は、エリスの母へ生活と出産のための金を渡し、大臣とともに帰国する。親友に助けられたことへの感謝がありながら、恨む気持ちも残る。その割り切れなさを抱えた回想として、物語は終わる。"],"people":[["太田豊太郎（おおた とよたろう）","国の仕事でベルリンへ来た青年。帰国の船で、自分の過去を語る。"],["エリス","父を失って困っていた踊り手。豊太郎と暮らし、子を身ごもる。"],["豊太郎の親友","仕事を紹介し、豊太郎が官の世界へ戻る道を助ける。"],["エリスの母","娘とともに暮らし、豊太郎も家へ迎える。"],["日本の大臣","豊太郎の働きを認め、日本へ戻るよう誘う。"]],"links":["kokoro","botchan","mori-ogai"],"sources":[{"title":"青空文庫「舞姫」本文","url":"https://www.aozora.gr.jp/cards/000129/files/2078_15963.html"},{"title":"青空文庫 図書カード（初出：1890年1月『國民之友』）","url":"https://www.aozora.gr.jp/cards/000129/card2078.html"},{"title":"埼玉県立歴史と民俗の博物館（太田豊太郎の読みの確認）","url":"https://saitama-rekimin.spec.ed.jp/quiz2/a25"}],"image":"assets/maihime.webp","imageAlt":"ベルリンを思わせる街路で距離を置く成人男女の作品イメージ","summaryReadings":{"太田豊太郎":{"reading":"おおた とよたろう","key":"太田豊太郎"},"豊太郎":{"reading":"とよたろう","key":"太田豊太郎"}},"primaryCategory":"japanese-literature","genreLabel":"日本文学","bodyReadings":{},"inlineIllustrations":[{"afterParagraph":1,"src":"assets/maihime-first-meeting-scene.webp","caption":"ベルリンでの回想。豊太郎は、閉じた寺門の前で泣いていたエリスに声をかけます。二人の出会いです。","alt":"ベルリンでの回想。豊太郎は、閉じた寺門の前で泣いていたエリスに声をかけます。二人の出会いです。","width":1200,"height":800},{"afterParagraph":3,"src":"assets/maihime-promise-revealed-scene.webp","alt":"左の男性は豊太郎の親友。エリスに別れと帰国の約束を伝えます。豊太郎本人からは聞かされていなかったことでした。","caption":"左の男性は豊太郎の親友。エリスに別れと帰国の約束を伝えます。豊太郎本人からは聞かされていなかったことでした。","width":1200,"height":800},{"afterParagraph":4,"src":"assets/maihime-return-ship-writing-scene.webp","caption":"帰国の船にいる豊太郎は、ベルリンでの出来事を書きつづります。助けられた感謝も、親友への恨みも残ったままです。","alt":"帰国の船にいる豊太郎は、ベルリンでの出来事を書きつづります。助けられた感謝も、親友への恨みも残ったままです。","width":1200,"height":800}],"characterGallery":[{"name":"太田豊太郎（おおた とよたろう）","role":"国の仕事でベルリンへ来た青年。帰国の船で、自分の過去を語る。","portraits":[{"src":"assets/maihime-face-toyotaro.webp","label":"ベルリンにいたころ","alt":"太田豊太郎（おおた とよたろう）の創作イメージ","width":500,"height":500}]},{"name":"エリス","role":"父を失って困っていた踊り手。豊太郎と暮らし、子を身ごもる。","portraits":[{"src":"assets/maihime-face-elise.webp","label":"豊太郎と出会ったころ","alt":"エリスの創作イメージ","width":500,"height":500}]},{"name":"豊太郎の親友","role":"仕事を紹介し、豊太郎が官の世界へ戻る道を助ける。","portraits":[{"src":"assets/maihime-face-aizawa.webp","label":"豊太郎の親友","alt":"豊太郎の親友の創作イメージ","width":500,"height":500}]},{"name":"エリスの母","role":"娘とともに暮らし、豊太郎も家へ迎える。","portraits":[{"src":"assets/maihime-face-mother.webp","label":"","alt":"エリスの母の創作イメージ","width":500,"height":500}]},{"name":"日本の大臣","role":"豊太郎の働きを認め、日本へ戻るよう誘う。","portraits":[{"src":"assets/maihime-face-minister.webp","label":"","alt":"日本の大臣の創作イメージ","width":500,"height":500}]}],"characterGalleryNote":"エリスの顔の絵は豊太郎と出会ったころを表しています。親友が帰国の約束を伝える挿絵は、それより後の時点です。"}, {"id":"ningen","cat":"literature","name":"人間失格","reading":"にんげんしっかく","sub":"太宰治｜1948年発表","motif":"classroom","sourceNote":"青空文庫の新潮文庫底本版に基づきます。三つの手記と、その前後を包む別の語り手の文章を区別して紹介します。","textNote":"作品と要約には、自死未遂、性暴力、依存に関する話題が含まれます。方法や具体的な場面の描写は省いています。","gist":"人が怖くて、笑わせる役を演じ続けた男が、自分の半生を書く。強い自己否定と、他人が見ていた別の姿が重なる物語。","intro":"人の気持ちや暮らしの決まりが分からず、子供のころから人間を怖がっていた葉蔵。嫌われないために、おどけて人を笑わせることを覚える。三つの手記に書かれたその半生を、別の語り手が写真とともに受け取る。","synopsisSummary":["小説は、ある語り手が一人の男の写真を見たところから始まり、その男・大庭葉蔵の三つの手記へ移る。葉蔵は子供のころから人を恐れ、周囲に合わせるために道化を演じてきた。","東京へ出ると、知り合った友人の影響などから飲酒を深め、生活は不安定になる。ある女性とともに命を絶とうとするが、葉蔵だけが生き残る。","その後、保護してくれる人のもとを離れ、シヅ子とその娘と暮らしながら漫画を描く。","しかし、その暮らしからも去ってしまう。ヨシ子と結婚すると一時は落ち着くが、彼女が商人から性的な暴力を受ける出来事が起こる。葉蔵の不安や飲酒はさらに深まり、やがて薬物への依存と入院へ至る。ヨシ子が夫を裏切って恋愛をした、という話ではない。","父が亡くなると、葉蔵は兄に引き取られ、地方の家で暮らすようになる。手記の終わりで彼は二十七歳と記しているが、物語の最後に自死するわけではない。あとがきでは、外側の語り手が、かつて葉蔵を知っていた女性から手記と写真を受け取ったことが分かる。その女性は葉蔵を好意的に振り返り、本人の激しい自己否定とは違う姿を語る。外側の語りの時点で、葉蔵がどう暮らしているかは分からない。"],"people":[["大庭葉蔵（おおば ようぞう）","三つの手記を書いた男。人を恐れ、おどけることで周囲に合わせてきた。"],["シヅ子","娘とともに暮らす女性。一時期、葉蔵と生活する。"],["ヨシ子","葉蔵の妻。商人から性的な暴力を受ける。"],["手記を受け取る語り手","はしがき・あとがきに登場する、葉蔵とは別の人物。"],["葉蔵を知る女性","あとがきで手記と写真を渡し、葉蔵を好意的に振り返る。"]],"links":["kokoro","melos","dazai"],"sources":[{"title":"青空文庫「人間失格」本文","url":"https://www.aozora.gr.jp/cards/000035/files/301_14912.html"},{"title":"青空文庫 図書カード（初出：1948年6–8月『展望』）","url":"https://www.aozora.gr.jp/cards/000035/card301.html"},{"title":"講談社「日本人名大辞典+Plus」（大庭葉蔵の読みの確認）","url":"https://kotobank.jp/word/大庭葉蔵-1061336"}],"image":"assets/ningen.webp","imageAlt":"窓辺で手記に向かう匿名の成人男性の作品イメージ","summaryReadings":{"大庭葉蔵":{"reading":"おおば ようぞう","key":"大庭葉蔵"},"葉蔵":{"reading":"ようぞう","key":"大庭葉蔵"}},"primaryCategory":"japanese-literature","genreLabel":"日本文学","bodyReadings":{},"characterGallery":[{"name":"大庭葉蔵（おおば ようぞう）","role":"三つの手記を書いた男。人を恐れ、おどけることで周囲に合わせてきた。","portraits":[{"src":"assets/ningen-face-yozo.webp","label":"若いころの葉蔵","alt":"大庭葉蔵（おおば ようぞう）の創作イメージ","width":500,"height":500}]},{"name":"シヅ子","role":"娘とともに暮らす女性。一時期、葉蔵と生活する。","portraits":[{"src":"assets/ningen-face-shizuko.webp","label":"","alt":"シヅ子の創作イメージ","width":500,"height":500}]},{"name":"ヨシ子","role":"葉蔵の妻。商人から性的な暴力を受ける。","portraits":[{"src":"assets/ningen-face-yoshiko.webp","label":"出会ったころのヨシ子","alt":"ヨシ子の創作イメージ","width":500,"height":500}]},{"name":"手記を受け取る語り手","role":"はしがき・あとがきに登場する、葉蔵とは別の人物。","portraits":[{"src":"assets/ningen-face-frame-narrator.webp","label":"","alt":"手記を受け取る語り手の創作イメージ","width":500,"height":500}]},{"name":"葉蔵を知る女性","role":"あとがきで手記と写真を渡し、葉蔵を好意的に振り返る。","portraits":[{"src":"assets/ningen-face-madam.webp","label":"あとがきの女性","alt":"葉蔵を知る女性の創作イメージ","width":500,"height":500}]}],"characterGalleryNote":"葉蔵は若いころ、ヨシ子は出会ったころの姿です。手記を受け取る語り手は葉蔵とは別人です。","inlineIllustrations":[{"afterParagraph":1,"src":"assets/ningen-child-comic-classmates-scene.webp","caption":"子供のころの葉蔵は、自分の描いた漫画を見せ、同級生を笑わせます。人への怖さを隠すための振る舞いでもありました。","alt":"子供のころの葉蔵は、自分の描いた漫画を見せ、同級生を笑わせます。人への怖さを隠すための振る舞いでもありました。","width":1200,"height":800},{"afterParagraph":3,"src":"assets/ningen-drawing-with-child-scene.webp","caption":"シヅ子の娘と留守番をする葉蔵は、子供に漫画を描いて見せます。シヅ子の家で暮らしていたころの場面です。","alt":"シヅ子の娘と留守番をする葉蔵は、子供に漫画を描いて見せます。シヅ子の家で暮らしていたころの場面です。","width":1200,"height":800},{"afterParagraph":5,"src":"assets/ningen-notebooks-handover-scene.webp","caption":"あとがき。葉蔵を知る女性が、別の語り手へ三冊の手記と三枚の写真を渡します。葉蔵自身は、この場にはいません。","alt":"あとがき。葉蔵を知る女性が、別の語り手へ三冊の手記と三枚の写真を渡します。葉蔵自身は、この場にはいません。","width":1200,"height":800}]}, {"id": "soseki", "reading": "なつめそうせき", "cat": "person", "name": "夏目漱石", "sub": "1867–1916｜小説家", "motif": "book", "gist": "英語を教え、英国で学び、やがて小説を書き続けた人。身近な会話や人間関係から、人の迷いを見つめました。", "intro": "『吾輩は猫である』『坊っちゃん』『こころ』などを書いた小説家。教師として働き、英国留学を経験した後、新聞社の専属作家になりました。笑いの多い作品から、人とのつながりや言えない思いをたどる作品まで、さまざまな入口があります。", "people": [], "theme": "", "memory": "", "links": ["cat", "botchan", "kokoro", "yumejuya", "kusamakura", "sanshiro"], "sources": [{"title": "新宿区立漱石山房記念館「漱石の生涯」", "url": "https://soseki-museum.jp/soseki-natsume/sosekis-life/"}, {"title": "国立国会図書館「近代日本人の肖像」夏目漱石", "url": "https://www.ndl.go.jp/portrait/datas/307/"}, {"title": "東北大学附属図書館：漱石の生涯", "url": "https://www.library.tohoku.ac.jp/en/collections/soseki/about.html"}, {"title": "東北大学附属図書館：漱石年表", "url": "https://www.library.tohoku.ac.jp/en/collections/soseki/chronology.html"}, {"title": "漱石山房記念館：作品紹介", "url": "https://soseki-museum.jp/eng/soseki-natsume/work-introduction/"}], "bodyReadings": {"金之助": "きんのすけ", "正岡子規": "まさおかしき", "明暗": "めいあん"}, "image": "assets/soseki-ai.webp", "imageAlt": "夏目漱石を描いたAIイラスト", "imageCaption": "人物を描いたAIイラスト（写真ではありません）", "portraitNote": "実在の人物を題材にしたAI生成の創作イラストです。本人の写真や、写真を忠実に復元した画像ではありません。", "primaryCategory": "person", "genreLabel": "人物", "backgroundDiagrams": true}, {"id": "kenji", "reading": "みやざわけんじ", "cat": "person", "name": "宮沢賢治", "sub": "1896–1933｜詩人・童話作家", "motif": "book", "gist": "岩手の自然や人々の暮らしを見つめ、詩と童話を書いた人。教師や農業指導にも取り組みました。", "intro": "『注文の多い料理店』『銀河鉄道の夜』などで知られる詩人・童話作家。岩手の自然や人々の暮らしをもとに、科学、音楽、信仰などへの関心を作品へ結びつけました。農学校で教え、農業を支える活動も行っています。", "people": [], "theme": "", "memory": "", "links": ["restaurant", "ginga", "goshu", "yodaka", "yamanashi", "ame-ni-mo-makezu", "kaze-no-matasaburo", "nametokoyama-no-kuma", "otuber-to-zo", "donguri-yamaneko"], "sources": [{"title": "花巻市「宮沢賢治について」", "url": "https://www.city.hanamaki.iwate.jp/miyazawakenji/about_kenji/"}, {"title": "花巻市「宮沢賢治年譜」", "url": "https://www.city.hanamaki.iwate.jp/miyazawakenji/about_kenji/1003946.html"}, {"title": "花巻市「賢治と文学」", "url": "https://www.city.hanamaki.iwate.jp/miyazawakenji/about_kenji/1003947.html"}, {"title": "国立国会図書館「近代日本人の肖像」宮沢賢治", "url": "https://www.ndl.go.jp/portrait/datas/4318/"}, {"title": "岩手県立図書館：銀河鉄道の夜の第三次稿と刊行資料", "url": "https://crd.ndl.go.jp/reference/detail?page=ref_view&id=1000176827"}, {"title": "国立国会図書館国際子ども図書館：宮沢賢治", "url": "https://www.kodomo.go.jp/jcl/person/miyazawa.html"}], "bodyReadings": {"春と修羅": "はるとしゅら", "永訣の朝": "えいけつのあさ", "羅須地人協会": "らすちじんきょうかい"}, "image": "assets/kenji-ai.webp", "imageAlt": "宮沢賢治を描いたAIイラスト", "imageCaption": "人物を描いたAIイラスト（写真ではありません）", "portraitNote": "実在の人物を題材にしたAI生成の創作イラストです。本人の写真や、写真を忠実に復元した画像ではありません。", "primaryCategory": "person", "genreLabel": "人物", "backgroundDiagrams": true}, {"id":"yamanashi","name":"やまなし","reading":"やまなし","cat":"literature","bodyReadings":{"谷川":"たにがわ","水面":"すいめん","果実":"かじつ","恵み":"めぐみ"},"sub":"宮沢賢治｜1923年発表","motif":"book","intro":"谷川の底で、二匹のかにの子どもが頭上の世界を見上げている。五月には青く光るものが飛び込み、十二月には黒く丸いものが落ちてくる。水の中の小さな親子から見た、二つの季節の物語。","gist":"同じ川へ、怖い鳥も、香りのよい実もやって来る。かにの親子が見上げる自然の二つの顔。","people":[["かにの子どもたち","谷川の底で暮らす二匹。頭上で起こることを見ながら話す。"],["かにの父親","怖がる子どもをなだめ、やまなしの実について教える。"],["魚とかわせみ","かにたちの頭上に現れる生き物。"]],"links":["kenji","ginga"],"synopsisSummary":["小さな谷川の底で暮らす、かにの親子の物語です。五月、二匹の子どもはクラムボンというものについて話しながら、頭上を行き来する魚を見ています。","すると青く光るものが水に飛び込み、魚を連れ去りました。震える子どもたちに、父親はそれがかわせみだと教え、自分たちは大丈夫だとなだめます。川には美しい光や花びらが流れますが、子どもたちの怖さは消えません。","十二月、成長した子どもたちは、月明かりの下で自分の吐く泡の大きさを競っています。そこへ黒く丸いものが落ち、またかわせみかと身をすくめます。しかし今度は、よく熟れたやまなしの実でした。父親と一緒に実を追うと、枝に引っかかって止まり、よい匂いが広がっています。父親は、あと二日ほどで沈んでおいしい酒ができると話します。親子はそれを楽しみに、穴へ帰っていきます。"],"sources":[{"title":"青空文庫・原著本文（全文確認）","url":"https://www.aozora.gr.jp/cards/000081/files/46605_31178.html"},{"title":"青空文庫・図書カード（初出・著者没年・読み）","url":"https://www.aozora.gr.jp/cards/000081/card46605.html"},{"title":"光村図書・教材／紹介図書の確認資料","url":"https://www.mitsumura-tosho.co.jp/kyokasho/s-kokugo/material6nen"}],"sourceNote":"光村図書・小学校６年の教材別資料一覧に掲載。","image":"assets/yamanashi-moonlight-corrected.webp","imageAlt":"十二月、かにの親子は流れてきたやまなしの実を見上げます。","primaryCategory":"japanese-literature","genreLabel":"日本文学","characterGallery":[{"name":"かにの子どもたち","role":"谷川の底で暮らす二匹。頭上で起こることを見ながら話す。","portraits":[{"src":"assets/yamanashi-face-children.webp","label":"かにの兄弟（二匹）","alt":"かにの子どもたちの創作イメージ","width":500,"height":500}]},{"name":"かにの父親","role":"怖がる子どもをなだめ、やまなしの実について教える。","portraits":[{"src":"assets/yamanashi-face-father.webp","label":"","alt":"かにの父親の創作イメージ","width":500,"height":500}]},{"name":"魚とかわせみ","role":"かにたちの頭上に現れる生き物。","portraits":[{"src":"assets/yamanashi-face-fish-bird.webp","label":"左：魚／右：かわせみ","alt":"魚とかわせみの創作イメージ","width":500,"height":500}]}],"characterGalleryNote":"クラムボンの正体は、本文では明かされません。","headerCaption":"十二月、かにの親子は流れてきたやまなしの実を見上げます。","inlineIllustrations":[{"afterParagraph":1,"src":"assets/yamanashi-may-fish-scene.webp","alt":"五月、二匹のかにの子どもは、頭上を行き来する魚を見上げています。","caption":"五月、二匹のかにの子どもは、頭上を行き来する魚を見上げています。","width":1200,"height":800},{"afterParagraph":2,"src":"assets/yamanashi-may-father-scene.webp","alt":"魚と青いものが去ったあと、父親は怖がる子どもたちに、かわせみだったと教えます。","caption":"魚と青いものが去ったあと、父親は怖がる子どもたちに、かわせみだったと教えます。","width":1200,"height":800},{"afterParagraph":3,"src":"assets/yamanashi-moonlight-corrected.webp","alt":"十二月、かにの親子は流れてきたやまなしの実を見上げます。","caption":"十二月、かにの親子は流れてきたやまなしの実を見上げます。","width":1200,"height":800}]}, {"id":"hitofusanobudo","name":"一房の葡萄","reading":"ひとふさのぶどう","cat":"literature","bodyReadings":{"一房":"ひとふさ","葡萄":"ぶどう","有島武郎":"ありしまたけお","藍":"あい","洋紅":"ようこう","横浜":"よこはま","翌朝":"よくあさ","否定":"ひてい","授業":"じゅぎょう","握手":"あくしゅ","回想":"かいそう","登校":"とうこう","尋ね":"たずね","摘んで":"つんで"},"sub":"有島武郎｜1920年発表","motif":"book","intro":"絵を描くのが好きな少年は、友達の持つ美しい絵の具がうらやましくてたまらない。とうとう盗んでしまい、みんなの前で見つかって、大好きな先生の部屋へ連れていかれる。失敗した子どもと、それを受け止める大人の物語。","gist":"絵の具を盗んだ少年を、先生は責めるだけで終わらせなかった。もう一度学校へ戻る力をもらった日の記憶。","people":[["僕（ぼく）","絵を描くのが好きな少年。大人になって、学校での出来事を振り返る。"],["ジム","僕と同じ学校に通う少年。上等な絵の具を持っている。"],["先生（せんせい）","僕が慕う女の先生。盗みが見つかった僕を部屋へ迎える。"]],"links":["gongitsune","gloves","arishima-takeo"],"synopsisSummary":["これは、大人になった「僕」が、横浜の学校に通っていた頃を振り返る物語です。絵を描くのが好きだった僕は、海や船の色をうまく出せず、同じ学校の少年ジムが持つ上等な絵の具をうらやんでいました。ある日の昼休み、僕はジムの机から藍と洋紅の二色を盗みます。","授業が終わると生徒たちに問い詰められ、否定しますが、ポケットから絵の具が見つかりました。僕は泣き出し、みんなに連れられて、大好きな女の先生の部屋へ行きます。","その日、先生はほかの生徒を部屋から帰し、僕に、絵の具をもう返したか、自分のしたことを悪かったと思っているかを尋ねます。先生は僕を部屋で休ませ、窓辺から摘んだ葡萄を一房渡して、授業へ戻りました。","僕は泣き疲れて眠ってしまいます。先生に起こされた時には、ほかの生徒はもう帰っていました。先生は翌日も必ず学校へ来るように言い、葡萄を僕のカバンに入れます。僕は家へ帰って、その葡萄を食べました。","翌朝、僕はみんなに責められるのが怖くて、学校へ行きたくありません。それでも先生に会いたいと思い、登校します。するとジムが手を握って迎え、僕を先生の部屋へ連れていきました。先生は、先生の話を理解してくれたジムをほめ、僕には、ジムはもう僕に謝ってもらわなくてもよいと言っている、と伝えます。そして二人に
