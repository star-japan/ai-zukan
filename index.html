.sdu.dk/liv/biografi/skole_e.html"}, {"title": "南デンマーク大学アンデルセン研究センター・童話", "url": "https://andersen.sdu.dk/liv/biografi/eventyr_e.html"}, {"title": "南デンマーク大学アンデルセン研究センター・旅行記", "url": "https://andersen.sdu.dk/liv/biografi/rejseboeger_e.html"}, {"title": "Project Gutenberg Canada：M. R. James英訳全文・版情報", "url": "https://www.gutenbergca.gutenbergcanada.ca/ebooks/andersen-ugly/andersen-ugly-00-h.html"}, {"title": "Wikisource・Paull英訳「The Little Mermaid」全文", "url": "https://en.wikisource.org/wiki/Hans_Andersen's_Fairy_Tales/The_Little_Mermaid"}, {"title": "Wikisource・Paull英訳当該話全文", "url": "https://en.wikisource.org/wiki/Hans_Andersen's_Fairy_Tales/The_Emperor's_New_Clothes"}], "bodyReadings": {"童話": "どうわ", "戯曲": "ぎきょく", "即興詩人": "そっきょうしじん", "刊行": "かんこう", "昔話": "むかしばなし", "故郷": "こきょう", "洗濯": "せんたく", "俳優": "はいゆう", "踊り手": "おどりて", "資格": "しかく", "小冊子": "しょうさっし", "旅行記": "りょこうき", "観察": "かんさつ"}, "checkedDate": "2026年11月2日", "primaryCategory": "person", "genreLabel": "人物", "sourceNote": "1835年は童話小冊子の刊行を始めた年で、初めて文章や童話を書いた年ではありません。1828年の試験合格を大学卒業とは記していません。作品の比較は独自の読書案内で、作者が語った創作意図や、登場人物が作者そのものであるとの断定ではありません。", "authorTextOnly": true, "portraitNote": "この紹介には本人の肖像は掲載していません。"}, {"id": "anne-green-gables", "name": "赤毛のアン", "reading": "あかげのあん", "intro": "男の子を迎えるはずだった農場に、十一歳の少女アンがやって来ます。豊かな想像力とおしゃべりで周囲を驚かせながら、家族や友達との関係を育てていく物語です。", "gist": "居場所を求めて来た少女が、失敗や学びを重ね、家族と友達に支えられながら、自分の進む道を選ぶ。", "bodyReadings": {"赤毛": "あかげ", "兄妹": "きょうだい", "農場": "のうじょう", "農作業": "のうさぎょう", "伝言": "でんごん", "子守": "こもり", "孤児院": "こじいん", "来歴": "らいれき", "衝突": "しょうとつ", "石板": "せきばん", "不公平": "ふこうへい", "果実酒": "かじつしゅ", "交際": "こうさい", "看病": "かんびょう", "誤解": "ごかい", "仕立て": "したて", "袖": "そで", "朗読": "ろうどく", "学院": "がくいん", "教員資格": "きょういんしかく", "奨学金": "しょうがくきん", "帰省": "きせい", "貯金": "ちょきん", "破綻": "はたん", "急死": "きゅうし", "失明": "しつめい", "進路": "しんろ", "意地": "いじ"}, "sources": [{"title": "Wikisource・英語原典全38章と版表示", "url": "https://en.wikisource.org/wiki/Anne_of_Green_Gables_(1908)"}, {"title": "L. M. Montgomery Institute・作者と1908年の刊行", "url": "https://lmmontgomery.ca/about/l-m-montgomery/"}], "checkedDate": "2026年11月2日", "sourceNote": "1908年刊の第一作を扱います。参照した英語本文は、Wikisourceに収録されたL・C・ペイジ社版の転記で、奥付には1909年第十一刷までの表示があります。現代の日本語訳や映像版、続編の出来事は用いていません。物語の説明と読み方は、この図鑑による独自の日本語解説です。", "termNote": "グリーン・ゲイブルズは、アンを迎える兄妹が暮らす家と農場の名前です。石板は、紙の代わりに文字や計算を書いて使った学用品。クイーン学院は、この物語でアンたちが教員資格を取るために学ぶ学校で、その先に目指すレドモンド大学とは別です。奨学金は、進学や勉強の費用を支えるお金です。", "cat": "literature", "primaryCategory": "world-literature", "genreLabel": "海外文学", "genre": "world-classic", "motif": "book", "sub": "L・M・モンゴメリ｜1908年初刊行", "people": [["アン・シャーリー", "十一歳でグリーン・ゲイブルズへ来る少女。想像力が豊かで、よく話す。物語の中で十六歳頃まで成長する。"], ["マシュウ・カスバート", "マリラの兄。農場で働く、口数の少ない人。駅へアンを迎えに行き、温かく見守る。"], ["マリラ・カスバート", "マシュウの妹。兄と暮らし、アンを育てる。厳しく教えるが、自分の間違いも認める。"], ["ダイアナ・バリー", "アンの近所に住む同じ年頃の少女。アンと親友になる。"], ["ギルバート・ブライス", "アンより少し年上の同級生。初めはアンを怒らせるが、勉強で競い合う相手になる。"], ["レイチェル・リンド夫人", "カスバート兄妹の近所に住む女性。思ったことをはっきり言い、やがてアンを助ける。"], ["ステイシー先生", "学校に新しく来る女性の先生。アンの学ぶ力を伸ばし、進学を励ます。"]], "synopsisSummary": ["カナダのプリンス・エドワード島。農場「グリーン・ゲイブルズ」で暮らすマシュウとマリラは、年を取った兄と妹です。二人は農作業を手伝う男の子を迎えるつもりでした。ところが、伝言が食い違い、駅で待っていたのは十一歳の少女アンです。迎えに来たマシュウは、よく話し、景色に心を躍らせるアンに親しみを感じ、家へ連れ帰ります。", "男の子ではないから帰すと聞き、アンは泣きます。幼い時に両親を失い、よその家で子守をし、孤児院へ移ったアンは、自分の家を強く求めていました。マリラはその来歴を聞き、別の家でまた働かされそうな姿を見て、アンを育てると決めます。厳しいマリラと口数の少ないマシュウの家に、アンのおしゃべりや空想が広がります。近所のリンド夫人と衝突することもありますが、謝り合い、少しずつ周囲との関係を作っていきます。", "アンは近所の少女ダイアナと親友になり、学校にも通い始めます。一方、同級生のギルバートに赤毛をからかわれ、怒って石板で彼をたたいてしまいます。ギルバートが謝っても、アンは許そうとしません。勉強ではギルバートに負けまいと努力し、二人は成績を競うようになります。", "暮らしの中では失敗も起こります。アンは甘い飲み物と果実酒を取り違えてダイアナに出し、ダイアナの母に交際を禁じられます。しかし、ダイアナの幼い妹が病気になった夜、アンは子守の経験を生かして看病し、マシュウは医者を呼びに走ります。妹は助かり、母も誤解を認め、二人はまた遊べるようになります。時がたち、あるクリスマスには、マシュウがリンド夫人に仕立ててもらった、袖のふくらんだ茶色の服を贈ります。アンは、待ち望んだ服を受け取り、感激します。", "新しいステイシー先生は、アンの作文や朗読の力を伸ばし、進学も後押しします。数年の勉強を経て、アンとギルバートは同点首位でクイーン学院の入試に合格。アンは家を離れ、教師になるための勉強をします。一年で教員資格を取り、さらに大学へ進むための奨学金も得ました。マシュウとマリラは成長したアンを誇りに思い、アンも新しい将来を楽しみにします。", "ところが帰省後、もともと心臓の弱かったマシュウが、貯金を預けた銀行の破綻を知った朝に急死します。アンとマリラは、深い悲しみを分かち合います。マリラは目も悪くし、無理を続ければ失明すると告げられました。貯金も失い、一人では農場を続けられないと家を売ろうとします。そこでアンは大学進学を見送り、農場を貸し、教師として働きながらマリラと暮らす道を選びます。学ぶことまでやめるのではなく、自宅で勉強を続ける計画です。", "アンが家の近くで働きたいと知ったギルバートは、自分が教える予定だったアヴォンリーの学校の仕事を譲り、別の村で教えることにします。夕暮れの道で会ったアンは、自分から手を差し出して感謝を伝えます。長く意地を張ってきた二人は、ようやく友人になりました。思い描いた通りの進路ではなくても、大切な家を守り、人に支えられ、自分も人を支えながら学んでいく。アンは、まだ見えないこれからの暮らしに希望を持ちます。"], "summaryHeading": "要約", "links": ["lesmiserables", "uglyduckling"], "characterGallery": [{"name": "アン・シャーリー", "role": "十一歳でグリーン・ゲイブルズへ来る少女。想像力が豊かで、よく話す。物語の中で十六歳頃まで成長する。", "portraits": [{"src": "assets/anne-face-young.webp", "label": "来たころ・十一歳", "alt": "アン・シャーリー：来たころ・十一歳の人物イメージ", "width": 500, "height": 500}, {"src": "assets/anne-face-grown.webp", "label": "物語の終わり頃・十六歳", "alt": "アン・シャーリー：物語の終わり頃・十六歳の人物イメージ", "width": 500, "height": 500}], "wide": true}, {"name": "マシュウ・カスバート", "role": "マリラの兄。農場で働く、口数の少ない人。駅へアンを迎えに行き、温かく見守る。", "portraits": [{"src": "assets/anne-face-matthew.webp", "label": "アンを迎えたころ", "alt": "マシュウ・カスバート：アンを迎えたころの人物イメージ", "width": 500, "height": 500}]}, {"name": "マリラ・カスバート", "role": "マシュウの妹。兄と暮らし、アンを育てる。厳しく教えるが、自分の間違いも認める。", "portraits": [{"src": "assets/anne-face-marilla.webp", "label": "アンを育てる人", "alt": "マリラ・カスバート：アンを育てる人の人物イメージ", "width": 500, "height": 500}]}, {"name": "ダイアナ・バリー", "role": "アンの近所に住む同じ年頃の少女。アンと親友になる。", "portraits": [{"src": "assets/anne-face-diana.webp", "label": "アンの親友・子どものころ", "alt": "ダイアナ・バリー：アンの親友・子どものころの人物イメージ", "width": 500, "height": 500}]}, {"name": "ギルバート・ブライス", "role": "アンより少し年上の同級生。初めはアンを怒らせるが、勉強で競い合う相手になる。", "portraits": [{"src": "assets/anne-face-gilbert.webp", "label": "学校で出会ったころ", "alt": "ギルバート・ブライス：学校で出会ったころの人物イメージ", "width": 500, "height": 500}]}, {"name": "レイチェル・リンド夫人", "role": "カスバート兄妹の近所に住む女性。思ったことをはっきり言い、やがてアンを助ける。", "portraits": [{"src": "assets/anne-face-rachel.webp", "label": "近所のリンド夫人", "alt": "レイチェル・リンド夫人：近所のリンド夫人の人物イメージ", "width": 500, "height": 500}]}, {"name": "ステイシー先生", "role": "学校に新しく来る女性の先生。アンの学ぶ力を伸ばし、進学を励ます。", "portraits": [{"src": "assets/anne-face-stacy.webp", "label": "アンを教える先生", "alt": "ステイシー先生：アンを教える先生の人物イメージ", "width": 500, "height": 500}]}], "inlineIllustrations": [{"afterParagraph": 1, "src": "assets/anne-station-meeting-scene.webp", "alt": "男の子を迎えるはずだったマシュウ。駅で待つアンと出会い、ひとまず家へ連れ帰ります。", "caption": "男の子を迎えるはずだったマシュウ。駅で待つアンと出会い、ひとまず家へ連れ帰ります。", "width": 1200, "height": 800}, {"afterParagraph": 4, "src": "assets/anne-puffed-sleeves-gift-scene.webp", "alt": "マシュウから、待ち望んだ袖のふくらんだ服をもらうアン。日々の暮らしの中で、家族との結びつきが育ちます。", "caption": "マシュウから、待ち望んだ袖のふくらんだ服をもらうアン。日々の暮らしの中で、家族との結びつきが育ちます。", "width": 1200, "height": 800}, {"afterParagraph": 7, "src": "assets/anne-gilbert-friendship-scene.webp", "alt": "学校の仕事を譲ってくれたギルバートに、アンが手を差し出します。二人はようやく友人になります。", "caption": "学校の仕事を譲ってくれたギルバートに、アンが手を差し出します。二人はようやく友人になります。", "width": 1200, "height": 800}], "characterGalleryNote": "人物の顔立ちや衣服、建物などの細部は、作品の記述をもとにした創作です。アンの二つの姿は、同じ人物の子どものころと成長後を描き分けています。既存映画・アニメ・絵本のデザインを使用しません。", "image": "assets/anne-station-meeting-scene.webp", "imageAlt": "駅で十一歳のアンを迎えるマシュウ", "headerCaption": "男の子を迎えるはずだったマシュウ。駅で待つアンと出会い、ひとまず家へ連れ帰ります。"}, {"id": "hamlet", "name": "ハムレット", "reading": "はむれっと", "intro": "父を亡くしたデンマークの王子の前に、父の姿をした亡霊が現れます。叔父に殺されたという訴えは本当なのか。王子は周囲の言葉や振る舞いを疑い、真相を確かめようとします。", "gist": "父の死を確かめようとする王子が、復讐と疑いの中で周囲を傷つけ、自らも悲劇に巻き込まれる。", "bodyReadings": {"先王": "せんおう", "亡霊": "ぼうれい", "叔父": "おじ", "王妃": "おうひ", "再婚": "さいこん", "復讐": "ふくしゅう", "真相": "しんそう", "正気": "しょうき", "旧友": "きゅうゆう", "動揺": "どうよう", "上演": "じょうえん", "確信": "かくしん", "王位": "おうい", "処刑": "しょけい", "海賊": "かいぞく", "溺死": "できし", "葬儀": "そうぎ", "剣術": "けんじゅつ", "杯": "さかずき", "刃": "やいば", "統治者": "とうちしゃ", "仇": "かたき", "戯曲": "ぎきょく"}, "sources": [{"title": "Wikisource・第一フォリオ本文（1910年複製版の転記）", "url": "https://en.wikisource.org/wiki/Shakespeare_-_First_Folio_facsimile_(1910)/The_Tragedy_of_Hamlet"}, {"title": "Folger Shakespeare Library・1603年／1604–05年／1623年の版の違い", "url": "https://www.folger.edu/explore/shakespeares-works/hamlet/an-introduction-to-this-text/"}, {"title": "University of Victoria・第一フォリオ旧綴り転記（第4幕第2場の補助確認）", "url": "https://internetshakespeare.uvic.ca/doc/Ham_F1/"}], "sourceNote": "最初の刊本は1603年ですが、ここでは1623年の第一フォリオに収められた本文を扱います。参照したのは1910年Methuen社複製版のWikisource転記で、一部の幕・場の区分は後から補われています。取得できなかった第4幕第2場だけは、大学公開の同じ第一フォリオ本文の転記を補助に確認しました。現代日本語訳や映像版は用いず、この図鑑独自の日本語で解説しています。", "termNote": "戯曲は、舞台で演じるために台詞や動作を書いた作品です。先王は前の王、亡霊は亡くなった人の姿で現れる霊。ここでは作品中の出来事として説明しています。オフィーリアの死は王妃の報告などで伝えられ、本人の意図は断定していません。", "checkedDate": "2026年11月2日", "cat": "literature", "primaryCategory": "world-literature", "genreLabel": "海外文学", "genre": "world-classic", "motif": "book", "sub": "ウィリアム・シェイクスピア｜1603年初刊行／採用本文1623年版", "people": [["ハムレット", "デンマークの王子。亡くなった父の死の真相を調べ、叔父への復讐を考える。"], ["先王の亡霊", "ハムレットの父の姿をした霊。弟に殺されたと語り、息子に復讐を求める。"], ["クローディアス", "先王の弟で、ハムレットの叔父。新しい王となり、兄の妻だったガートルードと結婚した。"], ["ガートルード", "ハムレットの母である王妃。夫の死後、その弟クローディアスと再婚した。"], ["ホレイショー", "ハムレットが信頼する友人。王の反応を一緒に見届け、最後には真相を伝える役目を託される。"], ["オフィーリア", "ポローニアスの娘で、レアティーズの妹。ハムレットを思うが、父の指示と王子の言動に苦しむ。"], ["ポローニアス", "王に仕える年長の人物。オフィーリアとレアティーズの父。王子の様子を探ろうとする。"], ["レアティーズ", "ポローニアスの息子で、オフィーリアの兄。父を失い、ハムレットへの復讐を求める。"], ["ローゼンクランツとギルデンスターン", "ハムレットの旧友二人。王の依頼で王子の様子を探り、イングランド行きに付き添う。"], ["フォーティンブラス", "ノルウェーの王子。終幕でデンマークへ到着し、国を引き受けようとする。"]], "synopsisSummary": ["デンマークの王子ハムレットは、父である先王の死を悲しんでいます。父の弟クローディアスが新しい王となり、母ガートルードは、その叔父と早くも再婚しました。ある夜、友人ホレイショーに知らせを受けたハムレットの前に、父の姿をした亡霊が現れます。亡霊は、弟に殺されたと語り、復讐を求めます。ただし、母には手を下さないよう言い残します。", "ハムレットは、正気を失ったように振る舞いながら、叔父を探ろうとします。しかし、亡霊の言葉だけで殺人の真相を決めてよいのか、迷いもあります。王は王子の旧友ローゼンクランツとギルデンスターンを呼び、その様子を探らせます。王に仕えるポローニアスは、自分の娘オフィーリアへの恋が原因だと考えます。オフィーリアはハムレットと心を通わせていましたが、父の命令で手紙や訪問を断っていました。仕組まれた面会でハムレットから激しく拒まれ、彼女も苦しみます。", "旅の役者たちが来ると、ハムレットは、父が殺されたという話に似た劇を叔父に見せる計画を立てます。信頼するホレイショーにも、王の反応を見てほしいと頼みました。劇の途中、クローディアスは動揺して席を立ち、灯りを求めて退出し、上演は中断されます。ハムレットは疑いを確信へ変えます。その後、王は一人で兄殺しの罪を認めますが、王位や王妃を手放せず、本心から悔い改められません。祈る姿を見たハムレットは、今殺せば叔父を天国へ送ってしまうと考え、復讐を見送ります。", "次にハムレットは母の部屋へ行き、再婚を責めます。会話を盗み聞きしていたポローニアスが壁掛けの陰で声を上げると、ハムレットは相手を確かめずに刺し、殺してしまいます。叔父の罪を確かめようとしていた王子自身が、別の家族から父を奪ったのです。王はハムレットを危険と見なし、二人の旧友を付き添わせてイングランドへ送ります。その二人には、到着後ハムレットを処刑させる秘密の手紙を持たせていました。", "船の中で手紙を見つけたハムレットは、自分の代わりに手紙の運び手二人を処刑する内容へ書き換えます。翌日、船が海賊に襲われた際、ハムレットだけが相手の船へ乗り移って捕らわれます。海賊は見返りを期待して彼を助け、ハムレットはデンマークへ戻ります。二人の旧友はそのままイングランドへ向かい、後に処刑されたことが知らされます。", "その間、父を失ったオフィーリアは、まとまりのない話や歌を口にするようになります。兄レアティーズはフランスから戻り、父の死への復讐を求めます。さらに、妹が川で溺死したと王妃から知らされます。帰国したハムレットも葬儀で彼女の死を知り、レアティーズと激しく争います。クローディアスはレアティーズの怒りを利用し、剣術の試合を装ってハムレットを殺す計画を進めます。", "試合では、レアティーズの剣に毒が仕込まれ、王もハムレットのために毒入りの杯を用意していました。ところが、その杯を母ガートルードが飲んでしまいます。試合中には剣が入れ替わり、ハムレットとレアティーズの両方が毒のある刃で傷を負います。レアティーズは企みと王の責任を明かし、ハムレットはクローディアスを殺します。ハムレットとレアティーズは最後に互いの罪を許し合いますが、母もレアティーズもハムレットも命を失います。", "死の間際、ハムレットはホレイショーに、生きて真相を伝えてほしいと頼みます。また、ノルウェーの王子フォーティンブラスを次の統治者として支持する意志を残します。到着したフォーティンブラスに、ホレイショーは何が起きたのかを説明しようとします。父の仇は討たれても、大切な人々は戻りません。残された人が、悲劇の事情と国のこれからを引き受けるところで幕が閉じます。"], "summaryHeading": "要約", "links": ["shakespeare", "romeoandjuliet"], "characterGallery": [{"name": "ハムレット", "role": "デンマークの王子。亡くなった父の死の真相を調べ、叔父への復讐を考える。", "portraits": [{"src": "assets/hamlet-face-hamlet.webp", "label": "父の死後・喪服の王子", "alt": "ハムレットの人物イメージ", "width": 500, "height": 500}]}, {"name": "先王の亡霊", "role": "ハムレットの父の姿をした霊。弟に殺されたと語り、息子に復讐を求める。", "portraits": [{"src": "assets/hamlet-face-ghost.webp", "label": "父の姿で現れる霊", "alt": "先王の亡霊の人物イメージ", "width": 500, "height": 500}]}, {"name": "クローディアス", "role": "先王の弟で、ハムレットの叔父。新しい王となり、兄の妻だったガートルードと結婚した。", "portraits": [{"src": "assets/hamlet-face-claudius.webp", "label": "叔父・現在の王", "alt": "クローディアスの人物イメージ", "width": 500, "height": 500}]}, {"name": "ガートルード", "role": "ハムレットの母である王妃。夫の死後、その弟クローディアスと再婚した。", "portraits": [{"src": "assets/hamlet-face-gertrude.webp", "label": "母・王妃", "alt": "ガートルードの人物イメージ", "width": 500, "height": 500}]}, {"name": "ホレイショー", "role": "ハムレットが信頼する友人。王の反応を一緒に見届け、最後には真相を伝える役目を託される。", "portraits": [{"src": "assets/hamlet-face-horatio.webp", "label": "王子が信頼する友人", "alt": "ホレイショーの人物イメージ", "width": 500, "height": 500}]}, {"name": "オフィーリア", "role": "ポローニアスの娘で、レアティーズの妹。ハムレットを思うが、父の指示と王子の言動に苦しむ。", "portraits": [{"src": "assets/hamlet-face-ophelia.webp", "label": "ポローニアスの娘", "alt": "オフィーリアの人物イメージ", "width": 500, "height": 500}]}, {"name": "ポローニアス", "role": "王に仕える年長の人物。オフィーリアとレアティーズの父。王子の様子を探ろうとする。", "portraits": [{"src": "assets/hamlet-face-polonius.webp", "label": "オフィーリアとレアティーズの父", "alt": "ポローニアスの人物イメージ", "width": 500, "height": 500}]}, {"name": "レアティーズ", "role": "ポローニアスの息子で、オフィーリアの兄。父を失い、ハムレットへの復讐を求める。", "portraits": [{"src": "assets/hamlet-face-laertes.webp", "label": "オフィーリアの兄", "alt": "レアティーズの人物イメージ", "width": 500, "height": 500}]}, {"name": "ローゼンクランツとギルデンスターン", "role": "ハムレットの旧友二人。王の依頼で王子の様子を探り、イングランド行きに付き添う。", "portraits": [{"src": "assets/hamlet-face-oldfriends.webp", "label": "左：ローゼンクランツ／右：ギルデンスターン", "alt": "ローゼンクランツとギルデンスターンの人物イメージ", "width": 500, "height": 500}], "wide": true}, {"name": "フォーティンブラス", "role": "ノルウェーの王子。終幕でデンマークへ到着し、国を引き受けようとする。", "portraits": [{"src": "assets/hamlet-face-fortinbras.webp", "label": "ノルウェーの王子", "alt": "フォーティンブラスの人物イメージ", "width": 500, "height": 500}]}], "inlineIllustrations": [{"afterParagraph": 1, "src": "assets/hamlet-father-ghost-scene.webp", "alt": "父の姿をした亡霊から、叔父に殺されたという訴えを聞くハムレット。真相を確かめる出発点です。", "caption": "父の姿をした亡霊から、叔父に殺されたという訴えを聞くハムレット。真相を確かめる出発点です。", "width": 1200, "height": 800}, {"afterParagraph": 3, "src": "assets/hamlet-play-interrupted-scene.webp", "alt": "父の死に似た劇を見て、叔父の王が席を立ちます。ハムレットとホレイショーは、その反応を見届けます。", "caption": "父の死に似た劇を見て、叔父の王が席を立ちます。ハムレットとホレイショーは、その反応を見届けます。", "width": 1200, "height": 800}, {"afterParagraph": 8, "src": "assets/hamlet-horatio-testimony-scene.webp", "alt": "ホレイショーは、到着したノルウェーの王子に事情を伝えようとします。ハムレットに託された、真相を残す役目です。", "caption": "ホレイショーは、到着したノルウェーの王子に事情を伝えようとします。ハムレットに託された、真相を残す役目です。", "width": 1200, "height": 800}], "characterGalleryNote": "人物の顔立ちや衣服、城内などの細部は、作品の記述をもとにした創作です。旧友二人のカードは、左右の人物を見分けるための紹介図です。", "image": "assets/hamlet-father-ghost-scene.webp", "imageAlt": "父の姿をした亡霊の訴えを聞くハムレット", "headerCaption": "父の姿をした亡霊から、叔父に殺されたという訴えを聞くハムレット。真相を確かめる出発点です。"}, {"id": "tom-sawyer", "name": "トム・ソーヤーの冒険", "reading": "とむそーやーのぼうけん", "intro": "川沿いの町で暮らすトムは、いたずらと冒険が大好き。友達と遊ぶ毎日の中で、本当の事件に巻き込まれ、秘密を守る怖さと、人を助ける勇気に向き合います。", "gist": "塀塗りを遊びに変える少年が、事件の証言や洞窟での危機を通して、人を助けるために行動する。", "bodyReadings": {"冒険": "ぼうけん", "塀": "へい", "罰": "ばつ", "墓地": "ぼち", "医師": "いし", "仕返し": "しかえし", "海賊": "かいぞく", "葬儀": "そうぎ", "裁判": "さいばん", "無実": "むじつ", "証人": "しょうにん", "復讐": "ふくしゅう", "廃屋": "はいおく", "金貨": "きんか", "危害": "きがい", "洞窟": "どうくつ", "凧": "たこ", "判事": "はんじ", "十字": "じゅうじ", "行儀": "ぎょうぎ", "憧れ": "あこがれ", "皮肉": "ひにく"}, "sources": [{"title": "Wikisource・1876年米国版の本文と序文", "url": "https://en.wikisource.org/wiki/The_Adventures_of_Tom_Sawyer"}, {"title": "Mark Twain House & Museum・作者の生涯", "url": "https://marktwainhouse.org/about/mark-twain/biography/"}], "sourceNote": "1876年の英語小説。参照したのは同年の米国版（The American Publishing Companyほか）のWikisource転記です。著作権表示の1875年と刊行年は区別しています。続編やアニメ、現代日本語訳の文章は使わず、原作をもとにこの図鑑独自の日本語で紹介しています。", "termNote": "判事は裁判に関わる役人です。物語の町は、作者が少年時代を過ごした土地をもとにした架空の町。原作には当時の奴隷制や、先住民への差別的な呼び方・描写があります。ここで「ジョー」と呼ぶ大人は、原作ではInjun Joeと記される人物で、少年のジョー・ハーパーとは別人です。人物の行為を民族全体の性質と結び付けてはいません。", "checkedDate": "2026年11月2日", "cat": "literature", "primaryCategory": "world-literature", "genreLabel": "海外文学", "genre": "world-classic", "motif": "book", "sub": "マーク・トウェイン｜1876年初刊行", "people": [["トム・ソーヤー", "ポリーおばさんに育てられる少年。いたずらと冒険が好きだが、人を助けるために怖さと向き合う。"], ["ハックルベリー・フィン（ハック）", "トムの友達。学校や家の決まりから離れて暮らす少年。トムと事件を目撃し、宝を探す。"], ["ベッキー・サッチャー", "トムが好きになる少女。サッチャー判事の娘。トムと洞窟で道に迷う。"], ["ポリーおばさん", "トムの亡くなった母の姉妹。トムを育て、厳しく叱りながら心配する。"], ["ジョー・ハーパー", "トムの学校の友達。トムとハックと三人で島へ行く。事件を起こす大人のジョーとは別人。"], ["マフ・ポッター", "少年たちに親切にしてきた男性。自分のしていない殺人の疑いをかけられる。"], ["ジョー", "医師を殺し、ポッターに罪を着せる男性。トムが恐れる相手で、宝を隠している。"], ["ダグラス夫人", "ハックに親切にする女性。夫を亡くしている。後にハックを家に迎える。"], ["サッチャー判事", "ベッキーの父。娘を捜し、救出後は再び人が迷わないよう洞窟の入口を閉ざす。"]], "synopsisSummary": ["アメリカのミシシッピ川沿いの町で、少年トムは、亡くなった母の姉妹であるポリーおばさんに育てられています。学校や決まり事より遊びが好きで、叱られてばかりです。ある土曜日、罰として塀を白く塗るよう言われると、わざと面白そうに働きます。友達は自分もやりたくなり、品物を渡して順番を待つようになりました。トムには、退屈な仕事さえ冒険に変えてしまう知恵があります。", "トムは少女ベッキーに心を引かれ、自由に暮らす少年ハックとも遊びます。ある夜、トムとハックは墓地で、ジョーという男が医師を殺すところを見てしまいます。ところが疑われたのは、その場で気を失っていたマフ・ポッターでした。ジョーは罪をポッターになすりつけます。二人は仕返しを恐れ、見たことを秘密にすると誓いますが、以前から親切にしてくれたポッターが捕まり、トムは心苦しくなります。", "その後トムは、友達のジョー・ハーパーとハックを誘って、川の島で海賊ごっこを始めます。町では三人が溺れたと思われ、家族は悲しみます。ひそかに家へ戻ったトムは、ポリーおばさんが自分を思って泣く姿を見ました。それでもすぐには名乗り出ず、三人で自分たちの葬儀に現れて皆を驚かせます。楽しい冒険の裏で、人をどれほど心配させたかが見えてきます。", "やがてポッターの裁判が始まります。黙っていれば、無実の人が罪に問われてしまいます。トムは恐れを押し切って証人となり、墓地で見た出来事を話します。犯人のジョーは窓から逃げ、ポッターは救われました。トムは町で褒められますが、逃げたジョーの復讐を恐れ、夜は不安を感じ続けます。勇気を出したからといって、怖さがすぐ消えるわけではありません。", "別の日、宝探しをしていたトムとハックは、廃屋でジョーと仲間が金貨の箱を見つけるところを目撃します。二人の男は宝を別の場所へ運び、少年たちは行方を追います。夜の見張りをしていたハックは、ジョーがダグラス夫人に危害を加えようとしていると知ります。親切にしてくれた夫人を助けるため、近所の大人とその息子たちへ知らせました。男たちは追い払われ、夫人は助かります。", "同じころ、遠足で洞窟に入ったトムとベッキーは、仲間から離れて道に迷います。食べ物も灯りも乏しくなり、町の人たちは二人を捜し続けます。トムは凧の糸を目印に通路を調べ、洞窟に隠れていたジョーも見かけます。それでも別の道を探し、とうとう小さな出口から外の光を見つけました。ベッキーを連れ出し、川を通る舟の人たちに助けられて、二人は町へ帰ります。", "再び人が迷わないよう、ベッキーの父サッチャー判事は洞窟の入口を閉ざしていました。そのことを聞いたトムがジョーの存在を知らせますが、扉を開けた時にはジョーは中で亡くなっていました。トムは、男が隠した宝も洞窟にあると気づきます。ハックと小さな出口から入り直し、十字の印を手掛かりに箱を見つけ、金を持ち帰りました。二人は宝を半分ずつ分け、町の大人たちから注目されます。", "ハックはダグラス夫人の家に迎えられます。しかし、時間や服装を細かく決められる生活になじめず、逃げ出してしまいました。トムはハックを見つけ、戻れば新しい盗賊ごっこの仲間にすると誘います。ハックはもうしばらく試すことにし、トムも夫人に決まりを緩めてほしいと頼む約束をします。宝を得て立派な大人になったところで終わるのではありません。遊びを夢見る少年たちと、周囲の暮らしとの折り合いが続いていく結末です。"], "summaryHeading": "要約", "links": ["treasure-island", "anne-green-gables"], "characterGallery": [{"name": "トム・ソーヤー", "role": "ポリーおばさんに育てられる少年。いたずらと冒険が好きだが、人を助けるために怖さと向き合う。", "portraits": [{"src": "assets/tom-face-tom.webp", "label": "少年時代", "alt": "トム・ソーヤーの人物イメージ", "width": 500, "height": 500}]}, {"name": "ハックルベリー・フィン（ハック）", "role": "トムの友達。学校や家の決まりから離れて暮らす少年。トムと事件を目撃し、宝を探す。", "portraits": [{"src": "assets/tom-face-huck.webp", "label": "夫人の家へ迎えられる前", "alt": "ハックルベリー・フィン（ハック）の人物イメージ", "width": 500, "height": 500}]}, {"name": "ベッキー・サッチャー", "role": "トムが好きになる少女。サッチャー判事の娘。トムと洞窟で道に迷う。", "portraits": [{"src": "assets/tom-face-becky.webp", "label": "トムと同じ学校の少女", "alt": "ベッキー・サッチャーの人物イメージ", "width": 500, "height": 500}]}, {"name": "ポリーおばさん", "role": "トムの亡くなった母の姉妹。トムを育て、厳しく叱りながら心配する。", "portraits": [{"src": "assets/tom-face-polly.webp", "label": "トムを育てる叔母", "alt": "ポリーおばさんの人物イメージ", "width": 500, "height": 500}]}, {"name": "ジョー・ハーパー", "role": "トムの学校の友達。トムとハックと三人で島へ行く。事件を起こす大人のジョーとは別人。", "portraits": [{"src": "assets/tom-face-joeharper.webp", "label": "学校の友達", "alt": "ジョー・ハーパーの人物イメージ", "width": 500, "height": 500}]}, {"name": "マフ・ポッター", "role": "少年たちに親切にしてきた男性。自分のしていない殺人の疑いをかけられる。", "portraits": [{"src": "assets/tom-face-potter.webp", "label": "殺人の疑いをかけられる男性", "alt": "マフ・ポッターの人物イメージ", "width": 500, "height": 500}]}, {"name": "ジョー", "role": "医師を殺し、ポッターに罪を着せる男性。トムが恐れる相手で、宝を隠している。", "portraits": [{"src": "assets/tom-face-joe.webp", "label": "事件を起こす成人男性", "alt": "ジョーの人物イメージ", "width": 500, "height": 500}]}, {"name": "ダグラス夫人", "role": "ハックに親切にする女性。夫を亡くしている。後にハックを家に迎える。", "portraits": [{"src": "assets/tom-face-douglas.webp", "label": "ハックを迎える女性", "alt": "ダグラス夫人の人物イメージ", "width": 500, "height": 500}]}, {"name": "サッチャー判事", "role": "ベッキーの父。娘を捜し、救出後は再び人が迷わないよう洞窟の入口を閉ざす。", "portraits": [{"src": "assets/tom-face-thatcher.webp", "label": "ベッキーの父", "alt": "サッチャー判事の人物イメージ", "width": 500, "height": 500}]}], "inlineIllustrations": [{"afterParagraph": 1, "src": "assets/tom-whitewash-scene.webp", "alt": "塀塗りを楽しそうに見せるトム。友達は自分もやりたいと思い始めます。", "caption": "塀塗りを楽しそうに見せるトム。友達は自分もやりたいと思い始めます。", "width": 1200, "height": 800}, {"afterParagraph": 4, "src": "assets/tom-court-testimony-scene.webp", "alt": "トムは仕返しを恐れながらも、ポッターを救うために見たことを話します。", "caption": "トムは仕返しを恐れながらも、ポッターを救うために見たことを話します。", "width": 1200, "height": 800}, {"afterParagraph": 6, "src": "assets/tom-becky-cave-exit-scene.webp", "alt": "別の出口を見つけたトムは、ベッキーを洞窟から連れ出します。", "caption": "別の出口を見つけたトムは、ベッキーを洞窟から連れ出します。", "width": 1200, "height": 800}], "characterGalleryNote": "人物の顔や衣服、建物の細部は原作をもとにした創作です。挿絵は本文の場面を理解しやすくするために描いています。", "image": "assets/tom-whitewash-scene.webp", "imageAlt": "塀を白く塗るトムと、興味深そうに見る友達", "headerCaption": "塀塗りを楽しそうに見せるトム。友達は自分もやりたいと思い始めます。"}, {"id": "little-princess", "name": "小公女", "reading": "しょうこうじょ", "intro": "父に愛され、ロンドンの学校で暮らす少女セーラ。父の死の知らせで暮らしが一変しても、物語を空想する力と友達とのつながりを支えに、自分らしさを守ろうとします。", "gist": "財産を失って働かされる少女が、支え合う友達と人々の援助によって居場所を取り戻し、助けを次の人へつなぐ。", "bodyReadings": {"小公女": "しょうこうじょ", "寄宿学校": "きしゅくがっこう", "裕福": "ゆうふく", "財産": "ざいさん", "学費": "がくひ", "屋根裏": "やねうら", "空想": "くうそう", "空腹": "くうふく", "銀貨": "ぎんか", "鉱山": "こうざん", "投資": "とうし", "回復": "かいふく", "弁護士": "べんごし", "猿": "さる", "暖炉": "だんろ", "寝具": "しんぐ", "援助": "えんじょ", "判明": "はんめい", "保護者": "ほごしゃ", "交流": "こうりゅう", "請求": "せいきゅう", "階級": "かいきゅう", "植民地": "しょくみんち"}, "sources": [{"title": "Wikisource・小公女（1917年版、刊記・作者序文・全19章）", "url": "https://en.wikisource.org/wiki/A_Little_Princess"}, {"title": "English Heritage・バーネットの生涯", "url": "https://www.english-heritage.org.uk/visit/blue-plaques/frances-hodgson-burnett/"}], "sourceNote": "1905年に刊行された長編版を扱います。参照したのはCharles Scribner’s Sonsの1917年版のWikisource転記。1888年の短い物語をもとに、舞台化を経て人物や出来事を加えた長編であることを、作者の序文でも説明しています。現代日本語訳やアニメの文章・設定は使わず、独自の日本語で紹介しています。", "termNote": "寄宿学校は、子供が住みながら学ぶ学校です。「小公女」は題名で、セーラが本当の王族という意味ではありません。キャリスフォードは父の友人で、セーラの実の叔父ではありません。原作で「インドの紳士」と呼ばれますが、インドから戻った英国人です。", "checkedDate": "2026年11月2日", "cat": "literature", "primaryCategory": "world-literature", "genreLabel": "海外文学", "genre": "world-classic", "motif": "book", "sub": "フランシス・ホジソン・バーネット｜1905年初刊行", "people": [["セーラ・クルー", "七歳で寄宿学校に入り、十一歳で父を失う少女。物語を空想する力と、人への思いやりを支えに暮らす。"], ["ラルフ・クルー", "セーラの父。インドで暮らす裕福な軍人。娘を大切にし、ロンドンの学校に預ける。"], ["ミンチン先生", "寄宿学校を経営する女性。セーラの父が亡くなると、学費のない彼女を働かせる。"], ["ベッキー", "学校で働く、セーラより年上の少女。屋根裏でつらさを分かち合う友達になる。"], ["アーメンガード", "セーラの学校の友達。勉強ではセーラに助けられ、苦しい時には彼女を支える。"], ["キャリスフォード", "セーラの父の友人。父と共同で投資した男性で、インドから戻り学校の隣に住む。"], ["ラム・ダス", "キャリスフォードに仕えるインド人男性。セーラの暮らしを知り、屋根裏への援助を考えて実行する。"], ["カーマイケル", "キャリスフォードから頼まれ、父を失った少女を捜す弁護士。"], ["ブラウン夫人", "パン屋の店主。セーラにパンを多く渡し、困っている少女にも住む場所を用意する。"], ["アン", "パン屋の前でセーラからパンを分けてもらう少女。後にブラウン夫人の店で暮らし、働く。"]], "synopsisSummary": ["七歳のセーラ・クルーは、インドで暮らす父ラルフに連れられ、ロンドンのミンチン先生の寄宿学校へ入ります。母はすでに亡くなっていました。裕福な父は、娘の部屋や服、人形を十分に用意してからインドへ帰ります。セーラは父との別れを寂しく思いながらも、本や物語を楽しみ、友達を作っていきます。", "セーラは、勉強が苦手なアーメンガードや、学校で働く少女ベッキーにも親しく接します。豪華な服を着るだけでなく、誰に対しても親切で心の強い「王女」でありたいと考えるのです。ところが十一歳の誕生日、父が事業で財産を失い、病気で亡くなったと知らされます。学費を払う人がいなくなり、それまでセーラを特別扱いしていたミンチン先生の態度は一変します。", "セーラは屋根裏の寒い部屋へ移され、掃除や使い走りをし、年下の子に勉強を教えるよう命じられます。食事も十分ではありません。それでも、物語を空想し、同じように働かされるベッキーと励まし合い、訪ねてくるアーメンガードとの友情を守ります。つらさに耐えきれず涙を流すこともあり、空想だけで寒さや空腹をなくせるわけではありません。", "ある寒い雨の日、空腹のセーラは道で四ペンスの銀貨を拾います。パン屋で落とし物ではないか尋ねてからパンを買うと、店主のブラウン夫人は、四個の代金で六個を渡してくれます。店先には、もっとお腹をすかせた少女がいました。セーラは自分の分を一個だけ残し、五個を少女に分けます。その様子を見た夫人も心を動かされ、少女を店へ招き入れます。", "一方、学校の隣には、インドから戻ったキャリスフォードという男性が住んでいました。彼はセーラの父と事業をした友人です。鉱山への投資が失敗したと思い込み、父の前から姿を消して病気になりましたが、実際には鉱山の価値が明らかになり、財産は回復していました。父の死後、キャリスフォードは弁護士カーマイケルに頼んで娘を捜します。しかしパリの学校にいると思い込み、隣の少女こそセーラだとは知りません。", "キャリスフォードに仕えるラム・ダスは、逃げた猿を追ってセーラの屋根裏へ入り、貧しい暮らしを知っていました。彼の話を聞いたキャリスフォードは、少女をそっと助ける計画に加わります。ある夜、眠っていたセーラが目覚めると、暖炉に火がともり、暖かな寝具と食事が置かれていました。魔法のような変化ですが、ラム・ダスたちが運び込んだものです。セーラは誰かが気にかけてくれる喜びを感じ、ベッキーと分け合います。", "やがて猿がまた部屋へ来たため、セーラは隣へ返しに行きます。キャリスフォードと話すうち、父の名前やインドでの暮らしが分かり、ついに探していた娘だと判明しました。財産はセーラのものとして戻り、キャリスフォードが保護者になります。ミンチン先生は学校へ戻るよう求めますが、セーラは断ります。ベッキーも付き添い役として新しい家へ迎えられ、友達との交流も続きます。", "暮らしが豊かになっても、セーラは自分が空腹だった日を忘れません。ブラウン夫人の店を再び訪ね、困っている子にパンを渡し、代金は自分に請求してほしいと頼みます。以前助けた少女アンは、すでに夫人から住む場所と仕事をもらっていました。セーラはアンと手を取り合い、今度はアンが子供たちにパンを渡す役をしてはどうかと提案します。自分が救われただけで終わらず、その先へ助けをつなげようとする結末です。"], "summaryHeading": "要約", "links": ["anne-green-gables", "cinderella"], "characterGallery": [{"name": "セーラ・クルー", "role": "七歳で寄宿学校に入り、十一歳で父を失う少女。物語を空想する力と、人への思いやりを支えに暮らす。", "wide": true, "portraits": [{"src": "assets/princess-face-young.webp", "label": "入学した七歳のころ", "alt": "セーラ・クルーの人物イメージ", "width": 500, "height": 500}, {"src": "assets/princess-face-later.webp", "label": "父を失った後、十二〜十三歳ごろ", "alt": "セーラ・クルーの人物イメージ", "width": 500, "height": 500}]}, {"name": "ラルフ・クルー", "role": "セーラの父。インドで暮らす裕福な軍人。娘を大切にし、ロンドンの学校に預ける。", "wide": false, "portraits": [{"src": "assets/princess-face-ralph.webp", "label": "セーラの父", "alt": "ラルフ・クルーの人物イメージ", "width": 500, "height": 500}]}, {"name": "ミンチン先生", "role": "寄宿学校を経営する女性。セーラの父が亡くなると、学費のない彼女を働かせる。", "wide": false, "portraits": [{"src": "assets/princess-face-minchin.webp", "label": "学校を経営する女性", "alt": "ミンチン先生の人物イメージ", "width": 500, "height": 500}]}, {"name": "ベッキー", "role": "学校で働く、セーラより年上の少女。屋根裏でつらさを分かち合う友達になる。", "wide": false, "portraits": [{"src": "assets/princess-face-becky.webp", "label": "セーラより年上の友達", "alt": "ベッキーの人物イメージ", "width": 500, "height": 500}]}, {"name": "アーメンガード", "role": "セーラの学校の友達。勉強ではセーラに助けられ、苦しい時には彼女を支える。", "wide": false, "portraits": [{"src": "assets/princess-face-ermengarde.webp", "label": "学校の友達", "alt": "アーメンガードの人物イメージ", "width": 500, "height": 500}]}, {"name": "キャリスフォード", "role": "セーラの父の友人。父と共同で投資した男性で、インドから戻り学校の隣に住む。", "wide": false, "portraits": [{"src": "assets/princess-face-carrisford.webp", "label": "父の友人・後の保護者", "alt": "キャリスフォードの人物イメージ", "width": 500, "height": 500}]}, {"name": "ラム・ダス", "role": "キャリスフォードに仕えるインド人男性。セーラの暮らしを知り、屋根裏への援助を考えて実行する。", "wide": false, "portraits": [{"src": "assets/princess-face-ramdass.webp", "label": "隣家で働く男性", "alt": "ラム・ダスの人物イメージ", "width": 500, "height": 500}]}, {"name": "カーマイケル", "role": "キャリスフォードから頼まれ、父を失った少女を捜す弁護士。", "wide": false, "portraits": [{"src": "assets/princess-face-carmichael.webp", "label": "少女を捜す弁護士", "alt": "カーマイケルの人物イメージ", "width": 500, "height": 500}]}, {"name": "ブラウン夫人", "role": "パン屋の店主。セーラにパンを多く渡し、困っている少女にも住む場所を用意する。", "wide": false, "portraits": [{"src": "assets/princess-face-brown.webp", "label": "パン屋の店主", "alt": "ブラウン夫人の人物イメージ", "width": 500, "height": 500}]}, {"name": "アン", "role": "パン屋の前でセーラからパンを分けてもらう少女。後にブラウン夫人の店で暮らし、働く。", "wide": false, "portraits": [{"src": "assets/princess-face-anne.webp", "label": "パン屋で暮らすようになった少女", "alt": "アンの人物イメージ", "width": 500, "height": 500}]}], "inlineIllustrations": [{"afterParagraph": 1, "src": "assets/princess-london-arrival-scene.webp", "alt": "七歳のセーラは、父と一緒にロンドンの学校へ向かいます。", "caption": "七歳のセーラは、父と一緒にロンドンの学校へ向かいます。", "width": 1200, "height": 800}, {"afterParagraph": 4, "src": "assets/princess-sharing-buns-scene.webp", "alt": "自分も空腹のセーラは、もらったパン六個のうち五個を、店先の少女に分けます。", "caption": "自分も空腹のセーラは、もらったパン六個のうち五個を、店先の少女に分けます。", "width": 1200, "height": 800}, {"afterParagraph": 7, "src": "assets/princess-identity-discovered-scene.webp", "alt": "父の名前を聞き、キャリスフォードは、隣の少女が捜していたセーラだと知ります。", "caption": "父の名前を聞き、キャリスフォードは、隣の少女が捜していたセーラだと知ります。", "width": 1200, "height": 800}], "characterGalleryNote": "人物の顔や服、室内の細部は作品をもとにした創作です。セーラは、入学したころと、父を失った後の姿を分けて示しています。", "image": "assets/princess-london-arrival-scene.webp", "imageAlt": "父と馬車に乗り、ロンドンの学校へ向かう七歳のセーラ", "headerCaption": "七歳のセーラは、父と一緒にロンドンの学校へ向かいます。"}, {"id": "little-match-girl", "name": "マッチ売りの少女", "reading": "まっちうりのしょうじょ", "intro": "雪の降る大みそか、マッチを売る少女は、明かりのともる家々の外を歩きます。小さな炎に浮かぶ光景を通して、少女が本当に求めていたものが見えてくる物語です。", "gist": "マッチの光に暖かさや食事、祖母の姿を見る少女。心の中の安らぎと、助けの届かない現実を描く。", "bodyReadings": {"少女": "しょうじょ", "大みそか": "おおみそか", "祖母": "そぼ", "空腹": "くうふく", "履物": "はきもの", "馬車": "ばしゃ", "裸足": "はだし", "二軒": "にけん", "売上げ": "うりあげ", "隙間": "すきま", "炎": "ほのお", "食卓": "しょくたく", "魂": "たましい", "神様": "かみさま", "翌朝": "よくあさ", "現実": "げんじつ", "結末": "けつまつ"}, "sources": [{"title": "Wikisource・Paull英訳「The Little Match-seller」全文", "url": "https://en.wikisource.org/wiki/Hans_Andersen's_Fairy_Tales/The_Little_Match-seller"}, {"title": "Wikisource・英訳集の標題紙と翻訳者", "url": "https://en.wikisource.org/wiki/Hans_Andersen's_Fairy_Tales"}, {"title": "南デンマーク大学アンデルセン研究センター・初刊情報", "url": "https://andersen.sdu.dk/vaerk/register/info_e.html?vid=79"}, {"title": "Project Gutenberg・Paullの生没年書誌", "url": "https://www.gutenberg.org/ebooks/34794"}], "sourceNote": "初刊は1845年12月。ここでは、Mrs. H. B. Paullによる英訳を収めた1888年版として登録されるHans Andersen’s Fairy Talesの本文を参照し、独自の日本語で紹介しています。現代日本語訳や映像作品の文章・図柄は使っていません。", "termNote": "舞台はクリスマスの夜ではなく、大みそかです。流れ星と魂の話は、物語の中で祖母が語った信仰上の言い伝えで、天文学の説明ではありません。", "checkedDate": "2026年11月2日", "cat": "literature", "primaryCategory": "world-fairytale", "genreLabel": "世界の童話（アンデルセン）", "genre": "world-fairytale", "motif": "book", "sub": "ハンス・クリスチャン・アンデルセン｜1845年初刊行", "people": [["マッチ売りの少女", "名前や正確な年齢は書かれていない幼い少女。大みそかに、寒い町でマッチを売っている。"], ["祖母", "すでに亡くなっている、少女を愛してくれた人。マッチの光の中に姿を現す。"], ["父", "少女の父。売上げを持ち帰れなければたたかれる、と少女が恐れている相手。"], ["町の人々", "少女を通りで助けることがないまま、翌朝、その死を知る人々。"]], "synopsisSummary": ["一年の最後の日、雪の降る町を、小さな少女がマッチを売って歩いています。家を出た時には母の大きな履物を履いていましたが、馬車を避けるうちに失い、今は裸足です。一日中、誰もマッチを買わず、お金もくれません。家々の窓には明かりがともり、ごちそうのにおいがしますが、少女は寒さと空腹の中に取り残されています。", "少女は二軒の家の間に座り込みます。売上げがないまま帰れば父に叱られ、たたかれるのが怖いのです。それに、屋根の隙間から風が入る家も暖かくありません。手を暖めようとマッチを一本すると、炎の中に大きなストーブが見える気がしました。けれど火が消えると、ストーブも消え、手には燃え残りだけが残ります。", "次のマッチでは、白い布をかけた食卓と、湯気の立つガチョウの料理が現れます。料理が自分の方へ歩いてくるように見えますが、炎が消えると、また冷たい壁だけになりました。さらに火をつけると、今度はたくさんの明かりを飾ったクリスマスツリーが見えます。その明かりは空の星のようになり、一つの星が流れます。少女は、星が落ちると誰かの魂が神様のもとへ行くという、亡くなった祖母の話を思い出します。", "もう一度マッチをすると、今度は、かつて自分を愛してくれた祖母が光の中に現れます。少女は祖母まで消えてしまうのが悲しくて、そばにいてほしいと願い、残りの束にも火をつけます。祖母は少女を抱き上げ、二人は寒さも空腹もない神様のもとへ昇っていった、と物語は語ります。これは、通りで誰かが少女を助け、暖かい家へ連れ帰ったという出来事ではありません。", "新年の朝、町の人々が見つけた少女は、寒さの中で亡くなっていました。そばには燃えたマッチが残っています。人々は暖まろうとしたのだろうと考えますが、少女がどんな光景を見て、どれほど祖母に会いたかったかは知りません。少女の内側に広がった温かな光景と、現実には助けが届かなかったことが、並べて描かれる結末です。"], "summaryHeading": "要約", "links": ["andersen", "mermaid", "uglyduckling"], "characterGallery": [{"name": "マッチ売りの少女", "role": "名前や正確な年齢は書かれていない幼い少女。大みそかに、寒い町でマッチを売っている。", "wide": false, "portraits": [{"src": "assets/matchgirl-face-girl.webp", "label": "大みそかの少女", "alt": "マッチ売りの少女の人物イメージ", "width": 500, "height": 500}]}, {"name": "祖母", "role": "すでに亡くなっている、少女を愛してくれた人。マッチの光の中に姿を現す。", "wide": false, "portraits": [{"src": "assets/matchgirl-face-grandmother.webp", "label": "光の中に現れる祖母", "alt": "祖母の人物イメージ", "width": 500, "height": 500}]}, {"name": "父", "role": "少女の父。売上げを持ち帰れなければたたかれる、と少女が恐れている相手。", "wide": false, "portraits": [{"src": "assets/matchgirl-face-father.webp", "label": "少女が恐れる父", "alt": "父の人物イメージ", "width": 500, "height": 500}]}, {"name": "町の人々", "role": "少女を通りで助けることがないまま、翌朝、その死を知る人々。", "wide": false, "portraits": [{"src": "assets/matchgirl-face-townspeople.webp", "label": "翌朝の人々の代表像", "alt": "町の人々の人物イメージ", "width": 500, "height": 500}]}], "inlineIllustrations": [{"afterParagraph": 1, "src": "assets/matchgirl-unsold-street-scene.webp", "alt": "大みそかの町。少女のマッチは売れず、家々には明かりがともっています。", "caption": "大みそかの町。少女のマッチは売れず、家々には明かりがともっています。", "width": 1200, "height": 800}, {"afterParagraph": 2, "src": "assets/matchgirl-stove-vision-scene.webp", "alt": "マッチの炎に、大きなストーブが見える気がします。火が消えると、その姿も消えます。", "caption": "マッチの炎に、大きなストーブが見える気がします。火が消えると、その姿も消えます。", "width": 1200, "height": 800}, {"afterParagraph": 4, "src": "assets/matchgirl-grandmother-vision-scene.webp", "alt": "光の中で、少女は大好きだった祖母に抱かれます。物語が語る幻の場面です。", "caption": "光の中で、少女は大好きだった祖母に抱かれます。物語が語る幻の場面です。", "width": 1200, "height": 800}], "characterGalleryNote": "人物の顔や服、町の細部は作品をもとにした創作です。町の人々は代表的なイメージで、人数は原作で決まっていません。ストーブと祖母の絵は、少女が光の中に見る場面を表しています。", "image": "assets/matchgirl-unsold-street-scene.webp", "imageAlt": "大みそかの町。少女のマッチは売れず、家々には明かりがともっています。", "headerCaption": "大みそかの町。少女のマッチは売れず、家々には明かりがともっています。"}, {"id": "daddy-long-legs", "name": "あしながおじさん", "reading": "あしながおじさん", "intro": "施設で育ったジュディに、名前を明かさない男性から大学への進学援助が届きます。条件は、毎月手紙を書くこと。学び、友達、作家になる夢を語る手紙の先で、彼女は自分の生き方を探していきます。", "gist": "顔を知らない支援者への手紙を通して、若い女性が学び、自立と愛情のあり方を考えていく。", "bodyReadings": {"児童養護施設": "じどうようごしせつ", "理事": "りじ", "学費": "がくひ", "匿名": "とくめい", "奨学金": "しょうがくきん", "家庭教師": "かていきょうし", "援助": "えんじょ", "施設": "しせつ", "叔父": "おじ", "姪": "めい", "裕福": "ゆうふく", "出版社": "しゅっぱんしゃ", "連載": "れんさい", "求婚": "きゅうこん", "誤解": "ごかい", "支援者": "しえんしゃ", "恋文": "こいぶみ", "自立": "じりつ"}, "sources": [{"title": "Wikisource・Daddy-Long-Legs（1912年版、導入と全73区分）", "url": "https://en.wikisource.org/wiki/Daddy-Long-Legs_(Webster)"}, {"title": "Vassar College・ジーン・ウェブスターの生涯", "url": "https://vcencyclopedia.vassar.edu/distinguished-alumni/jean-webster/"}], "sourceNote": "1912年刊の英語小説。参照したのはThe Century Co.の1912年版をもとにするWikisource転記です。導入と、サイト上でLetter 1〜73に分けられた本文を参照しています。続編、映画、アニメ、現代日本語訳の文章や設定は使わず、独自の日本語で紹介しています。", "termNote": "「あしながおじさん」はジュディが支援者につけた呼び名で、実の父や叔父ではありません。手紙の宛名に使う「ジョン・スミス」も本名を伏せるための名前です。書簡小説とは、手紙の形で出来事や心の動きを伝える小説です。", "checkedDate": "2026年11月2日", "cat": "literature", "primaryCategory": "world-literature", "genreLabel": "海外文学", "genre": "world-classic", "motif": "book", "sub": "ジーン・ウェブスター｜1912年初刊行", "people": [["ジュディ（ジェルーシャ・アボット）", "施設で育ち、大学へ進む主人公。ジェルーシャは本名で、大学ではジュディと名乗る。作家を目指す。"], ["ジャーヴィス・ペンドルトン", "ジュリアの叔父。ジュディと親しくなり、作家になる夢を励ます。彼女の実の叔父ではない。"], ["サリー・マクブライド", "ジュディの大学の友達。家族の温かい暮らしを彼女に知らせ、友情を育てる。"], ["ジュリア・ペンドルトン", "裕福な家に育った大学の友達。ジャーヴィスの姪。"], ["ジミー・マクブライド", "サリーの兄。ジュディとも親しく交流するが、彼女が愛しているのはジャーヴィス。"], ["リペット夫人", "ジュディが育った施設の責任者。匿名の男性による進学援助の条件を伝える。"], ["センプル夫人", "ロック・ウィロー農場でジュディを迎える女性。ジャーヴィスが子供のころの世話もしていた。"]], "synopsisSummary": ["アメリカの児童養護施設で育った十七歳のジェルーシャ・アボットは、年下の子供たちの世話をしながら学んでいます。ある日、施設の理事の一人が、彼女の書いた文章を気に入り、大学の学費と生活費を出すと申し出ます。ただし名前は秘密で、毎月、勉強や暮らしの様子を手紙で知らせることが条件でした。ジェルーシャが見たのは、帰り際の男性の後ろ姿と、自動車のライトで壁に大きく伸びた手足の影だけ。その印象から、顔を知らない相手を「あしながおじさん」と呼ぶようになります。", "大学へ進んだジェルーシャは、自分をジュディと呼ぶことにします。同級生のサリー・マクブライドやジュリア・ペンドルトンと友達になり、授業だけでなく、運動や演劇、読書も楽しみます。一方、友達が当然のように知っている本や家庭の習慣を、自分は知らないことに戸惑います。施設で育ったことを打ち明けられず、取り残されまいと努力するのです。おじさんへの手紙には、失敗も冗談も将来の夢も書き込み、少しずつ自分の言葉で考えを表すようになります。", "サリーの家で温かな家族の暮らしを知り、休暇には、センプル夫人のいるロック・ウィロー農場で過ごします。また、ジュリアの叔父ジャーヴィスとも親しくなります。彼はジュディの話に耳を傾け、農場でも一緒に散歩をし、作家になりたいという夢を励ましてくれる男性です。ジュディは彼に心を引かれますが、自分の学費を出す匿名の人とは別人だと思っています。", "成績や作文の力を伸ばしたジュディは、奨学金を得ます。おじさんはその受取りに反対しますが、ジュディは、自分の努力で得た機会を生かしたいと考えて譲りません。夏には家庭教師として働き、お金を稼ぎます。おじさんが申し出た海外旅行も断りました。支援には感謝しながら、自分の暮らしを人の指示だけで決めたくない気持ちが強くなるのです。", "作家への道も順調ばかりではありません。上流社会を題材に書いた小説は、出版社から不自然だと指摘されて返されます。落ち込んでも書くことはやめず、やがて、自分がよく知る施設の日常を題材に選びます。大学を卒業した後も農場で書き直しを続け、ついに連載と本の出版が決まりました。ジュディは受け取った千ドルをおじさんへ送り、援助してもらったお金を返し始めます。", "実は、この報告の二か月ほど前、ジュディはジャーヴィスからの求婚を断っていました。愛していないからではありません。家族や生まれの分からない自分が、裕福な家の彼と結婚したら、後で彼が悔やむのではないかと怖かったのです。ジャーヴィスは、ジュディがサリーの兄ジミーを好きなのだと誤解して離れます。ジュディは、おじさんに相談する手紙で、彼への愛情と、求婚を断った本当の理由を打ち明けます。", "病気をしていたおじさんから、会いに来るよう返事が届きます。大学を卒業した秋、ニューヨークの家を訪ねたジュディを待っていたのは、病気から回復しつつあるジャーヴィスでした。彼こそ、ずっと手紙を読んでいた「あしながおじさん」だったのです。秘密が明らかになり、二人は互いの思いを確かめます。翌朝のジュディの手紙は、もう顔の見えない支援者への報告ではなく、名前を知る大切な相手への恋文になっていました。"], "summaryHeading": "要約", "links": ["anne-green-gables", "little-princess"], "characterGallery": [{"name": "ジュディ（ジェルーシャ・アボット）", "role": "施設で育ち、大学へ進む主人公。ジェルーシャは本名で、大学ではジュディと名乗る。作家を目指す。", "wide": true, "portraits": [{"src": "assets/daddy-face-judy.webp", "label": "大学時代のジュディ", "alt": "ジュディ（ジェルーシャ・アボット）の人物イメージ", "width": 500, "height": 500}]}, {"name": "ジャーヴィス・ペンドルトン", "role": "ジュリアの叔父。ジュディと親しくなり、作家になる夢を励ます。彼女の実の叔父ではない。", "wide": false, "portraits": [{"src": "assets/daddy-face-jervis.webp", "label": "ジュリアの叔父", "alt": "ジャーヴィス・ペンドルトンの人物イメージ", "width": 500, "height": 500}]}, {"name": "サリー・マクブライド", "role": "ジュディの大学の友達。家族の温かい暮らしを彼女に知らせ、友情を育てる。", "wide": false, "portraits": [{"src": "assets/daddy-face-sallie.webp", "label": "大学の友達", "alt": "サリー・マクブライドの人物イメージ", "width": 500, "height": 500}]}, {"name": "ジュリア・ペンドルトン", "role": "裕福な家に育った大学の友達。ジャーヴィスの姪。", "wide": false, "portraits": [{"src": "assets/daddy-face-julia.webp", "label": "大学の友達／ジャーヴィスの姪", "alt": "ジュリア・ペンドルトンの人物イメージ", "width": 500, "height": 500}]}, {"name": "ジミー・マクブライド", "role": "サリーの兄。ジュディとも親しく交流するが、彼女が愛しているのはジャーヴィス。", "wide": false, "portraits": [{"src": "assets/daddy-face-jimmie.webp", "label": "サリーの兄", "alt": "ジミー・マクブライドの人物イメージ", "width": 500, "height": 500}]}, {"name": "リペット夫人", "role": "ジュディが育った施設の責任者。匿名の男性による進学援助の条件を伝える。", "wide": false, "portraits": [{"src": "assets/daddy-face-lippett.webp", "label": "施設の責任者", "alt": "リペット夫人の人物イメージ", "width": 500, "height": 500}]}, {"name": "センプル夫人", "role": "ロック・ウィロー農場でジュディを迎える女性。ジャーヴィスが子供のころの世話もしていた。", "wide": false, "portraits": [{"src": "assets/daddy-face-semple.webp", "label": "農場で迎える女性", "alt": "センプル夫人の人物イメージ", "width": 500, "height": 500}]}], "inlineIllustrations": [{"afterParagraph": 1, "src": "assets/daddy-long-shadow-scene.webp", "alt": "施設を去る男性の影が、車の光で長く伸びます。ジェルーシャはその姿から呼び名を思いつきます。", "caption": "施設を去る男性の影が、車の光で長く伸びます。ジェルーシャはその姿から呼び名を思いつきます。", "width": 1200, "height": 800}, {"afterParagraph": 5, "src": "assets/daddy-farm-writing-scene.webp", "alt": "卒業後、ジュディは農場で小説を書き直します。自分がよく知る経験が、作家への一歩になります。", "caption": "卒業後、ジュディは農場で小説を書き直します。自分がよく知る経験が、作家への一歩になります。", "width": 1200, "height": 800}, {"afterParagraph": 7, "src": "assets/daddy-identity-revealed-scene.webp", "alt": "訪ねた家で待っていたのはジャーヴィスでした。ジュディが手紙を送り続けてきた相手が、彼だと分かります。", "caption": "訪ねた家で待っていたのはジャーヴィスでした。ジュディが手紙を送り続けてきた相手が、彼だと分かります。", "width": 1200, "height": 800}], "characterGalleryNote": "人物の顔や服、室内の細部は作品をもとにした創作です。ジュディは大学時代の姿で、最後の場面では卒業後の成長した姿を表しています。", "image": "assets/daddy-long-shadow-scene.webp", "imageAlt": "施設を去る男性の影が、車の光で長く伸びます。ジェルーシャはその姿から呼び名を思いつきます。", "headerCaption": "施設を去る男性の影が、車の光で長く伸びます。ジェルーシャはその姿から呼び名を思いつきます。"}];
const finalThoughts={"rashomon": "下人は老婆を責めていたのに、「生きるためだ」という話を聞くと、同じ理由で老婆の着物を奪います。相手には許せなかった行いを、自分がする側に回ってしまったのです。追い詰められたとき、人は自分に都合のよい理由をつけてしまうことがある。下人の変わり方から、善悪の判断が揺れる怖さが伝わってきます。", "hana": "内供は、鼻を短くすれば笑われなくなると思っていましたが、周囲の反応は逆でした。長い鼻に戻って安心する姿を見ると、苦しさは鼻そのものだけでなく、人にどう見られるかにもあったと分かります。周りの人も、悩んでいた内供が喜ぶと素直には喜びません。自分の気持ちも他人の気持ちも、外見を変えるだけでは思いどおりにならない。そのおかしさと切なさが残る話です。", "spider": "犍陀多は自分も落ちるのを恐れ、後から来る人を追い払おうとします。その直後に糸は切れ、せっかく与えられた救いの機会を失ってしまいました。助かりたいという気持ちが、自分だけ助かればよいという考えに変わってしまったのです。他の人を受け入れられなかった犍陀多の姿に、この話の悲しさがあります。", "melos": "メロスは諦めかけても走って戻り、友も一度は疑いながら待ち続けました。再会した二人は、その弱さを隠さず話して抱き合います。信じ合うとは、一度も迷わないことだけではなく、迷ったあとに相手のために行動し、正直に向き合うことでもある。二人の姿から、そんな受け取り方のできる物語です。", "restaurant": "二人は歓迎されていると思い込み、おかしな注文にも都合のよい理由をつけて従っていました。自分たちが食べられると気づいたときには、すっかり店の言いなりになっていたのです。食べたいものを探していた二人が、食べられる側に回ってしまう。その逆転を通して、自分に都合のよい見方だけでは、目の前の危険にも気づけないことが見えてきます。", "gongitsune": "ごんは償おうとしていましたが、その気持ちは兵十に伝わらず、撃たれてしまいます。兵十が贈り主はごんだったと気づくのは、その後でした。善意があっても、相手がその意図を知らなければ、同じようには受け取れない。相手を思いながらもすれ違ってしまう、その悲しさが残る物語です。", "gloves": "子狐は間違えて狐の手を出しましたが、帽子屋はお金を受け取り、手袋を売ってくれました。母が心配していたような出来事は起こらなかったのです。その話を聞いた母は、人間は本当に怖いだけの相手なのかと考え直し始めます。聞いていた話と、自分で出会って知ることは違う。その小さな違いが、相手を見る目を変えていく物語です。", "goshu": "ゴーシュは初め、訪ねてきた動物を邪魔に思い、怒って追い返していました。けれども一緒に音を出したり、頼みに応じて弾いたりする中で、演奏がよくなっていきます。人前で認められた夜、彼が思い出すのは、自分がつらく当たったかっこうでした。上達したことだけでなく、関わった相手を思いやれるようになったことにも、ゴーシュの変化が見える物語です。", "toshishun": "杜子春は仙人になるために黙り続けますが、苦しむ母が自分を気遣う声には耐えられず、母を呼びます。約束を破ったその言葉は、親を思う気持ちから出たものでした。鉄冠子はそれを責めず、杜子春は特別な力よりも、人間らしい正直な暮らしを望むようになります。何かを手に入れるために、大切な人への思いまで捨てなくてよい。杜子春の選び直しから、そう受け取れる物語です。", "yodaka": "よだかは見た目や名前を責められ、助けを求めた空でも冷たくされます。一方で、自分も虫の命を奪って生きていることに苦しんでいました。最後に星となる姿は、周囲に認められて問題が解決した結末ではありません。何が彼をそこまで追い詰めたのかを見つめると、外見だけで相手を決めつけず、言葉の向こうにある苦しみに気づく大切さが伝わってきます。", "trolley": "良平はトロッコに乗れて大喜びしますが、遠くへ進むほど帰りが気になり、一人で帰るよう言われると強い心細さに襲われます。家に着いて泣き出したのは、ようやく怖さをこらえなくてよくなったからとも読めます。楽しかったはずの一日が、大人になっても心細い記憶として残りました。子供にとっては、慣れた場所から離れ、頼れる人がいなくなること自体が、大きな出来事なのです。", "lamp": "巳之助は仕事を失うのが怖くて区長を恨みますが、古い道具の不便さに気づき、火をつけるのをやめます。大切にしてきたランプと別れ、本屋として生きる道を選びました。ただし後年は、ランプを壊す以外の方法もあったと振り返ります。自分が築いたものを大切にすることと、変化に合わせてやり方を変えることは、どちらも必要なのだと読める物語です。", "ginga": "ジョバンニは、カムパネルラとずっと一緒にいたいと願いました。けれども友人は列車から消え、目覚めたあと、別の子を助けて川から戻らなかったと知ります。銀河の旅は、亡くなる友人との最後の時間だったとも読めます。命を誰かの役に立てたいと願った蠍の話も、友人の行動と重なって見えます。ただし、死ぬことが幸せだという答えではありません。大切な友人を失い、それでも母のもとへ走るジョバンニ。残された自分はどう生きるのか、本当の幸せとは何か。その問いが残る物語です。", "botchan": "主人公は赤シャツたちを殴って学校を去りますが、それで学校の問題がすべて解決したわけではありません。腹を立てる勢いの強さには、曲がったことを嫌う気持ちと、相手を早く決めつけてしまう危うさの両方があります。東京へ帰った彼が大切にしたのは、昔から自分を信じてくれた清でした。人にうまく合わせられない青年にも、信じてくれる人への深い愛着がある。そのことが最後まで伝わる物語です。", "cat": "猫は人間の会話を聞き、学問や金や世間体を大事にする人たちの、言葉と行動のずれを笑います。けれども猫自身も自信満々で、いつも正しく物を見ているとは限りません。最後には、その猫も思いがけない事故で命を落とします。誰かを偉そうに批評している自分も、別の目から見れば滑稽かもしれない。人間を少し外から眺める猫の視点が、私たち自身の見栄や思い込みを映す物語です。", "kokoro": "先生はKに気持ちを打ち明けないまま結婚の話を進め、Kの死後も、その過去を妻に話せずに生きました。最後に「私」へ手紙を書いても、妻には知らせないでほしいと願います。人を求めながら、本当のことを伝えられない。その苦しさが、先生の孤独を深くしていきました。先生が死を選ぶ決意は、罪を償う唯一の正しい方法として受け取る必要はありません。言えない気持ちを一人で抱え続けることの重さが残る物語です。", "lemon": "私の病気や借金が解決したわけではありません。それでも、一個の檸檬の冷たさや香りを感じ、本の上に置いて空想することで、重苦しい世界が一時的に違って見えました。最後の笑みは、現実を壊した結果ではなく、想像の中で気持ちが軽くなった瞬間です。小さな物との出会いや、見方を変える遊びが、心に少し余白をつくることもあると読める物語です。", "sangetsuki": "李徴は才能を認めてもらいたいのに、評価されて傷つくことを恐れ、人に学ぶことから遠ざかっていました。虎になってもまず詩を残したいと願い、そのあとで家族を思い出した自分を恥じます。自分を守ろうとする気持ちが、学ぶ機会や大切な人とのつながりを狭めてしまうことがある。旧友にようやく本音を語る李徴の姿から、そんな苦しさが伝わります。虎になった理由を一つの罰として決めつけるのではなく、彼自身の後悔を聞く物語です。", "yumejuya": "十の夢は、一つの筋や一つの答えにつながるわけではありません。待っても時間が分からない、忘れたはずの過去が戻る、見えているものを自分では作れない。夢の中の人たちは、思いどおりにならない出来事に出会います。はっきり説明しきれないまま残る不思議さが、私たち自身の記憶や不安に重なることもある。すべてを一つの意味に決めず、心に残った夢から読み返せる作品です。", "takasebune": "喜助は、行き先とわずかな金があることを、それまでの生活と比べて喜びます。その言葉に庄兵衛は、自分が何を求めて暮らしているのか考えさせられました。さらに弟の話を聞くと、罪の名前だけでは、喜助の気持ちや行為を割り切れなくなります。物語は、弟を死なせたことが正しいと結論づけず、庄兵衛の迷いを残して終わります。人を判断する前に、その人が置かれた事情を聞くことの重さが伝わる話です。", "maihime": "豊太郎はエリスとの暮らしを大切にしながら、日本へ戻る誘いにも断れずにうなずきます。肝心の話を彼女へ伝えられないまま、別れは別の人の口から知らされました。最後に親友を恨む気持ちが残っても、帰国を承諾したのは豊太郎自身です。仕事も人とのつながりも失いたくない。その迷いを言葉にせず、決断を先へ延ばすことで、相手を深く傷つけてしまうことがあると読める物語です。", "ningen": "葉蔵は人とつながりたいのに、人を怖がり、おどけることで本音を隠してきました。手記では自分を激しく否定しますが、あとがきの女性は、同じ人物を別の温かい目で振り返ります。「人間失格」という言葉は、葉蔵が自分へ向けた見方であり、人としての価値を決める客観的な判定ではありません。自分には悪いところしか見えないときでも、他の人には違う姿が見えている。その食い違いにも目を向けたい物語です。", "yamanashi": "五月、かにの子どもたちは魚が鳥に連れ去られるのを見て震えます。十二月には、落ちてきた実の香りをかぎ、父親と楽しみを分かち合って帰ります。同じ自然が、怖い出来事も嬉しい実りも運んでくる。その違いを、かにたちの目と気持ちを通して感じられる物語です。クラムボンの正体は本文では明かされず、一つに決めつける必要はありません。", "hitofusanobudo": "先生は、少年が絵の具を返し、悪かったと思っていることを確かめてから、葡萄を渡します。翌日にはジムが迎えてくれ、二人で新しい一房を分けてもらいます。盗みをなかったことにするのではなく、間違えた子がまた仲間の中へ戻れるようにする。先生の気遣いとジムの迎え方が、少年の心に長く残った物語です。", "sanshodayu": "姉に助けられて逃げた厨子王は、丹後で人を売り買いすることを禁じます。山椒大夫のもとでも、人々は給料を受け取って働くようになります。厨子王はやがて母と再会しますが、姉と父を取り戻すことはできません。自分だけ助かるのではなく、同じ苦しみを減らす行動へ進むこと。それでも消えない悲しさが、再会の喜びとともに残る物語です。", "crimeandpunishment": "ラスコーリニコフは人を殺した後も、自分は特別だという考えを捨てきれず、人を遠ざけます。ソーニャはその考えを認めるのではなく、罪を引き受けるよう促し、服役中も訪ね続けます。刑を受けただけで心が変わるわけではなく、彼は最後にようやく彼女への愛に気づきます。人を自分の理屈で踏み越えず、目の前の一人とつながり直す。その出発点までを描いた物語です。", "romeoandjuliet": "二人は一緒に生きるために結婚しますが、家の争い、友の死、追放、望まない縁談が重なります。助かるための計画も伝わらず、相手が死んだと思い込んだまま、取り返しのつかない結末に至ります。両家が争いをやめるのは、子どもたちを失った後です。命を絶つことが愛の理想なのではなく、相手の話を聞かず対立を重ねたことが、若者の生きる道を狭めた悲しさを読むことができます。", "donquixote": "ドン・キホーテは善いことをしようと旅に出ますが、思い込みから人を困らせ、自分も傷つきます。一方、正気のはずの公爵夫妻は、二人をだまして楽しんでいます。誰が立派なのかは、現実が見えるかどうかだけでは決まりません。最後にサンチョがまた一緒に旅をしようと願う姿からは、褒美を期待して始まった関係が、大切な友を失いたくない思いへ変わったことが伝わります。", "happyprince": "王子は宝石や金箔を人々に渡し、ツバメはそれを運び続けます。像の見た目が貧しくなると、市長たちは価値がなくなったと考えますが、最後に天使が選ぶのは捨てられた心臓とツバメでした。飾りの立派さではなく、誰の苦しみに気づき、どう関わったかが大切だと読むことができます。自分を犠牲にし尽くせという教訓ではなく、豊かな人々が何を見落としていたのかにも目を向けたい物語です。", "momotaro": "桃太郎は鬼を負かしますが、旅を支えたのは一人の力だけではありません。犬が船をこぎ、猿が門を開き、きじが空から助けます。それぞれの得意なことを生かしたから、宝を持って帰れました。手柄を褒めるおじいさんと、無事を喜ぶおばあさんの姿も印象的です。協力と成長の物語として読めますが、現実の戦いや略奪を正当化する教訓にする必要はありません。", "redcap": "最初の赤ずきんは狼に行き先を教え、寄り道をしている間に先回りされます。助けられた後、別の狼に出会ったときは、その誘いに乗らず、おばあさんへ知らせました。二人で戸を閉め、力を合わせたことで、今度は無事に帰れます。言いつけを守るだけでなく、経験から学び、困ったときに一人で抱え込まないことの大切さも読み取れます。", "orion": "オリオンはどんな獣にも勝てると誇りますが、ガイアが送ったサソリに命を奪われます。それでもアルテミスは彼を惜しみ、星空に居場所を求めました。自分の力を信じすぎる怖さと、亡くなった人を忘れたくない思いが重なります。一方、弓の異伝では、アルテミスがだまされて大切な相手を失う悲しみが中心です。同じオリオン座にも、違う物語が語り継がれています。", "andromeda": "アンドロメダは自分の行いではなく、母の言葉のために怪物へ差し出されます。ペルセウスが救い、結婚した後も、以前の婚約者との争いに巻き込まれました。勇者の活躍を読む一方で、彼女の命や結婚が周りの人に決められてしまうことにも気づきます。助かったことを喜ぶのと、古代の物語の価値観をそのまま今の正しさとするのは、別のことです。", "aliceinwonderland": "アリスは体の大きさにも会話にも振り回されますが、最後の裁判では、王や女王の言うことをそのまま受け入れません。理由のない規則や命令に、おかしいと声を上げます。冒険は夢だったものの、姉はその話を受け取り、いつか妹が子どもたちへ物語を伝える姿を思い浮かべました。不思議を楽しむ気持ちと、納得できないことを問い直す力の両方が残る物語です。", "cinderella": "シンデレラは妖精に助けられて舞踏会へ行き、最後には自分から靴を試したいと申し出ます。王子と結婚した後、姉たちを許し、二人の暮らしも支えました。美しい衣装だけでなく、誰かの助けと、自分で声を上げることが彼女の道を開きます。姉たちを許すのはこの物語の彼女の選択であり、いじめられた人は必ず我慢して許すべきだ、という教訓にする必要はありません。", "urashimataro": "浦島は亀を助け、竜宮でもてなされますが、帰ると家も両親も失われていました。箱を開けたのは、ただ珍しいものを見たかったからではなく、竜宮へ戻る手がかりを求めたためです。それでも三百年の時間は戻らず、彼は老人になって浜に残ります。約束を破った罰だけでなく、帰る場所を失った人の孤独と、楽しかった時間を取り戻せない悲しさが残る物語です。", "hansel": "ヘンゼルは小石で帰り道を残し、捕まった後も細い骨で時間をかせぎます。けれども最後に魔女のたくらみを見抜き、兄を助けたのはグレーテルでした。二人は得意なやり方を出し合い、水辺も一人ずつ渡って家へ帰ります。父との再会と暮らしの回復で終わりますが、置き去りが正しかったことにはなりません。安心できる場所を失った子どもたちが、互いを支えて危険を抜け出す物語です。", "uglyduckling": "ひなは見た目を笑われ、小屋では猫や雌鶏と同じことができないと否定されます。けれども春、水に映った自分を見て、もともと白鳥だったと知り、仲間に迎えられました。周りの物差しに合わないことと、その子に価値がないことは同じではありません。美しくなったからいじめが終わってよかった、だけではなく、姿が違っていても傷つけてよい理由にはならない、と読むことができます。", "mermaid": "人魚姫は王子を助けたことを伝えられず、王子は別の姫と結婚します。自分が生きるために王子を殺す道も選ばず、最後には空気の精として善い行いを重ねる道へ進みました。恋がかなわなければ何も残らない、という終わりではなく、願いをかなえる方法が変わる結末です。魂を得るという作品の世界観を踏まえて読みつつ、愛のために声や自分自身を犠牲にすべきだという教訓にする必要はありません。", "wizardofoz": "かかしは贈り物をもらう前から知恵を働かせ、木こりは仲間を気遣い、ライオンは怖くても皆を守っていました。自分にはないと思っていた力を、すでに行動で示していたのです。ドロシーも、銀の靴の使い方を知り、仲間に助けられて家へ帰ります。旅は無駄だったのではなく、互いの力に気づき、それぞれの居場所を見つける時間になりました。", "treasure-island": "ジムは海賊の計画を知らせ、船を取り戻すなど仲間を助けますが、独断の行動で危険にも飛び込みます。シルバーもジムを守りながら自分の助命を図り、最後は金貨を持って逃げました。単純に頼れる人と悪い人へ分けられない大人の姿を、ジムは目の当たりにします。宝を得て帰っても悪夢は残り、冒険の成功だけでは埋められない怖さを知る物語です。", "kaguyahime": "求婚者たちはお金や作り話で姫を手に入れようとしますが、願いはかないません。けれども最後の別れは、姫にも育ての親にも止められませんでした。かぐや姫は月へ帰り、地上の人々には手紙や形見、悲しみが残ります。相手を自分のものにしたい思いと、離れたくないほど大切に思う気持ちは同じではない。その違いを、求婚の場面と家族の別れから読むことができます。", "snow-white": "王妃は鏡で順位を確かめ、白雪姫が上だと知るたびに、違う手口で追い詰めます。姫は小人たちに助けられ、最後には運ばれる棺の衝撃でリンゴのかけらが外れ、目を覚ましました。誰かと比べて一番でなければ満たされない心が、王妃を際限のない攻撃へ向かわせたと読めます。姫がだまされたことを責めたり、美しさや最後の厳しい罰をそのまま正しさの基準にしたりする必要はありません。", "pussinboots": "猫は主人を侯爵と呼び、王様への贈り物や偽の領地で、立派な人物だと思わせます。魔物には自慢を誘い、小さなネズミへ変えさせて勝ちました。若者は姫と結婚しますが、成功の陰にはうそや脅しもあります。猫の機転を楽しむだけでなく、人が肩書や服、周りの証言をどれほど信じてしまうかも読み取れます。賢ければ何をしてもよい、という教訓ではありません。", "emperors-new-clothes": "大臣も王様も何も見えませんが、愚かだと思われるのが怖くて、立派な布だとほめます。町の人々もそれに合わせ、子どもが口にして初めて、事実が広く語られました。それでも王様は行列を続け、家来もない裾を持つふりをやめません。間違いが分かることと、間違いを認めて行動を変えることは、別の難しさを持つ。その違いまで描く物語です。", "amanoiwato": "天照大御神は弟の乱暴を恐れ、岩屋に隠れます。神々は鏡や玉を作り、舞と笑いで外への関心を引き、最後には手を取って光を迎えました。計画する人、作る人、舞う人が違う役割を果たすことで、世界が変わります。ただし、笑いだけですべてが解決したのではありません。乱暴をしたスサノオには償いが求められ、天の世界から追い出されます。傷ついた側を責めるのではなく、協力して立て直し、原因にも向き合う物語として読めます。", "tanabata": "織姫と彦星は、一緒にいる喜びに夢中になって仕事を忘れ、引き離されます。年に一度会うことは許されますが、この版では雨なら鳥の橋がかからず、その願いもかないません。それでも二人は日々の仕事を続け、次の再会を待ちます。相手を思う気持ちと毎日の暮らしを、どう両立するか。会う場面だけでなく、会えない間も続く二人の思いが心に残る物語です。", "lesmiserables": "司教に迎えられたヴァルジャンは、生き直し、コゼットを育て、マリユスや追跡者ジャヴェールの命まで救います。それでも前科への偏見から、娘夫婦にも遠ざけられました。最後に真実が伝わり、彼は愛する二人に見守られます。人を過去の罪だけで決めつけないことが、次の誰かを救う力になる。一方で、ファンティーヌを追い詰めた貧困や偏見は、一人の親切だけでは消えません。人が変われる可能性と、人を苦境に置く社会の両方を見つめる物語です。", "frankenstein": "ヴィクターは命を生み出しますが、その存在を恐れて見捨てます。創造物は言葉や親切を学ぶものの、人に拒まれ、やがて無関係な人まで殺してしまいました。二人は復讐を重ね、最後まで取り返しのつかないものを失います。孤独な苦しみを理解することと、他人を傷つける行為を認めることは別です。つくる力には世話をする責任が伴い、望みを追い続けるだけでなく、ウォルトンのように他者の命のために立ち止まる選択もあると読めます。", "makuranososhi": "清少納言は、春の明け方や子どもの小さな動作から、心が動いた瞬間を選んで書き残します。宮廷の場面では、初めて仕えたときの恥ずかしさや、雪山をめぐる悔しさも見えてきます。遠い時代の人にも、今とつながる気持ちがあると感じられます。ただし、彼女の好みや身分による評価が、誰にとっても正しいわけではありません。同じものを好きになるためではなく、何を見て、どこに心を動かすかを、自分の暮らしと比べて読める本です。", "genjimonogatari": "光源氏は美しさと権力を持ち、多くの人に愛されます。それでも紫の上の願いを十分には受け止められず、その死を前に深く悲しみます。次の世代でも、薫は浮舟が返事をしない理由を理解しきれません。愛しているつもりでも、相手の望みが見えているとは限らない。華やかな暮らしの陰にある孤独や、愛される側の息苦しさまで描くことが、この長い物語の読みどころです。", "takekurabe": "美登利と信如は互いを意識しながら、からかいや誤解のために素直に話せません。門の外へ出された布は受け取られず、やがて二人はそれぞれの道へ進みます。最後に置かれた水仙の作り花の主は、はっきりとは示されません。子どもの世界から離れる寂しさに、家の仕事や町の人々が決める将来の重さが重なります。ただ恋が実らなかった話ではなく、自分の気持ちだけでは進む道を選べない子どもたちの物語として読めます。", "nigorie": "お力は人気者として振る舞いながら、貧しい過去と行き場のない不安を抱えています。源七は彼女への思いから離れられず、妻のお初と子どもまで追い詰めます。最後に、お力と源七の死が知らされますが、事件の場面やお力の意思は明らかにされません。噂を聞いた人が、そのまま死者の気持ちを知ったことにはならない。恋愛だけで人を説明せず、その人の仕事や貧困、語れなかった苦しみにも目を向けて読むことができます。", "christmas-carol": "スクルージは、自分の寂しい死とティムの死を未来の光景として見せられ、生き方を変えます。目覚めた後は、寄付をするだけでなく、甥とのつきあいを取り戻し、ボブの給料を上げて家族を助け続けます。最後にティムが生きていることが、未来は決まりきっていなかったと示します。大切なのは、怖がったり後悔したりするだけでなく、今そばにいる人への接し方を変え、それを続けることだと読めます。", "redheadedleague": "赤毛組合は店主を留守にするための仕掛けで、助手たちはその間に銀行へのトンネルを掘っていました。ホームズは銀行で待ち構え、侵入してきたクレイを捕らえます。百科事典の書き写しは、知識を集めるためではなく、店主をその場に引き留めるための仕事でした。ホームズは「何をさせられたか」だけでなく、その間に誰が何をできたかを考えます。安すぎる助手の給料、地下室へ通う習慣、汚れた膝、建物の位置が、一つの計画へつながります。ワトソンも同じ話を聞き同じ場所を見ますが、意味はすぐには分かりません。最後の説明によって、読者も先の場面を別の意味で見直せるところが面白さです。", "anne-green-gables": "初めは男の子でないため帰されそうだったアンが、最後にはマリラと大切な家を支える側になります。ギルバートとも意地を張り合う関係をほどき、友人として助け合う道を開きます。これは、失敗しない子になる話ではありません。自分の思いを大切にしながら、相手の事情にも目を向け、予定が変わっても学び続ける少女の成長を描いた作品です。", "hamlet": "ハムレットは劇を使って叔父の罪を確かめますが、自分もポローニアスを殺し、その息子レアティーズから復讐される立場になります。最後に叔父は倒れても、王子と家族の命は戻りません。考えすぎて動けない人の話だけではなく、確かめようとする慎重さと、衝動的な行動が同居する悲劇として読めます。生き残るホレイショーには、勝ち負けでは片づかない事情を伝える役目が残ります。", "tom-sawyer": "トムは、塀塗りでは人を巧みに動かしますが、裁判では自分が危険を引き受けてポッターを救います。ハックも、大人から厄介者と思われながら、夫人を守るために助けを求めます。二人の行動を見ると、行儀のよさと、人を思って行動することは同じではないと分かります。宝を得た後もハックは窮屈さを感じ、トムは遊びを考え続けるため、単純な「成功して大人になる話」には収まりません。", "little-princess": "セーラは、貧しくなってもベッキーと支え合い、自分より空腹な少女にパンを分けます。屋根裏に現れる「魔法」も、実際にはラム・ダスたちが用意した暖かさや食事でした。財産が戻った後は、その力を困っている子の食事に役立てようとします。何も言わず我慢すれば必ず報われる話というより、想像力に支えられる心と、現実に人を助ける行動の両方を描く物語として読めます。", "little-match-girl": "少女が炎の中に見るのは、暖かい場所、食事、そして自分を愛してくれる人でした。しかし現実の町では、そのどれも届かず、少女は亡くなります。祖母と神様のもとへ行く結末には、当時のキリスト教的な慰めが表れています。それを「死ねば幸せになれる」という勧めにせず、生きている少女に必要な助けが届かなかったことに目を向けて読むことができます。", "daddy-long-legs": "ジュディは援助によって大学へ進みますが、感謝して従うだけでは終わりません。奨学金や仕事を自分で選び、失敗した小説も書き直して、作家として収入を得始めます。最後には、支援者と愛する人が同じジャーヴィスだと分かります。幸福な恋の結末とともに、相手の正体を知らないジュディと、事情を知っていた男性との立場の違いにも目を向けると、自立を求める彼女の言葉がよりはっきり見えてきます。"};

const authorBackground=[{"title": "東京の、どこで生まれた？", "text": "1892年3月1日、東京市京橋区入船町で生まれました。今の中央区明石町、聖路加国際病院の周辺にあたります。実父は牛乳販売業を営んでいました。生まれた町と、その後に育った町は別です。", "sources": [{"title": "たばこと塩の博物館「芥川龍之介がみた江戸・東京」", "url": "https://www.tabashio.jp/exhibition/2023/2309sep/index.html"}, {"title": "墨田区観光協会「芥川龍之介生育の地」", "url": "https://visit-sumida.jp/wp/spot/6005"}]}, {"title": "育ったのは、本所・両国", "text": "乳児のころ、母の実家の芥川家に引き取られ、18歳まで本所（ほんじょ）・両国周辺で育ちました。住まいは今の墨田区両国3丁目にあたる場所です。俳句や芝居などに親しむ家庭でした。", "sources": [{"title": "たばこと塩の博物館「芥川龍之介がみた江戸・東京」", "url": "https://www.tabashio.jp/exhibition/2023/2309sep/index.html"}, {"title": "墨田区立図書館「すみだ文学散歩」（PDF）", "url": "https://www.library.sumida.tokyo.jp/images/upload/sumidabunngakusannpo.pdf"}]}, {"title": "なじみの景色は、隅田川", "text": "育った家の近くには隅田川や回向院（えこういん）がありました。芥川は『大川の水』にも、川沿いの風景を書いています。育った町を知ってから作品を読むと、身近な景色を作家がどう見ていたか、たどる楽しみが生まれます。", "sources": [{"title": "たばこと塩の博物館「芥川龍之介がみた江戸・東京」", "url": "https://www.tabashio.jp/exhibition/2023/2309sep/index.html"}, {"title": "青空文庫「大川の水」本文", "url": "https://www.aozora.gr.jp/cards/000879/files/123_15167.html"}]}, {"title": "夏目漱石との出会い", "text": "1915年11月、友人とともに夏目漱石を訪ねました。翌年、漱石から『鼻』を高く評価され、名前を広く知られる転機になります。書き続けていた若い芥川にとって、先輩作家からの言葉は大きな励みになりました。", "sources": [{"title": "日本近代文学館「教科書のなかの文学／教室のそとの文学──芥川龍之介『羅生門』とその時代」", "url": "https://www.bungakukan.or.jp/cat-exhibition/9062/"}]}, {"title": "小説家になるまで、何をしていた？", "text": "読書だけでなく、幼いころから回覧雑誌も作っていました。東京帝国大学では英文学を学び、仲間との同人誌活動にも取り組みます。1915年に『羅生門』、1916年に『鼻』を発表しました。漱石に褒められて初めて書き始めたのではなく、それまでの読書や創作の積み重ねがありました。", "sources": [{"title": "山梨県立文学館デジタルアーカイブ「芥川龍之介」", "url": "https://digital-archive.pref.yamanashi.jp/literary/19"}, {"title": "たばこと塩の博物館「芥川龍之介がみた江戸・東京」", "url": "https://www.tabashio.jp/exhibition/2023/2309sep/index.html"}]}, {"title": "作家の暮らしを支えた田端", "text": "1914年に田端（たばた）へ移り、ここが創作の大切な拠点になりました。室生犀星（むろう さいせい）ら作家との交流も、田端に文士が集まるきっかけの一つとなります。大学卒業後は英語を教えながら執筆し、1919年に教職を離れ、文筆に専念しました。田端に移ってからも、横須賀や鎌倉で暮らした時期があります。", "sources": [{"title": "北区「芥川龍之介記念館とは」", "url": "https://www.city.kita.lg.jp/culture-tourism-sports/culture/1010296/1010304/1010305.html"}, {"title": "田端文士村記念館", "url": "https://kitabunka.or.jp/tabata/news/16484/"}, {"title": "国立国会図書館「近代日本人の肖像」", "url": "https://www.ndl.go.jp/portrait/datas/224"}]}];
function bodyText(x,value){const words=Object.keys(x.bodyReadings||{}).sort((a,b)=>b.length-a.length);if(!words.length)return esc(value);let output='',i=0;while(i<value.length){const word=words.find(w=>value.startsWith(w,i));if(word){output+=rubyText(word,x.bodyReadings[word]);i+=word.length}else{output+=esc(value[i]);i++}}return output}
const personBackground={"soseki": [{"title": "生まれたところ", "text": "1867年2月9日、江戸の牛込馬場下横町に生まれました。今の東京都新宿区喜久井町にあたります。本名は夏目金之助です。", "sources": [{"title": "新宿区立漱石山房記念館「漱石の生涯」", "url": "https://soseki-museum.jp/soseki-natsume/sosekis-life/"}, {"title": "国立国会図書館「近代日本人の肖像」夏目漱石", "url": "https://www.ndl.go.jp/portrait/datas/307/"}]}, {"title": "育ったところ", "text": "幼いころは四谷の塩原家の養子となり、のちに牛込の実家へ戻りました。東京で学び、大学では英文学を専攻します。子供時代に暮らした家や家族との関係には、変化がありました。", "sources": [{"title": "新宿区立漱石山房記念館「漱石の生涯」", "url": "https://soseki-museum.jp/soseki-natsume/sosekis-life/"}]}, {"title": "教師から、小説を書く人へ", "text": "1893年に帝国大学を卒業し、松山や熊本で教師を務めました。1900年から英国へ留学。帰国後は大学で英語を教えながら、『吾輩は猫である』を発表しました。小説家になる前にも、学び、教える時間がありました。", "sources": [{"title": "新宿区立漱石山房記念館「漱石の生涯」", "url": "https://soseki-museum.jp/soseki-natsume/sosekis-life/"}, {"title": "国立国会図書館「近代日本人の肖像」夏目漱石", "url": "https://www.ndl.go.jp/portrait/datas/307/"}]}, {"title": "つながりのある人", "text": "学生時代から正岡子規と親しくなり、俳句を学びました。後年には、若い芥川龍之介の『鼻』を高く評価しています。先輩から学ぶ側だった漱石も、次の世代を励ます存在になりました。", "sources": [{"title": "新宿区立漱石山房記念館「漱石の生涯」", "url": "https://soseki-museum.jp/soseki-natsume/sosekis-life/"}, {"title": "国立国会図書館「近代日本人の肖像」芥川龍之介", "url": "https://www.ndl.go.jp/portrait/datas/224/"}]}, {"title": "新聞社で小説を書き続ける", "text": "1907年に東京朝日新聞社へ入り、創作に専念します。『三四郎』『それから』『門』『こころ』などを発表しました。教師だった時期と、職業として小説を書くようになった時期を分けると、歩みがつかみやすくなります。", "sources": [{"title": "新宿区立漱石山房記念館「漱石の生涯」", "url": "https://soseki-museum.jp/soseki-natsume/sosekis-life/"}, {"title": "国立国会図書館「近代日本人の肖像」夏目漱石", "url": "https://www.ndl.go.jp/portrait/datas/307/"}]}, {"title": "最後の作品", "text": "1916年12月9日、49歳で亡くなりました。最後の長編小説『明暗』は、書き終わらないまま残されました。『こころ』だけが晩年の作品というわけではなく、その後にも創作は続いていました。", "sources": [{"title": "新宿区立漱石山房記念館「漱石の生涯」", "url": "https://soseki-museum.jp/soseki-natsume/sosekis-life/"}, {"title": "国立国会図書館「近代日本人の肖像」夏目漱石", "url": "https://www.ndl.go.jp/portrait/datas/307/"}]}], "kenji": [{"title": "生まれたところ", "text": "1896年8月27日、岩手県の花巻川口町に生まれました。今の花巻市豊沢町にあたります。家は質屋と古着商を営んでいました。作品で親しんだ自然だけでなく、町の暮らしも身近にありました。", "sources": [{"title": "花巻市「宮沢賢治について」", "url": "https://www.city.hanamaki.iwate.jp/miyazawakenji/about_kenji/"}, {"title": "国立国会図書館「近代日本人の肖像」宮沢賢治", "url": "https://www.ndl.go.jp/portrait/datas/4318/"}]}, {"title": "育ったところと、好きだったもの", "text": "花巻で育ち、1909年に盛岡中学校へ入学しました。少年時代から鉱物や植物の採集に親しみ、のちに盛岡高等農林学校で学びます。自然を眺めるだけでなく、調べ、名前や仕組みを知ることにも関心を向けていました。", "sources": [{"title": "花巻市「宮沢賢治年譜」", "url": "https://www.city.hanamaki.iwate.jp/miyazawakenji/about_kenji/1003946.html"}]}, {"title": "書きはじめたころ", "text": "15歳ごろから短歌を作り、1917年には仲間と同人誌『アザリア』を創刊しました。詩や童話へと、書くものを広げていきます。最初から、今よく知られる童話だけを書いていたわけではありません。", "sources": [{"title": "花巻市「宮沢賢治年譜」", "url": "https://www.city.hanamaki.iwate.jp/miyazawakenji/about_kenji/1003946.html"}, {"title": "花巻市「賢治と文学」", "url": "https://www.city.hanamaki.iwate.jp/miyazawakenji/about_kenji/1003947.html"}]}, {"title": "学校の先生として", "text": "1921年に花巻の農学校の教師となりました。授業だけでなく、詩や曲を作ったり、生徒と劇を上演したりする活動にも取り組みました。農業を学ぶことと、表現する楽しさを、学校の暮らしの中で結びつけていました。", "sources": [{"title": "花巻市「宮沢賢治年譜」", "url": "https://www.city.hanamaki.iwate.jp/miyazawakenji/about_kenji/1003946.html"}, {"title": "花巻市「賢治と文学」", "url": "https://www.city.hanamaki.iwate.jp/miyazawakenji/about_kenji/1003947.html"}]}, {"title": "生きている間に出した二冊", "text": "1924年に『春と修羅』と童話集『注文の多い料理店』を刊行しました。生前に出版した本は、この二冊です。妹トシとの別れを詠んだ『永訣の朝』など、人との関わりも作品に残されています。『銀河鉄道の夜』は没後に発表された作品です。", "sources": [{"title": "花巻市「宮沢賢治について」", "url": "https://www.city.hanamaki.iwate.jp/miyazawakenji/about_kenji/"}, {"title": "花巻市「宮沢賢治年譜」", "url": "https://www.city.hanamaki.iwate.jp/miyazawakenji/about_kenji/1003946.html"}, {"title": "花巻市「賢治と文学」", "url": "https://www.city.hanamaki.iwate.jp/miyazawakenji/about_kenji/1003947.html"}]}, {"title": "農業と芸術を、暮らしのそばへ", "text": "1926年に農学校を退職し、羅須地人協会を設立しました。肥料の相談や農業指導をしながら、音楽や文学にも取り組みます。1933年9月21日、37歳で亡くなりました。作品を書くことだけでなく、人々の暮らしを支えようとした歩みもあります。", "sources": [{"title": "花巻市「宮沢賢治年譜」", "url": "https://www.city.hanamaki.iwate.jp/miyazawakenji/about_kenji/1003946.html"}, {"title": "国立国会図書館「近代日本人の肖像」宮沢賢治", "url": "https://www.ndl.go.jp/portrait/datas/4318/"}]}], "shakespeare": [{"title": "生まれ育ったのは、イングランドの町", "text": "シェイクスピアは1564年、イングランドのストラトフォード・アポン・エイヴォンで生まれました。父ジョンは手袋職人で、町の行政にも携わった人です。誕生日は4月23日として祝われますが、正確な日は分かっていません。記録で確かなのは、4月26日に地元の教会で洗礼を受けたことです。", "sources": [{"title": "Shakespeare Birthplace Trust：誕生と洗礼記録", "url": "https://www.shakespeare.org.uk/explore-shakespeare/shakespedia/william-shakespeare/when-was-shakespeare-born/"}, {"title": "Shakespeare Birthplace Trust：伝記", "url": "https://www.shakespeare.org.uk/explore-shakespeare/shakespedia/william-shakespeare/william-shakespeare-biography/"}]}, {"title": "言葉と古典に触れる学び", "text": "地元のグラマースクールで学んだと考えられていますが、本人の在学記録が残っているわけではありません。当時の学校ではラテン語や古典作品を重視し、劇を扱う学習もありました。大学に通った記録もありません。作品に古代の詩や歴史が現れることと、確かな学歴が分かることとは、分けて考える必要があります。", "sources": [{"title": "Shakespeare Birthplace Trust：教育", "url": "https://www.shakespeare.org.uk/explore-shakespeare/shakespedia/william-shakespeare/shakespeares-school/"}, {"title": "Folger Shakespeare Library：生涯と史料上の限界", "url": "https://www.folger.edu/explore/shakespeares-life/"}]}, {"title": "家族の暮らしと、記録のない年月", "text": "1582年、18歳でアン・ハサウェイと結婚し、やがて三人の子どもを持ちました。家族は故郷で暮らします。一方、彼がいつロンドンへ移り、どう演劇の仕事を始めたのかは、はっきりしません。1585年から1592年ごろの活動には記録の空白があります。1592年には、ロンドンで俳優・劇作家として知られていたことが確認できます。", "sources": [{"title": "Folger Shakespeare Library：生涯と史料上の限界", "url": "https://www.folger.edu/explore/shakespeares-life/"}, {"title": "Shakespeare Birthplace Trust：伝記", "url": "https://www.shakespeare.org.uk/explore-shakespeare/shakespedia/william-shakespeare/william-shakespeare-biography/"}]}, {"title": "書くだけではない、劇団の一員", "text": "1594年、宮内大臣一座の創立メンバーとなり、脚本を書くだけでなく、俳優や出資者としても活動しました。一座は1603年に国王一座と呼ばれるようになります。仲間の俳優が演じ、観客が見る舞台が、作品の大事な居場所でした。現代の本で読むときも、台詞を誰が誰に向けて言っているかに注目すると、場面を思い描きやすくなります。", "sources": [{"title": "Royal Shakespeare Company：劇団と活動年表", "url": "https://www.rsc.org.uk/shakespeares-life-and-times/"}, {"title": "Folger Shakespeare Library：生涯と史料上の限界", "url": "https://www.folger.edu/explore/shakespeares-life/"}], "interpretationNote": "最後の二文のうち読書の提案は編集上の独自説明。"}, {"title": "恋、対立、迷いを舞台にする", "text": "『ロミオとジュリエット』は、対立する家に生まれた二人の恋を描く悲劇です。『ハムレット』では、父を殺された王子の復讐と迷いが物語を動かします。ほかに『リア王』『マクベス』などがあり、悲劇だけでなく喜劇や歴史劇、詩も書きました。登場人物の言葉や選択を追うと、ひとりの人間の中にも違う気持ちが同居していることが見えてきます。", "sources": [{"title": "Folger Shakespeare Library：ロミオとジュリエット", "url": "https://www.folger.edu/explore/shakespeares-works/romeo-and-juliet/"}, {"title": "Folger Shakespeare Library：ハムレット", "url": "https://www.folger.edu/explore/shakespeares-works/hamlet/"}, {"title": "Shakespeare Birthplace Trust：伝記", "url": "https://www.shakespeare.org.uk/explore-shakespeare/shakespedia/william-shakespeare/william-shakespeare-biography/"}], "interpretationNote": "最後の一文は作品への入り口としての独自の読み方。"}, {"title": "仲間が残した戯曲集", "text": "1616年4月23日、故郷で亡くなりました。死因は分かっていません。七年後の1623年、かつて同じ劇団で働いた仲間たちが戯曲を集め、『ファースト・フォリオ』を刊行します。収録された36作品のうち18作品は、それまで印刷されていませんでした。今も物語を読んだり舞台で見たりできる背景には、作者だけでなく、作品を残した人々の働きもあります。", "sources": [{"title": "Folger Shakespeare Library：生涯と史料上の限界", "url": "https://www.folger.edu/explore/shakespeares-life/"}, {"title": "Folger Shakespeare Library：First Folioと肖像", "url": "https://www.folger.edu/explore/shakespeare-in-print/first-folio/"}]}], "dostoevsky": [{"title": "モスクワに生まれ、都市と田園で育つ", "text": "フョードル・ミハイロヴィチ・ドストエフスキーは、1821年にモスクワで生まれたロシアの小説家です。父は貧しい人々のためのマリインスキー病院で働く医師でした。モスクワで学校に通う一方、家族が田舎の土地を買ってからは、夏をダロヴォエで過ごしました。生まれ育ったモスクワと、のちの活動拠点ペテルブルクは別の都市です。", "sources": [{"title": "ロシア大統領図書館「ドストエフスキーの誕生」", "url": "https://www.prlib.ru/history/1324583"}, {"title": "サンクトペテルブルク・ドストエフスキー文学記念館「生涯と創作の年譜」", "url": "https://md.spb.ru/dostoevskij/biografiya/"}]}, {"title": "軍の技術者から、文学の道へ", "text": "母を亡くしたあと、1837年にペテルブルクへ移り、翌年、工兵学校に入りました。卒業して軍務に就きますが、1844年には退職して文学へ進みます。この年にはバルザックの『ウジェニー・グランデ』をロシア語に翻訳していました。最初から専業の小説家だったのではなく、技術者としての教育や翻訳の仕事を経て、自分の作品を書く道を選んだのです。", "sources": [{"title": "ロシア大統領図書館「ドストエフスキーの誕生」", "url": "https://www.prlib.ru/history/1324583"}, {"title": "サンクトペテルブルク・ドストエフスキー文学記念館「生涯と創作の年譜」", "url": "https://md.spb.ru/dostoevskij/biografiya/"}]}, {"title": "最初の小説が、発表前から評判になる", "text": "『貧しき人々』の原稿は、1845年に作家仲間を通してネクラーソフや批評家ベリンスキーに読まれ、高く評価されました。実際に刊行されたのは1846年です。原稿が評判になった年と、読者に届いた年を分けると、若い作家が注目を集めた経緯が見えてきます。同じ1846年には『分身』、1848年には『白夜』も発表しました。", "sources": [{"title": "サンクトペテルブルク・ドストエフスキー文学記念館「生涯と創作の年譜」", "url": "https://md.spb.ru/dostoevskij/biografiya/"}, {"title": "ロシア大統領図書館「ドストエフスキーの誕生」", "url": "https://www.prlib.ru/history/1324583"}]}, {"title": "逮捕とシベリアでの年月", "text": "社会制度や思想を話し合うペトラシェフスキーの集まりなどに参加し、1849年に逮捕されました。死刑を言い渡されますが、刑は変更され、オムスクで四年間の強制労働、その後はセミパラチンスクでの軍務を経験します。作家としての歩みは長く中断されました。のちに発表した『死の家の記録』を読むうえでも、この服役歴は重要な背景になります。ただし、小説の出来事をすべて本人の実体験と同一視はできません。", "sources": [{"title": "ロシア大統領図書館「ドストエフスキーの誕生」", "url": "https://www.prlib.ru/history/1324583"}, {"title": "サンクトペテルブルク・ドストエフスキー文学記念館「生涯と創作の年譜」", "url": "https://md.spb.ru/dostoevskij/biografiya/"}]}, {"title": "雑誌づくりと、執筆を支える協力", "text": "ペテルブルクへ戻ったあとは兄ミハイルと雑誌づくりに携わりましたが、兄の死後には出版の負債も引き受けました。1866年には『罪と罰』を連載。同年、速記者アンナ・スニートキナの助けを得て『賭博者』を仕上げ、翌年に二人は結婚します。作品は孤独な才能だけで生まれたのではなく、雑誌という発表の場や、原稿を形にする協力にも支えられていました。", "sources": [{"title": "サンクトペテルブルク・ドストエフスキー文学記念館「生涯と創作の年譜」", "url": "https://md.spb.ru/dostoevskij/biografiya/"}, {"title": "ロシア大統領図書館「ドストエフスキーの誕生」", "url": "https://www.prlib.ru/history/1324583"}]}, {"title": "代表作から、人の矛盾を読む", "text": "代表作には『罪と罰』のほか、『白痴』『悪霊』『カラマーゾフの兄弟』があります。『罪と罰』では、自分の理屈を信じる青年が、犯罪後の恐れや他者との関係によって揺さぶられます。人物の主張と、実際の感情や行動のずれを追うと、難しそうな議論にも近づきやすくなります。1881年にペテルブルクで亡くなるまで、人間を単純な善人・悪人に分けきれない物語を書き続けました。", "sources": [{"title": "サンクトペテルブルク・ドストエフスキー文学記念館「生涯と創作の年譜」", "url": "https://md.spb.ru/dostoevskij/biografiya/"}, {"title": "ロシア大統領図書館「ドストエフスキーの誕生」", "url": "https://www.prlib.ru/history/1324583"}, {"title": "Project Gutenberg・『罪と罰』旧英訳原文", "url": "https://www.gutenberg.org/files/2554/2554-h/2554-h.htm"}], "interpretationNote": "後半の読み方は『罪と罰』の確認済み本文に基づく独自の読解案。人物の発言をそのまま作者の主張と断定しない。"}], "dazai": [{"title": "青森で生まれた津島修治", "text": "太宰治は1909年6月19日、青森県の金木村で生まれました。今の五所川原市金木町です。本名は津島修治。家は多くの土地を持つ地主で、父は政治にも関わっていました。少年時代から本を読み、中学校で学ぶころには文章を書く活動にも取り組んでいます。故郷は、後に『津軽』を書くときにも大切な場所となりました。", "sources": [{"title": "国立国会図書館「近代日本人の肖像」太宰治", "url": "https://www.ndl.go.jp/portrait/datas/4149"}, {"title": "五所川原市「太宰治について」", "url": "https://www.city.goshogawara.lg.jp/kyouiku/bunka/dazai.html"}, {"title": "三鷹市「太宰治略年譜」", "url": "https://www.city.mitaka.lg.jp/dazai/dazaitomitaka/nenpu.html"}]}, {"title": "東京へ出て、小説を書く道へ", "text": "1930年に東京帝国大学のフランス文学を学ぶ学科へ入り、上京しました。同じ年に小説家の井伏鱒二を訪ね、教えを受けるようになります。大学は卒業せず、1933年には『列車』を「太宰治」の名で発表。1935年に『逆行』が芥川賞の候補となり、翌年には最初の創作集『晩年』を刊行しました。", "sources": [{"title": "国立国会図書館「近代日本人の肖像」太宰治", "url": "https://www.ndl.go.jp/portrait/datas/4149"}, {"title": "三鷹市「太宰治略年譜」", "url": "https://www.city.mitaka.lg.jp/dazai/dazaitomitaka/nenpu.html"}]}, {"title": "三鷹の暮らしと、さまざまな作品", "text": "1939年、石原美知子と結婚し、その年の秋から三鷹に住みました。1940年には『走れメロス』を発表します。戦争中は家族と疎開し、戦後に三鷹へ戻りました。戦後の作品には『斜陽』『ヴィヨンの妻』『人間失格』があります。1948年6月13日に亡くなり、『グッド・バイ』は未完で残されました。", "sources": [{"title": "三鷹市スポーツと文化財団・太宰治文学サロン「太宰治 紹介」", "url": "https://www.mitaka-sportsandculture.or.jp/dazai/about/"}, {"title": "三鷹市「太宰治略年譜」", "url": "https://www.city.mitaka.lg.jp/dazai/dazaitomitaka/nenpu.html"}, {"title": "国立国会図書館「近代日本人の肖像」太宰治", "url": "https://www.ndl.go.jp/portrait/datas/4149"}]}, {"title": "『走れメロス』から読む", "text": "『走れメロス』は、妹の結婚式を済ませるため、友を王のもとに残して村へ帰る男の話です。約束を守れるかが物語を動かしますが、メロスも友も、一度は心が揺れたことを認めます。二人を最初から迷いのない英雄として読むより、弱さを明かしたうえで信頼を取り戻す過程に注目すると、再会の意味が見えてきます。", "sources": [{"title": "青空文庫・太宰治「走れメロス」本文", "url": "https://www.aozora.gr.jp/cards/000035/files/1567_14913.html"}]}, {"title": "『人間失格』では、誰が語るかを見る", "text": "『人間失格』の大部分は、大庭葉蔵という男の手記です。しかし、最初と最後には、手記を受け取った別の語り手がいます。葉蔵の厳しい自己評価と、彼を知る女性の見方も同じではありません。太宰の体験と関わる作品でも、葉蔵の言葉をすべて作者本人の告白と決めつけず、誰の目で語られているかを分けて読むことが大切です。", "sources": [{"title": "青空文庫・太宰治「人間失格」本文", "url": "https://www.aozora.gr.jp/cards/000035/files/301_14912.html"}]}, {"title": "一つの人物像だけに閉じ込めない", "text": "太宰には、語り手が自分の弱さを打ち明ける作品だけでなく、昔の話を語り直す『お伽草紙』や、故郷を旅する『津軽』もあります。この図鑑では、まず『走れメロス』と『人間失格』を行き来できます。同じ作家でも、人物の関係や語り方が変わると、読後に残る問いや感情も変わる。その違いが、次の作品へ進む入口になります。", "sources": [{"title": "三鷹市「太宰治略年譜」", "url": "https://www.city.mitaka.lg.jp/dazai/dazaitomitaka/nenpu.html"}, {"title": "青空文庫・太宰治「走れメロス」本文", "url": "https://www.aozora.gr.jp/cards/000035/files/1567_14913.html"}, {"title": "青空文庫・太宰治「人間失格」本文", "url": "https://www.aozora.gr.jp/cards/000035/files/301_14912.html"}]}], "andersen": [{"title": "物語に親しんだオーデンセの少年", "text": "ハンス・クリスチャン・アンデルセンは、1805年4月2日、デンマークのオーデンセに生まれました。父は靴直しの職人、母は洗濯の仕事をし、家計は苦しいものでした。それでも父が本を読み聞かせ、町の人々が昔話を語ってくれました。貧しい暮らしの中にも、本や語りを通して別の世界に触れる機会があったのです。", "sources": [{"title": "デンマーク王立図書館・アンデルセンの生涯", "url": "https://www.kb.dk/en/inspiration/hans-christian-andersens-manuscripts-and-letters/life-hans-christian-andersen"}]}, {"title": "十四歳で、舞台を目指す", "text": "1819年、十四歳のアンデルセンは故郷を離れ、コペンハーゲンへ向かいます。初めから童話作家を目指していたのではなく、俳優や歌手、踊り手として劇場で活躍したかったのです。しかし、なかなか道は開けませんでした。舞台への挑戦は成功しませんでしたが、劇場とのつながりは、その後の学びを支える人々との出会いにつながりました。", "sources": [{"title": "南デンマーク大学アンデルセン研究センター・短い伝記", "url": "https://andersen.sdu.dk/liv/biografi/index_e.html"}]}, {"title": "支援を受け、学び直す", "text": "劇場の運営に関わるヨナス・コリンの助けで、1822年から学校へ通います。スラーエルセ、ヘルシンゲルで学んだあと、コペンハーゲンで個人授業を受け、1828年に大学入学資格の試験に合格しました。舞台の仕事に挑戦したあと、もう一度勉強する道を通って、文学を書くための言葉や知識を身につけていきました。", "sources": [{"title": "南デンマーク大学アンデルセン研究センター・教育", "url": "https://andersen.sdu.dk/liv/biografi/skole_e.html"}]}, {"title": "昔話から、自分の童話へ", "text": "1835年には『子どもたちに語る童話』という小冊子の刊行を始めます。これは初めて文章を書いた年ではなく、それ以前にも詩や物語を発表していました。伝え聞いた昔話を語り直す一方、自分で新しい物語も作ったのが特徴です。昔話を集めただけの人ではありません。その後は本の題名から「子どもたちに」を外し、童話と物語を書き続けました。", "sources": [{"title": "南デンマーク大学アンデルセン研究センター・童話", "url": "https://andersen.sdu.dk/liv/biografi/eventyr_e.html"}, {"title": "南デンマーク大学アンデルセン研究センター・短い伝記", "url": "https://andersen.sdu.dk/liv/biografi/index_e.html"}]}, {"title": "旅をし、さまざまな作品を書く", "text": "アンデルセンの仕事は童話だけではありません。小説や詩、戯曲、旅行記にも取り組みました。外国を旅することも多く、イタリアで受けた印象は、1835年の小説『即興詩人』につながります。旅行記にはスウェーデンやスペインを題材にした本もあります。身近な暮らしから遠い国まで、観察の対象を広げた作家でした。", "sources": [{"title": "デンマーク王立図書館・アンデルセンの生涯", "url": "https://www.kb.dk/en/inspiration/hans-christian-andersens-manuscripts-and-letters/life-hans-christian-andersen"}, {"title": "南デンマーク大学アンデルセン研究センター・旅行記", "url": "https://andersen.sdu.dk/liv/biografi/rejseboeger_e.html"}]}, {"title": "三つの童話から、作品の幅を知る", "text": "1875年8月4日、七十歳で亡くなりました。『みにくいアヒルの子』には居場所を失う苦しさ、『人魚姫』には別の世界への願いと伝わらない思いが描かれます。一方、『裸の王様』は、周囲に合わせて本当のことを言えない人々を見つめます。優しい話ばかりでも、悲しい話ばかりでもありません。異なる三作を読むと、人の弱さや願いをさまざまな角度から描いたことが分かります。", "sources": [{"title": "南デンマーク大学アンデルセン研究センター・短い伝記", "url": "https://andersen.sdu.dk/liv/biografi/index_e.html"}, {"title": "Project Gutenberg Canada：M. R. James英訳全文・版情報", "url": "https://www.gutenbergca.gutenbergcanada.ca/ebooks/andersen-ugly/andersen-ugly-00-h.html"}, {"title": "Wikisource・Paull英訳「The Little Mermaid」全文", "url": "https://en.wikisource.org/wiki/Hans_Andersen's_Fairy_Tales/The_Little_Mermaid"}, {"title": "Wikisource・Paull英訳当該話全文", "url": "https://en.wikisource.org/wiki/Hans_Andersen's_Fairy_Tales/The_Emperor's_New_Clothes"}]}]};
function inlineScene(x,index){const a=(x.inlineIllustrations||[x.inlineIllustration]).filter(Boolean).find(a=>a.afterParagraph===index+1);if(!a)return '';return `<figure class="inline-illustration"><img src="${esc(a.src)}" width="${a.width}" height="${a.height}" alt="${esc(a.alt)}" loading="lazy" decoding="async"><figcaption>${bodyText(x,a.caption)}</figcaption></figure>`}
function summaryParagraphs(x){const seen=new Set(),readings=x.summaryReadings||{},words=Object.keys({...x.bodyReadings,...readings}).sort((a,b)=>b.length-a.length);return x.synopsisSummary.map((value,index)=>{let out='',i=0;while(i<value.length){const word=words.find(w=>value.startsWith(w,i));if(word){const info=readings[word];if(info){out+=seen.has(info.key)?esc(word):rubyText(word,info.reading);seen.add(info.key)}else{out+=rubyText(word,x.bodyReadings[word])}i+=word.length}else{out+=esc(value[i]);i++}}return `<p class="bodytext">${out}</p>`+inlineScene(x,index)}).join('')}
function renderIntroduction(x){main.innerHTML=`<button class="back" id="back">← 一覧に戻る</button><article class="article"><header class="articleheader${x.authorTextOnly?' author-text-only':''}"><div><span class="label">${esc(x.genreLabel)} / ${esc(x.introLabel||"絵本の紹介")}</span><h2>${titleText(x)}</h2><p class="meta">${byline(x)}</p>${articleDates(x)}<p class="subnote">結末に触れない紹介です。作品の全文・筋書き全体は掲載していません。</p></div><figure class="emblem-figure">${art(x)}<figcaption>${esc(x.motifCaption||"海や木を表す図鑑オリジナルの図柄です。")}<br>作品の挿絵・表紙や登場人物の再現ではありません。</figcaption></figure></header><div class="content"><section class="synopsis"><h3>どんな本？</h3><p class="bodytext">${bodyText(x,x.intro)}</p></section><section class="conclusion"><h3>読みどころ</h3><p class="bodytext">${bodyText(x,x.commentary)}</p><p class="subnote">本サイト独自の紹介・読み方の一例です。</p></section><section><h3>本の情報</h3><p class="bodytext">${esc(x.edition)}</p><p><a class="back" href="${esc(x.officialURL)}" target="_blank" rel="noopener noreferrer">${esc(x.officialLabel)} ↗</a></p></section><details><summary>出典・確認情報</summary><p class="subnote">出版社と書誌情報を確認して、独自の言葉で短く紹介しています。本文・台詞・表紙・挿絵は転載していません。</p><ul class="sources">${x.sources.map(z=>`<li><a href="${esc(z.url)}" target="_blank" rel="noopener noreferrer">${esc(z.title)} ↗</a></li>`).join('')}</ul><p class="subnote">確認日：2026年11月1日。刊行年は記載した日本語版の情報です。</p></details></div></article><section class="related"><div class="sectionhead"><h2>知識をつなぐ、次の一冊</h2></div><div class="grid">${x.links.map(id=>items.find(z=>z.id===id)).filter(Boolean).map(card).join('')}</div></section>`;document.getElementById('back').onclick=()=>{location.hash=lastListHash}}
const mascotDrafts=[{"id": "K-000003", "subject": "長十郎梨", "subjectReading": "ちょうじゅうろうなし", "name": "なしふみ", "category": "農業・地域の歴史", "timeScope": "歴史的な発祥の話。現在の栽培・販売状況は未確認", "factText": "長十郎梨は、現在の川崎区にあたる大師河原で生まれた梨の品種です。川崎市の資料では、1893年に当麻辰次郎の梨園で発見されたと伝えられ、当麻家の屋号から名前が付いたと紹介されています。地域の農業の歴史をたどる入口になる題材です。", "fictionText": "赤褐色の丸い梨をイメージした、静かな歴史案内役。無地の小さな本と葉のしおりを持ち、見つけた地域の話を一ページずつ書き留めます。名前、性格、持ち物はこの図鑑の創作です。", "sources": [{"title": "川崎市・かわさき区の宝物シート『長十郎梨のふるさと』", "url": "https://www.city.kawasaki.jp/kawasaki/cmsfiles/contents/0000025/25449/5-2.pdf", "publisher": "川崎市", "supports": "1893年の発見伝承、当麻辰次郎、屋号由来、地域との関係"}], "image": "assets/k-000003.webp", "imageAlt": "長十郎梨を題材にした非公式の創作キャラクター案", "imageSha256": "9810b6c99d2ca43fbddd18f9897ec0e4b338d5c3749eea54d8fd7720695725fe", "firstPublishedAt": "2026-11-01T23:09:38+09:00", "updatedAt": "2026-11-01T23:09:38+09:00"}, {"id": "K-000004", "subject": "奈良茶飯", "subjectReading": "ならちゃめし", "name": "ちゃめしびより", "category": "食文化・川崎宿", "timeScope": "歴史的な川崎宿との関係。現在の店舗・提供状況は未確認", "factText": "奈良茶飯は、東海道の川崎宿で知られた旅籠『万年屋』の名物でした。川崎区の公式紹介では、作品『東海道中膝栗毛』の弥次さん・喜多さんも食べたとされています。旅の道と食事を通して、昔の川崎宿のにぎわいを知る題材です。", "fictionText": "丸い飯椀を体に、やわらかな湯気を前髪にした、おもてなし好きの案内役。歩き疲れた旅人の話を聞くのが得意です。名前、性格、姿は創作で、当時の料理や器を正確に復元したものではありません。", "sources": [{"title": "川崎市川崎区『川崎宿とは』", "url": "https://www.city.kawasaki.jp/kawasaki/category/123-9-2-3-0-0-0-0-0-0.html", "publisher": "川崎市川崎区", "supports": "万年屋の名物、東海道中膝栗毛への言及"}], "image": "assets/k-000004.webp", "imageAlt": "奈良茶飯を題材にした非公式の創作キャラクター案", "imageSha256": "66165a2f06255ab782f092f98b907222c5816a2fda2f0606c3f0512ab1d6eec2", "firstPublishedAt": "2026-11-01T23:09:38+09:00", "updatedAt": "2026-11-01T23:09:38+09:00"}, {"id": "K-000005", "subject": "六郷の渡し舟", "subjectReading": "ろくごうのわたしぶね", "name": "ろくごうこぶね", "category": "交通・多摩川の歴史", "timeScope": "歴史題材。現在運航している渡し舟の案内ではない", "factText": "六郷川、現在の多摩川には1600年に六郷大橋が架けられました。川崎区の公式資料によると、1688年の大洪水で橋が流された後、1874年まで渡しが続けられました。舟で川を越えていた時代の交通を知る題材です。", "fictionText": "小さな木舟を体に、櫂を持ち、さざ波の足で歩く聞き上手。川の両岸で出会った人の話をつなぎます。 2.pdf", "publisher": "川崎市", "publishedDate": null, "publicationDateNote": "PDF本文の発行日は今回確定せず。検索エンジンの公開時期推定は採用しない", "dataPeriod": "令和4年度秋季・冬季", "pageReference": "PDF16ページ目、生活史型ごとの出現種数の説明（抽出テキストで確認）", "checkedDate": "2026-11-01", "supports": "計画区右岸＝川崎側、令和4年度秋季・冬季のマハゼ確認、汽水性の分類"}], "image": "assets/k-000010.webp", "imageAlt": "マハゼを題材にした非公式の創作キャラクター案", "imageSha256": "7e31f5d71477c5db0088f3a9f3cb794952ab5f825374f8e134b6a27d7bd1b737", "imageWidth": 900, "imageHeight": 450, "firstPublishedAt": "2026-11-01T23:22:36+09:00", "updatedAt": "2026-11-01T23:22:36+09:00"}, {"id": "K-000011", "subject": "ガントリークレーン", "subjectReading": "ガントリークレーン", "name": "おうぎはこび", "category": "港湾・東扇島の物流", "timeScope": "現代施設の題材。市公式概要の更新日は2024年4月10日。2026年の個別号機の稼働・更新完了は未確認", "factText": "東扇島にある川崎港コンテナターミナルは、1996年4月に供用を開始しました。川崎市の施設概要には、コンテナを扱うガントリークレーンが掲載されています。海から届く荷物と陸の物流をつなぐ、港の設備を知る題材です。", "fictionText": "門の形の脚と長い横梁を持つ、慎重で段取り上手な港の案内役。無地の小さなコンテナを、急がず大切に運ぶ設定です。名前、表情、性格は創作で、特定の号機の設計を再現したものではありません。", "sources": [{"title": "川崎市「川崎港コンテナターミナル」", "url": "https://www.city.kawasaki.jp/580/page/0000022057.html", "publisher": "川崎市港湾局", "publishedDate": "2018-02-17", "updatedDate": "2024-04-10", "checkedDate": "2026-11-01", "supports": "東扇島に立地、1996年4月供用開始、ガントリークレーンの掲載"}], "image": "assets/k-000011.webp", "imageAlt": "ガントリークレーンを題材にした非公式の創作キャラクター案", "imageSha256": "5944d9cb622ba333345824aa25f2cafd9b1c1ec3fb04801499ffc6bc754f492d", "imageWidth": 900, "imageHeight": 822, "firstPublishedAt": "2026-11-01T23:22:36+09:00", "updatedAt": "2026-11-01T23:22:36+09:00"}, {"id": "K-000001", "subject": "川崎大師のだるま", "subjectReading": "かわさきだいしのだるま", "name": "だるまこつこつ", "category": "文化・門前町の縁起物", "timeScope": "現在にも続く文化題材。資料にある店舗数・当年行事日程は現況として採用しない。", "factText": "川崎市の資料では、だるまは川崎大師の土産物の一つとして紹介されています。表参道や仲見世通りには、厄除けや開運を願うだるまを扱う店が並ぶと記されています。願いを込める縁起物を通して、門前町の文化を知る題材です。", "fictionText": "赤茶色の丸いだるまをイメージした、小さな努力を応援する案内役。無地の折りたたみメモを持ち、一日の「できたこと」を大切にします。名前、性格、持ち物は創作で、実物の縁起物や公認キャラクターの複製ではありません。", "sources": [{"title": "川崎市・かわさき区の宝物シート「川崎大師のだるま」", "url": "https://www.city.kawasaki.jp/kawasaki/cmsfiles/contents/0000025/25622/10-16.pdf", "publisher": "川崎市川崎区", "publishedDate": null, "publicationDateNote": "資料本体の発行・更新日を確定できず。閲覧確認日と区別。", "checkedDate": "2026-11-01", "supports": "大師の土産物、表参道・仲見世通り、縁起物としての地域文化"}], "image": "assets/k-000001.webp", "imageAlt": "川崎大師のだるまを題材にした非公式の創作キャラクター案", "imageSha256": "8548c54d9040c0d134652d07a4a8cf8d31ce3bf115ffd569860cb425f6ef528f", "imageWidth": 900, "imageHeight": 860, "reviewNote": "既存候補の仮リデザインです。以前の原案画像との照合は未完了で、旧原案の置き換えや正式登録ではありません。", "firstPublishedAt": "2026-11-01T23:30:23+09:00", "updatedAt": "2026-11-01T23:30:23+09:00"}, {"id": "K-000002", "subject": "久寿餅", "subjectReading": "くずもち", "name": "くずもちこはく", "category": "食文化・川崎大師の土産", "timeScope": "現在にも続く食文化。店舗数・値段・保存条件・商品仕様の現況を示すカードではない。", "factText": "久寿餅は川崎大師の定番土産として知られ、川崎市の資料では表参道や仲見世通りとのつながりが紹介されています。黒蜜ときな粉を合わせて味わう菓子です。小麦のでんぷんを使う川崎大師の久寿餅を、葛粉の菓子と混同しないことも大切です。", "fictionText": "白くやわらかそうな餅の一切れに、黒蜜色の小さなしずく飾りときな粉色の頬を添えた案内役。ゆっくり話を聞くおだやかな性格です。名前、表情、飾りは創作で、特定店舗の包装や商品を再現したものではありません。", "sources": [{"title": "川崎市・かわさき区の宝物シート「川崎大師久寿餅」", "url": "https://www.city.kawasaki.jp/kawasaki/cmsfiles/contents/0000025/25622/10-14.pdf", "publisher": "川崎市川崎区", "publishedDate": null, "publicationDateNote": "資料本体の発行・更新日を確定できず。閲覧確認日と区別。", "checkedDate": "2026-11-01", "supports": "定番土産、表参道と仲見世通り、黒蜜・きな粉、主に小麦粉由来のくず餅の説明"}, {"title": "川崎市「かわさき名産品」和菓子紹介", "url": "https://www.city.kawasaki.jp/280/cmsfiles/contents/0000020/20067/meisanhinP1-P11.pdf", "publisher": "川崎市", "publishedDate": null, "publicationDateNote": "資料本体の発行・更新日を確定できず。閲覧確認日と区別。", "checkedDate": "2026-11-01", "supports": "大師町の久寿餅商品で小麦のでんぷんを発酵し蒸す製法を紹介。特定商品の工程期間は一般化しない"}], "image": "assets/k-000002.webp", "imageAlt": "久寿餅を題材にした非公式の創作キャラクター案", "imageSha256": "469e35d1fc16d427a1383ab3955688bc236e24732e9d570a65181c48869e4d98", "imageWidth": 900, "imageHeight": 600, "reviewNote": "既存候補の仮リデザインです。以前の原案画像との照合は未完了で、旧原案の置き換えや正式登録ではありません。", "firstPublishedAt": "2026-11-01T23:30:23+09:00", "updatedAt": "2026-11-01T23:30:23+09:00"}, {"id": "K-000015", "subject": "京急大師線", "subjectReading": "けいきゅうだいしせん", "name": "だいしみちしおり", "category": "交通・大師地域の鉄道", "timeScope": "現在の路線と1899年の開業史を区別。昔の六郷橋〜大師を現在の全区間と同一視しない。", "factText": "京急の公式駅紹介によると、前身の大師電気鉄道は1899年1月に六郷橋と大師の間を開通させました。このとき大師駅として開業したのが、現在の川崎大師駅です。駅は川崎区大師駅前にあり、大師線と地域の歩みを結ぶ題材になります。", "fictionText": "鉄道をたどる旅のしおりから生まれた、折り地図形の案内役。二本の細い線を道しるべに、昔と今のまちの話をつなぎます。地図の形、名前、性格は創作で、京急の車両・乗車券・路線図や公式マスコットではありません。", "sources": [{"title": "京浜急行電鉄「川崎大師駅」駅の概要", "url": "https://www.keikyu.co.jp/ride/kakueki/KK23.html", "publisher": "京浜急行電鉄株式会社", "publishedDate": null, "publicationDateNote": "資料本体の発行・更新日を確定できず。閲覧確認日と区別。", "checkedDate": "2026-11-01", "supports": "明治32年1月の六郷橋〜大師開通、大師駅として開業、川崎区大師駅前の所在地、現在の大師線案内"}], "image": "assets/k-000015.webp", "imageAlt": "京急大師線を題材にした非公式の創作キャラクター案", "imageSha256": "b83518e42915c3caf6c84e3ef1ca4485ca4a7c468c32d2a94e25b0b9a753f35c", "imageWidth": 900, "imageHeight": 842, "reviewNote": "既存候補の仮リデザインです。以前の原案画像との照合は未完了で、旧原案の置き換えや正式登録ではありません。", "firstPublishedAt": "2026-11-01T23:30:23+09:00", "updatedAt": "2026-11-01T23:30:23+09:00"}, {"id": "K-000012", "subject": "コンテナ船", "subjectReading": "こんてなせん", "name": "はこなみつむぎ", "category": "港湾・海の物流", "timeScope": "現代の港湾物流の題材。2025年の入港記録を根拠にし、現在の便数や運航日程は主張しない。", "factText": "川崎港のコンテナターミナルは東扇島にあります。川崎市は、2025年6月に新たな定期航路のコンテナ船が初入港したことを発表しました。箱型のコンテナを積んで港と港を結ぶ船は、川崎区と海の向こうの物流のつながりを知る題材です。", "fictionText": "短く丸い船体に、無地の小さなコンテナを並べた案内役。荷物に込められた人の思いを大切につなぐ性格です。名前、顔、配色は創作で、実在する船名や船社の公式キャラクターではありません。", "sources": [{"title": "川崎市「川崎港コンテナターミナル」", "url": "https://www.city.kawasaki.jp/580/page/0000022057.html", "publisher": "川崎市港湾局", "publishedDate": null, "checkedDate": "2026-11-01", "supports": "東扇島への立地。施設概要の更新日2024-04-10", "publicationDateNote": "日付なしは発行日未確定。閲覧確認日とは区別。"}, {"title": "川崎市「川崎港に新たなコンテナ定期航路が開設されました」", "url": "https://www.city.kawasaki.jp/templates/prs/cmsfiles/contents/0000177/177826/hatunyuukou.pdf", "publisher": "川崎市港湾局", "publishedDate": "2025-06-23", "checkedDate": "20
