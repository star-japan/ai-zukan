const items = [{"id": "rashomon", "image": "assets/rashomon.webp", "imageAlt": "雨の羅生門を描いた作品イメージ", "synopsisSummary": ["荒廃した京都。主人に暇を出された下人が、雨の降る夕方、羅生門の下で途方に暮れている。生活の当てはなく、このままでは飢え死にする。しかし、盗人になる決心もつかない。夜を過ごそうと門の楼へ上がると、そこには捨てられた死体が並び、老婆が女の死体から髪を抜いていた。下人は激しい怒りを覚え、老婆を捕らえて理由を問いただす。老婆は、抜いた髪でかつらを作るのだと答える。さらに、死んだ女も生前は蛇を干魚と偽って売っていたが、生きるためだったのだから仕方がない、自分の行為も同じだと弁明する。", "その言葉を聞くうち、下人の心に、それまでなかった勇気が生まれる。下人は、自分が着物を奪うのも飢え死にを避けるためだと言い放ち、老婆の着物をはぎ取って暗闇へ姿を消す。悪を憎んでいたはずの男は、他人の弁明を、自分の悪事を正当化する理由へと変えてしまった。"], "questions": ["下人は、老婆のどの言葉を境に態度を変えたのだろう。本文からその前後を比べてみよう。", "自分と他人に同じ基準を当てているだろうか。日常の判断を振り返る手がかりになるだろうか。"], "cat": "literature", "name": "羅生門", "sub": "芥川龍之介｜1915年発表", "motif": "gate", "gist": "生き延びるためなら、悪事は許されるのか。悪を責めた男が、同じ理屈で悪へ踏み出す物語。", "intro": "仕事を失った下人が、荒れ果てた京都の羅生門で雨を避けている。このままでは飢えてしまうが、盗人になる決心もつかない。夜を過ごそうと門の楼へ上がると、死体のそばで何かをしている老婆を見つける。", "people": [["下人（げにん）", "失業し、生きる手段と善悪の間で揺れる男。"], ["老婆", "死体から髪を抜き、生計を立てようとする女。"]], "theme": "下人の怒りが、老婆の弁明を境に自分の悪事を支える理屈へ変わる。その転換を追うと、「生きるため」という言葉が、誰の立場から語られるかで異なる働きをすることが見えてくる。これは読み方の一例であり、作品の意味を一つに限定するものではない。", "memory": "善悪の基準が揺れる、その瞬間に注目する。", "links": ["akutagawa", "hana", "spider"], "sources": [{"title": "青空文庫「羅生門」本文", "url": "https://www.aozora.gr.jp/cards/000879/files/127_15260.html"}, {"title": "青空文庫 図書カード（初出：1915年11月）", "url": "https://www.aozora.gr.jp/cards/000879/card127.html"}], "reading": "らしょうもん", "bodyReadings": {"楼": "ろう", "干魚": "ほしうお", "盗人": "ぬすびと"}, "summaryReadings": {"下人": {"reading": "げにん", "key": "下人"}}}, {"id": "akutagawa", "reading": "あくたがわりゅうのすけ", "cat": "person", "name": "芥川龍之介", "sub": "1892–1927｜小説家", "motif": "book", "gist": "古い物語を手がかりに、人間の心を新しく描いた作家。『羅生門』『鼻』『蜘蛛の糸』をつなぐ人物。", "intro": "芥川龍之介は、1892年に東京で生まれ、1927年に亡くなった小説家。『羅生門』『鼻』『蜘蛛の糸』などの短編で知られる。古典や説話を題材にしながら、他人の目を気にする心、利己心、善悪の揺らぎなどを描いた。ここではまず三つの作品を読み比べ、それぞれの人物が何を望み、どのように変化するのかをたどってみよう。", "people": [["読む入口", "『羅生門』では善悪の転換、『鼻』では自尊心と他人の視線、『蜘蛛の糸』では救いと利己心が読みどころとなる。"]], "theme": "同じ作家の作品を並べても、人物や結末は異なる。共通点を探すと同時に、作品ごとの語り方の違いにも目を向けたい。", "memory": "作品を読み、作家に戻り、次の作品へ進む。", "links": ["rashomon", "hana", "spider"], "sources": [{"title": "国立国会図書館「近代日本人の肖像」芥川龍之介", "url": "https://www.ndl.go.jp/portrait/datas/224/"}]}, {"id": "hana", "image": "assets/hana.webp", "imageAlt": "僧・禅智内供を描いた作品イメージ", "synopsisSummary": ["池の尾に住む僧・禅智内供には、あごの下まで垂れ下がる長い鼻があった。食事にも不便な鼻だが、内供が何より苦しんでいたのは、人からどう見られるかということだった。それでも、鼻を気にしていると思われたくない。経典に自分のような鼻の持ち主を探し、短くする方法を試しても、悩みは消えなかった。あるとき、弟子が鼻を短くする方法を聞いてくる。内供は平静を装いながら、その方法を試し、ついに普通の長さの鼻を手に入れる。", "ところが、願いがかなった後、人々は以前にも増して内供を笑うようになる。周囲の態度を理解できない内供は、いら立ちを募らせていく。ある朝、鼻は元の長さに戻っていた。手で鼻を確かめた内供は、以前の姿に戻ったにもかかわらず、不思議な安心を感じる。これでもう誰も笑わないだろうと思う内供の心は、外見だけを変えても解けなかった悩みを浮かび上がらせる。"], "questions": ["鼻を短くする前と後で、内供の願いと周囲の反応はどう食い違っているだろう。", "人の悩みが解消したとき、素直に喜べないことはあるだろうか。自分の気持ちと語り手の説明を比べてみよう。"], "cat": "literature", "name": "鼻", "sub": "芥川龍之介｜1916年発表", "motif": "ripple", "gist": "悩みの種がなくなれば、幸せになれるはずだった。長い鼻をめぐり、自尊心と他人の視線が交錯する物語。", "intro": "長い鼻に悩む僧の禅智内供は、人からどう見られているかが気になって仕方がない。それでも、鼻を気にしているとは知られたくない。そんな内供（ないぐ）のもとへ、弟子が鼻を短くする方法を持ち帰る。", "people": [["禅智内供（ぜんち ないぐ）", "長い鼻と、人からの見られ方を気にする僧。"], ["弟子・周囲の人々", "鼻を短くする方法を伝えたり、変化した内供を笑ったりする人々。"]], "theme": "作品は、当人の自尊心だけでなく、他人の不幸には同情しても、その人が悩みから抜け出すと別の感情を抱く、周囲の複雑な心理も描く。内供の安心が本当に問題の解決なのか、結末から考えることもできる。", "memory": "鼻の長さよりも、他人の目に心が揺れる。", "links": ["akutagawa", "rashomon"], "sources": [{"title": "青空文庫「鼻」本文", "url": "https://www.aozora.gr.jp/cards/000879/files/42_15228.html"}, {"title": "青空文庫 図書カード（初出：1916年2月）", "url": "https://www.aozora.gr.jp/cards/000879/card42.html"}], "reading": "はな", "bodyReadings": {"禅智内供": "ぜんちないぐ"}, "summaryReadings": {"禅智内供": {"reading": "ぜんち ないぐ", "key": "禅智内供"}, "内供": {"reading": "ないぐ", "key": "禅智内供"}}}, {"id": "spider", "image": "assets/spider.webp", "imageAlt": "蓮池と蜘蛛の糸を描いた作品イメージ", "synopsisSummary": ["ある朝、極楽の蓮池のほとりを歩いていた釈迦は、池の底に広がる地獄をのぞき見る。そこには、血の池で苦しむ犍陀多という男がいた。犍陀多は多くの悪事を働いたが、生前、一匹の蜘蛛を踏み殺さずに助けたことがあった。釈迦はその小さな善行を思い出し、極楽の蜘蛛の糸を地獄へ垂らす。糸を見つけた犍陀多は、これを登れば地獄から抜け出せると考え、夢中で上を目指す。しばらく登って休み、下を見ると、無数の罪人たちが同じ糸を伝って続いていた。", "犍陀多は、その重さで糸が切れれば自分も落ちてしまうと恐れる。そして、この糸は自分のものだ、下りろ、と叫ぶ。その瞬間、糸は犍陀多がぶら下がっているところで切れ、男は再び地獄へ落ちていった。釈迦はその一部始終を見て悲しそうな顔をし、歩き続ける。極楽では、何事もなかったように蓮の花が香りを漂わせている。"], "questions": ["犍陀多は、与えられた糸をいつから「自分のもの」と考えたのだろう。言葉の変化に注目してみよう。", "限られた機会を他の人と分かち合う場面で、不安は判断にどう影響するだろう。作品と現実の違いにも目を向けよう。"], "cat": "literature", "name": "蜘蛛の糸", "sub": "芥川龍之介｜1918年発表", "motif": "thread", "gist": "一本の糸にすがった男は、後から来る人々を拒んだ。救いを独り占めしようとする心を描く物語。", "intro": "地獄で苦しむ犍陀多は、生前に多くの悪事を働いた男だった。けれども、一度だけ小さな蜘蛛の命を助けたことがある。極楽からその姿を見た釈迦は、その善行を思い出し、一本の蜘蛛の糸を垂らす。", "people": [["犍陀多（かんだた）", "地獄から逃れようと蜘蛛の糸を登る男。"], ["釈迦（しゃか）", "犍陀多の小さな善行を思い出し、救いの糸を垂らす。"]], "theme": "小さな善行によって与えられた救いの機会を、犍陀多はどう受け止めたのか。糸を「自分のもの」と考えた瞬間に注目すると、利己心と救済の関係を読み取れる。", "memory": "登る高さよりも、他者に向ける心が問われる。", "links": ["akutagawa", "rashomon"], "sources": [{"title": "青空文庫「蜘蛛の糸」本文", "url": "https://www.aozora.gr.jp/cards/000879/files/92_14545.html"}, {"title": "青空文庫 図書カード（初出：1918年7月）", "url": "https://www.aozora.gr.jp/cards/000879/card92.html"}], "reading": "くものいと", "bodyReadings": {"犍陀多": "かんだた", "釈迦": "しゃか", "蓮池": "はすいけ", "蜘蛛": "くも"}, "summaryReadings": {"犍陀多": {"reading": "かんだた", "key": "犍陀多"}, "釈迦": {"reading": "しゃか", "key": "釈迦"}}}, {"id": "kawasaki", "cat": "region", "name": "川崎区ゆるキャラ大図鑑", "sub": "地域文化｜企画・準備中", "motif": "town", "gist": "地域の産業・歴史・文化を、オリジナルキャラクターから知る。これから育てる川崎区の図鑑。", "intro": "川崎区に実在する、または歴史的に存在した題材を調べ、オリジナルキャラクターと解説を組み合わせる企画です。産業、港湾、交通、寺社、暮らしなどを入口に、人物や場所、時代のつながりを紹介する構成を考えています。現在は制作中のキャラクター案を紹介しています。名称とデザインは仮案で、完成版として正式登録したものではありません。公的資料などで事実と出典を確かめ、創作部分とは分けて追加していきます。", "people": [["今後の掲載方針", "題材の名称、確認した出典、史実と創作の区別、確認日を記録する。"], ["キャラクターについて", "このサイト独自の創作を予定。自治体公認や既存の公式キャラクターであることを意味しない。"]], "theme": "親しみやすい入口から、元になった地域の本当の姿へ進める図鑑を目指す。まだ確認できていない歴史、所在地、関係性は事実として掲載しない。", "memory": "キャラクターの向こうにある、地域の物語をたどる。", "links": [], "sources": [{"title": "川崎市公式「川崎区の概要」", "url": "https://www.city.kawasaki.jp/kawasaki/page/0000026330.html"}]}, {"id": "melos", "cat": "literature", "name": "走れメロス", "sub": "太宰治｜1940年発表", "motif": "road", "gist": "約束の時までに戻らなければ、友が処刑される。迷いと疲労の中を走る男を通して、信頼を問い直す物語。", "intro": "人を信じず、次々と人を殺す王に怒った羊飼いのメロスは、捕らえられて死刑を宣告される。妹の婚礼を済ませるため、友を身代わりに残して村へ帰ることになった。約束の期限は、三日目の日没である。", "synopsisSummary": ["羊飼いのメロスは、妹の婚礼の買い物に来た町で、王が人を信じず、多くの人々を殺していると知る。怒ったメロスは王城へ入り、捕らえられて死刑を宣告される。妹の結婚式を済ませたいと願い、友人セリヌンティウスを身代わりに残して、三日目の日没までに戻る約束をする。村へ帰ったメロスは妹の婚礼を見届け、再び町へ向かう。途中、川の氾濫や山賊に阻まれ、疲れ果てて一度は約束を投げ出しそうになる。", "それでも泉の水で力を取り戻し、待つ友のもとへ走る。処刑の直前に到着したメロスは、自分が途中で弱い心を抱いたことを友に告白する。友もまた、一度だけメロスを疑ったと打ち明ける。二人は互いを殴って抱き合い、その姿を見た王は、人の心の真実を認めて仲間に入れてほしいと願う。人々の歓声の中、メロスは少女からマントを差し出され、裸体を友に指摘されて赤面する。"], "people": [["メロス", "王に怒り、友との約束を守るために帰路を走る羊飼い。"], ["セリヌンティウス", "メロスの身代わりとして刑場で待つ友人。"], ["王ディオニス", "人を信じず、メロスが戻らないことを予想する王。"]], "theme": "信頼は、疑いや弱さが一度も生まれないことなのだろうか。二人が再会後に互いの揺らぎを告白する場面を読むと、信頼を支える行動や正直さにも目を向けられる。これは読み方の一例で、作品を単純な教訓だけに限定するものではない。", "memory": "走り切った結果だけでなく、途中の迷いと再会後の告白を読む。", "questions": ["メロスが走る理由は、出発時と泉の水を飲んだ後でどう変わっているだろう。", "相手を一度疑ったことと、信頼を失うことは同じだろうか。二人の告白を手がかりに考えてみよう。"], "links": ["rashomon", "gongitsune"], "sources": [{"title": "青空文庫「走れメロス」本文", "url": "https://www.aozora.gr.jp/cards/000035/files/1567_14913.html"}, {"title": "青空文庫 図書カード", "url": "https://www.aozora.gr.jp/cards/000035/card1567.html"}, {"title": "国立国会図書館 レファレンス協同データベース（1940年5月の掲載調査）", "url": "https://crd.ndl.go.jp/reference/detail?page=ref_view&id=1000244878"}], "reading": "はしれメロス", "image": "assets/melos.webp", "imageAlt": "夕暮れの道を走るメロスの作品イメージ"}, {"id": "restaurant", "cat": "literature", "name": "注文の多い料理店", "sub": "宮沢賢治｜1924年・同名童話集収録の一編", "motif": "doors", "gist": "歓迎されていると思って進んだ料理店で、客自身が料理されようとしていた。言葉の受け取り方が逆転する物語。", "intro": "山奥へ狩りに来た二人の紳士は、案内人とはぐれ、空腹のまま道に迷ってしまう。そこへ現れたのが、西洋料理店「山猫軒（やまねこけん）」。歓迎の言葉に安心して入るが、奥へ進むたびに、扉には不思議な注文が書かれている。", "synopsisSummary": ["二人の若い紳士が、猟銃と犬を連れて山奥へ狩りに出かける。獲物は見つからず、案内人ともはぐれ、二匹の犬も倒れてしまう。腹をすかせた二人は、西洋料理店「山猫軒」を見つける。入口には歓迎の言葉があり、奥へ進むたびに、扉に次々と指示が書かれている。髪や靴をきれいにし、鉄砲を置き、帽子・外套・靴を脱ぎ、金属の品を外すこと。二人はどれも、立派な店の作法や、料理を食べるための準備だと都合よく考えて従う。", "さらにクリームを塗り、酢くさい香水を振りかけ、塩を体にもみ込むよう求められたところで、自分たちが食べられる側なのだと気づく。奥から聞こえる声におびえ、泣き出した二人の顔は、紙くずのようにしわくちゃになる。そこへ先ほどの犬が現れて奥へ飛び込み、料理店は消える。案内人と再会して東京へ帰った二人だが、その顔は元には戻らない。"], "people": [["二人の紳士（しんし）", "狩りに来た青年たち。店の注文を自分たちに都合よく理解する。"], ["山猫軒（やまねこけん）の奥の声", "二人を奥へ誘い、料理の準備を進める存在。"], ["二匹の犬", "店の奥へ飛び込み、危機の場面を変える。"]], "theme": "同じ言葉でも、受け手の期待によって意味が違って見える。二人が注文をどう説明しているかを追うと、危険の手がかりを見落とす仕組みが浮かぶ。また、動物を狩る人間が食べられる側になる逆転から、人と自然の関係を考える読み方もできる。", "memory": "扉の言葉を、客の側と店の側の両方から読み直す。", "questions": ["どの扉の言葉から、二人とは違う意味を読み取れただろう。初めに戻って確かめてみよう。", "期待していることに合う説明だけを選んでしまう場面は、日常にもあるだろうか。物語との違いも考えよう。"], "links": ["spider", "gongitsune"], "sources": [{"title": "青空文庫「注文の多い料理店」本文", "url": "https://www.aozora.gr.jp/cards/000081/files/43754_17659.html"}, {"title": "青空文庫 図書カード（1924年刊行の童話集に収録）", "url": "https://www.aozora.gr.jp/cards/000081/card43754.html"}], "reading": "ちゅうもんのおおいりょうりてん", "image": "assets/restaurant.webp", "imageAlt": "森にたたずむ料理店の作品イメージ", "summaryReadings": {"紳士": {"reading": "しんし", "key": "紳士"}, "山猫軒": {"reading": "やまねこけん", "key": "山猫軒"}}}, {"id": "gongitsune", "cat": "literature", "name": "ごん狐", "sub": "新美南吉｜1932年発表", "motif": "fox", "gist": "いたずらを悔いた狐は、名乗らずに贈り物を届け続けた。思いが相手へ届くまでのすれ違いを描く物語。", "intro": "ひとりぼっちの小狐ごんは、村の人にいたずらをして暮らしている。ある日、兵十が川で捕った魚を逃がし、うなぎを持ち去ってしまった。しばらくして兵十の母の葬式を見たごんは、自分のしたことが気になり始める。", "synopsisSummary": ["村の近くに住む小狐のごんは、ひとりぼっちで、いたずらばかりしていた。ある日、兵十が川で捕った魚を逃がし、うなぎも持ち去る。やがて兵十の母の葬式を見たごんは、あのうなぎは病気の母に食べさせるものだったのではないかと思い、後悔する。自分と同じひとりぼっちになった兵十のために、ごんは償いを始める。最初は魚屋から盗んだいわしを家に入れるが、兵十は盗人と思われて殴られてしまう。その後、ごんは栗や松たけを届けるようになる。", "贈り主を知らない兵十は、加助から神様のしわざだと言われる。話を聞いたごんは、自分に礼を言ってもらえないことを面白くないと感じる。ある日、栗を持って家に入ったごんを見た兵十は、またいたずらに来たと思い、火縄銃で撃つ。土間に置かれた栗を見て初めて贈り主に気づいた兵十が問いかけると、ごんは目をつぶったままうなずく。銃口から青い煙が出る中、物語は終わる。"], "people": [["ごん", "ひとりぼっちの小狐。いたずらを悔い、兵十へ贈り物を届ける。"], ["兵十（ひょうじゅう）", "母を亡くした村人。贈り主がごんだとは知らない。"], ["加助（かすけ）", "不思議な贈り物は神様のしわざではないかと話す村人。"]], "theme": "ごんが知っていることと、兵十が知っていることは異なる。善意があっても、相手がその意図を知らなければ同じようには受け取れない。二人のすれ違いを情報の差から読むと、単にどちらか一方を責めるだけでは捉えきれない悲しさに気づける。", "memory": "何が起きたかに加えて、誰が何を知っていたかをたどる。", "questions": ["それぞれの場面で、ごんだけが知っていること、兵十だけが知っていることを分けてみよう。", "よかれと思った行動が違う意味に受け取られるのは、どんなときだろう。作品にない解決を正解とせず考えてみよう。"], "links": ["hana", "melos"], "sources": [{"title": "青空文庫「ごん狐」本文", "url": "https://www.aozora.gr.jp/cards/000121/files/628_14895.html"}, {"title": "青空文庫 図書カード（初出：1932年1月）", "url": "https://www.aozora.gr.jp/cards/000121/card628.html"}], "reading": "ごんぎつね", "image": "assets/gongitsune.webp", "imageAlt": "秋の里にいる狐のごんの作品イメージ", "summaryReadings": {"兵十": {"reading": "ひょうじゅう", "key": "兵十"}, "加助": {"reading": "かすけ", "key": "加助"}}}, {"id": "gloves", "cat": "literature", "name": "手袋を買いに", "sub": "新美南吉｜1943年・没後発表", "motif": "gloves", "gist": "人間を怖がる母に代わり、子狐がひとりで手袋を買いに行く。小さな買い物を通して、思い込みと実際の出会いを描く物語。", "intro": "雪の中で遊んだ子狐は、手が冷たくなってしまう。母狐は手袋を買ってやろうとするが、人間の町へ近づくのが怖い。そこで子狐の片手を人間の子供の手に変え、店では必ずその手を出すよう言い聞かせる。", "synopsisSummary": ["雪で手を冷やした子狐に、母狐は手袋を買おうとする。しかし以前、人間に追われたことを思い出し、町へ進めなくなる。母は子狐の片手を人間の手に変え、二枚の硬貨を持たせる。店の戸をたたき、人間の手を差し出して手袋を頼むよう教え、ひとりで送り出す。ところが子狐は、戸の隙間から漏れる光に驚き、間違えて狐の手を出してしまう。", "帽子屋は狐だと気づくが、受け取ったお金が本物だと確かめ、手袋を売ってくれる。恐ろしい目に遭わなかった子狐は、帰り道で人間の母子の優しい会話を聞き、自分の母が恋しくなる。母狐のもとへ戻った子狐は、狐の手を出しても大丈夫だったと話す。母は驚き、喜びながら、人間は本当にいいものなのかと繰り返しつぶやく。子の体験は、母が抱いていた人間への見方を問い直すきっかけになった。"], "people": [["子狐", "雪遊びで手を冷やし、ひとりで町へ手袋を買いに行く。"], ["母狐", "人間を怖がりながら、子狐に買い物の仕方を教える。"], ["帽子屋", "子狐の差し出した硬貨を確かめ、手袋を売る店の主人。"]], "links": ["gongitsune", "restaurant"], "sources": [{"title": "青空文庫「手袋を買いに」本文", "url": "https://www.aozora.gr.jp/cards/000121/files/637_13341.html"}, {"title": "青空文庫 図書カード（1943年9月刊の童話集に収録）", "url": "https://www.aozora.gr.jp/cards/000121/card637.html"}, {"title": "東京外国語大学文書館 新美南吉展資料（1933年執筆と1943年発表を区別）", "url": "https://www.tufs.ac.jp/common/archives/pamphlet-niiminankichi.pdf"}], "reading": "てぶくろをかいに", "image": "assets/gloves.webp", "imageAlt": "雪の夜に手袋を買いに行く子狐の作品イメージ"}, {"id": "goshu", "cat": "literature", "name": "セロ弾きのゴーシュ", "sub": "宮沢賢治｜1934年・没後発表", "motif": "cello", "gist": "楽団で叱られてばかりのセロ奏者の家に、毎晩動物がやって来る。思いがけない相手とのやり取りが、演奏と心を変えていく物語。", "intro": "楽団でセロを弾くゴーシュは、演奏がうまくいかず、楽長に叱られてばかりいる。夜、自宅でも一人で練習を続けていると、三毛猫が訪ねてきた。それを皮切りに、動物たちが次々と彼の家に現れる。", "synopsisSummary": ["ゴーシュは音楽会を前に、楽団で何度も演奏を注意される。夜も家で練習していると三毛猫が来て、曲を弾いてほしいと頼む。ゴーシュは腹を立て、激しい曲を弾いて追い返す。次の晩にはかっこうが来る。鳴き声に合わせるうちにその音程に感心するが、最後は怒って追い立ててしまう。その次の晩、狸の子は二本の棒でセロをたたいて拍子を取り、ゴーシュの弦の音が遅れるところを教える。", "続いて野ねずみの母子が訪れ、子の病気を治してほしいと頼む。ゴーシュが子をセロの中に入れて弾くと、子は元気になり、母は喜ぶ。やがて音楽会は成功し、アンコールで一人演奏したゴーシュは、楽長や仲間に認められる。動物との夜を重ねるうちに、演奏は変わっていた。帰宅したゴーシュは、かっこうを思い出し、遠くの空に向かって、あのときはすまなかったと語りかける。"], "people": [["ゴーシュ", "楽団でセロを弾く青年。自宅でも練習を続けている。"], ["訪ねてくる動物たち", "三毛猫、かっこう、狸の子、野ねずみの母子。それぞれ用事や願いを持って来る。"], ["楽長と楽団の仲間", "音楽会へ向けてゴーシュと合奏し、演奏を見守る。"]], "links": ["restaurant", "hana"], "sources": [{"title": "青空文庫「セロ弾きのゴーシュ」本文", "url": "https://www.aozora.gr.jp/cards/000081/files/470_15407.html"}, {"title": "青空文庫 図書カード", "url": "https://www.aozora.gr.jp/cards/000081/card470.html"}, {"title": "川崎市アートセンター公演公式紹介（1934年発表の記載）", "url": "https://www.artericca-shinyuri.com/program2024/detail/0429-02.php"}], "reading": "セロひきのゴーシュ", "image": "assets/goshu.webp", "imageAlt": "セロを弾くゴーシュと動物の作品イメージ"}, {"id": "toshishun", "cat": "literature", "name": "杜子春", "sub": "芥川龍之介｜1920年発表", "motif": "mountain", "gist": "お金があれば近づき、なくなると離れていく人々に疲れた青年が、仙人を目指す。厳しい試練の中で、手放せない思いに気づく物語。", "intro": "財産を使い果たした杜子春が、洛陽の町で途方に暮れていると、不思議な老人が声をかけてくる。老人は、ある場所を掘れば黄金が見つかると教える。一夜にして豊かになれる話を聞いた杜子春は、そこへ向かう。", "synopsisSummary": ["杜子春は、老人に黄金のありかを教えられ、大金持ちになる。だが浪費して財産を失い、寄りついていた人々も離れていく。老人にもう一度助けられても、同じことを繰り返す。金の有無で態度を変える人々に失望した杜子春は、三度目には金を求めず、老人のような仙人になりたいと願う。老人は鉄冠子と名乗り、どんなことがあっても声を出さないよう命じる。", "杜子春は恐ろしい目に遭い、地獄で責められても黙り続ける。しかし馬の姿にされた父母が打たれ、母が自分の苦しみより息子を気遣う声を聞くと、思わず母を呼ぶ。その瞬間、元の洛陽へ戻っていた。鉄冠子は、父母を見ても黙っていたら命を絶つつもりだったと明かす。杜子春が人間らしい正直な暮らしを望むと、家と畑を与えると告げる。"], "people": [["杜子春（とししゅん）", "富を失って人々に失望し、仙人になりたいと願う青年。"], ["鉄冠子（てっかんし）", "老人の姿で現れ、杜子春を助けたあと試練を与える仙人。"], ["杜子春の父母", "試練の中で馬の姿となって現れる。母は責められながらも息子を気遣う。"]], "links": ["akutagawa", "spider", "rashomon"], "sources": [{"title": "青空文庫「杜子春」本文（末尾に1920年7月の初出）", "url": "https://www.aozora.gr.jp/cards/000879/files/43015_17432.html"}, {"title": "青空文庫 図書カード", "url": "https://www.aozora.gr.jp/cards/000879/card43015.html"}], "reading": "とししゅん", "image": "assets/toshishun.webp", "imageAlt": "杜子春と仙人の作品イメージ", "bodyReadings": {"鉄冠子": "てっかんし", "洛陽": "らくよう"}, "summaryReadings": {"杜子春": {"reading": "とししゅん", "key": "杜子春"}, "鉄冠子": {"reading": "てっかんし", "key": "鉄冠子"}}}, {"id": "yodaka", "cat": "literature", "name": "よだかの星", "reading": "よだかのほし", "sub": "宮沢賢治｜1934年・没後発表", "motif": "starbird", "gist": "見た目や名前を理由に追い詰められた鳥が、空の向こうに居場所を求める。孤独と、生きることの苦しさを描く物語。", "intro": "よだかは、見た目を理由にほかの鳥から嫌われている。ある日、鷹から名前を変えろと脅され、従わなければ命まで奪うと言われる。自分が虫を食べて生きていることにも苦しむよだかは、遠い空を見上げる。", "synopsisSummary": ["よだかは、見た目のために鳥たちから嫌われ、鷹には名前を変えなければ殺すと脅される。夜空で虫を捕らえるよだかは、自分もほかの命を奪っていることに気づき、苦しくなる。弟のかわせみに遠くへ行くと告げ、引き留められながらも別れる。そして太陽に、自分を連れていってほしいと頼むが、夜の鳥なのだから星に頼むよう言われる。", "夜になり、よだかは星々に呼びかける。しかし返事をもらえなかったり、冷たく断られたりして、どこにも迎え入れてもらえない。それでも何度も羽ばたき、息を切らしながら高い空へ昇っていく。力を使い果たしたその体は、やがて青く美しい光となる。よだかは星となって燃え続ける。"], "people": [["よだか", "見た目や名前を理由に責められ、居場所を求める鳥。"], ["鷹（たか）", "自分と似た名前を使うなと、よだかを脅す鳥。"], ["かわせみ", "よだかの弟。別れを告げる兄を引き留める。"], ["太陽・星々", "よだかが、連れていってほしいと呼びかける相手。"]], "links": ["goshu", "restaurant"], "sources": [{"title": "青空文庫「よだかの星」本文", "url": "https://www.aozora.gr.jp/cards/000081/files/473_42318.html"}, {"title": "青空文庫 図書カード", "url": "https://www.aozora.gr.jp/cards/000081/card473.html"}, {"title": "国立音楽大学図書館 展示資料（1934年発表の確認・PDF）", "url": "https://www.lib.kunitachi.ac.jp/wp-content/uploads/2024/01/tenji1012.pdf"}], "image": "assets/yodaka.webp", "imageAlt": "星空を飛ぶ小さなよだかの作品イメージ", "summaryReadings": {"鷹": {"reading": "たか", "key": "鷹"}}}, {"id": "trolley", "cat": "literature", "name": "トロッコ", "reading": "トロッコ", "sub": "芥川龍之介｜1922年発表", "motif": "railcart", "gist": "憧れのトロッコで遠くへ来た少年は、帰り道を一人で走ることになる。楽しさが心細さへ変わる一日を描く物語。", "intro": "八歳の良平は、鉄道工事で使うトロッコに夢中だ。大人が車を押し、乗って走っていく姿を見て、自分も乗りたいと思っている。ある日、二人の若い作業員に頼んで車を押す手伝いを始めると、道は村から遠くへ続いていた。", "synopsisSummary": ["八歳の良平は、村の近くの鉄道工事で使うトロッコに憧れている。弟たちと勝手に動かして叱られたあとも、乗りたい気持ちは消えない。ある日、若い二人の作業員に車を押す手伝いを申し出る。下り坂では一緒に乗せてもらい、良平は夢がかなったように喜ぶ。しかし竹やぶや畑を通り、家から離れるほど、帰りが気になり始める。作業員たちが休んだり買い物をしたりしても、良平はなかなか帰りたいと言えない。", "やがて作業員たちは、今日は出先に泊まるので、もう一人で帰るよう告げる。良平は急に心細くなり、暗くなりかけた長い道を必死で走る。ようやく家の門口へ着くと、大声で泣き出す。その後、大人になった良平は東京で校正の仕事をしているが、今も時折、あの日の薄暗い道と心細さを思い出す。"], "people": [["良平（りょうへい）", "トロッコに憧れる八歳の少年。"], ["二人の作業員", "良平に車を押す手伝いをさせ、途中では一緒に乗せる。"], ["良平の弟・家族", "良平の身近な人たち。帰宅して泣き出した良平のもとに集まり、理由を尋ねる。"]], "links": ["akutagawa", "hana"], "sources": [{"title": "青空文庫「トロッコ」本文", "url": "https://www.aozora.gr.jp/cards/000879/files/43016_16836.html"}, {"title": "青空文庫 図書カード（新字新仮名）", "url": "https://www.aozora.gr.jp/cards/000879/card43016.html"}, {"title": "青空文庫 別版図書カード（初出：1922年3月『大観』）", "url": "https://www.aozora.gr.jp/cards/000879/card169.html"}], "image": "assets/trolley.webp", "imageAlt": "工事用トロッコと二人の作業員、少年の作品イメージ", "summaryReadings": {"良平": {"reading": "りょうへい", "key": "良平"}}}, {"id": "lamp", "cat": "literature", "name": "おじいさんのランプ", "reading": "おじいさんのランプ", "sub": "新美南吉｜1942年・同名童話集収録", "motif": "oldlamp", "gist": "ランプで暮らしを築いた男は、電灯の時代を受け入れられずにいた。大切な仕事と別れ、次の道を選ぶ物語。", "intro": "東一が見つけた古いランプを見て、祖父は昔の話を始める。身寄りのなかった少年・巳之助は、ランプの明るさに魅せられ、村で売り歩いて暮らしを築いた。ところが町に電灯が現れ、村にも電気を引く話が持ち上がる。", "synopsisSummary": ["孫の東一が見つけたランプをきっかけに、祖父が若いころを語る。身寄りのない巳之助は、町で見たランプの明るさに驚き、村で売る仕事を始める。商売は暮らしを支え、家族も持つようになる。しかし電灯が広がり、村にも電気を引くことになると、仕事を失う不安から強く反対する。ついには区長を恨み、その家に火をつけようと考える。", "ところが持ち出した古い火打ち道具では、思うように火がつかない。不便さに腹を立てた巳之助は、自分も古い道具にしがみついていたのだと気づき、放火を思いとどまる。池のほとりでランプに火をともして別れを惜しみ、石で三つを割るが、涙が出て続けられない。その後は本屋になる。祖父は、ランプを売る方法もあったと処分を振り返りながら、仕事を変えた決断について孫に語る。"], "people": [["巳之助（みのすけ）", "ランプを売って暮らしを築く男。東一の祖父の若いころ。"], ["東一（とういち）", "古いランプを見つけ、祖父から昔の話を聞く孫。"], ["区長（くちょう）", "電気を引くかどうか決める村会で、議長を務めた人。巳之助から恨まれる。"]], "links": ["gloves", "gongitsune"], "sources": [{"title": "青空文庫「おじいさんのランプ」本文", "url": "https://www.aozora.gr.jp/cards/000121/files/635_14853.html"}, {"title": "青空文庫 図書カード（1942年10月刊『おぢいさんのランプ』収録）", "url": "https://www.aozora.gr.jp/cards/000121/card635.html"}], "image": "assets/lamp.webp", "imageAlt": "灯油ランプのそばで昔を思う老人の作品イメージ", "bodyReadings": {"巳之助": "みのすけ"}, "summaryReadings": {"巳之助": {"reading": "みのすけ", "key": "巳之助"}, "東一": {"reading": "とういち", "key": "東一"}, "区長": {"reading": "くちょう", "key": "区長"}}}, {"id": "ginga", "cat": "literature", "name": "銀河鉄道の夜", "reading": "ぎんがてつどうのよる", "sub": "宮沢賢治｜1934年・没後発表", "motif": "starrail", "textNote": "青空文庫の新潮文庫底本版に基づきます。未定稿の作品で、版によって本文に異同があります。", "gist": "祭りの夜、孤独な少年が友人と銀河を旅する。美しい景色と出会いの先で、別れと、人の幸せを考える物語。", "intro": "家計を助けて働くジョバンニは、学校でからかわれ、寂しさを抱えている。祭りの夜、病気の母のために牛乳を取りに出かけ、一人で丘へ上がる。すると、いつの間にか銀河を走る列車の中にいて、隣には友人のカムパネルラが座っていた。", "synopsisSummary": ["ジョバンニは、病気の母と暮らし、学校へ通いながら働いている。父は長く家を空け、級友には父のことをからかわれていた。祭りの夜、母に届ける牛乳を求めて出かけたあと、一人で丘へ上がる。気づくと銀河を走る列車にいて、隣には友人のカムパネルラが座っている。二人は光る川や化石の発掘場所を眺めながら、不思議な旅を始める。ジョバンニは、友人とこのままずっと一緒にいたいと願う。", "列車では、鳥を捕る男や、沈んだ船に乗っていた姉弟と青年に出会う。車内で聞くのは、他の生き物を食べて生きてきた蠍が、自分の命も誰かの役に立てたいと願い、夜を照らす火になった話だ。ジョバンニは、人のために生きることや、本当の幸せについて考える。姉弟たちが南十字で降り、再び二人きりになる。しかしカムパネルラは、遠くに母がいると言ったあと、突然姿を消してしまう。", "丘で目を覚ましたジョバンニは、牛乳を受け取って町へ戻ると、川で騒ぎが起きていた。そこでは、カムパネルラを捜す人たちが集まっていた。カムパネルラは、川に落ちたザネリを助けたあと、自分は戻らなかったのだ。父は時間がたちすぎたため、息子の生存を諦めている。その父から、自分の父も間もなく帰ると聞いたジョバンニは、牛乳とその知らせを母へ届けようと走り出す。友人と二人で旅をした夜のあと、ジョバンニは一人で、母の待つ現実の暮らしへ戻っていく。"], "people": [["ジョバンニ", "母のために働きながら学校へ通う少年。銀河を旅する。"], ["カムパネルラ", "ジョバンニの友人。列車の隣の席に現れる。"], ["ザネリ", "ジョバンニをからかう級友。祭りの夜に川へ落ちる。"], ["鳥捕り（とりとり）", "列車の中で出会う、鳥を捕る仕事の男。"], ["姉弟と青年", "沈んだ船に乗っていた人たち。列車で二人と出会う。"], ["ジョバンニの母", "病気で家にいる母。息子は牛乳を届けようとする。"]], "links": ["yodaka", "goshu"], "sources": [{"title": "青空文庫「銀河鉄道の夜」本文（新潮文庫底本版）", "url": "https://www.aozora.gr.jp/cards/000081/files/456_15050.html"}, {"title": "青空文庫 図書カード（未定稿・1934年初出の確認）", "url": "https://www.aozora.gr.jp/cards/000081/card456.html"}, {"title": "青空文庫「銀河鉄道の夜」底本による異同", "url": "https://www.aozora.gr.jp/cards/000081/gingatetsudo_difference"}], "image": "assets/ginga.webp", "imageAlt": "銀河を走る列車の窓から星空を見る二人の少年の作品イメージ", "bodyReadings": {"蠍": "さそり"}}, {"id": "botchan", "cat": "literature", "name": "坊っちゃん", "reading": "ぼっちゃん", "sub": "夏目漱石｜1906年発表", "motif": "classroom", "gist": "曲がったことが嫌いな青年が、四国の学校で人間関係にぶつかる。勢いのよい語りの奥に、不器用な正直さと人への愛着がある物語。", "intro": "子供のころから無鉄砲で、家族にも持て余されてきた青年。家の奉公人・清だけは、彼を大切にしてくれた。学校を出た青年は、四国の中学校へ数学教師として赴任する。ところが、生徒のいたずらや、同僚たちの腹の読めない言動に振り回される。", "synopsisSummary": ["無鉄砲な性格の主人公は、子供のころから騒ぎを起こし、家族からは持て余されていた。それでも家の奉公人・清は、彼の正直さを信じて大切にする。両親を失い、兄から受け取った金で物理学校へ進んだ主人公は、卒業後、四国の中学校の数学教師になる。生徒には食事や温泉での行動をからかわれ、宿直でもいたずらをされる。彼は同僚に山嵐、赤シャツ、うらなり、野だいこなどのあだ名を付け、学校の人間関係を自分なりに見ていく。", "初めは教頭の赤シャツの言葉を信じ、率直な数学教師・山嵐を疑う。しかし次第に誤解が解け、山嵐と親しくなる。一方、おとなしい英語教師・うらなりの婚約相手と赤シャツの関係や、うらなりの遠方への転任を知り、赤シャツへの不信を深める。祝勝会の日、主人公と山嵐は生徒のけんかを止めに入って巻き込まれるが、新聞では騒ぎを起こした側のように書かれてしまう。", "山嵐だけが辞職を求められ、二人は赤シャツたちに仕返しをしようと決める。宿から朝帰りする赤シャツと野だいこを待ち伏せして殴り、主人公も辞表を出して学校を去る。東京へ戻った主人公は、清と暮らし、街鉄の技手として働く。やがて清は肺炎で亡くなる。主人公は、彼女の願いどおり、自分の家の寺に葬ったと語って物語を閉じる。"], "people": [["坊っちゃん（ぼっちゃん）", "本名を明かさない語り手。四国の中学校へ赴任する若い数学教師。"], ["清（きよ）", "幼いころから主人公を信じ、大切にした家の奉公人。"], ["山嵐（やまあらし）", "数学教師の堀田（ほった）。率直な性格で、主人公と親しくなる。"], ["赤シャツ（あかシャツ）", "学校の教頭。柔らかな言葉遣いとは裏腹に、主人公の不信を招く。"], ["うらなり", "英語教師の古賀（こが）。おとなしい性格で、遠くへ転任する。"], ["野だいこ", "画学教師。赤シャツと行動を共にする。"], ["狸（たぬき）", "学校の校長に主人公が付けたあだ名。"]], "links": ["trolley", "hana"], "sources": [{"title": "青空文庫「坊っちゃん」本文", "url": "https://www.aozora.gr.jp/cards/000148/files/752_14964.html"}, {"title": "青空文庫 図書カード（初出：1906年4月『ホトトギス』）", "url": "https://www.aozora.gr.jp/cards/000148/card752.html"}], "image": "assets/botchan.webp", "imageAlt": "明治期の教室に立つ若い教師の作品イメージ", "summaryReadings": {"清": {"reading": "きよ", "key": "清"}, "山嵐": {"reading": "やまあらし", "key": "山嵐"}, "赤シャツ": {"reading": "あかシャツ", "key": "赤シャツ"}}}, {"id": "cat", "cat": "literature", "name": "吾輩は猫である", "reading": "わがはいはねこである", "sub": "夏目漱石｜1905–1906年発表", "motif": "classroom", "gist": "名前のない猫が、教師の家で人間たちを観察する。偉そうな言葉と日々の振る舞いの食い違いを、皮肉と笑いで見せる物語。", "intro": "名前もない一匹の猫が、教師の家に住みつく。主人は本を読んだり、気難しく振る舞ったりしているが、猫から見ると立派な人物とも言い切れない。家を訪れる客たちの会話を聞きながら、猫は人間という生き物を観察し始める。", "synopsisSummary": ["名前のない猫は、人間の世界で苦労した末、教師の苦沙弥の家に住みつく。主人は気難しく、胃の調子を気にし、学問や芸術を語る。猫はその姿を眺め、偉そうな言い方をする人間にも、滑稽で頼りないところがあると考える。主人の家には、冗談や作り話の得意な迷亭、学問に打ち込む寒月などが訪れ、猫は会話を聞きながら、人間の見栄や思い込みを評していく。", "話は、一つの事件だけを追うのではなく、日々の会話や騒動を重ねて進む。実業家の金田家の娘と寒月との縁談が持ち上がると、相手を調べようとする金田家と苦沙弥たちの間に対立が生まれる。猫も金田家へ出かけ、人間たちの思惑をうかがう。金や肩書きを重んじる人、理屈をこねる人、世間の評判を気にする人。それぞれの言い分を眺める猫自身も、かなり自信たっぷりに語る。", "やがて寒月は故郷の女性と結婚し、金田家の娘にも別の縁談が進む。主人の家では、仲間たちが集まって酒を飲み、話し合う。客が帰ったあと、猫は残ったビールを飲んで酔ってしまう。そして水の入った甕に落ち、はい上がろうとしても出られない。人間を批評してきた猫の語りは、突然訪れた自身の死を迎えるところで終わる。"], "people": [["吾輩（わがはい）", "名前のない猫。教師の家に住み、人間を観察する語り手。"], ["苦沙弥（くしゃみ）", "猫が住みついた家の主人。気難しい教師。"], ["迷亭（めいてい）", "苦沙弥の友人。冗談や作り話を交えて話す。"], ["寒月（かんげつ）", "主人の家へやって来る若い学者。縁談の話題の中心になる。"], ["金田（かねだ）家", "富や世間体を重んじる実業家の家。娘と寒月の縁談をめぐり主人たちと対立する。"]], "links": ["botchan", "hana"], "sources": [{"title": "青空文庫「吾輩は猫である」本文", "url": "https://www.aozora.gr.jp/cards/000148/files/789_14547.html"}, {"title": "青空文庫 図書カード（1905–1906年『ホトトギス』初出）", "url": "https://www.aozora.gr.jp/cards/000148/card789.html"}], "image": "assets/cat.webp", "imageAlt": "明治期の書斎で人間を観察する猫の作品イメージ", "bodyReadings": {"苦沙弥": "くしゃみ", "甕": "かめ"}, "sourceNote": "青空文庫の、ちくま文庫『夏目漱石全集1』底本版に基づきます。", "summaryReadings": {"苦沙弥": {"reading": "くしゃみ", "key": "苦沙弥"}, "迷亭": {"reading": "めいてい", "key": "迷亭"}, "寒月": {"reading": "かんげつ", "key": "寒月"}, "金田": {"reading": "かねだ", "key": "金田"}}}, {"id": "kokoro", "cat": "literature", "name": "こころ", "reading": "こころ", "sub": "夏目漱石｜1914年発表", "motif": "classroom", "textNote": "青空文庫の集英社文庫底本版に基づきます。要約では登場人物の自死に触れますが、方法の描写はしていません。", "gist": "青年が慕う「先生」は、なぜ孤独を抱え、人を信じきれないのか。一通の長い手紙が、友情と恋、言えなかった過去を明かす物語。", "intro": "学生の「私」は、鎌倉で出会った男性を「先生」と呼び、東京へ戻ってからも訪ねるようになる。先生には妻がいるが、どこか寂しげで、人を深く信じようとしない。毎月、友人の墓へ通う先生は、自分の過去をなかなか語らない。", "synopsisSummary": ["若い学生の「私」は、鎌倉で出会った先生を慕い、東京でも家を訪ねる。先生は妻と暮らしながら孤独を抱え、毎月、友人の墓へ通っている。親しくなっても過去を明かさず、人を信じすぎないよう私に語る。卒業した私は故郷へ帰り、病気の父のそばで過ごす。明治天皇が亡くなり、乃木夫妻の死も伝わるころ、先生から長い手紙が届く。末尾の死を予告する言葉に気づいた私は、危篤の父を残して東京行きの列車に乗り、手紙を読む。", "手紙の中で、先生は若いころを語る。両親を失い、叔父に財産をめぐって欺かれた先生は、人を信じられなくなる。その後、下宿先の娘を好きになり、困窮していた友人のKを同じ家へ招く。ところがKも、その娘への恋を打ち明ける。先生は動揺し、理想を重んじるKの考え方を逆手に取って気持ちを抑えようとする。そしてKには知らせず、娘の母へ結婚を申し込む。娘の母から婚約を聞いたKは、後に自ら命を絶つ。", "Kの遺書に娘の名はなく、死の理由は一つに決められない。それでも先生は、自分の振る舞いへの罪悪感を抱え続ける。娘と結婚したあとも、妻には事情を話せない。長い年月を経て、明治という時代の終わりや乃木の死に触れた先生は、自死を決意した経緯を私への手紙に記す。妻には過去を知らせないでほしい、という願いとともに手紙は終わる。先生の死を私が確認する場面や、東京へ着いたあとの出来事は描かれない。"], "people": [["私（わたくし）", "先生を慕う若い学生。先生から長い手紙を受け取る。"], ["先生（せんせい）", "本名は明かされない男性。「私」が敬って先生と呼ぶ。過去の出来事を抱えて生きる。"], ["K", "先生の若いころの友人。学問や精神的な理想を重んじる。"], ["静（しず）", "先生の妻。若いころは、先生とKが暮らす下宿の娘だった。"], ["静の母", "下宿を営む女性。先生から娘との結婚を申し込まれる。"], ["私の父", "故郷で病床にいる父。私の帰省後、病状が悪くなる。"]], "links": ["botchan", "ginga"], "sources": [{"title": "青空文庫「こころ」本文", "url": "https://www.aozora.gr.jp/cards/000148/files/773_14560.html"}, {"title": "青空文庫 図書カード（初出：1914年4月20日–8月11日『朝日新聞』）", "url": "https://www.aozora.gr.jp/cards/000148/card773.html"}], "image": "assets/kokoro.webp", "imageAlt": "縁側と庭で距離を置く二人の成人男性の作品イメージ", "summaryReadings": {"私": {"reading": "わたくし", "key": "私"}, "先生": {"reading": "せんせい", "key": "先生"}}}, {"id": "lemon", "cat": "literature", "name": "檸檬", "reading": "れもん", "sub": "梶井基次郎｜1925年発表", "motif": "oldlamp", "textNote": "青空文庫の旺文社文庫底本版に基づきます。語り手の体験と想像を区別して紹介します。", "gist": "重苦しい気分で京都を歩く青年が、一個の檸檬にひかれる。色や香り、冷たさと小さな空想が、世界の見え方を変える物語。", "intro": "病気や借金を抱える「私」は、理由のつかめない重苦しさに苦しんでいる。以前好きだった音楽や詩にも心が動かず、京都の町を歩き回る。ある日、果物店に並ぶ檸檬の鮮やかな色が目に留まり、その一つを買い求める。", "synopsisSummary": ["語り手の「私」は、得体の知れない重苦しさに悩まされている。病気や借金もあるが、それだけでは言い表せない気分だった。以前は楽しめた音楽や詩にもひかれず、京都の裏通りを歩き回る。ある日、果物店で一個の檸檬を買う。手のひらに伝わる冷たさ、黄色い色、香りや重みを味わううちに、重苦しい気分が少しほどけていく。", "私は、しばらく避けていた店の丸善（まるぜん）へ入る。しかし店内では再び気が沈み、画集を取り出しては重ねても満たされない。そこで手にしていた檸檬を思い出し、画集を城のように積み直して、その上に置く。鮮やかな黄色と本の取り合わせを眺めた私は、檸檬を置いたまま店を出る。そして檸檬を爆弾に見立て、丸善が爆発したらと想像して笑みを浮かべ、通りを歩いていく。爆発は頭の中の空想で、現実に起きた出来事ではない。"], "people": [["私", "名前を明かさない語り手。重苦しい気分を抱えて京都を歩き、一個の檸檬を買う。"]], "links": ["cat", "trolley"], "sources": [{"title": "青空文庫「檸檬」本文", "url": "https://www.aozora.gr.jp/cards/000074/files/424_19826.html"}, {"title": "青空文庫 図書カード（初出：1925年1月『青空』創刊号）", "url": "https://www.aozora.gr.jp/cards/000074/card424.html"}], "image": "assets/lemon.webp", "imageAlt": "本屋の画集の上に置かれた黄色い檸檬の作品イメージ"}, {"id": "sangetsuki", "cat": "literature", "name": "山月記", "reading": "さんげつき", "sub": "中島敦｜1942年発表", "motif": "starbird", "textNote": "青空文庫の新潮文庫底本版に基づきます。李徴が語る自分への見方と、実際に起こる出来事を分けて紹介します。", "gist": "詩人として認められたいと願った男が、虎の姿となって旧友に語る。人に認められたい気持ちと、傷つくことを恐れる心を描く物語。", "intro": "唐の時代、才能に自信を持つ李徴は、役人を辞めて詩人として名を上げようとする。だが思うようにいかず、再び役人となったのち、旅先で姿を消す。翌年、旧友の袁傪が山道で出会った虎は、人の言葉をつぶやく。その声には聞き覚えがあった。", "synopsisSummary": ["李徴は自分の才能を頼み、役人を辞めて詩作に打ち込む。しかし名声は得られず、暮らしにも困り、妻子を養うために再び役人になる。かつての同輩の下で働くことを屈辱に感じていたある夜、旅先で自分を呼ぶ声を追って外へ出ると、いつの間にか虎になっていた。翌年、旧友の袁傪が山道で虎に襲われかける。虎は相手に気づいて身を隠し、その声を聞いた袁傪も、李徴だと分かる。", "李徴は草むらから、人間の心に戻れる時間がだんだん短くなると語る。そして自分の詩を後に残したいと頼み、袁傪は部下に書き取らせる。李徴は、才能がないと知られるのを恐れて人に学ばず、一方では自分に才能があると信じ、平凡な人々と交わることも嫌った自分を振り返る。人と交わって腕を磨くよりも、自尊心を守ろうとしていたというのだ。", "さらに妻子の世話を頼み、家族より先に詩のことを頼んだ自分を嘆く。人間の心を失えば友を襲うかもしれないため、帰りはこの道を通らないでほしいと告げる。別れた一行が丘から振り返ると、虎が姿を現し、明け方の月へ吠えたあと、草むらへ消える。李徴が人間に戻る場面は描かれない。"], "people": [["李徴（りちょう）", "詩人として名を上げようとした男。虎になり、旧友へ過去を語る。"], ["袁傪（えんさん）", "李徴の旧友。虎の声から友人と気づき、その話を聞く。"], ["李徴の妻子", "李徴が残してきた家族。彼は袁傪に世話を頼む。"]], "links": ["hana", "yodaka"], "sources": [{"title": "青空文庫「山月記」本文（新潮文庫底本版）", "url": "https://www.aozora.gr.jp/cards/000119/files/624_14544.html"}, {"title": "青空文庫 図書カード", "url": "https://www.aozora.gr.jp/cards/000119/card624.html"}, {"title": "神奈川近代文学館 所蔵資料（初出：1942年2月『文學界』）", "url": "https://www.kanabun.or.jp/nakajima/pages/N06_120_555.html"}], "image": "assets/sangetsuki.webp", "imageAlt": "月を背景に孤独な虎を描いた作品イメージ", "bodyReadings": {"李徴": "りちょう", "袁傪": "えんさん"}, "summaryReadings": {"李徴": {"reading": "りちょう", "key": "李徴"}, "袁傪": {"reading": "えんさん", "key": "袁傪"}}}, {"id": "yumejuya", "cat": "literature", "name": "夢十夜", "reading": "ゆめじゅうや", "sub": "夏目漱石｜1908年発表", "motif": "starbird", "textNote": "青空文庫の、ちくま文庫『夏目漱石全集10』底本版に基づきます。十の独立した夢を話ごとに紹介します。一部に死や暴力の話題が含まれます。", "imageCaption": "第一夜の白い百合をもとにしたAIイメージイラスト", "gist": "百年待つ約束、話す子供、明治の町に現れた運慶。十の不思議な夢が、時間や記憶、言葉にしにくい不安を描く短編集。", "intro": "目の前の女が、死んだあと百年待っていてほしいと言う。別の夢では、背負った子供が、自分の知らないはずの過去を語り始める。時間も人の姿も、現実の決まりに収まらない。十の夢が、それぞれ違う不思議な世界へ読者を連れていく。", "synopsisSummary": ["第一夜：死を前にした女に頼まれ、語り手は墓のそばで百年待つ。やがて白い百合が咲き、その花に触れたとき、百年がたっていたと気づく。", "第二夜：侍が和尚の言葉に追い詰められ、悟りを得ようと焦る。時間ばかりが過ぎ、ついに時計が鳴ると、刀へ手をかけるところで夢は終わる。", "第三夜：背負った目の見えない子供が、百年前に語り手がしたことを言い当てる。殺した相手への記憶が戻るとともに、子供は重くのしかかる。", "第四夜：老人が、手拭を蛇に変えると言う。子供の語り手は見届けようと追いかけるが、老人は川の中へ進み、戻ってこない。", "第五夜：捕らえられた男が、処刑の前に恋人を待つ。女は馬で急ぐが、偽の鶏の声を聞いて夜明けと思い込み、ついには淵へ落ちてしまう。", "第六夜：明治の町で、運慶が仁王を彫っている。見ていた語り手も木を彫ってみるが、自分の木からは仁王が現れない。", "第七夜：行き先の分からない船で、語り手は強い不安を抱く。自ら命を絶とうとした直後、生きて船にとどまればよかったと後悔する。", "第八夜：床屋の鏡に、街を行き交う人々が映る。札を数え続ける女や、じっと動かない金魚売りの姿が、奇妙な時間の流れを感じさせる。", "第九夜：幼い子を連れた母が、夫の無事を祈り続ける。しかし夫は、すでに殺されていた。語り手は夢の中で、母からその話を聞く。", "第十夜：女について姿を消した庄太郎が、七日後に戻って寝込む。崖で次々と来る豚を追い払って力尽きた話を、語り手は健さんから聞く。庄太郎の死が確認される場面はない。"], "people": [["夢を語る人", "夢によって立場や場面が変わる語り手。同じ人の連続した冒険ではない。"], ["百年待つよう頼む女", "第一夜に登場する、死を前にした女。語り手との詳しい関係は示されない。"], ["運慶（うんけい）", "第六夜で仁王（におう）を彫る人物。夢の中では明治の町に現れる。"], ["庄太郎（しょうたろう）・健（けん）さん", "第十夜に登場する男たち。健さんが庄太郎の不思議な体験を伝える。"]], "links": ["ginga", "kokoro"], "sources": [{"title": "青空文庫「夢十夜」本文", "url": "https://www.aozora.gr.jp/cards/000148/files/799_14972.html"}, {"title": "青空文庫 図書カード", "url": "https://www.aozora.gr.jp/cards/000148/card799.html"}, {"title": "二松学舎大学 漱石関連資料（1908年の新聞掲載を確認）", "url": "https://www.nishogakusha-u.ac.jp/gakubugakka/event/souseki/index.html"}], "image": "assets/yumejuya.webp", "imageAlt": "第一夜の白い百合と星空を描いた作品イメージ", "summaryReadings": {"運慶": {"reading": "うんけい", "key": "運慶"}, "庄太郎": {"reading": "しょうたろう", "key": "庄太郎"}, "健": {"reading": "けん", "key": "健"}}}, {"id": "takasebune", "cat": "literature", "name": "高瀬舟", "reading": "たかせぶね", "sub": "森鴎外｜1916年発表", "motif": "railcart", "textNote": "青空文庫の岩波文庫『山椒大夫・高瀬舟』系底本に基づきます。要約では自死と死を助ける行為に触れますが、方法は描写しません。", "gist": "弟を死なせた罪で送られる男が、なぜ穏やかな顔をしているのか。護送する役人が、満ち足りることと、人を裁くことに迷う物語。", "intro": "春の夕方、弟を死なせた罪で遠島へ送られる喜助を、同心の庄兵衛が舟で護送する。ほかの罪人と違って、喜助はどこか晴れやかな顔をしている。庄兵衛がその理由を尋ねると、男は貧しかった暮らしと、弟との出来事を語り始める。", "synopsisSummary": ["京都の高瀬川を下る舟で、同心の羽田庄兵衛は喜助を護送している。弟殺しの罪で遠島へ送られるのに、喜助の表情は穏やかだった。庄兵衛が尋ねると、喜助は、これまで住む所にも食べ物にも困り、金を手元に残せたことがなかったと話す。今は行く場所が決まり、渡された二百文を元手に持てることがうれしいと言う。庄兵衛は、自分の暮らしと比べながら、何をもって足りると感じるのか考え込む。", "次に庄兵衛は、弟の死について聞く。喜助たちは幼くして両親を失い、兄弟で助け合ってきた。しかし弟が病気で働けなくなり、兄の負担になっていると思い詰める。弟は自ら命を絶とうとして苦しみ、帰宅した喜助に、苦痛を終わらせる手助けを求めた。喜助は医者を呼ぼうとするが、弟の願いを断りきれずに応じ、その結果、弟は息を引き取る。", "話を聞いた庄兵衛は、人殺しという裁きと、苦しむ弟を救おうとした喜助の行為の間で迷う。自分には判断できず、上の者の考えに従おうとしても、疑問は消えない。喜助が許されたり、舟から解放されたりすることはなく、二人を乗せた舟は夜の川を進んでいく。"], "people": [["喜助（きすけ）", "弟を死なせた罪で遠島へ送られる男。貧しい暮らしを続けてきた。"], ["羽田庄兵衛（はねだ しょうべえ）", "喜助を護送する同心（どうしん）。話を聞くうち、裁きについて迷う。"], ["喜助の弟", "病気で働けなくなり、兄の負担になることを苦にしていた。"]], "links": ["kokoro", "gongitsune"], "sources": [{"title": "青空文庫「高瀬舟」本文", "url": "https://www.aozora.gr.jp/cards/000129/files/45245_22007.html"}, {"title": "青空文庫 図書カード（初出：1916年1月『中央公論』）", "url": "https://www.aozora.gr.jp/cards/000129/card45245.html"}], "image": "assets/takasebune.webp", "imageAlt": "静かな川を進む小舟と二人の成人男性の作品イメージ", "summaryReadings": {"喜助": {"reading": "きすけ", "key": "喜助"}, "羽田庄兵衛": {"reading": "はねだ しょうべえ", "key": "羽田庄兵衛"}, "庄兵衛": {"reading": "しょうべえ", "key": "羽田庄兵衛"}}}, {"id": "maihime", "cat": "literature", "name": "舞姫", "reading": "まいひめ", "sub": "森鴎外｜1890年発表", "motif": "classroom", "sourceNote": "青空文庫の筑摩書房『現代日本文學大系7』底本版に基づきます。文語・旧仮名の原文を、本サイト独自の現代語で要約しています。", "gist": "外国で出会った女性との暮らしと、国へ戻って出世する道。選べないまま約束を重ねた青年が、自分の決断を振り返る物語。", "intro": "国の仕事でベルリンへ来た豊太郎は、勉強を続けるうち、決められた道だけを進む生き方に疑問を持ち始める。ある日、父の葬儀の費用に困る踊り手のエリスを助ける。二人は親しくなるが、豊太郎の仕事と将来にも変化が起きる。", "synopsisSummary": ["帰国する船の中で、太田豊太郎はベルリンでの出来事を振り返る。優秀な官吏として派遣された豊太郎は、現地で学ぶうちに自分の関心と官の求めるものが離れ始める。父の葬儀費に困っていた踊り手のエリスを助け、親しくなるが、同郷の人々の告げ口や上司の不興によって職を失う。さらに、日本の母が亡くなった知らせも届く。", "親友が紹介してくれた新聞通信員の仕事をしながら、豊太郎はエリスとその母の家で暮らす。やがてエリスは子を身ごもる。一方、ベルリンへ来た親友の紹介で、日本の大臣の翻訳を手伝うことになり、豊太郎は信用を得る。大臣に付き添ってロシアへ行く。ベルリンへ戻った後、日本へ一緒に戻るよう誘われると、断りきれずに承諾してしまう。", "しかし、エリスには帰国の決心を告げられない。思い悩んだ豊太郎は病に倒れ、看病していたエリスは、親友から別れと帰国の約束を聞く。強い衝撃を受けた彼女は、心身を病んでしまう。回復した豊太郎は、エリスの母へ生活と出産のための金を渡し、大臣とともに帰国する。親友に助けられたことへの感謝がありながら、恨む気持ちも残る。その割り切れなさを抱えた回想として、物語は終わる。"], "people": [["太田豊太郎（おおた とよたろう）", "国の仕事でベルリンへ来た青年。帰国の船で、自分の過去を語る。"], ["エリス", "父を失って困っていた踊り手。豊太郎と暮らし、子を身ごもる。"], ["豊太郎の親友", "仕事を紹介し、豊太郎が官の世界へ戻る道を助ける。"], ["エリスの母", "娘とともに暮らし、豊太郎も家へ迎える。"], ["日本の大臣", "豊太郎の働きを認め、日本へ戻るよう誘う。"]], "links": ["kokoro", "botchan"], "sources": [{"title": "青空文庫「舞姫」本文", "url": "https://www.aozora.gr.jp/cards/000129/files/2078_15963.html"}, {"title": "青空文庫 図書カード（初出：1890年1月『國民之友』）", "url": "https://www.aozora.gr.jp/cards/000129/card2078.html"}, {"title": "埼玉県立歴史と民俗の博物館（太田豊太郎の読みの確認）", "url": "https://saitama-rekimin.spec.ed.jp/quiz2/a25"}], "image": "assets/maihime.webp", "imageAlt": "ベルリンを思わせる街路で距離を置く成人男女の作品イメージ", "summaryReadings": {"太田豊太郎": {"reading": "おおた とよたろう", "key": "太田豊太郎"}, "豊太郎": {"reading": "とよたろう", "key": "太田豊太郎"}}}, {"id": "ningen", "cat": "literature", "name": "人間失格", "reading": "にんげんしっかく", "sub": "太宰治｜1948年発表", "motif": "classroom", "sourceNote": "青空文庫の新潮文庫底本版に基づきます。三つの手記と、その前後を包む別の語り手の文章を区別して紹介します。", "textNote": "作品と要約には、自死未遂、性暴力、依存に関する話題が含まれます。方法や具体的な場面の描写は省いています。", "gist": "人が怖くて、笑わせる役を演じ続けた男が、自分の半生を書く。強い自己否定と、他人が見ていた別の姿が重なる物語。", "intro": "人の気持ちや暮らしの決まりが分からず、子供のころから人間を怖がっていた葉蔵。嫌われないために、おどけて人を笑わせることを覚える。三つの手記に書かれたその半生を、別の語り手が写真とともに受け取る。", "synopsisSummary": ["小説は、ある語り手が一人の男の写真を見たところから始まり、その男・大庭葉蔵の三つの手記へ移る。葉蔵は子供のころから人を恐れ、周囲に合わせるために道化を演じてきた。東京へ出ると、知り合った友人の影響などから飲酒を深め、生活は不安定になる。ある女性とともに命を絶とうとするが、葉蔵だけが生き残る。", "その後、保護してくれる人のもとを離れ、シヅ子とその娘と暮らしながら漫画を描く。しかし、その暮らしからも去ってしまう。ヨシ子と結婚すると一時は落ち着くが、彼女が商人から性的な暴力を受ける出来事が起こる。葉蔵の不安や飲酒はさらに深まり、やがて薬物への依存と入院へ至る。ヨシ子が夫を裏切って恋愛をした、という話ではない。", "父が亡くなると、葉蔵は兄に引き取られ、地方の家で暮らすようになる。手記の終わりで彼は二十七歳と記しているが、物語の最後に自死するわけではない。あとがきでは、外側の語り手が、かつて葉蔵を知っていた女性から手記と写真を受け取ったことが分かる。その女性は葉蔵を好意的に振り返り、本人の激しい自己否定とは違う姿を語る。外側の語りの時点で、葉蔵がどう暮らしているかは分からない。"], "people": [["大庭葉蔵（おおば ようぞう）", "三つの手記を書いた男。人を恐れ、おどけることで周囲に合わせてきた。"], ["シヅ子", "娘とともに暮らす女性。一時期、葉蔵と生活する。"], ["ヨシ子", "葉蔵の妻。商人から性的な暴力を受ける。"], ["手記を受け取る語り手", "はしがき・あとがきに登場する、葉蔵とは別の人物。"], ["葉蔵を知る女性", "あとがきで手記と写真を渡し、葉蔵を好意的に振り返る。"]], "links": ["kokoro", "melos"], "sources": [{"title": "青空文庫「人間失格」本文", "url": "https://www.aozora.gr.jp/cards/000035/files/301_14912.html"}, {"title": "青空文庫 図書カード（初出：1948年6–8月『展望』）", "url": "https://www.aozora.gr.jp/cards/000035/card301.html"}, {"title": "講談社「日本人名大辞典+Plus」（大庭葉蔵の読みの確認）", "url": "https://kotobank.jp/word/大庭葉蔵-1061336"}], "image": "assets/ningen.webp", "imageAlt": "窓辺で手記に向かう匿名の成人男性の作品イメージ", "summaryReadings": {"大庭葉蔵": {"reading": "おおば ようぞう", "key": "大庭葉蔵"}, "葉蔵": {"reading": "ようぞう", "key": "大庭葉蔵"}}}, {"id": "soseki", "reading": "なつめそうせき", "cat": "person", "name": "夏目漱石", "sub": "1867–1916｜小説家", "motif": "book", "gist": "英語を教え、英国で学び、やがて小説を書き続けた人。身近な会話や人間関係から、人の迷いを見つめました。", "intro": "『吾輩は猫である』『坊っちゃん』『こころ』などを書いた小説家。教師として働き、英国留学を経験した後、新聞社の専属作家になりました。笑いの多い作品から、人とのつながりや言えない思いをたどる作品まで、さまざまな入口があります。", "people": [], "theme": "", "memory": "", "links": ["cat", "botchan", "kokoro", "yumejuya"], "sources": [{"title": "新宿区立漱石山房記念館「漱石の生涯」", "url": "https://soseki-museum.jp/soseki-natsume/sosekis-life/"}, {"title": "国立国会図書館「近代日本人の肖像」夏目漱石", "url": "https://www.ndl.go.jp/portrait/datas/307/"}], "bodyReadings": {"金之助": "きんのすけ", "正岡子規": "まさおかしき", "明暗": "めいあん"}}, {"id": "kenji", "reading": "みやざわけんじ", "cat": "person", "name": "宮沢賢治", "sub": "1896–1933｜詩人・童話作家", "motif": "book", "gist": "岩手の自然や人々の暮らしを見つめ、詩と童話を書いた人。教師や農業指導にも取り組みました。", "intro": "『注文の多い料理店』『銀河鉄道の夜』などで知られる詩人・童話作家。岩手の自然や人々の暮らしをもとに、科学、音楽、信仰などへの関心を作品へ結びつけました。農学校で教え、農業を支える活動も行っています。", "people": [], "theme": "", "memory": "", "links": ["restaurant", "ginga", "goshu", "yodaka"], "sources": [{"title": "花巻市「宮沢賢治について」", "url": "https://www.city.hanamaki.iwate.jp/miyazawakenji/about_kenji/"}, {"title": "花巻市「宮沢賢治年譜」", "url": "https://www.city.hanamaki.iwate.jp/miyazawakenji/about_kenji/1003946.html"}, {"title": "花巻市「賢治と文学」", "url": "https://www.city.hanamaki.iwate.jp/miyazawakenji/about_kenji/1003947.html"}, {"title": "国立国会図書館「近代日本人の肖像」宮沢賢治", "url": "https://www.ndl.go.jp/portrait/datas/4318/"}], "bodyReadings": {"春と修羅": "はるとしゅら", "永訣の朝": "えいけつのあさ", "羅須地人協会": "らすちじんきょうかい"}}, {"id": "swimmy", "genreLabel": "海外文学", "reading": "すいみー", "cat": "literature", "name": "スイミー", "sub": "レオ＝レオニ／作・谷川俊太郎／訳｜日本語版1969年", "motif": "opensea", "gist": "小さな魚の目線で、海と仲間との出会いを味わう絵本。結末には触れず、読む入口を紹介します。", "intro": "主人公は、海に暮らす小さな魚のスイミー。ひとりになった彼が、知らなかった世界や新しい仲間に出会っていきます。広い海を小さな体で進む、その目線から楽しめる絵本です。", "commentary": "小さいからこそ目に入る景色や、仲間と出会って変わる気持ちがあります。みんなと一緒にいることと、自分らしくいること。その両方を味わえる一冊として紹介します。物語の答えを先に決めず、絵と文章を一緒にたどる楽しみを残したい作品です。", "credits": [["レオ＝レオニ", "", "作"], ["谷川俊太郎", "たにかわしゅんたろう", "訳"]], "edition": "好学社の日本語版：1969年刊行／32ページ／ISBN 9784769020011。原作の初出年とは区別しています。", "officialURL": "https://www.kogakusha.com/book/187/", "officialLabel": "出版社で本の情報を見る", "sources": [{"title": "好学社「スイミー」", "url": "https://www.kogakusha.com/book/187/"}], "links": ["gloves", "gongitsune"], "people": [], "contentType": "protected-introduction", "summaryMode": "introduction", "noFullSummary": true}, {"id": "mochimochi", "genreLabel": "日本文学", "bodyReadings": {"豆太": "まめた"}, "reading": "もちもちのき", "cat": "literature", "name": "モチモチの木", "sub": "斎藤隆介／作・滝平二郎／絵｜1971年刊行", "motif": "quiettree", "gist": "怖がりの豆太と、じさまの暮らしを描く絵本。結末には触れず、読む入口を紹介します。", "intro": "夜の暗さを怖がる豆太は、じさまと暮らしています。身近な大人に守られながら過ごす子供の姿から始まる絵本です。怖がりという印象の奥に、どんな気持ちがあるのか、読み進めたくなります。", "commentary": "怖がりという一面だけで、その人のすべては分かりません。豆太を見守る気持ちで読むと、勇気を特別な人だけのものと思わずにいられます。どんな展開になるのかはここでは明かさず、文章と絵を通して感じる時間を大切にしたい一冊です。", "credits": [["斎藤隆介", "さいとうりゅうすけ", "作"], ["滝平二郎", "たきだいらじろう", "絵"]], "edition": "岩崎書店／1971年刊行／ISBN 9784265909063。ページ数や装丁などは、お手元の本の表示をご確認ください。", "officialURL": "https://www.iwasakishoten.co.jp/special/contents/library/lib/pdf/catalog_library2025_v1.pdf", "officialLabel": "出版社の公式カタログを見る（PDF）", "sources": [{"title": "岩崎書店「図書館向け図書目録2025」", "url": "https://www.iwasakishoten.co.jp/special/contents/library/lib/pdf/catalog_library2025_v1.pdf"}, {"title": "国立国会図書館サーチ「モチモチの木」", "url": "https://ndlsearch.ndl.go.jp/books/R100000002-I000000799492"}], "links": ["gongitsune", "gloves"], "people": [], "contentType": "protected-introduction", "summaryMode": "introduction", "noFullSummary": true}, {"id": "otegami", "genreLabel": "海外文学", "reading": "おてがみ", "cat": "literature", "name": "お手がみ", "sub": "アーノルド・ローベル／作・絵　三木卓／訳", "gist": "がまくんとかえるくんを通して、誰かを思う気持ちに触れる物語。", "intro": "手紙をもらったことがないがまくんは、寂しい気持ちでいます。その様子に気づいた友達のかえるくんとのやり取りを描く、短い物語です。", "commentary": "大きな事件ではなく、身近な相手の寂しさに目を向けて読めるお話です。言葉を交わす時間の中にある、小さな気遣いを味わえます。", "credits": [["アーノルド・ローベル", "", "作・絵"], ["三木卓", "みきたく", "訳"]], "edition": "『ふたりはともだち』（文化出版局）に収録された一編。単独の絵本の書誌ではありません。案内先の書籍はISBN 9784579402472、出版社サイトの発行表示は1987年3月31日。作品の原作初出年・日本語初版年とは区別しています。教科書・書籍により『お手紙』『おてがみ』とも表記されます。", "officialURL": "https://books.bunka.ac.jp/np/isbn/9784579402472/", "officialLabel": "出版社で収録書籍の情報を見る", "sources": [{"title": "文化出版局『ふたりはともだち』掲載・発行表示", "url": "https://books.bunka.ac.jp/np/osusume_list.do"}, {"title": "文化出版局『ふたりはしんゆう』目次：『ふたりはともだち』内に『おてがみ』", "url": "https://books.bunka.ac.jp/np/isbn/9784579404902/"}, {"title": "教育出版・１年国語教材一覧：『お手がみ』作者・訳者", "url": "https://www.kyoiku-shuppan.co.jp/textbook/shou/kokugo/files/8cf4dd3e1ab460f445e4891c793c4ef3.pdf"}, {"title": "大分県・読書案内『ふたりはともだち』", "url": "https://www.pref.oita.jp/uploaded/attachment/2246058.pdf"}, {"title": "鈴木出版『ジュース』著者紹介：三木卓の読み", "url": "https://suzuki-syuppan.com/book/%E3%82%B8%E3%83%A5%E3%83%BC%E3%82%B9/"}], "links": ["swimmy"], "people": [], "contentType": "protected-introduction", "summaryMode": "introduction", "noFullSummary": true, "motif": "letter", "introLabel": "物語の紹介", "motifCaption": "手紙を表す図鑑オリジナルの図柄です。"}, {"id": "daizo", "genreLabel": "日本文学", "reading": "だいぞうじいさんとがん", "cat": "literature", "name": "大造じいさんとガン", "sub": "椋鳩十／作", "gist": "猟師と野生の鳥の関わりから、人と動物の距離を見つめる物語。", "intro": "猟師の大造じいさんは、ガンの群れをねらっています。鳥たちの知恵に向き合う日々を通して、人と野生の動物の関わりが描かれます。", "commentary": "人間の側からだけでなく、野生の生き物の側にも想像を広げながら読める作品です。動物をただの獲物と見る目線から少し離れて、相手の存在に目を向ける読み方もできます。", "credits": [["椋鳩十", "むくはとじゅう", "作"]], "edition": "案内先は偕成社文庫3062『大造じいさんとガン』（1978年3月発売、ISBN 9784036506200）。表題作を含む13編の作品集です。この書籍の発売年月と、表題作そのものの初出年は区別しています。", "officialURL": "https://www.kaiseisha.co.jp/books/9784036506200", "officialLabel": "出版社で収録書籍の情報を見る", "sources": [{"title": "偕成社『大造じいさんとガン』書誌・収録情報", "url": "https://www.kaiseisha.co.jp/books/9784036506200"}, {"title": "光村図書・平成17年度版５年 教科書クロニクル", "url": "https://www.mitsumura-tosho.co.jp/webmaga/chronicle/shogaku/h17-5nen"}, {"title": "国立国会図書館典拠：椋鳩十の読み・没年", "url": "https://id.ndl.go.jp/auth/ndlna/00048272"}], "links": ["gongitsune"], "people": [], "contentType": "protected-introduction", "summaryMode": "introduction", "noFullSummary": true, "motif": "wetland", "introLabel": "物語の紹介", "motifCaption": "水辺の草を表す図鑑オリジナルの図柄です。", "bodyReadings": {"大造": "だいぞう", "猟師": "りょうし", "獲物": "えもの"}}];
const finalThoughts={"rashomon": "下人は老婆を責めていたのに、「生きるためだ」という話を聞くと、同じ理由で老婆の着物を奪います。相手には許せなかった行いを、自分がする側に回ってしまったのです。追い詰められたとき、人は自分に都合のよい理由をつけてしまうことがある。下人の変わり方から、善悪の判断が揺れる怖さが伝わってきます。", "hana": "内供は、鼻を短くすれば笑われなくなると思っていましたが、周囲の反応は逆でした。長い鼻に戻って安心する姿を見ると、苦しさは鼻そのものだけでなく、人にどう見られるかにもあったと分かります。周りの人も、悩んでいた内供が喜ぶと素直には喜びません。自分の気持ちも他人の気持ちも、外見を変えるだけでは思いどおりにならない。そのおかしさと切なさが残る話です。", "spider": "犍陀多は自分も落ちるのを恐れ、後から来る人を追い払おうとします。その直後に糸は切れ、せっかく与えられた救いの機会を失ってしまいました。助かりたいという気持ちが、自分だけ助かればよいという考えに変わってしまったのです。他の人を受け入れられなかった犍陀多の姿に、この話の悲しさがあります。", "melos": "メロスは諦めかけても走って戻り、友も一度は疑いながら待ち続けました。再会した二人は、その弱さを隠さず話して抱き合います。信じ合うとは、一度も迷わないことだけではなく、迷ったあとに相手のために行動し、正直に向き合うことでもある。二人の姿から、そんな受け取り方のできる物語です。", "restaurant": "二人は歓迎されていると思い込み、おかしな注文にも都合のよい理由をつけて従っていました。自分たちが食べられると気づいたときには、すっかり店の言いなりになっていたのです。食べたいものを探していた二人が、食べられる側に回ってしまう。その逆転を通して、自分に都合のよい見方だけでは、目の前の危険にも気づけないことが見えてきます。", "gongitsune": "ごんは償おうとしていましたが、その気持ちは兵十に伝わらず、撃たれてしまいます。兵十が贈り主はごんだったと気づくのは、その後でした。善意があっても、相手がその意図を知らなければ、同じようには受け取れない。相手を思いながらもすれ違ってしまう、その悲しさが残る物語です。", "gloves": "子狐は間違えて狐の手を出しましたが、帽子屋はお金を受け取り、手袋を売ってくれました。母が心配していたような出来事は起こらなかったのです。その話を聞いた母は、人間は本当に怖いだけの相手なのかと考え直し始めます。聞いていた話と、自分で出会って知ることは違う。その小さな違いが、相手を見る目を変えていく物語です。", "goshu": "ゴーシュは初め、訪ねてきた動物を邪魔に思い、怒って追い返していました。けれども一緒に音を出したり、頼みに応じて弾いたりする中で、演奏がよくなっていきます。人前で認められた夜、彼が思い出すのは、自分がつらく当たったかっこうでした。上達したことだけでなく、関わった相手を思いやれるようになったことにも、ゴーシュの変化が見える物語です。", "toshishun": "杜子春は仙人になるために黙り続けますが、苦しむ母が自分を気遣う声には耐えられず、母を呼びます。約束を破ったその言葉は、親を思う気持ちから出たものでした。鉄冠子はそれを責めず、杜子春は特別な力よりも、人間らしい正直な暮らしを望むようになります。何かを手に入れるために、大切な人への思いまで捨てなくてよい。杜子春の選び直しから、そう受け取れる物語です。", "yodaka": "よだかは見た目や名前を責められ、助けを求めた空でも冷たくされます。一方で、自分も虫の命を奪って生きていることに苦しんでいました。最後に星となる姿は、周囲に認められて問題が解決した結末ではありません。何が彼をそこまで追い詰めたのかを見つめると、外見だけで相手を決めつけず、言葉の向こうにある苦しみに気づく大切さが伝わってきます。", "trolley": "良平はトロッコに乗れて大喜びしますが、遠くへ進むほど帰りが気になり、一人で帰るよう言われると強い心細さに襲われます。家に着いて泣き出したのは、ようやく怖さをこらえなくてよくなったからとも読めます。楽しかったはずの一日が、大人になっても心細い記憶として残りました。子供にとっては、慣れた場所から離れ、頼れる人がいなくなること自体が、大きな出来事なのです。", "lamp": "巳之助は仕事を失うのが怖くて区長を恨みますが、古い道具の不便さに気づき、火をつけるのをやめます。大切にしてきたランプと別れ、本屋として生きる道を選びました。ただし後年は、ランプを壊す以外の方法もあったと振り返ります。自分が築いたものを大切にすることと、変化に合わせてやり方を変えることは、どちらも必要なのだと読める物語です。", "ginga": "ジョバンニは、カムパネルラとずっと一緒にいたいと願いました。けれども友人は列車から消え、目覚めたあと、別の子を助けて川から戻らなかったと知ります。銀河の旅は、亡くなる友人との最後の時間だったとも読めます。命を誰かの役に立てたいと願った蠍の話も、友人の行動と重なって見えます。ただし、死ぬことが幸せだという答えではありません。大切な友人を失い、それでも母のもとへ走るジョバンニ。残された自分はどう生きるのか、本当の幸せとは何か。その問いが残る物語です。", "botchan": "主人公は赤シャツたちを殴って学校を去りますが、それで学校の問題がすべて解決したわけではありません。腹を立てる勢いの強さには、曲がったことを嫌う気持ちと、相手を早く決めつけてしまう危うさの両方があります。東京へ帰った彼が大切にしたのは、昔から自分を信じてくれた清でした。人にうまく合わせられない青年にも、信じてくれる人への深い愛着がある。そのことが最後まで伝わる物語です。", "cat": "猫は人間の会話を聞き、学問や金や世間体を大事にする人たちの、言葉と行動のずれを笑います。けれども猫自身も自信満々で、いつも正しく物を見ているとは限りません。最後には、その猫も思いがけない事故で命を落とします。誰かを偉そうに批評している自分も、別の目から見れば滑稽かもしれない。人間を少し外から眺める猫の視点が、私たち自身の見栄や思い込みを映す物語です。", "kokoro": "先生はKに気持ちを打ち明けないまま結婚の話を進め、Kの死後も、その過去を妻に話せずに生きました。最後に「私」へ手紙を書いても、妻には知らせないでほしいと願います。人を求めながら、本当のことを伝えられない。その苦しさが、先生の孤独を深くしていきました。先生が死を選ぶ決意は、罪を償う唯一の正しい方法として受け取る必要はありません。言えない気持ちを一人で抱え続けることの重さが残る物語です。", "lemon": "私の病気や借金が解決したわけではありません。それでも、一個の檸檬の冷たさや香りを感じ、本の上に置いて空想することで、重苦しい世界が一時的に違って見えました。最後の笑みは、現実を壊した結果ではなく、想像の中で気持ちが軽くなった瞬間です。小さな物との出会いや、見方を変える遊びが、心に少し余白をつくることもあると読める物語です。", "sangetsuki": "李徴は才能を認めてもらいたいのに、評価されて傷つくことを恐れ、人に学ぶことから遠ざかっていました。虎になってもまず詩を残したいと願い、そのあとで家族を思い出した自分を恥じます。自分を守ろうとする気持ちが、学ぶ機会や大切な人とのつながりを狭めてしまうことがある。旧友にようやく本音を語る李徴の姿から、そんな苦しさが伝わります。虎になった理由を一つの罰として決めつけるのではなく、彼自身の後悔を聞く物語です。", "yumejuya": "十の夢は、一つの筋や一つの答えにつながるわけではありません。待っても時間が分からない、忘れたはずの過去が戻る、見えているものを自分では作れない。夢の中の人たちは、思いどおりにならない出来事に出会います。はっきり説明しきれないまま残る不思議さが、私たち自身の記憶や不安に重なることもある。すべてを一つの意味に決めず、心に残った夢から読み返せる作品です。", "takasebune": "喜助は、行き先とわずかな金があることを、それまでの生活と比べて喜びます。その言葉に庄兵衛は、自分が何を求めて暮らしているのか考えさせられました。さらに弟の話を聞くと、罪の名前だけでは、喜助の気持ちや行為を割り切れなくなります。物語は、弟を死なせたことが正しいと結論づけず、庄兵衛の迷いを残して終わります。人を判断する前に、その人が置かれた事情を聞くことの重さが伝わる話です。", "maihime": "豊太郎はエリスとの暮らしを大切にしながら、日本へ戻る誘いにも断れずにうなずきます。肝心の話を彼女へ伝えられないまま、別れは別の人の口から知らされました。最後に親友を恨む気持ちが残っても、帰国を承諾したのは豊太郎自身です。仕事も人とのつながりも失いたくない。その迷いを言葉にせず、決断を先へ延ばすことで、相手を深く傷つけてしまうことがあると読める物語です。", "ningen": "葉蔵は人とつながりたいのに、人を怖がり、おどけることで本音を隠してきました。手記では自分を激しく否定しますが、あとがきの女性は、同じ人物を別の温かい目で振り返ります。「人間失格」という言葉は、葉蔵が自分へ向けた見方であり、人としての価値を決める客観的な判定ではありません。自分には悪いところしか見えないときでも、他の人には違う姿が見えている。その食い違いにも目を向けたい物語です。"};

const authorBackground=[{"title": "東京の、どこで生まれた？", "text": "1892年3月1日、東京市京橋区入船町で生まれました。今の中央区明石町、聖路加国際病院の周辺にあたります。実父は牛乳販売業を営んでいました。生まれた町と、その後に育った町は別です。", "sources": [{"title": "たばこと塩の博物館「芥川龍之介がみた江戸・東京」", "url": "https://www.tabashio.jp/exhibition/2023/2309sep/index.html"}, {"title": "墨田区観光協会「芥川龍之介生育の地」", "url": "https://visit-sumida.jp/wp/spot/6005"}]}, {"title": "育ったのは、本所・両国", "text": "乳児のころ、母の実家の芥川家に引き取られ、18歳まで本所（ほんじょ）・両国周辺で育ちました。住まいは今の墨田区両国3丁目にあたる場所です。俳句や芝居などに親しむ家庭でした。", "sources": [{"title": "たばこと塩の博物館「芥川龍之介がみた江戸・東京」", "url": "https://www.tabashio.jp/exhibition/2023/2309sep/index.html"}, {"title": "墨田区立図書館「すみだ文学散歩」（PDF）", "url": "https://www.library.sumida.tokyo.jp/images/upload/sumidabunngakusannpo.pdf"}]}, {"title": "なじみの景色は、隅田川", "text": "育った家の近くには隅田川や回向院（えこういん）がありました。芥川は『大川の水』にも、川沿いの風景を書いています。育った町を知ってから作品を読むと、身近な景色を作家がどう見ていたか、たどる楽しみが生まれます。", "sources": [{"title": "たばこと塩の博物館「芥川龍之介がみた江戸・東京」", "url": "https://www.tabashio.jp/exhibition/2023/2309sep/index.html"}, {"title": "青空文庫「大川の水」本文", "url": "https://www.aozora.gr.jp/cards/000879/files/123_15167.html"}]}, {"title": "夏目漱石との出会い", "text": "1915年11月、友人とともに夏目漱石を訪ねました。翌年、漱石から『鼻』を高く評価され、名前を広く知られる転機になります。書き続けていた若い芥川にとって、先輩作家からの言葉は大きな励みになりました。", "sources": [{"title": "日本近代文学館「教科書のなかの文学／教室のそとの文学──芥川龍之介『羅生門』とその時代」", "url": "https://www.bungakukan.or.jp/cat-exhibition/9062/"}]}, {"title": "小説家になるまで、何をしていた？", "text": "読書だけでなく、幼いころから回覧雑誌も作っていました。東京帝国大学では英文学を学び、仲間との同人誌活動にも取り組みます。1915年に『羅生門』、1916年に『鼻』を発表しました。漱石に褒められて初めて書き始めたのではなく、それまでの読書や創作の積み重ねがありました。", "sources": [{"title": "山梨県立文学館デジタルアーカイブ「芥川龍之介」", "url": "https://digital-archive.pref.yamanashi.jp/literary/19"}, {"title": "たばこと塩の博物館「芥川龍之介がみた江戸・東京」", "url": "https://www.tabashio.jp/exhibition/2023/2309sep/index.html"}]}, {"title": "作家の暮らしを支えた田端", "text": "1914年に田端（たばた）へ移り、ここが創作の大切な拠点になりました。室生犀星（むろう さいせい）ら作家との交流も、田端に文士が集まるきっかけの一つとなります。大学卒業後は英語を教えながら執筆し、1919年に教職を離れ、文筆に専念しました。田端に移ってからも、横須賀や鎌倉で暮らした時期があります。", "sources": [{"title": "北区「芥川龍之介記念館とは」", "url": "https://www.city.kita.lg.jp/culture-tourism-sports/culture/1010296/1010304/1010305.html"}, {"title": "田端文士村記念館", "url": "https://kitabunka.or.jp/tabata/news/16484/"}, {"title": "国立国会図書館「近代日本人の肖像」", "url": "https://www.ndl.go.jp/portrait/datas/224"}]}];
function bodyText(x,value){const words=Object.keys(x.bodyReadings||{}).sort((a,b)=>b.length-a.length);if(!words.length)return esc(value);let output='',i=0;while(i<value.length){const word=words.find(w=>value.startsWith(w,i));if(word){output+=`<ruby>${esc(word)}<rt>${esc(x.bodyReadings[word])}</rt></ruby>`;i+=word.length}else{output+=esc(value[i]);i++}}return output}
const personBackground={"soseki": [{"title": "生まれたところ", "text": "1867年2月9日、江戸の牛込馬場下横町に生まれました。今の東京都新宿区喜久井町にあたります。本名は夏目金之助です。", "sources": [{"title": "新宿区立漱石山房記念館「漱石の生涯」", "url": "https://soseki-museum.jp/soseki-natsume/sosekis-life/"}, {"title": "国立国会図書館「近代日本人の肖像」夏目漱石", "url": "https://www.ndl.go.jp/portrait/datas/307/"}]}, {"title": "育ったところ", "text": "幼いころは四谷の塩原家の養子となり、のちに牛込の実家へ戻りました。東京で学び、大学では英文学を専攻します。子供時代に暮らした家や家族との関係には、変化がありました。", "sources": [{"title": "新宿区立漱石山房記念館「漱石の生涯」", "url": "https://soseki-museum.jp/soseki-natsume/sosekis-life/"}]}, {"title": "教師から、小説を書く人へ", "text": "1893年に帝国大学を卒業し、松山や熊本で教師を務めました。1900年から英国へ留学。帰国後は大学で英語を教えながら、『吾輩は猫である』を発表しました。小説家になる前にも、学び、教える時間がありました。", "sources": [{"title": "新宿区立漱石山房記念館「漱石の生涯」", "url": "https://soseki-museum.jp/soseki-natsume/sosekis-life/"}, {"title": "国立国会図書館「近代日本人の肖像」夏目漱石", "url": "https://www.ndl.go.jp/portrait/datas/307/"}]}, {"title": "つながりのある人", "text": "学生時代から正岡子規と親しくなり、俳句を学びました。後年には、若い芥川龍之介の『鼻』を高く評価しています。先輩から学ぶ側だった漱石も、次の世代を励ます存在になりました。", "sources": [{"title": "新宿区立漱石山房記念館「漱石の生涯」", "url": "https://soseki-museum.jp/soseki-natsume/sosekis-life/"}, {"title": "国立国会図書館「近代日本人の肖像」芥川龍之介", "url": "https://www.ndl.go.jp/portrait/datas/224/"}]}, {"title": "新聞社で小説を書き続ける", "text": "1907年に東京朝日新聞社へ入り、創作に専念します。『三四郎』『それから』『門』『こころ』などを発表しました。教師だった時期と、職業として小説を書くようになった時期を分けると、歩みがつかみやすくなります。", "sources": [{"title": "新宿区立漱石山房記念館「漱石の生涯」", "url": "https://soseki-museum.jp/soseki-natsume/sosekis-life/"}, {"title": "国立国会図書館「近代日本人の肖像」夏目漱石", "url": "https://www.ndl.go.jp/portrait/datas/307/"}]}, {"title": "最後の作品", "text": "1916年12月9日、49歳で亡くなりました。最後の長編小説『明暗』は、書き終わらないまま残されました。『こころ』だけが晩年の作品というわけではなく、その後にも創作は続いていました。", "sources": [{"title": "新宿区立漱石山房記念館「漱石の生涯」", "url": "https://soseki-museum.jp/soseki-natsume/sosekis-life/"}, {"title": "国立国会図書館「近代日本人の肖像」夏目漱石", "url": "https://www.ndl.go.jp/portrait/datas/307/"}]}], "kenji": [{"title": "生まれたところ", "text": "1896年8月27日、岩手県の花巻川口町に生まれました。今の花巻市豊沢町にあたります。家は質屋と古着商を営んでいました。作品で親しんだ自然だけでなく、町の暮らしも身近にありました。", "sources": [{"title": "花巻市「宮沢賢治について」", "url": "https://www.city.hanamaki.iwate.jp/miyazawakenji/about_kenji/"}, {"title": "国立国会図書館「近代日本人の肖像」宮沢賢治", "url": "https://www.ndl.go.jp/portrait/datas/4318/"}]}, {"title": "育ったところと、好きだったもの", "text": "花巻で育ち、1909年に盛岡中学校へ入学しました。少年時代から鉱物や植物の採集に親しみ、のちに盛岡高等農林学校で学びます。自然を眺めるだけでなく、調べ、名前や仕組みを知ることにも関心を向けていました。", "sources": [{"title": "花巻市「宮沢賢治年譜」", "url": "https://www.city.hanamaki.iwate.jp/miyazawakenji/about_kenji/1003946.html"}]}, {"title": "書きはじめたころ", "text": "15歳ごろから短歌を作り、1917年には仲間と同人誌『アザリア』を創刊しました。詩や童話へと、書くものを広げていきます。最初から、今よく知られる童話だけを書いていたわけではありません。", "sources": [{"title": "花巻市「宮沢賢治年譜」", "url": "https://www.city.hanamaki.iwate.jp/miyazawakenji/about_kenji/1003946.html"}, {"title": "花巻市「賢治と文学」", "url": "https://www.city.hanamaki.iwate.jp/miyazawakenji/about_kenji/1003947.html"}]}, {"title": "学校の先生として", "text": "1921年に花巻の農学校の教師となりました。授業だけでなく、詩や曲を作ったり、生徒と劇を上演したりする活動にも取り組みました。農業を学ぶことと、表現する楽しさを、学校の暮らしの中で結びつけていました。", "sources": [{"title": "花巻市「宮沢賢治年譜」", "url": "https://www.city.hanamaki.iwate.jp/miyazawakenji/about_kenji/1003946.html"}, {"title": "花巻市「賢治と文学」", "url": "https://www.city.hanamaki.iwate.jp/miyazawakenji/about_kenji/1003947.html"}]}, {"title": "生きている間に出した二冊", "text": "1924年に『春と修羅』と童話集『注文の多い料理店』を刊行しました。生前に出版した本は、この二冊です。妹トシとの別れを詠んだ『永訣の朝』など、人との関わりも作品に残されています。『銀河鉄道の夜』は没後に発表された作品です。", "sources": [{"title": "花巻市「宮沢賢治について」", "url": "https://www.city.hanamaki.iwate.jp/miyazawakenji/about_kenji/"}, {"title": "花巻市「宮沢賢治年譜」", "url": "https://www.city.hanamaki.iwate.jp/miyazawakenji/about_kenji/1003946.html"}, {"title": "花巻市「賢治と文学」", "url": "https://www.city.hanamaki.iwate.jp/miyazawakenji/about_kenji/1003947.html"}]}, {"title": "農業と芸術を、暮らしのそばへ", "text": "1926年に農学校を退職し、羅須地人協会を設立しました。肥料の相談や農業指導をしながら、音楽や文学にも取り組みます。1933年9月21日、37歳で亡くなりました。作品を書くことだけでなく、人々の暮らしを支えようとした歩みもあります。", "sources": [{"title": "花巻市「宮沢賢治年譜」", "url": "https://www.city.hanamaki.iwate.jp/miyazawakenji/about_kenji/1003946.html"}, {"title": "国立国会図書館「近代日本人の肖像」宮沢賢治", "url": "https://www.ndl.go.jp/portrait/datas/4318/"}]}]};
function summaryParagraphs(x){const seen=new Set(),readings=x.summaryReadings||{},words=Object.keys({...x.bodyReadings,...readings}).sort((a,b)=>b.length-a.length);return x.synopsisSummary.map(value=>{let out='',i=0;while(i<value.length){const word=words.find(w=>value.startsWith(w,i));if(word){const info=readings[word];if(info){out+=seen.has(info.key)?esc(word):rubyText(word,info.reading);seen.add(info.key)}else{out+=rubyText(word,x.bodyReadings[word])}i+=word.length}else{out+=esc(value[i]);i++}}return `<p class="bodytext">${out}</p>`}).join('')}
function renderIntroduction(x){main.innerHTML=`<button class="back" id="back">← 一覧に戻る</button><article class="article"><header class="articleheader"><div><span class="label">${esc(x.genreLabel)} / ${esc(x.introLabel||"絵本の紹介")}</span><h2>${titleText(x)}</h2><p class="meta">${byline(x)}</p>${articleDates(x)}<p class="subnote">結末に触れない紹介です。作品の全文・筋書き全体は掲載していません。</p></div><figure class="emblem-figure">${art(x)}<figcaption>${esc(x.motifCaption||"海や木を表す図鑑オリジナルの図柄です。")}<br>作品の挿絵・表紙や登場人物の再現ではありません。</figcaption></figure></header><div class="content"><section class="synopsis"><h3>どんな本？</h3><p class="bodytext">${bodyText(x,x.intro)}</p></section><section class="conclusion"><h3>読みどころ</h3><p class="bodytext">${bodyText(x,x.commentary)}</p><p class="subnote">本サイト独自の紹介・読み方の一例です。</p></section><section><h3>本の情報</h3><p class="bodytext">${esc(x.edition)}</p><p><a class="back" href="${esc(x.officialURL)}" target="_blank" rel="noopener noreferrer">${esc(x.officialLabel)} ↗</a></p></section><details><summary>出典・確認情報</summary><p class="subnote">出版社と書誌情報を確認して、独自の言葉で短く紹介しています。本文・台詞・表紙・挿絵は転載していません。</p><ul class="sources">${x.sources.map(z=>`<li><a href="${esc(z.url)}" target="_blank" rel="noopener noreferrer">${esc(z.title)} ↗</a></li>`).join('')}</ul><p class="subnote">確認日：2026年11月1日。刊行年は記載した日本語版の情報です。</p></details></div></article><section class="related"><div class="sectionhead"><h2>知識をつなぐ、次の一冊</h2></div><div class="grid">${x.links.map(id=>items.find(z=>z.id===id)).filter(Boolean).map(card).join('')}</div></section>`;document.getElementById('back').onclick=()=>{location.hash=lastListHash}}
const mascotDrafts=[{"id": "K-000003", "subject": "長十郎梨", "subjectReading": "ちょうじゅうろうなし", "name": "なしふみ", "category": "農業・地域の歴史", "timeScope": "歴史的な発祥の話。現在の栽培・販売状況は未確認", "factText": "長十郎梨は、現在の川崎区にあたる大師河原で生まれた梨の品種です。川崎市の資料では、1893年に当麻辰次郎の梨園で発見されたと伝えられ、当麻家の屋号から名前が付いたと紹介されています。地域の農業の歴史をたどる入口になる題材です。", "fictionText": "赤褐色の丸い梨をイメージした、静かな歴史案内役。無地の小さな本と葉のしおりを持ち、見つけた地域の話を一ページずつ書き留めます。名前、性格、持ち物はこの図鑑の創作です。", "sources": [{"title": "川崎市・かわさき区の宝物シート『長十郎梨のふるさと』", "url": "https://www.city.kawasaki.jp/kawasaki/cmsfiles/contents/0000025/25449/5-2.pdf", "publisher": "川崎市", "supports": "1893年の発見伝承、当麻辰次郎、屋号由来、地域との関係"}], "image": "assets/k-000003.webp", "imageAlt": "長十郎梨を題材にした非公式の創作キャラクター案", "imageSha256": "9810b6c99d2ca43fbddd18f9897ec0e4b338d5c3749eea54d8fd7720695725fe", "firstPublishedAt": "2026-11-01T23:09:38+09:00", "updatedAt": "2026-11-01T23:09:38+09:00"}, {"id": "K-000004", "subject": "奈良茶飯", "subjectReading": "ならちゃめし", "name": "ちゃめしびより", "category": "食文化・川崎宿", "timeScope": "歴史的な川崎宿との関係。現在の店舗・提供状況は未確認", "factText": "奈良茶飯は、東海道の川崎宿で知られた旅籠『万年屋』の名物でした。川崎区の公式紹介では、作品『東海道中膝栗毛』の弥次さん・喜多さんも食べたとされています。旅の道と食事を通して、昔の川崎宿のにぎわいを知る題材です。", "fictionText": "丸い飯椀を体に、やわらかな湯気を前髪にした、おもてなし好きの案内役。歩き疲れた旅人の話を聞くのが得意です。名前、性格、姿は創作で、当時の料理や器を正確に復元したものではありません。", "sources": [{"title": "川崎市川崎区『川崎宿とは』", "url": "https://www.city.kawasaki.jp/kawasaki/category/123-9-2-3-0-0-0-0-0-0.html", "publisher": "川崎市川崎区", "supports": "万年屋の名物、東海道中膝栗毛への言及"}], "image": "assets/k-000004.webp", "imageAlt": "奈良茶飯を題材にした非公式の創作キャラクター案", "imageSha256": "66165a2f06255ab782f092f98b907222c5816a2fda2f0606c3f0512ab1d6eec2", "firstPublishedAt": "2026-11-01T23:09:38+09:00", "updatedAt": "2026-11-01T23:09:38+09:00"}, {"id": "K-000005", "subject": "六郷の渡し舟", "subjectReading": "ろくごうのわたしぶね", "name": "ろくごうこぶね", "category": "交通・多摩川の歴史", "timeScope": "歴史題材。現在運航している渡し舟の案内ではない", "factText": "六郷川、現在の多摩川には1600年に六郷大橋が架けられました。川崎区の公式資料によると、1688年の大洪水で橋が流された後、1874年まで渡しが続けられました。舟で川を越えていた時代の交通を知る題材です。", "fictionText": "小さな木舟を体に、櫂を持ち、さざ波の足で歩く聞き上手。川の両岸で出会った人の話をつなぎます。名前、性格、手足は創作で、歴史上の船体を精密に復元したものではありません。", "sources": [{"title": "川崎市川崎区『01六郷の渡し』", "url": "https://www.city.kawasaki.jp/kawasaki/page/0000024760.html", "publisher": "川崎市川崎区", "supports": "1600年架橋、1688年洪水、1874年までの渡し"}], "image": "assets/k-000005.webp", "imageAlt": "六郷の渡し舟を題材にした非公式の創作キャラクター案", "imageSha256": "9f3c140b7f58bcfe88eec9edd77237e576e93aa4af335522a51e7c9a81d12dda", "firstPublishedAt": "2026-11-01T23:09:38+09:00", "updatedAt": "2026-11-01T23:09:38+09:00"}, {"id": "K-000007", "subject": "アカテガニ", "subjectReading": "アカテガニ", "name": "あかてこもれび", "category": "自然・殿町の生きもの", "timeScope": "2023年12月1日更新の川崎市紹介に基づく生息環境の説明。当日の目撃・個体数は未確認", "factText": "川崎市は、アカテガニを川崎区殿町で夏によく見かける生きものとして紹介しています。水中よりも陸地を好み、木にも登るカニです。キングスカイフロントの敷地で夏に見られるカニの多くがアカテガニとされ、街と水辺がつながる自然を知る入口になります。", "fictionText": "赤いはさみと落ち着いた土色の甲羅を持つ、小さな木陰の案内役。葉の形の小さな肩掛けかばんを持ち、街と水辺の間で見つけた風景を覚えています。名前、かばん、性格は創作です。", "sources": [{"title": "川崎市「多摩川河口干潟の生きもの『アカテガニ』」", "url": "https://www.city.kawasaki.jp/300/page/0000125732.html", "publisher": "川崎市", "publishedDate": "2023-12-01", "updatedDate": "2023-12-01", "checkedDate": "2026-11-01", "supports": "川崎区殿町・キングスカイフロントとの関係、陸上生活と木登り"}], "image": "assets/k-000007.webp", "imageAlt": "アカテガニを題材にした非公式の創作キャラクター案", "imageSha256": "4a8c225dc643980be93dcaa2da25bebe5af13dafb1903704d413faa8d1963289", "imageWidth": 900, "imageHeight": 600, "firstPublishedAt": "2026-11-01T23:22:36+09:00", "updatedAt": "2026-11-01T23:22:36+09:00"}, {"id": "K-000010", "subject": "マハゼ", "subjectReading": "マハゼ", "name": "まはぜしおみ", "category": "自然・多摩川河口の魚", "timeScope": "令和4年度（2022年度）秋季・冬季の調査で川崎側右岸の出現を確認。2026年当日の生息数は未確認", "factText": "殿町羽田空港線に関わる川崎市の環境調査資料には、令和4年度の秋と冬に、計画区の右岸・川崎側でマハゼが確認されたことが記されています。資料では汽水性の魚として扱われています。海と川の境目の環境を知るための題材です。", "fictionText": "砂色の小魚をイメージした、潮の変化に耳をすます案内役。水滴形の小さなバッジと穏やかな表情が目印です。名前、役割、持ち物は創作で、生物同定に使う精密な図ではありません。", "sources": [{"title": "川崎市「第17回 都市計画道路殿町羽田空港線ほか道路改築工事に関わる河川河口の環境アドバイザー会議 概要」魚類", "url": "https://www.city.kawasaki.jp/530/cmsfiles/contents/0000097/97966/No.17adobaiza-gaiyou2.pdf", "publisher": "川崎市", "publishedDate": null, "publicationDateNote": "PDF本文の発行日は今回確定せず。検索エンジンの公開時期推定は採用しない", "dataPeriod": "令和4年度秋季・冬季", "pageReference": "PDF16ページ目、生活史型ごとの出現種数の説明（抽出テキストで確認）", "checkedDate": "2026-11-01", "supports": "計画区右岸＝川崎側、令和4年度秋季・冬季のマハゼ確認、汽水性の分類"}], "image": "assets/k-000010.webp", "imageAlt": "マハゼを題材にした非公式の創作キャラクター案", "imageSha256": "7e31f5d71477c5db0088f3a9f3cb794952ab5f825374f8e134b6a27d7bd1b737", "imageWidth": 900, "imageHeight": 450, "firstPublishedAt": "2026-11-01T23:22:36+09:00", "updatedAt": "2026-11-01T23:22:36+09:00"}, {"id": "K-000011", "subject": "ガントリークレーン", "subjectReading": "ガントリークレーン", "name": "おうぎはこび", "category": "港湾・東扇島の物流", "timeScope": "現代施設の題材。市公式概要の更新日は2024年4月10日。2026年の個別号機の稼働・更新完了は未確認", "factText": "東扇島にある川崎港コンテナターミナルは、1996年4月に供用を開始しました。川崎市の施設概要には、コンテナを扱うガントリークレーンが掲載されています。海から届く荷物と陸の物流をつなぐ、港の設備を知る題材です。", "fictionText": "門の形の脚と長い横梁を持つ、慎重で段取り上手な港の案内役。無地の小さなコンテナを、急がず大切に運ぶ設定です。名前、表情、性格は創作で、特定の号機の設計を再現したものではありません。", "sources": [{"title": "川崎市「川崎港コンテナターミナル」", "url": "https://www.city.kawasaki.jp/580/page/0000022057.html", "publisher": "川崎市港湾局", "publishedDate": "2018-02-17", "updatedDate": "2024-04-10", "checkedDate": "2026-11-01", "supports": "東扇島に立地、1996年4月供用開始、ガントリークレーンの掲載"}], "image": "assets/k-000011.webp", "imageAlt": "ガントリークレーンを題材にした非公式の創作キャラクター案", "imageSha256": "5944d9cb622ba333345824aa25f2cafd9b1c1ec3fb04801499ffc6bc754f492d", "imageWidth": 900, "imageHeight": 822, "firstPublishedAt": "2026-11-01T23:22:36+09:00", "updatedAt": "2026-11-01T23:22:36+09:00"}, {"id": "K-000001", "subject": "川崎大師のだるま", "subjectReading": "かわさきだいしのだるま", "name": "だるまこつこつ", "category": "文化・門前町の縁起物", "timeScope": "現在にも続く文化題材。資料にある店舗数・当年行事日程は現況として採用しない。", "factText": "川崎市の資料では、だるまは川崎大師の土産物の一つとして紹介されています。表参道や仲見世通りには、厄除けや開運を願うだるまを扱う店が並ぶと記されています。願いを込める縁起物を通して、門前町の文化を知る題材です。", "fictionText": "赤茶色の丸いだるまをイメージした、小さな努力を応援する案内役。無地の折りたたみメモを持ち、一日の「できたこと」を大切にします。名前、性格、持ち物は創作で、実物の縁起物や公認キャラクターの複製ではありません。", "sources": [{"title": "川崎市・かわさき区の宝物シート「川崎大師のだるま」", "url": "https://www.city.kawasaki.jp/kawasaki/cmsfiles/contents/0000025/25622/10-16.pdf", "publisher": "川崎市川崎区", "publishedDate": null, "publicationDateNote": "資料本体の発行・更新日を確定できず。閲覧確認日と区別。", "checkedDate": "2026-11-01", "supports": "大師の土産物、表参道・仲見世通り、縁起物としての地域文化"}], "image": "assets/k-000001.webp", "imageAlt": "川崎大師のだるまを題材にした非公式の創作キャラクター案", "imageSha256": "8548c54d9040c0d134652d07a4a8cf8d31ce3bf115ffd569860cb425f6ef528f", "imageWidth": 900, "imageHeight": 860, "reviewNote": "既存候補の仮リデザインです。以前の原案画像との照合は未完了で、旧原案の置き換えや正式登録ではありません。", "firstPublishedAt": "2026-11-01T23:30:23+09:00", "updatedAt": "2026-11-01T23:30:23+09:00"}, {"id": "K-000002", "subject": "久寿餅", "subjectReading": "くずもち", "name": "くずもちこはく", "category": "食文化・川崎大師の土産", "timeScope": "現在にも続く食文化。店舗数・値段・保存条件・商品仕様の現況を示すカードではない。", "factText": "久寿餅は川崎大師の定番土産として知られ、川崎市の資料では表参道や仲見世通りとのつながりが紹介されています。黒蜜ときな粉を合わせて味わう菓子です。小麦のでんぷんを使う川崎大師の久寿餅を、葛粉の菓子と混同しないことも大切です。", "fictionText": "白くやわらかそうな餅の一切れに、黒蜜色の小さなしずく飾りときな粉色の頬を添えた案内役。ゆっくり話を聞くおだやかな性格です。名前、表情、飾りは創作で、特定店舗の包装や商品を再現したものではありません。", "sources": [{"title": "川崎市・かわさき区の宝物シート「川崎大師久寿餅」", "url": "https://www.city.kawasaki.jp/kawasaki/cmsfiles/contents/0000025/25622/10-14.pdf", "publisher": "川崎市川崎区", "publishedDate": null, "publicationDateNote": "資料本体の発行・更新日を確定できず。閲覧確認日と区別。", "checkedDate": "2026-11-01", "supports": "定番土産、表参道と仲見世通り、黒蜜・きな粉、主に小麦粉由来のくず餅の説明"}, {"title": "川崎市「かわさき名産品」和菓子紹介", "url": "https://www.city.kawasaki.jp/280/cmsfiles/contents/0000020/20067/meisanhinP1-P11.pdf", "publisher": "川崎市", "publishedDate": null, "publicationDateNote": "資料本体の発行・更新日を確定できず。閲覧確認日と区別。", "checkedDate": "2026-11-01", "supports": "大師町の久寿餅商品で小麦のでんぷんを発酵し蒸す製法を紹介。特定商品の工程期間は一般化しない"}], "image": "assets/k-000002.webp", "imageAlt": "久寿餅を題材にした非公式の創作キャラクター案", "imageSha256": "469e35d1fc16d427a1383ab3955688bc236e24732e9d570a65181c48869e4d98", "imageWidth": 900, "imageHeight": 600, "reviewNote": "既存候補の仮リデザインです。以前の原案画像との照合は未完了で、旧原案の置き換えや正式登録ではありません。", "firstPublishedAt": "2026-11-01T23:30:23+09:00", "updatedAt": "2026-11-01T23:30:23+09:00"}, {"id": "K-000015", "subject": "京急大師線", "subjectReading": "けいきゅうだいしせん", "name": "だいしみちしおり", "category": "交通・大師地域の鉄道", "timeScope": "現在の路線と1899年の開業史を区別。昔の六郷橋〜大師を現在の全区間と同一視しない。", "factText": "京急の公式駅紹介によると、前身の大師電気鉄道は1899年1月に六郷橋と大師の間を開通させました。このとき大師駅として開業したのが、現在の川崎大師駅です。駅は川崎区大師駅前にあり、大師線と地域の歩みを結ぶ題材になります。", "fictionText": "鉄道をたどる旅のしおりから生まれた、折り地図形の案内役。二本の細い線を道しるべに、昔と今のまちの話をつなぎます。地図の形、名前、性格は創作で、京急の車両・乗車券・路線図や公式マスコットではありません。", "sources": [{"title": "京浜急行電鉄「川崎大師駅」駅の概要", "url": "https://www.keikyu.co.jp/ride/kakueki/KK23.html", "publisher": "京浜急行電鉄株式会社", "publishedDate": null, "publicationDateNote": "資料本体の発行・更新日を確定できず。閲覧確認日と区別。", "checkedDate": "2026-11-01", "supports": "明治32年1月の六郷橋〜大師開通、大師駅として開業、川崎区大師駅前の所在地、現在の大師線案内"}], "image": "assets/k-000015.webp", "imageAlt": "京急大師線を題材にした非公式の創作キャラクター案", "imageSha256": "b83518e42915c3caf6c84e3ef1ca4485ca4a7c468c32d2a94e25b0b9a753f35c", "imageWidth": 900, "imageHeight": 842, "reviewNote": "既存候補の仮リデザインです。以前の原案画像との照合は未完了で、旧原案の置き換えや正式登録ではありません。", "firstPublishedAt": "2026-11-01T23:30:23+09:00", "updatedAt": "2026-11-01T23:30:23+09:00"}, {"id": "K-000012", "subject": "コンテナ船", "subjectReading": "こんてなせん", "name": "はこなみつむぎ", "category": "港湾・海の物流", "timeScope": "現代の港湾物流の題材。2025年の入港記録を根拠にし、現在の便数や運航日程は主張しない。", "factText": "川崎港のコンテナターミナルは東扇島にあります。川崎市は、2025年6月に新たな定期航路のコンテナ船が初入港したことを発表しました。箱型のコンテナを積んで港と港を結ぶ船は、川崎区と海の向こうの物流のつながりを知る題材です。", "fictionText": "短く丸い船体に、無地の小さなコンテナを並べた案内役。荷物に込められた人の思いを大切につなぐ性格です。名前、顔、配色は創作で、実在する船名や船社の公式キャラクターではありません。", "sources": [{"title": "川崎市「川崎港コンテナターミナル」", "url": "https://www.city.kawasaki.jp/580/page/0000022057.html", "publisher": "川崎市港湾局", "publishedDate": null, "checkedDate": "2026-11-01", "supports": "東扇島への立地。施設概要の更新日2024-04-10", "publicationDateNote": "日付なしは発行日未確定。閲覧確認日とは区別。"}, {"title": "川崎市「川崎港に新たなコンテナ定期航路が開設されました」", "url": "https://www.city.kawasaki.jp/templates/prs/cmsfiles/contents/0000177/177826/hatunyuukou.pdf", "publisher": "川崎市港湾局", "publishedDate": "2025-06-23", "checkedDate": "2026-11-01", "supports": "2025年6月22日の川崎港コンテナターミナルへのコンテナ船初入港", "publicationDateNote": "記載された資料日付。現況確認日ではない。"}], "image": "assets/k-000012.webp", "imageAlt": "コンテナ船を題材にした非公式の創作キャラクター案", "imageSha256": "0debea43c2e60f20e11580499e8af14fa66f5f2810d54d07f3cdc10151026956", "imageWidth": 900, "imageHeight": 600, "firstPublishedAt": "2026-11-01T23:39:44+09:00", "updatedAt": "2026-11-01T23:39:44+09:00"}, {"id": "K-000013", "subject": "LNG船", "subjectReading": "えるえぬじーせん", "name": "えるなみ", "category": "エネルギー・海上輸送", "timeScope": "現代設備・船舶の題材。根拠パンフレットは2024年9月作成。現在の年間入船数・受入量・稼働状況は示さない。", "factText": "川崎区東扇島にあるJERAの東扇島火力発電所は、LNG基地としての役割も持ちます。公式パンフレットにはLNG船の入船と燃料ガスの供給が紹介されています。LNG船を入口に、海から届く液化天然ガスと地域のエネルギー施設のつながりを知ることができます。", "fictionText": "淡い青灰色の船体に、丸いタンクカバーを載せた慎重な案内役。あわてず確認してから出発する性格です。名前、顔、配色は創作で、特定のLNG船の構造や運用を再現した模型ではありません。", "sources": [{"title": "JERA「東扇島火力発電所」", "url": "https://www.jera.co.jp/corporate/business/thermal-power/list/higashiogishima", "publisher": "株式会社JERA", "publishedDate": null, "checkedDate": "2026-11-01", "supports": "所在地：神奈川県川崎市川崎区東扇島3", "publicationDateNote": "2024年9月作成。日までは記載なし。閲覧確認日とは区別。"}, {"title": "JERA「東扇島火力発電所」パンフレット", "url": "https://www.jera.co.jp/static/files/corporate/business/thermal-power/list/higashiogishima/pdf/higashiOhgishima_2024_jp.pdf", "publisher": "株式会社JERA", "publishedDate": null, "checkedDate": "2026-11-01", "supports": "LNG基地としての役割、LNG船の入船、燃料ガス供給", "publicationDateNote": "2024年9月作成。日までは記載なし。閲覧確認日とは区別。", "sourceDateText": "2024.9 作成", "publishedDatePrecision": "month"}, {"title": "JERA「東日本地区 液化ガス貯蔵設備の容量等の公表（2025年度）」", "url": "https://www.jera.co.jp/static/files/corporate/business/optimization/lng/pdf/lng-higashi-ekika250324.pdf", "publisher": "株式会社JERA", "publishedDate": null, "checkedDate": "2026-11-01", "supports": "東扇島基地で利用可能な船型にモス型とメンブレン型を記載。船陸整合性確認が必要と注記", "publicationDateNote": "2024年9月作成。日までは記載なし。閲覧確認日とは区別。"}], "image": "assets/k-000013.webp", "imageAlt": "LNG船を題材にした非公式の創作キャラクター案", "imageSha256": "2b227ddfd98c5b1eb88291ce6174d879c2cbdf7aa2e0bbac264b67bf9b257f6e", "imageWidth": 900, "imageHeight": 450, "firstPublishedAt": "2026-11-01T23:39:44+09:00", "updatedAt": "2026-11-01T23:39:44+09:00"}, {"id": "K-000014", "subject": "貨物列車", "subjectReading": "かもつれっしゃ", "name": "しおはまつなぎ", "category": "交通・臨海部の鉄道物流", "timeScope": "現代の鉄道物流の題材。駅所在地と公式輸送案内に基づき、当日の列車時刻・車両編成・取扱量は未確認。", "factText": "JR貨物の公式案内では、川崎貨物駅は川崎区塩浜にあるコンテナ取扱駅です。神奈川臨海鉄道は、川崎貨物駅などを経由して全国の駅へ貨物を送る仕組みを案内しています。人を乗せる電車とは違う、荷物を運ぶ鉄道の役割を知る題材です。", "fictionText": "小さな機関車と無地の貨車がつながった、約束を大切にする案内役。仲間と息を合わせ、荷物を次へ渡すのが得意です。名前、表情、配色は創作で、実在車両や鉄道会社の公式マスコットを再現したものではありません。", "sources": [{"title": "JR貨物「エリア別サービス案内（コンテナ時刻表）」", "url": "https://www.jrfreight.co.jp/service/area", "publisher": "日本貨物鉄道株式会社", "publishedDate": null, "checkedDate": "2026-11-01", "supports": "川崎貨物駅のコンテナ取扱駅掲載、所在地：川崎市川崎区塩浜4丁目1-1", "publicationDateNote": "日付なしは発行日未確定。閲覧確認日とは区別。"}, {"title": "神奈川臨海鉄道「鉄道営業案内」", "url": "https://www.kanarin.co.jp/business.html", "publisher": "神奈川臨海鉄道株式会社", "publishedDate": null, "checkedDate": "2026-11-01", "supports": "川崎貨物駅または根岸駅を経由した全国への連絡運輸、貨物の種類", "publicationDateNote": "日付なしは発行日未確定。閲覧確認日とは区別。"}], "image": "assets/k-000014.webp", "imageAlt": "貨物列車を題材にした非公式の創作キャラクター案", "imageSha256": "3ceb3a9d431f148099435340e257a1a9b022163631be0edd39a334d5b8a8f075", "imageWidth": 900, "imageHeight": 450, "firstPublishedAt": "2026-11-01T23:39:44+09:00", "updatedAt": "2026-11-01T23:39:44+09:00"}, {"id": "K-000016", "subject": "製鉄用クレーン", "subjectReading": "せいてつようくれーん", "name": "はがねもちあげ", "category": "鉄鋼産業・運搬設備", "timeScope": "2013年末の施設台帳をもとにした歴史題材。現存・稼働・台数は未確認。", "factText": "川崎市の港湾計画資料には、2013年末の大川・白石町地区の設備として、JFEスチール東日本製鉄所が管理する倉庫の天井クレーンが記録されています。製鉄に関わる仕事には、材料や製品を運ぶ設備も欠かせません。ここでは当時の記録を入口に、鉄鋼産業の運搬設備を紹介します。", "fictionText": "横長の梁と小さな巻上げ部分を持つ、落ち着いた案内役。何かを動かす前に周りを確かめる性格です。形と表情は創作で、特定の機械の復元や、安全な操作方法を示す図ではありません。", "sources": [{"title": "川崎市「川崎港港湾計画資料（その1）改訂」表Ⅷ－4－18 荷役機械（専用）", "url": "https://www.city.kawasaki.jp/580/cmsfiles/contents/0000063/63390/kouwankeikakusiryou1.pdf", "publisher": "川崎市（川崎港港湾管理者）", "publishedDate": null, "checkedDate": "2026-11-01", "supports": "本文117頁／PDF121頁：2013年末現在の大川・白石町地区にJFEスチール東日本製鉄所管理の池上商品倉庫7・8・9棟天井クレーン等を掲載", "publicationDateNote": "2014年11月改訂。表の調査時点は2013年末。", "sourceDateText": "2014年11月", "publishedDatePrecision": "month", "pdfPageOneBased": 121}], "image": "assets/k-000016.webp", "imageAlt": "製鉄用クレーンを題材にした非公式の創作キャラクター案", "imageSha256": "7d85ec2179a729155f666fde989e62ef46d6cf541f609c248890b2bbdfb3e9e9", "imageWidth": 900, "imageHeight": 360, "firstPublishedAt": "2026-11-01T23:48:33+09:00", "updatedAt": "2026-11-01T23:48:33+09:00"}, {"id": "K-000017", "subject": "圧延ロール", "subjectReading": "あつえんろーる", "name": "ころのばし", "category": "ものづくり・圧延工程", "timeScope": "圧延の仕組みを、1996年に引退した設備由来の川崎区の産業遺産から紹介する。", "factText": "川崎区の富士見公園には、かつて使われた熱間圧延機の歯車モニュメントがあります。区の解説では、圧延機はロールで鋼を薄く延ばす設備として紹介されています。展示されているのは歯車ですが、そこから材料を形づくるロールの働きも学べます。", "fictionText": "上下に並んだ丸いロールをひとつの身体にした、息を合わせるのが得意な案内役。小さな板をまっすぐ整える姿が目印です。名前と姿は創作で、保存されている歯車や実機を再現したものではありません。", "sources": [{"title": "川崎市川崎区「プラネタリー熱間圧延機歯車モニュメント」", "url": "https://www.city.kawasaki.jp/kawasaki/page/0000026764.html", "publisher": "川崎市川崎区", "publishedDate": "2006-05-25", "checkedDate": "2026-11-01", "supports": "川崎区富士見2-1の産業遺産。ロールで鋼を薄く延ばす工程と、1996年に圧延機が引退した歴史", "publicationDateNote": "公開日2006-05-25、更新日2025-11-19。モニュメントの歯車は圧延ロールそのものではない。", "updatedDate": "2025-11-19"}], "image": "assets/k-000017.webp", "imageAlt": "圧延ロールを題材にした非公式の創作キャラクター案", "imageSha256": "38fcf35a61c456ba3cdb1feff9194f15b7312d763f32af7766f6eef05ede8cf3", "imageWidth": 900, "imageHeight": 600, "firstPublishedAt": "2026-11-01T23:48:33+09:00", "updatedAt": "2026-11-01T23:48:33+09:00"}, {"id": "K-000018", "subject": "鋼板", "subjectReading": "こうはん", "name": "いたまもり", "category": "鉄鋼製品・暮らしの材料", "timeScope": "2026年の区公式産業紹介と企業製品案内に基づく。現在の生産量・見学受付・全設備の稼働状況は示さない。", "factText": "川崎区の2026年の産業紹介では、川崎区扇島に所在地を置くJFEスチール東日本製鉄所の厚板工場が取り上げられました。JFEの製品案内では、厚鋼板は船や橋、建物などに使われる材料です。板状の鋼材から、地域のものづくりと暮らしのつながりを知ることができます。", "fictionText": "厚みの見える一枚の鋼板を丸くデフォルメした、支えることが好きな案内役。控えめな銀灰色の体と、まっすぐな姿勢が目印です。名前と姿は創作で、特定メーカーの製品や公式キャラクターの再現ではありません。", "sources": [{"title": "川崎市川崎区「川崎臨海部オープンファクトリー（令和8年事業は終了しました）」", "url": "https://www.city.kawasaki.jp/kawasaki/page/0000183651.html", "publisher": "川崎市川崎区", "publishedDate": "2026-01-21", "checkedDate": "2026-11-01", "supports": "川崎区扇島1-1のJFE東日本製鉄所、厚板工場を含む2026年の地域産業紹介", "publicationDateNote": "公開日2026-01-21、更新日2026-04-10。終了済み事業の資料で、現在の見学募集ではない。", "updatedDate": "2026-04-10"}, {"title": "JFEスチール「製品情報・厚鋼板」", "url": "https://www.jfe-steel.co.jp/products/atuita/index.html", "publisher": "JFEスチール株式会社", "publishedDate": null, "checkedDate": "2026-11-01", "supports": "京浜地区の厚板工場と、厚鋼板の船舶・橋梁・建築などへの用途", "publicationDateNote": "発行日未確定。閲覧確認日とは区別。"}, {"title": "JFEスチール「京浜地区」", "url": "https://www.jfe-steel.co.jp/works/east/keihin/index.html", "publisher": "JFEスチール株式会社", "publishedDate": null, "checkedDate": "2026-11-01", "supports": "扇島が川崎・横浜両市にまたがること、2023年9月の銑鋼部門・熱間圧延ライン休止と厚板・薄板部門の継続を区別", "publicationDateNote": "発行日未確定。閲覧確認日とは区別。"}], "image": "assets/k-000018.webp", "imageAlt": "鋼板を題材にした非公式の創作キャラクター案", "imageSha256": "13e67a76b7aeb774591da2c033989d6c6938c16ff940b4f4073425793f324927", "imageWidth": 600, "imageHeight": 900, "firstPublishedAt": "2026-11-01T23:48:33+09:00", "updatedAt": "2026-11-01T23:48:33+09:00"}];
function mascotDraftSection(){return `<section class="mascot-drafts"><h3>制作中のキャラクター案</h3><p class="subnote">新しい掲載・更新順</p><p class="subnote">川崎区に関わる題材をもとにした、当図鑑独自の創作案です。自治体・施設・企業の公式キャラクターではありません。名称とデザインは仮案で、正式登録済みの件数には含めていません。</p><div class="mascot-grid">${[...mascotDrafts].sort((a,b)=>Math.max(Date.parse(b.updatedAt)||0,Date.parse(b.firstPublishedAt)||0)-Math.max(Date.parse(a.updatedAt)||0,Date.parse(a.firstPublishedAt)||0)).map(m=>`<section class="mascot-draft"><div class="mascot-status">${esc(m.id)} · 制作中・仮称</div><h4>${esc(m.name)}</h4>${m.firstPublishedAt?`<p class="subnote">案の初回掲載：${timestampText(m.firstPublishedAt)}<br>案の更新：${timestampText(m.updatedAt)}</p>`:""}${m.reviewNote?`<p class="subnote">${esc(m.reviewNote)}</p>`:""}<p class="mascot-subject">題材：${m.subject===m.subjectReading?esc(m.subject):rubyText(m.subject,m.subjectReading)}</p>${m.image?`<figure><img src="${esc(m.image)}" alt="${esc(m.imageAlt)}" loading="lazy" width="${m.imageWidth||900}" height="${m.imageHeight||822}"></figure>`:'<p class="subnote">キャラクター画像を制作中です。</p>'}<h5>題材の本当の話</h5><p>${esc(m.factText)}</p><p class="subnote">${esc(m.timeScope)}</p><h5>キャラクターの創作設定</h5><p>${esc(m.fictionText)}</p><p class="background-sources">出典：${m.sources.map(z=>`<a href="${esc(z.url)}" target="_blank" rel="noopener noreferrer">${esc(z.title)} ↗</a>`).join(' ／ ')}</p></section>`).join('')}</div></section>`}
function renderArticle(x){if(x.contentType==='protected-introduction'){renderIntroduction(x);return}const literary=x.cat==='literature';main.innerHTML=`<button class="back" id="back">← 一覧に戻る</button><article class="article"><header class="articleheader"><div><span class="label">${catNames[x.cat]} / ${literary?'名作を読み解く':x.cat==='person'?'作品と人物をつなぐ':'地域を知る入口'}</span><h2${(x.id==="goshu"||x.id==="lamp")?' class="long-title"':''}>${titleText(x)}</h2><p class="meta">${byline(x)}</p>${articleDates(x)}${(!literary&&x.textNote)?`<p class="edition-note">${esc(x.textNote)}</p>`:""}</div>${x.image?`<figure class="story-figure">${storyImage(x,'article')}<figcaption>${esc(x.imageCaption||"作品をもとにしたAIイメージイラスト")}</figcaption></figure>`:x.id==='kawasaki'?`<figure class="emblem-figure">${art(x)}<figcaption>図鑑オリジナルマーク<br>工場・港・多摩川をモチーフにした創作です。<br>市・区の公式マークではありません。</figcaption></figure>`:art(x)}</header><div class="content">${literary?`<section class="characters"><h3>登場人物</h3><ul class="people">${x.people.map(([n,d])=>`<li><strong>${characterName(n)}</strong>${esc(d)}</li>`).join('')}</ul></section>`:''}<section class="synopsis"><h3>${literary?'あらすじ':'概要'}${literary?'<span class="badge">物語の入口</span>':''}</h3><p class="bodytext">${bodyText(x,x.intro)}</p></section>${literary?`<section class="digest"><h3>要約</h3><p class="subnote">ここからは結末まで紹介します。</p>${summaryParagraphs(x)}</section>`:`<section class="gist"><h3>要点</h3><p class="summary-text">${esc(x.gist)}</p></section>`}${literary?`<section class="conclusion"><h3>まとめ</h3><p class="bodytext">${bodyText(x,finalThoughts[x.id])}</p><p class="subnote">作品の出来事を踏まえた、読み方の一例です。</p></section>`:''}${(x.id==='akutagawa'||personBackground[x.id])?`<section class="author-background"><h3>この人をもっと知る</h3><p class="subnote">生まれた町、育った環境、作家になるまでをたどります。</p>${(personBackground[x.id]||authorBackground).map(b=>`<section class="background-item"><h4>${esc(b.title)}</h4><p class="bodytext">${bodyText(x,b.text)}</p><p class="background-sources">出典：${b.sources.map(z=>`<a href="${esc(z.url)}" target="_blank" rel="noopener noreferrer">${esc(z.title)} ↗</a>`).join(' ／ ')}</p></section>`).join('')}</section>`:''}${x.id==='kawasaki'?mascotDraftSection():''}${!literary&&x.id!=='akutagawa'&&!personBackground[x.id]?`<details><summary>${literary?'もっと知りたい方へ（補足）':'関連情報をもっと読む'}</summary><div class="deep">${!literary?`<h3>関連情報</h3><ul class="people">${x.people.map(([n,d])=>`<li><strong>${characterName(n)}</strong>${esc(d)}</li>`).join('')}</ul>`:''}<h3>${literary?'作品の意味・読み方の一例':x.id==='kawasaki'?'制作の考え方':'作品を読む視点'}</h3><p class="bodytext">${esc(x.theme)}</p><h3>記憶に残るポイント</h3><p>${esc(x.memory)}</p>${literary?`<h3>考えるヒント</h3><p class="subnote">読み方の一例です。正解を決めるためではなく、本文の言葉と自分の経験を行き来する問いとして使ってください。</p><ul class="people">${x.questions.map(q=>`<li>${esc(q)}</li>`).join('')}</ul>`:''}</div></details>`:''}<details><summary>出典・確認情報</summary>${(literary&&x.textNote)?`<p class="edition-note">${esc(x.textNote)}</p>`:""}${x.id==='gloves'?'<p class="edition-note">絵本の一例：<a href="https://www.kaiseisha.co.jp/books/9784039633101" target="_blank" rel="noopener noreferrer">偕成社（かいせいしゃ）・黒井健（くろい けん）絵／32ページ ↗</a><span>ページ数は版によって異なります。</span></p>':''}${x.sourceNote?`<p class="subnote">${esc(x.sourceNote)}</p>`:""}<p class="subnote">${x.id==='kawasaki'?'地域の調査に用いる公式情報の入口です。個別の地域記事の検証完了を意味しません。':'以下を確認し、本文は本サイト独自の言葉で要約しています。解釈は原典の事実記述と区別しています。'}</p><ul class="sources">${x.sources.map(s=>`<li><a href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">${esc(s.title)} ↗</a></li>`).join('')}</ul><p class="subnote">確認日：2026年11月1日。第三者の画像・写真の転載は行っていません。</p></details></div></article>${x.links.length?`<section class="related"><div class="sectionhead"><h2>知識をつなぐ、次の一冊・一人</h2></div><div class="grid">${x.links.map(id=>items.find(z=>z.id===id)).filter(Boolean).map(card).join('')}</div></section>`:''}`;document.getElementById('back').onclick=()=>{location.hash=lastListHash}}
function syncControls(){search.value=query;document.querySelectorAll('[data-cat]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.cat===category)))}
const philosophyParagraphs=["知ることから、人生が少し変わる。", "一つの物語が、誰かの考え方を変えることがあります。", "何気なく読んだ作品が、自分のこれまでの行動を振り返るきっかけになることもあります。", "誰かの優しさに気づいたり、相手の気持ちを考え直したり。", "ときには、自分の信じてきたことが間違っていなかったと、勇気をもらうこともあるでしょう。", "同じ作品でも、10歳のとき、20歳のとき、40歳のときでは、感じることが違うかもしれません。", "今は何も感じなかった言葉が、数年後の自分には大切な言葉になっているかもしれません。", "だからこそ、この図鑑は、一度読んで終わる場所ではなく、何度でも戻ってこられる場所でありたいと考えています。", "難しい知識を、できるだけ分かりやすく。", "知らなかった世界を、もっと身近に。", "そして、そこで得た小さな気づきが、誰かの明日を少しだけ変えるきっかけになれば。", "そんな願いを込めて、この図鑑を少しずつ育てていきます。", "知識との出会いが、自分自身との出会いになる。", "それが「知識の大図鑑」の目指す姿です。"];
function renderPhilosophy(){main.innerHTML=`<button class="back" id="back">← 一覧に戻る</button><article class="philosophy-page"><h2>この図鑑に込めた想い</h2><div class="philosophy-copy">${philosophyParagraphs.map((p,i)=>`<p${i===0?' class="opening"':''}>${esc(p)}</p>`).join('')}</div></article>`;document.getElementById('back').onclick=()=>{location.hash=lastListHash};document.title='この図鑑に込めた想い｜知識の大図鑑'}
function route({focus=false}={}){isRouting=true;const hash=location.hash||'#/';if(hash==='#/about'){renderPhilosophy();if(focus){main.focus({preventScroll:true});main.scrollIntoView({behavior:'auto',block:'start'})}isRouting=false;return}if(hash.startsWith('#/article/')){const id=hash.slice(10);const x=items.find(i=>i.id===id);if(x){document.title=x.name+'｜知識の大図鑑';renderArticle(x);if(focus){main.focus({preventScroll:true});main.scrollIntoView({behavior:'auto',block:'start'})}}else{main.innerHTML='<div class="empty"><h2>項目が見つかりません</h2><p>URLを確認するか、一覧へ戻ってください。</p><a href="#/">一覧に戻る</a></div>';document.title='項目が見つかりません｜知識の大図鑑'}}else{const p=new URLSearchParams(hash.includes('?')?hash.split('?').slice(1).join('?'):'');category=['literature','person','region'].includes(p.get('cat'))?p.get('cat'):'all';query=p.get('q')||'';lastListHash=listHash();syncControls();renderList();document.title='知識の大図鑑｜知るほど、世界がつながる。';if(focus){main.focus({preventScroll:true});document.getElementById('browse').scrollIntoView({behavior:'auto',block:'start'})}}isRouting=false}
function showList(replace=false){const h=listHash();lastListHash=h;if(replace){history.replaceState(null,'',h);renderList();document.title='知識の大図鑑｜知るほど、世界がつながる。'}else if(location.hash===h)renderList();else location.hash=h;syncControls()}
function reset(){category='all';query='';showList();search.focus()}
search.addEventListener('input',()=>{query=search.value;const inArticle=location.hash.startsWith('#/article/')||location.hash==='#/about';if(inArticle)history.pushState(null,'',listHash());showList(true)});
document.getElementById('clear').addEventListener('click',()=>{query='';showList();search.focus()});
document.querySelectorAll('[data-cat]').forEach(b=>b.addEventListener('click',()=>{category=b.dataset.cat;showList()}));
document.querySelector('.skip').addEventListener('click',e=>{e.preventDefault();main.focus({preventScroll:true});main.scrollIntoView({behavior:'auto',block:'start'})});
window.addEventListener('hashchange',()=>route({focus:true}));route();
</script>
