ドのエディンバラに生まれました。家族は灯台を造る技術者として知られていました。1867年にはエディンバラ大学で工学を学び始めます。しかし、本人の関心は文学へ向かっていました。家業の道をそのまま進まず、書く仕事を選んだ作家です。", "sources": [{"title": "エディンバラ大学：Robert Louis Stevenson（卒業生紹介）", "url": "https://alumni.ed.ac.uk/services/notable-alumni/alumni-in-history/robert-louis-stevenson"}, {"title": "Robert Louis Stevenson Museum（米国セントヘレナ）：作品刊行年譜", "url": "https://stevensonmuseum.org/robert-louis-stevenson/the-works/publications-timeline/"}]}, {"title": "法律を学びながら文章を書く", "text": "父に作家になりたいと伝えた後、文学の仕事だけで生活できない場合にも備え、法律を学ぶことになりました。1875年には弁護士資格を得ましたが、実務には進みませんでした。在学中から、先人の文体をまねて文章を練習し、雑誌にも随筆を発表していました。作家への道は、書き方を学ぶ積み重ねでもあったのです。", "sources": [{"title": "エディンバラ大学：Robert Louis Stevenson（卒業生紹介）", "url": "https://alumni.ed.ac.uk/services/notable-alumni/alumni-in-history/robert-louis-stevenson"}, {"title": "Robert Louis Stevenson Museum（米国セントヘレナ）：作品刊行年譜", "url": "https://stevensonmuseum.org/robert-louis-stevenson/the-works/publications-timeline/"}]}, {"title": "旅を文章にする", "text": "フランスを旅した経験から、船旅の記録や、ロバを連れて歩いた旅の本を出版しました。移動には、新しい土地を見たいという思いだけでなく、体調に合う気候を求める事情もありました。1880年にはアメリカでファニー・オズボーンと結婚します。旅の経験を持つ人ですが、冒険小説をすべて本人の実体験と考えることはできません。", "sources": [{"title": "エディンバラ大学：Robert Louis Stevenson（卒業生紹介）", "url": "https://alumni.ed.ac.uk/services/notable-alumni/alumni-in-history/robert-louis-stevenson"}, {"title": "Robert Louis Stevenson Museum（米国セントヘレナ）：作品刊行年譜", "url": "https://stevensonmuseum.org/robert-louis-stevenson/the-works/publications-timeline/"}, {"title": "英国ナショナル・ポートレート・ギャラリー：Robert Louis Stevenson人物解説", "url": "https://www.npg.org.uk/collections/search/person/mp04296/robert-louis-stevenson"}]}, {"title": "『宝島』が一冊の本になる", "text": "『宝島』は1881年から1882年にかけて、雑誌「ヤング・フォークス」に連載され、1883年に単行本になりました。したがって、1883年は物語が初めて読者に届いた年ではありません。その後も小説や詩集を発表し、1886年には『ジーキル博士とハイド氏』などを刊行しました。少年の冒険だけを書く人ではなかったのです。", "sources": [{"title": "Robert Louis Stevenson Museum（米国セントヘレナ）：作品刊行年譜", "url": "https://stevensonmuseum.org/robert-louis-stevenson/the-works/publications-timeline/"}, {"title": "英国ナショナル・ポートレート・ギャラリー：Robert Louis Stevenson人物解説", "url": "https://www.npg.org.uk/collections/search/person/mp04296/robert-louis-stevenson"}]}, {"title": "サモアでの暮らしと晩年", "text": "1888年から家族と太平洋の島々を巡り、1890年にはサモアのウポル島に土地を買いました。そこで暮らしながら書き続け、地域の政治にも関わります。晩年の文章は、勢力を競う欧米の国々がサモアの文化に及ぼす影響にも目を向けています。単なる「南の楽園での隠居」ではありません。1894年12月3日、44歳で亡くなりました。", "sources": [{"title": "Robert Louis Stevenson Museum（米国セントヘレナ）：作品刊行年譜", "url": "https://stevensonmuseum.org/robert-louis-stevenson/the-works/publications-timeline/"}, {"title": "英国ナショナル・ポートレート・ギャラリー：Robert Louis Stevenson人物解説", "url": "https://www.npg.org.uk/collections/search/person/mp04296/robert-louis-stevenson"}]}, {"title": "『宝島』から読む", "text": "この図鑑の『宝島』では、ジムの機転が仲間を助ける一方、勝手な行動が危険も招きます。シルバーも、親切に見える態度と、自分を守る計算を併せ持っています。誰を信じるかという迷いを追うと、宝探しだけではない面白さが見えてきます。宝を得た後もジムに怖い記憶が残る結末は、冒険の成功をお金だけで測れないことも示しています。", "sources": [{"title": "Project Gutenberg：Treasure Island 英語原著（既存作品記事の参照原典）", "url": "https://www.gutenberg.org/files/120/120-h/120-h.htm"}]}], "victor-hugo": [{"title": "詩から広がった文学の仕事", "text": "ヴィクトル・ユゴーは1802年2月26日、フランスのブザンソンに生まれました。軍人の父と王党派の母を持ち、若いころから詩や小説を書きます。十五歳で詩のコンクールに評価され、その後は詩人、劇作家、小説家として活動しました。『レ・ミゼラブル』一作だけでなく、複数の文学の分野に足跡を残した人です。", "sources": [{"title": "フランス上院公文書館：Victor Hugo, écrivain et sénateur", "url": "https://archives.senat.fr/en-2025-le-senat-fete-ses-150-ans/victor-hugo-ecrivain-et-senateur.html"}]}, {"title": "舞台と小説で新しい表現へ", "text": "1830年に初演された戯曲『エルナニ』は、古典的な演劇を支持する人々とロマン主義の側との対立を招きました。ユゴーは、新しい文学の動きを代表する一人となります。また、小説『ノートルダム・ド・パリ』にも取り組み、主な執筆は1830年秋から翌年初めに進められました。舞台と小説の両方で、自分の表現を広げていたのです。", "sources": [{"title": "フランス上院公文書館：Victor Hugo, écrivain et sénateur", "url": "https://archives.senat.fr/en-2025-le-senat-fete-ses-150-ans/victor-hugo-ecrivain-et-senateur.html"}, {"title": "フランス国立図書館：Hernani作品典拠", "url": "https://catalogue.bnf.fr/ark:/12148/cb11976057q.public"}, {"title": "フランス国立図書館：Victor Hugo et Notre-Dame de Paris", "url": "https://www.bnf.fr/fr/victor-hugo-et-notre-dame-de-paris-ressources-en-ligne"}]}, {"title": "政治への参加と亡命", "text": "政治上の立場は生涯同じではありません。若いころは王政を支持し、1845年には貴族院議員となりましたが、後には共和政を支持する側へ移ります。1851年のルイ＝ナポレオンによるクーデターに反対し、国外へ逃れました。ベルギー、ジャージー島、ガーンジー島へと移った亡命生活は1870年まで続きます。初めから同じ信念を貫いた、と単純にはまとめられません。", "sources": [{"title": "フランス上院公文書館：Victor Hugo, écrivain et sénateur", "url": "https://archives.senat.fr/en-2025-le-senat-fete-ses-150-ans/victor-hugo-ecrivain-et-senateur.html"}, {"title": "フランス上院：Victor Hugo (1802-1885)", "url": "https://www.senat.fr/connaitre-le-senat/lhistoire-du-senat/dossiers-dhistoire/default-0828a4dd4d0098449b6b3e5e104c53fe/victor-hugo.html"}]}, {"title": "長い時間をかけた『レ・ミゼラブル』", "text": "『レ・ミゼラブル』の執筆は1845年に始まり、1848年に中断しました。1860年に再開し、翌年に完成、亡命中の1862年に刊行されます。つまり、1862年は物語の全てを一気に書いた年ではありません。作中のバリケードの戦いは1832年六月の蜂起で、出版年とも1789年のフランス革命とも別です。作品を読むときは、書かれた時代と描かれる時代を分けましょう。", "sources": [{"title": "フランス国立図書館：Les misérables作品典拠", "url": "https://catalogue.bnf.fr/ark:/12148/cb13516296h.public"}, {"title": "Project Gutenberg：Hapgood 1887年英訳（既存作品記事の参照原典）", "url": "https://www.gutenberg.org/files/135/135-h/135-h.htm"}]}, {"title": "帰国後も社会に語りかける", "text": "1870年、第二帝政の崩壊後にフランスへ戻り、1876年には上院議員に選ばれました。貧困や教育、表現の自由、死刑廃止などについて、議会でも意見を述べています。文学の仕事と社会への発言は、その生涯の中で重なっていました。1885年5月22日にパリで亡くなり、国葬が行われました。作品は作者の死後も読み継がれていきます。", "sources": [{"title": "フランス上院公文書館：Victor Hugo, écrivain et sénateur", "url": "https://archives.senat.fr/en-2025-le-senat-fete-ses-150-ans/victor-hugo-ecrivain-et-senateur.html"}, {"title": "フランス上院：Victor Hugo (1802-1885)", "url": "https://www.senat.fr/connaitre-le-senat/lhistoire-du-senat/dossiers-dhistoire/default-0828a4dd4d0098449b6b3e5e104c53fe/victor-hugo.html"}]}, {"title": "人を決めつける目を問い直す", "text": "この図鑑の『レ・ミゼラブル』では、ヴァルジャンがどのように変わるかだけでなく、周囲が彼をどう見ているかにも注目してみましょう。司教の信頼が生き直すきっかけになる一方、前科への偏見は後まで影を落とします。ファンティーヌの困窮も合わせて読むと、個人の善悪だけでは説明できない社会の問題が見えてきます。これは作品への独自の読書案内です。", "sources": [{"title": "Project Gutenberg：Hapgood 1887年英訳（既存作品記事の参照原典）", "url": "https://www.gutenberg.org/files/135/135-h/135-h.htm"}]}], "mary-shelley": [{"title": "本に囲まれて育った少女", "text": "メアリー・シェリーは1797年8月30日、ロンドンに生まれました。父は思想家ウィリアム・ゴドウィン、母は女性の権利を論じた著述家メアリー・ウルストンクラフトです。母は出産後まもなく亡くなりました。娘は文学や歴史、神話に親しみ、フランス語やラテン語も学びます。同じメアリーという名でも、母と『フランケンシュタイン』の作者は別人です。", "sources": [{"title": "米国国立医学図書館：An Extraordinary Life", "url": "https://www.nlm.nih.gov/exhibition/frankenstein/exhibition2.html"}, {"title": "Shelley-Godwin Archive：Frankenstein Chronology", "url": "https://shelleygodwinarchive.org/contents/frankenstein/frankenstein-chronology/"}, {"title": "英国オープン大学：Mary Shelley: the expert view", "url": "https://www.open.edu/openlearn/history-the-arts/literature/mary-shelley-the-expert-view"}]}, {"title": "詩人パーシーとの生活", "text": "結婚前の姓はゴドウィンです。1814年、詩人パーシー・ビッシュ・シェリーと大陸へ旅立ちました。この時パーシーには妻があり、メアリーと結婚したのは1816年12月です。二人の関係には、旅や読書、文学をめぐる交流がありました。ただし、夫も作家だからといって、『フランケンシュタイン』を夫の作品として扱うことはできません。", "sources": [{"title": "Shelley-Godwin Archive：Frankenstein Chronology", "url": "https://shelleygodwinarchive.org/contents/frankenstein/frankenstein-chronology/"}, {"title": "英国オープン大学：Mary Shelley: the expert view", "url": "https://www.open.edu/openlearn/history-the-arts/literature/mary-shelley-the-expert-view"}]}, {"title": "1816年の夏から始まった物語", "text": "1816年夏、ジュネーヴ湖の近くに滞在していたメアリーたちは、詩人バイロンの提案で怖い物語を書くことになりました。十八歳の彼女が小説を構想するきっかけです。しかし、一晩で長編が完成したわけではありません。有名な夢の話は1831年の序文で振り返られたもので、当夜の会話や着想の日付を細部まで確定するのは避けたいところです。", "sources": [{"title": "Shelley-Godwin Archive：Frankenstein Chronology", "url": "https://shelleygodwinarchive.org/contents/frankenstein/frankenstein-chronology/"}, {"title": "米国国立医学図書館：The Birth of Frankenstein", "url": "https://www.nlm.nih.gov/exhibition/frankenstein/exhibition1.html"}]}, {"title": "初版と改訂版を分けて読む", "text": "『フランケンシュタイン』の初版は1818年、著者名を伏せて刊行されました。着想した1816年と出版した1818年は異なります。さらに1831年には、新しい序文と本文の変更を伴う改訂版が出ました。この図鑑の作品記事が参照するのは1831年版です。初版の刊行年を示していても、その記事が初版本文をそのまま紹介しているとは限りません。", "sources": [{"title": "Shelley-Godwin Archive：Frankenstein Chronology", "url": "https://shelleygodwinarchive.org/contents/frankenstein/frankenstein-chronology/"}, {"title": "米国国立医学図書館：The Birth of Frankenstein", "url": "https://www.nlm.nih.gov/exhibition/frankenstein/exhibition1.html"}, {"title": "Project Gutenberg：1831年改訂版（既存作品記事の参照原典）", "url": "https://www.gutenberg.org/files/42324/42324-h/42324-h.htm"}]}, {"title": "一冊だけではない文学の仕事", "text": "パーシーは1822年に亡くなり、メアリーは翌年イギリスへ戻りました。その後も執筆を続け、歴史小説や、未来を舞台とする『最後のひとり』（1826年刊）などを発表します。雑誌の記事、短い物語、文学者の伝記にも取り組みました。若いころの一作だけで終わった作家ではありません。1851年2月1日、ロンドンで亡くなりました。", "sources": [{"title": "Shelley-Godwin Archive：Frankenstein Chronology", "url": "https://shelleygodwinarchive.org/contents/frankenstein/frankenstein-chronology/"}, {"title": "英国オープン大学：Mary Shelley: the expert view", "url": "https://www.open.edu/openlearn/history-the-arts/literature/mary-shelley-the-expert-view"}]}, {"title": "つくられた側の言葉を聞く", "text": "『フランケンシュタイン』は、生命をつくるヴィクターの姓です。つくられた存在には固有の名前がありません。読むときは、創造主だけでなく、創造物自身の語りにも耳を傾けてみましょう。言葉を学び、人とのつながりを求める姿から、恐ろしい外見だけでは見えない孤独が分かります。ただし、その苦しみは暴力の正当化とは別です。これは独自の読書案内です。", "sources": [{"title": "Project Gutenberg：1831年改訂版（既存作品記事の参照原典）", "url": "https://www.gutenberg.org/files/42324/42324-h/42324-h.htm"}]}], "charles-dickens": [{"title": "少年時代の暮らしと仕事", "text": "チャールズ・ディケンズは1812年2月7日、イングランドのポーツマスに生まれました。家族がロンドンへ移った後、家計が苦しくなります。少年だったディケンズは学校を離れ、靴墨の容器にラベルを貼る工場で働きました。父も借金のために拘禁されましたが、本人が父と一緒に拘禁されたわけではありません。やがて再び学校へ通う機会を得ました。", "sources": [{"title": "マサチューセッツ大学ローウェル校：Dickens Chronology", "url": "https://www.uml.edu/conferences/dickens-in-lowell/fast-facts/about-charles-dickens.aspx"}, {"title": "Science Museum Group：Charles John Huffam Dickens人物記録", "url": "https://collection.sciencemuseumgroup.org.uk/people/ap15279/dickens-charles-john-huffam"}]}, {"title": "記者として言葉を磨く", "text": "法律事務所で働いた後、ディケンズは速記を学び、裁判や議会の議論を伝える仕事へ進みました。新聞記者として、限られた時間で文章をまとめる経験を重ねます。また、「ボズ」という筆名で短い文章を発表しました。小説家としての出発の前には、人々の話や街の様子を捉え、読者へ届ける仕事があったのです。", "sources": [{"title": "マサチューセッツ大学ローウェル校：Dickens Chronology", "url": "https://www.uml.edu/conferences/dickens-in-lowell/fast-facts/about-charles-dickens.aspx"}, {"title": "London Museum：Who was Charles Dickens?", "url": "https://www.londonmuseum.org.uk/collections/london-stories/who-was-charles-dickens/"}]}, {"title": "連載小説で多くの読者に届く", "text": "1836年に発表を始めた『ピクウィック・ペーパーズ』が人気を集め、作家として広く知られるようになります。『オリヴァー・トウィスト』なども続きました。作品は、続きを少しずつ読む連載の形でも読者に届きました。ディケンズは、苦しい暮らしを描くだけでなく、笑いを誘う人物や、家庭の温かさも描く作家でした。", "sources": [{"title": "マサチューセッツ大学ローウェル校：Dickens Chronology", "url": "https://www.uml.edu/conferences/dickens-in-lowell/fast-facts/about-charles-dickens.aspx"}, {"title": "London Museum：Who was Charles Dickens?", "url": "https://www.londonmuseum.org.uk/collections/london-stories/who-was-charles-dickens/"}, {"title": "Charles Dickens Museum：作者と博物館の紹介", "url": "https://dickensmuseum.com/pages/about-us"}]}, {"title": "1843年のクリスマスの物語", "text": "『クリスマス・キャロル』は1843年に初めて出版されました。精霊が現れる不思議な話ですが、その背景には、お金を持つ人と貧しい人との隔たりがあります。ディケンズは小説や記事を通じ、貧困を本人の心がけの悪さだけで説明する見方に異議を示しました。楽しい祝日の話と、社会の暮らしへの関心は、切り離されていなかったのです。", "sources": [{"title": "Charles Dickens Museum：作者と博物館の紹介", "url": "https://dickensmuseum.com/pages/about-us"}, {"title": "Charles Dickens Museum：A Christmas Carol初版本", "url": "https://dickensmuseum.com/blogs/explore/first-edition-of-a-christmas-carol"}, {"title": "Project Gutenberg：A Christmas Carol英語原著（既存記事の参照原典）", "url": "https://www.gutenberg.org/files/46/46-h/46-h.htm"}]}, {"title": "書くことと声で伝えること", "text": "その後もディケンズは、『デイヴィッド・コパフィールド』や『大いなる遺産』などを発表し、雑誌の編集にも携わりました。自分の作品を人前で朗読する活動も行い、イギリスだけでなくアメリカでも読者と接しました。1870年6月9日、58歳で亡くなりました。机で小説を書く以外にも、さまざまな形で言葉を届け続けた人です。", "sources": [{"title": "マサチューセッツ大学ローウェル校：Dickens Chronology", "url": "https://www.uml.edu/conferences/dickens-in-lowell/fast-facts/about-charles-dickens.aspx"}, {"title": "Science Museum Group：Charles John Huffam Dickens人物記録", "url": "https://collection.sciencemuseumgroup.org.uk/people/ap15279/dickens-charles-john-huffam"}]}, {"title": "『クリスマス・キャロル』から読む", "text": "この図鑑の物語では、スクルージは過去を悔やむだけで終わりません。人々と食事を共にし、寄付をし、働くボブの給料を上げます。精霊が見せた未来も、変えられない運命ではありません。心の変化が具体的な行動につながり、周囲の暮らしも変わるところに注目できます。怖い幽霊の話として読むだけでなく、その後の日常まで追うと、結末の意味が深まります。", "sources": [{"title": "Project Gutenberg：A Christmas Carol英語原著（既存記事の参照原典）", "url": "https://www.gutenberg.org/files/46/46-h/46-h.htm"}]}], "arthur-conan-doyle": [{"title": "医学を学んだ物語の作者", "text": "アーサー・コナン・ドイルは1859年5月22日、スコットランドのエディンバラに生まれました。1876年から1881年にかけて、エディンバラ大学で医学を学びます。父や親族には絵を描く人がおり、母からは文学や歴史への関心も受け継ぎました。名探偵ホームズを作った人ですが、本人の出発点は探偵ではなく医学生でした。", "sources": [{"title": "コナン・ドイル家公式：本人と家族の紹介・生没年月日", "url": "https://arthurconandoyle.co.uk/about"}, {"title": "エディンバラ大学医学部：Arthur Conan Doyle", "url": "https://medicine-vet-medicine.ed.ac.uk/300-years-of-medicine/300-faces-of-edinburgh-medical-school/300-faces-c-e/arthur-conan-doyle"}, {"title": "コナン・ドイル家公式：医師としての活動", "url": "https://arthurconandoyle.co.uk/physician"}, {"title": "コナン・ドイル家公式：作家としての活動", "url": "https://arthurconandoyle.co.uk/author"}]}, {"title": "観察から考える力を知る", "text": "大学では、医師ジョゼフ・ベルに学びました。ベルは患者の様子を細かく観察し、病気だけでなく、仕事や出身地についても推し量る力を持っていました。この観察と推理の方法が、ホームズを考える手がかりになったとされています。ただし、ベルとホームズは同じ人ではなく、作家が作り上げた登場人物として区別します。", "sources": [{"title": "エディンバラ大学医学部：Arthur Conan Doyle", "url": "https://medicine-vet-medicine.ed.ac.uk/300-years-of-medicine/300-faces-of-edinburgh-medical-school/300-faces-c-e/arthur-conan-doyle"}]}, {"title": "診療をしながら書く", "text": "船の医師として働いた後、1882年にはポーツマスのサウスシーで診療を始めました。そのかたわら物語を書き続け、1887年の『緋色の研究』でホームズを登場させます。1891年に短編が人気を得ると、執筆を主な仕事にしていきました。作中の医師ワトソンにも医学の知識が生かされていますが、ワトソンをそのまま作者の自伝上の姿とは考えません。", "sources": [{"title": "コナン・ドイル家公式：医師としての活動", "url": "https://arthurconandoyle.co.uk/physician"}, {"title": "コナン・ドイル家公式：作家としての活動", "url": "https://arthurconandoyle.co.uk/author"}]}, {"title": "雑誌で読まれたホームズ", "text": "ホームズの短編は「ストランド・マガジン」に発表されました。この図鑑の『赤毛組合』もその一つで、初出は1891年8月です。1892年には短編集『シャーロック・ホームズの冒険』に収められました。雑誌に載った年と、一冊の本になった年は別です。シリーズの中の一事件なので、『赤毛組合』がホームズの最初の登場作ではありません。", "sources": [{"title": "コナン・ドイル家公式：作家としての活動", "url": "https://arthurconandoyle.co.uk/author"}, {"title": "ダートマス大学図書館：ホームズ初期版本の展示目録", "url": "https://www.dartmouth.edu/library/rauner/exhibits/handlists/Adventures%20Archives.pdf"}, {"title": "DFW Sherlock Holmes：1891年8月の赤毛組合資料（既存記事の初出確認資料）", "url": "https://www.dfw-sherlock.org/uploads/3/7/3/8/37380505/1891_august_the_red-headed_league.pdf"}]}, {"title": "探偵小説だけではない生涯", "text": "歴史小説や、恐竜のいる世界への探検を描く『失われた世界』なども書きました。また、不当に罪を問われた人を助ける活動や、心霊主義を広める活動にも関わります。心霊主義は死者と交流できるとする信念で、ここでは本人の考えとして扱います。1930年7月7日に亡くなりました。作者の関心は、ホームズの推理だけには収まらないものでした。", "sources": [{"title": "コナン・ドイル家公式：本人と家族の紹介・生没年月日", "url": "https://arthurconandoyle.co.uk/about"}, {"title": "エディンバラ大学医学部：Arthur Conan Doyle", "url": "https://medicine-vet-medicine.ed.ac.uk/300-years-of-medicine/300-faces-of-edinburgh-medical-school/300-faces-c-e/arthur-conan-doyle"}, {"title": "コナン・ドイル家公式：作家としての活動", "url": "https://arthurconandoyle.co.uk/author"}, {"title": "コナン・ドイル家公式：心霊主義への関心", "url": "https://arthurconandoyle.co.uk/spiritualist"}]}, {"title": "『赤毛組合』から読む", "text": "奇妙な求人に目を奪われるだけでなく、その仕事によって、誰が何時間どこにいなくなるのかを考えると、事件の仕組みが見えてきます。ホームズは目立つ話から、店と銀行の位置、助手の行動へと注意を移します。ワトソンと一緒に事情を聞き、後から手がかりの意味を確かめる読み方ができます。これは原著に基づく、この図鑑の独自の読書案内です。", "sources": [{"title": "Project Gutenberg：The Adventures of Sherlock Holmes 第II話（既存記事の参照原著）", "url": "https://www.gutenberg.org/files/1661/1661-h/1661-h.htm"}]}], "l-m-montgomery": [{"title": "島の自然と本に親しむ", "text": "L・M・モンゴメリの名は、ルーシー・モード・モンゴメリです。1874年11月30日、カナダのプリンス・エドワード島に生まれました。二歳になる前に母を亡くし、キャヴェンディッシュの母方の祖父母に育てられます。父は西部へ移りました。身近な自然や本、親族の語る話に親しみながら、幼いころから詩や日記を書いていました。", "sources": [{"title": "プリンス・エドワード島大学 L. M. Montgomery Institute：Her Life", "url": "https://lmmontgomery.ca/about/l-m-montgomery/"}, {"title": "カナダ公園局：Person of significance: L.M. Montgomery", "url": "https://parks.canada.ca/lhn-nhs/pe/greengables/culture/montgomery"}]}, {"title": "教師として働きながら学ぶ", "text": "1894年、プリンス・オブ・ウェールズ・カレッジで教員資格を得て、島の学校で教え始めました。途中、ダルハウジー大学で英文学などを一年間学び、再び教職に戻ります。1898年に祖父が亡くなると、祖母を支えるため帰郷しました。詩や短編の投稿も続け、新聞社で働いた時期もあります。生活の仕事と執筆を並行していた人です。", "sources": [{"title": "UPEI等の共同原稿展示：The Life and Work of L.M. Montgomery", "url": "https://annemanuscript.ca/stories/life-and-work/"}]}, {"title": "原稿から1908年の出版へ", "text": "『赤毛のアン』は、1905年に書かれた原稿が複数の出版社に断られ、いったんしまわれた後、再び出版を目指した作品です。1907年にボストンの出版社と契約し、1908年に刊行されました。書いた年、契約した年、出版した年は同じではありません。それ以前から詩や短編は発表していましたが、この初めての長編小説が広く読まれるようになります。", "sources": [{"title": "プリンス・エドワード島大学 L. M. Montgomery Institute：Her Life", "url": "https://lmmontgomery.ca/about/l-m-montgomery/"}, {"title": "UPEI等の共同原稿展示：The Life and Work of L.M. Montgomery", "url": "https://annemanuscript.ca/stories/life-and-work/"}, {"title": "カナダ公園局：Person of significance: L.M. Montgomery", "url": "https://parks.canada.ca/lhn-nhs/pe/greengables/culture/montgomery"}]}, {"title": "アンと作者は同じ人ではない", "text": "島の森や海辺、農家の暮らしは、作品を考える大切な背景になりました。実生活の出来事をもとにした挿話もあります。しかし、『赤毛のアン』は作者の人生をそのまま記録した自伝ではありません。母方の祖父母に育てられたモンゴメリと、孤児院からカスバート兄妹の家に来るアンは別人です。似た経験があっても、人物や出来事を一対一で重ねないことが大切です。", "sources": [{"title": "カナダ公園局：Person of significance: L.M. Montgomery", "url": "https://parks.canada.ca/lhn-nhs/pe/greengables/culture/montgomery"}, {"title": "Wikisource：Anne of Green Gables（1908年刊作品の旧版転記）", "url": "https://en.wikisource.org/wiki/Anne_of_Green_Gables_(1908)"}]}, {"title": "島を離れても書き続ける", "text": "1911年に牧師ユーアン・マクドナルドと結婚し、オンタリオ州へ移りました。その後も家庭を営みながら、小説や短編、詩を書き続けます。アンの物語以外にも作品があり、日記や多くの手紙も残しました。島は長く作品の大切な舞台であり続けます。1942年4月24日、トロントで亡くなり、故郷キャヴェンディッシュに葬られました。", "sources": [{"title": "プリンス・エドワード島大学 L. M. Montgomery Institute：Her Life", "url": "https://lmmontgomery.ca/about/l-m-montgomery/"}, {"title": "UPEI等の共同原稿展示：The Life and Work of L.M. Montgomery", "url": "https://annemanuscript.ca/stories/life-and-work/"}, {"title": "カナダ公園局：Person of significance: L.M. Montgomery", "url": "https://parks.canada.ca/lhn-nhs/pe/greengables/culture/montgomery"}]}, {"title": "少女だけでなく大人の変化も読む", "text": "『赤毛のアン』では、アンの失敗や成長だけでなく、迎えた大人たちの変化にも注目してみましょう。マリラは厳しく教える一方で、自分の誤りを認めて謝ります。口数の少ないマシュウも、アンの願いを理解して支えます。家族になるとは、子どもを一方的に正すことではなく、互いを知っていくことだ、と読めます。これは本図鑑の独自の読書案内です。", "sources": [{"title": "Wikisource：Anne of Green Gables（1908年刊作品の旧版転記）", "url": "https://en.wikisource.org/wiki/Anne_of_Green_Gables_(1908)"}]}], "mark-twain": [{"title": "川沿いの町で育つ", "text": "マーク・トウェインは筆名で、本名はサミュエル・ラングホーン・クレメンズです。1835年11月30日、アメリカのミズーリ州フロリダに生まれ、幼い頃にハンニバルへ移りました。ここはミシシッピ川沿いの町でした。川や船が身近にある少年時代の記憶は、のちの小説に生かされます。ただし、物語の主人公を作者本人そのものと考えることはできません。", "sources": [{"title": "トロント大学図書館RPO：Twain, Mark", "url": "https://rpo.library.utoronto.ca/poets/twain-mark"}, {"title": "ミズーリ州歴史協会：Mark Twain人物伝", "url": "https://historicmissourians.shsmo.org/mark-twain/"}, {"title": "National Mississippi River Museum & Aquarium：Mark Twain", "url": "https://www.rivermuseum.org/inductees/artists-writers-and-musicians/mark-twain"}]}, {"title": "印刷と船の仕事を経験する", "text": "若い頃は新聞の印刷に携わり、各地で働きました。その後、ミシシッピ川で船を安全に進める水先人を目指します。経験を積んで1859年に免許を得ましたが、南北戦争によって船の仕事を続けにくくなり、西部へ向かいます。一つの職業だけで暮らしてきた人ではなく、印刷、船、新聞など異なる仕事を経験した作家です。", "sources": [{"title": "National Mississippi River Museum & Aquarium：Mark Twain", "url": "https://www.rivermuseum.org/inductees/artists-writers-and-musicians/mark-twain"}, {"title": "米国特許商標庁：Unswerving irregularity・トウェイン紹介", "url": "https://www.uspto.gov/learning-and-resources/journeys-innovation/mark-twain"}]}, {"title": "「マーク・トウェイン」という名前", "text": "西部で新聞記事を書くようになったクレメンズは、1863年から「マーク・トウェイン」の名を使いました。船上で水深を測るとき、二ファゾム、つまり約3.7メートルの深さを伝える言葉に由来します。かつての川の仕事と、作家として知られる名前がつながっているのです。新聞への執筆に加え、人前で話す講演でも人気を得ました。", "sources": [{"title": "ミズーリ州歴史協会：Mark Twain人物伝", "url": "https://historicmissourians.shsmo.org/mark-twain/"}, {"title": "National Mississippi River Museum & Aquarium：Mark Twain", "url": "https://www.rivermuseum.org/inductees/artists-writers-and-musicians/mark-twain"}, {"title": "米国特許商標庁：Unswerving irregularity・トウェイン紹介", "url": "https://www.uspto.gov/learning-and-resources/journeys-innovation/mark-twain"}]}, {"title": "1876年の『トム・ソーヤーの冒険』", "text": "1876年、『トム・ソーヤーの冒険』が出版されました。いたずらや遊び、友情だけでなく、事件を目撃した少年が秘密を抱える不安も描かれます。故郷の記憶を背景にした小説ですが、作者の人生をそのまま記録した自伝ではありません。トウェインはほかにも、小説や旅行記などを書き、身近な人間の振る舞いをユーモアで捉えました。", "sources": [{"title": "トロント大学図書館RPO：Twain, Mark", "url": "https://rpo.library.utoronto.ca/poets/twain-mark"}, {"title": "ミズーリ州歴史協会：Mark Twain人物伝", "url": "https://historicmissourians.shsmo.org/mark-twain/"}, {"title": "Wikisource：The Adventures of Tom Sawyer 1876年版（既存記事参照原典）", "url": "https://en.wikisource.org/wiki/The_Adventures_of_Tom_Sawyer"}]}, {"title": "笑いだけでなく社会を見る", "text": "トウェインの作品には、奴隷制度、貧困、社会的な立場の違いへの関心も見られます。昔の川沿いの暮らしを、誰にとっても自由で楽しい世界だったと理想化することはできません。また、本人も事業への投資で損失を抱え、返済のために執筆や講演を続けました。成功だけの人生ではなく、変化の多い時代を生き、1910年4月21日に亡くなりました。", "sources": [{"title": "トロント大学図書館RPO：Twain, Mark", "url": "https://rpo.library.utoronto.ca/poets/twain-mark"}, {"title": "ミズーリ州歴史協会：Mark Twain人物伝", "url": "https://historicmissourians.shsmo.org/mark-twain/"}]}, {"title": "この図鑑のトムを読む", "text": "塀塗りを魅力的な遊びに見せる場面では、トムの言葉が友達の気持ちを変えていきます。一方、裁判で真実を話す場面では、面白がっているだけでは済まない決断をします。いたずらの巧みさと、怖くても人を助けようとする姿を合わせて読むと、同じ少年の異なる面が見えます。原作の差別的な呼び方や描き方を、現在の正しい価値観として受け取らないことも大切です。", "sources": [{"title": "Wikisource：The Adventures of Tom Sawyer 1876年版（既存記事参照原典）", "url": "https://en.wikisource.org/wiki/The_Adventures_of_Tom_Sawyer"}]}], "frances-hodgson-burnett": [{"title": "イギリスからアメリカへ", "text": "フランシス・ホジソン・バーネットは1849年、イングランドのマンチェスターに生まれました。父を亡くした後、1865年に家族とアメリカへ渡ります。家計を支えるために文章を書き、十九歳のころから物語を発表しました。後に両国を行き来しながら活動した人で、『小公女』の舞台であるロンドンだけで暮らした作家ではありません。", "sources": [{"title": "English Heritage：Frances Hodgson Burnettの生涯", "url": "https://www.english-heritage.org.uk/visit/blue-plaques/frances-hodgson-burnett/"}, {"title": "南ミシシッピ大学図書館：Frances Hodgson Burnett Papers・伝記略歴", "url": "https://www.lib.usm.edu/legacy/degrum/public_html/html/research/findaids/burnett.htm"}]}, {"title": "大人向けの小説も書く", "text": "医師スワン・バーネットと結婚し、二人の息子を育てながら執筆を続けました。1877年には最初の長編小説『That Lass o’ Lowrie’s』が刊行されます。子供を主人公にした作品で知られていますが、大人向けの小説や、舞台で演じるための劇も書きました。小説家と劇作家の両方の仕事をしていたのです。", "sources": [{"title": "English Heritage：Frances Hodgson Burnettの生涯", "url": "https://www.english-heritage.org.uk/visit/blue-plaques/frances-hodgson-burnett/"}, {"title": "南ミシシッピ大学図書館：Frances Hodgson Burnett Papers・伝記略歴", "url": "https://www.lib.usm.edu/legacy/degrum/public_html/html/research/findaids/burnett.htm"}]}, {"title": "『小公子』で広く知られる", "text": "『小公子』は1885年に雑誌で発表が始まり、1886年に一冊の本になって、大きな人気を得ました。舞台にもなり、物語は本の読者以外にも届きます。『小公子』と『小公女』は題名が似ていますが、主人公も筋も異なる別の作品です。『小公女』のセーラを、伯爵家の少年を描く『小公子』の主人公と取り違えないようにしましょう。", "sources": [{"title": "English Heritage：Frances Hodgson Burnettの生涯", "url": "https://www.english-heritage.org.uk/visit/blue-plaques/frances-hodgson-burnett/"}, {"title": "南ミシシッピ大学図書館：Frances Hodgson Burnett Papers・伝記略歴", "url": "https://www.lib.usm.edu/legacy/degrum/public_html/html/research/findaids/burnett.htm"}]}, {"title": "『小公女』は語り直しから生まれた", "text": "『小公女』のもとには、先に書かれた『Sara Crewe』という物語があります。バーネットは舞台劇にする中で、登場人物や出来事を広げました。さらに、その内容を本に書き加え、1905年に『A Little Princess』を出版します。この図鑑が参照する1917年版にも、作者自身が語る改作の経緯と、1905年刊行の記載があります。", "sources": [{"title": "Wikisource：A Little Princess・1917年版の刊記と作者序文（既存作品記事の原典）", "url": "https://en.wikisource.org/wiki/A_Little_Princess"}]}, {"title": "庭と結びついた晩年の作品", "text": "イギリスで借りたメイサム・ホールの庭は、『秘密の花園』を考える手がかりになりました。この作品は1911年に出版されています。バーネットはアメリカの市民権も取得し、1924年、ニューヨークのロングアイランドで亡くなりました。暮らした場所から着想を得ても、物語の出来事をそのまま本人の実体験と考えることはできません。", "sources": [{"title": "English Heritage：Frances Hodgson Burnettの生涯", "url": "https://www.english-heritage.org.uk/visit/blue-plaques/frances-hodgson-burnett/"}, {"title": "南ミシシッピ大学図書館：Frances Hodgson Burnett Papers・伝記略歴", "url": "https://www.lib.usm.edu/legacy/degrum/public_html/html/research/findaids/burnett.htm"}]}, {"title": "セーラの「お姫様」を読む", "text": "『小公女』のセーラは、王家の娘ではありません。苦しい暮らしになっても、誇りや他人への思いやりを失わないために、お姫様のように振る舞おうとします。空腹の少女にパンを分ける行動と、周囲の人々から助けを受ける結末をつなげて読むと、想像する力だけでなく、現実の支えの大切さも見えてきます。これは原著に基づく独自の読書案内です。", "sources": [{"title": "Wikisource：A Little Princess・1917年版の刊記と作者序文（既存作品記事の原典）", "url": "https://en.wikisource.org/wiki/A_Little_Princess"}]}], "jean-webster": [{"title": "アリスからジーンへ", "text": "ジーン・ウェブスターは1876年7月24日、アメリカのニューヨーク州フリードニアに生まれました。もとの名はアリス・ジェーン・チャンドラー・ウェブスターです。寄宿学校で同室の生徒もアリスという名だったため、ジーンと名乗るようになったと大学の資料は伝えています。後に本に記されるジーンは、作家としてだけ突然選んだ名前ではありません。", "sources": [{"title": "ヴァッサー大学図書館：Guide to the Jean Webster Papers（伝記解説）", "url": "https://digitallibrary.vassar.edu/sites/default/files/2022-10/Guide%20to%20the%20Jean%20Webster%20Papers%2C%201876%E2%80%931982%20%28bulk%201900-1916%29%20Vassar%20College%20Digital%20Library.pdf"}]}, {"title": "大学で学び、書く", "text": "1897年にヴァッサー大学へ入り、1901年に卒業しました。在学中から地元の新聞に記事を書き、学内の雑誌にも物語を発表します。ヨーロッパで学び、旅した経験も文章にしました。詩人アデレイド・クラプシーとは大学で出会い、親しい友人になります。『あしながおじさん』の大学生活を描く前から、学ぶことと書くことが日々の暮らしにありました。", "sources": [{"title": "ヴァッサー大学図書館：Guide to the Jean Webster Papers（伝記解説）", "url": "https://digitallibrary.vassar.edu/sites/default/files/2022-10/Guide%20to%20the%20Jean%20Webster%20Papers%2C%201876%E2%80%931982%20%28bulk%201900-1916%29%20Vassar%20College%20Digital%20Library.pdf"}, {"title": "Ramapo College・Jane Addams Digital Edition：Webster, Jean", "url": "https://digital.janeaddams.ramapo.edu/items/show/4248"}]}, {"title": "卒業後の作家生活と社会への関心", "text": "卒業後は作家として働き、1903年に最初の小説『When Patty Went to College』を刊行しました。女子大学での生活を扱う作品です。また、子どもを育てる施設や刑務所の改善、女性の参政権にも関心を寄せました。作品を恋愛や楽しい学生生活だけでなく、教育を受ける機会や社会の仕組みという面から読む入口にもなります。", "sources": [{"title": "ヴァッサー大学図書館：Guide to the Jean Webster Papers（伝記解説）", "url": "https://digitallibrary.vassar.edu/sites/default/files/2022-10/Guide%20to%20the%20Jean%20Webster%20Papers%2C%201876%E2%80%931982%20%28bulk%201900-1916%29%20Vassar%20College%20Digital%20Library.pdf"}, {"title": "Ramapo College・Jane Addams Digital Edition：Webster, Jean", "url": "https://digital.janeaddams.ramapo.edu/items/show/4248"}]}, {"title": "1912年の『あしながおじさん』", "text": "『あしながおじさん』は1912年に刊行されました。施設で育ったジュディが匿名の支援を受けて大学へ進み、相手へ書く手紙を通して成長していく小説です。ウェブスター自身の大学経験は背景の一つですが、ジュディは作者そのものではありません。手紙に表れる冗談、知らないことへの驚き、将来の夢を読むことで、主人公の考え方の変化をたどれます。", "sources": [{"title": "Wikisource：Daddy-Long-Legs（1912年Century版）", "url": "https://en.wikisource.org/wiki/Daddy-Long-Legs_(Webster)"}, {"title": "Ramapo College・Jane Addams Digital Edition：Webster, Jean", "url": "https://digital.janeaddams.ramapo.edu/items/show/4248"}]}, {"title": "続編と短い生涯", "text": "1915年には続編『Dear Enemy』が出版されました。これは1912年の作品とは別の本で、この図鑑の『あしながおじさん』の記事に続編の出来事は加えていません。同年、ウェブスターはグレン・フォード・マッキニーと結婚します。翌1916年6月11日、娘を出産した後に亡くなりました。大学には手紙や原稿などが残され、文学の仕事を知る手がかりになっています。", "sources": [{"title": "ヴァッサー大学図書館：Guide to the Jean Webster Papers（伝記解説）", "url": "https://digitallibrary.vassar.edu/sites/default/files/2022-10/Guide%20to%20the%20Jean%20Webster%20Papers%2C%201876%E2%80%931982%20%28bulk%201900-1916%29%20Vassar%20College%20Digital%20Library.pdf"}, {"title": "Ramapo College・Jane Addams Digital Edition：Webster, Jean", "url": "https://digital.janeaddams.ramapo.edu/items/show/4248"}]}, {"title": "感謝と、自分で決めること", "text": "『あしながおじさん』では、ジュディが支援者に感謝しながらも、その希望に従うだけではないことに注目してみましょう。奨学金や仕事を自分で選び、小説の失敗にも向き合います。ほぼ彼女の手紙だけで進むため、読者も彼女の推測を通して相手を知ります。恋の結末とともに、二人が知っている情報の違いにも目を向けたい作品です。これは独自の読書案内です。", "sources": [{"title": "Wikisource：Daddy-Long-Legs（1912年Century版）", "url": "https://en.wikisource.org/wiki/Daddy-Long-Legs_(Webster)"}]}], "wada-mankichi": [{"title": "古い文学と図書館に取り組む", "text": "和田万吉は、1865年10月7日に生まれ、1934年11月21日に亡くなった国文学者・図書館学者です。「和田萬吉」とも書かれます。古い本や文学を研究するとともに、図書館を整え、そこで働く人を育てる仕事にも力を注ぎました。この図鑑の『かぐや姫』は、和田が語り直した『竹取物語』をもとにしています。", "sources": [{"title": "東京都立図書館：和田万吉旧蔵資料", "url": "https://www.library.metro.tokyo.lg.jp/collection/features/catalog/special_acquisition/index/wada/index.html"}, {"title": "青空文庫：和田万吉『竹取物語』図書カード・生没年月日と底本", "url": "https://www.aozora.gr.jp/cards/001072/card48310.html"}]}, {"title": "本を読める仕組みを支える", "text": "1897年から東京帝国大学の図書館長を務めました。現在の日本図書館協会につながる日本文庫協会や、図書館の仕事を教える講習所の設立にも尽力しています。本を書く人であるだけでなく、読者が本を探し、学べる環境を支える人でもありました。図書館学は、そのような図書館の働きや運営を考える学問です。", "sources": [{"title": "東京都立図書館：和田万吉旧蔵資料", "url": "https://www.library.metro.tokyo.lg.jp/collection/features/catalog/special_acquisition/index/wada/index.html"}]}, {"title": "古い本の言葉を調べる", "text": "和田は昔の印刷本を研究し、近松、西鶴、馬琴などの作品の本文を整える仕事もしました。こうした仕事を「校訂」といいます。伝わる本を調べ、本文の違いや誤りを検討する作業です。東京都立図書館には、和田が持っていた本が残されています。物語を新しく作るだけでなく、伝わってきた文章を確かめる仕事も、文学を読む土台になります。", "sources": [{"title": "東京都立図書館：和田万吉旧蔵資料", "url": "https://www.library.metro.tokyo.lg.jp/collection/features/catalog/special_acquisition/index/wada/index.html"}, {"title": "東京都立図書館：本朝書籍目録と和田萬吉の研究", "url": "https://www.library.metro.tokyo.lg.jp/collection/features/digital_showcase/027/05/"}]}, {"title": "子どもが古典に近づく入口", "text": "子ども向けの本では、『竹取物語』のほか、『今昔物語』の説話や能の物語も紹介しました。巻末の『父兄の方々に』では、子どもが後に原本を読むための入口として、説話を選んだことを説明しています。古典の全部を一冊に詰め込むのではなく、まず興味を持って読める話を選ぶという考え方が見られます。", "sources": [{"title": "和田萬吉『父兄の方々に』（青空文庫）", "url": "https://www.aozora.gr.jp/cards/001072/files/48311_42693.html"}]}, {"title": "かぐや姫の原作者ではない", "text": "古典『竹取物語』は平安時代初期の成立と考えられ、作者は分かっていません。和田は、その物語を後の時代の読者に向けて語り直した人です。この図鑑が参照する青空文庫の底本は1981年の復刻版で、そのもとの本は1928年刊。どちらの年も、かぐや姫の物語が初めて生まれた年ではありません。", "sources": [{"title": "青空文庫：和田万吉『竹取物語』図書カード・生没年月日と底本", "url": "https://www.aozora.gr.jp/cards/001072/card48310.html"}, {"title": "京都大学図書館：竹取物語の成立と作者未詳", "url": "https://rmda.kulib.kyoto-u.ac.jp/item/rb00010893/explanation/taketori"}]}, {"title": "求婚と別れをつなげて読む", "text": "和田版の『竹取物語』では、求婚者たちが珍しい品を手に入れようとして失敗する話から、姫と育ての親との別れへと進みます。財産や身分があっても、相手の気持ちや別れを思いどおりにはできません。姫を手に入れようとする人々と、離れるのを悲しむ家族を比べて読むと、人と人との関係の違いが見えてきます。これは本図鑑の独自の読書案内です。", "sources": [{"title": "和田萬吉『竹取物語』（青空文庫）", "url": "https://www.aozora.gr.jp/cards/001072/files/48310_42692.html"}]}], "joseph-jacobs": [{"title": "海を越えて学んだ人", "text": "ジョセフ・ジェイコブズは1854年8月29日、オーストラリアのシドニーに生まれました。シドニーで学んだ後、イギリスのケンブリッジ大学セント・ジョンズ・カレッジへ進み、ベルリンでも学びました。『ジャックと豆の木』で知られますが、この昔話を最初に作った人という意味の作者ではなく、伝えられてきた話を集め、語り直した人です。", "sources": [{"title": "American Jewish Archives：The Concise Dictionary of American Jewish Biography、Jacobs項", "url": "https://www.americanjewisharchives.org/wp-content/uploads/i-aja-concise-dictionary.pdf"}, {"title": "Oxford・Pitt Rivers Museum：Alison Petch, Joseph Jacobs and the English", "url": "https://england.prm.ox.ac.uk/englishness-Joseph-Jacobs.html"}, {"title": "国立国会図書館典拠：Jacobs, Joseph, 1854–1916", "url": "https://id.ndl.go.jp/auth/ndlna/00444425"}, {"title": "English Fairy Tales：Notes and References XIII", "url": "https://en.wikisource.org/wiki/English_Fairy_Tales/Notes_and_References"}]}, {"title": "昔話だけではない研究", "text": "ジェイコブズは民俗学の研究者として、昔話が人から人へ、土地から土地へ伝わることに関心を持ちました。学術誌『フォークロア』の編集にも携わります。ユダヤの歴史や文化も研究し、1900年にはアメリカへ移りました。教育や編集の仕事を続け、1916年1月30日、ニューヨーク州ヨンカーズで亡くなりました。", "sources": [{"title": "Oxford・Pitt Rivers Museum：Alison Petch, Joseph Jacobs and the English", "url": "https://england.prm.ox.ac.uk/englishness-Joseph-Jacobs.html"}, {"title": "American Jewish Archives：The Concise Dictionary of American Jewish Biography、Jacobs項", "url": "https://www.americanjewisharchives.org/wp-content/uploads/i-aja-concise-dictionary.pdf"}]}, {"title": "子どもに届く言葉で", "text": "昔話を集める仕事は、聞いた言葉をそのまま写すことだけではありませんでした。ジェイコブズは序文で、方言や古い本の言い回しを、子どもが聞きやすい文章へ書き直したと説明しています。音読されることも大切にしました。研究のために出典を示すことと、物語として楽しく語ることの両方に取り組んだのです。", "sources": [{"title": "English Fairy Tales：標題・序文・第三版序文", "url": "https://en.wikisource.org/wiki/English_Fairy_Tales"}]}, {"title": "1890年に出た昔話集", "text": "1890年に『English Fairy Tales』が刊行され、『ジャックと豆の木』も収められました。昔話を一冊にまとめたこの本には、ジョン・D・バッテンの挿絵が付いています。図鑑が本文を確認した公開版は、第三改訂版の第13刷で、表示から刊年は確定できません。最初の刊行年と、実際に参照した後の版は分けて記録しています。", "sources": [{"title": "Oxford・Pitt Rivers Museum：Alison Petch, Joseph Jacobs and the English", "url": "https://england.prm.ox.ac.uk/englishness-Joseph-Jacobs.html"}, {"title": "English Fairy Tales：標題・序文・第三版序文", "url": "https://en.wikisource.org/wiki/English_Fairy_Tales"}]}, {"title": "一つの話にも違う形がある", "text": "『ジャックと豆の木』の注記には、1860年ごろオーストラリアで聞いた話を語ったと記されています。別の形には、巨人の宝はもともとジャックの父の物だったと説明する妖精が登場しますが、この版にはいません。同じ題名でも細部は違うため、いろいろな版の出来事を混ぜないことが大切です。", "sources": [{"title": "English Fairy Tales：Notes and References XIII", "url": "https://en.wikisource.org/wiki/English_Fairy_Tales/Notes_and_References"}]}, {"title": "三度の訪問を比べて読む", "text": "ジャックは最初、空腹のまま巨人の家を訪ねます。金貨がなくなると二度目に登り、金の卵を産む鶏を得ても、さらに三度目に出かけます。くり返しの中で、行く理由や隠れ場所、逃げ方が変わります。勇気ある冒険として読むだけでなく、助けてくれる巨人の妻や、宝を持ち去られる側からも考えてみる。これは採用本文をもとにした独自の読書案内です。", "sources": [{"title": "採用英語本文：Jack and the Beanstalk", "url": "https://en.wikisource.org/wiki/English_Fairy_Tales/Jack_and_the_Beanstalk"}, {"title": "English Fairy Tales：Notes and References XIII", "url": "https://en.wikisource.org/wiki/English_Fairy_Tales/Notes_and_References"}]}], "carlo-collodi": [{"title": "コッローディは村からとった名前", "text": "カルロ・コッローディは1826年11月24日、イタリアのフィレンツェに生まれました。本名はカルロ・ロレンツィーニです。コッローディという筆名は、母ゆかりの村の名からとったもの。本人も幼いころ、その村で過ごしました。『ピノキオ』の作者として知られていますが、子どもの物語を書く前には、新聞や雑誌で長く活動していました。", "sources": [{"title": "RAI Cultura：Collodi, creatore di Pinocchio（生没・連載開始）", "url": "https://www.raicultura.it/letteratura/articoli/2018/12/Collodi-creatore-di-Pinocchio-7ae294e6-008e-47be-bd26-c2310ceeccc9.html"}, {"title": "Pinocchio Museum Experience：The Author and the Novel", "url": "https://www.pinocchioflorence.it/en/pinocchio"}, {"title": "イタリア百科事典協会 Treccani：Collodi, Carlo（L’Unificazione）", "url": "https://www.treccani.it/enciclopedia/carlo-collodi_(L'Unificazione)/"}]}, {"title": "新聞で社会を見つめる", "text": "若いころには学校で学び、イタリアの独立を目指す戦いにも参加しました。フィレンツェでは政治を風刺する新聞『イル・ランピオーネ』を創刊し、劇場や町の暮らしについても文章を書きます。風刺とは、おかしみや皮肉を通して社会の問題を示すことです。楽しい物語だけでなく、その時代の政治や人々の生活に関わる書き手でもありました。", "sources": [{"title": "イタリア百科事典協会 Treccani：Collodi, Carlo（L’Unificazione）", "url": "https://www.treccani.it/enciclopedia/carlo-collodi_(L'Unificazione)/"}, {"title": "フィレンツェ国立中央図書館：Collodi. Percorso biografico documentario", "url": "https://bncf.cultura.gov.it/attivita/mostra-collodi-percorso-biografico-documentario/"}]}, {"title": "翻訳から子どもの本へ", "text": "子どもの文学への入口の一つが、フランスの童話の翻訳でした。1875年には、ペローらの物語を訳した『妖精のお話』を刊行します。その後、『ジャンネッティーノ』や『ミヌッツォロ』など、子どもの学びに関わる本を書きました。『ピノキオ』だけを突然生み出したのではなく、翻訳や読み物の仕事を重ねて代表作へ進んだのです。", "sources": [{"title": "イタリア百科事典協会 Treccani：Collodi, Carlo（L’Unificazione）", "url": "https://www.treccani.it/enciclopedia/carlo-collodi_(L'Unificazione)/"}, {"title": "マルチェッリアーナ図書館：Collodi scrittore per l’infanzia 展示解説", "url": "https://marucelliana.cultura.gov.it/2026/10/01/inaugurazione-della-mostra-cera-una-volta-un-re-collodi-scrittore-per-linfanzia-con-un-percorso-biografico-documentario/"}, {"title": "Storia di Firenze・Sara Mori：1883年2月の『ピノキオ』刊行", "url": "https://www.storiadifirenze.org/?temadelmese=febbraio-1883-escono-le-avventure-di-pinocchio-2"}]}, {"title": "1881年の連載、1883年の一冊", "text": "『ピノキオ』は1881年7月7日、子ども向けの新聞で『あやつり人形の物語』として連載が始まりました。いったん第15章で区切られた後、編集者の働きかけもあって続きが書かれます。1883年にはフィレンツェの出版社パッジから一冊の本になりました。連載を始めた年と単行本の年は別で、現在読む結末までが最初から一度に発表されたわけではありません。", "sources": [{"title": "RAI Cultura：Collodi, creatore di Pinocchio（生没・連載開始）", "url": "https://www.raicultura.it/letteratura/articoli/2018/12/Collodi-creatore-di-Pinocchio-7ae294e6-008e-47be-bd26-c2310ceeccc9.html"}, {"title": "Storia di Firenze・Sara Mori：1883年2月の『ピノキオ』刊行", "url": "https://www.storiadifirenze.org/?temadelmese=febbraio-1883-escono-le-avventure-di-pinocchio-2"}]}, {"title": "フィレンツェに残る手紙と原稿", "text": "コッローディは1890年10月26日、フィレンツェで亡くなりました。国立中央図書館には手紙や文書が残り、『ピノキオ』の終わりの数章の自筆原稿も保存されています。こうした資料からは、童話の作者という一面だけでなく、新聞記者や社会に関心を持つ人としての仕事も知ることができます。", "sources": [{"title": "RAI Cultura：Collodi, creatore di Pinocchio（生没・連載開始）", "url": "https://www.raicultura.it/letteratura/articoli/2018/12/Collodi-creatore-di-Pinocchio-7ae294e6-008e-47be-bd26-c2310ceeccc9.html"}, {"title": "フィレンツェ国立中央図書館：Collodi. Percorso biografico documentario", "url": "https://bncf.cultura.gov.it/attivita/mostra-collodi-percorso-biografico-documentario/"}]}, {"title": "変わるのは鼻や体だけではない", "text": "『ピノキオ』を読むときは、うそで伸びる鼻だけでなく、主人公がだれのために行動するようになるかにも注目できます。終わり近くでは、父の暮らしを支えるために働き、自分の服を買うお金を妖精のために差し出します。体の変化の前に、生活と選び方が変わっているのです。これは原作の終章を手がかりにした独自の読書案内です。", "sources": [{"title": "Wikisource：イタリア語原著（1902年刊底本）第36章", "url": "https://it.wikisource.org/wiki/Le_avventure_di_Pinocchio/Capitolo_36"}]}], "hesiod": [{"title": "生没年が分からない古代の詩人", "text": "ヘシオドスは古代ギリシャの詩人です。メトロポリタン美術館の人物情報では、紀元前700年ごろに活動した人物として紹介されています。正確な生年月日や没年月日は、今回確認した資料からは確定できません。生まれた年を700年と置き換えず、おおよその活動時期として示します。", "sources": [{"title": "Metropolitan Museum：人物標目の活動年代", "url": "https://www.metmuseum.org/art/collection/search/337384"}]}, {"title": "作品の中で語られる家族", "text": "『仕事と日々』では、語り手がペルセスという相手に呼びかけ、財産の分け方や働き方について話します。父が貧しさから海を渡り、アスクラという村に住んだとも語られます。ただし、詩の中の語りを、そのまますべて証明された伝記として扱うことはできません。ここでは「作品にそう語られること」として区別します。", "sources": [{"title": "『仕事と日々』25–41、618–640行", "url": "https://www.gutenberg.org/cache/epub/348/pg348-images.html"}]}, {"title": "神話と毎日の仕事", "text": "『仕事と日々』には、パンドラの話だけでなく、畑で働く時期や、海へ出る際の注意などもあります。美術館の時代解説も、この詩が農民の厳しい暮らしを伝える資料だと説明しています。遠い神々の話と、食べ物を得て生活する身近な仕事とが、一つの詩の中で結びついているのです。", "sources": [{"title": "Metropolitan Museum：幾何学様式期のギリシャと農民の生活", "url": "https://www.metmuseum.org/essays/geometric-art-in-ancient-greece"}, {"title": "『仕事と日々』618–662行ほか", "url": "https://www.gutenberg.org/cache/epub/348/pg348-images.html"}]}, {"title": "パンドラの話を読む入口", "text": "この図鑑の『パンドラの箱』は、『仕事と日々』の一節に沿っています。古代の本文の容器は壺で、希望はその中に残ります。贈り物を計画する神、警告をする者、贈り物を受け取る者の違いにも注目すると、パンドラ一人だけの失敗として片づけない読み方ができます。これは原文を手がかりにした独自の読書案内です。", "sources": [{"title": "『仕事と日々』42–105行", "url": "https://www.gutenberg.org/cache/epub/348/pg348-images.html"}]}], "fukuzawa-yukichi": [{"title": "大阪に生まれ、中津で育つ", "text": "福澤諭吉は1835年1月10日、大阪にあった中津藩の蔵屋敷で生まれました。父を幼くして失い、家族と中津へ移って育ちます。漢学を学んだ後、長崎でオランダ語を学び、大阪では緒方洪庵の適塾で勉強を続けました。", "sources": [{"title": "慶應義塾：創立者 福澤諭吉（年譜）", "url": "https://www.keio.ac.jp/ja/about/philosophy/fukuzawa/"}]}, {"title": "学ぶ人から、教える人へ", "text": "1858年、江戸で蘭学を教える塾を開きました。これが慶應義塾の始まりです。その後、横浜でオランダ語が通じない経験をし、英語の勉強へ進みます。塾は1868年に「慶應義塾」と名づけられました。", "sources": [{"title": "慶應義塾：歴史", "url": "https://www.keio.ac.jp/ja/about/philosophy/history/"}]}, {"title": "外国で見聞きしたことを書く", "text": "福澤は1860年にアメリカへ、1862年にはヨーロッパへ渡りました。外国の暮らしや社会の制度を調べ、日本の読者に伝えます。『西洋事情』にはヨーロッパ旅行で得た知識が生かされました。新しい知識を自分だけのものにせず、読める形にする仕事です。", "sources": [{"title": "慶應義塾：創立者 福澤諭吉（年譜）", "url": "https://www.keio.ac.jp/ja/about/philosophy/fukuzawa/"}, {"title": "慶應義塾大学図書館：福澤諭吉について", "url": "https://libguides.lib.keio.ac.jp/keio/fukuzawa"}]}, {"title": "一人だけではなかった教育の仕事", "text": "小幡篤次郎は、福澤と翻訳や学校運営を支え合った人です。『学問のすゝめ』の初編には、小幡も同著者として記されています。福澤の仕事を読むときは、こうした協力者の存在も忘れずに見ることができます。", "sources": [{"title": "慶應義塾福沢研究センター：小幡篤次郎と初編の同著", "url": "https://www.fmc.keio.ac.jp/research/obata-series"}]}, {"title": "本、演説、新聞で伝える", "text": "『学問のすゝめ』は1872年から1876年にかけて、全17編が刊行されました。『文明論之概略』も著し、1882年には新聞『時事新報』を始めます。学ぶことと社会について考え続け、1901年2月3日に亡くなりました。", "sources": [{"title": "慶應義塾：創立者 福澤諭吉（年譜）", "url": "https://www.keio.ac.jp/ja/about/philosophy/fukuzawa/"}]}, {"title": "『学問のすゝめ』から読む", "text": "この本の学問は、試験の点数を上げることだけではありません。暮らしに役立つ知識を身につけ、自分で判断し、人に伝えることまで話題にしています。明治の社会を変えようとする文章なので、現在にも考えられる点と、当時の価値観に基づく主張を分けて読むと理解が深まります。", "sources": [{"title": "青空文庫：学問のすすめ", "url": "https://www.aozora.gr.jp/cards/000296/files/47061_29420.html"}]}], "obata-tokujiro": [{"title": "中津で学び、教える", "text": "小幡篤次郎は1842年、中津藩士の家に生まれました。漢学を学び、藩校の進脩館で教えます。1864年、協力者を求めて中津を訪れた福澤諭吉に誘われ、弟らと江戸へ出て福澤の塾に入りました。", "sources": [{"title": "慶應義塾大学出版会：小幡篤次郎著作集 第一巻・著者紹介", "url": "https://www.keio-up.co.jp/book/b10164627.html"}]}, {"title": "学ぶ側と教える側をつなぐ", "text": "塾では自ら学ぶ一方で、後から入った人の指導にも当たりました。1866年には塾長を務めます。当時の塾長は学生代表に近い役割でした。図書館制度の導入などにも関わり、授業だけでなく、学ぶための環境を整える仕事を担いました。", "sources": [{"title": "慶應義塾大学出版会：小幡篤次郎著作集 第一巻・著者紹介", "url": "https://www.keio-up.co.jp/book/b10164627.html"}]}, {"title": "『学問のすゝめ』初編の同著者", "text": "1872年刊の『学問のすゝめ』初編には、福澤と小幡の名が同著者として並びます。端書にも二人の署名があります。ただし、どの文章を誰が書いたかは、今回確認した資料だけでは決められません。全十七編を二人で共同執筆したという意味でもありません。", "sources": [{"title": "慶應義塾図書館：学問のすゝめ初編の書誌", "url": "https://dcollections.lib.keio.ac.jp/en/fukuzawa/a15/42"}, {"title": "青空文庫：学問のすすめ（初編端書）", "url": "https://www.aozora.gr.jp/cards/000296/files/47061_29420.html"}, {"title": "慶應義塾大学出版会：小幡篤次郎著作集 第一巻・著者紹介", "url": "https://www.keio-up.co.jp/book/b10164627.html"}]}, {"title": "翻訳と学校運営を支える", "text": "小幡は『天変地異』などの翻訳書を著し、知識を日本語で伝えました。福澤は『文明論之概略』をまとめる際にも小幡に読んでもらい、添削を受けています。中津の学校運営や交詢社の設立にも関わり、慶應義塾の外でも教育や交流の場を支えました。", "sources": [{"title": "慶應義塾大学出版会：小幡篤次郎著作集 第一巻・著者紹介", "url": "https://www.keio-up.co.jp/book/b10164627.html"}]}, {"title": "図書館へ受け継がれた願い", "text": "小幡は1905年に亡くなりました。中津に図書館をつくりたいという願いがあり、遺言によって生家と蔵書の半分が寄贈されます。1909年には中津図書館が開館しました。現在の中津市立小幡記念図書館につながる歩みです。", "sources": [{"title": "慶應義塾大学出版会：小幡篤次郎著作集 第一巻・著者紹介", "url": "https://www.keio-up.co.jp/book/b10164627.html"}]}, {"title": "協力者の名にも目を向ける", "text": "『学問のすゝめ』を読むときは、初編の末尾にある小幡の名にも注目できます。著名な一人の著者だけでなく、共に学び、翻訳し、学校を支えた人を見ることで、本が生まれた環境を考える入口になります。これは図鑑独自の読書案内です。", "sources": [{"title": "青空文庫：学問のすすめ（初編端書）", "url": "https://www.aozora.gr.jp/cards/000296/files/47061_29420.html"}, {"title": "慶應義塾大学出版会：小幡篤次郎著作集 第一巻・著者紹介", "url": "https://www.keio-up.co.jp/book/b10164627.html"}]}], "masaoka-shiki": [{"title": "松山で育った俳人・歌人", "text": "正岡子規は、俳句と短歌の表現を新しくしようとした明治時代の文学者です。1867年10月14日、今の愛媛県松山市に生まれました。本名は正岡常規。「子規」は文学活動で使った名前です。子どものころから漢詩や絵に親しみ、友人たちと雑誌を作ることもありました。", "sources": [{"title": "国立国会図書館：正岡子規（近代日本人の肖像）", "url": "https://www.ndl.go.jp/portrait/datas/329/index.html"}, {"title": "松山市：子規の一生", "url": "https://www.city.matsuyama.ehime.jp/shisetsu/bunka/sikihaku/kidssikihaku/kids_shikinituite.html"}, {"title": "子規庵：正岡子規について・略年譜", "url": "https://shikian.or.jp/about_siki/"}]}, {"title": "東京で学び、漱石と知り合う", "text": "1883年に東京へ出て学び、学生時代に夏目漱石と親しくなりました。1895年には、故郷の松山で漱石としばらく一緒に暮らしています。文学は一人で書くだけでなく、友人と話し、作品を読み合う営みでもありました。子規は野球にも熱中した人です。", "sources": [{"title": "松山市：子規の一生", "url": "https://www.city.matsuyama.ehime.jp/shisetsu/bunka/sikihaku/kidssikihaku/kids_shikinituite.html"}, {"title": "子規庵：正岡子規について・略年譜", "url": "https://shikian.or.jp/about_siki/"}]}, {"title": "新聞を通して、俳句を問い直す", "text": "1892年、新聞「日本」で俳句についての論を発表し、その年の12月に日本新聞社へ入りました。古い作品をたくさん調べ、どんな言葉や表現がよいかを考えます。河東碧梧桐や高浜虚子らとも交流し、俳句を作ることと批評することの両方に取り組みました。", "sources": [{"title": "松山市：子規の一生", "url": "https://www.city.matsuyama.ehime.jp/shisetsu/bunka/sikihaku/kidssikihaku/kids_shikinituite.html"}, {"title": "子規庵：正岡子規について・略年譜", "url": "https://shikian.or.jp/about_siki/"}]}, {"title": "短歌にも新しい表現を求める", "text": "1898年に発表した『歌よみに与ふる書』では、有名な歌だから無条件によいとせず、実際の言葉を読み直すよう促しました。批評は厳しいものですが、感情や空想そのものをなくせという主張ではありません。何を美しいと感じ、どんな言葉で伝えるかを問いかけています。", "sources": [{"title": "松山市立子規記念博物館：正岡子規について", "url": "https://shiki-museum.com/masaokashiki/"}, {"title": "青空文庫：正岡子規『歌よみに与ふる書』原文", "url": "https://www.aozora.gr.jp/cards/000305/files/2533_16281.html"}]}, {"title": "病床でも書き続ける", "text": "病気で外へ出ることが難しくなってからも、子規は書く仕事を続けました。1901年には『墨汁一滴』を連載し、1902年には『病牀六尺』を新聞に連載しています。同年9月19日、満34歳で亡くなりました。短い生涯の中で、俳句、短歌、批評、身の回りのことを記す文章を残しました。", "sources": [{"title": "国立国会図書館：正岡子規（近代日本人の肖像）", "url": "https://www.ndl.go.jp/portrait/datas/329/index.html"}, {"title": "松山市立子規記念博物館：正岡子規について", "url": "https://shiki-museum.com/masaokashiki/"}, {"title": "松山市：子規の一生", "url": "https://www.city.matsuyama.ehime.jp/shisetsu/bunka/sikihaku/kidssikihaku/kids_shikinituite.html"}]}, {"title": "掲載作品から読む入口", "text": "『歌よみに与ふる書』を読むときは、批判の強い言葉だけでなく、その後にどんな理由が続くかを追ってみると、考えをつかみやすくなります。子規の好みをそのまま正解とする必要はありません。具体的な歌を比べ、自分ならどう感じるかを考えられるところも、この文章の面白さです。これは図鑑独自の読書案内です。", "sources": [{"title": "青空文庫：正岡子規『歌よみに与ふる書』原文", "url": "https://www.aozora.gr.jp/cards/000305/files/2533_16281.html"}]}], "h-g-wells": [{"title": "科学と物語を結んだ作家", "text": "H・G・ウェルズは、1866年9月21日、イギリスのブロムリーに生まれました。名前を略さずに書くと、ハーバート・ジョージ・ウェルズです。裕福ではない家庭に育ち、若いころには服地を扱う商売の見習いも経験しました。後に『タイムマシン』『透明人間』『宇宙戦争』などを発表し、科学の発想を使った物語で広く知られるようになります。", "sources": [{"title": "Imperial College London：H.G Wells: 1866–1966（登録簿・生誕百年記念）", "url": "https://blogs.imperial.ac.uk/videoarchive/h-g-wells-1866-1966/"}, {"title": "Humanists UK・Bill Cooke：H. G. Wells (1866–1946)", "url": "https://heritage.humanists.uk/h-g-wells/"}, {"title": "ブロムリー自治体：H G Wells Birthplace", "url": "https://www.bromley.gov.uk/directory-record/6/03-hg-wells-birthplace-primark"}]}, {"title": "生き物について学ぶ", "text": "1884年から1887年まで、後にインペリアル・カレッジの一部となる学校で生物学を学びました。生物学者T・H・ハクスリーの授業も受けています。生き物が長い時間をかけて変わるという考えは、未来の人類を描く物語を読む手がかりになります。ただし、小説に登場する未来の姿は、科学で確定した予測ではありません。", "sources": [{"title": "Imperial College London：H.G Wells: 1866–1966（登録簿・生誕百年記念）", "url": "https://blogs.imperial.ac.uk/videoarchive/h-g-wells-1866-1966/"}, {"title": "Humanists UK・Bill Cooke：H. G. Wells (1866–1946)", "url": "https://heritage.humanists.uk/h-g-wells/"}, {"title": "イリノイ大学貴重書・写本図書館：The Time Machine（英米初版展示）", "url": "https://www.library.illinois.edu/rbx/hgwells2016/category/the-time-machine/"}]}, {"title": "教える仕事から文章の仕事へ", "text": "ウェルズは作家として生活できるようになる前、教員として働きました。初期の著書には、1893年刊の生物学の教科書があります。小説だけでなく、科学の知識を人に伝える文章も書いていたのです。教師だったことを知ると、不思議な出来事を示しながら読者に考える材料を渡す、その書き方にも目を向けられます。", "sources": [{"title": "Humanists UK・Bill Cooke：H. G. Wells (1866–1946)", "url": "https://heritage.humanists.uk/h-g-wells/"}, {"title": "イリノイ大学貴重書・写本図書館：Teacher to the World", "url": "https://www.library.illinois.edu/rbx/hgwells2016/category/teacher-to-the-world/"}]}, {"title": "1895年の『タイムマシン』", "text": "『タイムマシン』が本になったのは1895年です。英国ではロンドンのハイネマン社から刊行されました。同じ年にアメリカのホルト社から出た初版は、英国版と本文に違いがあります。1895年という刊行年と、どの版を読むかは別の情報です。この図鑑の作品紹介は、英国ハイネマン版を採用します。", "sources": [{"title": "イリノイ大学貴重書・写本図書館：The Time Machine（英米初版展示）", "url": "https://www.library.illinois.edu/rbx/hgwells2016/category/the-time-machine/"}]}, {"title": "未来だけでなく、社会も書く", "text": "代表作には『透明人間』（1897年）、『宇宙戦争』（1898年）もあります。その後も、歴史を広く伝える本や、世界中で知識を共有する構想などを書きました。科学を楽しむだけでなく、教育や社会のあり方にも関心を持っていた作家です。1946年8月13日に亡くなりました。", "sources": [{"title": "南フロリダ大学 Lit2Go：The Invisible Man", "url": "https://etc.usf.edu/lit2go/120/the-invisible-man/"}, {"title": "イリノイ大学貴重書・写本図書館：The War of the Worlds", "url": "https://www.library.illinois.edu/rbx/hgwells2016/2016/09/87/"}, {"title": "イリノイ大学貴重書・写本図書館：Teacher to the World", "url": "https://www.library.illinois.edu/rbx/hgwells2016/category/teacher-to-the-world/"}, {"title": "Humanists UK・Bill Cooke：H. G. Wells (1866–1946)", "url": "https://heritage.humanists.uk/h-g-wells/"}]}, {"title": "未来旅行を、現在への問いとして読む", "text": "『タイムマシン』では、未来なら今より進歩しているはずだという期待が揺さぶられます。旅人が何を見て、そこからどう考えたかを分けて読むと、物語を追いやすくなります。奇妙な未来の生き物を眺めるだけでなく、人々の暮らしや働き方の違いに注目するのも一つの読み方です。これは作者の言葉の引用ではなく、独自の読書案内です。", "sources": [{"title": "イリノイ大学貴重書・写本図書館：The Time Machine（英米初版展示）", "url": "https://www.library.illinois.edu/rbx/hgwells2016/category/the-time-machine/"}, {"title": "The Time Machine：1895年Heinemann英国版・原文", "url": "https://en.wikisource.org/wiki/The_Time_Machine_(Heinemann_text)"}]}], "matsuo-basho": [{"title": "伊賀から出た俳人", "text": "松尾芭蕉は、1644年、伊賀国に生まれた江戸時代の俳人です。若いころは藤堂良忠に仕え、俳諧に親しみました。宗房、桃青などの名前でも活動しています。最初から「旅をする有名な俳人」だったのではなく、人から学び、人と句を作りながら自分の表現を育てていきました。", "sources": [{"title": "芭蕉翁顕彰会：略年譜", "url": "https://www.basho-bp.jp/?page_id=16"}, {"title": "三重県：松尾芭蕉", "url": "https://www.bunka.pref.mie.lg.jp/haiku/42249035021.htm"}, {"title": "三重県：松尾芭蕉（俳号「宗房」の読み）", "url": "https://www.bunka.pref.mie.lg.jp/646580347590018.htm"}]}, {"title": "江戸での暮らしと芭蕉庵", "text": "1672年ごろに江戸へ移り、俳諧を教える立場にもなりました。1680年には深川の庵へ移ります。庵は火事で焼けたこともあり、同じ建物に住み続けたわけではありません。芭蕉の暮らしや旅は、弟子や知人たちの助けと結びついていました。", "sources": [{"title": "芭蕉翁顕彰会：略年譜", "url": "https://www.basho-bp.jp/?page_id=16"}, {"title": "三重県：松尾芭蕉", "url": "https://www.bunka.pref.mie.lg.jp/haiku/42249035021.htm"}]}, {"title": "一人の句と、人とつなぐ句", "text": "芭蕉は、短い一句を作るだけでなく、ほかの人と句をつなぐ俳諧にも参加しました。島田市博物館に伝わる「田植の連句」では、塚本如舟の句に芭蕉が次の句を添えています。旅先で受けたもてなしや、人との出会いも、作品が生まれる大切な機会になっていました。", "sources": [{"title": "島田市博物館：芭蕉真蹟「田植の連句」", "url": "https://www.city.shimada.shizuoka.jp/shimahaku/docs/shi-26.html"}]}, {"title": "旅をして、文章を練る", "text": "1684年からの旅は『野ざらし紀行』に結びつき、その後も旅の文学を残しました。1689年には曽良と東北・北陸を巡り、大垣へ至ります。この旅をもとにしたのが『おくのほそ道』です。ただし、旅をした年にそのまま完成した本ではありません。旅の経験を文章と句で組み立てる仕事が続きました。", "sources": [{"title": "芭蕉翁顕彰会：略年譜", "url": "https://www.basho-bp.jp/?page_id=16"}, {"title": "国文学研究資料館：おくのほそ道", "url": "https://www.nijl.ac.jp/etenji/bungakushi/contents/detail/detail04-01_009.html"}]}, {"title": "旅の年、完成の年、本になった時期", "text": "『おくのほそ道』は、1689年の旅、1694年の成立、1702年ごろの刊本を区別して考える必要があります。芭蕉は1694年、大坂で病気になり亡くなりました。そのため、後に広く読まれる本の刊行時期を、本人が旅をしていた時期と取り違えないようにしましょう。", "sources": [{"title": "芭蕉翁顕彰会：略年譜", "url": "https://www.basho-bp.jp/?page_id=16"}, {"title": "国文学研究資料館：おくのほそ道", "url": "https://www.nijl.ac.jp/etenji/bungakushi/contents/detail/detail04-01_009.html"}]}, {"title": "掲載作品から読む入口", "text": "『おくのほそ道』では、どこへ行ったかだけでなく、その場所で何を思ったかに目を向けると読みやすくなります。目の前の風景と、昔の歌や歴史の記憶が出会うところが見どころです。旅の案内図としてだけでなく、経験を選び直して伝える文学として読む、という図鑑独自の読み方です。", "sources": [{"title": "国文学研究資料館：おくのほそ道", "url": "https://www.nijl.ac.jp/etenji/bungakushi/contents/detail/detail04-01_009.html"}, {"title": "おくのほそ道：三宅邦吉『新釈奥の細道』1911年底本の原著翻刻", "url": "https://ja.wikisource.org/w/index.php?title=おくのほそ道&oldid=235001"}]}], "nitobe-inazo": [{"title": "盛岡から、札幌へ", "text": "新渡戸稲造は、1862年9月1日、盛岡に生まれました。父は南部藩の武士です。少年時代に東京へ出て英語などを学び、1877年には札幌農学校へ入学しました。内村鑑三や宮部金吾との交流も、このころから続きます。後に本を書くだけでなく、農学や教育の仕事に進んだ人です。", "sources": [{"title": "国立国会図書館：新渡戸稲造", "url": "https://www.ndl.go.jp/portrait/datas/311/"}, {"title": "北海道大学新渡戸カレッジ：新渡戸稲造", "url": "https://nitobe-college.academic.hokudai.ac.jp/about-nitobe-college/inazo-nitobe"}, {"title": "新渡戸文化学園：新渡戸稲造年表", "url": "https://nitobebunka.ac.jp/nitobe/history/"}]}, {"title": "外国で学び、教える側になる", "text": "札幌農学校を卒業した後、東京大学でも学び、1884年にアメリカへ留学しました。その後ドイツでも農業や経済について研究し、1891年に札幌農学校の教授となります。キリスト教を信仰し、留学中にはクエーカー派に加わりました。日本と外国の両方を見て考える経験を重ねています。", "sources": [{"title": "国立国会図書館：新渡戸稲造", "url": "https://www.ndl.go.jp/portrait/datas/311/"}, {"title": "北海道大学新渡戸カレッジ：新渡戸稲造", "url": "https://nitobe-college.academic.hokudai.ac.jp/about-nitobe-college/inazo-nitobe"}, {"title": "新渡戸文化学園：新渡戸稲造年表", "url": "https://nitobebunka.ac.jp/nitobe/history/"}]}, {"title": "英語で書いた『武士道』", "text": "『武士道』は、最初から日本語で書かれた本ではありません。新渡戸は英語で、日本人の道徳や武士の考え方を海外の読者へ説明しようとしました。初版本は1900年1月、アメリカのフィラデルフィアで刊行されました。1899年の日付を持つ序文と、実際の刊行年を区別する必要があります。", "sources": [{"title": "盛岡市先人記念館：新渡戸稲造に関する展示資料", "url": "https://www.mfca.jp/senjin/nitobe/shiryou"}]}, {"title": "学ぶ機会を広げる", "text": "新渡戸は、学校に通いにくい人や女性の教育にも関わりました。札幌では遠友夜学校の設立に携わり、1906年には第一高等学校の校長、1918年には東京女子大学の初代学長となります。知識を覚えるだけでなく、自分で考え、判断できる人を育てることを重視しました。", "sources": [{"title": "国立国会図書館：新渡戸稲造", "url": "https://www.ndl.go.jp/portrait/datas/311/"}, {"title": "北海道大学新渡戸カレッジ：新渡戸稲造", "url": "https://nitobe-college.academic.hokudai.ac.jp/about-nitobe-college/inazo-nitobe"}, {"title": "東京女子大学：創立期の人々", "url": "https://www.twcu.ac.jp/main/about/history/founder.html"}]}, {"title": "国と国の間で働く", "text": "1920年に国際連盟の事務次長となり、国際知的協力や国際問題の調停に関わりました。教育者や著者としての活動だけでなく、異なる国の人が話し合う場でも仕事をしたのです。1933年10月、カナダのビクトリアで亡くなりました。現地の日付では15日、日本では16日でした。", "sources": [{"title": "国立国会図書館：新渡戸稲造", "url": "https://www.ndl.go.jp/portrait/datas/311/"}, {"title": "新渡戸文化学園：新渡戸稲造年表", "url": "https://nitobebunka.ac.jp/nitobe/history/"}, {"title": "盛岡市先人記念館：新渡戸稲造に関する展示資料", "url": "https://www.mfca.jp/senjin/nitobe/shiryou"}]}, {"title": "掲載作品から読む入口", "text": "『武士道』は、昔の日本人全員が同じ考えだったことを証明する本ではありません。新渡戸が、海外の読者にも伝わるように日本の倫理を説明した著作として読むと、比較の仕方や主張の特徴が見えてきます。共感できる考えと、当時の身分や男女の役割を前提にした考えを分けて確かめるのも、図鑑からの読書案内です。", "sources": [{"title": "盛岡市先人記念館：新渡戸稲造に関する展示資料", "url": "https://www.mfca.jp/senjin/nitobe/shiryou"}, {"title": "新渡戸稲造 Bushido: The Soul of Japan（1908年第13版英語原著）", "url": "https://www.gutenberg.org/files/12096/12096-h/12096-h.htm"}]}], "ishikawa-takuboku": [{"title": "岩手で育った少年", "text": "石川啄木は1886年2月20日、岩手県の日戸村、現在の盛岡市に生まれました。本名は石川一といい、「一」は「はじめ」と読みます。幼いころに家族で渋民へ移り、そこで育ちました。盛岡の中学校へ進んだ後、文学に強く引かれるようになります。\n生まれた場所は日戸の常光寺、育った場所は翌年に移った渋民の宝徳寺です。1898年に入った盛岡尋常中学校は、のちの盛岡中学校、現在の盛岡第一高校につながる学校です。", "sources": [{"title": "国立国会図書館：石川啄木", "url": "https://www.ndl.go.jp/portrait/datas/6251/index.html"}, {"title": "石川啄木記念館：「啄木と鉄道」年譜", "url": "https://www.mfca.jp/takuboku/wp-content/uploads/sites/9/2021/12/e968cadd6af5706d1b809452fcc30cd2-1.pdf"}]}, {"title": "詩を書く人としての出発", "text": "1902年に雑誌『明星』へ短歌が載り、与謝野鉄幹とのつながりも生まれました。中学校を中退して東京へ出ますが、体調を崩して帰郷します。1905年には詩集『あこがれ』を刊行し、節子と結婚しました。後に短歌で知られる啄木も、早くから詩や小説に取り組んだ人です。\n中学校では上級生の金田一京助や野村胡堂に影響を受け、『明星』を愛読して歌作を始めました。上京後には与謝野鉄幹・晶子夫妻を訪ねています。結婚後は妻だけでなく父母らの暮らしも支える必要がありました。友人の援助で文芸誌『小天地』を出したものの、経済的には続かず一号で終わります。文学への意欲と、家族を養うための仕事探しが同時に進んでいました。", "sources": [{"title": "国立国会図書館：石川啄木", "url": "https://www.ndl.go.jp/portrait/datas/6251/index.html"}, {"title": "石川啄木記念館：「啄木と鉄道」年譜", "url": "https://www.mfca.jp/takuboku/wp-content/uploads/sites/9/2021/12/e968cadd6af5706d1b809452fcc30cd2-1.pdf"}, {"title": "岩手県立図書館：結婚と小天地", "url": "https://www.library.pref.iwate.jp/ex/taku34/takuboku/shougai01.html"}]}, {"title": "教員や新聞の仕事をしながら", "text": "啄木は故郷で小学校の代用教員を務め、1907年には北海道へ渡ります。函館でも教員として働きましたが、大火で職場が焼失し、札幌や小樽、釧路へと移りました。文学を続けたいという思いと、家族の暮らしを支える仕事との間で、各地を行き来しています。\n北海道では、小学校の教員だけでなく新聞記者としても働きました。釧路新聞では編集を任されますが、1908年には家族を函館に残して上京します。各地の移動は、単なる観光旅行ではなく、仕事と文学を続ける道を探す移動でもありました。", "sources": [{"title": "石川啄木記念館：「啄木と鉄道」年譜", "url": "https://www.mfca.jp/takuboku/wp-content/uploads/sites/9/2021/12/e968cadd6af5706d1b809452fcc30cd2-1.pdf"}, {"title": "北海道・赤れんが庁舎展示ガイド：石川啄木", "url": "https://akarenga-exhibitionguide.pref.hokkaido.lg.jp/archives/predecessors/49/"}, {"title": "岩手県立図書館：北海道での仕事", "url": "https://www.library.pref.iwate.jp/ex/taku34/takuboku/shougai01.html"}]}, {"title": "東京で歌集をまとめる", "text": "1908年に再び東京へ出て、同郷の先輩である金田一京助と同じ宿に暮らしました。翌年には東京朝日新聞の校正係となります。1910年12月に刊行した『一握の砂』は、最初の歌集です。1905年の『あこがれ』は詩集であり、同じ種類の本として初刊を混同しないようにしたいところです。\n東京では小説がなかなか売れず、金田一京助の経済的な援助も受けました。1909年に就いた校正係は、印刷前の原稿や紙面の誤りを確かめる仕事です。同年、家族を呼び寄せて暮らします。『一握の砂』には、働いても暮らしが楽にならない思いや、人に金を借りるつらさも歌われています。ただし歌一首を、そのまま家計簿や特定の日の記録とはみなしません。", "sources": [{"title": "国立国会図書館：石川啄木", "url": "https://www.ndl.go.jp/portrait/datas/6251/index.html"}, {"title": "石川啄木記念館：「啄木と鉄道」年譜", "url": "https://www.mfca.jp/takuboku/wp-content/uploads/sites/9/2021/12/e968cadd6af5706d1b809452fcc30cd2-1.pdf"}, {"title": "岩手県立図書館：金田一の援助・校正係・家族上京", "url": "https://www.library.pref.iwate.jp/ex/taku34/takuboku/shougai01.html"}, {"title": "一握の砂：金銭と仕事を歌う本文", "url": "https://www.aozora.gr.jp/cards/000153/files/816_15786.html"}]}, {"title": "短い生涯と、残された作品", "text": "晩年は病気に苦しみ、1912年4月13日に26歳で亡くなりました。第二歌集『悲しき玩具』が刊行されたのは、その後の6月です。貧しい暮らしや故郷への思いだけでなく、社会の問題にも関心を深めました。短歌の作者という一面だけでなく、新聞や文章を通して同時代を見ていた人でもあります。\n『一握の砂』の巻頭では、支えてくれた宮崎郁雨と金田一京助に歌集をささげ、幼くして亡くなった長男真一にも一冊を供えると記しています。1910年の大逆事件にも衝撃を受け、社会への関心を深めました。", "sources": [{"title": "国立国会図書館：石川啄木", "url": "https://www.ndl.go.jp/portrait/datas/6251/index.html"}, {"title": "石川啄木記念館：「啄木と鉄道」年譜", "url": "https://www.mfca.jp/takuboku/wp-content/uploads/sites/9/2021/12/e968cadd6af5706d1b809452fcc30cd2-1.pdf"}, {"title": "一握の砂：献辞", "url": "https://www.aozora.gr.jp/cards/000153/files/816_15786.html"}]}, {"title": "掲載作品から読む入口", "text": "『一握の砂』は、一人の主人公が順番に事件を経験する小説ではありません。短い歌を一首ずつ読みながら、どんな場面や気持ちに目を向けているのかを確かめる入口になります。作者の伝記を手がかりにしつつ、歌の言葉をすべて日記と同じ事実だと決めつけずに読む、というのが図鑑からの読書案内です。\n故郷の章では、渋民の山や川を恋しく思うだけでなく、教え子たちもやがて村を離れるのではないかと考えます。懐かしさと、離れざるを得ない寂しさが隣り合っています。『悲しき玩具』まで読むと、仕事や家族に心を向けながらも、病気や先の見えなさに揺れる声を、別の歌集の並びとしてたどれます。", "sources": [{"title": "国立国会図書館：石川啄木", "url": "https://www.ndl.go.jp/portrait/datas/6251/index.html"}, {"title": "青空文庫：一握の砂（新字旧仮名、五章551首）", "url": "https://www.aozora.gr.jp/cards/000153/files/816_15786.html"}, {"title": "悲しき玩具：採用原著", "url": "https://www.aozora.gr.jp/cards/000153/files/815_20544.html"}]}], "william-elliot-griffis": [{"title": "アメリカで日本と出会う", "text": "グリフィスは1843年9月17日、アメリカのフィラデルフィアに生まれました。ラトガーズ大学で学び、日本から来た留学生と知り合います。日下部太郎には英語やラテン語を教えました。遠い国だった日本が、実際に話し、学び合う相手のいる場所になっていきます。", "sources": [{"title": "Rutgers大学文書館：William Elliot Griffis Collection（伝記・年譜）", "url": "https://archives.libraries.rutgers.edu/repositories/11/resources/933"}, {"title": "Rutgers大学図書館：グリフィス・コレクション紹介", "url": "https://www.libraries.rutgers.edu/new-brunswick/visit-study/locations/special-collections-university-archives/divisions-collections/manuscripts/william-elliot-griffis-collection"}]}, {"title": "福井と東京で教える", "text": "1870年に日本へ向かい、翌年から越前、現在の福井で教育に携わりました。その後は東京の開成学校で教えます。姉のマーガレットも来日し、女子教育に関わりました。教える一方で、旅や日記、取材を通して日本についての資料を集めていきます。", "sources": [{"title": "Rutgers大学文書館：William Elliot Griffis Collection（伝記・年譜）", "url": "https://archives.libraries.rutgers.edu/repositories/11/resources/933"}, {"title": "Rutgers大学図書館：グリフィス・コレクション紹介", "url": "https://www.libraries.rutgers.edu/new-brunswick/visit-study/locations/special-collections-university-archives/divisions-collections/manuscripts/william-elliot-griffis-collection"}]}, {"title": "本と講演で伝える", "text": "1874年に帰国した後は、牧師として働きながら、日本について書き、講演しました。代表的な著書『ミカドの帝国』は、日本の歴史や文化を英語で広く紹介した本です。1903年には牧師の仕事を離れ、執筆と講演に力を注ぐようになります。", "sources": [{"title": "Rutgers大学文書館：William Elliot Griffis Collection（伝記・年譜）", "url": "https://archives.libraries.rutgers.edu/repositories/11/resources/933"}, {"title": "Rutgers University Foundation：William Elliot Griffis", "url": "https://support.rutgers.edu/distinguished-alumni/1990/william-elliot-griffis"}]}, {"title": "昔話を英語で語り直す", "text": "歴史や宗教の本だけでなく、日本などの昔話を語り直した本も作りました。『鶴の恩返し』にあたるThe Grateful Craneは、1908年刊のThe Firefly’s Lovers and Other Fairy Tales of Old Japanに収められています。昔話を最初に生み出した作者ではなく、英語の読者へ伝える再話者です。", "sources": [{"title": "Rutgers大学文書館：William Elliot Griffis Collection（伝記・年譜）", "url": "https://archives.libraries.rutgers.edu/repositories/11/resources/933"}, {"title": "Project Gutenberg 19461：The Grateful Crane（採用英語再話）", "url": "https://www.gutenberg.org/cache/epub/19461/pg19461-images.html"}]}, {"title": "残された資料と読む視点", "text": "グリフィスは1928年2月5日に亡くなりました。日記、手紙、原稿、集めた資料などはラトガーズ大学に残されています。その文章は、日本を海外へ紹介した歩みを知る手がかりです。ただし、一人の著者が当時の立場から書いた説明を、日本のすべての人々に当てはまる事実とはしない読み方が必要です。", "sources": [{"title": "Rutgers大学文書館：William Elliot Griffis Collection（伝記・年譜）", "url": "https://archives.libraries.rutgers.edu/repositories/11/resources/933"}, {"title": "Rutgers大学図書館：グリフィス・コレクション紹介", "url": "https://www.libraries.rutgers.edu/new-brunswick/visit-study/locations/special-collections-university-archives/divisions-collections/manuscripts/william-elliot-griffis-collection"}]}, {"title": "この図鑑から読むなら", "text": "図鑑の『鶴の恩返し（グリフィス再話版）』では、青年ムサイ、母、鶴の妻が暮らします。老夫婦のもとへ娘が来る版とは人物関係が違います。助けへの感謝、布によって救われる暮らし、守れなかった約束をたどると、同じ昔話でも語り直しによって輪郭が変わることが見えてきます。", "sources": [{"title": "Project Gutenberg 19461：The Grateful Crane（採用英語再話）", "url": "https://www.gutenberg.org/cache/epub/19461/pg19461-images.html"}]}], "ito-sachio": [{"title": "農村に生まれ、学ぶ", "text": "伊藤左千夫は1864年、今の千葉県山武市に生まれました。本名は幸次郎です。生年月日は旧暦の八月十八日で、新暦では九月十八日に当たります。農家で育ち、学校や私塾で漢文を学びました。1881年には東京の明治法律学校に入りましたが、目を病み、学業を続けられず帰郷します。", "sources": [{"title": "国立国会図書館：伊藤左千夫", "url": "https://www.ndl.go.jp/portrait/datas/6064/index.html"}, {"title": "山武市：出生・十才代の記録", "url": "https://www.city.sammu.lg.jp/kyouiku/bunkazai-rekishi/siryoukan/page001450.html"}]}, {"title": "牛乳の仕事と文学", "text": "1885年に再び東京へ出て、牛乳を扱う仕事に就きます。1889年には独立し、牛乳搾取業を営みました。仕事をしながら茶の湯や和歌を学び、歌会にも参加するようになります。初めから小説だけを書いて暮らした人ではなく、生業と文学を並行させていたのです。", "sources": [{"title": "国立国会図書館：乳業と文学活動", "url": "https://www.ndl.go.jp/portrait/datas/6064/index.html"}, {"title": "山武市：二十才代・三十才代", "url": "https://www.city.sammu.lg.jp/kyouiku/bunkazai-rekishi/siryoukan/page001450.html"}]}, {"title": "正岡子規との出会い", "text": "新聞への歌論の投稿をきっかけに正岡子規の考えに触れ、1900年に子規のもとを訪ねて弟子となりました。左千夫は子規より年上でしたが、短歌の新しい道を学びます。目の前のものや暮らしをよく見る写生の考え方と、万葉集への関心が、その後の文学を支えました。", "sources": [{"title": "山武市：子規との出会いと写生", "url": "https://www.city.sammu.lg.jp/kyouiku/bunkazai-rekishi/siryoukan/page001450.html"}, {"title": "国立国会図書館：1900年の師事", "url": "https://www.ndl.go.jp/portrait/datas/6064/index.html"}]}, {"title": "仲間と歌の場を育てる", "text": "子規が1902年に亡くなった後も、左千夫は短歌の仲間たちを支えました。1903年には『馬酔木』、1908年には後継の『アララギ』の創刊に関わります。門下からは斎藤茂吉や土屋文明らが育ちました。作品を残すだけでなく、歌を学び、発表する場を作ったことも重要です。", "sources": [{"title": "国立国会図書館：短歌雑誌の活動", "url": "https://www.ndl.go.jp/portrait/datas/6064/index.html"}, {"title": "山武市：年譜・門下の歌人", "url": "https://www.city.sammu.lg.jp/kyouiku/bunkazai-rekishi/siryoukan/page001450.html"}]}, {"title": "小説を書いた歌人", "text": "1906年1月、『ホトトギス』に『野菊の墓』を発表し、夏目漱石からも評価されました。その後も『隣の嫁』『春の潮』『分家』などを書きます。左千夫は1913年7月30日に亡くなりました。小説家としてだけでなく、近代短歌を受け継いだ歌人としても読むことのできる作家です。", "sources": [{"title": "山武市：1906年の小説発表と没年", "url": "https://www.city.sammu.lg.jp/kyouiku/bunkazai-rekishi/siryoukan/page001450.html"}, {"title": "国立国会図書館：生没年・代表作", "url": "https://www.ndl.go.jp/portrait/datas/6064/index.html"}]}, {"title": "『野菊の墓』から読む", "text": "この図鑑では、政夫が昔の恋を振り返る『野菊の墓』を紹介しています。野菊や竜胆、月に照らされた蕎麦の花などの景色が、人物の気持ちと重なるところに注目できます。ただし語り手の政夫を、そのまま左千夫本人とみなすことはできません。誰の回想なのかを意識すると、楽しい時間と悔いの両方を読み取れます。", "sources": [{"title": "青空文庫：野菊の墓全文", "url": "https://www.aozora.gr.jp/cards/000058/files/647_20406.html"}]}], "izumi-kyoka": [{"title": "金沢で育った小説家", "text": "泉鏡花は1873年11月4日、金沢に生まれました。本名は泉鏡太郎です。父は金属に彫刻を施す職人、母は能楽に関わる家の出身でした。鏡花は1882年に母を亡くします。幼いころの母への思いは、その後の作品を考えるうえで大切な背景です。", "sources": [{"title": "泉鏡花記念館：生い立ちと年譜", "url": "https://kanazawa-museum.jp/kyoka/english/index.html"}, {"title": "国立国会図書館：生没年・本名", "url": "https://www.ndl.go.jp/portrait/datas/230"}, {"title": "泉鏡花記念館：紹介と年表", "url": "https://www.kanazawa-museum.jp/kyoka/kyoka/"}]}, {"title": "尾崎紅葉に学ぶ", "text": "鏡花は尾崎紅葉の小説に引かれ、作家を目指して1890年に東京へ出ます。1891年には紅葉のもとへ入り、身の回りの仕事をしながら文学を学びました。1892年、「冠弥左衛門」で小説家として出発します。初めから名声を得たのではなく、師のそばで書き方を身につけていった人です。", "sources": [{"title": "泉鏡花記念館：1890〜1892年", "url": "https://kanazawa-museum.jp/kyoka/english/index.html"}, {"title": "泉鏡花記念館：紹介と年表", "url": "https://www.kanazawa-museum.jp/kyoka/kyoka/"}]}, {"title": "人の苦しみを描いて注目される", "text": "1895年に発表した「夜行巡査」と「外科室」で、鏡花は注目を集めます。社会の決まりや立場と、人の思いとの衝突を描いた作品でした。後の幻想的な小説だけでなく、人間を縛るものへの関心も、鏡花の作品を読む入口になります。", "sources": [{"title": "国立国会図書館：初期作品", "url": "https://www.ndl.go.jp/portrait/datas/230"}]}, {"title": "不思議な世界を言葉にする", "text": "1900年には『高野聖』を発表しました。山や水、夜の気配と、人の心に入り込む不思議さが重なります。代表作には「婦系図」「歌行燈」、戯曲の「天守物語」もあります。小説だけでなく、舞台に向けた作品も残した作家です。", "sources": [{"title": "国立国会図書館：代表作", "url": "https://www.ndl.go.jp/portrait/datas/230"}, {"title": "泉鏡花記念館：作品と1917年の年譜", "url": "https://kanazawa-museum.jp/kyoka/english/index.html"}, {"title": "「高野聖」初出・本文", "url": "https://www.aozora.gr.jp/cards/000050/files/521_20583.html"}, {"title": "泉鏡花記念館：紹介と年表", "url": "https://www.kanazawa-museum.jp/kyoka/kyoka/"}]}, {"title": "作品が読み継がれる", "text": "1937年、鏡花は帝国芸術院の会員になり、1939年9月7日に65歳で亡くなりました。その文学は谷崎潤一郎や川端康成らにも影響を与えました。作品は舞台や映画にもなっていますが、小説を読むときには、後の上演や映像とは別に、言葉が生み出す人物や景色を確かめられます。", "sources": [{"title": "国立国会図書館：晩年と影響", "url": "https://www.ndl.go.jp/portrait/datas/230"}, {"title": "泉鏡花記念館：没年と作品の展開", "url": "https://kanazawa-museum.jp/kyoka/english/index.html"}, {"title": "泉鏡花記念館：紹介と年表", "url": "https://www.kanazawa-museum.jp/kyoka/kyoka/"}]}, {"title": "「高野聖」から読む", "text": "『高野聖』では、まず冬の宿で話を聞く人と、昔の体験を語る僧を見分けてみましょう。山の女性は、僧を引きつける人であり、次郎を助ける人でもあります。老人の説明を聞くと、先に読んだ出来事の意味も変わってきます。善人と悪人に急いで分けない読み方は、この図鑑からの提案です。", "sources": [{"title": "泉鏡花「高野聖」原著", "url": "https://www.aozora.gr.jp/cards/000050/files/521_20583.html"}]}], "hori-tatsuo": [{"title": "東京に生まれ、文学へ進む", "text": "堀辰雄は1904年12月28日、東京の麹町に生まれました。若いころは数学にも関心がありましたが、第一高等学校で知り合った神西清との交流を通して、文学への関心を深めます。学校から文学仲間へと、読むこと、書くことのつながりを広げていきました。", "sources": [{"title": "長野県資料：郷土ゆかりの作家紹介（堀辰雄、39ページ）", "url": "https://www.knowledge.pref.nagano.lg.jp/documents/22/local_kyoudo.pdf"}, {"title": "国立国会図書館：生没年", "url": "https://www.ndl.go.jp/portrait/datas/6234/index.html"}]}, {"title": "二人の師と、同人誌の仲間", "text": "高校時代に室生犀星と芥川龍之介を師と仰ぎました。1925年に東京帝国大学へ進むと、小林秀雄らの「山繭」、中野重治らの「驢馬」に加わります。同人誌は、仲間同士で作品を発表する雑誌です。1930年の『聖家族』で、小説家として知られるようになりました。", "sources": [{"title": "国立国会図書館：文学活動", "url": "https://www.ndl.go.jp/portrait/datas/6234/index.html"}]}, {"title": "軽井沢と、西洋の小説", "text": "1923年の夏、室生犀星と初めて軽井沢を訪れ、その後も療養を兼ねて滞在しました。高原の風景や、そこで出会う文学者たちが創作の背景になります。またプルースト、リルケなどを読み、体験をそのまま報告するだけでなく、記憶や心の動きを小説の形にする方法を探しました。", "sources": [{"title": "高志の国文学館：堀辰雄生誕120年展", "url": "https://www.bunka-toyama.jp/koshibun/eventinfo/detail.php?ev_id=8708"}]}, {"title": "体験から生まれた『風立ちぬ』", "text": "婚約者の矢野綾子と富士見高原療養所で過ごし、1935年に綾子を失った体験が、『風立ちぬ』の背景にあります。各章は1936〜1938年に発表され、1938年4月に一冊になりました。ただし、小説の「私」や節子の言動を、作者と婚約者の実際の言動そのものとして読むことはできません。", "sources": [{"title": "長野県資料：婚約者と療養所", "url": "https://www.knowledge.pref.nagano.lg.jp/documents/22/local_kyoudo.pdf"}, {"title": "青空文庫：風立ちぬの初出・単行本", "url": "https://www.aozora.gr.jp/cards/001030/files/4803_14204.html"}]}, {"title": "古典への関心と晩年", "text": "堀は西洋文学だけでなく、日本の古典にも目を向け、『かげろふの日記』や『菜穂子』を書きました。1944年からは信濃追分に定住し、1953年5月28日に亡くなります。今も軽井沢町の記念館には、晩年の住居や原稿、書簡、愛蔵書などが伝えられています。", "sources": [{"title": "国立国会図書館：作品と没年月日", "url": "https://www.ndl.go.jp/portrait/datas/6234/index.html"}, {"title": "長野県資料：信濃追分と記念館", "url": "https://www.knowledge.pref.nagano.lg.jp/documents/22/local_kyoudo.pdf"}]}, {"title": "『風立ちぬ』を読む入口", "text": "最初は、二人が同じ景色を見ながら何を違って考えているかに注目すると、心の動きを追いやすくなります。療養所で書かれる「私」の小説と、目の前で生きる節子を分けて読むことも大切です。最後の冬は、二人の暮らしの続きではなく、節子を失った後の「私」の時間になっています。", "sources": [{"title": "青空文庫：風立ちぬ 全五章", "url": "https://www.aozora.gr.jp/cards/001030/files/4803_14204.html"}]}], "edogawa-ranpo": [{"title": "三重に生まれ、名古屋で育つ", "text": "江戸川乱歩は1894年10月21日、今の三重県名張市に生まれました。本名は平井太郎です。育ったのは主に名古屋で、早稲田大学では経済を学びました。学校の勉強とともに、ポーやコナン・ドイルの作品を読み、謎を解く物語に親しんでいきます。", "sources": [{"title": "新宿区立図書館：生没年・出生地", "url": "https://www.library.shinjuku.tokyo.jp/database/jinbutuyukari/010/post12.html"}, {"title": "立教大学：江戸川乱歩について", "url": "https://www.rikkyo.ac.jp/research/institute/rampo/"}]}, {"title": "さまざまな仕事を経て書く", "text": "大学を卒業した後、乱歩は貿易会社、古本商、新聞記者など、いくつもの仕事を経験しました。すぐに専業の作家になったわけではありません。1923年、雑誌「新青年」に『二銭銅貨』が掲載され、小説家として出発します。暗号と、読者の予想を変える仕掛けを備えた作品でした。", "sources": [{"title": "新潮社：著者プロフィール", "url": "https://www.shinchosha.co.jp/writer/964/"}, {"title": "青空文庫：「二銭銅貨」初出", "url": "https://www.aozora.gr.jp/cards/001779/card56647.html"}]}, {"title": "推理だけでなく、不思議さや怖さも", "text": "初期には「D坂の殺人事件」「人間椅子」「屋根裏の散歩者」などを発表します。乱歩の作品は、論理で謎を解く面白さだけに限られません。見慣れた場所や物が、違って見えてくる不思議さや怖さも描きました。作品ごとに、仕掛けや語り方の違いを楽しめます。", "sources": [{"title": "立教大学：初期作品と乱歩文学", "url": "https://www.rikkyo.ac.jp/research/institute/rampo/"}, {"title": "新宿区立図書館：主な作品", "url": "https://www.library.shinjuku.tokyo.jp/database/jinbutuyukari/010/post12.html"}]}, {"title": "少年たちも活躍する物語へ", "text": "大人向けの長編小説を書く一方、1936年からは「少年倶楽部」に「怪人二十面相」を連載しました。少年たちが活躍するシリーズは、その後も長く続きます。ただし、すべての作品に同じ探偵が出るわけではありません。『二銭銅貨』の中心は、名探偵ではなく、貧しい部屋で知恵を競う二人の青年です。", "sources": [{"title": "立教大学：少年向け作品", "url": "https://www.rikkyo.ac.jp/research/institute/rampo/"}, {"title": "「二銭銅貨」本文", "url": "https://www.aozora.gr.jp/cards/001779/files/56647_58167.html"}]}, {"title": "書き手を育て、資料を残す", "text": "戦後は評論や編集にも力を注ぎました。1947年に探偵作家クラブの初代会長となり、1954年には江戸川乱歩賞を設けます。1965年7月28日、70歳で亡くなりました。池袋の旧居や蔵書・資料は立教大学へ引き継がれ、作品とその背景を調べる手がかりになっています。", "sources": [{"title": "新潮社：戦後の活動", "url": "https://www.shinchosha.co.jp/writer/964/"}, {"title": "立教大学：晩年と資料の継承", "url": "https://www.rikkyo.ac.jp/research/institute/rampo/"}]}, {"title": "「二銭銅貨」から読む", "text": "読むときは、確かめられた事実と、登場人物が「きっとそうだ」と考えたことを分けてみましょう。暗号を解く力があっても、その先の想像まで正しいとは限りません。また、語り手がいつ何を明かすかで、読者の見え方も変わります。仕掛けだけでなく、最後に残る二人の気持ちにも注目する読み方を提案します。", "sources": [{"title": "江戸川乱歩「二銭銅貨」原著", "url": "https://www.aozora.gr.jp/cards/001779/files/56647_58167.html"}]}], "nakahara-chuya": [{"title": "山口に生まれた詩人", "text": "中原中也は1907年4月29日、現在の山口市湯田温泉に生まれました。幼い頃は父の転勤に伴って移り住み、1914年に山口へ戻ります。小学校の高学年には短歌を作り、新聞や雑誌へ投稿するようになりました。", "sources": [{"title": "中原中也記念館：生涯", "url": "https://chuyakan.jp/about-chuya/"}]}, {"title": "短歌から新しい詩へ", "text": "山口中学校から京都の立命館中学校へ移った中也は、高橋新吉の詩に出会います。また、富永太郎との交流を通じてフランスの詩を学びました。決まった形の短歌だけでなく、思いがけない言葉の組み合わせや音の響きを生かす詩へ、表現を広げていきます。", "sources": [{"title": "国立国会図書館：中原中也", "url": "https://www.ndl.go.jp/portrait/datas/6455"}, {"title": "中原中也記念館：生涯", "url": "https://chuyakan.jp/about-chuya/"}]}, {"title": "東京で仲間と発表の場を作る", "text": "1925年に東京へ移り、小林秀雄、大岡昇平、河上徹太郎らと交流しました。1929年には仲間と同人誌「白痴群」を創刊します。その後は「四季」「歴程」などにも詩を発表しました。詩を書くだけでなく、フランス語を学び、ランボーの詩の翻訳にも取り組みました。", "sources": [{"title": "新宿区立図書館：中原中也", "url": "https://www.library.shinjuku.tokyo.jp/database/jinbutuyukari/050/post43.html"}, {"title": "国立国会図書館：中原中也", "url": "https://www.ndl.go.jp/portrait/datas/6455"}, {"title": "中原中也記念館：生涯", "url": "https://chuyakan.jp/about-chuya/"}]}, {"title": "最初の詩集が出るまで", "text": "『山羊の歌』の編集は1932年に進んでいましたが、資金や出版先の問題から、すぐには本にできませんでした。1934年12月10日、ようやく文圃堂書店から刊行されます。「サーカス」「帰郷」など44編を収めた、中也の最初の詩集です。個々の詩を書いた時期と、本が出た年は同じではありません。", "sources": [{"title": "中原中也記念館：山羊の日", "url": "https://chuyakan.jp/news/2021yagi/"}, {"title": "新宿区立図書館：中原中也", "url": "https://www.library.shinjuku.tokyo.jp/database/jinbutuyukari/050/post43.html"}]}, {"title": "生前にまとめた、もう一冊の詩集", "text": "中也は1937年、『在りし日の歌』をまとめて小林秀雄に託しました。しかし刊行を見ることなく、同年10月22日に鎌倉で亡くなります。満30歳でした。この詩集は、友人たちの尽力によって翌1938年に出版されました。没後の刊行ですが、作者自身がまとめた本です。", "sources": [{"title": "国立国会図書館：中原中也", "url": "https://www.ndl.go.jp/portrait/datas/6455"}, {"title": "中原中也記念館：生涯", "url": "https://chuyakan.jp/about-chuya/"}]}, {"title": "『山羊の歌』から読む", "text": "最初は、風景の色や言葉の響きに目を向けると入りやすい詩集です。「夏の日の歌」の明るい駅と、「更くる夜」の静かな炉辺では、同じ孤独でも感じ方が違います。詩の声をすべて伝記の事実に置き換えず、悲しみとやさしさが一冊の中でどう隣り合うかをたどることもできます。", "sources": [{"title": "青空文庫『山羊の歌』全本文", "url": "https://www.aozora.gr.jp/cards/000026/files/894_28272.html"}]}]};
function inlineScene(x,index){const a=(x.inlineIllustrations||[x.inlineIllustration]).filter(Boolean).find(a=>a.afterParagraph===index+1);if(!a)return '';return `<figure class="inline-illustration"><img src="${esc(a.src)}" width="${a.width}" height="${a.height}" alt="${esc(a.alt)}" loading="lazy" decoding="async"><figcaption>${bodyText(x,a.caption)}</figcaption></figure>`}
function summaryParagraphs(x){const seen=new Set(),readings=x.summaryReadings||{},words=Object.keys({...x.bodyReadings,...readings}).sort((a,b)=>b.length-a.length);return x.synopsisSummary.map((value,index)=>{let out='',i=0;while(i<value.length){const word=words.find(w=>value.startsWith(w,i));if(word){const info=readings[word];if(info){out+=seen.has(info.key)?esc(word):rubyText(word,info.reading);seen.add(info.key)}else{out+=rubyText(word,x.bodyReadings[word])}i+=word.length}else{out+=esc(value[i]);i++}}return `<p class="bodytext">${out}</p>`+inlineScene(x,index)}).join('')}

const mascotDrafts=[{"id": "K-000003", "subject": "長十郎梨", "subjectReading": "ちょうじゅうろうなし", "name": "なしふみ", "category": "農業・地域の歴史", "timeScope": "歴史的な発祥の話。現在の栽培・販売状況は未確認", "factText": "長十郎梨は、現在の川崎区にあたる大師河原で生まれた梨の品種です。川崎市の資料では、1893年に当麻辰次郎の梨園で発見されたと伝えられ、当麻家の屋号から名前が付いたと紹介されています。地域の農業の歴史をたどる入口になる題材です。", "fictionText": "赤褐色の丸い梨をイメージした、静かな歴史案内役。無地の小さな本と葉のしおりを持ち、見つけた地域の話を一ページずつ書き留めます。名前、性格、持ち物はこの図鑑の創作です。", "sources": [{"title": "川崎市・かわさき区の宝物シート『長十郎梨のふるさと』", "url": "https://www.city.kawasaki.jp/kawasaki/cmsfiles/contents/0000025/25449/5-2.pdf", "publisher": "川崎市", "supports": "1893年の発見伝承、当麻辰次郎、屋号由来、地域との関係"}], "image": "assets/k-000003.webp", "imageAlt": "長十郎梨を題材にした非公式の創作キャラクター案", "imageSha256": "9810b6c99d2ca43fbddd18f9897ec0e4b338d5c3749eea54d8fd7720695725fe", "firstPublishedAt": "2026-11-01T23:09:38+09:00", "updatedAt": "2026-11-01T23:09:38+09:00"}, {"id": "K-000004", "subject": "奈良茶飯", "subjectReading": "ならちゃめし", "name": "ちゃめしびより", "category": "食文化・川崎宿", "timeScope": "歴史的な川崎宿との関係。現在の店舗・提供状況は未確認", "factText": "奈良茶飯は、東海道の川崎宿で知られた旅籠『万年屋』の名物でした。川崎区の公式紹介では、作品『東海道中膝栗毛』の弥次さん・喜多さんも食べたとされています。旅の道と食事を通して、昔の川崎宿のにぎわいを知る題材です。", "fictionText": "丸い飯椀を体に、やわらかな湯気を前髪にした、おもてなし好きの案内役。歩き疲れた旅人の話を聞くのが得意です。名前、性格、姿は創作で、当時の料理や器を正確に復元したものではありません。", "sources": [{"title": "川崎市川崎区『川崎宿とは』", "url": "https://www.city.kawasaki.jp/kawasaki/category/123-9-2-3-0-0-0-0-0-0.html", "publisher": "川崎市川崎区", "supports": "万年屋の名物、東海道中膝栗毛への言及"}], "image": "assets/k-000004.webp", "imageAlt": "奈良茶飯を題材にした非公式の創作キャラクター案", "imageSha256": "66165a2f06255ab782f092f98b907222c5816a2fda2f0606c3f0512ab1d6eec2", "firstPublishedAt": "2026-11-01T23:09:38+09:00", "updatedAt": "2026-11-01T23:09:38+09:00"}, {"id": "K-000005", "subject": "六郷の渡し舟", "subjectReading": "ろくごうのわたしぶね", "name": "ろくごうこぶね", "category": "交通・多摩川の歴史", "timeScope": "歴史題材。現在運航している渡し舟の案内ではない", "factText": "六郷川、現在の多摩川には1600年に六郷大橋が架けられました。川崎区の公式資料によると、1688年の大洪水で橋が流された後、1874年まで渡しが続けられました。舟で川を越えていた時代の交通を知る題材です。", "fictionText": "小さな木舟を体に、櫂を持ち、さざ波の足で歩く聞き上手。川の両岸で出会った人の話をつなぎます。 2.pdf", "publisher": "川崎市", "publishedDate": null, "publicationDateNote": "PDF本文の発行日は今回確定せず。検索エンジンの公開時期推定は採用しない", "dataPeriod": "令和4年度秋季・冬季", "pageReference": "PDF16ページ目、生活史型ごとの出現種数の説明（抽出テキストで確認）", "checkedDate": "2026-11-01", "supports": "計画区右岸＝川崎側、令和4年度秋季・冬季のマハゼ確認、汽水性の分類"}], "image": "assets/k-000010.webp", "imageAlt": "マハゼを題材にした非公式の創作キャラクター案", "imageSha256": "7e31f5d71477c5db0088f3a9f3cb794952ab5f825374f8e134b6a27d7bd1b737", "imageWidth": 900, "imageHeight": 450, "firstPublishedAt": "2026-11-01T23:22:36+09:00", "updatedAt": "2026-11-01T23:22:36+09:00"}, {"id": "K-000011", "subject": "ガントリークレーン", "subjectReading": "ガントリークレーン", "name": "おうぎはこび", "category": "港湾・東扇島の物流", "timeScope": "現代施設の題材。市公式概要の更新日は2024年4月10日。2026年の個別号機の稼働・更新完了は未確認", "factText": "東扇島にある川崎港コンテナターミナルは、1996年4月に供用を開始しました。川崎市の施設概要には、コンテナを扱うガントリークレーンが掲載されています。海から届く荷物と陸の物流をつなぐ、港の設備を知る題材です。", "fictionText": "門の形の脚と長い横梁を持つ、慎重で段取り上手な港の案内役。無地の小さなコンテナを、急がず大切に運ぶ設定です。名前、表情、性格は創作で、特定の号機の設計を再現したものではありません。", "sources": [{"title": "川崎市「川崎港コンテナターミナル」", "url": "https://www.city.kawasaki.jp/580/page/0000022057.html", "publisher": "川崎市港湾局", "publishedDate": "2018-02-17", "updatedDate": "2024-04-10", "checkedDate": "2026-11-01", "supports": "東扇島に立地、1996年4月供用開始、ガントリークレーンの掲載"}], "image": "assets/k-000011.webp", "imageAlt": "ガントリークレーンを題材にした非公式の創作キャラクター案", "imageSha256": "5944d9cb622ba333345824aa25f2cafd9b1c1ec3fb04801499ffc6bc754f492d", "imageWidth": 900, "imageHeight": 822, "firstPublishedAt": "2026-11-01T23:22:36+09:00", "updatedAt": "2026-11-01T23:22:36+09:00"}, {"id": "K-000001", "subject": "川崎大師のだるま", "subjectReading": "かわさきだいしのだるま", "name": "だるまこつこつ", "category": "文化・門前町の縁起物", "timeScope": "現在にも続く文化題材。資料にある店舗数・当年行事日程は現況として採用しない。", "factText": "川崎市の資料では、だるまは川崎大師の土産物の一つとして紹介されています。表参道や仲見世通りには、厄除けや開運を願うだるまを扱う店が並ぶと記されています。願いを込める縁起物を通して、門前町の文化を知る題材です。", "fictionText": "赤茶色の丸いだるまをイメージした、小さな努力を応援する案内役。無地の折りたたみメモを持ち、一日の「できたこと」を大切にします。名前、性格、持ち物は創作で、実物の縁起物や公認キャラクターの複製ではありません。", "sources": [{"title": "川崎市・かわさき区の宝物シート「川崎大師のだるま」", "url": "https://www.city.kawasaki.jp/kawasaki/cmsfiles/contents/0000025/25622/10-16.pdf", "publisher": "川崎市川崎区", "publishedDate": null, "publicationDateNote": "資料本体の発行・更新日を確定できず。閲覧確認日と区別。", "checkedDate": "2026-11-01", "supports": "大師の土産物、表参道・仲見世通り、縁起物としての地域文化"}], "image": "assets/k-000001.webp", "imageAlt": "川崎大師のだるまを題材にした非公式の創作キャラクター案", "imageSha256": "8548c54d9040c0d134652d07a4a8cf8d31ce3bf115ffd569860cb425f6ef528f", "imageWidth": 900, "imageHeight": 860, "reviewNote": "既存候補の仮リデザインです。以前の原案画像との照合は未完了で、旧原案の置き換えや正式登録ではありません。", "firstPublishedAt": "2026-11-01T23:30:23+09:00", "updatedAt": "2026-11-01T23:30:23+09:00"}, {"id": "K-000002", "subject": "久寿餅", "subjectReading": "くずもち", "name": "くずもちこはく", "category": "食文化・川崎大師の土産", "timeScope": "現在にも続く食文化。店舗数・値段・保存条件・商品仕様の現況を示すカードではない。", "factText": "久寿餅は川崎大師の定番土産として知られ、川崎市の資料では表参道や仲見世通りとのつながりが紹介されています。黒蜜ときな粉を合わせて味わう菓子です。小麦のでんぷんを使う川崎大師の久寿餅を、葛粉の菓子と混同しないことも大切です。", "fictionText": "白くやわらかそうな餅の一切れに、黒蜜色の小さなしずく飾りときな粉色の頬を添えた案内役。ゆっくり話を聞くおだやかな性格です。名前、表情、飾りは創作で、特定店舗の包装や商品を再現したものではありません。", "sources": [{"title": "川崎市・かわさき区の宝物シート「川崎大師久寿餅」", "url": "https://www.city.kawasaki.jp/kawasaki/cmsfiles/contents/0000025/25622/10-14.pdf", "publisher": "川崎市川崎区", "publishedDate": null, "publicationDateNote": "資料本体の発行・更新日を確定できず。閲覧確認日と区別。", "checkedDate": "2026-11-01", "supports": "定番土産、表参道と仲見世通り、黒蜜・きな粉、主に小麦粉由来のくず餅の説明"}, {"title": "川崎市「かわさき名産品」和菓子紹介", "url": "https://www.city.kawasaki.jp/280/cmsfiles/contents/0000020/20067/meisanhinP1-P11.pdf", "publisher": "川崎市", "publishedDate": null, "publicationDateNote": "資料本体の発行・更新日を確定できず。閲覧確認日と区別。", "checkedDate": "2026-11-01", "supports": "大師町の久寿餅商品で小麦のでんぷんを発酵し蒸す製法を紹介。特定商品の工程期間は一般化しない"}], "image": "assets/k-000002.webp", "imageAlt": "久寿餅を題材にした非公式の創作キャラクター案", "imageSha256": "469e35d1fc16d427a1383ab3955688bc236e24732e9d570a65181c48869e4d98", "imageWidth": 900, "imageHeight": 600, "reviewNote": "既存候補の仮リデザインです。以前の原案画像との照合は未完了で、旧原案の置き換えや正式登録ではありません。", "firstPublishedAt": "2026-11-01T23:30:23+09:00", "updatedAt": "2026-11-01T23:30:23+09:00"}, {"id": "K-000015", "subject": "京急大師線", "subjectReading": "けいきゅうだいしせん", "name": "だいしみちしおり", "category": "交通・大師地域の鉄道", "timeScope": "現在の路線と1899年の開業史を区別。昔の六郷橋〜大師を現在の全区間と同一視しない。", "factText": "京急の公式駅紹介によると、前身の大師電気鉄道は1899年1月に六郷橋と大師の間を開通させました。このとき大師駅として開業したのが、現在の川崎大師駅です。駅は川崎区大師駅前にあり、大師線と地域の歩みを結ぶ題材になります。", "fictionText": "鉄道をたどる旅のしおりから生まれた、折り地図形の案内役。二本の細い線を道しるべに、昔と今のまちの話をつなぎます。地図の形、名前、性格は創作で、京急の車両・乗車券・路線図や公式マスコットではありません。", "sources": [{"title": "京浜急行電鉄「川崎大師駅」駅の概要", "url": "https://www.keikyu.co.jp/ride/kakueki/KK23.html", "publisher": "京浜急行電鉄株式会社", "publishedDate": null, "publicationDateNote": "資料本体の発行・更新日を確定できず。閲覧確認日と区別。", "checkedDate": "2026-11-01", "supports": "明治32年1月の六郷橋〜大師開通、大師駅として開業、川崎区大師駅前の所在地、現在の大師線案内"}], "image": "assets/k-000015.webp", "imageAlt": "京急大師線を題材にした非公式の創作キャラクター案", "imageSha256": "b83518e42915c3caf6c84e3ef1ca4485ca4a7c468c32d2a94e25b0b9a753f35c", "imageWidth": 900, "imageHeight": 842, "reviewNote": "既存候補の仮リデザインです。以前の原案画像との照合は未完了で、旧原案の置き換えや正式登録ではありません。", "firstPublishedAt": "2026-11-01T23:30:23+09:00", "updatedAt": "2026-11-01T23:30:23+09:00"}, {"id": "K-000012", "subject": "コンテナ船", "subjectReading": "こんてなせん", "name": "はこなみつむぎ", "category": "港湾・海の物流", "timeScope": "現代の港湾物流の題材。2025年の入港記録を根拠にし、現在の便数や運航日程は主張しない。", "factText": "川崎港のコンテナターミナルは東扇島にあります。川崎市は、2025年6月に新たな定期航路のコンテナ船が初入港したことを発表しました。箱型のコンテナを積んで港と港を結ぶ船は、川崎区と海の向こうの物流のつながりを知る題材です。", "fictionText": "短く丸い船体に、無地の小さなコンテナを並べた案内役。荷物に込められた人の思いを大切につなぐ性格です。名前、顔、配色は創作で、実在する船名や船社の公式キャラクターではありません。", "sources": [{"title": "川崎市「川崎港コンテナターミナル」", "url": "https://www.city.kawasaki.jp/580/page/0000022057.html", "publisher": "川崎市港湾局", "publishedDate": null, "checkedDate": "2026-11-01", "supports": "東扇島への立地。施設概要の更新日2024-04-10", "publicationDateNote": "日付なしは発行日未確定。閲覧確認日とは区別。"}, {"title": "川崎市「川崎港に新たなコンテナ定期航路が開設されました」", "url": "https://www.city.kawasaki.jp/templates/prs/cmsfiles/contents/0000177/177826/hatunyuukou.pdf", "publisher": "川崎市港湾局", "publishedDate": "2025-06-23", "checkedDate": "20
