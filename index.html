。文学を続けたいという思いと、家族の暮らしを支える仕事との間で、各地を行き来しています。\n北海道では、小学校の教員だけでなく新聞記者としても働きました。釧路新聞では編集を任されますが、1908年には家族を函館に残して上京します。各地の移動は、単なる観光旅行ではなく、仕事と文学を続ける道を探す移動でもありました。", "sources": [{"title": "石川啄木記念館：「啄木と鉄道」年譜", "url": "https://www.mfca.jp/takuboku/wp-content/uploads/sites/9/2021/12/e968cadd6af5706d1b809452fcc30cd2-1.pdf"}, {"title": "北海道・赤れんが庁舎展示ガイド：石川啄木", "url": "https://akarenga-exhibitionguide.pref.hokkaido.lg.jp/archives/predecessors/49/"}, {"title": "岩手県立図書館：北海道での仕事", "url": "https://www.library.pref.iwate.jp/ex/taku34/takuboku/shougai01.html"}]}, {"title": "東京で歌集をまとめる", "text": "1908年に再び東京へ出て、同郷の先輩である金田一京助と同じ宿に暮らしました。翌年には東京朝日新聞の校正係となります。1910年12月に刊行した『一握の砂』は、最初の歌集です。1905年の『あこがれ』は詩集であり、同じ種類の本として初刊を混同しないようにしたいところです。\n東京では小説がなかなか売れず、金田一京助の経済的な援助も受けました。1909年に就いた校正係は、印刷前の原稿や紙面の誤りを確かめる仕事です。同年、家族を呼び寄せて暮らします。『一握の砂』には、働いても暮らしが楽にならない思いや、人に金を借りるつらさも歌われています。ただし歌一首を、そのまま家計簿や特定の日の記録とはみなしません。", "sources": [{"title": "国立国会図書館：石川啄木", "url": "https://www.ndl.go.jp/portrait/datas/6251/index.html"}, {"title": "石川啄木記念館：「啄木と鉄道」年譜", "url": "https://www.mfca.jp/takuboku/wp-content/uploads/sites/9/2021/12/e968cadd6af5706d1b809452fcc30cd2-1.pdf"}, {"title": "岩手県立図書館：金田一の援助・校正係・家族上京", "url": "https://www.library.pref.iwate.jp/ex/taku34/takuboku/shougai01.html"}, {"title": "一握の砂：金銭と仕事を歌う本文", "url": "https://www.aozora.gr.jp/cards/000153/files/816_15786.html"}]}, {"title": "短い生涯と、残された作品", "text": "晩年は病気に苦しみ、1912年4月13日に26歳で亡くなりました。第二歌集『悲しき玩具』が刊行されたのは、その後の6月です。貧しい暮らしや故郷への思いだけでなく、社会の問題にも関心を深めました。短歌の作者という一面だけでなく、新聞や文章を通して同時代を見ていた人でもあります。\n『一握の砂』の巻頭では、支えてくれた宮崎郁雨と金田一京助に歌集をささげ、幼くして亡くなった長男真一にも一冊を供えると記しています。1910年の大逆事件にも衝撃を受け、社会への関心を深めました。", "sources": [{"title": "国立国会図書館：石川啄木", "url": "https://www.ndl.go.jp/portrait/datas/6251/index.html"}, {"title": "石川啄木記念館：「啄木と鉄道」年譜", "url": "https://www.mfca.jp/takuboku/wp-content/uploads/sites/9/2021/12/e968cadd6af5706d1b809452fcc30cd2-1.pdf"}, {"title": "一握の砂：献辞", "url": "https://www.aozora.gr.jp/cards/000153/files/816_15786.html"}]}, {"title": "掲載作品から読む入口", "text": "『一握の砂』は、一人の主人公が順番に事件を経験する小説ではありません。短い歌を一首ずつ読みながら、どんな場面や気持ちに目を向けているのかを確かめる入口になります。作者の伝記を手がかりにしつつ、歌の言葉をすべて日記と同じ事実だと決めつけずに読む、というのが図鑑からの読書案内です。\n故郷の章では、渋民の山や川を恋しく思うだけでなく、教え子たちもやがて村を離れるのではないかと考えます。懐かしさと、離れざるを得ない寂しさが隣り合っています。『悲しき玩具』まで読むと、仕事や家族に心を向けながらも、病気や先の見えなさに揺れる声を、別の歌集の並びとしてたどれます。", "sources": [{"title": "国立国会図書館：石川啄木", "url": "https://www.ndl.go.jp/portrait/datas/6251/index.html"}, {"title": "青空文庫：一握の砂（新字旧仮名、五章551首）", "url": "https://www.aozora.gr.jp/cards/000153/files/816_15786.html"}, {"title": "悲しき玩具：採用原著", "url": "https://www.aozora.gr.jp/cards/000153/files/815_20544.html"}]}], "william-elliot-griffis": [{"title": "アメリカで日本と出会う", "text": "グリフィスは1843年9月17日、アメリカのフィラデルフィアに生まれました。ラトガーズ大学で学び、日本から来た留学生と知り合います。日下部太郎には英語やラテン語を教えました。遠い国だった日本が、実際に話し、学び合う相手のいる場所になっていきます。", "sources": [{"title": "Rutgers大学文書館：William Elliot Griffis Collection（伝記・年譜）", "url": "https://archives.libraries.rutgers.edu/repositories/11/resources/933"}, {"title": "Rutgers大学図書館：グリフィス・コレクション紹介", "url": "https://www.libraries.rutgers.edu/new-brunswick/visit-study/locations/special-collections-university-archives/divisions-collections/manuscripts/william-elliot-griffis-collection"}]}, {"title": "福井と東京で教える", "text": "1870年に日本へ向かい、翌年から越前、現在の福井で教育に携わりました。その後は東京の開成学校で教えます。姉のマーガレットも来日し、女子教育に関わりました。教える一方で、旅や日記、取材を通して日本についての資料を集めていきます。", "sources": [{"title": "Rutgers大学文書館：William Elliot Griffis Collection（伝記・年譜）", "url": "https://archives.libraries.rutgers.edu/repositories/11/resources/933"}, {"title": "Rutgers大学図書館：グリフィス・コレクション紹介", "url": "https://www.libraries.rutgers.edu/new-brunswick/visit-study/locations/special-collections-university-archives/divisions-collections/manuscripts/william-elliot-griffis-collection"}]}, {"title": "本と講演で伝える", "text": "1874年に帰国した後は、牧師として働きながら、日本について書き、講演しました。代表的な著書『ミカドの帝国』は、日本の歴史や文化を英語で広く紹介した本です。1903年には牧師の仕事を離れ、執筆と講演に力を注ぐようになります。", "sources": [{"title": "Rutgers大学文書館：William Elliot Griffis Collection（伝記・年譜）", "url": "https://archives.libraries.rutgers.edu/repositories/11/resources/933"}, {"title": "Rutgers University Foundation：William Elliot Griffis", "url": "https://support.rutgers.edu/distinguished-alumni/1990/william-elliot-griffis"}]}, {"title": "昔話を英語で語り直す", "text": "歴史や宗教の本だけでなく、日本などの昔話を語り直した本も作りました。『鶴の恩返し』にあたるThe Grateful Craneは、1908年刊のThe Firefly’s Lovers and Other Fairy Tales of Old Japanに収められています。昔話を最初に生み出した作者ではなく、英語の読者へ伝える再話者です。", "sources": [{"title": "Rutgers大学文書館：William Elliot Griffis Collection（伝記・年譜）", "url": "https://archives.libraries.rutgers.edu/repositories/11/resources/933"}, {"title": "Project Gutenberg 19461：The Grateful Crane（採用英語再話）", "url": "https://www.gutenberg.org/cache/epub/19461/pg19461-images.html"}]}, {"title": "残された資料と読む視点", "text": "グリフィスは1928年2月5日に亡くなりました。日記、手紙、原稿、集めた資料などはラトガーズ大学に残されています。その文章は、日本を海外へ紹介した歩みを知る手がかりです。ただし、一人の著者が当時の立場から書いた説明を、日本のすべての人々に当てはまる事実とはしない読み方が必要です。", "sources": [{"title": "Rutgers大学文書館：William Elliot Griffis Collection（伝記・年譜）", "url": "https://archives.libraries.rutgers.edu/repositories/11/resources/933"}, {"title": "Rutgers大学図書館：グリフィス・コレクション紹介", "url": "https://www.libraries.rutgers.edu/new-brunswick/visit-study/locations/special-collections-university-archives/divisions-collections/manuscripts/william-elliot-griffis-collection"}]}, {"title": "この図鑑から読むなら", "text": "図鑑の『鶴の恩返し（グリフィス再話版）』では、青年ムサイ、母、鶴の妻が暮らします。老夫婦のもとへ娘が来る版とは人物関係が違います。助けへの感謝、布によって救われる暮らし、守れなかった約束をたどると、同じ昔話でも語り直しによって輪郭が変わることが見えてきます。", "sources": [{"title": "Project Gutenberg 19461：The Grateful Crane（採用英語再話）", "url": "https://www.gutenberg.org/cache/epub/19461/pg19461-images.html"}]}], "ito-sachio": [{"title": "農村に生まれ、学ぶ", "text": "伊藤左千夫は1864年、今の千葉県山武市に生まれました。本名は幸次郎です。生年月日は旧暦の八月十八日で、新暦では九月十八日に当たります。農家で育ち、学校や私塾で漢文を学びました。1881年には東京の明治法律学校に入りましたが、目を病み、学業を続けられず帰郷します。", "sources": [{"title": "国立国会図書館：伊藤左千夫", "url": "https://www.ndl.go.jp/portrait/datas/6064/index.html"}, {"title": "山武市：出生・十才代の記録", "url": "https://www.city.sammu.lg.jp/kyouiku/bunkazai-rekishi/siryoukan/page001450.html"}]}, {"title": "牛乳の仕事と文学", "text": "1885年に再び東京へ出て、牛乳を扱う仕事に就きます。1889年には独立し、牛乳搾取業を営みました。仕事をしながら茶の湯や和歌を学び、歌会にも参加するようになります。初めから小説だけを書いて暮らした人ではなく、生業と文学を並行させていたのです。", "sources": [{"title": "国立国会図書館：乳業と文学活動", "url": "https://www.ndl.go.jp/portrait/datas/6064/index.html"}, {"title": "山武市：二十才代・三十才代", "url": "https://www.city.sammu.lg.jp/kyouiku/bunkazai-rekishi/siryoukan/page001450.html"}]}, {"title": "正岡子規との出会い", "text": "新聞への歌論の投稿をきっかけに正岡子規の考えに触れ、1900年に子規のもとを訪ねて弟子となりました。左千夫は子規より年上でしたが、短歌の新しい道を学びます。目の前のものや暮らしをよく見る写生の考え方と、万葉集への関心が、その後の文学を支えました。", "sources": [{"title": "山武市：子規との出会いと写生", "url": "https://www.city.sammu.lg.jp/kyouiku/bunkazai-rekishi/siryoukan/page001450.html"}, {"title": "国立国会図書館：1900年の師事", "url": "https://www.ndl.go.jp/portrait/datas/6064/index.html"}]}, {"title": "仲間と歌の場を育てる", "text": "子規が1902年に亡くなった後も、左千夫は短歌の仲間たちを支えました。1903年には『馬酔木』、1908年には後継の『アララギ』の創刊に関わります。門下からは斎藤茂吉や土屋文明らが育ちました。作品を残すだけでなく、歌を学び、発表する場を作ったことも重要です。", "sources": [{"title": "国立国会図書館：短歌雑誌の活動", "url": "https://www.ndl.go.jp/portrait/datas/6064/index.html"}, {"title": "山武市：年譜・門下の歌人", "url": "https://www.city.sammu.lg.jp/kyouiku/bunkazai-rekishi/siryoukan/page001450.html"}]}, {"title": "小説を書いた歌人", "text": "1906年1月、『ホトトギス』に『野菊の墓』を発表し、夏目漱石からも評価されました。その後も『隣の嫁』『春の潮』『分家』などを書きます。左千夫は1913年7月30日に亡くなりました。小説家としてだけでなく、近代短歌を受け継いだ歌人としても読むことのできる作家です。", "sources": [{"title": "山武市：1906年の小説発表と没年", "url": "https://www.city.sammu.lg.jp/kyouiku/bunkazai-rekishi/siryoukan/page001450.html"}, {"title": "国立国会図書館：生没年・代表作", "url": "https://www.ndl.go.jp/portrait/datas/6064/index.html"}]}, {"title": "『野菊の墓』から読む", "text": "この図鑑では、政夫が昔の恋を振り返る『野菊の墓』を紹介しています。野菊や竜胆、月に照らされた蕎麦の花などの景色が、人物の気持ちと重なるところに注目できます。ただし語り手の政夫を、そのまま左千夫本人とみなすことはできません。誰の回想なのかを意識すると、楽しい時間と悔いの両方を読み取れます。", "sources": [{"title": "青空文庫：野菊の墓全文", "url": "https://www.aozora.gr.jp/cards/000058/files/647_20406.html"}]}], "izumi-kyoka": [{"title": "金沢で育った小説家", "text": "泉鏡花は1873年11月4日、金沢に生まれました。本名は泉鏡太郎です。父は金属に彫刻を施す職人、母は能楽に関わる家の出身でした。鏡花は1882年に母を亡くします。幼いころの母への思いは、その後の作品を考えるうえで大切な背景です。", "sources": [{"title": "泉鏡花記念館：生い立ちと年譜", "url": "https://kanazawa-museum.jp/kyoka/english/index.html"}, {"title": "国立国会図書館：生没年・本名", "url": "https://www.ndl.go.jp/portrait/datas/230"}, {"title": "泉鏡花記念館：紹介と年表", "url": "https://www.kanazawa-museum.jp/kyoka/kyoka/"}]}, {"title": "尾崎紅葉に学ぶ", "text": "鏡花は尾崎紅葉の小説に引かれ、作家を目指して1890年に東京へ出ます。1891年には紅葉のもとへ入り、身の回りの仕事をしながら文学を学びました。1892年、「冠弥左衛門」で小説家として出発します。初めから名声を得たのではなく、師のそばで書き方を身につけていった人です。", "sources": [{"title": "泉鏡花記念館：1890〜1892年", "url": "https://kanazawa-museum.jp/kyoka/english/index.html"}, {"title": "泉鏡花記念館：紹介と年表", "url": "https://www.kanazawa-museum.jp/kyoka/kyoka/"}]}, {"title": "人の苦しみを描いて注目される", "text": "1895年に発表した「夜行巡査」と「外科室」で、鏡花は注目を集めます。社会の決まりや立場と、人の思いとの衝突を描いた作品でした。後の幻想的な小説だけでなく、人間を縛るものへの関心も、鏡花の作品を読む入口になります。", "sources": [{"title": "国立国会図書館：初期作品", "url": "https://www.ndl.go.jp/portrait/datas/230"}]}, {"title": "不思議な世界を言葉にする", "text": "1900年には『高野聖』を発表しました。山や水、夜の気配と、人の心に入り込む不思議さが重なります。代表作には「婦系図」「歌行燈」、戯曲の「天守物語」もあります。小説だけでなく、舞台に向けた作品も残した作家です。", "sources": [{"title": "国立国会図書館：代表作", "url": "https://www.ndl.go.jp/portrait/datas/230"}, {"title": "泉鏡花記念館：作品と1917年の年譜", "url": "https://kanazawa-museum.jp/kyoka/english/index.html"}, {"title": "「高野聖」初出・本文", "url": "https://www.aozora.gr.jp/cards/000050/files/521_20583.html"}, {"title": "泉鏡花記念館：紹介と年表", "url": "https://www.kanazawa-museum.jp/kyoka/kyoka/"}]}, {"title": "作品が読み継がれる", "text": "1937年、鏡花は帝国芸術院の会員になり、1939年9月7日に65歳で亡くなりました。その文学は谷崎潤一郎や川端康成らにも影響を与えました。作品は舞台や映画にもなっていますが、小説を読むときには、後の上演や映像とは別に、言葉が生み出す人物や景色を確かめられます。", "sources": [{"title": "国立国会図書館：晩年と影響", "url": "https://www.ndl.go.jp/portrait/datas/230"}, {"title": "泉鏡花記念館：没年と作品の展開", "url": "https://kanazawa-museum.jp/kyoka/english/index.html"}, {"title": "泉鏡花記念館：紹介と年表", "url": "https://www.kanazawa-museum.jp/kyoka/kyoka/"}]}, {"title": "「高野聖」から読む", "text": "『高野聖』では、まず冬の宿で話を聞く人と、昔の体験を語る僧を見分けてみましょう。山の女性は、僧を引きつける人であり、次郎を助ける人でもあります。老人の説明を聞くと、先に読んだ出来事の意味も変わってきます。善人と悪人に急いで分けない読み方は、この図鑑からの提案です。", "sources": [{"title": "泉鏡花「高野聖」原著", "url": "https://www.aozora.gr.jp/cards/000050/files/521_20583.html"}]}], "hori-tatsuo": [{"title": "東京に生まれ、文学へ進む", "text": "堀辰雄は1904年12月28日、東京の麹町に生まれました。若いころは数学にも関心がありましたが、第一高等学校で知り合った神西清との交流を通して、文学への関心を深めます。学校から文学仲間へと、読むこと、書くことのつながりを広げていきました。", "sources": [{"title": "長野県資料：郷土ゆかりの作家紹介（堀辰雄、39ページ）", "url": "https://www.knowledge.pref.nagano.lg.jp/documents/22/local_kyoudo.pdf"}, {"title": "国立国会図書館：生没年", "url": "https://www.ndl.go.jp/portrait/datas/6234/index.html"}]}, {"title": "二人の師と、同人誌の仲間", "text": "高校時代に室生犀星と芥川龍之介を師と仰ぎました。1925年に東京帝国大学へ進むと、小林秀雄らの「山繭」、中野重治らの「驢馬」に加わります。同人誌は、仲間同士で作品を発表する雑誌です。1930年の『聖家族』で、小説家として知られるようになりました。", "sources": [{"title": "国立国会図書館：文学活動", "url": "https://www.ndl.go.jp/portrait/datas/6234/index.html"}]}, {"title": "軽井沢と、西洋の小説", "text": "1923年の夏、室生犀星と初めて軽井沢を訪れ、その後も療養を兼ねて滞在しました。高原の風景や、そこで出会う文学者たちが創作の背景になります。またプルースト、リルケなどを読み、体験をそのまま報告するだけでなく、記憶や心の動きを小説の形にする方法を探しました。", "sources": [{"title": "高志の国文学館：堀辰雄生誕120年展", "url": "https://www.bunka-toyama.jp/koshibun/eventinfo/detail.php?ev_id=8708"}]}, {"title": "体験から生まれた『風立ちぬ』", "text": "婚約者の矢野綾子と富士見高原療養所で過ごし、1935年に綾子を失った体験が、『風立ちぬ』の背景にあります。各章は1936〜1938年に発表され、1938年4月に一冊になりました。ただし、小説の「私」や節子の言動を、作者と婚約者の実際の言動そのものとして読むことはできません。", "sources": [{"title": "長野県資料：婚約者と療養所", "url": "https://www.knowledge.pref.nagano.lg.jp/documents/22/local_kyoudo.pdf"}, {"title": "青空文庫：風立ちぬの初出・単行本", "url": "https://www.aozora.gr.jp/cards/001030/files/4803_14204.html"}]}, {"title": "古典への関心と晩年", "text": "堀は西洋文学だけでなく、日本の古典にも目を向け、『かげろふの日記』や『菜穂子』を書きました。1944年からは信濃追分に定住し、1953年5月28日に亡くなります。今も軽井沢町の記念館には、晩年の住居や原稿、書簡、愛蔵書などが伝えられています。", "sources": [{"title": "国立国会図書館：作品と没年月日", "url": "https://www.ndl.go.jp/portrait/datas/6234/index.html"}, {"title": "長野県資料：信濃追分と記念館", "url": "https://www.knowledge.pref.nagano.lg.jp/documents/22/local_kyoudo.pdf"}]}, {"title": "『風立ちぬ』を読む入口", "text": "最初は、二人が同じ景色を見ながら何を違って考えているかに注目すると、心の動きを追いやすくなります。療養所で書かれる「私」の小説と、目の前で生きる節子を分けて読むことも大切です。最後の冬は、二人の暮らしの続きではなく、節子を失った後の「私」の時間になっています。", "sources": [{"title": "青空文庫：風立ちぬ 全五章", "url": "https://www.aozora.gr.jp/cards/001030/files/4803_14204.html"}]}], "edogawa-ranpo": [{"title": "三重に生まれ、名古屋で育つ", "text": "江戸川乱歩は1894年10月21日、今の三重県名張市に生まれました。本名は平井太郎です。育ったのは主に名古屋で、早稲田大学では経済を学びました。学校の勉強とともに、ポーやコナン・ドイルの作品を読み、謎を解く物語に親しんでいきます。", "sources": [{"title": "新宿区立図書館：生没年・出生地", "url": "https://www.library.shinjuku.tokyo.jp/database/jinbutuyukari/010/post12.html"}, {"title": "立教大学：江戸川乱歩について", "url": "https://www.rikkyo.ac.jp/research/institute/rampo/"}]}, {"title": "さまざまな仕事を経て書く", "text": "大学を卒業した後、乱歩は貿易会社、古本商、新聞記者など、いくつもの仕事を経験しました。すぐに専業の作家になったわけではありません。1923年、雑誌「新青年」に『二銭銅貨』が掲載され、小説家として出発します。暗号と、読者の予想を変える仕掛けを備えた作品でした。", "sources": [{"title": "新潮社：著者プロフィール", "url": "https://www.shinchosha.co.jp/writer/964/"}, {"title": "青空文庫：「二銭銅貨」初出", "url": "https://www.aozora.gr.jp/cards/001779/card56647.html"}]}, {"title": "推理だけでなく、不思議さや怖さも", "text": "初期には「D坂の殺人事件」「人間椅子」「屋根裏の散歩者」などを発表します。乱歩の作品は、論理で謎を解く面白さだけに限られません。見慣れた場所や物が、違って見えてくる不思議さや怖さも描きました。作品ごとに、仕掛けや語り方の違いを楽しめます。", "sources": [{"title": "立教大学：初期作品と乱歩文学", "url": "https://www.rikkyo.ac.jp/research/institute/rampo/"}, {"title": "新宿区立図書館：主な作品", "url": "https://www.library.shinjuku.tokyo.jp/database/jinbutuyukari/010/post12.html"}]}, {"title": "少年たちも活躍する物語へ", "text": "大人向けの長編小説を書く一方、1936年からは「少年倶楽部」に「怪人二十面相」を連載しました。少年たちが活躍するシリーズは、その後も長く続きます。ただし、すべての作品に同じ探偵が出るわけではありません。『二銭銅貨』の中心は、名探偵ではなく、貧しい部屋で知恵を競う二人の青年です。", "sources": [{"title": "立教大学：少年向け作品", "url": "https://www.rikkyo.ac.jp/research/institute/rampo/"}, {"title": "「二銭銅貨」本文", "url": "https://www.aozora.gr.jp/cards/001779/files/56647_58167.html"}]}, {"title": "書き手を育て、資料を残す", "text": "戦後は評論や編集にも力を注ぎました。1947年に探偵作家クラブの初代会長となり、1954年には江戸川乱歩賞を設けます。1965年7月28日、70歳で亡くなりました。池袋の旧居や蔵書・資料は立教大学へ引き継がれ、作品とその背景を調べる手がかりになっています。", "sources": [{"title": "新潮社：戦後の活動", "url": "https://www.shinchosha.co.jp/writer/964/"}, {"title": "立教大学：晩年と資料の継承", "url": "https://www.rikkyo.ac.jp/research/institute/rampo/"}]}, {"title": "「二銭銅貨」から読む", "text": "読むときは、確かめられた事実と、登場人物が「きっとそうだ」と考えたことを分けてみましょう。暗号を解く力があっても、その先の想像まで正しいとは限りません。また、語り手がいつ何を明かすかで、読者の見え方も変わります。仕掛けだけでなく、最後に残る二人の気持ちにも注目する読み方を提案します。", "sources": [{"title": "江戸川乱歩「二銭銅貨」原著", "url": "https://www.aozora.gr.jp/cards/001779/files/56647_58167.html"}]}], "nakahara-chuya": [{"title": "山口に生まれた詩人", "text": "中原中也は1907年4月29日、現在の山口市湯田温泉に生まれました。幼い頃は父の転勤に伴って移り住み、1914年に山口へ戻ります。小学校の高学年には短歌を作り、新聞や雑誌へ投稿するようになりました。", "sources": [{"title": "中原中也記念館：生涯", "url": "https://chuyakan.jp/about-chuya/"}]}, {"title": "短歌から新しい詩へ", "text": "山口中学校から京都の立命館中学校へ移った中也は、高橋新吉の詩に出会います。また、富永太郎との交流を通じてフランスの詩を学びました。決まった形の短歌だけでなく、思いがけない言葉の組み合わせや音の響きを生かす詩へ、表現を広げていきます。", "sources": [{"title": "国立国会図書館：中原中也", "url": "https://www.ndl.go.jp/portrait/datas/6455"}, {"title": "中原中也記念館：生涯", "url": "https://chuyakan.jp/about-chuya/"}]}, {"title": "東京で仲間と発表の場を作る", "text": "1925年に東京へ移り、小林秀雄、大岡昇平、河上徹太郎らと交流しました。1929年には仲間と同人誌「白痴群」を創刊します。その後は「四季」「歴程」などにも詩を発表しました。詩を書くだけでなく、フランス語を学び、ランボーの詩の翻訳にも取り組みました。", "sources": [{"title": "新宿区立図書館：中原中也", "url": "https://www.library.shinjuku.tokyo.jp/database/jinbutuyukari/050/post43.html"}, {"title": "国立国会図書館：中原中也", "url": "https://www.ndl.go.jp/portrait/datas/6455"}, {"title": "中原中也記念館：生涯", "url": "https://chuyakan.jp/about-chuya/"}]}, {"title": "最初の詩集が出るまで", "text": "『山羊の歌』の編集は1932年に進んでいましたが、資金や出版先の問題から、すぐには本にできませんでした。1934年12月10日、ようやく文圃堂書店から刊行されます。「サーカス」「帰郷」など44編を収めた、中也の最初の詩集です。個々の詩を書いた時期と、本が出た年は同じではありません。", "sources": [{"title": "中原中也記念館：山羊の日", "url": "https://chuyakan.jp/news/2021yagi/"}, {"title": "新宿区立図書館：中原中也", "url": "https://www.library.shinjuku.tokyo.jp/database/jinbutuyukari/050/post43.html"}]}, {"title": "生前にまとめた、もう一冊の詩集", "text": "中也は1937年、『在りし日の歌』をまとめて小林秀雄に託しました。しかし刊行を見ることなく、同年10月22日に鎌倉で亡くなります。満30歳でした。この詩集は、友人たちの尽力によって翌1938年に出版されました。没後の刊行ですが、作者自身がまとめた本です。", "sources": [{"title": "国立国会図書館：中原中也", "url": "https://www.ndl.go.jp/portrait/datas/6455"}, {"title": "中原中也記念館：生涯", "url": "https://chuyakan.jp/about-chuya/"}]}, {"title": "『山羊の歌』から読む", "text": "最初は、風景の色や言葉の響きに目を向けると入りやすい詩集です。「夏の日の歌」の明るい駅と、「更くる夜」の静かな炉辺では、同じ孤独でも感じ方が違います。詩の声をすべて伝記の事実に置き換えず、悲しみとやさしさが一冊の中でどう隣り合うかをたどることもできます。", "sources": [{"title": "青空文庫『山羊の歌』全本文", "url": "https://www.aozora.gr.jp/cards/000026/files/894_28272.html"}]}], "yosano-akiko": [{"title": "堺に生まれた文学者", "text": "与謝野晶子は、短歌や詩、評論を書き、古典の現代語訳にも取り組んだ文学者です。1878年、大阪の堺にあった和菓子商・駿河屋の家に生まれました。旧姓は鳳です。恋愛の思いを率直に歌った歌人として知られますが、女性の学び方や働き方、教育についても自分の考えを発表しました。", "sources": [{"id": "sakai", "title": "堺市「ここがスゴイよ堺の偉人！」与謝野晶子", "url": "https://www.city.sakai.lg.jp/shisei/koho/citypromo/a_side_b_side/sakai_ijin.html"}, {"id": "museum", "title": "さかい利晶の杜「晶子をはぐくんだ堺の文学」", "url": "https://sakai-rishonomori.com/pages/103?b_id=842&detail=1&r_id=384"}, {"id": "aozora", "title": "青空文庫 与謝野晶子 作家別作品リスト", "url": "https://www.aozora.gr.jp/index_pages/person885.html"}, {"id": "essay", "title": "青空文庫『「女らしさ」とは何か』図書カード", "url": "https://www.aozora.gr.jp/cards/000885/card3325.html"}, {"id": "essay-text", "title": "青空文庫『「女らしさ」とは何か』全本文", "url": "https://www.aozora.gr.jp/cards/000885/files/3325_6558.html"}, {"id": "ndl", "title": "国立国会図書館「近代日本人の肖像・与謝野晶子」", "url": "https://www.ndl.go.jp/portrait/datas/347"}]}, {"title": "堺で育った文学への思い", "text": "晶子の文学は、東京に出てから突然始まったわけではありません。堺では関西青年文学会に参加し、文学を志す人たちと交流しました。後に夫となる与謝野寛との出会いも、この会が開いた講演会がきっかけでした。最初の歌集『みだれ髪』には、雑誌『明星』に発表した歌に加えて、堺で暮らしていた時期の歌も多く収められています。", "sources": [{"id": "sakai", "title": "堺市「ここがスゴイよ堺の偉人！」与謝野晶子", "url": "https://www.city.sakai.lg.jp/shisei/koho/citypromo/a_side_b_side/sakai_ijin.html"}, {"id": "museum", "title": "さかい利晶の杜「晶子をはぐくんだ堺の文学」", "url": "https://sakai-rishonomori.com/pages/103?b_id=842&detail=1&r_id=384"}, {"id": "aozora", "title": "青空文庫 与謝野晶子 作家別作品リスト", "url": "https://www.aozora.gr.jp/index_pages/person885.html"}, {"id": "essay", "title": "青空文庫『「女らしさ」とは何か』図書カード", "url": "https://www.aozora.gr.jp/cards/000885/card3325.html"}, {"id": "essay-text", "title": "青空文庫『「女らしさ」とは何か』全本文", "url": "https://www.aozora.gr.jp/cards/000885/files/3325_6558.html"}, {"id": "ndl", "title": "国立国会図書館「近代日本人の肖像・与謝野晶子」", "url": "https://www.ndl.go.jp/portrait/datas/347"}]}, {"title": "上京と、歌集・詩の発表", "text": "1901年、晶子は上京し、寛と結婚します。同年に刊行された『みだれ髪』は、近代の短歌に大きな影響を与えました。1904年には、日露戦争に出征した弟の無事を願う詩『君死にたまふことなかれ』を発表します。この詩をめぐる批判に対し、晶子は自分の真実の思いを歌うことの大切さを主張しました。", "sources": [{"id": "sakai", "title": "堺市「ここがスゴイよ堺の偉人！」与謝野晶子", "url": "https://www.city.sakai.lg.jp/shisei/koho/citypromo/a_side_b_side/sakai_ijin.html"}, {"id": "museum", "title": "さかい利晶の杜「晶子をはぐくんだ堺の文学」", "url": "https://sakai-rishonomori.com/pages/103?b_id=842&detail=1&r_id=384"}, {"id": "aozora", "title": "青空文庫 与謝野晶子 作家別作品リスト", "url": "https://www.aozora.gr.jp/index_pages/person885.html"}, {"id": "essay", "title": "青空文庫『「女らしさ」とは何か』図書カード", "url": "https://www.aozora.gr.jp/cards/000885/card3325.html"}, {"id": "essay-text", "title": "青空文庫『「女らしさ」とは何か』全本文", "url": "https://www.aozora.gr.jp/cards/000885/files/3325_6558.html"}, {"id": "ndl", "title": "国立国会図書館「近代日本人の肖像・与謝野晶子」", "url": "https://www.ndl.go.jp/portrait/datas/347"}]}, {"title": "評論と教育への取り組み", "text": "1912年には夫を追ってヨーロッパへ渡りました。帰国後も社会や教育についての評論を書き、1921年には寛らとともに文化学院の創立にかかわります。短歌を作ること、文章で社会を考えること、人の能力を伸ばす教育に取り組むことが、晶子の活動の中で並行していました。1942年に亡くなるまで、幅広い分野で執筆を続けました。", "sources": [{"id": "sakai", "title": "堺市「ここがスゴイよ堺の偉人！」与謝野晶子", "url": "https://www.city.sakai.lg.jp/shisei/koho/citypromo/a_side_b_side/sakai_ijin.html"}, {"id": "museum", "title": "さかい利晶の杜「晶子をはぐくんだ堺の文学」", "url": "https://sakai-rishonomori.com/pages/103?b_id=842&detail=1&r_id=384"}, {"id": "aozora", "title": "青空文庫 与謝野晶子 作家別作品リスト", "url": "https://www.aozora.gr.jp/index_pages/person885.html"}, {"id": "essay", "title": "青空文庫『「女らしさ」とは何か』図書カード", "url": "https://www.aozora.gr.jp/cards/000885/card3325.html"}, {"id": "essay-text", "title": "青空文庫『「女らしさ」とは何か』全本文", "url": "https://www.aozora.gr.jp/cards/000885/files/3325_6558.html"}, {"id": "ndl", "title": "国立国会図書館「近代日本人の肖像・与謝野晶子」", "url": "https://www.ndl.go.jp/portrait/datas/347"}]}, {"title": "「女らしさ」とは何かを読む", "text": "1921年発表の『「女らしさ」とは何か』では、女性の教育や職業を制限する考え方に反論しています。愛情やつつましさは男性にも必要な性質であり、性別で決めた理想像より、一人の人間としての力を育てることが大切だと論じます。恋を歌った人という紹介だけでは見えにくい、評論家としての晶子を知る入口になる作品です。", "sources": [{"id": "sakai", "title": "堺市「ここがスゴイよ堺の偉人！」与謝野晶子", "url": "https://www.city.sakai.lg.jp/shisei/koho/citypromo/a_side_b_side/sakai_ijin.html"}, {"id": "museum", "title": "さかい利晶の杜「晶子をはぐくんだ堺の文学」", "url": "https://sakai-rishonomori.com/pages/103?b_id=842&detail=1&r_id=384"}, {"id": "aozora", "title": "青空文庫 与謝野晶子 作家別作品リスト", "url": "https://www.aozora.gr.jp/index_pages/person885.html"}, {"id": "essay", "title": "青空文庫『「女らしさ」とは何か』図書カード", "url": "https://www.aozora.gr.jp/cards/000885/card3325.html"}, {"id": "essay-text", "title": "青空文庫『「女らしさ」とは何か』全本文", "url": "https://www.aozora.gr.jp/cards/000885/files/3325_6558.html"}, {"id": "ndl", "title": "国立国会図書館「近代日本人の肖像・与謝野晶子」", "url": "https://www.ndl.go.jp/portrait/datas/347"}]}], "yamanaka-shinya": [{"title": "まず、30秒でわかる説明", "text": "皮膚には皮膚の、神経には神経の仕事をする細胞があります。山中さんたちは、役割をもった細胞から、さまざまな種類の細胞へ育てられるiPS細胞を作る方法を見つけました。 たとえるなら、すでに専門の仕事をしている細胞に、もう一度、進路を選べる状態になってもらうようなもの。その状態の細胞がiPS細胞です。これは仕組みを理解するためのたとえで、細胞に意思があるわけではありません。", "sources": [{"title": "ノーベル賞公式発表", "url": "https://www.nobelprize.org/prizes/medicine/2012/press-release/"}]}, {"title": "1　細胞の成長は、一方通行なの？", "text": "未熟な細胞が、神経や筋肉などの専門的な働きをもつ細胞になることを「分化」といいます。かつては、分化した細胞は、その状態から戻れないと広く考えられていました。 ここで出てくる「核」は、細胞の中にある構造で、体をつくり、働かせる情報を持つDNAを収めています。DNAは「ディー・エヌ・エー」と読みます。1962年、ガードンさんはカエルの幼生であるオタマジャクシの腸の細胞から取り出した核を、核を除いた卵に移す実験を行い、オタマジャクシへ発生することを示しました。専門の仕事をする細胞の核にも、体を作るための情報が残っていたのです。 では、核を別の卵へ移さず、細胞そのものを未熟な状態へ戻せるでしょうか。山中さんたちは、この問題に取り組みました。", "sources": [{"title": "ノーベル賞・受賞研究の科学的背景", "url": "https://www.nobelprize.org/prizes/medicine/2012/advanced-information/"}, {"title": "NHGRI：DNA Fact Sheet", "url": "https://www.genome.gov/about-genomics/fact-sheets/Deoxyribonucleic-Acid-Fact-Sheet"}, {"title": "MedlinePlus Genetics：What is DNA?", "url": "https://medlineplus.gov/genetics/understanding/basics/dna/"}], "diagram": {"src": "assets/yamanaka-04-cell-nucleus-dna.webp", "alt": "皮膚などの核がある細胞の例。細胞の内部に核があり、核の中のDNAを拡大して示す模式図。DNAの一部は核の外にもある。", "caption": "細胞の中の核に、体のつくりや働きに関わる情報をもつDNAが収められています。DNAの一部は核の外にもあります。核がある細胞を例にした模式図で、形や大きさは簡略化しています。", "width": 900, "height": 1030}}, {"title": "2　四つの因子で、細胞の状態を戻した", "text": "2006年、高橋和利さんと山中伸弥さんは、マウスの線維芽細胞に四つの因子を働かせ、iPS細胞を作ったと報告しました。線維芽細胞は、皮膚などで組織を支える細胞です。 四つの因子の名前は、Oct3/4、Sox2、Klf4、c-Myc。遺伝子の働き方を調節するタンパク質を作る遺伝子を導入しました。「山中因子」とも呼ばれます。 ここでいう「戻す」は、細胞の状態を初期化することです。専門用語では「リプログラミング」。四つの因子を入れた細胞が、すべて必ずiPS細胞になるわけではありません。 2007年には、高橋さん、山中さんらの研究グループが、成人の皮膚から得た線維芽細胞でもiPS細胞を作れると報告しました。「2006年はマウス、2007年はヒト」と分けると、研究の進み方がわかります。", "sources": [{"title": "2006年の原著論文", "url": "https://pubmed.ncbi.nlm.nih.gov/16904174/"}, {"title": "ノーベル賞・科学的背景", "url": "https://www.nobelprize.org/prizes/medicine/2012/advanced-information/"}, {"title": "2007年の原著論文", "url": "https://pubmed.ncbi.nlm.nih.gov/18035408/"}], "diagram": {"src": "assets/yamanaka-02-discovery-timeline.webp", "width": 900, "height": 1120, "alt": "1962年のガードンによる核移植、2006年のマウスiPS細胞、2007年のヒトiPS細胞、2012年の共同受賞を示す年表。", "caption": "ガードンの核移植と、山中らの細胞の初期化は、方法の違う研究です。 仕組みを示す模式図。形や大きさは実物と異なります。"}}, {"title": "3　iPS細胞は、どんな細胞？", "text": "iPS細胞の正式な英語名は induced pluripotent stem cells（インデュースト・プルリポテント・ステム・セルズ）です。i は induced（人工的に誘導された）、P は pluripotent（体のさまざまな種類の細胞になれる「多能性」がある）、S は stem に対応します。stem cells は幹細胞（自分と同じ性質の細胞を増やし、別の種類の細胞にもなれる細胞）を意味します。日本語では「人工多能性幹細胞」です。条件を整えることで増やせて、体のさまざまな種類の細胞へ分化させられることが特徴です。 ここで大切なのは「さまざまな細胞になれる」と「何でもできる」を分けること。iPS細胞は受精卵そのものではなく、一個をそのまま育てれば人間になる、という細胞でもありません。", "sources": [{"title": "CiRA・iPS細胞の解説", "url": "https://www.cira.kyoto-u.ac.jp/j/faq/faq_ips.html"}, {"title": "CiRA・多能性と全能性の説明", "url": "https://www.cira.kyoto-u.ac.jp/j/pressrelease/session_2010.html"}], "diagram": {"src": "assets/yamanaka-01-cell-reprogramming.webp", "width": 900, "height": 1090, "alt": "線維芽細胞を初期化してiPS細胞を作り、条件を整えて神経細胞や筋肉の細胞などへ分化させる模式図。", "caption": "役割をもった細胞からiPS細胞へ。目的の細胞を育てるには、さらに別の手順が必要です。 仕組みを示す模式図。形や大きさは実物と異なります。"}}, {"title": "4　この発見は、何に役立つの？", "text": "病気を調べる。 患者さんから提供された細胞でiPS細胞を作り、調べたい種類の細胞へ育てると、病気の特徴の一部を実験室で観察できます。 薬の候補を探す。 そうして作った細胞に薬の候補を試し、働きや毒性を調べる研究に使えます。細胞でよい結果が出ても、人への効果や安全性は別に確かめる必要があります。 たとえば、京都大学の研究グループは2021年、iPS細胞から育てた肺の細胞などを組み合わせ、間質性肺炎の病態を培養皿の中で再現したと報告しました。病気を調べるためのモデルであり、肺そのものを丸ごと作ったという意味ではありません。 失われた働きを補う。 iPS細胞から目的の細胞を作り、移植に使う再生医療への応用もあります。その際は、目的の細胞になりきっていない細胞が残り、腫瘍を作る危険などを調べなければなりません。iPS細胞を作れることと、安全な移植用の細胞を作れることは、別の段階です。", "sources": [{"title": "CiRA・患者さん向け情報", "url": "https://ciraweb2.cira.kyoto-u.ac.jp/j/faq/faq_patient.html"}, {"title": "京都大学・2021年の研究発表", "url": "https://www.kyoto-u.ac.jp/ja/research-news/2021-11-19"}, {"title": "CiRA・未分化細胞を除く研究", "url": "https://www.cira.kyoto-u.ac.jp/j/research/finding/160909-180000.html"}], "diagram": {"src": "assets/yamanaka-03-research-and-validation.webp", "width": 900, "height": 1220, "alt": "iPS細胞から育てた細胞を病気の研究、薬の候補探し、移植用細胞の開発に使い、医療には品質、安全性、効果の検証が必要なことを示す模式図。", "caption": "研究で使えることと、治療として安全で有効なことは別です。病気や製品ごとに検証します。 仕組みを示す模式図。形や大きさは実物と異なります。"}}, {"title": "5-1　ES細胞とiPS細胞の違い", "text": "ES細胞と同じ作り方？ ES細胞は初期の胚から作ります。iPS細胞は皮膚や血液などの体細胞から作れます。性質に共通点はありますが、出発点が違います。", "sources": [{"title": "CiRA・iPS細胞の解説", "url": "https://www.cira.kyoto-u.ac.jp/j/faq/faq_ips.html"}, {"title": "京都大学・導入法の改良", "url": "https://www.kyoto-u.ac.jp/ja/archive/prev/news_data/h/h1/news6/2008/081001_1"}, {"title": "CiRA・ゲノム編集の研究例", "url": "https://www.cira.kyoto-u.ac.jp/j/research/finding/170519-210001.html"}, {"title": "ノーベル賞公式発表", "url": "https://www.nobelprize.org/prizes/medicine/2012/press-release/"}], "diagram": {"src": "assets/yamanaka-06-es-ips-origins.webp", "alt": "ES細胞は初期の胚から細胞を取り出して培養し、iPS細胞は皮膚などの体細胞を初期化して作る。出発点は違うが、どちらもさまざまな細胞へ育つ力があることを示す模式図。", "caption": "ES細胞は、受精卵が分裂してできるごく初期の胚から細胞を取り出し、培養して作ります。iPS細胞は皮膚などの体細胞から作ります。さまざまな種類の細胞になれる性質には共通点がありますが、出発点と作製法は違います。培養などの詳しい手順を省いた模式図です。", "width": 900, "height": 1050}}, {"title": "5-2　初期化とゲノム編集の違い", "text": "遺伝子を狙って書き換える技術？ iPS細胞を作る初期化と、特定のDNA配列を変えるゲノム編集は区別します。ただし、初期のiPS細胞作製法では、導入した遺伝子が細胞のDNAに組み込まれる課題がありました。「初期化ではDNAに一切変化が起きない」と言い切るのも正確ではありません。", "sources": [{"title": "CiRA・iPS細胞の解説", "url": "https://www.cira.kyoto-u.ac.jp/j/faq/faq_ips.html"}, {"title": "京都大学・導入法の改良", "url": "https://www.kyoto-u.ac.jp/ja/archive/prev/news_data/h/h1/news6/2008/081001_1"}, {"title": "CiRA・ゲノム編集の研究例", "url": "https://www.cira.kyoto-u.ac.jp/j/research/finding/170519-210001.html"}, {"title": "ノーベル賞公式発表", "url": "https://www.nobelprize.org/prizes/medicine/2012/press-release/"}], "diagram": {"src": "assets/yamanaka-05-reprogramming-vs-editing.webp", "alt": "初期化は遺伝子の働き方を変えて細胞の状態を戻すことをスイッチのたとえで示す。ゲノム編集はDNAの配列を変えることを説明用文字列で示す。初期のiPS細胞作製では導入遺伝子がDNAに組み込まれた点も注記。", "caption": "初期化は細胞の状態を戻す操作、ゲノム編集はDNAの配列を変える操作として区別します。ただし、初期のiPS細胞作製法では、導入した遺伝子がDNAに組み込まれました。スイッチと文字列は説明のための模式表現です。", "width": 900, "height": 1160}}, {"title": "5-3　人間全体の若返りとは違う", "text": "人間が若返り、不老不死になる？ 受賞研究が示したのは、細胞を多能性のある状態へ戻せることです。人間全体の若返りや、不老不死を実現したという発見ではありません。", "sources": [{"title": "CiRA・iPS細胞の解説", "url": "https://www.cira.kyoto-u.ac.jp/j/faq/faq_ips.html"}, {"title": "京都大学・導入法の改良", "url": "https://www.kyoto-u.ac.jp/ja/archive/prev/news_data/h/h1/news6/2008/081001_1"}, {"title": "CiRA・ゲノム編集の研究例", "url": "https://www.cira.kyoto-u.ac.jp/j/research/finding/170519-210001.html"}, {"title": "ノーベル賞公式発表", "url": "https://www.nobelprize.org/prizes/medicine/2012/press-release/"}]}, {"title": "人に説明するときの、ひとこと", "text": "「山中さんたちは、役割の決まった細胞を、いろいろな細胞へ育てられる状態に戻す方法を見つけた。そのiPS細胞が、病気を調べたり、薬や治療法を開発したりするための大切な道具になったんだよ。」", "sources": [{"title": "ノーベル賞公式発表", "url": "https://www.nobelprize.org/prizes/medicine/2012/press-release/"}]}, {"title": "小さな用語集", "text": "細胞：生き物の体を作る基本の単位。 分化：細胞が専門的な性質や働きをもつようになること。 核：遺伝情報を含むDNAを収める、細胞内の構造。 多能性：体のさまざまな細胞へ分化できる性質。 幹細胞：自分と同じ性質の細胞を増やし、別の種類の細胞にもなれる細胞。 初期化：ここでは、分化した細胞を多能性のある状態へ戻すこと。 培養：細胞が育つ条件を整え、実験室などで育てること。 この記事は発見の意味を学ぶための解説です。個別の治療を勧めるものではありません。治療の承認状況、対象となる病気や受診条件は、本記事では一覧化していません。", "sources": [{"title": "ノーベル賞公式発表", "url": "https://www.nobelprize.org/prizes/medicine/2012/press-release/"}], "citationNote": "資料確認日：2026年11月3日。"}], "kobayashi-takiji": [{"title": "秋田に生まれ、小樽で育つ", "text": "小林多喜二は、『蟹工船』で知られる小説家です。労働者や農民の暮らしと社会の問題を描いた、プロレタリア文学の代表的な作家の一人です。1903年、現在の秋田県大館市川口の農家に生まれ、幼いころに家族と北海道の小樽へ移りました。叔父のパン屋を手伝いながら学び、小樽高等商業学校へ進みました。", "sources": [{"id": "odate-museum", "title": "大館郷土博物館「文学」小林多喜二", "url": "https://www.city.odate.lg.jp/museum/virtual/forerunner/lit"}, {"id": "akita-museum", "title": "秋田県立博物館 アキハクコレクション「小林多喜二」", "url": "https://www.akihaku.jp/digital/collection/contents.php?category=8&lang=&serial_no=105"}, {"id": "otaru-university", "title": "小樽商科大学附属図書館「貴重図書展示会 展示資料解説」（2017年）21頁", "url": "https://www.otaru-uc.ac.jp/htosyo1/annai/2017kicho_rist.pdf#page=22"}]}, {"title": "銀行員として働きながら文学へ", "text": "小樽は、多喜二が育ち、文学と仕事に取り組んだ町です。在学中に読んだ雑誌には、志賀直哉や菊池寛の作品への批評を書き込んだ跡が残っています。1924年に学校を卒業して北海道拓殖銀行に就職し、同じ年に同人誌『クラルテ』を創刊しました。銀行員として働く一方で、文学活動を続けていきます。", "sources": [{"id": "odate-museum", "title": "大館郷土博物館「文学」小林多喜二", "url": "https://www.city.odate.lg.jp/museum/virtual/forerunner/lit"}, {"id": "akita-museum", "title": "秋田県立博物館 アキハクコレクション「小林多喜二」", "url": "https://www.akihaku.jp/digital/collection/contents.php?category=8&lang=&serial_no=105"}, {"id": "otaru-university", "title": "小樽商科大学附属図書館「貴重図書展示会 展示資料解説」（2017年）21頁", "url": "https://www.otaru-uc.ac.jp/htosyo1/annai/2017kicho_rist.pdf#page=22"}]}, {"title": "蟹工船とプロレタリア文学", "text": "1927年には労農芸術家連盟に加わり、翌年、小樽での三・一五事件を題材に『一九二八年三月十五日』を発表して注目を集めました。1929年の代表作『蟹工船』は、蟹工船で働く人々の過酷な状況を描いた小説です。この年には単行本も刊行され、多喜二はプロレタリア文学を代表する作家となりました。", "sources": [{"id": "odate-museum", "title": "大館郷土博物館「文学」小林多喜二", "url": "https://www.city.odate.lg.jp/museum/virtual/forerunner/lit"}, {"id": "akita-museum", "title": "秋田県立博物館 アキハクコレクション「小林多喜二」", "url": "https://www.akihaku.jp/digital/collection/contents.php?category=8&lang=&serial_no=105"}, {"id": "otaru-university", "title": "小樽商科大学附属図書館「貴重図書展示会 展示資料解説」（2017年）21頁", "url": "https://www.otaru-uc.ac.jp/htosyo1/annai/2017kicho_rist.pdf#page=22"}]}, {"title": "北海道を舞台にした作品", "text": "小樽や北海道とのつながりは、ほかの作品にも見られます。『不在地主』は北海道の小作争議を題材にし、『工場細胞』は小樽の運河沿いの製缶工場を舞台にしています。どちらも1930年に単行本が出ました。港や工場、農村で生きる人々を描いた作品を通して、多喜二が関心を向けた社会の姿をたどれます。", "sources": [{"id": "odate-museum", "title": "大館郷土博物館「文学」小林多喜二", "url": "https://www.city.odate.lg.jp/museum/virtual/forerunner/lit"}, {"id": "akita-museum", "title": "秋田県立博物館 アキハクコレクション「小林多喜二」", "url": "https://www.akihaku.jp/digital/collection/contents.php?category=8&lang=&serial_no=105"}, {"id": "otaru-university", "title": "小樽商科大学附属図書館「貴重図書展示会 展示資料解説」（2017年）21頁", "url": "https://www.otaru-uc.ac.jp/htosyo1/annai/2017kicho_rist.pdf#page=22"}]}, {"title": "東京での活動と最期", "text": "1929年に銀行を解雇された多喜二は、翌年に東京へ移りました。1931年には日本共産党に入党し、日本プロレタリア作家同盟の書記長になります。その後は弾圧を避けながら活動を続けましたが、1933年に逮捕され、築地署で拷問を受けて亡くなりました。29歳の生涯でした。", "sources": [{"id": "odate-museum", "title": "大館郷土博物館「文学」小林多喜二", "url": "https://www.city.odate.lg.jp/museum/virtual/forerunner/lit"}, {"id": "akita-museum", "title": "秋田県立博物館 アキハクコレクション「小林多喜二」", "url": "https://www.akihaku.jp/digital/collection/contents.php?category=8&lang=&serial_no=105"}, {"id": "otaru-university", "title": "小樽商科大学附属図書館「貴重図書展示会 展示資料解説」（2017年）21頁", "url": "https://www.otaru-uc.ac.jp/htosyo1/annai/2017kicho_rist.pdf#page=22"}]}], "kawabata-yasunari": [{"title": "大阪に生まれ、茨木で育つ", "text": "川端康成は1899年、大阪市に生まれました。幼いころに両親を亡くし、今の大阪府茨木市にあたる地域で祖父母に育てられます。祖母、そして祖父とも別れ、少年時代から身近な人を失う経験を重ねました。中学校のころには文学に熱中し、小説家を志すようになります。", "sources": [{"title": "茨木市・川端康成略年譜", "url": "https://www.city.ibaraki.osaka.jp/kikou/shimin/bunka/menu/kawabata/ryakunempu.html"}]}, {"title": "東京で学び、仲間と雑誌を作る", "text": "1917年に東京の第一高等学校へ進み、1920年には東京帝国大学に入学します。学生仲間と雑誌「新思潮」を作り、作品を発表しました。1924年の大学卒業後には、横光利一らと「文芸時代」を創刊します。作品を一人で書くだけでなく、仲間と発表の場を作ることも、作家としての出発点でした。", "sources": [{"title": "川端康成記念会・略年表", "url": "https://www.kawabata-kinenkai.org/nenpyo.html"}]}, {"title": "伊豆への旅と『伊豆の踊子』", "text": "1918年、学生だった川端は伊豆を旅し、旅芸人の一行と道連れになります。『伊豆の踊子』の発表は1926年で、翌1927年には同じ題の作品集が出版されました。実際の旅は作品を考える手がかりになりますが、小説の主人公と作者本人をそのまま同じ人と決めることはできません。", "sources": [{"title": "川端康成記念会・略年表", "url": "https://www.kawabata-kinenkai.org/nenpyo.html"}, {"title": "茨木市・川端康成略年譜", "url": "https://www.city.ibaraki.osaka.jp/kikou/shimin/bunka/menu/kawabata/ryakunempu.html"}]}, {"title": "長い時間をかけて育てた『雪国』", "text": "川端は1934年に初めて越後湯沢を訪れ、その年に『雪国』を書き始めます。1935年から部分ごとに発表し、1937年に最初の単行本を刊行しました。その後も書き継ぎ、1947年に『続雪国』を発表します。「何年の作品か」を見るときは、書き始め、最初の発表、本になった年を分けることが大切です。", "sources": [{"title": "川端康成記念会・略年表", "url": "https://www.kawabata-kinenkai.org/nenpyo.html"}]}, {"title": "戦後も書き続け、文学を支える", "text": "戦後には『千羽鶴』『山の音』などを発表しました。1948年には日本ペンクラブの会長となり、作家同士の交流や文学の活動にも携わります。川端の歩みは、よく知られる二作品だけで終わるものではありません。", "sources": [{"title": "国立国会図書館・川端康成", "url": "https://www.ndl.go.jp/portrait/datas/6086/index.html"}]}, {"title": "日本人初のノーベル文学賞", "text": "1968年、川端は日本人として初めてノーベル文学賞を受賞しました。世界に日本の文学を伝えた作家の一人です。1972年4月16日に、72歳で亡くなりました。ここでは人物の歩みと作品の発表記録を紹介し、未確認の小説の結末は載せていません。", "sources": [{"title": "茨木市・川端康成略年譜", "url": "https://www.city.ibaraki.osaka.jp/kikou/shimin/bunka/menu/kawabata/ryakunempu.html"}], "diagram": {"src": "assets/kawabata-life.webp", "alt": "川端康成の歩み。1899年大阪に生まれ、1917年東京へ進学。1924年に文芸時代を創刊し、1926年に伊豆の踊子を発表。1935年から1947年に雪国を書き継ぎ、1968年にノーベル文学賞を受賞、1972年に死去。", "caption": "人物の年表。風景や道具は編集上のイメージで、実在の生家・書斎や小説の場面を再現したものではありません。年の間隔は実際の長さに比例しません。", "width": 1086, "height": 1448}}, {"title": "『雪国』の原作は、いつまで保護される？", "text": "日本での原作小説の著作権は、現行法に基づく通常の計算で、特別な事情がない場合は2042年12月31日まで保護され、2043年1月1日に保護期間が満了します。これは川端康成が単独で書き、実名で公表した原作についての説明です。発表から70年で数えるのではなく、1972年の没年を基に計算します。", "sources": [{"title": "文化庁・保護期間延長のQ&A", "url": "https://www.bunka.go.jp/seisaku/chosakuken/hokaisei/kantaiheiyo_chosakuken/1411890.html?library=true"}, {"title": "国立国会図書館・川端康成", "url": "https://www.ndl.go.jp/portrait/datas/6086/index.html"}, {"title": "新潮社・雪国の書誌情報", "url": "https://www.shinchosha.co.jp/book/100244/"}]}, {"title": "『伊豆の踊子』の原作は、いつまで保護される？", "text": "日本での原作小説の著作権は、同じく通常の計算で、特別な事情がない場合は2042年12月31日まで保護され、2043年1月1日に保護期間が満了します。『雪国』より早く発表された作品ですが、川端康成が単独で書き、実名で公表した原作なので、基準となる没年は同じです。", "sources": [{"title": "文化庁・保護期間延長のQ&A", "url": "https://www.bunka.go.jp/seisaku/chosakuken/hokaisei/kantaiheiyo_chosakuken/1411890.html?library=true"}, {"title": "国立国会図書館・川端康成", "url": "https://www.ndl.go.jp/portrait/datas/6086/index.html"}, {"title": "新潮社・伊豆の踊子の書誌情報", "url": "https://www.shinchosha.co.jp/book/100245/"}], "diagram": {"src": "assets/kawabata-rights-quiet.webp", "alt": "『雪国』『伊豆の踊子』の日本の原作小説の保護期間。川端康成の没年1972年の翌年から70年で、原則2042年12月31日まで保護され、2043年1月1日から保護期間経過後。特別な事情がない場合の通常の計算で、翻訳・写真・映画などの権利は別。", "caption": "二作品の原作について、日本の現行法による通常の保護期間を示す説明図です。特別な事情がない場合の計算であり、具体的な利用時は権利の履歴を確認してください。翻訳・写真・映画などの権利は別に確認する必要があります。", "width": 1086, "height": 1448}}, {"title": "原作と、本に含まれるほかのものは別", "text": "この日付は日本での原作小説についてのものです。翻訳、解説、写真、挿絵、映画などには、それぞれ別の権利があり、同じ日に自由に使えるとは限りません。共同著作は最後に亡くなった著作者を基準にするなど、条件も変わります。外国での保護期間も、その国の制度を確認する必要があります。戦時加算は、戦前に書かれた作品すべてに年数を足す仕組みではありません。作者の国籍だけで決まるものでもなく、過去に誰が権利を持っていたかによって扱いが変わる場合があります。具体的に作品を利用するときは、その権利の履歴や利用する版の条件を確認してください。", "sources": [{"title": "文化庁・保護期間延長のQ&A", "url": "https://www.bunka.go.jp/seisaku/chosakuken/hokaisei/kantaiheiyo_chosakuken/1411890.html?library=true"}, {"title": "著作権情報センター・保護期間のQ&A", "url": "https://www.cric.or.jp/qa/hajime/hajime3.html"}, {"title": "文化庁・法制基本問題小委員会第6回議事録（戦時加算と権利履歴）", "url": "https://www.bunka.go.jp/seisaku/bunkashingikai/chosakuken/hoki/h27_06/"}]}, {"title": "保護期間中でも、人物を知ることはできる", "text": "保護期間は、本文を自由に転載してよいかを考える際の大切な条件です。一方、人物の生涯や作品が発表された年を調べ、独自の言葉で紹介することとは区別できます。本記事は人物紹介と書誌・権利の解説です。両作品の全文を読んだ要約ではありません。", "sources": [{"title": "文化庁・保護期間延長のQ&A", "url": "https://www.bunka.go.jp/seisaku/chosakuken/hokaisei/kantaiheiyo_chosakuken/1411890.html?library=true"}]}], "edgar-allan-poe": [{"title": "詩と短編をつくったアメリカの作家", "text": "エドガー・アラン・ポーは、1809年1月19日にボストンで生まれた作家です。詩や短編小説を書くだけでなく、雑誌の編集や文学批評にも取り組みました。怪奇小説で知られますが、謎を考えて解く探偵小説の発展にも大きな役割を果たしています。", "sources": [{"id": "nps", "title": "米国国立公園局：Edgar Allan Poe", "url": "https://www.nps.gov/people/edgarallanpoe.htm", "kind": "公的史跡運営機関による伝記解説。歴史上の本人の一次文書ではない。", "checked": "生没年月日・出生地・アラン家・教育・職歴を確認。", "checkedAt": "2026-11-03"}, {"id": "museum", "title": "Poe Museum：Poe Biography", "url": "https://poemuseum.org/poe-biography/", "kind": "公式博物館の伝記解説。", "checked": "代表作、婚姻、死因未確定の説明。", "checkedAt": "2026-11-03"}]}, {"title": "育った家と若いころ", "text": "幼くして母を亡くしたポーは、リッチモンドのジョンとフランセス・アラン夫妻に育てられました。正式な養子ではありません。1826年にバージニア大学へ進みますが、学業を続けられず、その後は軍隊にも入りました。1827年には最初の詩集を刊行しています。", "sources": [{"id": "nps", "title": "米国国立公園局：Edgar Allan Poe", "url": "https://www.nps.gov/people/edgarallanpoe.htm", "kind": "公的史跡運営機関による伝記解説。歴史上の本人の一次文書ではない。", "checked": "生没年月日・出生地・アラン家・教育・職歴を確認。", "checkedAt": "2026-11-03"}, {"id": "usps", "title": "米国郵便公社：生誕200年記念資料", "url": "https://about.usps.com/news/national-releases/2009/pr09_005.htm", "kind": "公的機関の記念事業一次発表、伝記部分は解説。", "checked": "モルグ街1841年、黄金虫1843年、ドイルへの影響。切手画像の利用許可とは別。", "checkedAt": "2026-11-03"}], "diagram": {"src": "assets/poe-life-timeline.webp", "alt": "1809年の誕生から1849年までを6項目でたどるポーの年表。", "caption": "ポーの生涯を、代表的な出来事で整理しました。年の間隔は比例していません。机や本は説明のための創作で、本人の遺品や部屋の再現ではありません。 説明のための創作イラスト。歴史上の写真・遺品・原版の再現ではない。", "width": 1086, "height": 1448}}, {"title": "雑誌とともに働く", "text": "1835年、ポーはリッチモンドの雑誌で編集の仕事に就きました。その後、フィラデルフィアやニューヨークでも活動します。創作と批評は、互いに関わる仕事でもありました。自分でも物語を組み立てながら、ほかの作品が読者にどんな印象を与えるのかを考え続けました。", "sources": [{"id": "nps", "title": "米国国立公園局：Edgar Allan Poe", "url": "https://www.nps.gov/people/edgarallanpoe.htm", "kind": "公的史跡運営機関による伝記解説。歴史上の本人の一次文書ではない。", "checked": "生没年月日・出生地・アラン家・教育・職歴を確認。", "checkedAt": "2026-11-03"}, {"id": "composition", "title": "The Philosophy of Composition：1846年4月版", "url": "https://www.eapoe.org/works/essays/philcomp.htm", "kind": "Poe Society公開の原典翻刻。今回確認範囲 pp.163–166、全篇通読とはしない。", "checked": "効果から構成するという著者本人の説明。執筆過程の客観的実況と断定しない。", "checkedAt": "2026-11-03"}]}, {"title": "推理小説につながる仕事", "text": "1841年の『モルグ街の殺人』には、考える力で事件の謎に迫るデュパンが登場します。この人物を描いた作品群は、のちにシャーロック・ホームズを生むコナン・ドイルにも影響を与えました。デュパンはポー本人ではなく、小説の中の架空の人物です。", "sources": [{"id": "usps", "title": "米国郵便公社：生誕200年記念資料", "url": "https://about.usps.com/news/national-releases/2009/pr09_005.htm", "kind": "公的機関の記念事業一次発表、伝記部分は解説。", "checked": "モルグ街1841年、黄金虫1843年、ドイルへの影響。切手画像の利用許可とは別。", "checkedAt": "2026-11-03"}]}, {"title": "『大鴉』と言葉の響き", "text": "1845年に発表された詩『大鴉』は、ポーの名を広く知られるものにしました。大切な人を失った語り手の部屋へ、黒い鳥が現れます。同じ返事が繰り返されても、語り手の問いや気持ちが変わるため、言葉の重さも変わって感じられます。詩の語り手と作者の人生を、そのまま同じものにはできません。", "sources": [{"id": "museum", "title": "Poe Museum：Poe Biography", "url": "https://poemuseum.org/poe-biography/", "kind": "公式博物館の伝記解説。", "checked": "代表作、婚姻、死因未確定の説明。", "checkedAt": "2026-11-03"}, {"id": "raven", "title": "The Raven：1845年1月29日 Evening Mirror 版", "url": "https://eapoe.org/WORKS/poems/ravenb.htm", "kind": "Poe Society公開の原典翻刻。本文全18連を読了。", "checked": "喪失と反復、扉上のパラス胸像。書誌注で先行掲載順の問題を確認。", "checkedAt": "2026-11-03"}]}, {"title": "読後に残る印象を考える", "text": "1846年の評論 The Philosophy of Composition で、ポーは『大鴉』の構成について説明しています。まず読者に残したい効果を考え、長さや響き、場面を選ぶという考え方です。これは著者が語る創作論として読むもので、実際の執筆の一瞬一瞬が、その通りだったと証明する記録ではありません。", "sources": [{"id": "composition", "title": "The Philosophy of Composition：1846年4月版", "url": "https://www.eapoe.org/works/essays/philcomp.htm", "kind": "Poe Society公開の原典翻刻。今回確認範囲 pp.163–166、全篇通読とはしない。", "checked": "効果から構成するという著者本人の説明。執筆過程の客観的実況と断定しない。", "checkedAt": "2026-11-03"}], "diagram": {"src": "assets/poe-writing-forms.webp", "alt": "詩・短編・批評の三つに代表作を分けた図。", "caption": "詩・短編・批評という三つの仕事を、代表作とともに整理しました。鳥は『大鴉』を表す象徴、本や紙は編集上のイメージで、原版や自筆資料の複製ではありません。 説明のための創作イラスト。歴史上の写真・遺品・原版の再現ではない。", "width": 1086, "height": 1448}}, {"title": "日本での身近なつながり", "text": "日本の推理作家・江戸川乱歩の筆名は、エドガー・アラン・ポーの名に由来します。乱歩はポーの作品に強くひかれていました。二人は生きた時代が違い、直接教わった関係ではありません。名前からも、作品を通じて海を越えて届いた影響がうかがえます。", "sources": [{"id": "ndl", "title": "国立国会図書館：江戸川乱歩", "url": "https://www.ndl.go.jp/portrait/datas/4128/", "kind": "公的所蔵機関の人物解説。", "checked": "筆名がポーに由来。直接会った／師弟だったとはしない。", "checkedAt": "2026-11-03"}], "diagram": {"src": "assets/poe-japan-connection.webp", "alt": "ポーの名前が江戸川乱歩の筆名の由来になったことを示す図。", "caption": "江戸川乱歩の筆名はポーに由来します。作品を通した影響であり、二人の面会や直接の師弟関係を示すものではありません。 説明のための創作イラスト。歴史上の写真・遺品・原版の再現ではない。", "width": 1086, "height": 1448}}, {"title": "作品と伝説を分けて読む", "text": "ポーは1849年10月7日、ボルティモアで40年の生涯を閉じました。死に至った詳しい事情には未解明の点があり、特定の説を確定した事実のようには扱えません。恐ろしい物語を書いたからといって、作中の犯罪や語り手の心理を、作者の実体験として読むことも避けたいところです。", "sources": [{"id": "nps", "title": "米国国立公園局：Edgar Allan Poe", "url": "https://www.nps.gov/people/edgarallanpoe.htm", "kind": "公的史跡運営機関による伝記解説。歴史上の本人の一次文書ではない。", "checked": "生没年月日・出生地・アラン家・教育・職歴を確認。", "checkedAt": "2026-11-03"}, {"id": "museum", "title": "Poe Museum：Poe Biography", "url": "https://poemuseum.org/poe-biography/", "kind": "公式博物館の伝記解説。", "checked": "代表作、婚姻、死因未確定の説明。", "checkedAt": "2026-11-03"}]}], "oguri-mushitaro": [{"title": "神田で育ち、印刷の仕事へ", "text": "小栗虫太郎は1901年3月14日、東京市神田旅籠町、現在の東京都千代田区外神田に生まれました。1913年に東京女子高等師範学校附属小学校を卒業し、1918年には京華中学校を卒業して樋口電気商会へ入ります。1920年にとみと結婚。1922年9月には四海堂印刷所を設立しました。印刷所を閉じたのは1926年9月です。会社勤めと印刷業を経たのち、翌年には別名で小説を発表することになります。", "sources": [{"id": "oguri-chronology", "title": "小栗虫太郎公式サイト「小栗虫太郎とは／その生涯」", "url": "https://oguri-mushitaro.jp/about-oguri/", "checkedAt": "2026-11-05"}]}, {"title": "別名での発表から『完全犯罪』へ", "text": "1927年10月、虫太郎は織田清七という名で「或る検事の遺書」を『探偵趣味』に発表しました。1933年春に書いた「完全犯罪」は、甲賀三郎の推薦を受けて『新青年』へ持ち込まれます。横溝正史が病気で予定原稿を書けなくなり、その代わりとして同年7月号に掲載されました。公式年譜はこれを作家デビューとしています。その年の10月には「後光殺人事件」、11月には「聖アレキセイ寺院の惨劇」も同誌に載り、発表が続きました。", "sources": [{"id": "oguri-chronology", "title": "小栗虫太郎公式サイト「小栗虫太郎とは／その生涯」", "url": "https://oguri-mushitaro.jp/about-oguri/", "checkedAt": "2026-11-05"}, {"id": "oguri-works", "title": "小栗虫太郎公式サイト「著作目録（小説）」", "url": "https://oguri-mushitaro.jp/work-list/work-list01/", "checkedAt": "2026-11-05"}]}, {"title": "『黒死館殺人事件』の連載と刊行", "text": "1934年4月から12月にかけて、『新青年』に「黒死館殺人事件」を連載しました。「完全犯罪」が掲載された翌年に、九か月にわたる連載へ進んだことになります。1935年5月には新潮社から単行本が刊行されました。国立国会図書館にも、新潮社、昭和10年刊、446ページの本として記録されています。1937年には結末部分が「父よ、我も人の子なり」という題で『シュピオ』5月号に再録され、別の雑誌でも読者に届けられました。", "sources": [{"id": "oguri-chronology", "title": "小栗虫太郎公式サイト「小栗虫太郎とは／その生涯」", "url": "https://oguri-mushitaro.jp/about-oguri/", "checkedAt": "2026-11-05"}, {"id": "oguri-works", "title": "小栗虫太郎公式サイト「著作目録（小説）」", "url": "https://oguri-mushitaro.jp/work-list/work-list01/", "checkedAt": "2026-11-05"}, {"id": "oguri-first-book", "title": "小栗虫太郎公式サイト「黒死館殺人事件」新潮社1935年5月刊", "url": "https://oguri-mushitaro.jp/books/754/", "checkedAt": "2026-11-05"}, {"id": "ndl-first-book", "title": "国立国会図書館サーチ『黒死館殺人事件』新潮社、昭和10年（書誌ID 000000791515）", "url": "https://ndlsearch.ndl.go.jp/books/R100000002-I000000791515", "checkedAt": "2026-11-05"}]}, {"title": "一冊の外にも広がる作品", "text": "『黒死館殺人事件』の前後にも、虫太郎はさまざまな雑誌に作品を発表しています。1934年1月に「夢殿殺人事件」が『改造』、3月18日に「失楽園殺人事件」が『週刊朝日』へ掲載されました。1935年6、7月には「折鶴物語」を『モダン日本』に発表。1936年5月から9月には「二十世紀鉄仮面」を『新青年』に連載しています。『新青年』を中心としながら、掲載先は総合雑誌や週刊誌にも広がっていました。", "sources": [{"id": "oguri-works", "title": "小栗虫太郎公式サイト「著作目録（小説）」", "url": "https://oguri-mushitaro.jp/work-list/work-list01/", "checkedAt": "2026-11-05"}]}, {"title": "作家同士のつながりと雑誌づくり", "text": "1936年下半期、虫太郎は第4回直木賞の候補となりました。翌1937年には海野十三、木々高太郎とともに、探偵小説専門誌『シュピオ』の創刊に関わります。同じ年には「地蟲」を『新青年』、『破獄囚「禿げ鬘」』を『改造』、「咳をする兎」を『日本評論』へ発表しました。作品を書くだけでなく、仲間と雑誌を立ち上げる活動にも参加しながら、複数の媒体で執筆を続けた時期です。", "sources": [{"id": "oguri-chronology", "title": "小栗虫太郎公式サイト「小栗虫太郎とは／その生涯」", "url": "https://oguri-mushitaro.jp/about-oguri/", "checkedAt": "2026-11-05"}, {"id": "oguri-works", "title": "小栗虫太郎公式サイト「著作目録（小説）」", "url": "https://oguri-mushitaro.jp/work-list/work-list01/", "checkedAt": "2026-11-05"}]}, {"title": "戦時下の移動と、残された作品を読む", "text": "1941年11月、虫太郎は陸軍報道班員としてマレーへ赴き、1942年に帰国しました。1945年には長野県へ疎開し、1946年2月10日に同県で亡くなっています。神田で生まれ、印刷所を営み、探偵小説を発表してきた生涯の終わりには、戦時下の海外派遣と国内の疎開がありました。1927年の別名による発表から、1930年代の相次ぐ執筆や雑誌づくりまで、その仕事は作品と掲載誌の記録に残されています。", "sources": [{"id": "oguri-chronology", "title": "小栗虫太郎公式サイト「小栗虫太郎とは／その生涯」", "url": "https://oguri-mushitaro.jp/about-oguri/", "checkedAt": "2026-11-05"}]}]};
function inlineScene(x,index){const a=(x.inlineIllustrations||[x.inlineIllustration]).filter(Boolean).find(a=>a.afterParagraph===index+1);if(!a)return '';return `<figure class="inline-illustration"><img src="${esc(a.src)}" width="${a.width}" height="${a.height}" alt="${esc(a.alt)}" loading="lazy" decoding="async"><figcaption>${bodyText(x,a.caption)}</figcaption></figure>`}
function summaryOpeningScene(x){const scenes=x.inlineIllustrations||[x.inlineIllustration];if(!Array.isArray(scenes))return '';const matches=scenes.filter(a=>a&&a.afterParagraph===0);if(matches.length!==1)return '';const a=matches[0];if(!['src','alt','caption'].every(k=>typeof a[k]==='string'&&a[k].trim())||!Number.isSafeInteger(a.width)||a.width<=0||!Number.isSafeInteger(a.height)||a.height<=0)return '';return inlineScene(x,-1)}
function summaryParagraphs(x){const seen=new Set(),readings=x.summaryReadings||{},words=Object.keys({...x.bodyReadings,...readings}).sort((a,b)=>b.length-a.length);return summaryOpeningScene(x)+x.synopsisSummary.map((value,index)=>{const renderSegment=value=>{let out='',i=0;while(i<value.length){const word=words.find(w=>value.startsWith(w,i));if(word){const info=readings[word];if(info){out+=seen.has(info.key)?esc(word):rubyText(word,info.reading);seen.add(info.key)}else{out+=rubyText(word,x.bodyReadings[word])}i+=word.length}else{out+=esc(value[i]);i++}}return out};const out=geographicBodyText(x,"summary",index,value,renderSegment);return `<p class="bodytext">${out}</p>`+inlineScene(x,index)}).join('')}
