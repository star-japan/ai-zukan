geCaption": "人物を描いたAIイラスト（写真ではありません）"}, {"id": "andersen", "name": "アンデルセン", "reading": "あんでるせん", "cat": "person", "sub": "1805–1875｜童話・小説・詩の作家", "motif": "book", "intro": "昔話を語り直すだけでなく、新しい童話を作り、詩や小説、旅行記も書いたデンマークの作家です。", "gist": "舞台を夢見た少年から、童話や小説を書く作家へ。昔話の語り直しと自分で作った物語の両方を残し、旅も重ねました。", "people": [], "theme": "", "memory": "", "links": ["uglyduckling", "mermaid", "emperors-new-clothes", "little-match-girl", "snow-queen"], "sources": [{"title": "南デンマーク大学アンデルセン研究センター・短い伝記", "url": "https://andersen.sdu.dk/liv/biografi/index_e.html"}, {"title": "デンマーク王立図書館・アンデルセンの生涯", "url": "https://www.kb.dk/en/inspiration/hans-christian-andersens-manuscripts-and-letters/life-hans-christian-andersen"}, {"title": "南デンマーク大学アンデルセン研究センター・教育", "url": "https://andersen.sdu.dk/liv/biografi/skole_e.html"}, {"title": "南デンマーク大学アンデルセン研究センター・童話", "url": "https://andersen.sdu.dk/liv/biografi/eventyr_e.html"}, {"title": "南デンマーク大学アンデルセン研究センター・旅行記", "url": "https://andersen.sdu.dk/liv/biografi/rejseboeger_e.html"}, {"title": "Project Gutenberg Canada：M. R. James英訳全文・版情報", "url": "https://www.gutenbergca.gutenbergcanada.ca/ebooks/andersen-ugly/andersen-ugly-00-h.html"}, {"title": "Wikisource・Paull英訳「The Little Mermaid」全文", "url": "https://en.wikisource.org/wiki/Hans_Andersen's_Fairy_Tales/The_Little_Mermaid"}, {"title": "Wikisource・Paull英訳当該話全文", "url": "https://en.wikisource.org/wiki/Hans_Andersen's_Fairy_Tales/The_Emperor's_New_Clothes"}], "bodyReadings": {"童話": "どうわ", "戯曲": "ぎきょく", "即興詩人": "そっきょうしじん", "刊行": "かんこう", "昔話": "むかしばなし", "故郷": "こきょう", "洗濯": "せんたく", "俳優": "はいゆう", "踊り手": "おどりて", "資格": "しかく", "小冊子": "しょうさっし", "旅行記": "りょこうき", "観察": "かんさつ"}, "checkedDate": "2026年11月2日", "primaryCategory": "person", "genreLabel": "人物", "sourceNote": "1835年は童話小冊子の刊行を始めた年で、初めて文章や童話を書いた年ではありません。1828年の試験合格を大学卒業とは記していません。作品の比較は独自の読書案内で、作者が語った創作意図や、登場人物が作者そのものであるとの断定ではありません。", "authorTextOnly": true, "portraitNote": "この紹介には本人の肖像は掲載していません。"}, {"id": "anne-green-gables", "name": "赤毛のアン", "reading": "あかげのあん", "intro": "男の子を迎えるはずだった農場に、十一歳の少女アンがやって来ます。豊かな想像力とおしゃべりで周囲を驚かせながら、家族や友達との関係を育てていく物語です。", "gist": "居場所を求めて来た少女が、失敗や学びを重ね、家族と友達に支えられながら、自分の進む道を選ぶ。", "bodyReadings": {"赤毛": "あかげ", "兄妹": "きょうだい", "農場": "のうじょう", "農作業": "のうさぎょう", "伝言": "でんごん", "子守": "こもり", "孤児院": "こじいん", "来歴": "らいれき", "衝突": "しょうとつ", "石板": "せきばん", "不公平": "ふこうへい", "果実酒": "かじつしゅ", "交際": "こうさい", "看病": "かんびょう", "誤解": "ごかい", "仕立て": "したて", "袖": "そで", "朗読": "ろうどく", "学院": "がくいん", "教員資格": "きょういんしかく", "奨学金": "しょうがくきん", "帰省": "きせい", "貯金": "ちょきん", "破綻": "はたん", "急死": "きゅうし", "失明": "しつめい", "進路": "しんろ", "意地": "いじ"}, "sources": [{"title": "Wikisource・英語原典全38章と版表示", "url": "https://en.wikisource.org/wiki/Anne_of_Green_Gables_(1908)"}, {"title": "L. M. Montgomery Institute・作者と1908年の刊行", "url": "https://lmmontgomery.ca/about/l-m-montgomery/"}], "checkedDate": "2026年11月2日", "sourceNote": "1908年刊の第一作を扱います。参照した英語本文は、Wikisourceに収録されたL・C・ペイジ社版の転記で、奥付には1909年第十一刷までの表示があります。現代の日本語訳や映像版、続編の出来事は用いていません。物語の説明と読み方は、この図鑑による独自の日本語解説です。", "termNote": "グリーン・ゲイブルズは、アンを迎える兄妹が暮らす家と農場の名前です。石板は、紙の代わりに文字や計算を書いて使った学用品。クイーン学院は、この物語でアンたちが教員資格を取るために学ぶ学校で、その先に目指すレドモンド大学とは別です。奨学金は、進学や勉強の費用を支えるお金です。", "cat": "literature", "primaryCategory": "world-literature", "genreLabel": "海外文学", "genre": "world-classic", "motif": "book", "sub": "L・M・モンゴメリ｜1908年初刊行", "people": [["アン・シャーリー", "十一歳でグリーン・ゲイブルズへ来る少女。想像力が豊かで、よく話す。物語の中で十六歳頃まで成長する。"], ["マシュウ・カスバート", "マリラの兄。農場で働く、口数の少ない人。駅へアンを迎えに行き、温かく見守る。"], ["マリラ・カスバート", "マシュウの妹。兄と暮らし、アンを育てる。厳しく教えるが、自分の間違いも認める。"], ["ダイアナ・バリー", "アンの近所に住む同じ年頃の少女。アンと親友になる。"], ["ギルバート・ブライス", "アンより少し年上の同級生。初めはアンを怒らせるが、勉強で競い合う相手になる。"], ["レイチェル・リンド夫人", "カスバート兄妹の近所に住む女性。思ったことをはっきり言い、やがてアンを助ける。"], ["ステイシー先生", "学校に新しく来る女性の先生。アンの学ぶ力を伸ばし、進学を励ます。"]], "synopsisSummary": ["カナダのプリンス・エドワード島。農場「グリーン・ゲイブルズ」で暮らすマシュウとマリラは、年を取った兄と妹です。二人は農作業を手伝う男の子を迎えるつもりでした。ところが、伝言が食い違い、駅で待っていたのは十一歳の少女アンです。迎えに来たマシュウは、よく話し、景色に心を躍らせるアンに親しみを感じ、家へ連れ帰ります。", "男の子ではないから帰すと聞き、アンは泣きます。幼い時に両親を失い、よその家で子守をし、孤児院へ移ったアンは、自分の家を強く求めていました。マリラはその来歴を聞き、別の家でまた働かされそうな姿を見て、アンを育てると決めます。厳しいマリラと口数の少ないマシュウの家に、アンのおしゃべりや空想が広がります。近所のリンド夫人と衝突することもありますが、謝り合い、少しずつ周囲との関係を作っていきます。", "アンは近所の少女ダイアナと親友になり、学校にも通い始めます。一方、同級生のギルバートに赤毛をからかわれ、怒って石板で彼をたたいてしまいます。ギルバートが謝っても、アンは許そうとしません。勉強ではギルバートに負けまいと努力し、二人は成績を競うようになります。", "暮らしの中では失敗も起こります。アンは甘い飲み物と果実酒を取り違えてダイアナに出し、ダイアナの母に交際を禁じられます。しかし、ダイアナの幼い妹が病気になった夜、アンは子守の経験を生かして看病し、マシュウは医者を呼びに走ります。妹は助かり、母も誤解を認め、二人はまた遊べるようになります。時がたち、あるクリスマスには、マシュウがリンド夫人に仕立ててもらった、袖のふくらんだ茶色の服を贈ります。アンは、待ち望んだ服を受け取り、感激します。", "新しいステイシー先生は、アンの作文や朗読の力を伸ばし、進学も後押しします。数年の勉強を経て、アンとギルバートは同点首位でクイーン学院の入試に合格。アンは家を離れ、教師になるための勉強をします。一年で教員資格を取り、さらに大学へ進むための奨学金も得ました。マシュウとマリラは成長したアンを誇りに思い、アンも新しい将来を楽しみにします。", "ところが帰省後、もともと心臓の弱かったマシュウが、貯金を預けた銀行の破綻を知った朝に急死します。アンとマリラは、深い悲しみを分かち合います。マリラは目も悪くし、無理を続ければ失明すると告げられました。貯金も失い、一人では農場を続けられないと家を売ろうとします。そこでアンは大学進学を見送り、農場を貸し、教師として働きながらマリラと暮らす道を選びます。学ぶことまでやめるのではなく、自宅で勉強を続ける計画です。", "アンが家の近くで働きたいと知ったギルバートは、自分が教える予定だったアヴォンリーの学校の仕事を譲り、別の村で教えることにします。夕暮れの道で会ったアンは、自分から手を差し出して感謝を伝えます。長く意地を張ってきた二人は、ようやく友人になりました。思い描いた通りの進路ではなくても、大切な家を守り、人に支えられ、自分も人を支えながら学んでいく。アンは、まだ見えないこれからの暮らしに希望を持ちます。"], "summaryHeading": "要約", "links": ["lesmiserables", "uglyduckling", "l-m-montgomery"], "characterGallery": [{"name": "アン・シャーリー", "role": "十一歳でグリーン・ゲイブルズへ来る少女。想像力が豊かで、よく話す。物語の中で十六歳頃まで成長する。", "portraits": [{"src": "assets/anne-face-young.webp", "label": "来たころ・十一歳", "alt": "アン・シャーリー：来たころ・十一歳の人物イメージ", "width": 500, "height": 500}, {"src": "assets/anne-face-grown.webp", "label": "物語の終わり頃・十六歳", "alt": "アン・シャーリー：物語の終わり頃・十六歳の人物イメージ", "width": 500, "height": 500}], "wide": true}, {"name": "マシュウ・カスバート", "role": "マリラの兄。農場で働く、口数の少ない人。駅へアンを迎えに行き、温かく見守る。", "portraits": [{"src": "assets/anne-face-matthew.webp", "label": "アンを迎えたころ", "alt": "マシュウ・カスバート：アンを迎えたころの人物イメージ", "width": 500, "height": 500}]}, {"name": "マリラ・カスバート", "role": "マシュウの妹。兄と暮らし、アンを育てる。厳しく教えるが、自分の間違いも認める。", "portraits": [{"src": "assets/anne-face-marilla.webp", "label": "アンを育てる人", "alt": "マリラ・カスバート：アンを育てる人の人物イメージ", "width": 500, "height": 500}]}, {"name": "ダイアナ・バリー", "role": "アンの近所に住む同じ年頃の少女。アンと親友になる。", "portraits": [{"src": "assets/anne-face-diana.webp", "label": "アンの親友・子どものころ", "alt": "ダイアナ・バリー：アンの親友・子どものころの人物イメージ", "width": 500, "height": 500}]}, {"name": "ギルバート・ブライス", "role": "アンより少し年上の同級生。初めはアンを怒らせるが、勉強で競い合う相手になる。", "portraits": [{"src": "assets/anne-face-gilbert.webp", "label": "学校で出会ったころ", "alt": "ギルバート・ブライス：学校で出会ったころの人物イメージ", "width": 500, "height": 500}]}, {"name": "レイチェル・リンド夫人", "role": "カスバート兄妹の近所に住む女性。思ったことをはっきり言い、やがてアンを助ける。", "portraits": [{"src": "assets/anne-face-rachel.webp", "label": "近所のリンド夫人", "alt": "レイチェル・リンド夫人：近所のリンド夫人の人物イメージ", "width": 500, "height": 500}]}, {"name": "ステイシー先生", "role": "学校に新しく来る女性の先生。アンの学ぶ力を伸ばし、進学を励ます。", "portraits": [{"src": "assets/anne-face-stacy.webp", "label": "アンを教える先生", "alt": "ステイシー先生：アンを教える先生の人物イメージ", "width": 500, "height": 500}]}], "inlineIllustrations": [{"afterParagraph": 1, "src": "assets/anne-station-meeting-scene.webp", "alt": "男の子を迎えるはずだったマシュウ。駅で待つアンと出会い、ひとまず家へ連れ帰ります。", "caption": "男の子を迎えるはずだったマシュウ。駅で待つアンと出会い、ひとまず家へ連れ帰ります。", "width": 1200, "height": 800}, {"afterParagraph": 4, "src": "assets/anne-puffed-sleeves-gift-scene.webp", "alt": "マシュウから、待ち望んだ袖のふくらんだ服をもらうアン。日々の暮らしの中で、家族との結びつきが育ちます。", "caption": "マシュウから、待ち望んだ袖のふくらんだ服をもらうアン。日々の暮らしの中で、家族との結びつきが育ちます。", "width": 1200, "height": 800}, {"afterParagraph": 7, "src": "assets/anne-gilbert-friendship-scene.webp", "alt": "学校の仕事を譲ってくれたギルバートに、アンが手を差し出します。二人はようやく友人になります。", "caption": "学校の仕事を譲ってくれたギルバートに、アンが手を差し出します。二人はようやく友人になります。", "width": 1200, "height": 800}], "characterGalleryNote": "人物の顔立ちや衣服、建物などの細部は、作品の記述をもとにした創作です。アンの二つの姿は、同じ人物の子どものころと成長後を描き分けています。既存映画・アニメ・絵本のデザインを使用しません。", "image": "assets/anne-station-meeting-scene.webp", "imageAlt": "駅で十一歳のアンを迎えるマシュウ", "headerCaption": "男の子を迎えるはずだったマシュウ。駅で待つアンと出会い、ひとまず家へ連れ帰ります。"}, {"id": "hamlet", "name": "ハムレット", "reading": "はむれっと", "intro": "父を亡くしたデンマークの王子の前に、父の姿をした亡霊が現れます。叔父に殺されたという訴えは本当なのか。王子は周囲の言葉や振る舞いを疑い、真相を確かめようとします。", "gist": "父の死を確かめようとする王子が、復讐と疑いの中で周囲を傷つけ、自らも悲劇に巻き込まれる。", "bodyReadings": {"先王": "せんおう", "亡霊": "ぼうれい", "叔父": "おじ", "王妃": "おうひ", "再婚": "さいこん", "復讐": "ふくしゅう", "真相": "しんそう", "正気": "しょうき", "旧友": "きゅうゆう", "動揺": "どうよう", "上演": "じょうえん", "確信": "かくしん", "王位": "おうい", "処刑": "しょけい", "海賊": "かいぞく", "溺死": "できし", "葬儀": "そうぎ", "剣術": "けんじゅつ", "杯": "さかずき", "刃": "やいば", "統治者": "とうちしゃ", "仇": "かたき", "戯曲": "ぎきょく"}, "sources": [{"title": "Wikisource・第一フォリオ本文（1910年複製版の転記）", "url": "https://en.wikisource.org/wiki/Shakespeare_-_First_Folio_facsimile_(1910)/The_Tragedy_of_Hamlet"}, {"title": "Folger Shakespeare Library・1603年／1604–05年／1623年の版の違い", "url": "https://www.folger.edu/explore/shakespeares-works/hamlet/an-introduction-to-this-text/"}, {"title": "University of Victoria・第一フォリオ旧綴り転記（第4幕第2場の補助確認）", "url": "https://internetshakespeare.uvic.ca/doc/Ham_F1/"}], "sourceNote": "最初の刊本は1603年ですが、ここでは1623年の第一フォリオに収められた本文を扱います。参照したのは1910年Methuen社複製版のWikisource転記で、一部の幕・場の区分は後から補われています。取得できなかった第4幕第2場だけは、大学公開の同じ第一フォリオ本文の転記を補助に確認しました。現代日本語訳や映像版は用いず、この図鑑独自の日本語で解説しています。", "termNote": "戯曲は、舞台で演じるために台詞や動作を書いた作品です。先王は前の王、亡霊は亡くなった人の姿で現れる霊。ここでは作品中の出来事として説明しています。オフィーリアの死は王妃の報告などで伝えられ、本人の意図は断定していません。", "checkedDate": "2026年11月2日", "cat": "literature", "primaryCategory": "world-literature", "genreLabel": "海外文学", "genre": "world-classic", "motif": "book", "sub": "ウィリアム・シェイクスピア｜1603年初刊行／採用本文1623年版", "people": [["ハムレット", "デンマークの王子。亡くなった父の死の真相を調べ、叔父への復讐を考える。"], ["先王の亡霊", "ハムレットの父の姿をした霊。弟に殺されたと語り、息子に復讐を求める。"], ["クローディアス", "先王の弟で、ハムレットの叔父。新しい王となり、兄の妻だったガートルードと結婚した。"], ["ガートルード", "ハムレットの母である王妃。夫の死後、その弟クローディアスと再婚した。"], ["ホレイショー", "ハムレットが信頼する友人。王の反応を一緒に見届け、最後には真相を伝える役目を託される。"], ["オフィーリア", "ポローニアスの娘で、レアティーズの妹。ハムレットを思うが、父の指示と王子の言動に苦しむ。"], ["ポローニアス", "王に仕える年長の人物。オフィーリアとレアティーズの父。王子の様子を探ろうとする。"], ["レアティーズ", "ポローニアスの息子で、オフィーリアの兄。父を失い、ハムレットへの復讐を求める。"], ["ローゼンクランツとギルデンスターン", "ハムレットの旧友二人。王の依頼で王子の様子を探り、イングランド行きに付き添う。"], ["フォーティンブラス", "ノルウェーの王子。終幕でデンマークへ到着し、国を引き受けようとする。"]], "synopsisSummary": ["デンマークの王子ハムレットは、父である先王の死を悲しんでいます。父の弟クローディアスが新しい王となり、母ガートルードは、その叔父と早くも再婚しました。ある夜、友人ホレイショーに知らせを受けたハムレットの前に、父の姿をした亡霊が現れます。亡霊は、弟に殺されたと語り、復讐を求めます。ただし、母には手を下さないよう言い残します。", "ハムレットは、正気を失ったように振る舞いながら、叔父を探ろうとします。しかし、亡霊の言葉だけで殺人の真相を決めてよいのか、迷いもあります。王は王子の旧友ローゼンクランツとギルデンスターンを呼び、その様子を探らせます。王に仕えるポローニアスは、自分の娘オフィーリアへの恋が原因だと考えます。オフィーリアはハムレットと心を通わせていましたが、父の命令で手紙や訪問を断っていました。仕組まれた面会でハムレットから激しく拒まれ、彼女も苦しみます。", "旅の役者たちが来ると、ハムレットは、父が殺されたという話に似た劇を叔父に見せる計画を立てます。信頼するホレイショーにも、王の反応を見てほしいと頼みました。劇の途中、クローディアスは動揺して席を立ち、灯りを求めて退出し、上演は中断されます。ハムレットは疑いを確信へ変えます。その後、王は一人で兄殺しの罪を認めますが、王位や王妃を手放せず、本心から悔い改められません。祈る姿を見たハムレットは、今殺せば叔父を天国へ送ってしまうと考え、復讐を見送ります。", "次にハムレットは母の部屋へ行き、再婚を責めます。会話を盗み聞きしていたポローニアスが壁掛けの陰で声を上げると、ハムレットは相手を確かめずに刺し、殺してしまいます。叔父の罪を確かめようとしていた王子自身が、別の家族から父を奪ったのです。王はハムレットを危険と見なし、二人の旧友を付き添わせてイングランドへ送ります。その二人には、到着後ハムレットを処刑させる秘密の手紙を持たせていました。", "船の中で手紙を見つけたハムレットは、自分の代わりに手紙の運び手二人を処刑する内容へ書き換えます。翌日、船が海賊に襲われた際、ハムレットだけが相手の船へ乗り移って捕らわれます。海賊は見返りを期待して彼を助け、ハムレットはデンマークへ戻ります。二人の旧友はそのままイングランドへ向かい、後に処刑されたことが知らされます。", "その間、父を失ったオフィーリアは、まとまりのない話や歌を口にするようになります。兄レアティーズはフランスから戻り、父の死への復讐を求めます。さらに、妹が川で溺死したと王妃から知らされます。帰国したハムレットも葬儀で彼女の死を知り、レアティーズと激しく争います。クローディアスはレアティーズの怒りを利用し、剣術の試合を装ってハムレットを殺す計画を進めます。", "試合では、レアティーズの剣に毒が仕込まれ、王もハムレットのために毒入りの杯を用意していました。ところが、その杯を母ガートルードが飲んでしまいます。試合中には剣が入れ替わり、ハムレットとレアティーズの両方が毒のある刃で傷を負います。レアティーズは企みと王の責任を明かし、ハムレットはクローディアスを殺します。ハムレットとレアティーズは最後に互いの罪を許し合いますが、母もレアティーズもハムレットも命を失います。", "死の間際、ハムレットはホレイショーに、生きて真相を伝えてほしいと頼みます。また、ノルウェーの王子フォーティンブラスを次の統治者として支持する意志を残します。到着したフォーティンブラスに、ホレイショーは何が起きたのかを説明しようとします。父の仇は討たれても、大切な人々は戻りません。残された人が、悲劇の事情と国のこれからを引き受けるところで幕が閉じます。"], "summaryHeading": "要約", "links": ["shakespeare", "romeoandjuliet"], "characterGallery": [{"name": "ハムレット", "role": "デンマークの王子。亡くなった父の死の真相を調べ、叔父への復讐を考える。", "portraits": [{"src": "assets/hamlet-face-hamlet.webp", "label": "父の死後・喪服の王子", "alt": "ハムレットの人物イメージ", "width": 500, "height": 500}]}, {"name": "先王の亡霊", "role": "ハムレットの父の姿をした霊。弟に殺されたと語り、息子に復讐を求める。", "portraits": [{"src": "assets/hamlet-face-ghost.webp", "label": "父の姿で現れる霊", "alt": "先王の亡霊の人物イメージ", "width": 500, "height": 500}]}, {"name": "クローディアス", "role": "先王の弟で、ハムレットの叔父。新しい王となり、兄の妻だったガートルードと結婚した。", "portraits": [{"src": "assets/hamlet-face-claudius.webp", "label": "叔父・現在の王", "alt": "クローディアスの人物イメージ", "width": 500, "height": 500}]}, {"name": "ガートルード", "role": "ハムレットの母である王妃。夫の死後、その弟クローディアスと再婚した。", "portraits": [{"src": "assets/hamlet-face-gertrude.webp", "label": "母・王妃", "alt": "ガートルードの人物イメージ", "width": 500, "height": 500}]}, {"name": "ホレイショー", "role": "ハムレットが信頼する友人。王の反応を一緒に見届け、最後には真相を伝える役目を託される。", "portraits": [{"src": "assets/hamlet-face-horatio.webp", "label": "王子が信頼する友人", "alt": "ホレイショーの人物イメージ", "width": 500, "height": 500}]}, {"name": "オフィーリア", "role": "ポローニアスの娘で、レアティーズの妹。ハムレットを思うが、父の指示と王子の言動に苦しむ。", "portraits": [{"src": "assets/hamlet-face-ophelia.webp", "label": "ポローニアスの娘", "alt": "オフィーリアの人物イメージ", "width": 500, "height": 500}]}, {"name": "ポローニアス", "role": "王に仕える年長の人物。オフィーリアとレアティーズの父。王子の様子を探ろうとする。", "portraits": [{"src": "assets/hamlet-face-polonius.webp", "label": "オフィーリアとレアティーズの父", "alt": "ポローニアスの人物イメージ", "width": 500, "height": 500}]}, {"name": "レアティーズ", "role": "ポローニアスの息子で、オフィーリアの兄。父を失い、ハムレットへの復讐を求める。", "portraits": [{"src": "assets/hamlet-face-laertes.webp", "label": "オフィーリアの兄", "alt": "レアティーズの人物イメージ", "width": 500, "height": 500}]}, {"name": "ローゼンクランツとギルデンスターン", "role": "ハムレットの旧友二人。王の依頼で王子の様子を探り、イングランド行きに付き添う。", "portraits": [{"src": "assets/hamlet-face-oldfriends.webp", "label": "左：ローゼンクランツ／右：ギルデンスターン", "alt": "ローゼンクランツとギルデンスターンの人物イメージ", "width": 500, "height": 500}], "wide": true}, {"name": "フォーティンブラス", "role": "ノルウェーの王子。終幕でデンマークへ到着し、国を引き受けようとする。", "portraits": [{"src": "assets/hamlet-face-fortinbras.webp", "label": "ノルウェーの王子", "alt": "フォーティンブラスの人物イメージ", "width": 500, "height": 500}]}], "inlineIllustrations": [{"afterParagraph": 1, "src": "assets/hamlet-father-ghost-scene.webp", "alt": "父の姿をした亡霊から、叔父に殺されたという訴えを聞くハムレット。真相を確かめる出発点です。", "caption": "父の姿をした亡霊から、叔父に殺されたという訴えを聞くハムレット。真相を確かめる出発点です。", "width": 1200, "height": 800}, {"afterParagraph": 3, "src": "assets/hamlet-play-interrupted-scene.webp", "alt": "父の死に似た劇を見て、叔父の王が席を立ちます。ハムレットとホレイショーは、その反応を見届けます。", "caption": "父の死に似た劇を見て、叔父の王が席を立ちます。ハムレットとホレイショーは、その反応を見届けます。", "width": 1200, "height": 800}, {"afterParagraph": 8, "src": "assets/hamlet-horatio-testimony-scene.webp", "alt": "ホレイショーは、到着したノルウェーの王子に事情を伝えようとします。ハムレットに託された、真相を残す役目です。", "caption": "ホレイショーは、到着したノルウェーの王子に事情を伝えようとします。ハムレットに託された、真相を残す役目です。", "width": 1200, "height": 800}], "characterGalleryNote": "人物の顔立ちや衣服、城内などの細部は、作品の記述をもとにした創作です。旧友二人のカードは、左右の人物を見分けるための紹介図です。", "image": "assets/hamlet-father-ghost-scene.webp", "imageAlt": "父の姿をした亡霊の訴えを聞くハムレット", "headerCaption": "父の姿をした亡霊から、叔父に殺されたという訴えを聞くハムレット。真相を確かめる出発点です。"}, {"id": "tom-sawyer", "name": "トム・ソーヤーの冒険", "reading": "とむそーやーのぼうけん", "intro": "川沿いの町で暮らすトムは、いたずらと冒険が大好き。友達と遊ぶ毎日の中で、本当の事件に巻き込まれ、秘密を守る怖さと、人を助ける勇気に向き合います。", "gist": "塀塗りを遊びに変える少年が、事件の証言や洞窟での危機を通して、人を助けるために行動する。", "bodyReadings": {"冒険": "ぼうけん", "塀": "へい", "罰": "ばつ", "墓地": "ぼち", "医師": "いし", "仕返し": "しかえし", "海賊": "かいぞく", "葬儀": "そうぎ", "裁判": "さいばん", "無実": "むじつ", "証人": "しょうにん", "復讐": "ふくしゅう", "廃屋": "はいおく", "金貨": "きんか", "危害": "きがい", "洞窟": "どうくつ", "凧": "たこ", "判事": "はんじ", "十字": "じゅうじ", "行儀": "ぎょうぎ", "憧れ": "あこがれ", "皮肉": "ひにく"}, "sources": [{"title": "Wikisource・1876年米国版の本文と序文", "url": "https://en.wikisource.org/wiki/The_Adventures_of_Tom_Sawyer"}, {"title": "Mark Twain House & Museum・作者の生涯", "url": "https://marktwainhouse.org/about/mark-twain/biography/"}], "sourceNote": "1876年の英語小説。参照したのは同年の米国版（The American Publishing Companyほか）のWikisource転記です。著作権表示の1875年と刊行年は区別しています。続編やアニメ、現代日本語訳の文章は使わず、原作をもとにこの図鑑独自の日本語で紹介しています。", "termNote": "判事は裁判に関わる役人です。物語の町は、作者が少年時代を過ごした土地をもとにした架空の町。原作には当時の奴隷制や、先住民への差別的な呼び方・描写があります。ここで「ジョー」と呼ぶ大人は、原作ではInjun Joeと記される人物で、少年のジョー・ハーパーとは別人です。人物の行為を民族全体の性質と結び付けてはいません。", "checkedDate": "2026年11月2日", "cat": "literature", "primaryCategory": "world-literature", "genreLabel": "海外文学", "genre": "world-classic", "motif": "book", "sub": "マーク・トウェイン｜1876年初刊行", "people": [["トム・ソーヤー", "ポリーおばさんに育てられる少年。いたずらと冒険が好きだが、人を助けるために怖さと向き合う。"], ["ハックルベリー・フィン（ハック）", "トムの友達。学校や家の決まりから離れて暮らす少年。トムと事件を目撃し、宝を探す。"], ["ベッキー・サッチャー", "トムが好きになる少女。サッチャー判事の娘。トムと洞窟で道に迷う。"], ["ポリーおばさん", "トムの亡くなった母の姉妹。トムを育て、厳しく叱りながら心配する。"], ["ジョー・ハーパー", "トムの学校の友達。トムとハックと三人で島へ行く。事件を起こす大人のジョーとは別人。"], ["マフ・ポッター", "少年たちに親切にしてきた男性。自分のしていない殺人の疑いをかけられる。"], ["ジョー", "医師を殺し、ポッターに罪を着せる男性。トムが恐れる相手で、宝を隠している。"], ["ダグラス夫人", "ハックに親切にする女性。夫を亡くしている。後にハックを家に迎える。"], ["サッチャー判事", "ベッキーの父。娘を捜し、救出後は再び人が迷わないよう洞窟の入口を閉ざす。"]], "synopsisSummary": ["アメリカのミシシッピ川沿いの町で、少年トムは、亡くなった母の姉妹であるポリーおばさんに育てられています。学校や決まり事より遊びが好きで、叱られてばかりです。ある土曜日、罰として塀を白く塗るよう言われると、わざと面白そうに働きます。友達は自分もやりたくなり、品物を渡して順番を待つようになりました。トムには、退屈な仕事さえ冒険に変えてしまう知恵があります。", "トムは少女ベッキーに心を引かれ、自由に暮らす少年ハックとも遊びます。ある夜、トムとハックは墓地で、ジョーという男が医師を殺すところを見てしまいます。ところが疑われたのは、その場で気を失っていたマフ・ポッターでした。ジョーは罪をポッターになすりつけます。二人は仕返しを恐れ、見たことを秘密にすると誓いますが、以前から親切にしてくれたポッターが捕まり、トムは心苦しくなります。", "その後トムは、友達のジョー・ハーパーとハックを誘って、川の島で海賊ごっこを始めます。町では三人が溺れたと思われ、家族は悲しみます。ひそかに家へ戻ったトムは、ポリーおばさんが自分を思って泣く姿を見ました。それでもすぐには名乗り出ず、三人で自分たちの葬儀に現れて皆を驚かせます。楽しい冒険の裏で、人をどれほど心配させたかが見えてきます。", "やがてポッターの裁判が始まります。黙っていれば、無実の人が罪に問われてしまいます。トムは恐れを押し切って証人となり、墓地で見た出来事を話します。犯人のジョーは窓から逃げ、ポッターは救われました。トムは町で褒められますが、逃げたジョーの復讐を恐れ、夜は不安を感じ続けます。勇気を出したからといって、怖さがすぐ消えるわけではありません。", "別の日、宝探しをしていたトムとハックは、廃屋でジョーと仲間が金貨の箱を見つけるところを目撃します。二人の男は宝を別の場所へ運び、少年たちは行方を追います。夜の見張りをしていたハックは、ジョーがダグラス夫人に危害を加えようとしていると知ります。親切にしてくれた夫人を助けるため、近所の大人とその息子たちへ知らせました。男たちは追い払われ、夫人は助かります。", "同じころ、遠足で洞窟に入ったトムとベッキーは、仲間から離れて道に迷います。食べ物も灯りも乏しくなり、町の人たちは二人を捜し続けます。トムは凧の糸を目印に通路を調べ、洞窟に隠れていたジョーも見かけます。それでも別の道を探し、とうとう小さな出口から外の光を見つけました。ベッキーを連れ出し、川を通る舟の人たちに助けられて、二人は町へ帰ります。", "再び人が迷わないよう、ベッキーの父サッチャー判事は洞窟の入口を閉ざしていました。そのことを聞いたトムがジョーの存在を知らせますが、扉を開けた時にはジョーは中で亡くなっていました。トムは、男が隠した宝も洞窟にあると気づきます。ハックと小さな出口から入り直し、十字の印を手掛かりに箱を見つけ、金を持ち帰りました。二人は宝を半分ずつ分け、町の大人たちから注目されます。", "ハックはダグラス夫人の家に迎えられます。しかし、時間や服装を細かく決められる生活になじめず、逃げ出してしまいました。トムはハックを見つけ、戻れば新しい盗賊ごっこの仲間にすると誘います。ハックはもうしばらく試すことにし、トムも夫人に決まりを緩めてほしいと頼む約束をします。宝を得て立派な大人になったところで終わるのではありません。遊びを夢見る少年たちと、周囲の暮らしとの折り合いが続いていく結末です。"], "summaryHeading": "要約", "links": ["treasure-island", "anne-green-gables", "mark-twain"], "characterGallery": [{"name": "トム・ソーヤー", "role": "ポリーおばさんに育てられる少年。いたずらと冒険が好きだが、人を助けるために怖さと向き合う。", "portraits": [{"src": "assets/tom-face-tom.webp", "label": "少年時代", "alt": "トム・ソーヤーの人物イメージ", "width": 500, "height": 500}]}, {"name": "ハックルベリー・フィン（ハック）", "role": "トムの友達。学校や家の決まりから離れて暮らす少年。トムと事件を目撃し、宝を探す。", "portraits": [{"src": "assets/tom-face-huck.webp", "label": "夫人の家へ迎えられる前", "alt": "ハックルベリー・フィン（ハック）の人物イメージ", "width": 500, "height": 500}]}, {"name": "ベッキー・サッチャー", "role": "トムが好きになる少女。サッチャー判事の娘。トムと洞窟で道に迷う。", "portraits": [{"src": "assets/tom-face-becky.webp", "label": "トムと同じ学校の少女", "alt": "ベッキー・サッチャーの人物イメージ", "width": 500, "height": 500}]}, {"name": "ポリーおばさん", "role": "トムの亡くなった母の姉妹。トムを育て、厳しく叱りながら心配する。", "portraits": [{"src": "assets/tom-face-polly.webp", "label": "トムを育てる叔母", "alt": "ポリーおばさんの人物イメージ", "width": 500, "height": 500}]}, {"name": "ジョー・ハーパー", "role": "トムの学校の友達。トムとハックと三人で島へ行く。事件を起こす大人のジョーとは別人。", "portraits": [{"src": "assets/tom-face-joeharper.webp", "label": "学校の友達", "alt": "ジョー・ハーパーの人物イメージ", "width": 500, "height": 500}]}, {"name": "マフ・ポッター", "role": "少年たちに親切にしてきた男性。自分のしていない殺人の疑いをかけられる。", "portraits": [{"src": "assets/tom-face-potter.webp", "label": "殺人の疑いをかけられる男性", "alt": "マフ・ポッターの人物イメージ", "width": 500, "height": 500}]}, {"name": "ジョー", "role": "医師を殺し、ポッターに罪を着せる男性。トムが恐れる相手で、宝を隠している。", "portraits": [{"src": "assets/tom-face-joe.webp", "label": "事件を起こす成人男性", "alt": "ジョーの人物イメージ", "width": 500, "height": 500}]}, {"name": "ダグラス夫人", "role": "ハックに親切にする女性。夫を亡くしている。後にハックを家に迎える。", "portraits": [{"src": "assets/tom-face-douglas.webp", "label": "ハックを迎える女性", "alt": "ダグラス夫人の人物イメージ", "width": 500, "height": 500}]}, {"name": "サッチャー判事", "role": "ベッキーの父。娘を捜し、救出後は再び人が迷わないよう洞窟の入口を閉ざす。", "portraits": [{"src": "assets/tom-face-thatcher.webp", "label": "ベッキーの父", "alt": "サッチャー判事の人物イメージ", "width": 500, "height": 500}]}], "inlineIllustrations": [{"afterParagraph": 1, "src": "assets/tom-whitewash-scene.webp", "alt": "塀塗りを楽しそうに見せるトム。友達は自分もやりたいと思い始めます。", "caption": "塀塗りを楽しそうに見せるトム。友達は自分もやりたいと思い始めます。", "width": 1200, "height": 800}, {"afterParagraph": 4, "src": "assets/tom-court-testimony-scene.webp", "alt": "トムは仕返しを恐れながらも、ポッターを救うために見たことを話します。", "caption": "トムは仕返しを恐れながらも、ポッターを救うために見たことを話します。", "width": 1200, "height": 800}, {"afterParagraph": 6, "src": "assets/tom-becky-cave-exit-scene.webp", "alt": "別の出口を見つけたトムは、ベッキーを洞窟から連れ出します。", "caption": "別の出口を見つけたトムは、ベッキーを洞窟から連れ出します。", "width": 1200, "height": 800}], "characterGalleryNote": "人物の顔や衣服、建物の細部は原作をもとにした創作です。挿絵は本文の場面を理解しやすくするために描いています。", "image": "assets/tom-whitewash-scene.webp", "imageAlt": "塀を白く塗るトムと、興味深そうに見る友達", "headerCaption": "塀塗りを楽しそうに見せるトム。友達は自分もやりたいと思い始めます。"}, {"id": "little-princess", "name": "小公女", "reading": "しょうこうじょ", "intro": "父に愛され、ロンドンの学校で暮らす少女セーラ。父の死の知らせで暮らしが一変しても、物語を空想する力と友達とのつながりを支えに、自分らしさを守ろうとします。", "gist": "財産を失って働かされる少女が、支え合う友達と人々の援助によって居場所を取り戻し、助けを次の人へつなぐ。", "bodyReadings": {"小公女": "しょうこうじょ", "寄宿学校": "きしゅくがっこう", "裕福": "ゆうふく", "財産": "ざいさん", "学費": "がくひ", "屋根裏": "やねうら", "空想": "くうそう", "空腹": "くうふく", "銀貨": "ぎんか", "鉱山": "こうざん", "投資": "とうし", "回復": "かいふく", "弁護士": "べんごし", "猿": "さる", "暖炉": "だんろ", "寝具": "しんぐ", "援助": "えんじょ", "判明": "はんめい", "保護者": "ほごしゃ", "交流": "こうりゅう", "請求": "せいきゅう", "階級": "かいきゅう", "植民地": "しょくみんち"}, "sources": [{"title": "Wikisource・小公女（1917年版、刊記・作者序文・全19章）", "url": "https://en.wikisource.org/wiki/A_Little_Princess"}, {"title": "English Heritage・バーネットの生涯", "url": "https://www.english-heritage.org.uk/visit/blue-plaques/frances-hodgson-burnett/"}], "sourceNote": "1905年に刊行された長編版を扱います。参照したのはCharles Scribner’s Sonsの1917年版のWikisource転記。1888年の短い物語をもとに、舞台化を経て人物や出来事を加えた長編であることを、作者の序文でも説明しています。現代日本語訳やアニメの文章・設定は使わず、独自の日本語で紹介しています。", "termNote": "寄宿学校は、子供が住みながら学ぶ学校です。「小公女」は題名で、セーラが本当の王族という意味ではありません。キャリスフォードは父の友人で、セーラの実の叔父ではありません。原作で「インドの紳士」と呼ばれますが、インドから戻った英国人です。", "checkedDate": "2026年11月2日", "cat": "literature", "primaryCategory": "world-literature", "genreLabel": "海外文学", "genre": "world-classic", "motif": "book", "sub": "フランシス・ホジソン・バーネット｜1905年初刊行", "people": [["セーラ・クルー", "七歳で寄宿学校に入り、十一歳で父を失う少女。物語を空想する力と、人への思いやりを支えに暮らす。"], ["ラルフ・クルー", "セーラの父。インドで暮らす裕福な軍人。娘を大切にし、ロンドンの学校に預ける。"], ["ミンチン先生", "寄宿学校を経営する女性。セーラの父が亡くなると、学費のない彼女を働かせる。"], ["ベッキー", "学校で働く、セーラより年上の少女。屋根裏でつらさを分かち合う友達になる。"], ["アーメンガード", "セーラの学校の友達。勉強ではセーラに助けられ、苦しい時には彼女を支える。"], ["キャリスフォード", "セーラの父の友人。父と共同で投資した男性で、インドから戻り学校の隣に住む。"], ["ラム・ダス", "キャリスフォードに仕えるインド人男性。セーラの暮らしを知り、屋根裏への援助を考えて実行する。"], ["カーマイケル", "キャリスフォードから頼まれ、父を失った少女を捜す弁護士。"], ["ブラウン夫人", "パン屋の店主。セーラにパンを多く渡し、困っている少女にも住む場所を用意する。"], ["アン", "パン屋の前でセーラからパンを分けてもらう少女。後にブラウン夫人の店で暮らし、働く。"]], "synopsisSummary": ["七歳のセーラ・クルーは、インドで暮らす父ラルフに連れられ、ロンドンのミンチン先生の寄宿学校へ入ります。母はすでに亡くなっていました。裕福な父は、娘の部屋や服、人形を十分に用意してからインドへ帰ります。セーラは父との別れを寂しく思いながらも、本や物語を楽しみ、友達を作っていきます。", "セーラは、勉強が苦手なアーメンガードや、学校で働く少女ベッキーにも親しく接します。豪華な服を着るだけでなく、誰に対しても親切で心の強い「王女」でありたいと考えるのです。ところが十一歳の誕生日、父が事業で財産を失い、病気で亡くなったと知らされます。学費を払う人がいなくなり、それまでセーラを特別扱いしていたミンチン先生の態度は一変します。", "セーラは屋根裏の寒い部屋へ移され、掃除や使い走りをし、年下の子に勉強を教えるよう命じられます。食事も十分ではありません。それでも、物語を空想し、同じように働かされるベッキーと励まし合い、訪ねてくるアーメンガードとの友情を守ります。つらさに耐えきれず涙を流すこともあり、空想だけで寒さや空腹をなくせるわけではありません。", "ある寒い雨の日、空腹のセーラは道で四ペンスの銀貨を拾います。パン屋で落とし物ではないか尋ねてからパンを買うと、店主のブラウン夫人は、四個の代金で六個を渡してくれます。店先には、もっとお腹をすかせた少女がいました。セーラは自分の分を一個だけ残し、五個を少女に分けます。その様子を見た夫人も心を動かされ、少女を店へ招き入れます。", "一方、学校の隣には、インドから戻ったキャリスフォードという男性が住んでいました。彼はセーラの父と事業をした友人です。鉱山への投資が失敗したと思い込み、父の前から姿を消して病気になりましたが、実際には鉱山の価値が明らかになり、財産は回復していました。父の死後、キャリスフォードは弁護士カーマイケルに頼んで娘を捜します。しかしパリの学校にいると思い込み、隣の少女こそセーラだとは知りません。", "キャリスフォードに仕えるラム・ダスは、逃げた猿を追ってセーラの屋根裏へ入り、貧しい暮らしを知っていました。彼の話を聞いたキャリスフォードは、少女をそっと助ける計画に加わります。ある夜、眠っていたセーラが目覚めると、暖炉に火がともり、暖かな寝具と食事が置かれていました。魔法のような変化ですが、ラム・ダスたちが運び込んだものです。セーラは誰かが気にかけてくれる喜びを感じ、ベッキーと分け合います。", "やがて猿がまた部屋へ来たため、セーラは隣へ返しに行きます。キャリスフォードと話すうち、父の名前やインドでの暮らしが分かり、ついに探していた娘だと判明しました。財産はセーラのものとして戻り、キャリスフォードが保護者になります。ミンチン先生は学校へ戻るよう求めますが、セーラは断ります。ベッキーも付き添い役として新しい家へ迎えられ、友達との交流も続きます。", "暮らしが豊かになっても、セーラは自分が空腹だった日を忘れません。ブラウン夫人の店を再び訪ね、困っている子にパンを渡し、代金は自分に請求してほしいと頼みます。以前助けた少女アンは、すでに夫人から住む場所と仕事をもらっていました。セーラはアンと手を取り合い、今度はアンが子供たちにパンを渡す役をしてはどうかと提案します。自分が救われただけで終わらず、その先へ助けをつなげようとする結末です。"], "summaryHeading": "要約", "links": ["anne-green-gables", "cinderella", "frances-hodgson-burnett"], "characterGallery": [{"name": "セーラ・クルー", "role": "七歳で寄宿学校に入り、十一歳で父を失う少女。物語を空想する力と、人への思いやりを支えに暮らす。", "wide": true, "portraits": [{"src": "assets/princess-face-young.webp", "label": "入学した七歳のころ", "alt": "セーラ・クルーの人物イメージ", "width": 500, "height": 500}, {"src": "assets/princess-face-later.webp", "label": "父を失った後、十二〜十三歳ごろ", "alt": "セーラ・クルーの人物イメージ", "width": 500, "height": 500}]}, {"name": "ラルフ・クルー", "role": "セーラの父。インドで暮らす裕福な軍人。娘を大切にし、ロンドンの学校に預ける。", "wide": false, "portraits": [{"src": "assets/princess-face-ralph.webp", "label": "セーラの父", "alt": "ラルフ・クルーの人物イメージ", "width": 500, "height": 500}]}, {"name": "ミンチン先生", "role": "寄宿学校を経営する女性。セーラの父が亡くなると、学費のない彼女を働かせる。", "wide": false, "portraits": [{"src": "assets/princess-face-minchin.webp", "label": "学校を経営する女性", "alt": "ミンチン先生の人物イメージ", "width": 500, "height": 500}]}, {"name": "ベッキー", "role": "学校で働く、セーラより年上の少女。屋根裏でつらさを分かち合う友達になる。", "wide": false, "portraits": [{"src": "assets/princess-face-becky.webp", "label": "セーラより年上の友達", "alt": "ベッキーの人物イメージ", "width": 500, "height": 500}]}, {"name": "アーメンガード", "role": "セーラの学校の友達。勉強ではセーラに助けられ、苦しい時には彼女を支える。", "wide": false, "portraits": [{"src": "assets/princess-face-ermengarde.webp", "label": "学校の友達", "alt": "アーメンガードの人物イメージ", "width": 500, "height": 500}]}, {"name": "キャリスフォード", "role": "セーラの父の友人。父と共同で投資した男性で、インドから戻り学校の隣に住む。", "wide": false, "portraits": [{"src": "assets/princess-face-carrisford.webp", "label": "父の友人・後の保護者", "alt": "キャリスフォードの人物イメージ", "width": 500, "height": 500}]}, {"name": "ラム・ダス", "role": "キャリスフォードに仕えるインド人男性。セーラの暮らしを知り、屋根裏への援助を考えて実行する。", "wide": false, "portraits": [{"src": "assets/princess-face-ramdass.webp", "label": "隣家で働く男性", "alt": "ラム・ダスの人物イメージ", "width": 500, "height": 500}]}, {"name": "カーマイケル", "role": "キャリスフォードから頼まれ、父を失った少女を捜す弁護士。", "wide": false, "portraits": [{"src": "assets/princess-face-carmichael.webp", "label": "少女を捜す弁護士", "alt": "カーマイケルの人物イメージ", "width": 500, "height": 500}]}, {"name": "ブラウン夫人", "role": "パン屋の店主。セーラにパンを多く渡し、困っている少女にも住む場所を用意する。", "wide": false, "portraits": [{"src": "assets/princess-face-brown.webp", "label": "パン屋の店主", "alt": "ブラウン夫人の人物イメージ", "width": 500, "height": 500}]}, {"name": "アン", "role": "パン屋の前でセーラからパンを分けてもらう少女。後にブラウン夫人の店で暮らし、働く。", "wide": false, "portraits": [{"src": "assets/princess-face-anne.webp", "label": "パン屋で暮らすようになった少女", "alt": "アンの人物イメージ", "width": 500, "height": 500}]}], "inlineIllustrations": [{"afterParagraph": 1, "src": "assets/princess-london-arrival-scene.webp", "alt": "七歳のセーラは、父と一緒にロンドンの学校へ向かいます。", "caption": "七歳のセーラは、父と一緒にロンドンの学校へ向かいます。", "width": 1200, "height": 800}, {"afterParagraph": 4, "src": "assets/princess-sharing-buns-scene.webp", "alt": "自分も空腹のセーラは、もらったパン六個のうち五個を、店先の少女に分けます。", "caption": "自分も空腹のセーラは、もらったパン六個のうち五個を、店先の少女に分けます。", "width": 1200, "height": 800}, {"afterParagraph": 7, "src": "assets/princess-identity-discovered-scene.webp", "alt": "父の名前を聞き、キャリスフォードは、隣の少女が捜していたセーラだと知ります。", "caption": "父の名前を聞き、キャリスフォードは、隣の少女が捜していたセーラだと知ります。", "width": 1200, "height": 800}], "characterGalleryNote": "人物の顔や服、室内の細部は作品をもとにした創作です。セーラは、入学したころと、父を失った後の姿を分けて示しています。", "image": "assets/princess-london-arrival-scene.webp", "imageAlt": "父と馬車に乗り、ロンドンの学校へ向かう七歳のセーラ", "headerCaption": "七歳のセーラは、父と一緒にロンドンの学校へ向かいます。"}, {"id": "little-match-girl", "name": "マッチ売りの少女", "reading": "まっちうりのしょうじょ", "intro": "雪の降る大みそか、マッチを売る少女は、明かりのともる家々の外を歩きます。小さな炎に浮かぶ光景を通して、少女が本当に求めていたものが見えてくる物語です。", "gist": "マッチの光に暖かさや食事、祖母の姿を見る少女。心の中の安らぎと、助けの届かない現実を描く。", "bodyReadings": {"少女": "しょうじょ", "大みそか": "おおみそか", "祖母": "そぼ", "空腹": "くうふく", "履物": "はきもの", "馬車": "ばしゃ", "裸足": "はだし", "二軒": "にけん", "売上げ": "うりあげ", "隙間": "すきま", "炎": "ほのお", "食卓": "しょくたく", "魂": "たましい", "神様": "かみさま", "翌朝": "よくあさ", "現実": "げんじつ", "結末": "けつまつ"}, "sources": [{"title": "Wikisource・Paull英訳「The Little Match-seller」全文", "url": "https://en.wikisource.org/wiki/Hans_Andersen's_Fairy_Tales/The_Little_Match-seller"}, {"title": "Wikisource・英訳集の標題紙と翻訳者", "url": "https://en.wikisource.org/wiki/Hans_Andersen's_Fairy_Tales"}, {"title": "南デンマーク大学アンデルセン研究センター・初刊情報", "url": "https://andersen.sdu.dk/vaerk/register/info_e.html?vid=79"}, {"title": "Project Gutenberg・Paullの生没年書誌", "url": "https://www.gutenberg.org/ebooks/34794"}], "sourceNote": "初刊は1845年12月。ここでは、Mrs. H. B. Paullによる英訳を収めた1888年版として登録されるHans Andersen’s Fairy Talesの本文を参照し、独自の日本語で紹介しています。現代日本語訳や映像作品の文章・図柄は使っていません。", "termNote": "舞台はクリスマスの夜ではなく、大みそかです。流れ星と魂の話は、物語の中で祖母が語った信仰上の言い伝えで、天文学の説明ではありません。", "checkedDate": "2026年11月2日", "cat": "literature", "primaryCategory": "world-fairytale", "genreLabel": "世界の童話（アンデルセン）", "genre": "world-fairytale", "motif": "book", "sub": "ハンス・クリスチャン・アンデルセン｜1845年初刊行", "people": [["マッチ売りの少女", "名前や正確な年齢は書かれていない幼い少女。大みそかに、寒い町でマッチを売っている。"], ["祖母", "すでに亡くなっている、少女を愛してくれた人。マッチの光の中に姿を現す。"], ["父", "少女の父。売上げを持ち帰れなければたたかれる、と少女が恐れている相手。"], ["町の人々", "少女を通りで助けることがないまま、翌朝、その死を知る人々。"]], "synopsisSummary": ["一年の最後の日、雪の降る町を、小さな少女がマッチを売って歩いています。家を出た時には母の大きな履物を履いていましたが、馬車を避けるうちに失い、今は裸足です。一日中、誰もマッチを買わず、お金もくれません。家々の窓には明かりがともり、ごちそうのにおいがしますが、少女は寒さと空腹の中に取り残されています。", "少女は二軒の家の間に座り込みます。売上げがないまま帰れば父に叱られ、たたかれるのが怖いのです。それに、屋根の隙間から風が入る家も暖かくありません。手を暖めようとマッチを一本すると、炎の中に大きなストーブが見える気がしました。けれど火が消えると、ストーブも消え、手には燃え残りだけが残ります。", "次のマッチでは、白い布をかけた食卓と、湯気の立つガチョウの料理が現れます。料理が自分の方へ歩いてくるように見えますが、炎が消えると、また冷たい壁だけになりました。さらに火をつけると、今度はたくさんの明かりを飾ったクリスマスツリーが見えます。その明かりは空の星のようになり、一つの星が流れます。少女は、星が落ちると誰かの魂が神様のもとへ行くという、亡くなった祖母の話を思い出します。", "もう一度マッチをすると、今度は、かつて自分を愛してくれた祖母が光の中に現れます。少女は祖母まで消えてしまうのが悲しくて、そばにいてほしいと願い、残りの束にも火をつけます。祖母は少女を抱き上げ、二人は寒さも空腹もない神様のもとへ昇っていった、と物語は語ります。これは、通りで誰かが少女を助け、暖かい家へ連れ帰ったという出来事ではありません。", "新年の朝、町の人々が見つけた少女は、寒さの中で亡くなっていました。そばには燃えたマッチが残っています。人々は暖まろうとしたのだろうと考えますが、少女がどんな光景を見て、どれほど祖母に会いたかったかは知りません。少女の内側に広がった温かな光景と、現実には助けが届かなかったことが、並べて描かれる結末です。"], "summaryHeading": "要約", "links": ["andersen", "mermaid", "uglyduckling"], "characterGallery": [{"name": "マッチ売りの少女", "role": "名前や正確な年齢は書かれていない幼い少女。大みそかに、寒い町でマッチを売っている。", "wide": false, "portraits": [{"src": "assets/matchgirl-face-girl.webp", "label": "大みそかの少女", "alt": "マッチ売りの少女の人物イメージ", "width": 500, "height": 500}]}, {"name": "祖母", "role": "すでに亡くなっている、少女を愛してくれた人。マッチの光の中に姿を現す。", "wide": false, "portraits": [{"src": "assets/matchgirl-face-grandmother.webp", "label": "光の中に現れる祖母", "alt": "祖母の人物イメージ", "width": 500, "height": 500}]}, {"name": "父", "role": "少女の父。売上げを持ち帰れなければたたかれる、と少女が恐れている相手。", "wide": false, "portraits": [{"src": "assets/matchgirl-face-father.webp", "label": "少女が恐れる父", "alt": "父の人物イメージ", "width": 500, "height": 500}]}, {"name": "町の人々", "role": "少女を通りで助けることがないまま、翌朝、その死を知る人々。", "wide": false, "portraits": [{"src": "assets/matchgirl-face-townspeople.webp", "label": "翌朝の人々の代表像", "alt": "町の人々の人物イメージ", "width": 500, "height": 500}]}], "inlineIllustrations": [{"afterParagraph": 1, "src": "assets/matchgirl-unsold-street-scene.webp", "alt": "大みそかの町。少女のマッチは売れず、家々には明かりがともっています。", "caption": "大みそかの町。少女のマッチは売れず、家々には明かりがともっています。", "width": 1200, "height": 800}, {"afterParagraph": 2, "src": "assets/matchgirl-stove-vision-scene.webp", "alt": "マッチの炎に、大きなストーブが見える気がします。火が消えると、その姿も消えます。", "caption": "マッチの炎に、大きなストーブが見える気がします。火が消えると、その姿も消えます。", "width": 1200, "height": 800}, {"afterParagraph": 4, "src": "assets/matchgirl-grandmother-vision-scene.webp", "alt": "光の中で、少女は大好きだった祖母に抱かれます。物語が語る幻の場面です。", "caption": "光の中で、少女は大好きだった祖母に抱かれます。物語が語る幻の場面です。", "width": 1200, "height": 800}], "characterGalleryNote": "人物の顔や服、町の細部は作品をもとにした創作です。町の人々は代表的なイメージで、人数は原作で決まっていません。ストーブと祖母の絵は、少女が光の中に見る場面を表しています。", "image": "assets/matchgirl-unsold-street-scene.webp", "imageAlt": "大みそかの町。少女のマッチは売れず、家々には明かりがともっています。", "headerCaption": "大みそかの町。少女のマッチは売れず、家々には明かりがともっています。"}, {"id": "daddy-long-legs", "name": "あしながおじさん", "reading": "あしながおじさん", "intro": "施設で育ったジュディに、名前を明かさない男性から大学への進学援助が届きます。条件は、毎月手紙を書くこと。学び、友達、作家になる夢を語る手紙の先で、彼女は自分の生き方を探していきます。", "gist": "顔を知らない支援者への手紙を通して、若い女性が学び、自立と愛情のあり方を考えていく。", "bodyReadings": {"児童養護施設": "じどうようごしせつ", "理事": "りじ", "学費": "がくひ", "匿名": "とくめい", "奨学金": "しょうがくきん", "家庭教師": "かていきょうし", "援助": "えんじょ", "施設": "しせつ", "叔父": "おじ", "姪": "めい", "裕福": "ゆうふく", "出版社": "しゅっぱんしゃ", "連載": "れんさい", "求婚": "きゅうこん", "誤解": "ごかい", "支援者": "しえんしゃ", "恋文": "こいぶみ", "自立": "じりつ"}, "sources": [{"title": "Wikisource・Daddy-Long-Legs（1912年版、導入と全73区分）", "url": "https://en.wikisource.org/wiki/Daddy-Long-Legs_(Webster)"}, {"title": "Vassar College・ジーン・ウェブスターの生涯", "url": "https://vcencyclopedia.vassar.edu/distinguished-alumni/jean-webster/"}], "sourceNote": "1912年刊の英語小説。参照したのはThe Century Co.の1912年版をもとにするWikisource転記です。導入と、サイト上でLetter 1〜73に分けられた本文を参照しています。続編、映画、アニメ、現代日本語訳の文章や設定は使わず、独自の日本語で紹介しています。", "termNote": "「あしながおじさん」はジュディが支援者につけた呼び名で、実の父や叔父ではありません。手紙の宛名に使う「ジョン・スミス」も本名を伏せるための名前です。書簡小説とは、手紙の形で出来事や心の動きを伝える小説です。", "checkedDate": "2026年11月2日", "cat": "literature", "primaryCategory": "world-literature", "genreLabel": "海外文学", "genre": "world-classic", "motif": "book", "sub": "ジーン・ウェブスター｜1912年初刊行", "people": [["ジュディ（ジェルーシャ・アボット）", "施設で育ち、大学へ進む主人公。ジェルーシャは本名で、大学ではジュディと名乗る。作家を目指す。"], ["ジャーヴィス・ペンドルトン", "ジュリアの叔父。ジュディと親しくなり、作家になる夢を励ます。彼女の実の叔父ではない。"], ["サリー・マクブライド", "ジュディの大学の友達。家族の温かい暮らしを彼女に知らせ、友情を育てる。"], ["ジュリア・ペンドルトン", "裕福な家に育った大学の友達。ジャーヴィスの姪。"], ["ジミー・マクブライド", "サリーの兄。ジュディとも親しく交流するが、彼女が愛しているのはジャーヴィス。"], ["リペット夫人", "ジュディが育った施設の責任者。匿名の男性による進学援助の条件を伝える。"], ["センプル夫人", "ロック・ウィロー農場でジュディを迎える女性。ジャーヴィスが子供のころの世話もしていた。"]], "synopsisSummary": ["アメリカの児童養護施設で育った十七歳のジェルーシャ・アボットは、年下の子供たちの世話をしながら学んでいます。ある日、施設の理事の一人が、彼女の書いた文章を気に入り、大学の学費と生活費を出すと申し出ます。ただし名前は秘密で、毎月、勉強や暮らしの様子を手紙で知らせることが条件でした。ジェルーシャが見たのは、帰り際の男性の後ろ姿と、自動車のライトで壁に大きく伸びた手足の影だけ。その印象から、顔を知らない相手を「あしながおじさん」と呼ぶようになります。", "大学へ進んだジェルーシャは、自分をジュディと呼ぶことにします。同級生のサリー・マクブライドやジュリア・ペンドルトンと友達になり、授業だけでなく、運動や演劇、読書も楽しみます。一方、友達が当然のように知っている本や家庭の習慣を、自分は知らないことに戸惑います。施設で育ったことを打ち明けられず、取り残されまいと努力するのです。おじさんへの手紙には、失敗も冗談も将来の夢も書き込み、少しずつ自分の言葉で考えを表すようになります。", "サリーの家で温かな家族の暮らしを知り、休暇には、センプル夫人のいるロック・ウィロー農場で過ごします。また、ジュリアの叔父ジャーヴィスとも親しくなります。彼はジュディの話に耳を傾け、農場でも一緒に散歩をし、作家になりたいという夢を励ましてくれる男性です。ジュディは彼に心を引かれますが、自分の学費を出す匿名の人とは別人だと思っています。", "成績や作文の力を伸ばしたジュディは、奨学金を得ます。おじさんはその受取りに反対しますが、ジュディは、自分の努力で得た機会を生かしたいと考えて譲りません。夏には家庭教師として働き、お金を稼ぎます。おじさんが申し出た海外旅行も断りました。支援には感謝しながら、自分の暮らしを人の指示だけで決めたくない気持ちが強くなるのです。", "作家への道も順調ばかりではありません。上流社会を題材に書いた小説は、出版社から不自然だと指摘されて返されます。落ち込んでも書くことはやめず、やがて、自分がよく知る施設の日常を題材に選びます。大学を卒業した後も農場で書き直しを続け、ついに連載と本の出版が決まりました。ジュディは受け取った千ドルをおじさんへ送り、援助してもらったお金を返し始めます。", "実は、この報告の二か月ほど前、ジュディはジャーヴィスからの求婚を断っていました。愛していないからではありません。家族や生まれの分からない自分が、裕福な家の彼と結婚したら、後で彼が悔やむのではないかと怖かったのです。ジャーヴィスは、ジュディがサリーの兄ジミーを好きなのだと誤解して離れます。ジュディは、おじさんに相談する手紙で、彼への愛情と、求婚を断った本当の理由を打ち明けます。", "病気をしていたおじさんから、会いに来るよう返事が届きます。大学を卒業した秋、ニューヨークの家を訪ねたジュディを待っていたのは、病気から回復しつつあるジャーヴィスでした。彼こそ、ずっと手紙を読んでいた「あしながおじさん」だったのです。秘密が明らかになり、二人は互いの思いを確かめます。翌朝のジュディの手紙は、もう顔の見えない支援者への報告ではなく、名前を知る大切な相手への恋文になっていました。"], "summaryHeading": "要約", "links": ["anne-green-gables", "little-princess", "jean-webster"], "characterGallery": [{"name": "ジュディ（ジェルーシャ・アボット）", "role": "施設で育ち、大学へ進む主人公。ジェルーシャは本名で、大学ではジュディと名乗る。作家を目指す。", "wide": true, "portraits": [{"src": "assets/daddy-face-judy.webp", "label": "大学時代のジュディ", "alt": "ジュディ（ジェルーシャ・アボット）の人物イメージ", "width": 500, "height": 500}]}, {"name": "ジャーヴィス・ペンドルトン", "role": "ジュリアの叔父。ジュディと親しくなり、作家になる夢を励ます。彼女の実の叔父ではない。", "wide": false, "portraits": [{"src": "assets/daddy-face-jervis.webp", "label": "ジュリアの叔父", "alt": "ジャーヴィス・ペンドルトンの人物イメージ", "width": 500, "height": 500}]}, {"name": "サリー・マクブライド", "role": "ジュディの大学の友達。家族の温かい暮らしを彼女に知らせ、友情を育てる。", "wide": false, "portraits": [{"src": "assets/daddy-face-sallie.webp", "label": "大学の友達", "alt": "サリー・マクブライドの人物イメージ", "width": 500, "height": 500}]}, {"name": "ジュリア・ペンドルトン", "role": "裕福な家に育った大学の友達。ジャーヴィスの姪。", "wide": false, "portraits": [{"src": "assets/daddy-face-julia.webp", "label": "大学の友達／ジャーヴィスの姪", "alt": "ジュリア・ペンドルトンの人物イメージ", "width": 500, "height": 500}]}, {"name": "ジミー・マクブライド", "role": "サリーの兄。ジュディとも親しく交流するが、彼女が愛しているのはジャーヴィス。", "wide": false, "portraits": [{"src": "assets/daddy-face-jimmie.webp", "label": "サリーの兄", "alt": "ジミー・マクブライドの人物イメージ", "width": 500, "height": 500}]}, {"name": "リペット夫人", "role": "ジュディが育った施設の責任者。匿名の男性による進学援助の条件を伝える。", "wide": false, "portraits": [{"src": "assets/daddy-face-lippett.webp", "label": "施設の責任者", "alt": "リペット夫人の人物イメージ", "width": 500, "height": 500}]}, {"name": "センプル夫人", "role": "ロック・ウィロー農場でジュディを迎える女性。ジャーヴィスが子供のころの世話もしていた。", "wide": false, "portraits": [{"src": "assets/daddy-face-semple.webp", "label": "農場で迎える女性", "alt": "センプル夫人の人物イメージ", "width": 500, "height": 500}]}], "inlineIllustrations": [{"afterParagraph": 1, "src": "assets/daddy-long-shadow-scene.webp", "alt": "施設を去る男性の影が、車の光で長く伸びます。ジェルーシャはその姿から呼び名を思いつきます。", "caption": "施設を去る男性の影が、車の光で長く伸びます。ジェルーシャはその姿から呼び名を思いつきます。", "width": 1200, "height": 800}, {"afterParagraph": 5, "src": "assets/daddy-farm-writing-scene.webp", "alt": "卒業後、ジュディは農場で小説を書き直します。自分がよく知る経験が、作家への一歩になります。", "caption": "卒業後、ジュディは農場で小説を書き直します。自分がよく知る経験が、作家への一歩になります。", "width": 1200, "height": 800}, {"afterParagraph": 7, "src": "assets/daddy-identity-revealed-scene.webp", "alt": "訪ねた家で待っていたのはジャーヴィスでした。ジュディが手紙を送り続けてきた相手が、彼だと分かります。", "caption": "訪ねた家で待っていたのはジャーヴィスでした。ジュディが手紙を送り続けてきた相手が、彼だと分かります。", "width": 1200, "height": 800}], "characterGalleryNote": "人物の顔や服、室内の細部は作品をもとにした創作です。ジュディは大学時代の姿で、最後の場面では卒業後の成長した姿を表しています。", "image": "assets/daddy-long-shadow-scene.webp", "imageAlt": "施設を去る男性の影が、車の光で長く伸びます。ジェルーシャはその姿から呼び名を思いつきます。", "headerCaption": "施設を去る男性の影が、車の光で長く伸びます。ジェルーシャはその姿から呼び名を思いつきます。"}, {"id": "niimi-nankichi", "name": "新美南吉", "reading": "にいみなんきち", "cat": "person", "sub": "1913–1943｜童話作家・詩人", "motif": "book", "intro": "『ごんぎつね』『手袋を買いに』『おじいさんのランプ』を書いた作家。愛知の半田で育ち、東京で外国文学を学び、先生として働きながら創作を続けました。身近な動物や村の暮らしを通して、気持ちのすれ違いや、人を信じる難しさと喜びを描いています。", "gist": "狐の物語だけでなく、子どもや働く大人の心も描いた人。ふるさとの暮らしと、文学を通じた多くの出会いが、その作品につながっています。", "people": [], "theme": "", "memory": "", "links": ["gongitsune", "gloves", "lamp", "ushi-o-tsunaida-tsubaki-no-ki", "amedama"], "sources": [{"title": "新美南吉記念館「新美南吉の生涯」", "url": "https://www.nankichi.gr.jp/Nankichi/syogai.html"}, {"title": "新美南吉記念館「南吉Q&A・新美南吉について」", "url": "https://www.nankichi.gr.jp/Nankichi/QA.html"}, {"title": "国際子ども図書館「児童文学者コーナー 新美南吉」", "url": "https://www.kodomo.go.jp/jcl/person/niimi.html"}, {"title": "新美南吉記念館「新美南吉の作品」", "url": "https://www.nankichi.gr.jp/Nankichi/sakuhin.html"}, {"title": "新美南吉記念館「南吉Q&A・南吉文学について」", "url": "https://www.nankichi.gr.jp/Nankichi/QA2.html"}, {"title": "東京外国語大 ", "ゲルダの友達の男の子。鏡のかけらで心と物の見え方が変わり、雪の女王に連れ去られる。"], ["雪の女王", "雪と氷の世界の女王。カイを自分の城へ連れていく。ゲルダの姉や母ではない。"], ["祖母", "二人に話を聞かせる年配の女性。帰ってきた二人の前で聖書を読む。"], ["花園のおばあさん", "魔法を使う女性。ゲルダを手元に置きたくて、カイのことを忘れさせる。祖母とは別人。"], ["二羽のからす", "森のからすと、城へ出入りする女がらす。ゲルダが城で王子を確かめるのを助ける。"], ["王子と王女", "ゲルダが訪ねた城の二人。王子はカイではないが、旅を続ける支度を助ける。"], ["おいはぎの娘", "ゲルダと同じくらいの大きさの少女。最初は引き止めるが、話を聞いて北へ送り出す。"], ["となかい", "おいはぎの娘に飼われていた動物。解き放たれ、ゲルダを北へ運ぶ。"], ["北の土地の二人の女性", "ラップランドの女とフィンランドの女。別々の家に住み、順にゲルダの旅を助ける。"]], "synopsisSummary": ["悪魔が作った鏡は、美しいものをつまらなく、悪いものをいっそう悪く見せます。鏡が割れると、そのかけらが世界に散りました。一方、町の向かい合う家に住むカイとゲルダは、兄妹のように仲のよい友達です。二人は屋根の上の小さな庭で、ばらを見ながら遊んでいました。ところが、鏡のかけらがカイの目と心臓に入ります。それからカイは、花や人の悪いところばかりを見つけ、ゲルダにも冷たくなってしまいます。", "冬の日、カイは広場で遊びながら、自分の小さなそりを、通りかかった大きな白いそりにつなぎます。そのそりに乗っていたのは雪の女王でした。女王はカイを自分のそりに乗せます。女王の冷たいほおずりを受けたカイは、寒さを感じなくなり、ゲルダや家のことも忘れてしまいました。町の外へ連れ去られたカイがどこにいるのか、残された人たちには分かりません。", "春になると、ゲルダはカイを捜しに出かけます。川で小舟に乗ったところ、舟が岸を離れて流されてしまい、魔法を使えるおばあさんに助けられます。おばあさんはゲルダを手元に置きたくなり、魔法でカイのことを忘れさせます。けれど、ゲルダはばらの花をきっかけにカイを思い出しました。花園を出ると、外はもう秋です。ゲルダは旅を続けます。", "一羽のからすは、ある王女と結婚した若者が、カイかもしれないと教えます。からすと、そのいいなずけの女がらすに案内され、ゲルダは城へ入りますが、王子は別人でした。それでも王子と王女は事情を聞き、服や馬車を用意して、ゲルダを送り出してくれます。捜す相手には会えなくても、旅を助けてくれる人たちとの出会いが重なっていきます。", "森で馬車がおいはぎに襲われ、ゲルダは捕まります。おいはぎの娘はゲルダを守って手元に置き、その話に耳を傾けます。飼われていた森のはとから、カイが雪の女王と北へ向かったと聞くと、娘はゲルダを行かせることにしました。北の土地を知るとなかいを自由にし、ゲルダを背中に乗せて送り出します。ゲルダを引き止めていた娘が、今度は先へ進む力になったのです。", "北の土地では、ラップランドの女がゲルダを暖め、干した魚に手紙を書いて、フィンランドの女のもとへ行くよう教えます。となかいは、ゲルダに強い魔法の力を与えてほしいと頼みます。しかしフィンランドの女は、これほど多くの人や動物の助けを得てきたゲルダには、すでに力があると話します。カイを救うには、目と心臓の鏡のかけらを取り除かなければなりません。城の近くまで運ばれたゲルダは、最後は一人で進み、祈りから現れた天使たちにも助けられます。", "雪の女王が留守の城で、カイは氷の板を並べ、「永遠」という言葉を作ろうとしていました。完成すれば自由にすると、女王に言われていたのです。ゲルダはカイを見つけて抱きしめ、涙を流します。その涙がカイの心臓の氷をとかし、そこにあった鏡のかけらを消しました。ゲルダの歌を聞いたカイも泣き、目のかけらが抜け落ちます。ようやくゲルダが分かったカイは、再会を喜びます。二人の喜びに氷の板まで踊り、自然に「永遠」の形に並びました。女王と戦うことなく、二人は城を出られるようになります。", "帰り道でも、となかいや北の土地の女性たちが二人を助けます。おいはぎの娘にも再会し、やがて二人は祖母のいる町へ帰り着きました。家に入ったカイとゲルダは、自分たちがいつの間にか大きくなっていることに気づきます。それでも心は子供のまま、二人は手を握り合って座ります。祖母が読む聖書と、昔から歌っていたばらの歌が、二人には以前よりよく分かるようになっていました。物語は暖かな夏の中で終わります。"], " 訂版・第13刷です。現代の日本語訳や映画とは混ぜていません。", "termNote": "巨人は原文のogreで、人間を食べる存在です。金の卵を産む鳥はガチョウでなく雌鶏。三度目に隠れるcopperは大きな銅の釜として説明しています。", "checkedDate": "2026年11月3日", "cat": "literature", "primaryCategory": "world-fairytale", "genreLabel": "世界の昔話", "genre": "world-fairytale", "motif": "book", "sub": "イギリスの昔話／ジョセフ・ジェイコブズ採集・再話｜1890年『English Fairy Tales』初刊", "people": [["ジャック", "貧しい母の一人息子。牛を豆と交換し、空の上の家へ三度行く。"], ["ジャックの母", "牛の乳を売って息子と暮らす。豆を庭へ捨て、最後には斧を運んでくる。"], ["不思議な老人", "牛と魔法の豆を交換する人物。ジャックの名前を知っているが、その理由は説明されない。"], ["巨人", "空の上の大きな家に住む、人間を食べる恐ろしい存在。金貨、金の卵を産む鶏、歌う金のハープを持つ。"], ["巨人の妻", "とても大きな女性。最初の二回、ジャックに食事を与え、夫から隠す。三回目には盗んだ少年を疑う。"]], "synopsisSummary": ["ジャックは母と二人で暮らし、牛の乳を売って生活していました。牛が乳を出さなくなったため、売りに行くことになります。途中で出会った老人は、一晩で空まで伸びる豆と牛を交換しようと持ちかけました。ジャックは承知しますが、母は怒って豆を庭へ投げ捨て、夕食を与えず寝かせてしまいます。", "翌朝、豆の木が窓のすぐ外から空まで伸びていました。ジャックは登り、空の上の道を歩いて大きな家に着きます。大きな女性に食べ物を頼むと、夫は子どもを食べる巨人だから逃げなさいと言われます。それでも空腹を訴えるジャックを、女性は台所へ入れて食べさせ、夫が帰るとオーブンの中に隠しました。", "巨人は人間のにおいをかぎつけますが、妻がごまかします。朝食の後、巨人は金貨を数えながら眠ってしまいました。ジャックは金貨の袋を一つ持ち出し、豆の木から庭へ落として、自分も下りて帰ります。母としばらく暮らせましたが、やがて金貨はなくなりました。", "ジャックはもう一度空へ登ります。巨人の妻は前の盗難を疑いますが、話を聞こうと食べ物を与え、またオーブンに隠しました。今度は巨人が、金の卵を産む雌鶏を出させます。巨人が眠るとジャックは鶏を持ち去りました。鳴き声で巨人は目覚めますが、ジャックは逃げ帰り、母の前で鶏に金の卵を産ませます。", "それでも満足せず、ジャックは三度目に登ります。今度は妻の留守を見て忍び込み、大きな銅の釜に隠れました。巨人はオーブンなどを調べますが、見つけられません。食後に金のハープを歌わせ、その音を聞いて眠ります。ジャックがハープを持ち出すと、ハープが主人を呼び、巨人は目を覚まして追ってきました。", "ジャックは豆の木を下り、巨人も後を追います。母に斧を持ってきてもらい、地面へ飛び下りると、ジャックは豆の木を切りました。巨人は落ち、豆の木も倒れます。ジャックと母は、金のハープを人に見せたり金の卵を売ったりして豊かになりました。最後には、ジャックが王女と結婚して幸せに暮らすと語られます。"], "summaryHeading": "要約", "links": ["joseph-jacobs"], "characterGallery": [{"name": "ジャック", "role": "貧しい母の一人息子。牛を豆と交換し、空の上の家へ三度行く。", "wide": false, "portraits": [{"src": "assets/jackbean-face-jack.webp", "label": "物語のころ", "alt": "ジャックの人物イメージ", "width": 500, "height": 500}]}, {"name": "ジャックの母", "role": "牛の乳を売って息子と暮らす。豆を庭へ捨て、最後には斧を運んでくる。", "wide": false, "portraits": [{"src": "assets/jackbean-face-mother.webp", "label": "物語のころ", "alt": "ジャックの母の人物イメージ", "width": 500, "height": 500}]}, {"name": "不思議な老人", "role": "牛と魔法の豆を交換する人物。ジャックの名前を知っているが、その理由は説明されない。", "wide": false, "portraits": [{"src": "assets/jackbean-face-oldman.webp", "label": "物語のころ", "alt": "不思議な老人の人物イメージ", "width": 500, "height": 500}]}, {"name": "巨人", "role": "空の上の大きな家に住む、人間を食べる恐ろしい存在。金貨、金の卵を産む鶏、歌う金のハープを持つ。", "wide": false, "portraits": [{"src": "assets/jackbean-face-giant.webp", "label": "物語のころ", "alt": "巨人の人物イメージ", "width": 500, "height": 500}]}, {"name": "巨人の妻", "role": "とても大きな女性。最初の二回、ジャックに食事を与え、夫から隠す。三回目には盗んだ少年を疑う。", "wide": false, "portraits": [{"src": "assets/jackbean-face-giants-wife.webp", "label": "物語のころ", "alt": "巨人の妻の人物イメージ", "width": 500, "height": 500}]}], "inlineIllustrations": [{"afterParagraph": 2, "src": "assets/jackbean-first-climb-scene.webp", "alt": "窓の外から空へ伸びた豆の木を、ジャックが登ります。", "caption": "窓の外から空へ伸びた豆の木を、ジャックが登ります。", "width": 1200, "height": 800}, {"afterParagraph": 4, "src": "assets/jackbean-golden-hen-scene.webp", "alt": "巨人が眠ったすきに、ジャックは金の卵を産む雌鶏を持ち出そうとします。", "caption": "巨人が眠ったすきに、ジャックは金の卵を産む雌鶏を持ち出そうとします。", "width": 1200, "height": 800}, {"afterParagraph": 6, "src": "assets/jackbean-home-with-harp-scene.webp", "alt": "持ち帰った金のハープと、金の卵が暮らしを変えます。", "caption": "持ち帰った金のハープと、金の卵が暮らしを変えます。", "width": 1200, "height": 800}], "characterGalleryNote": "登場人物の顔や服、家や豆の木の細部は、採用した昔話をもとにした創作です。", "credits": [["イギリスの昔話", null, "伝承"], ["ジョセフ・ジェイコブズ", "じょせふ・じぇいこぶず", "採集・再話"]], "image": "assets/jackbean-first-climb-scene.webp", "imageAlt": "窓の外から空へ伸びた豆の木を、ジャックが登ります。", "headerCaption": "窓の外から空へ伸びた豆の木を、ジャックが登ります。"}, {"id": "joseph-jacobs", "name": "ジョセフ・ジェイコブズ", "reading": "じょせふじぇいこぶず", "cat": "person", "sub": "1854–1916｜昔話の採集・再話者、民俗学者", "motif": "book", "intro": "『ジャックと豆の木』など、伝えられてきた昔話を集め、子どもに届く言葉で語り直した研究者。昔話の原創作者ではなく、採集・再話・編集をした人として紹介します。", "gist": "昔話を読み物として届けながら、その出典や伝わり方も調べた人。", "people": [], "theme": "", "memory": "", "links": ["jack-and-the-beanstalk"], "sources": [{"title": "国立国会図書館典拠：Jacobs, Joseph, 1854–1916", "url": "https://id.ndl.go.jp/auth/ndlna/00444425"}, {"title": "American Jewish Archives：T djvu"}, {"title": "Treccani：Pinocchioの原著成立と刊行", "url": "https://www.treccani.it/enciclopedia/pinocchio/"}], "sourceNote": "原作は1881年から連載され、1883年に単行本となりました。本記事は1902年ベンポラード刊のイタリア語原著を底本とするWikisourceの本文に沿った、独自の日本語解説です。初刊年と参照した版の年を区別しています。現代の日本語訳や映画の設定・図柄は使っていません。", "termNote": "ゼペットは人形を作った育ての父です。妖精の少女と大人の姿は同じ存在で、生みの母という意味ではありません。原典の巨大な海の怪物はイタリア語原著でPesce-caneと呼ばれ、ここではサメとしています。鼻は、うその場面以外にも伸びます。", "checkedDate": "2026年11月3日", "cat": "literature", "primaryCategory": "world-fairytale", "genreLabel": "世界の童話", "genre": "world-fairytale", "motif": "book", "sub": "カルロ・コッローディ｜1883年単行本刊行", "people": [["ピノキオ", "ゼペットが作った、生きて話す木の人形。何度も失敗しながら、人を助ける行動を身につけていく。"], ["ゼペット", "ピノキオを作り、父親として育てる貧しい職人。姿を消したピノキオを捜し続ける。"], ["青い髪の妖精", "ピノキオを救い、成長を支える存在。初めは少女の姿、後には母親のような女性の姿で現れる。"], ["話すコオロギ", "ピノキオに忠告する虫。最初は忠告を拒まれますが、その後の物語に再び現れます。"], ["キツネとネコ", "二匹で組み、金貨が増えるとピノキオをだます。"], ["マンジャフォーコ", "人形芝居の座長。恐ろしい態度も見せるが、ピノキオの話を聞いて金貨をくれる。"], ["ロメオ（ランプの芯）", "ピノキオの友達。「おもちゃの国」へ誘い、自分もロバに変わってしまう。"], ["御者（ぎょしゃ）", "子どもたちを「おもちゃの国」へ運ぶ男。ロバに変わった子どもを売って利益を得る。"], ["マグロ", "大きなサメにのみこまれた魚。ピノキオの脱出を見習い、後に親子を助ける。"]], "synopsisSummary": ["木を削って人形を作るゼペットは、不思議な木切れからピノキオを作ります。ところが、ピノキオは完成する前からいたずらをし、歩けるようになると逃げ出してしまいました。家では、話すコオロギの忠告にも耳を貸しません。それでもゼペットは、失敗したピノキオを見捨てず、学校へ行けるよう自分の上着を売って、文字を学ぶ教材を買ってくれます。", "ピノキオは父のために勉強しようと思いますが、人形芝居の音楽に引かれ、教材を売って入場してしまいます。座長マンジャフォーコに危うく薪にされかけるものの、仲間の人形をかばう勇気を見せました。父の貧しさを聞いた座長は金貨を五枚くれます。帰り道、キツネとネコが、金貨を畑に埋めれば増えると持ちかけます。ピノキオは二匹を信じてついていきました。", "旅の途中で二人組の盗賊に襲われ、命を失いかけますが、青い髪の妖精に助けられます。妖精に金貨のことを聞かれ、なくしたとうそを重ねると、鼻が長く伸びてしまいました。妖精の助けで鼻は元に戻ります。しかし、ピノキオはまたキツネとネコを信じ、宿代を引いた四枚を畑に埋めます。金貨は二匹に盗まれ、裁判所に訴えても、逆に自分が牢屋に入れられてしまいます。", "ようやく自由になったピノキオは、いくつもの災難を経て、父が自分を捜して船で海へ出たと知ります。父の船が波に消えるのを見て、助けようと海へ飛び込みますが、別の島へ流れ着きました。そこで、大人の女性の姿になった青い髪の妖精と再会します。妖精は母親のように支え、ピノキオは学校で熱心に学ぶようになります。失敗や寄り道もしますが、やがて妖精から、翌日には本当の少年になれると告げられました。", "ところが、その前夜、友達のロメオに誘われます。ロメオは細い体から「ランプの芯」というあだ名で呼ばれる少年です。二人は勉強せず遊び続けられる「おもちゃの国」へ行ってしまいます。五か月後、二人の体はロバに変わりました。子どもたちを連れてきた御者は、ロバに変わった子を売って金もうけをしていたのです。ピノキオはサーカスに売られ、けがをすると、皮を欲しがる別の買い手に引き渡されます。", "買い手に海へ沈められますが、妖精の送った魚たちの助けでロバの姿が取れ、木の人形に戻ります。泳いで逃げた先で、今度は巨大なサメにのみこまれてしまいました。その腹の中で、同じくのみこまれていたゼペットと再会します。父は二年もの間、残っていた食料で暮らしていましたが、食料も明かりも尽きようとしていました。", "今度はピノキオが父を助ける番です。サメが口を開けて眠る夜を利用し、泳げない父を背負って外の海へ出ます。途中で力尽きそうになりますが、腹の中で出会ったマグロが二人を岸まで運んでくれました。親子は話すコオロギの小屋に迎えられます。ピノキオは弱った父の牛乳を手に入れるために水汲みをし、籠を作って売り、夜には読み書きを学びました。", "五か月余りたったころ、妖精が病気で困っていると聞くと、新しい服を買うためにためた金を送り、さらに働きます。その夜、夢の中の妖精に認められ、翌朝には木の人形ではなく、人間の少年になっていました。父も元気になり、部屋には以前の木の人形が残っています。目先の楽しさに流されていたピノキオは、助けてもらうだけでなく、誰かを支える毎日を送るようになったのです。"], "summaryHeading": "要約", "links": ["carlo-collodi", "aliceinwonderland", "wizardofoz"], "characterGallery": [{"name": "ピノキオ", "role": "ゼペットが作った、生きて話す木の人形。何度も失敗しながら、人を助ける行動を身につけていく。", "wide": true, "portraits": [{"src": "assets/pinocchio-face-puppet.webp", "label": "木の人形のころ", "alt": "ピノキオの人物イメージ", "width": 500, "height": 500}, {"src": "assets/pinocchio-face-human.webp", "label": "結末の人間の少年", "alt": "ピノキオの人物イメージ", "width": 500, "height": 500}]}, {"name": "ゼペット", "role": "ピノキオを作り、父親として育てる貧しい職人。姿を消したピノキオを捜し続ける。", "wide": true, "portraits": [{"src": "assets/pinocchio-face-geppetto.webp", "label": "物語の初め", "alt": "ゼペットの人物イメージ", "width": 500, "height": 500}, {"src": "assets/pinocchio-face-geppetto-later.webp", "label": "海で再会したころ", "alt": "ゼペットの人物イメージ", "width": 500, "height": 500}]}, {"name": "青い髪の妖精", "role": "ピノキオを救い、成長を支える存在。初めは少女の姿、後には母親のような女性の姿で現れる。", "wide": true, "portraits": [{"src": "assets/pinocchio-face-fairy-girl.webp", "label": "初めの少女の姿", "alt": "青い髪の妖精の人物イメージ", "width": 500, "height": 500}, {"src": "assets/pinocchio-face-fairy-adult.webp", "label": "後の大人の姿", "alt": "青い髪の妖精の人物イメージ", "width": 500, "height": 500}]}, {"name": "話すコオロギ", "role": "ピノキオに忠告する虫。最初は忠告を拒まれますが、その後の物語に再び現れます。", "wide": false, "portraits": [{"src": "assets/pinocchio-face-cricket.webp", "label": "忠告する虫", "alt": "話すコオロギの人物イメージ", "width": 500, "height": 500}]}, {"name": "キツネとネコ", "role": "二匹で組み、金貨が増えるとピノキオをだます。", "wide": false, "portraits": [{"src": "assets/pinocchio-face-fox-cat.webp", "label": "左：キツネ／右：ネコ", "alt": "キ ルロ・ロレンツィーニです。新聞や雑誌で社会や演劇について書き、童話の翻訳や子どもの読み物にも取り組みました。", "gist": "木の人形の冒険で知られる、新聞記者でもあった作家。『ピノキオ』は1881年に連載が始まり、1883年に一冊の本になりました。", "people": [], "theme": "", "memory": "", "links": ["pinocchio"], "sources": [{"title": "RAI Cultura：Collodi, creatore di Pinocchio（生没・連載開始）", "url": "https://www.raicultura.it/letteratura/articoli/2018/12/Collodi-creatore-di-Pinocchio-7ae294e6-008e-47be-bd26-c2310ceeccc9.html"}, {"title": "Pinocchio Museum Experience：The Author and the Novel", "url": "https://www.pinocchioflorence.it/en/pinocchio"}, {"title": "イタリア百科事典協会 Treccani：Collodi, Carlo（L’Unificazione）", "url": "https://www.treccani.it/enciclopedia/carlo-collodi_(L'Unificazione)/"}, {"title": "マルチェッリアーナ図書館：Collodi scrittore per l’infanzia 展示解説", "url": "https://marucelliana.cultura.gov.it/2026/10/01/inaugurazione-della-mostra-cera-una-volta-un-re-collodi-scrittore-per-linfanzia-con-un-percorso-biografico-documentario/"}, {"title": "Storia di Firenze・Sara Mori：1883年2月の『ピノキオ』刊行", "url": "https://www.storiadifirenze.org/?temadelmese=febbraio-1883-escono-le-avventure-di-pinocchio-2"}, {"title": "フィレンツェ国立中央図書館：Collodi. Percorso biografico documentario", "url": "https://bncf.cultura.gov.it/attivita/mostra-collodi-percorso-biografico-documentario/"}, {"title": "Wikisource：イタリア語原著（1902年刊底本）第36章", "url": "https://it.wikisource.org/wiki/Le_avventure_di_Pinocchio/Capitolo_36"}], "bodyReadings": {"ピノキオ": "ぴのきお", "筆名": "ひつめい", "独立": "どくりつ", "風刺": "ふうし", "皮肉": "ひにく", "演劇": "えんげき", "翻訳": "ほんやく", "妖精": "ようせい", "刊行": "かんこう", "連載": "れんさい", "単行本": "たんこうぼん", "編集者": "へんしゅうしゃ", "自筆原稿": "じひつげんこう", "終章": "しゅうしょう"}, "checkedDate": "2026年11月3日", "primaryCategory": "person", "genreLabel": "人物", "sourceNote": "図書館・博物館・公共放送の資料と、イタリア百科事典協会の伝記解説などを参照しました。1881年は連載開始、1883年は原作の単行本刊行です。最後の節はイタリア語原著の終章（参照底本1902年刊）をもとにした独自の読書案内で、作者自身の意図の断定ではありません。", "authorTextOnly": true, "portraitNote": "この紹介には本人の肖像は掲載していません。", "longTitle": true}, {"id": "pandora", "name": "パンドラの箱", "reading": "ぱんどらのはこ", "intro": "神々から人間のもとへ送られたパンドラ。彼女が壺のふたを開けたことから、世界の暮らしは変わります。「箱」というよく知られた題名と、古代の詩に書かれた壺を区別して読む物語です。", "gist": "人間へ火を取り戻したプロメテウスに怒ったゼウスが、贈り物に見せかけた災いを送る。", "bodyReadings": {"仕事と日々": "しごととひび", "壺": "つぼ", "災い": "わざわい", "希望": "きぼう", "鍛冶": "かじ", "空洞": "くうどう", "織物": "おりもの", "忠告": "ちゅうこく", "意志": "いし", "神話": "しんわ"}, "sources": [{"title": "Hesiod, Works and Days, 42–105行／Evelyn-White英訳", "url": "https://www.gutenberg.org/cache/epub/348/pg348-images.html"}, {"title": "英訳書誌・訳者1884–1924・米国PD表示", "url": "https://www.gutenberg.org/ebooks/348"}, {"title": "Indiana大学図書館：訳者生没年の書誌標目", "url": "https://iucat.iu.edu/lilly/3914254"}, {"title": "1914年初刷・1920年再刷の標題転記", "url": "https://en.wikisource.org/wiki/Hesiod,_the_Homeric_Hymns_and_Homerica"}], "sourceNote": "ヘシオドス『仕事と日々』42–105行の、Hugh G. Evelyn-Whiteによる1914年初刊英訳を参照した独自日本語解説です。Project Gutenberg 348の英訳本文を使用し、Wikisourceの1920年再刷標題で1914年初刷の記載を照合しました。『神統記』の別のパンドラ物語や、後世の再話を混ぜていません。", "termNote": "「パンドラの箱」は一般に知られた題名として用い、採用本文の容器は壺と説明します。希望は外へ出ず壺に残ります。開ける禁止命令、好奇心の独白、最後に希望を解き放つ場面は、この本文にはありません。", "checkedDate": "2026年11月3日", "cat": "myth", "primaryCategory": "myth", "genreLabel": "神話・伝説（ギリシャ神話）", "genre": "greek-myth", "motif": "book", "sub": "ヘシオドスの『仕事と日々』に伝わるギリシャ神話", "people": [["パンドラ", "ゼウスの計画で神々が形づくり、エピメテウスのもとへ送られる女性。壺のふたを開ける。"], ["ゼウス", "神々を率いる神。人間へ火を取り戻したプロメテウスに怒り、パンドラを送る計画を立てる。"], ["プロメテウス", "人間のために火を取り戻し、エピメテウスにゼウスの贈り物を受け取らないよう警告する。"], ["エピメテウス", "忠告を忘れ、ゼウスから送られたパンドラを受け入れる。"], ["ヘルメス", "ゼウスの命令を受け、パンドラをエピメテウスのもとへ届ける神。"], ["ヘパイストス", "土と水からパンドラの姿を作る神。"], ["アテナ", "パンドラに織物を教え、衣服や装いを与える女神。"]], "synopsisSummary": ["人間の暮らしに、なぜ苦労や病気があるのでしょうか。ヘシオドスの『仕事と日々』は、その由来を神々の物語で語ります。ゼウスは、知恵のあるプロメテウスにだまされたことを怒り、人間から火を隠しました。ところが、プロメテウスは中が空洞になった植物の茎に火を隠し、人間のために取り戻します。ゼウスはこれを知り、火の代わりに、人間が喜んで受け取る災いを送ろうと考えました。", "ゼウスは鍛冶の神ヘパイストスに、土と水から、人間の声と力を持つ美しい娘を作るよう命じます。アテナは織物の技を教え、神々は娘に装いや飾りを与えました。ヘルメスはゼウスの命令で、言葉や、相手をあざむく性質を備えさせます。神々から贈り物を与えられた娘は、パンドラと名づけられました。本人が最初から一人で災いを企てたのではなく、ゼウスの計画の中で作られた存在なのです。", "ヘルメスは、パンドラをゼウスからの贈り物としてエピメテウスのもとへ連れていきます。プロメテウスは前もって、ゼウスからの贈り物は受け取らず返すよう、エピメテウスに忠告していました。しかしエピメテウスはその忠告を忘れて受け入れ、取り返しのつかないことが起こってから危険を悟ります。", "それまで人間は、災いも厳しい労働も重い病気も知らずに暮らしていた、と詩は語ります。パンドラが大きな壺のふたを取ると、それらが外へ広がり、人々の暮らしは苦しみを抱えるようになりました。この場面の容器は、題名から想像される小さな箱ではなく、ふたのある壺です。採用した本文には、開けてはいけないという命令や、好奇心で迷う場面は書かれていません。", "壺の中には、希望だけが残りました。ゼウスの意志によってふたが閉じられたため、希望は外へ出なかったのです。一方、外へ出た数え切れない災いは、陸にも海にも広がります。病気は声もなく人々を訪れる、と語り手は続けます。物語は、希望が後から飛び出してすべてを解決する場面ではなく、ゼウスの意志からは逃れられないという言葉で、この一節を結んでいます。"], "summaryHeading": "要約", "links": ["hesiod"], "characterGallery": [{"name": "パンドラ", "role": "ゼウスの計画で神々が形づくり、エピメテウスのもとへ送られる女性。壺のふたを開ける。", "wide": false, "portraits": [{"src": "assets/pandora-face-pandora.webp", "label": "神話の人物の想像像", "alt": "パンドラの人物イメージ", "width": 500, "height": 500}]}, {"name": "ゼウス", "role": "神々を率いる神。人間へ火を取り戻したプロメテウスに怒り、パンドラを送る計画を立てる。", "wide": false, "portraits": [{"src": "assets/pandora-face-zeus.webp", "label": "神話の人物の想像像", "alt": "ゼウスの人物イメージ", "width": 500, "height": 500}]}, {"name": "プロメテウス", "role": "人間のために火を取り戻し、エピメテウスにゼウスの贈り物を受け取らないよう警告する。", "wide": false, "portraits": [{"src": "assets/pandora-face-prometheus.webp", "label": "神話の人物の想像像", "alt": "プロメテウスの人物イメージ", "width": 500, "height": 500}]}, {"name": "エピメテウス", "role": "忠告を忘れ、ゼウスから送られたパンドラを受け入れる。", "wide": false, "portraits": [{"src": "assets/pandora-face-epimetheus.webp", "label": "神話の人物の想像像", "alt": "エピメテウスの人物イメージ", "width": 500, "height": 500}]}, {"name": "ヘルメス", "role": "ゼウスの命令を受け、パンドラをエピメテウスのもとへ届ける神。", "wide": false, "portraits": [{"src": "assets/pandora-face-hermes.webp", "label": "神話の人物の想像像", "alt": "ヘルメスの人物イメージ", "width": 500, "height": 500}]}, {"name": "ヘパイストス", "role": "土と水からパンドラの姿を作る神。", "wide": false, "portraits": [{"src": "assets/pandora-face-hephaestus.webp", "label": "神話の人物の想像像", "alt": "ヘパイストスの人物イメージ", "width": 500, "height": 500}]}, {"name": "アテナ", "role": "パンドラに織物を教え、衣服や装いを与える女神。", "wide": false, "portraits": [{"src": "assets/pandora-face-athena.webp", "label": "神話の人物の想像像", "alt": "アテナの人物イメージ", "width": 500, "height": 500}]}], "inlineIllustrations": [{"afterParagraph": 2, "src": "assets/pandora-adorned-scene.webp", "alt": "ゼウスの命令で、神々はパンドラに姿や装い、さまざまな力を与えます。", "caption": "ゼウスの命令で、神々はパンドラに姿や装い、さまざまな力を与えます。", "width": 1200, "height": 800}, {"afterParagraph": 3, "src": "assets/pandora-arrival-scene.webp", "alt": "ヘルメスはパンドラを連れてきます。エピメテウスは、ゼウスの贈り物を受け入れてしまいます。", "caption": "ヘルメスはパンドラを連れてきます。エピメテウスは、ゼウスの贈り物を受け入れてしまいます。", "width": 1200, "height": 800}, {"afterParagraph": 4, "src": "assets/pandora-jar-scene.webp", "alt": "パンドラが壺のふたを取ると、災いが人間の世界へ広がります。", "caption": "パンドラが壺のふたを取ると、災いが人間の世界へ広がります。", "width": 1200, "height": 800}], "characterGalleryNote": "人物の顔、衣服や場所の細部、災いを表す影は、原文をもとにした創作的な表現です。", "credits": [["ギリシャ神話", null, "伝承"], ["ヘシオドス", "へしおどす", "採用原典『仕事と日々』"]], "image": "assets/pandora-jar-scene.webp", "imageAlt": "パンドラが壺のふたを取ると、災いが人間の世界へ広がります。", "headerCaption": "パンドラが壺のふたを取ると、災いが人間の世界へ広がります。"}, {"id": "hesiod", "name": "ヘシオドス", "reading": "へしおどす", "cat": "person", "sub": "生没年不詳｜紀元前700年ごろ活動したとされる古代ギリシャの詩人", "motif": "book", "intro": "『仕事と日々』などで知られる古代ギリシャの詩人。神々の物語と、働いて暮らす人々の問題を語りました。詳しい生涯には分からないことが多く残っています。", "gist": "神話と人間の暮らしを、同じ詩の中で語った古代の詩人。", "people": [], "theme": "", "memory": "", "links": ["pandora"], "sources": [{"title": "Metropolitan Museum：人物標目の活動年代", "url": "https://www.metmuseum.org/art/collection/search/337384"}, {"title": "Metropolitan Museum：幾何学様式期のギリシャ", "url": "https://www.metmuseum.org/essays/geometric-art-in-ancient-greece"}, {"title": "Hesiod, Works and Days／旧英訳", "url": "https://www.gutenberg.org/cache/epub/348/pg348-images.html"}], "bodyReadings": {"仕事と日々": "しごととひび", "パンドラの箱": "ぱんどらのはこ", "紀元前": "きげんぜん", "生没年": "せいぼつねん", "詩人": "しじん", "壺": "つぼ", "希望": "きぼう"}, "checkedDate": "2026年11月3日（日本時間）", "primaryCategory": "person", "genreLabel": "人物", "sourceNote": "機関資料で確認できるおおよその活動時期と、作品に語られる内容を区別した紹介です。生没年や生涯の細部には不明な点があります。最後の節は図鑑独自の読書案内です。", "authorTextOnly": true, "portraitNote": "この紹介には本人の肖像は掲載していません。", "longTitle": true}, {"id": "gakumon-no-susume", "name": "学問のすゝめ", "reading": "がくもんのすすめ", "intro": "なぜ学ぶのか。学んだことを、暮らしや社会でどう使うのか。福澤諭吉が、個人の独立から政治、家庭、人との付き合いまで考えた文章です。", "gist": "知識を覚えるだけでなく、自分で判断し、人に伝え、社会で生かす学びを考える。", "bodyReadings": {"学問のすゝめ": "がくもんのすすめ", "福澤諭吉": "ふくざわゆきち", "小幡篤次郎": "おばたとくじろう", "初編": "しょへん", "同著者": "どうちょしゃ", "独立": "どくりつ", "政府": "せいふ", "民間": "みんかん", "慣習": "かんしゅう", "従順": "じゅうじゅん", "演説": "えんぜつ", "先人": "せんじん", "誠実": "せいじつ", "論旨": "ろんし", "第17編": "だいじゅうななへん"}, "sources": [{"title": "青空文庫：福沢諭吉『学問のすすめ』原著本文", "url": "https://www.aozora.gr.jp/cards/000296/files/47061_29420.html"}, {"title": "慶應義塾図書館：初編の書誌・成立", "url": "https://dcollections.lib.keio.ac.jp/en/fukuzawa/a15/42"}, {"title": "慶應義塾福沢研究センター：小幡篤次郎と初編同著", "url": "https://www.fmc.keio.ac.jp/research/obata-series"}], "sourceNote": "青空文庫の新字新仮名による原著本文を参照した、図鑑独自の平易な解説です。初編から十七編まで、端書と四編付録も含めて分担読解しました。底本は1984年刊『日本の名著33 福沢諭吉』、その親本は1959年刊『福沢諭吉全集 第三巻』です。現代語訳や現代の解説は転用していません。", "termNote": "「独立」は自分で判断し生活や社会の責任を担うこと。「演説」は人前で考えを話して伝えることです。本書の政治・家庭・社会への評価は明治期の議論として示し、現在の法律や科学の説明とは区別しています。", "checkedDate": "2026年11月3日", "cat": "literature", "primaryCategory": "japanese-literature", "genreLabel": "日本の思想・論説", "genre": "japanese-nonfiction", "motif": "book", "sub": "福澤諭吉（初編は小幡篤次郎と同著）｜初編1872年・全17編は1876年まで", "people": [["福澤諭吉", "本書の著者。学問を生活や社会で使い、自分で考えることを説く。"], ["小幡篤次郎", "初編に同著者として名を連ねる教育者。全17編すべての共同著者という意味ではない。"]], "synopsisSummary": ["『学問のすゝめ』は、事件が進む小説ではなく、学ぶことと社会のあり方を考える全17編の文章です。冒頭では、生まれつき人に上下があるのではないという考えを示します。そのうえで、読み書きや計算、歴史、地理などを学び、暮らしに生かすことが大切だと説きます。本を読むだけでなく、人に聞き、自分で考え、実際の仕事に使うところまでが学問なのです。", "次に、一人ひとりの独立と、国の独立を結びつけます。いつも人任せにしていれば、自分のことも国のことも判断できません。ただし、独立とは誰も助けないことではなく、独立できない人を支え、共に力をつけることも含みます。社会をよくする仕事を政府だけに任せず、民間でも教育、商売、出版などを育てようと呼びかけます。", "政府と人々の関係についても考えます。人々には法律を守る役割がありますが、政治を任せきりにせず、不都合な法律には道理を示して意見を述べる役割もあります。また、他人の意思を勝手に支配しないという考えを、家庭の関係にも向けます。妻だけに従順さを求める慣習や、親が子を自分の都合で扱うことを批判するのです。", "学問の目的は、自分が食べていけるようになることだけではない、と議論は続きます。私たちは先人が積み重ねた知識や仕事に支えられています。だから、学んだ人は自分の力を深め、社会や後の世代にも役立てる必要があると説きます。知識を頭にしまうだけでなく、文章や演説で伝え、実際の行動へ移すことも重視します。", "後半では、日々の心の動きにも目を向けます。思いどおりにならないとき、他人をうらやみ、うらむだけでは問題は解けません。計画と実際の結果を比べ、自分の考えを点検することが大切です。同時に、人が自由に話したり働いたりできない関係も、うらみを生む原因になると考えています。本人の気持ちだけを責める話ではありません。", "また、日本の古い習慣だから正しい、西洋の新しいものだから優れている、と決めつけることを戒めます。自分で調べ、比べ、採るものと改めるものを判断しなければなりません。買い物や生活でも、他人の持ち物をまねすることに振り回されれば、心の独立を失います。高い理想を語るだけでなく、自分の実際の働きも確かめるよう求めます。", "最後の第17編は、人から信頼されることを扱います。見せかけの評判ではなく、仕事をする力と誠実さに見合った信頼が大切だと説きます。そのために、考えを相手にわかる言葉で伝え、職業や立場の違う人とも広く交わることを勧めます。学びは一人で知識を増やすだけで終わらず、人と関わり、社会の中で働かせるものとして結ばれます。"], "summaryHeading": "論旨をたどる要約", "links": ["fukuzawa-yukichi", "obata-tokujiro"], "inlineIllustrations": [{"afterParagraph": 1, "src": "assets/gakumon-practical-learning-scene.webp", "alt": "読み書きや計算を、暮らしの中で使う学び。本文の考えを表した説明イメージです。", "caption": "読み書きや計算を、暮らしの中で使う学び。本文の考えを表した説明イメージです。", "width": 1200, "height": 800}, {"afterParagraph": 4, "src": "assets/gakumon-sharing-ideas-scene.webp", "alt": "学んだことを言葉で人に伝える。演説を勧める議論の説明イメージです。", "caption": "学んだことを言葉で人に伝える。演説を勧める議論の説明イメージです。", "width": 1200, "height": 800}, {"afterParagraph": 7, "src": "assets/gakumon-open-conversation-scene.webp", "alt": "立場の違う人とも話し、知り合う。最後の人望論につながる説明イメージです。", "caption": "立場の違う人とも話し、知り合う。最後の人望論につながる説明イメージです。", "width": 1200, "height": 800}], "characterGalleryNote": "挿絵は本文の考えを伝える説明イメージです。描かれた人は実在の著者ではなく、服や場所の細部も創作です。", "contentType": "nonfiction-guide", "peopleHeading": "著者・関係する人", "introHeading": "この本について", "introBadge": "論旨の入口", "interpretationNote": "採用原典の議論を踏まえた読み方の一例です。", "credits": [["福澤諭吉", "ふくざわゆきち", "著者"], ["小幡篤次郎", "おばたとくじろう", "初編の同著者"]], "image": "assets/gakumon-practical-learning-scene.webp", "imageAlt": "読み書きや計算を、暮らしの中で使う学び。本文の考えを表した説明イメージです。", "headerCaption": "読み書きや計算を、暮らしの中で使う学び。本文の考えを表した説明イメージです。"}, {"id": "fukuzawa-yukichi", "name": "福澤諭吉", "reading": "ふくざわゆきち", "cat": "person", "sub": "1835–1901｜学問と社会の独立を考えた教育者・著述家", "motif": "book", "intro": "『学問のすゝめ』を書き、慶應義塾を開いた教育者・著述家。外国で得た知識を紹介し、一人ひとりが学び、自分で考えることを説きました。", "gist": "学ぶことを暮らしや社会につなげ、本と教育と言論で伝えた人。", "people": [], "theme": "", "memory": "", "links": ["gakumon-no-susume"], "sources": [{"title": "慶應義塾：創立者 福澤諭吉（年譜）", "url": "https://www.keio.ac.jp/ja/about/philosophy/fukuzawa/"}, {"title": "慶應義塾：歴史", "url": "https://www.keio.ac.jp/ja/about/philosophy/history/"}, {"title": "慶應義塾福沢研究センター：小幡篤次郎と初編の同著", "url": "https://www.fmc.keio.ac.jp/research/obata-series"}, {"title": "慶應義塾大学図書館：福澤諭吉について", "url": "https://libguides.lib.keio.ac.jp/keio/fukuzawa"}, {"title": "青空文庫：学問のすすめ", "url": "https://www.aozora.gr.jp/cards/000296/files/47061_29420.html"}], "bodyReadings": {"福澤諭吉": "ふくざわゆきち", "学問のすゝめ": "がくもんのすすめ", "慶應義塾": "けいおうぎじゅく", "中津": "なかつ", "緒方洪庵": "おがたこうあん", "適塾": "てきじゅく", "蘭学": "らんがく", "小幡篤次郎": "おばたとくじろう", "同著": "どうちょ", "西洋事情": "せいようじじょう", "文明論之概略": "ぶんめいろんのがいりゃく", "時事新報": "じじしんぽう", "著述家": "ちょじゅつか", "漢学": "かんがく"}, "checkedDate": "2026年11月3日", "primaryCategory": "person", "genreLabel": "人物", "sourceNote": "年譜と学校の歩みは慶應義塾の資料で確認しました。生年月日は西暦で示しています。作品の読み方は図鑑独自の読書案内です。肖像は掲載していません。", "authorTextOnly": true, "portraitNote": "この紹介には本人の肖像は掲載していません。", "longTitle": true}, {"id": "obata-tokujiro", "name": "小幡篤次郎", "reading": "おばたとくじろう", "cat": "person", "sub": "1842–1905｜教育と翻訳で慶應義塾を支えた人", "motif": "book", "intro": "教育や翻訳に携わり、慶應義塾の運営を支えた人です。『学問のすゝめ』初編には、福澤諭吉とともに同著者として名が記されています。", "gist": "教えること、訳すこと、学校を運営することを通して、新しい知識を広めた。", "people": [], "theme": "", "memory": "", "links": ["gakumon-no-susume"], "sources": [{"title": "慶應義塾大学出版会：小幡篤次郎著作集 第一巻・著者紹介", "url": "https://www.keio-up.co.jp/book/b10164627.html"}, {"title": "慶應義塾図書館：学問のすゝめ初編の書誌", "url": "https://dcollections.lib.keio.ac.jp/en/fukuzawa/a15/42"}, {"title": "青空文庫：学問のすすめ（初編端書）", "url": "https://www.aozora.gr.jp/cards/000296/files/47061_29420.html"}], "bodyReadings": {"小幡篤次郎": "おばたとくじろう", "学問のすゝめ": "がくもんのすすめ", "福澤諭吉": "ふくざわゆきち", "慶應義塾": "けいおうぎじゅく", "中津": "なかつ", "漢学": "かんがく", "進脩館": "しんしゅうかん", "同著者": "どうちょしゃ", "初編": "しょへん", "端書": "はしがき", "天変地異": "てんぺんちい", "文明論之概略": "ぶんめいろんのがいりゃく", "交詢社": "こうじゅんしゃ", "蔵書": "ぞうしょ"}, "checkedDate": "2026年11月3日", "primaryCategory": "person", "genreLabel": "人物", "sourceNote": "慶應義塾大学出版会の人物紹介と慶應義塾図書館の書誌、青空文庫の初編端書を確認しました。執筆分担が特定できない点を区別し、読書案内は独自に記述しています。肖像は掲載していません。", "authorTextOnly": true, "portraitNote": "この紹介には本人の肖像は掲載していません。", "longTitle": true}, {"id": "utayomi-ni-atauru-sho", "name": "歌よみに与ふる書", "reading": "うたよみにあたうるしょ", "intro": "有名な人が作った歌なら、よい歌なのでしょうか。昔からの言葉や決まりは、必ず守るべきなのでしょうか。正岡子規が和歌を作る人たちに問いかけ、表現を新しくする道を考えた全10篇の評論です。", "gist": "名声や決まりに頼らず、自分が感じた美しさを、よく伝わる言葉で表す。", "bodyReadings": {"歌よみに与ふる書": "うたよみにあたうるしょ", "正岡子規": "まさおかしき", "源実朝": "みなもとのさねとも", "万葉集": "まんようしゅう", "古今集": "こきんしゅう", "紀貫之": "きのつらゆき", "和歌": "わか", "漢詩": "かんし", "評論": "ひょうろん", "歌論": "かろん", "流派": "りゅうは", "写実": "しゃじつ", "妖怪": "ようかい", "漢語": "かんご", "字余り": "じあまり", "優劣": "ゆうれつ", "論旨": "ろんし", "名詞": "めいし"}, "sources": [{"title": "青空文庫：歌よみに与ふる書（新字旧仮名・全10篇）", "url": "https://www.aozora.gr.jp/cards/000305/files/2533_16281.html"}, {"title": "青空文庫：採用底本・著者情報 No.2533", "url": "https://www.aozora.gr.jp/cards/000305/card2533.html"}, {"title": "青空文庫：各篇の初出確認用図書カード No.46534", "url": "https://www.aozora.gr.jp/cards/000305/card46534.html"}], "sourceNote": "青空文庫No.2533の新字旧仮名による原著全10篇を参照した、図鑑独自の平易な解説です。底本は岩波文庫『歌よみに与ふる書』（1955年初刊、1983年改版。入力本2002年第26刷）です。初出の日付は別の図書カードNo.46534でも確認しましたが、本文は混ぜていません。", "termNote": "ここでの「歌」は和歌のこと。「評論」は作品などのよさや問題を理由とともに論じる文章です。「字余り」は定型の音数を超えること。「写実」は本文で事実の記録だけに限られない意味で論じられます。子規による作品評価と、現在の一般的な評価は区別しています。", "checkedDate": "2026年11月3日", "cat": "literature", "primaryCategory": "japanese-literature", "genreLabel": "日本の評論・歌論", "genre": "japanese-nonfiction", "motif": "book", "sub": "正岡子規｜1898年発表", "people": [["正岡子規", "本書の著者。既存の和歌を厳しく評しながら、歌の表現を広げようとする。"]], "synopsisSummary": ["『歌よみに与ふる書』は、正岡子規が歌を作る人たちに呼びかけた、手紙の形の評論です。全10篇で、和歌の作り方や評価の仕方を問い直します。子規は源実朝や『万葉集』の歌を高く評価する一方、名高い『古今集』や紀貫之を厳しく批判します。ただし、貫之の歌にもよい一首を認めています。有名だからすべてよいと決めず、一つひとつの歌を読むことが出発点です。", "続いて、和歌だけを知り、それが文学で一番優れていると思い込む態度を批判します。俳句、漢詩、西洋の詩、劇などには、それぞれ違う長所があります。ゆったりした調子だけでなく、短く力のこもった調子でも、心の動きは表せます。昔の歌や同じ流派の本だけを読まず、ほかの文学と比べることで、自分が見落としていたよさに気づけると考えるのです。", "第4・5篇では、よく知られた歌を例に、どの言葉が効果を弱めているかを説明します。必要のない前置き、当たり前のことを説明し直す理屈、決まりきった言葉遊びなどが批判の対象です。小さなことを大げさに言うだけでは、景色や気持ちはよく伝わりません。ただし、想像で作る歌をすべて否定するのではありません。現実にはない世界を思い切って描く面白さも認めています。", "第6篇では、自分の主張への誤解を解きます。子規は、目の前の景色だけを書き、感情は書くなと言っているのではありません。橋のそばの柳を描く場合も、その景色を美しいと感じて選ぶ心があります。また、写実とは、実際に起きた事実だけを並べることでもありません。観察した姿や形を組み合わせれば、神や妖怪のような想像上のものも描けると説明します。", "子規が目指すのは、和歌を捨てることではなく、表せることを広げることです。第7篇では、使う言葉が少なければ、内容も似たものばかりになりやすいと考えます。古くから歌に使われてきた言葉に限らず、漢語や外国から来た言葉も、表現に役立つなら使ってよい。自分は古い言葉だけで作ると決めても、それをほかの人に強制すべきではない、と説きます。", "第8・9篇では、よいと思う歌を具体的に読みます。実朝の歌では、名詞が多く、言葉が引き締まっていることや、強い調子に注目します。決まった音数を超える「字余り」も、いつも失敗なのではなく、切実な気持ちや勢いを伝える働きをする場合があります。景色を描く歌も、心の中を直接歌う作品も取り上げ、形だけで優劣を決めない読み方を示します。", "最後の第10篇では、作者の年齢や地位だけで歌をほめることを戒めます。大切なのは、自分が美しいと感じたことを、よく伝わる言葉で表すことです。古い決まりに従う場合でも、その表現が適しているから選ぶのであって、昔からの決まりだからではありません。一方、新しい言葉を入れるだけでも十分ではない。汽車を歌うなら、周囲の花や草、遠くに見える景色との組合せまで考えるよう勧めて、議論を結びます。"], "summaryHeading": "論旨をたどる要約", "links": ["masaoka-shiki"], "inlineIllustrations": [{"afterParagraph": 2, "src": "assets/utayomi-comparing-books-scene.webp", "alt": "いろいろな文学を比べ、違うよさを知る。本文の考えを表した説明イメージです。", "caption": "いろいろな文学を比べ、違うよさを知る。本文の考えを表した説明イメージです。", "width": 1200, "height": 800}, {"afterParagraph": 4, "src": "assets/utayomi-willow-observation-scene.webp", "alt": "橋のそばの柳を美しいと感じて選ぶことにも、心の働きがあります。本文の例を表す説明イメージです。", "caption": "橋のそばの柳を美しいと感じて選ぶことにも、心の働きがあります。本文の例を表す説明イメージです。", "width": 1200, "height": 800}, {"afterParagraph": 7, "src": "assets/utayomi-train-and-flowers-scene.webp", "alt": "新しい道具の名だけでなく、周りの景色との組合せも考える。菜の花の向こうの汽車という本文の例です。", "caption": "新しい道具の名だけでなく、周りの景色との組合せも考える。菜の花の向こうの汽車という本文の例です。", "width": 1200, "height": 800}], "characterGalleryNote": "挿絵は本文の議論や例を表す説明イメージです。描かれた人は正岡子規ではなく、場所・服・道具の細部も創作です。", "contentType": "nonfiction-guide", "peopleHeading": "著者", "introHeading": "この本について", "introBadge": "論旨の入口", "interpretationNote": "採用原典の議論を踏まえた読み方の一例です。", "credits": [["正岡子規", "まさおかしき", "著者"]], "image": "assets/utayomi-comparing-books-scene.webp", "imageAlt": "いろいろな文学を比べ、違うよさを知る。本文の考えを表した説明イメージです。", "headerCaption": "いろいろな文学を比べ、違うよさを知る。本文の考えを表した説明イメージです。"}, {"id": "masaoka-shiki", "name": "正岡子規", "reading": "まさおかしき", "cat": "person", "sub": "1867–1902｜日本の俳人・歌人", "motif": "book", "intro": "俳句と短歌を新しい目で読み直し、自分の感じたことに合う言葉を探した文学者。『歌よみに与ふる書』や『病牀六尺』を残し、夏目漱石とも交流しました。", "gist": "有名だからよい、昔からそうだから正しい、という見方を問い直した俳人・歌人。", "people": [], "theme": "", "memory": "", "links": ["utayomi-ni-atauru-sho", "soseki"], "sources": [{"title": "国立国会図書館：正岡子規（近代日本人の肖像）", "url": "https://www.ndl.go.jp/portrait/datas/329/index.html"}, {"title": "松山市立子規記念博物館：正岡子規について", "url": "https://shiki-museum.com/masaokashiki/"}, {"title": "松山市：子規の一生", "url": "https://www.city.matsuyama.ehime.jp/shisetsu/bunka/sikihaku/kidssikihaku/kids_shikinituite.html"}, {"title": "子規庵：正岡子規について・略年譜", "url": "https://shikian.or.jp/about_siki/"}, {"title": "青空文庫：正岡子規『歌よみに与ふる書』原文", "url": "https://www.aozora.gr.jp/cards/000305/files/2533_16281.html"}], "bodyReadings": {"正岡子規": "まさおかしき", "正岡常規": "まさおかつねのり", "俳人": "はいじん", "歌人": "かじん", "俳句": "はいく", "短歌": "たんか", "漢詩": "かんし", "松山": "まつやま", "夏目漱石": "なつめそうせき", "河東碧梧桐": "かわひがしへきごとう", "高浜虚子": "たかはまきょし", "批評": "ひひょう", "病床": "びょうしょう", "歌よみに与ふる書": "うたよみにあたうるしょ", "墨汁一滴": "ぼくじゅういってき", "病牀六尺": "びょうしょうろくしゃく"}, "checkedDate": "2026年11月3日", "primaryCategory": "person", "genreLabel": "人物", "sourceNote": "生涯は国立国会図書館、松山市立子規記念博物館、子規庵の資料に基づいて紹介しています。作品の発表年と後年の単行本の刊行年を区別し、最後の節は図鑑独自の読書案内です。", "authorTextOnly": true, "portraitNote": "この紹介には本人の肖像は掲載していません。", "longTitle": true}, {"id": "time-machine", "name": "タイムマシン", "reading": "たいむましん", "intro": "時間を移動する機械を作った発明家が、はるかな未来へ出発します。花に囲まれた穏やかな世界に見えた場所には、地上と地下を分ける秘密がありました。", "gist": "未来は必ず今よりよくなるのか。時間旅行者の発見と、変わっていく推測をたどる物語。", "bodyReadings": {"時間旅行者": "じかんりょこうしゃ", "語り手": "かたりて", "発明家": "はつめいか", "未来": "みらい", "模型": "もけい", "富裕": "ふゆう", "推測": "すいそく", "廃墟": "はいきょ", "台座": "だいざ", "写真機": "しゃしんき", "花輪": "はなわ", "西暦": "せいれき", "罠": "わな", "感謝": "かんしゃ", "原著": "げんちょ"}, "sources": [{"title": "Wikisource：The Time Machine 英国Heinemann1895年版", "url": "https://en.wikisource.org/wiki/The_Time_Machine_(Heinemann_text)"}, {"title": "第8章：ウィーナとの出会いと旅行者の仮説", "url": "https://en.wikisource.org/wiki/The_Time_Machine_(Heinemann_text)/Chapter_8"}, {"title": "第16章とEpilogue：再出発、残された花", "url": "https://en.wikisource.org/wiki/The_Time_Machine_(Heinemann_text)/Chapter_16"}], "sourceNote": "1895年にロンドンのWilliam Heinemannから刊行された英語原著の転記を採用し、全16章とEpilogueを分担実読しました。独自の日本語解説であり、現代日本語訳や映像版は使っていません。同年の米国版や先行雑誌版の文章を混ぜていません。", "termNote": "エロイとモーロックが生まれた歴史は、旅行者が観察から組み立てた推測として読みます。時間移動、進化、遠い未来の太陽や地球の様子は小説の設定であり、現代科学による確定した予測ではありません。", "checkedDate": "2026年11月3日", "cat": "literature", "primaryCategory": "world-literature", "genreLabel": "海外文学・SF", "genre": "world-literature", "motif": "book", "sub": "H・G・ウェルズ｜1895", "people": [["時間旅行者", "時間を移動する機械を作り、自分の冒険を客たちに語る発明家。実名は示されない。"], ["語り手の「私」", "旅行者の友人で、家に招かれた客の一人。旅行者の話と、その後の出来事を伝える。"], ["ウィーナ", "旅行者に川から助けられ、親しくなるエロイの女性。花輪や花を贈る。"], ["エロイ", "遠い未来の地上に暮らす、小柄で穏やかな人々。ウィーナもその一人。"], ["モーロック", "地下の暗がりで機械とともに暮らす、もう一つの人類の子孫。光を苦手とする。"]], "synopsisSummary": ["イギリスのリッチモンド。発明家の家に招かれた「私」は、時間の中を移動する機械の説明を聞きます。発明家は名前ではなく、時間旅行者と呼ばれます。客の前で小さな模型が消えますが、人々はすぐには信じません。翌週の夕食会に、時間旅行者はひどく疲れた姿で帰ってきます。そして、完成した機械で出かけてから何が起きたかを語り始めます。", "ここからは時間旅行者自身の冒険です。機械に乗って未来へ進むと、昼夜や季節が目まぐるしく過ぎ、西暦802701年に着きます。そこで出会うエロイは、小柄で穏やかな人々でした。花や果物に囲まれた暮らしを見て、旅行者は、人類が争いや苦労をなくしたのだろうと考えます。ところが、庭に残した機械が消えてしまいました。操作用のレバーは自分が持っているため、誰かが機械を運び去ったと考え、探し始めます。", "地上を調べるうちに、旅行者は川でおぼれかけたウィーナを助けます。ウィーナもエロイの一人です。彼女はお礼に花輪を贈り、旅行者と親しくなります。しかし、彼女は暗闇をひどく恐れていました。旅行者は、地面に開いた深い穴や地下の機械音にも気づきます。地下にはモーロックという、白っぽい体と大きな目をした別の人々が暮らしていたのです。", "旅行者は、人類が地上で暮らす富裕な人々と、地下で働く人々に分かれ、長い年月を経て二つの姿になったのではないかと推測します。さらに地下の様子を見て、モーロックがエロイを食料にしていると考えるようになります。地上の美しい暮らしは、安全な楽園ではありませんでした。ただし、この社会ができた歴史についての説明は、旅行者自身も、間違っているかもしれないと断っています。", "機械を取り戻す手がかりと身を守る道具を求め、旅行者はウィーナと大きな建物へ向かいます。そこは博物館の廃墟で、本や機械も朽ちていました。二人は道具を得て帰りますが、夜の森でモーロックに囲まれます。旅行者がつけた火は森へ燃え広がり、混乱の中でウィーナを見失います。探しても見つからず、旅行者は彼女が亡くなったと考えます。一緒に元の時代へ連れ帰る願いは果たせませんでした。", "白いスフィンクス像の台座へ戻ると、扉の中に機械がありました。扉が閉まり、モーロックの罠にかかりますが、旅行者はレバーを取り付けて脱出します。ただし、機械はさらに未来へ進んでしまいます。三千万年以上も先の、巨大な赤い太陽が照らす寒く静かな海辺まで見た後、ようやく時間を逆に進み、出発した日の自分の家へ戻ります。ここで話は、冒頭の夕食会につながります。", "話を聞いた客たちは、なお信じきれません。翌日、「私」が再び訪ねると、時間旅行者は写真機と荷物を用意して、もう一度出発します。しかし三年がたっても帰りません。どの時代へ行ったかは、最後まで分からないままです。「私」の手元には、ウィーナが旅行者にくれた二本の花が残ります。枯れた花を見つめる語り手は、遠い未来にも感謝や優しさがあったことを、慰めとして受け止めています。"], "summaryHeading": "要約", "links": ["h-g-wells"], "characterGallery": [{"name": "時間旅行者", "role": "時間を移動する機械を作り、自分の冒険を客たちに語る発明家。実名は示されない。", "wide": false, "portraits": [{"src": "assets/timemachine-face-traveller.webp", "label": "作品をもとにした想像像", "alt": "時間旅行者の人物イメージ", "width": 500, "height": 500}]}, {"name": "語り手の「私」", "role": "旅行者の友人で、家に招かれた客の一人。旅行者の話と、その後の出来事を伝える。", "wide": false, "portraits": [{"src": "assets/timemachine-face-narrator.webp", "label": "作品をもとにした想像像", "alt": "語り手の「私」の人物イメージ", "width": 500, "height": 500}]}, {"name": "ウィーナ", "role": "旅行者に川から助けられ、親しくなるエロイの女性。花輪や花を贈る。", "wide": false, "portraits": [{"src": "assets/timemachine-face-weena.webp", "label": "作品をもとにした想像像", "alt": "ウィーナの人物イメージ", "width": 500, "height": 500}]}, {"name": "エロイ", "role": "遠い未来の地上に暮らす、小柄で穏やかな人々。ウィーナもその一人。", "wide": false, "portraits": [{"src": "assets/timemachine-face-eloi.webp", "label": "代表的なイメージ（外見の細部は創作）", "alt": "エロイの人物イメージ", "width": 500, "height": 500}]}, {"name": "モーロック", "role": "地下の暗がりで機械とともに暮らす、もう一つの人類の子孫。光を苦手とする。", "wide": false, "portraits": [{"src": "assets/timemachine-face-morlocks.webp", "label": "代表的なイメージ（外見の細部は創作）", "alt": "モーロックの人物イメージ", "width": 500, "height": 500}]}], "inlineIllustrations": [{"afterParagraph": 2, "src": "assets/timemachine-departure-scene.webp", "alt": "時間旅行者は、自分で作った機械に乗って未来へ向かいます。", "caption": "時間旅行者は、自分で作った機械に乗って未来へ向かいます。", "width": 1200, "height": 800}, {"afterParagraph": 3, "src": "assets/timemachine-weena-garland-scene.webp", "alt": "川から助けられたウィーナは、お礼に花輪を贈ります。二人の友情が始まる場面です。", "caption": "川から助けられたウィーナは、お礼に花輪を贈ります。二人の友情が始まる場面です。", "width": 1200, "height": 800}, {"afterParagraph": 7, "src": "assets/timemachine-two-flowers-scene.webp", "alt": "旅行者が戻らない中、「私」の手元にはウィーナの二本の花が残っています。", "caption": "旅行者が戻らない中、「私」の手元にはウィーナの二本の花が残っています。", "width": 1200, "height": 800}], "characterGalleryNote": "人物の顔、衣服や機械、場所の細部は、採用した小説をもとにした創作です。群像は集団を見分けるための代表的なイメージです。", "credits": [["H・G・ウェルズ", "えいちじーうぇるず", "著者"]], "image": "assets/timemachine-departure-scene.webp", "imageAlt": "時間旅行者は、自分で作った機械に乗って未来へ向かいます。", "headerCaption": "時間旅行者は、自分で作った機械に乗って未来へ向かいます。"}, {"id": "h-g-wells", "name": "H・G・ウェルズ", "reading": "えいちじーうぇるず", "cat": "person", "sub": "1866–1946｜イギリスの作家", "motif": "book", "intro": "『タイムマシン』『透明人間』『宇宙戦争』を書いたイギリスの作家。生物学を学び、教員や科学の書き手としても働きました。不思議な未来や発明の物語を通して、人間の社会を考える入口を作りました。", "gist": "科学の想像力で、未来と人間社会を描いた作家。教科書や歴史の本も書きました。", "people": [], "theme": "", "memory": "", "links": ["time-machine"], "sources": [{"title": "Imperial College London：H.G Wells: 1866–1966（登録簿・生誕百年記念）", "url": "https://blogs.imperial.ac.uk/videoarchive/h-g-wells-1866-1966/"}, {"title": "Humanists UK・Bill Cooke：H. G. Wells (1866–1946)", "url": "https://heritage.humanists.uk/h-g-wells/"}, {"title": "ブロムリー自治体：H G Wells Birthplace", "url": "https://www.bromley.gov.uk/directory-record/6/03-hg-wells-birthplace-primark"}, {"title": "イリノイ大学貴重書・写本図書館：Teacher to the World", "url": "https://www.library.illinois.edu/rbx/hgwells2016/category/teacher-to-the-world/"}, {"title": "イリノイ大学貴重書・写本図書館：The Time Machine（英米初版展示）", "url": "https://www.library.illinois.edu/rbx/hgwells2016/category/the-time-machine/"}, {"title": "南フロリダ大学 Lit2Go：The Invisible Man", "url": "https://etc.usf.edu/lit2go/120/the-invisible-man/"}, {"title": "イリノイ大学貴重書・写本図書館：The War of the Worlds", "url": "https://www.library.illinois.edu/rbx/hgwells2016/2016/09/87/"}, {"title": "The Time Machine：1895年Heinemann英国版・原文", "url": "https://en.wikisource.org/wiki/The_Time_Machine_(Heinemann_text)"}], "bodyReadings": {"生物学": "せいぶつがく", "人類": "じんるい", "教員": "きょういん", "教科書": "きょうかしょ", "刊行": "かんこう", "初版": "しょはん", "英国": "えいこく", "構想": "こうそう", "透明人間": "とうめいにんげん", "宇宙戦争": "うちゅうせんそう", "タイムマシン": "たいむましん"}, "checkedDate": "2026年11月3日", "primaryCategory": "person", "genreLabel": "人物", "sourceNote": "大学図書館の所蔵資料解説、大学の記録、自治体の案内、Humanists UKの署名入り伝記を参照しました。1895年は『タイムマシン』の単行本刊行年です。最後の節などの読み方は独自の案内で、作者の発言の引用ではありません。", "authorTextOnly": true, "portraitNote": "この紹介には本人の肖像は掲載していません。", "longTitle": true}, {"id": "oku-no-hosomichi", "name": "おくのほそ道", "reading": "おくのほそみち", "intro": "昔の歌に詠まれた場所へ行き、その景色を自分の目で見たい。芭蕉と曽良は江戸を離れ、東北・北陸へ歩き出します。美しい景色だけでなく、道の難儀や人の親切、出会いと別れを、文章と句でたどる旅の文学です。", "gist": "目の前の景色に、昔の人の記憶と旅する心が重なっていく。", "bodyReadings": {"おくのほそ道": "おくのほそみち", "松尾芭蕉": "まつおばしょう", "曽良": "そら", "千住": "せんじゅ", "日光": "にっこう", "飯塚": "いいづか", "仙台": "せんだい", "草鞋": "わらじ", "松島": "まつしま", "平泉": "ひらいずみ", "出羽": "でわ", "尾花沢": "おばなざわ", "立石寺": "りっしゃくじ", "境内": "けいだい", "最上川": "もがみがわ", "出羽三山": "でわさんざん", "参詣": "さんけい", "酒田": "さかた", "象潟": "きさかた", "北陸": "ほくりく", "金沢": "かなざわ", "一笑": "いっしょう", "山中温泉": "やまなかおんせん", "伊勢": "いせ", "北枝": "ほくし", "等栽": "とうさい", "敦賀": "つるが", "路通": "ろつう", "大垣": "おおがき", "遷宮": "せんぐう", "紀行": "きこう", "発句": "ほっく"}, "sources": [{"title": "おくのほそ道：三宅邦吉『新釈奥の細道』1911年底本の原著翻刻", "url": "https://ja.wikisource.org/w/index.php?title=おくのほそ道&oldid=235001"}, {"title": "Wikisource：採用版の書誌", "url": "https://ja.wikisource.org/wiki/トーク:おくのほそ道"}, {"title": "国文学研究資料館：成立と刊行", "url": "https://www.nijl.ac.jp/etenji/bungakushi/contents/detail/detail04-01_009.html"}], "sourceNote": "三宅邦吉『新釈奥の細道』（籾山書店、1911年）を底本とする原著本文の翻刻を、冒頭から大垣の結びまで確認しました。現代語訳や編集者の解説を転載せず、独自に要約しています。作品は旅の経験を構成し直した文学であり、曽良の日記による実際の旅程と同一には扱いません。", "termNote": "昔の歌に詠まれ、知られた土地を「歌枕」といいます。発句は連ねる句の最初の句。遷宮は神社の社殿を造り替えるなどして神を移すことです。日付は本文の旧暦に沿っています。", "checkedDate": "2026年11月3日", "cat": "literature", "primaryCategory": "japanese-literature", "genreLabel": "日本の古典・紀行文学", "genre": "japanese-nonfiction", "motif": "book", "sub": "松尾芭蕉｜1689年の旅・1702年ごろ刊行", "people": [["松尾芭蕉", "旅を文章と句にした作者。作品では「予」として旅の体験や思いを語る。"], ["曽良", "芭蕉と旅をする同行者。途中で病のため先に別れ、大垣で再会する。"]], "synopsisSummary": ["『おくのほそ道』は、松尾芭蕉が1689年に東北・北陸を巡った旅をもとに、文章と句を組み合わせた作品です。旅に心を引かれた芭蕉は住まいを人に譲り、同行する曽良と江戸を離れます。千住で親しい人々の見送りを受けますが、遠い旅への期待だけでなく、再び会えるだろうかという心細さもあります。", "日光から北へ進む道では、土地の人に馬を借りたり、知人の家でもてなされたりします。昔の歌に詠まれた場所を訪ね、その景色を自分の目で確かめることも旅の楽しみです。一方、飯塚の宿では雨漏りや虫に悩まされ、持病も起こります。美しい景色だけの気楽な旅ではありません。仙台では、土地に詳しい人から案内や絵図、草鞋の贈り物を受けます。", "松島では、海に浮かぶ島々と松の姿に心を奪われます。夜は月に照らされた景色を見て、出発前にもらった詩や歌を取り出します。その後、道に迷うなどして平泉へたどり着きます。そこでは、かつて栄えた人々の跡が田野や草むらになっています。芭蕉は武士たちの遠い夢を思い、涙を流します。同じ旅の景色でも、松島の驚きと平泉の悲しみでは、心の動きが違うのです。", "山を越えて出羽へ入る道も険しく、案内人の助けを借ります。尾花沢でもてなしを受けた後、立石寺では岩や木々に囲まれた境内を登り、静けさの中に蝉の声を聞きます。最上川では、増えた水の速い流れを舟で下ります。さらに出羽三山を参詣し、雪の残る山を登ります。静かな寺、急流、厳しい山と、自然の違う姿が続いて現れます。", "酒田から象潟へ向かうと、雨の後に晴れた水辺を舟で巡ります。芭蕉は、島のある景色を松島と比べながら、それぞれに違う表情を感じます。その後は北陸へ進み、暑さや病に苦しみながら旅を続けます。土地の人との交流だけでなく、金沢では、会う前に亡くなった俳人の一笑を悼む場にも加わります。風景とともに、そこに生きた人の記憶が文章に残されます。", "山中温泉まで来ると、曽良が腹を病み、先に伊勢の長島へ向かうことになります。二人は別れを悲しみ、それぞれ句に思いを込めます。曽良が旅の途中で亡くなったわけではありません。芭蕉はその後も、途中まで同行する北枝や、福井で再会した等栽などに支えられて進みます。敦賀では名月を楽しみにしますが、十五日の夜は雨になり、思いどおりにならない旅の一面も描かれます。", "やがて芭蕉は路通に迎えられて大垣へ入り、先に別れた曽良や親しい人々と再会します。皆は、長い旅を終えて戻った芭蕉を喜び、いたわります。しかし、ここで旅の暮らしが終わるのではありません。疲れがまだ残るうちに、九月六日、伊勢の遷宮を拝もうと再び舟に乗ります。別れから始まった作品は、再会を経て、さらに次の旅へ出るところで結ばれます。"], "summaryHeading": "旅の流れをたどる要約", "links": ["matsuo-basho"], "inlineIllustrations": [{"afterParagraph": 1, "src": "assets/okuhoso-sendoff-scene.webp", "alt": "千住で見送りの人々と別れ、芭蕉と曽良は長い旅へ進みます。", "caption": "千住で見送りの人々と別れ、芭蕉と曽良は長い旅へ進みます。", "width": 1200, "height": 800}, {"afterParagraph": 3, "src": "assets/okuhoso-hiraizumi-grass-scene.webp", "alt": "平泉で昔の栄華の跡に立ち、芭蕉は草むらの向こうに失われた時代を思います。", "caption": "平泉で昔の栄華の跡に立ち、芭蕉は草むらの向こうに失われた時代を思います。", "width": 1200, "height": 800}, {"afterParagraph": 7, "src": "assets/okuhoso-ogaki-newdeparture-scene.webp", "alt": "大垣で仲間と再会した後、芭蕉は伊勢へ向かうため、再び舟に乗ります。", "caption": "大垣で仲間と再会した後、芭蕉は伊勢へ向かうため、再び舟に乗ります。", "width": 1200, "height": 800}], "characterGalleryNote": "挿絵は本文に基づく旅の想像図です。人物の容貌や景観の細部は創作で、当時の実景や本人の顔の厳密な再現ではありません。", "contentType": "travel-literature-guide", "peopleHeading": "旅をする人", "introHeading": "この本について", "introBadge": "旅の入口", "interpretationNote": "採用原典の記述を踏まえた読み方の一例です。", "credits": [["松尾芭蕉", "まつおばしょう", "著者"]], "image": "assets/okuhoso-sendoff-scene.webp", "imageAlt": "千住で見送りの人々と別れ、芭蕉と曽良は長い旅へ進みます。", "headerCaption": "千住で見送りの人々と別れ、芭蕉と曽良は長い旅へ進みます。"}, {"id": "matsuo-basho", "name": "松尾芭蕉", "reading": "まつおばしょう", "cat": "person", "sub": "1644–1694｜江戸時代の俳人", "motif": "book", "intro": "旅の風景や人との出会いを、句と文章にした江戸時代の俳人。『おくのほそ道』は、東北・北陸への旅をもとに、帰ってからも文章を練って仕上げた作品です。", "gist": "歩いた道を、風景と歴史と人の記憶が重なる文学にした俳人。", "people": [], "theme": "", "memory": "", "links": ["oku-no-hosomichi"], "sources": [{"title": "芭蕉翁顕彰会：略年譜", "url": "https://www.basho-bp.jp/?page_id=16"}, {"title": "三重県：松尾芭蕉", "url": "https://www.bunka.pref.mie.lg.jp/haiku/42249035021.htm"}, {"title": "国文学研究資料館：おくのほそ道", "url": "https://www.nijl.ac.jp/etenji/bungakushi/contents/detail/detail04-01_009.html"}, {"title": "島田市博物館：芭蕉真蹟「田植の連句」", "url": "https://www.city.shimada.shizuoka.jp/shimahaku/docs/shi-26.html"}, {"title": "三重県：松尾芭蕉（俳号「宗房」の読み）", "url": "https://www.bunka.pref.mie.lg.jp/646580347590018.htm"}, {"title": "おくのほそ道：三宅邦吉『新釈奥の細道』1911年底本の原著翻刻", "url": "https://ja.wikisource.org/w/index.php?title=おくのほそ道&oldid=235001"}], "bodyReadings": {"松尾芭蕉": "まつおばしょう", "伊賀国": "いがのくに", "藤堂良忠": "とうどうよしただ", "俳諧": "はいかい", "宗房": "そうぼう", "桃青": "とうせい", "深川": "ふかがわ", "庵": "いおり", "芭蕉庵": "ばしょうあん", "塚本如舟": "つかもとじょしゅう", "連句": "れんく", "曽良": "そら", "東北": "とうほく", "北陸": "ほくりく", "大垣": "おおがき", "大坂": "おおさか", "野ざらし紀行": "のざらしきこう", "おくのほそ道": "おくのほそみち", "刊本": "かんぽん"}, "checkedDate": "2026年11月3日", "primaryCategory": "person", "genreLabel": "人物", "sourceNote": "生涯と年譜は顕彰会・自治体・博物館の資料、作品の成立と刊行は国文学研究資料館の説明を参照しています。旅の年と作品が完成した年、本になった時期を区別しています。最後の節は図鑑独自の読書案内です。", "authorTextOnly": true, "portraitNote": "この紹介には本人の肖像は掲載していません。", "longTitle": true}, {"id": "bushido", "name": "武士道", "reading": "ぶしどう", "intro": "正しいことをする勇気と、人を思いやる優しさは、どうつながるのでしょうか。新渡戸稲造が武士の倫理を海外の読者へ説明した英語の本です。外国の思想や文学と比べながら、礼儀、誠実さ、名誉、そして社会が変わった後に残るものを考えます。", "gist": "武士の理想を外国の考えと比べ、社会が変わっても受け継げる価値を考える。", "bodyReadings": {"武士道": "ぶしどう", "新渡戸稲造": "にとべいなぞう", "道徳": "どうとく", "倫理": "りんり", "義": "ぎ", "仏教": "ぶっきょう", "神道": "しんとう", "儒教": "じゅきょう", "礼儀": "れいぎ", "茶の湯": "ちゃのゆ", "誠実": "せいじつ", "名誉": "めいよ", "忠義": "ちゅうぎ", "良心": "りょうしん", "人格": "じんかく", "切腹": "せっぷく", "仇討ち": "あだうち", "奉仕": "ほうし", "身分": "みぶん", "徳目": "とくもく", "改訂": "かいてい", "増補": "ぞうほ", "論旨": "ろんし"}, "source
