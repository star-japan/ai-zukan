、これからよい友達になって握手をするよう勧めました。僕がためらっていると、ジムの方から僕の手を握ります。先生は新しく葡萄を一房摘み、半分に切って二人に分けてくれました。","こうして過去を振り返る僕は、この出来事の後、前より少しよい子になり、はにかむことも減ったようだと語ります。大人になった今も、先生の白い手に載っていた紫色の葡萄を、はっきり覚えています。もう二度と先生には会えないと知りながら、今もあの先生がいてくれたらと懐かしむところで、物語は終わります。"],"sources":[{"title":"青空文庫・原著本文（全文確認）","url":"https://www.aozora.gr.jp/cards/000025/files/211_20472.html"},{"title":"青空文庫・図書カード（初出・著者没年・読み）","url":"https://www.aozora.gr.jp/cards/000025/card211.html"},{"title":"光村図書・教材／紹介図書の確認資料","url":"https://assets.mitsumura-tosho.co.jp/4617/2414/4905/07ck_tosho_hi.pdf"}],"sourceNote":"確認できた一次資料は光村図書・令和７年度版中学１年「広がる読書」の紹介図書。本文教材そのものへの採用とは区別する。学校図書の道徳教材『一房のぶどう』（石田昭明）は別作品なので根拠に使わない。","summaryReadings":{"僕":{"reading":"ぼく","key":"僕"},"先生":{"reading":"せんせい","key":"先生"}},"image":"assets/grapes-sharing-nextmorning-scene.webp","imageAlt":"翌朝、先生は一房の葡萄を二つに分け、僕とジムに渡します。","primaryCategory":"japanese-literature","genreLabel":"日本文学","characterGallery":[{"name":"僕（ぼく）","role":"絵を描くのが好きな少年。大人になって、学校での出来事を振り返る。","portraits":[{"src":"assets/grapes-face-boy.webp","label":"学校に通っていたころの僕","alt":"僕（ぼく）の創作イメージ","width":500,"height":500}]},{"name":"ジム","role":"僕と同じ学校に通う少年。上等な絵の具を持っている。","portraits":[{"src":"assets/grapes-face-jim.webp","label":"","alt":"ジムの創作イメージ","width":500,"height":500}]},{"name":"先生（せんせい）","role":"僕が慕う女の先生。盗みが見つかった僕を部屋へ迎える。","portraits":[{"src":"assets/grapes-face-teacher.webp","label":"","alt":"先生（せんせい）の創作イメージ","width":500,"height":500}]}],"characterGalleryNote":"僕は学校時代の姿です。葡萄を二人に分ける場面は、出来事の翌朝です。","headerCaption":"翌朝、先生は一房の葡萄を二つに分け、僕とジムに渡します。","inlineIllustrations":[{"afterParagraph":1,"src":"assets/grapes-paint-theft-scene.webp","alt":"ある日の昼休み、僕はジムの机から、藍と洋紅の二色の絵の具を取ってしまいます。","caption":"ある日の昼休み、僕はジムの机から、藍と洋紅の二色の絵の具を取ってしまいます。","width":1200,"height":800},{"afterParagraph":3,"src":"assets/grapes-teacher-firstday-scene.webp","alt":"その日の午後、先生は泣く僕を休ませ、膝の上に一房の葡萄をそっと置きます。","caption":"その日の午後、先生は泣く僕を休ませ、膝の上に一房の葡萄をそっと置きます。","width":1200,"height":800},{"afterParagraph":5,"src":"assets/grapes-sharing-nextmorning-scene.webp","alt":"翌朝、先生は一房の葡萄を二つに分け、僕とジムに渡します。","caption":"翌朝、先生は一房の葡萄を二つに分け、僕とジムに渡します。","width":1200,"height":800}]}, {"id": "sanshodayu", "name": "山椒大夫", "reading": "さんしょうだゆう", "cat": "literature", "bodyReadings": {"安寿": "あんじゅ", "厨子王": "ずしおう", "佐渡": "さど", "丹後": "たんご", "柴": "しば", "国守": "くにのかみ", "山椒大夫": "さんしょうだゆう", "関白": "かんぱく", "奴隷": "どれい", "喪失": "そうしつ", "守": "まも", "本尊": "ほんぞん", "清水寺": "きよみずでら", "僧侶": "そうりょ", "由緒": "ゆいしょ", "赴任": "ふにん", "弔": "とむら", "地蔵": "じぞう", "追手": "おって", "援助": "えんじょ", "責任": "せきにん"}, "sub": "森鷗外｜1915年発表", "motif": "book", "intro": "父を訪ねて旅をする母と、姉の安寿、弟の厨子王。旅の途中で人買いにだまされ、母と子どもたちは引き離されてしまう。知らない土地で働かされる姉弟は、再び家族に会える日を願って暮らす。", "gist": "引き離された家族と、逃げ出した弟のその後。自分が自由になるだけでなく、ほかの人の暮らしも変えようとする物語。", "people": [["安寿（あんじゅ）", "厨子王の姉。弟とともに山椒大夫のもとで働かされる。"], ["厨子王（ずしおう）", "安寿の弟。姉に助けられ、都を目指す。"], ["母", "子どもたちから引き離され、佐渡へ売られる。"], ["山椒大夫（さんしょうだゆう）", "丹後で多くの人を買い入れ、働かせている人。"]], "links": ["takasebune", "maihime", "mori-ogai"], "synopsisSummary": ["父を訪ねて旅をする母と、姉の安寿、弟の厨子王は、人を売り買いする者にだまされ、引き離されます。母は佐渡の島へ、姉弟は丹後という土地で多くの人を働かせている山椒大夫のもとへ売られました。姉弟は別の名を付けられ、安寿は塩を作るための海水をくむ仕事、厨子王は燃料にする木の枝を刈る仕事を命じられます。二人は、同じように働かされる人々にも助けられながら、厳しい暮らしに耐えます。", "翌年の春、安寿は弟と一緒に山の仕事へ行けるよう頼みます。山へ着くと、安寿は厨子王に、一人で逃げて都を目指すよう説きました。よい人に出会えれば、父の居場所を知り、母を迎えに行けるかもしれないと考えたのです。安寿は、自分のお守りである地蔵の像を弟に渡します。この像が、作中でいう「守り本尊」です。", "厨子王は姉と別れて逃げ、寺にかくまわれました。寺の人々が追手を退けますが、残った安寿は亡くなったと後で伝えられます。", "寺の僧侶に導かれ、厨子王は都へ向かいます。都の清水寺で出会ったのは、政治の中心にいる高い身分の貴族、関白です。関白は地蔵の像を見て、厨子王が名のある家の子だと認め、自分の家へ迎えました。関白が厨子王の父のもとへ使いを出すと、父はすでに亡くなっていました。厨子王は、会えなかった父の死を悲しみます。", "その年の秋、厨子王は丹後を治める責任を持つ役職、国守になります。自分は現地へ行かず、役人に治めさせる立場です。厨子王はまず、丹後の中で人を売り買いすることを禁じました。山椒大夫も人々を解放し、給料を払って働いてもらうようになります。その結果、山椒大夫の仕事は前よりも盛んになりました。厨子王は姉の死を弔い、自分たちを助けてくれた人々にも報います。", "その後、厨子王は佐渡へ渡り、母を捜します。なかなか見つかりませんが、ある日、畑の鳥を追いながら子どもたちを恋しがる歌を歌う女性に出会います。目が見えなくなっていたその人こそ、離れ離れになった母でした。厨子王は地蔵の像を手に駆け寄ります。物語の最後では母の目が開き、息子だと分かった母と厨子王は抱き合います。"], "sources": [{"title": "青空文庫・鷗外原文（全編確認）", "url": "https://www.aozora.gr.jp/cards/000129/files/689_23257.html"}, {"title": "青空文庫・図書カード（初出、作品読み）", "url": "https://www.aozora.gr.jp/cards/000129/card689.html"}, {"title": "青空文庫・森鴎外（読み・生没年）", "url": "https://www.aozora.gr.jp/index_pages/person129.html"}, {"title": "文京区・森鴎外について（1922年没）", "url": "https://www.city.bunkyo.lg.jp/b014/p004367.html"}, {"title": "光村図書・昭和30年度版中学校3年", "url": "https://www.mitsumura-tosho.co.jp/webmaga/chronicle/chugaku/s30-3nen"}], "sourceNote": "初出は「中央公論」1915年1月。参照した青空文庫の底本は『日本の文学 3 森鴎外（二）』（中央公論社、1972年）。初出年と底本刊行年を区別。 光村図書・昭和30年度版（1955〜1958年使用）中学校3年下巻の採用を公式クロニクルで確認。現在の教科書への掲載とは表示しない。", "textNote": "人身売買、家族の離別、死を扱います。", "summaryReadings": {"安寿": {"reading": "あんじゅ", "key": "安寿"}, "厨子王": {"reading": "ずしおう", "key": "厨子王"}, "山椒大夫": {"reading": "さんしょうだゆう", "key": "山椒大夫"}}, "image": "assets/sansho-tools-scene.webp", "imageAlt": "別々の仕事を命じられる姉の安寿と弟の厨子王", "primaryCategory": "japanese-literature", "genreLabel": "日本文学", "inlineIllustrations": [{"afterParagraph": 1, "src": "assets/sansho-tools-scene.webp", "alt": "山椒大夫のもとで、安寿には海水をくむ桶、厨子王には木の枝を刈る道具が渡されます。姉弟は別々の仕事を命じられました。", "caption": "山椒大夫のもとで、安寿には海水をくむ桶、厨子王には木の枝を刈る道具が渡されます。姉弟は別々の仕事を命じられました。", "width": 1200, "height": 800}, {"afterParagraph": 2, "src": "assets/sansho-jizo-handover-scene.webp", "alt": "安寿は、自分のお守りの地蔵の像を厨子王へ渡します。弟だけを逃がし、家族を捜す望みを託す場面です。", "caption": "安寿は、自分のお守りの地蔵の像を厨子王へ渡します。弟だけを逃がし、家族を捜す望みを託す場面です。", "width": 1200, "height": 800}, {"afterParagraph": 4, "src": "assets/sansho-regent-scene.webp", "alt": "都の清水寺で、関白は厨子王の持つ地蔵の像を確かめ、家柄を認めます。この出会いが、厨子王を助ける道につながります。", "caption": "都の清水寺で、関白は厨子王の持つ地蔵の像を確かめ、家柄を認めます。この出会いが、厨子王を助ける道につながります。", "width": 1200, "height": 800}, {"afterParagraph": 6, "src": "assets/sansho-reunion-scene.webp", "alt": "佐渡で母を見つけた厨子王。息子だと分かった母と厨子王は、ようやく抱き合います。", "caption": "佐渡で母を見つけた厨子王。息子だと分かった母と厨子王は、ようやく抱き合います。", "width": 1200, "height": 800}], "headerCaption": "中央は姉の安寿、右は弟の厨子王。山椒大夫のもとで、別々の仕事を命じられる場面です。", "characterGallery": [{"name": "安寿（あんじゅ）", "role": "厨子王の姉。弟とともに山椒大夫のもとで働かされる。", "portraits": [{"src": "assets/sansho-face-anju.webp", "label": "姉の安寿", "alt": "姉の安寿の創作イメージ", "width": 500, "height": 500}]}, {"name": "厨子王（ずしおう）", "role": "安寿の弟。姉に助けられ、都を目指す。", "portraits": [{"src": "assets/sansho-face-zushio.webp", "label": "弟の厨子王", "alt": "弟の厨子王の創作イメージ", "width": 500, "height": 500}]}, {"name": "母", "role": "子どもたちから引き離され、佐渡へ売られる。", "portraits": [{"src": "assets/sansho-face-mother.webp", "label": "再会のころの母", "alt": "再会のころの母の創作イメージ", "width": 500, "height": 500}]}, {"name": "山椒大夫（さんしょうだゆう）", "role": "丹後で多くの人を買い入れ、働かせている人。", "portraits": [{"src": "assets/sansho-face-sanshodayu.webp", "label": "山椒大夫", "alt": "山椒大夫の創作イメージ", "width": 500, "height": 500}]}], "characterGalleryNote": "姉弟は物語の入口の姿、母は厨子王と再会するころの姿をもとに描いています。"}, {"id": "crimeandpunishment", "name": "罪と罰", "reading": "つみとばつ", "cat": "literature", "bodyReadings": {"懲役": "ちょうえき", "自首": "じしゅ", "犯行": "はんこう", "判決": "はんけつ", "服役": "ふくえき", "刑期": "けいき", "償い": "つぐない", "信仰": "しんこう", "青年": "せいねん", "罪": "つみ", "責任": "せきにん", "予審判事": "よしんはんじ", "役職": "やくしょく", "特別": "とくべつ", "認め": "みとめ", "傷つけ": "きずつけ", "関係者": "かんけいしゃ", "追い詰め": "おいつめ", "貧しい": "まずしい", "論文": "ろんぶん", "道徳": "どうとく", "告白": "こくはく", "元学生": "もとがくせい", "法律": "ほうりつ"}, "genreLabel": "海外文学", "genre": "world-literature", "checkedDate": "2026年11月2日", "sub": "ドストエフスキー｜1866年発表", "motif": "book", "intro": "貧しい元学生ラスコーリニコフは、特別な人間なら目的のために道徳を越えてもよいと考えている。金貸しの老婆を殺す計画を実行に移すが、その後、思いがけない不安と孤独に襲われる。自分の考えと生きた人間の心がぶつかる長編。", "gist": "人を殺しても、自分の理屈で割り切れるはずだった。罪を隠す青年が、人とのつながりと責任に向き合うまで。", "people": [["ラスコーリニコフ", "お金に困り、大学を辞めた青年。特別な人なら、大きな目的のために必要な場合、人を傷つけることも自分に許せると考える。"], ["ソーニャ", "家族を支える若い女性。青年が罪を認め、責任に向き合うよう支える。"], ["ポルフィーリイ", "事件を調べ、ラスコーリニコフから話を聞こうとする人物。"], ["ラズミーヒン", "主人公とその家族を助ける友人。"]], "links": ["kokoro", "ningen", "dostoevsky"], "synopsisSummary": ["舞台はロシアのペテルブルク。貧しさから大学を離れた青年ラスコーリニコフは、狭い部屋にこもり、人との付き合いも避けています。彼は、歴史を変えるような特別な人間なら、目的のために法律や道徳を越えることも許されるという考えにとらわれ、自分にもその力があるのかを試そうとします。金貸しの老婆を殺して金品を奪いますが、予定外に帰ってきた老婆の妹リザヴェータまで殺してしまいます。", "犯行現場から逃げた後も、落ち着いた暮らしは戻りません。奪った物を石の下に隠して使わず、発熱や不安に苦しみ、周囲の何気ない言葉まで疑い始めます。友人ラズミーヒンや母、妹の気遣いにも素直に応えられません。事件を調べるポルフィーリイは、ラスコーリニコフの書いた論文や言動に注目し、対話を重ねながら追い詰めていきます。", "ラスコーリニコフが心を開く相手は、家族を支えるために売春をせざるをえなくなったソーニャです。彼女は厳しい境遇でも信仰を失わず、人を見捨てません。ラスコーリニコフは、ソーニャに二人を殺したことを打ち明け、単に金が欲しかったのではなく、自分が人を踏み越えられる特別な存在か確かめたかったと語ります。ソーニャは殺人を正当化せず、罪を認めて責任を引き受けるよう促し、それでも彼と歩む意志を示します。事件を調べるポルフィーリイからも、自分から警察に罪を申し出るよう勧められます。迷った末、ラスコーリニコフは警察へ行き、自分が殺したと認めます。", "裁判で、ラスコーリニコフはシベリアで八年間、刑に服して働くことになります。ソーニャもその町へ移り、働きながらラスコーリニコフを訪ねます。しかし服役しただけで、すぐに反省できたわけではありません。彼はなお自分の失敗を恥じ、周囲から心を閉ざしています。病気と孤独を経て、やがてソーニャへの愛を自覚し、その足元で涙を流します。刑期はまだ残っています。物語が描くのは、すべてを償い終えた姿ではなく、人とつながり直し、新しく生き始める入口です。"], "sources": [{"title": "Project Gutenberg #2554（作者・英訳者生没年、米国PD表示）", "url": "https://www.gutenberg.org/ebooks/2554"}, {"title": "Garnett英訳本文（主要場面・終章照合）", "url": "https://www.gutenberg.org/files/2554/2554-h/2554-h.htm"}, {"title": "トロント大学図書館・初出1866年の展示", "url": "https://exhibits.library.utoronto.ca/exhibits/show/cp150/translations"}, {"title": "Royal Society of Literature・Garnett（1946年没）", "url": "https://rsliterature.org/anthologies/constance-garnett/"}, {"title": "Project Gutenberg利用方針（地域差・出典リンクの扱い）", "url": "https://www.gutenberg.org/policy/license.html"}], "sourceNote": "ロシア語原作は1866年に雑誌連載。本ページは Constance Garnett の英訳（Project Gutenberg #2554）を照合資料とした独自の日本語要約で、特定の現代日本語訳の要約・転載ではありません。", "textNote": "殺人、貧困、売春、服役を扱う物語です。", "image": "assets/crime-interview-corrected.webp", "imageAlt": "ポルフィーリイは、ラスコーリニコフと話しながら、その考えを探ります。", "primaryCategory": "world-literature", "roleReadings": true, "termNote": "ポルフィーリイの役職は予審判事です。この物語では、事件を調べ、関係者から話を聞く役割を担っています。", "inlineIllustrations": [{"afterParagraph": 2, "src": "assets/crime-interview-corrected.webp", "alt": "机を挟んで話すポルフィーリイとラスコーリニコフの場面イメージ", "caption": "話を聞きながら、ラスコーリニコフの考えを探るポルフィーリイ。", "width": 1200, "height": 800}, {"afterParagraph": 3, "src": "assets/crime-sonya-confession-scene.webp", "alt": "罪を打ち明けるラスコーリニコフと話を聞くソーニャ", "caption": "ラスコーリニコフが罪を打ち明け、ソーニャがその話を聞きます。", "width": 1200, "height": 800}, {"afterParagraph": 4, "src": "assets/crime-siberia-sonya-scene.webp", "alt": "刑に服するラスコーリニコフは、訪ねてきたソーニャへの愛を自覚します。刑期を終えたのではなく、生き直しが始まる場面です。", "caption": "刑に服するラスコーリニコフは、訪ねてきたソーニャへの愛を自覚します。刑期を終えたのではなく、生き直しが始まる場面です。", "width": 1200, "height": 800}], "characterGallery": [{"name": "ラスコーリニコフ", "role": "お金に困り、大学を辞めた青年。特別な人なら、大きな目的のために必要な場合、人を傷つけることも自分に許せると考える。", "portraits": [{"src": "assets/crime-face-raskolnikov.webp", "label": "", "alt": "ラスコーリニコフの創作イメージ", "width": 500, "height": 500}]}, {"name": "ソーニャ", "role": "家族を支える若い女性。青年が罪を認め、責任に向き合うよう支える。", "portraits": [{"src": "assets/crime-face-sonya.webp", "label": "", "alt": "ソーニャの創作イメージ", "width": 500, "height": 500}]}, {"name": "ポルフィーリイ", "role": "事件を調べ、ラスコーリニコフから話を聞こうとする人物。", "portraits": [{"src": "assets/crime-face-porfiry.webp", "label": "", "alt": "ポルフィーリイの創作イメージ", "width": 500, "height": 500}]}, {"name": "ラズミーヒン", "role": "主人公とその家族を助ける友人。", "portraits": [{"src": "assets/crime-face-razumikhin.webp", "label": "", "alt": "ラズミーヒンの創作イメージ", "width": 500, "height": 500}]}], "characterGalleryNote": "人物像は、ペテルブルクで暮らしているころを表しています。", "headerCaption": "ポルフィーリイは、ラスコーリニコフと話しながら、その考えを探ります。"}, {"id": "romeoandjuliet", "name": "ロミオとジュリエット", "reading": "ろみおとじゅりえっと", "cat": "literature", "bodyReadings": {"戯曲": "ぎきょく", "修道士": "しゅうどうし", "決闘": "けっとう", "追放": "ついほう", "縁談": "えんだん", "乳母": "うば", "従者": "じゅうしゃ", "報復": "ほうふく", "和解": "わかい"}, "genreLabel": "海外文学", "genre": "world-literature", "checkedDate": "2026年11月2日", "sub": "ウィリアム・シェイクスピア｜1597年初刊行", "motif": "book", "intro": "争い続ける二つの家。その息子ロミオと娘ジュリエットは、相手の家名を知らないまま恋に落ちる。二人は周囲に隠れて結ばれようとするが、家同士の争いは止まらない。恋する二人の願いと、周りの対立が絡み合う戯曲。", "gist": "敵同士の家に生まれた二人は、秘密の結婚に望みをかける。争いと届かない知らせが重なる悲劇。", "people": [["ロミオ", "モンタギュー家の息子"], ["ジュリエット", "キャピュレット家の娘"], ["ロレンス修道士（ろれんすしゅうどうし）", "二人の結婚を助ける修道士。英語名 Friar Lawrence"], ["ティボルト", "ジュリエットのいとこ"], ["マキューシオ", "ロミオの友人。英語名 Mercutio"], ["パリス", "ジュリエットとの結婚を望む貴族"]], "links": ["melos", "maihime", "shakespeare"], "synopsisSummary": ["イタリアのヴェローナでは、モンタギュー家とキャピュレット家の争いが、街の人々まで巻き込んでいます。モンタギュー家の息子ロミオは、思いを寄せる別の女性に会おうと敵の家の宴へ出かけ、そこでジュリエットと出会います。二人は恋に落ちた後で、相手が敵対する家の子だと知りました。それでも夜の庭で思いを確かめ合います。", "翌日、ロレンス修道士の助けでひそかに結婚します。修道士は、この結婚が両家の仲直りにつながると期待していました。", "ところが、ジュリエットのいとこティボルトがロミオに決闘を挑みます。結婚によって親族になったロミオは争いを避けますが、事情を知らない友人マキューシオが代わりに剣を抜き、命を落としました。怒ったロミオはティボルトを殺し、街から追放されます。二人は一夜を共にした後、夜明けに別れ、ロミオはマントヴァへ向かいます。", "結婚を知らないジュリエットの父は、貴族パリスとの縁談を進め、娘の拒絶を聞き入れません。乳母にもパリスとの結婚を勧められたジュリエットは、修道士に相談します。その計画は、薬で一時的に死んだように見せ、墓に運ばれた後でロミオと逃げるというものでした。ジュリエットは恐怖をこらえて実行しますが、計画を知らせる使者が感染症対策で足止めされ、手紙は届きません。", "一方、ロミオには、事情を知らない従者からジュリエットの死だけが伝わります。墓へ戻ったロミオは、そこで出会ったパリスとも争って殺し、ジュリエットが本当に死んだと思い込んで自ら命を絶ちます。ほどなく目覚めたジュリエットも、彼の死を知って命を絶ちました。修道士の説明とロミオの手紙から真相が分かり、両家は子どもたちを失って初めて、争いを終わらせようと手を取り合います。"], "sources": [{"title": "Project Gutenberg・英語原作本文（全五幕確認）", "url": "https://www.gutenberg.org/cache/epub/1513/pg1513.txt"}, {"title": "Project Gutenberg・書誌と米国パブリックドメイン表示", "url": "https://www.gutenberg.org/ebooks/1513"}, {"title": "Shakespeare Birthplace Trust・1616年の死去記録", "url": "https://www.shakespeare.org.uk/explore-shakespeare/shakespedia/william-shakespeare/when-did-shakespeare-die/"}, {"title": "Folger Shakespeare Library・最初の刊行版（1597年）", "url": "https://shakespearedocumented.folger.edu/node/155"}], "sourceNote": "1597年は最初の印刷版（第一四折本）の刊行年。執筆年・初演年と同一視しない。要約はProject Gutenberg電子書籍1513の英語本文に基づく。同電子本文を1597年第一四折本そのものとは表示しない。", "textNote": "家族の対立、殺人、自死を扱います。", "longTitle": true, "image": "assets/romeoandjuliet.webp", "imageAlt": "庭と窓辺で言葉を交わす二人の作品イメージ", "primaryCategory": "world-literature", "headerCaption": "庭にいるロミオと、上の窓から話すジュリエット。敵対する家に生まれた二人が、互いの思いを確かめます。", "inlineIllustrations": [{"afterParagraph": 1, "src": "assets/romeoandjuliet.webp", "caption": "庭にいるロミオと、上の窓から話すジュリエット。敵対する家に生まれた二人が、互いの思いを確かめます。", "width": 1200, "height": 800, "alt": "庭にいるロミオと、上の窓から話すジュリエット。敵対する家に生まれた二人が、互いの思いを確かめます。"}, {"afterParagraph": 2, "src": "assets/romeo-wedding-scene.webp", "alt": "ロレンス修道士の前で、ひそかに結婚するロミオとジュリエットの場面イメージ", "caption": "ロレンス修道士の前で、ひそかに結婚する二人。", "width": 1200, "height": 800}, {"afterParagraph": 4, "src": "assets/romeo-undelivered-letter-scene.webp", "alt": "使者の修道士は足止めされ、手紙を届けられないまま戻りました。ロレンス修道士は、計画がロミオに伝わっていないと知ります。", "caption": "使者の修道士は足止めされ、手紙を届けられないまま戻りました。ロレンス修道士は、計画がロミオに伝わっていないと知ります。", "width": 1200, "height": 800}], "characterGallery": [{"name": "ロミオ", "role": "モンタギュー家の息子", "portraits": [{"src": "assets/romeo-face-romeo.webp", "label": "", "alt": "ロミオの創作イメージ", "width": 500, "height": 500}]}, {"name": "ジュリエット", "role": "キャピュレット家の娘", "portraits": [{"src": "assets/romeo-face-juliet.webp", "label": "", "alt": "ジュリエットの創作イメージ", "width": 500, "height": 500}]}, {"name": "ロレンス修道士（ろれんすしゅうどうし）", "role": "二人の結婚を助ける修道士。英語名 Friar Lawrence", "portraits": [{"src": "assets/romeo-face-lawrence.webp", "label": "", "alt": "ロレンス修道士（ろれんすしゅうどうし）の創作イメージ", "width": 500, "height": 500}]}, {"name": "ティボルト", "role": "ジュリエットのいとこ", "portraits": [{"src": "assets/romeo-face-tybalt.webp", "label": "", "alt": "ティボルトの創作イメージ", "width": 500, "height": 500}]}, {"name": "マキューシオ", "role": "ロミオの友人。英語名 Mercutio", "portraits": [{"src": "assets/romeo-face-mercutio.webp", "label": "", "alt": "マキューシオの創作イメージ", "width": 500, "height": 500}]}, {"name": "パリス", "role": "ジュリエットとの結婚を望む貴族", "portraits": [{"src": "assets/romeo-face-paris.webp", "label": "", "alt": "パリスの創作イメージ", "width": 500, "height": 500}]}], "characterGalleryNote": "顔は、物語の悲劇が起こる前の人物を見分けるためのイメージです。"}, {"id": "donquixote", "name": "ドン・キホーテ", "reading": "どんきほーて", "cat": "literature", "bodyReadings": {"郷士": "ごうし", "騎士道": "きしどう", "従者": "じゅうしゃ", "領主": "りょうしゅ", "公爵": "こうしゃく", "統治": "とうち", "帰郷": "ききょう", "遺言": "ゆいごん", "善意": "ぜんい", "裁く": "さばく", "宿屋": "やどや"}, "genreLabel": "海外文学", "genre": "world-literature", "checkedDate": "2026年11月2日", "sub": "ミゲル・デ・セルバンテス｜1605年・1615年刊行", "motif": "book", "intro": "騎士道物語を読みふけった男は、自分も騎士になって弱い人を救おうと旅に出る。農民サンチョを供にして、やせた馬で進む道。二人は同じ景色を見ているのに、片方には風車が巨人に見えてしまう。", "gist": "自分を騎士と信じる男と、現実的な従者。すれ違いながらも旅を続ける二人を通して、思い込みと友情を描く物語。", "people": [["ドン・キホーテ", "騎士道物語を現実と信じて旅をする郷士。本名はアロンソ・キハーノ。"], ["サンチョ・パンサ", "島を治める役目をもらう約束にひかれて同行する農民。次第に主と友情を深める。"], ["ドゥルシネーア", "ドン・キホーテが近隣の女性アルドンサをもとに思い描く、高貴な姫の姿。"], ["サンソン・カラスコ", "主人公を故郷に帰そうと、騎士に変装する知人。"], ["ロシナンテ", "ドン・キホーテのやせた馬。"]], "links": ["melos", "botchan", "miguel-de-cervantes"], "synopsisSummary": ["スペインのラ・マンチャ地方に暮らす郷士は、騎士道物語を読みふけるうちに、本の中の冒険を現実だと信じるようになります。自分をドン・キホーテと名づけ、やせた馬ロシナンテに乗って、悪を倒し弱い人を助ける旅へ出ます。近くの村の女性も、心の中では高貴な姫ドゥルシネーアです。最初の旅で傷ついて戻っても懲りず、今度は農民サンチョ・パンサを従者に誘います。サンチョは、いつか島を治める役目をもらえるという約束に期待してついていきます。", "二人が同じ景色を見ても、見えているものは違います。ドン・キホーテには風車が巨人に見え、サンチョが止めるのも聞かず突進して、馬ごと倒されます。それでも彼は、魔法使いが巨人を風車に変えたのだと言い張ります。宿屋を城と思い込むなど、騎士のつもりで行動するたび騒ぎになり、周囲にも迷惑をかけます。サンチョは現実的な忠告をしながらも、主を助け、口げんかを重ねつつ旅を続けます。", "後編では、二人の冒険がすでに本になり、その本を読んだ人々が彼らを知っています。公爵夫妻は二人を迎え、騎士道の世界が本当にあるかのような芝居やいたずらを仕掛けて楽しみます。サンチョも「島」と呼ばれる町の統治を任され、争いの裁きでは意外な知恵を見せます。しかし食事も自由にならず、偽の襲撃で痛い目に遭い、地位より自由な暮らしがよいと役目を捨てます。", "やがてドン・キホーテはバルセロナで、白月の騎士との勝負に敗れ、一年間冒険をやめて故郷へ帰ると約束します。相手の正体は、彼を家で休ませようと変装した知人サンソン・カラスコでした。帰郷した彼は病気になり、騎士道物語への思い込みから覚めます。本名のアロンソ・キハーノとして遺言を作り、サンチョに謝ります。サンチョはまた一緒に野へ出ようと励ましますが、彼は家族や友人に見守られながら亡くなります。"], "sources": [{"title": "Ormsby英訳本文（主要場面・終章照合）", "url": "https://www.gutenberg.org/cache/epub/996/pg996-images.html"}, {"title": "Gutenberg #996（著者・訳者生没年と米国PD表示）", "url": "https://www.gutenberg.org/ebooks/996"}, {"title": "スペイン国立図書館・1605/1615年両編書誌", "url": "https://www.bne.es/es/quijote/"}, {"title": "スペイン国立図書館・初版と作者生没年", "url": "https://www.bne.es/es/colecciones/cervantes/ingenioso-hidalgo-don-quixote-mancha"}, {"title": "米国議会図書館・Ormsby1829–1895", "url": "https://www.loc.gov/item/99002078/"}, {"title": "Gutenberg利用方針（出典リンクの扱い）", "url": "https://www.gutenberg.org/policy/license.html"}], "sourceNote": "前編1605年、後編1615年刊。両編を通した主要な筋を紹介しています。照合資料はJohn Ormsbyによる旧英訳（Project Gutenberg #996）。特定の現代日本語訳や児童向け再話、ミュージカル版の要約ではありません。", "textNote": "暴力や人をからかう行為、病気と死を扱います。", "image": "assets/donquixote-windmill-scene.webp", "imageAlt": "風車へ向かうドン・キホーテに、従者のサンチョが呼びかけて止めようとします。", "primaryCategory": "world-literature", "inlineIllustrations": [{"afterParagraph": 2, "src": "assets/donquixote-windmill-scene.webp", "alt": "風車へ進もうとする馬上のドン・キホーテに呼びかけるサンチョ", "caption": "風車を巨人と思い込むドン・キホーテに、サンチョが呼びかけて止めようとします。", "width": 1200, "height": 800}, {"afterParagraph": 3, "src": "assets/donquixote-sancho-scene.webp", "alt": "町の人々から話を聞き、争いを裁くサンチョの場面イメージ", "caption": "町で人々の話を聞き、争いを裁くサンチョ。", "width": 1200, "height": 800}, {"afterParagraph": 4, "src": "assets/donquixote-sancho-bedside-scene.webp", "alt": "故郷の病床で、ドン・キホーテに語りかけるサンチョ。もう一度一緒に野へ出ようと励ましますが、旅が再開することはありません。", "caption": "故郷の病床で、ドン・キホーテに語りかけるサンチョ。もう一度一緒に野へ出ようと励ましますが、旅が再開することはありません。", "width": 1200, "height": 800}], "headerCaption": "風車へ向かうドン・キホーテに、従者のサンチョが呼びかけて止めようとします。", "characterGallery": [{"name": "ドン・キホーテ", "role": "騎士道物語を現実と信じて旅をする郷士。本名はアロンソ・キハーノ。", "portraits": [{"src": "assets/donquixote-face-donquixote.webp", "label": "", "alt": "ドン・キホーテの創作イメージ", "width": 500, "height": 500}]}, {"name": "サンチョ・パンサ", "role": "島を治める役目をもらう約束にひかれて同行する農民。次第に主と友情を深める。", "portraits": [{"src": "assets/donquixote-face-sancho.webp", "label": "", "alt": "サンチョ・パンサの創作イメージ", "width": 500, "height": 500}]}, {"name": "ドゥルシネーア", "role": "ドン・キホーテが近隣の女性アルドンサをもとに思い描く、高貴な姫の姿。", "portraits": [{"src": "assets/donquixote-face-dulcinea.webp", "label": "主人公が思い描く姫", "alt": "ドゥルシネーアの創作イメージ", "width": 500, "height": 500}]}, {"name": "サンソン・カラスコ", "role": "主人公を故郷に帰そうと、騎士に変装する知人。", "portraits": [{"src": "assets/donquixote-face-carrasco.webp", "label": "", "alt": "サンソン・カラスコの創作イメージ", "width": 500, "height": 500}]}, {"name": "ロシナンテ", "role": "ドン・キホーテのやせた馬。", "portraits": [{"src": "assets/donquixote-face-rocinante.webp", "label": "", "alt": "ロシナンテの創作イメージ", "width": 500, "height": 500}]}], "characterGalleryNote": "ドゥルシネーアの画像は、ドン・キホーテが思い描く姫の姿を表しています。"}, {"id": "happyprince", "name": "幸福な王子", "reading": "こうふくなおうじ", "cat": "literature", "bodyReadings": {"金箔": "きんぱく", "宮殿": "きゅうでん", "お針子": "おはりこ", "芝居": "しばい", "鉛": "なまり", "心臓": "しんぞう", "炉": "ろ", "貴い": "とうとい", "天使": "てんし", "天上": "てんじょう", "苦境": "くきょう", "皮肉": "ひにく", "犠牲": "ぎせい", "貧しい": "まずしい"}, "genreLabel": "世界の童話 · ワイルド童話", "genre": "world-literature", "checkedDate": "2026年11月2日", "sub": "オスカー・ワイルド｜1888年初刊行", "motif": "book", "intro": "金箔と宝石に飾られた王子の像は、高い場所から町を見渡し、人々の苦しみに涙を流している。南へ旅する途中のツバメが、像の足元へ降り立った。動けない王子は、困っている人へ届け物をしてほしいと頼む。", "gist": "豪華な像と渡り鳥が、見過ごされている人々のために動く。見た目の輝きと、本当に大切なものを見つめる童話。", "people": [["幸福な王子", "町を見下ろす像。生前には知らなかった人々の苦しみに気づく。"], ["ツバメ", "王子に代わり宝石や金箔を届ける渡り鳥。"], ["市長と議員たち", "像の見た目の変化を価値の喪失とみなす。"], ["天使", "神の求めに応じ、町で大切なものを選ぶ。"]], "links": ["gongitsune", "yamanashi", "oscar-wilde"], "synopsisSummary": ["町の高い柱の上に、金箔と宝石で飾られた王子の像が立っています。生きていた頃の王子は、宮殿の外にある苦しみを知らず、楽しい毎日を送っていました。しかし像になって町を見渡すと、貧しい人々の暮らしが見え、涙が止まらなくなります。そこへ、暖かいエジプトへ向かう途中のツバメが、ひと晩の寝場所を求めてやって来ました。", "動けない王子はツバメに頼み、剣を飾るルビーを、病気の息子を抱えた貧しいお針子の家へ届けさせます。旅を急いでいたツバメも、親子を助けると、寒いのに心が温まるように感じました。", "翌晩には、寒さと空腹で芝居を書けない若者へ、王子の片目のサファイアを届けます。さらに、売り物のマッチをぬらし、父の暴力を恐れる少女のため、もう一方の目も運びました。", "両目を失った王子が旅立ちを勧めても、ツバメはそばに残ると決めます。そして町を飛び回り、飢えた子どもたちの様子を伝え、像を覆う金箔を一枚ずつ人々へ配りました。王子の外見は輝きを失いますが、食べ物を得た子どもたちは元気を取り戻します。冬が深まり、ツバメは寒さに耐えられなくなります。王子に最後の口づけをすると、その足元で息絶え、像の中の鉛の心臓も二つに割れました。", "翌朝、市長たちは、みすぼらしくなった像には価値がないと考え、取り壊して溶かします。そして次は誰の像を建てるか、自分の名を挙げて言い争いました。炉でも溶けなかった心臓は、死んだツバメと同じごみ捨て場に捨てられます。神に町で最も貴い二つのものを求められた天使は、その心臓とツバメを選びました。神は選択を認め、ツバメと王子が天上で永遠に生きることを告げます。"], "sources": [{"title": "Project Gutenberg・英語原著本文と版履歴", "url": "https://www.gutenberg.org/files/902/902-h/902-h.htm"}, {"title": "Project Gutenberg・米国パブリックドメイン表示", "url": "https://www.gutenberg.org/ebooks/902"}, {"title": "英国国立公文書館・Oscar Wildeの死亡証明書", "url": "https://www.nationalarchives.gov.uk/explore-the-collection/explore-by-topic/identity-and-community/the-life-and-court-trials-of-oscar-wilde/"}, {"title": "JASRAC・戦時加算の対象時点", "url": "https://www.jasrac.or.jp/aboutus/wartime/"}], "sourceNote": "表題作を含む童話集 The Happy Prince and Other Tales の初版は1888年5月、London: David Nutt。参照したGutenberg #902は1910年第7刷の版表示を持つ英語原著本文。初刊年・底本年・電子化年を区別する。", "textNote": "貧困、病気、死、家庭内の暴力への言及を含みます。", "alternateName": "幸福の王子", "image": "assets/happyprince.webp", "imageAlt": "町を見下ろす王子の像とツバメの作品イメージ", "primaryCategory": "world-fairytale", "inlineIllustrations": [{"afterParagraph": 1, "src": "assets/happyprince-tears-scene.webp", "alt": "雨かと思って見上げたツバメは、王子の像が涙を流していることに気づきます。", "caption": "雨かと思って見上げたツバメは、王子の像が涙を流していることに気づきます。", "width": 1200, "height": 800}, {"afterParagraph": 2, "src": "assets/happyprince-delivery-scene.webp", "alt": "お針子と病気の子どもの部屋へ、赤い宝石を届けるツバメの場面イメージ", "caption": "王子から預かったルビーを、お針子の家へ届けるツバメ。", "width": 1200, "height": 800}, {"afterParagraph": 3, "src": "assets/happyprince-sapphire-scene.webp", "alt": "ツバメは、王子のもう一方の目のサファイアを、マッチをぬらして困っていた少女へ届けます。", "caption": "ツバメは、王子のもう一方の目のサファイアを、マッチをぬらして困っていた少女へ届けます。", "width": 1200, "height": 800}, {"afterParagraph": 4, "src": "assets/happyprince-bread-scene.webp", "alt": "王子の金箔を分けてもらった町では、パンを得た子どもたちが、元気に遊ぶようになります。", "caption": "王子の金箔を分けてもらった町では、パンを得た子どもたちが、元気に遊ぶようになります。", "width": 1200, "height": 800}], "characterGallery": [{"name": "幸福な王子", "role": "町を見下ろし、人々の苦しみに気づく像。", "portraits": [{"src": "assets/happyprince-face-prince.webp", "label": "像のはじめの姿", "alt": "幸福な王子の人物イメージ", "width": 500, "height": 500}]}, {"name": "ツバメ", "role": "王子の願いを受けて町を飛ぶ渡り鳥。", "portraits": [{"src": "assets/happyprince-face-swallow.webp", "label": "", "alt": "ツバメの人物イメージ", "width": 500, "height": 500}]}, {"name": "市長と議員たち", "role": "町の政治を担う人々。", "portraits": [{"src": "assets/happyprince-face-leaders.webp", "label": "代表的なイメージ", "alt": "市長と議員たちの人物イメージ", "width": 500, "height": 500}]}, {"name": "天使", "role": "神の言葉を受けて地上を訪れる存在。", "portraits": [{"src": "assets/happyprince-face-angel.webp", "label": "想像した姿", "alt": "天使の人物イメージ", "width": 500, "height": 500}]}], "characterGalleryNote": "市長と議員たちは代表的な群像で、描いた人数が原作の人数を示すわけではありません。"}, {"id": "momotaro", "name": "桃太郎", "reading": "ももたろう", "bodyReadings": {"桃太郎": "ももたろう", "楠山正雄": "くすやままさお", "再話": "さいわ", "猿": "さる", "鬼が島": "おにがしま", "腕試し": "うでだめし", "降参": "こうさん", "略奪": "りゃくだつ", "憧れ": "あこがれ"}, "cat": "literature", "genreLabel": "日本の昔話", "genre": "japanese-folktale", "checkedDate": "2026年11月2日", "sub": "楠山正雄／再話｜成立年不詳", "credits": [["楠山正雄", "くすやままさお", "再話"]], "motif": "book", "intro": "川で洗濯をしていたおばあさんが、大きな桃を拾う。中から生まれた男の子は、力の強い桃太郎へと育った。鬼が島の話を聞いた桃太郎は、きびだんごを持って旅に出る。道で出会う動物たちは、どんな仲間になるのだろう。", "gist": "桃から生まれた少年が、犬・猿・きじと鬼が島へ。強さだけでなく、仲間の違う力が旅を進める昔話。", "people": [["桃太郎（ももたろう）", "桃から生まれ、老夫婦に育てられた力の強い少年。"], ["おじいさんとおばあさん", "桃太郎を育て、きびだんごを用意して旅立ちを支える。"], ["犬・猿・きじ（いぬ・さる・きじ）", "だんごをもらってお供になり、それぞれの力で冒険を助ける。"], ["鬼の大将（おにのたいしょう）", "鬼が島の鬼たちを率いる長。"]], "links": ["melos", "donquixote", "kusuyama-masao"], "synopsisSummary": ["おばあさんが川で拾った大きな桃を家へ持ち帰ると、桃が割れ、男の子が現れました。", "おじいさんとおばあさんは桃太郎と名づけ、大切に育てます。優しく力の強い十五歳に成長した桃太郎は、遠い国で腕試しをしたいと思うようになりました。鬼が島には、鬼たちが各地から奪った宝をため込んでいると旅人に聞き、鬼退治に出かけることを決めます。", "二人にきびだんごを作ってもらい、旅立った桃太郎は、犬、猿、きじに順番に出会います。それぞれにだんごを一つ渡すと、三匹はお供になりました。海辺の船に乗ると、犬が船をこぎ、猿がかじを取り、きじが見張りを担当します。こうして一行は、遠いはずの鬼が島へたちまち到着しました。", "鬼たちは城の門を閉めますが、きじが空から攻め、猿が壁を登って内側から門を開きます。桃太郎たちは協力して鬼を負かし、最後には鬼の大将も降参しました。", "命を助ける代わりに宝を差し出す約束が結ばれ、桃太郎は宝を積んで仲間と帰ります。犬、猿、きじが力を合わせて宝の車を運び、家ではおじいさんが働きを褒め、おばあさんが無事の帰りを喜びました。"], "sources": [{"title": "青空文庫・楠山正雄「桃太郎」本文", "url": "https://www.aozora.gr.jp/cards/000329/files/18376_12100.html"}, {"title": "青空文庫・作品と底本の書誌、楠山正雄の没年", "url": "https://www.aozora.gr.jp/cards/000329/card18376.html"}], "sourceNote": "昔から語り継がれてきた物語を、楠山正雄が再話した版に基づく。楠山を桃太郎伝承の創作者とはしない。この再話の初出年は今回の確認資料では確定しない。青空文庫の底本は『日本の神話と十大昔話』講談社学術文庫、1983年5月10日第1刷（入力は1992年第14刷）。1983年を昔話の成立年・再話の初出年と表示しない。", "textNote": "鬼との戦いと、宝を奪うことへの言及を含みます。", "summaryReadings": {"桃太郎": {"key": "桃太郎", "reading": "ももたろう"}, "猿": {"key": "猿", "reading": "さる"}}, "image": "assets/momotaro.webp", "imageAlt": "犬・猿・きじと道を進む桃太郎の作品イメージ", "primaryCategory": "japanese-folktale", "characterGallery": [{"name": "桃太郎（ももたろう）", "role": "桃から生まれ、老夫婦に育てられた力の強い少年。", "portraits": [{"src": "assets/momotaro-face-momotaro.webp", "label": "旅立ちのころ", "alt": "桃太郎（ももたろう）の創作イメージ", "width": 500, "height": 500}]}, {"name": "おじいさんとおばあさん", "role": "桃太郎を育て、きびだんごを用意して旅立ちを支える。", "portraits": [{"src": "assets/momotaro-face-grandparents.webp", "label": "左はおじいさん、右はおばあさん", "alt": "おじいさんとおばあさんの創作イメージ", "width": 500, "height": 500}]}, {"name": "犬・猿・きじ（いぬ・さる・きじ）", "role": "だんごをもらってお供になり、それぞれの力で冒険を助ける。", "portraits": [{"src": "assets/momotaro-face-companions.webp", "label": "左は犬、中央は猿、右はきじ", "alt": "犬・猿・きじ（いぬ・さる・きじ）の創作イメージ", "width": 500, "height": 500}]}, {"name": "鬼の大将（おにのたいしょう）", "role": "鬼が島の鬼たちを率いる長。", "portraits": [{"src": "assets/momotaro-face-oniboss.webp", "label": "", "alt": "鬼の大将（おにのたいしょう）の創作イメージ", "width": 500, "height": 500}]}], "characterGalleryNote": "おじいさんとおばあさんは桃太郎を育てた老夫婦です。", "headerCaption": "犬・猿・きじを仲間にし、鬼が島へ向かう桃太郎。", "inlineIllustrations": [{"afterParagraph": 1, "src": "assets/momotaro-peach-scene.webp", "alt": "川で洗濯をしていたおばあさんのもとへ、大きな桃が流れてきます。", "caption": "川で洗濯をしていたおばあさんのもとへ、大きな桃が流れてきます。", "width": 1200, "height": 800}, {"afterParagraph": 3, "src": "assets/momotaro-boat-scene.webp", "alt": "船をこぐ犬、かじを取る猿、見張りのきじと、同船する桃太郎の場面イメージ", "caption": "犬が船をこぎ、猿がかじを取り、きじが見張る。", "width": 1200, "height": 800}, {"afterParagraph": 4, "src": "assets/momotaro-surrender-scene.webp", "alt": "桃太郎たちに敗れた鬼の大将は、降参して命を助けてほしいと願います。", "caption": "桃太郎たちに敗れた鬼の大将は、降参して命を助けてほしいと願います。", "width": 1200, "height": 800}, {"afterParagraph": 5, "src": "assets/momotaro-homecoming-scene.webp", "alt": "鬼から受け取った宝を持って帰った桃太郎。おじいさんは働きを褒め、おばあさんは無事の帰りを喜びます。", "caption": "鬼から受け取った宝を持って帰った桃太郎。おじいさんは働きを褒め、おばあさんは無事の帰りを喜びます。", "width": 1200, "height": 800}]}, {"id": "redcap", "name": "赤ずきん", "reading": "あかずきん", "bodyReadings": {"狼": "おおかみ", "猟師": "りょうし", "祖母": "そぼ", "水槽": "すいそう", "溺れ": "おぼれ", "後日談": "ごじつだん", "採集": "さいしゅう", "編纂": "へんさん"}, "cat": "literature", "genreLabel": "世界の童話 · グリム童話", "genre": "grimm-folktale", "checkedDate": "2026年11月2日", "sub": "グリム兄弟／採集・編纂｜1812年初収録", "credits": [["グリム兄弟", "ぐりむきょうだい", "採集・編纂"]], "motif": "book", "intro": "赤い帽子の女の子が、病気のおばあさんへ届け物をするため森へ出かける。道を外れないよう母に言われたのに、出会った狼の話にひかれて寄り道をしてしまう。その間に、狼はおばあさんの家へ先回りしていた。", "gist": "親切そうな声と、いつもと違うおばあさん。だまされた女の子が、次の出会いではどう行動するかを描くグリム童話。", "people": [["赤ずきん", "おばあさんへ届け物をする女の子。"], ["おばあさん", "森の家に住む。後日談では赤ずきんと力を合わせる。"], ["狼（おおかみ）", "親しげに話しかけたり姿や声を装ったりしてだます。後日談の狼は別の一匹。"], ["猟師（りょうし）", "家の異変に気づき、のみ込まれた二人を助ける。"], ["母", "届け物を託し、道を外れないよう赤ずきんに言う。"]], "links": ["gloves", "happyprince", "brothers-grimm"], "synopsisSummary": ["おばあさんにもらった赤い帽子をいつもかぶる女の子が、赤ずきんと呼ばれていました。ある日、母に頼まれ、病気のおばあさんへ菓子とぶどう酒を届けに行きます。道を外れないように言われていましたが、森で出会った狼に行き先を教え、花を見てはどうかと誘われて寄り道をします。おばあさんが喜ぶと思い、もっときれいな花を探すうちに、森の奥へ進んでしまいました。", "狼は先回りしておばあさんをのみ込み、その服を着てベッドに入ります。ようやく到着した赤ずきんは、いつもと様子が違うことに気づきます。", "耳や目や手、口の大きさを不思議がりますが、正体を見抜く前に、自分ものみ込まれてしまいました。大きないびきを聞いた猟師が家に入り、狼のおなかから二人を助け出します。赤ずきんが運んだ石をおなかに入れられた狼は、目覚めて逃げようとして倒れ、死にました。赤ずきんは、もう勝手に道を外れないと心に決めます。", "このグリム版には、その後の話も続きます。別の日、もう一匹の狼に誘われた赤ずきんは、今度は寄り道をせず、おばあさんに知らせます。二人は戸を閉め、狼が声をまねても開けません。狼が屋根で待ち伏せすると、おばあさんの考えで、赤ずきんはソーセージをゆでた汁を外の水槽へ運びます。匂いに引かれた狼は屋根から身を乗り出し、水槽に落ちて溺れます。赤ずきんは無事に帰りました。"], "sources": [{"title": "Project Gutenberg・第26話 Little Red-Cap（Hunt英訳）", "url": "https://www.gutenberg.org/files/5314/5314-h/5314-h.htm"}, {"title": "Project Gutenberg・編者/訳者生没年と米国PD表示", "url": "https://www.gutenberg.org/ebooks/5314"}, {"title": "ニュージーランド国立図書館・Hunt英訳1884年版の書誌", "url": "https://natlib.govt.nz/records/22009143"}, {"title": "ベルリン国立図書館・グリム兄弟の生涯", "url": "https://staatsbibliothek-berlin.de/die-staatsbibliothek/abteilungen/kinder-und-jugendbuecher/aktuelles/ausstellung/aus-den-biographien"}, {"title": "D. L. Ashliman・版史（1812初収録、1857最終版）", "url": "https://sites.pitt.edu/~dash/grimm026.html"}], "sourceNote": "グリム兄弟が採集・編纂した『子どもと家庭の昔話』第26話。初版への収録は1812年、兄弟存命中の最終第7版は1857年。今回はマーガレット・ハントによる英訳（1884年刊）を収録したGutenberg #5314の本文を参照。1812年は昔話そのものが生まれた年ではない。猟師による救出と、二匹目の狼を退ける後日談を含むグリム系統。ペロー版や現代絵本の省略・改変とは区別する。", "textNote": "狼による襲撃、のみ込まれる場面、動物の死を扱います。", "summaryReadings": {"狼": {"key": "狼", "reading": "おおかみ"}, "猟師": {"key": "猟師", "reading": "りょうし"}}, "image": "assets/redcap.webp", "imageAlt": "森の道を進む赤ずきんと遠くの狼の作品イメージ", "primaryCategory": "world-fairytale", "inlineIllustrations": [{"afterParagraph": 1, "src": "assets/redcap.webp", "alt": "おばあさんの家へ向かう赤ずきんは、森で狼に出会います。", "caption": "おばあさんの家へ向かう赤ずきんは、森で狼に出会います。", "width": 1200, "height": 800}, {"afterParagraph": 2, "src": "assets/redcap-bed-dialogue-scene.webp", "alt": "おばあさんの寝床にいるのは、服と帽子で姿を装った狼です。赤ずきんは、いつもと違う様子を不思議に思います。", "caption": "おばあさんの寝床にいるのは、服と帽子で姿を装った狼です。赤ずきんは、いつもと違う様子を不思議に思います。", "width": 1200, "height": 800}, {"afterParagraph": 3, "src": "assets/redcap-safe-reunion-scene.webp", "alt": "猟師に助け出された赤ずきんとおばあさん。三人は無事を喜びます。", "caption": "猟師に助け出された赤ずきんとおばあさん。三人は無事を喜びます。", "width": 1200, "height": 800}], "characterGallery": [{"name": "赤ずきん", "role": "おばあさんへ届け物をする女の子。", "portraits": [{"src": "assets/redcap-face-redcap.webp", "label": "", "alt": "赤ずきんの創作イメージ", "width": 500, "height": 500}]}, {"name": "おばあさん", "role": "森の家に住む。後日談では赤ずきんと力を合わせる。", "portraits": [{"src": "assets/redcap-face-grandmother.webp", "label": "", "alt": "おばあさんの創作イメージ", "width": 500, "height": 500}]}, {"name": "狼（おおかみ）", "role": "親しげに話しかけたり姿や声を装ったりしてだます。後日談の狼は別の一匹。", "portraits": [{"src": "assets/redcap-face-wolf.webp", "label": "最初に出会う狼", "alt": "狼（おおかみ）の創作イメージ", "width": 500, "height": 500}]}, {"name": "猟師（りょうし）", "role": "家の異変に気づき、のみ込まれた二人を助ける。", "portraits": [{"src": "assets/redcap-face-huntsman.webp", "label": "", "alt": "猟師（りょうし）の創作イメージ", "width": 500, "height": 500}]}, {"name": "母", "role": "届け物を託し、道を外れないよう赤ずきんに言う。", "portraits": [{"src": "assets/redcap-face-mother.webp", "label": "", "alt": "母の創作イメージ", "width": 500, "height": 500}]}], "characterGalleryNote": "狼の画像は最初に出会う一匹を表しており、後日談の狼は別の一匹です。"}, {"id": "orion", "name": "オリオン座とオリオンの神話", "reading": "おりおんざとおりおんのしんわ", "bodyReadings": {"狩人": "かりゅうど", "三つ星": "みつぼし", "獣": "けもの", "天文詩": "てんもんし", "神話": "しんわ", "星座": "せいざ", "領域": "りょういき", "異伝": "いでん", "射た": "いた", "惜しむ": "おしむ"}, "cat": "myth", "genreLabel": "神話・星座", "genre": "myth-astronomy", "checkedDate": "2026年11月2日", "sub": "ギリシャ・ローマ神話｜古代からの伝承", "longTitle": true, "motif": "book", "intro": "狩りの腕に自信を持つオリオンは、どんな獣でも倒せると神々の前で誇った。その言葉を聞いた大地の女神が、彼に向かわせたのはサソリだった。冬の夜空でおなじみの星座に重ねられた、一つの物語をたどる。", "gist": "強い狩人が、思いがけない相手に敗れる。サソリの話と弓の異伝を分け、実際の星空の見方も紹介。", "people": [["オリオン", "狩りの腕に自信を持つ人物。死と星座になった理由には複数の伝承がある。"], ["アルテミス", "狩りの女神。主話ではオリオンも星空に置くよう願う。"], ["ガイア", "大地の女神。主話ではオリオンの言葉に怒ってサソリを送る。"], ["ゼウス", "主話でサソリとオリオンを星空に置く神。"], ["レト", "アルテミスの母。オリオンの自慢を聞く。"], ["アポロン", "弓を用いる別の伝承で、アルテミスをだます神。"]], "links": ["andromeda", "ginga"], "synopsisSummary": ["狩りに大きな自信を持つオリオンは、狩りの女神アルテミスと、その母レトの前で、大地に生きるどんな獣でも自分なら倒せると誇りました。", "それを聞いて怒った大地の女神ガイアは、オリオンにサソリを向かわせます。獣には負けないと思っていた狩人も、この相手には命を奪われてしまいました。", "ゼウスはサソリを星空に置き、人間が自分の力を信じすぎないための印にします。一方、オリオンを大切に思うアルテミスは、彼にも星空に居場所を与えてほしいと願いました。こうしてオリオンも星座となり、サソリが昇るとオリオンが沈むように置かれた、とこの話は結びます。地上の出来事が、夜空で繰り返される配置の物語になっているのです。", "同じ古代の本には、まったく別の最期も載っています。アポロンが、海にいるオリオンを遠くの的として示し、アルテミスに弓の腕を試させる話です。相手を知らずに射たアルテミスは、彼の死を悲しみ、星空へ置きます。こちらはサソリの話の続きではなく、別に伝わった説明です。両方をつなげて一つの出来事にすると、それぞれの物語の違いが失われます。"], "sources": [{"title": "ヒュギヌス名義『天文詩』第2巻26節・34節（古代ラテン語）", "url": "https://www.thelatinlibrary.com/hyginus/hyginus2.shtml"}, {"title": "なよろ市立天文台・冬の星座 オリオン座", "url": "https://nayoro-star.jp/kitasubaru/astro/photogallery/constellation/ori.html"}, {"title": "国立科学博物館・恒星の色", "url": "https://www.kahaku.go.jp/exhibitions/vm/resource/tenmon/space/stars/stars02.html"}, {"title": "国立天文台・88星座と国際天文学連合", "url": "https://www.nao.ac.jp/news/blog/2022/20220809-constellation.html"}, {"title": "国立天文台ニュース348・オリオン座の星の距離の違い", "url": "https://www.nao.ac.jp/contents/naoj-news/data/nao_news_0348.pdf"}], "sourceNote": "主な神話はヒュギヌス名義 De Astronomia 第2巻26節（サソリ）。異伝の比較は同34節末尾（イストロスの説として紹介される弓の話）。古代ラテン語本文を参照した独自説明で、現代の翻訳本の訳文は用いていない。成立年・作者同定の細部は確定表示しない。主話のラテン語名 Diana／Latona／Terra／Iuppiter を、対応するギリシャ名アルテミス／レト／ガイア／ゼウスにそろえた。2.26にはサソリを小さいとする記述や、全動物をすでに絶滅させたという記述はないため加えない。2.34の弓の異伝は別段落として区別。", "textNote": "狩り、死、だまされて人を射る神話を含みます。", "astronomyFacts": ["日本では冬の夜に見つけやすい星座です。ほぼ一列に並ぶ三つ星が目印になり、明るいベテルギウスは赤っぽく、リゲルは青白く見えます。ベテルギウスはシリウス、プロキオンとともに冬の大三角を作ります。", "現代の天文学で星座は、空を88に分けた領域です。神話の人物が実際に星へ変わったという科学的説明ではありません。同じ星座に見える星でも地球からの距離は異なります。「サソリから逃げる」は昔の語り方であり、星同士が追いかけ合っているわけではありません。"], "imageCaption": "神話をもとにしたAIイメージイラスト（実際の星図ではありません）", "image": "assets/orion.webp", "imageAlt": "狩人オリオンと想像上の星空を描いた神話イメージ", "primaryCategory": "myth", "characterGallery": [{"name": "オリオン", "role": "狩りの腕に自信を持つ人物。死と星座になった理由には複数の伝承がある。", "portraits": [{"src": "assets/orion-face-orion.webp", "label": "", "alt": "オリオンの創作イメージ", "width": 500, "height": 500}]}, {"name": "アルテミス", "role": "狩りの女神。主話ではオリオンも星空に置くよう願う。", "portraits": [{"src": "assets/orion-face-artemis.webp", "label": "", "alt": "アルテミスの創作イメージ", "width": 500, "height": 500}]}, {"name": "ガイア", "role": "大地の女神。主話ではオリオンの言葉に怒ってサソリを送る。", "portraits": [{"src": "assets/orion-face-gaia.webp", "label": "", "alt": "ガイアの創作イメージ", "width": 500, "height": 500}]}, {"name": "ゼウス", "role": "主話でサソリとオリオンを星空に置く神。", "portraits": [{"src": "assets/orion-face-zeus.webp", "label": "", "alt": "ゼウスの創作イメージ", "width": 500, "height": 500}]}, {"name": "レト", "role": "アルテミスの母。オリオンの自慢を聞く。", "portraits": [{"src": "assets/orion-face-leto.webp", "label": "", "alt": "レトの創作イメージ", "width": 500, "height": 500}]}, {"name": "アポロン", "role": "弓を用いる別の伝承で、アルテミスをだます神。", "portraits": [{"src": "assets/orion-face-apollo.webp", "label": "弓の異伝に登場", "alt": "アポロンの創作イメージ", "width": 500, "height": 500}]}], "characterGalleryNote": "アポロンは、サソリの主話とは別の伝承に登場します。実際の星の姿を表したものではありません。", "inlineIllustrations": [{"afterParagraph": 1, "src": "assets/orion-hunting-boast-scene.webp", "caption": "オリオンは、アルテミスとその母レトの前で、どんな獣でも倒せると誇ります。", "alt": "オリオンは、アルテミスとその母レトの前で、どんな獣でも倒せると誇ります。", "width": 1200, "height": 800}, {"afterParagraph": 2, "src": "assets/orion-scorpion-confrontation-scene.webp", "caption": "ガイアが向かわせたのはサソリでした。自分の力に自信を持っていたオリオンも、この相手には勝てません。", "alt": "ガイアが向かわせたのはサソリでした。自分の力に自信を持っていたオリオンも、この相手には勝てません。", "width": 1200, "height": 800}, {"afterParagraph": 3, "src": "assets/orion-artemis-appeal-scene.webp", "caption": "アルテミスはゼウスに、オリオンにも星空の居場所を与えてほしいと願います。", "alt": "アルテミスはゼウスに、オリオンにも星空の居場所を与えてほしいと願います。", "width": 1200, "height": 800}]}, {"id": "andromeda", "name": "アンドロメダ座とペルセウスの物語", "reading": "あんどろめだざとぺるせうすのものがたり", "bodyReadings": {"王妃": "おうひ", "神託": "しんたく", "鎖": "くさり", "彫像": "ちょうぞう", "宴": "うたげ", "叔父": "おじ", "故郷": "こきょう", "理不尽": "りふじん", "銀河": "ぎんが"}, "cat": "myth", "genreLabel": "神話・星座", "genre": "myth-astronomy", "checkedDate": "2026年11月2日", "sub": "ギリシャ・ローマ神話｜古代からの伝承", "longTitle": true, "motif": "book", "intro": "母の自慢が神々の怒りを招き、王女アンドロメダは怪物に差し出されることになった。海辺の岩につながれた彼女の前へ、翼のある靴で旅をするペルセウスが現れる。海からは、怪物が近づいていた。", "gist": "母の言葉のために危険へさらされた王女と、空から現れた英雄。救出とその後の争いをたどる神話。", "people": [["アンドロメダ", "母の言葉が招いた災いのため、岩に鎖でつながれた王女。"], ["ペルセウス", "メドゥーサを倒した英雄。王女を救う。"], ["カシオペヤ", "アンドロメダの母。参照版では自分の美しさを誇る。"], ["ケフェウス", "アンドロメダの父である王。"], ["フィネウス", "王の弟で、王女の以前の婚約者。婚宴で争いを起こす。"]], "links": ["orion", "romeoandjuliet"], "synopsisSummary": ["アンドロメダは、ケフェウス王と王妃カシオペヤの娘です。母が自分の美しさを海の女神たちと比べて誇ったため、女神たちは怒り、海の神に頼んで国へ怪物を送りました。災いを止める方法を神託にたずねると、娘を怪物に差し出すよう求められます。自分が自慢したわけではないアンドロメダは、海辺の岩に鎖でつながれてしまいました。", "そこへ、メドゥーサを倒して旅を続けていたペルセウスが、翼のある靴で飛んできます。岩につながれた娘は、髪が風に動き、涙を流していなければ彫像かと思うほどでした。心を引かれた彼が事情を聞いているうちに、海から怪物が近づいてきます。両親は嘆くばかりで助けられません。ペルセウスは、救出できたら娘と結婚させてほしいと申し出て、両親は承知しました。", "ペルセウスが空へ舞い上がると、怪物は水面に映る彼の影へ襲いかかります。そのすきを突いて、彼は上から剣で攻撃します。怪物の反撃をかわしますが、水しぶきで翼がぬれ、飛び続けるのが難しくなりました。そこで海面から出た岩に身を支え、剣でとどめを刺します。", "アンドロメダは鎖から解放され、二人は結婚しました。", "けれども祝いの宴に、以前アンドロメダの婚約者だった叔父フィネウスが仲間を連れて現れ、戦いになります。王は、娘が危険にさらされたとき助けなかったのに、と弟を責めますが、争いは止まりません。大勢に囲まれたペルセウスは、味方に顔をそむけるよう告げ、持っていたメドゥーサの首を見せます。敵は石になり、最後にはフィネウスも石に変わりました。争いが終わると、ペルセウスはアンドロメダを伴って故郷へ向かいます。"], "sources": [{"title": "Project Gutenberg・Riley英訳『変身物語』第4〜5巻", "url": "https://www.gutenberg.org/files/21765/21765-h/21765-h.htm"}, {"title": "Project Gutenberg・英訳者生没年と米国PD表示", "url": "https://www.gutenberg.org/ebooks/21765"}, {"title": "ぐんま天文台・秋の星座", "url": "https://www.astron.pref.gunma.jp/kyozai01/seiza/aki.html"}, {"title": "国立天文台・秋の空のM31と天の川銀河", "url": "https://www.nao.ac.jp/news/blog/2022/20220928-astro.html"}], "sourceNote": "古代ローマの詩人オウィディウス『変身物語』第4巻末の救出・結婚と第5巻冒頭の婚宴の争いを参照。英訳はHenry Thomas Riley（1851年刊）。Gutenberg #21765の底本は1893年Bell版と1899年McKay版。神話の成立年、英訳の刊行年、星座の制定時期は同じではありません。この版では海の怪物を剣で倒します。メドゥーサの首を使うのは後の婚宴の争いです。ペルセウスは翼のある靴で飛び、ペガススに乗って救出する筋にはしていません。母が誇るのは自分自身の美しさです。舞台の「アイティオピア」は古代の神話・地理上の呼び名であり、そのまま現代のエチオピア国家の領域と同一視しません。本文では国名を省略。", "textNote": "いけにえ、怪物との戦い、人が石に変わる場面を扱います。", "astronomyFacts": ["日本では秋の夜空にアンドロメダ座やペルセウス座を見られます。ペガスス座とアンドロメダ座にまたがる「秋の四辺形」が目印です。アンドロメダ座の方向にはM31（アンドロメダ銀河）があり、十分暗い空ではぼんやりした光として見えます。これは私たちの天の川銀河の外にある、別の銀河です。星座に結びつけられた神話と、観測で分かる天体の姿は別のものです。"], "imageCaption": "神話をもとにしたAIイメージイラスト（実際の星図ではありません）", "image": "assets/andromeda.webp", "imageAlt": "海辺のアンドロメダとペルセウスを描いた神話イメージ", "primaryCategory": "myth", "inlineIllustrations": [{"afterParagraph": 1, "src": "assets/andromeda-rock-awaiting-rescue-scene.webp", "caption": "自分の言葉が原因ではないのに、アンドロメダは海辺の岩につながれ、怪物に差し出されます。", "alt": "自分の言葉が原因ではないのに、アンドロメダは海辺の岩につながれ、怪物に差し出されます。", "width": 1200, "height": 800}, {"afterParagraph": 3, "src": "assets/andromeda-shadow-rescue-scene.webp", "alt": "ペルセウスが空へ舞い上がると、海獣は水面の影に襲いかかります。彼はそのすきを突き、剣で立ち向かいます。", "caption": "ペルセウスが空へ舞い上がると、海獣は水面の影に襲いかかります。彼はそのすきを突き、剣で立ち向かいます。", "width": 1200, "height": 800}, {"afterParagraph": 4, "src": "assets/andromeda-wedding-feast-scene.webp", "caption": "救出されたアンドロメダとペルセウスは結婚します。祝いの席は開かれますが、この後、以前の婚約者が争いを起こします。", "alt": "救出されたアンドロメダとペルセウスは結婚します。祝いの席は開かれますが、この後、以前の婚約者が争いを起こします。", "width": 1200, "height": 800}], "characterGallery": [{"name": "アンドロメダ", "role": "母の言葉が招いた災いのため、岩に鎖でつながれた王女。", "portraits": [{"src": "assets/andromeda-face-andromeda.webp", "label": "", "alt": "アンドロメダの創作イメージ", "width": 500, "height": 500}]}, {"name": "ペルセウス", "role": "メドゥーサを倒した英雄。王女を救う。", "portraits": [{"src": "assets/andromeda-face-perseus.webp", "label": "", "alt": "ペルセウスの創作イメージ", "width": 500, "height": 500}]}, {"name": "カシオペヤ", "role": "アンドロメダの母。参照版では自分の美しさを誇る。", "portraits": [{"src": "assets/andromeda-face-cassiopeia.webp", "label": "", "alt": "カシオペヤの創作イメージ", "width": 500, "height": 500}]}, {"name": "ケフェウス", "role": "アンドロメダの父である王。", "portraits": [{"src": "assets/andromeda-face-cepheus.webp", "label": "", "alt": "ケフェウスの創作イメージ", "width": 500, "height": 500}]}, {"name": "フィネウス", "role": "王の弟で、王女の以前の婚約者。婚宴で争いを起こす。", "portraits": [{"src": "assets/andromeda-face-phineus.webp", "label": "婚宴の争いの前の姿", "alt": "フィネウスの創作イメージ", "width": 500, "height": 500}]}], "characterGalleryNote": "フィネウスはケフェウス王の弟で、アンドロメダの叔父にあたります。ここでは石に変わる前の姿を描いています。"}, {"id": "aliceinwonderland", "name": "不思議の国のアリス", "reading": "ふしぎのくにのありす", "bodyReadings": {"白ウサギ": "しろうさぎ", "川岸": "かわぎし", "公爵夫人": "こうしゃくふじん", "帽子屋": "ぼうしや", "三月ウサギ": "さんがつうさぎ", "処刑": "しょけい", "証言": "しょうげん", "有罪": "ゆうざい", "証人": "しょうにん", "膝": "ひざ", "無秩序": "むちつじょ", "チェシャ猫": "ちぇしゃねこ"}, "cat": "literature", "genreLabel": "海外ファンタジー", "genre": "world-literature", "checkedDate": "2026年11月2日", "sub": "ルイス・キャロル｜1865年初刊行", "motif": "book", "intro": "川岸で退屈していたアリスの前を、時計を気にする白ウサギが通り過ぎた。後を追って穴に飛び込むと、飲み物で体が縮み、動物たちが言葉を話す世界へ。美しい庭へ行きたいのに、何をしても思いどおりにならない。", "gist": "大きくなったり、小さくなったり。変な会話と勝手な規則の世界で、少女が自分の言葉を取り戻す冒険。", "people": [["アリス", "好奇心から白ウサギを追い、不思議な世界を旅する少女。"], ["白ウサギ（しろうさぎ）", "時計を気にして急ぐウサギ。冒険のきっかけを作る。"], ["チェシャ猫（ちぇしゃねこ）", "姿を現したり消したりし、笑いだけを残す猫。"], ["帽子屋・三月ウサギ・ヤマネ（ぼうしや・さんがつうさぎ・やまね）", "終わらないお茶会で、アリスとちぐはぐな会話を交わす。"], ["ハートの女王と王（はーとのじょおうとおう）", "トランプの支配者。試合や裁判で理不尽な命令をする。"], ["アリスの姉（ありすのあね）", "川岸でアリスを見守り、結末で妹の夢と将来を思い描く。"]], "links": ["yumejuya", "redcap", "lewis-carroll"], "synopsisSummary": ["姉と川岸にいたアリスは、服のポケットから時計を出す白ウサギを見つけ、後を追って穴に飛び込みます。長い落下の先には、扉の並ぶ広間がありました。小さな扉の向こうに美しい庭が見えますが、体が大きくて通れません。飲み物や菓子で体の大きさが変わるものの、今度は鍵に手が届かなくなるなど、思いどおりにはいきません。", "大きかったときに流した涙の池で泳ぐことにもなります。", "アリスは、話す動物たちと出会いながら不思議な世界を進みます。体も記憶もいつもと違い、自分が誰なのかさえ不安になりますが、イモムシに教わったキノコを食べ分け、体の大きさを調節する方法を覚えます。公爵夫人の家から連れ出した赤ん坊はブタになり、チェシャ猫は姿を消して笑いだけを残します。常識で説明しようとするほど、目の前の出来事はずれていきます。", "帽子屋、三月ウサギ、ヤマネのお茶会では、なぞなぞを出した本人が答えを知らず、話は次々に食い違います。帽子屋によると「時間」と仲たがいして以来、ずっと六時のお茶の時間なのです。失礼な応対にうんざりして席を離れたアリスは、ようやく庭へ入ります。そこではトランプの女王が気に入らない相手へ処刑を命じ、フラミンゴとハリネズミを使うクロッケーも、決まった順番を守らず混乱していました。", "やがて、女王のタルトを盗んだとしてハートのジャックを裁く場に行きます。証言はまとまらず、証人に呼ばれたアリスは、また大きくなりながら勝手な規則に反論します。王が関係の分からない詩まで有罪の証拠にしようとすると、その意味を問いただしました。女王が判定より先に刑を決めようとすると、アリスは従うのをやめ、相手はただのトランプだと言い放ちます。", "札が一斉に飛びかかった瞬間、アリスは姉の膝で目を覚まします。冒険は夢でした。話を聞いた姉は、妹が去った後もその世界を思い浮かべます。そして、成長したアリスが子どもの心を忘れず、いつか別の子どもたちにも物語を語る姿を想像するのでした。"], "sources": [{"title": "Project Gutenberg・キャロル英語原著本文", "url": "https://www.gutenberg.org/files/11/11-h/11-h.htm"}, {"title": "Project Gutenberg・著者没年と米国PD表示", "url": "https://www.gutenberg.org/ebooks/11"}, {"title": "モーガン図書館・博物館 Alice展（初刊行と版の経緯）", "url": "https://www.themorgan.org/exhibitions/online/alice"}, {"title": "ヴィクトリア州立図書館・初版の年記と実際の刊行", "url": "https://guides.slv.vic.gov.au/alice/getstarted"}], "sourceNote": "原著初刊行は1865年。最初の印刷は挿絵の印刷品質の問題で回収され、年記を1866年とした刷り直しも1865年中に出た。参照したGutenberg #11はThe Millennium Fulcrum Edition 3.0と表示される英語電子本文であり、1865年初刷の画像版そのものではない。後の『鏡の国のアリス』とは別作品。", "textNote": "体が変化する場面、脅しや処刑命令、赤ん坊への乱暴な扱いを含みます。", "summaryReadings": {"白ウサギ": {"key": "白ウサギ", "reading": "しろうさぎ"}, "公爵夫人": {"key": "公爵夫人", "reading": "こうしゃくふじん"}, "帽子屋": {"key": "帽子屋", "reading": "ぼうしや"}, "三月ウサギ": {"key": "三月ウサギ", "reading": "さんがつうさぎ"}, "チェシャ猫": {"key": "チェシャ猫", "reading": "ちぇしゃねこ"}}, "image": "assets/aliceinwonderland.webp", "imageAlt": "不思議な庭のアリスと時計を持つ白ウサギの作品イメージ", "primaryCategory": "world-fantasy", "inlineIllustrations": [{"afterParagraph": 1, "src": "assets/alice-key-scene.webp", "alt": "小さくなったアリスには、ガラスの机の上に置いた鍵が届かなくなってしまいます。", "caption": "小さくなったアリスには、ガラスの机の上に置いた鍵が届かなくなってしまいます。", "width": 1200, "height": 800}, {"afterParagraph": 2, "src": "assets/alice-growing-scene.webp", "alt": "菓子で大きくなったアリス。鍵は取れても、小さな扉を通れません。", "caption": "菓子で大きくなったアリス。鍵は取れても、小さな扉を通れません。", "width": 1200, "height": 800}, {"afterParagraph": 3, "src": "assets/alice-cheshire-scene.webp", "alt": "枝の上で姿を消していくチェシャ猫を見上げるアリスの場面イメージ", "caption": "姿が薄れていくチェシャ猫を見つめるアリス。", "width": 1200, "height": 800}, {"afterParagraph": 5, "src": "assets/alice-court-scene.webp", "alt": "裁判の順番まで勝手に決める女王に、アリスは自分の言葉で反論します。", "caption": "裁判の順番まで勝手に決める女王に、アリスは自分の言葉で反論します。", "width": 1200, "height": 800}], "characterGallery": [{"name": "アリス", "role": "好奇心から白ウサギを追い、不思議な世界を旅する少女。", "portraits": [{"src": "assets/alice-face-alice.webp", "label": "", "alt": "アリスの創作イメージ", "width": 500, "height": 500}]}, {"name": "白ウサギ（しろうさぎ）", "role": "時計を気にして急ぐウサギ。冒険のきっかけを作る。", "portraits": [{"src": "assets/alice-face-whiterabbit.webp", "label": "", "alt": "白ウサギの創作イメージ", "width": 500, "height": 500}]}, {"name": "チェシャ猫（ちぇしゃねこ）", "role": "姿を現したり消したりし、笑いだけを残す猫。", "portraits": [{"src": "assets/alice-face-cheshire.webp", "label": "", "alt": "チェシャ猫の創作イメージ", "width": 500, "height": 500}]}, {"name": "帽子屋・三月ウサギ・ヤマネ（ぼうしや・さんがつうさぎ・やまね）", "role": "終わらないお茶会で、アリスとちぐはぐな会話を交わす。", "portraits": [{"src": "assets/alice-face-teaparty.webp", "label": "左は帽子屋、右は三月ウサギ、手前はヤマネ", "alt": "帽子屋・三月ウサギ・ヤマネの創作イメージ", "width": 500, "height": 500}]}, {"name": "ハートの女王と王（はーとのじょおうとおう）", "role": "トランプの支配者。試合や裁判で理不尽な命令をする。", "portraits": [{"src": "assets/alice-face-kingqueen.webp", "label": "左は女王、右は王", "alt": "ハートの女王と王の創作イメージ", "width": 500, "height": 500}]}, {"name": "アリスの姉（ありすのあね）", "role": "川岸でアリスを見守り、結末で妹の夢と将来を思い描く。", "portraits": [{"src": "assets/alice-face-sister.webp", "label": "", "alt": "アリスの姉の創作イメージ", "width": 500, "height": 500}]}], "characterGalleryNote": "ハートの女王と王は、この作品のトランプの支配者として描いています。"}, {"id": "cinderella", "name": "シンデレラ", "reading": "しんでれら", "bodyReadings": {"継母": "ままはは", "義理": "ぎり", "屋根裏": "やねうら", "暖炉": "だんろ", "舞踏会": "ぶとうかい", "妖精": "ようせい", "御者": "ぎょしゃ", "従者": "じゅうしゃ", "衣装": "いしょう", "宮廷": "きゅうてい", "名付け親": "なづけおや"}, "cat": "literature", "genreLabel": "世界の童話 · ペロー童話", "genre": "perrault-folktale", "checkedDate": "2026年11月2日", "sub": "シャルル・ペロー｜1697年・ペロー版初刊", "motif": "book", "intro": "継母と姉たちに家事を押しつけられ、灰のそばで休む娘。姉たちが舞踏会へ出かけた夜、取り残された彼女の前に、妖精が現れる。かぼちゃの馬車とガラスの靴は、外の世界へ踏み出す助けになるだろうか。", "gist": "見過ごされていた娘が、助けを得て舞踏会へ。ガラスの靴を手がかりに運命が変わる、ペロー版の童話。", "people": [["シンデレラ", "継母と義理の姉たちから家事を押しつけられる娘。"], ["妖精（ようせい）", "シンデレラを魔法で助ける存在。"], ["王子（おうじ）", "舞踏会で彼女と出会い、残された靴を手がかりに探す。"], ["継母（ままはは）と二人の姉", "シンデレラを冷遇する家族。姉たちは最後に謝罪する。"], ["父", "再婚した妻の言いなりで、娘が頼れない父親。"]], "links": ["happyprince", "momotaro", "charles-perrault"], "synopsisSummary": ["父が再婚してから、シンデレラは継母と二人の義理の姉に冷たく扱われ、家のつらい仕事を押しつけられていました。姉たちは立派な部屋で眠るのに、彼女の寝床は屋根裏の粗末なわらの床です。仕事のあと、暖炉の灰のそばに座ることから、灰にちなむ呼び名で呼ばれていました。父にも助けを求められません。父は妻の言いなりで、訴えても叱られると思ったからです。", "ある日、王子が開く舞踏会に姉たちが招かれます。シンデレラはからかわれても、髪を美しく整えて送り出しました。一人で泣いていると、妖精が願いを聞き、力を貸してくれます。かぼちゃは馬車に、ねずみは馬や御者（馬車を操る人）に、とかげは従者（付き添いの人）に変わり、古い服も宝石のついた衣装になります。ガラスの靴も与えられますが、魔法が解ける真夜中までに帰る約束です。", "舞踏会で王子は彼女を迎え、一緒に踊ります。姉たちは妹だと気づきません。シンデレラは姉たちにも親切にし、王子にもらった果物を分けました。", "その晩は約束の時刻より前に帰り、妖精に礼を言います。翌晩、再び舞踏会へ出かけると、王子との時間に夢中になり、時計が十二時を打つまで気づきませんでした。慌てて逃げる途中、ガラスの靴を片方落とします。帰宅したとき、馬車も衣装も元に戻っていましたが、もう片方の靴は残っていました。", "王子は拾った靴がぴったり合う娘と結婚すると告げ、使いを出します。姉たちの足には入りませんが、自分にも試させてほしいと申し出たシンデレラには、ぴたりと合いました。", "さらに彼女がもう片方を取り出し、妖精が服を変えると、姉たちは舞踏会の娘だと悟り、これまでの仕打ちを謝ります。シンデレラは二人を許して抱きしめ、王子と結婚しました。姉たちにも宮殿の住まいを与え、宮廷の有力者たちとの結婚を取り持ちます。"], "sources": [{"title": "Project Gutenberg・1922年版ペロー童話集（本文・2教訓）", "url": "https://www.gutenberg.org/cache/epub/29021/pg29021-images.html"}, {"title": "Project Gutenberg・作者/訳者/改訂者生没年と米国PD", "url": "https://www.gutenberg.org/ebooks/29021"}, {"title": "フランス国立図書館・1697年原刊書誌", "url": "https://catalogue.bnf.fr/ark:/12148/cb31084290g"}, {"title": "国立国会図書館・Mansion（1870–1942）の著者標目", "url": "https://ndlsearch.ndl.go.jp/books/R100000039-I2515854"}], "sourceNote": "ペロー版は1697年刊『過ぎし昔の物語ならびに教訓』に収録。これはシンデレラ型の昔話すべての誕生年ではありません。参照した英語本文はRobert Samberの旧訳をJ. E. Mansionが改訂した『The Fairy Tales of Charles Perrault』（George G. Harrap、1922年8月初刊）、Gutenberg #29021。かぼちゃの馬車とガラスの靴が登場するペロー系統。舞踏会は二晩あり、姉たちは最後に許される。グリム版や映画版の固有設定は混ぜていません。 途中のイラストは場面を分かりやすく描くため、馬や従者の数を一部省略しています。 原作では、妖精はシンデレラの洗礼親にあたる存在です。ここでは、魔法で彼女を助ける妖精として説明しています。", "textNote": "家族による冷遇やいじめを扱います。", "summaryReadings": {"継母": {"key": "継母", "reading": "ままはは"}, "妖精": {"key": "妖精", "reading": "ようせい"}, "名付け親": {"key": "名付け親", "reading": "なづけおや"}}, "image": "assets/cinderella-scene.webp", "imageAlt": "妖精に助けられて支度を整えたシンデレラは、舞踏会へ出かけます。", "primaryCategory": "world-fairytale", "characterGallery": [{"name": "シンデレラ", "role": "継母と義理の姉たちから家事を押しつけられる娘。", "portraits": [{"src": "assets/cinderella-face-cinderella.webp", "label": "", "alt": "シンデレラの創作イメージ", "width": 500, "height": 500}]}, {"name": "妖精（ようせい）", "role": "シンデレラを魔法で助ける存在。", "portraits": [{"src": "assets/cinderella-face-fairy.webp", "label": "", "alt": "妖精（ようせい）の創作イメージ", "width": 500, "height": 500}]}, {"name": "王子（おうじ）", "role": "舞踏会で彼女と出会い、残された靴を手がかりに探す。", "portraits": [{"src": "assets/cinderella-face-prince.webp", "label": "", "alt": "王子（おうじ）の創作イメージ", "width": 500, "height": 500}]}, {"name": "継母（ままはは）と二人の姉", "role": "シンデレラを冷遇する家族。姉たちは最後に謝罪する。", "portraits": [{"src": "assets/cinderella-face-stepfamily.webp", "label": "左・右：二人の姉／中央：継母", "alt": "継母（ままはは）と二人の姉の創作イメージ", "width": 500, "height": 500}]}, {"name": "父", "role": "再婚した妻の言いなりで、娘が頼れない父親。", "portraits": [{"src": "assets/cinderella-face-father.webp", "label": "", "alt": "父の創作イメージ", "width": 500, "height": 500}]}], "characterGalleryNote": "家族の集合画像は、継母と二人の娘を見分けるためのイメージです。", "headerCaption": "妖精に助けられて支度を整えたシンデレラは、舞踏会へ出かけます。", "inlineIllustrations": [{"afterParagraph": 2, "src": "assets/cinderella-scene.webp", "alt": "家の庭で妖精に助けられ、舞踏会へ行く支度をするシンデレラのイメージ", "caption": "魔法で支度が整い、馬車で出かける場面のイメージ。", "width": 1200, "height": 800}, {"afterParagraph": 3, "src": "assets/cinderella-ball-scene.webp", "alt": "舞踏会で、シンデレラは王子と踊ります。姉たちは、彼女が妹だとは気づきません。", "caption": "舞踏会で、シンデレラは王子と踊ります。姉たちは、彼女が妹だとは気づきません。", "width": 1200, "height": 800}, {"afterParagraph": 5, "src": "assets/cinderella-slipper-fitting-scene.webp", "alt": "王子の使いが試すと、ガラスの靴はシンデレラの足にぴたりと合います。", "caption": "王子の使いが試すと、ガラスの靴はシンデレラの足にぴたりと合います。", "width": 1200, "height": 800}]}, {"id": "urashimataro", "name": "浦島太郎", "reading": "うらしまたろう", "bodyReadings": {"浦島太郎": "うらしまたろう", "楠山正雄": "くすやままさお", "丹後": "たんご", "漁": "りょう", "亀": "かめ", "竜宮": "りゅうぐう", "乙姫": "おとひめ", "御殿": "ごてん", "玉手箱": "たまてばこ", "寿命": "じゅみょう", "帰還": "きかん", "舟歌": "ふなうた", "浦島": "うらしま", "養う": "やしなう"}, "cat": "literature", "genreLabel": "日本の昔話", "genre": "japanese-folktale", "checkedDate": "2026年11月2日", "sub": "楠山正雄／再話｜成立年不詳", "credits": [["楠山正雄", "くすやままさお", "再話"]], "motif": "book", "intro": "漁師の浦島太郎は、いじめられていた亀を助けて海へ放す。数日後、その亀がお礼に竜宮へ案内したいと現れた。海の底の御殿では、歌や踊り、ごちそうで迎えられ、戸ごとに違う四季の景色を見せてもらう。", "gist": "助けた亀に招かれた竜宮と、帰ってきた浜辺。楽しい時間の向こうに、取り戻せない暮らしがある昔話。", "people": [["浦島太郎（うらしまたろう）", "両親を養う漁師。亀を助けたことから竜宮へ招かれる。"], ["亀（かめ）", "浦島に助けられ、お礼に竜宮への行き帰りを案内する。"], ["乙姫（おとひめ）", "竜宮でもてなし、別れの際に玉手箱を渡す。"], ["浜辺の老女（はまべのろうじょ）", "帰ってきた浦島に、三百年前の話を伝える。"]], "links": ["momotaro", "ginga", "kusuyama-masao"], "synopsisSummary": ["丹後の国で漁をし、両親を養う浦島太郎は、子どもたちにいじめられている亀を見つけます。注意してもやめないので、お金を渡して亀を引き取り、海へ放しました。", "二、三日後、釣りをしている舟のそばへ、その亀が現れます。助けてもらったお礼に竜宮へ案内したいと言われ、浦島は亀の背中に乗って海の底へ向かいました。", "竜宮では乙姫が迎え、ごちそうや歌、踊りでもてなします。宝石で飾られた御殿には、東の戸を開けると春、南は夏、西は秋、北は冬という四季の景色までありました。浦島は驚き、楽しさに日々の暮らしを忘れて過ごします。ところが三年がたつころ、故郷の浜辺を夢に見て、両親がどうしているか気になり、帰りたくなりました。", "乙姫は別れを惜しみながら玉手箱を渡します。大切な宝が入っているが、もう一度竜宮へ来たいなら決して開けてはいけない、と念を押しました。浦島は約束し、亀に送られて浜へ戻ります。海の景色は見覚えがあるのに、出会うのは知らない顔ばかりで、自分の家も見つかりません。通りかかった老女に尋ねると、浦島太郎は三百年も前に海へ出て帰らなかった人だ、と聞かされます。", "自分には三年だった時間が、陸では三百年になっていました。家も両親も失った浦島は竜宮を恋しく思いますが、亀は現れず、戻る方法も分かりません。玉手箱を開ければ何か分かるかもしれないと思い、約束を忘れてふたを取ります。紫色の雲が顔にかかって消えると、浦島は白い髪とひげの老人になっていました。箱の宝は人間の寿命だったのか、と残念がり、舟歌の聞こえる浜で昔を思い出すところで終わります。"], "sources": [{"title": "青空文庫・楠山正雄「浦島太郎」本文", "url": "https://www.aozora.gr.jp/cards/000329/files/3390_33153.html"}, {"title": "青空文庫・底本書誌、読み、作者没年", "url": "https://www.aozora.gr.jp/cards/000329/card3390.html"}], "sourceNote": "昔話を楠山正雄が再話した版に基づく。伝承の創作者を楠山とはしない。再話の初出年は今回の資料では確定しない。青空文庫の底本は『むかし むかし あるところに』童話屋、1996年6月24日初版（入力は同年7月10日第2刷）。親本は『日本童話宝玉集（上中下版）』童話春秋社、1948〜1949年。これらを昔話の成立年としない。この版は竜宮で三年、陸では三百年。玉手箱から出るのは紫色の雲。亀と乙姫が同一人物だとは記されず、結末で鶴になったり死んだりもしない。", "textNote": "動物へのいじめ、家族を失うこと、老いを扱います。", "summaryReadings": {"浦島太郎": {"key": "浦島太郎", "reading": "うらしまたろう"}, "亀": {"key": "亀", "reading": "かめ"}, "乙姫": {"key": "乙姫", "reading": "おとひめ"}, "浦島": {"key": "浦島太郎", "reading": "うらしま"}}, "image": "assets/urashima-seasons-scene.webp", "imageAlt": "乙姫に案内され、竜宮で四季の景色を見る浦島太郎", "primaryCategory": "japanese-folktale", "characterGallery": [{"name": "浦島太郎（うらしまたろう）", "role": "両親を養う漁師。亀を助けたことから竜宮へ招かれる。", "portraits": [{"src": "assets/urashima-face-urashima.webp", "label": "竜宮へ旅するころ", "alt": "浦島太郎の創作イメージ", "width": 500, "height": 500}]}, {"name": "亀（かめ）", "role": "浦島に助けられ、お礼に竜宮への行き帰りを案内する。", "portraits": [{"src": "assets/urashima-face-turtle.webp", "label": "", "alt": "亀の創作イメージ", "width": 500, "height": 500}]}, {"name": "乙姫（おとひめ）", "role": "竜宮でもてなし、別れの際に玉手箱を渡す。", "portraits": [{"src": "assets/urashima-face-otohime.webp", "label": "", "alt": "乙姫の創作イメージ", "width": 500, "height": 500}]}, {"name": "浜辺の老女（はまべのろうじょ）", "role": "帰ってきた浦島に、三百年前の話を伝える。", "portraits": [{"src": "assets/urashima-face-oldwoman.webp", "label": "帰郷後に出会う老女", "alt": "浜辺の老女の創作イメージ", "width": 500, "height": 500}]}], "characterGalleryNote": "竜宮の四季は、別々の方角にある景色を一枚にまとめて表しています。亀と乙姫は、この版では別の登場人物です。浜辺の老女は昔話を聞いた人で、三百年前を目撃した人ではありません。", "headerCaption": "乙姫に案内され、竜宮で四季の景色を見る浦島太郎。", "inlineIllustrations": [{"afterParagraph": 1, "src": "assets/urashima-turtle-release-scene.webp", "alt": "子どもたちから引き取った小さな亀を、浦島太郎は海へ帰してやります。この親切が、竜宮へ招かれるきっかけになります。", "caption": "子どもたちから引き取った小さな亀を、浦島太郎は海へ帰してやります。この親切が、竜宮へ招かれるきっかけになります。", "width": 1200, "height": 800}, {"afterParagraph": 3, "src": "assets/urashima-seasons-scene.webp", "alt": "乙姫に案内され、戸の向こうに違う季節の景色を見る浦島太郎の場面イメージ", "caption": "乙姫が戸を開けるたびに、浦島太郎の前には違う季節の景色が広がります。", "width": 1200, "height": 800}, {"afterParagraph": 5, "src": "assets/urashima-openbox-oldman-scene.webp", "alt": "玉手箱を開けた浦島太郎は、白い髪とひげの老人になります。空になった箱を見て、昔を思い出します。", "caption": "玉手箱を開けた浦島太郎は、白い髪とひげの老人になります。空になった箱を見て、昔を思い出します。", "width": 1200, "height": 800}]}, {"id": "hansel", "name": "ヘンゼルとグレーテル", "reading": "へんぜるとぐれーてる", "bodyReadings": {"継母": "ままはは", "空腹": "くうふく", "老女": "ろうじょ", "真珠": "しんじゅ", "宝石": "ほうせき", "機転": "きてん", "悔やんで": "くやんで", "採集": "さいしゅう", "編纂": "へんさん", "魔女": "まじょ", "貧しい": "まずしい"}, "cat": "literature", "genreLabel": "世界の童話 · グリム童話", "genre": "grimm-folktale", "checkedDate": "2026年11月2日", "sub": "グリム兄弟／採集・編纂｜1812年初収録", "credits": [["グリム兄弟", "ぐりむきょうだい", "採集・編纂"]], "motif": "book", "intro": "食べ物のない家で、ヘンゼルとグレーテルは、森へ捨てられる相談を聞いてしまう。兄は帰り道を残そうと工夫するが、二人はやがて深い森をさまよう。空腹の先に見つけたのは、食べられる家と、親切そうな老女だった。", "gist": "頼れる大人を失い、森を進む兄妹。小石とパンくず、お菓子の家の先で、二人の知恵が生き延びる力になる。", "people": [["ヘンゼル", "兄。小石で帰り道を残し、骨を指の代わりにして時間をかせぐ。"], ["グレーテル", "妹。魔女のたくらみを見抜いて兄を救い、渡水の方法も考える。"], ["父", "貧しい木こり。反対しながらも子どもの置き去りに加わり、後悔する。"], ["継母（ままはは）", "食料不足から、子どもたちを森に置き去りにするよう提案する。"], ["魔女（まじょ）", "食べられる家で子どもを誘い込み、食べようとする。"]], "links": ["redcap", "restaurant", "brothers-grimm"], "synopsisSummary": ["ヘンゼルと妹のグレーテルは、森の近くで木こりの父と継母と暮らしていました。食べ物が足りなくなると、継母は二人を森に置き去りにしようと提案します。父は反対しますが、ついには従ってしまいました。話を聞いていたヘンゼルは、夜に白い小石を集めます。翌朝、道に石を落とし、置き去りにされたあと、月明かりに光る石をたどって妹と家へ戻りました。", "しかし再び食料が尽きると、二人はもっと奥へ連れていかれます。今度は戸を閉められて石を拾えず、ヘンゼルはパンくずを目印にしました。ところが鳥が食べてしまい、道が分かりません。", "空腹の二人は、白い鳥についていき、パンでできた家を見つけます。屋根は菓子、窓は砂糖です。食べ始めると老女が現れ、食事と寝床を用意してくれました。", "親切そうな老女の正体は、子どもを食べる魔女でした。翌朝、ヘンゼルを閉じ込めて太らせ、グレーテルには働かせます。目の悪い魔女が太り具合を調べるたびに、ヘンゼルは指の代わりに細い骨を出して時間をかせぎます。四週間たつと魔女は待ちきれず、翌日には食べると決めました。さらにグレーテルまで熱いかまどに入れようとします。たくらみに気づいたグレーテルは、入り方が分からないふりをしました。魔女が手本を見せようと頭を入れたところを押し込み、戸を閉めます。魔女はそこで死に、グレーテルは兄を助け出しました。", "二人は家にあった真珠や宝石を持って出発します。途中で大きな水辺に出ますが、橋も舟もありません。グレーテルが白いアヒルに頼み、重すぎないよう一人ずつ運んでもらいました。やがて森を抜け、父の家へ帰り着きます。父は二人を捨てたことを悔やんでおり、継母はもう亡くなっていました。宝石で暮らしの心配もなくなり、父と子どもたちは一緒に暮らします。"], "sources": [{"title": "Project Gutenberg・第15話Hansel and Grethel（Hunt英訳）", "url": "https://www.gutenberg.org/files/5314/5314-h/5314-h.htm"}, {"title": "Project Gutenberg・作者/英訳者生没年と米国PD", "url": "https://www.gutenberg.org/ebooks/5314"}, {"title": "ニュージーランド国立図書館・Hunt1884年版書誌", "url": "https://natlib.govt.nz/records/22009143"}, {"title": "D. L. Ashliman・初版と最終版の改訂史", "url": "https://sites.pitt.edu/~dash/grimm015.html"}], "sourceNote": "『子どもと家庭の昔話』第15話。1812年の初版に収録され、改訂が重ねられました。今回はマーガレット・ハント英訳（1884年刊）を収録するGutenberg #5314を参照。1812年は昔話自体の誕生年ではなく、参照英訳の刊行年でもありません。継母の登場する後期グリム版系統。参照本文にもmother／stepmotherの両表記がありますが、冒頭の明示に従い継母と統一。白い小石とパンくずによる二度の置き去り、魔女の家、白いアヒルによる渡水、継母の死と財宝を持っての帰宅を含みます。", "textNote": "親による子どもの置き去り、人を食べようとする魔女、死を扱います。", "summaryReadings": {"継母": {"key": "継母", "reading": "ままはは"}, "魔女": {"key": "魔女", "reading": "まじょ"}}, "image": "assets/hansel.webp", "imageAlt": "森の食べられる家を見つめる兄妹の作品イメージ", "primaryCategory": "world-fairytale", "inlineIllustrations": [{"afterParagraph": 2, "src": "assets/hansel-breadcrumbs-scene.webp", "alt": "森の道で、パンくずを鳥に食べられて帰り道を失った兄妹の場面イメージ", "caption": "道に落としたパンくずは、鳥に食べられてしまう。", "width": 1200, "height": 800}, {"afterParagraph": 3, "src": "assets/hansel.webp", "alt": "森の中で菓子の家を見つけたヘンゼルとグレーテル", "caption": "森をさまよった兄妹が見つけたのは、パンでできた家。屋根は菓子、窓は砂糖でした。", "width": 1200, "height": 800}, {"afterParagraph": 4, "src": "assets/hansel-gretel-rescue-scene.webp", "alt": "魔女のたくらみを切り抜けたグレーテルは、閉じ込められていた兄を助け出します。今度は妹が兄を救いました。", "caption": "魔女のたくらみを切り抜けたグレーテルは、閉じ込められていた兄を助け出します。今度は妹が兄を救いました。", "width": 1200, "height": 800}], "characterGallery": [{"name": "ヘンゼル", "role": "兄。小石で帰り道を残し、骨を指の代わりにして時間をかせぐ。", "portraits": [{"src": "assets/hansel-face-hansel.webp", "label": "", "alt": "ヘンゼルの創作イメージ", "width": 500, "height": 500}]}, {"name": "グレーテル", "role": "妹。魔女のたくらみを見抜いて兄を救い、渡水の方法も考える。", "portraits": [{"src": "assets/hansel-face-gretel.webp", "label": "", "alt": "グレーテルの創作イメージ", "width": 500, "height": 500}]}, {"name": "父", "role": "貧しい木こり。反対しながらも子どもの置き去りに加わり、後悔する。", "portraits": [{"src": "assets/hansel-face-father.webp", "label": "", "alt": "父の創作イメージ", "width": 500, "height": 500}]}, {"name": "継母（ままはは）", "role": "食料不足から、子どもたちを森に置き去りにするよう提案する。", "portraits": [{"src": "assets/hansel-face-stepmother.webp", "label": "", "alt": "継母（ままはは）の創作イメージ", "width": 500, "height": 500}]}, {"name": "魔女（まじょ）", "role": "食べられる家で子どもを誘い込み、食べようとする。", "portraits": [{"src": "assets/hansel-face-witch.webp", "label": "", "alt": "魔女（まじょ）の創作イメージ", "width": 500, "height": 500}]}], "characterGalleryNote": "継母と魔女は別の人物として描いています。"}, {"id": "uglyduckling", "name": "みにくいアヒルの子", "reading": "みにくいあひるのこ", "bodyReadings": {"家禽": "かきん", "雌鶏": "めんどり", "拒絶": "きょぜつ", "白鳥": "はくちょう", "狩り": "かり", "喉": "のど"}, "cat": "literature", "genreLabel": "世界の童話 · アンデルセン童話", "genre": "andersen-fairytale", "checkedDate": "2026年11月2日", "sub": "ハンス・クリスチャン・アンデルセン｜1843年初刊行", "motif": "book", "intro": "アヒルの巣で、ほかのひなより大きな卵がかえる。生まれた子は、泳ぎは上手なのに、姿が違うというだけでつつかれ、追い回される。家を飛び出したひなは、自分を受け入れてくれる場所を探して、水辺を旅する。", "gist": "見た目や能力が違うために追われるひな。長い冬を越え、自分の姿と居場所を知る創作童話。", "people": [["大きなひな（おおきなひな）", "アヒルの巣で育つが、きょうだいと姿が違い、周りから追われる。"], ["母アヒル（ははあひる）", "初めはひなをかばうが、のちに冷たくなる。"], ["猫と雌鶏（ねことめんどり）", "小屋で暮らし、自分たちの能力を基準にひなを判断する。"], ["白鳥たち（はくちょうたち）", "春に出会い、新しい仲間として迎える。"]], "links": ["yodaka", "happyprince", "andersen"], "synopsisSummary": ["夏、アヒルの巣で、ほかより遅く大きな卵がかえりました。生まれたひなは体が大きく、灰色で、きょうだいとは姿が違います。", "泳ぎは上手なのに、家禽の庭では見た目を理由につつかれ、追い回されます。初めはかばっていた母親まで冷たくなり、ひなは居場所を失って逃げ出しました。", "たどり着いた沼でも仲間として十分には受け入れられず、狩りが始まると命の危険にさらされます。ようやく逃れた先は、おばあさんと猫と雌鶏の暮らす小屋でした。しかし猫と雌鶏は、自分たちと同じように喉を鳴らしたり、卵を産んだりできることを一番大切だと考えています。ひなが泳ぎたいと話しても理解されず、ひなは小屋を出て水辺へ戻ります。", "秋の夕方、白く美しい、首の長い鳥たちが飛び立つのを見かけます。それが白鳥だとは知りませんが、ひなは強く心をひかれました。やがて冬になり、水が凍らないよう泳ぎ続けても力尽き、氷に閉じ込められます。通りかかった男に助けられたものの、その家の子どもたちが遊ぼうと近づくと、また傷つけられると思って逃げ回り、外へ飛び出してしまいます。", "厳しい冬が過ぎ、春になると、翼には以前より力がついていました。庭の水辺へ飛んで来たひなは、三羽の白鳥を見つけます。恐れながら近づき、水に顔を向けたとき、映った自分の姿に気づきました。そこにいるのは、成長した白鳥です。アヒルが別の鳥に変わったのではなく、もともと白鳥の卵から生まれていたのでした。", "白鳥たちは新しく来た仲間を迎え、子どもたちもその美しさを喜びます。若い白鳥はうれしさに胸を満たされますが、いばることはありません。かつて追われていたころには思い描けなかった幸せを、いま感じているのでした。"], "sources": [{"title": "Project Gutenberg Canada：M. R. James英訳全文・版情報", "url": "https://www.gutenbergca.gutenbergcanada.ca/ebooks/andersen-ugly/andersen-ugly-00-h.html"}, {"title": "デンマーク王立図書館：初刊1843年11月11日の書誌注", "url": "https://tekster.kb.dk/text/adl-texts-hcaeventyr07val-shoot-idm139890601531344.pdf"}, {"title": "ケンブリッジ大学フィッツウィリアム博物館：M. R. Jamesの生没年", "url": "https://fitzmuseum.cam.ac.uk/about-us/directors/m-r-james"}], "sourceNote": "デンマーク語原作の初刊行は1843年11月11日。参照した英訳はM. R. James訳 Hans Andersen Forty-Two Stories（1930年初刊）所収。電子本文の底本は1953年のFaber and Faber版であり、原作初刊年や英訳初刊年とは区別する。アンデルセン自身による創作童話。James英訳の全編を参照し、日本語で独自に要約した。助けた男の家から再び逃げる場面も原文にある。白鳥は成長して本来の姿が明らかになるのであり、善行への褒美でアヒルから変身したのではない。原文にある絶望の強い表現は、筋を変えない範囲で穏やかに述べた。", "textNote": "仲間からのいじめ、狩り、寒さによる危険を含む。描写は抑えている。", "summaryReadings": {"雌鶏": {"key": "雌鶏", "reading": "めんどり"}, "白鳥": {"key": "白鳥", "reading": "はくちょう"}}, "image": "assets/duckling-spring-scene.webp", "imageAlt": "水面に映る自分を見て、成長した白鳥の姿に気づきます。", "primaryCategory": "world-fairytale", "characterGallery": [{"name": "大きなひな（おおきなひな）", "role": "アヒルの巣で育つが、きょうだいと姿が違い、周りから追われる。", "portraits": [{"src": "assets/duckling-face-young.webp", "label": "幼いころ", "alt": "大きなひなの幼いころの創作イメージ", "width": 500, "height": 500}, {"src": "assets/duckling-face-grown.webp", "label": "成長した白鳥", "alt": "白鳥へ成長した同じ主人公の創作イメージ", "width": 500, "height": 500}]}, {"name": "母アヒル（ははあひる）", "role": "初めはひなをかばうが、のちに冷たくなる。", "portraits": [{"src": "assets/duckling-face-mother.webp", "label": "", "alt": "母アヒルの創作イメージ", "width": 500, "height": 500}]}, {"name": "猫と雌鶏（ねことめんどり）", "role": "小屋で暮らし、自分たちの能力を基準にひなを判断する。", "portraits": [{"src": "assets/duckling-face-cat-hen.webp", "label": "左：猫／右：雌鶏", "alt": "猫と雌鶏の創作イメージ", "width": 500, "height": 500}]}, {"name": "白鳥たち（はくちょうたち）", "role": "春に出会い、新しい仲間として迎える。", "portraits": [{"src": "assets/duckling-face-swans.webp", "label": "春に出会う三羽", "alt": "白鳥たちの創作イメージ", "width": 500, "height": 500}]}], "characterGalleryNote": "「幼いころ」と「成長した白鳥」は、同じ主人公の姿を表しています。", "headerCaption": "水面に映る自分を見て、成長した白鳥の姿に気づきます。", "inlineIllustrations": [{"afterParagraph": 1, "src": "assets/duckling-large-egg-hatched-scene.webp", "alt": "大きな卵から、灰色のひなが生まれます。母アヒルは、その大きな体に驚きます。", "caption": "大きな卵から、灰色のひなが生まれます。母アヒルは、その大きな体に驚きます。", "width": 1200, "height": 800}, {"afterParagraph": 3, "src": "assets/duckling-cottage-misunderstood-scene.webp", "alt": "泳ぎたいと話すひなの願いは、卵を産むことや喉を鳴らすことを重んじる雌鶏と猫には理解されません。", "caption": "泳ぎたいと話すひなの願いは、卵を産むことや喉を鳴らすことを重んじる雌鶏と猫には理解されません。", "width": 1200, "height": 800}, {"afterParagraph": 5, "src": "assets/duckling-spring-scene.webp", "alt": "水面に映る自分を見て、成長した白鳥の姿に気づきます。", "caption": "水面に映る自分を見て、成長した白鳥の姿に気づきます。", "width": 1200, "height": 800}]}, {"id": "mermaid", "name": "人魚姫", "reading": "にんぎょひめ", "bodyReadings": {"人魚姫": "にんぎょひめ", "末娘": "すえむすめ", "祖母": "そぼ", "魂": "たましい", "不滅": "ふめつ", "脚": "あし", "宮殿": "きゅうでん", "隣国": "りんごく", "刃物": "はもの", "善行": "ぜんこう", "精": "せい", "王子": "おうじ", "魔女": "まじょ", "空気の精": "くうきのせい"}, "cat": "literature", "genreLabel": "世界の童話 · アンデルセン童話", "genre": "andersen-fairytale", "checkedDate": "2026年11月2日", "sub": "ハンス・クリスチャン・アンデルセン｜1837年初刊行", "motif": "book", "intro": "人間の世界にあこがれる末の人魚姫は、初めて海上へ出た夜、船の王子に出会う。嵐から彼を救うが、自分の存在は知られないままだった。王子への恋と、人間の持つ不滅の魂への願いが、彼女を海の魔女のもとへ向かわせる。", "gist": "声を手放して人間の世界へ向かう姫。かなわない恋の先にも続く、魂を求める物語。", "people": [["人魚姫（にんぎょひめ）", "海の王の末娘。人間の世界、王子、不滅の魂にあこがれる。"], ["王子（おうじ）", "海で人魚姫に救われたが、そのことを知らない。"], ["祖母（そぼ）", "人間の世界や人魚と魂について孫に語る。"], ["海の魔女（まじょ）", "声を代償に人間の脚を得る薬を渡す。"], ["姉たち（あねたち）", "妹を救おうとして髪を手放し、刃物を届ける。"], ["隣国の姫（りんごくのひめ）", "浜辺で王子を見つけ、のちに王子と結婚する。"], ["空気の精（くうきのせい）たち", "善行を重ねて魂を得る道を人魚姫に示す。"]], "links": ["happyprince", "gongitsune", "andersen"], "synopsisSummary": ["海の王の六人の娘のうち、末の人魚姫は人間の世界にあこがれていました。十五歳になって初めて海上へ出た夜、船上の王子に心を引かれます。嵐で船が沈むと、彼を助けて岸へ運びました。しかし王子は、あとから浜辺で自分を見つけた少女を命の恩人だと思い、人魚姫のことは知りません。", "人魚姫は祖母から、人魚は長く生きても最後には泡となり、人間のような不滅の魂を持たないと聞きます。人間に深く愛され、結婚すれば魂を得られると知り、王子への恋と魂への願いを強めました。", "人魚姫は海の魔女を訪ね、美しい声と引き換えに、人間の脚を得る薬を受け取ります。歩くたびに強い痛みがあり、海の家族のもとには戻れません。さらに王子が別の人と結婚すれば、その翌朝には泡になるという条件でした。", "それでも薬を飲んだ人魚姫は、陸で王子に見つけられ、宮殿で暮らすようになります。王子は彼女を大切にしますが、妻にしたいとは考えず、浜辺で出会った少女を思い続けます。声を失った人魚姫は、自分が彼を助けたことを伝えられませんでした。", "やがて王子が隣国の姫に会うと、その人こそ浜辺の少女でした。王子は喜んで結婚し、人魚姫は祝いの船上で最後の夜を迎えます。夜明け前、姉たちが現れ、髪を魔女に渡して手に入れた刃物を差し出しました。王子を殺せば人魚に戻り、生き続けられるというのです。しかし人魚姫はそれを選ばず、刃物を海へ投げ、自らも海に身を投じます。体が泡になるかと思ったとき、彼女は空気の精たちと同じ、目に見えない姿になっていました。", "空気の精たちは、三百年のあいだ人間のために善いことをすれば、不滅の魂を得られると教えます。人魚姫にも、王子の愛だけに運命を委ねず、自分の行いで魂を得る道が開かれたのです。彼女は、自分を探している王子と花嫁に見えないまま別れを告げ、空気の精たちと空へ昇っていきました。"], "sources": [{"title": "Wikisource・Paull英訳「The Little Mermaid」全文", "url": "https://en.wikisource.org/wiki/Hans_Andersen's_Fairy_Tales/The_Little_Mermaid"}, {"title": "Wikisource・英訳標題紙", "url": "https://en.wikisource.org/wiki/Hans_Andersen's_Fairy_Tales"}, {"title": "Wikisource・1888年版スキャン索引", "url": "https://en.wikisource.org/wiki/Index:Hans_Andersen's_Fairy_Tales_(1888).djvu"}, {"title": "南デンマーク大学アンデルセン研究センター・初刊情報", "url": "https://andersen.sdu.dk/vaerk/register/info_e.html?vid=16"}, {"title": "Project Gutenberg・Paull1888年没の書誌記録", "url": "https://www.gutenberg.org/ebooks/34794"}, {"title": "Troy J. Bassett・Paullの著者調査", "url": "https://www.victorianresearch.org/atcl/show_author.php?aid=996"}], "sourceNote": "1837年4月7日、『子どもに語る童話』第1集第3冊で初刊。今回はMrs. H. B. Paull英訳『Hans Andersen’s Fairy Tales』（Frederick Warne and Co.、Wikisourceのスキャン索引では1888年版）の当該話を参照。1837年は原作の初刊年で、英訳底本の年ではありません。参照版では、最後に空気の精が、善い子を見れば試練の期間が短くなり、悪い子を見て流す涙によって長くなると語ります。これは物語末尾のしつけ的・宗教的な枠組みであり、現実の子どもが人魚姫の苦しみに責任を負うという意味には扱いません。", "textNote": "恋のすれ違い、身体の痛み、殺害の提案、海に身を投じる場面を扱います。", "summaryReadings": {"人魚姫": {"key": "人魚姫", "reading": "にんぎょひめ"}, "祖母": {"key": "祖母", "reading": "そぼ"}, "王子": {"key": "王子", "reading": "おうじ"}, "魔女": {"key": "魔女", "reading": "まじょ"}, "空気の精": {"key": "空気の精", "reading": "くうきのせい"}}, "image": "assets/mermaid-rescue-scene.webp", "imageAlt": "人魚姫は、嵐で海に落ちた王子を岸へ運びます。王子はまだ目を閉じていて、誰が助けてくれたのか知りません。", "primaryCategory": "world-fairytale", "inlineIllustrations": [{"afterParagraph": 1, "src": "assets/mermaid-rescue-scene.webp", "alt": "人魚姫は、嵐で海に落ちた王子を岸へ運びます。王子はまだ目を閉じていて、誰が助けてくれたのか知りません。", "caption": "人魚姫は、嵐で海に落ちた王子を岸へ運びます。王子はまだ目を閉じていて、誰が助けてくれたのか知りません。", "width": 1200, "height": 800}, {"afterParagraph": 2, "src": "assets/mermaid-grandmother-scene.webp", "alt": "人魚姫は祖母に、人間の命と、不滅の魂について尋ねます。", "caption": "人魚姫は祖母に、人間の命と、不滅の魂について尋ねます。", "width": 1200, "height": 800}, {"afterParagraph": 3, "src": "assets/mermaid-witch-price-scene.webp", "alt": "人間の脚を得る薬の代償は、美しい声でした。人魚姫は声を失って薬を受け取り、王子を助けたことを話せなくなります。", "caption": "人間の脚を得る薬の代償は、美しい声でした。人魚姫は声を失って薬を受け取り、王子を助けたことを話せなくなります。", "width": 1200, "height": 800}, {"afterParagraph": 6, "src": "assets/mermaid-airspirits-scene.webp", "alt": "空気の精たちは、人のために善いことを続ければ、不滅の魂を得られると人魚姫に教えます。", "caption": "空気の精たちは、人のために善いことを続ければ、不滅の魂を得られると人魚姫に教えます。", "width": 1200, "height": 800}], "characterGallery": [{"name": "人魚姫（にんぎょひめ）", "role": "海の王の末娘。人間の世界、王子、不滅の魂にあこがれる。", "portraits": [{"src": "assets/mermaid-face-mermaid.webp", "label": "", "alt": "人魚姫の創作イメージ", "width": 500, "height": 500}]}, {"name": "王子（おうじ）", "role": "海で人魚姫に救われたが、そのことを知らない。", "portraits": [{"src": "assets/mermaid-face-prince.webp", "label": "", "alt": "王子の創作イメージ", "width": 500, "height": 500}]}, {"name": "祖母（そぼ）", "role": "人間の世界や人魚と魂について孫に語る。", "portraits": [{"src": "assets/mermaid-face-grandmother.webp", "label": "", "alt": "祖母の創作イメージ", "width": 500, "height": 500}]}, {"name": "海の魔女（まじょ）", "role": "声を代償に人間の脚を得る薬を渡す。", "portraits": [{"src": "assets/mermaid-face-witch.webp", "label": "", "alt": "海の魔女の創作イメージ", "width": 500, "height": 500}]}, {"name": "姉たち（あねたち）", "role": "妹を救おうとして髪を手放し、刃物を届ける。", "portraits": [{"src": "assets/mermaid-face-sisters.webp", "label": "五人の姉（髪を手放す前）", "alt": "姉たちの創作イメージ", "width": 500, "height": 500}]}, {"name": "隣国の姫（りんごくのひめ）", "role": "浜辺で王子を見つけ、のちに王子と結婚する。", "portraits": [{"src": "assets/mermaid-face-princess.webp", "label": "", "alt": "隣国の姫の創作イメージ", "width": 500, "height": 500}]}, {"name": "空気の精（くうきのせい）たち", "role": "善行を重ねて魂を得る道を人魚姫に示す。", "portraits": [{"src": "assets/mermaid-face-airspirits.webp", "label": "空気の精たちの代表イメージ", "alt": "空気の精たちの創作イメージ", "width": 500, "height": 500}]}], "characterGalleryNote": "姉たちは五人で、髪を手放す前の姿です。空気の精たちの集合画像は、代表的なイメージです。", "headerCaption": "人魚姫は、嵐で海に落ちた王子を岸へ運びます。王子はまだ目を閉じていて、誰が助けてくれたのか知りません。"}, {"id": "wizardofoz", "name": "オズの魔法使い", "reading": "おずのまほうつかい", "bodyReadings": {"竜巻": "たつまき", "魔女": "まじょ", "脳みそ": "のうみそ", "心臓": "しんぞう", "腹話術": "ふくわじゅつ", "気球": "ききゅう", "臆病": "おくびょう", "木こり": "きこり", "銀": "ぎん"}, "cat": "literature", "primaryCategory": "world-fantasy", "genreLabel": "海外ファンタジー", "genre": "world-fantasy", "checkedDate": "2026年11月2日", "sub": "ライマン・フランク・ボーム｜1900年初刊行", "motif": "book", "intro": "竜巻で家ごと運ばれたドロシーは、犬のトトと不思議なオズの国へ着く。カンザスの家へ帰る方法を求めて、黄色いレンガの道を進むことになった。途中で出会うのは、自分に足りないものを探す三人の仲間だった。", "gist": "家へ帰りたい少女と、脳みそ・心臓・勇気を求める仲間たち。足りないと思っていたものを、旅の中で見つける冒険。", "people": [["ドロシー", "カンザスの少女。家へ帰るために旅をする。"], ["トト", "ドロシーと一緒に旅をする小さな黒い犬。"], ["かかし", "脳みそを欲しがるが、旅の途中で知恵を働かせる。"], ["ブリキの木こり（ぶりきのきこり）", "心臓を欲しがる、仲間思いの木こり。"], ["ライオン", "自分を臆病だと思い、勇気を求める。"], ["オズ", "エメラルドの都に暮らし、願いをかなえる力があると信じられている。"], ["西の悪い魔女（にしのわるいまじょ）", "住民を支配し、銀の靴を奪おうとする。"], ["グリンダ", "南の善い魔女。銀の靴の使い方を教える。"]], "links": ["aliceinwonderland", "momotaro", "l-frank-baum"], "synopsisSummary": ["カンザスでおじとおばに育てられているドロシーは、犬のトトと家ごと竜巻に運ばれ、不思議なオズの国へ着きます。落ちた家の下敷きになったのは、住民を苦しめていた東の悪い魔女でした。ドロシーは魔女の銀の靴を受け取り、北の善い魔女から、エメラルドの都のオズなら帰る方法を知っているかもしれないと教えられます。", "黄色いレンガの道を行く途中、脳みそが欲しいかかし、心臓が欲しいブリキの木こり、勇気が欲しいライオンが仲間になります。みな、自分には大事なものが欠けていると思っています。それでも、かかしは深い溝を渡るために木を倒して橋にする案を出し、木こりは道を切り開き、ライオンは怖がりながら仲間を守ります。助け合って、ようやく都に着きました。", "ところがオズは、願いをかなえる条件として、西の悪い魔女を倒すよう求めます。一行は西へ向かいますが、魔女が呼び出した翼のあるサルに襲われ、かかしと木こりは壊され、ドロシーとライオンは捕まります。魔女はドロシーを働かせ、銀の靴まで奪おうとしました。片方を取られて怒ったドロシーが水をかけると、思いがけず魔女は溶けてしまいます。解放された住民の力を借りて仲間を直し、一行は都へ戻ります。", "約束を果たそうとしないオズを問い詰めるうちに、トトがついたてを倒し、隠れていた老人が姿を現します。彼は魔法使いではなく、気球で迷い込み、仕掛けや腹話術で偉大な人物に見せかけていた普通の人でした。それでも、かかしには脳みそに見立てた詰め物、木こりには絹の心臓、ライオンには勇気と称した飲み物を渡し、三人は自信を得ます。", "オズはドロシーと気球で国を出ようとしますが、トトを捜していた彼女が乗る前に、気球は飛び立ってしまいました。残された一行は南の善い魔女グリンダを訪ねます。そこで初めて、銀の靴には望む場所へ運ぶ力があると分かります。かかしは都を、木こりは西の国を治め、ライオンは旅の途中で迎えられた森の王になることに決まりました。ドロシーは友達に別れを告げ、トトを抱いて靴の力でカンザスへ帰ります。靴は途中で失われますが、おばとの再会を心から喜ぶのでした。"], "sources": [{"title": "Project Gutenberg #55：原作英語本文", "url": "https://www.gutenberg.org/files/55/55-h/55-h.htm"}, {"title": "Project Gutenberg：作者生没年・米国PD表示", "url": "https://www.gutenberg.org/ebooks/55"}, {"title": "米国議会図書館：1900年刊行の書誌・初版本", "url": "https://www.loc.gov/item/03032405/"}, {"title": "米国議会図書館：ボームの生没年と作品展示", "url": "https://loc.gov/exhibits/oz/ozsect1.html"}], "sourceNote": "原著は1900年に刊行。参照本文はProject Gutenberg #55の英語版。電子版の公開年1993年や更新年2024年は原著初刊年ではない。シリーズ第1作を扱い、続編や1939年映画、後年の派生作品の設定は混ぜていない。原作の靴は銀色で、赤いルビーの靴ではない。北の善い魔女と、最後に会う南のグリンダは別人。西の魔女に水をかけるきっかけは銀の靴を取られたことであり、仲間の火を消すためではない。最後は実際に家へ帰る物語として描かれ、夢から目覚める結末ではない。", "textNote": "魔女の死、仲間への攻撃、強制的に働かされる場面を含む。描写は抑えている。", "summaryReadings": {"魔女": {"key": "魔女", "reading": "まじょ"}, "木こり": {"key": "木こり", "reading": "きこり"}}, "image": "assets/wizardofoz.webp", "imageAlt": "黄色い道を進むドロシーと犬、かかし、木こり、ライオンの作品イメージ", "inlineIllustrations": [{"afterParagraph": 1, "src": "assets/oz-doorway-scene.webp", "alt": "家の扉を開き、トトと一緒に緑豊かなオズの国を初めて見るドロシー", "caption": "家の扉を開けたドロシーとトト。外には、カンザスとは違う、緑や花に満ちた国が広がっていました。", "width": 1200, "height": 800}, {"afterParagraph": 2, "src": "assets/wizardofoz.webp", "alt": "ドロシーとトト、かかし、ブリキの木こり、ライオンが黄色いレンガの道を進む", "caption": "仲間になったかかし、ブリキの木こり、ライオンと、都へ向かうドロシーとトト。", "width": 1200, "height": 800}, {"afterParagraph": 4, "src": "assets/oz-screen-scene.webp", "alt": "トトがついたてを倒すと、隠れていたオズが現れます。恐ろしい魔法使いに見えていた正体は、普通の老人でした。", "caption": "トトがついたてを倒すと、隠れていたオズが現れます。恐ろしい魔法使いに見えていた正体は、普通の老人でした。", "width": 1200, "height": 800}, {"afterParagraph": 5, "src": "assets/oz-glinda-scene.webp", "alt": "南の善い魔女グリンダは、銀の靴に家へ帰る力があるとドロシーに教えます。", "caption": "南の善い魔女グリンダは、銀の靴に家へ帰る力があるとドロシーに教えます。", "width": 1200, "height": 800}], "characterGallery": [{"name": "ドロシー", "role": "カンザスの少女。家へ帰るために旅をする。", "portraits": [{"src": "assets/oz-face-dorothy.webp", "label": "", "alt": "ドロシーの創作イメージ", "width": 500, "height": 500}]}, {"name": "トト", "role": "ドロシーと一緒に旅をする小さな黒い犬。", "portraits": [{"src": "assets/oz-face-toto.webp", "label": "", "alt": "トトの創作イメージ", "width": 500, "height": 500}]}, {"name": "かかし", "role": "脳みそを欲しがるが、旅の途中で知恵を働かせる。", "portraits": [{"src": "assets/oz-face-scarecrow.webp", "label": "", "alt": "かかしの創作イメージ", "width": 500, "height": 500}]}, {"name": "ブリキの木こり（ぶりきのきこり）", "role": "心臓を欲しがる、仲間思いの木こり。", "portraits": [{"src": "assets/oz-face-tinwoodman.webp", "label": "", "alt": "ブリキの木こりの創作イメージ", "width": 500, "height": 500}]}, {"name": "ライオン", "role": "自分を臆病だと思い、勇気を求める。", "portraits": [{"src": "assets/oz-face-lion.webp", "label": "", "alt": "ライオンの創作イメージ", "width": 500, "height": 500}]}, {"name": "オズ", "role": "エメラルドの都に暮らし、願いをかなえる力があると信じられている。", "portraits": [{"src": "assets/oz-face-oz.webp", "label": "正体の姿", "alt": "オズの創作イメージ", "width": 500, "height": 500}]}, {"name": "西の悪い魔女（にしのわるいまじょ）", "role": "住民を支配し、銀の靴を奪おうとする。", "portraits": [{"src": "assets/oz-face-westwitch.webp", "label": "", "alt": "西の悪い魔女の創作イメージ", "width": 500, "height": 500}]}, {"name": "グリンダ", "role": "南の善い魔女。銀の靴の使い方を教える。", "portraits": [{"src": "assets/oz-face-glinda.webp", "label": "", "alt": "グリンダの創作イメージ", "width": 500, "height": 500}]}], "characterGalleryNote": "オズは、物語の中で明らかになる正体の姿を示しています。グリンダは南の善い魔女で、冒頭に登場する北の魔女とは別の人物です。", "headerCaption": "ドロシーとトト、かかし、ブリキの木こり、ライオン。黄色いレンガの道を進み、エメラルドの都を目指します。"}, {"id": "treasure-island", "name": "宝島", "reading": "たからじま", "bodyReadings": {"宝島": "たからじま", "船乗り": "ふなのり", "地主": "じぬし", "航海": "こうかい", "海賊": "かいぞく", "樽": "たる", "柵": "さく", "入江": "いりえ", "助命": "じょめい", "洞窟": "どうくつ", "寄港地": "きこうち", "消息": "しょうそく", "無謀": "むぼう", "迫る": "せまる"}, "cat": "literature", "primaryCategory": "world-literature", "genreLabel": "海外文学", "genre": "world-literature", "checkedDate": "2026年11月2日", "sub": "ロバート・ルイス・スティーヴンソン｜1883年初刊行", "motif": "book", "intro": "海辺の宿の少年ジムは、亡くなった船乗りの荷物から、宝のありかを示す地図を見つける。大人たちと船に乗り込み、未知の島へ向かうが、親切な料理番や船員たちには、別の計画があった。", "gist": "宝の地図を手に船出した少年が、海賊たちの計画を知る。勇気と危うさ、人を信じる難しさが重なる冒険。", "people": [["ジム・ホーキンズ", "宝の地図を手に入れ、航海に加わる少年。"], ["ジョン・シルバー", "料理番として乗り込み、海賊たちを率いる。"], ["リヴジー", "医師。宝探しに加わり、反乱に対処する。"], ["トレローニー", "地主。船と乗組員を用意する。"], ["スモレット", "ヒスパニオラ号の船長。"], ["ベン・ガン", "島に置き去りにされ、宝の秘密を知る元船乗り。"], ["ビリー・ボーンズ", "ジムの家の宿に滞在していた老船乗り。"]], "links": ["donquixote", "urashimataro", "robert-louis-stevenson"], "synopsisSummary": ["海辺の宿で暮らす少年ジム・ホーキンズは、宿泊していた老船乗りビリー・ボーンズの死後、その荷物から地図を手に入れます。仲間の海賊たちが奪おうとしていたのは、フリント船長の宝のありかを示す地図でした。ジムが医師リヴジーと地主トレローニーに届けると、宝探しの航海が計画されます。ジムもヒスパニオラ号に乗り、未知の島へ向かいました。料理番のジョン・シルバーは親切で頼もしく見えますが、実はフリントの元部下でした。", "航海中、ジムはリンゴの樽の中で、シルバーたちが宝を手に入れたあとに船を奪う相談を聞き、大人たちに知らせます。船員の多くが海賊の仲間だったのです。島で反乱が表面化し、船長たちは柵に囲まれた小屋を拠点に戦います。一方、陸へ出たジムは、三年前から島に置き去りにされていたベン・ガンに出会います。彼もかつてフリントの船に乗っており、島について大切な秘密を持っていました。", "仲間のもとへ戻ったジムは、やがて許可を得ずに再び小屋を抜け出します。ベンの小舟を使ってヒスパニオラ号の綱を切り、海賊が船を使えないようにしたのです。さらに漂う船へ乗り移り、負傷した海賊ハンズの助言で北の入江へ運びます。しかしハンズはジムに襲いかかり、争いの末に命を落としました。船を取り戻したジムが小屋へ帰ると、そこには敵がいました。リヴジーたちは、シルバーとの取引で別の場所へ移っていたのです。", "捕まったジムを、シルバーは仲間の海賊から守ります。ただし、それは善人に変わったからではなく、ジムを助けたことを自分の助命につなげるためでもありました。やがて海賊たちは、リヴジーから渡された地図を頼りに、ジムを連れて宝を掘りに行きます。ところが目印の場所は、すでに掘り返されて空でした。怒った海賊たちがシルバーに迫ると、隠れていたリヴジーらが助けに入り、ジムたちは救われます。", "実はベンが以前に宝を発見し、洞窟へ運び終えていました。その秘密を知ったリヴジーは、もう役に立たない地図を渡していたのです。", "一行は宝を船へ積み、生き残った三人の反乱者には食料や道具を残して島を去ります。帰路の寄港地では、シルバーが金貨の袋を持って逃げ、その後の消息は分かりません。ジムたちは故郷へ帰り、宝を分けました。しかしジムは二度とあの島に戻りたくないと思い、のちにも波の音やシルバーのオウムの声を夢に聞くのでした。"], "sources": [{"title": "Project Gutenberg・英語原文", "url": "https://www.gutenberg.org/files/120/120-h/120-h.htm"}, {"title": "Project Gutenberg・著者没年と米国PDの書誌", "url": "https://www.gutenberg.org/ebooks/120"}, {"title": "スティーヴンソン博物館・刊行年表", "url": "https://stevensonmuseum.org/robert-louis-stevenson/the-works/publications-timeline/"}], "sourceNote": "1881〜1882年に雑誌Young Folksで連載され、1883年に単行本として初刊。今回はProject Gutenberg #120の英語本文を参照しました。1883年は作品の単行本初刊年で、この電子版の公開年や挿絵版の刊行年を指すものではありません。", "textNote": "反乱、殺人、戦闘による死、島への置き去りを扱います。", "summaryReadings": {}, "image": "assets/treasure-island.webp", "imageAlt": "船上で島の地図を見る少年ジムの作品イメージ", "inlineIllustrations": [{"afterParagraph": 2, "src": "assets/treasure-applebarrel-scene.webp", "alt": "前面を省いた樽の中のジムと、その外で話すシルバーたち。人物の位置を示す断面イメージ。", "caption": "リンゴの樽に隠れたジムは、シルバーたちが船を奪う相談を聞いてしまいます。 樽の中を見せるための断面表現です。", "width": 1200, "height": 800}, {"afterParagraph": 4, "src": "assets/treasure-emptyhole-scene.webp", "alt": "地図が示す場所に着いても、宝はありません。目の前に残っていたのは、以前に掘り返された穴でした。", "caption": "地図が示す場所に着いても、宝はありません。目の前に残っていたのは、以前に掘り返された穴でした。", "width": 1200, "height": 800}, {"afterParagraph": 5, "src": "assets/treasure-cave-gold-scene.webp", "alt": "地図の場所が空だったのは、ベンが宝をこの洞窟へ移していたためです。ジムたちは、ここから宝を運び出します。", "caption": "地図の場所が空だったのは、ベンが宝をこの洞窟へ移していたためです。ジムたちは、ここから宝を運び出します。", "width": 1200, "height": 800}], "characterGallery": [{"name": "ジム・ホーキンズ", "role": "宝の地図を手に入れ、航海に加わる少年。", "portraits": [{"src": "assets/treasure-face-jim.webp", "label": "", "alt": "ジム・ホーキンズの創作イメージ", "width": 500, "height": 500}]}, {"name": "ジョン・シルバー", "role": "料理番として乗り込み、海賊たちを率いる。", "portraits": [{"src": "assets/treasure-face-silver.webp", "label": "", "alt": "ジョン・シルバーの創作イメージ", "width": 500, "height": 500}]}, {"name": "リヴジー", "role": "医師。宝探しに加わり、反乱に対処する。", "portraits": [{"src": "assets/treasure-face-livesey.webp", "label": "", "alt": "リヴジーの創作イメージ", "width": 500, "height": 500}]}, {"name": "トレローニー", "role": "地主。船と乗組員を用意する。", "portraits": [{"src": "assets/treasure-face-trelawney.webp", "label": "", "alt": "トレローニーの創作イメージ", "width": 500, "height": 500}]}, {"name": "スモレット", "role": "ヒスパニオラ号の船長。", "portraits": [{"src": "assets/treasure-face-smollett.webp", "label": "", "alt": "スモレットの創作イメージ", "width": 500, "height": 500}]}, {"name": "ベン・ガン", "role": "島に置き去りにされ、宝の秘密を知る元船乗り。", "portraits": [{"src": "assets/treasure-face-bengunn.webp", "label": "島で出会ったころ", "alt": "ベン・ガンの創作イメージ", "width": 500, "height": 500}]}, {"name": "ビリー・ボーンズ", "role": "ジムの家の宿に滞在していた老船乗り。", "portraits": [{"src": "assets/treasure-face-billy.webp", "label": "宿に滞在していたころ", "alt": "ビリー・ボーンズの創作イメージ", "width": 500, "height": 500}]}], "characterGalleryNote": "ジムは航海当時、ベンは島で出会ったころ、ビリーは宿に滞在していたころの姿です。樽の絵は、中のジムを見せるため前面を省いた断面表現です。"}, {"id": "kaguyahime", "name": "かぐや姫", "reading": "かぐやひめ", "bodyReadings": {"黄金": "おうごん", "蓬莱": "ほうらい", "火鼠": "ひねずみ", "皮衣": "かわごろも", "子安貝": "こやすがい", "帝": "みかど", "宮中": "きゅうちゅう", "十五夜": "じゅうごや", "天人": "てんにん", "羽衣": "はごろも", "駿河": "するが", "不死": "ふし", "富士山": "ふじさん"}, "cat": "literature", "primaryCategory": "japanese-folktale", "genreLabel": "日本の昔話", "genre": "japanese-folktale", "checkedDate": "2026年11月2日", "sub": "原作者不詳／和田万吉・再話｜古典物語に由来", "credits": [["原作者不詳", null, "原作"], ["和田万吉", "わだまんきち", "再話"]], "motif": "book", "intro": "竹取りのおじいさんが、光る竹の中に小さな女の子を見つける。おばあさんと育てると、娘は美しいかぐや姫に成長し、多くの男たちが結婚を望むようになった。姫は五人の求婚者に、世にも珍しい宝を求める。", "gist": "竹から現れた娘と、姫を手に入れたい人々。難しい求婚の品々から、月との別れへ続く物語。", "people": [["かぐや姫（かぐやひめ）", "竹から見つかり、地上で育てられる月の都の者。"], ["竹取りの翁（たけとりのおきな）", "姫を見つけて育てるおじいさん。"], ["おばあさん", "翁とともに姫を育て、別れを悲しむ。"], ["五人の求婚者（ごにんのきゅうこんしゃ）", "姫との結婚を望み、難しい品物を求められる。"], ["帝（みかど）", "姫を宮中へ迎えようとし、のちに文通する。"], ["天人たち（てんにんたち）", "姫を月へ連れ帰るために現れる。"]], "links": ["urashimataro", "mermaid", "wada-mankichi"], "synopsisSummary": ["竹を切って暮らすおじいさんが、光る竹の中から小さな女の子を見つけます。家に連れ帰り、おばあさんと大切に育てると、三か月ほどで美しい娘になりました。娘は「なよ竹のかぐや姫」と名づけられます。その間、おじいさんは竹の中に黄金を見つけるようになり、家も豊かになりました。", "姫の評判を聞き、五人の身分の高い男たちが結婚を望みます。姫はそれぞれに、仏の石の鉢、蓬莱の玉の枝、火鼠の皮衣、龍の首の玉、燕の子安貝を持ってくるよう求めました。鉢を頼まれた男は寺の品でごまかそうとして見破られます。玉の枝を職人に作らせた男も、支払いを求める職人が現れてうそが分かります。買ってきた皮衣は火に耐えず、龍の玉を探す男は嵐に遭って断念。燕の巣を探った男は落下して重いけがをし、ついには亡くなります。誰も求められた品を届けられませんでした。", "やがて帝も姫を宮中へ迎えようとしますが、姫は拒みます。帝が自ら訪ね、連れて行こうとすると、姫の姿は消えてしまいました。無理に連れ出すのをやめると姿が戻り、帝は帰ります。その後、二人は手紙や歌を交わすようになりました。しかし三年ほどたつと、姫は月を見ては悲しむようになります。問いかけるおじいさんに、自分は月の都の者で、八月十五夜には迎えが来て帰らなければならないと打ち明けました。育ててくれた二人と離れることが、姫にはつらかったのです。", "おじいさんの願いを受け、帝は大勢の兵を送って家を守らせます。おばあさんも姫を抱いて蔵に隠れました。ところが迎えの天人たちが光とともに現れると、兵は戦う力を失い、閉めた戸も自然に開いてしまいます。姫はおじいさんに形見の手紙を残し、帝にも手紙と不死の薬を託しました。そして天の羽衣を着て、迎えの車で空へ昇っていきます。地上の二人は、泣きながら見送るほかありませんでした。", "手紙と薬を受け取った帝は、天に最も近いという駿河の山へ使いを送り、薬を焚かせました。そのため山は「不死の山」と呼ばれ、煙が空へ昇り続けるという結末です。これは富士山の名や煙に結びつけた、物語の中の言い伝えです。"], "sources": [{"title": "青空文庫：和田万吉『竹取物語』全文", "url": "https://www.aozora.gr.jp/cards/001072/files/48310_42692.html"}, {"title": "青空文庫：底本・親本・再話者生没年", "url": "https://www.aozora.gr.jp/cards/001072/card48310.html"}, {"title": "京都大学：古典『竹取物語』の成立と作者未詳", "url": "https://rmda.kulib.kyoto-u.ac.jp/item/rb00010893/explanation/taketori"}], "sourceNote": "参照本文は和田万吉の再話『竹取物語』。青空文庫の底本は1981年の復刻版『竹取物語・今昔物語・謠曲物語』、その親本は1928年3月5日刊の日本兒童文庫・アルス版。1928年はこの再話の親本の刊行年であり、古典や「かぐや姫」の誕生年ではない。原典『竹取物語』は作者不詳で、平安時代初期に成立したと考えられる。サイトでは親しみやすい題名「かぐや姫」を使い、日本の昔話の区分に置くが、文学上は古典物語に由来する。和田万吉の再話全編に沿う。求婚者五人の失敗、帝との文通、月への帰還、不死の薬を山で焚く結末を含む。この再話は、天の羽衣を着た瞬間に地上の記憶を失うとは述べていないため、その描写は補わない。末尾は薬を焚くと記し、手紙も一緒に燃やしたとは記していない。月へ来た理由の詳細な前世や恋人など、現代映画の設定は加えていない。富士山の名称の説明は説話内の由来であり、歴史的・語源学的事実と断定しない。", "textNote": "求婚をめぐる圧力、事故による死、家族との別れを含む。描写は抑えている。", "summaryReadings": {"帝": {"key": "帝", "reading": "みかど"}, "天人": {"key": "天人", "reading": "てんにん"}}, "image": "assets/kaguya-moon-veranda-scene.webp", "imageAlt": "縁先で月を眺めるかぐや姫は、育ててくれた二人との別れを悲しみます。", "characterGallery": [{"name": "かぐや姫（かぐやひめ）", "role": "竹から見つかり、地上で育てられる月の都の者。", "portraits": [{"src": "assets/kaguya-face-kaguya.webp", "label": "", "alt": "かぐや姫（かぐやひめ）の創作イメージ", "width": 500, "height": 500}]}, {"name": "竹取りの翁（たけとりのおきな）", "role": "姫を見つけて育てるおじいさん。", "po
