らの暮らしに希望を持ちます。"],"summaryHeading":"要約","links":["lesmiserables","uglyduckling","l-m-montgomery"],"characterGallery":[{"name":"アン・シャーリー","role":"十一歳でグリーン・ゲイブルズへ来る少女。想像力が豊かで、よく話す。物語の中で十六歳頃まで成長する。","portraits":[{"src":"assets/anne-face-young.webp","label":"来たころ・十一歳","alt":"アン・シャーリー：来たころ・十一歳の人物イメージ","width":500,"height":500},{"src":"assets/anne-face-grown.webp","label":"物語の終わり頃・十六歳","alt":"アン・シャーリー：物語の終わり頃・十六歳の人物イメージ","width":500,"height":500}],"wide":true},{"name":"マシュウ・カスバート","role":"マリラの兄。農場で働く、口数の少ない人。駅へアンを迎えに行き、温かく見守る。","portraits":[{"src":"assets/anne-face-matthew.webp","label":"アンを迎えたころ","alt":"マシュウ・カスバート：アンを迎えたころの人物イメージ","width":500,"height":500}]},{"name":"マリラ・カスバート","role":"マシュウの妹。兄と暮らし、アンを育てる。厳しく教えるが、自分の間違いも認める。","portraits":[{"src":"assets/anne-face-marilla.webp","label":"アンを育てる人","alt":"マリラ・カスバート：アンを育てる人の人物イメージ","width":500,"height":500}]},{"name":"ダイアナ・バリー","role":"アンの近所に住む同じ年頃の少女。アンと親友になる。","portraits":[{"src":"assets/anne-face-diana.webp","label":"アンの親友・子どものころ","alt":"ダイアナ・バリー：アンの親友・子どものころの人物イメージ","width":500,"height":500}]},{"name":"ギルバート・ブライス","role":"アンより少し年上の同級生。初めはアンを怒らせるが、勉強で競い合う相手になる。","portraits":[{"src":"assets/anne-face-gilbert.webp","label":"学校で出会ったころ","alt":"ギルバート・ブライス：学校で出会ったころの人物イメージ","width":500,"height":500}]},{"name":"レイチェル・リンド夫人","role":"カスバート兄妹の近所に住む女性。思ったことをはっきり言い、やがてアンを助ける。","portraits":[{"src":"assets/anne-face-rachel.webp","label":"近所のリンド夫人","alt":"レイチェル・リンド夫人：近所のリンド夫人の人物イメージ","width":500,"height":500}]},{"name":"ステイシー先生","role":"学校に新しく来る女性の先生。アンの学ぶ力を伸ばし、進学を励ます。","portraits":[{"src":"assets/anne-face-stacy.webp","label":"アンを教える先生","alt":"ステイシー先生：アンを教える先生の人物イメージ","width":500,"height":500}]}],"inlineIllustrations":[{"afterParagraph":1,"src":"assets/anne-station-meeting-scene.webp","alt":"男の子を迎えるはずだったマシュウ。駅で待つアンと出会い、ひとまず家へ連れ帰ります。","caption":"男の子を迎えるはずだったマシュウ。駅で待つアンと出会い、ひとまず家へ連れ帰ります。","width":1200,"height":800},{"afterParagraph":4,"src":"assets/anne-puffed-sleeves-gift-scene.webp","alt":"マシュウから、待ち望んだ袖のふくらんだ服をもらうアン。日々の暮らしの中で、家族との結びつきが育ちます。","caption":"マシュウから、待ち望んだ袖のふくらんだ服をもらうアン。日々の暮らしの中で、家族との結びつきが育ちます。","width":1200,"height":800},{"afterParagraph":7,"src":"assets/anne-gilbert-friendship-scene.webp","alt":"学校の仕事を譲ってくれたギルバートに、アンが手を差し出します。二人はようやく友人になります。","caption":"学校の仕事を譲ってくれたギルバートに、アンが手を差し出します。二人はようやく友人になります。","width":1200,"height":800}],"characterGalleryNote":"アンの二つの姿は、同じ人物の子どものころと成長後を描き分けています。","image":"assets/anne-station-meeting-scene.webp","imageAlt":"駅で十一歳のアンを迎えるマシュウ","headerCaption":"男の子を迎えるはずだったマシュウ。駅で待つアンと出会い、ひとまず家へ連れ帰ります。"}, {"id": "hamlet", "name": "ハムレット", "reading": "はむれっと", "intro": "父を亡くしたデンマークの王子の前に、父の姿をした亡霊が現れます。叔父に殺されたという訴えは本当なのか。王子は周囲の言葉や振る舞いを疑い、真相を確かめようとします。", "gist": "父の死を確かめようとする王子が、復讐と疑いの中で周囲を傷つけ、自らも悲劇に巻き込まれる。", "bodyReadings": {"先王": "せんおう", "亡霊": "ぼうれい", "叔父": "おじ", "王妃": "おうひ", "再婚": "さいこん", "復讐": "ふくしゅう", "真相": "しんそう", "正気": "しょうき", "旧友": "きゅうゆう", "動揺": "どうよう", "上演": "じょうえん", "確信": "かくしん", "王位": "おうい", "処刑": "しょけい", "海賊": "かいぞく", "溺死": "できし", "葬儀": "そうぎ", "剣術": "けんじゅつ", "杯": "さかずき", "刃": "やいば", "統治者": "とうちしゃ", "仇": "かたき", "戯曲": "ぎきょく"}, "sources": [{"title": "Wikisource・第一フォリオ本文（1910年複製版の転記）", "url": "https://en.wikisource.org/wiki/Shakespeare_-_First_Folio_facsimile_(1910)/The_Tragedy_of_Hamlet"}, {"title": "Folger Shakespeare Library・1603年／1604–05年／1623年の版の違い", "url": "https://www.folger.edu/explore/shakespeares-works/hamlet/an-introduction-to-this-text/"}, {"title": "University of Victoria・第一フォリオ旧綴り転記（第4幕第2場の補助確認）", "url": "https://internetshakespeare.uvic.ca/doc/Ham_F1/"}], "sourceNote": "最初の刊本は1603年ですが、ここでは1623年の第一フォリオに収められた本文を扱います。参照したのは1910年Methuen社複製版のWikisource転記で、一部の幕・場の区分は後から補われています。取得できなかった第4幕第2場だけは、大学公開の同じ第一フォリオ本文の転記を補助に確認しました。現代日本語訳や映像版は用いず、この図鑑独自の日本語で解説しています。", "termNote": "戯曲は、舞台で演じるために台詞や動作を書いた作品です。先王は前の王、亡霊は亡くなった人の姿で現れる霊。ここでは作品中の出来事として説明しています。オフィーリアの死は王妃の報告などで伝えられ、本人の意図は断定していません。", "checkedDate": "2026年11月2日", "cat": "literature", "primaryCategory": "world-literature", "genreLabel": "海外文学", "genre": "world-classic", "motif": "book", "sub": "ウィリアム・シェイクスピア｜1603年初刊行／採用本文1623年版", "people": [["ハムレット", "デンマークの王子。亡くなった父の死の真相を調べ、叔父への復讐を考える。"], ["先王の亡霊", "ハムレットの父の姿をした霊。弟に殺されたと語り、息子に復讐を求める。"], ["クローディアス", "先王の弟で、ハムレットの叔父。新しい王となり、兄の妻だったガートルードと結婚した。"], ["ガートルード", "ハムレットの母である王妃。夫の死後、その弟クローディアスと再婚した。"], ["ホレイショー", "ハムレットが信頼する友人。王の反応を一緒に見届け、最後には真相を伝える役目を託される。"], ["オフィーリア", "ポローニアスの娘で、レアティーズの妹。ハムレットを思うが、父の指示と王子の言動に苦しむ。"], ["ポローニアス", "王に仕える年長の人物。オフィーリアとレアティーズの父。王子の様子を探ろうとする。"], ["レアティーズ", "ポローニアスの息子で、オフィーリアの兄。父を失い、ハムレットへの復讐を求める。"], ["ローゼンクランツとギルデンスターン", "ハムレットの旧友二人。王の依頼で王子の様子を探り、イングランド行きに付き添う。"], ["フォーティンブラス", "ノルウェーの王子。終幕でデンマークへ到着し、国を引き受けようとする。"]], "synopsisSummary": ["デンマークの王子ハムレットは、父である先王の死を悲しんでいます。父の弟クローディアスが新しい王となり、母ガートルードは、その叔父と早くも再婚しました。ある夜、友人ホレイショーに知らせを受けたハムレットの前に、父の姿をした亡霊が現れます。亡霊は、弟に殺されたと語り、復讐を求めます。ただし、母には手を下さないよう言い残します。", "ハムレットは、正気を失ったように振る舞いながら、叔父を探ろうとします。しかし、亡霊の言葉だけで殺人の真相を決めてよいのか、迷いもあります。王は王子の旧友ローゼンクランツとギルデンスターンを呼び、その様子を探らせます。王に仕えるポローニアスは、自分の娘オフィーリアへの恋が原因だと考えます。オフィーリアはハムレットと心を通わせていましたが、父の命令で手紙や訪問を断っていました。仕組まれた面会でハムレットから激しく拒まれ、彼女も苦しみます。", "旅の役者たちが来ると、ハムレットは、父が殺されたという話に似た劇を叔父に見せる計画を立てます。信頼するホレイショーにも、王の反応を見てほしいと頼みました。劇の途中、クローディアスは動揺して席を立ち、灯りを求めて退出し、上演は中断されます。ハムレットは疑いを確信へ変えます。その後、王は一人で兄殺しの罪を認めますが、王位や王妃を手放せず、本心から悔い改められません。祈る姿を見たハムレットは、今殺せば叔父を天国へ送ってしまうと考え、復讐を見送ります。", "次にハムレットは母の部屋へ行き、再婚を責めます。会話を盗み聞きしていたポローニアスが壁掛けの陰で声を上げると、ハムレットは相手を確かめずに刺し、殺してしまいます。叔父の罪を確かめようとしていた王子自身が、別の家族から父を奪ったのです。王はハムレットを危険と見なし、二人の旧友を付き添わせてイングランドへ送ります。その二人には、到着後ハムレットを処刑させる秘密の手紙を持たせていました。", "船の中で手紙を見つけたハムレットは、自分の代わりに手紙の運び手二人を処刑する内容へ書き換えます。翌日、船が海賊に襲われた際、ハムレットだけが相手の船へ乗り移って捕らわれます。海賊は見返りを期待して彼を助け、ハムレットはデンマークへ戻ります。二人の旧友はそのままイングランドへ向かい、後に処刑されたことが知らされます。", "その間、父を失ったオフィーリアは、まとまりのない話や歌を口にするようになります。兄レアティーズはフランスから戻り、父の死への復讐を求めます。さらに、妹が川で溺死したと王妃から知らされます。帰国したハムレットも葬儀で彼女の死を知り、レアティーズと激しく争います。クローディアスはレアティーズの怒りを利用し、剣術の試合を装ってハムレットを殺す計画を進めます。", "試合では、レアティーズの剣に毒が仕込まれ、王もハムレットのために毒入りの杯を用意していました。ところが、その杯を母ガートルードが飲んでしまいます。試合中には剣が入れ替わり、ハムレットとレアティーズの両方が毒のある刃で傷を負います。レアティーズは企みと王の責任を明かし、ハムレットはクローディアスを殺します。ハムレットとレアティーズは最後に互いの罪を許し合いますが、母もレアティーズもハムレットも命を失います。", "死の間際、ハムレットはホレイショーに、生きて真相を伝えてほしいと頼みます。また、ノルウェーの王子フォーティンブラスを次の統治者として支持する意志を残します。到着したフォーティンブラスに、ホレイショーは何が起きたのかを説明しようとします。父の仇は討たれても、大切な人々は戻りません。残された人が、悲劇の事情と国のこれからを引き受けるところで幕が閉じます。"], "summaryHeading": "要約", "links": ["shakespeare", "romeoandjuliet"], "characterGallery": [{"name": "ハムレット", "role": "デンマークの王子。亡くなった父の死の真相を調べ、叔父への復讐を考える。", "portraits": [{"src": "assets/hamlet-face-hamlet.webp", "label": "父の死後・喪服の王子", "alt": "ハムレットの人物イメージ", "width": 500, "height": 500}]}, {"name": "先王の亡霊", "role": "ハムレットの父の姿をした霊。弟に殺されたと語り、息子に復讐を求める。", "portraits": [{"src": "assets/hamlet-face-ghost.webp", "label": "父の姿で現れる霊", "alt": "先王の亡霊の人物イメージ", "width": 500, "height": 500}]}, {"name": "クローディアス", "role": "先王の弟で、ハムレットの叔父。新しい王となり、兄の妻だったガートルードと結婚した。", "portraits": [{"src": "assets/hamlet-face-claudius.webp", "label": "叔父・現在の王", "alt": "クローディアスの人物イメージ", "width": 500, "height": 500}]}, {"name": "ガートルード", "role": "ハムレットの母である王妃。夫の死後、その弟クローディアスと再婚した。", "portraits": [{"src": "assets/hamlet-face-gertrude.webp", "label": "母・王妃", "alt": "ガートルードの人物イメージ", "width": 500, "height": 500}]}, {"name": "ホレイショー", "role": "ハムレットが信頼する友人。王の反応を一緒に見届け、最後には真相を伝える役目を託される。", "portraits": [{"src": "assets/hamlet-face-horatio.webp", "label": "王子が信頼する友人", "alt": "ホレイショーの人物イメージ", "width": 500, "height": 500}]}, {"name": "オフィーリア", "role": "ポローニアスの娘で、レアティーズの妹。ハムレットを思うが、父の指示と王子の言動に苦しむ。", "portraits": [{"src": "assets/hamlet-face-ophelia.webp", "label": "ポローニアスの娘", "alt": "オフィーリアの人物イメージ", "width": 500, "height": 500}]}, {"name": "ポローニアス", "role": "王に仕える年長の人物。オフィーリアとレアティーズの父。王子の様子を探ろうとする。", "portraits": [{"src": "assets/hamlet-face-polonius.webp", "label": "オフィーリアとレアティーズの父", "alt": "ポローニアスの人物イメージ", "width": 500, "height": 500}]}, {"name": "レアティーズ", "role": "ポローニアスの息子で、オフィーリアの兄。父を失い、ハムレットへの復讐を求める。", "portraits": [{"src": "assets/hamlet-face-laertes.webp", "label": "オフィーリアの兄", "alt": "レアティーズの人物イメージ", "width": 500, "height": 500}]}, {"name": "ローゼンクランツとギルデンスターン", "role": "ハムレットの旧友二人。王の依頼で王子の様子を探り、イングランド行きに付き添う。", "portraits": [{"src": "assets/hamlet-face-oldfriends.webp", "label": "左：ローゼンクランツ／右：ギルデンスターン", "alt": "ローゼンクランツとギルデンスターンの人物イメージ", "width": 500, "height": 500}], "wide": true}, {"name": "フォーティンブラス", "role": "ノルウェーの王子。終幕でデンマークへ到着し、国を引き受けようとする。", "portraits": [{"src": "assets/hamlet-face-fortinbras.webp", "label": "ノルウェーの王子", "alt": "フォーティンブラスの人物イメージ", "width": 500, "height": 500}]}], "inlineIllustrations": [{"afterParagraph": 1, "src": "assets/hamlet-father-ghost-scene.webp", "alt": "父の姿をした亡霊から、叔父に殺されたという訴えを聞くハムレット。真相を確かめる出発点です。", "caption": "父の姿をした亡霊から、叔父に殺されたという訴えを聞くハムレット。真相を確かめる出発点です。", "width": 1200, "height": 800}, {"afterParagraph": 3, "src": "assets/hamlet-play-interrupted-scene.webp", "alt": "父の死に似た劇を見て、叔父の王が席を立ちます。ハムレットとホレイショーは、その反応を見届けます。", "caption": "父の死に似た劇を見て、叔父の王が席を立ちます。ハムレットとホレイショーは、その反応を見届けます。", "width": 1200, "height": 800}, {"afterParagraph": 8, "src": "assets/hamlet-horatio-testimony-scene.webp", "alt": "ホレイショーは、到着したノルウェーの王子に事情を伝えようとします。ハムレットに託された、真相を残す役目です。", "caption": "ホレイショーは、到着したノルウェーの王子に事情を伝えようとします。ハムレットに託された、真相を残す役目です。", "width": 1200, "height": 800}], "characterGalleryNote": "旧友二人のカードは、左右の人物を見分けるための紹介図です。", "image": "assets/hamlet-father-ghost-scene.webp", "imageAlt": "父の姿をした亡霊の訴えを聞くハムレット", "headerCaption": "父の姿をした亡霊から、叔父に殺されたという訴えを聞くハムレット。真相を確かめる出発点です。"}, {"id": "tom-sawyer", "name": "トム・ソーヤーの冒険", "reading": "とむそーやーのぼうけん", "intro": "川沿いの町で暮らすトムは、いたずらと冒険が大好き。友達と遊ぶ毎日の中で、本当の事件に巻き込まれ、秘密を守る怖さと、人を助ける勇気に向き合います。", "gist": "塀塗りを遊びに変える少年が、事件の証言や洞窟での危機を通して、人を助けるために行動する。", "bodyReadings": {"冒険": "ぼうけん", "塀": "へい", "罰": "ばつ", "墓地": "ぼち", "医師": "いし", "仕返し": "しかえし", "海賊": "かいぞく", "葬儀": "そうぎ", "裁判": "さいばん", "無実": "むじつ", "証人": "しょうにん", "復讐": "ふくしゅう", "廃屋": "はいおく", "金貨": "きんか", "危害": "きがい", "洞窟": "どうくつ", "凧": "たこ", "判事": "はんじ", "十字": "じゅうじ", "行儀": "ぎょうぎ", "憧れ": "あこがれ", "皮肉": "ひにく"}, "sources": [{"title": "Wikisource・1876年米国版の本文と序文", "url": "https://en.wikisource.org/wiki/The_Adventures_of_Tom_Sawyer"}, {"title": "Mark Twain House & Museum・作者の生涯", "url": "https://marktwainhouse.org/about/mark-twain/biography/"}], "sourceNote": "1876年の英語小説。参照したのは同年の米国版（The American Publishing Companyほか）のWikisource転記です。著作権表示の1875年と刊行年は区別しています。続編やアニメ、現代日本語訳の文章は使わず、原作をもとにこの図鑑独自の日本語で紹介しています。", "termNote": "判事は裁判に関わる役人です。物語の町は、作者が少年時代を過ごした土地をもとにした架空の町。原作には当時の奴隷制や、先住民への差別的な呼び方・描写があります。ここで「ジョー」と呼ぶ大人は、原作ではInjun Joeと記される人物で、少年のジョー・ハーパーとは別人です。人物の行為を民族全体の性質と結び付けてはいません。", "checkedDate": "2026年11月2日", "cat": "literature", "primaryCategory": "world-literature", "genreLabel": "海外文学", "genre": "world-classic", "motif": "book", "sub": "マーク・トウェイン｜1876年初刊行", "people": [["トム・ソーヤー", "ポリーおばさんに育てられる少年。いたずらと冒険が好きだが、人を助けるために怖さと向き合う。"], ["ハックルベリー・フィン（ハック）", "トムの友達。学校や家の決まりから離れて暮らす少年。トムと事件を目撃し、宝を探す。"], ["ベッキー・サッチャー", "トムが好きになる少女。サッチャー判事の娘。トムと洞窟で道に迷う。"], ["ポリーおばさん", "トムの亡くなった母の姉妹。トムを育て、厳しく叱りながら心配する。"], ["ジョー・ハーパー", "トムの学校の友達。トムとハックと三人で島へ行く。事件を起こす大人のジョーとは別人。"], ["マフ・ポッター", "少年たちに親切にしてきた男性。自分のしていない殺人の疑いをかけられる。"], ["ジョー", "医師を殺し、ポッターに罪を着せる男性。トムが恐れる相手で、宝を隠している。"], ["ダグラス夫人", "ハックに親切にする女性。夫を亡くしている。後にハックを家に迎える。"], ["サッチャー判事", "ベッキーの父。娘を捜し、救出後は再び人が迷わないよう洞窟の入口を閉ざす。"]], "synopsisSummary": ["アメリカのミシシッピ川沿いの町で、少年トムは、亡くなった母の姉妹であるポリーおばさんに育てられています。学校や決まり事より遊びが好きで、叱られてばかりです。ある土曜日、罰として塀を白く塗るよう言われると、わざと面白そうに働きます。友達は自分もやりたくなり、品物を渡して順番を待つようになりました。トムには、退屈な仕事さえ冒険に変えてしまう知恵があります。", "トムは少女ベッキーに心を引かれ、自由に暮らす少年ハックとも遊びます。ある夜、トムとハックは墓地で、ジョーという男が医師を殺すところを見てしまいます。ところが疑われたのは、その場で気を失っていたマフ・ポッターでした。ジョーは罪をポッターになすりつけます。二人は仕返しを恐れ、見たことを秘密にすると誓いますが、以前から親切にしてくれたポッターが捕まり、トムは心苦しくなります。", "その後トムは、友達のジョー・ハーパーとハックを誘って、川の島で海賊ごっこを始めます。町では三人が溺れたと思われ、家族は悲しみます。ひそかに家へ戻ったトムは、ポリーおばさんが自分を思って泣く姿を見ました。それでもすぐには名乗り出ず、三人で自分たちの葬儀に現れて皆を驚かせます。楽しい冒険の裏で、人をどれほど心配させたかが見えてきます。", "やがてポッターの裁判が始まります。黙っていれば、無実の人が罪に問われてしまいます。トムは恐れを押し切って証人となり、墓地で見た出来事を話します。犯人のジョーは窓から逃げ、ポッターは救われました。トムは町で褒められますが、逃げたジョーの復讐を恐れ、夜は不安を感じ続けます。勇気を出したからといって、怖さがすぐ消えるわけではありません。", "別の日、宝探しをしていたトムとハックは、廃屋でジョーと仲間が金貨の箱を見つけるところを目撃します。二人の男は宝を別の場所へ運び、少年たちは行方を追います。夜の見張りをしていたハックは、ジョーがダグラス夫人に危害を加えようとしていると知ります。親切にしてくれた夫人を助けるため、近所の大人とその息子たちへ知らせました。男たちは追い払われ、夫人は助かります。", "同じころ、遠足で洞窟に入ったトムとベッキーは、仲間から離れて道に迷います。食べ物も灯りも乏しくなり、町の人たちは二人を捜し続けます。トムは凧の糸を目印に通路を調べ、洞窟に隠れていたジョーも見かけます。それでも別の道を探し、とうとう小さな出口から外の光を見つけました。ベッキーを連れ出し、川を通る舟の人たちに助けられて、二人は町へ帰ります。", "再び人が迷わないよう、ベッキーの父サッチャー判事は洞窟の入口を閉ざしていました。そのことを聞いたトムがジョーの存在を知らせますが、扉を開けた時にはジョーは中で亡くなっていました。トムは、男が隠した宝も洞窟にあると気づきます。ハックと小さな出口から入り直し、十字の印を手掛かりに箱を見つけ、金を持ち帰りました。二人は宝を半分ずつ分け、町の大人たちから注目されます。", "ハックはダグラス夫人の家に迎えられます。しかし、時間や服装を細かく決められる生活になじめず、逃げ出してしまいました。トムはハックを見つけ、戻れば新しい盗賊ごっこの仲間にすると誘います。ハックはもうしばらく試すことにし、トムも夫人に決まりを緩めてほしいと頼む約束をします。宝を得て立派な大人になったところで終わるのではありません。遊びを夢見る少年たちと、周囲の暮らしとの折り合いが続いていく結末です。"], "summaryHeading": "要約", "links": ["treasure-island", "anne-green-gables", "mark-twain"], "characterGallery": [{"name": "トム・ソーヤー", "role": "ポリーおばさんに育てられる少年。いたずらと冒険が好きだが、人を助けるために怖さと向き合う。", "portraits": [{"src": "assets/tom-face-tom.webp", "label": "少年時代", "alt": "トム・ソーヤーの人物イメージ", "width": 500, "height": 500}]}, {"name": "ハックルベリー・フィン（ハック）", "role": "トムの友達。学校や家の決まりから離れて暮らす少年。トムと事件を目撃し、宝を探す。", "portraits": [{"src": "assets/tom-face-huck.webp", "label": "夫人の家へ迎えられる前", "alt": "ハックルベリー・フィン（ハック）の人物イメージ", "width": 500, "height": 500}]}, {"name": "ベッキー・サッチャー", "role": "トムが好きになる少女。サッチャー判事の娘。トムと洞窟で道に迷う。", "portraits": [{"src": "assets/tom-face-becky.webp", "label": "トムと同じ学校の少女", "alt": "ベッキー・サッチャーの人物イメージ", "width": 500, "height": 500}]}, {"name": "ポリーおばさん", "role": "トムの亡くなった母の姉妹。トムを育て、厳しく叱りながら心配する。", "portraits": [{"src": "assets/tom-face-polly.webp", "label": "トムを育てる叔母", "alt": "ポリーおばさんの人物イメージ", "width": 500, "height": 500}]}, {"name": "ジョー・ハーパー", "role": "トムの学校の友達。トムとハックと三人で島へ行く。事件を起こす大人のジョーとは別人。", "portraits": [{"src": "assets/tom-face-joeharper.webp", "label": "学校の友達", "alt": "ジョー・ハーパーの人物イメージ", "width": 500, "height": 500}]}, {"name": "マフ・ポッター", "role": "少年たちに親切にしてきた男性。自分のしていない殺人の疑いをかけられる。", "portraits": [{"src": "assets/tom-face-potter.webp", "label": "殺人の疑いをかけられる男性", "alt": "マフ・ポッターの人物イメージ", "width": 500, "height": 500}]}, {"name": "ジョー", "role": "医師を殺し、ポッターに罪を着せる男性。トムが恐れる相手で、宝を隠している。", "portraits": [{"src": "assets/tom-face-joe.webp", "label": "事件を起こす成人男性", "alt": "ジョー const authorBackground=[{"title": "東京の、どこで生まれた？", "text": "1892年3月1日、東京市京橋区入船町で生まれました。今の中央区明石町、聖路加国際病院の周辺にあたります。実父は牛乳販売業を営んでいました。生まれた町と、その後に育った町は別です。", "sources": [{"title": "たばこと塩の博物館「芥川龍之介がみた江戸・東京」", "url": "https://www.tabashio.jp/exhibition/2023/2309sep/index.html"}, {"title": "墨田区観光協会「芥川龍之介生育の地」", "url": "https://visit-sumida.jp/wp/spot/6005"}]}, {"title": "育ったのは、本所・両国", "text": "乳児のころ、母の実家の芥川家に引き取られ、18歳まで本所（ほんじょ）・両国周辺で育ちました。住まいは今の墨田区両国3丁目にあたる場所です。俳句や芝居などに親しむ家庭でした。", "sources": [{"title": "たばこと塩の博物館「芥川龍之介がみた江戸・東京」", "url": "https://www.tabashio.jp/exhibition/2023/2309sep/index.html"}, {"title": "墨田区立図書館「すみだ文学散歩」（PDF）", "url": "https://www.library.sumida.tokyo.jp/images/upload/sumidabunngakusannpo.pdf"}]}, {"title": "なじみの景色は、隅田川", "text": "育った家の近くには隅田川や回向院（えこういん）がありました。芥川は『大川の水』にも、川沿いの風景を書いています。育った町を知ってから作品を読むと、身近な景色を作家がどう見ていたか、たどる楽しみが生まれます。", "sources": [{"title": "たばこと塩の博物館「芥川龍之介がみた江戸・東京」", "url": "https://www.tabashio.jp/exhibition/2023/2309sep/index.html"}, {"title": "青空文庫「大川の水」本文", "url": "https://www.aozora.gr.jp/cards/000879/files/123_15167.html"}]}, {"title": "「鼻」を夏目漱石がほめる", "text": "1916年、大学生だった芥川が発表した『鼻』を、夏目漱石が高く評価しました。これが、芥川の名前が文学の世界で広く知られるきっかけになります。芥川は、それ以前から読書や文章を書くことに親しんでいました。漱石にほめられてから初めて小説を書き始めた、というわけではありません。", "sources": [{"title": "日本近代文学館「教科書のなかの文学／教室のそとの文学──芥川龍之介『羅生門』とその時代」", "url": "https://www.bungakukan.or.jp/cat-exhibition/9062/"}, {"title": "国立国会図書館「近代日本人の肖像」芥川龍之介", "url": "https://www.ndl.go.jp/portrait/datas/224/"}, {"title": "山梨県立文学館デジタルアーカイブ「芥川龍之介」", "url": "https://digital-archive.pref.yamanashi.jp/literary/19"}]}, {"title": "小説家になるまで、何をしていた？", "text": "読書だけでなく、幼いころから回覧雑誌も作っていました。東京帝国大学では英文学を学び、仲間との同人誌活動にも取り組みます。1915年に『羅生門』、1916年に『鼻』を発表しました。漱石に褒められて初めて書き始めたのではなく、それまでの読書や創作の積み重ねがありました。", "sources": [{"title": "山梨県立文学館デジタルアーカイブ「芥川龍之介」", "url": "https://digital-archive.pref.yamanashi.jp/literary/19"}, {"title": "たばこと塩の博物館「芥川龍之介がみた江戸・東京」", "url": "https://www.tabashio.jp/exhibition/2023/2309sep/index.html"}]}, {"title": "作家の暮らしを支えた田端", "text": "1914年に田端（たばた）へ移り、ここが創作の大切な拠点になりました。室生犀星（むろう さいせい）ら作家との交流も、田端に文士が集まるきっかけの一つとなります。大学卒業後は英語を教えながら執筆し、1919年に教職を離れ、文筆に専念しました。田端に移ってからも、横須賀や鎌倉で暮らした時期があります。", "sources": [{"title": "北区「芥川龍之介記念館とは」", "url": "https://www.city.kita.lg.jp/culture-tourism-sports/culture/1010296/1010304/1010305.html"}, {"title": "田端文士村記念館", "url": "https://kitabunka.or.jp/tabata/news/16484/"}, {"title": "国立国会図書館「近代日本人の肖像」", "url": "https://www.ndl.go.jp/portrait/datas/224"}], "diagram": {"src": "assets/akutagawa-life-timeline.webp", "alt": "芥川龍之介の歩みを示す年表。1892年に東京で誕生、1915年に『羅生門』発表、1916年に『鼻』を発表して夏目漱石に認められる。1919年に新聞社社員として文筆活動に専念し、1927年に生涯を閉じた。背景の街並みや書斎は創作イメージ。", "caption": "芥川龍之介の歩み。1919年は執筆を始めた年ではなく、海軍機関学校を辞職し、大阪毎日新聞社の社員として文筆活動に専念する転換点です。図はAI生成イラストです。背景の街並み・門・机・書物・新聞は創作イメージで、特定の場所や実物資料の正確な再現ではありません。年の間隔は実際の長さに比例しません。", "width": 1024, "height": 1536, "sourceNote": "図は確認した年譜情報をもとにしたAI生成イラストです。"}}];

const approvedNoteRuby = {"shuju-no-kotoba":{"interpretationNote":["「警句」は、短い言葉で物事の意外な面を示す表現。「反語」は、表面の言葉とは逆の意味などを込める言い方。「",{"text":"瑣事","reading":"さじ"},"」は日常の小さなこと。「侏儒」は歴史的に小柄な人や道化を指した語で、ここでは作品名として扱い、身体的特徴を笑いの対象にしません。"],"sourceNote":["青空文庫No.158の新字新仮名本文について、序・本篇・",{"text":"遺稿","reading":"いこう"},"と末尾の書誌まで確認し、独自の言葉で要約しました。本篇・",{"text":"遺稿","reading":"いこう"},"の底本は小学館『昭和文学全集 第1巻』1987年5月1日初版第1刷、親本は岩波書店『",{"text":"芥川龍之介","reading":"あくたがわりゅうのすけ"},"全集』1977〜1978年。序の底本は筑摩書房ちくま文庫『",{"text":"芥川龍之介","reading":"あくたがわりゅうのすけ"},"全集7』です。入力j.utiyama、校正かとうかおり。電子本文は1999年1月13日公開、2004年3月8日修正。",{"text":"遺稿","reading":"いこう"},"の初出月について、青空文庫カードは1927年9月、昭和館の目次は同題を同年10・12月号に記録しています。原雑誌本文と各断片の対応、月の差が生じた理由は未照合のため、紹介では年単位に留めました。No.43751は",{"text":"遺稿","reading":"いこう"},"を含まず、今回の範囲とは異なります。外字画像の字形、初出誌の現物、別版の補遺全体は未照合です。現代版の解説・翻訳・図版は転載していません。"]},"haru-to-shura":{"interpretationNote":["「",{"text":"心象","reading":"しんしょう"},"」は心に浮かぶ姿や景色、「",{"text":"挽歌","reading":"ばんか"},"」は亡くなった人を悼む詩、「",{"text":"永訣","reading":"えいけつ"},"」は永遠の別れを表します。「",{"text":"無声慟哭","reading":"むせいどうこく"},"」は声にならない激しい悲しみを感じさせる題です。「",{"text":"碍子","reading":"がいし"},"」は電線を支え、電気がほかへ流れにくくする部品です。科学の用語は観察の説明にも比喩にも使われます。たとえば「",{"text":"永訣","reading":"えいけつ"},"の朝」の「二相系」は、雪と水が一緒にある状態を言い表します。"],"sourceNote":["青空文庫カード1058の『",{"text":"春と修羅","reading":"はるとしゅら"},"』本文と底本情報を確認し、独自の平易な言葉で案内しました。採用本文は新字旧仮名で、底本は筑摩書房・ちくま文庫『",{"text":"宮沢賢治","reading":"みやざわけんじ"},"全集1』1986年2月26日第1刷、1998年5月12日第17刷です。1924年初版本の紙面を直接翻刻したものとしては扱いません。「序」に続き、「",{"text":"春と修羅","reading":"はるとしゅら"},"」「",{"text":"真空溶媒","reading":"しんくうようばい"},"」「",{"text":"小岩井農場","reading":"こいわいのうじょう"},"」「グランド電柱」「東岩手火山」「",{"text":"無声慟哭","reading":"むせいどうこく"},"」「オホーツク",{"text":"挽歌","reading":"ばんか"},"」「風景とオルゴール」の八部を扱いました。採用電子本文の見出しを照合すると、序を除いて六十九篇あります。",{"text":"小岩井農場","reading":"こいわいのうじょう"},"の五・六は採用本文では見出しのみで、七の後は九となっており、欠けた内容を補作していません。最終詩は「冬と銀河ステーシヨン」で、その後の底本・入力校正情報は詩篇と区別しました。入力は柴田卓治、校正はかとうかおり。電子本文は2000年10月4日公開、2011年5月11日修正です。現代の解説、既存の表紙画や肖像写真は転載していません。 初刊の刊行年月日は、早稲田大学図書館の書誌にある1924年4月20日を参照しました。"]}};
function approvedNoteText(x,field,value){
 const parts=approvedNoteRuby[x.id]&&approvedNoteRuby[x.id][field];
 if(!parts)return esc(value);
 const snippet=parts.map(p=>typeof p==='string'?p:p.text).join('');
 const index=value.indexOf(snippet);
 if(index<0||value.indexOf(snippet,index+snippet.length)!==-1)return esc(value);
 const restored=parts.map(p=>typeof p==='string'?esc(p):`<ruby>${esc(p.text)}<rt>${esc(p.reading)}</rt></ruby>`).join('');
 return esc(value.slice(0,index))+restored+esc(value.slice(index+snippet.length));
}
function plainBodyText(x,value){const words=Object.keys(x.bodyReadings||{}).sort((a,b)=>b.length-a.length);if(!words.length)return esc(value);let output='',i=0;while(i<value.length){const word=words.find(w=>value.startsWith(w,i));if(word){output+=rubyText(word,x.bodyReadings[word]);i+=word.length}else{output+=esc(value[i]);i++}}return output}
function bodyText(x,value){if(x.cat!=='person')return plainBodyText(x,value);const works=(x.links||[]).map(id=>items.find(y=>y.id===id&&(y.cat==='literature'||y.cat==='myth'))).filter(Boolean),aliases={'ごんぎつね':'gongitsune'};let output='',at=0;for(const m of value.matchAll(/『([^』]+)』/gu)){const title=m[1],work=works.find(w=>w.name===title||aliases[title]===w.id);if(!work)continue;output+=plainBodyText(x,value.slice(at,m.index))+'『<a class="inline-work-link" href="'+articleHref(work.id)+'">'+plainBodyText(x,title)+'</a>』';at=m.index+m[0].length}return output+plainBodyText(x,value.slice(at))}
const personBirthPlaceMapLinks=[{"id":"akutagawa","title":"東京の、どこで生まれた？","text":"1892年3月1日、東京市京橋区入船町で生まれました。今の中央区明石町、聖路加国際病院の周辺にあたります。実父は牛乳販売業を営んでいました。生まれた町と、その後に育った町は別です。","label":"中央区明石町","query":"東京都中央区明石町"},{"id":"dazai","title":"青森で生まれた津島修治","text":"太宰治は1909年6月19日、青森県の金木村で生まれました。今の五所川原市金木町です。本名は津島修治。家は多くの土地を持つ地主で、父は政治にも関わっていました。少年時代から本を読み、中学校で学ぶころには文章を書く活動にも取り組んでいます。故郷は、後に『津軽』を書くときにも大切な場所となりました。","label":"五所川原市金木町","query":"青森県五所川原市金木町"}];

}
const geographicLinkRegistry=[{"id": "soseki", "field": "background", "paragraph": 0, "text": "1867年2月9日、江戸の牛込馬場下横町に生まれました。今の東京都新宿区喜久井町にあたります。本名は夏目金之助です。", "label": "東京都新宿区喜久井町", "query": "東京都新宿区喜久井町"}, {"id": "kenji", "field": "background", "paragraph": 0, "text": "1896年8月27日、岩手県の花巻川口町に生まれました。今の花巻市豊沢町にあたります。家は質屋と古着商を営んでいました。作品で親しんだ自然だけでなく、町の暮らしも身近にありました。", "label": "花巻市豊沢町", "query": "岩手県花巻市豊沢町"}, {"id": "niimi-nankichi", "field": "background", "paragraph": 0, "text": "新美南吉は1913年7月30日、愛知県の半田町、今の半田市に生まれました。本名は新美正八です。畳屋の家に育ち、4歳で母を亡くしました。8歳で母の実家の新美家の養子になり、姓が渡辺から新美に変わります。その年のうちに暮らす家は渡辺家へ戻りました。ふるさとの岩滑の生活や自然は、後の物語にも息づいています。", "label": "半田市", "query": "愛知県半田市"}, {"id": "mori-ogai", "field": "background", "paragraph": 0, "text": "森鷗外は1862年2月17日、今の島根県津和野町に生まれました。本名は森林太郎です。家は津和野藩の医師を代々務めており、幼いころから漢文などを学びました。10歳で父と東京へ移り、ドイツ語と医学を学ぶ道へ進みます。学生時代には依田学海から漢文を学び、医学だけでなく言葉や文学にも親しみました。", "label": "島根県津和野町", "query": "島根県津和野町"}, {"id": "higuchi-ichiyo", "field": "background", "paragraph": 0, "text": "樋口一葉は1872年5月2日、東京の内幸町に生まれました。当時の暦では明治5年3月25日です。本名は奈津で、夏子とも書きました。父は東京府の役人でした。幼いころから読書に親しみ、上野御徒町へ移った後は青海学校で学びます。東京のさまざまな町で暮らした経験が、後の文学の背景になりました。", "label": "内幸町", "query": "東京都千代田区内幸町"}, {"id": "nakajima-atsushi", "field": "background", "paragraph": 0, "text": "中島敦は1909年5月5日、東京の四谷に生まれました。父は漢文の教師で、祖父や伯父たちも漢学に深く関わる家でした。幼年期には父の実家がある埼玉の久喜で育ちます。その後、父の仕事に伴って奈良、浜松、当時日本の植民地支配下にあった朝鮮の京城へ移りました。一つの町だけで育ったのではなく、土地を移りながら学んだ人です。", "label": "四谷", "query": "東京都新宿区四谷"}, {"id": "kusuyama-masao", "field": "background", "paragraph": 0, "text": "楠山正雄は1884年11月4日、東京の銀座に生まれました。幼いころに父を亡くし、親戚の家で暮らした時期もあります。早稲田大学では英文学を学び、坪内逍遙や島村抱月に教わりました。物語を書くことだけでなく、外国の文学や演劇にも関心を広げていきます。", "label": "銀座", "query": "東京都中央区銀座"}, {"id": "masaoka-shiki", "field": "background", "paragraph": 0, "text": "正岡子規は、俳句と短歌の表現を新しくしようとした明治時代の文学者です。1867年10月14日、今の愛媛県松山市に生まれました。本名は正岡常規。「子規」は文学活動で使った名前です。子どものころから漢詩や絵に親しみ、友人たちと雑誌を作ることもありました。", "label": "愛媛県松山市", "query": "愛媛県松山市"}, {"id": "nitobe-inazo", "field": "background", "paragraph": 0, "text": "新渡戸稲造は、1862年9月1日、盛岡に生まれました。父は南部藩の武士です。少年時代に東京へ出て英語などを学び、1877年には札幌農学校へ入学しました。内村鑑三や宮部金吾との交流も、このころから続きます。後に本を書くだけでなく、農学や教育の仕事に進んだ人です。", "label": "盛岡", "query": "岩手県盛岡市"}, {"id": "ito-sachio", "field": "background", "paragraph": 0, "text": "伊藤左千夫は1864年、今の千葉県山武市に生まれました。本名は幸次郎です。生年月日は旧暦の八月十八日で、新暦では九月十八日に当たります。農家で育ち、学校や私塾で漢文を学びました。1881年には東京の明治法律学校に入りましたが、目を病み、学業を続けられず帰郷します。", "label": "千葉県山武市", "query": "千葉県山武市"}, {"id": "izumi-kyoka", "field": "background", "paragraph": 0, "text": "泉鏡花は1873年11月4日、金沢に生まれました。本名は泉鏡太郎です。父は金属に彫刻を施す職人、母は能楽に関わる家の出身でした。鏡花は1882年に母を亡くします。幼いころの母への思いは、その後の作品を考えるうえで大切な背景です。", "label": "金沢", "query": "石川県金沢市"}, {"id": "hori-tatsuo", "field": "background", "paragraph": 0, "text": "堀辰雄は1904年12月28日、東京の麹町に生まれました。若いころは数学にも関心がありましたが、第一高等学校で知り合った神西清との交流を通して、文学への関心を深めます。学校から文学仲間へと、読むこと、書くことのつながりを広げていきました。", "label": "麹町", "query": "東京都千代田区麹町"}, {"id": "edogawa-ranpo", "field": "background", "paragraph": 0, "text": "江戸川乱歩は1894年10月21日、今の三重県名張市に生まれました。本名は平井太郎です。育ったのは主に名古屋で、早稲田大学では経済を学びました。学校の勉強とともに、ポーやコナン・ドイルの作品を読み、謎を解く物語に親しんでいきます。", "label": "三重県名張市", "query": "三重県名張市"}, {"id": "nakahara-chuya", "field": "background", "paragraph": 0, "text": "中原中也は1907年4月29日、現在の山口市湯田温泉に生まれました。幼い頃は父の転勤に伴って移り住み、1914年に山口へ戻ります。小学校の高学年には短歌を作り、新聞や雑誌へ投稿するようになりました。", "label": "山口市湯田温泉", "query": "山口県山口市湯田温泉"}, {"id": "yosano-akiko", "field": "background", "paragraph": 0, "text": "与謝野晶子は、短歌や詩、評論を書き、古典の現代語訳にも取り組んだ文学者です。1878年、大阪の堺にあった和菓子商・駿河屋の家に生まれました。旧姓は鳳です。恋愛の思いを率直に歌った歌人として知られますが、女性の学び方や働き方、教育についても自分の考えを発表しました。", "label": "堺", "query": "大阪府堺市"}, {"id": "kobayashi-takiji", "field": "background", "paragraph": 0, "text": "小林多喜二は、『蟹工船』で知られる小説家です。労働者や農民の暮らしと社会の問題を描いた、プロレタリア文学の代表的な作家の一人です。1903年、現在の秋田県大館市川口の農家に生まれ、幼いころに家族と北海道の小樽へ移りました。叔父のパン屋を手伝いながら学び、小樽高等商業学校へ進みました。", "label": "秋田県大館市川口", "query": "秋田県大館市川口"}, {"id": "kawabata-yasunari", "field": "background", "paragraph": 0, "text": "川端康成は1899年、大阪市に生まれました。幼いころに両親を亡くし、今の大阪府茨木市にあたる地域で祖父母に育てられます。祖母、そして祖父とも別れ、少年時代から身近な人を失う経験を重ねました。中学校のころには文学に熱中し、小説家を志すようになります。", "label": "大阪府茨木市", "query": "大阪府茨木市"}, {"id": "shakespeare", "field": "background", "paragraph": 0, "text": "シェイクスピアは1564年、イングランドのストラトフォード・アポン・エイヴォンで生まれました。父ジョンは手袋職人で、町の行政にも携わった人です。誕生日は4月23日として祝われますが、正確な日は分かっていません。記録で確かなのは、4月26日に地元の教会で洗礼を受けたことです。", "label": "ストラトフォード・アポン・エイヴォン", "query": "Stratford-upon-Avon England"}, {"id": "dostoevsky", "field": "background", "paragraph": 0, "text": "フョードル・ミハイロヴィチ・ドストエフスキーは、1821年にモスクワで生まれたロシアの小説家です。父は貧しい人々のためのマリインスキー病院で働く医師でした。モスクワで学校に通う一方、家族が田舎の土地を買ってからは、夏をダロヴォエで過ごしました。生まれ育ったモスクワと、のちの活動拠点ペテルブルクは別の都市です。", "label": "モスクワ", "query": "Moscow Russia"}, {"id": "andersen", "field": "background", "paragraph": 0, "text": "ハンス・クリスチャン・アンデルセンは、1805年4月2日、デンマークのオーデンセに生まれました。父は靴直しの職人、母は洗濯の仕事をし、家計は苦しいものでした。それでも父が本を読み聞かせ、町の人々が昔話を語ってくれました。貧しい暮らしの中にも、本や語りを通して別の世界に触れる機会があったのです。", "label": "オーデンセ", "query": "Odense Denmark"}, {"id": "brothers-grimm", "field": "background", "paragraph": 0, "text": "グリム兄弟とは、兄のヤーコプと弟のヴィルヘルムです。ヤーコプは1785年、ヴィルヘルムは1786年に、現在のドイツにあるハーナウで生まれました。幼い頃をシュタイナウで過ごし、父を亡くした後はカッセルで学びます。「グリム」という一人の作者がいたのではなく、二人が協力して研究や出版を進めました。", "label": "ハーナウ", "query": "Hanau Germany"}, {"id": "charles-perrault", "field": "background", "paragraph": 0, "text": "シャルル・ペローは1628年1月12日、フランスのパリに生まれました。1651年に弁護士の資格を得た後、財政の仕事をしていた兄のもとで働きます。童話作家として知られていますが、初めから物語だけを書く生活をしていたわけではありません。法律や役所の仕事にも関わりながら、文学の活動へ進んだ人です。", "label": "パリ", "query": "Paris France"}, {"id": "miguel-de-cervantes", "field": "background", "paragraph": 0, "text": "ミゲル・デ・セルバンテスは1547年、スペインのアルカラ・デ・エナーレスに生まれました。9月29日生まれという説はありますが、正確な誕生日は未確定です。記録で確認されるのは10月9日の洗礼です。父は外科の治療を仕事にしていました。少年時代の教育には不明な点もあり、作品の登場人物の経験だけから、通った学校を決めることはできません。", "label": "アルカラ・デ・エナーレス", "query": "Alcalá de Henares Spain"}, {"id": "oscar-wilde", "field": "background", "paragraph": 0, "text": "オスカー・ワイルドは1854年10月16日、アイルランドのダブリンに生まれました。父ウィリアムは医師で、歴史や考古学にも関心を持つ人でした。母ジェーンは詩を書き、外国語の作品を翻訳しました。家庭には芸術や学問に携わる人々が集まっており、ワイルドは文学だけでなく、さまざまな知的活動が身近にある環境で育ちました。", "label": "ダブリン", "query": "Dublin Ireland"}, {"id": "lewis-carroll", "field": "background", "paragraph": 0, "text": "ルイス・キャロルは、1832年1月27日にイギリスのデアズベリで生まれました。本名はチャールズ・ラトウィッジ・ドジソンです。数学の著作では本名を使い、物語ではキャロルという筆名で知られるようになりました。二人の別人ではなく、一人の人が異なる名前で活動していたのです。作中のアリスも、作者本人ではありません。", "label": "デアズベリ", "query": "Daresbury England"}, {"id": "l-frank-baum", "field": "background", "paragraph": 0, "text": "L・フランク・ボームは1856年5月15日、アメリカのニューヨーク州チッテナンゴに生まれました。名前のLはライマンの頭文字です。舞台の仕事や店の経営、新聞の編集などを経験しました。最初から『オズ』だけを書いて暮らしていたのではなく、人に楽しんでもらう仕事や、文章を届ける仕事に広く関わった人です。", "label": "ニューヨーク州チッテナンゴ", "query": "Chittenango New York USA"}, {"id": "robert-louis-stevenson", "field": "background", "paragraph": 0, "text": "ロバート・ルイス・スティーヴンソンは、1850年11月13日、スコットランドのエディンバラに生まれました。家族は灯台を造る技術者として知られていました。1867年にはエディンバラ大学で工学を学び始めます。しかし、本人の関心は文学へ向かっていました。家業の道をそのまま進まず、書く仕事を選んだ作家です。", "label": "エディンバラ", "query": "Edinburgh Scotland"}, {"id": "victor-hugo", "field": "background", "paragraph": 0, "text": "ヴィクトル・ユゴーは1802年2月26日、フランスのブザンソンに生まれました。軍人の父と王党派の母を持ち、若いころから詩や小説を書きます。十五歳で詩のコンクールに評価され、その後は詩人、劇作家、小説家として活動しました。『レ・ミゼラブル』一作だけでなく、複数の文学の分野に足跡を残した人です。", "label": "ブザンソン", "query": "Besançon France"}, {"id": "mary-shelley", "field": "background", "paragraph": 0, "text": "メアリー・シェリーは1797年8月30日、ロンドンに生まれました。父は思想家ウィリアム・ゴドウィン、母は女性の権利を論じた著述家メアリー・ウルストンクラフトです。母は出産後まもなく亡くなりました。娘は文学や歴史、神話に親しみ、フランス語やラテン語も学びます。同じメアリーという名でも、母と『フランケンシュタイン』の作者は別人です。", "label": "ロンドン", "query": "London England"}, {"id": "charles-dickens", "field": "background", "paragraph": 0, "text": "チャールズ・ディケンズは1812年2月7日、イングランドのポーツマスに生まれました。家族がロンドンへ移った後、家計が苦しくなります。少年だったディケンズは学校を離れ、靴墨の容器にラベルを貼る工場で働きました。父も借金のために拘禁されましたが、本人が父と一緒に拘禁されたわけではありません。やがて再び学校へ通う機会を得ました。", "label": "ポーツマス", "query": "Portsmouth England"}, {"id": "arthur-conan-doyle", "field": "background", "paragraph": 0, "text": "アーサー・コナン・ドイルは1859年5月22日、スコットランドのエディンバラに生まれました。1876年から1881年にかけて、エディンバラ大学で医学を学びます。父や親族には絵を描く人がおり、母からは文学や歴史への関心も受け継ぎました。名探偵ホームズを作った人ですが、本人の出発点は探偵ではなく医学生でした。", "label": "エディンバラ", "query": "Edinburgh Scotland"}, {"id": "l-m-montgomery", "field": "background", "paragraph": 0, "text": "L・M・モンゴメリの名は、ルーシー・モード・モンゴメリです。1874年11月30日、カナダのプリンス・エドワード島に生まれました。二歳になる前に母を亡くし、キャヴェンディッシュの母方の祖父母に育てられます。父は西部へ移りました。身近な自然や本、親族の語る話に親しみながら、幼いころから詩や日記を書いていました。", "label": "プリンス・エドワード島", "query": "Prince Edward Island Canada"}, {"id": "mark-twain", "field": "background", "paragraph": 0, "text": "マーク・トウェインは筆名で、本名はサミュエル・ラングホーン・クレメンズです。1835年11月30日、アメリカのミズーリ州フロリダに生まれ、幼い頃にハンニバルへ移りました。ここはミシシッピ川沿いの町でした。川や船が身近にある少年時代の記憶は、のちの小説に生かされます。ただし、物語の主人公を作者本人そのものと考えることはできません。", "label": "ミズーリ州フロリダ", "query": "Florida Missouri USA"}, {"id": "frances-hodgson-burnett", "field": "background", "paragraph": 0, "text": "フランシス・ホジソン・バーネットは1849年、イングランドのマンチェスターに生まれました。父を亡くした後、1865年に家族とアメリカへ渡ります。家計を支えるために文章を書き、十九歳のころから物語を発表しました。後に両国を行き来しながら活動した人で、『小公女』の舞台であるロンドンだけで暮らした作家ではありません。", "label": "マンチェスター", "query": "Manchester England"}, {"id": "jean-webster", "field": "background", "paragraph": 0, "text": "ジーン・ウェブスターは1876年7月24日、アメリカのニューヨーク州フリードニアに生まれました。もとの名はアリス・ジェーン・チャンドラー・ウェブスターです。寄宿学校で同室の生徒もアリスという名だったため、ジーンと名乗るようになったと伝えられています。後に本に記されるジーンは、作家としてだけ突然選んだ名前ではありません。", "label": "ニューヨーク州フリードニア", "query": "Fredonia New York USA"}, {"id": "joseph-jacobs", "field": "background", "paragraph": 0, "text": "ジョセフ・ジェイコブズは1854年8月29日、オーストラリアのシドニーに生まれました。シドニーで学んだ後、イギリスのケンブリッジ大学セント・ジョンズ・カレッジへ進み、ベルリンでも学びました。『ジャックと豆の木』で知られますが、この昔話を最初に作った人という意味の作者ではなく、伝えられてきた話を集め、語り直した人です。", "label": "シドニー", "query": "Sydney Australia"}, {"id": "carlo-collodi", "field": "background", "paragraph": 0, "text": "カルロ・コッローディは1826年11月24日、イタリアのフィレンツェに生まれました。本名はカルロ・ロレンツィーニです。コッローディという筆名は、母ゆかりの村の名からとったもの。本人も幼いころ、その村で過ごしました。『ピノキオ』の作者として知られていますが、子どもの物語を書く前には、新聞や雑誌で長く活動していました。", "label": "フィレンツェ", "query": "Florence Italy"}, {"id": "h-g-wells", "field": "background", "paragraph": 0, "text": "H・G・ウェルズは、1866年9月21日、イギリスのブロムリーに生まれました。名前を略さずに書くと、ハーバート・ジョージ・ウェルズです。裕福ではない家庭に育ち、若いころには服地を扱う商売の見習いも経験しました。後に『タイムマシン』『透明人間』『宇宙戦争』などを発表し、科学の発想を使った物語で広く知られるようになります。", "label": "ブロムリー", "query": "Bromley England"}, {"id": "william-elliot-griffis", "field": "background", "paragraph": 0, "text": "グリフィスは1843年9月17日、アメリカのフィラデルフィアに生まれました。ラトガーズ大学で学び、日本から来た留学生と知り合います。日下部太郎には英語やラテン語を教えました。遠い国だった日本が、実際に話し、学び合う相手のいる場所になっていきます。", "label": "フィラデルフィア", "query": "Philadelphia Pennsylvania USA"}, {"id": "edgar-allan-poe", "field": "background", "paragraph": 0, "text": "エドガー・アラン・ポーは、1809年1月19日にボストンで生まれた作家です。詩や短編小説を書くだけでなく、雑誌の編集や文学批評にも取り組みました。怪奇小説で知られますが、謎を考えて解く探偵小説の発展にも大きな役割を果たしています。", "label": "ボストン", "query": "Boston Massachusetts USA"}, {"id": "rashomon", "field": "summary", "paragraph": 0, "text": "荒廃した京都。主人に暇を出された下人が、雨の降る夕方、羅生門の下で途方に暮れている。生活の当てはなく、このままでは飢え死にする。しかし、盗人になる決心もつかない。", "label": "京都", "query": "京都市"}, {"id": "kokoro", "field": "summary", "paragraph": 0, "text": "物語の初めに語る「私」は、若い学生です。鎌倉で出会った年上の男性を「先生」と呼んで慕い、東京へ戻ってからも家を訪ねます。先生は妻の静と暮らしていますが、人を深く信じようとせず、毎月一人で友人の墓へ通います。親しくなっても、先生は自分の過去をなかなか話してくれません。", "label": "鎌倉", "query": "神奈川県鎌倉市"}, {"id": "lemon", "field": "summary", "paragraph": 0, "text": "語り手の「私」は、得体の知れない重苦しさに悩まされている。病気や借金もあるが、それだけでは言い表せない気分だった。以前は楽しめた音楽や詩にもひかれず、京都の裏通りを歩き回る。ある日、果物店で一個の檸檬を買う。手のひらに伝わる冷たさ、黄色い色、香りや重みを味わううちに、重苦しい気分が少しほどけていく。", "label": "京都", "query": "京都市"}, {"id": "takasebune", "field": "summary", "paragraph": 0, "text": "京都の高瀬川を下る舟で、役人の羽田庄兵衛は、罪人の喜助を見張りながら送り届ける役目についている。喜助は弟殺しの罪で、遠い島へ送られる刑を受けた。それなのに、喜助の表情は穏やかだった。庄兵衛が尋ねると、喜助は、これまで住む所にも食べ物にも困り、金を手元に残せたことがなかったと話す。今は行く場所が決まり、渡された二百文を元手に持てることがうれしいと言う。庄兵衛は、自分の暮らしと比べながら、何をもって足りると感じるのか考え込む。", "label": "高瀬川", "query": "高瀬川 京都"}, {"id": "maihime", "field": "summary", "paragraph": 0, "text": "帰国する船の中で、太田豊太郎はベルリンでの出来事を振り返る。優秀な官吏として派遣された豊太郎は、現地で学ぶうちに自分の関心と官の求めるものが離れ始める。父の葬儀費に困っていた踊り手のエリスを助け、親しくなるが、同郷の人々の告げ口や上司の不興によって職を失う。さらに、日本の母が亡くなった知らせも届く。", "label": "ベルリン", "query": "Berlin Germany"}, {"id": "hitofusanobudo", "field": "summary", "paragraph": 0, "text": "これは、大人になった「僕」が、横浜の学校に通っていた頃を振り返る物語です。絵を描くのが好きだった僕は、海や船の色をうまく出せず、同じ学校の少年ジムが持つ上等な絵の具をうらやんでいました。ある日の昼休み、僕はジムの机から藍と洋紅の二色を盗みます。", "label": "横浜", "query": "神奈川県横浜市"}, {"id": "sanshodayu", "field": "summary", "paragraph": 0, "text": "父を訪ねて旅をする母と、姉の安寿、弟の厨子王は、人を売り買いする者にだまされ、引き離されます。母は佐渡の島へ、姉弟は丹後という土地で多くの人を働かせている山椒大夫のもとへ売られました。姉弟は別の名を付けられ、安寿は塩を作るための海水をくむ仕事、厨子王は燃料にする木の枝を刈る仕事を命じられます。二人は、同じように働かされる人々にも助けられながら、厳しい暮らしに耐えます。", "label": "佐渡", "query": "新潟県佐渡島"}, {"id": "romeoandjuliet", "field": "summary", "paragraph": 0, "text": "イタリアのヴェローナでは、モンタギュー家とキャピュレット家の争いが、街の人々まで巻き込んでいます。モンタギュー家の息子ロミオは、思いを寄せる別の女性に会おうと敵の家の宴へ出かけ、そこでジュリエットと出会います。二人は恋に落ちた後で、相手が敵対する家の子だと知りました。それでも夜の庭で思いを確かめ合います。", "label": "ヴェローナ", "query": "Verona Italy"}, {"id": "wizardofoz", "field": "summary", "paragraph": 0, "text": "カンザスでおじとおばに育てられているドロシーは、犬のトトと家ごと竜巻に運ばれ、不思議なオズの国へ着きます。落ちた家の下敷きになったのは、住民を苦しめていた東の悪い魔女でした。ドロシーは魔女の銀の靴を受け取り、北の善い魔女から、エメラルドの都のオズなら帰る方法を知っているかもしれないと教えられます。", "label": "カンザス", "query": "Kansas USA"}, {"id": "frankenstein", "field": "summary", "paragraph": 0, "text": "北極を目指す探検家ウォルトンは、氷の海で衰弱した男を救います。男の名はヴィクター・フランケンシュタイン。彼は自分が追う存在について、これまでの人生を語り始めました。ジュネーヴの家庭に育ったヴィクターは、インゴルシュタットで科学を学び、生命の秘密に取りつかれます。長い研究の末、大きな人間の姿をした存在に命を与えました。しかし動き出した姿を恐れ、自分の創造物を置き去りにして逃げてしまいます。", "label": "ジュネーヴ", "query": "Geneva Switzerland"}, {"id": "little-princess", "field": "summary", "paragraph": 0, "text": "七歳のセーラ・クルーは、インドで暮らす父ラルフに連れられ、ロンドンのミンチン先生の寄宿学校へ入ります。母はすでに亡くなっていました。裕福な父は、娘の部屋や服、人形を十分に用意してからインドへ帰ります。セーラは父との別れを寂しく思いながらも、本や物語を楽しみ、友達を作っていきます。", "label": "ロンドン", "query": "London England"}, {"id": "nogiku-no-haka", "field": "summary", "paragraph": 0, "text": "政夫は、十年余り前の忘れられない恋を振り返ります。矢切の家にいたころ、病気の母を手伝いに来ていた親類の民子と、とても仲よくしていました。当時の年の数え方では政夫が十五、民子が十七。本文は、今の満年齢なら政夫は十三歳何か月、民子は十五歳を少し過ぎたころとも説明します。周囲は二人の仲をうわさし、母も民子に政夫へ近づかないよう注意します。", "label": "矢切", "query": "千葉県松戸市矢切"}, {"id": "mikan", "field": "summary", "paragraph": 0, "text": "曇った冬の夕方、横須賀から出る汽車の二等客車に「私」が座っています。疲れ切った「私」には、窓の外も人生も、暗く退屈に感じられます。発車の直前、十三、四歳ほどの少女が乗り込み、向かいの席に座ります。少女は大きな風呂敷包みを抱え、三等の赤い切符を握っています。", "label": "横須賀", "query": "神奈川県横須賀市"}, {"id": "kanikosen", "field": "summary", "paragraph": 0, "text": "北海道の函館から、蟹工船の博光丸がカムチャツカへ向かおうとしています。蟹工船は、小型の川崎船で捕った蟹を船内で缶詰にする、海に浮かぶ工場です。集まったのは、東北の貧しい農村から来た人、炭鉱や工場を渡り歩いた人、仕事の紹介を頼った学生出身者など、事情の異なる労働者たちでした。十四、五歳ほどの少年たちも雑夫として乗り込みます。出港前、母親が息子に食べ物を与えたり、漁夫が妻に金を渡したりする姿には、それぞれの陸の暮らしが残っています。", "label": "函館", "query": "北海道函館市"}, {"id": "yabunonaka", "field": "summary", "paragraph": 0, "text": "山科の山道から離れた、竹と杉の生える藪で、一人の男が死んでいるのが見つかります。作品は、その事件について語る七つの話からできています。最初の四つは、当時の取り締まりや裁きを担う役人、検非違使に問われた人々の話です。続いて、盗人の白状、女の懺悔、巫女を通した死者の語りが並びます。全体を説明して真相を教えてくれる語り手は登場しません。", "label": "山科", "query": "京都市山科区"}, {"id": "sanshiro", "field": "summary", "paragraph": 0, "text": "小川三四郎は、熊本の高等学校を卒業し、東京の大学へ向かう二十三歳の青年です。途中で知り合った女性との接し方が分からず、別れ際に度胸がないと言われます。その後、汽車で隣り合ったひげのある男は、日本の将来まで遠慮なく批判します。故郷では聞かなかった話に、三四郎は驚きます。この男が、後に親しくなる広田先生でした。", "label": "熊本", "query": "熊本市"}, {"id": "fugaku-hyakkei", "field": "summary", "paragraph": 0, "text": "語り手の「私」は、富士山を無条件にほめる人ではありません。絵に描かれた富士と実際の形を比べ、東京から見た富士には苦しい思い出も重ねます。1938年の初秋、心を改めようと山梨へ旅立ち、作家の井伏鱒二が仕事をしている御坂峠の天下茶屋を訪れます。ここに滞在することになりますが、富士と河口湖が整って見える景色は、出来すぎた絵のようで好きになれません。", "label": "御坂峠", "query": "御坂峠 山梨県"}, {"id": "kaze-tachinu", "field": "summary", "paragraph": 1, "text": "出会いから二年近くたった春、二人は婚約しています。病気を抱えた節子は、山のサナトリウムという療養施設へ行くことを望み、「私」も付き添うと決めます。医師から病状を詳しく聞いた「私」は不安になりますが、節子もその気持ちを察します。四月下旬、父に見送られた二人は、八ヶ岳のふもとの療養所へ出発します。", "label": "八ヶ岳", "query": "八ヶ岳"}, {"id": "majutsu", "field": "summary", "paragraph": 3, "text": "場面は、魔術を習ってから一か月ほど後の銀座のクラブへ移ります。「私」は五、六人の友人に頼まれ、暖炉の燃える石炭を手ですくい、床へまきます。すると石炭は金貨に変わり、床へ降り注ぎます。友人たちは大金に驚きますが、「私」は欲を出すと魔術を使えなくなるので、見せ終えたら暖炉へ戻すつもりだと話します。", "label": "銀座", "query": "東京都中央区銀座"}, {"id": "inutofue", "field": "summary", "paragraph": 2, "text": "数日後、髪長彦は道で二人の若い侍に会い、飛鳥の大臣の二人の娘がさらわれたと聞きます。侍たちは姫を捜していますが、木こりと犬たちを見下して去ります。髪長彦が白犬に捜させると、姉は生駒山の食蜃人という悪者に捕まっていると分かりました。髪長彦は白犬と斑犬を抱え、黒犬の背に乗って飛んでいきます。", "label": "生駒山", "query": "生駒山"}, {"id": "shayo", "field": "summary", "paragraph": 0, "text": "語り手のかず子は二十九歳。離婚し、子を死産した経験を持つ、かつての華族の娘です。父は十年前に亡くなり、家の財産は母の弟である和田の叔父が管理していました。敗戦で暮らしが立ちゆかなくなった一家は、東京の西片町の家を売り、母とかず子の二人で伊豆の山荘へ移ります。弟の直治は南方に出征したまま消息が分からず、母は食卓でも息子を思い、胸を痛めています。", "label": "伊豆", "query": "伊豆半島"}, {"id": "shakespeare", "field": "background", "paragraph": 2, "text": "1582年、18歳でアン・ハサウェイと結婚し、やがて三人の子どもを持ちました。家族は故郷で暮らします。一方、彼がいつロンドンへ移り、どう演劇の仕事を始めたのかは、はっきりしません。1585年から1592年ごろの活動には記録の空白があります。1592年には、ロンドンで俳優・劇作家として知られていたことが確認できます。", "label": "ロンドン", "query": "London England"}, {"id": "dostoevsky", "field": "background", "paragraph": 3, "text": "社会制度や思想を話し合うペトラシェフスキーの集まりなどに参加し、1849年に逮捕されました。死刑を言い渡されますが、刑は変更され、オムスクで四年間の強制労働、その後はセミパラチンスクでの軍務を経験します。作家としての歩みは長く中断されました。のちに発表した『死の家の記録』を読むうえでも、この服役歴は重要な背景になります。ただし、小説の出来事をすべて本人の実体験と同一視はできません。", "label": "オムスク", "query": "Omsk Russia"}, {"id": "andersen", "field": "background", "paragraph": 1, "text": "1819年、十四歳のアンデルセンは故郷を離れ、コペンハーゲンへ向かいます。初めから童話作家を目指していたのではなく、俳優や歌手、踊り手として劇場で活躍したかったのです。しかし、なかなか道は開けませんでした。舞台への挑戦は成功しませんでしたが、劇場とのつながりは、その後の学びを支える人々との出会いにつながりました。", "label": "コペンハーゲン", "query": "Copenhagen Denmark"}, {"id": "andersen", "field": "background", "paragraph": 2, "text": "劇場の運営に関わるヨナス・コリンの助けで、1822年から学校へ通います。スラーエルセ、ヘルシンゲルで学んだあと、コペンハーゲンで個人授業を受け、1828年に大学入学資格の試験に合格しました。舞台の仕事に挑戦したあと、もう一度勉強する道を通って、文学を書くための言葉や知識を身につけていきました。", "label": "スラーエルセ", "query": "Slagelse Denmark"}, {"id": "andersen", "field": "background", "paragraph": 2, "text": "劇場の運営に関わるヨナス・コリンの助けで、1822年から学校へ通います。スラーエルセ、ヘルシンゲルで学んだあと、コペンハーゲンで個人授業を受け、1828年に大学入学資格の試験に合格しました。舞台の仕事に挑戦したあと、もう一度勉強する道を通って、文学を書くための言葉や知識を身につけていきました。", "label": "ヘルシンゲル", "query": "Helsingor Denmark"}, {"id": "brothers-grimm", "field": "background", "paragraph": 0, "text": "グリム兄弟とは、兄のヤーコプと弟のヴィルヘルムです。ヤーコプは1785年、ヴィルヘルムは1786年に、現在のドイツにあるハーナウで生まれました。幼い頃をシュタイナウで過ごし、父を亡くした後はカッセルで学びます。「グリム」という一人の作者がいたのではなく、二人が協力して研究や出版を進めました。", "label": "カッセル", "query": "Kassel Germany"}, {"id": "brothers-grimm", "field": "background", "paragraph": 4, "text": "1837年、兄弟は他の教授たちとともに、国王による憲法の廃止に抗議して大学を追われました。その後、ベルリンで研究を続け、ドイツ語辞典の編纂にも取り組みます。ヴィルヘルムは1859年、ヤーコプは1863年に亡くなりました。二人の生前に辞典全体は完成せず、後の人々へ仕事が引き継がれました。", "label": "ベルリン", "query": "Berlin Germany"}, {"id": "miguel-de-cervantes", "field": "background", "paragraph": 1, "text": "若いころイタリアへ渡り、兵士になりました。1571年のレパントの海戦で負傷し、左手の自由を失います。1575年、スペインへ帰る途中の船が襲われ、北アフリカのアルジェで捕らわれの身になりました。何度か脱出を試みた末、1580年に身代金で解放されます。自由を奪われた経験は、後の戯曲や小説を考える重要な背景です。", "label": "アルジェ", "query": "Algiers Algeria"}, {"id": "miguel-de-cervantes", "field": "background", "paragraph": 4, "text": "晩年にも短編小説や戯曲を発表し、最後の長編『ペルシーレスとシヒスムンダの苦難』は死後の1617年に刊行されました。セルバンテスがマドリードで亡くなったのは1616年4月22日です。翌23日は埋葬の日で、記録の日付を死亡日と取り違えない注意が必要です。作品が完成した時、本になった時、作者が生きた時を分けてたどりましょう。", "label": "マドリード", "query": "Madrid Spain"}, {"id": "oscar-wilde", "field": "background", "paragraph": 2, "text": "卒業後はロンドンを拠点にし、詩集の出版や北米での講演、雑誌の編集などに取り組みました。1888年には『幸福な王子 その他の物語』を刊行します。小説『ドリアン・グレイの肖像』や、舞台で演じるための喜劇でも知られています。童話だけの作家ではなく、文章の形や読者を変えながら、美しさや人間社会について表現した作家でした。", "label": "ロンドン", "query": "London England"}, {"id": "l-frank-baum", "field": "background", "paragraph": 1, "text": "1888年、家族とともに、現在のサウスダコタ州にあるアバディーンへ移りました。そこで開いた店は、地域の不景気の中でうまくいかなくなります。その後は新聞を編集しましたが、1891年に一家はシカゴへ移りました。商売と暮らしを立て直そうとする経験があり、作家としての成功までには回り道がありました。", "label": "アバディーン", "query": "Aberdeen South Dakota USA"}, {"id": "l-frank-baum", "field": "background", "paragraph": 1, "text": "1888年、家族とともに、現在のサウスダコタ州にあるアバディーンへ移りました。そこで開いた店は、地域の不景気の中でうまくいかなくなります。その後は新聞を編集しましたが、1891年に一家はシカゴへ移りました。商売と暮らしを立て直そうとする経験があり、作家としての成功までには回り道がありました。", "label": "シカゴ", "query": "Chicago Illinois USA"}, {"id": "robert-louis-stevenson", "field": "background", "paragraph": 4, "text": "1888年から家族と太平洋の島々を巡り、1890年にはサモアのウポル島に土地を買いました。そこで暮らしながら書き続け、地域の政治にも関わります。晩年の文章は、勢力を競う欧米の国々がサモアの文化に及ぼす影響にも目を向けています。単なる「南の楽園での隠居」ではありません。1894年12月3日、44歳で亡くなりました。", "label": "ウポル島", "query": "Upolu Samoa"}, {"id": "victor-hugo", "field": "background", "paragraph": 2, "text": "政治上の立場は生涯同じではありません。若いころは王政を支持し、1845年には貴族院議員となりましたが、後には共和政を支持する側へ移ります。1851年のルイ＝ナポレオンによるクーデターに反対し、国外へ逃れました。ベルギー、ジャージー島、ガーンジー島へと移った亡命生活は1870年まで続きます。初めから同じ信念を貫いた、と単純にはまとめられません。", "label": "ジャージー島", "query": "Jersey Channel Islands"}, {"id": "victor-hugo", "field": "background", "paragraph": 2, "text": "政治上の立場は生涯同じではありません。若いころは王政を支持し、1845年には貴族院議員となりましたが、後には共和政を支持する側へ移ります。1851年のルイ＝ナポレオンによるクーデターに反対し、国外へ逃れました。ベルギー、ジャージー島、ガーンジー島へと移った亡命生活は1870年まで続きます。初めから同じ信念を貫いた、と単純にはまとめられません。", "label": "ガーンジー島", "query": "Guernsey Channel Islands"}, {"id": "mary-shelley", "field": "background", "paragraph": 2, "text": "1816年夏、ジュネーヴ湖の近くに滞在していたメアリーたちは、詩人バイロンの提案で怖い物語を書くことになりました。十八歳の彼女が小説を構想するきっかけです。しかし、一晩で長編が完成したわけではありません。有名な夢の話は1831年の序文で振り返られたもので、当夜の会話や着想の日付を細部まで確定するのは避けたいところです。", "label": "ジュネーヴ湖", "query": "Lake Geneva Switzerland France"}, {"id": "charles-dickens", "field": "background", "paragraph": 0, "text": "チャールズ・ディケンズは1812年2月7日、イングランドのポーツマスに生まれました。家族がロンドンへ移った後、家計が苦しくなります。少年だったディケンズは学校を離れ、靴墨の容器にラベルを貼る工場で働きました。父も借金のために拘禁されましたが、本人が父と一緒に拘禁されたわけではありません。やがて再び学校へ通う機会を得ました。", "label": "ロンドン", "query": "London England"}, {"id": "arthur-conan-doyle", "field": "background", "paragraph": 2, "text": "船の医師として働いた後、1882年にはポーツマスのサウスシーで診療を始めました。そのかたわら物語を書き続け、1887年の『緋色の研究』でホームズを登場させます。1891年に短編が人気を得ると、執筆を主な仕事にしていきました。作中の医師ワトソンにも医学の知識が生かされていますが、ワトソンをそのまま作者の自伝上の姿とは考えません。", "label": "サウスシー", "query": "Southsea Portsmouth England"}, {"id": "l-m-montgomery", "field": "background", "paragraph": 4, "text": "1911年に牧師ユーアン・マクドナルドと結婚し、オンタリオ州へ移りました。その後も家庭を営みながら、小説や短編、詩を書き続けます。アンの物語以外にも作品があり、日記や多くの手紙も残しました。島は長く作品の大切な舞台であり続けます。1942年4月24日、トロントで亡くなり、故郷キャヴェンディッシュに葬られました。", "label": "トロント", "query": "Toronto Ontario Canada"}, {"id": "mark-twain", "field": "background", "paragraph": 0, "text": "マーク・トウェインは筆名で、本名はサミュエル・ラングホーン・クレメンズです。1835年11月30日、アメリカのミズーリ州フロリダに生まれ、幼い頃にハンニバルへ移りました。ここはミシシッピ川沿いの町でした。川や船が身近にある少年時代の記憶は、のちの小説に生かされます。ただし、物語の主人公を作者本人そのものと考えることはできません。", "label": "ハンニバル", "query": "Hannibal Missouri USA"}, {"id": "mark-twain", "field": "background", "paragraph": 0, "text": "マーク・トウェインは筆名で、本名はサミュエル・ラングホーン・クレメンズです。1835年11月30日、アメリカのミズーリ州フロリダに生まれ、幼い頃にハンニバルへ移りました。ここはミシシッピ川沿いの町でした。川や船が身近にある少年時代の記憶は、のちの小説に生かされます。ただし、物語の主人公を作者本人そのものと考えることはできません。", "label": "ミシシッピ川", "query": "Mississippi River USA"}, {"id": "frances-hodgson-burnett", "field": "background", "paragraph": 4, "text": "イギリスで借りたメイサム・ホールの庭は、『秘密の花園』を考える手がかりになりました。この作品は1911年に出版されています。バーネットはアメリカの市民権も取得し、1924年、ニューヨークのロングアイランドで亡くなりました。暮らした場所から着想を得ても、物語の出来事をそのまま本人の実体験と考えることはできません。", "label": "ロングアイランド", "query": "Long Island New York USA"}, {"id": "edgar-allan-poe", "field": "background", "paragraph": 2, "text": "1835年、ポーはリッチモンドの雑誌で編集の仕事に就きました。その後、フィラデルフィアやニューヨークでも活動します。創作と批評は、互いに関わる仕事でもありました。自分でも物語を組み立てながら、ほかの作品が読者にどんな印象を与えるのかを考え続けました。", "label": "フィラデルフィア", "query": "Philadelphia Pennsylvania USA"}, {"id": "edgar-allan-poe", "field": "background", "paragraph": 2, "text": "1835年、ポーはリッチモンドの雑誌で編集の仕事に就きました。その後、フィラデルフィアやニューヨークでも活動します。創作と批評は、互いに関わる仕事でもありました。自分でも物語を組み立てながら、ほかの作品が読者にどんな印象を与えるのかを考え続けました。", "label": "ニューヨーク", "query": "New York City New York USA"}, {"id": "edgar-allan-poe", "field": "background", "paragraph": 7, "text": "ポーは1849年10月7日、ボルティモアで40年の生涯を閉じました。死に至った詳しい事情には未解明の点があり、特定の説を確定した事実のようには扱えません。恐ろしい物語を書いたからといって、作中の犯罪や語り手の心理を、作者の実体験として読むことも避けたいところです。", "label": "ボルティモア", "query": "Baltimore Maryland USA"}, {"id": "romeoandjuliet", "field": "summary", "paragraph": 2, "text": "ところが、ジュリエットのいとこティボルトがロミオに決闘を挑みます。結婚によって親族になったロミオは争いを避けますが、事情を知らない友人マキューシオが代わりに剣を抜き、命を落としました。怒ったロミオはティボルトを殺し、街から追放されます。二人は一夜を共にした後、夜明けに別れ、ロミオはマントヴァへ向かいます。", "label": "マントヴァ", "query": "Mantua Italy"}, {"id": "donquixote", "field": "summary", "paragraph": 0, "text": "スペインのラ・マンチャ地方に暮らす郷士は、騎士道物語を読みふけるうちに、本の中の冒険を現実だと信じるようになります。自分をドン・キホーテと名づけ、やせた馬ロシナンテに乗って、悪を倒し弱い人を助ける旅へ出ます。近くの村の女性も、心の中では高貴な姫ドゥルシネーアです。最初の旅で傷ついて戻っても懲りず、今度は農民サンチョ・パンサを従者に誘います。サンチョは、いつか島を治める役目をもらえるという約束に期待してついていきます。", "label": "ラ・マンチャ地方", "query": "La Mancha Spain"}, {"id": "donquixote", "field": "summary", "paragraph": 3, "text": "やがてドン・キホーテはバルセロナで、白月の騎士との勝負に敗れ、一年間冒険をやめて故郷へ帰ると約束します。相手の正体は、彼を家で休ませようと変装した知人サンソン・カラスコでした。帰郷した彼は病気になり、騎士道物語への思い込みから覚めます。本名のアロンソ・キハーノとして遺言を作り、サンチョに謝ります。サンチョはまた一緒に野へ出ようと励ましますが、彼は家族や友人に見守られながら亡くなります。", "label": "バルセロナ", "query": "Barcelona Spain"}, {"id": "frankenstein", "field": "summary", "paragraph": 0, "text": "北極を目指す探検家ウォルトンは、氷の海で衰弱した男を救います。男の名はヴィクター・フランケンシュタイン。彼は自分が追う存在について、これまでの人生を語り始めました。ジュネーヴの家庭に育ったヴィクターは、インゴルシュタットで科学を学び、生命の秘密に取りつかれます。長い研究の末、大きな人間の姿をした存在に命を与えました。しかし動き出した姿を恐れ、自分の創造物を置き去りにして逃げてしまいます。", "label": "インゴルシュタット", "query": "Ingolstadt Germany"}, {"id": "christmas-carol", "field": "summary", "paragraph": 0, "text": "舞台はロンドン。金もうけを何より大事にする老人スクルージは、クリスマスにも人を寄せつけません。事務員ボブ・クラチットには少ない給料しか払わず、暖房の石炭も惜しみます。甥のフレッドからの食事の誘いも、貧しい人のための寄付も断りました。その夜、七年前に死んだ商売仲間のマーレイが幽霊となって現れます。マーレイは、生前に人を助けなかったことを悔やみ、スクルージにはまだ生き方を変える機会があると告げます。", "label": "ロンドン", "query": "London England"}, {"id": "anne-green-gables", "field": "summary", "paragraph": 0, "text": "カナダのプリンス・エドワード島。農場「グリーン・ゲイブルズ」で暮らすマシュウとマリラは、年を取った兄と妹です。二人は農作業を手伝う男の子を迎えるつもりでした。ところが、伝言が食い違い、駅で待っていたのは十一歳の少女アンです。迎えに来たマシュウは、よく話し、景色に心を躍らせるアンに親しみを感じ、家へ連れ帰ります。", "label": "プリンス・エドワード島", "query": "Prince Edward Island Canada"}, {"id": "tom-sawyer", "field": "summary", "paragraph": 0, "text": "アメリカのミシシッピ川沿いの町で、少年トムは、亡くなった母の姉妹であるポリーおばさんに育てられています。学校や決まり事より遊びが好きで、叱られてばかりです。ある土曜日、罰として塀を白く塗るよう言われると、わざと面白そうに働きます。友達は自分もやりたくなり、品物を渡して順番を待つようになりました。トムには、退屈な仕事さえ冒険に変えてしまう知恵があります。", "label": "ミシシッピ川", "query": "Mississippi River USA"}, {"id": "arishima-takeo", "field": "background", "paragraph": 4, "text": "武郎は北海道に農場を持つ立場でもありました。1922年には、借りた土地を耕して暮らす人々が土地を共同で持つことを前提に、農場を無償で手放すと宣言します。考えを文章にするだけでなく、自分の財産をどう扱うかにも向き合った出来事です。翌1923年6月9日、軽井沢で45歳の生涯を終えました。", "label": "軽井沢", "query": "長野県軽井沢町"}, {"id": "kajii-motojiro", "field": "background", "paragraph": 3, "text": "1926年、体調が悪くなり、療養のため伊豆の湯ヶ島へ向かいました。そこで川端康成や広津和郎らと交流し、創作を続けます。病気は生活や進学に影響しましたが、梶井の歩みには、同人誌の仲間や療養先で出会った文学者とのつながりもありました。病気の作家という一面だけでは、その活動全体を捉えきれません。", "label": "湯ヶ島", "query": "静岡県伊豆市湯ケ島"}, {"id": "fukuzawa-yukichi", "field": "background", "paragraph": 0, "text": "福澤諭吉は1835年1月10日、大阪にあった中津藩の蔵屋敷で生まれました。父を幼くして失い、家族と中津へ移って育ちます。漢学を学んだ後、長崎でオランダ語を学び、大阪では緒方洪庵の適塾で勉強を続けました。", "label": "長崎", "query": "長崎県長崎市"}, {"id": "obata-tokujiro", "field": "background", "paragraph": 4, "text": "小幡は1905年に亡くなりました。中津に図書館をつくりたいという願いがあり、遺言によって生家と蔵書の半分が寄贈されます。1909年には中津図書館が開館しました。現在の中津市立小幡記念図書館につながる歩みです。", "label": "中津", "query": "大分県中津市"}, {"id": "matsuo-basho", "field": "background", "paragraph": 1, "text": "1672年ごろに江戸へ移り、俳諧を教える立場にもなりました。1680年には深川の庵へ移ります。庵は火事で焼けたこともあり、同じ建物に住み続けたわけではありません。芭蕉の暮らしや旅は、弟子や知人たちの助けと結びついていました。", "label": "深川", "query": "東京都江東区 深川"}, {"id": "ishikawa-takuboku", "field": "background", "paragraph": 0, "text": "石川啄木は1886年2月20日、岩手県の日戸村、現在の盛岡市に生まれました。本名は石川一といい、「一」は「はじめ」と読みます。幼いころに家族で渋民へ移り、そこで育ちました。盛岡の中学校へ進んだ後、文学に強く引かれるようになります。\n生まれた場所は日戸の常光寺、育った場所は翌年に移った渋民の宝徳寺です。1898年に入った盛岡尋常中学校は、のちの盛岡中学校、現在の盛岡第一高校につながる学校です。", "label": "盛岡市", "query": "岩手県盛岡市"}];
function geographicBodyText(x,field,index,value,render){
 const rules=geographicLinkRegistry.filter(r=>r.id===x.id&&r.field===field&&r.paragraph===index&&r.text===value);
 const hits=rules.map(r=>({...r,at:value.indexOf(r.label)})).filter(r=>r.at>=0).sort((a,b)=>a.at-b.at||b.label.length-a.label.length);
 let output='',at=0;
 for(const r of hits){if(r.at<at)continue;output+=render(value.slice(at,r.at));const url='https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(r.query);output+='<a class="inline-work-link geographic-map-link" href="'+esc(url)+'" target="_blank" rel="noopener noreferrer" aria-label="'+esc(r.label)+'の位置をGoogle マップで見る（新しいタブ）">'+render(r.label)+'</a>';at=r.at+r.label.length}
 return output+render(value.slice(at));
}
function geographicBackgroundBodyText(x,b,index){
 if(!geographicLinkRegistry.some(r=>r.id===x.id&&r.field==='background'&&r.paragraph===index&&r.text===b.text))return personBirthPlaceBodyText(x,b);
 return geographicBodyText(x,'background',index,b.text,t=>bodyText(x,t));
}
const personBackground={"soseki": [{"title": "生まれたところ", "text": "1867年2月9日、江戸の牛込馬場下横町に生まれました。今の東京都新宿区喜久井町にあたります。本名は夏目金之助です。", "sources": [{"title": "新宿区立漱石山房記念館「漱石の生涯」", "url": "https://soseki-museum.jp/soseki-natsume/sosekis-life/"}, {"title": "国立国会図書館「近代日本人の肖像」夏目漱石", "url": "https://www.ndl.go.jp/portrait/datas/307/"}]}, {"title": "育ったところ", "text": "幼いころは四谷の塩原家の養子となり、のちに牛込の実家へ戻りました。東京で学び、大学では英文学を専攻します。子供時代に暮らした家や家族との関係には、変化がありました。", "sources": [{"title": "新宿区立漱石山房記念館「漱石の生涯」", "url": "https://soseki-museum.jp/soseki-natsume/sosekis-life/"}]}, {"title": "教師から、小説を書く人へ", "text": "1893年に帝国大学を卒業し、松山や熊本で教師を務めました。1900年から英国へ留学。帰国後は大学で英語を教えながら、『吾輩は猫である』を発表しました。小説家になる前にも、学び、教える時間がありました。", "sources": [{"title": "新宿区立漱石山房記念館「漱石の生涯」", "url": "https://soseki-museum.jp/soseki-natsume/sosekis-life/"}, {"title": "国立国会図書館「近代日本人の肖像」夏目漱石", "url": "https://www.ndl.go.jp/portrait/datas/307/"}, {"title": "東北大学附属図書館：漱石の生涯", "url": "https://www.library.tohoku.ac.jp/en/collections/soseki/about.html"}, {"title": "東北大学附属図書館：漱石年表", "url": "https://www.library.tohoku.ac.jp/en/collections/soseki/chronology.html"}, {"title": "漱石山房記念館：作品紹介", "url": "https://soseki-museum.jp/eng/soseki-natsume/work-introduction/"}], "diagram": {"src": "assets/soseki-teaching-writing.webp", "alt": "夏目漱石の仕事と執筆の年表。1900年に英国留学、1903年に帰国して大学などで教え、1905年に教師として働きながら『吾輩は猫である』の発表を始めた。1907年に教職を辞めて東京朝日新聞社へ入り、創作に専念した。", "caption": "教師として働く時期と、小説を書く時期は重なっています。年の間隔は実際の長さに比例しません。", "width": 1080, "height": 2040, "sourceNote": "公式資料をもとにした独自の年表です。"}}, {"title": "つながりのある人", "text": "学生時代から正岡子規と親しくなり、俳句を学びました。後年には、若い芥川龍之介の『鼻』を高く評価しています。先輩から学ぶ側だった漱石も、次の世代を励ます存在になりました。", "sources": [{"title": "新宿区立漱石山房記念館「漱石の生涯」", "url": "https://soseki-museum.jp/soseki-natsume/sosekis-life/"}, {"title": "国立国会図書館「近代日本人の肖像」芥川龍之介", "url": "https://www.ndl.go.jp/portrait/datas/224/"}]}, {"title": "新聞社で小説を書き続ける", "text": "1907年に東京朝日新聞社へ入り、創作に専念します。『三四郎』『それから』『門』『こころ』などを発表しました。教師だった時期と、職業として小説を書くようになった時期を分けると、歩みがつかみやすくなります。", "sources": [{"title": "新宿区立漱石山房記念館「漱石の生涯」", "url": "https://soseki-museum.jp/soseki-natsume/sosekis-life/"}, {"title": "国立国会図書館「近代日本人の肖像」夏目漱石", "url": "https://www.ndl.go.jp/portrait/datas/307/"}]}, {"title": "最後の作品", "text": "1916年12月9日、49歳で亡くなりました。最後の長編小説『明暗』は、書き終わらないまま残されました。『こころ』だけが晩年の作品というわけではなく、その後にも創作は続いていました。", "sources": [{"title": "新宿区立漱石山房記念館「漱石の生涯」", "url": "https://soseki-museum.jp/soseki-natsume/sosekis-life/"}, {"title": "国立国会図書館「近代日本人の肖像」夏目漱石", "url": "https://www.ndl.go.jp/portrait/datas/307/"}]}], "kenji": [{"title": "生まれたところ", "text": "1896年8月27日、岩手県の花巻川口町に生まれました。今の花巻市豊沢町にあたります。家は質屋と古着商を営んでいました。作品で親しんだ自然だけでなく、町の暮らしも身近にありました。", "sources": [{"title": "花巻市「宮沢賢治について」", "url": "https://www.city.hanamaki.iwate.jp/miyazawakenji/about_kenji/"}, {"title": "国立国会図書館「近代日本人の肖像」宮沢賢治", "url": "https://www.ndl.go.jp/portrait/datas/4318/"}]}, {"title": "育ったところと、好きだったもの", "text": "花巻で育ち、1909年に盛岡中学校へ入学しました。少年時代から鉱物や植物の採集に親しみ、のちに盛岡高等農林学校で学びます。自然を眺めるだけでなく、調べ、名前や仕組みを知ることにも関心を向けていました。", "sources": [{"title": "花巻市「宮沢賢治年譜」", "url": "https://www.city.hanamaki.iwate.jp/miyazawakenji/about_kenji/1003946.html"}]}, {"title": "書きはじめたころ", "text": "15歳ごろから短歌を作り、1917年には仲間と同人誌『アザリア』を創刊しました。詩や童話へと、書くものを広げていきます。最初から、今よく知られる童話だけを書いていたわけではありません。", "sources": [{"title": "花巻市「宮沢賢治年譜」", "url": "https://www.city.hanamaki.iwate.jp/miyazawakenji/about_kenji/1003946.html"}, {"title": "花巻市「賢治と文学」", "url": "https://www.city.hanamaki.iwate.jp/miyazawakenji/about_kenji/1003947.html"}]}, {"title": "学校の先生として", "text": "1921年に花巻の農学校の教師となりました。授業だけでなく、詩や曲を作ったり、生徒と劇を上演したりする活動にも取り組みました。農業を学ぶことと、表現する楽しさを、学校の暮らしの中で結びつけていました。", "sources": [{"title": "花巻市「宮沢賢治年譜」", "url": "https://www.city.hanamaki.iwate.jp/miyazawakenji/about_kenji/1003946.html"}, {"title": "花巻市「賢治と文学」", "url": "https://www.city.hanamaki.iwate.jp/miyazawakenji/about_kenji/1003947.html"}]}, {"title": "生きている間に出した二冊", "text": "1924年に『春と修羅』と童話集『注文の多い料理店』を刊行しました。生前に出版した本は、この二冊です。妹トシとの別れを詠んだ『永訣の朝』など、人との関わりも作品に残されています。『銀河鉄道の夜』は没後に発表された作品です。", "sources": [{"title": "花巻市「宮沢賢治について」", "url": "https://www.city.hanamaki.iwate.jp/miyazawakenji/about_kenji/"}, {"title": "花巻市「宮沢賢治年譜」", "url": "https://www.city.hanamaki.iwate.jp/miyazawakenji/about_kenji/1003946.html"}, {"title": "花巻市「賢治と文学」", "url": "https://www.city.hanamaki.iwate.jp/miyazawakenji/about_kenji/1003947.html"}, {"title": "岩手県立図書館：銀河鉄道の夜の第三次稿と刊行資料", "url": "https://crd.ndl.go.jp/reference/detail?page=ref_view&id=1000176827"}, {"title": "国立国会図書館国際子ども図書館：宮沢賢治", "url": "https://www.kodomo.go.jp/jcl/person/miyazawa.html"}], "diagram": {"src": "assets/kenji-books-manuscripts.webp", "alt": "宮沢賢治の刊行時期を比べる図。『春と修羅』と童話集『注文の多い料理店』は1924年に刊行。ほかにも生前の新聞・雑誌発表がある。書き直しを重ねた『銀河鉄道の夜』の原稿は、1933年の死後、1934年の全集第3巻に掲載された。この版は現在一般に読まれる本文と同一ではない。", "caption": "生前に刊行した本と、残された原稿が没後に刊行された例を比べています。『銀河鉄道の夜』の1934年版と現在一般に読まれる本文は異なります。本や原稿の実物を再現した図ではありません。", "width": 1080, "height": 2370}}, {"title": "農業と芸術を、暮らしのそばへ", "text": "1926年に農学校を退職し、羅須地人協会を設立しました。肥料の相談や農業指導をしながら、音楽や文学にも取り組みます。1933年9月21日、37歳で亡くなりました。作品を書くことだけでなく、人々の暮らしを支えようとした歩みもあります。", "sources": [{"title": "花巻市「宮沢賢治年譜」", "url": "https://www.city.hanamaki.iwate.jp/miyazawakenji/about_kenji/1003946.html"}, {"title": "国立国会図書館「近代日本人の肖像」宮沢賢治", "url": "https://www.ndl.go.jp/portrait/datas/4318/"}]}], "shakespeare": [{"title": "生まれ育ったのは、イングランドの町", "text": "シェイクスピアは1564年、イングランドのストラトフォード・アポン・エイヴォンで生まれました。父ジョンは手袋職人で、町の行政にも携わった人です。誕生日は4月23日として祝われますが、正確な日は分かっていません。記録で確かなのは、4月26日に地元の教会で洗礼を受けたことです。", "sources": [{"title": "Shakespeare Birthplace Trust：誕生と洗礼記録", "url": "https://www.shakespeare.org.uk/explore-shakespeare/shakespedia/william-shakespeare/when-was-shakespeare-born/"}, {"title": "Shakespeare Birthplace Trust：伝記", "url": "https://www.shakespeare.org.uk/explore-shakespeare/shakespedia/william-shakespeare/william-shakespeare-biography/"}]}, {"title": "言葉と古典に触れる学び", "text": "地元のグラマースクールで学んだと考えられていますが、本人の在学記録が残っているわけではありません。当時の学校ではラテン語や古典作品を重視し、劇を扱う学習もありました。大学に通った記録もありません。作品に古代の詩や歴史が現れることと、確かな学歴が分かることとは、分けて考える必要があります。", "sources": [{"title": "Shakespeare Birthplace Trust：教育", "url": "https://www.shakespeare.org.uk/explore-shakespeare/shakespedia/william-shakespeare/shakespeares-school/"}, {"title": "Folger Shakespeare Library：生涯と史料上の限界", "url": "https://www.folger.edu/explore/shakespeares-life/"}]}, {"title": "家族の暮らしと、記録のない年月", "text": "1582年、18歳でアン・ハサウェイと結婚し、やがて三人の子どもを持ちました。家族は故郷で暮らします。一方、彼がいつロンドンへ移り、どう演劇の仕事を始めたのかは、はっきりしません。1585年から1592年ごろの活動には記録の空白があります。1592年には、ロンドンで俳優・劇作家として知られていたことが確認できます。", "sources": [{"title": "Folger Shakespeare Library：生涯と史料上の限界", "url": "https://www.folger.edu/explore/shakespeares-life/"}, {"title": "Shakespeare Birthplace Trust：伝記", "url": "https://www.shakespeare.org.uk/explore-shakespeare/shakespedia/william-shakespeare/william-shakespeare-biography/"}]}, {"title": "書くだけではない、劇団の一員", "text": "1594年、宮内大臣一座の創立メンバーとなり、脚本を書くだけでなく、俳優や出資者としても活動しました。一座は1603年に国王一座と呼ばれるようになります。仲間の俳優が演じ、観客が見る舞台が、作品の大事な居場所でした。現代の本で読むときも、台詞を誰が誰に向けて言っているかに注目すると、場面を思い描きやすくなります。", "sources": [{"title": "Royal Shakespeare Company：劇団と活動年表", "url": "https://www.rsc.org.uk/shakespeares-life-and-times/"}, {"title": "Folger Shakespeare Library：生涯と史料上の限界", "url": "https://www.folger.edu/explore/shakespeares-life/"}], "interpretationNote": "最後の二文のうち読書の提案は編集上の独自説明。"}, {"title": "恋、対立、迷いを舞台にする", "text": "『ロミオとジュリエット』は、対立する家に生まれた二人の恋を描く悲劇です。『ハムレット』では、父を殺された王子の復讐と迷いが物語を動かします。ほかに『リア王』『マクベス』などがあり、悲劇だけでなく喜劇や歴史劇、詩も書きました。登場人物の言葉や選択を追うと、ひとりの人間の中にも違う気持ちが同居していることが見えてきます。", "sources": [{"title": "Folger Shakespeare Library：ロミオとジュリエット", "url": "https://www.folger.edu/explore/shakespeares-works/romeo-and-juliet/"}, {"title": "Folger Shakespeare Library：ハムレット", "url": "https://www.folger.edu/explore/shakespeares-works/hamlet/"}, {"title": "Shakespeare Birthplace Trust：伝記", "url": "https://www.shakespeare.org.uk/explore-shakespeare/shakespedia/william-shakespeare/william-shakespeare-biography/"}], "interpretationNote": "最後の一文は作品への入り口としての独自の読み方。"}, {"title": "仲間が残した戯曲集", "text": "1616年4月23日、故郷で亡くなりました。死因は分かっていません。七年後の1623年、かつて同じ劇団で働いた仲間たちが戯曲を集め、『ファースト・フォリオ』を刊行します。収録された36作品のうち18作品は、それまで印刷されていませんでした。今も物語を読んだり舞台で見たりできる背景には、作者だけでなく、作品を残した人々の働きもあります。", "sources": [{"title": "Folger Shakespeare Library：生涯と史料上の限界", "url": "https://www.folger.edu/explore/shakespeares-life/"}, {"title": "Folger Shakespeare Library：First Folioと肖像", "url": "https://www.folger.edu/explore/shakespeare-in-print/first-folio/"}]}], "dostoevsky": [{"title": "モスクワに生まれ、都市と田園で育つ", "text": "フョードル・ミハイロヴィチ・ドストエフスキーは、1821年にモスクワで生まれたロシアの小説家です。父は貧しい人々のためのマリインスキー病院で働く医師でした。モスクワで学校に通う一方、家族が田舎の土地を買ってからは、夏をダロヴォエで過ごしました。生まれ育ったモスクワと、のちの活動拠点ペテルブルクは別の都市です。", "sources": [{"title": "ロシア大統領図書館「ドストエフスキーの誕生」", "url": "https://www.prlib.ru/history/1324583"}, {"title": "サンクトペテルブルク・ドストエフスキー文学記念館「生涯と創作の年譜」", "url": "https://md.spb.ru/dostoevskij/biografiya/"}]}, {"title": "軍の技術者から、文学の道へ", "text": "母を亡くしたあと、1837年にペテルブルクへ移り、翌年、工兵学校に入りました。卒業して軍務に就きますが、1844年には退職して文学へ進みます。この年にはバルザックの『ウジェニー・グランデ』をロシア語に翻訳していました。最初から専業の小説家だったのではなく、技術者としての教育や翻訳の仕事を経て、自分の作品を書く道を選んだのです。", "sources": [{"title": "ロシア大統領図書館「ドストエフスキーの誕生」", "url": "https://www.prlib.ru/history/1324583"}, {"title": "サンクトペテルブルク・ドストエフスキー文学記念館「生涯と創作の年譜」", "url": "https://md.spb.ru/dostoevskij/biografiya/"}]}, {"title": "最初の小説が、発表前から評判になる", "text": "『貧しき人々』の原稿は、1845年に作家仲間を通してネクラーソフや批評家ベリンスキーに読まれ、高く評価されました。実際に刊行されたのは1846年です。原稿が評判になった年と、読者に届いた年を分けると、若い作家が注目を集めた経緯が見えてきます。同じ1846年には『分身』、1848年には『白夜』も発表しました。", "sources": [{"title": "サンクトペテルブルク・ドストエフスキー文学記念館「生涯と創作の年譜」", "url": "https://md.spb.ru/dostoevskij/biografiya/"}, {"title": "ロシア大統領図書館「ドストエフスキーの誕生」", "url": "https://www.prlib.ru/history/1324583"}]}, {"title": "逮捕とシベリアでの年月", "text": "社会制度や思想を話し合うペトラシェフスキーの集まりなどに参加し、1849年に逮捕されました。死刑を言い渡されますが、刑は変更され、オムスクで四年間の強制労働、その後はセミパラチンスクでの軍務を経験します。作家としての歩みは長く中断されました。のちに発表した『死の家の記録』を読むうえでも、この服役歴は重要な背景になります。ただし、小説の出来事をすべて本人の実体験と同一視はできません。", "sources": [{"title": "ロシア大統領図書館「ドストエフスキーの誕生」", "url": "https://www.prlib.ru/history/1324583"}, {"title": "サンクトペテルブルク・ドストエフスキー文学記念館「生涯と創作の年譜」", "url": "https://md.spb.ru/dostoevskij/biografiya/"}]}, {"title": "雑誌づくりと、執筆を支える協力", "text": "ペテルブルクへ戻ったあとは兄ミハイルと雑誌づくりに携わりましたが、兄の死後には出版の負債も引き受けました。1866年には『罪と罰』を連載。同年、速記者アンナ・スニートキナの助けを得て『賭博者』を仕上げ、翌年に二人は結婚します。作品は孤独な才能だけで生まれたのではなく、雑誌という発表の場や、原稿を形にする協力にも支えられていました。", "sources": [{"title": "サンクトペテルブルク・ドストエフスキー文学記念館「生涯と創作の年譜」", "url": "https://md.spb.ru/dostoevskij/biografiya/"}, {"title": "ロシア大統領図書館「ドストエフスキーの誕生」", "url": "https://www.prlib.ru/history/1324583"}]}, {"title": "代表作から、人の矛盾を読む", "text": "代表作には『罪と罰』のほか、『白痴』『悪霊』『カラマーゾフの兄弟』があります。『罪と罰』では、自分の理屈を信じる青年が、犯罪後の恐れや他者との関係によって揺さぶられます。人物の主張と、実際の感情や行動のずれを追うと、難しそうな議論にも近づきやすくなります。1881年にペテルブルクで亡くなるまで、人間を単純な善人・悪人に分けきれない物語を書き続けました。", "sources": [{"title": "サンクトペテルブルク・ドストエフスキー文学記念館「生涯と創作の年譜」", "url": "https://md.spb.ru/dostoevskij/biografiya/"}, {"title": "ロシア大統領図書館「ドストエフスキーの誕生」", "url": "https://www.prlib.ru/history/1324583"}, {"title": "Project Gutenberg・『罪と罰』旧英訳原文", "url": "https://www.gutenberg.org/files/2554/2554-h/2554-h.htm"}], "interpretationNote": "後半の読み方は『罪と罰』の確認済み本文に基づく独自の読解案。人物の発言をそのまま作者の主張と断定しない。"}], "dazai": [{"title": "青森で生まれた津島修治", "text": "太宰治は1909年6月19日、青森県の金木村で生まれました。今の五所川原市金木町です。本名は津島修治。家は多くの土地を持つ地主で、父は政治にも関わっていました。少年時代から本を読み、中学校で学ぶころには文章を書く活動にも取り組んでいます。故郷は、後に『津軽』を書くときにも大切な場所となりました。", "sources": [{"title": "国立国会図書館「近代日本人の肖像」太宰治", "url": "https://www.ndl.go.jp/portrait/datas/4149"}, {"title": "五所川原市「太宰治について」", "url": "https://www.city.goshogawara.lg.jp/kyouiku/bunka/dazai.html"}, {"title": "三鷹市「太宰治略年譜」", "url": "https://www.city.mitaka.lg.jp/dazai/dazaitomitaka/nenpu.html"}]}, {"title": "東京へ出て、小説を書く道へ", "text": "1930年に東京帝国大学のフランス文学を学ぶ学科へ入り、上京しました。同じ年に小説家の井伏鱒二を訪ね、教えを受けるようになります。大学は卒業せず、1933年には『列車』を「太宰治」の名で発表。1935年に『逆行』が芥川賞の候補となり、翌年には最初の創作集『晩年』を刊行しました。", "sources": [{"title": "国立国会図書館「近代日本人の肖像」太宰治", "url": "https://www.ndl.go.jp/portrait/datas/4149"}, {"title": "三鷹市「太宰治略年譜」", "url": "https://www.city.mitaka.lg.jp/dazai/dazaitomitaka/nenpu.html"}]}, {"title": "三鷹の暮らしと、さまざまな作品", "text": "三鷹へ移る前年の1938年9月、太宰は山梨の御坂峠にある天下茶屋を訪れました。『富嶽百景』は翌1939年の2月と3月に発表されています。1939年、石原美知子と結婚し、その年の秋から三鷹に住みました。1940年には『走れメロス』を発表します。戦争中は家族と疎開し、戦後に三鷹へ戻りました。戦後の作品には『斜陽』『ヴィヨンの妻』『人間失格』があります。1948年6月13日に亡くなり、『グッド・バイ』は未完で残されました。", "sources": [{"title": "三鷹市スポーツと文化財団・太宰治文学サロン「太宰治 紹介」", "url": "https://www.mitaka-sportsandculture.or.jp/dazai/about/"}, {"title": "三鷹市「太宰治略年譜」", "url": "https://www.city.mitaka.lg.jp/dazai/dazaitomitaka/nenpu.html"}, {"title": "国立国会図書館「近代日本人の肖像」太宰治", "url": "https://www.ndl.go.jp/portrait/datas/4149"}, {"title": "青空文庫・太宰治「富嶽百景」図書カード", "url": "https://www.aozora.gr.jp/cards/000035/card270.html"}], "diagram": {"src": "assets/dazai-life-timeline.webp", "alt": "太宰治の歩みを示す年表。1909年に青森・金木に生まれ、1933年に「太宰治」の名で発表、1939年に三鷹へ転居。1940年『走れメロス』、1947年『斜陽』、1948年『人間失格』。背景の風景や書斎は創作イメージ。", "caption": "太宰治の歩み。風景・家並み・建物・書斎はAI生成の創作イメージで、実在の場所や住居を正確に再現したものではありません。年の間隔は実際の長さに比例しません。", "width": 1024, "height": 1536, "sourceNote": "年表は公的資料に基づいています。"}}, {"title": "『走れメロス』から読む", "text": "『走れメロス』は、妹の結婚式を済ませるため、友を王のもとに残して村へ帰る男の話です。約束を守れるかが物語を動かしますが、メロスも友も、一度は心が揺れたことを認めます。二人を最初から迷いのない英雄として読むより、弱さを明かしたうえで信頼を取り戻す過程に注目すると、再会の意味が見えてきます。", "sources": [{"title": "青空文庫・太宰治「走れメロス」本文", "url": "https://www.aozora.gr.jp/cards/000035/files/1567_14913.html"}]}, {"title": "『人間失格』では、誰が語るかを見る", "text": "『人間失格』の大部分は、大庭葉蔵という男の手記です。しかし、最初と最後には、手記を受け取った別の語り手がいます。葉蔵の厳しい自己評価と、彼を知る女性の見方も同じではありません。太宰の体験と関わる作品でも、葉蔵の言葉をすべて作者本人の告白と決めつけず、誰の目で語られているかを分けて読むことが大切です。", "sources": [{"title": "青空文庫・太宰治「人間失格」本文", "url": "https://www.aozora.gr.jp/cards/000035/files/301_14912.html"}]}, {"title": "一つの人物像だけに閉じ込めない", "text": "太宰には、語り手が自分の弱さを打ち明ける作品だけでなく、昔の話を語り直す『お伽草紙』や、故郷を旅する『津軽』もあります。この図鑑では、『走れメロス』『人間失格』に加え、『富嶽百景』『女生徒』『斜陽』へも進めます。富士の見え方を語る「私」、少女の一日の心の動き、母を見つめるかず子の語りを比べてみましょう。同じ作家でも、人物の関係や語り方が変わると、読後に残る問いや感情も変わる。その違いが、次の作品へ進む入口になります。", "sources": [{"title": "三鷹市「太宰治略年譜」", "url": "https://www.city.mitaka.lg.jp/dazai/dazaitomitaka/nenpu.html"}, {"title": "青空文庫・太宰治「走れメロス」本文", "url": "https://www.aozora.gr.jp/cards/000035/files/1567_14913.html"}, {"title": "青空文庫・太宰治「人間失格」本文", "url": "https://www.aozora.gr.jp/cards/000035/files/301_14912.html"}, {"title": "青空文庫・太宰治「富嶽百景」本文", "url": "https://www.aozora.gr.jp/cards/000035/files/270_14914.html"}, {"title": "青空文庫・太宰治「女生徒」本文", "url": "https://www.aozora.gr.jp/cards/000035/files/275_13903.html"}, {"title": "青空文庫・太宰治「斜陽」本文", "url": "https://www.aozora.gr.jp/cards/000035/files/1565_8559.html"}]}], "andersen": [{"title": "物語に親しんだオーデンセの少年", "text": "ハンス・クリスチャン・アンデルセンは、1805年4月2日、デンマークのオーデンセに生まれました。父は靴直しの職人、母は洗濯の仕事をし、家計は苦しいものでした。それでも父が本を読み聞かせ、町の人々が昔話を語ってくれました。貧しい暮らしの中にも、本や語りを通して別の世界に触れる機会があったのです。", "sources": [{"title": "デンマーク王立図書館・アンデルセンの生涯", "url": "https://www.kb.dk/en/inspiration/hans-christian-andersens-manuscripts-and-letters/life-hans-christian-andersen"}]}, {"title": "十四歳で、舞台を目指す", "text": "1819年、十四歳のアンデルセンは故郷を離れ、コペンハーゲンへ向かいます。初めから童話作家を目指していたのではなく、俳優や歌手、踊り手として劇場で活躍したかったのです。しかし、なかなか道は開けませんでした。舞台への挑戦は成功しませんでしたが、劇場とのつながりは、その後の学びを支える人々との出会いにつながりました。", "sources": [{"title": "南デンマーク大学アンデルセン研究センター・短い伝記", "url": "https://andersen.sdu.dk/liv/biografi/index_e.html"}]}, {"title": "支援を受け、学び直す", "text": "劇場の運営に関わるヨナス・コリンの助けで、1822年から学校へ通います。スラーエルセ、ヘルシンゲルで学んだあと、コペンハーゲンで個人授業を受け、1828年に大学入学資格の試験に合格しました。舞台の仕事に挑戦したあと、もう一度勉強する道を通って、文学を書くための言葉や知識を身につけていきました。", "sources": [{"title": "南デンマーク大学アンデルセン研究センター・教育", "url": "https://andersen.sdu.dk/liv/biografi/skole_e.html"}]}, {"title": "昔話から、自分の童話へ", "text": "1835年には『子どもたちに語る童話』という小冊子の刊行を始めます。これは初めて文章を書いた年ではなく、それ以前にも詩や物語を発表していました。伝え聞いた昔話を語り直す一方、自分で新しい物語も作ったのが特徴です。昔話を集めただけの人ではありません。その後は本の題名から「子どもたちに」を外し、童話と物語を書き続けました。", "sources": [{"title": "南デンマーク大学アンデルセン研究センター・童話", "url": "https://andersen.sdu.dk/liv/biografi/eventyr_e.html"}, {"title": "南デンマーク大学アンデルセン研究センター・短い伝記", "url": "https://andersen.sdu.dk/liv/biografi/index_e.html"}]}, {"title": "旅をし、さまざまな作品を書く", "text": "アンデルセンの仕事は童話だけではありません。小説や詩、戯曲、旅行記にも取り組みました。外国を旅することも多く、イタリアで受けた印象は、1835年の小説『即興詩人』につながります。旅行記にはスウェーデンやスペインを題材にした本もあります。身近な暮らしから遠い国まで、観察の対象を広げた作家でした。", "sources": [{"title": "デンマーク王立図書館・アンデルセンの生涯", "url": "https://www.kb.dk/en/inspiration/hans-christian-andersens-manuscripts-and-letters/life-hans-christian-andersen"}, {"title": "南デンマーク大学アンデルセン研究センター・旅行記", "url": "https://andersen.sdu.dk/liv/biografi/rejseboeger_e.html"}]}, {"title": "三つの童話から、作品の幅を知る", "text": "1875年8月4日、七十歳で亡くなりました。『みにくいアヒルの子』には居場所を失う苦しさ、『人魚姫』には別の世界への願いと伝わらない思いが描かれます。一方、『裸の王様』は、周囲に合わせて本当のことを言えない人々を見つめます。優しい話ばかりでも、悲しい話ばかりでもありません。異なる三作を読むと、人の弱さや願いをさまざまな角度から描いたことが分かります。", "sources": [{"title": "南デンマーク大学アンデルセン研究センター・短い伝記", "url": "https://andersen.sdu.dk/liv/biografi/index_e.html"}, {"title": "Project Gutenberg Canada：M. R. James英訳全文・版情報", "url": "https://www.gutenbergca.gutenbergcanada.ca/ebooks/andersen-ugly/andersen-ugly-00-h.html"}, {"title": "Wikisource・Paull英訳「The Little Mermaid」全文", "url": "https://en.wikisource.org/wiki/Hans_Andersen's_Fairy_Tales/The_Little_Mermaid"}, {"title": "Wikisource・Paull英訳当該話全文", "url": "https://en.wikisource.org/wiki/Hans_Andersen's_Fairy_Tales/The_Emperor's_New_Clothes"}]}], "niimi-nankichi": [{"title": "半田で育った新美正八", "text": "新美南吉は1913年7月30日、愛知県の半田町、今の半田市に生まれました。本名は新美正八です。畳屋の家に育ち、4歳で母を亡くしました。8歳で母の実家の新美家の養子になり、姓が渡辺から新美に変わります。その年のうちに暮らす家は渡辺家へ戻りました。ふるさとの岩滑の生活や自然は、後の物語にも息づいています。", "sources": [{"title": "新美南吉記念館「新美南吉の生涯」", "url": "https://www.nankichi.gr.jp/Nankichi/syogai.html"}, {"title": "新美南吉記念館「南吉Q&A・新美南吉について」", "url": "https://www.nankichi.gr.jp/Nankichi/QA.html"}, {"title": "新美南吉記念館「新美南吉の作品」", "url": "https://www.nankichi.gr.jp/Nankichi/sakuhin.html"}]}, {"title": "雑誌への投稿と、文学の仲間", "text": "中学生のころから童話や童謡を書き、雑誌へ送りました。『赤い鳥』に作品が載るようになり、童謡の指導をした北原白秋の周りで、巽聖歌や与田凖一らと知り合います。特に巽は、東京での暮らしや作品の出版を支えた先輩でした。一人で書くだけでなく、作品を読み合い、発表につなげてくれる人々との関係も大切だったのです。", "sources": [{"title": "新美南吉記念館「新美南吉の生涯」", "url": "https://www.nankichi.gr.jp/Nankichi/syogai.html"}, {"title": "新美南吉記念館「南吉Q&A・新美南吉について」", "url": "https://www.nankichi.gr.jp/Nankichi/QA.html"}, {"title": "国際子ども図書館「児童文学者コーナー 新美南吉」", "url": "https://www.kodomo.go.jp/jcl/person/niimi.html"}]}, {"title": "外国文学を学び、先生として働く", "text": "1932年、東京外国語学校の英語部文科へ入り、英語や海外の文学を学びました。卒業後は東京で働きますが、体調を崩して故郷へ戻ります。小学校の先生や会社員を経て、1938年には安城高等女学校の先生になりました。教える仕事と創作を続け、この時期に『おじいさんのランプ』などを書きました。", "sources": [{"title": "新美南吉記念館「新美南吉の生涯」", "url": "https://www.nankichi.gr.jp/Nankichi/syogai.html"}, {"title": "東京外国語大学文書館・新美南吉展資料", "url": "https://www.tufs.ac.jp/common/archives/pamphlet-niiminankichi.pdf"}]}, {"title": "書いた年と、本になった年", "text": "『ごん狐』は1931年に草稿が書かれ、1932年1月号の『赤い鳥』に載りました。『手袋を買いに』は1933年12月に書かれましたが、発表は死後の1943年です。『おじいさんのランプ』は1942年に書かれ、同じ年に初めての童話集の表題にもなりました。執筆と発表には時間差があり、現在の本の発売年だけでは、作品が生まれた時期は分かりません。", "sources": [{"title": "新美南吉記念館「新美南吉の生涯」", "url": "https://www.nankichi.gr.jp/Nankichi/syogai.html"}, {"title": "東京外国語大学文書館・新美南吉展資料", "url": "https://www.tufs.ac.jp/common/archives/pamphlet-niiminankichi.pdf"}, {"title": "青空文庫「手袋を買いに」図書カード", "url": "https://www.aozora.gr.jp/cards/000121/card637.html"}]}, {"title": "29歳で亡くなったあとも", "text": "南吉は病気のため、1943年3月22日に29歳で亡くなりました。遺された作品は巽聖歌や与田凖一らによって出版され、戦後も読み継がれました。ただし、草稿と雑誌掲載文、後の本で文章が異なる作品もあります。『ごん狐』の語り口を比べるときも、どの版を読んでいるのかを確かめることが大切です。", "sources": [{"title": "新美南吉記念館「新美南吉の生涯」", "url": "https://www.nankichi.gr.jp/Nankichi/syogai.html"}, {"title": "新美南吉記念館「南吉Q&A・新美南吉について」", "url": "https://www.nankichi.gr.jp/Nankichi/QA.html"}, {"title": "国際子ども図書館「児童文学者コーナー 新美南吉」", "url": "https://www.kodomo.go.jp/jcl/person/niimi.html"}]}, {"title": "この図鑑の三作品から読む", "text": "『ごんぎつね』では、相手を思う行動がうまく伝わらないすれ違いが描かれます。『手袋を買いに』では、母狐の怖さと、町で親切にされた子狐の経験が対照になります。『おじいさんのランプ』では、仕事に誇りを持つ人が時代の変化に向き合います。悲しい話だけ、優しい動物の話だけと決めず、人と人との関係や、考えが変わる瞬間に目を向けると、三作品の違いも見えてきます。", "sources": [{"title": "青空文庫「ごん狐」本文", "url": "https://www.aozora.gr.jp/cards/000121/files/628_14895.html"}, {"title": "青空文庫「手袋を買いに」本文", "url": "https://www.aozora.gr.jp/cards/000121/files/637_13341.html"}, {"title": "青空文庫「おじいさんのランプ」本文", "url": "https://www.aozora.gr.jp/cards/000121/files/635_14853.html"}]}], "mori-ogai": [{"title": "津和野の医師の家に生まれる", "text": "森鷗外は1862年2月17日、今の島根県津和野町に生まれました。本名は森林太郎です。家は津和野藩の医師を代々務めており、幼いころから漢文などを学びました。10歳で父と東京へ移り、ドイツ語と医学を学ぶ道へ進みます。学生時代には依田学海から漢文を学び、医学だけでなく言葉や文学にも親しみました。", "sources": [{"title": "国立国会図書館「近代日本人の肖像」森鴎外", "url": "https://www.ndl.go.jp/portrait/datas/342"}, {"title": "文京区立森鴎外記念館「森鴎外について」", "url": "https://moriogai-kinenkan.jp/modules/contents/index.php?content_id=11"}, {"title": "東京大学附属図書館「鴎外の書斎から・若き鴎外」", "url": "https://www.lib.u-tokyo.ac.jp/html/tenjikai/tenjikai2012/tenji1.html"}]}, {"title": "軍医としてドイツへ", "text": "1881年に東京大学医学部を卒業し、陸軍の軍医になりました。軍医とは、軍で医療や衛生に携わる医師です。1884年から1888年までドイツに留学し、衛生学を学びました。同時に多くの本を読み、ヨーロッパの文学にも接します。帰国後は軍医の仕事を続けながら、小説、評論、翻訳に取り組みました。", "sources": [{"title": "国立国会図書館「近代日本人の肖像」森鴎外", "url": "https://www.ndl.go.jp/portrait/datas/342"}, {"title": "東京大学附属図書館「鴎外の書斎から・若き鴎外」", "url": "https://www.lib.u-tokyo.ac.jp/html/tenjikai/tenjikai2012/tenji1.html"}]}, {"title": "『舞姫』と翻訳の仕事", "text": "1890年1月、雑誌『国民之友』に『舞姫』を発表しました。発表直前の1889年末に書いた草稿が残っています。ドイツ留学は創作の背景の一つですが、主人公の太田豊太郎を、そのまま作者と同じ人物と考えることはできません。鷗外はアンデルセンの『即興詩人』なども翻訳し、海外の作品を日本の読者へ紹介しました。", "sources": [{"title": "国立国会図書館「近代日本人の肖像」森鴎外", "url": "https://www.ndl.go.jp/portrait/datas/342"}, {"title": "文京区立森鴎外記念館「小説『舞姫』をよんでみよう！」展示解説", "url": "https://moriogai-kinenkan.jp/modules/event/index.php?action=View&event_id=0000002400&smode=Monthly"}], "citationNote": "発表直前の1889年末に書いた『舞姫』の草稿が残っているという説明は、文京区立森鴎外記念館「小説『舞姫』をよんでみよう！」展示解説によります。"}, {"title": "観潮楼に集まった文学の仲間", "text": "1892年から、東京の千駄木にある家「観潮楼」で家族と暮らしました。ここでは歌会も開かれ、石川啄木や斎藤茂吉らが訪れました。短歌を作るだけでなく、新しい海外文学の話を伝える場でもありました。鷗外は自分の作品を書く一方で、若い文学者たちと交流し、文学について考える場をつくっていたのです。", "sources": [{"title": "文京区立森鴎外記念館「鴎外と文京区」", "url": "https://moriogai-kinenkan.jp/modules/contents/index.php?content_id=12"}]}, {"title": "歴史を題材にし、晩年まで働く", "text": "後年の代表作には、1915年発表の『山椒大夫』、1916年発表の『高瀬舟』があります。古い説話や記録をもとに、人間の選択や生き方を描く作品です。1916年に軍医の職を退いた後も、翌年から博物館や図書を扱う仕事を続けました。1922年7月9日、60歳で亡くなりました。医師、作家、翻訳家という複数の仕事を持った生涯でした。", "sources": [{"title": "国立国会図書館「近代日本人の肖像」森鴎外", "url": "https://www.ndl.go.jp/portrait/datas/342"}, {"title": "文京区立森鴎外記念館「森鴎外について」", "url": "https://moriogai-kinenkan.jp/modules/contents/index.php?content_id=11"}]}, {"title": "この図鑑の三作品から読む", "text": "『舞姫』では、豊太郎が選んだ進路と、エリスとの約束の食い違いに目を向けられます。『山椒大夫』では、離ればなれになった家族の行方を追いながら、人を売り買いする世界の苦しさが見えてきます。『高瀬舟』では、役人の庄兵衛が喜助の話を聞き、簡単には判断できなくなります。人物の立場や語り手を確かめて読むと、単純な教訓では収まらない問いが残ります。", "sources": [{"title": "青空文庫「舞姫」本文", "url": "https://www.aozora.gr.jp/cards/000129/files/2078_15963.html"}, {"title": "青空文庫・鷗外原文（全編確認）", "url": "https://www.aozora.gr.jp/cards/000129/files/689_23257.html"}, {"title": "青空文庫「高瀬舟」本文", "url": "https://www.aozora.gr.jp/cards/000129/files/45245_22007.html"}]}], "higuchi-ichiyo": [{"title": "東京で育った奈津", "text": "樋口一葉は1872年5月2日、東京の内幸町に生まれました。当時の暦では明治5年3月25日です。本名は奈津で、夏子とも書きました。父は東京府の役人でした。幼いころから読書に親しみ、上野御徒町へ移った後は青海学校で学びます。東京のさまざまな町で暮らした経験が、後の文学の背景になりました。", "sources": [{"title": "国立国会図書館「近代日本人の肖像・樋口一葉」", "url": "https://www.ndl.go.jp/portrait/datas/315/"}, {"title": "千代田区文化財サイト「樋口一葉生誕地」", "url": "https://www.edo-chiyoda.jp/bunkazaihogonotorikumi/bunkazaihogochosain/hogocho2019/1/361.html"}, {"title": "台東区文化探訪「一葉記念館を詠う」学びと育ち", "url": "https://www.culture.city.taito.lg.jp/bunkatanbou/culture/ichiyou/japanese/page_02.html"}]}, {"title": "和歌の学びから小説へ", "text": "1886年、中島歌子の歌塾「萩の舎」に入り、和歌を学びました。同門の田辺花圃が小説を発表したことも刺激になり、1891年には半井桃水に小説の指導を受けます。1892年発表の『うもれ木』で知られるようになり、雑誌『文学界』の仲間たちとの交流も広がりました。和歌と小説、師や仲間との出会いが創作を支えたのです。", "sources": [{"title": "国立国会図書館「近代日本人の肖像・樋口一葉」", "url": "https://www.ndl.go.jp/portrait/datas/315/"}, {"title": "千代田区文化財サイト「樋口一葉生誕地」", "url": "https://www.edo-chiyoda.jp/bunkazaihogonotorikumi/bunkazaihogochosain/hogocho2019/1/361.html"}]}, {"title": "暮らしを支えながら書く", "text": "1889年に父を亡くし、一家の暮らしを支える立場になりました。下谷の龍泉寺町では日用品や駄菓子を売る店も営みます。商いに忙しく、思うように書けない時期もありました。その後暮らした本郷の丸山福山町では、近所の店で働く女性たちの手紙を代筆しています。こうした交流や日々の観察が、人の心と生活を描く作品につながりました。", "sources": [{"title": "国立国会図書館「近代日本人の肖像・樋口一葉」", "url": "https://www.ndl.go.jp/portrait/datas/315/"}, {"title": "台東区文化探訪「一葉記念館を詠う」生活と創作", "url": "https://www.culture.city.taito.lg.jp/bunkatanbou/culture/ichiyou/japanese/page_03.html"}, {"title": "国立国会図書館「本の万華鏡・恋文の名手―樋口一葉をめぐる恋文譚」", "url": "https://www.ndl.go.jp/kaleido/entry/26/2.html"}]}, {"title": "書いた時と、発表した時", "text": "『たけくらべ』は1895年1月から1896年1月まで、雑誌『文学界』に何回かに分けて掲載されました。その後、文章を直し、1896年4月の『文芸倶楽部』にまとめて載せています。『にごりえ』は1895年9月号の『文芸倶楽部』に発表しました。近い時期に発表された代表作でも、作品が読者に届くまでの道筋は異なります。", "sources": [{"title": "近畿大学中央図書館回答・NDLレファレンス協同データベース「たけくらべの初出」", "url": "https://crd.ndl.go.jp/reference/entry/index.php?id=1000049505&page=ref_view"}, {"title": "台東区文化探訪「一葉記念館を詠う」原稿と評価", "url": "https://www.culture.city.taito.lg.jp/bunkatanbou/culture/ichiyou/japanese/page_04.html"}, {"title": "青空文庫「にごりえ」図書カード・初出欄", "url": "https://www.aozora.gr.jp/cards/000064/card56042.html"}]}, {"title": "短い生涯と、残された言葉", "text": "『たけくらべ』は森鷗外らに高く評価されました。しかし一葉は結核を患い、1896年11月23日、24歳で亡くなります。小説だけでなく、和歌や日記、書簡も残しました。日記や手紙は生活と思いを知る大切な手がかりですが、小説の登場人物をそのまま作者自身と決めつけることはできません。", "sources": [{"title": "国立国会図書館「近代日本人の肖像・樋口一葉」", "url": "https://www.ndl.go.jp/portrait/datas/315/"}, {"title": "台東区文化探訪「一葉記念館を詠う」原稿と評価", "url": "https://www.culture.city.taito.lg.jp/bunkatanbou/culture/ichiyou/japanese/page_04.html"}, {"title": "国立国会図書館「本の万華鏡・恋文の名手―樋口一葉をめぐる恋文譚」", "url": "https://www.ndl.go.jp/kaleido/entry/26/2.html"}]}, {"title": "二つの物語を読む入口", "text": "『たけくらべ』では、美登利や信如たちの言えない思いと、家の仕事が将来に及ぼす力に目を向けてみましょう。『にごりえ』では、店で明るく振る舞うお力の内面だけでなく、源七の妻子の暮らしも大切です。悲しい恋の話とまとめず、本人の言葉と周囲の噂の違いをたどると、人物を簡単に裁けない物語の深さが見えてきます。", "sources": [{"title": "青空文庫・樋口一葉「たけくらべ」原文", "url": "https://www.aozora.gr.jp/cards/000064/files/56041_54765.html"}, {"title": "青空文庫・樋口一葉「にごりえ」原文", "url": "https://www.aozora.gr.jp/cards/000064/files/387_15293.html"}]}], "arishima-takeo": [{"title": "東京から札幌へ", "text": "有島武郎は1878年3月4日、東京に生まれました。横浜英和学校や学習院で学んだ後、1896年に札幌農学校へ進みます。札幌での学生生活は、英語や外国の本に親しみ、信仰や社会について考える時期にもなりました。後の作品に北海道が登場しても、北海道生まれの作家というわけではありません。", "sources": [{"title": "有島記念館「有島武郎について」", "url": "https://www.town.niseko.lg.jp/arishima_museum/profile/"}, {"title": "北海道大学附属図書館「有島武郎」", "url": "https://www.lib.hokudai.ac.jp/archive/node/北大の英語教育/北大卒業生の活躍/有島/"}]}, {"title": "留学し、英語を教える", "text": "1903年にアメリカへ留学し、ヨーロッパも巡って1907年に帰国しました。留学中にはキリスト教への信仰が揺らぎ、社会思想にも関心を広げます。帰国後は母校の後身である東北帝国大学農科大学の英語講師に任命され、翌1908年には予科教授となりました。作家として知られる前には、学ぶ側と教える側の両方を経験しています。", "sources": [{"title": "有島記念館「有島武郎について」", "url": "https://www.town.niseko.lg.jp/arishima_museum/profile/"}, {"title": "国立国会図書館「近代日本人の肖像」有島武郎", "url": "https://www.ndl.go.jp/portrait/datas/228/"}, {"title": "北海道大学附属図書館「有島武郎」", "url": "https://www.lib.hokudai.ac.jp/archive/node/北大の英語教育/北大卒業生の活躍/有島/"}]}, {"title": "『白樺』の文学仲間", "text": "1910年、武者小路実篤や志賀直哉らの雑誌『白樺』に参加しました。画家の有島生馬と作家の里見弴は、武郎の弟です。同じ雑誌に集まった人たちは文学や美術に関心を寄せていましたが、全員が同じ考えで書いたわけではありません。武郎も自分の生活と社会のあり方を見つめながら、作品を発表していきます。", "sources": [{"title": "有島記念館「有島武郎について」", "url": "https://www.town.niseko.lg.jp/arishima_museum/profile/"}, {"title": "国立国会図書館「近代日本人の肖像」有島武郎", "url": "https://www.ndl.go.jp/portrait/datas/228/"}]}, {"title": "小説と子どもの物語", "text": "1915年から大学を休職し、1916年に妻と父を失い、1917年に正式に退職しました。その前後から『カインの末裔』『生れ出づる悩み』『或る女』などを発表します。この図鑑の『一房の葡萄』は、1920年8月号の『赤い鳥』に掲載されました。これは発表の年月です。物語の中の子ども時代や、文章を書き終えた日を示すものではありません。", "sources": [{"title": "有島記念館「有島武郎について」", "url": "https://www.town.niseko.lg.jp/arishima_museum/profile/"}, {"title": "国立国会図書館「近代日本人の肖像」有島武郎", "url": "https://www.ndl.go.jp/portrait/datas/228/"}, {"title": "青空文庫「一房の葡萄」図書カード", "url": "https://www.aozora.gr.jp/cards/000025/card211.html"}, {"title": "北海道大学附属図書館「有島武郎」", "url": "https://www.lib.hokudai.ac.jp/archive/node/北大の英語教育/北大卒業生の活躍/有島/"}]}, {"title": "農場の持ち主として考えたこと", "text": "武郎は北海道に農場を持つ立場でもありました。1922年には、借りた土地を耕して暮らす人々が土地を共同で持つことを前提に、農場を無償で手放すと宣言します。考えを文章にするだけでなく、自分の財産をどう扱うかにも向き合った出来事です。翌1923年6月9日、軽井沢で45歳の生涯を終えました。", "sources": [{"title": "有島記念館「有島武郎について」", "url": "https://www.town.niseko.lg.jp/arishima_museum/profile/"}, {"title": "国立国会図書館「近代日本人の肖像」有島武郎", "url": "https://www.ndl.go.jp/portrait/datas/228/"}]}, {"title": "『一房の葡萄』から読む", "text": "『一房の葡萄』では、大人になった「僕」が、絵の具を盗んだ少年時代を振り返ります。先生は盗みをよいことにするのではなく、少年がもう一度学校へ戻れるように接します。何をしたかだけでなく、その後に誰がどう受け止めたかを追うと、葡萄の記憶が残る理由が見えてきます。作品の「僕」を、そのまま作者本人の記録と決めつけずに読む案内です。", "sources": [{"title": "青空文庫「一房の葡萄」本文", "url": "https://www.aozora.gr.jp/cards/000025/files/211_20472.html"}]}], "kajii-motojiro": [{"title": "大阪に生まれ、各地で育つ", "text": "梶井基次郎は1901年2月17日、大阪に生まれました。父の転勤で引っ越しや転校を重ね、少年時代には三重や東京でも暮らしました。のちに大阪の北野中学校で学びます。小説の舞台として京都を思い浮かべる人もいるでしょうが、生まれ育った場所と、学生として過ごした場所は同じではありません。", "sources": [{"title": "国立国会図書館「近代日本人の肖像」梶井基次郎", "url": "https://www.ndl.go.jp/portrait/datas/6239/index.html"}, {"title": "千代田区立図書館「梶井基次郎の手迹」展示解説・略年譜", "url": "https://www.library.chiyoda.tokyo.jp/information/20081120-10517/"}, {"title": "新潮社・梶井基次郎 著者プロフィール", "url": "https://www.shinchosha.co.jp/writer/1147/"}]}, {"title": "理科から文学の道へ", "text": "1919年、京都の第三高等学校の理科に入学しました。当初は技術者を目指していましたが、しだいに文学へ心を引かれていきます。学生時代には劇の研究会に入り、習作を書くようになりました。1924年には東京帝国大学の英文学科へ進みます。ただし、病気のため大学を卒業することはできませんでした。", "sources": [{"title": "千代田区立図書館「梶井基次郎の手迹」展示解説・略年譜", "url": "https://www.library.chiyoda.tokyo.jp/information/20081120-10517/"}, {"title": "新潮社・梶井基次郎 著者プロフィール", "url": "https://www.shinchosha.co.jp/writer/1147/"}]}, {"title": "仲間と雑誌『青空』をつくる", "text": "中谷孝雄や外村繁らと同人雑誌『青空』をつくり、1925年1月の創刊号に『檸檬』を発表しました。同人雑誌は、仲間が集まって作品を発表する雑誌です。『城のある町にて』などもこの雑誌に載せました。『檸檬』の発表年は1925年ですが、そこへ至る前にも習作を書いており、突然一編だけが生まれたわけではありません。", "sources": [{"title": "国立国会図書館「近代日本人の肖像」梶井基次郎", "url": "https://www.ndl.go.jp/portrait/datas/6239/index.html"}, {"title": "千代田区立図書館「梶井基次郎の手迹」展示解説・略年譜", "url": "https://www.library.chiyoda.tokyo.jp/information/20081120-10517/"}, {"title": "青空文庫「檸檬」図書カード（旧字旧仮名）", "url": "https://www.aozora.gr.jp/cards/000074/card46349.html"}]}, {"title": "療養先でも文学者と交流する", "text": "1926年、体調が悪くなり、療養のため伊豆の湯ヶ島へ向かいました。そこで川端康成や広津和郎らと交流し、創作を続けます。病気は生活や進学に影響しましたが、梶井の歩みには、同人誌の仲間や療養先で出会った文学者とのつながりもありました。病気の作家という一面だけでは、その活動全体を捉えきれません。", "sources": [{"title": "国立国会図書館「近代日本人の肖像」梶井基次郎", "url": "https://www.ndl.go.jp/portrait/datas/6239/index.html"}, {"title": "新潮社・梶井基次郎 著者プロフィール", "url": "https://www.shinchosha.co.jp/writer/1147/"}]}, {"title": "一冊の作品集と、三十一歳の死", "text": "1931年、生前唯一の作品集『檸檬』が刊行されました。これは1925年に発表した一編の小説とは別の、作品をまとめた本です。翌1932年には雑誌『中央公論』で『のんきな患者』を発表しました。同年3月24日、肺
