const items = [{"id": "rashomon", "image": "assets/rashomon.webp", "imageAlt": "雨の羅生門を描いた作品イメージ", "synopsisSummary": ["荒廃した京都。主人に暇を出された下人が、雨の降る夕方、羅生門の下で途方に暮れている。生活の当てはなく、このままでは飢え死にする。しかし、盗人になる決心もつかない。夜を過ごそうと門の楼へ上がると、そこには捨てられた死体が並び、老婆が女の死体から髪を抜いていた。下人は激しい怒りを覚え、老婆を捕らえて理由を問いただす。老婆は、抜いた髪でかつらを作るのだと答える。さらに、死んだ女も生前は蛇を干魚と偽って売っていたが、生きるためだったのだから仕方がない、自分の行為も同じだと弁明する。", "その言葉を聞くうち、下人の心に、それまでなかった勇気が生まれる。下人は、自分が着物を奪うのも飢え死にを避けるためだと言い放ち、老婆の着物をはぎ取って暗闇へ姿を消す。悪を憎んでいたはずの男は、他人の弁明を、自分の悪事を正当化する理由へと変えてしまった。"], "questions": ["下人は、老婆のどの言葉を境に態度を変えたのだろう。本文からその前後を比べてみよう。", "自分と他人に同じ基準を当てているだろうか。日常の判断を振り返る手がかりになるだろうか。"], "cat": "literature", "name": "羅生門", "sub": "芥川龍之介｜1915年発表", "motif": "gate", "gist": "生き延びるためなら、悪事は許されるのか。悪を責めた男が、同じ理屈で悪へ踏み出す物語。", "intro": "仕事を失った下人が、荒れ果てた京都の羅生門で雨を避けている。このままでは飢えてしまうが、盗人になる決心もつかない。夜を過ごそうと門の楼へ上がると、死体のそばで何かをしている老婆を見つける。", "people": [["下人（げにん）", "失業し、生きる手段と善悪の間で揺れる男。"], ["老婆", "死体から髪を抜き、生計を立てようとする女。"]], "theme": "下人の怒りが、老婆の弁明を境に自分の悪事を支える理屈へ変わる。その転換を追うと、「生きるため」という言葉が、誰の立場から語られるかで異なる働きをすることが見えてくる。これは読み方の一例であり、作品の意味を一つに限定するものではない。", "memory": "善悪の基準が揺れる、その瞬間に注目する。", "links": ["akutagawa", "hana", "spider"], "sources": [{"title": "青空文庫「羅生門」本文", "url": "https://www.aozora.gr.jp/cards/000879/files/127_15260.html"}, {"title": "青空文庫 図書カード（初出：1915年11月）", "url": "https://www.aozora.gr.jp/cards/000879/card127.html"}], "reading": "らしょうもん"}, {"id": "akutagawa", "reading": "あくたがわりゅうのすけ", "cat": "person", "name": "芥川龍之介", "sub": "1892–1927｜小説家", "motif": "book", "gist": "古い物語を手がかりに、人間の心を新しく描いた作家。『羅生門』『鼻』『蜘蛛の糸』をつなぐ人物。", "intro": "芥川龍之介は、1892年に東京で生まれ、1927年に亡くなった小説家。『羅生門』『鼻』『蜘蛛の糸』などの短編で知られる。古典や説話を題材にしながら、他人の目を気にする心、利己心、善悪の揺らぎなどを描いた。ここではまず三つの作品を読み比べ、それぞれの人物が何を望み、どのように変化するのかをたどってみよう。", "people": [["読む入口", "『羅生門』では善悪の転換、『鼻』では自尊心と他人の視線、『蜘蛛の糸』では救いと利己心が読みどころとなる。"]], "theme": "同じ作家の作品を並べても、人物や結末は異なる。共通点を探すと同時に、作品ごとの語り方の違いにも目を向けたい。", "memory": "作品を読み、作家に戻り、次の作品へ進む。", "links": ["rashomon", "hana", "spider"], "sources": [{"title": "国立国会図書館「近代日本人の肖像」芥川龍之介", "url": "https://www.ndl.go.jp/portrait/datas/224/"}]}, {"id": "hana", "image": "assets/hana.webp", "imageAlt": "僧・禅智内供を描いた作品イメージ", "synopsisSummary": ["池の尾に住む僧・禅智内供には、あごの下まで垂れ下がる長い鼻があった。食事にも不便な鼻だが、内供が何より苦しんでいたのは、人からどう見られるかということだった。それでも、鼻を気にしていると思われたくない。経典に自分のような鼻の持ち主を探し、短くする方法を試しても、悩みは消えなかった。あるとき、弟子が鼻を短くする方法を聞いてくる。内供は平静を装いながら、その方法を試し、ついに普通の長さの鼻を手に入れる。", "ところが、願いがかなった後、人々は以前にも増して内供を笑うようになる。周囲の態度を理解できない内供は、いら立ちを募らせていく。ある朝、鼻は元の長さに戻っていた。鏡に映る自分を確かめた内供は、以前の姿に戻ったにもかかわらず、不思議な安心を感じる。これでもう誰も笑わないだろうと思う内供の心は、外見だけを変えても解けなかった悩みを浮かび上がらせる。"], "questions": ["鼻を短くする前と後で、内供の願いと周囲の反応はどう食い違っているだろう。", "人の悩みが解消したとき、素直に喜べないことはあるだろうか。自分の気持ちと語り手の説明を比べてみよう。"], "cat": "literature", "name": "鼻", "sub": "芥川龍之介｜1916年発表", "motif": "ripple", "gist": "悩みの種がなくなれば、幸せになれるはずだった。長い鼻をめぐり、自尊心と他人の視線が交錯する物語。", "intro": "長い鼻に悩む僧の禅智内供は、人からどう見られているかが気になって仕方がない。それでも、鼻を気にしているとは知られたくない。そんな内供（ないぐ）のもとへ、弟子が鼻を短くする方法を持ち帰る。", "people": [["禅智内供（ぜんち ないぐ）", "長い鼻と、人からの見られ方を気にする僧。"], ["弟子・周囲の人々", "鼻を短くする方法を伝えたり、変化した内供を笑ったりする人々。"]], "theme": "作品は、当人の自尊心だけでなく、他人の不幸には同情しても、その人が悩みから抜け出すと別の感情を抱く、周囲の複雑な心理も描く。内供の安心が本当に問題の解決なのか、結末から考えることもできる。", "memory": "鼻の長さよりも、他人の目に心が揺れる。", "links": ["akutagawa", "rashomon"], "sources": [{"title": "青空文庫「鼻」本文", "url": "https://www.aozora.gr.jp/cards/000879/files/42_15228.html"}, {"title": "青空文庫 図書カード（初出：1916年2月）", "url": "https://www.aozora.gr.jp/cards/000879/card42.html"}], "reading": "はな"}, {"id": "spider", "image": "assets/spider.webp", "imageAlt": "蓮池と蜘蛛の糸を描いた作品イメージ", "synopsisSummary": ["ある朝、極楽の蓮池のほとりを歩いていた釈迦は、池の底に広がる地獄をのぞき見る。そこには、血の池で苦しむ犍陀多という男がいた。犍陀多は多くの悪事を働いたが、生前、一匹の蜘蛛を踏み殺さずに助けたことがあった。釈迦はその小さな善行を思い出し、極楽の蜘蛛の糸を地獄へ垂らす。糸を見つけた犍陀多は、これを登れば地獄から抜け出せると考え、夢中で上を目指す。しばらく登って休み、下を見ると、無数の罪人たちが同じ糸を伝って続いていた。", "犍陀多は、その重さで糸が切れれば自分も落ちてしまうと恐れる。そして、この糸は自分のものだ、下りろ、と叫ぶ。その瞬間、糸は犍陀多の上で切れ、男は再び地獄へ落ちていった。釈迦はその一部始終を見て悲しそうな顔をし、歩き続ける。極楽では、何事もなかったように蓮の花が香りを漂わせている。"], "questions": ["犍陀多は、与えられた糸をいつから「自分のもの」と考えたのだろう。言葉の変化に注目してみよう。", "限られた機会を他の人と分かち合う場面で、不安は判断にどう影響するだろう。作品と現実の違いにも目を向けよう。"], "cat": "literature", "name": "蜘蛛の糸", "sub": "芥川龍之介｜1918年発表", "motif": "thread", "gist": "一本の糸にすがった男は、後から来る人々を拒んだ。救いを独り占めしようとする心を描く物語。", "intro": "地獄で苦しむ犍陀多は、生前に多くの悪事を働いた男だった。けれども、一度だけ小さな蜘蛛の命を助けたことがある。極楽からその姿を見た釈迦は、その善行を思い出し、一本の蜘蛛の糸を垂らす。", "people": [["犍陀多（かんだた）", "地獄から逃れようと蜘蛛の糸を登る男。"], ["釈迦（しゃか）", "犍陀多の小さな善行を思い出し、救いの糸を垂らす。"]], "theme": "小さな善行によって与えられた救いの機会を、犍陀多はどう受け止めたのか。糸を「自分のもの」と考えた瞬間に注目すると、利己心と救済の関係を読み取れる。", "memory": "登る高さよりも、他者に向ける心が問われる。", "links": ["akutagawa", "rashomon"], "sources": [{"title": "青空文庫「蜘蛛の糸」本文", "url": "https://www.aozora.gr.jp/cards/000879/files/92_14545.html"}, {"title": "青空文庫 図書カード（初出：1918年7月）", "url": "https://www.aozora.gr.jp/cards/000879/card92.html"}], "reading": "くものいと"}, {"id": "kawasaki", "cat": "region", "name": "川崎区ゆるキャラ大図鑑", "sub": "地域文化｜企画・準備中", "motif": "town", "gist": "地域の産業・歴史・文化を、オリジナルキャラクターから知る。これから育てる川崎区の図鑑。", "intro": "川崎区に実在する、または歴史的に存在した題材を調べ、オリジナルキャラクターと解説を組み合わせる企画です。産業、港湾、交通、寺社、暮らしなどを入口に、人物や場所、時代のつながりを紹介する構成を考えています。現在は企画段階で、個別キャラクターや解説記事は未掲載です。公的資料などで事実と出典を確かめ、創作部分とは分けて追加していきます。", "people": [["今後の掲載方針", "題材の名称、確認した出典、史実と創作の区別、確認日を記録する。"], ["キャラクターについて", "このサイト独自の創作を予定。自治体公認や既存の公式キャラクターであることを意味しない。"]], "theme": "親しみやすい入口から、元になった地域の本当の姿へ進める図鑑を目指す。まだ確認できていない歴史、所在地、関係性は事実として掲載しない。", "memory": "キャラクターの向こうにある、地域の物語をたどる。", "links": [], "sources": [{"title": "川崎市公式「川崎区の概要」", "url": "https://www.city.kawasaki.jp/kawasaki/page/0000026330.html"}]}, {"id": "melos", "cat": "literature", "name": "走れメロス", "sub": "太宰治｜1940年発表", "motif": "road", "gist": "約束の時までに戻らなければ、友が処刑される。迷いと疲労の中を走る男を通して、信頼を問い直す物語。", "intro": "人を信じず、次々と人を殺す王に怒った羊飼いのメロスは、捕らえられて死刑を宣告される。妹の婚礼を済ませるため、友を身代わりに残して村へ帰ることになった。約束の期限は、三日目の日没である。", "synopsisSummary": ["羊飼いのメロスは、妹の婚礼の買い物に来た町で、王が人を信じず、多くの人々を殺していると知る。怒ったメロスは王城へ入り、捕らえられて死刑を宣告される。妹の結婚式を済ませたいと願い、友人セリヌンティウスを身代わりに残して、三日目の日没までに戻る約束をする。村へ帰ったメロスは妹の婚礼を見届け、再び町へ向かう。途中、川の氾濫や山賊に阻まれ、疲れ果てて一度は約束を投げ出しそうになる。", "それでも泉の水で力を取り戻し、待つ友のもとへ走る。処刑の直前に到着したメロスは、自分が途中で弱い心を抱いたことを友に告白する。友もまた、一度だけメロスを疑ったと打ち明ける。二人は互いを殴って抱き合い、その姿を見た王は、人の心の真実を認めて仲間に入れてほしいと願う。人々の歓声の中、メロスは少女からマントを差し出され、裸体を友に指摘されて赤面する。"], "people": [["メロス", "王に怒り、友との約束を守るために帰路を走る羊飼い。"], ["セリヌンティウス", "メロスの身代わりとして刑場で待つ友人。"], ["王ディオニス", "人を信じず、メロスが戻らないことを予想する王。"]], "theme": "信頼は、疑いや弱さが一度も生まれないことなのだろうか。二人が再会後に互いの揺らぎを告白する場面を読むと、信頼を支える行動や正直さにも目を向けられる。これは読み方の一例で、作品を単純な教訓だけに限定するものではない。", "memory": "走り切った結果だけでなく、途中の迷いと再会後の告白を読む。", "questions": ["メロスが走る理由は、出発時と泉の水を飲んだ後でどう変わっているだろう。", "相手を一度疑ったことと、信頼を失うことは同じだろうか。二人の告白を手がかりに考えてみよう。"], "links": ["rashomon", "gongitsune"], "sources": [{"title": "青空文庫「走れメロス」本文", "url": "https://www.aozora.gr.jp/cards/000035/files/1567_14913.html"}, {"title": "青空文庫 図書カード", "url": "https://www.aozora.gr.jp/cards/000035/card1567.html"}, {"title": "国立国会図書館 レファレンス協同データベース（1940年5月の掲載調査）", "url": "https://crd.ndl.go.jp/reference/detail?page=ref_view&id=1000244878"}], "reading": "はしれメロス", "image": "assets/melos.webp", "imageAlt": "夕暮れの道を走るメロスの作品イメージ"}, {"id": "restaurant", "cat": "literature", "name": "注文の多い料理店", "sub": "宮沢賢治｜1924年・同名童話集収録の一編", "motif": "doors", "gist": "歓迎されていると思って進んだ料理店で、客自身が料理されようとしていた。言葉の受け取り方が逆転する物語。", "intro": "山奥へ狩りに来た二人の紳士は、案内人とはぐれ、空腹のまま道に迷ってしまう。そこへ現れたのが、西洋料理店「山猫軒（やまねこけん）」。歓迎の言葉に安心して入るが、奥へ進むたびに、扉には不思議な注文が書かれている。", "synopsisSummary": ["二人の若い紳士が、猟銃と犬を連れて山奥へ狩りに出かける。獲物は見つからず、案内人ともはぐれ、二匹の犬も倒れてしまう。腹をすかせた二人は、西洋料理店「山猫軒」を見つける。入口には歓迎の言葉があり、奥へ進むたびに、扉に次々と指示が書かれている。髪や靴をきれいにし、鉄砲を置き、帽子・外套・靴を脱ぎ、金属の品を外すこと。二人はどれも、立派な店の作法や、料理を食べるための準備だと都合よく考えて従う。", "さらにクリームを塗り、酢くさい香水を振りかけ、塩を体にもみ込むよう求められたところで、自分たちが食べられる側なのだと気づく。奥から聞こえる声におびえ、泣き出した二人の顔は、紙くずのようにしわくちゃになる。そこへ先ほどの犬が現れて奥へ飛び込み、料理店は消える。案内人と再会して東京へ帰った二人だが、その顔は元には戻らない。"], "people": [["二人の紳士（しんし）", "狩りに来た青年たち。店の注文を自分たちに都合よく理解する。"], ["山猫軒（やまねこけん）の奥の声", "二人を奥へ誘い、料理の準備を進める存在。"], ["二匹の犬", "店の奥へ飛び込み、危機の場面を変える。"]], "theme": "同じ言葉でも、受け手の期待によって意味が違って見える。二人が注文をどう説明しているかを追うと、危険の手がかりを見落とす仕組みが浮かぶ。また、動物を狩る人間が食べられる側になる逆転から、人と自然の関係を考える読み方もできる。", "memory": "扉の言葉を、客の側と店の側の両方から読み直す。", "questions": ["どの扉の言葉から、二人とは違う意味を読み取れただろう。初めに戻って確かめてみよう。", "期待していることに合う説明だけを選んでしまう場面は、日常にもあるだろうか。物語との違いも考えよう。"], "links": ["spider", "gongitsune"], "sources": [{"title": "青空文庫「注文の多い料理店」本文", "url": "https://www.aozora.gr.jp/cards/000081/files/43754_17659.html"}, {"title": "青空文庫 図書カード（1924年刊行の童話集に収録）", "url": "https://www.aozora.gr.jp/cards/000081/card43754.html"}], "reading": "ちゅうもんのおおいりょうりてん", "image": "assets/restaurant.webp", "imageAlt": "森にたたずむ料理店の作品イメージ"}, {"id": "gongitsune", "cat": "literature", "name": "ごん狐", "sub": "新美南吉｜1932年発表", "motif": "fox", "gist": "いたずらを悔いた狐は、名乗らずに贈り物を届け続けた。思いが相手へ届くまでのすれ違いを描く物語。", "intro": "ひとりぼっちの小狐ごんは、村の人にいたずらをして暮らしている。ある日、兵十が川で捕った魚を逃がし、うなぎを持ち去ってしまった。しばらくして兵十の母の葬式を見たごんは、自分のしたことが気になり始める。", "synopsisSummary": ["村の近くに住む小狐のごんは、ひとりぼっちで、いたずらばかりしていた。ある日、兵十が川で捕った魚を逃がし、うなぎも持ち去る。やがて兵十の母の葬式を見たごんは、あのうなぎは病気の母に食べさせるものだったのではないかと思い、後悔する。自分と同じひとりぼっちになった兵十のために、ごんは償いを始める。最初は魚屋から盗んだいわしを家に入れるが、兵十は盗人と思われて殴られてしまう。その後、ごんは栗や松たけを届けるようになる。", "贈り主を知らない兵十は、加助から神様のしわざだと言われる。話を聞いたごんは、自分に礼を言ってもらえないことを面白くないと感じる。ある日、栗を持って家に入ったごんを見た兵十は、またいたずらに来たと思い、火縄銃で撃つ。土間に置かれた栗を見て初めて贈り主に気づいた兵十が問いかけると、ごんは目をつぶったままうなずく。銃口から青い煙が出る中、物語は終わる。"], "people": [["ごん", "ひとりぼっちの小狐。いたずらを悔い、兵十へ贈り物を届ける。"], ["兵十（ひょうじゅう）", "母を亡くした村人。贈り主がごんだとは知らない。"], ["加助（かすけ）", "不思議な贈り物は神様のしわざではないかと話す村人。"]], "theme": "ごんが知っていることと、兵十が知っていることは異なる。善意があっても、相手がその意図を知らなければ同じようには受け取れない。二人のすれ違いを情報の差から読むと、単にどちらか一方を責めるだけでは捉えきれない悲しさに気づける。", "memory": "何が起きたかに加えて、誰が何を知っていたかをたどる。", "questions": ["それぞれの場面で、ごんだけが知っていること、兵十だけが知っていることを分けてみよう。", "よかれと思った行動が違う意味に受け取られるのは、どんなときだろう。作品にない解決を正解とせず考えてみよう。"], "links": ["hana", "melos"], "sources": [{"title": "青空文庫「ごん狐」本文", "url": "https://www.aozora.gr.jp/cards/000121/files/628_14895.html"}, {"title": "青空文庫 図書カード（初出：1932年1月）", "url": "https://www.aozora.gr.jp/cards/000121/card628.html"}], "reading": "ごんぎつね", "image": "assets/gongitsune.webp", "imageAlt": "秋の里にいる狐のごんの作品イメージ"}, {"id": "gloves", "cat": "literature", "name": "手袋を買いに", "sub": "新美南吉｜1943年・没後発表", "motif": "gloves", "gist": "人間を怖がる母に代わり、子狐がひとりで手袋を買いに行く。小さな買い物を通して、思い込みと実際の出会いを描く物語。", "intro": "雪の中で遊んだ子狐は、手が冷たくなってしまう。母狐は手袋を買ってやろうとするが、人間の町へ近づくのが怖い。そこで子狐の片手を人間の子供の手に変え、店では必ずその手を出すよう言い聞かせる。", "synopsisSummary": ["雪で手を冷やした子狐に、母狐は手袋を買おうとする。しかし以前、人間に追われたことを思い出し、町へ進めなくなる。母は子狐の片手を人間の手に変え、二枚の硬貨を持たせる。店の戸をたたき、人間の手を差し出して手袋を頼むよう教え、ひとりで送り出す。ところが子狐は、戸の隙間から漏れる光に驚き、間違えて狐の手を出してしまう。", "帽子屋は狐だと気づくが、受け取ったお金が本物だと確かめ、手袋を売ってくれる。恐ろしい目に遭わなかった子狐は、帰り道で人間の母子の優しい会話を聞き、自分の母が恋しくなる。母狐のもとへ戻った子狐は、狐の手を出しても大丈夫だったと話す。母は驚き、喜びながら、人間は本当にいいものなのかと繰り返しつぶやく。子の体験は、母が抱いていた人間への見方を問い直すきっかけになった。"], "people": [["子狐", "雪遊びで手を冷やし、ひとりで町へ手袋を買いに行く。"], ["母狐", "人間を怖がりながら、子狐に買い物の仕方を教える。"], ["帽子屋", "子狐の差し出した硬貨を確かめ、手袋を売る店の主人。"]], "links": ["gongitsune", "restaurant"], "sources": [{"title": "青空文庫「手袋を買いに」本文", "url": "https://www.aozora.gr.jp/cards/000121/files/637_13341.html"}, {"title": "青空文庫 図書カード（1943年9月刊の童話集に収録）", "url": "https://www.aozora.gr.jp/cards/000121/card637.html"}, {"title": "東京外国語大学文書館 新美南吉展資料（1933年執筆と1943年発表を区別）", "url": "https://www.tufs.ac.jp/common/archives/pamphlet-niiminankichi.pdf"}], "reading": "てぶくろをかいに", "image": "assets/gloves.webp", "imageAlt": "雪の夜に手袋を買いに行く子狐の作品イメージ"}, {"id": "goshu", "cat": "literature", "name": "セロ弾きのゴーシュ", "sub": "宮沢賢治｜1934年・没後発表", "motif": "cello", "gist": "楽団で叱られてばかりのセロ奏者の家に、毎晩動物がやって来る。思いがけない相手とのやり取りが、演奏と心を変えていく物語。", "intro": "楽団でセロを弾くゴーシュは、演奏がうまくいかず、楽長に叱られてばかりいる。夜、自宅でも一人で練習を続けていると、三毛猫が訪ねてきた。それを皮切りに、動物たちが次々と彼の家に現れる。", "synopsisSummary": ["ゴーシュは音楽会を前に、楽団で何度も演奏を注意される。夜も家で練習していると三毛猫が来て、曲を弾いてほしいと頼む。ゴーシュは腹を立て、激しい曲を弾いて追い返す。次の晩にはかっこうが来る。鳴き声に合わせるうちにその音程に感心するが、最後は怒って追い立ててしまう。その次の晩、狸の子は二本の棒でセロをたたいて拍子を取り、ゴーシュの弦の音が遅れるところを教える。", "続いて野ねずみの母子が訪れ、子の病気を治してほしいと頼む。ゴーシュが子をセロの中に入れて弾くと、子は元気になり、母は喜ぶ。やがて音楽会は成功し、アンコールで一人演奏したゴーシュは、楽長や仲間に認められる。動物との夜を重ねるうちに、演奏は変わっていた。帰宅したゴーシュは、かっこうを思い出し、遠くの空に向かって、あのときはすまなかったと語りかける。"], "people": [["ゴーシュ", "楽団でセロを弾く青年。自宅でも練習を続けている。"], ["訪ねてくる動物たち", "三毛猫、かっこう、狸の子、野ねずみの母子。それぞれ用事や願いを持って来る。"], ["楽長と楽団の仲間", "音楽会へ向けてゴーシュと合奏し、演奏を見守る。"]], "links": ["restaurant", "hana"], "sources": [{"title": "青空文庫「セロ弾きのゴーシュ」本文", "url": "https://www.aozora.gr.jp/cards/000081/files/470_15407.html"}, {"title": "青空文庫 図書カード", "url": "https://www.aozora.gr.jp/cards/000081/card470.html"}, {"title": "川崎市アートセンター公演公式紹介（1934年発表の記載）", "url": "https://www.artericca-shinyuri.com/program2024/detail/0429-02.php"}], "reading": "セロひきのゴーシュ", "image": "assets/goshu.webp", "imageAlt": "セロを弾くゴーシュと動物の作品イメージ"}, {"id": "toshishun", "cat": "literature", "name": "杜子春", "sub": "芥川龍之介｜1920年発表", "motif": "mountain", "gist": "お金があれば近づき、なくなると離れていく人々に疲れた青年が、仙人を目指す。厳しい試練の中で、手放せない思いに気づく物語。", "intro": "財産を使い果たした杜子春が、洛陽の町で途方に暮れていると、不思議な老人が声をかけてくる。老人は、ある場所を掘れば黄金が見つかると教える。一夜にして豊かになれる話を聞いた杜子春は、そこへ向かう。", "synopsisSummary": ["杜子春は、老人に黄金のありかを教えられ、大金持ちになる。だが浪費して財産を失い、寄りついていた人々も離れていく。老人にもう一度助けられても、同じことを繰り返す。金の有無で態度を変える人々に失望した杜子春は、三度目には金を求めず、老人のような仙人になりたいと願う。老人は鉄冠子と名乗り、どんなことがあっても声を出さないよう命じる。", "杜子春は恐ろしい目に遭い、地獄で責められても黙り続ける。しかし馬の姿にされた父母が打たれ、母が自分の苦しみより息子を気遣う声を聞くと、思わず母を呼ぶ。その瞬間、元の洛陽へ戻っていた。鉄冠子は、父母を見ても黙っていたら命を絶つつもりだったと明かす。杜子春が人間らしい正直な暮らしを望むと、家と畑を与えると告げる。"], "people": [["杜子春（とししゅん）", "富を失って人々に失望し、仙人になりたいと願う青年。"], ["鉄冠子（てっかんし）", "老人の姿で現れ、杜子春を助けたあと試練を与える仙人。"], ["杜子春の父母", "試練の中で馬の姿となって現れる。母は責められながらも息子を気遣う。"]], "links": ["akutagawa", "spider", "rashomon"], "sources": [{"title": "青空文庫「杜子春」本文（末尾に1920年7月の初出）", "url": "https://www.aozora.gr.jp/cards/000879/files/43015_17432.html"}, {"title": "青空文庫 図書カード", "url": "https://www.aozora.gr.jp/cards/000879/card43015.html"}], "reading": "とししゅん", "image": "assets/toshishun.webp", "imageAlt": "杜子春と仙人の作品イメージ"}, {"id": "yodaka", "cat": "literature", "name": "よだかの星", "reading": "よだかのほし", "sub": "宮沢賢治｜1934年・没後発表", "motif": "starbird", "gist": "見た目や名前を理由に追い詰められた鳥が、空の向こうに居場所を求める。孤独と、生きることの苦しさを描く物語。", "intro": "よだかは、見た目を理由にほかの鳥から嫌われている。ある日、鷹から名前を変えろと脅され、従わなければ命まで奪うと言われる。自分が虫を食べて生きていることにも苦しむよだかは、遠い空を見上げる。", "synopsisSummary": ["よだかは、見た目のために鳥たちから嫌われ、鷹には名前を変えなければ殺すと脅される。夜空で虫を捕らえるよだかは、自分もほかの命を奪っていることに気づき、苦しくなる。弟のかわせみに遠くへ行くと告げ、引き留められながらも別れる。そして太陽に、自分を連れていってほしいと頼むが、夜の鳥なのだから星に頼むよう言われる。", "夜になり、よだかは星々に呼びかける。しかし返事をもらえなかったり、冷たく断られたりして、どこにも迎え入れてもらえない。それでも何度も羽ばたき、息を切らしながら高い空へ昇っていく。力を使い果たしたその体は、やがて青く美しい光となる。よだかは星となって燃え続ける。"], "people": [["よだか", "見た目や名前を理由に責められ、居場所を求める鳥。"], ["鷹（たか）", "自分と似た名前を使うなと、よだかを脅す鳥。"], ["かわせみ", "よだかの弟。別れを告げる兄を引き留める。"], ["太陽・星々", "よだかが、連れていってほしいと呼びかける相手。"]], "links": ["goshu", "restaurant"], "sources": [{"title": "青空文庫「よだかの星」本文", "url": "https://www.aozora.gr.jp/cards/000081/files/473_42318.html"}, {"title": "青空文庫 図書カード", "url": "https://www.aozora.gr.jp/cards/000081/card473.html"}, {"title": "国立音楽大学図書館 展示資料（1934年発表の確認・PDF）", "url": "https://www.lib.kunitachi.ac.jp/wp-content/uploads/2024/01/tenji1012.pdf"}], "image": "assets/yodaka.webp", "imageAlt": "星空を飛ぶ小さなよだかの作品イメージ"}, {"id": "trolley", "cat": "literature", "name": "トロッコ", "reading": "トロッコ", "sub": "芥川龍之介｜1922年発表", "motif": "railcart", "gist": "憧れのトロッコで遠くへ来た少年は、帰り道を一人で走ることになる。楽しさが心細さへ変わる一日を描く物語。", "intro": "八歳の良平は、鉄道工事で使うトロッコに夢中だ。大人が車を押し、乗って走っていく姿を見て、自分も乗りたいと思っている。ある日、二人の若い作業員に頼んで車を押す手伝いを始めると、道は村から遠くへ続いていた。", "synopsisSummary": ["八歳の良平は、村の近くの鉄道工事で使うトロッコに憧れている。弟たちと勝手に動かして叱られたあとも、乗りたい気持ちは消えない。ある日、若い二人の作業員に車を押す手伝いを申し出る。下り坂では一緒に乗せてもらい、良平は夢がかなったように喜ぶ。しかし竹やぶや畑を通り、家から離れるほど、帰りが気になり始める。作業員たちが休んだり買い物をしたりしても、良平はなかなか帰りたいと言えない。", "やがて作業員たちは、今日は出先に泊まるので、もう一人で帰るよう告げる。良平は急に心細くなり、暗くなりかけた長い道を必死で走る。ようやく家の門口へ着くと、大声で泣き出す。その後、大人になった良平は東京で校正の仕事をしているが、今も時折、あの日の薄暗い道と心細さを思い出す。"], "people": [["良平（りょうへい）", "トロッコに憧れる八歳の少年。"], ["二人の作業員", "良平に車を押す手伝いをさせ、途中では一緒に乗せる。"], ["良平の弟・家族", "良平の身近な人たち。帰宅して泣き出した良平のもとに集まり、理由を尋ねる。"]], "links": ["akutagawa", "hana"], "sources": [{"title": "青空文庫「トロッコ」本文", "url": "https://www.aozora.gr.jp/cards/000879/files/43016_16836.html"}, {"title": "青空文庫 図書カード（新字新仮名）", "url": "https://www.aozora.gr.jp/cards/000879/card43016.html"}, {"title": "青空文庫 別版図書カード（初出：1922年3月『大観』）", "url": "https://www.aozora.gr.jp/cards/000879/card169.html"}], "image": "assets/trolley.webp", "imageAlt": "工事用トロッコと二人の作業員、少年の作品イメージ"}, {"id": "lamp", "cat": "literature", "name": "おじいさんのランプ", "reading": "おじいさんのランプ", "sub": "新美南吉｜1942年・同名童話集収録", "motif": "oldlamp", "gist": "ランプで暮らしを築いた男は、電灯の時代を受け入れられずにいた。大切な仕事と別れ、次の道を選ぶ物語。", "intro": "東一が見つけた古いランプを見て、祖父は昔の話を始める。身寄りのなかった少年・巳之助は、ランプの明るさに魅せられ、村で売り歩いて暮らしを築いた。ところが町に電灯が現れ、村にも電気を引く話が持ち上がる。", "synopsisSummary": ["孫の東一が見つけたランプをきっかけに、祖父が若いころを語る。身寄りのない巳之助は、町で見たランプの明るさに驚き、村で売る仕事を始める。商売は暮らしを支え、家族も持つようになる。しかし電灯が広がり、村にも電気を引くことになると、仕事を失う不安から強く反対する。ついには区長を恨み、その家に火をつけようと考える。", "ところが持ち出した古い火打ち道具では、思うように火がつかない。不便さに腹を立てた巳之助は、自分も古い道具にしがみついていたのだと気づき、放火を思いとどまる。池のほとりでランプに火をともして別れを惜しみ、石で三つを割るが、涙が出て続けられない。その後は本屋になる。祖父は、ランプを売る方法もあったと処分を振り返りながら、仕事を変えた決断について孫に語る。"], "people": [["巳之助（みのすけ）", "ランプを売って暮らしを築く男。東一の祖父の若いころ。"], ["東一（とういち）", "古いランプを見つけ、祖父から昔の話を聞く孫。"], ["区長（くちょう）", "電気を引くかどうか決める村会で、議長を務めた人。巳之助から恨まれる。"]], "links": ["gloves", "gongitsune"], "sources": [{"title": "青空文庫「おじいさんのランプ」本文", "url": "https://www.aozora.gr.jp/cards/000121/files/635_14853.html"}, {"title": "青空文庫 図書カード（1942年10月刊『おぢいさんのランプ』収録）", "url": "https://www.aozora.gr.jp/cards/000121/card635.html"}], "image": "assets/lamp.webp", "imageAlt": "灯油ランプのそばで昔を思う老人の作品イメージ"}];
const finalThoughts={"rashomon": "下人は老婆を責めていたのに、「生きるためだ」という話を聞くと、同じ理由で老婆の着物を奪います。相手には許せなかった行いを、自分がする側に回ってしまったのです。追い詰められたとき、人は自分に都合のよい理由をつけてしまうことがある。下人の変わり方から、善悪の判断が揺れる怖さが伝わってきます。", "hana": "内供は、鼻を短くすれば笑われなくなると思っていましたが、周囲の反応は逆でした。長い鼻に戻って安心する姿を見ると、苦しさは鼻そのものだけでなく、人にどう見られるかにもあったと分かります。周りの人も、悩んでいた内供が喜ぶと素直には喜びません。自分の気持ちも他人の気持ちも、外見を変えるだけでは思いどおりにならない。そのおかしさと切なさが残る話です。", "spider": "犍陀多は自分も落ちるのを恐れ、後から来る人を追い払おうとします。その直後に糸は切れ、せっかく与えられた救いの機会を失ってしまいました。助かりたいという気持ちが、自分だけ助かればよいという考えに変わってしまったのです。他の人を受け入れられなかった犍陀多の姿に、この話の悲しさがあります。", "melos": "メロスは諦めかけても走って戻り、友も一度は疑いながら待ち続けました。再会した二人は、その弱さを隠さず話して抱き合います。信じ合うとは、一度も迷わないことだけではなく、迷ったあとに相手のために行動し、正直に向き合うことでもある。二人の姿から、そんな受け取り方のできる物語です。", "restaurant": "二人は歓迎されていると思い込み、おかしな注文にも都合のよい理由をつけて従っていました。自分たちが食べられると気づいたときには、すっかり店の言いなりになっていたのです。食べたいものを探していた二人が、食べられる側に回ってしまう。その逆転を通して、自分に都合のよい見方だけでは、目の前の危険にも気づけないことが見えてきます。", "gongitsune": "ごんは償おうとしていましたが、その気持ちは兵十に伝わらず、撃たれてしまいます。兵十が贈り主はごんだったと気づくのは、その後でした。善意があっても、相手がその意図を知らなければ、同じようには受け取れない。相手を思いながらもすれ違ってしまう、その悲しさが残る物語です。", "gloves": "子狐は間違えて狐の手を出しましたが、帽子屋はお金を受け取り、手袋を売ってくれました。母が心配していたような出来事は起こらなかったのです。その話を聞いた母は、人間は本当に怖いだけの相手なのかと考え直し始めます。聞いていた話と、自分で出会って知ることは違う。その小さな違いが、相手を見る目を変えていく物語です。", "goshu": "ゴーシュは初め、訪ねてきた動物を邪魔に思い、怒って追い返していました。けれども一緒に音を出したり、頼みに応じて弾いたりする中で、演奏がよくなっていきます。人前で認められた夜、彼が思い出すのは、自分がつらく当たったかっこうでした。上達したことだけでなく、関わった相手を思いやれるようになったことにも、ゴーシュの変化が見える物語です。", "toshishun": "杜子春は仙人になるために黙り続けますが、苦しむ母が自分を気遣う声には耐えられず、母を呼びます。約束を破ったその言葉は、親を思う気持ちから出たものでした。鉄冠子はそれを責めず、杜子春は特別な力よりも、人間らしい正直な暮らしを望むようになります。何かを手に入れるために、大切な人への思いまで捨てなくてよい。杜子春の選び直しから、そう受け取れる物語です。", "yodaka": "よだかは見た目や名前を責められ、助けを求めた空でも冷たくされます。一方で、自分も虫の命を奪って生きていることに苦しんでいました。最後に星となる姿は、周囲に認められて問題が解決した結末ではありません。何が彼をそこまで追い詰めたのかを見つめると、外見だけで相手を決めつけず、言葉の向こうにある苦しみに気づく大切さが伝わってきます。", "trolley": "良平はトロッコに乗れて大喜びしますが、遠くへ進むほど帰りが気になり、一人で帰るよう言われると強い心細さに襲われます。家に着いて泣き出したのは、ようやく怖さをこらえなくてよくなったからとも読めます。楽しかったはずの一日が、大人になっても心細い記憶として残りました。子供にとっては、慣れた場所から離れ、頼れる人がいなくなること自体が、大きな出来事なのです。", "lamp": "巳之助は仕事を失うのが怖くて区長を恨みますが、古い道具の不便さに気づき、火をつけるのをやめます。大切にしてきたランプと別れ、本屋として生きる道を選びました。ただし後年は、ランプを壊す以外の方法もあったと振り返ります。自分が築いたものを大切にすることと、変化に合わせてやり方を変えることは、どちらも必要なのだと読める物語です。"};

function timestampText(iso){return iso.slice(0,10).replaceAll('-','/')+' '+iso.slice(11,19)+' JST'}
function articleDates(x,compact=false){const m=articlePublication[x.id];if(!m)return '';const first=!m.firstPublishedDate?'公開準備中':m.firstPublishedAt?`<time datetime="${m.firstPublishedAt}">${timestampText(m.firstPublishedAt)}</time>`:`<time datetime="${m.firstPublishedDate}">${m.firstPublishedDate.replaceAll('-','/')}</time>（時刻未確認）`;const updated=m.updateStatus==='pending'?'公開準備中':`<time datetime="${m.updatedAt}">${timestampText(m.updatedAt)}</time>`;return compact?`<span class="card-dates">内容更新：${m.updateStatus==='pending'?'公開準備中':m.updatedAt.slice(0,10).replaceAll('-','/')+' '+m.updatedAt.slice(11,16)+' JST'}</span>`:`<div class="article-dates"><p>初回公開：${first}</p><p>内容更新：${updated}</p><p class="change-note">${esc(m.changeNote)}</p></div>`}
function titleText(x){return `${esc(x.name)}${x.reading?` <span class="title-reading">（${esc(x.reading)}）</span>`:""}`}
function normalizeSearch(value){return value.normalize("NFKC").toLowerCase().replace(/[ァ-ヶ]/g,c=>String.fromCharCode(c.charCodeAt(0)-0x60))}
function card(x){return `<a class="card ${x.cat}" href="#/article/${x.id}"><div class="card-visual${x.image?' illustrated':''}">${x.image?storyImage(x,'card'):art(x)}</div><div class="cardbody"><span class="label">${catNames[x.cat]}${x.id==='kawasaki'?' · 準備中':''}</span><h3>${titleText(x)}</h3><span class="meta">${byline(x)}</span>${articleDates(x,true)}<p>${esc(x.gist)}</p><span class="readmore">${x.id==='kawasaki'?'企画を読む':'詳しく読む'} <span aria-hidden="true">→</span></span></div></a>`}
function listHash(){const p=new URLSearchParams();if(category!=='all')p.set('cat',category);if(query)p.set('q',query);return '#/'+(p.size?'?'+p.toString():'')}
function renderList(){const q=normalizeSearch(query);const found=items.filter(x=>(category==='all'||x.cat===category)&&normalizeSearch([x.name,x.reading||'',x.sub,x.gist,x.intro,...(x.synopsisSummary||[])].join(' ')).includes(q));main.innerHTML=`<div class="sectionhead"><h2>知識の扉をひらく</h2><span class="count" role="status">${found.length}件${category==='all'&&!query?' · 企画を含む':''}</span></div>${found.length?`<div class="grid">${found.map(card).join('')}</div>`:'<div class="empty"><h2>該当する項目がありません</h2><p>別の言葉で検索するか、分野の絞り込みを外してみてください。</p><button class="reset" id="reset">すべての項目を見る</button></div>'}<aside class="editorial"><strong>この図鑑について</strong><p>登場人物を知り、あらすじから要約、まとめ、原典へ。出来事と解釈を分け、今の暮らしにもつながる問いを育てます。文学の解説には読み方の一例を含みます。地域文化は企画段階です。文学作品の絵はAIによるイメージイラストです。実物の写真・史料・書籍の表紙ではありません。人物・地域の図柄は本サイトのオリジナル装飾です。</p></aside>`;document.getElementById('reset')?.addEventListener('click',reset)}
const authorBackground=[{"title": "東京の、どこで生まれた？", "text": "1892年3月1日、東京市京橋区入船町で生まれました。今の中央区明石町、聖路加国際病院の周辺にあたります。実父は牛乳販売業を営んでいました。生まれた町と、その後に育った町は別です。", "sources": [{"title": "たばこと塩の博物館「芥川龍之介がみた江戸・東京」", "url": "https://www.tabashio.jp/exhibition/2023/2309sep/index.html"}, {"title": "墨田区観光協会「芥川龍之介生育の地」", "url": "https://visit-sumida.jp/wp/spot/6005"}]}, {"title": "育ったのは、本所・両国", "text": "乳児のころ、母の実家の芥川家に引き取られ、18歳まで本所（ほんじょ）・両国周辺で育ちました。住まいは今の墨田区両国3丁目にあたる場所です。俳句や芝居などに親しむ家庭でした。", "sources": [{"title": "たばこと塩の博物館「芥川龍之介がみた江戸・東京」", "url": "https://www.tabashio.jp/exhibition/2023/2309sep/index.html"}, {"title": "墨田区立図書館「すみだ文学散歩」（PDF）", "url": "https://www.library.sumida.tokyo.jp/images/upload/sumidabunngakusannpo.pdf"}]}, {"title": "なじみの景色は、隅田川", "text": "育った家の近くには隅田川や回向院（えこういん）がありました。芥川は『大川の水』にも、川沿いの風景を書いています。育った町を知ってから作品を読むと、身近な景色を作家がどう見ていたか、たどる楽しみが生まれます。", "sources": [{"title": "たばこと塩の博物館「芥川龍之介がみた江戸・東京」", "url": "https://www.tabashio.jp/exhibition/2023/2309sep/index.html"}, {"title": "青空文庫「大川の水」本文", "url": "https://www.aozora.gr.jp/cards/000879/files/123_15167.html"}]}, {"title": "夏目漱石との出会い", "text": "1915年11月、友人とともに夏目漱石を訪ねました。翌年、漱石から『鼻』を高く評価され、名前を広く知られる転機になります。書き続けていた若い芥川にとって、先輩作家からの言葉は大きな励みになりました。", "sources": [{"title": "日本近代文学館「教科書のなかの文学／教室のそとの文学──芥川龍之介『羅生門』とその時代」", "url": "https://www.bungakukan.or.jp/cat-exhibition/9062/"}]}, {"title": "小説家になるまで、何をしていた？", "text": "読書だけでなく、幼いころから回覧雑誌も作っていました。東京帝国大学では英文学を学び、仲間との同人誌活動にも取り組みます。1915年に『羅生門』、1916年に『鼻』を発表しました。漱石に褒められて初めて書き始めたのではなく、それまでの読書や創作の積み重ねがありました。", "sources": [{"title": "山梨県立文学館デジタルアーカイブ「芥川龍之介」", "url": "https://digital-archive.pref.yamanashi.jp/literary/19"}, {"title": "たばこと塩の博物館「芥川龍之介がみた江戸・東京」", "url": "https://www.tabashio.jp/exhibition/2023/2309sep/index.html"}]}, {"title": "作家の暮らしを支えた田端", "text": "1914年に田端（たばた）へ移り、ここが創作の大切な拠点になりました。室生犀星（むろう さいせい）ら作家との交流も、田端に文士が集まるきっかけの一つとなります。大学卒業後は英語を教えながら執筆し、1919年に教職を離れ、文筆に専念しました。田端に移ってからも、横須賀や鎌倉で暮らした時期があります。", "sources": [{"title": "北区「芥川龍之介記念館とは」", "url": "https://www.city.kita.lg.jp/culture-tourism-sports/culture/1010296/1010304/1010305.html"}, {"title": "田端文士村記念館", "url": "https://kitabunka.or.jp/tabata/news/16484/"}, {"title": "国立国会図書館「近代日本人の肖像」", "url": "https://www.ndl.go.jp/portrait/datas/224"}]}];
function renderArticle(x){const literary=x.cat==='literature';main.innerHTML=`<button class="back" id="back">← 一覧に戻る</button><article class="article"><header class="articleheader"><div><span class="label">${catNames[x.cat]} / ${literary?'名作を読み解く':x.cat==='person'?'作品と人物をつなぐ':'地域を知る入口'}</span><h2${(x.id==="goshu"||x.id==="lamp")?' class="long-title"':''}>${titleText(x)}</h2><p class="meta">${byline(x)}</p>${articleDates(x)}${x.id==='gloves'?'<p class="edition-note">絵本の一例：<a href="https://www.kaiseisha.co.jp/books/9784039633101" target="_blank" rel="noopener noreferrer">偕成社（かいせいしゃ）・黒井健（くろい けん）絵／32ページ ↗</a><span>ページ数は版によって異なります。</span></p>':''}</div>${x.image?`<figure class="story-figure">${storyImage(x,'article')}<figcaption>作品をもとにしたAIイメージイラスト</figcaption></figure>`:x.id==='kawasaki'?`<figure class="emblem-figure">${art(x)}<figcaption>図鑑オリジナルマーク<br>工場・港・多摩川をモチーフにした創作です。<br>市・区の公式マークではありません。</figcaption></figure>`:art(x)}</header><div class="content">${literary?`<section class="characters"><h3>登場人物</h3><ul class="people">${x.people.map(([n,d])=>`<li><strong>${esc(n)}</strong>${esc(d)}</li>`).join('')}</ul></section>`:''}<section class="synopsis"><h3>${literary?'あらすじ':'概要'}${literary?'<span class="badge">物語の入口</span>':''}</h3><p class="bodytext">${esc(x.intro)}</p></section>${literary?`<section class="digest"><h3>要約</h3><p class="subnote">ここからは結末まで紹介します。</p>${x.synopsisSummary.map(p=>`<p class="bodytext">${esc(p)}</p>`).join('')}</section>`:`<section class="gist"><h3>要点</h3><p class="summary-text">${esc(x.gist)}</p></section>`}${literary?`<section class="conclusion"><h3>まとめ</h3><p class="bodytext">${esc(finalThoughts[x.id])}</p><p class="subnote">作品の出来事を踏まえた、読み方の一例です。</p></section>`:''}${x.id==='akutagawa'?`<section class="author-background"><h3>この人をもっと知る</h3><p class="subnote">生まれた町、育った環境、作家になるまでをたどります。</p>${authorBackground.map(b=>`<section class="background-item"><h4>${esc(b.title)}</h4><p class="bodytext">${esc(b.text)}</p><p class="background-sources">出典：${b.sources.map(z=>`<a href="${esc(z.url)}" target="_blank" rel="noopener noreferrer">${esc(z.title)} ↗</a>`).join(' ／ ')}</p></section>`).join('')}</section>`:''}${!literary&&x.id!=='akutagawa'?`<details><summary>${literary?'もっと知りたい方へ（補足）':'関連情報をもっと読む'}</summary><div class="deep">${!literary?`<h3>関連情報</h3><ul class="people">${x.people.map(([n,d])=>`<li><strong>${esc(n)}</strong>${esc(d)}</li>`).join('')}</ul>`:''}<h3>${literary?'作品の意味・読み方の一例':x.id==='kawasaki'?'制作の考え方':'作品を読む視点'}</h3><p class="bodytext">${esc(x.theme)}</p><h3>記憶に残るポイント</h3><p>${esc(x.memory)}</p>${literary?`<h3>考えるヒント</h3><p class="subnote">読み方の一例です。正解を決めるためではなく、本文の言葉と自分の経験を行き来する問いとして使ってください。</p><ul class="people">${x.questions.map(q=>`<li>${esc(q)}</li>`).join('')}</ul>`:''}</div></details>`:''}<details><summary>出典・確認情報</summary><p class="subnote">${x.id==='kawasaki'?'地域の調査に用いる公式情報の入口です。個別の地域記事の検証完了を意味しません。':'以下を確認し、本文は本サイト独自の言葉で要約しています。解釈は原典の事実記述と区別しています。'}</p><ul class="sources">${x.sources.map(s=>`<li><a href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">${esc(s.title)} ↗</a></li>`).join('')}</ul><p class="subnote">確認日：2026年11月1日。第三者の画像・写真の転載は行っていません。</p></details></div></article>${x.links.length?`<section class="related"><div class="sectionhead"><h2>知識をつなぐ、次の一冊・一人</h2></div><div class="grid">${x.links.map(id=>items.find(z=>z.id===id)).filter(Boolean).map(card).join('')}</div></section>`:''}`;document.getElementById('back').onclick=()=>{location.hash=lastListHash}}
function syncControls(){search.value=query;document.querySelectorAll('[data-cat]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.cat===category)))}
const philosophyParagraphs=["知ることから、人生が少し変わる。", "一つの物語が、誰かの考え方を変えることがあります。", "何気なく読んだ作品が、自分のこれまでの行動を振り返るきっかけになることもあります。", "誰かの優しさに気づいたり、相手の気持ちを考え直したり。", "ときには、自分の信じてきたことが間違っていなかったと、勇気をもらうこともあるでしょう。", "同じ作品でも、10歳のとき、20歳のとき、40歳のときでは、感じることが違うかもしれません。", "今は何も感じなかった言葉が、数年後の自分には大切な言葉になっているかもしれません。", "だからこそ、この図鑑は、一度読んで終わる場所ではなく、何度でも戻ってこられる場所でありたいと考えています。", "難しい知識を、できるだけ分かりやすく。", "知らなかった世界を、もっと身近に。", "そして、そこで得た小さな気づきが、誰かの明日を少しだけ変えるきっかけになれば。", "そんな願いを込めて、この図鑑を少しずつ育てていきます。", "知識との出会いが、自分自身との出会いになる。", "それが「知識の大図鑑」の目指す姿です。"];
function renderPhilosophy(){main.innerHTML=`<button class="back" id="back">← 一覧に戻る</button><article class="philosophy-page"><h2>この図鑑に込めた想い</h2><div class="philosophy-copy">${philosophyParagraphs.map((p,i)=>`<p${i===0?' class="opening"':''}>${esc(p)}</p>`).join('')}</div></article>`;document.getElementById('back').onclick=()=>{location.hash=lastListHash};document.title='この図鑑に込めた想い｜知識の大図鑑'}
function route({focus=false}={}){isRouting=true;const hash=location.hash||'#/';if(hash==='#/about'){renderPhilosophy();if(focus){main.focus({preventScroll:true});main.scrollIntoView({behavior:'auto',block:'start'})}isRouting=false;return}if(hash.startsWith('#/article/')){const id=hash.slice(10);const x=items.find(i=>i.id===id);if(x){document.title=x.name+'｜知識の大図鑑';renderArticle(x);if(focus){main.focus({preventScroll:true});main.scrollIntoView({behavior:'auto',block:'start'})}}else{main.innerHTML='<div class="empty"><h2>項目が見つかりません</h2><p>URLを確認するか、一覧へ戻ってください。</p><a href="#/">一覧に戻る</a></div>';document.title='項目が見つかりません｜知識の大図鑑'}}else{const p=new URLSearchParams(hash.includes('?')?hash.split('?').slice(1).join('?'):'');category=['literature','person','region'].includes(p.get('cat'))?p.get('cat'):'all';query=p.get('q')||'';lastListHash=listHash();syncControls();renderList();document.title='知識の大図鑑｜知るほど、世界がつながる。';if(focus){main.focus({preventScroll:true});document.getElementById('browse').scrollIntoView({behavior:'auto',block:'start'})}}isRouting=false}
function showList(replace=false){const h=listHash();lastListHash=h;if(replace){history.replaceState(null,'',h);renderList();document.title='知識の大図鑑｜知るほど、世界がつながる。'}else if(location.hash===h)renderList();else location.hash=h;syncControls()}
function reset(){category='all';query='';showList();search.focus()}
search.addEventListener('input',()=>{query=search.value;const inArticle=location.hash.startsWith('#/article/')||location.hash==='#/about';if(inArticle)history.pushState(null,'',listHash());showList(true)});
document.getElementById('clear').addEventListener('click',()=>{query='';showList();search.focus()});
document.querySelectorAll('[data-cat]').forEach(b=>b.addEventListener('click',()=>{category=b.dataset.cat;showList()}));
document.querySelector('.skip').addEventListener('click',e=>{e.preventDefault();main.focus({preventScroll:true});main.scrollIntoView({behavior:'auto',block:'start'})});
window.addEventListener('hashchange',()=>route({focus:true}));route();
</script>
