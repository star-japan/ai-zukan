rtraits": [{"src": "assets/kaguya-face-oldman.webp", "label": "", "alt": "竹取りの翁（たけとりのおきな）の創作イメージ", "width": 500, "height": 500}]}, {"name": "おばあさん", "role": "翁とともに姫を育て、別れを悲しむ。", "portraits": [{"src": "assets/kaguya-face-oldwoman.webp", "label": "", "alt": "おばあさんの創作イメージ", "width": 500, "height": 500}]}, {"name": "五人の求婚者（ごにんのきゅうこんしゃ）", "role": "姫との結婚を望み、難しい品物を求められる。", "portraits": [{"src": "assets/kaguya-face-suitors.webp", "label": "結婚を望む五人の男性", "alt": "五人の求婚者（ごにんのきゅうこんしゃ）の創作イメージ", "width": 500, "height": 500}]}, {"name": "帝（みかど）", "role": "姫を宮中へ迎えようとし、のちに文通する。", "portraits": [{"src": "assets/kaguya-face-emperor.webp", "label": "", "alt": "帝（みかど）の創作イメージ", "width": 500, "height": 500}]}, {"name": "天人たち（てんにんたち）", "role": "姫を月へ連れ帰るために現れる。", "portraits": [{"src": "assets/kaguya-face-moonpeople.webp", "label": "月から迎えに来る人々の代表イメージ", "alt": "天人たち（てんにんたち）の創作イメージ", "width": 500, "height": 500}]}], "characterGalleryNote": "求婚者の集合画像は五人をまとめた紹介で、天人の画像は大勢の迎えの人々の代表的なイメージです。", "headerCaption": "縁先で月を眺めるかぐや姫は、育ててくれた二人との別れを悲しみます。", "inlineIllustrations": [{"afterParagraph": 1, "src": "assets/kaguya-bamboo-discovery-scene.webp", "alt": "光る竹を切ったおじいさんは、中にいる小さな女の子を見つけます。後のかぐや姫との出会いです。", "caption": "光る竹を切ったおじいさんは、中にいる小さな女の子を見つけます。後のかぐや姫との出会いです。", "width": 1200, "height": 800}, {"afterParagraph": 3, "src": "assets/kaguya-moon-veranda-scene.webp", "alt": "縁先で月を眺めるかぐや姫は、育ててくれた二人との別れを悲しみます。", "caption": "縁先で月を眺めるかぐや姫は、育ててくれた二人との別れを悲しみます。", "width": 1200, "height": 800}, {"afterParagraph": 4, "src": "assets/kaguya-moon-departure-scene.webp", "alt": "かぐや姫は迎えの車で月へ帰ります。育てたおじいさんとおばあさんは、地上から見送ります。", "caption": "かぐや姫は迎えの車で月へ帰ります。育てたおじいさんとおばあさんは、地上から見送ります。", "width": 1200, "height": 800}]}, {"id": "snow-white", "name": "白雪姫", "reading": "しらゆきひめ", "bodyReadings": {"白雪姫": "しらゆきひめ", "王妃": "おうひ", "継母": "ままはは", "猟師": "りょうし", "鉱石": "こうせき", "棺": "ひつぎ", "喉": "のど", "衝撃": "しょうげき", "婚礼": "こんれい", "求婚": "きゅうこん", "小人": "こびと", "採集": "さいしゅう", "編纂": "へんさん", "追い詰め": "おいつめ"}, "cat": "literature", "primaryCategory": "world-fairytale", "genreLabel": "世界の童話 · グリム童話", "genre": "grimm-folktale", "checkedDate": "2026年11月2日", "sub": "グリム兄弟／採集・編纂｜1812年初収録", "credits": [["グリム兄弟", "ぐりむきょうだい", "採集・編纂"]], "motif": "book", "intro": "真実を答える鏡が、白雪姫は王妃より美しいと告げる。怒った継母に命を狙われ、森へ逃げた姫は七人の小人の家にたどり着く。しかし王妃は、姫が生きていることを知り、姿を変えて追ってきた。", "gist": "美しさで一番になりたい王妃と、追われる姫。ひも、くし、リンゴと手口を変える、グリム版の童話。", "people": [["白雪姫（しらゆきひめ）", "継母に命を狙われ、森の小人たちの家に身を寄せる姫。"], ["王妃（おうひ）", "白雪姫の継母。美しさの順位にこだわり、姫を追う。"], ["七人の小人（しちにんのこびと）", "鉱石を掘って暮らし、白雪姫を受け入れて守る。"], ["猟師（りょうし）", "王妃の命令に背き、白雪姫を逃がす。"], ["王子（おうじ）", "棺の姫を見て心を引かれ、姫が目覚めたあと求婚する。"]], "links": ["cinderella", "redcap", "brothers-grimm"], "synopsisSummary": ["ある国に、雪のように白い肌と黒い髪を持つ白雪姫が生まれました。母の王妃は亡くなり、父王は新しい王妃を迎えます。継母となった王妃は、自分こそ一番美しくなければ気がすみません。いつも真実を答える鏡が、成長した白雪姫の美しさを自分より上だと告げると、姫を憎み、猟師に森へ連れ出して殺すよう命じました。けれど猟師は姫を逃がし、別の証拠を用意して王妃を欺きます。", "森をさまよった白雪姫は、小さな家を見つけました。", "そこには、山で鉱石を掘る七人の小人が暮らしていました。事情を聞いた小人たちは、家事を引き受けることを条件に、姫を住まわせます。昼間、一人で留守番をする姫には、継母が追ってくるかもしれないから、誰も家へ入れないよう言い聞かせました。", "ところが鏡によって姫の居場所を知った王妃は、物売りの老女に変装して訪ねてきます。美しい飾りひもを売り、服を整えるふりをして強く締めると、姫は倒れてしまいました。帰宅した小人たちがひもを切って救います。次に王妃は、別の老女に姿を変え、毒を仕込んだくしを姫の髪に差します。このときも小人たちがくしを取り除き、姫は息を吹き返しました。", "三度目に王妃が持ってきたのは、片側だけに毒のあるリンゴでした。警戒する姫の前で毒のない側を食べ、安全だと思わせます。", "姫がもう片方を口にすると倒れ、今度は小人たちにも助けられません。いつまでも眠っているように見える姫を土に埋めることができず、小人たちはガラスの棺に納め、山で見守り続けました。", "やがて通りかかった王子が姫の姿に心を引かれ、棺を譲ってほしいと願います。小人たちが承知し、家来が棺を運ぶ途中、切り株につまずきました。その衝撃で姫の喉からリンゴのかけらが外れ、姫は目を覚まします。王子から求婚された白雪姫は同意し、二人は結婚することになりました。", "婚礼へ招かれた王妃は、鏡から若い花嫁のほうが美しいと聞き、確かめに来て白雪姫と気づきます。物語は、王妃が熱した鉄の靴を履かされる罰を受け、命を落とすという厳しい結末で終わります。"], "sources": [{"title": "Project Gutenberg・第53話Little Snow-white（Hunt英訳）", "url": "https://www.gutenberg.org/files/5314/5314-h/5314-h.htm"}, {"title": "Project Gutenberg・作者／英訳者没年と米国PD", "url": "https://www.gutenberg.org/ebooks/5314"}, {"title": "Wikisource・1884年Hunt英訳標題紙", "url": "https://en.wikisource.org/wiki/Grimm's_Household_Tales,_Volume_1"}, {"title": "Wikisource・1857年ドイツ語第7版の原文", "url": "https://de.wikisource.org/wiki/Sneewittchen_(1857)"}, {"title": "D. L. Ashliman・初収録と改訂の版史解説", "url": "https://sites.pitt.edu/~dash/grimm053.html"}], "sourceNote": "1812年の『子どもと家庭の童話集』初版から収録された第53話。今回はマーガレット・ハント英訳『Grimm’s Household Tales』（1884年）の本文を収録するProject Gutenberg #5314を参照しました。グリムによるドイツ語最終版は1857年。この記事は1812年初版の再現でも、1857年ドイツ語本文からの直接訳でもありません。参照したハント英訳では、猟師が王妃へ持ち帰る証拠は動物の心臓ですが、1857年ドイツ語版は肺と肝臓です。版・翻訳間に細部の差があるため、両者を完全に同一の本文とは扱いません。要約ではこの身体的な細部を省いています。姫が目覚める原因は棺を運ぶ際の衝撃で、王子の口づけではありません。", "textNote": "子どもへの殺害命令、毒による危害、死と厳しい刑罰を扱います。", "summaryReadings": {"白雪姫": {"key": "白雪姫", "reading": "しらゆきひめ"}, "王妃": {"key": "王妃", "reading": "おうひ"}, "猟師": {"key": "猟師", "reading": "りょうし"}, "小人": {"key": "小人", "reading": "こびと"}}, "image": "assets/snowwhite-cottage-arrival-corrected.webp", "imageAlt": "森をさまよった白雪姫は、小さな家を見つけます。そこは七人の小人の家でした。", "characterGallery": [{"name": "白雪姫（しらゆきひめ）", "role": "継母に命を狙われ、森の小人たちの家に身を寄せる姫。", "portraits": [{"src": "assets/snowwhite-face-snowwhite.webp", "label": "森へ逃げるころの白雪姫", "alt": "白雪姫（しらゆきひめ）の創作イメージ", "width": 500, "height": 500}]}, {"name": "王妃（おうひ）", "role": "白雪姫の継母。美しさの順位にこだわり、姫を追う。", "portraits": [{"src": "assets/snowwhite-face-queen.webp", "label": "変装していない王妃", "alt": "王妃（おうひ）の創作イメージ", "width": 500, "height": 500}]}, {"name": "七人の小人（しちにんのこびと）", "role": "鉱石を掘って暮らし、白雪姫を受け入れて守る。", "portraits": [{"src": "assets/snowwhite-face-dwarfs.webp", "label": "鉱石を掘って暮らす七人", "alt": "七人の小人（しちにんのこびと）の創作イメージ", "width": 500, "height": 500}]}, {"name": "猟師（りょうし）", "role": "王妃の命令に背き、白雪姫を逃がす。", "portraits": [{"src": "assets/snowwhite-face-huntsman.webp", "label": "", "alt": "猟師（りょうし）の創作イメージ", "width": 500, "height": 500}]}, {"name": "王子（おうじ）", "role": "棺の姫を見て心を引かれ、姫が目覚めたあと求婚する。", "portraits": [{"src": "assets/snowwhite-face-prince.webp", "label": "", "alt": "王子（おうじ）の創作イメージ", "width": 500, "height": 500}]}], "characterGalleryNote": "白雪姫の人物画像は、森へ逃げるころの幼い姿です。小人たちには映画版の名前や性格を当てはめていません。", "headerCaption": "森をさまよった白雪姫は、小さな家を見つけます。そこは七人の小人の家でした。", "inlineIllustrations": [{"afterParagraph": 2, "src": "assets/snowwhite-cottage-arrival-corrected.webp", "alt": "森をさまよった白雪姫は、小さな家を見つけます。そこは七人の小人の家でした。", "caption": "森をさまよった白雪姫は、小さな家を見つけます。そこは七人の小人の家でした。", "width": 1200, "height": 800}, {"afterParagraph": 3, "src": "assets/snowwhite-dwarfs-home-scene.webp", "alt": "七人の小人に受け入れられた白雪姫は、家の仕事をしながら一緒に暮らします。", "caption": "七人の小人に受け入れられた白雪姫は、家の仕事をしながら一緒に暮らします。", "width": 1200, "height": 800}, {"afterParagraph": 5, "src": "assets/snowwhite-apple-window-scene.webp", "alt": "変装した王妃は自分で片側を食べて安心させ、毒のある側を白雪姫に渡します。", "caption": "変装した王妃は自分で片側を食べて安心させ、毒のある側を白雪姫に渡します。", "width": 1200, "height": 800}, {"afterParagraph": 7, "src": "assets/snowwhite-awake-prince-scene.webp", "alt": "運ぶときの衝撃で目覚めた白雪姫に、王子は事情を話し、結婚を申し込みます。", "caption": "運ぶときの衝撃で目覚めた白雪姫に、王子は事情を話し、結婚を申し込みます。", "width": 1200, "height": 800}]}, {"id": "pussinboots", "name": "長靴をはいた猫", "reading": "ながぐつをはいたねこ", "bodyReadings": {"長靴": "ながぐつ", "遺産": "いさん", "献上": "けんじょう", "侯爵": "こうしゃく", "肩書": "かたがき", "領地": "りょうち", "魔物": "まもの", "計略": "けいりゃく"}, "cat": "literature", "primaryCategory": "world-fairytale", "genreLabel": "世界の童話 · ペロー童話", "genre": "perrault-folktale", "checkedDate": "2026年11月2日", "sub": "シャルル・ペロー｜1697年初刊行", "motif": "book", "intro": "父の遺産を分けた末の息子に残ったのは、猫一匹だけだった。暮らしを嘆く主人に、猫は袋と長靴を用意してほしいと頼む。獲物を捕まえて王様へ届ける猫は、主人を実在しない侯爵の名で紹介し始めた。", "gist": "猫だけを受け継いだ若者の運命を、猫の計略が変える。贈り物と肩書、見かけへの信頼を操るペローの童話。", "people": [["猫（ねこ）", "袋と長靴を使い、主人を出世させる計画を実行する。"], ["粉ひきの末の息子（こなひきのすえのむすこ）", "猫だけを相続し、カラバ侯爵という肩書を与えられる若者。"], ["王様（おうさま）", "贈り物や見かけの領地から、若者を高く評価する。"], ["姫（ひめ）", "若者に心を引かれ、最後に結婚する。"], ["魔物（まもの）", "城と土地の持ち主。別の生き物に姿を変えられる。"]], "links": ["emperors-new-clothes", "cinderella", "charles-perrault"], "synopsisSummary": ["粉ひきが亡くなり、三人の息子に遺産が分けられます。長男は粉ひき場、次男はロバを受け取りますが、末の息子に残ったのは猫だけでした。これでは暮らしていけないと嘆く主人に、猫は袋と長靴を用意してほしいと言います。頼まれた物を渡すと、猫は獲物を捕まえに出かけました。", "猫はウサギや鳥を王様に献上し、主人の「カラバ侯爵」からの贈り物だと名乗ります。もちろん主人は侯爵ではなく、猫が勝手につけた肩書です。何度も贈り物を届けて王様に覚えてもらうと、次の計画に移ります。王様と姫が川沿いを通る日に、主人を川へ入らせ、侯爵がおぼれていると助けを呼んだのです。さらに主人の服を隠し、盗まれたとうそをつきました。", "王様は主人を助けさせ、立派な服を与えて馬車へ招きます。姫も、装いを整えた若者に心を引かれます。その間に猫は先回りし、草刈りや刈り入れをしている人々を脅して、王様に尋ねられたら土地はカラバ侯爵のものだと答えるよう命じました。皆がそのとおりに答えたため、王様は若者が広い領地を持つと思い込みます。", "実際には、その土地と大きな城の持ち主は、姿を変える力を持つ魔物でした。猫は城へ行き、その力を見せてほしいと頼みます。魔物がライオンになると、猫は驚いて屋根へ逃げました。それでも戻ってくると、今度は小さなネズミにまでは変われないだろうと挑みます。魔物が得意になってネズミへ姿を変えた瞬間、猫は飛びかかって食べてしまいました。", "そこへ来た王様たちを、猫はカラバ侯爵の城へようこそと迎えます。城には魔物が客のために用意したごちそうもあり、王様はますます感心しました。そして若者を姫の夫にと望み、二人はその日のうちに結婚します。猫も高い身分を得て、もう暮らしのためにネズミを追う必要はなくなりました。ほとんど何も持たなかった若者の運命を、猫の一連の計略が変えたのでした。"], "sources": [{"title": "Project Gutenberg：1922年版・長靴をはいた猫全文と二つの教訓", "url": "https://www.gutenberg.org/files/29021/29021-h/29021-h.htm"}, {"title": "Project Gutenberg：作者・訳者・改訂者の生没年と米国PD", "url": "https://www.gutenberg.org/ebooks/29021"}, {"title": "フランス国立図書館：1697年刊童話集の書誌・収録作品", "url": "https://catalogue.bnf.fr/ark:/12148/cb31084290g"}, {"title": "国立国会図書館：Mansion（1870–1942）の著者標目", "url": "https://ndlsearch.ndl.go.jp/books/R100000039-I2515854"}], "sourceNote": "ペロー版は1697年刊『Histoires, ou Contes du temps passé』に収録。これは長靴をはいた猫に類する昔話すべての誕生年ではない。参照英訳はRobert Samberの旧訳をJ. E. Mansionが改訂した『The Fairy Tales of Charles Perrault』（George G. Harrap、1922年8月初刊）、Project Gutenberg #29021のThe Master Cat; or, Puss in Boots。ペロー版の旧英訳に沿い、結末の結婚と猫の出世まで扱う。猫の剣士としての冒険、命の残り回数、映画独自の仲間や敵などは加えない。本文には、猫が土地で働く人々を脅す場面があるため、善意だけの恩返しとしては描かない。参照版の末尾には、受け継いだ財産に対する才覚・勤勉の価値と、若さ・身なりの効果についての二つの教訓がある。上の読みどころはそれをそのまま訳したものではなく、筋に即した独自の解釈。", "textNote": "うそ、脅し、魔物が猫に食べられる場面を含む。描写は抑えている。", "summaryReadings": {"侯爵": {"key": "侯爵", "reading": "こうしゃく"}, "魔物": {"key": "魔物", "reading": "まもの"}}, "image": "assets/pussinboots.webp", "imageAlt": "長靴と袋を持ち、遠くの城へ向かう猫の作品イメージ", "characterGallery": [{"name": "猫（ねこ）", "role": "袋と長靴を使い、主人を出世させる計画を実行する。", "portraits": [{"src": "assets/puss-face-cat.webp", "label": "", "alt": "猫（ねこ）の創作イメージ", "width": 500, "height": 500}]}, {"name": "粉ひきの末の息子（こなひきのすえのむすこ）", "role": "猫だけを相続し、カラバ侯爵という肩書を与えられる若者。", "portraits": [{"src": "assets/puss-face-youngman.webp", "label": "猫を受け継いだ若者", "alt": "粉ひきの末の息子（こなひきのすえのむすこ）の創作イメージ", "width": 500, "height": 500}]}, {"name": "王様（おうさま）", "role": "贈り物や見かけの領地から、若者を高く評価する。", "portraits": [{"src": "assets/puss-face-king.webp", "label": "", "alt": "王様（おうさま）の創作イメージ", "width": 500, "height": 500}]}, {"name": "姫（ひめ）", "role": "若者に心を引かれ、最後に結婚する。", "portraits": [{"src": "assets/puss-face-princess.webp", "label": "", "alt": "姫（ひめ）の創作イメージ", "width": 500, "height": 500}]}, {"name": "魔物（まもの）", "role": "城と土地の持ち主。別の生き物に姿を変えられる。", "portraits": [{"src": "assets/puss-face-ogre.webp", "label": "", "alt": "魔物（まもの）の創作イメージ", "width": 500, "height": 500}]}], "characterGalleryNote": "", "headerCaption": "袋と長靴を用意してもらった猫は、主人のために動き始めます。", "inlineIllustrations": [{"afterParagraph": 1, "src": "assets/pussinboots.webp", "alt": "袋と長靴を用意してもらった猫は、主人のために動き始めます。", "caption": "袋と長靴を用意してもらった猫は、主人のために動き始めます。", "width": 1200, "height": 800}, {"afterParagraph": 4, "src": "assets/puss-mouse-transformation-scene.webp", "alt": "猫に挑まれた魔物は、小さなネズミに変身します。強大な相手を捕まえられる大きさにさせたのが、猫の計略でした。", "caption": "猫に挑まれた魔物は、小さなネズミに変身します。強大な相手を捕まえられる大きさにさせたのが、猫の計略でした。", "width": 1200, "height": 800}, {"afterParagraph": 5, "src": "assets/puss-castle-welcome-scene.webp", "alt": "猫は王様たちを城へ迎え、主人の城だと紹介します。王様はその言葉を信じ、若者の運命が変わります。", "caption": "猫は王様たちを城へ迎え、主人の城だと紹介します。王様はその言葉を信じ、若者の運命が変わります。", "width": 1200, "height": 800}]}, {"id": "emperors-new-clothes", "name": "裸の王様", "reading": "はだかのおうさま", "bodyReadings": {"裸": "はだか", "詐欺師": "さぎし", "絹": "きぬ", "金糸": "きんし", "織り機": "おりき", "老大臣": "ろうだいじん", "披露": "ひろう", "裾": "すそ", "群衆": "ぐんしゅう", "面子": "めんつ", "同調": "どうちょう"}, "cat": "literature", "primaryCategory": "world-fairytale", "genreLabel": "世界の童話 · アンデルセン童話", "genre": "andersen-fairytale", "checkedDate": "2026年11月2日", "sub": "ハンス・クリスチャン・アンデルセン｜1837年初刊行", "motif": "book", "intro": "新しい服が大好きな王様の町に、特別な布を織れるという二人の男が来る。仕事に向かない人や愚かな人には見えない布だという。王様は注文するが、出来具合を見に行った大臣には、何も見えなかった。", "gist": "何も見えないのに、誰もそう言えない。人々の評判と自分の目が食い違う、アンデルセンの童話。", "people": [["王様（おうさま）", "新しい服を好み、見えない布で家来の能力も測ろうとする。"], ["二人の詐欺師（ふたりのさぎし）", "特別な布を織れると偽り、金や材料を受け取る。"], ["老大臣と役人（ろうだいじんとやくにん）", "見えないことを隠し、布をほめて報告する。"], ["子ども（こども）", "王様が服を着ていないことを口にする。"], ["町の人々（まちのひとびと）", "最初は服をほめるが、子どもの言葉が広がると事実を声にする。"]], "links": ["pussinboots", "hana", "andersen"], "synopsisSummary": ["新しい服が大好きで、着飾ることにお金も時間も惜しまない王様がいました。ある日、二人の男が町へ来て、特別な布を織れると名乗ります。その布は、仕事にふさわしくない人や、ひどく愚かな人には見えないというのです。王様は、それを着れば家来の能力も見分けられると考え、たくさんのお金を渡して注文しました。", "けれど二人は詐欺師で、受け取った絹や金糸をしまい込み、何もない織り機を動かすふりをするだけでした。", "王様は出来具合を調べさせるため、信頼する老大臣を送ります。大臣には何も見えませんが、自分が愚かで仕事に向かないと思われるのが怖くなります。そこで色や模様をほめ、王様にも立派な布だと報告しました。次に送られた役人も、同じように見えないことを隠します。二人の詐欺師は追加のお金や材料まで受け取り、町ではすばらしい布の評判が広がりました。", "とうとう王様自身が見に行きます。しかし、やはり何も見えません。王様にふさわしくないと知られるのを恐れ、見事な布だとほめてしまいました。", "同行した家来たちも同調し、新しい服を晴れの行列で披露することになります。詐欺師たちは空中で布を裁ち、糸のない針で縫うふりをして完成を告げ、王様に服を着せるふりをしました。家来たちは、実際にはない裾を持ち上げるふりまでします。", "王様が町を進むと、人々も自分だけ愚かだと思われたくなくて、服をほめ続けました。そこへ一人の小さな子どもが、王様は服を着ていないと口にします。その言葉が人から人へ伝わり、ついには群衆も事実を声に出しました。王様も人々が正しいらしいと感じます。それでも、始めた行列は最後まで続けなければと思い、そのまま進みました。付き添う者たちも、存在しない裾を持つふりをやめませんでした。"], "sources": [{"title": "Wikisource・Paull英訳当該話全文", "url": "https://en.wikisource.org/wiki/Hans_Andersen's_Fairy_Tales/The_Emperor's_New_Clothes"}, {"title": "Wikisource・英訳標題紙", "url": "https://en.wikisource.org/wiki/Hans_Andersen's_Fairy_Tales"}, {"title": "Wikisource・1888年版スキャン索引", "url": "https://en.wikisource.org/wiki/Index:Hans_Andersen's_Fairy_Tales_(1888).djvu"}, {"title": "南デンマーク大学・初刊情報", "url": "https://andersen.sdu.dk/forskning/bib/bibpost.html?BibID=309&oph=1"}, {"title": "デンマーク王立図書館・成立と先行物語の解説", "url": "https://tekster.kb.dk/text/adl-texts-hcaeventyr07val-shoot-idm139890601726336.pdf"}, {"title": "Project Gutenberg・Paull1888年没の書誌記録", "url": "https://www.gutenberg.org/ebooks/34794"}, {"title": "Troy J. Bassett・Paullの著者調査", "url": "https://www.victorianresearch.org/atcl/show_author.php?aid=996"}], "sourceNote": "1837年4月7日、『子どもに語る童話』第1集第3冊で初刊。今回はMrs. H. B. Paull英訳『Hans Andersen’s Fairy Tales』（Frederick Warne and Co.、スキャン索引では1888年版）の当該話を参照しました。1837年は原作の初刊年で、参照英訳の刊行年ではありません。原題と英訳題の人物は皇帝ですが、ここでは日本で親しまれている題名『裸の王様』に合わせて王様と表記しています。本文の服が見えない条件は、単に愚かであることだけでなく、役職にふさわしくないことも含みます。子どもの発言のあと、王様が行列を続ける結末を残しました。", "textNote": "人を欺く行為と、能力が低いと思われることへの恐れを扱います。身体の具体的な描写はありません。", "summaryReadings": {"詐欺師": {"key": "詐欺師", "reading": "さぎし"}, "老大臣": {"key": "老大臣", "reading": "ろうだいじん"}}, "image": "assets/emperors-emptyloom-corrected.webp", "imageAlt": "王様自身も織り機を見に来ますが、何も見えないとは言えません。", "characterGallery": [{"name": "王様（おうさま）", "role": "新しい服を好み、見えない布で家来の能力も測ろうとする。", "portraits": [{"src": "assets/emperor-face-emperor.webp", "label": "", "alt": "王様（おうさま）の創作イメージ", "width": 500, "height": 500}]}, {"name": "二人の詐欺師（ふたりのさぎし）", "role": "特別な布を織れると偽り、金や材料を受け取る。", "portraits": [{"src": "assets/emperor-face-swindlers.webp", "label": "布を織るふりをする二人", "alt": "二人の詐欺師（ふたりのさぎし）の創作イメージ", "width": 500, "height": 500}]}, {"name": "老大臣と役人（ろうだいじんとやくにん）", "role": "見えないことを隠し、布をほめて報告する。", "portraits": [{"src": "assets/emperor-face-officials.webp", "label": "左：老大臣／右：後から見に行った役人", "alt": "老大臣と役人（ろうだいじんとやくにん）の創作イメージ", "width": 500, "height": 500}]}, {"name": "子ども（こども）", "role": "王様が服を着ていないことを口にする。", "portraits": [{"src": "assets/emperor-face-child.webp", "label": "", "alt": "子ども（こども）の創作イメージ", "width": 500, "height": 500}]}, {"name": "町の人々（まちのひとびと）", "role": "最初は服をほめるが、子どもの言葉が広がると事実を声にする。", "portraits": [{"src": "assets/emperor-face-townspeople.webp", "label": "町の人々の代表イメージ", "alt": "町の人々（まちのひとびと）の創作イメージ", "width": 500, "height": 500}]}], "characterGalleryNote": "町の人々と役人の集合画像は、登場する人たちを見分けるための代表的なイメージです。織り機の場面は、二台のうち一台に視点を絞っています。", "headerCaption": "王様自身も織り機を見に来ますが、何も見えないとは言えません。", "inlineIllustrations": [{"afterParagraph": 1, "src": "assets/emperor-weavers-commission-scene.webp", "alt": "見えない人には理由があるという説明を信じ、王様は二人に注文します。この思い込みが、後の沈黙につながります。", "caption": "見えない人には理由があるという説明を信じ、王様は二人に注文します。この思い込みが、後の沈黙につながります。", "width": 1200, "height": 800}, {"afterParagraph": 4, "src": "assets/emperors-emptyloom-corrected.webp", "alt": "王様自身も織り機を見に来ますが、何も見えないとは言えません。", "caption": "王様自身も織り機を見に来ますが、何も見えないとは言えません。", "width": 1200, "height": 800}, {"afterParagraph": 6, "src": "assets/emperor-procession-child-scene.webp", "alt": "子どもが王様は服を着ていないと声をあげ、その言葉が人々へ広がります。", "caption": "子どもが王様は服を着ていないと声をあげ、その言葉が人々へ広がります。", "width": 1200, "height": 800}]}, {"id": "shakespeare", "name": "ウィリアム・シェイクスピア", "reading": "うぃりあむしぇいくすぴあ", "cat": "person", "primaryCategory": "person", "genreLabel": "人物", "sub": "1564–1616｜劇作家・詩人・俳優", "longTitle": true, "motif": "book", "intro": "『ロミオとジュリエット』などを書いた、イングランドの劇作家・詩人・俳優。劇団の仲間と舞台を作り、その作品は死後の戯曲集にも受け継がれました。", "gist": "舞台で演じる言葉を書き、劇団とともに作品を育てた人。恋や対立、迷いを描く戯曲は、仲間が残した本にも受け継がれました。", "people": [], "theme": "", "memory": "", "links": ["romeoandjuliet", "hamlet"], "sources": [{"title": "Shakespeare Birthplace Trust：誕生と洗礼記録", "url": "https://www.shakespeare.org.uk/explore-shakespeare/shakespedia/william-shakespeare/when-was-shakespeare-born/"}, {"title": "Shakespeare Birthplace Trust：伝記", "url": "https://www.shakespeare.org.uk/explore-shakespeare/shakespedia/william-shakespeare/william-shakespeare-biography/"}, {"title": "Shakespeare Birthplace Trust：教育", "url": "https://www.shakespeare.org.uk/explore-shakespeare/shakespedia/william-shakespeare/shakespeares-school/"}, {"title": "Folger Shakespeare Library：生涯と史料上の限界", "url": "https://www.folger.edu/explore/shakespeares-life/"}, {"title": "Royal Shakespeare Company：劇団と活動年表", "url": "https://www.rsc.org.uk/shakespeares-life-and-times/"}, {"title": "Folger Shakespeare Library：First Folioと肖像", "url": "https://www.folger.edu/explore/shakespeare-in-print/first-folio/"}, {"title": "Folger Shakespeare Library：ロミオとジュリエット", "url": "https://www.folger.edu/explore/shakespeares-works/romeo-and-juliet/"}, {"title": "Folger Shakespeare Library：ハムレット", "url": "https://www.folger.edu/explore/shakespeares-works/hamlet/"}], "bodyReadings": {"洗礼": "せんれい", "劇作家": "げきさっか", "戯曲": "ぎきょく", "悲劇": "ひげき", "喜劇": "きげき", "宮内大臣一座": "くないだいじんいちざ", "国王一座": "こくおういちざ", "復讐": "ふくしゅう"}, "checkedDate": "2026年11月2日", "sourceNote": "4月23日は伝統的に祝われる誕生日で、出生の確定日ではない。洗礼記録は1564年4月26日。没日は墓碑・専門機関の伝記に基づく1616年4月23日。これらは当時のイングランドで用いられた暦に沿った歴史上の日付を記し、現代のグレゴリオ暦へ換算した値ではない。 ", "image": "assets/shakespeare-ai.webp", "imageAlt": "ウィリアム・シェイクスピアを題材にしたAIイラスト", "imageCaption": "人物を描いたAIイラスト（写真ではありません）", "portraitNote": "実在の人物を題材にしたAI生成の創作イラストです。本人の写真や、肖像画・写真を忠実に復元した画像ではありません。"}, {"id": "dostoevsky", "name": "ドストエフスキー", "reading": "どすとえふすきー", "cat": "person", "primaryCategory": "person", "genreLabel": "人物", "sub": "1821–1881｜ロシアの小説家", "longTitle": false, "motif": "book", "intro": "『罪と罰』『カラマーゾフの兄弟』などを書いたロシアの小説家。軍の技術者として学び、翻訳や小説へ進みました。服役や軍務による中断を経て、雑誌づくりや協力者に支えられながら執筆を続けました。", "gist": "自分の理屈と実際の気持ちは、なぜ食い違うのか。人物を単純な善悪に分けず、迷いを抱えた人間を描いた小説家。", "people": [], "theme": "", "memory": "", "links": ["crimeandpunishment"], "sources": [{"title": "サンクトペテルブルク・ドストエフスキー文学記念館「生涯と創作の年譜」", "url": "https://md.spb.ru/dostoevskij/biografiya/"}, {"title": "ロシア大統領図書館「ドストエフスキーの誕生」", "url": "https://www.prlib.ru/history/1324583"}, {"title": "Project Gutenberg・『罪と罰』旧英訳原文", "url": "https://www.gutenberg.org/files/2554/2554-h/2554-h.htm"}], "bodyReadings": {"貧しき人々": "まずしきひとびと", "工兵": "こうへい", "軍務": "ぐんむ", "翻訳": "ほんやく", "刊行": "かんこう", "批評家": "ひひょうか", "逮捕": "たいほ", "強制労働": "きょうせいろうどう", "服役": "ふくえき", "負債": "ふさい", "速記者": "そっきしゃ", "賭博者": "とばくしゃ", "白痴": "はくち", "悪霊": "あくりょう", "矛盾": "むじゅん"}, "checkedDate": "2026年11月2日", "sourceNote": "生年月日は新暦（グレゴリオ暦）1821年11月11日、没年月日は1881年2月9日。当時ロシアで用いた旧暦（ユリウス暦）では、それぞれ1821年10月30日、1881年1月28日です。二つの日付は異説ではなく暦の違いです。 逮捕、死刑判決、強制労働を扱います。処刑や身体的苦痛の詳細、心理・医学的診断の推測は記載していません。", "image": "assets/dostoevsky-ai.webp", "imageAlt": "ドストエフスキーを題材にしたAIイラスト", "imageCaption": "人物を描いたAIイラスト（写真ではありません）", "portraitNote": "実在の人物を題材にしたAI生成の創作イラストです。本人の写真や、肖像画・写真を忠実に復元した画像ではありません。"}, {"id": "amanoiwato", "name": "天の岩戸", "reading": "あまのいわと", "bodyReadings": {"天照大御神": "あまてらすおおみかみ", "天の岩戸": "あまのいわと", "岩屋": "いわや", "機織り": "はたおり", "榊": "さかき", "桶": "おけ", "災い": "わざわい", "償う": "つぐなう", "古事記": "こじき"}, "cat": "myth", "primaryCategory": "myth", "genreLabel": "神話・星座 · 日本神話", "genre": "myth", "checkedDate": "2026年11月2日", "sub": "日本神話／『古事記』所収｜古代からの伝承", "motif": "book", "intro": "太陽の神が岩屋に隠れ、世界から明るさが失われます。神々は知恵、ものづくり、舞を合わせ、再び光を迎えようとします。", "gist": "岩屋に隠れた太陽の神を、神々はどう迎えたのか。知恵とものづくり、舞が結びつく日本神話。", "people": [["天照大御神（あまてらすおおみかみ）", "太陽の神。スサノオの乱暴を恐れ、岩屋に隠れる。"], ["スサノオ", "天照大御神の弟。田や建物を荒らし、事件の発端を作る。"], ["オモイカネ", "神々が集まったとき、知恵を働かせる神。"], ["アメノウズメ", "岩屋の前で舞い、神々の笑いを起こす神。"], ["タヂカラオ", "戸のそばで待ち、天照大御神の手を取って外へ引き出す神。"], ["フトダマ", "祭りの道具を持ち、最後に岩屋へ戻れないよう縄を渡す神。"]], "links": ["tanabata", "orion"], "synopsisSummary": ["天照大御神は、天の世界を照らす神です。弟のスサノオは、姉との誓いの儀式で自分が勝ったと考え、勢いに任せて乱暴を始めます。姉の田のあぜを壊し、水路を埋め、神聖な建物まで汚しました。天照大御神は初め、弟にも理由があるのだろうと悪く取らずにいましたが、その振る舞いは止まりません。", "とうとうスサノオは、機織りをする建物の屋根から馬を投げ入れます。驚いた織り手が道具で傷つき、命を落とす事件になりました。恐れた天照大御神は岩屋に入り、戸を閉ざしてしまいます。天の世界も地上も暗くなり、夜が続き、さまざまな災いが起こりました。光を失った世界をどう立て直すか。大勢の神々が川原に集まります。", "知恵を働かせるオモイカネを中心に、神々は準備を進めました。鳥を集めて鳴かせ、鏡や玉を作り、榊の枝に鏡、玉、布を取り付けます。祈りの言葉を唱える神もいれば、戸のそばで待ち構える力持ちのタヂカラオもいます。アメノウズメは伏せた桶の上を踏み鳴らし、大胆な舞を見せました。すると神々の笑い声が、天の世界に響き渡ります。", "自分が隠れて暗いはずなのに、外はなぜ楽しそうなのか。気になった天照大御神は戸を少し開けました。ウズメは、あなたよりも尊い神がいるので喜んでいるのだと答えます。ほかの神々が鏡を差し出すと、天照大御神はますます不思議に思い、外をのぞこうとしました。その手をタヂカラオが取り、岩屋の外へ引き出します。", "すぐにフトダマが天照大御神の後ろへ縄を渡し、もう中へ戻らないよう告げました。神が姿を現すと、天も地上も明るさを取り戻します。一方、乱暴の原因を作ったスサノオは、そのまま許されたわけではありません。神々は相談し、罪を償う品々を出させたうえで、天の世界から追い出しました。光を迎える工夫と、災いを起こした者への処置の両方で、この出来事は結ばれます。"], "sources": [{"title": "青空文庫：武田祐吉校訂『古事記』古典本文", "url": "https://www.aozora.gr.jp/cards/001518/files/51731_50813.html", "supports": "序文の献上年、上巻「天の岩戸」全段の出来事・結末"}, {"title": "青空文庫：武田祐吉訳『古事記』", "url": "https://www.aozora.gr.jp/cards/001518/files/51732_44768.html", "supports": "該当段の語義と筋の照合"}, {"title": "青空文庫：図書カードと訳者情報", "url": "https://www.aozora.gr.jp/cards/001518/card51732.html", "supports": "訳者没年1958年、底本1956年・入力版1965年"}], "sourceNote": "『古事記』上巻「天の岩戸」の物語。武田祐吉校訂の古典本文と同訳の該当段を照合した。底本『古事記』角川文庫は1956年初版、現代語訳の入力使用版は1965年20版。これらは参照版の年であり、神話が生まれた年ではない。『古事記』序文には和銅5年（712年）の献上が記される。日本書紀や各地の伝説を混ぜず、『古事記』の筋に沿った。死亡するのは織り手であり、天照大御神ではない。岩戸を遠くへ投げる戸隠の伝説は加えていない。神名は読みやすい現代表記にした。身体の露出や傷の細部は省いた。", "textNote": "乱暴、織り手の死、追放を含む神話です。出来事を歴史的事実や自然現象の科学的説明として扱う記事ではありません。", "imageCaption": "神話をもとにしたAIイメージイラスト", "summaryReadings": {"天照大御神": {"key": "天照大御神", "reading": "あまてらすおおみかみ"}}, "image": "assets/iwato-mirror-hand-scene.webp", "imageAlt": "鏡を示す神々と、天照大御神の手を取るタヂカラオ", "inlineIllustrations": [{"afterParagraph": 2, "src": "assets/iwato-dark-river-council-scene.webp", "caption": "光を失った世界で、神々は川原に集まります。どうすれば天照大御神を迎えられるか、知恵を働かせます。", "alt": "光を失った世界で、神々は川原に集まります。どうすれば天照大御神を迎えられるか、知恵を働かせます。", "width": 1200, "height": 800}, {"afterParagraph": 3, "src": "assets/iwato-uzume-rhythm-scene.webp", "caption": "ウズメが伏せた桶を踏み鳴らすと、神々の笑い声が響きます。その声が、岩戸の中の天照大御神の気を引きます。", "alt": "ウズメが伏せた桶を踏み鳴らすと、神々の笑い声が響きます。その声が、岩戸の中の天照大御神の気を引きます。", "width": 1200, "height": 800}, {"afterParagraph": 4, "src": "assets/iwato-mirror-hand-scene.webp", "alt": "鏡に引かれて戸からのぞいた天照大御神。その手をタヂカラオが取り、岩屋の外へ迎えます。", "caption": "鏡に引かれて戸からのぞいた天照大御神。その手をタヂカラオが取り、岩屋の外へ迎えます。", "width": 1200, "height": 800}], "headerCaption": "鏡に近づいた天照大御神の手を取り、タヂカラオが岩戸の外へ導きます。", "characterGallery": [{"name": "天照大御神（あまてらすおおみかみ）", "role": "太陽の神。スサノオの乱暴を恐れ、岩屋に隠れる。", "portraits": [{"src": "assets/iwato-face-amaterasu.webp", "label": "天照大御神（あまてらすおおみかみ）", "alt": "天照大御神（あまてらすおおみかみ）の創作イメージ", "width": 500, "height": 500}]}, {"name": "スサノオ", "role": "天照大御神の弟。田や建物を荒らし、事件の発端を作る。", "portraits": [{"src": "assets/iwato-face-susanoo.webp", "label": "スサノオ", "alt": "スサノオの創作イメージ", "width": 500, "height": 500}]}, {"name": "オモイカネ", "role": "神々が集まったとき、知恵を働かせる神。", "portraits": [{"src": "assets/iwato-face-omoikane.webp", "label": "オモイカネ", "alt": "オモイカネの創作イメージ", "width": 500, "height": 500}]}, {"name": "アメノウズメ", "role": "岩屋の前で舞い、神々の笑いを起こす神。", "portraits": [{"src": "assets/iwato-face-uzume.webp", "label": "アメノウズメ", "alt": "アメノウズメの創作イメージ", "width": 500, "height": 500}]}, {"name": "タヂカラオ", "role": "戸のそばで待ち、天照大御神の手を取って外へ引き出す神。", "portraits": [{"src": "assets/iwato-face-tajikarao.webp", "label": "タヂカラオ", "alt": "タヂカラオの創作イメージ", "width": 500, "height": 500}]}, {"name": "フトダマ", "role": "祭りの道具を持ち、最後に岩屋へ戻れないよう縄を渡す神。", "portraits": [{"src": "assets/iwato-face-futodama.webp", "label": "フトダマ", "alt": "フトダマの創作イメージ", "width": 500, "height": 500}]}], "characterGalleryNote": "鏡を持つ二柱はアメノコヤネとフトダマを表しています。"}, {"id": "tanabata", "name": "七夕の物語", "reading": "たなばたのものがたり", "bodyReadings": {"七夕": "たなばた", "織姫": "おりひめ", "彦星": "ひこぼし", "天の川": "あまのがわ", "機織り": "はたおり", "衣": "ころも", "再会": "さいかい", "太陰太陽暦": "たいいんたいようれき", "伝承": "でんしょう"}, "cat": "myth", "primaryCategory": "myth", "genreLabel": "神話・星座 · 七夕伝説", "genre": "myth", "checkedDate": "2026年11月2日", "sub": "伝承（作者不詳）｜古くからの伝承", "motif": "book", "intro": "天の川を隔てて暮らす織姫と彦星。年に一度の再会を待つ二人の伝説を、ハーンが紹介した一つの語り方でたどります。", "gist": "年に一度の再会を待つ織姫と彦星。会えない時間を生きる二人の伝説と、実際の星空を分けて紹介。", "people": [["織姫（おりひめ）", "父のために布を織る娘。"], ["彦星（ひこぼし）", "牛を引いていた若者。娘と結婚する。"], ["父の神（ちちのかみ）", "天を治める神。二人を引き離し、年に一度の再会を許す。"], ["天の鳥たち（てんのとりたち）", "晴れた再会の夜、川に橋をかける。"]], "links": ["amanoiwato", "andromeda", "ginga"], "synopsisSummary": ["天の世界を治める神には、布を織ることが好きな娘がいました。娘は父のために衣を織り、その仕事を何よりの喜びとして、毎日を過ごしていました。ところがある日、家の戸口で機を織っていると、牛を引いた若者が通りかかります。娘はその姿に心を引かれました。父は娘の願いを察し、二人の結婚を許します。", "夫婦となった二人は、一緒にいることに夢中になり、それまでの務めを忘れてしまいました。娘の機織りの音は聞こえなくなり、若者の牛も世話をされないまま、天の野原を歩き回ります。父の神はこれを怒り、二人を引き離しました。それから二人は、天の川を間に挟んだ別々の場所で暮らすことになります。", "ただし、まったく会えなくなったのではありません。父は一年に一度、第七の月の七日の夜だけ、会うことを認めました。その夜が晴れていれば、天の鳥たちが体と翼を並べて川に橋をかけます。二人はその橋を使い、再び顔を合わせることができるのです。", "しかし雨が降ると、川の水が増え、幅も広がってしまいます。鳥たちも橋をつくれず、二人は会うことができません。年に一度の夜が来ても、再会が必ずかなうわけではなく、天気のために三年、四年と会えないことさえありました。", "それでも二人の思いは変わりません。離れて暮らしながら、それぞれの仕事を毎日きちんと続け、次の七月七日の夜に会えることを望んで待ちます。この話は、二人が永遠に一緒に暮らせるようになるのではなく、再会への希望を持ち続ける姿で結ばれています。"], "sources": [{"title": "Project Gutenberg・ハーン参照原文", "url": "https://www.gutenberg.org/files/15320/15320-h/15320-h.htm"}, {"title": "Project Gutenberg・著者没年と米国PD", "url": "https://www.gutenberg.org/ebooks/15320"}, {"title": "国立科学博物館・七夕の星は本当に会えるのか（天文事実のみ参照）", "url": "https://www.kahaku.go.jp/exhibitions/vm/resource/tenmon/space/seiza/seiza05.html"}, {"title": "国立天文台・伝統的七夕について", "url": "https://www.nao.ac.jp/faq/a0310.html"}, {"title": "国立天文台：七夕について（伝説の中国由来と星名）", "url": "https://www.nao.ac.jp/faq/a0309.html"}], "sourceNote": "参照したのは、ラフカディオ・ハーン『The Romance of the Milky Way, and Other Studies & Stories』（1905年）所収の表題篇冒頭にある、日本で語られる形として紹介された主話です。1905年は参照本の刊行年で、伝承の成立年ではありません。ハーンを伝説そのものの創作者とは扱いません。この主話では、橋をつくるのは「天の鳥たち」で、カササギとは限定されません。また雨なら橋をつくれず、会えないことになります。鳥の種類や雨の日の扱いには異伝があるため、他の話を混ぜて補っていません。本文中の娘と若者は、一般に織姫と彦星として親しまれる二人です。", "textNote": "伝承の物語と実際の星・暦の情報を分けて紹介しています。", "imageCaption": "神話をもとにしたAIイメージイラスト（星の位置を示す図ではありません）", "astronomyFacts": ["織姫星はこと座のベガ、彦星はわし座のアルタイルにあたります。天の川を挟むように見えますが、七夕の夜に二つの星が近づいて会うわけではありません。物語の再会と、実際の星の動きは別に考えます。", "七夕はもともと、太陰太陽暦の七月七日の行事でした。現在の暦の七月七日とは同じ日ではありません。国立天文台が知らせる「伝統的七夕」は、昔の暦による七夕に近い日を定めたもので、現在の暦では毎年日付が変わります。"], "summaryReadings": {"織姫": {"key": "織姫", "reading": "おりひめ"}, "彦星": {"key": "彦星", "reading": "ひこぼし"}, "父の神": {"key": "父の神", "reading": "ちちのかみ"}, "天の鳥たち": {"key": "天の鳥たち", "reading": "てんのとりたち"}}, "image": "assets/tanabata.webp", "imageAlt": "天の川を挟んで向かい合う織姫と彦星のイメージ", "inlineIllustrations": [{"afterParagraph": 1, "src": "assets/tanabata-loom-first-meeting-scene.webp", "caption": "戸口で布を織っていた娘は、牛を引いて通りかかった若者に心を引かれます。二人の出会いの場面です。", "alt": "戸口で布を織っていた娘は、牛を引いて通りかかった若者に心を引かれます。二人の出会いの場面です。", "width": 1200, "height": 800}, {"afterParagraph": 3, "src": "assets/tanabata-bird-bridge-scene.webp", "alt": "晴れた再会の夜、天の鳥たちが体と翼で橋をつくり、織姫と彦星は再び会うことができます。", "caption": "晴れた再会の夜、天の鳥たちが体と翼で橋をつくり、織姫と彦星は再び会うことができます。", "width": 1200, "height": 800}, {"afterParagraph": 5, "src": "assets/tanabata.webp", "caption": "二人は天の川を隔てて暮らしながら、それぞれの仕事を続け、次の再会を待ち続けます。", "alt": "二人は天の川を隔てて暮らしながら、それぞれの仕事を続け、次の再会を待ち続けます。", "width": 1200, "height": 800}], "characterGallery": [{"name": "織姫（おりひめ）", "role": "父のために布を織る娘。", "portraits": [{"src": "assets/tanabata-face-orihime.webp", "label": "織姫（おりひめ）", "alt": "織姫（おりひめ）の創作イメージ", "width": 500, "height": 500}]}, {"name": "彦星（ひこぼし）", "role": "牛を引いていた若者。娘と結婚する。", "portraits": [{"src": "assets/tanabata-face-hikoboshi.webp", "label": "彦星（ひこぼし）", "alt": "彦星（ひこぼし）の創作イメージ", "width": 500, "height": 500}]}, {"name": "父の神（ちちのかみ）", "role": "天を治める神。二人を引き離し、年に一度の再会を許す。", "portraits": [{"src": "assets/tanabata-face-father.webp", "label": "父の神（ちちのかみ）", "alt": "父の神（ちちのかみ）の創作イメージ", "width": 500, "height": 500}]}, {"name": "天の鳥たち（てんのとりたち）", "role": "晴れた再会の夜、川に橋をかける。", "portraits": [{"src": "assets/tanabata-face-birds.webp", "label": "天の鳥たち（代表イメージ）", "alt": "天の鳥たち（てんのとりたち）の創作イメージ", "width": 500, "height": 500}]}], "characterGalleryNote": "鳥の絵は一部を代表して描いており、種類や数が原文で決まっているわけではありません。実際の星の姿や位置を示す図ではありません。"}, {"id": "lesmiserables", "name": "レ・ミゼラブル", "reading": "れみぜらぶる", "bodyReadings": {"司教": "しきょう", "燭台": "しょくだい", "銀食器": "ぎんしょっき", "前科": "ぜんか", "刑期": "けいき", "出獄": "しゅつごく", "養育費": "よういくひ", "囚人": "しゅうじん", "酷使": "こくし", "修道院": "しゅうどういん", "良心": "りょうしん", "蜂起": "ほうき", "出獄後": "しゅつごくご", "銀": "ぎん", "聖職者": "せいしょくしゃ", "偏見": "へんけん", "貧困": "ひんこん", "秩序": "ちつじょ", "追い詰め": "おいつめ", "貧しい": "まずしい", "刑務所": "けいむしょ", "法律": "ほうりつ", "警官": "けいかん", "宿屋": "やどや", "飢え": "うえ", "罰": "ばつ", "後悔": "こうかい", "工場": "こうじょう", "裁判": "さいばん", "法廷": "ほうてい", "逮捕": "たいほ", "警察": "けいさつ", "軍隊": "ぐんたい", "下水道": "げすいどう", "財産": "ざいさん", "誤解": "ごかい", "恩人": "おんじん", "生涯": "しょうがい", "正当": "せいとう", "市長": "しちょう", "営み": "いとなみ"}, "cat": "literature", "primaryCategory": "world-literature", "genreLabel": "海外文学", "genre": "world-literature", "checkedDate": "2026年11月2日", "sub": "ヴィクトル・ユゴー｜1862年初刊行", "motif": "book", "intro": "一度罪を犯した人は、変わることができるのか。パンを盗んだ男のその後を、貧困に苦しむ母子や、法を信じる警官の運命とともに描く長編小説です。", "gist": "罪を犯した男が、人を救う側へ変わっていく。コゼットとの暮らしと警官の追跡を軸に、貧困と偏見を描く長編。", "people": [["ジャン・ヴァルジャン", "お金に困って盗みをし、刑務所を出たあと、生き直そうとする主人公。マドレーヌという名で市長になる。"], ["ミリエル司教（みりえるしきょう）", "教会で人々を導く司教。ヴァルジャンを迎え、銀の燭台を渡す。"], ["ジャヴェール", "法律や決まりを厳しく守り、ヴァルジャンを追う警官。"], ["ファンティーヌ", "コゼットの母。お金に困り、周りの人の決めつけにも苦しむ。"], ["コゼット", "宿屋でつらい仕事を無理にさせられ、ヴァルジャンに育てられる少女。"], ["マリユス", "成長したコゼットを愛する青年。戦いで傷つき、ヴァルジャンに救われる。"], ["テナルディエ夫妻（てなるでぃえふさい）", "コゼットを預かりながら、つらい仕事をさせる宿屋の夫婦。夫は後に秘密を売って金を得ようとする。"]], "links": ["crimeandpunishment", "frankenstein", "victor-hugo"], "synopsisSummary": ["ジャン・ヴァルジャンは、飢えている姉の子どもたちのためにパンを盗み、捕まります。逃げようとした罰も加わり、刑務所で十九年を過ごしました。刑務所を出ても、罪を犯した過去を理由に宿を断られます。ミリエル司教は泊めてくれましたが、ヴァルジャンは銀食器を盗んでしまいます。連れ戻されたヴァルジャンを、司教は責めません。食器は贈ったものだと話し、ろうそくを立てる銀の台も渡します。この親切と、その後に少年の金を奪ったことへの後悔から、ヴァルジャンは生き直そうとします。", "その後、ヴァルジャンはマドレーヌという別の名で工場を営み、市長になります。そこで助けたのが、コゼットの母ファンティーヌです。ファンティーヌは病気になっていました。娘を宿屋に預けて働いていましたが、結婚せずに子どもを産んだことを悪く見られ、仕事を失っていました。ヴァルジャンはコゼットを迎えに行くと約束します。しかし、別の男がヴァルジャンと間違われ、裁判にかけられます。無関係な男を救うため、ヴァルジャンは法廷で本当の名を明かしました。", "ヴァルジャンを追う警官ジャヴェールが逮捕に来ると、ファンティーヌは娘に会えないまま亡くなります。再び刑務所へ送られたヴァルジャンは、後に船上で人を助けたあと海へ落ち、死んだと思われながら逃れました。そして、亡くなったファンティーヌとの約束を果たしにコゼットのもとへ向かいます。宿屋のテナルディエ夫妻に無理に働かされていたコゼットを引き取り、警察から隠れながら育てました。実の親子ではありませんが、二人は父と娘のように暮らします。", "年月がたち、コゼットは青年マリユスと愛し合うようになります。ヴァルジャンは、育てた娘が離れていくことを寂しく感じます。やがて一八三二年、パリで政府に反抗する人々と軍隊の戦いが起こり、マリユスも加わります。ヴァルジャンも戦いの場へ向かい、捕まっていた警官ジャヴェールを逃がしました。さらに、傷ついたマリユスを背負い、下水道を通って救い出します。", "下水道の出口にはジャヴェールがいました。しかし、命を助けてくれたヴァルジャンを見逃します。法律に従って捕まえることと、恩人を助けることの間で苦しみ、ジャヴェールは自ら命を絶ちました。一方、回復したマリユスはコゼットと結婚します。ヴァルジャンが昔の罪を打ち明けると、マリユスは疑いを持ちます。自分を戦場から救った人だと知らないまま、ヴァルジャンを遠ざけてしまいました。", "真実を知らせるきっかけをつくったのは、かつてコゼットを預かっていたテナルディエです。金目当てに持ち込んだ新聞や服の切れ端から、ヴァルジャンの財産は正当に得たもので、マリユスの命を救ったのもヴァルジャンだと分かります。誤解に気づいたマリユスは、コゼットとともに会いに行きます。弱っていたヴァルジャンは二人と再会し、司教から贈られた銀の台に明かりがともる部屋で、二人に見守られて生涯を終えます。"], "sources": [{"title": "Project Gutenberg：Hapgood1887年英訳本文", "url": "https://www.gutenberg.org/files/135/135-h/135-h.htm", "supports": "原作の主要場面と結末、英訳版の標題情報"}, {"title": "Project Gutenberg：書誌・米国PD表示", "url": "https://www.gutenberg.org/ebooks/135", "supports": "著者・訳者・没年と米国公開条件"}, {"title": "Hachette BnF：1862年原版の復刻書誌", "url": "https://www.hachettebnf.fr/livre/les-miserables-22-ed1862-9782012577893/", "supports": "フランス語原著の刊行年"}, {"title": "ニューヨーク公共図書館：Isabel Florence Hapgood papers", "url": "https://old-digitalcollections.nypl.org/collections/isabel-florence-hapgood-papers", "supports": "米国人訳者Hapgood、1850–1928年"}], "sourceNote": "フランス語原著は1862年刊。筋の照合にはIsabel F. Hapgoodの1887年英訳（Thomas Y. Crowell、Project Gutenberg #135）を用いた。1862年は原著、1887年は参照英訳の年。現代の日本語訳やミュージカルの台本を要約したものではない。バリケードの戦いは1832年六月の蜂起で、1789年のフランス革命そのものではない。長大な作品の主筋に絞り、脇役の物語や歴史・社会論の長い章は省略した。再会後にヴァルジャンが亡くなる結末を保持する。", "textNote": "貧困、児童への虐待、戦闘、死、自死を含みます。傷や自死の方法は詳述していません。", "imageCaption": "作品をもとにしたAIイメージイラスト", "summaryReadings": {"ミリエル司教": {"key": "ミリエル司教", "reading": "みりえるしきょう"}, "テナルディエ夫妻": {"key": "テナルディエ夫妻", "reading": "てなるでぃえふさい"}}, "image": "assets/lesmis-cosette-scene.webp", "imageAlt": "宿屋で幼いコゼットを引き取るヴァルジャン", "termNote": "聖職者は、宗教上の仕事を担う人です。本文の司教も教会の聖職者です。燭台は、ろうそくを立てる道具です。", "inlineIllustrations": [{"afterParagraph": 1, "src": "assets/lesmis-bishop-scene.webp", "alt": "司教は盗みを責めず、銀の燭台もヴァルジャンへ渡します。燭台は、ろうそくを立てる台です。", "caption": "司教は盗みを責めず、銀の燭台もヴァルジャンへ渡します。燭台は、ろうそくを立てる台です。", "width": 1200, "height": 800}, {"afterParagraph": 3, "src": "assets/lesmis-cosette-scene.webp", "alt": "宿屋で幼いコゼットを迎え、優しく手を差し出すヴァルジャンの場面イメージ", "caption": "ヴァルジャンは、コゼットの母ファンティーヌとの約束を果たし、コゼットを引き取ります。実の親子ではありません。", "width": 1200, "height": 800}, {"afterParagraph": 4, "src": "assets/lesmis-marius-scene.webp", "alt": "下水道の中で青年マリユスを背負い、救い出すヴァルジャンの場面イメージ", "caption": "ヴァルジャンが背負っているのは、コゼットが愛する青年マリユスです。", "width": 1200, "height": 800}], "characterGallery": [{"name": "ジャン・ヴァルジャン", "role": "コゼットを育てる主人公。", "portraits": [{"src": "assets/lesmis-face-valjean.webp", "label": "", "alt": "ジャン・ヴァルジャンの人物イメージ", "width": 500, "height": 500}]}, {"name": "ミリエル司教（みりえるしきょう）", "role": "ヴァルジャンに銀の燭台を渡す。", "portraits": [{"src": "assets/lesmis-face-bishop.webp", "label": "", "alt": "ミリエル司教の人物イメージ", "width": 500, "height": 500}]}, {"name": "ジャヴェール", "role": "ヴァルジャンを追う警官。", "portraits": [{"src": "assets/lesmis-face-javert.webp", "label": "", "alt": "ジャヴェールの人物イメージ", "width": 500, "height": 500}]}, {"name": "ファンティーヌ", "role": "コゼットの実の母。", "portraits": [{"src": "assets/lesmis-face-fantine.webp", "label": "髪を売る前の姿", "alt": "ファンティーヌの人物イメージ", "width": 500, "height": 500}]}, {"name": "コゼット", "role": "ヴァルジャンに育てられ、マリユスを愛する。", "portraits": [{"src": "assets/lesmis-face-cosette-child.webp", "label": "幼いころ", "alt": "コゼット：幼いころの人物イメージ", "width": 500, "height": 500}, {"src": "assets/lesmis-face-cosette-grown.webp", "label": "成長した姿", "alt": "コゼット：成長した姿の人物イメージ", "width": 500, "height": 500}]}, {"name": "マリユス", "role": "成長したコゼットの恋人。", "portraits": [{"src": "assets/lesmis-face-marius.webp", "label": "", "alt": "マリユスの人物イメージ", "width": 500, "height": 500}]}, {"name": "テナルディエ夫妻（てなるでぃえふさい）", "role": "幼いコゼットを働かせる宿屋の夫婦。", "portraits": [{"src": "assets/lesmis-face-thenardiers.webp", "label": "夫と妻", "alt": "テナルディエ夫妻：夫と妻の人物イメージ", "width": 500, "height": 500}]}], "characterGalleryNote": "コゼットは幼いころと成長後を分け、ファンティーヌは髪を売る前の姿で描いています。", "headerCaption": "左はヴァルジャン、右は幼いコゼット。宿屋から彼女を引き取る場面です。実の親子ではありません。"}, {"id":"frankenstein","name":"フランケンシュタイン","reading":"ふらんけんしゅたいん","bodyReadings":{"衰弱":"すいじゃく","創造物":"そうぞうぶつ","創造主":"そうぞうしゅ","無実":"むじつ","処刑":"しょけい","薪":"まき","拒絶":"きょぜつ","容疑":"ようぎ","復讐":"ふくしゅう","氷海":"ひょうかい","帰還":"きかん","断念":"だんねん","貧しい":"まずしい","責任":"せきにん","告白":"こくはく"},"cat":"literature","primaryCategory":"world-literature","genreLabel":"海外文学","genre":"world-literature","checkedDate":"2026年11月2日","sub":"メアリー・シェリー｜1818年初刊行","motif":"book","intro":"生命をつくることに成功した青年は、生まれた存在を見捨ててしまいます。つくった者とつくられた者の語りを通して、孤独と責任、復讐の連鎖を描く小説です。","gist":"生命をつくった青年と、見捨てられた存在。二人の語りから、孤独と責任、復讐が広がる過程をたどる。","people":[["ヴィクター・フランケンシュタイン","生命をつくる研究に打ち込み、自分が生み出した存在を恐れて見捨てる。"],["創造物（そうぞうぶつ）","ヴィクターに命を与えられた、固有名のない存在。言葉を学び、他者とのつながりを求める。"],["ロバート・ウォルトン","北極へ向かう探検家。ヴィクターの話を記録し、最後に創造物とも会う。"],["エリザベス","ヴィクターと共に育ち、のちに結婚する。"],["ヘンリー・クレルヴァル","ヴィクターの親しい友人。"],["ウィリアム","ヴィクターの幼い弟。"],["ジュスティーヌ","一家に仕える女性。ウィリアム殺害の罪を着せられる。"],["ド・ラセー老人（どらせーろうじん）","目が見えない老人。創造物の話に耳を傾ける。"]],"links":["crimeandpunishment","lesmiserables","mary-shelley"],"synopsisSummary":["北極を目指す探検家ウォルトンは、氷の海で衰弱した男を救います。男の名はヴィクター・フランケンシュタイン。彼は自分が追う存在について、これまでの人生を語り始めました。ジュネーヴの家庭に育ったヴィクターは、インゴルシュタットで科学を学び、生命の秘密に取りつかれます。長い研究の末、大きな人間の姿をした存在に命を与えました。しかし動き出した姿を恐れ、自分の創造物を置き去りにして逃げてしまいます。","やがて故郷で幼い弟ウィリアムが殺され、家に仕えるジュスティーヌが犯人とされます。彼女は無実なのに処刑されました。創造物が事件に関わったと疑うヴィクターは苦しみ、山中でその相手と再会します。創造物は、自分が生まれてから何を経験したか、まず聞いてほしいと求めました。","ここからは、創造物がヴィクターに語った体験です。創造物は一人で生きる方法を覚え、ド・ラセー家の暮らしを物陰から見守るうちに言葉を学びました。貧しい一家のために、ひそかに薪を集めることもしました。人に受け入れられたいと願い、目の見えない老人に話しかけると、老人は親切に応じます。ところが戻ってきた家族は彼の姿を恐れ、追い払いました。拒絶を重ねて経験した彼は、人間と創造主への憎しみを強めます。そしてウィリアムを殺し、奪った品を眠っていたジュスティーヌの服に隠して罪を着せたと告白しました。","体験を語り終えた創造物は、自分と同じ姿の女性をつくってくれれば、人間から離れて暮らすと約束します。ヴィクターはいったん承知しますが、新しい存在が約束に従うとは限らず、さらに害が広がるかもしれないと恐れ、制作途中の体を壊しました。怒った創造物は、結婚の夜に現れると告げて去ります。その後、ヴィクターの友人ヘンリー・クレルヴァルが殺されます。ヴィクター自身も容疑をかけられますが、事件当時の居場所が証明され、解放されました。","故郷へ戻ったヴィクターは、幼なじみのエリザベスと結婚します。脅されているのは自分の命だと思い込んでいた彼は、花嫁を守れませんでした。その夜、創造物にエリザベスを殺され、知らせを受けた父も悲しみのうちに亡くなります。復讐に生きるようになったヴィクターは相手を追って北の氷海へ至り、ウォルトンの船に救われたのでした。","物語は、ウォルトンの船に戻ります。ウォルトンは船員たちの求めを受け、危険な探検を断念して帰還を決めます。ヴィクターは船上で亡くなりました。そこへ創造物が現れ、死んだ創造主を前に、自分の孤独と犯した罪への苦悩を語ります。そして遠い北へ行き、自ら命を終えるつもりだと告げ、氷に乗って暗闇へ去りました。物語はそこで終わり、その最期が実行されたかどうかは描かれません。"],"sources":[{"title":"Project Gutenberg・1831年改訂版原文","url":"https://www.gutenberg.org/files/42324/42324-h/42324-h.htm"},{"title":"Project Gutenberg・1831年版書誌と著者没年・米国PD","url":"https://www.gutenberg.org/ebooks/42324"},{"title":"Project Gutenberg・1818年初版の別書誌","url":"https://www.gutenberg.org/ebooks/41445"}],"sourceNote":"1818年初刊。今回は著者による改訂と新序文を含む1831年版の写真復刻を転記したProject Gutenberg #42324を参照しました。標題紙の刊行者はH. Colburn and R. Bentleyほか。初版1818年の本文と改訂版1831年の本文を同一とは扱いません。フランケンシュタインは創造主ヴィクターの姓で、彼がつくった存在に固有の名前は与えられていません。映画で知られる緑色の肌、首のボルト、雷を使う手術の場面などは加えていません。創造物の自死は終幕で語られる意向であり、実行された場面ではありません。","textNote":"殺人、無実の人の処刑、孤立、自死を望む発言を含みます。方法や身体の損傷を詳しく描写せず、暴力や自己破壊を肯定するものとして扱いません。","imageCaption":"作品をもとにしたAIイメージイラスト","summaryReadings":{"ヴィクター・フランケンシュタイン":{"key":"ヴィクター・フランケンシュタイン","reading":"ゔぃくたーふらんけんしゅたいん"},"創造物":{"key":"創造物","reading":"そうぞうぶつ"},"ロバート・ウォルトン":{"key":"ロバート・ウォルトン","reading":"ろばーとうぉるとん"},"エリザベス":{"key":"エリザベス","reading":"えりざべす"},"ヘンリー・クレルヴァル":{"key":"ヘンリー・クレルヴァル","reading":"へんりーくれるゔぁる"},"ウィリアム":{"key":"ウィリアム","reading":"うぃりあむ"},"ジュスティーヌ":{"key":"ジュスティーヌ","reading":"じゅすてぃーぬ"},"ド・ラセー老人":{"key":"ド・ラセー老人","reading":"どらせーろうじん"}},"image":"assets/frankenstein-mountain-dialogue-scene.webp","imageAlt":"山中でヴィクターと向き合い、まず話を聞いてほしいと訴える創造物。","inlineIllustrations":[{"afterParagraph":1,"src":"assets/frankenstein-creation-abandonment-scene.webp","alt":"命を与えることには成功したヴィクター。しかし動き出した創造物を恐れ、その場から逃げ出してしまいます。","caption":"命を与えることには成功したヴィクター。しかし動き出した創造物を恐れ、その場から逃げ出してしまいます。","width":1200,"height":800},{"afterParagraph":2,"src":"assets/frankenstein-mountain-dialogue-scene.webp","alt":"氷河の山中でヴィクターに話を聞いてほしいと訴える創造物","caption":"山中でヴィクターと向き合い、まず話を聞いてほしいと訴える創造物。","width":1200,"height":800},{"afterParagraph":3,"src":"assets/frankenstein-oldman-scene.webp","alt":"質素な室内で目の見えない老人に話しかける創造物","caption":"人に受け入れてもらいたいと願い、目の見えない老人に話しかける創造物。","width":1200,"height":800}],"characterGallery":[{"name":"ヴィクター・フランケンシュタイン","role":"生命をつくる研究に打ち込み、自分が生み出した存在を恐れて見捨てる。","portraits":[{"src":"assets/frankenstein-face-victor.webp","label":"","alt":"ヴィクター・フランケンシュタインの創作イメージ","width":500,"height":500}]},{"name":"創造物（そうぞうぶつ）","role":"ヴィクターに命を与えられた、固有名のない存在。言葉を学び、他者とのつながりを求める。","portraits":[{"src":"assets/frankenstein-face-creature.webp","label":"","alt":"創造物（そうぞうぶつ）の創作イメージ","width":500,"height":500}]},{"name":"ロバート・ウォルトン","role":"北極へ向かう探検家。ヴィクターの話を記録し、最後に創造物とも会う。","portraits":[{"src":"assets/frankenstein-face-walton.webp","label":"","alt":"ロバート・ウォルトンの創作イメージ","width":500,"height":500}]},{"name":"エリザベス","role":"ヴィクターと共に育ち、のちに結婚する。","portraits":[{"src":"assets/frankenstein-face-elizabeth.webp","label":"","alt":"エリザベスの創作イメージ","width":500,"height":500}]},{"name":"ヘンリー・クレルヴァル","role":"ヴィクターの親しい友人。","portraits":[{"src":"assets/frankenstein-face-henry.webp","label":"","alt":"ヘンリー・クレルヴァルの創作イメージ","width":500,"height":500}]},{"name":"ウィリアム","role":"ヴィクターの幼い弟。","portraits":[{"src":"assets/frankenstein-face-william.webp","label":"","alt":"ウィリアムの創作イメージ","width":500,"height":500}]},{"name":"ジュスティーヌ","role":"一家に仕える女性。ウィリアム殺害の罪を着せられる。","portraits":[{"src":"assets/frankenstein-face-justine.webp","label":"","alt":"ジュスティーヌの創作イメージ","width":500,"height":500}]},{"name":"ド・ラセー老人（どらせーろうじん）","role":"目が見えない老人。創造物の話に耳を傾ける。","portraits":[{"src":"assets/frankenstein-face-delacey.webp","label":"","alt":"ド・ラセー老人（どらせーろうじん）の創作イメージ","width":500,"height":500}]}],"characterGalleryNote":"","headerCaption":"山中でヴィクターと向き合い、まず話を聞いてほしいと訴える創造物。"}, {"id":"makuranososhi","name":"枕草子","reading":"まくらのそうし","bodyReadings":{"清少納言":"せいしょうなごん","中宮定子":"ちゅうぐうていし","定子":"ていし","中宮":"ちゅうぐう","一条天皇":"いちじょうてんのう","女房":"にょうぼう","章段":"しょうだん","火桶":"ひおけ","随筆":"ずいひつ","宮廷":"きゅうてい","后":"きさき","機知":"きち","列挙":"れっきょ","観察":"かんさつ","身分":"みぶん","皇子":"おうじ","臣下":"しんか","帝":"みかど","栄華":"えいが","喪失":"そうしつ","出家":"しゅっけ","貴族":"きぞく","須磨":"すま","明石":"あかし","宇治":"うじ","小野":"おの","異母妹":"いぼまい","臨終":"りんじゅう","邸宅":"ていたく","雁":"かり"},"cat":"literature","primaryCategory":"japanese-literature","genreLabel":"日本文学","genre":"japanese-classic","checkedDate":"2026年11月2日","sub":"清少納言｜1001年頃（成立時期には諸説）","motif":"book","intro":"季節の景色、小さな子のしぐさ、宮廷での会話。清少納言が心を動かされた場面を、鮮やかな言葉で書きとめた随筆です。一本の筋を追うのではなく、いくつもの短い文章から、その見方に触れます。","gist":"春の明け方や幼い子のしぐさから、宮廷の冗談まで。清少納言が選び取った一瞬を読む随筆。","people":[["清少納言（せいしょうなごん）","語り手。一条天皇の中宮定子に仕え、自然や人々のふるまいを観察する。"],["中宮定子（ちゅうぐうていし）","清少納言の仕える、天皇の妻。宮廷の思い出の中心となる人物。"],["女房たち（にょうぼうたち）","宮中で働く女性たち。会話や遊び、日々の仕事をともにする。"]],"links":["genjimonogatari","soseki","sei-shonagon"],"synopsisSummary":["『枕草子』は、清少納言が見た自然や人のふるまい、宮廷で経験した出来事などを集めた随筆です。長い小説のように、一つの事件が始まって最後に解決する本ではありません。「美しいもの」「かわいらしいもの」のように同じ仲間を並べる文章、日常への感想、仕えていた中宮定子との思い出などが、短い章段の集まりになっています。順番どおりに読むだけでなく、気になる章段から入ることもできます。","有名な冒頭は「春はあけぼの」。春には、夜が明け、山ぎわが白み、細い雲が紫がかって見える時間を選びます。夏は夜、秋は夕暮れへと視線が移り、蛍や帰ってゆく鳥、風や虫の音をとらえます。冬には雪や霜、火を急いでおこす様子を描きますが、昼になって寒さがゆるみ、火桶の中に白い灰が目立ってくると、もうよくないと言います。同じ季節でも、いつ、何を、どんな状態で見るかによって感じ方が変わるのです。","「うつくしきもの」では、小さな子どもや鳥、人形の道具などが並びます。ここでの「うつくし」は、現在の「美しい」より、かわいらしい、いとおしいという感覚に近い言葉です。幼い子が小さなごみを見つけ、指でつまんで大人に見せる。顔にかかった髪を払わず、首をかしげて物を見る。清少納言が心を動かされるのは、整った姿だけではなく、その一瞬の動作です。小さいものを列挙する文章から、見守る人のまなざしまで伝わります。","宮廷の思い出には、華やかな衣装や機知に富んだ会話ばかりでなく、清少納言自身の気後れも出てきます。初めて定子のもとに仕えたころは、恥ずかしく、ほかの女房たちが自然に話したり笑ったりするのを見て、自分もいつかあのようになれるだろうかと思います。定子は何度も彼女を呼び、言葉をかけます。後の堂々とした書きぶりだけで、最初から何でもできる人だったと思い込むと、この距離の縮まり方を見落としてしまいます。","「雪山」の場面では、積み上げた雪がいつまで残るかをめぐり、清少納言が予想を立てます。自分の見込みどおりに残ってほしいと、番の者に見守りを頼むほど真剣です。ところが雪は途中でなくなり、後になって、実は定子の指示で取り除かれていたと明かされます。周囲が笑うなか、本人は悔しくてたまりません。上品で遠い世界と思いがちな宮廷が、冗談や意地の張り合いもある、人の集まる場所として見えてきます。","この本には、読み手も思わずうなずく観察がある一方、身分の低い人や田舎の物への厳しい評価もあります。現代の誰にとっても正しい好みを教える本ではなく、ある時代、ある立場にいた一人の判断が、鮮やかな言葉になった本として読むのが大切です。清少納言と同じ物を好きになる必要はありません。「自分なら何を選ぶだろう」と比べると、千年前の文章が、今日の暮らしを見るためのきっかけになります。"],"sources":[{"title":"『枕草紙』原文（1903年『國文大觀』版の翻刻）","url":"https://ja.wikisource.org/wiki/枕草紙_(國文大觀)"},{"title":"参照旧版の書誌・刊年・編纂者生没年","url":"https://ja.wikisource.org/wiki/Index:Kokubun_taikan_09_part1.djvu"},{"title":"国文学研究資料館「枕草子」：作者・成立目安・ジャンル・宮廷背景","url":"https://www.nijl.ac.jp/etenji/bungakushi/contents/detail/detail02-02_008.html"},{"title":"国立公文書館「枕草子」：旧版本・随筆集としての説明","url":"https://www.archives.go.jp/exhibition/digital/rekishihouko/h27contents/27_1030.html"},{"title":"国文学研究資料館・清少納言の読み","url":"https://www.nijl.ac.jp/etenji/bungakushi/contents/detail/detail02-02_008.html"},{"title":"神戸親和女子大学・定子（ていし）中宮","url":"https://www.kobe-shinwa.ac.jp/correspondence/column/pdf/shinwakyuudai_93.pdf"},{"title":"京都国立博物館・女房（にょうぼう）","url":"https://www.kyohaku.go.jp/old/jp/torarin/blog/2018/01/index.html"},{"title":"集英社イミダス・火桶（ひおけ）","url":"https://imidas.jp/kojiten/detail/W-27-0-126-06.html"},{"title":"集英社イミダス・中宮（ちゅうぐう）","url":"https://imidas.jp/jidaigeki/detail/L-57-072-08-04-G252.html"},{"title":"奈良県観光公式・一条天皇（いちじょうてんのう）","url":"https://yamatoji.nara-kankou.or.jp/artifact/0000000108"}],"sourceNote":"清少納言の随筆。平安時代中期、1001年頃の成立と紹介されますが、成立過程や時期には諸説があります。伝本によって本文・配列・章段の分け方が異なるため、ここでは章段番号を固定していません。本文の照合には1903年刊『國文大觀』第九編日記草子部所収「枕草紙」の翻刻を用い、現代語の案内は独自に執筆しました。 掲載した章段を重点的に照合した内容案内で、全章段を網羅していません。","textNote":"","imageCaption":"作品をもとにしたAIイメージイラスト","summaryHeading":"内容案内","introHeading":"作品の入口","introBadge":"随筆の入口","interpretationNote":"文章の内容を踏まえた、読み方の一例です。","summaryReadings":{"清少納言":{"key":"清少納言","reading":"せいしょうなごん"},"中宮定子":{"key":"中宮定子","reading":"ちゅうぐうていし"},"女房たち":{"key":"女房たち","reading":"にょうぼうたち"}},"image":"assets/makuranososhi.webp","imageAlt":"春の庭を眺めながら筆を持つ、宮廷の女性の作品イメージ","inlineIllustrations":[{"afterParagraph":2,"src":"assets/makura-autumn-scene.webp","alt":"秋の夕暮れ。ねぐらへ帰る鳥や、遠くを列になって飛ぶ雁に、清少納言は心をとめます。","caption":"秋の夕暮れ。ねぐらへ帰る鳥や、遠くを列になって飛ぶ雁に、清少納言は心をとめます。","width":1200,"height":800},{"afterParagraph":3,"src":"assets/makura-child-scene.webp","alt":"顔にかかった髪を払わず、首をかしげて物を見る幼い子の場面イメージ","caption":"髪を払わず、首をかしげる幼い子。清少納言は、そんな小さなしぐさに心を動かされます。","width":1200,"height":800},{"afterParagraph":5,"src":"assets/makura-snow-scene.webp","alt":"宮廷の庭に積み上げた雪山を見守る番の者の場面イメージ","caption":"いつまで残るかを予想した雪山を、番の者が見守ります。","width":1200,"height":800}],"characterGallery":[{"name":"清少納言（せいしょうなごん）","role":"語り手。一条天皇の中宮定子に仕え、自然や人々のふるまいを観察する。","portraits":[{"src":"assets/makura-face-seishonagon.webp","label":"定子に仕えていたころ","alt":"清少納言（せいしょうなごん）の創作イメージ","width":500,"height":500}]},{"name":"中宮定子（ちゅうぐうていし）","role":"清少納言の仕える、天皇の妻。宮廷の思い出の中心となる人物。","portraits":[{"src":"assets/makura-face-teishi.webp","label":"中宮定子","alt":"中宮定子（ちゅうぐうていし）の創作イメージ","width":500,"height":500}]},{"name":"女房たち（にょうぼうたち）","role":"宮中で働く女性たち。会話や遊び、日々の仕事をともにする。","portraits":[{"src":"assets/makura-face-ladies.webp","label":"宮廷に仕える女性たちの代表","alt":"女房たち（にょうぼうたち）の創作イメージ","width":500,"height":500}]}],"characterGalleryNote":"女房たちは宮廷に仕える女性たちです。"}, {"id": "genjimonogatari", "name": "源氏物語", "reading": "げんじものがたり", "bodyReadings": {"光源氏": "ひかるげんじ", "紫式部": "むらさきしきぶ", "桐壺更衣": "きりつぼのこうい", "藤壺": "ふじつぼ", "紫の上": "むらさきのうえ", "六条院": "ろくじょういん", "冷泉帝": "れいぜいてい", "女三宮": "おんなさんのみや", "柏木": "かしわぎ", "薫": "かおる", "匂宮": "におうのみや", "浮舟": "うきふね", "宇治十帖": "うじじゅうじょう", "大君": "おおいぎみ", "中の君": "なかのきみ", "夢浮橋": "ゆめのうきはし", "伴侶": "はんりょ", "宮廷": "きゅうてい", "随筆": "ずいひつ", "章段": "しょうだん", "観察": "かんさつ", "身分": "みぶん", "女房": "にょうぼう", "皇子": "おうじ", "臣下": "しんか", "帝": "みかど", "栄華": "えいが", "喪失": "そうしつ", "出家": "しゅっけ", "貴族": "きぞく", "須磨": "すま", "明石": "あかし", "宇治": "うじ", "小野": "おの", "異母妹": "いぼまい", "臨終": "りんじゅう", "邸宅": "ていたく"}, "cat": "literature", "primaryCategory": "japanese-literature", "genreLabel": "日本文学", "genre": "japanese-classic", "checkedDate": "2026年11月2日", "sub": "紫式部｜11世紀初めごろ", "motif": "book", "intro": "光源氏の恋と栄華、その陰で傷つく人々、さらに次の世代までを描く長編物語です。ここでは全54帖の細部を並べるのではなく、物語の大きな流れを結末までたどります。", "gist": "光源氏の栄華と喪失から、薫と浮舟の世代へ。恋だけでは捉えきれない、相手の心との隔たりをたどる。", "people": [["光源氏（ひかるげんじ）", "帝の子として生まれ、「源」の姓を与えられた貴公子。栄華と喪失を経験する。"], ["藤壺（ふじつぼ）", "源氏の父帝の妻。源氏との間の子が、のちの冷泉帝となる。"], ["紫の上（むらさきのうえ）", "幼いころから源氏のもとで育ち、生涯の重要な伴侶となる女性。"], ["薫（かおる）", "女三宮と柏木の間に生まれ、源氏の子として育つ。後半の中心人物。"], ["匂宮（におうのみや）", "源氏の娘と帝との子で、源氏の孫。薫と並ぶ後半の中心人物。"], ["浮舟（うきふね）", "宇治の八の宮の娘。大君・中の君の異母妹。薫と匂宮の間で苦しんだのち出家する。"]], "links": ["makuranososhi", "kokoro", "murasaki-shikibu"], "synopsisSummary": ["光源氏は、帝と桐壺更衣の間に生まれます。母は帝から深く愛されますが、宮中の妬みや圧迫に苦しみ、源氏が幼いころに亡くなります。美しく才能もある源氏は、皇子のままではなく「源」の姓を持つ臣下として育ち、葵の上と結婚します。それでも心を強く引かれるのは、亡き母に似た、父帝の妻・藤壺です。二人の間に生まれた子は、事情を知らない帝の子として育てられます。この秘密が、源氏の成功にも苦悩にも長く結びついていきます。", "源氏の周囲には、さまざまな立場の女性が登場します。幼いころに引き取られ、やがて生涯の大切な伴侶となる紫の上、身分や暮らしの異なる恋人たち。それぞれに願いや不安があり、源氏に愛されればすべてが解決するわけではありません。やがて源氏は政治的な圧迫を受け、さらなる処罰を避けようと自ら都を離れて須磨へ行きます。明石での暮らしも経て都へ戻ると、地位を回復し、藤壺との子が冷泉帝となった時代に力を増していきます。華やかな邸宅・六条院には、源氏の栄華が目に見える形で集まります。", "しかし、地位が高くなっても人の心は思い通りになりません。源氏が新たに妻として迎えた女三宮は、若い貴族の柏木との間に薫をもうけます。源氏は秘密を知り、自分もかつて藤壺との間に子をもうけたことを思い返します。かつて父に隠していた側だった人が、今度は隠される側になるのです。紫の上も、出家を望みながら源氏の同意を得られず、病を重ねて亡くなります。残された源氏の深い悲しみを描いたあと、物語は彼の死後へ移ります。源氏の臨終の場面が詳しく語られるわけではありません。", "次の世代の中心は、源氏の子として育った薫と、源氏の孫にあたる匂宮です。最後の十帖は、宇治が重要な舞台になる「宇治十帖」。薫は宇治の八の宮の娘・大君に引かれますが、大君は結婚をためらい、やがて病で亡くなります。妹の中の君は匂宮と結ばれます。その後、姉妹の異母妹・浮舟をめぐって、薫と匂宮の関係も複雑になります。浮舟は二人の間で追い詰められ、姿を消します。周囲には死んだと思われますが、実際には僧たちに助けられ、小野の山里で暮らしていました。", "浮舟は生き延びたあと、自ら出家を願います。最後の「夢浮橋」では、生存を知った薫が、浮舟の弟を使いにして手紙を届けます。しかし浮舟は昔の関係へ戻ろうとせず、返事を渡しません。薫はその気持ちを理解しきれず、別の男が彼女を隠しているのではないかとまで疑います。再会して幸せになる結末でも、誰かがすべてを説明して解決する結末でもありません。人の心が他人にはつかみきれない、その隔たりを残して物語は閉じられます。"], "sources": [{"title": "青空文庫・紫式部作品一覧（与謝野晶子訳の各巻）", "url": "https://www.aozora.gr.jp/index_pages/person52.html"}, {"title": "青空文庫・総合図書カード（成立時期、原作者と訳者の権利について）", "url": "https://www.aozora.gr.jp/cards/000052/card362.html"}, {"title": "京都大学・文学史年表『源氏物語』（54帖・全体構成）", "url": "https://rmda.kulib.kyoto-u.ac.jp/item/rb00007030/explanation/genji"}, {"title": "与謝野晶子訳『桐壺』", "url": "https://www.aozora.gr.jp/cards/000052/files/5016_9758.html"}, {"title": "与謝野晶子訳『紅葉賀』", "url": "https://www.aozora.gr.jp/cards/000052/files/5022_11633.html"}, {"title": "与謝野晶子訳『須磨』", "url": "https://www.aozora.gr.jp/cards/000052/files/5027_11270.html"}, {"title": "与謝野晶子訳『澪標』", "url": "https://www.aozora.gr.jp/cards/000052/files/5029_10177.html"}, {"title": "与謝野晶子訳『柏木』", "url": "https://www.aozora.gr.jp/cards/000052/files/5051_14567.html"}, {"title": "与謝野晶子訳『御法』", "url": "https://www.aozora.gr.jp/cards/000052/files/5056_13291.html"}, {"title": "与謝野晶子訳『匂宮』", "url": "https://www.aozora.gr.jp/cards/000052/files/5059_11969.html"}, {"title": "与謝野晶子訳『橋姫』", "url": "https://www.aozora.gr.jp/cards/000052/files/5062_15326.html"}, {"title": "与謝野晶子訳『総角』", "url": "https://www.aozora.gr.jp/cards/000052/files/5064_15564.html"}, {"title": "与謝野晶子訳『浮舟』", "url": "https://www.aozora.gr.jp/cards/000052/files/5068_17944.html"}, {"title": "与謝野晶子訳『手習』", "url": "https://www.aozora.gr.jp/cards/000052/files/5070_16484.html"}, {"title": "与謝野晶子訳『夢の浮橋』", "url": "https://www.aozora.gr.jp/cards/000052/files/5071_15350.html"}], "sourceNote": "紫式部による平安時代中期の物語。一般的には全54帖と数えます。参照した青空文庫の与謝野晶子訳には「夕霧」の二分と「雲隠れ」があるため、ファイルの通し番号は01〜56です。ファイル数を原作の帖数とは扱っていません。 主要な巻の関連箇所を照合した全体案内で、各巻の出来事を網羅したものではありません。", "textNote": "死別、婚姻関係、本人の意思が尊重されない関係、自死を思いつめる場面を含みます。", "imageCaption": "作品をもとにしたAIイメージイラスト", "summaryHeading": "全体の流れ", "introHeading": "あらすじ", "introBadge": "物語の入口", "interpretationNote": "作品の出来事を踏まえた、読み方の一例です。", "summaryReadings": {"光源氏": {"key": "光源氏", "reading": "ひかるげんじ"}, "藤壺": {"key": "藤壺", "reading": "ふじつぼ"}, "紫の上": {"key": "紫の上", "reading": "むらさきのうえ"}, "薫": {"key": "薫", "reading": "かおる"}, "匂宮": {"key": "匂宮", "reading": "におうのみや"}, "浮舟": {"key": "浮舟", "reading": "うきふね"}}, "image": "assets/genjimonogatari.webp", "imageAlt": "月明かりの庭を隔てて座る平安時代の男女の作品イメージ", "inlineIllustrations": [{"afterParagraph": 1, "src": "assets/genji-child-emperor-scene.webp", "alt": "母を失った幼い源氏は、宮中で父帝のそばに育ちます。後に「源」の姓を与えられる、物語の主人公の幼いころです。", "caption": "母を失った幼い源氏は、宮中で父帝のそばに育ちます。後に「源」の姓を与えられる、物語の主人公の幼いころです。", "width": 1200, "height": 800}, {"afterParagraph": 2, "src": "assets/genji-suma-scene.webp", "alt": "都を離れ、須磨の海辺を眺める成人の光源氏の場面イメージ", "caption": "都を離れて須磨へ来た源氏。華やかな宮廷での暮らしから、静かな海辺へ移ります。", "width": 1200, "height": 800}, {"afterParagraph": 5, "src": "assets/genji-ukifune-scene.webp", "alt": "出家した浮舟と、御簾を隔てて手紙の返事を待つ幼い弟の場面イメージ", "caption": "手紙を持ってきたのは、浮舟の弟です。浮舟は薫への返事を渡さず、昔の関係へ戻ろうとしません。", "width": 1200, "height": 800}], "characterGallery": [{"name": "光源氏（ひかるげんじ）", "role": "帝の子として生まれ、「源」の姓を与えられた貴公子。栄華と喪失を経験する。", "portraits": [{"src": "assets/genji-face-genji.webp", "label": "成人した光源氏", "alt": "光源氏（ひかるげんじ）の創作イメージ", "width": 500, "height": 500}]}, {"name": "藤壺（ふじつぼ）", "role": "源氏の父帝の妻。源氏との間の子が、のちの冷泉帝となる。", "portraits": [{"src": "assets/genji-face-fujitsubo.webp", "label": "宮中にいたころ", "alt": "藤壺（ふじつぼ）の創作イメージ", "width": 500, "height": 500}]}, {"name": "紫の上（むらさきのうえ）", "role": "幼いころから源氏のもとで育ち、生涯の重要な伴侶となる女性。", "portraits": [{"src": "assets/genji-face-murasaki.webp", "label": "成人した紫の上", "alt": "紫の上（むらさきのうえ）の創作イメージ", "width": 500, "height": 500}]}, {"name": "薫（かおる）", "role": "女三宮と柏木の間に生まれ、源氏の子として育つ。後半の中心人物。", "portraits": [{"src": "assets/genji-face-kaoru.webp", "label": "後半に登場する薫", "alt": "薫（かおる）の創作イメージ", "width": 500, "height": 500}]}, {"name": "匂宮（におうのみや）", "role": "源氏の娘と帝との子で、源氏の孫。薫と並ぶ後半の中心人物。", "portraits": [{"src": "assets/genji-face-niou.webp", "label": "後半に登場する匂宮", "alt": "匂宮（におうのみや）の創作イメージ", "width": 500, "height": 500}]}, {"name": "浮舟（うきふね）", "role": "宇治の八の宮の娘。大君・中の君の異母妹。薫と匂宮の間で苦しんだのち出家する。", "portraits": [{"src": "assets/genji-face-ukifune.webp", "label": "出家した浮舟", "alt": "浮舟（うきふね）の創作イメージ", "width": 500, "height": 500}]}], "characterGalleryNote": "光源氏と紫の上は成人したころ、浮舟は出家したあとの姿で表しています。藤壺は光源氏の実母ではなく、父帝の妻です。"}, {"id": "takekurabe", "name": "たけくらべ", "reading": "たけくらべ", "bodyReadings": {"美登利": "みどり", "信如": "しんにょ", "正太郎": "しょうたろう", "長吉": "ちょうきち", "三五郎": "さんごろう", "吉原": "よしわら", "遊廓": "ゆうかく", "遊女": "ゆうじょ", "草履": "ぞうり", "鼻緒": "はなお", "酉の市": "とりのいち", "水仙": "すいせん", "僧侶": "そうりょ", "出立": "しゅったつ", "侮辱": "ぶじょく", "貧困": "ひんこん", "内職": "ないしょく", "財産": "ざいさん", "孤独": "こどく", "格子": "こうし", "修業": "しゅぎょう", "将来": "しょうらい", "噂": "うわさ", "翌日": "よくじつ", "幼い": "おさない", "正太": "しょうた"}, "cat": "literature", "primaryCategory": "japanese-literature", "genreLabel": "日本文学", "genre": "japanese-classic", "checkedDate": "2026年11月2日", "sub": "樋口一葉｜1895年発表", "motif": "book", "intro": "吉原に近い町で遊ぶ子どもたちが、家の仕事や周囲の期待に囲まれながら大人へ近づいていく物語。美登利と信如の、言葉にならない親しみとすれ違いを描きます。", "gist": "仲よく遊んでいた子どもたちが、それぞれ大人の世界へ近づいていく。美登利と信如の、伝えられない思いとすれ違いを描く。", "people": [["美登利（みどり）", "遊女として働く姉を持つ少女。明るく気前がよく、表町の子どもたちの中心にいる。"], ["信如（しんにょ）", "寺の息子。美登利への意識を表せず、僧侶の修業へ進む。"], ["正太郎（しょうたろう）", "金貸しの家の少年。正太とも呼ばれ、美登利と親しく遊ぶ。"], ["長吉（ちょうきち）", "横町の子どもたちを率いる少年。表町と対立する。"], ["三五郎（さんごろう）", "貧しい家の少年。二つの組の間で立場が揺れる。"]], "links": ["nigorie", "genjimonogatari", "higuchi-ichiyo"], "synopsisSummary": ["明治の東京、吉原の遊廓に近い町では、子どもたちが二つの組に分かれて遊んでいます。表町で人気の美登利は、遊女として働く姉を持つ少女です。気前がよく、歌や踊りも得意で、金貸しの家の正太郎とも仲よくしています。一方、横町の長吉は表町に対抗し、寺の息子で勉強のできる信如を仲間に引き入れます。", "祭りの夜、長吉たちは表町へ押しかけ、表町の仲間になった少年、三五郎を殴ります。かばった美登利も姉の仕事を侮辱され、投げられた泥だらけの草履が額に当たりました。長吉が、その場にいない信如も自分たちの味方だと言ったため、美登利は彼も自分の敵だと思い込みます。信如は後で騒ぎを知り、長吉に弱い者をいじめるなと注意しますが、美登利に誤解を解くことはできません。", "実は以前、転んだ信如に美登利がハンカチを差し出した時、二人は周りからからかわれていました。それから信如は気恥ずかしさで彼女を避け、美登利は嫌われていると受け取っていたのです。秋の雨の日、美登利の住まいの前で信如の下駄の鼻緒が切れます。気づいた美登利は、修理に使える布を持って出ますが、相手が信如だと分かると声をかけられません。美登利は格子の間から黙って布を外へ投げ出しますが、信如はそれを拾わずにいます。結局、信如は通りかかった長吉の下駄を借り、布は雨の中に残されました。", "酉の市の日、美登利は姉のところで髪を大人びた形に結ってもらいます。正太郎はきれいだと喜びますが、彼女はうつむき、人に見られることさえ苦しく感じます。家に帰ると泣き、心配してついてきた正太郎にも帰ってほしいと言います。子どもの遊びを続けていたい、大人になりたくないという思いがあるのに、彼にはうまく伝えられません。何が彼女を変えたのか、その具体的な原因を物語は明言していません。", "その日から美登利は町で遊ばなくなり、正太郎とも親しくしなくなります。遊女になることを周囲から当然のように見られる美登利と、家の商売の手伝いに戻る正太郎。子ども仲間のにぎわいは失われていきます。信如も、僧侶の修業のため町を離れることになりました。ある霜の朝、美登利の家の格子に水仙の作り花が差し込まれます。置いた人は分からないまま、彼女は懐かしさを感じて花を飾ります。その翌日が信如の出立の日だったと伝えられ、言葉にならなかった思いを残して物語は終わります。"], "sources": [{"title": "青空文庫・樋口一葉「たけくらべ」原文", "url": "https://www.aozora.gr.jp/cards/000064/files/56041_54765.html"}, {"title": "青空文庫・図書カード（初出・底本・作者没年）", "url": "https://www.aozora.gr.jp/cards/000064/card56041.html"}, {"title": "国立国会図書館・樋口一葉（読み・生没年）", "url": "https://www.ndl.go.jp/portrait/datas/315/"}], "sourceNote": "初出は「文学界」の1895年1〜3・8・11・12月、1896年1月。参照した青空文庫No.56041は新字旧仮名の原文で、現代語訳ではありません。底本は新潮文庫「にごりえ・たけくらべ」（1949年初版、2003年改版、入力に使用したのは2008年第128刷）。連載年と底本刊行年を区別しています。美登利が遊ばなくなる原因について本文は具体的に明言していません。初潮・水揚げなどの特定の説明を、あらすじの確定事実にしていません。最後の水仙は生花ではなく作り花で、置き主は明示されず、信如の出立との関係を読者に感じさせる結びになっています。信如は本文で主に「しんにょ」と読まれ、学校での姓名には「ふじもとのぶゆき」のルビもあります。", "textNote": "遊廓や遊女という当時の制度、子どもへの暴力・侮辱、本人が選びにくい将来を扱います。性的な行為や身体の損傷を詳しく描写せず、制度を肯定する説明にはしていません。原文には現在では差別的と受け取られる表現があります。", "imageCaption": "作品をもとにしたAIイメージイラスト", "summaryHeading": "要約", "termNote": "鼻緒は、下駄や草履で足を留めるひもです。水仙の作り花は、水仙をかたどった造花を指します。", "summaryReadings": {"美登利": {"key": "美登利", "reading": "みどり"}, "信如": {"key": "信如", "reading": "しんにょ"}, "正太郎": {"key": "正太郎", "reading": "しょうたろう"}, "長吉": {"key": "長吉", "reading": "ちょうきち"}, "三五郎": {"key": "三五郎", "reading": "さんごろう"}}, "image": "assets/takekurabe.webp", "imageAlt": "明治の町路と子どもたちの距離を描く作品イメージ", "inlineIllustrations": [{"afterParagraph": 1, "src": "assets/takekurabe-early-scene.webp", "alt": "祭りの前に、正太郎の遊びの提案を聞いて笑顔で応じる美登利と子どもたち", "caption": "祭りを前に、正太郎が幻灯で遊ぼうと提案し、美登利も賛成します。幻灯は、光で絵を映して楽しむ道具です。", "width": 1200, "height": 800}, {"afterParagraph": 3, "src": "assets/takekurabe-cloth-scene.webp", "caption": "鼻緒が切れた信如を助けようと、美登利は布を門の外へ出します。しかし二人は言葉を交わせず、布は受け取られません。", "alt": "鼻緒が切れた信如を助けようと、美登利は布を門の外へ出します。しかし二人は言葉を交わせず、布は受け取られません。", "width": 1200, "height": 800}, {"afterParagraph": 5, "src": "assets/takekurabe-flower-scene.webp", "caption": "置き主の分からない水仙の作り花を、美登利は一輪挿しに飾ります。その翌日は、信如が町を離れる日でした。", "alt": "置き主の分からない水仙の作り花を、美登利は一輪挿しに飾ります。その翌日は、信如が町を離れる日でした。", "width": 1200, "height": 800}], "characterGallery": [{"name": "美登利（みどり）", "role": "遊女として働く姉を持つ少女。明るく気前がよく、表町の子どもたちの中心にいる。", "portraits": [{"src": "assets/takekurabe-face-midori.webp", "label": "町で遊んでいたころ", "alt": "美登利（みどり）の創作イメージ", "width": 500, "height": 500}]}, {"name": "信如（しんにょ）", "role": "寺の息子。美登利への意識を表せず、僧侶の修業へ進む。", "portraits": [{"src": "assets/takekurabe-face-shinnyo.webp", "label": "修業へ出る前", "alt": "信如（しんにょ）の創作イメージ", "width": 500, "height": 500}]}, {"name": "正太郎（しょうたろう）", "role": "金貸しの家の少年。正太とも呼ばれ、美登利と親しく遊ぶ。", "portraits": [{"src": "assets/takekurabe-face-shotaro.webp", "label": "", "alt": "正太郎（しょうたろう）の創作イメージ", "width": 500, "height": 500}]}, {"name": "長吉（ちょうきち）", "role": "横町の子どもたちを率いる少年。表町と対立する。", "portraits": [{"src": "assets/takekurabe-face-chokichi.webp", "label": "", "alt": "長吉（ちょうきち）の創作イメージ", "width": 500, "height": 500}]}, {"name": "三五郎（さんごろう）", "role": "貧しい家の少年。二つの組の間で立場が揺れる。", "portraits": [{"src": "assets/takekurabe-face-sangoro.webp", "label": "", "alt": "三五郎（さんごろう）の創作イメージ", "width": 500, "height": 500}]}], "characterGalleryNote": "美登利と信如は、物語の途中に登場する少年少女の姿で表しています。"}, {"id": "nigorie", "name": "にごりえ", "reading": "にごりえ", "bodyReadings": {"菊の井": "きくのい", "お力": "おりき", "源七": "げんしち", "お初": "おはつ", "太吉": "たきち", "結城朝之助": "ゆうきとものすけ", "蒲団": "ふとん", "酌婦": "しゃくふ", "宴席": "えんせき", "棺": "ひつぎ", "執着": "しゅうちゃく", "困窮": "こんきゅう", "心中": "しんじゅう", "貧困": "ひんこん", "内職": "ないしょく", "財産": "ざいさん", "孤独": "こどく", "格子": "こうし", "修業": "しゅぎょう", "将来": "しょうらい", "噂": "うわさ", "翌日": "よくじつ", "幼い": "おさない", "正太": "しょうた", "朝之助": "とものすけ"}, "cat": "literature", "primaryCategory": "japanese-literature", "genreLabel": "日本文学", "genre": "japanese-classic", "checkedDate": "2026年11月2日", "sub": "樋口一葉｜1895年発表", "motif": "book", "intro": "酒の席で客の相手をするお力と、彼女への思いから離れられない源七。その家族をも描きながら、貧しさと孤独、他人の噂では捉えきれない心のありように迫る小説です。", "gist": "店で明るく振る舞うお力と、お力への思いから離れられない源七。その妻子の暮らしも描き、貧しさと孤独、周囲の噂を見つめる。", "people": [["お力（おりき）", "菊の井で働く女性。人気者の姿の裏に、貧しい生い立ちと不安を抱える。"], ["源七（げんしち）", "お力に通って財産を失った元蒲団屋。お初の夫で太吉の父。"], ["お初（おはつ）", "源七の妻。内職で暮らしを支え、息子を守ろうとする。"], ["太吉（たきち）", "源七とお初の幼い息子。"], ["結城朝之助（ゆうきとものすけ）", "菊の井へ通う客。お力が過去と悩みを打ち明ける相手。"]], "links": ["takekurabe", "kokoro", "higuchi-ichiyo"], "synopsisSummary": ["明治の町で、菊の井という店に働くお力は、客を引きつける人気者です。強気で陽気に見えますが、仲間にも見せない苦しみを抱えています。以前からの客である源七は、妻のお初と幼い息子の太吉がありながら、お力に通って財産を失いました。蒲団屋だった彼は、今では日雇いの仕事をし、狭い長屋で暮らしています。お力は、なおも訪ねてくる源七と会うのを避けています。", "ある雨の日、お力は通りかかった結城朝之助を店へ誘います。気前のよい朝之助は何度も通うようになり、お力も親しみを感じます。しかし、身の上を尋ねられても、すぐには話せません。客の前で騒いでいる姿とは違い、夜は思い悩んで眠れず、一生を頼める相手もいないのです。源七の息子・太吉にまで自分を悪者と思われていることも、彼女を傷つけています。", "盆の十六日の夜、お力は宴席の途中で店を飛び出します。どこか遠くへ逃れたいと思いながらも、行く先は見つかりません。道で朝之助に出会って店へ戻ると、初めて幼い頃の貧しさを打ち明けます。祖父の仕事は世に認められず、腕のよい職人だった父も暮らしを立てられませんでした。七歳の冬、買って帰る米を溝に落とした時、家族の食事を失わせたつらさは、叱られなくても耐え難かったと語ります。朝之助には心を寄せながら、その妻になることにも迷いがあり、結婚だけで解決できる悩みではありません。", "一方、源七はお力を忘れられず、仕事にも出なくなります。お初は内職で一家を支え、夫に働いてほしいと訴えますが、気持ちはすれ違うばかりです。そこへ太吉が、お力から買ってもらった菓子を持ち帰ります。お初は一家を苦しめた相手からの贈り物だと怒り、菓子を捨てました。源七はこれを自分への当てつけと受け取り、夫としての権利を言い立て、お初を追い出そうとします。頼れる実家もないお初は謝ってすがりますが、聞き入れられず、太吉を連れて家を出ました。", "盆が過ぎた頃、町から二つの棺が運ばれ、お力と源七の死が知らされます。見物人の間では、お力も承知した心中だったという話と、逃げようとした彼女を源七が殺したのだという話が交わされます。店の損得を口にする人までいます。しかし事件そのものは描かれず、二人が最後に何を話し、どう死に至ったのかは確定されません。人々の噂が入り乱れたまま、寺の山に怪しい光が飛ぶという伝聞を残し、物語は終わります。"], "sources": [{"title": "青空文庫・樋口一葉「にごりえ」原文", "url": "https://www.aozora.gr.jp/cards/000064/files/387_15293.html"}, {"title": "青空文庫・図書カード（初出・底本・作者没年）", "url": "https://www.aozora.gr.jp/cards/000064/card387.html"}, {"title": "国立国会図書館・樋口一葉（読み・生没年）", "url": "https://www.ndl.go.jp/portrait/datas/315/index.html"}], "sourceNote": "初出は「文藝倶樂部第九篇」博文館、1895（明治28）年9月20日。参照した青空文庫No.387は旧字旧仮名の原文。底本は講談社「日本現代文學全集 10 樋口一葉集」1962年初版、入力使用は1969年第5刷。初出年と底本刊行年を区別しています。終節の死の事情は見物人たちの会話によって伝えられ、諸説は一致しません。合意の心中、殺害の具体的経過、お力の最終意思を確定事実として補っていません。結城朝之助の本文ルビは「ゆふき とものすけ」で、現代仮名遣いでは「ゆうき とものすけ」としています。", "textNote": "困窮、性を伴う接客の仕事、家族への威圧、殺人・心中に関する噂を含みます。身体の損傷や死の方法は詳述せず、暴力や死を恋愛の成就として美化しません。原文には現在では差別的と受け取られる表現があります。", "imageCaption": "作品をもとにしたAIイメージイラスト", "summaryHeading": "要約", "termNote": "酌婦は、酒の席で客の相手をする女性を指す当時の言葉です。本文では、菊の井で働くお力をそう呼んでいます。", "summaryReadings": {"お力": {"key": "お力", "reading": "おりき"}, "源七": {"key": "源七", "reading": "げんしち"}, "お初": {"key": "お初", "reading": "おはつ"}, "太吉": {"key": "太吉", "reading": "たきち"}, "結城朝之助": {"key": "結城朝之助", "reading": "ゆうきとものすけ"}, "朝之助": {"key": "結城朝之助", "reading": "とものすけ"}}, "image": "assets/nigorie.webp", "imageAlt": "店の入口で物思うお力を描く作品イメージ", "inlineIllustrations": [{"afterParagraph": 2, "src": "assets/nigorie-rain-scene.webp", "alt": "雨の日、お力は通りかかった朝之助を呼び止め、菊の井へ誘います。これが二人の出会いです。", "caption": "雨の日、お力は通りかかった朝之助を呼び止め、菊の井へ誘います。これが二人の出会いです。", "width": 1200, "height": 800}, {"afterParagraph": 3, "src": "assets/nigorie-confession-scene.webp", "caption": "菊の井の二階で、お力は朝之助に、幼い頃の貧しい暮らしを打ち明けます。", "alt": "菊の井の二階で、お力は朝之助に、幼い頃の貧しい暮らしを打ち明けます。", "width": 1200, "height": 800}, {"afterParagraph": 4, "src": "assets/nigorie-sweets-scene.webp", "caption": "太吉は、お力に買ってもらった菓子を抱えて帰宅します。お初は、誰からもらったのかを尋ねます。", "alt": "太吉は、お力に買ってもらった菓子を抱えて帰宅します。お初は、誰からもらったのかを尋ねます。", "width": 1200, "height": 800}], "characterGallery": [{"name": "お力（おりき）", "role": "菊の井で働く女性。人気者の姿の裏に、貧しい生い立ちと不安を抱える。", "portraits": [{"src": "assets/nigorie-face-oriki.webp", "label": "", "alt": "お力（おりき）の創作イメージ", "width": 500, "height": 500}]}, {"name": "源七（げんしち）", "role": "お力に通って財産を失った元蒲団屋。お初の夫で太吉の父。", "portraits": [{"src": "assets/nigorie-face-genshichi.webp", "label": "", "alt": "源七（げんしち）の創作イメージ", "width": 500, "height": 500}]}, {"name": "お初（おはつ）", "role": "源七の妻。内職で暮らしを支え、息子を守ろうとする。", "portraits": [{"src": "assets/nigorie-face-ohatsu.webp", "label": "", "alt": "お初（おはつ）の創作イメージ", "width": 500, "height": 500}]}, {"name": "太吉（たきち）", "role": "源七とお初の幼い息子。", "portraits": [{"src": "assets/nigorie-face-takichi.webp", "label": "", "alt": "太吉（たきち）の創作イメージ", "width": 500, "height": 500}]}, {"name": "結城朝之助（ゆうきとものすけ）", "role": "菊の井へ通う客。お力が過去と悩みを打ち明ける相手。", "portraits": [{"src": "assets/nigorie-face-tomonosuke.webp", "label": "", "alt": "結城朝之助（ゆうきとものすけ）の創作イメージ", "width": 500, "height": 500}]}], "characterGalleryNote": "店先と二階でお力と話す男性は朝之助です。源七は別の人物で、お初の夫、太吉の父です。"}, {"id": "christmas-carol", "name": "クリスマス・キャロル", "reading": "くりすますきゃろる", "bodyReadings": {"精霊": "せいれい", "甥": "おい", "叔父": "おじ", "寄付": "きふ", "暖房": "だんぼう", "石炭": "せきたん", "宴": "うたげ", "従業員": "じゅうぎょういん", "杖": "つえ", "墓石": "はかいし", "七面鳥": "しちめんちょう", "昇給": "しょうきゅう", "援助": "えんじょ"}, "cat": "literature", "primaryCategory": "world-literature", "genreLabel": "海外文学", "genre": "world-classic", "checkedDate": "2026年11月2日", "sub": "チャールズ・ディケンズ｜1843年初刊行", "motif": "book", "intro": "金もうけばかりで人を遠ざける老人スクルージのもとに、死んだ商売仲間と三人の精霊が訪れます。過去・現在・未来のクリスマスを巡り、自分の生き方を見つめ直す物語です。", "gist": "人づきあいを嫌う老人が、精霊とともに過去・現在・未来を巡り、自分と周囲の暮らしを見つめ直す。", "people": [["スクルージ", "金を大事にするあまり人を遠ざけている老人。ボブの雇い主で、フレッドの叔父。"], ["マーレイ", "七年前に死んだスクルージの商売仲間。幽霊となって、生き方を変える機会を知らせる。"], ["三人の精霊（さんにんのせいれい）", "過去・現在・未来のクリスマスを、一人ずつスクルージに見せる。"], ["ボブ・クラチット", "スクルージのもとで働く事務員。ティムの父。"], ["ティム", "ボブの幼い息子。体が弱く、家族に大切にされている。"], ["フレッド", "スクルージの甥。叔父が断っても、クリスマスの食事に誘う。"]], "links": ["happyprince", "lesmiserables", "charles-dickens"], "synopsisSummary": ["舞台はロンドン。金もうけを何より大事にする老人スクルージは、クリスマスにも人を寄せつけません。事務員ボブ・クラチットには少ない給料しか払わず、暖房の石炭も惜しみます。甥のフレッドからの食事の誘いも、貧しい人のための寄付も断りました。その夜、七年前に死んだ商売仲間のマーレイが幽霊となって現れます。マーレイは、生前に人を助けなかったことを悔やみ、スクルージにはまだ生き方を変える機会があると告げます。", "最初に訪れるのは、過去のクリスマスの精霊です。スクルージは、学校に一人で残されていた子どもの自分や、迎えに来てくれた妹の姿を見ます。続いて、若い頃に働いた店の主人が、従業員を楽しい宴に招いた晩を思い出します。人を雇う側の心づかいが働く人を幸せにすると気づき、自分の事務員への扱いを振り返ります。しかし、その後の自分は金を求めるあまり、結婚を約束したベルとの仲も失っていました。", "次は、現在のクリスマスの精霊です。スクルージは、ボブの家族が貧しいながらも食事を喜び、支え合う姿を見ます。ボブの幼い息子ティムは体が弱く、歩くための杖を使っています。精霊は、今のまま何も変わらなければ、この子は死ぬと告げました。スクルージは心配し、貧しい人の命を軽く扱った自分の言葉を恥じます。甥の家では、自分が断った集まりが楽しげに続いていました。フレッドは冷たい叔父を気にかけ、また誘おうと思っています。", "最後は、未来のクリスマスの精霊です。スクルージは、ある男の死を誰も悲しまない様子を見ます。男の持ち物は盗まれて売られ、男に借金していた夫婦は、厳しい取り立てから逃れられると安心していました。一方、ボブの家族は、亡くなったティムを深く悲しんでいます。やがて精霊が示す墓石に自分の名を見つけ、スクルージは、寂しく死んだ男が未来の自分だと知ります。これからの行いを改めれば、この未来を変えられるはずだと願い、やり直すことを誓います。", "目を覚ますと、スクルージは自分の部屋にいました。まだクリスマスの朝です。不思議な訪問は一晩のうちに起きたのでした。スクルージは早速、贈り主を伏せて大きな七面鳥をボブの家へ送る手配をします。前日に断った寄付を申し出て、午後にはフレッドの家へ出かけ、歓迎されて食事を楽しみます。", "翌朝、スクルージはボブに給料を上げると伝え、家族の暮らしも助けると約束します。その変化は一日だけでは終わりませんでした。スクルージは約束以上のことを実行し、ティムにとってもう一人の父親のような存在になります。精霊に見せられた未来とは違い、ティムは死にません。人を遠ざけていた老人は、人と喜びを分かち合いながら生きていくのです。"], "sources": [{"title": "Project Gutenberg・英語原文 全5章", "url": "https://www.gutenberg.org/cache/epub/46/pg46-images.html"}, {"title": "Project Gutenberg・書誌、作者生没年、米国PD表示", "url": "https://www.gutenberg.org/ebooks/46"}], "sourceNote": "英語原題 A Christmas Carol in Prose; Being a Ghost Story of Christmas。初刊は1843年。参照したProject Gutenberg No.46は、1843年初版の表紙とジョン・リーチの原挿絵を収める英語本文です。電子版公開年2004年・更新年2021年は作品の初刊年ではありません。全5章の英語原文から独自に要約しました。マーレイの訪問に続いて、過去・現在・未来の三精霊が現れます。未来は確定した出来事ではなく、結末ではティムが生存します。精霊を見ている間のスクルージの姿や声は、訪ねた人々には伝わりません。", "textNote": "幽霊、貧困、子どもの病気と死の予告を扱います。幽霊の怖い身体描写や遺体の詳細は省いています。", "imageCaption": "作品をもとにしたAIイメージイラスト", "summaryHeading": "要約", "termNote": "キャロルは、ここではクリスマスを祝う歌のこと。精霊は、この物語でスクルージを不思議な旅へ導く存在です。甥は兄弟姉妹の息子。フレッドはスクルージの妹の息子です。", "summaryReadings": {"スクルージ": {"key": "スクルージ", "reading": "すくるーじ"}, "マーレイ": {"key": "マーレイ", "reading": "まーれい"}, "三人の精霊": {"key": "三人の精霊", "reading": "さんにんのせいれい"}, "ボブ・クラチット": {"key": "ボブ・クラチット", "reading": "ぼぶくらちっと"}, "ティム": {"key": "ティム", "reading": "てぃむ"}, "フレッド": {"key": "フレッド", "reading": "ふれっど"}}, "image": "assets/christmas-carol.webp", "imageAlt": "冬のロンドンとスクルージを描く作品イメージ", "inlineIllustrations": [{"afterParagraph": 3, "src": "assets/carol-cratchits-scene.webp", "alt": "現在の精霊に導かれたスクルージは、ボブの家族と、父のそばに座るティムの姿を見ます。 家族には二人の姿は見えていません。", "caption": "現在の精霊に導かれたスクルージは、ボブの家族と、父のそばに座るティムの姿を見ます。 家族には二人の姿は見えていません。", "width": 1200, "height": 800}, {"afterParagraph": 4, "src": "assets/carol-future-grave-scene.webp", "alt": "自分の名が刻まれた墓を見せられたスクルージは、行いを改めて、この未来を変えようと誓います。", "caption": "自分の名が刻まれた墓を見せられたスクルージは、行いを改めて、この未来を変えようと誓います。", "width": 1200, "height": 800}, {"afterParagraph": 6, "src": "assets/carol-bob-pay-scene.webp", "alt": "クリスマスの翌朝、スクルージはボブに昇給を伝え、家族の暮らしも助けると約束します。", "caption": "クリスマスの翌朝、スクルージはボブに昇給を伝え、家族の暮らしも助けると約束します。", "width": 1200, "height": 800}], "characterGallery": [{"name": "スクルージ", "role": "金を大事にするあまり人を遠ざけている老人。ボブの雇い主で、フレッドの叔父。", "portraits": [{"src": "assets/carol-face-scrooge.webp", "label": "", "alt": "スクルージの創作イメージ", "width": 500, "height": 500}]}, {"name": "マーレイ", "role": "七年前に死んだスクルージの商売仲間。幽霊となって、生き方を変える機会を知らせる。", "portraits": [{"src": "assets/carol-face-marley.webp", "label": "幽霊として現れた姿", "alt": "マーレイの創作イメージ", "width": 500, "height": 500}]}, {"name": "三人の精霊（さんにんのせいれい）", "role": "過去・現在・未来のクリスマスを、一人ずつスクルージに見せる。", "portraits": [{"src": "assets/carol-face-past.webp", "label": "過去", "alt": "過去の精霊のイメージ", "width": 500, "height": 500}, {"src": "assets/carol-face-present.webp", "label": "現在", "alt": "現在の精霊のイメージ", "width": 500, "height": 500}, {"src": "assets/carol-face-future.webp", "label": "未来", "alt": "未来の精霊のイメージ", "width": 500, "height": 500}]}, {"name": "ボブ・クラチット", "role": "スクルージのもとで働く事務員。ティムの父。", "portraits": [{"src": "assets/carol-face-bob.webp", "label": "", "alt": "ボブ・クラチットの創作イメージ", "width": 500, "height": 500}]}, {"name": "ティム", "role": "ボブの幼い息子。体が弱く、家族に大切にされている。", "portraits": [{"src": "assets/carol-face-tim.webp", "label": "家族と過ごすころ", "alt": "ティムの創作イメージ", "width": 500, "height": 500}]}, {"name": "フレッド", "role": "スクルージの甥。叔父が断っても、クリスマスの食事に誘う。", "portraits": [{"src": "assets/carol-face-fred.webp", "label": "", "alt": "フレッドの創作イメージ", "width": 500, "height": 500}]}], "characterGalleryNote": "三人の精霊は、過去・現在・未来をそれぞれ見せる別の存在で、一人ずつ訪れます。"}, {"id": "redheadedleague", "name": "赤毛組合", "reading": "あかげくみあい", "bodyReadings": {"赤毛組合": "あかげくみあい", "質屋": "しちや", "百科事典": "ひゃっかじてん", "現像": "げんぞう", "膝": "ひざ", "役員": "やくいん", "共犯者": "きょうはんしゃ", "解散": "かいさん", "推理": "すいり", "出入り口": "でいりぐち", "捕らえ": "とらえ"}, "cat": "literature", "primaryCategory": "world-literature", "genreLabel": "海外文学", "genre": "world-classic", "checkedDate": "2026年11月2日", "sub": "アーサー・コナン・ドイル｜1891年初出", "motif": "book", "intro": "赤い髪を持つ男性だけが応募でき、百科事典を書き写すだけで給料がもらえる仕事。その奇妙な組合が突然消え、困った質屋がホームズを訪ねます。", "gist": "赤毛の人だけが雇われる奇妙な仕事が突然消える。ホームズは、質屋からの相談に隠れた計画を調べる。", "people": [["シャーロック・ホームズ", "相談を受け、聞き取りと現場の観察から計画を見抜く探偵。"], ["ワトソン", "医師でホームズの友人。この事件の語り手であり、調査と待ち伏せに同行する。"], ["ジェイベズ・ウィルスン", "鮮やかな赤毛の質屋。組合で書き写しの仕事をしていた依頼人。"], ["ヴィンセント・スポールディング", "質屋の助手として使う名前。正体は犯罪者ジョン・クレイ。"], ["ダンカン・ロス", "組合の係を名乗る赤毛の男。クレイの共犯者。"], ["ジョーンズ", "ホームズと協力する警察官。"], ["メリーウェザー", "狙われた銀行の役員。地下室へ一行を案内する。"]], "links": ["crimeandpunishment", "treasure-island", "arthur-conan-doyle"], "synopsisSummary": ["ある秋の日、医師ワトソンが探偵ホームズを訪ねると、鮮やかな赤毛の質屋ウィルスンが相談に来ていました。話は八週間ほど前にさかのぼります。助手のスポールディングに勧められ、ウィルスンは赤毛の男性だけを募集する「赤毛組合」へ応募したのです。大勢の応募者がいましたが、係のダンカン・ロスは彼の髪を気に入り、採用しました。", "仕事は、午前十時から午後二時まで事務所で百科事典を書き写すだけ。週四ポンドの給料が出る代わりに、仕事中は絶対に外へ出てはいけません。質屋は助手に任せられるので、ウィルスンは毎日通い、実際に給料も受け取りました。ところが相談に来た日の朝、事務所は閉まり、組合の解散を知らせる札だけが残っていました。ロスの行方も分からず、仕事の本当の目的が知りたくなったのです。", "ホームズが注目したのは、助手が普通の半分の給料で働いていることと、写真の現像だと言って地下室へ何度も下りることでした。ワトソンと質屋へ行くと、ホームズは歩道を杖でたたき、助手を呼び出して道を尋ねます。実際に見たかったのは、助手のズボンの膝でした。さらに角を曲がって建物の並びを調べ、質屋の裏に銀行が接していると確かめます。", "その夜、ホームズとワトソンは、警察のジョーンズと銀行役員メリーウェザーを伴い、銀行の地下室へ入りました。そこにはフランスから借りた大量の金貨が保管されています。四人は明かりを隠して待ちました。やがて床の石が持ち上がり、助手として働いていた男が、赤毛の共犯者とともに穴から現れます。ホームズは助手を捕らえました。その正体は犯罪者ジョン・クレイです。共犯者は穴へ逃げ戻りますが、その先の質屋の出入り口にも警官が待ち構えていました。", "事件の後、ホームズはワトソンに仕組みを説明します。赤毛組合は、ウィルスンを毎日決まった時間だけ店から遠ざけるための作り話でした。クレイは助手になって質屋の地下室を使い、ロスと名乗った仲間と銀行までトンネルを掘っていたのです。膝の擦れや汚れも、地下で作業した跡でした。多額の金を盗む計画に比べれば、店主へ払う給料はわずかな出費だったのです。", "組合が突然なくなったのは、トンネルが完成し、店主を外へ出しておく必要がなくなったためでした。ホームズは、発見される前に犯人が動き、逃走の時間を稼げる土曜の夜を選ぶと考えて先回りしたのです。奇妙な働き口の相談は、銀行への盗みに結びつきました。ワトソンが推理をたたえる一方、ホームズは事件を解いた後の退屈を早くも口にします。"], "sources": [{"title": "Project Gutenberg・英語原文 第II話", "url": "https://www.gutenberg.org/files/1661/1661-h/1661-h.htm"}, {"title": "Project Gutenberg・著者没年と米国PD表示", "url": "https://www.gutenberg.org/ebooks/1661"}, {"title": "DFW Sherlock Holmes・当該話資料（初出1891年8月）", "url": "https://www.dfw-sherlock.org/uploads/3/7/3/8/37380505/1891_august_the_red-headed_league.pdf"}, {"title": "ダートマス大学図書館・所蔵展示目録（1892年刊の短編集）", "url": "https://www.dartmouth.edu/library/rauner/exhibits/handlists/Adventures%20Archives.pdf"}], "sourceNote": "1891年8月の「ストランド・マガジン」に初出。1892年刊の短編集「シャーロック・ホームズの冒険」に収録。今回はProject Gutenberg #1661の英語本文中、第II話を参照しています。電子版公開年1999年は作品刊行年ではなく、この電子版を初版本の写真複製とは扱いません。ワトソンが語る英語原作をもとにしています。本文には広告の日付・解散の札の日付・八週間という期間に整合しない部分があるため、事件の月日を補って確定せず、相談当日の朝・調査・同夜・事件後という筋を示しました。ロスを名乗る共犯者は穴へ戻り、出口には警官が配置されていますが、その逮捕の実行場面は描かれません。", "textNote": "詐欺、銀行への侵入、逮捕時の武器の使用を含みます。方法の実践的な説明や負傷の細部は描いていません。", "imageCaption": "作品をもとにしたAIイメージイラスト", "summaryHeading": "要約", "termNote": "質屋は、客の品物を預かってお金を貸す店。写真の現像は、撮影した像を写真として見えるようにする作業です。この物語の助手は、それを地下室へ行く口実にしています。", "summaryReadings": {"シャーロック・ホームズ": {"key": "シャーロック・ホームズ", "reading": "しゃーろっくほーむず"}, "ワトソン": {"key": "ワトソン", "reading": "わとそん"}, "ジェイベズ・ウィルスン": {"key": "ジェイベズ・ウィルスン", "reading": "じぇいべずうぃるすん"}, "ヴィンセント・スポールディング": {"key": "ヴィンセント・スポールディング", "reading": "ゔぃんせんとすぽーるでぃんぐ"}, "ダンカン・ロス": {"key": "ダンカン・ロス", "reading": "だんかんろす"}, "ジョーンズ": {"key": "ジョーンズ", "reading": "じょーんず"}, "メリーウェザー": {"key": "メリーウェザー", "reading": "めりーうぇざー"}}, "image": "assets/redheadedleague.webp", "imageAlt": "ロンドンの部屋で事件を考えるホームズとワトソンの作品イメージ", "inlineIllustrations": [{"afterParagraph": 2, "src": "assets/redheaded-copying-scene.webp", "alt": "ウィルスンは、毎日四時間、組合の事務所で百科事典を書き写します。", "caption": "ウィルスンは、毎日四時間、組合の事務所で百科事典を書き写します。", "width": 1200, "height": 800}, {"afterParagraph": 4, "src": "assets/redheaded-cellar-scene.webp", "alt": "銀行の地下室で、ホームズは明かりを頼りに床石のすき間を調べます。", "caption": "銀行の地下室で、ホームズは明かりを頼りに床石のすき間を調べます。", "width": 1200, "height": 800}, {"afterParagraph": 5, "src": "assets/redheaded-tunnel-explanation.svg", "alt": "組合の仕事で店主を外へ出し、その間に助手たちは質屋の地下から銀行へ通路を掘っていました。図は建物の関係を示す模式図です。", "caption": "組合の仕事で店主を外へ出し、その間に助手たちは質屋の地下から銀行へ通路を掘っていました。図は建物の関係を示す模式図です。", "width": 1200, "height": 800}], "characterGallery": [{"name": "シャーロック・ホームズ", "role": "相談を受け、聞き取りと現場の観察から計画を見抜く探偵。", "portraits": [{"src": "assets/holmes-face-holmes.webp", "label": "", "alt": "シャーロック・ホームズの創作イメージ", "width": 500, "height": 500}]}, {"name": "ワトソン", "role": "医師でホームズの友人。この事件の語り手であり、調査と待ち伏せに同行する。", "portraits": [{"src": "assets/holmes-face-watson.webp", "label": "", "alt": "ワトソンの創作イメージ", "width": 500, "height": 500}]}, {"name": "ジェイベズ・ウィルスン", "role": "鮮やかな赤毛の質屋。組合で書き写しの仕事をしていた依頼人。", "portraits": [{"src": "assets/holmes-face-wilson.webp", "label": "", "alt": "ジェイベズ・ウィルスンの創作イメージ", "width": 500, "height": 500}]}, {"name": "ヴィンセント・スポールディング", "role": "質屋の助手として使う名前。正体は犯罪者ジョン・クレイ。", "portraits": [{"src": "assets/holmes-face-spaulding.webp", "label": "質屋の助手としての姿", "alt": "ヴィンセント・スポールディングの創作イメージ", "width": 500, "height": 500}]}, {"name": "ダンカン・ロス", "role": "組合の係を名乗る赤毛の男。クレイの共犯者。", "portraits": [{"src": "assets/holmes-face-ross.webp", "label": "", "alt": "ダンカン・ロスの創作イメージ", "width": 500, "height": 500}]}, {"name": "ジョーンズ", "role": "ホームズと協力する警察官。", "portraits": [{"src": "assets/holmes-face-jones.webp", "label": "", "alt": "ジョーンズの創作イメージ", "width": 500, "height": 500}]}, {"name": "メリーウェザー", "role": "狙われた銀行の役員。地下室へ一行を案内する。", "portraits": [{"src": "assets/holmes-face-merryweather.webp", "label": "", "alt": "メリーウェザーの創作イメージ", "width": 500, "height": 500}]}], "characterGalleryNote": "スポールディングとジョン・クレイは同じ人物です。地下室の絵の四人はホームズ、ワトソン、ジョーンズ、メリーウェザーです。"}, {"id": "dazai", "name": "太宰治", "reading": "だざいおさむ", "cat": "person", "sub": "1909–1948｜小説家", "motif": "book", "intro": "『走れメロス』『人間失格』などを書いた小説家。青森で育ち、東京へ出て、井伏鱒二に学びながら作品を発表しました。三鷹で暮らした時期にも多くの小説を書き、人を信じたい気持ちや、人とうまく生きられない不安を、違う語り方で描いています。", "gist": "友を信じて走る物語も、人への怖さを語る手記の物語も書いた人。作家の人生と作品の語り手を分けると、読める世界が広がります。", "people": [], "theme": "", "memory": "", "links": ["melos", "ningen", "fugaku-hyakkei", "joseito", "shayo", "kakekomi-uttae"], "sources": [{"title": "国立国会図書館「近代日本人の肖像」太宰治", "url": "https://www.ndl.go.jp/portrait/datas/4149"}, {"title": "三鷹市「太宰治略年譜」", "url": "https://www.city.mitaka.lg.jp/dazai/dazaitomitaka/nenpu.html"}, {"title": "三鷹市スポーツと文化財団・太宰治文学サロン「太宰治 紹介」", "url": "https://www.mitaka-sportsandculture.or.jp/dazai/about/"}, {"title": "五所川原市「太宰治について」", "url": "https://www.city.goshogawara.lg.jp/kyouiku/bunka/dazai.html"}, {"title": "青空文庫・太宰治「走れメロス」本文", "url": "https://www.aozora.gr.jp/cards/000035/files/1567_14913.html"}, {"title": "青空文庫・太宰治「人間失格」本文", "url": "https://www.aozora.gr.jp/cards/000035/files/301_14912.html"}, {"title": "青空文庫・太宰治「富嶽百景」図書カード", "url": "https://www.aozora.gr.jp/cards/000035/card270.html"}, {"title": "青空文庫・太宰治「富嶽百景」本文", "url": "https://www.aozora.gr.jp/cards/000035/files/270_14914.html"}, {"title": "青空文庫・太宰治「女生徒」本文", "url": "https://www.aozora.gr.jp/cards/000035/files/275_13903.html"}, {"title": "青空文庫・太宰治「斜陽」本文", "url": "https://www.aozora.gr.jp/cards/000035/files/1565_8559.html"}, {"title": "青森県近代文学館・所蔵／展示資料一覧（年表の照合）", "url": "https://www.plib.pref.aomori.lg.jp/bungakukan/exhibition/extend/uploads/58521fc0d232d.pdf"}], "bodyReadings": {"津島修治": "つしましゅうじ", "金木村": "かなぎむら", "金木町": "かなぎまち", "五所川原市": "ごしょがわらし", "井伏鱒二": "いぶせますじ", "地主": "じぬし", "上京": "じょうきょう", "東京帝国大学": "とうきょうていこくだいがく", "逆行": "ぎゃっこう", "芥川賞": "あくたがわしょう", "晩年": "ばんねん", "刊行": "かんこう", "石原美知子": "いしはらみちこ", "三鷹": "みたか", "疎開": "そかい", "斜陽": "しゃよう", "津軽": "つがる", "大庭葉蔵": "おおばようぞう", "手記": "しゅき", "自己評価": "じこひょうか", "お伽草紙": "おとぎぞうし", "未完": "みかん", "語り手": "かたりて", "富嶽百景": "ふがくひゃっけい", "女生徒": "じょせいと", "御坂峠": "みさかとうげ", "天下茶屋": "てんかぢゃや"}, "checkedDate": "2026年11月2日", "primaryCategory": "person", "genreLabel": "人物", "sourceNote": "生没日・本名は国立国会図書館、作品の発表年や三鷹での暮らしは市の年譜などを参照しています。作品の読み方は、この図鑑による読書案内です。作中の語り手を作者本人と同一視しないように説明しています。 「太宰治の歩み」の年表は、三鷹市「太宰治略年譜」、国立国会図書館「太宰治」、青森県近代文学館の資料を照合しています（年表確認日：2026年11月3日）。", "portraitNote": "提供された参考画像をもとにしたAI生成の創作イラストです。本人の写真や、写真を忠実に復元した画像ではありません。", "image": "assets/dazai-ai.webp", "imageAlt": "太宰治を題材にしたAI創作イラスト", "imageCaption": "人物を描いたAIイラスト（写真ではありません）", "backgroundDiagrams": true}, {"id": "andersen", "name": "アンデルセン", "reading": "あんでるせん", "cat": "person", "sub": "1805–1875｜童話・小説・詩の作家", "motif": "book", "intro": "昔話を語り直すだけでなく、新しい童話を作り、詩や小説、旅行記も書いたデンマークの作家です。", "gist": "舞台を夢見た少年から、童話や小説を書く作家へ。昔話の語り直しと自分で作った物語の両方を残し、旅も重ねました。", "people": [], "theme": "", "memory": "", "links": ["uglyduckling", "mermaid", "emperors-new-clothes", "little-match-girl", "snow-queen"], "sources": [{"title": "南デンマーク大学アンデルセン研究センター・短い伝記", "url": "https://andersen.sdu.dk/liv/biografi/index_e.html"}, {"title": "デンマーク王立図書館・アンデルセンの生涯", "url": "https://www.kb.dk/en/inspiration/hans-christian-andersens-manuscripts-and-letters/life-hans-christian-andersen"}, {"title": "南デンマーク大学アンデルセン研究センター・教育", "url": "https://andersen.sdu.dk/liv/biografi/skole_e.html"}, {"title": "南デンマーク大学アンデルセン研究センター・童話", "url": "https://andersen.sdu.dk/liv/biografi/eventyr_e.html"}, {"title": "南デンマーク大学アンデルセン研究センター・旅行記", "url": "https://andersen.sdu.dk/liv/biografi/rejseboeger_e.html"}, {"title": "Project Gutenberg Canada：M. R. James英訳全文・版情報", "url": "https://www.gutenbergca.gutenbergcanada.ca/ebooks/andersen-ugly/andersen-ugly-00-h.html"}, {"title": "Wikisource・Paull英訳「The Little Mermaid」全文", "url": "https://en.wikisource.org/wiki/Hans_Andersen's_Fairy_Tales/The_Little_Mermaid"}, {"title": "Wikisource・Paull英訳当該話全文", "url": "https://en.wikisource.org/wiki/Hans_Andersen's_Fairy_Tales/The_Emperor's_New_Clothes"}], "bodyReadings": {"童話": "どうわ", "戯曲": "ぎきょく", "即興詩人": "そっきょうしじん", "刊行": "かんこう", "昔話": "むかしばなし", "故郷": "こきょう", "洗濯": "せんたく", "俳優": "はいゆう", "踊り手": "おどりて", "資格": "しかく", "小冊子": "しょうさっし", "旅行記": "りょこうき", "観察": "かんさつ"}, "checkedDate": "2026年11月2日", "primaryCategory": "person", "genreLabel": "人物", "sourceNote": "1835年は童話小冊子の刊行を始めた年で、初めて文章や童話を書いた年ではありません。1828年の試験合格を大学卒業とは記していません。作品の比較は独自の読書案内で、作者が語った創作意図や、登場人物が作者そのものであるとの断定ではありません。", "authorTextOnly": true, "portraitNote": "この紹介には本人の肖像は掲載していません。"}, {"id":"anne-green-gables","name":"赤毛のアン","reading":"あかげのあん","intro":"男の子を迎えるはずだった農場に、十一歳の少女アンがやって来ます。豊かな想像力とおしゃべりで周囲を驚かせながら、家族や友達との関係を育てていく物語です。","gist":"居場所を求めて来た少女が、失敗や学びを重ね、家族と友達に支えられながら、自分の進む道を選ぶ。","bodyReadings":{"赤毛":"あかげ","兄妹":"きょうだい","農場":"のうじょう","農作業":"のうさぎょう","伝言":"でんごん","子守":"こもり","孤児院":"こじいん","来歴":"らいれき","衝突":"しょうとつ","石板":"せきばん","不公平":"ふこうへい","果実酒":"かじつしゅ","交際":"こうさい","看病":"かんびょう","誤解":"ごかい","仕立て":"したて","袖":"そで","朗読":"ろうどく","学院":"がくいん","教員資格":"きょういんしかく","奨学金":"しょうがくきん","帰省":"きせい","貯金":"ちょきん","破綻":"はたん","急死":"きゅうし","失明":"しつめい","進路":"しんろ","意地":"いじ"},"sources":[{"title":"Wikisource・英語原典全38章と版表示","url":"https://en.wikisource.org/wiki/Anne_of_Green_Gables_(1908)"},{"title":"L. M. Montgomery Institute・作者と1908年の刊行","url":"https://lmmontgomery.ca/about/l-m-montgomery/"}],"checkedDate":"2026年11月2日","sourceNote":"1908年刊の第一作を扱います。参照した英語本文は、Wikisourceに収録されたL・C・ペイジ社版の転記で、奥付には1909年第十一刷までの表示があります。現代の日本語訳や映像版、続編の出来事は用いていません。物語の説明と読み方は、この図鑑による独自の日本語解説です。","termNote":"グリーン・ゲイブルズは、アンを迎える兄妹が暮らす家と農場の名前です。石板は、紙の代わりに文字や計算を書いて使った学用品。クイーン学院は、この物語でアンたちが教員資格を取るために学ぶ学校で、その先に目指すレドモンド大学とは別です。奨学金は、進学や勉強の費用を支えるお金です。","cat":"literature","primaryCategory":"world-literature","genreLabel":"海外文学","genre":"world-classic","motif":"book","sub":"L・M・モンゴメリ｜1908年初刊行","people":[["アン・シャーリー","十一歳でグリーン・ゲイブルズへ来る少女。想像力が豊かで、よく話す。物語の中で十六歳頃まで成長する。"],["マシュウ・カスバート","マリラの兄。農場で働く、口数の少ない人。駅へアンを迎えに行き、温かく見守る。"],["マリラ・カスバート","マシュウの妹。兄と暮らし、アンを育てる。厳しく教えるが、自分の間違いも認める。"],["ダイアナ・バリー","アンの近所に住む同じ年頃の少女。アンと親友になる。"],["ギルバート・ブライス","アンより少し年上の同級生。初めはアンを怒らせるが、勉強で競い合う相手になる。"],["レイチェル・リンド夫人","カスバート兄妹の近所に住む女性。思ったことをはっきり言い、やがてアンを助ける。"],["ステイシー先生","学校に新しく来る女性の先生。アンの学ぶ力を伸ばし、進学を励ます。"]],"synopsisSummary":["カナダのプリンス・エドワード島。農場「グリーン・ゲイブルズ」で暮らすマシュウとマリラは、年を取った兄と妹です。二人は農作業を手伝う男の子を迎えるつもりでした。ところが、伝言が食い違い、駅で待っていたのは十一歳の少女アンです。迎えに来たマシュウは、よく話し、景色に心を躍らせるアンに親しみを感じ、家へ連れ帰ります。","男の子ではないから帰すと聞き、アンは泣きます。幼い時に両親を失い、よその家で子守をし、孤児院へ移ったアンは、自分の家を強く求めていました。マリラはその来歴を聞き、別の家でまた働かされそうな姿を見て、アンを育てると決めます。厳しいマリラと口数の少ないマシュウの家に、アンのおしゃべりや空想が広がります。近所のリンド夫人と衝突することもありますが、謝り合い、少しずつ周囲との関係を作っていきます。","アンは近所の少女ダイアナと親友になり、学校にも通い始めます。一方、同級生のギルバートに赤毛をからかわれ、怒って石板で彼をたたいてしまいます。ギルバートが謝っても、アンは許そうとしません。勉強ではギルバートに負けまいと努力し、二人は成績を競うようになります。","暮らしの中では失敗も起こります。アンは甘い飲み物と果実酒を取り違えてダイアナに出し、ダイアナの母に交際を禁じられます。しかし、ダイアナの幼い妹が病気になった夜、アンは子守の経験を生かして看病し、マシュウは医者を呼びに走ります。妹は助かり、母も誤解を認め、二人はまた遊べるようになります。時がたち、あるクリスマスには、マシュウがリンド夫人に仕立ててもらった、袖のふくらんだ茶色の服を贈ります。アンは、待ち望んだ服を受け取り、感激します。","新しいステイシー先生は、アンの作文や朗読の力を伸ばし、進学も後押しします。数年の勉強を経て、アンとギルバートは同点首位でクイーン学院の入試に合格。アンは家を離れ、教師になるための勉強をします。一年で教員資格を取り、さらに大学へ進むための奨学金も得ました。マシュウとマリラは成長したアンを誇りに思い、アンも新しい将来を楽しみにします。","ところが帰省後、もともと心臓の弱かったマシュウが、貯金を預けた銀行の破綻を知った朝に急死します。アンとマリラは、深い悲しみを分かち合います。マリラは目も悪くし、無理を続ければ失明すると告げられました。貯金も失い、一人では農場を続けられないと家を売ろうとします。そこでアンは大学進学を見送り、農場を貸し、教師として働きながらマリラと暮らす道を選びます。学ぶことまでやめるのではなく、自宅で勉強を続ける計画です。","アンが家の近くで働きたいと知ったギルバートは、自分が教える予定だったアヴォンリーの学校の仕事を譲り、別の村で教えることにします。夕暮れの道で会ったアンは、自分から手を差し出して感謝を伝えます。長く意地を張ってきた二人は、ようやく友人になりました。思い描いた通りの進路ではなくても、大切な家を守り、人に支えられ、自分も人を支えながら学んでいく。アンは、まだ見えないこれか
