結核のため31歳で亡くなります。残された作品は、作者の死後に評価が高まっていきました。", "sources": [{"title": "国立国会図書館「近代日本人の肖像」梶井基次郎", "url": "https://www.ndl.go.jp/portrait/datas/6239/index.html"}, {"title": "千代田区立図書館「梶井基次郎の手迹」展示解説・略年譜", "url": "https://www.library.chiyoda.tokyo.jp/information/20081120-10517/"}]}, {"title": "この図鑑の『檸檬』から読む", "text": "『檸檬』では、気持ちが沈んだ「私」が、果実の色や冷たさ、香りに心を動かされます。大事件よりも、物に触れたときの感覚や、想像によって気分が変わる過程が読みどころです。最後の爆発は想像で、実際に店を壊す話ではありません。主人公の病気や暮らしを、そのまま作者の生活の記録と決めつけず、一つの小説として読めます。", "sources": [{"title": "青空文庫・梶井基次郎「檸檬」原文", "url": "https://www.aozora.gr.jp/cards/000074/files/46349_23843.html"}]}], "nakajima-atsushi": [{"title": "漢学の家と、移り住んだ町", "text": "中島敦は1909年5月5日、東京の四谷に生まれました。父は漢文の教師で、祖父や伯父たちも漢学に深く関わる家でした。幼年期には父の実家がある埼玉の久喜で育ちます。その後、父の仕事に伴って奈良、浜松、当時日本の植民地支配下にあった朝鮮の京城へ移りました。一つの町だけで育ったのではなく、土地を移りながら学んだ人です。", "sources": [{"title": "新宿区立図書館「新宿区ゆかりの人物データベース・中島敦」", "url": "https://www.library.shinjuku.tokyo.jp/database/jinbutuyukari/050/post41.html"}, {"title": "久喜市「中島敦ゆかりの地」", "url": "https://www.city.kuki.lg.jp/miryoku/kanko_tokusan/1006001.html"}, {"title": "久喜市立図書館デジタルアーカイブ・村山𠮷廣「中島撫山小伝」作家中島敦の節", "url": "https://adeac.jp/kuki-lib/texthtml/d200020/mp220000-200020/ht000020"}]}, {"title": "学ぶことと、書くこと", "text": "京城の中学校から東京の第一高等学校へ進み、校友会の雑誌に小説を載せました。やがて東京帝国大学の国文学科で学びます。中国の古典だけでなく、西洋の文学にも関心を広げ、神奈川近代文学館にはカフカやハックスリーの翻訳草稿も残っています。後年の短い活躍の前に、長く読書と創作を重ねた時期がありました。", "sources": [{"title": "新宿区立図書館「新宿区ゆかりの人物データベース・中島敦」", "url": "https://www.library.shinjuku.tokyo.jp/database/jinbutuyukari/050/post41.html"}, {"title": "久喜市立図書館デジタルアーカイブ・村山𠮷廣「中島撫山小伝」作家中島敦の節", "url": "https://adeac.jp/kuki-lib/texthtml/d200020/mp220000-200020/ht000020"}, {"title": "神奈川近代文学館「中島敦直筆資料デジタルアーカイブ」資料一覧", "url": "https://www.kanabun.or.jp/nakajima/table.html"}]}, {"title": "横浜で教壇に立つ", "text": "1933年、横浜高等女学校の教師になりました。教える仕事と並行して小説を書き、『虎狩』『狼疾記』『かめれおん日記』などの創作に取り組みます。読書や旅行を楽しむ一方、持病の喘息に悩まされていました。作品に先生の生活が現れても、語り手をそのまま作者と同一視せず、小説として読むことも大切です。", "sources": [{"title": "久喜市「中島敦ゆかりの地」", "url": "https://www.city.kuki.lg.jp/miryoku/kanko_tokusan/1006001.html"}, {"title": "久喜市立図書館デジタルアーカイブ・村山𠮷廣「中島撫山小伝」作家中島敦の節", "url": "https://adeac.jp/kuki-lib/texthtml/d200020/mp220000-200020/ht000020"}]}, {"title": "南洋への赴任と帰国", "text": "1941年には女学校を離れ、南洋庁の国語編修書記としてパラオへ赴任しました。教科書に関わる仕事であり、体調の回復への期待もありました。しかし現地で健康は回復せず、翌1942年に帰国します。残された南洋の日記や、島々を舞台にした作品は、中国の古典を題材にする小説だけではない、創作の広がりを伝えています。", "sources": [{"title": "久喜市「中島敦ゆかりの地」", "url": "https://www.city.kuki.lg.jp/miryoku/kanko_tokusan/1006001.html"}, {"title": "久喜市立図書館デジタルアーカイブ・村山𠮷廣「中島撫山小伝」作家中島敦の節", "url": "https://adeac.jp/kuki-lib/texthtml/d200020/mp220000-200020/ht000020"}, {"title": "神奈川近代文学館「中島敦直筆資料デジタルアーカイブ」資料一覧", "url": "https://www.kanabun.or.jp/nakajima/table.html"}]}, {"title": "原稿が作品として届くまで", "text": "『山月記』は1942年2月の『文學界』に、『文字禍』と合わせて「古譚」という題で掲載されました。この発表年月は、書き始めた年月と同じではありません。同年、『光と風と夢』が芥川賞候補となりますが、敦は12月4日に33歳で亡くなります。『李陵』などは死後の発表です。短い生涯と、作品が読者へ届いた順番を分けて見てみましょう。", "sources": [{"title": "青空文庫「山月記」図書カード623・文學界底本の書誌", "url": "https://www.aozora.gr.jp/cards/000119/card623.html"}, {"title": "久喜市立図書館デジタルアーカイブ・村山𠮷廣「中島撫山小伝」作家中島敦の節", "url": "https://adeac.jp/kuki-lib/texthtml/d200020/mp220000-200020/ht000020"}, {"title": "新宿区立図書館「新宿区ゆかりの人物データベース・中島敦」", "url": "https://www.library.shinjuku.tokyo.jp/database/jinbutuyukari/050/post41.html"}]}, {"title": "『山月記』から読む", "text": "詩人になりたかった李徴は、虎の姿で旧友の袁傪に語ります。自分の才能を信じる気持ちと、実力を知られる怖さ。その振り返りは切実ですが、あくまで李徴自身による説明です。友人に詩を書き留めてもらい、家族の世話を頼む場面にも目を向けると、自尊心の教訓だけではない、人と人とのつながりが見えてきます。", "sources": [{"title": "青空文庫「山月記」本文（新潮文庫底本版）", "url": "https://www.aozora.gr.jp/cards/000119/files/624_14544.html"}]}], "sei-shonagon": [{"title": "名前と生涯には、分からないこともある", "text": "清少納言は、平安時代中期に『枕草子』を書いた人です。父は歌人の清原元輔でした。966年ごろに生まれたという推定がありますが、正確な生没年や本名は分かっていません。「清少納言」は宮仕えの場で使われた呼び名です。本名についての説も、確定した名前として扱うことはできません。", "sources": [{"title": "ジャパンサーチ「枕草子」", "url": "https://jpsearch.go.jp/gallery/ndl-plZ27mlWQ1P"}, {"title": "斎宮歴史博物館・斎宮千話一話 第61話", "url": "https://www.bunka.pref.mie.lg.jp/saiku/senwa/journal385.html"}, {"title": "徳島市立図書館・清少納言の没年月日調査（レファレンス協同データベース）", "url": "https://crd.ndl.go.jp/reference/entry/index.php?id=1000349343&page=ref_view"}]}, {"title": "定子のそばで働く女房", "text": "990年代の初めごろ、一条天皇の中宮定子に仕え始めたと考えられています。出仕年には992年、993年などの説があります。清少納言の役割は女房でした。ここでの女房は、宮廷や貴族の家で働く女性のことです。天皇の妻だった定子と、その定子に仕えた清少納言とは、立場が違います。", "sources": [{"title": "国文学研究資料館「枕草子」", "url": "https://www.nijl.ac.jp/etenji/bungakushi/contents/detail/detail02-02_008.html"}, {"title": "宮城県図書館・清少納言と紫式部の出仕時期調査", "url": "https://crd.ndl.go.jp/reference/entry/index.php?id=1000346756&page=ref_view"}, {"title": "大阪府立中央図書館・女房の仕事と宮仕えに関する調査", "url": "https://crd.ndl.go.jp/reference/entry/index.php?id=1000127497&page=ref_view"}]}, {"title": "宮廷の経験を文章にする", "text": "『枕草子』には、定子や周囲の人とのやり取りが数多く登場します。季節の風景や人のふるまいを見て感じたことも、文章の題材になりました。特別な行事だけでなく、日常の小さな出来事へ目を向けたところにも特徴があります。ただし、宮廷生活を描いているからといって、作者の一生を順番に記録した伝記というわけではありません。", "sources": [{"title": "国文学研究資料館「枕草子」", "url": "https://www.nijl.ac.jp/etenji/bungakushi/contents/detail/detail02-02_008.html"}, {"title": "ジャパンサーチ「枕草子」", "url": "https://jpsearch.go.jp/gallery/ndl-plZ27mlWQ1P"}]}, {"title": "一つの筋ではなく、短い文章の集まり", "text": "『枕草子』は、自然や暮らしについて思ったこと、ある題目に合うものを並べた文章、宮仕えの思い出などからできています。成立を1001年ごろとする見方がありますが、執筆や成立の過程には諸説があります。その年に一度に全部を書き上げた、と決めることはできません。伝わった本によって、文章の順序なども異なります。", "sources": [{"title": "国文学研究資料館「枕草子」", "url": "https://www.nijl.ac.jp/etenji/bungakushi/contents/detail/detail02-02_008.html"}, {"title": "ジャパンサーチ「枕草子」", "url": "https://jpsearch.go.jp/gallery/ndl-plZ27mlWQ1P"}]}, {"title": "定子の死と、見えにくい晩年", "text": "1000年に定子が亡くなった後の清少納言の生活には、はっきりしない点が残っています。没年を1025年ごろとする説などもありますが、正確な年月日は確認されていません。また、紫式部とは仕えた相手や時期が異なります。同じ職場でいつも顔を合わせ、言い争っていた二人のように思い描くのは慎重であるべきです。", "sources": [{"title": "徳島市立図書館・清少納言の没年月日調査（レファレンス協同データベース）", "url": "https://crd.ndl.go.jp/reference/entry/index.php?id=1000349343&page=ref_view"}, {"title": "宮城県図書館・清少納言と紫式部の出仕時期調査", "url": "https://crd.ndl.go.jp/reference/entry/index.php?id=1000346756&page=ref_view"}]}, {"title": "この図鑑の『枕草子』から読む", "text": "この図鑑では、四季の風景、小さな子のしぐさ、定子との思い出などを入口にしています。同じ景色のどこへ目を向けるか、何を好ましいと感じるかを追うと、書き手の個性が見えてきます。一方で、その判断を現代の誰にでも当てはまる正解にする必要はありません。宮廷に生きた一人の見方として、自分との違いも含めて読むことができます。", "sources": [{"title": "『枕草紙』原文（1903年『國文大觀』版翻刻・既存作品記事の参照原典）", "url": "https://ja.wikisource.org/wiki/枕草紙_(國文大觀)"}]}], "murasaki-shikibu": [{"title": "名前にも、生涯にも謎がある", "text": "紫式部は、平安時代中期に『源氏物語』を書いた女性です。本名と正確な生没年は分かっていません。「紫式部」は現在私たちが知る呼び名で、現代の作家の本名とは事情が違います。本名を「香子」とする説もありますが、確定はしていません。ドラマなどで付けられた名前や、後世に描かれた姿を、そのまま史実としないことが大切です。", "sources": [{"title": "堺市立中央図書館回答・NDLレファレンス協同データベース「紫式部の本名を知りたい」", "url": "https://crd.ndl.go.jp/reference/entry/index.php?id=1000378169&page=ref_view"}, {"title": "五島美術館「国宝 紫式部日記絵巻」", "url": "https://www.gotoh-museum.or.jp/collection/shikibu/"}]}, {"title": "学問の家から、越前へ", "text": "父は藤原為時で、親族にも学者や歌人がいました。紫式部は和歌だけでなく、中国の書物にも深い教養を持っていました。父の任地である越前に同行して暮らした経験もあります。その後、藤原宣孝と結婚しましたが、夫を亡くします。家で育んだ学問や人生の経験は、物語の背景を考える手がかりになります。ただし、小説をそのまま自伝と見ることはできません。", "sources": [{"title": "京都大学貴重資料デジタルアーカイブ「文学史年表・源氏物語」", "url": "https://rmda.kulib.kyoto-u.ac.jp/item/rb00007030/explanation/genji"}, {"title": "越前市「越前市の歴史」平安時代の節", "url": "https://www.city.echizen.lg.jp/office/090/030/echizennsinobunnkazai/rekisi.html"}]}, {"title": "彰子に仕え、宮廷を記す", "text": "紫式部は、一条天皇の妻である中宮で、藤原道長の娘でもある彰子に仕えました。出仕の正確な年には諸説があり、ここでは一つに決めません。『紫式部日記』には、1008年から1010年にかけての宮廷の出来事が記されています。皇子の誕生を祝う儀式や人々の振る舞いを細やかに観察し、華やかな場の内側にいる人の目で書き留めました。", "sources": [{"title": "五島美術館「国宝 紫式部日記絵巻」", "url": "https://www.gotoh-museum.or.jp/collection/shikibu/"}, {"title": "宮内庁書陵部ギャラリー「紫日記」「源氏物語」", "url": "https://shoryobu.kunaicho.go.jp/Gallery/59634e730b6146df9adfccfd696e0559"}, {"title": "宇治市・越前市・大津市観光ポータル「紫式部と平安時代」年表", "url": "https://murasakishikibu-kanko.jp/murasakishikibu/"}]}, {"title": "1008年は「完成年」なのか", "text": "『紫式部日記』の1008年の記事には、藤原公任が物語の若紫にちなんで紫式部へ声をかける場面があります。『源氏物語』がそのころ知られていたことを示す手がかりです。しかし、それだけで全五十四帖がその年に完成したとは言えません。書き始めた時期や、各巻ができた順序は別の問題です。現代の本の発売日のように、一つの年で表せない成立の歴史があります。", "sources": [{"title": "宮内庁書陵部ギャラリー「紫日記」「源氏物語」", "url": "https://shoryobu.kunaicho.go.jp/Gallery/59634e730b6146df9adfccfd696e0559"}, {"title": "国文学研究資料館「源氏物語～千年のかがやき～」展示趣旨", "url": "https://www.nijl.ac.jp/event/exhibition/2008/10/tenji08-2.html"}]}, {"title": "写され、描かれ、読み継がれる", "text": "『源氏物語』は、人の手で書き写され、注釈や絵巻、翻訳などを通じて伝えられました。現在紹介される古い本も、作者が書いた時代のものとは限りません。たとえば京都大学の中院文庫本は室町時代末期の写本です。『紫式部日記絵巻』も、日記の時代から約二百五十年後の制作です。作品の成立と、目の前の資料が作られた時を区別して見ましょう。", "sources": [{"title": "京都大学貴重資料デジタルアーカイブ「文学史年表・源氏物語」", "url": "https://rmda.kulib.kyoto-u.ac.jp/item/rb00007030/explanation/genji"}, {"title": "五島美術館「国宝 紫式部日記絵巻」", "url": "https://www.gotoh-museum.or.jp/collection/shikibu/"}, {"title": "国文学研究資料館「源氏物語～千年のかがやき～」展示趣旨", "url": "https://www.nijl.ac.jp/event/exhibition/2008/10/tenji08-2.html"}]}, {"title": "作者と登場人物を分けて読む", "text": "紫式部は物語を書いた人で、「紫の上」は物語に登場する人物です。光源氏を中心に読むだけでなく、周りの女性たちが何を望み、何を選べなかったのかにも目を向けてみましょう。後半には薫や匂宮、浮舟たちの世代へ物語が移ります。華やかな恋の話だけではなく、身分や家族、相手を理解しきれない苦しさを描く長い物語として読む入口になります。", "sources": [{"title": "青空文庫・紫式部作品一覧（既存記事の参照版・与謝野晶子訳）", "url": "https://www.aozora.gr.jp/index_pages/person52.html"}]}], "brothers-grimm": [{"title": "一人の作家ではなく、二人の兄弟", "text": "グリム兄弟とは、兄のヤーコプと弟のヴィルヘルムです。ヤーコプは1785年、ヴィルヘルムは1786年に、現在のドイツにあるハーナウで生まれました。幼い頃をシュタイナウで過ごし、父を亡くした後はカッセルで学びます。「グリム」という一人の作者がいたのではなく、二人が協力して研究や出版を進めました。", "sources": [{"title": "GRIMMWELT Kassel「The Brothers Grimm」", "url": "https://www.grimmwelt.de/en/journal/the-brothers-grimm"}, {"title": "ヘッセン州文化ポータル「Jacob und Wilhelm Grimm」", "url": "https://kulturportal.hessen.de/wissen/beruehmte-hessen/literatur/jacob-und-wilhelm-grimm"}]}, {"title": "法律を学ぶところから、言葉の研究へ", "text": "兄は1802年、弟は翌年にマールブルク大学へ進み、法律を学びました。教師サヴィニーとの出会いを通じ、古い資料や文学へ関心を深めます。後に図書館員や大学の教師としても働きました。童話だけを書いた人ではなく、言葉が昔からどのように使われてきたかを調べる研究者でもあったのです。", "sources": [{"title": "GRIMMWELT Kassel「The Brothers Grimm」", "url": "https://www.grimmwelt.de/en/journal/the-brothers-grimm"}, {"title": "ベルリン州立図書館「Aus den Biographien der Brüder Grimm」", "url": "https://staatsbibliothek-berlin.de/die-staatsbibliothek/abteilungen/kinder-und-jugendbuecher/aktuelles/ausstellung/aus-den-biographien"}]}, {"title": "語ってくれた人たちと、編集の仕事", "text": "兄弟は身近な人々から昔話を集めました。ドロテーア・フィーマンやハッセンプフルク家など、多くの語り手や協力者がいました。ただし、聞いた言葉を一字一句そのまま記録しただけではありません。文章を整え、表現を加える仕事も行い、とくにヴィルヘルムが語り方を磨きました。すべての筋を二人が最初から創作した、という意味の作者ではありません。", "sources": [{"title": "ベルリン州立図書館「Aus den Biographien der Brüder Grimm」", "url": "https://staatsbibliothek-berlin.de/die-staatsbibliothek/abteilungen/kinder-und-jugendbuecher/aktuelles/ausstellung/aus-den-biographien"}, {"title": "ヘッセン州文化ポータル「Jacob und Wilhelm Grimm」", "url": "https://kulturportal.hessen.de/wissen/beruehmte-hessen/literatur/jacob-und-wilhelm-grimm"}]}, {"title": "『子どもと家庭の童話』を改め続ける", "text": "童話集の第1巻は1812年、第2巻は1815年の刊記で出版されました。その後も話の入れ替えや書き直しが重ねられ、兄弟が関わった最後の大きな版は1857年です。同じ題名でも、初版と後の版では内容が違うことがあります。昔から動かない一つの文章が伝わったのではなく、集め、選び、改める作業を経て本になったのです。", "sources": [{"title": "ベルリン州立図書館「Aus den Biographien der Brüder Grimm」", "url": "https://staatsbibliothek-berlin.de/die-staatsbibliothek/abteilungen/kinder-und-jugendbuecher/aktuelles/ausstellung/aus-den-biographien"}, {"title": "ベルリン州立図書館「初版から1857年までの童話集」", "url": "https://staatsbibliothek-berlin.de/die-staatsbibliothek/abteilungen/kinder-und-jugendbuecher/aktuelles/ausstellung/erstausgabe"}]}, {"title": "童話のほかに、辞書も残す", "text": "1837年、兄弟は他の教授たちとともに、国王による憲法の廃止に抗議して大学を追われました。その後、ベルリンで研究を続け、ドイツ語辞典の編纂にも取り組みます。ヴィルヘルムは1859年、ヤーコプは1863年に亡くなりました。二人の生前に辞典全体は完成せず、後の人々へ仕事が引き継がれました。", "sources": [{"title": "ベルリン州立図書館「Aus den Biographien der Brüder Grimm」", "url": "https://staatsbibliothek-berlin.de/die-staatsbibliothek/abteilungen/kinder-und-jugendbuecher/aktuelles/ausstellung/aus-den-biographien"}, {"title": "ヘッセン州文化ポータル「Jacob und Wilhelm Grimm」", "url": "https://kulturportal.hessen.de/wissen/beruehmte-hessen/literatur/jacob-und-wilhelm-grimm"}]}, {"title": "この図鑑の三つの童話から読む", "text": "『赤ずきん』では狼の言葉、『ヘンゼルとグレーテル』では兄妹の工夫、『白雪姫』では姿を変えて近づく王妃の企みが、物語を動かします。誰が危険に気づき、誰の助けで先へ進むかを追うと、それぞれの違いが見えてきます。この図鑑は採用したグリム版に沿っています。同じ題名の別の再話や、後の映画の設定を混ぜずに読む案内です。", "sources": [{"title": "既存作品の参照原典：Margaret Hunt英訳グリム童話集", "url": "https://www.gutenberg.org/files/5314/5314-h/5314-h.htm"}]}], "charles-perrault": [{"title": "パリに生まれ、法律を学ぶ", "text": "シャルル・ペローは1628年1月12日、フランスのパリに生まれました。1651年に弁護士の資格を得た後、財政の仕事をしていた兄のもとで働きます。童話作家として知られていますが、初めから物語だけを書く生活をしていたわけではありません。法律や役所の仕事にも関わりながら、文学の活動へ進んだ人です。", "sources": [{"title": "アカデミー・フランセーズ：Charles Perrault", "url": "https://www.academie-francaise.fr/les-immortels/charles-perrault"}, {"title": "ヴェルサイユ宮殿公式：Charles Perrault", "url": "https://www.chateauversailles.fr/decouvrir/histoire/grands-personnages/charles-perrault"}]}, {"title": "王の文化事業に関わる", "text": "1663年、ルイ14世に仕えた政治家コルベールのもとで、芸術や文学に関わる仕事を始めました。王の建築事業にも携わり、ルーヴルやヴェルサイユの工事に関係します。1671年にはアカデミー・フランセーズの会員に選ばれました。物語を書く以外にも、国の文化を支える組織で活動していたのです。", "sources": [{"title": "アカデミー・フランセーズ：Charles Perrault", "url": "https://www.academie-francaise.fr/les-immortels/charles-perrault"}, {"title": "ヴェルサイユ宮殿公式：Charles Perrault", "url": "https://www.chateauversailles.fr/decouvrir/histoire/grands-personnages/charles-perrault"}]}, {"title": "古い作品と新しい作品をめぐる論争", "text": "当時、古代の作品を手本とする立場と、新しい時代の作品を高く評価する立場との間に論争がありました。ペローは後者の代表的な一人です。詩や評論を書き、自分の時代の文学や芸術にも価値があると主張しました。童話だけを残した作家ではなく、何を優れた作品と考えるかを議論した文学者でもありました。", "sources": [{"title": "アカデミー・フランセーズ：Charles Perrault", "url": "https://www.academie-francaise.fr/les-immortels/charles-perrault"}, {"title": "ヴェルサイユ宮殿公式：Charles Perrault", "url": "https://www.chateauversailles.fr/decouvrir/histoire/grands-personnages/charles-perrault"}]}, {"title": "1697年の童話集", "text": "1697年、パリで『過ぎし昔の物語ならびに教訓』が刊行されました。『シンデレラ』『長靴をはいた猫』『赤ずきん』など八つの物語を収めています。この年は、ペロー系統の物語が一冊にまとまった刊行年です。同じ題材の昔話がすべてこの年に初めて生まれた、という意味ではありません。また、後世のグリム版や映画版とは区別して読む必要があります。", "sources": [{"title": "フランス国立図書館：1697年刊 Histoires, ou Contes du temps passé の書誌", "url": "https://catalogue.bnf.fr/ark:/12148/cb31084290g"}]}, {"title": "息子の名前も記された本", "text": "この童話集はペローの作品として伝わっていますが、刊行時の名義には注意が必要です。1697年版の献辞には息子ピエールの名に当たる署名があり、出版を認める特許も同じ名で与えられています。父子それぞれの関与を一言で決めつけず、そうした事情もある本として扱います。ペローは1703年5月16日に亡くなりましたが、童話はその後も読まれ続けました。", "sources": [{"title": "アカデミー・フランセーズ：Charles Perrault", "url": "https://www.academie-francaise.fr/les-immortels/charles-perrault"}, {"title": "ヴェルサイユ宮殿公式：Charles Perrault", "url": "https://www.chateauversailles.fr/decouvrir/histoire/grands-personnages/charles-perrault"}, {"title": "フランス国立図書館：1697年刊 Histoires, ou Contes du temps passé の書誌", "url": "https://catalogue.bnf.fr/ark:/12148/cb31084290g"}]}, {"title": "この図鑑の二作品から読む", "text": "『シンデレラ』では、妖精の助けや舞踏会だけでなく、最後に姉たちを許す対応にも目を向けられます。『長靴をはいた猫』では、猫の知恵が主人の立場を変えますが、その方法にはうそや脅しも含まれます。どちらも単純な「よい子へのごほうび」とは言い切れません。結末まで行動をたどると、成功の裏にある助力や身分、見かけの働きが見えてきます。", "sources": [{"title": "Project Gutenberg：ペロー童話集1922年版旧英訳（既存2記事の参照原典）", "url": "https://www.gutenberg.org/files/29021/29021-h/29021-h.htm"}]}], "miguel-de-cervantes": [{"title": "誕生日と洗礼日を分ける", "text": "ミゲル・デ・セルバンテスは1547年、スペインのアルカラ・デ・エナーレスに生まれました。9月29日生まれという説はありますが、正確な誕生日は未確定です。記録で確認されるのは10月9日の洗礼です。父は外科の治療を仕事にしていました。少年時代の教育には不明な点もあり、作品の登場人物の経験だけから、通った学校を決めることはできません。", "sources": [{"title": "Biblioteca Virtual Miguel de Cervantes・Jean Canavaggioによる伝記 第1頁", "url": "https://www.cervantesvirtual.com/portales/miguel_de_cervantes/autor_biografia/"}]}, {"title": "兵士として、捕虜として", "text": "若いころイタリアへ渡り、兵士になりました。1571年のレパントの海戦で負傷し、左手の自由を失います。1575年、スペインへ帰る途中の船が襲われ、北アフリカのアルジェで捕らわれの身になりました。何度か脱出を試みた末、1580年に身代金で解放されます。自由を奪われた経験は、後の戯曲や小説を考える重要な背景です。", "sources": [{"title": "Biblioteca Virtual Miguel de Cervantes・Jean Canavaggioによる伝記 第1頁", "url": "https://www.cervantesvirtual.com/portales/miguel_de_cervantes/autor_biografia/"}, {"title": "スペイン国立統計局（INE）「Tras los pasos de Cervantes」", "url": "https://www.ine.es/explica/cervantes/"}]}, {"title": "暮らしの仕事と創作", "text": "帰国後は小説や戯曲に取り組み、1585年に『ラ・ガラテア』を刊行しました。しかし作家の仕事だけで暮らしたわけではありません。艦隊の食料調達や税金を集める仕事でアンダルシアを旅し、会計をめぐる問題で投獄もされました。『ドン・キホーテ』の着想と牢獄を結ぶ説明はありますが、全篇を獄中で書いたと断定することはできません。", "sources": [{"title": "Biblioteca Virtual Miguel de Cervantes・Jean Canavaggioによる伝記 第1頁", "url": "https://www.cervantesvirtual.com/portales/miguel_de_cervantes/autor_biografia/"}, {"title": "Biblioteca Virtual Miguel de Cervantes・Jean Canavaggioによる伝記 第2頁", "url": "https://www.cervantesvirtual.com/portales/miguel_de_cervantes/autor_biografia_2/"}]}, {"title": "十年を隔てた二つの本", "text": "『ドン・キホーテ』前編の初版は1605年、後編は1615年です。これは刊行の年であり、両編を書き始めた年を示すものではありません。その間の1614年には、アベジャネーダという名で別人の続編が出ました。セルバンテス自身の後編は、その本の存在も物語へ取り込みます。本を書く人と読む人の関係まで、小説の仕掛けにしたのです。", "sources": [{"title": "スペイン国立統計局（INE）「Tras los pasos de Cervantes」", "url": "https://www.ine.es/explica/cervantes/"}, {"title": "Biblioteca Virtual Miguel de Cervantes・Jean Canavaggioによる伝記 第2頁", "url": "https://www.cervantesvirtual.com/portales/miguel_de_cervantes/autor_biografia_2/"}, {"title": "Biblioteca Virtual Miguel de Cervantes・Jean Canavaggioによる伝記 第3頁", "url": "https://www.cervantesvirtual.com/portales/miguel_de_cervantes/autor_biografia_3/"}]}, {"title": "最後まで書き続ける", "text": "晩年にも短編小説や戯曲を発表し、最後の長編『ペルシーレスとシヒスムンダの苦難』は死後の1617年に刊行されました。セルバンテスがマドリードで亡くなったのは1616年4月22日です。翌23日は埋葬の日で、記録の日付を死亡日と取り違えない注意が必要です。作品が完成した時、本になった時、作者が生きた時を分けてたどりましょう。", "sources": [{"title": "Biblioteca Virtual Miguel de Cervantes・Jean Canavaggioによる伝記 第3頁", "url": "https://www.cervantesvirtual.com/portales/miguel_de_cervantes/autor_biografia_3/"}, {"title": "スペイン国立統計局（INE）「Tras los pasos de Cervantes」", "url": "https://www.ine.es/explica/cervantes/"}, {"title": "スペイン語アカデミー協会（ASALE）「Miguel de Cervantes」", "url": "https://www.asale.org/la-asociacion/conmemoraciones/miguel-de-cervantes"}]}, {"title": "二人の旅から読む", "text": "ドン・キホーテは作者の別名ではなく、セルバンテスが作った人物です。風車を巨人だと思う主人と、現実的な忠告をするサンチョ。同じものをどう違って見るかに注目してみましょう。後編では、冒険を記した本を読んだ人々が二人を迎えます。主人公の思い込みを笑うだけでなく、彼らをからかう周囲の行動も考えると、旅の見え方が変わってきます。", "sources": [{"title": "ドン・キホーテ Ormsby英訳（既存作品記事の主要場面・終章照合出典）", "url": "https://www.gutenberg.org/cache/epub/996/pg996-images.html", "verification": "既存donquixote記事の原典確認を継承。今回新規アクセス・全文再読なし。"}]}], "kusuyama-masao": [{"title": "東京に生まれ、文学を学ぶ", "text": "楠山正雄は1884年11月4日、東京の銀座に生まれました。幼いころに父を亡くし、親戚の家で暮らした時期もあります。早稲田大学では英文学を学び、坪内逍遙や島村抱月に教わりました。物語を書くことだけでなく、外国の文学や演劇にも関心を広げていきます。", "sources": [{"title": "新宿区立図書館：楠山正雄", "url": "https://www.library.shinjuku.tokyo.jp/database/jinbutuyukari/020/post69.html"}, {"title": "青空文庫：楠山正雄の作家情報", "url": "https://www.aozora.gr.jp/index_pages/person329.html"}]}, {"title": "舞台と本の両方で働く", "text": "大学を出た後は、早稲田文学社や読売新聞で働き、出版社の冨山房へ移りました。また、文芸協会や芸術座の活動にも参加します。外国の劇を日本語にしたり、舞台について評論を書いたりした人で、童話だけを専門にしていたわけではありません。", "sources": [{"title": "新宿区立図書館：楠山正雄", "url": "https://www.library.shinjuku.tokyo.jp/database/jinbutuyukari/020/post69.html"}, {"title": "出版社提供・楠山正雄の略歴（版元ドットコム）", "url": "https://www.hanmoto.com/bd/isbn/9784866001135"}]}, {"title": "編集者として物語を届ける", "text": "編集とは、文章や絵を集め、読みやすい一冊の本にまとめていく仕事です。楠山は雑誌や辞典、子供のための本を数多く手がけました。画家の岡本帰一とも協力しています。『世界童話宝玉集』は1919年、『日本童話宝玉集』は1921年に刊行されました。", "sources": [{"title": "青空文庫：楠山正雄の作家情報", "url": "https://www.aozora.gr.jp/index_pages/person329.html"}, {"title": "出版社提供・楠山正雄の略歴（版元ドットコム）", "url": "https://www.hanmoto.com/bd/isbn/9784866001135"}]}, {"title": "昔話を語り直すという仕事", "text": "『桃太郎』や『浦島太郎』は、楠山が一から考え出した物語ではありません。昔から伝わる話を、読者が読める文章に語り直しています。この図鑑では、その楠山版を紹介しています。同じ題名でも、別の人がまとめた本とは、出来事や言葉が違う場合があります。再話した人を知ることは、どの版を読んでいるかを確かめる手がかりになります。", "sources": [{"title": "出版社提供・楠山正雄の略歴（版元ドットコム）", "url": "https://www.hanmoto.com/bd/isbn/9784866001135"}, {"title": "青空文庫：桃太郎の書誌", "url": "https://www.aozora.gr.jp/cards/000329/card18376.html"}, {"title": "青空文庫：浦島太郎の書誌", "url": "https://www.aozora.gr.jp/cards/000329/card3390.html"}]}, {"title": "外国の童話を日本語へ", "text": "楠山はアンデルセンなどの童話も翻訳しました。この図鑑の『雪の女王』では、アンデルセンが原作者、楠山が採用した日本語版の翻訳者です。1950年11月26日に亡くなりましたが、訳した文章はその後も出版されています。楠山訳の『雪の女王』には、没後の1955年に出た本もあります。これはアンデルセンの原作が初めて刊行された年とは別です。", "sources": [{"title": "新宿区立図書館：楠山正雄", "url": "https://www.library.shinjuku.tokyo.jp/database/jinbutuyukari/020/post69.html"}, {"title": "青空文庫：雪の女王の著者・翻訳者・底本", "url": "https://www.aozora.gr.jp/cards/000019/card42387.html"}]}, {"title": "この図鑑から読むなら", "text": "『桃太郎』では仲間が加わる順序と帰り道、『浦島太郎』では海の御殿と帰った浜辺の違いをたどってみてください。『雪の女王』では、ゲルダを助ける人や動物が順に変わります。これは作品を読むための案内です。昔話の再話と外国作品の翻訳を分けて見ると、物語を読者に届ける楠山の仕事が見えてきます。", "sources": [{"title": "青空文庫：桃太郎の書誌", "url": "https://www.aozora.gr.jp/cards/000329/card18376.html"}, {"title": "青空文庫：浦島太郎の書誌", "url": "https://www.aozora.gr.jp/cards/000329/card3390.html"}, {"title": "青空文庫：雪の女王の著者・翻訳者・底本", "url": "https://www.aozora.gr.jp/cards/000019/card42387.html"}]}], "oscar-wilde": [{"title": "ダブリンの家庭で育つ", "text": "オスカー・ワイルドは1854年10月16日、アイルランドのダブリンに生まれました。父ウィリアムは医師で、歴史や考古学にも関心を持つ人でした。母ジェーンは詩を書き、外国語の作品を翻訳しました。家庭には芸術や学問に携わる人々が集まっており、ワイルドは文学だけでなく、さまざまな知的活動が身近にある環境で育ちました。", "sources": [{"title": "トリニティ・カレッジ・ダブリン：Oscar Wilde Centre・本人と家族の紹介", "url": "https://www.tcd.ie/owc/history/oscar-wilde/"}, {"title": "ウェストミンスター寺院公式：Oscar Wilde・生没年月日", "url": "https://www.westminster-abbey.org/abbey-commemorations/commemorations/oscar-wilde"}]}, {"title": "二つの大学で古典を学ぶ", "text": "1871年にダブリンのトリニティ・カレッジへ進み、古代ギリシャやローマの文学を中心とする古典を学びました。1874年にはオックスフォード大学のモードリン・カレッジに移ります。1878年には詩で賞を受け、学位を取得しました。人を楽しませる会話の巧みさだけでなく、学生時代から言葉や古い文学に向き合っていた人です。", "sources": [{"title": "トリニティ・カレッジ・ダブリン：Oscar Wilde Centre・本人と家族の紹介", "url": "https://www.tcd.ie/owc/history/oscar-wilde/"}, {"title": "ユニバーシティ・カレッジ・コーク：Oscar Wilde年譜", "url": "https://www.ucc.ie/en/research-sites/celt/resources/writers/wilde/"}]}, {"title": "童話も小説も芝居も書く", "text": "卒業後はロンドンを拠点にし、詩集の出版や北米での講演、雑誌の編集などに取り組みました。1888年には『幸福な王子 その他の物語』を刊行します。小説『ドリアン・グレイの肖像』や、舞台で演じるための喜劇でも知られています。童話だけの作家ではなく、文章の形や読者を変えながら、美しさや人間社会について表現した作家でした。", "sources": [{"title": "トリニティ・カレッジ・ダブリン：Oscar Wilde Centre・本人と家族の紹介", "url": "https://www.tcd.ie/owc/history/oscar-wilde/"}, {"title": "ユニバーシティ・カレッジ・コーク：Oscar Wilde年譜", "url": "https://www.ucc.ie/en/research-sites/celt/resources/writers/wilde/"}]}, {"title": "成功の中で起きた投獄", "text": "1895年、二つの芝居が好評を得た一方、男性との関係をめぐる裁判で、二年間の重労働を伴う刑を受けました。当時のイギリスでは、男性どうしの性的な関係が法律で処罰されていました。家財が競売にかけられ、妻と子供たちの暮らしにも大きな影響が及びました。", "sources": [{"title": "ユニバーシティ・カレッジ・オックスフォード図書館資料紹介：Oscar Wilde’s 1895", "url": "https://www.univ.ox.ac.uk/news/oscar-wildes-1895/"}]}, {"title": "出獄後にも残した言葉", "text": "1897年に刑務所を出た後、ワイルドはフランスなどで暮らしました。1898年には『レディング牢獄の歌』を発表しています。華やかな舞台作品だけでなく、収監の経験に関わる文章や詩も残しました。1900年11月30日、46歳で亡くなりました。生涯を投獄という一つの出来事だけで説明せず、多様な創作活動とともに捉えることが大切です。", "sources": [{"title": "ユニバーシティ・カレッジ・コーク：Oscar Wilde年譜", "url": "https://www.ucc.ie/en/research-sites/celt/resources/writers/wilde/"}, {"title": "ウェストミンスター寺院公式：Oscar Wilde・生没年月日", "url": "https://www.westminster-abbey.org/abbey-commemorations/commemorations/oscar-wilde"}, {"title": "ユニバーシティ・カレッジ・オックスフォード図書館資料紹介：Oscar Wilde’s 1895", "url": "https://www.univ.ox.ac.uk/news/oscar-wildes-1895/"}]}, {"title": "『幸福な王子』から読む", "text": "この図鑑の『幸福な王子』では、像の外見が貧しくなるほど、困っている人々に助けが届きます。一方、市長たちは見栄えを失った像を不要だと考えます。王子とツバメの思いやりだけでなく、誰の苦しみが見落とされ、何が立派とされるかにも注目できます。自己犠牲を無条件に勧める教訓にせず、見た目と行いの価値の違いをたどる読み方です。", "sources": [{"title": "Project Gutenberg：The Happy Prince and Other Tales 英語原著（既存記事の参照原典）", "url": "https://www.gutenberg.org/files/902/902-h/902-h.htm"}]}], "lewis-carroll": [{"title": "本名と筆名を持つ作家", "text": "ルイス・キャロルは、1832年1月27日にイギリスのデアズベリで生まれました。本名はチャールズ・ラトウィッジ・ドジソンです。数学の著作では本名を使い、物語ではキャロルという筆名で知られるようになりました。二人の別人ではなく、一人の人が異なる名前で活動していたのです。作中のアリスも、作者本人ではありません。", "sources": [{"title": "オックスフォード大学 Christ Church：The Lewis Carroll Collections", "url": "https://www.chch.ox.ac.uk/college/library-archives/lewis-carroll-collection"}, {"title": "セント・アンドルーズ大学 MacTutor：Charles Lutwidge Dodgson", "url": "https://mathshistory.st-andrews.ac.uk/Biographies/Dodgson/"}]}, {"title": "オックスフォードで数学を教える", "text": "1851年からオックスフォード大学のクライスト・チャーチで学び、数学で優れた成績を収めました。1856年には数学の講師に任命され、その職を約25年間務めます。幾何学や論理学に関心を持ち、数学の本も書きました。写真や手紙なども多く残されており、童話作家という呼び名だけでは収まらない活動をしていました。", "sources": [{"title": "オックスフォード大学 Christ Church：The Lewis Carroll Collections", "url": "https://www.chch.ox.ac.uk/college/library-archives/lewis-carroll-collection"}, {"title": "セント・アンドルーズ大学 MacTutor：Charles Lutwidge Dodgson", "url": "https://mathshistory.st-andrews.ac.uk/Biographies/Dodgson/"}]}, {"title": "舟遊びから手書きの本へ", "text": "1862年7月4日、リデル家のアリスと姉妹たちが参加した舟遊びで、後の物語につながる話を語りました。アリスに書き留めてほしいと頼まれ、1864年には自分で挿絵も描いた『地下の国のアリス』の手稿を贈ります。舟で語った日、手書きの本を渡した時、公に出版された時は、それぞれ別です。実在の少女と物語の主人公も同一ではありません。", "sources": [{"title": "ヴィクトリア＆アルバート博物館：The real Alice in Wonderland", "url": "https://www.vam.ac.uk/articles/the-real-alice-in-wonderland"}, {"title": "Lewis Carroll Society：Publishing of Alice", "url": "https://lewiscarrollsociety.org.uk/publishing-of-alice/"}]}, {"title": "1865年の出版と刷り直し", "text": "話を広げた『不思議の国のアリス』は、ジョン・テニエルの挿絵とともに1865年に出版されました。ただし、最初の印刷は絵の仕上がりに問題があり回収されます。同じ年に出た刷り直しには、翌1866年の年記が入りました。資料に二つの年が現れるのはこのためです。手稿の挿絵はキャロル、公刊本の挿絵はテニエルと区別します。", "sources": [{"title": "ヴィクトリア州立図書館：Lewis Carroll and his Alice books", "url": "https://guides.slv.vic.gov.au/alice/getstarted"}, {"title": "Lewis Carroll Society：Publishing of Alice", "url": "https://lewiscarrollsociety.org.uk/publishing-of-alice/"}]}, {"title": "もう一つのアリスの物語", "text": "続編『鏡の国のアリス』は1871年末に刊行され、本には1872年と記されました。『不思議の国』とつながる別の作品で、二冊の出来事を一つに混ぜないことが大切です。キャロルは1898年1月14日に亡くなりました。残された物語だけでなく、手紙や数学の著作、出版に関わる資料からも、その仕事をたどることができます。", "sources": [{"title": "オックスフォード大学 Christ Church：The Lewis Carroll Collections", "url": "https://www.chch.ox.ac.uk/college/library-archives/lewis-carroll-collection"}, {"title": "セント・アンドルーズ大学 MacTutor：Charles Lutwidge Dodgson", "url": "https://mathshistory.st-andrews.ac.uk/Biographies/Dodgson/"}, {"title": "Lewis Carroll Society：Publishing of Alice", "url": "https://lewiscarrollsociety.org.uk/publishing-of-alice/"}]}, {"title": "言葉と規則に注目して読む", "text": "この図鑑の『不思議の国のアリス』では、体の大きさが変わる驚きに加え、会話がかみ合わない理由にも注目してみましょう。お茶会や裁判では、言葉や規則が思いがけない使われ方をします。アリスが最後に理不尽な判断へ反論するまでを追うと、不思議な出来事をただ受け入れるだけではない、考え続ける主人公の姿が見えてきます。", "sources": [{"title": "Project Gutenberg：Alice’s Adventures in Wonderland（既存作品記事の参照英語本文）", "url": "https://www.gutenberg.org/files/11/11-h/11-h.htm"}]}], "l-frank-baum": [{"title": "物語を書くまでのさまざまな仕事", "text": "L・フランク・ボームは1856年5月15日、アメリカのニューヨーク州チッテナンゴに生まれました。名前のLはライマンの頭文字です。舞台の仕事や店の経営、新聞の編集などを経験しました。最初から『オズ』だけを書いて暮らしていたのではなく、人に楽しんでもらう仕事や、文章を届ける仕事に広く関わった人です。", "sources": [{"title": "南フロリダ大学 Lit2Go：L. Frank Baum", "url": "https://etc.usf.edu/lit2go/authors/29/l-frank-baum/"}, {"title": "Simon & Schuster公式：L. Frank Baum", "url": "https://www.simonandschuster.net/authors/L-Frank-Baum/1569463"}]}, {"title": "西部での暮らしとシカゴへの移動", "text": "1888年、家族とともに、現在のサウスダコタ州にあるアバディーンへ移りました。そこで開いた店は、地域の不景気の中でうまくいかなくなります。その後は新聞を編集しましたが、1891年に一家はシカゴへ移りました。商売と暮らしを立て直そうとする経験があり、作家としての成功までには回り道がありました。", "sources": [{"title": "ネブラスカ大学：Encyclopedia of the Great Plains・Baum", "url": "https://plainshumanities.unl.edu/encyclopedia/doc/egp.lt.003.html"}]}, {"title": "絵のある子供の本を作る", "text": "1897年に『Mother Goose in Prose』、1899年に『Father Goose, His Book』を出版しました。後者では画家W・W・デンスロウと組み、人気を得ます。文章を書くボームと、絵を描くデンスロウは別の人です。二人の協力は、次の『オズの魔法使い』にも続きました。", "sources": [{"title": "米国議会図書館：To Please a Child・ボームとオズの展示", "url": "https://www.loc.gov/exhibits/oz/ozsect1"}]}, {"title": "1900年に生まれた『オズ』", "text": "『オズの魔法使い』は1900年に刊行されました。少女ドロシーが、かかし、ブリキの木こり、ライオンと旅する物語です。初版にはデンスロウの絵が使われ、色彩も本の魅力になりました。後に舞台や映画でも知られるようになりますが、この図鑑で紹介しているのはボームの英語原作です。後の映像作品の設定とは分けています。", "sources": [{"title": "米国議会図書館：To Please a Child・ボームとオズの展示", "url": "https://www.loc.gov/exhibits/oz/ozsect1"}, {"title": "Project Gutenberg：The Wonderful Wizard of Oz 原著（既存記事の参照本文）", "url": "https://www.gutenberg.org/files/55/55-h/55-h.htm"}]}, {"title": "広がったシリーズと最後の作品", "text": "ボームは1919年5月6日に亡くなりました。『オズ』を舞台にした本は、本人が書いたものだけで十四冊あります。最後の『Glinda of Oz』は1920年、没後に出版されました。その後も別の作者たちがシリーズを続けています。『オズ』の名が付く本を、すべてボーム一人が書いたものと考えないことが大切です。", "sources": [{"title": "南フロリダ大学 Lit2Go：L. Frank Baum", "url": "https://etc.usf.edu/lit2go/authors/29/l-frank-baum/"}, {"title": "米国議会図書館：To Please a Child・ボームとオズの展示", "url": "https://www.loc.gov/exhibits/oz/ozsect1"}]}, {"title": "仲間の行動から読む", "text": "この図鑑の『オズの魔法使い』では、かかしたちは自分に足りないものを求めます。けれど、旅の途中の行動には、考える力や思いやり、勇気がすでに表れています。願いをかなえる物を受け取る場面だけでなく、それ以前に何をしていたかを追うと、仲間の姿が違って見えます。原作のドロシーの靴は銀色です。見覚えのある映像と違う点も、原作を読む入口になります。", "sources": [{"title": "Project Gutenberg：The Wonderful Wizard of Oz 原著（既存記事の参照本文）", "url": "https://www.gutenberg.org/files/55/55-h/55-h.htm"}]}], "robert-louis-stevenson": [{"title": "灯台を造る家に生まれる", "text": "ロバート・ルイス・スティーヴンソンは、1850年11月13日、スコットランドのエディンバラに生まれました。家族は灯台を造る技術者として知られていました。1867年にはエディンバラ大学で工学を学び始めます。しかし、本人の関心は文学へ向かっていました。家業の道をそのまま進まず、書く仕事を選んだ作家です。", "sources": [{"title": "エディンバラ大学：Robert Louis Stevenson（卒業生紹介）", "url": "https://alumni.ed.ac.uk/services/notable-alumni/alumni-in-history/robert-louis-stevenson"}, {"title": "Robert Louis Stevenson Museum（米国セントヘレナ）：作品刊行年譜", "url": "https://stevensonmuseum.org/robert-louis-stevenson/the-works/publications-timeline/"}]}, {"title": "法律を学びながら文章を書く", "text": "父に作家になりたいと伝えた後、文学の仕事だけで生活できない場合にも備え、法律を学ぶことになりました。1875年には弁護士資格を得ましたが、実務には進みませんでした。在学中から、先人の文体をまねて文章を練習し、雑誌にも随筆を発表していました。作家への道は、書き方を学ぶ積み重ねでもあったのです。", "sources": [{"title": "エディンバラ大学：Robert Louis Stevenson（卒業生紹介）", "url": "https://alumni.ed.ac.uk/services/notable-alumni/alumni-in-history/robert-louis-stevenson"}, {"title": "Robert Louis Stevenson Museum（米国セントヘレナ）：作品刊行年譜", "url": "https://stevensonmuseum.org/robert-louis-stevenson/the-works/publications-timeline/"}]}, {"title": "旅を文章にする", "text": "フランスを旅した経験から、船旅の記録や、ロバを連れて歩いた旅の本を出版しました。移動には、新しい土地を見たいという思いだけでなく、体調に合う気候を求める事情もありました。1880年にはアメリカでファニー・オズボーンと結婚します。旅の経験を持つ人ですが、冒険小説をすべて本人の実体験と考えることはできません。", "sources": [{"title": "エディンバラ大学：Robert Louis Stevenson（卒業生紹介）", "url": "https://alumni.ed.ac.uk/services/notable-alumni/alumni-in-history/robert-louis-stevenson"}, {"title": "Robert Louis Stevenson Museum（米国セントヘレナ）：作品刊行年譜", "url": "https://stevensonmuseum.org/robert-louis-stevenson/the-works/publications-timeline/"}, {"title": "英国ナショナル・ポートレート・ギャラリー：Robert Louis Stevenson人物解説", "url": "https://www.npg.org.uk/collections/search/person/mp04296/robert-louis-stevenson"}]}, {"title": "『宝島』が一冊の本になる", "text": "『宝島』は1881年から1882年にかけて、雑誌「ヤング・フォークス」に連載され、1883年に単行本になりました。したがって、1883年は物語が初めて読者に届いた年ではありません。その後も小説や詩集を発表し、1886年には『ジーキル博士とハイド氏』などを刊行しました。少年の冒険だけを書く人ではなかったのです。", "sources": [{"title": "Robert Louis Stevenson Museum（米国セントヘレナ）：作品刊行年譜", "url": "https://stevensonmuseum.org/robert-louis-stevenson/the-works/publications-timeline/"}, {"title": "英国ナショナル・ポートレート・ギャラリー：Robert Louis Stevenson人物解説", "url": "https://www.npg.org.uk/collections/search/person/mp04296/robert-louis-stevenson"}]}, {"title": "サモアでの暮らしと晩年", "text": "1888年から家族と太平洋の島々を巡り、1890年にはサモアのウポル島に土地を買いました。そこで暮らしながら書き続け、地域の政治にも関わります。晩年の文章は、勢力を競う欧米の国々がサモアの文化に及ぼす影響にも目を向けています。単なる「南の楽園での隠居」ではありません。1894年12月3日、44歳で亡くなりました。", "sources": [{"title": "Robert Louis Stevenson Museum（米国セントヘレナ）：作品刊行年譜", "url": "https://stevensonmuseum.org/robert-louis-stevenson/the-works/publications-timeline/"}, {"title": "英国ナショナル・ポートレート・ギャラリー：Robert Louis Stevenson人物解説", "url": "https://www.npg.org.uk/collections/search/person/mp04296/robert-louis-stevenson"}]}, {"title": "『宝島』から読む", "text": "この図鑑の『宝島』では、ジムの機転が仲間を助ける一方、勝手な行動が危険も招きます。シルバーも、親切に見える態度と、自分を守る計算を併せ持っています。誰を信じるかという迷いを追うと、宝探しだけではない面白さが見えてきます。宝を得た後もジムに怖い記憶が残る結末は、冒険の成功をお金だけで測れないことも示しています。", "sources": [{"title": "Project Gutenberg：Treasure Island 英語原著（既存作品記事の参照原典）", "url": "https://www.gutenberg.org/files/120/120-h/120-h.htm"}]}], "victor-hugo": [{"title": "詩から広がった文学の仕事", "text": "ヴィクトル・ユゴーは1802年2月26日、フランスのブザンソンに生まれました。軍人の父と王党派の母を持ち、若いころから詩や小説を書きます。十五歳で詩のコンクールに評価され、その後は詩人、劇作家、小説家として活動しました。『レ・ミゼラブル』一作だけでなく、複数の文学の分野に足跡を残した人です。", "sources": [{"title": "フランス上院公文書館：Victor Hugo, écrivain et sénateur", "url": "https://archives.senat.fr/en-2025-le-senat-fete-ses-150-ans/victor-hugo-ecrivain-et-senateur.html"}]}, {"title": "舞台と小説で新しい表現へ", "text": "1830年に初演された戯曲『エルナニ』は、古典的な演劇を支持する人々とロマン主義の側との対立を招きました。ユゴーは、新しい文学の動きを代表する一人となります。また、小説『ノートルダム・ド・パリ』にも取り組み、主な執筆は1830年秋から翌年初めに進められました。舞台と小説の両方で、自分の表現を広げていたのです。", "sources": [{"title": "フランス上院公文書館：Victor Hugo, écrivain et sénateur", "url": "https://archives.senat.fr/en-2025-le-senat-fete-ses-150-ans/victor-hugo-ecrivain-et-senateur.html"}, {"title": "フランス国立図書館：Hernani作品典拠", "url": "https://catalogue.bnf.fr/ark:/12148/cb11976057q.public"}, {"title": "フランス国立図書館：Victor Hugo et Notre-Dame de Paris", "url": "https://www.bnf.fr/fr/victor-hugo-et-notre-dame-de-paris-ressources-en-ligne"}]}, {"title": "政治への参加と亡命", "text": "政治上の立場は生涯同じではありません。若いころは王政を支持し、1845年には貴族院議員となりましたが、後には共和政を支持する側へ移ります。1851年のルイ＝ナポレオンによるクーデターに反対し、国外へ逃れました。ベルギー、ジャージー島、ガーンジー島へと移った亡命生活は1870年まで続きます。初めから同じ信念を貫いた、と単純にはまとめられません。", "sources": [{"title": "フランス上院公文書館：Victor Hugo, écrivain et sénateur", "url": "https://archives.senat.fr/en-2025-le-senat-fete-ses-150-ans/victor-hugo-ecrivain-et-senateur.html"}, {"title": "フランス上院：Victor Hugo (1802-1885)", "url": "https://www.senat.fr/connaitre-le-senat/lhistoire-du-senat/dossiers-dhistoire/default-0828a4dd4d0098449b6b3e5e104c53fe/victor-hugo.html"}]}, {"title": "長い時間をかけた『レ・ミゼラブル』", "text": "『レ・ミゼラブル』の執筆は1845年に始まり、1848年に中断しました。1860年に再開し、翌年に完成、亡命中の1862年に刊行されます。つまり、1862年は物語の全てを一気に書いた年ではありません。作中のバリケードの戦いは1832年六月の蜂起で、出版年とも1789年のフランス革命とも別です。作品を読むときは、書かれた時代と描かれる時代を分けましょう。", "sources": [{"title": "フランス国立図書館：Les misérables作品典拠", "url": "https://catalogue.bnf.fr/ark:/12148/cb13516296h.public"}, {"title": "Project Gutenberg：Hapgood 1887年英訳（既存作品記事の参照原典）", "url": "https://www.gutenberg.org/files/135/135-h/135-h.htm"}]}, {"title": "帰国後も社会に語りかける", "text": "1870年、第二帝政の崩壊後にフランスへ戻り、1876年には上院議員に選ばれました。貧困や教育、表現の自由、死刑廃止などについて、議会でも意見を述べています。文学の仕事と社会への発言は、その生涯の中で重なっていました。1885年5月22日にパリで亡くなり、国葬が行われました。作品は作者の死後も読み継がれていきます。", "sources": [{"title": "フランス上院公文書館：Victor Hugo, écrivain et sénateur", "url": "https://archives.senat.fr/en-2025-le-senat-fete-ses-150-ans/victor-hugo-ecrivain-et-senateur.html"}, {"title": "フランス上院：Victor Hugo (1802-1885)", "url": "https://www.senat.fr/connaitre-le-senat/lhistoire-du-senat/dossiers-dhistoire/default-0828a4dd4d0098449b6b3e5e104c53fe/victor-hugo.html"}]}, {"title": "人を決めつける目を問い直す", "text": "この図鑑の『レ・ミゼラブル』では、ヴァルジャンがどのように変わるかだけでなく、周囲が彼をどう見ているかにも注目してみましょう。司教の信頼が生き直すきっかけになる一方、前科への偏見は後まで影を落とします。ファンティーヌの困窮も合わせて読むと、個人の善悪だけでは説明できない社会の問題が見えてきます。これは作品への独自の読書案内です。", "sources": [{"title": "Project Gutenberg：Hapgood 1887年英訳（既存作品記事の参照原典）", "url": "https://www.gutenberg.org/files/135/135-h/135-h.htm"}]}], "mary-shelley": [{"title": "本に囲まれて育った少女", "text": "メアリー・シェリーは1797年8月30日、ロンドンに生まれました。父は思想家ウィリアム・ゴドウィン、母は女性の権利を論じた著述家メアリー・ウルストンクラフトです。母は出産後まもなく亡くなりました。娘は文学や歴史、神話に親しみ、フランス語やラテン語も学びます。同じメアリーという名でも、母と『フランケンシュタイン』の作者は別人です。", "sources": [{"title": "米国国立医学図書館：An Extraordinary Life", "url": "https://www.nlm.nih.gov/exhibition/frankenstein/exhibition2.html"}, {"title": "Shelley-Godwin Archive：Frankenstein Chronology", "url": "https://shelleygodwinarchive.org/contents/frankenstein/frankenstein-chronology/"}, {"title": "英国オープン大学：Mary Shelley: the expert view", "url": "https://www.open.edu/openlearn/history-the-arts/literature/mary-shelley-the-expert-view"}]}, {"title": "詩人パーシーとの生活", "text": "結婚前の姓はゴドウィンです。1814年、詩人パーシー・ビッシュ・シェリーと大陸へ旅立ちました。この時パーシーには妻があり、メアリーと結婚したのは1816年12月です。二人の関係には、旅や読書、文学をめぐる交流がありました。ただし、夫も作家だからといって、『フランケンシュタイン』を夫の作品として扱うことはできません。", "sources": [{"title": "Shelley-Godwin Archive：Frankenstein Chronology", "url": "https://shelleygodwinarchive.org/contents/frankenstein/frankenstein-chronology/"}, {"title": "英国オープン大学：Mary Shelley: the expert view", "url": "https://www.open.edu/openlearn/history-the-arts/literature/mary-shelley-the-expert-view"}]}, {"title": "1816年の夏から始まった物語", "text": "1816年夏、ジュネーヴ湖の近くに滞在していたメアリーたちは、詩人バイロンの提案で怖い物語を書くことになりました。十八歳の彼女が小説を構想するきっかけです。しかし、一晩で長編が完成したわけではありません。有名な夢の話は1831年の序文で振り返られたもので、当夜の会話や着想の日付を細部まで確定するのは避けたいところです。", "sources": [{"title": "Shelley-Godwin Archive：Frankenstein Chronology", "url": "https://shelleygodwinarchive.org/contents/frankenstein/frankenstein-chronology/"}, {"title": "米国国立医学図書館：The Birth of Frankenstein", "url": "https://www.nlm.nih.gov/exhibition/frankenstein/exhibition1.html"}]}, {"title": "初版と改訂版を分けて読む", "text": "『フランケンシュタイン』の初版は1818年、著者名を伏せて刊行されました。着想した1816年と出版した1818年は異なります。さらに1831年には、新しい序文と本文の変更を伴う改訂版が出ました。同じ題名でも、初版と改訂版では本文が異なります。", "sources": [{"title": "Shelley-Godwin Archive：Frankenstein Chronology", "url": "https://shelleygodwinarchive.org/contents/frankenstein/frankenstein-chronology/"}, {"title": "米国国立医学図書館：The Birth of Frankenstein", "url": "https://www.nlm.nih.gov/exhibition/frankenstein/exhibition1.html"}, {"title": "Project Gutenberg：1831年改訂版（既存作品記事の参照原典）", "url": "https://www.gutenberg.org/files/42324/42324-h/42324-h.htm"}]}, {"title": "一冊だけではない文学の仕事", "text": "パーシーは1822年に亡くなり、メアリーは翌年イギリスへ戻りました。その後も執筆を続け、歴史小説や、未来を舞台とする『最後のひとり』（1826年刊）などを発表します。雑誌の記事、短い物語、文学者の伝記にも取り組みました。若いころの一作だけで終わった作家ではありません。1851年2月1日、ロンドンで亡くなりました。", "sources": [{"title": "Shelley-Godwin Archive：Frankenstein Chronology", "url": "https://shelleygodwinarchive.org/contents/frankenstein/frankenstein-chronology/"}, {"title": "英国オープン大学：Mary Shelley: the expert view", "url": "https://www.open.edu/openlearn/history-the-arts/literature/mary-shelley-the-expert-view"}]}, {"title": "つくられた側の言葉を聞く", "text": "『フランケンシュタイン』は、生命をつくるヴィクターの姓です。つくられた存在には固有の名前がありません。読むときは、創造主だけでなく、創造物自身の語りにも耳を傾けてみましょう。言葉を学び、人とのつながりを求める姿から、恐ろしい外見だけでは見えない孤独が分かります。ただし、その苦しみは暴力の正当化とは別です。これは独自の読書案内です。", "sources": [{"title": "Project Gutenberg：1831年改訂版（既存作品記事の参照原典）", "url": "https://www.gutenberg.org/files/42324/42324-h/42324-h.htm"}]}], "charles-dickens": [{"title": "少年時代の暮らしと仕事", "text": "チャールズ・ディケンズは1812年2月7日、イングランドのポーツマスに生まれました。家族がロンドンへ移った後、家計が苦しくなります。少年だったディケンズは学校を離れ、靴墨の容器にラベルを貼る工場で働きました。父も借金のために拘禁されましたが、本人が父と一緒に拘禁されたわけではありません。やがて再び学校へ通う機会を得ました。", "sources": [{"title": "マサチューセッツ大学ローウェル校：Dickens Chronology", "url": "https://www.uml.edu/conferences/dickens-in-lowell/fast-facts/about-charles-dickens.aspx"}, {"title": "Science Museum Group：Charles John Huffam Dickens人物記録", "url": "https://collection.sciencemuseumgroup.org.uk/people/ap15279/dickens-charles-john-huffam"}]}, {"title": "記者として言葉を磨く", "text": "法律事務所で働いた後、ディケンズは速記を学び、裁判や議会の議論を伝える仕事へ進みました。新聞記者として、限られた時間で文章をまとめる経験を重ねます。また、「ボズ」という筆名で短い文章を発表しました。小説家としての出発の前には、人々の話や街の様子を捉え、読者へ届ける仕事があったのです。", "sources": [{"title": "マサチューセッツ大学ローウェル校：Dickens Chronology", "url": "https://www.uml.edu/conferences/dickens-in-lowell/fast-facts/about-charles-dickens.aspx"}, {"title": "London Museum：Who was Charles Dickens?", "url": "https://www.londonmuseum.org.uk/collections/london-stories/who-was-charles-dickens/"}]}, {"title": "連載小説で多くの読者に届く", "text": "1836年に発表を始めた『ピクウィック・ペーパーズ』が人気を集め、作家として広く知られるようになります。『オリヴァー・トウィスト』なども続きました。作品は、続きを少しずつ読む連載の形でも読者に届きました。ディケンズは、苦しい暮らしを描くだけでなく、笑いを誘う人物や、家庭の温かさも描く作家でした。", "sources": [{"title": "マサチューセッツ大学ローウェル校：Dickens Chronology", "url": "https://www.uml.edu/conferences/dickens-in-lowell/fast-facts/about-charles-dickens.aspx"}, {"title": "London Museum：Who was Charles Dickens?", "url": "https://www.londonmuseum.org.uk/collections/london-stories/who-was-charles-dickens/"}, {"title": "Charles Dickens Museum：作者と博物館の紹介", "url": "https://dickensmuseum.com/pages/about-us"}]}, {"title": "1843年のクリスマスの物語", "text": "『クリスマス・キャロル』は1843年に初めて出版されました。精霊が現れる不思議な話ですが、その背景には、お金を持つ人と貧しい人との隔たりがあります。ディケンズは小説や記事を通じ、貧困を本人の心がけの悪さだけで説明する見方に異議を示しました。楽しい祝日の話と、社会の暮らしへの関心は、切り離されていなかったのです。", "sources": [{"title": "Charles Dickens Museum：作者と博物館の紹介", "url": "https://dickensmuseum.com/pages/about-us"}, {"title": "Charles Dickens Museum：A Christmas Carol初版本", "url": "https://dickensmuseum.com/blogs/explore/first-edition-of-a-christmas-carol"}, {"title": "Project Gutenberg：A Christmas Carol英語原著（既存記事の参照原典）", "url": "https://www.gutenberg.org/files/46/46-h/46-h.htm"}]}, {"title": "書くことと声で伝えること", "text": "その後もディケンズは、『デイヴィッド・コパフィールド』や『大いなる遺産』などを発表し、雑誌の編集にも携わりました。自分の作品を人前で朗読する活動も行い、イギリスだけでなくアメリカでも読者と接しました。1870年6月9日、58歳で亡くなりました。机で小説を書く以外にも、さまざまな形で言葉を届け続けた人です。", "sources": [{"title": "マサチューセッツ大学ローウェル校：Dickens Chronology", "url": "https://www.uml.edu/conferences/dickens-in-lowell/fast-facts/about-charles-dickens.aspx"}, {"title": "Science Museum Group：Charles John Huffam Dickens人物記録", "url": "https://collection.sciencemuseumgroup.org.uk/people/ap15279/dickens-charles-john-huffam"}]}, {"title": "『クリスマス・キャロル』から読む", "text": "この図鑑の物語では、スクルージは過去を悔やむだけで終わりません。人々と食事を共にし、寄付をし、働くボブの給料を上げます。精霊が見せた未来も、変えられない運命ではありません。心の変化が具体的な行動につながり、周囲の暮らしも変わるところに注目できます。怖い幽霊の話として読むだけでなく、その後の日常まで追うと、結末の意味が深まります。", "sources": [{"title": "Project Gutenberg：A Christmas Carol英語原著（既存記事の参照原典）", "url": "https://www.gutenberg.org/files/46/46-h/46-h.htm"}]}], "arthur-conan-doyle": [{"title": "医学を学んだ物語の作者", "text": "アーサー・コナン・ドイルは1859年5月22日、スコットランドのエディンバラに生まれました。1876年から1881年にかけて、エディンバラ大学で医学を学びます。父や親族には絵を描く人がおり、母からは文学や歴史への関心も受け継ぎました。名探偵ホームズを作った人ですが、本人の出発点は探偵ではなく医学生でした。", "sources": [{"title": "コナン・ドイル家公式：本人と家族の紹介・生没年月日", "url": "https://arthurconandoyle.co.uk/about"}, {"title": "エディンバラ大学医学部：Arthur Conan Doyle", "url": "https://medicine-vet-medicine.ed.ac.uk/300-years-of-medicine/300-faces-of-edinburgh-medical-school/300-faces-c-e/arthur-conan-doyle"}, {"title": "コナン・ドイル家公式：医師としての活動", "url": "https://arthurconandoyle.co.uk/physician"}, {"title": "コナン・ドイル家公式：作家としての活動", "url": "https://arthurconandoyle.co.uk/author"}]}, {"title": "観察から考える力を知る", "text": "大学では、医師ジョゼフ・ベルに学びました。ベルは患者の様子を細かく観察し、病気だけでなく、仕事や出身地についても推し量る力を持っていました。この観察と推理の方法が、ホームズを考える手がかりになったとされています。ただし、ベルとホームズは同じ人ではなく、作家が作り上げた登場人物として区別します。", "sources": [{"title": "エディンバラ大学医学部：Arthur Conan Doyle", "url": "https://medicine-vet-medicine.ed.ac.uk/300-years-of-medicine/300-faces-of-edinburgh-medical-school/300-faces-c-e/arthur-conan-doyle"}]}, {"title": "診療をしながら書く", "text": "船の医師として働いた後、1882年にはポーツマスのサウスシーで診療を始めました。そのかたわら物語を書き続け、1887年の『緋色の研究』でホームズを登場させます。1891年に短編が人気を得ると、執筆を主な仕事にしていきました。作中の医師ワトソンにも医学の知識が生かされていますが、ワトソンをそのまま作者の自伝上の姿とは考えません。", "sources": [{"title": "コナン・ドイル家公式：医師としての活動", "url": "https://arthurconandoyle.co.uk/physician"}, {"title": "コナン・ドイル家公式：作家としての活動", "url": "https://arthurconandoyle.co.uk/author"}]}, {"title": "雑誌で読まれたホームズ", "text": "ホームズの短編は「ストランド・マガジン」に発表されました。この図鑑の『赤毛組合』もその一つで、初出は1891年8月です。1892年には短編集『シャーロック・ホームズの冒険』に収められました。雑誌に載った年と、一冊の本になった年は別です。シリーズの中の一事件なので、『赤毛組合』がホームズの最初の登場作ではありません。", "sources": [{"title": "コナン・ドイル家公式：作家としての活動", "url": "https://arthurconandoyle.co.uk/author"}, {"title": "ダートマス大学図書館：ホームズ初期版本の展示目録", "url": "https://www.dartmouth.edu/library/rauner/exhibits/handlists/Adventures%20Archives.pdf"}, {"title": "DFW Sherlock Holmes：1891年8月の赤毛組合資料（既存記事の初出確認資料）", "url": "https://www.dfw-sherlock.org/uploads/3/7/3/8/37380505/1891_august_the_red-headed_league.pdf"}]}, {"title": "探偵小説だけではない生涯", "text": "歴史小説や、恐竜のいる世界への探検を描く『失われた世界』なども書きました。また、不当に罪を問われた人を助ける活動や、心霊主義を広める活動にも関わります。心霊主義は死者と交流できるとする信念で、ここでは本人の考えとして扱います。1930年7月7日に亡くなりました。作者の関心は、ホームズの推理だけには収まらないものでした。", "sources": [{"title": "コナン・ドイル家公式：本人と家族の紹介・生没年月日", "url": "https://arthurconandoyle.co.uk/about"}, {"title": "エディンバラ大学医学部：Arthur Conan Doyle", "url": "https://medicine-vet-medicine.ed.ac.uk/300-years-of-medicine/300-faces-of-edinburgh-medical-school/300-faces-c-e/arthur-conan-doyle"}, {"title": "コナン・ドイル家公式：作家としての活動", "url": "https://arthurconandoyle.co.uk/author"}, {"title": "コナン・ドイル家公式：心霊主義への関心", "url": "https://arthurconandoyle.co.uk/spiritualist"}]}, {"title": "『赤毛組合』から読む", "text": "奇妙な求人に目を奪われるだけでなく、その仕事によって、誰が何時間どこにいなくなるのかを考えると、事件の仕組みが見えてきます。ホームズは目立つ話から、店と銀行の位置、助手の行動へと注意を移します。ワトソンと一緒に事情を聞き、後から手がかりの意味を確かめる読み方ができます。これは原著に基づく、この図鑑の独自の読書案内です。", "sources": [{"title": "Project Gutenberg：The Adventures of Sherlock Holmes 第II話（既存記事の参照原著）", "url": "https://www.gutenberg.org/files/1661/1661-h/1661-h.htm"}]}], "l-m-montgomery": [{"title": "島の自然と本に親しむ", "text": "L・M・モンゴメリの名は、ルーシー・モード・モンゴメリです。1874年11月30日、カナダのプリンス・エドワード島に生まれました。二歳になる前に母を亡くし、キャヴェンディッシュの母方の祖父母に育てられます。父は西部へ移りました。身近な自然や本、親族の語る話に親しみながら、幼いころから詩や日記を書いていました。", "sources": [{"title": "プリンス・エドワード島大学 L. M. Montgomery Institute：Her Life", "url": "https://lmmontgomery.ca/about/l-m-montgomery/"}, {"title": "カナダ公園局：Person of significance: L.M. Montgomery", "url": "https://parks.canada.ca/lhn-nhs/pe/greengables/culture/montgomery"}]}, {"title": "教師として働きながら学ぶ", "text": "1894年、プリンス・オブ・ウェールズ・カレッジで教員資格を得て、島の学校で教え始めました。途中、ダルハウジー大学で英文学などを一年間学び、再び教職に戻ります。1898年に祖父が亡くなると、祖母を支えるため帰郷しました。詩や短編の投稿も続け、新聞社で働いた時期もあります。生活の仕事と執筆を並行していた人です。", "sources": [{"title": "UPEI等の共同原稿展示：The Life and Work of L.M. Montgomery", "url": "https://annemanuscript.ca/stories/life-and-work/"}]}, {"title": "原稿から1908年の出版へ", "text": "『赤毛のアン』は、1905年に書かれた原稿が複数の出版社に断られ、いったんしまわれた後、再び出版を目指した作品です。1907年にボストンの出版社と契約し、1908年に刊行されました。書いた年、契約した年、出版した年は同じではありません。それ以前から詩や短編は発表していましたが、この初めての長編小説が広く読まれるようになります。", "sources": [{"title": "プリンス・エドワード島大学 L. M. Montgomery Institute：Her Life", "url": "https://lmmontgomery.ca/about/l-m-montgomery/"}, {"title": "UPEI等の共同原稿展示：The Life and Work of L.M. Montgomery", "url": "https://annemanuscript.ca/stories/life-and-work/"}, {"title": "カナダ公園局：Person of significance: L.M. Montgomery", "url": "https://parks.canada.ca/lhn-nhs/pe/greengables/culture/montgomery"}]}, {"title": "アンと作者は同じ人ではない", "text": "島の森や海辺、農家の暮らしは、作品を考える大切な背景になりました。実生活の出来事をもとにした挿話もあります。しかし、『赤毛のアン』は作者の人生をそのまま記録した自伝ではありません。母方の祖父母に育てられたモンゴメリと、孤児院からカスバート兄妹の家に来るアンは別人です。似た経験があっても、人物や出来事を一対一で重ねないことが大切です。", "sources": [{"title": "カナダ公園局：Person of significance: L.M. Montgomery", "url": "https://parks.canada.ca/lhn-nhs/pe/greengables/culture/montgomery"}, {"title": "Wikisource：Anne of Green Gables（1908年刊作品の旧版転記）", "url": "https://en.wikisource.org/wiki/Anne_of_Green_Gables_(1908)"}]}, {"title": "島を離れても書き続ける", "text": "1911年に牧師ユーアン・マクドナルドと結婚し、オンタリオ州へ移りました。その後も家庭を営みながら、小説や短編、詩を書き続けます。アンの物語以外にも作品があり、日記や多くの手紙も残しました。島は長く作品の大切な舞台であり続けます。1942年4月24日、トロントで亡くなり、故郷キャヴェンディッシュに葬られました。", "sources": [{"title": "プリンス・エドワード島大学 L. M. Montgomery Institute：Her Life", "url": "https://lmmontgomery.ca/about/l-m-montgomery/"}, {"title": "UPEI等の共同原稿展示：The Life and Work of L.M. Montgomery", "url": "https://annemanuscript.ca/stories/life-and-work/"}, {"title": "カナダ公園局：Person of significance: L.M. Montgomery", "url": "https://parks.canada.ca/lhn-nhs/pe/greengables/culture/montgomery"}]}, {"title": "少女だけでなく大人の変化も読む", "text": "『赤毛のアン』では、アンの失敗や成長だけでなく、迎えた大人たちの変化にも注目してみましょう。マリラは厳しく教える一方で、自分の誤りを認めて謝ります。口数の少ないマシュウも、アンの願いを理解して支えます。家族になるとは、子どもを一方的に正すことではなく、互いを知っていくことだ、と読めます。これは本図鑑の独自の読書案内です。", "sources": [{"title": "Wikisource：Anne of Green Gables（1908年刊作品の旧版転記）", "url": "https://en.wikisource.org/wiki/Anne_of_Green_Gables_(1908)"}]}], "mark-twain": [{"title": "川沿いの町で育つ", "text": "マーク・トウェインは筆名で、本名はサミュエル・ラングホーン・クレメンズです。1835年11月30日、アメリカのミズーリ州フロリダに生まれ、幼い頃にハンニバルへ移りました。ここはミシシッピ川沿いの町でした。川や船が身近にある少年時代の記憶は、のちの小説に生かされます。ただし、物語の主人公を作者本人そのものと考えることはできません。", "sources": [{"title": "トロント大学図書館RPO：Twain, Mark", "url": "https://rpo.library.utoronto.ca/poets/twain-mark"}, {"title": "ミズーリ州歴史協会：Mark Twain人物伝", "url": "https://historicmissourians.shsmo.org/mark-twain/"}, {"title": "National Mississippi River Museum & Aquarium：Mark Twain", "url": "https://www.rivermuseum.org/inductees/artists-writers-and-musicians/mark-twain"}]}, {"title": "印刷と船の仕事を経験する", "text": "若い頃は新聞の印刷に携わり、各地で働きました。その後、ミシシッピ川で船を安全に進める水先人を目指します。経験を積んで1859年に免許を得ましたが、南北戦争によって船の仕事を続けにくくなり、西部へ向かいます。一つの職業だけで暮らしてきた人ではなく、印刷、船、新聞など異なる仕事を経験した作家です。", "sources": [{"title": "National Mississippi River Museum & Aquarium：Mark Twain", "url": "https://www.rivermuseum.org/inductees/artists-writers-and-musicians/mark-twain"}, {"title": "米国特許商標庁：Unswerving irregularity・トウェイン紹介", "url": "https://www.uspto.gov/learning-and-resources/journeys-innovation/mark-twain"}]}, {"title": "「マーク・トウェイン」という名前", "text": "西部で新聞記事を書くようになったクレメンズは、1863年から「マーク・トウェイン」の名を使いました。船上で水深を測るとき、二ファゾム、つまり約3.7メートルの深さを伝える言葉に由来します。かつての川の仕事と、作家として知られる名前がつながっているのです。新聞への執筆に加え、人前で話す講演でも人気を得ました。", "sources": [{"title": "ミズーリ州歴史協会：Mark Twain人物伝", "url": "https://historicmissourians.shsmo.org/mark-twain/"}, {"title": "National Mississippi River Museum & Aquarium：Mark Twain", "url": "https://www.rivermuseum.org/inductees/artists-writers-and-musicians/mark-twain"}, {"title": "米国特許商標庁：Unswerving irregularity・トウェイン紹介", "url": "https://www.uspto.gov/learning-and-resources/journeys-innovation/mark-twain"}]}, {"title": "1876年の『トム・ソーヤーの冒険』", "text": "1876年、『トム・ソーヤーの冒険』が出版されました。いたずらや遊び、友情だけでなく、事件を目撃した少年が秘密を抱える不安も描かれます。故郷の記憶を背景にした小説ですが、作者の人生をそのまま記録した自伝ではありません。トウェインはほかにも、小説や旅行記などを書き、身近な人間の振る舞いをユーモアで捉えました。", "sources": [{"title": "トロント大学図書館RPO：Twain, Mark", "url": "https://rpo.library.utoronto.ca/poets/twain-mark"}, {"title": "ミズーリ州歴史協会：Mark Twain人物伝", "url": "https://historicmissourians.shsmo.org/mark-twain/"}, {"title": "Wikisource：The Adventures of Tom Sawyer 1876年版（既存記事参照原典）", "url": "https://en.wikisource.org/wiki/The_Adventures_of_Tom_Sawyer"}]}, {"title": "笑いだけでなく社会を見る", "text": "トウェインの作品には、奴隷制度、貧困、社会的な立場の違いへの関心も見られます。昔の川沿いの暮らしを、誰にとっても自由で楽しい世界だったと理想化することはできません。また、本人も事業への投資で損失を抱え、返済のために執筆や講演を続けました。成功だけの人生ではなく、変化の多い時代を生き、1910年4月21日に亡くなりました。", "sources": [{"title": "トロント大学図書館RPO：Twain, Mark", "url": "https://rpo.library.utoronto.ca/poets/twain-mark"}, {"title": "ミズーリ州歴史協会：Mark Twain人物伝", "url": "https://historicmissourians.shsmo.org/mark-twain/"}]}, {"title": "この図鑑のトムを読む", "text": "塀塗りを魅力的な遊びに見せる場面では、トムの言葉が友達の気持ちを変えていきます。一方、裁判で真実を話す場面では、面白がっているだけでは済まない決断をします。いたずらの巧みさと、怖くても人を助けようとする姿を合わせて読むと、同じ少年の異なる面が見えます。原作の差別的な呼び方や描き方を、現在の正しい価値観として受け取らないことも大切です。", "sources": [{"title": "Wikisource：The Adventures of Tom Sawyer 1876年版（既存記事参照原典）", "url": "https://en.wikisource.org/wiki/The_Adventures_of_Tom_Sawyer"}]}], "frances-hodgson-burnett": [{"title": "イギリスからアメリカへ", "text": "フランシス・ホジソン・バーネットは1849年、イングランドのマンチェスターに生まれました。父を亡くした後、1865年に家族とアメリカへ渡ります。家計を支えるために文章を書き、十九歳のころから物語を発表しました。後に両国を行き来しながら活動した人で、『小公女』の舞台であるロンドンだけで暮らした作家ではありません。", "sources": [{"title": "English Heritage：Frances Hodgson Burnettの生涯", "url": "https://www.english-heritage.org.uk/visit/blue-plaques/frances-hodgson-burnett/"}, {"title": "南ミシシッピ大学図書館：Frances Hodgson Burnett Papers・伝記略歴", "url": "https://www.lib.usm.edu/legacy/degrum/public_html/html/research/findaids/burnett.htm"}]}, {"title": "大人向けの小説も書く", "text": "医師スワン・バーネットと結婚し、二人の息子を育てながら執筆を続けました。1877年には最初の長編小説『That Lass o’ Lowrie’s』が刊行されます。子供を主人公にした作品で知られていますが、大人向けの小説や、舞台で演じるための劇も書きました。小説家と劇作家の両方の仕事をしていたのです。", "sources": [{"title": "English Heritage：Frances Hodgson Burnettの生涯", "url": "https://www.english-heritage.org.uk/visit/blue-plaques/frances-hodgson-burnett/"}, {"title": "南ミシシッピ大学図書館：Frances Hodgson Burnett Papers・伝記略歴", "url": "https://www.lib.usm.edu/legacy/degrum/public_html/html/research/findaids/burnett.htm"}]}, {"title": "『小公子』で広く知られる", "text": "『小公子』は1885年に雑誌で発表が始まり、1886年に一冊の本になって、大きな人気を得ました。舞台にもなり、物語は本の読者以外にも届きます。『小公子』と『小公女』は題名が似ていますが、主人公も筋も異なる別の作品です。『小公女』のセーラを、伯爵家の少年を描く『小公子』の主人公と取り違えないようにしましょう。", "sources": [{"title": "English Heritage：Frances Hodgson Burnettの生涯", "url": "https://www.english-heritage.org.uk/visit/blue-plaques/frances-hodgson-burnett/"}, {"title": "南ミシシッピ大学図書館：Frances Hodgson Burnett Papers・伝記略歴", "url": "https://www.lib.usm.edu/legacy/degrum/public_html/html/research/findaids/burnett.htm"}]}, {"title": "『小公女』は語り直しから生まれた", "text": "『小公女』のもとには、先に書かれた『Sara Crewe』という物語があります。バーネットは舞台劇にする中で、登場人物や出来事を広げました。さらに、その内容を本に書き加え、1905年に『A Little Princess』を出版します。", "sources": [{"title": "Wikisource：A Little Princess・1917年版の刊記と作者序文（既存作品記事の原典）", "url": "https://en.wikisource.org/wiki/A_Little_Princess"}]}, {"title": "庭と結びついた晩年の作品", "text": "イギリスで借りたメイサム・ホールの庭は、『秘密の花園』を考える手がかりになりました。この作品は1911年に出版されています。バーネットはアメリカの市民権も取得し、1924年、ニューヨークのロングアイランドで亡くなりました。暮らした場所から着想を得ても、物語の出来事をそのまま本人の実体験と考えることはできません。", "sources": [{"title": "English Heritage：Frances Hodgson Burnettの生涯", "url": "https://www.english-heritage.org.uk/visit/blue-plaques/frances-hodgson-burnett/"}, {"title": "南ミシシッピ大学図書館：Frances Hodgson Burnett Papers・伝記略歴", "url": "https://www.lib.usm.edu/legacy/degrum/public_html/html/research/findaids/burnett.htm"}]}, {"title": "セーラの「お姫様」を読む", "text": "『小公女』のセーラは、王家の娘ではありません。苦しい暮らしになっても、誇りや他人への思いやりを失わないために、お姫様のように振る舞おうとします。空腹の少女にパンを分ける行動と、周囲の人々から助けを受ける結末をつなげて読むと、想像する力だけでなく、現実の支えの大切さも見えてきます。これは原著に基づく独自の読書案内です。", "sources": [{"title": "Wikisource：A Little Princess・1917年版の刊記と作者序文（既存作品記事の原典）", "url": "https://en.wikisource.org/wiki/A_Little_Princess"}]}], "jean-webster": [{"title": "アリスからジーンへ", "text": "ジーン・ウェブスターは1876年7月24日、アメリカのニューヨーク州フリードニアに生まれました。もとの名はアリス・ジェーン・チャンドラー・ウェブスターです。寄宿学校で同室の生徒もアリスという名だったため、ジーンと名乗るようになったと伝えられています。後に本に記されるジーンは、作家としてだけ突然選んだ名前ではありません。", "sources": [{"title": "ヴァッサー大学図書館：Guide to the Jean Webster Papers（伝記解説）", "url": "https://digitallibrary.vassar.edu/sites/default/files/2022-10/Guide%20to%20the%20Jean%20Webster%20Papers%2C%201876%E2%80%931982%20%28bulk%201900-1916%29%20Vassar%20College%20Digital%20Library.pdf"}]}, {"title": "大学で学び、書く", "text": "1897年にヴァッサー大学へ入り、1901年に卒業しました。在学中から地元の新聞に記事を書き、学内の雑誌にも物語を発表します。ヨーロッパで学び、旅した経験も文章にしました。詩人アデレイド・クラプシーとは大学で出会い、親しい友人になります。『あしながおじさん』の大学生活を描く前から、学ぶことと書くことが日々の暮らしにありました。", "sources": [{"title": "ヴァッサー大学図書館：Guide to the Jean Webster Papers（伝記解説）", "url": "https://digitallibrary.vassar.edu/sites/default/files/2022-10/Guide%20to%20the%20Jean%20Webster%20Papers%2C%201876%E2%80%931982%20%28bulk%201900-1916%29%20Vassar%20College%20Digital%20Library.pdf"}, {"title": "Ramapo College・Jane Addams Digital Edition：Webster, Jean", "url": "https://digital.janeaddams.ramapo.edu/items/show/4248"}]}, {"title": "卒業後の作家生活と社会への関心", "text": "卒業後は作家として働き、1903年に最初の小説『When Patty Went to College』を刊行しました。女子大学での生活を扱う作品です。また、子どもを育てる施設や刑務所の改善、女性の参政権にも関心を寄せました。作品を恋愛や楽しい学生生活だけでなく、教育を受ける機会や社会の仕組みという面から読む入口にもなります。", "sources": [{"title": "ヴァッサー大学図書館：Guide to the Jean Webster Papers（伝記解説）", "url": "https://digitallibrary.vassar.edu/sites/default/files/2022-10/Guide%20to%20the%20Jean%20Webster%20Papers%2C%201876%E2%80%931982%20%28bulk%201900-1916%29%20Vassar%20College%20Digital%20Library.pdf"}, {"title": "Ramapo College・Jane Addams Digital Edition：Webster, Jean", "url": "https://digital.janeaddams.ramapo.edu/items/show/4248"}]}, {"title": "1912年の『あしながおじさん』", "text": "『あしながおじさん』は1912年に刊行されました。施設で育ったジュディが匿名の支援を受けて大学へ進み、相手へ書く手紙を通して成長していく小説です。ウェブスター自身の大学経験は背景の一つですが、ジュディは作者そのものではありません。手紙に表れる冗談、知らないことへの驚き、将来の夢を読むことで、主人公の考え方の変化をたどれます。", "sources": [{"title": "Wikisource：Daddy-Long-Legs（1912年Century版）", "url": "https://en.wikisource.org/wiki/Daddy-Long-Legs_(Webster)"}, {"title": "Ramapo College・Jane Addams Digital Edition：Webster, Jean", "url": "https://digital.janeaddams.ramapo.edu/items/show/4248"}]}, {"title": "続編と短い生涯", "text": "1915年には続編『Dear Enemy』が出版されました。これは1912年の作品とは別の本で、この図鑑の『あしながおじさん』の記事に続編の出来事は加えていません。同年、ウェブスターはグレン・フォード・マッキニーと結婚します。翌1916年6月11日、娘を出産した後に亡くなりました。大学には手紙や原稿などが残され、文学の仕事を知る手がかりになっています。", "sources": [{"title": "ヴァッサー大学図書館：Guide to the Jean Webster Papers（伝記解説）", "url": "https://digitallibrary.vassar.edu/sites/default/files/2022-10/Guide%20to%20the%20Jean%20Webster%20Papers%2C%201876%E2%80%931982%20%28bulk%201900-1916%29%20Vassar%20College%20Digital%20Library.pdf"}, {"title": "Ramapo College・Jane Addams Digital Edition：Webster, Jean", "url": "https://digital.janeaddams.ramapo.edu/items/show/4248"}]}, {"title": "感謝と、自分で決めること", "text": "『あしながおじさん』では、ジュディが支援者に感謝しながらも、その希望に従うだけではないことに注目してみましょう。奨学金や仕事を自分で選び、小説の失敗にも向き合います。ほぼ彼女の手紙だけで進むため、読者も彼女の推測を通して相手を知ります。恋の結末とともに、二人が知っている情報の違いにも目を向けたい作品です。これは独自の読書案内です。", "sources": [{"title": "Wikisource：Daddy-Long-Legs（1912年Century版）", "url": "https://en.wikisource.org/wiki/Daddy-Long-Legs_(Webster)"}]}], "wada-mankichi": [{"title": "古い文学と図書館に取り組む", "text": "和田万吉は、1865年10月7日に生まれ、1934年11月21日に亡くなった国文学者・図書館学者です。「和田萬吉」とも書かれます。古い本や文学を研究するとともに、図書館を整え、そこで働く人を育てる仕事にも力を注ぎました。この図鑑の『かぐや姫』は、和田が語り直した『竹取物語』をもとにしています。", "sources": [{"title": "東京都立図書館：和田万吉旧蔵資料", "url": "https://www.library.metro.tokyo.lg.jp/collection/features/catalog/special_acquisition/index/wada/index.html"}, {"title": "青空文庫：和田万吉『竹取物語』図書カード・生没年月日と底本", "url": "https://www.aozora.gr.jp/cards/001072/card48310.html"}]}, {"title": "本を読める仕組みを支える", "text": "1897年から東京帝国大学の図書館長を務めました。現在の日本図書館協会につながる日本文庫協会や、図書館の仕事を教える講習所の設立にも尽力しています。本を書く人であるだけでなく、読者が本を探し、学べる環境を支える人でもありました。図書館学は、そのような図書館の働きや運営を考える学問です。", "sources": [{"title": "東京都立図書館：和田万吉旧蔵資料", "url": "https://www.library.metro.tokyo.lg.jp/collection/features/catalog/special_acquisition/index/wada/index.html"}]}, {"title": "古い本の言葉を調べる", "text": "和田は昔の印刷本を研究し、近松、西鶴、馬琴などの作品の本文を整える仕事もしました。こうした仕事を「校訂」といいます。伝わる本を調べ、本文の違いや誤りを検討する作業です。東京都立図書館には、和田が持っていた本が残されています。物語を新しく作るだけでなく、伝わってきた文章を確かめる仕事も、文学を読む土台になります。", "sources": [{"title": "東京都立図書館：和田万吉旧蔵資料", "url": "https://www.library.metro.tokyo.lg.jp/collection/features/catalog/special_acquisition/index/wada/index.html"}, {"title": "東京都立図書館：本朝書籍目録と和田萬吉の研究", "url": "https://www.library.metro.tokyo.lg.jp/collection/features/digital_showcase/027/05/"}]}, {"title": "子どもが古典に近づく入口", "text": "子ども向けの本では、『竹取物語』のほか、『今昔物語』の説話や能の物語も紹介しました。巻末の『父兄の方々に』では、子どもが後に原本を読むための入口として、説話を選んだことを説明しています。古典の全部を一冊に詰め込むのではなく、まず興味を持って読める話を選ぶという考え方が見られます。", "sources": [{"title": "和田萬吉『父兄の方々に』（青空文庫）", "url": "https://www.aozora.gr.jp/cards/001072/files/48311_42693.html"}]}, {"title": "かぐや姫の原作者ではない", "text": "古典『竹取物語』は平安時代初期の成立と考えられ、作者は分かっていません。和田は、その物語を後の時代の読者に向けて語り直した人です。和田の再話には、1928年に刊行された本と、その本を復刻した1981年の版があります。どちらの年も、かぐや姫の物語が初めて生まれた年ではありません。", "sources": [{"title": "青空文庫：和田万吉『竹取物語』図書カード・生没年月日と底本", "url": "https://www.aozora.gr.jp/cards/001072/card48310.html"}, {"title": "京都大学図書館：竹取物語の成立と作者未詳", "url": "https://rmda.kulib.kyoto-u.ac.jp/item/rb00010893/explanation/taketori"}]}, {"title": "求婚と別れをつなげて読む", "text": "和田版の『竹取物語』では、求婚者たちが珍しい品を手に入れようとして失敗する話から、姫と育ての親との別れへと進みます。財産や身分があっても、相手の気持ちや別れを思いどおりにはできません。姫を手に入れようとする人々と、離れるのを悲しむ家族を比べて読むと、人と人との関係の違いが見えてきます。これは本図鑑の独自の読書案内です。", "sources": [{"title": "和田萬吉『竹取物語』（青空文庫）", "url": "https://www.aozora.gr.jp/cards/001072/files/48310_42692.html"}]}], "joseph-jacobs": [{"title": "海を越えて学んだ人", "text": "ジョセフ・ジェイコブズは1854年8月29日、オーストラリアのシドニーに生まれました。シドニーで学んだ後、イギリスのケンブリッジ大学セント・ジョンズ・カレッジへ進み、ベルリンでも学びました。『ジャックと豆の木』で知られますが、この昔話を最初に作った人という意味の作者ではなく、伝えられてきた話を集め、語り直した人です。", "sources": [{"title": "American Jewish Archives：The Concise Dictionary of American Jewish Biography、Jacobs項", "url": "https://www.americanjewisharchives.org/wp-content/uploads/i-aja-concise-dictionary.pdf"}, {"title": "Oxford・Pitt Rivers Museum：Alison Petch, Joseph Jacobs and the English", "url": "https://england.prm.ox.ac.uk/englishness-Joseph-Jacobs.html"}, {"title": "国立国会図書館典拠：Jacobs, Joseph, 1854–1916", "url": "https://id.ndl.go.jp/auth/ndlna/00444425"}, {"title": "English Fairy Tales：Notes and References XIII", "url": "https://en.wikisource.org/wiki/English_Fairy_Tales/Notes_and_References"}]}, {"title": "昔話だけではない研究", "text": "ジェイコブズは民俗学の研究者として、昔話が人から人へ、土地から土地へ伝わることに関心を持ちました。学術誌『フォークロア』の編集にも携わります。ユダヤの歴史や文化も研究し、1900年にはアメリカへ移りました。教育や編集の仕事を続け、1916年1月30日、ニューヨーク州ヨンカーズで亡くなりました。", "sources": [{"title": "Oxford・Pitt Rivers Museum：Alison Petch, Joseph Jacobs and the English", "url": "https://england.prm.ox.ac.uk/englishness-Joseph-Jacobs.html"}, {"title": "American Jewish Archives：The Concise Dictionary of American Jewish Biography、Jacobs項", "url": "https://www.americanjewisharchives.org/wp-content/uploads/i-aja-concise-dictionary.pdf"}]}, {"title": "子どもに届く言葉で", "text": "昔話を集める仕事は、聞いた言葉をそのまま写すことだけではありませんでした。ジェイコブズは序文で、方言や古い本の言い回しを、子どもが聞きやすい文章へ書き直したと説明しています。音読されることも大切にしました。研究のために出典を示すことと、物語として楽しく語ることの両方に取り組んだのです。", "sources": [{"title": "English Fairy Tales：標題・序文・第三版序文", "url": "https://en.wikisource.org/wiki/English_Fairy_Tales"}]}, {"title": "1890年に出た昔話集", "text": "1890年に『English Fairy Tales』が刊行され、『ジャックと豆の木』も収められました。昔話を一冊にまとめたこの本には、ジョン・D・バッテンの挿絵が付いています。最初に本が出た年と、その後の改訂版が刷られた年は別です。", "sources": [{"title": "Oxford・Pitt Rivers Museum：Alison Petch, Joseph Jacobs and the English", "url": "https://england.prm.ox.ac.uk/englishness-Joseph-Jacobs.html"}, {"title": "English Fairy Tales：標題・序文・第三版序文", "url": "https://en.wikisource.org/wiki/English_Fairy_Tales"}]}, {"title": "一つの話にも違う形がある", "text": "『ジャックと豆の木』の注記には、1860年ごろオーストラリアで聞いた話を語ったと記されています。別の形には、巨人の宝はもともとジャックの父の物だったと説明する妖精が登場しますが、この版にはいません。同じ題名でも細部は違うため、いろいろな版の出来事を混ぜないことが大切です。", "sources": [{"title": "English Fairy Tales：Notes and References XIII", "url": "https://en.wikisource.org/wiki/English_Fairy_Tales/Notes_and_References"}]}, {"title": "三度の訪問を比べて読む", "text": "ジャックは最初、空腹のまま巨人の家を訪ねます。金貨がなくなると二度目に登り、金の卵を産む鶏を得ても、さらに三度目に出かけます。くり返しの中で、行く理由や隠れ場所、逃げ方が変わります。勇気ある冒険として読むだけでなく、助けてくれる巨人の妻や、宝を持ち去られる側からも考えてみる。これは採用本文をもとにした独自の読書案内です。", "sources": [{"title": "採用英語本文：Jack and the Beanstalk", "url": "https://en.wikisource.org/wiki/English_Fairy_Tales/Jack_and_the_Beanstalk"}, {"title": "English Fairy Tales：Notes and References XIII", "url": "https://en.wikisource.org/wiki/English_Fairy_Tales/Notes_and_References"}]}], "carlo-collodi": [{"title": "コッローディは村からとった名前", "text": "カルロ・コッローディは1826年11月24日、イタリアのフィレンツェに生まれました。本名はカルロ・ロレンツィーニです。コッローディという筆名は、母ゆかりの村の名からとったもの。本人も幼いころ、その村で過ごしました。『ピノキオ』の作者として知られていますが、子どもの物語を書く前には、新聞や雑誌で長く活動していました。", "sources": [{"title": "RAI Cultura：Collodi, creatore di Pinocchio（生没・連載開始）", "url": "https://www.raicultura.it/letteratura/articoli/2018/12/Collodi-creatore-di-Pinocchio-7ae294e6-008e-47be-bd26-c2310ceeccc9.html"}, {"title": "Pinocchio Museum Experience：The Author and the Novel", "url": "https://www.pinocchioflorence.it/en/pinocchio"}, {"title": "イタリア百科事典協会 Treccani：Collodi, Carlo（L’Unificazione）", "url": "https://www.treccani.it/enciclopedia/carlo-collodi_(L'Unificazione)/"}]}, {"title": "新聞で社会を見つめる", "text": "若いころには学校で学び、イタリアの独立を目指す戦いにも参加しました。フィレンツェでは政治を風刺する新聞『イル・ランピオーネ』を創刊し、劇場や町の暮らしについても文章を書きます。風刺とは、おかしみや皮肉を通して社会の問題を示すことです。楽しい物語だけでなく、その時代の政治や人々の生活に関わる書き手でもありました。", "sources": [{"title": "イタリア百科事典協会 Treccani：Collodi, Carlo（L’Unificazione）", "url": "https://www.treccani.it/enciclopedia/carlo-collodi_(L'Unificazione)/"}, {"title": "フィレンツェ国立中央図書館：Collodi. Percorso biografico documentario", "url": "https://bncf.cultura.gov.it/attivita/mostra-collodi-percorso-biografico-documentario/"}]}, {"title": "翻訳から子どもの本へ", "text": "子どもの文学への入口の一つが、フランスの童話の翻訳でした。1875年には、ペローらの物語を訳した『妖精のお話』を刊行します。その後、『ジャンネッティーノ』や『ミヌッツォロ』など、子どもの学びに関わる本を書きました。『ピノキオ』だけを突然生み出したのではなく、翻訳や読み物の仕事を重ねて代表作へ進んだのです。", "sources": [{"title": "イタリア百科事典協会 Treccani：Collodi, Carlo（L’Unificazione）", "url": "https://www.treccani.it/enciclopedia/carlo-collodi_(L'Unificazione)/"}, {"title": "マルチェッリアーナ図書館：Collodi scrittore per l’infanzia 展示解説", "url": "https://marucelliana.cultura.gov.it/2026/10/01/inaugurazione-della-mostra-cera-una-volta-un-re-collodi-scrittore-per-linfanzia-con-un-percorso-biografico-documentario/"}, {"title": "Storia di Firenze・Sara Mori：1883年2月の『ピノキオ』刊行", "url": "https://www.storiadifirenze.org/?temadelmese=febbraio-1883-escono-le-avventure-di-pinocchio-2"}]}, {"title": "1881年の連載、1883年の一冊", "text": "『ピノキオ』は1881年7月7日、子ども向けの新聞で『あやつり人形の物語』として連載が始まりました。いったん第15章で区切られた後、編集者の働きかけもあって続きが書かれます。1883年にはフィレンツェの出版社パッジから一冊の本になりました。連載を始めた年と単行本の年は別で、現在読む結末までが最初から一度に発表されたわけではありません。", "sources": [{"title": "RAI Cultura：Collodi, creatore di Pinocchio（生没・連載開始）", "url": "https://www.raicultura.it/letteratura/articoli/2018/12/Collodi-creatore-di-Pinocchio-7ae294e6-008e-47be-bd26-c2310ceeccc9.html"}, {"title": "Storia di Firenze・Sara Mori：1883年2月の『ピノキオ』刊行", "url": "https://www.storiadifirenze.org/?temadelmese=febbraio-1883-escono-le-avventure-di-pinocchio-2"}]}, {"title": "フィレンツェに残る手紙と原稿", "text": "コッローディは1890年10月26日、フィレンツェで亡くなりました。国立中央図書館には手紙や文書が残り、『ピノキオ』の終わりの数章の自筆原稿も保存されています。こうした資料からは、童話の作者という一面だけでなく、新聞記者や社会に関心を持つ人としての仕事も知ることができます。", "sources": [{"title": "RAI Cultura：Collodi, creatore di Pinocchio（生没・連載開始）", "url": "https://www.raicultura.it/letteratura/articoli/2018/12/Collodi-creatore-di-Pinocchio-7ae294e6-008e-47be-bd26-c2310ceeccc9.html"}, {"title": "フィレンツェ国立中央図書館：Collodi. Percorso biografico documentario", "url": "https://bncf.cultura.gov.it/attivita/mostra-collodi-percorso-biografico-documentario/"}]}, {"title": "変わるのは鼻や体だけではない", "text": "『ピノキオ』を読むときは、うそで伸びる鼻だけでなく、主人公がだれのために行動するようになるかにも注目できます。終わり近くでは、父の暮らしを支えるために働き、自分の服を買うお金を妖精のために差し出します。体の変化の前に、生活と選び方が変わっているのです。これは原作の終章を手がかりにした独自の読書案内です。", "sources": [{"title": "Wikisource：イタリア語原著（1902年刊底本）第36章", "url": "https://it.wikisource.org/wiki/Le_avventure_di_Pinocchio/Capitolo_36"}]}], "hesiod": [{"title": "生没年が分からない古代の詩人", "text": "ヘシオドスは古代ギリシャの詩人で、紀元前700年ごろに活動したとされています。ここでは正確な生年月日や没年月日は示しません。紀元前700年は誕生年ではなく、おおよその活動時期です。", "sources": [{"title": "Metropolitan Museum：人物標目の活動年代", "url": "https://www.metmuseum.org/art/collection/search/337384"}]}, {"title": "作品の中で語られる家族", "text": "『仕事と日々』では、語り手がペルセスという相手に呼びかけ、財産の分け方や働き方について話します。父が貧しさから海を渡り、アスクラという村に住んだとも語られます。ただし、詩の中の語りを、そのまますべて証明された伝記として扱うことはできません。ここでは「作品にそう語られること」として区別します。", "sources": [{"title": "『仕事と日々』25–41、618–640行", "url": "https://www.gutenberg.org/cache/epub/348/pg348-images.html"}]}, {"title": "神話と毎日の仕事", "text": "『仕事と日々』には、パンドラの話だけでなく、畑で働く時期や、海へ出る際の注意などもあります。この詩は、農民の厳しい暮らしも伝えています。遠い神々の話と、食べ物を得て生活する身近な仕事とが、一つの詩の中で結びついているのです。", "sources": [{"title": "Metropolitan Museum：幾何学様式期のギリシャと農民の生活", "url": "https://www.metmuseum.org/essays/geometric-art-in-ancient-greece"}, {"title": "『仕事と日々』618–662行ほか", "url": "https://www.gutenberg.org/cache/epub/348/pg348-images.html"}]}, {"title": "パンドラの話を読む入口", "text": "この図鑑の『パンドラの箱』は、『仕事と日々』の一節に沿っています。古代の本文の容器は壺で、希望はその中に残ります。贈り物を計画する神、警告をする者、贈り物を受け取る者の違いにも注目すると、パンドラ一人だけの失敗として片づけない読み方ができます。これは原文を手がかりにした独自の読書案内です。", "sources": [{"title": "『仕事と日々』42–105行", "url": "https://www.gutenberg.org/cache/epub/348/pg348-images.html"}]}], "fukuzawa-yukichi": [{"title": "大阪に生まれ、中津で育つ", "text": "福澤諭吉は1835年1月10日、大阪にあった中津藩の蔵屋敷で生まれました。父を幼くして失い、家族と中津へ移って育ちます。漢学を学んだ後、長崎でオランダ語を学び、大阪では緒方洪庵の適塾で勉強を続けました。", "sources": [{"title": "慶應義塾：創立者 福澤諭吉（年譜）", "url": "https://www.keio.ac.jp/ja/about/philosophy/fukuzawa/"}]}, {"title": "学ぶ人から、教える人へ", "text": "1858年、江戸で蘭学を教える塾を開きました。これが慶應義塾の始まりです。その後、横浜でオランダ語が通じない経験をし、英語の勉強へ進みます。塾は1868年に「慶應義塾」と名づけられました。", "sources": [{"title": "慶應義塾：歴史", "url": "https://www.keio.ac.jp/ja/about/philosophy/history/"}]}, {"title": "外国で見聞きしたことを書く", "text": "福澤は1860年にアメリカへ、1862年にはヨーロッパへ渡りました。外国の暮らしや社会の制度を調べ、日本の読者に伝えます。『西洋事情』にはヨーロッパ旅行で得た知識が生かされました。新しい知識を自分だけのものにせず、読める形にする仕事です。", "sources": [{"title": "慶應義塾：創立者 福澤諭吉（年譜）", "url": "https://www.keio.ac.jp/ja/about/philosophy/fukuzawa/"}, {"title": "慶應義塾大学図書館：福澤諭吉について", "url": "https://libguides.lib.keio.ac.jp/keio/fukuzawa"}]}, {"title": "一人だけではなかった教育の仕事", "text": "小幡篤次郎は、福澤と翻訳や学校運営を支え合った人です。『学問のすゝめ』の初編には、小幡も同著者として記されています。福澤の仕事を読むときは、こうした協力者の存在も忘れずに見ることができます。", "sources": [{"title": "慶應義塾福沢研究センター：小幡篤次郎と初編の同著", "url": "https://www.fmc.keio.ac.jp/research/obata-series"}]}, {"title": "本、演説、新聞で伝える", "text": "『学問のすゝめ』は1872年から1876年にかけて、全17編が刊行されました。『文明論之概略』も著し、1882年には新聞『時事新報』を始めます。学ぶことと社会について考え続け、1901年2月3日に亡くなりました。", "sources": [{"title": "慶應義塾：創立者 福澤諭吉（年譜）", "url": "https://www.keio.ac.jp/ja/about/philosophy/fukuzawa/"}]}, {"title": "『学問のすゝめ』から読む", "text": "この本の学問は、試験の点数を上げることだけではありません。暮らしに役立つ知識を身につけ、自分で判断し、人に伝えることまで話題にしています。明治の社会を変えようとする文章なので、現在にも考えられる点と、当時の価値観に基づく主張を分けて読むと理解が深まります。", "sources": [{"title": "青空文庫：学問のすすめ", "url": "https://www.aozora.gr.jp/cards/000296/files/47061_29420.html"}]}], "obata-tokujiro": [{"title": "中津で学び、教える", "text": "小幡篤次郎は1842年、中津藩士の家に生まれました。漢学を学び、藩校の進脩館で教えます。1864年、協力者を求めて中津を訪れた福澤諭吉に誘われ、弟らと江戸へ出て福澤の塾に入りました。", "sources": [{"title": "慶應義塾大学出版会：小幡篤次郎著作集 第一巻・著者紹介", "url": "https://www.keio-up.co.jp/book/b10164627.html"}]}, {"title": "学ぶ側と教える側をつなぐ", "text": "塾では自ら学ぶ一方で、後から入った人の指導にも当たりました。1866年には塾長を務めます。当時の塾長は学生代表に近い役割でした。図書館制度の導入などにも関わり、授業だけでなく、学ぶための環境を整える仕事を担いました。", "sources": [{"title": "慶應義塾大学出版会：小幡篤次郎著作集 第一巻・著者紹介", "url": "https://www.keio-up.co.jp/book/b10164627.html"}]}, {"title": "『学問のすゝめ』初編の同著者", "text": "1872年刊の『学問のすゝめ』初編には、福澤と小幡の名が同著者として並びます。端書にも二人の署名があります。ただし、どの文章を誰が書いたかは、今回確認した資料だけでは決められません。全十七編を二人で共同執筆したという意味でもありません。", "sources": [{"title": "慶應義塾図書館：学問のすゝめ初編の書誌", "url": "https://dcollections.lib.keio.ac.jp/en/fukuzawa/a15/42"}, {"title": "青空文庫：学問のすすめ（初編端書）", "url": "https://www.aozora.gr.jp/cards/000296/files/47061_29420.html"}, {"title": "慶應義塾大学出版会：小幡篤次郎著作集 第一巻・著者紹介", "url": "https://www.keio-up.co.jp/book/b10164627.html"}]}, {"title": "翻訳と学校運営を支える", "text": "小幡は『天変地異』などの翻訳書を著し、知識を日本語で伝えました。福澤は『文明論之概略』をまとめる際にも小幡に読んでもらい、添削を受けています。中津の学校運営や交詢社の設立にも関わり、慶應義塾の外でも教育や交流の場を支えました。", "sources": [{"title": "慶應義塾大学出版会：小幡篤次郎著作集 第一巻・著者紹介", "url": "https://www.keio-up.co.jp/book/b10164627.html"}]}, {"title": "図書館へ受け継がれた願い", "text": "小幡は1905年に亡くなりました。中津に図書館をつくりたいという願いがあり、遺言によって生家と蔵書の半分が寄贈されます。1909年には中津図書館が開館しました。現在の中津市立小幡記念図書館につながる歩みです。", "sources": [{"title": "慶應義塾大学出版会：小幡篤次郎著作集 第一巻・著者紹介", "url": "https://www.keio-up.co.jp/book/b10164627.html"}]}, {"title": "協力者の名にも目を向ける", "text": "『学問のすゝめ』を読むときは、初編の末尾にある小幡の名にも注目できます。著名な一人の著者だけでなく、共に学び、翻訳し、学校を支えた人を見ることで、本が生まれた環境を考える入口になります。これは図鑑独自の読書案内です。", "sources": [{"title": "青空文庫：学問のすすめ（初編端書）", "url": "https://www.aozora.gr.jp/cards/000296/files/47061_29420.html"}, {"title": "慶應義塾大学出版会：小幡篤次郎著作集 第一巻・著者紹介", "url": "https://www.keio-up.co.jp/book/b10164627.html"}]}], "masaoka-shiki": [{"title": "松山で育った俳人・歌人", "text": "正岡子規は、俳句と短歌の表現を新しくしようとした明治時代の文学者です。1867年10月14日、今の愛媛県松山市に生まれました。本名は正岡常規。「子規」は文学活動で使った名前です。子どものころから漢詩や絵に親しみ、友人たちと雑誌を作ることもありました。", "sources": [{"title": "国立国会図書館：正岡子規（近代日本人の肖像）", "url": "https://www.ndl.go.jp/portrait/datas/329/index.html"}, {"title": "松山市：子規の一生", "url": "https://www.city.matsuyama.ehime.jp/shisetsu/bunka/sikihaku/kidssikihaku/kids_shikinituite.html"}, {"title": "子規庵：正岡子規について・略年譜", "url": "https://shikian.or.jp/about_siki/"}]}, {"title": "東京で学び、漱石と知り合う", "text": "1883年に東京へ出て学び、学生時代に夏目漱石と親しくなりました。1895年には、故郷の松山で漱石としばらく一緒に暮らしています。文学は一人で書くだけでなく、友人と話し、作品を読み合う営みでもありました。子規は野球にも熱中した人です。", "sources": [{"title": "松山市：子規の一生", "url": "https://www.city.matsuyama.ehime.jp/shisetsu/bunka/sikihaku/kidssikihaku/kids_shikinituite.html"}, {"title": "子規庵：正岡子規について・略年譜", "url": "https://shikian.or.jp/about_siki/"}]}, {"title": "新聞を通して、俳句を問い直す", "text": "1892年、新聞「日本」で俳句についての論を発表し、その年の12月に日本新聞社へ入りました。古い作品をたくさん調べ、どんな言葉や表現がよいかを考えます。河東碧梧桐や高浜虚子らとも交流し、俳句を作ることと批評することの両方に取り組みました。", "sources": [{"title": "松山市：子規の一生", "url": "https://www.city.matsuyama.ehime.jp/shisetsu/bunka/sikihaku/kidssikihaku/kids_shikinituite.html"}, {"title": "子規庵：正岡子規について・略年譜", "url": "https://shikian.or.jp/about_siki/"}]}, {"title": "短歌にも新しい表現を求める", "text": "1898年に発表した『歌よみに与ふる書』では、有名な歌だから無条件によいとせず、実際の言葉を読み直すよう促しました。批評は厳しいものですが、感情や空想そのものをなくせという主張ではありません。何を美しいと感じ、どんな言葉で伝えるかを問いかけています。", "sources": [{"title": "松山市立子規記念博物館：正岡子規について", "url": "https://shiki-museum.com/masaokashiki/"}, {"title": "青空文庫：正岡子規『歌よみに与ふる書』原文", "url": "https://www.aozora.gr.jp/cards/000305/files/2533_16281.html"}]}, {"title": "病床でも書き続ける", "text": "病気で外へ出ることが難しくなってからも、子規は書く仕事を続けました。1901年には『墨汁一滴』を連載し、1902年には『病牀六尺』を新聞に連載しています。同年9月19日、満34歳で亡くなりました。短い生涯の中で、俳句、短歌、批評、身の回りのことを記す文章を残しました。", "sources": [{"title": "国立国会図書館：正岡子規（近代日本人の肖像）", "url": "https://www.ndl.go.jp/portrait/datas/329/index.html"}, {"title": "松山市立子規記念博物館：正岡子規について", "url": "https://shiki-museum.com/masaokashiki/"}, {"title": "松山市：子規の一生", "url": "https://www.city.matsuyama.ehime.jp/shisetsu/bunka/sikihaku/kidssikihaku/kids_shikinituite.html"}]}, {"title": "掲載作品から読む入口", "text": "『歌よみに与ふる書』を読むときは、批判の強い言葉だけでなく、その後にどんな理由が続くかを追ってみると、考えをつかみやすくなります。子規の好みをそのまま正解とする必要はありません。具体的な歌を比べ、自分ならどう感じるかを考えられるところも、この文章の面白さです。これは図鑑独自の読書案内です。", "sources": [{"title": "青空文庫：正岡子規『歌よみに与ふる書』原文", "url": "https://www.aozora.gr.jp/cards/000305/files/2533_16281.html"}]}], "h-g-wells": [{"title": "科学と物語を結んだ作家", "text": "H・G・ウェルズは、1866年9月21日、イギリスのブロムリーに生まれました。名前を略さずに書くと、ハーバート・ジョージ・ウェルズです。裕福ではない家庭に育ち、若いころには服地を扱う商売の見習いも経験しました。後に『タイムマシン』『透明人間』『宇宙戦争』などを発表し、科学の発想を使った物語で広く知られるようになります。", "sources": [{"title": "Imperial College London：H.G Wells: 1866–1966（登録簿・生誕百年記念）", "url": "https://blogs.imperial.ac.uk/videoarchive/h-g-wells-1866-1966/"}, {"title": "Humanists UK・Bill Cooke：H. G. Wells (1866–1946)", "url": "https://heritage.humanists.uk/h-g-wells/"}, {"title": "ブロムリー自治体：H G Wells Birthplace", "url": "https://www.bromley.gov.uk/directory-record/6/03-hg-wells-birthplace-primark"}]}, {"title": "生き物について学ぶ", "text": "1884年から1887年まで、後にインペリアル・カレッジの一部となる学校で生物学を学びました。生物学者T・H・ハクスリーの授業も受けています。生き物が長い時間をかけて変わるという考えは、未来の人類を描く物語を読む手がかりになります。ただし、小説に登場する未来の姿は、科学で確定した予測ではありません。", "sources": [{"title": "Imperial College London：H.G Wells: 1866–1966（登録簿・生誕百年記念）", "url": "https://blogs.imperial.ac.uk/videoarchive/h-g-wells-1866-1966/"}, {"title": "Humanists UK・Bill Cooke：H. G. Wells (1866–1946)", "url": "https://heritage.humanists.uk/h-g-wells/"}, {"title": "イリノイ大学貴重書・写本図書館：The Time Machine（英米初版展示）", "url": "https://www.library.illinois.edu/rbx/hgwells2016/category/the-time-machine/"}]}, {"title": "教える仕事から文章の仕事へ", "text": "ウェルズは作家として生活できるようになる前、教員として働きました。初期の著書には、1893年刊の生物学の教科書があります。小説だけでなく、科学の知識を人に伝える文章も書いていたのです。教師だったことを知ると、不思議な出来事を示しながら読者に考える材料を渡す、その書き方にも目を向けられます。", "sources": [{"title": "Humanists UK・Bill Cooke：H. G. Wells (1866–1946)", "url": "https://heritage.humanists.uk/h-g-wells/"}, {"title": "イリノイ大学貴重書・写本図書館：Teacher to the World", "url": "https://www.library.illinois.edu/rbx/hgwells2016/category/teacher-to-the-world/"}]}, {"title": "1895年の『タイムマシン』", "text": "『タイムマシン』が本になったのは1895年です。英国ではロンドンのハイネマン社から刊行されました。同じ年にアメリカのホルト社から出た初版は、英国版と本文に違いがあります。1895年という刊行年と、どの版を読むかは別の情報です。この図鑑の作品紹介は、英国ハイネマン版を採用します。", "sources": [{"title": "イリノイ大学貴重書・写本図書館：The Time Machine（英米初版展示）", "url": "https://www.library.illinois.edu/rbx/hgwells2016/category/the-time-machine/"}]}, {"title": "未来だけでなく、社会も書く", "text": "代表作には『透明人間』（1897年）、『宇宙戦争』（1898年）もあります。その後も、歴史を広く伝える本や、世界中で知識を共有する構想などを書きました。科学を楽しむだけでなく、教育や社会のあり方にも関心を持っていた作家です。1946年8月13日に亡くなりました。", "sources": [{"title": "南フロリダ大学 Lit2Go：The Invisible Man", "url": "https://etc.usf.edu/lit2go/120/the-invisible-man/"}, {"title": "イリノイ大学貴重書・写本図書館：The War of the Worlds", "url": "https://www.library.illinois.edu/rbx/hgwells2016/2016/09/87/"}, {"title": "イリノイ大学貴重書・写本図書館：Teacher to the World", "url": "https://www.library.illinois.edu/rbx/hgwells2016/category/teacher-to-the-world/"}, {"title": "Humanists UK・Bill Cooke：H. G. Wells (1866–1946)", "url": "https://heritage.humanists.uk/h-g-wells/"}]}, {"title": "未来旅行を、現在への問いとして読む", "text": "『タイムマシン』では、未来なら今より進歩しているはずだという期待が揺さぶられます。旅人が何を見て、そこからどう考えたかを分けて読むと、物語を追いやすくなります。奇妙な未来の生き物を眺めるだけでなく、人々の暮らしや働き方の違いに注目するのも一つの読み方です。これは作者の言葉の引用ではなく、独自の読書案内です。", "sources": [{"title": "イリノイ大学貴重書・写本図書館：The Time Machine（英米初版展示）", "url": "https://www.library.illinois.edu/rbx/hgwells2016/category/the-time-machine/"}, {"title": "The Time Machine：1895年Heinemann英国版・原文", "url": "https://en.wikisource.org/wiki/The_Time_Machine_(Heinemann_text)"}]}], "matsuo-basho": [{"title": "伊賀から出た俳人", "text": "松尾芭蕉は、1644年、伊賀国に生まれた江戸時代の俳人です。若いころは藤堂良忠に仕え、俳諧に親しみました。宗房、桃青などの名前でも活動しています。最初から「旅をする有名な俳人」だったのではなく、人から学び、人と句を作りながら自分の表現を育てていきました。", "sources": [{"title": "芭蕉翁顕彰会：略年譜", "url": "https://www.basho-bp.jp/?page_id=16"}, {"title": "三重県：松尾芭蕉", "url": "https://www.bunka.pref.mie.lg.jp/haiku/42249035021.htm"}, {"title": "三重県：松尾芭蕉（俳号「宗房」の読み）", "url": "https://www.bunka.pref.mie.lg.jp/646580347590018.htm"}]}, {"title": "江戸での暮らしと芭蕉庵", "text": "1672年ごろに江戸へ移り、俳諧を教える立場にもなりました。1680年には深川の庵へ移ります。庵は火事で焼けたこともあり、同じ建物に住み続けたわけではありません。芭蕉の暮らしや旅は、弟子や知人たちの助けと結びついていました。", "sources": [{"title": "芭蕉翁顕彰会：略年譜", "url": "https://www.basho-bp.jp/?page_id=16"}, {"title": "三重県：松尾芭蕉", "url": "https://www.bunka.pref.mie.lg.jp/haiku/42249035021.htm"}]}, {"title": "一人の句と、人とつなぐ句", "text": "芭蕉は、短い一句を作るだけでなく、ほかの人と句をつなぐ俳諧にも参加しました。島田市博物館に伝わる「田植の連句」では、塚本如舟の句に芭蕉が次の句を添えています。旅先で受けたもてなしや、人との出会いも、作品が生まれる大切な機会になっていました。", "sources": [{"title": "島田市博物館：芭蕉真蹟「田植の連句」", "url": "https://www.city.shimada.shizuoka.jp/shimahaku/docs/shi-26.html"}]}, {"title": "旅をして、文章を練る", "text": "1684年からの旅は『野ざらし紀行』に結びつき、その後も旅の文学を残しました。1689年には曽良と東北・北陸を巡り、大垣へ至ります。この旅をもとにしたのが『おくのほそ道』です。ただし、旅をした年にそのまま完成した本ではありません。旅の経験を文章と句で組み立てる仕事が続きました。", "sources": [{"title": "芭蕉翁顕彰会：略年譜", "url": "https://www.basho-bp.jp/?page_id=16"}, {"title": "国文学研究資料館：おくのほそ道", "url": "https://www.nijl.ac.jp/etenji/bungakushi/contents/detail/detail04-01_009.html"}]}, {"title": "旅の年、完成の年、本になった時期", "text": "『おくのほそ道』は、1689年の旅、1694年の成立、1702年ごろの刊本を区別して考える必要があります。芭蕉は1694年、大坂で病気になり亡くなりました。そのため、後に広く読まれる本の刊行時期を、本人が旅をしていた時期と取り違えないようにしましょう。", "sources": [{"title": "芭蕉翁顕彰会：略年譜", "url": "https://www.basho-bp.jp/?page_id=16"}, {"title": "国文学研究資料館：おくのほそ道", "url": "https://www.nijl.ac.jp/etenji/bungakushi/contents/detail/detail04-01_009.html"}]}, {"title": "掲載作品から読む入口", "text": "『おくのほそ道』では、どこへ行ったかだけでなく、その場所で何を思ったかに目を向けると読みやすくなります。目の前の風景と、昔の歌や歴史の記憶が出会うところが見どころです。旅の案内図としてだけでなく、経験を選び直して伝える文学として読む、という図鑑独自の読み方です。", "sources": [{"title": "国文学研究資料館：おくのほそ道", "url": "https://www.nijl.ac.jp/etenji/bungakushi/contents/detail/detail04-01_009.html"}, {"title": "おくのほそ道：三宅邦吉『新釈奥の細道』1911年底本の原著翻刻", "url": "https://ja.wikisource.org/w/index.php?title=おくのほそ道&oldid=235001"}]}], "nitobe-inazo": [{"title": "盛岡から、札幌へ", "text": "新渡戸稲造は、1862年9月1日、盛岡に生まれました。父は南部藩の武士です。少年時代に東京へ出て英語などを学び、1877年には札幌農学校へ入学しました。内村鑑三や宮部金吾との交流も、このころから続きます。後に本を書くだけでなく、農学や教育の仕事に進んだ人です。", "sources": [{"title": "国立国会図書館：新渡戸稲造", "url": "https://www.ndl.go.jp/portrait/datas/311/"}, {"title": "北海道大学新渡戸カレッジ：新渡戸稲造", "url": "https://nitobe-college.academic.hokudai.ac.jp/about-nitobe-college/inazo-nitobe"}, {"title": "新渡戸文化学園：新渡戸稲造年表", "url": "https://nitobebunka.ac.jp/nitobe/history/"}]}, {"title": "外国で学び、教える側になる", "text": "札幌農学校を卒業した後、東京大学でも学び、1884年にアメリカへ留学しました。その後ドイツでも農業や経済について研究し、1891年に札幌農学校の教授となります。キリスト教を信仰し、留学中にはクエーカー派に加わりました。日本と外国の両方を見て考える経験を重ねています。", "sources": [{"title": "国立国会図書館：新渡戸稲造", "url": "https://www.ndl.go.jp/portrait/datas/311/"}, {"title": "北海道大学新渡戸カレッジ：新渡戸稲造", "url": "https://nitobe-college.academic.hokudai.ac.jp/about-nitobe-college/inazo-nitobe"}, {"title": "新渡戸文化学園：新渡戸稲造年表", "url": "https://nitobebunka.ac.jp/nitobe/history/"}]}, {"title": "英語で書いた『武士道』", "text": "『武士道』は、最初から日本語で書かれた本ではありません。新渡戸は英語で、日本人の道徳や武士の考え方を海外の読者へ説明しようとしました。初版本は1900年1月、アメリカのフィラデルフィアで刊行されました。1899年の日付を持つ序文と、実際の刊行年を区別する必要があります。", "sources": [{"title": "盛岡市先人記念館：新渡戸稲造に関する展示資料", "url": "https://www.mfca.jp/senjin/nitobe/shiryou"}]}, {"title": "学ぶ機会を広げる", "text": "新渡戸は、学校に通いにくい人や女性の教育にも関わりました。札幌では遠友夜学校の設立に携わり、1906年には第一高等学校の校長、1918年には東京女子大学の初代学長となります。知識を覚えるだけでなく、自分で考え、判断できる人を育てることを重視しました。", "sources": [{"title": "国立国会図書館：新渡戸稲造", "url": "https://www.ndl.go.jp/portrait/datas/311/"}, {"title": "北海道大学新渡戸カレッジ：新渡戸稲造", "url": "https://nitobe-college.academic.hokudai.ac.jp/about-nitobe-college/inazo-nitobe"}, {"title": "東京女子大学：創立期の人々", "url": "https://www.twcu.ac.jp/main/about/history/founder.html"}]}, {"title": "国と国の間で働く", "text": "1920年に国際連盟の事務次長となり、国際知的協力や国際問題の調停に関わりました。教育者や著者としての活動だけでなく、異なる国の人が話し合う場でも仕事をしたのです。1933年10月、カナダのビクトリアで亡くなりました。現地の日付では15日、日本では16日でした。", "sources": [{"title": "国立国会図書館：新渡戸稲造", "url": "https://www.ndl.go.jp/portrait/datas/311/"}, {"title": "新渡戸文化学園：新渡戸稲造年表", "url": "https://nitobebunka.ac.jp/nitobe/history/"}, {"title": "盛岡市先人記念館：新渡戸稲造に関する展示資料", "url": "https://www.mfca.jp/senjin/nitobe/shiryou"}]}, {"title": "掲載作品から読む入口", "text": "『武士道』は、昔の日本人全員が同じ考えだったことを証明する本ではありません。新渡戸が、海外の読者にも伝わるように日本の倫理を説明した著作として読むと、比較の仕方や主張の特徴が見えてきます。共感できる考えと、当時の身分や男女の役割を前提にした考えを分けて確かめるのも、図鑑からの読書案内です。", "sources": [{"title": "盛岡市先人記念館：新渡戸稲造に関する展示資料", "url": "https://www.mfca.jp/senjin/nitobe/shiryou"}, {"title": "新渡戸稲造 Bushido: The Soul of Japan（1908年第13版英語原著）", "url": "https://www.gutenberg.org/files/12096/12096-h/12096-h.htm"}]}], "ishikawa-takuboku": [{"title": "岩手で育った少年", "text": "石川啄木は1886年2月20日、岩手県の日戸村、現在の盛岡市に生まれました。本名は石川一といい、「一」は「はじめ」と読みます。幼いころに家族で渋民へ移り、そこで育ちました。盛岡の中学校へ進んだ後、文学に強く引かれるようになります。\n生まれた場所は日戸の常光寺、育った場所は翌年に移った渋民の宝徳寺です。1898年に入った盛岡尋常中学校は、のちの盛岡中学校、現在の盛岡第一高校につながる学校です。", "sources": [{"title": "国立国会図書館：石川啄木", "url": "https://www.ndl.go.jp/portrait/datas/6251/index.html"}, {"title": "石川啄木記念館：「啄木と鉄道」年譜", "url": "https://www.mfca.jp/takuboku/wp-content/uploads/sites/9/2021/12/e968cadd6af5706d1b809452fcc30cd2-1.pdf"}]}, {"title": "詩を書く人としての出発", "text": "1902年に雑誌『明星』へ短歌が載り、与謝野鉄幹とのつながりも生まれました。中学校を中退して東京へ出ますが、体調を崩して帰郷します。1905年には詩集『あこがれ』を刊行し、節子と結婚しました。後に短歌で知られる啄木も、早くから詩や小説に取り組んだ人です。\n中学校では上級生の金田一京助や野村胡堂に影響を受け、『明星』を愛読して歌作を始めました。上京後には与謝野鉄幹・晶子夫妻を訪ねています。結婚後は妻だけでなく父母らの暮らしも支える必要がありました。友人の援助で文芸誌『小天地』を出したものの、経済的には続かず一号で終わります。文学への意欲と、家族を養うための仕事探しが同時に進んでいました。", "sources": [{"title": "国立国会図書館：石川啄木", "url": "https://www.ndl.go.jp/portrait/datas/6251/index.html"}, {"title": "石川啄木記念館：「啄木と鉄道」年譜", "url": "https://www.mfca.jp/takuboku/wp-content/uploads/sites/9/2021/12/e968cadd6af5706d1b809452fcc30cd2-1.pdf"}, {"title": "岩手県立図書館：結婚と小天地", "url": "https://www.library.pref.iwate.jp/ex/taku34/takuboku/shougai01.html"}]}, {"title": "教員や新聞の仕事をしながら", "text": "啄木は故郷で小学校の代用教員を務め、1907年には北海道へ渡ります。函館でも教員として働きましたが、大火で職場が焼失し、札幌や小樽、釧路へと移りました
