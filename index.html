<script>
'use strict';
const items = [{"id": "rashomon", "image": "assets/rashomon.webp", "imageAlt": "雨の羅生門を描いた作品イメージ", "synopsisSummary": ["荒廃した京都。主人に暇を出された下人が、雨の降る夕方、羅生門の下で途方に暮れている。生活の当てはなく、このままでは飢え死にする。しかし、盗人になる決心もつかない。夜を過ごそうと門の楼へ上がると、そこには捨てられた死体が並び、老婆が女の死体から髪を抜いていた。下人は激しい怒りを覚え、老婆を捕らえて理由を問いただす。老婆は、抜いた髪でかつらを作るのだと答える。さらに、死んだ女も生前は蛇を干魚と偽って売っていたが、生きるためだったのだから仕方がない、自分の行為も同じだと弁明する。", "その言葉を聞くうち、下人の心に、それまでなかった勇気が生まれる。下人は、自分が着物を奪うのも飢え死にを避けるためだと言い放ち、老婆の着物をはぎ取って暗闇へ姿を消す。悪を憎んでいたはずの男は、他人の弁明を、自分の悪事を正当化する理由へと変えてしまった。"], "questions": ["下人は、老婆のどの言葉を境に態度を変えたのだろう。本文からその前後を比べてみよう。", "自分と他人に同じ基準を当てているだろうか。日常の判断を振り返る手がかりになるだろうか。"], "cat": "literature", "name": "羅生門", "sub": "芥川龍之介｜1915年発表", "motif": "gate", "gist": "生き延びるためなら、悪事は許されるのか。悪を責めた男が、同じ理屈で悪へ踏み出す物語。", "intro": "仕事を失った下人が、荒れ果てた京都の羅生門で雨を避けている。このままでは飢えてしまうが、盗人になる決心もつかない。夜を過ごそうと門の楼へ上がると、死体のそばで何かをしている老婆を見つける。", "people": [["下人", "失業し、生きる手段と善悪の間で揺れる男。"], ["老婆", "死体から髪を抜き、生計を立てようとする女。"]], "theme": "下人の怒りが、老婆の弁明を境に自分の悪事を支える理屈へ変わる。その転換を追うと、「生きるため」という言葉が、誰の立場から語られるかで異なる働きをすることが見えてくる。これは読み方の一例であり、作品の意味を一つに限定するものではない。", "memory": "善悪の基準が揺れる、その瞬間に注目する。", "links": ["akutagawa", "hana", "spider"], "sources": [{"title": "青空文庫「羅生門」本文", "url": "https://www.aozora.gr.jp/cards/000879/files/127_15260.html"}, {"title": "青空文庫 図書カード（初出：1915年11月）", "url": "https://www.aozora.gr.jp/cards/000879/card127.html"}]}, {"id": "akutagawa", "cat": "person", "name": "芥川龍之介", "sub": "1892–1927｜小説家", "motif": "book", "gist": "古い物語を手がかりに、人間の心を新しく描いた作家。『羅生門』『鼻』『蜘蛛の糸』をつなぐ人物。", "intro": "芥川龍之介は、1892年に東京で生まれ、1927年に亡くなった小説家。『羅生門』『鼻』『蜘蛛の糸』などの短編で知られる。古典や説話を題材にしながら、他人の目を気にする心、利己心、善悪の揺らぎなどを描いた。ここではまず三つの作品を読み比べ、それぞれの人物が何を望み、どのように変化するのかをたどってみよう。", "people": [["読む入口", "『羅生門』では善悪の転換、『鼻』では自尊心と他人の視線、『蜘蛛の糸』では救いと利己心が読みどころとなる。"]], "theme": "同じ作家の作品を並べても、人物や結末は異なる。共通点を探すと同時に、作品ごとの語り方の違いにも目を向けたい。", "memory": "作品を読み、作家に戻り、次の作品へ進む。", "links": ["rashomon", "hana", "spider"], "sources": [{"title": "国立国会図書館「近代日本人の肖像」芥川龍之介", "url": "https://www.ndl.go.jp/portrait/datas/224/"}]}, {"id": "hana", "image": "assets/hana.webp", "imageAlt": "僧・禅智内供を描いた作品イメージ", "synopsisSummary": ["池の尾に住む僧・禅智内供には、あごの下まで垂れ下がる長い鼻があった。食事にも不便な鼻だが、内供が何より苦しんでいたのは、人からどう見られるかということだった。それでも、鼻を気にしていると思われたくない。経典に自分のような鼻の持ち主を探し、短くする方法を試しても、悩みは消えなかった。あるとき、弟子が鼻を短くする方法を聞いてくる。内供は平静を装いながら、その方法を試し、ついに普通の長さの鼻を手に入れる。", "ところが、願いがかなった後、人々は以前にも増して内供を笑うようになる。周囲の態度を理解できない内供は、いら立ちを募らせていく。ある朝、鼻は元の長さに戻っていた。鏡に映る自分を確かめた内供は、以前の姿に戻ったにもかかわらず、不思議な安心を感じる。これでもう誰も笑わないだろうと思う内供の心は、外見だけを変えても解けなかった悩みを浮かび上がらせる。"], "questions": ["鼻を短くする前と後で、内供の願いと周囲の反応はどう食い違っているだろう。", "人の悩みが解消したとき、素直に喜べないことはあるだろうか。自分の気持ちと語り手の説明を比べてみよう。"], "cat": "literature", "name": "鼻", "sub": "芥川龍之介｜1916年発表", "motif": "ripple", "gist": "悩みの種がなくなれば、幸せになれるはずだった。長い鼻をめぐり、自尊心と他人の視線が交錯する物語。", "intro": "長い鼻に悩む僧の禅智内供は、人からどう見られているかが気になって仕方がない。それでも、鼻を気にしているとは知られたくない。そんな内供のもとへ、弟子が鼻を短くする方法を持ち帰る。", "people": [["禅智内供", "長い鼻と、人からの見られ方を気にする僧。"], ["弟子・周囲の人々", "鼻を短くする方法を伝えたり、変化した内供を笑ったりする人々。"]], "theme": "作品は、当人の自尊心だけでなく、他人の不幸には同情しても、その人が悩みから抜け出すと別の感情を抱く、周囲の複雑な心理も描く。内供の安心が本当に問題の解決なのか、結末から考えることもできる。", "memory": "鼻の長さよりも、他人の目に心が揺れる。", "links": ["akutagawa", "rashomon"], "sources": [{"title": "青空文庫「鼻」本文", "url": "https://www.aozora.gr.jp/cards/000879/files/42_15228.html"}, {"title": "青空文庫 図書カード（初出：1916年2月）", "url": "https://www.aozora.gr.jp/cards/000879/card42.html"}]}, {"id": "spider", "image": "assets/spider.webp", "imageAlt": "蓮池と蜘蛛の糸を描いた作品イメージ", "synopsisSummary": ["ある朝、極楽の蓮池のほとりを歩いていた釈迦は、池の底に広がる地獄をのぞき見る。そこには、血の池で苦しむ犍陀多という男がいた。犍陀多は多くの悪事を働いたが、生前、一匹の蜘蛛を踏み殺さずに助けたことがあった。釈迦はその小さな善行を思い出し、極楽の蜘蛛の糸を地獄へ垂らす。糸を見つけた犍陀多は、これを登れば地獄から抜け出せると考え、夢中で上を目指す。しばらく登って休み、下を見ると、無数の罪人たちが同じ糸を伝って続いていた。", "犍陀多は、その重さで糸が切れれば自分も落ちてしまうと恐れる。そして、この糸は自分のものだ、下りろ、と叫ぶ。その瞬間、糸は犍陀多の上で切れ、男は再び地獄へ落ちていった。釈迦はその一部始終を見て悲しそうな顔をし、歩き続ける。極楽では、何事もなかったように蓮の花が香りを漂わせている。"], "questions": ["犍陀多は、与えられた糸をいつから「自分のもの」と考えたのだろう。言葉の変化に注目してみよう。", "限られた機会を他の人と分かち合う場面で、不安は判断にどう影響するだろう。作品と現実の違いにも目を向けよう。"], "cat": "literature", "name": "蜘蛛の糸", "sub": "芥川龍之介｜1918年発表", "motif": "thread", "gist": "一本の糸にすがった男は、後から来る人々を拒んだ。救いを独り占めしようとする心を描く物語。", "intro": "地獄で苦しむ犍陀多は、生前に多くの悪事を働いた男だった。けれども、一度だけ小さな蜘蛛の命を助けたことがある。極楽からその姿を見た釈迦は、その善行を思い出し、一本の蜘蛛の糸を垂らす。", "people": [["犍陀多（かんだた）", "地獄から逃れようと蜘蛛の糸を登る男。"], ["釈迦", "犍陀多の小さな善行を思い出し、救いの糸を垂らす。"]], "theme": "小さな善行によって与えられた救いの機会を、犍陀多はどう受け止めたのか。糸を「自分のもの」と考えた瞬間に注目すると、利己心と救済の関係を読み取れる。", "memory": "登る高さよりも、他者に向ける心が問われる。", "links": ["akutagawa", "rashomon"], "sources": [{"title": "青空文庫「蜘蛛の糸」本文", "url": "https://www.aozora.gr.jp/cards/000879/files/92_14545.html"}, {"title": "青空文庫 図書カード（初出：1918年7月）", "url": "https://www.aozora.gr.jp/cards/000879/card92.html"}]}, {"id": "kawasaki", "cat": "region", "name": "川崎区ゆるキャラ大図鑑", "sub": "地域文化｜企画・準備中", "motif": "town", "gist": "地域の産業・歴史・文化を、オリジナルキャラクターから知る。これから育てる川崎区の図鑑。", "intro": "川崎区に実在する、または歴史的に存在した題材を調べ、オリジナルキャラクターと解説を組み合わせる企画です。産業、港湾、交通、寺社、暮らしなどを入口に、人物や場所、時代のつながりを紹介する構成を考えています。現在は企画段階で、個別キャラクターや解説記事は未掲載です。公的資料などで事実と出典を確かめ、創作部分とは分けて追加していきます。", "people": [["今後の掲載方針", "題材の名称、確認した出典、史実と創作の区別、確認日を記録する。"], ["キャラクターについて", "このサイト独自の創作を予定。自治体公認や既存の公式キャラクターであることを意味しない。"]], "theme": "親しみやすい入口から、元になった地域の本当の姿へ進める図鑑を目指す。まだ確認できていない歴史、所在地、関係性は事実として掲載しない。", "memory": "キャラクターの向こうにある、地域の物語をたどる。", "links": [], "sources": [{"title": "川崎市公式「川崎区の概要」", "url": "https://www.city.kawasaki.jp/kawasaki/page/0000026330.html"}]}, {"id": "melos", "cat": "literature", "name": "走れメロス", "sub": "太宰治｜1940年発表", "motif": "road", "gist": "約束の時までに戻らなければ、友が処刑される。迷いと疲労の中を走る男を通して、信頼を問い直す物語。", "intro": "人を信じず、次々と人を殺す王に怒った羊飼いのメロスは、捕らえられて死刑を宣告される。妹の婚礼を済ませるため、友を身代わりに残して村へ帰ることになった。約束の期限は、三日目の日没である。", "synopsisSummary": ["羊飼いのメロスは、妹の婚礼の買い物に来た町で、王が人を信じず、多くの人々を殺していると知る。怒ったメロスは王城へ入り、捕らえられて死刑を宣告される。妹の結婚式を済ませたいと願い、友人セリヌンティウスを身代わりに残して、三日目の日没までに戻る約束をする。村へ帰ったメロスは妹の婚礼を見届け、再び町へ向かう。途中、川の氾濫や山賊に阻まれ、疲れ果てて一度は約束を投げ出しそうになる。", "それでも泉の水で力を取り戻し、待つ友のもとへ走る。処刑の直前に到着したメロスは、自分が途中で弱い心を抱いたことを友に告白する。友もまた、一度だけメロスを疑ったと打ち明ける。二人は互いを殴って抱き合い、その姿を見た王は、人の心の真実を認めて仲間に入れてほしいと願う。人々の歓声の中、メロスは少女からマントを差し出され、裸体を友に指摘されて赤面する。"], "people": [["メロス", "王に怒り、友との約束を守るために帰路を走る羊飼い。"], ["セリヌンティウス", "メロスの身代わりとして刑場で待つ友人。"], ["王ディオニス", "人を信じず、メロスが戻らないことを予想する王。"]], "theme": "信頼は、疑いや弱さが一度も生まれないことなのだろうか。二人が再会後に互いの揺らぎを告白する場面を読むと、信頼を支える行動や正直さにも目を向けられる。これは読み方の一例で、作品を単純な教訓だけに限定するものではない。", "memory": "走り切った結果だけでなく、途中の迷いと再会後の告白を読む。", "questions": ["メロスが走る理由は、出発時と泉の水を飲んだ後でどう変わっているだろう。", "相手を一度疑ったことと、信頼を失うことは同じだろうか。二人の告白を手がかりに考えてみよう。"], "links": ["rashomon", "gongitsune"], "sources": [{"title": "青空文庫「走れメロス」本文", "url": "https://www.aozora.gr.jp/cards/000035/files/1567_14913.html"}, {"title": "青空文庫 図書カード", "url": "https://www.aozora.gr.jp/cards/000035/card1567.html"}, {"title": "国立国会図書館 レファレンス協同データベース（1940年5月の掲載調査）", "url": "https://crd.ndl.go.jp/reference/detail?page=ref_view&id=1000244878"}]}, {"id": "restaurant", "cat": "literature", "name": "注文の多い料理店", "sub": "宮沢賢治｜1924年・同名童話集収録の一編", "motif": "doors", "gist": "歓迎されていると思って進んだ料理店で、客自身が料理されようとしていた。言葉の受け取り方が逆転する物語。", "intro": "山奥へ狩りに来た二人の紳士は、案内人とはぐれ、空腹のまま道に迷ってしまう。そこへ現れたのが、西洋料理店「山猫軒」。歓迎の言葉に安心して入るが、奥へ進むたびに、扉には不思議な注文が書かれている。", "synopsisSummary": ["二人の若い紳士が、猟銃と犬を連れて山奥へ狩りに出かける。獲物は見つからず、案内人ともはぐれ、二匹の犬も倒れてしまう。腹をすかせた二人は、西洋料理店「山猫軒」を見つける。入口には歓迎の言葉があり、奥へ進むたびに、扉に次々と指示が書かれている。髪や靴をきれいにし、鉄砲を置き、帽子・外套・靴を脱ぎ、金属の品を外すこと。二人はどれも、立派な店の作法や、料理を食べるための準備だと都合よく考えて従う。", "さらにクリームを塗り、酢くさい香水を振りかけ、塩を体にもみ込むよう求められたところで、自分たちが食べられる側なのだと気づく。奥から聞こえる声におびえ、泣き出した二人の顔は、紙くずのようにしわくちゃになる。そこへ先ほどの犬が現れて奥へ飛び込み、料理店は消える。案内人と再会して東京へ帰った二人だが、その顔は元には戻らない。"], "people": [["二人の紳士", "狩りに来た青年たち。店の注文を自分たちに都合よく理解する。"], ["山猫軒の奥の声", "二人を奥へ誘い、料理の準備を進める存在。"], ["二匹の犬", "店の奥へ飛び込み、危機の場面を変える。"]], "theme": "同じ言葉でも、受け手の期待によって意味が違って見える。二人が注文をどう説明しているかを追うと、危険の手がかりを見落とす仕組みが浮かぶ。また、動物を狩る人間が食べられる側になる逆転から、人と自然の関係を考える読み方もできる。", "memory": "扉の言葉を、客の側と店の側の両方から読み直す。", "questions": ["どの扉の言葉から、二人とは違う意味を読み取れただろう。初めに戻って確かめてみよう。", "期待していることに合う説明だけを選んでしまう場面は、日常にもあるだろうか。物語との違いも考えよう。"], "links": ["spider", "gongitsune"], "sources": [{"title": "青空文庫「注文の多い料理店」本文", "url": "https://www.aozora.gr.jp/cards/000081/files/43754_17659.html"}, {"title": "青空文庫 図書カード（1924年刊行の童話集に収録）", "url": "https://www.aozora.gr.jp/cards/000081/card43754.html"}]}, {"id": "gongitsune", "cat": "literature", "name": "ごん狐", "sub": "新美南吉｜1932年発表", "motif": "fox", "gist": "いたずらを悔いた狐は、名乗らずに贈り物を届け続けた。思いが相手へ届くまでのすれ違いを描く物語。", "intro": "ひとりぼっちの小狐ごんは、村の人にいたずらをして暮らしている。ある日、兵十が川で捕った魚を逃がし、うなぎを持ち去ってしまった。しばらくして兵十の母の葬式を見たごんは、自分のしたことが気になり始める。", "synopsisSummary": ["村の近くに住む小狐のごんは、ひとりぼっちで、いたずらばかりしていた。ある日、兵十が川で捕った魚を逃がし、うなぎも持ち去る。やがて兵十の母の葬式を見たごんは、あのうなぎは病気の母に食べさせるものだったのではないかと思い、後悔する。自分と同じひとりぼっちになった兵十のために、ごんは償いを始める。最初は魚屋から盗んだいわしを家に入れるが、兵十は盗人と思われて殴られてしまう。その後、ごんは栗や松たけを届けるようになる。", "贈り主を知らない兵十は、加助から神様のしわざだと言われる。話を聞いたごんは、自分に礼を言ってもらえないことを面白くないと感じる。ある日、栗を持って家に入ったごんを見た兵十は、またいたずらに来たと思い、火縄銃で撃つ。土間に置かれた栗を見て初めて贈り主に気づいた兵十が問いかけると、ごんは目をつぶったままうなずく。銃口から青い煙が出る中、物語は終わる。"], "people": [["ごん", "ひとりぼっちの小狐。いたずらを悔い、兵十へ贈り物を届ける。"], ["兵十（ひょうじゅう）", "母を亡くした村人。贈り主がごんだとは知らない。"], ["加助（かすけ）", "不思議な贈り物は神様のしわざではないかと話す村人。"]], "theme": "ごんが知っていることと、兵十が知っていることは異なる。善意があっても、相手がその意図を知らなければ同じようには受け取れない。二人のすれ違いを情報の差から読むと、単にどちらか一方を責めるだけでは捉えきれない悲しさに気づける。", "memory": "何が起きたかに加えて、誰が何を知っていたかをたどる。", "questions": ["それぞれの場面で、ごんだけが知っていること、兵十だけが知っていることを分けてみよう。", "よかれと思った行動が違う意味に受け取られるのは、どんなときだろう。作品にない解決を正解とせず考えてみよう。"], "links": ["hana", "melos"], "sources": [{"title": "青空文庫「ごん狐」本文", "url": "https://www.aozora.gr.jp/cards/000121/files/628_14895.html"}, {"title": "青空文庫 図書カード（初出：1932年1月）", "url": "https://www.aozora.gr.jp/cards/000121/card628.html"}]}];
const finalThoughts={"rashomon": "下人は老婆を責めていたのに、「生きるためだ」という話を聞くと、同じ理由で老婆の着物を奪います。相手には許せなかった行いを、自分がする側に回ってしまったのです。追い詰められたとき、人は自分に都合のよい理由をつけてしまうことがある。下人の変わり方から、善悪の判断が揺れる怖さが伝わってきます。", "hana": "内供は、鼻を短くすれば笑われなくなると思っていましたが、周囲の反応は逆でした。長い鼻に戻って安心する姿を見ると、苦しさは鼻そのものだけでなく、人にどう見られるかにもあったと分かります。周りの人も、悩んでいた内供が喜ぶと素直には喜びません。自分の気持ちも他人の気持ちも、外見を変えるだけでは思いどおりにならない。そのおかしさと切なさが残る話です。", "spider": "犍陀多は自分も落ちるのを恐れ、後から来る人を追い払おうとします。その直後に糸は切れ、せっかく与えられた救いの機会を失ってしまいました。助かりたいという気持ちが、自分だけ助かればよいという考えに変わってしまったのです。他の人を受け入れられなかった犍陀多の姿に、この話の悲しさがあります。", "melos": "メロスは諦めかけても走って戻り、友も一度は疑いながら待ち続けました。再会した二人は、その弱さを隠さず話して抱き合います。信じ合うとは、一度も迷わないことだけではなく、迷ったあとに相手のために行動し、正直に向き合うことでもある。二人の姿から、そんな受け取り方のできる物語です。", "restaurant": "二人は歓迎されていると思い込み、おかしな注文にも都合のよい理由をつけて従っていました。自分たちが食べられると気づいたときには、すっかり店の言いなりになっていたのです。食べたいものを探していた二人が、食べられる側に回ってしまう。その逆転を通して、自分に都合のよい見方だけでは、目の前の危険にも気づけないことが見えてきます。", "gongitsune": "ごんは償おうとしていましたが、その気持ちは兵十に伝わらず、撃たれてしまいます。兵十が贈り主はごんだったと気づくのは、その後でした。善意があっても、相手がその意図を知らなければ、同じようには受け取れない。相手を思いながらもすれ違ってしまう、その悲しさが残る物語です。"};

function card(x){return `<a class="card ${x.cat}" href="#/article/${x.id}"><div class="card-visual${x.image?' illustrated':''}">${x.image?storyImage(x,'card'):art(x)}</div><div class="cardbody"><span class="label">${catNames[x.cat]}${x.id==='kawasaki'?' · 準備中':''}</span><h3>${esc(x.name)}</h3><span class="meta">${esc(x.sub)}</span><p>${esc(x.gist)}</p><span class="readmore">${x.id==='kawasaki'?'企画を読む':'詳しく読む'} <span aria-hidden="true">→</span></span></div></a>`}

function renderList(){const q=query.normalize('NFKC').toLowerCase();const found=items.filter(x=>(category==='all'||x.cat===category)&&[x.name,x.sub,x.gist,x.intro,...(x.synopsisSummary||[])].join(' ').normalize('NFKC').toLowerCase().includes(q));main.innerHTML=`<div class="sectionhead"><h2>知識の扉をひらく</h2><span class="count" role="status">${found.length}件${category==='all'&&!query?' · 企画を含む':''}</span></div>${found.length?`<div class="grid">${found.map(card).join('')}</div>`:'<div class="empty"><h2>該当する項目がありません</h2><p>別の言葉で検索するか、分野の絞り込みを外してみてください。</p><button class="reset" id="reset">すべての項目を見る</button></div>'}<aside class="editorial"><strong>この図鑑について</strong><p>登場人物を知り、あらすじから要約、まとめ、原典へ。出来事と解釈を分け、今の暮らしにもつながる問いを育てます。文学の解説には読み方の一例を含みます。地域文化は企画段階です。『羅生門』『鼻』『蜘蛛の糸』の画像はAIによるイメージイラストです。実物の写真・史料・書籍の表紙ではありません。他の作品・人物・地域の図柄は本サイトのオリジナル装飾です。</p></aside>`;document.getElementById('reset')?.addEventListener('click',reset)}
function renderArticle(x){const literary=x.cat==='literature';main.innerHTML=`<button class="back" id="back">← 一覧に戻る</button><article class="article"><header class="articleheader"><div><span class="label">${catNames[x.cat]} / ${literary?'名作を読み解く':x.cat==='person'?'作品と人物をつなぐ':'地域を知る入口'}</span><h2>${esc(x.name)}</h2><p class="meta">${esc(x.sub)}</p></div>${x.image?`<figure class="story-figure">${storyImage(x,'article')}<figcaption>作品をもとにしたAIイメージイラスト</figcaption></figure>`:x.id==='kawasaki'?`<figure class="emblem-figure">${art(x)}<figcaption>図鑑オリジナルマーク<br>工場・港・多摩川をモチーフにした創作です。<br>市・区の公式マークではありません。</figcaption></figure>`:art(x)}</header><div class="content">${literary?`<section class="characters"><h3>登場人物</h3><ul class="people">${x.people.map(([n,d])=>`<li><strong>${esc(n)}</strong>${esc(d)}</li>`).join('')}</ul></section>`:''}<section class="synopsis"><h3>${literary?'あらすじ':'概要'}${literary?'<span class="badge">物語の入口</span>':''}</h3><p class="bodytext">${esc(x.intro)}</p></section>${literary?`<section class="digest"><h3>要約</h3><p class="subnote">ここからは結末まで紹介します。</p>${x.synopsisSummary.map(p=>`<p class="bodytext">${esc(p)}</p>`).join('')}</section>`:`<section class="gist"><h3>要点</h3><p class="summary-text">${esc(x.gist)}</p></section>`}${literary?`<section class="conclusion"><h3>まとめ</h3><p class="bodytext">${esc(finalThoughts[x.id])}</p><p class="subnote">作品の出来事を踏まえた、読み方の一例です。</p></section>`:''}${!literary?`<details><summary>${literary?'もっと知りたい方へ（補足）':'関連情報をもっと読む'}</summary><div class="deep">${!literary?`<h3>関連情報</h3><ul class="people">${x.people.map(([n,d])=>`<li><strong>${esc(n)}</strong>${esc(d)}</li>`).join('')}</ul>`:''}<h3>${literary?'作品の意味・読み方の一例':x.id==='kawasaki'?'制作の考え方':'作品を読む視点'}</h3><p class="bodytext">${esc(x.theme)}</p><h3>記憶に残るポイント</h3><p>${esc(x.memory)}</p>${literary?`<h3>考えるヒント</h3><p class="subnote">読み方の一例です。正解を決めるためではなく、本文の言葉と自分の経験を行き来する問いとして使ってください。</p><ul class="people">${x.questions.map(q=>`<li>${esc(q)}</li>`).join('')}</ul>`:''}</div></details>`:''}<details><summary>出典・確認情報</summary><p class="subnote">${x.id==='kawasaki'?'地域の調査に用いる公式情報の入口です。個別の地域記事の検証完了を意味しません。':'以下を確認し、本文は本サイト独自の言葉で要約しています。解釈は原典の事実記述と区別しています。'}</p><ul class="sources">${x.sources.map(s=>`<li><a href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">${esc(s.title)} ↗</a></li>`).join('')}</ul><p class="subnote">確認日：2026年11月1日。第三者の画像・写真の転載は行っていません。</p></details></div></article>${x.links.length?`<section class="related"><div class="sectionhead"><h2>知識をつなぐ、次の一冊・一人</h2></div><div class="grid">${x.links.map(id=>items.find(z=>z.id===id)).filter(Boolean).map(card).join('')}</div></section>`:''}`;document.getElementById('back').onclick=()=>{location.hash=lastListHash}}

function reset(){category='all';query='';showList();search.focus()}
search.addEventListener('input',()=>{query=search.value;const inArticle=location.hash.startsWith('#/article/');if(inArticle)history.pushState(null,'',listHash());showList(true)});
document.getElementById('clear').addEventListener('click',()=>{query='';showList();search.focus()});
document.querySelectorAll('[data-cat]').forEach(b=>b.addEventListener('click',()=>{category=b.dataset.cat;showList()}));
document.querySelector('.skip').addEventListener('click',e=>{e.preventDefault();main.focus({preventScroll:true});main.scrollIntoView({behavior:'auto',block:'start'})});
window.addEventListener('hashchange',()=>route({focus:true}));route();
</script>
