: 500, "height": 500}]}, {"name": "母親", "role": "小さな子どもを二人連れた旅人。侍が怒ったのではないかと心配する。", "wide": false, "portraits": [{"src": "assets/amedama-face-mother.webp", "label": "二人の子どもを連れた旅人", "alt": "母親の人物イメージ", "width": 500, "height": 500}]}, {"name": "子ども①", "role": "母親と舟に乗る二人のうち、先に飴だまを欲しがった子ども。", "wide": false, "portraits": [{"src": "assets/amedama-face-child-a.webp", "label": "先に飴を欲しがる子ども", "alt": "子ども①の人物イメージ", "width": 500, "height": 500}]}, {"name": "子ども②", "role": "もう一人の子ども。同じように飴だまを欲しがる。", "wide": false, "portraits": [{"src": "assets/amedama-face-child-b.webp", "label": "もう一人の子ども", "alt": "子ども②の人物イメージ", "width": 500, "height": 500}]}], "inlineIllustrations": [{"afterParagraph": 1, "src": "assets/amedama-ferry-nap-scene.webp", "alt": "暖かな渡し舟で侍は居眠りをし、子どもたちはその姿を見て笑います。", "caption": "暖かな渡し舟で侍は居眠りをし、子どもたちはその姿を見て笑います。", "width": 1200, "height": 800}, {"afterParagraph": 2, "src": "assets/amedama-one-candy-scene.webp", "alt": "飴だまは一つしかありません。母親は、目を覚ました侍が怒ったのではないかと心配します。", "caption": "飴だまは一つしかありません。母親は、目を覚ました侍が怒ったのではないかと心配します。", "width": 1200, "height": 800}, {"afterParagraph": 3, "src": "assets/amedama-share-candy-scene.webp", "alt": "侍は一つの飴だまを二つに割り、子どもたちに分けてくれます。", "caption": "侍は一つの飴だまを二つに割り、子どもたちに分けてくれます。", "width": 1200, "height": 800}], "characterGalleryNote": "顔、髪形、衣服や舟の細部は、作品に基づく創作です。子どもの性別や正確な年齢は原典では指定されていません。", "credits": [["新美南吉", "にいみなんきち", "著者"]], "image": "assets/amedama-ferry-nap-scene.webp", "imageAlt": "暖かな渡し舟で侍は居眠りをし、子どもたちはその姿を見て笑います。", "headerCaption": "暖かな渡し舟で侍は居眠りをし、子どもたちはその姿を見て笑います。", "characterNamesUseBodyReadings": true}];
const finalThoughts={"rashomon": "下人は老婆を責めていたのに、「生きるためだ」という話を聞くと、同じ理由で老婆の着物を奪います。相手には許せなかった行いを、自分がする側に回ってしまったのです。追い詰められたとき、人は自分に都合のよい理由をつけてしまうことがある。下人の変わり方から、善悪の判断が揺れる怖さが伝わってきます。", "hana": "内供は、鼻を短くすれば笑われなくなると思っていましたが、周囲の反応は逆でした。長い鼻に戻って安心する姿を見ると、苦しさは鼻そのものだけでなく、人にどう見られるかにもあったと分かります。周りの人も、悩んでいた内供が喜ぶと素直には喜びません。自分の気持ちも他人の気持ちも、外見を変えるだけでは思いどおりにならない。そのおかしさと切なさが残る話です。", "spider": "犍陀多は自分も落ちるのを恐れ、後から来る人を追い払おうとします。その直後に糸は切れ、せっかく与えられた救いの機会を失ってしまいました。助かりたいという気持ちが、自分だけ助かればよいという考えに変わってしまったのです。他の人を受け入れられなかった犍陀多の姿に、この話の悲しさがあります。", "melos": "メロスは諦めかけても走って戻り、友も一度は疑いながら待ち続けました。再会した二人は、その弱さを隠さず話して抱き合います。信じ合うとは、一度も迷わないことだけではなく、迷ったあとに相手のために行動し、正直に向き合うことでもある。二人の姿から、そんな受け取り方のできる物語です。", "restaurant": "二人は歓迎されていると思い込み、おかしな注文にも都合のよい理由をつけて従っていました。自分たちが食べられると気づいたときには、すっかり店の言いなりになっていたのです。食べたいものを探していた二人が、食べられる側に回ってしまう。その逆転を通して、自分に都合のよい見方だけでは、目の前の危険にも気づけないことが見えてきます。", "gongitsune": "ごんは償おうとしていましたが、その気持ちは兵十に伝わらず、撃たれてしまいます。兵十が贈り主はごんだったと気づくのは、その後でした。善意があっても、相手がその意図を知らなければ、同じようには受け取れない。相手を思いながらもすれ違ってしまう、その悲しさが残る物語です。", "gloves": "子狐は間違えて狐の手を出しましたが、帽子屋はお金を受け取り、手袋を売ってくれました。母が心配していたような出来事は起こらなかったのです。その話を聞いた母は、人間は本当に怖いだけの相手なのかと考え直し始めます。聞いていた話と、自分で出会って知ることは違う。その小さな違いが、相手を見る目を変えていく物語です。", "goshu": "ゴーシュは初め、訪ねてきた動物を邪魔に思い、怒って追い返していました。けれども一緒に音を出したり、頼みに応じて弾いたりする中で、演奏がよくなっていきます。人前で認められた夜、彼が思い出すのは、自分がつらく当たったかっこうでした。上達したことだけでなく、関わった相手を思いやれるようになったことにも、ゴーシュの変化が見える物語です。", "toshishun": "杜子春は仙人になるために黙り続けますが、苦しむ母が自分を気遣う声には耐えられず、母を呼びます。約束を破ったその言葉は、親を思う気持ちから出たものでした。鉄冠子はそれを責めず、杜子春は特別な力よりも、人間らしい正直な暮らしを望むようになります。何かを手に入れるために、大切な人への思いまで捨てなくてよい。杜子春の選び直しから、そう受け取れる物語です。", "yodaka": "よだかは見た目や名前を責められ、助けを求めた空でも冷たくされます。一方で、自分も虫の命を奪って生きていることに苦しんでいました。最後に星となる姿は、周囲に認められて問題が解決した結末ではありません。何が彼をそこまで追い詰めたのかを見つめると、外見だけで相手を決めつけず、言葉の向こうにある苦しみに気づく大切さが伝わってきます。", "trolley": "良平はトロッコに乗れて大喜びしますが、遠くへ進むほど帰りが気になり、一人で帰るよう言われると強い心細さに襲われます。家に着いて泣き出したのは、ようやく怖さをこらえなくてよくなったからとも読めます。楽しかったはずの一日が、大人になっても心細い記憶として残りました。子供にとっては、慣れた場所から離れ、頼れる人がいなくなること自体が、大きな出来事なのです。", "lamp": "巳之助は仕事を失うのが怖くて区長を恨みますが、古い道具の不便さに気づき、火をつけるのをやめます。大切にしてきたランプと別れ、本屋として生きる道を選びました。ただし後年は、ランプを壊す以外の方法もあったと振り返ります。自分が築いたものを大切にすることと、変化に合わせてやり方を変えることは、どちらも必要なのだと読める物語です。", "ginga": "ジョバンニは、カムパネルラとずっと一緒にいたいと願いました。けれども友人は列車から消え、目覚めたあと、別の子を助けて川から戻らなかったと知ります。銀河の旅は、亡くなる友人との最後の時間だったとも読めます。命を誰かの役に立てたいと願った蠍の話も、友人の行動と重なって見えます。ただし、死ぬことが幸せだという答えではありません。大切な友人を失い、それでも母のもとへ走るジョバンニ。残された自分はどう生きるのか、本当の幸せとは何か。その問いが残る物語です。", "botchan": "主人公は赤シャツたちを殴って学校を去りますが、それで学校の問題がすべて解決したわけではありません。腹を立てる勢いの強さには、曲がったことを嫌う気持ちと、相手を早く決めつけてしまう危うさの両方があります。東京へ帰った彼が大切にしたのは、昔から自分を信じてくれた清でした。人にうまく合わせられない青年にも、信じてくれる人への深い愛着がある。そのことが最後まで伝わる物語です。", "cat": "猫は人間の会話を聞き、学問や金や世間体を大事にする人たちの、言葉と行動のずれを笑います。けれども猫自身も自信満々で、いつも正しく物を見ているとは限りません。最後には、その猫も思いがけない事故で命を落とします。誰かを偉そうに批評している自分も、別の目から見れば滑稽かもしれない。人間を少し外から眺める猫の視点が、私たち自身の見栄や思い込みを映す物語です。", "kokoro": "先生はKに気持ちを打ち明けないまま結婚の話を進め、Kの死後も、その過去を妻に話せずに生きました。最後に「私」へ手紙を書いても、妻には知らせないでほしいと願います。人を求めながら、本当のことを伝えられない。その苦しさが、先生の孤独を深くしていきました。先生が死を選ぶ決意は、罪を償う唯一の正しい方法として受け取る必要はありません。言えない気持ちを一人で抱え続けることの重さが残る物語です。", "lemon": "私の病気や借金が解決したわけではありません。それでも、一個の檸檬の冷たさや香りを感じ、本の上に置いて空想することで、重苦しい世界が一時的に違って見えました。最後の笑みは、現実を壊した結果ではなく、想像の中で気持ちが軽くなった瞬間です。小さな物との出会いや、見方を変える遊びが、心に少し余白をつくることもあると読める物語です。", "sangetsuki": "李徴は才能を認めてもらいたいのに、評価されて傷つくことを恐れ、人に学ぶことから遠ざかっていました。虎になってもまず詩を残したいと願い、そのあとで家族を思い出した自分を恥じます。自分を守ろうとする気持ちが、学ぶ機会や大切な人とのつながりを狭めてしまうことがある。旧友にようやく本音を語る李徴の姿から、そんな苦しさが伝わります。虎になった理由を一つの罰として決めつけるのではなく、彼自身の後悔を聞く物語です。", "yumejuya": "十の夢は、一つの筋や一つの答えにつながるわけではありません。待っても時間が分からない、忘れたはずの過去が戻る、見えているものを自分では作れない。夢の中の人たちは、思いどおりにならない出来事に出会います。はっきり説明しきれないまま残る不思議さが、私たち自身の記憶や不安に重なることもある。すべてを一つの意味に決めず、心に残った夢から読み返せる作品です。", "takasebune": "喜助は、行き先とわずかな金があることを、それまでの生活と比べて喜びます。その言葉に庄兵衛は、自分が何を求めて暮らしているのか考えさせられました。さらに弟の話を聞くと、罪の名前だけでは、喜助の気持ちや行為を割り切れなくなります。物語は、弟を死なせたことが正しいと結論づけず、庄兵衛の迷いを残して終わります。人を判断する前に、その人が置かれた事情を聞くことの重さが伝わる話です。", "maihime": "豊太郎はエリスとの暮らしを大切にしながら、日本へ戻る誘いにも断れずにうなずきます。肝心の話を彼女へ伝えられないまま、別れは別の人の口から知らされました。最後に親友を恨む気持ちが残っても、帰国を承諾したのは豊太郎自身です。仕事も人とのつながりも失いたくない。その迷いを言葉にせず、決断を先へ延ばすことで、相手を深く傷つけてしまうことがあると読める物語です。", "ningen": "葉蔵は人とつながりたいのに、人を怖がり、おどけることで本音を隠してきました。手記では自分を激しく否定しますが、あとがきの女性は、同じ人物を別の温かい目で振り返ります。「人間失格」という言葉は、葉蔵が自分へ向けた見方であり、人としての価値を決める客観的な判定ではありません。自分には悪いところしか見えないときでも、他の人には違う姿が見えている。その食い違いにも目を向けたい物語です。", "yamanashi": "五月、かにの子どもたちは魚が鳥に連れ去られるのを見て震えます。十二月には、落ちてきた実の香りをかぎ、父親と楽しみを分かち合って帰ります。同じ自然が、怖い出来事も嬉しい実りも運んでくる。その違いを、かにたちの目と気持ちを通して感じられる物語です。クラムボンの正体は本文では明かされず、一つに決めつける必要はありません。", "hitofusanobudo": "先生は、少年が絵の具を返し、悪かったと思っていることを確かめてから、葡萄を渡します。翌日にはジムが迎えてくれ、二人で新しい一房を分けてもらいます。盗みをなかったことにするのではなく、間違えた子がまた仲間の中へ戻れるようにする。先生の気遣いとジムの迎え方が、少年の心に長く残った物語です。", "sanshodayu": "姉に助けられて逃げた厨子王は、丹後で人を売り買いすることを禁じます。山椒大夫のもとでも、人々は給料を受け取って働くようになります。厨子王はやがて母と再会しますが、姉と父を取り戻すことはできません。自分だけ助かるのではなく、同じ苦しみを減らす行動へ進むこと。それでも消えない悲しさが、再会の喜びとともに残る物語です。", "crimeandpunishment": "ラスコーリニコフは人を殺した後も、自分は特別だという考えを捨てきれず、人を遠ざけます。ソーニャはその考えを認めるのではなく、罪を引き受けるよう促し、服役中も訪ね続けます。刑を受けただけで心が変わるわけではなく、彼は最後にようやく彼女への愛に気づきます。人を自分の理屈で踏み越えず、目の前の一人とつながり直す。その出発点までを描いた物語です。", "romeoandjuliet": "二人は一緒に生きるために結婚しますが、家の争い、友の死、追放、望まない縁談が重なります。助かるための計画も伝わらず、相手が死んだと思い込んだまま、取り返しのつかない結末に至ります。両家が争いをやめるのは、子どもたちを失った後です。命を絶つことが愛の理想なのではなく、相手の話を聞かず対立を重ねたことが、若者の生きる道を狭めた悲しさを読むことができます。", "donquixote": "ドン・キホーテは善いことをしようと旅に出ますが、思い込みから人を困らせ、自分も傷つきます。一方、正気のはずの公爵夫妻は、二人をだまして楽しんでいます。誰が立派なのかは、現実が見えるかどうかだけでは決まりません。最後にサンチョがまた一緒に旅をしようと願う姿からは、褒美を期待して始まった関係が、大切な友を失いたくない思いへ変わったことが伝わります。", "happyprince": "王子は宝石や金箔を人々に渡し、ツバメはそれを運び続けます。像の見た目が貧しくなると、市長たちは価値がなくなったと考えますが、最後に天使が選ぶのは捨てられた心臓とツバメでした。飾りの立派さではなく、誰の苦しみに気づき、どう関わったかが大切だと読むことができます。自分を犠牲にし尽くせという教訓ではなく、豊かな人々が何を見落としていたのかにも目を向けたい物語です。", "momotaro": "桃太郎は鬼を負かしますが、旅を支えたのは一人の力だけではありません。犬が船をこぎ、猿が門を開き、きじが空から助けます。それぞれの得意なことを生かしたから、宝を持って帰れました。手柄を褒めるおじいさんと、無事を喜ぶおばあさんの姿も印象的です。協力と成長の物語として読めますが、現実の戦いや略奪を正当化する教訓にする必要はありません。", "redcap": "最初の赤ずきんは狼に行き先を教え、寄り道をしている間に先回りされます。助けられた後、別の狼に出会ったときは、その誘いに乗らず、おばあさんへ知らせました。二人で戸を閉め、力を合わせたことで、今度は無事に帰れます。言いつけを守るだけでなく、経験から学び、困ったときに一人で抱え込まないことの大切さも読み取れます。", "orion": "オリオンはどんな獣にも勝てると誇りますが、ガイアが送ったサソリに命を奪われます。それでもアルテミスは彼を惜しみ、星空に居場所を求めました。自分の力を信じすぎる怖さと、亡くなった人を忘れたくない思いが重なります。一方、弓の異伝では、アルテミスがだまされて大切な相手を失う悲しみが中心です。同じオリオン座にも、違う物語が語り継がれています。", "andromeda": "アンドロメダは自分の行いではなく、母の言葉のために怪物へ差し出されます。ペルセウスが救い、結婚した後も、以前の婚約者との争いに巻き込まれました。勇者の活躍を読む一方で、彼女の命や結婚が周りの人に決められてしまうことにも気づきます。助かったことを喜ぶのと、古代の物語の価値観をそのまま今の正しさとするのは、別のことです。", "aliceinwonderland": "アリスは体の大きさにも会話にも振り回されますが、最後の裁判では、王や女王の言うことをそのまま受け入れません。理由のない規則や命令に、おかしいと声を上げます。冒険は夢だったものの、姉はその話を受け取り、いつか妹が子どもたちへ物語を伝える姿を思い浮かべました。不思議を楽しむ気持ちと、納得できないことを問い直す力の両方が残る物語です。", "cinderella": "シンデレラは妖精に助けられて舞踏会へ行き、最後には自分から靴を試したいと申し出ます。王子と結婚した後、姉たちを許し、二人の暮らしも支えました。美しい衣装だけでなく、誰かの助けと、自分で声を上げることが彼女の道を開きます。姉たちを許すのはこの物語の彼女の選択であり、いじめられた人は必ず我慢して許すべきだ、という教訓にする必要はありません。", "urashimataro": "浦島は亀を助け、竜宮でもてなされますが、帰ると家も両親も失われていました。箱を開けたのは、ただ珍しいものを見たかったからではなく、竜宮へ戻る手がかりを求めたためです。それでも三百年の時間は戻らず、彼は老人になって浜に残ります。約束を破った罰だけでなく、帰る場所を失った人の孤独と、楽しかった時間を取り戻せない悲しさが残る物語です。", "hansel": "ヘンゼルは小石で帰り道を残し、捕まった後も細い骨で時間をかせぎます。けれども最後に魔女のたくらみを見抜き、兄を助けたのはグレーテルでした。二人は得意なやり方を出し合い、水辺も一人ずつ渡って家へ帰ります。父との再会と暮らしの回復で終わりますが、置き去りが正しかったことにはなりません。安心できる場所を失った子どもたちが、互いを支えて危険を抜け出す物語です。", "uglyduckling": "ひなは見た目を笑われ、小屋では猫や雌鶏と同じことができないと否定されます。けれども春、水に映った自分を見て、もともと白鳥だったと知り、仲間に迎えられました。周りの物差しに合わないことと、その子に価値がないことは同じではありません。美しくなったからいじめが終わってよかった、だけではなく、姿が違っていても傷つけてよい理由にはならない、と読むことができます。", "mermaid": "人魚姫は王子を助けたことを伝えられず、王子は別の姫と結婚します。自分が生きるために王子を殺す道も選ばず、最後には空気の精として善い行いを重ねる道へ進みました。恋がかなわなければ何も残らない、という終わりではなく、願いをかなえる方法が変わる結末です。魂を得るという作品の世界観を踏まえて読みつつ、愛のために声や自分自身を犠牲にすべきだという教訓にする必要はありません。", "wizardofoz": "かかしは贈り物をもらう前から知恵を働かせ、木こりは仲間を気遣い、ライオンは怖くても皆を守っていました。自分にはないと思っていた力を、すでに行動で示していたのです。ドロシーも、銀の靴の使い方を知り、仲間に助けられて家へ帰ります。旅は無駄だったのではなく、互いの力に気づき、それぞれの居場所を見つける時間になりました。", "treasure-island": "ジムは海賊の計画を知らせ、船を取り戻すなど仲間を助けますが、独断の行動で危険にも飛び込みます。シルバーもジムを守りながら自分の助命を図り、最後は金貨を持って逃げました。単純に頼れる人と悪い人へ分けられない大人の姿を、ジムは目の当たりにします。宝を得て帰っても悪夢は残り、冒険の成功だけでは埋められない怖さを知る物語です。", "kaguyahime": "求婚者たちはお金や作り話で姫を手に入れようとしますが、願いはかないません。けれども最後の別れは、姫にも育ての親にも止められませんでした。かぐや姫は月へ帰り、地上の人々には手紙や形見、悲しみが残ります。相手を自分のものにしたい思いと、離れたくないほど大切に思う気持ちは同じではない。その違いを、求婚の場面と家族の別れから読むことができます。", "snow-white": "王妃は鏡で順位を確かめ、白雪姫が上だと知るたびに、違う手口で追い詰めます。姫は小人たちに助けられ、最後には運ばれる棺の衝撃でリンゴのかけらが外れ、目を覚ましました。誰かと比べて一番でなければ満たされない心が、王妃を際限のない攻撃へ向かわせたと読めます。姫がだまされたことを責めたり、美しさや最後の厳しい罰をそのまま正しさの基準にしたりする必要はありません。", "pussinboots": "猫は主人を侯爵と呼び、王様への贈り物や偽の領地で、立派な人物だと思わせます。魔物には自慢を誘い、小さなネズミへ変えさせて勝ちました。若者は姫と結婚しますが、成功の陰にはうそや脅しもあります。猫の機転を楽しむだけでなく、人が肩書や服、周りの証言をどれほど信じてしまうかも読み取れます。賢ければ何をしてもよい、という教訓ではありません。", "emperors-new-clothes": "大臣も王様も何も見えませんが、愚かだと思われるのが怖くて、立派な布だとほめます。町の人々もそれに合わせ、子どもが口にして初めて、事実が広く語られました。それでも王様は行列を続け、家来もない裾を持つふりをやめません。間違いが分かることと、間違いを認めて行動を変えることは、別の難しさを持つ。その違いまで描く物語です。", "amanoiwato": "天照大御神は弟の乱暴を恐れ、岩屋に隠れます。神々は鏡や玉を作り、舞と笑いで外への関心を引き、最後には手を取って光を迎えました。計画する人、作る人、舞う人が違う役割を果たすことで、世界が変わります。ただし、笑いだけですべてが解決したのではありません。乱暴をしたスサノオには償いが求められ、天の世界から追い出されます。傷ついた側を責めるのではなく、協力して立て直し、原因にも向き合う物語として読めます。", "tanabata": "織姫と彦星は、一緒にいる喜びに夢中になって仕事を忘れ、引き離されます。年に一度会うことは許されますが、この版では雨なら鳥の橋がかからず、その願いもかないません。それでも二人は日々の仕事を続け、次の再会を待ちます。相手を思う気持ちと毎日の暮らしを、どう両立するか。会う場面だけでなく、会えない間も続く二人の思いが心に残る物語です。", "lesmiserables": "司教に迎えられたヴァルジャンは、生き直し、コゼットを育て、マリユスや追跡者ジャヴェールの命まで救います。それでも前科への偏見から、娘夫婦にも遠ざけられました。最後に真実が伝わり、彼は愛する二人に見守られます。人を過去の罪だけで決めつけないことが、次の誰かを救う力になる。一方で、ファンティーヌを追い詰めた貧困や偏見は、一人の親切だけでは消えません。人が変われる可能性と、人を苦境に置く社会の両方を見つめる物語です。", "frankenstein": "ヴィクターは命を生み出しますが、その存在を恐れて見捨てます。創造物は言葉や親切を学ぶものの、人に拒まれ、やがて無関係な人まで殺してしまいました。二人は復讐を重ね、最後まで取り返しのつかないものを失います。孤独な苦しみを理解することと、他人を傷つける行為を認めることは別です。つくる力には世話をする責任が伴い、望みを追い続けるだけでなく、ウォルトンのように他者の命のために立ち止まる選択もあると読めます。", "makuranososhi": "清少納言は、春の明け方や子どもの小さな動作から、心が動いた瞬間を選んで書き残します。宮廷の場面では、初めて仕えたときの恥ずかしさや、雪山をめぐる悔しさも見えてきます。遠い時代の人にも、今とつながる気持ちがあると感じられます。ただし、彼女の好みや身分による評価が、誰にとっても正しいわけではありません。同じものを好きになるためではなく、何を見て、どこに心を動かすかを、自分の暮らしと比べて読める本です。", "genjimonogatari": "光源氏は美しさと権力を持ち、多くの人に愛されます。それでも紫の上の願いを十分には受け止められず、その死を前に深く悲しみます。次の世代でも、薫は浮舟が返事をしない理由を理解しきれません。愛しているつもりでも、相手の望みが見えているとは限らない。華やかな暮らしの陰にある孤独や、愛される側の息苦しさまで描くことが、この長い物語の読みどころです。", "takekurabe": "美登利と信如は互いを意識しながら、からかいや誤解のために素直に話せません。門の外へ出された布は受け取られず、やがて二人はそれぞれの道へ進みます。最後に置かれた水仙の作り花の主は、はっきりとは示されません。子どもの世界から離れる寂しさに、家の仕事や町の人々が決める将来の重さが重なります。ただ恋が実らなかった話ではなく、自分の気持ちだけでは進む道を選べない子どもたちの物語として読めます。", "nigorie": "お力は人気者として振る舞いながら、貧しい過去と行き場のない不安を抱えています。源七は彼女への思いから離れられず、妻のお初と子どもまで追い詰めます。最後に、お力と源七の死が知らされますが、事件の場面やお力の意思は明らかにされません。噂を聞いた人が、そのまま死者の気持ちを知ったことにはならない。恋愛だけで人を説明せず、その人の仕事や貧困、語れなかった苦しみにも目を向けて読むことができます。", "christmas-carol": "スクルージは、自分の寂しい死とティムの死を未来の光景として見せられ、生き方を変えます。目覚めた後は、寄付をするだけでなく、甥とのつきあいを取り戻し、ボブの給料を上げて家族を助け続けます。最後にティムが生きていることが、未来は決まりきっていなかったと示します。大切なのは、怖がったり後悔したりするだけでなく、今そばにいる人への接し方を変え、それを続けることだと読めます。", "redheadedleague": "赤毛組合は店主を留守にするための仕掛けで、助手たちはその間に銀行へのトンネルを掘っていました。ホームズは銀行で待ち構え、侵入してきたクレイを捕らえます。百科事典の書き写しは、知識を集めるためではなく、店主をその場に引き留めるための仕事でした。ホームズは「何をさせられたか」だけでなく、その間に誰が何をできたかを考えます。安すぎる助手の給料、地下室へ通う習慣、汚れた膝、建物の位置が、一つの計画へつながります。ワトソンも同じ話を聞き同じ場所を見ますが、意味はすぐには分かりません。最後の説明によって、読者も先の場面を別の意味で見直せるところが面白さです。", "anne-green-gables": "初めは男の子でないため帰されそうだったアンが、最後にはマリラと大切な家を支える側になります。ギルバートとも意地を張り合う関係をほどき、友人として助け合う道を開きます。これは、失敗しない子になる話ではありません。自分の思いを大切にしながら、相手の事情にも目を向け、予定が変わっても学び続ける少女の成長を描いた作品です。", "hamlet": "ハムレットは劇を使って叔父の罪を確かめますが、自分もポローニアスを殺し、その息子レアティーズから復讐される立場になります。最後に叔父は倒れても、王子と家族の命は戻りません。考えすぎて動けない人の話だけではなく、確かめようとする慎重さと、衝動的な行動が同居する悲劇として読めます。生き残るホレイショーには、勝ち負けでは片づかない事情を伝える役目が残ります。", "tom-sawyer": "トムは、塀塗りでは人を巧みに動かしますが、裁判では自分が危険を引き受けてポッターを救います。ハックも、大人から厄介者と思われながら、夫人を守るために助けを求めます。二人の行動を見ると、行儀のよさと、人を思って行動することは同じではないと分かります。宝を得た後もハックは窮屈さを感じ、トムは遊びを考え続けるため、単純な「成功して大人になる話」には収まりません。", "little-princess": "セーラは、貧しくなってもベッキーと支え合い、自分より空腹な少女にパンを分けます。屋根裏に現れる「魔法」も、実際にはラム・ダスたちが用意した暖かさや食事でした。財産が戻った後は、その力を困っている子の食事に役立てようとします。何も言わず我慢すれば必ず報われる話というより、想像力に支えられる心と、現実に人を助ける行動の両方を描く物語として読めます。", "little-match-girl": "少女が炎の中に見るのは、暖かい場所、食事、そして自分を愛してくれる人でした。しかし現実の町では、そのどれも届かず、少女は亡くなります。祖母と神様のもとへ行く結末には、当時のキリスト教的な慰めが表れています。それを「死ねば幸せになれる」という勧めにせず、生きている少女に必要な助けが届かなかったことに目を向けて読むことができます。", "daddy-long-legs": "ジュディは援助によって大学へ進みますが、感謝して従うだけでは終わりません。奨学金や仕事を自分で選び、失敗した小説も書き直して、作家として収入を得始めます。最後には、支援者と愛する人が同じジャーヴィスだと分かります。幸福な恋の結末とともに、相手の正体を知らないジュディと、事情を知っていた男性との立場の違いにも目を向けると、自立を求める彼女の言葉がよりはっきり見えてきます。", "snow-queen": "カイを救ったのは、雪の女王を倒す武器ではありません。ゲルダがたどり着き、涙を流し、二人で歌や記憶を取り戻したことで、鏡のかけらがなくなりました。ゲルダの旅も、一人だけで成し遂げたものではなく、多くの人や動物の助けに支えられています。悪いところしか見えなくなったカイが、再び人とのつながりを感じられるようになる。その変化が、二人の帰還をただの冒険の終わり以上のものにしています。", "jack-and-the-beanstalk": "金貨が尽きると再び登り、金の卵を産む鶏を得ても、ジャックはもう一度出かけます。最後はハープの声で追われ、豆の木を切って帰り道を断ちました。勇気だけでなく、もっと欲しいと思う気持ちや、他人の物を持ち去る行動も、物語を動かしています。", "pinocchio": "ピノキオは、勉強すると約束しただけでは変わりません。遊びの国へ行ってロバにされ、海をさまよう末に父と再会します。最後は父を連れて脱出し、働いて暮らしを支え、妖精のためにも貯金を渡しました。人間の少年になる結末は、言葉だけの約束が毎日の行動へ変わったことと結びついています。", "pandora": "贈り物を送り出すゼウス、警告するプロメテウス、受け取るエピメテウス、壺を開けるパンドラ。それぞれの行動がつながって、人間の暮らしが変わります。希望が中に残る結末は、「希望が人間に守られた」とも「人間へ届かず閉じ込められた」とも考えられ、本文だけから一つの意味に決めつけない読み方が大切です。", "gakumon-no-susume": "この本は、生まれつきの身分に頼らず学ぶという話から始まり、最後は他者と交流し、信頼を築く話へ進みます。独立は何でも一人で抱えることではなく、自分で考えながら人と協力することにもつながっています。ただし、貧困や職業、外国などを評価する言葉には当時の偏りもあります。すべてを今の正解とせず、著者の主張と自分の考えを比べて読める本です。", "utayomi-ni-atauru-sho": "子規の議論は、有名な歌への批判から始まり、具体的な言葉や調子の分析を経て、自分の感覚で表現を選ぶことへ進みます。感情や空想を捨てることが目的ではなく、それらをどう生き生きと伝えるかが問題なのです。ただし、子規の厳しい評価が、どの時代の誰にとっても唯一の正解とは限りません。ほめる理由と批判する理由を確かめながら、自分ならどう読むかを考えられる本です。", "time-machine": "時間旅行者は機械を取り戻して帰りますが、ウィーナを連れ帰ることはできません。さらに再出発した後の行方も、分からないままです。最初は楽園に見えた未来が、調べるほど別の姿を見せるため、見た目だけの判断が何度も問い直されます。最後の二本の花は、進歩への不安だけでなく、人を思いやる気持ちも物語に残しています。", "oku-no-hosomichi": "芭蕉は各地の名所を巡り、人に助けられ、昔の栄華や亡き人を思いながら大垣へ着きます。そこで曽良たちと再会しても、すぐ次の伊勢への旅に出ます。この作品は、道順を知らせるだけの旅行記ではありません。選び直された体験と句を通して、景色を見た心の動きや、出会っては別れる人の営みを読むことができます。", "bushido": "この本は、武士道の成り立ちから個々の徳目をたどり、その影響と将来へ進みます。勇気だけでなく思いやり、礼儀だけでなく誠実さ、服従だけでなく良心を重視する点が読みどころです。ただし、日本のすべての武士や民衆が、この通りに生きていたことを証明する歴史書ではありません。新渡戸による説明と理想として読み、共感できる価値と、身分や性別による制限を含む考えを分けて確かめられます。", "ichiaku-no-suna": "この歌集には、貧しい暮らしの苦しさだけでなく、友への感謝と後悔、故郷への親しみと痛み、ささやかな心地よさが並んでいます。巻末の幼い子の喪失も、単純な教訓に置き換えられてはいません。一首ずつ、何を見たり聞いたりしたところから気持ちが動いたのかを読むと、短い言葉の広がりが見えてきます。伝記は手がかりになりますが、歌の「我」の言葉をすべて実際の出来事の記録と決めつけないことも大切です。", "kanashiki-gangu": "最後に残るのは、死の場面ではなく、夕空を眺め、白い犬を飼おうかと妻に話しかける日常です。歌集には家族への愛情だけでなく、いらだちや自分への戸惑いも並びます。悲しい歌だけ、明るい歌だけに分けず、何をきっかけに心が動いたのかを一首ずつ読むと、短い言葉の奥行きが見えてきます。", "ame-ni-mo-makezu": "この詩は、すべてを成し遂げた人の記録ではなく、そういう者になりたいという願いとして結ばれます。稲の束を背負うような具体的な助けと、涙を流しておろおろする姿が、同じ願いの中にあります。強くあることと、人の困難に心を動かされることの関係を読むことができます。", "tsuru-no-ongaeshi": "妻の布に助けられたムサイでしたが、二度目の機織りを覗き、母に返事をしたことで、妻に見ていたことが知られます。鶴は去り、母子は以前の田仕事と貧しい暮らしへ戻りました。この版は、援助を受けることだけでなく、相手が求めた約束や境界をどう扱ったかも考えさせます。妻が家族のために尽くすことを、誰もが当然に負う義務として読む必要はありません。", "mikan": "少女は、見送りに来た弟たちへ蜜柑を投げるために窓を開けていました。その行動を見て、「私」は最初の嫌悪だけでは捉えられなかった少女の姿に気づきます。変わったのは少女の服装や暮らしではなく、「私」の見方です。人生の悩みがすべて解決するのではなく、ほんの短い出来事が心を明るくする結末になっています。", "fugaku-hyakkei": "初めは出来すぎた景色だと嫌っていた富士に、「私」は最後にお礼と別れを告げます。その間には、写真を見せる茶店の人、花を指す老女、結婚や執筆を支える人々とのやり取りがありました。ただし、最後の写真で女性二人を写さないように、語り手の気取りや身勝手さも消えてはいません。悩みがすべて解決した成功談ではなく、人や風景を受け止め直していく話として読めます。", "imogayu": "五位は、ただ食べすぎて芋粥が嫌いになったのではありません。用意された量に圧倒され、口をつける前から食べたい気持ちが薄れていました。十分に飲めるようになった後で懐かしむのは、つらい日々にも願いを持っていた自分です。望みを持つ時間と、実際に満たされることの違いに加え、断りにくいもてなしの中で揺れる心も描かれています。", "joseito": "夜には母と親しく話せても、少女の迷いがすべて消えるわけではありません。それでも、夕空や花の美しさ、人の親切、母の心遣いに、心が動く瞬間があります。最後にカアを明日はかわいがろうと思うところも、小さな変化です。少女の言葉をそのまま正しい意見と決めず、誰を責め、いつ自分を振り返り、何に救われているかを追うと、一日の奥行きが見えてきます。", "nogiku-no-haka": "政夫は民子と再会できないまま、その死を知らされます。墓に野菊を植えても、別れを取り消すことはできません。野山で花を分けた楽しい時間と、互いの気持ちを十分に伝えられなかった悔いが、回想の中で重なります。大人の善意も、本人の願いを聞かずに進めれば人を追い詰めることがあります。ただし、民子の死を愛の証や美しい解決とするのではなく、生きて会う機会を失った悲しみとして読みたい作品です。", "sakura-no-ki-no-shita-niwa": "この作品では、桜の下から何かが発見されるわけではありません。変わるのは、「俺」が桜を見る気持ちです。谷川の記憶と死の空想を重ねることで、語り手は美しい花に向き合えるようになります。読者がその感じ方に同意する必要はありません。きれいなものを見たら必ず明るい気持ちになる、とは限らない心の動きを読むことができます。", "koya-hijiri": "宗朝は女性の家へ戻りかけますが、老人の警告を聞き、里へ下りました。女性は旅人を動物に変えると語られる一方、次郎を長年世話する人でもあります。優しさと恐ろしさを一人の中に描くため、単に「悪い魔女から逃げた話」では片づきません。さらに、その体験は宗朝の語りを「私」が聞く形で伝えられます。何を恐れ、何に引かれたのかを、読者が考える余地が残ります。", "kaze-tachinu": "「私」は節子との生活を幸福な物語にしようとしますが、生きている相手の不安や願いは、自分の筋書きには収まりません。節子を失った後も、思い出を求めるだけでは寂しさを消せませんでした。最後に、小さな明かりが遠くへ届く光景から、気づかずに支えられている自分の暮らしを考えます。病気や死を美しいものとして勧める話ではなく、相手を思うことと、自分の望みの違いも含めて読める作品です。", "nisen-doka": "松村は暗号の指示を読み解き、実際に品物を受け取りました。しかし、盗まれた金が隠されているという推理は間違っていました。仕掛けたのは、知恵比べに勝ちたかった「私」です。最後に残るのは大金ではなく、松村の沈黙と「私」の後悔。巧みな説明でも、確かめた事実と願いから生まれた想像は別だということ、勝つためのいたずらが相手を傷つけることが見えてきます。", "yagi-no-uta": "明るい駅の風景にも懐かしさがあり、深い悲しみの中にもやさしさが残っています。最後の夕空は、すべての悩みを解決した人の姿ではありません。各編の音や色が、説明だけでは伝えきれない気持ちをどのように表すかが、この詩集を読む入口になります。", "ushi-o-tsunaida-tsubaki-no-ki": "井戸ができるまでには、海蔵の節約だけでなく、母の助言、井戸掘りの知識、最後に心を変えた地主の協力が関わっています。海蔵は善い目的を持ちながら、一度は人の死を喜びかけ、その誤りを謝りました。本人は戦争から帰りませんが、井戸は残って人々を助けます。目的を実現することと、その途中で相手を大切にすることの両方を考えさせる作品です。", "amedama": "母親は侍の強そうな見た目や抜いた刀から、子どもたちに危険が迫ったと思います。しかし、侍が実際にしたのは、一つの飴だまを二つに分けることでした。母親の心配と実際の行動の違いが、結末の驚きになっています。侍は長い説明をせず、子どもに飴を分けた後は再び眠ります。見た目だけでは相手の考えは分からない、という読み方もできる作品です。"};

function rubyText(word,reading){if(!/[一-龯々]/.test(word))return esc(word);const parts=mixedRubyParts[word];if(parts)return parts.map(([text,r])=>r?`<ruby>${esc(text)}<rt>${esc(r)}</rt></ruby>`:esc(text)).join('');const m=word.match(/^([^一-龯々]*)([一-龯々]+)([^一-龯々]*)$/u);if(m&&(m[1]||m[3])){const kana=t=>t.replace(/[ァ-ヶ]/g,c=>String.fromCharCode(c.charCodeAt(0)-0x60));const rd=kana(reading),pre=kana(m[1]),post=kana(m[3]);if(rd.startsWith(pre)&&rd.endsWith(post)&&rd.length>pre.length+post.length){const mid=reading.slice(pre.length,reading.length-post.length);return esc(m[1])+`<ruby>${esc(m[2])}<rt>${esc(mid)}</rt></ruby>`+esc(m[3])}}return `<ruby>${esc(word)}<rt>${esc(reading)}</rt></ruby>`}
function characterName(value){let output='',i=0;const keys=Object.keys(characterRubyReadings).sort((a,b)=>b.length-a.length);while(i<value.length){const word=keys.find(w=>value.startsWith(w+'（'+characterRubyReadings[w]+'）',i));if(word){output+=rubyText(word,characterRubyReadings[word]);i+=(word+'（'+characterRubyReadings[word]+'）').length}else{output+=esc(value[i]);i++}}return output}
function titleText(x){if(x.id==="daizo")return rubyText("大造","だいぞう")+"じいさんと<wbr><span style=white-space:nowrap>ガン</span>";if(titleRubyParts[x.id])return titleRubyParts[x.id].map(p=>p[1]?rubyText(p[0],p[1]):esc(p[0])).join('');if(!x.reading||normalizeSearch(x.name)===normalizeSearch(x.reading))return esc(x.name);return rubyText(x.name,x.reading)}
function normalizeSearch(value){return value.normalize("NFKC").toLowerCase().replace(/[ァ-ヶ]/g,c=>String.fromCharCode(c.charCodeAt(0)-0x60))}

const authorBackground=[{"title": "東京の、どこで生まれた？", "text": "1892年3月1日、東京市京橋区入船町で生まれました。今の中央区明石町、聖路加国際病院の周辺にあたります。実父は牛乳販売業を営んでいました。生まれた町と、その後に育った町は別です。", "sources": [{"title": "たばこと塩の博物館「芥川龍之介がみた江戸・東京」", "url": "https://www.tabashio.jp/exhibition/2023/2309sep/index.html"}, {"title": "墨田区観光協会「芥川龍之介生育の地」", "url": "https://visit-sumida.jp/wp/spot/6005"}]}, {"title": "育ったのは、本所・両国", "text": "乳児のころ、母の実家の芥川家に引き取られ、18歳まで本所（ほんじょ）・両国周辺で育ちました。住まいは今の墨田区両国3丁目にあたる場所です。俳句や芝居などに親しむ家庭でした。", "sources": [{"title": "たばこと塩の博物館「芥川龍之介がみた江戸・東京」", "url": "https://www.tabashio.jp/exhibition/2023/2309sep/index.html"}, {"title": "墨田区立図書館「すみだ文学散歩」（PDF）", "url": "https://www.library.sumida.tokyo.jp/images/upload/sumidabunngakusannpo.pdf"}]}, {"title": "なじみの景色は、隅田川", "text": "育った家の近くには隅田川や回向院（えこういん）がありました。芥川は『大川の水』にも、川沿いの風景を書いています。育った町を知ってから作品を読むと、身近な景色を作家がどう見ていたか、たどる楽しみが生まれます。", "sources": [{"title": "たばこと塩の博物館「芥川龍之介がみた江戸・東京」", "url": "https://www.tabashio.jp/exhibition/2023/2309sep/index.html"}, {"title": "青空文庫「大川の水」本文", "url": "https://www.aozora.gr.jp/cards/000879/files/123_15167.html"}]}, {"title": "夏目漱石との出会い", "text": "1915年11月、友人とともに夏目漱石を訪ねました。翌年、漱石から『鼻』を高く評価され、名前を広く知られる転機になります。書き続けていた若い芥川にとって、先輩作家からの言葉は大きな励みになりました。", "sources": [{"title": "日本近代文学館「教科書のなかの文学／教室のそとの文学──芥川龍之介『羅生門』とその時代」", "url": "https://www.bungakukan.or.jp/cat-exhibition/9062/"}]}, {"title": "小説家になるまで、何をしていた？", "text": "読書だけでなく、幼いころから回覧雑誌も作っていました。東京帝国大学では英文学を学び、仲間との同人誌活動にも取り組みます。1915年に『羅生門』、1916年に『鼻』を発表しました。漱石に褒められて初めて書き始めたのではなく、それまでの読書や創作の積み重ねがありました。", "sources": [{"title": "山梨県立文学館デジタルアーカイブ「芥川龍之介」", "url": "https://digital-archive.pref.yamanashi.jp/literary/19"}, {"title": "たばこと塩の博物館「芥川龍之介がみた江戸・東京」", "url": "https://www.tabashio.jp/exhibition/2023/2309sep/index.html"}]}, {"title": "作家の暮らしを支えた田端", "text": "1914年に田端（たばた）へ移り、ここが創作の大切な拠点になりました。室生犀星（むろう さいせい）ら作家との交流も、田端に文士が集まるきっかけの一つとなります。大学卒業後は英語を教えながら執筆し、1919年に教職を離れ、文筆に専念しました。田端に移ってからも、横須賀や鎌倉で暮らした時期があります。", "sources": [{"title": "北区「芥川龍之介記念館とは」", "url": "https://www.city.kita.lg.jp/culture-tourism-sports/culture/1010296/1010304/1010305.html"}, {"title": "田端文士村記念館", "url": "https://kitabunka.or.jp/tabata/news/16484/"}, {"title": "国立国会図書館「近代日本人の肖像」", "url": "https://www.ndl.go.jp/portrait/datas/224"}]}];
function plainBodyText(x,value){const words=Object.keys(x.bodyReadings||{}).sort((a,b)=>b.length-a.length);if(!words.length)return esc(value);let output='',i=0;while(i<value.length){const word=words.find(w=>value.startsWith(w,i));if(word){output+=rubyText(word,x.bodyReadings[word]);i+=word.length}else{output+=esc(value[i]);i++}}return output}
function bodyText(x,value){if(x.cat!=='person')return plainBodyText(x,value);const works=(x.links||[]).map(id=>items.find(y=>y.id===id&&(y.cat==='literature'||y.cat==='myth'))).filter(Boolean),aliases={'ごんぎつね':'gongitsune'};let output='',at=0;for(const m of value.matchAll(/『([^』]+)』/gu)){const title=m[1],work=works.find(w=>w.name===title||aliases[title]===w.id);if(!work)continue;output+=plainBodyText(x,value.slice(at,m.index))+'『<a class="inline-work-link" href="#/article/'+esc(work.id)+'">'+plainBodyText(x,title)+'</a>』';at=m.index+m[0].length}return output+plainBodyText(x,value.slice(at))}
const personBackground={"soseki": [{"title": "生まれたところ", "text": "1867年2月9日、江戸の牛込馬場下横町に生まれました。今の東京都新宿区喜久井町にあたります。本名は夏目金之助です。", "sources": [{"title": "新宿区立漱石山房記念館「漱石の生涯」", "url": "https://soseki-museum.jp/soseki-natsume/sosekis-life/"}, {"title": "国立国会図書館「近代日本人の肖像」夏目漱石", "url": "https://www.ndl.go.jp/portrait/datas/307/"}]}, {"title": "育ったところ", "text": "幼いころは四谷の塩原家の養子となり、のちに牛込の実家へ戻りました。東京で学び、大学では英文学を専攻します。子供時代に暮らした家や家族との関係には、変化がありました。", "sources": [{"title": "新宿区立漱石山房記念館「漱石の生涯」", "url": "https://soseki-museum.jp/soseki-natsume/sosekis-life/"}]}, {"title": "教師から、小説を書く人へ", "text": "1893年に帝国大学を卒業し、松山や熊本で教師を務めました。1900年から英国へ留学。帰国後は大学で英語を教えながら、『吾輩は猫である』を発表しました。小説家になる前にも、学び、教える時間がありました。", "sources": [{"title": "新宿区立漱石山房記念館「漱石の生涯」", "url": "https://soseki-museum.jp/soseki-natsume/sosekis-life/"}, {"title": "国立国会図書館「近代日本人の肖像」夏目漱石", "url": "https://www.ndl.go.jp/portrait/datas/307/"}]}, {"title": "つながりのある人", "text": "学生時代から正岡子規と親しくなり、俳句を学びました。後年には、若い芥川龍之介の『鼻』を高く評価しています。先輩から学ぶ側だった漱石も、次の世代を励ます存在になりました。", "sources": [{"title": "新宿区立漱石山房記念館「漱石の生涯」", "url": "https://soseki-museum.jp/soseki-natsume/sosekis-life/"}, {"title": "国立国会図書館「近代日本人の肖像」芥川龍之介", "url": "https://www.ndl.go.jp/portrait/datas/224/"}]}, {"title": "新聞社で小説を書き続ける", "text": "1907年に東京朝日新聞社へ入り、創作に専念します。『三四郎』『それから』『門』『こころ』などを発表しました。教師だった時期と、職業として小説を書くようになった時期を分けると、歩みがつかみやすくなります。", "sources": [{"title": "新宿区立漱石山房記念館「漱石の生涯」", "url": "https://soseki-museum.jp/soseki-natsume/sosekis-life/"}, {"title": "国立国会図書館「近代日本人の肖像」夏目漱石", "url": "https://www.ndl.go.jp/portrait/datas/307/"}]}, {"title": "最後の作品", "text": "1916年12月9日、49歳で亡くなりました。最後の長編小説『明暗』は、書き終わらないまま残されました。『こころ』だけが晩年の作品というわけではなく、その後にも創作は続いていました。", "sources": [{"title": "新宿区立漱石山房記念館「漱石の生涯」", "url": "https://soseki-museum.jp/soseki-natsume/sosekis-life/"}, {"title": "国立国会図書館「近代日本人の肖像」夏目漱石", "url": "https://www.ndl.go.jp/portrait/datas/307/"}]}], "kenji": [{"title": "生まれたところ", "text": "1896年8月27日、岩手県の花巻川口町に生まれました。今の花巻市豊沢町にあたります。家は質屋と古着商を営んでいました。作品で親しんだ自然だけでなく、町の暮らしも身近にありました。", "sources": [{"title": "花巻市「宮沢賢治について」", "url": "https://www.city.hanamaki.iwate.jp/miyazawakenji/about_kenji/"}, {"title": "国立国会図書館「近代日本人の肖像」宮沢賢治", "url": "https://www.ndl.go.jp/portrait/datas/4318/"}]}, {"title": "育ったところと、好きだったもの", "text": "花巻で育ち、1909年に盛岡中学校へ入学しました。少年時代から鉱物や植物の採集に親しみ、のちに盛岡高等農林学校で学びます。自然を眺めるだけでなく、調べ、名前や仕組みを知ることにも関心を向けていました。", "sources": [{"title": "花巻市「宮沢賢治年譜」", "url": "https://www.city.hanamaki.iwate.jp/miyazawakenji/about_kenji/1003946.html"}]}, {"title": "書きはじめたころ", "text": "15歳ごろから短歌を作り、1917年には仲間と同人誌『アザリア』を創刊しました。詩や童話へと、書くものを広げていきます。最初から、今よく知られる童話だけを書いていたわけではありません。", "sources": [{"title": "花巻市「宮沢賢治年譜」", "url": "https://www.city.hanamaki.iwate.jp/miyazawakenji/about_kenji/1003946.html"}, {"title": "花巻市「賢治と文学」", "url": "https://www.city.hanamaki.iwate.jp/miyazawakenji/about_kenji/1003947.html"}]}, {"title": "学校の先生として", "text": "1921年に花巻の農学校の教師となりました。授業だけでなく、詩や曲を作ったり、生徒と劇を上演したりする活動にも取り組みました。農業を学ぶことと、表現する楽しさを、学校の暮らしの中で結びつけていました。", "sources": [{"title": "花巻市「宮沢賢治年譜」", "url": "https://www.city.hanamaki.iwate.jp/miyazawakenji/about_kenji/1003946.html"}, {"title": "花巻市「賢治と文学」", "url": "https://www.city.hanamaki.iwate.jp/miyazawakenji/about_kenji/1003947.html"}]}, {"title": "生きている間に出した二冊", "text": "1924年に『春と修羅』と童話集『注文の多い料理店』を刊行しました。生前に出版した本は、この二冊です。妹トシとの別れを詠んだ『永訣の朝』など、人との関わりも作品に残されています。『銀河鉄道の夜』は没後に発表された作品です。", "sources": [{"title": "花巻市「宮沢賢治について」", "url": "https://www.city.hanamaki.iwate.jp/miyazawakenji/about_kenji/"}, {"title": "花巻市「宮沢賢治年譜」", "url": "https://www.city.hanamaki.iwate.jp/miyazawakenji/about_kenji/1003946.html"}, {"title": "花巻市「賢治と文学」", "url": "https://www.city.hanamaki.iwate.jp/miyazawakenji/about_kenji/1003947.html"}]}, {"title": "農業と芸術を、暮らしのそばへ", "text": "1926年に農学校を退職し、羅須地人協会を設立しました。肥料の相談や農業指導をしながら、音楽や文学にも取り組みます。1933年9月21日、37歳で亡くなりました。作品を書くことだけでなく、人々の暮らしを支えようとした歩みもあります。", "sources": [{"title": "花巻市「宮沢賢治年譜」", "url": "https://www.city.hanamaki.iwate.jp/miyazawakenji/about_kenji/1003946.html"}, {"title": "国立国会図書館「近代日本人の肖像」宮沢賢治", "url": "https://www.ndl.go.jp/portrait/datas/4318/"}]}], "shakespeare": [{"title": "生まれ育ったのは、イングランドの町", "text": "シェイクスピアは1564年、イングランドのストラトフォード・アポン・エイヴォンで生まれました。父ジョンは手袋職人で、町の行政にも携わった人です。誕生日は4月23日として祝われますが、正確な日は分かっていません。記録で確かなのは、4月26日に地元の教会で洗礼を受けたことです。", "sources": [{"title": "Shakespeare Birthplace Trust：誕生と洗礼記録", "url": "https://www.shakespeare.org.uk/explore-shakespeare/shakespedia/william-shakespeare/when-was-shakespeare-born/"}, {"title": "Shakespeare Birthplace Trust：伝記", "url": "https://www.shakespeare.org.uk/explore-shakespeare/shakespedia/william-shakespeare/william-shakespeare-biography/"}]}, {"title": "言葉と古典に触れる学び", "text": "地元のグラマースクールで学んだと考えられていますが、本人の在学記録が残っているわけではありません。当時の学校ではラテン語や古典作品を重視し、劇を扱う学習もありました。大学に通った記録もありません。作品に古代の詩や歴史が現れることと、確かな学歴が分かることとは、分けて考える必要があります。", "sources": [{"title": "Shakespeare Birthplace Trust：教育", "url": "https://www.shakespeare.org.uk/explore-shakespeare/shakespedia/william-shakespeare/shakespeares-school/"}, {"title": "Folger Shakespeare Library：生涯と史料上の限界", "url": "https://www.folger.edu/explore/shakespeares-life/"}]}, {"title": "家族の暮らしと、記録のない年月", "text": "1582年、18歳でアン・ハサウェイと結婚し、やがて三人の子どもを持ちました。家族は故郷で暮らします。一方、彼がいつロンドンへ移り、どう演劇の仕事を始めたのかは、はっきりしません。1585年から1592年ごろの活動には記録の空白があります。1592年には、ロンドンで俳優・劇作家として知られていたことが確認できます。", "sources": [{"title": "Folger Shakespeare Library：生涯と史料上の限界", "url": "https://www.folger.edu/explore/shakespeares-life/"}, {"title": "Shakespeare Birthplace Trust：伝記", "url": "https://www.shakespeare.org.uk/explore-shakespeare/shakespedia/william-shakespeare/william-shakespeare-biography/"}]}, {"title": "書くだけではない、劇団の一員", "text": "1594年、宮内大臣一座の創立メンバーとなり、脚本を書くだけでなく、俳優や出資者としても活動しました。一座は1603年に国王一座と呼ばれるようになります。仲間の俳優が演じ、観客が見る舞台が、作品の大事な居場所でした。現代の本で読むときも、台詞を誰が誰に向けて言っているかに注目すると、場面を思い描きやすくなります。", "sources": [{"title": "Royal Shakespeare Company：劇団と活動年表", "url": "https://www.rsc.org.uk/shakespeares-life-and-times/"}, {"title": "Folger Shakespeare Library：生涯と史料上の限界", "url": "https://www.folger.edu/explore/shakespeares-life/"}], "interpretationNote": "最後の二文のうち読書の提案は編集上の独自説明。"}, {"title": "恋、対立、迷いを舞台にする", "text": "『ロミオとジュリエット』は、対立する家に生まれた二人の恋を描く悲劇です。『ハムレット』では、父を殺された王子の復讐と迷いが物語を動かします。ほかに『リア王』『マクベス』などがあり、悲劇だけでなく喜劇や歴史劇、詩も書きました。登場人物の言葉や選択を追うと、ひとりの人間の中にも違う気持ちが同居していることが見えてきます。", "sources": [{"title": "Folger Shakespeare Library：ロミオとジュリエット", "url": "https://www.folger.edu/explore/shakespeares-works/romeo-and-juliet/"}, {"title": "Folger Shakespeare Library：ハムレット", "url": "https://www.folger.edu/explore/shakespeares-works/hamlet/"}, {"title": "Shakespeare Birthplace Trust：伝記", "url": "https://www.shakespeare.org.uk/explore-shakespeare/shakespedia/william-shakespeare/william-shakespeare-biography/"}], "interpretationNote": "最後の一文は作品への入り口としての独自の読み方。"}, {"title": "仲間が残した戯曲集", "text": "1616年4月23日、故郷で亡くなりました。死因は分かっていません。七年後の1623年、かつて同じ劇団で働いた仲間たちが戯曲を集め、『ファースト・フォリオ』を刊行します。収録された36作品のうち18作品は、それまで印刷されていませんでした。今も物語を読んだり舞台で見たりできる背景には、作者だけでなく、作品を残した人々の働きもあります。", "sources": [{"title": "Folger Shakespeare Library：生涯と史料上の限界", "url": "https://www.folger.edu/explore/shakespeares-life/"}, {"title": "Folger Shakespeare Library：First Folioと肖像", "url": "https://www.folger.edu/explore/shakespeare-in-print/first-folio/"}]}], "dostoevsky": [{"title": "モスクワに生まれ、都市と田園で育つ", "text": "フョードル・ミハイロヴィチ・ドストエフスキーは、1821年にモスクワで生まれたロシアの小説家です。父は貧しい人々のためのマリインスキー病院で働く医師でした。モスクワで学校に通う一方、家族が田舎の土地を買ってからは、夏をダロヴォエで過ごしました。生まれ育ったモスクワと、のちの活動拠点ペテルブルクは別の都市です。", "sources": [{"title": "ロシア大統領図書館「ドストエフスキーの誕生」", "url": "https://www.prlib.ru/history/1324583"}, {"title": "サンクトペテルブルク・ドストエフスキー文学記念館「生涯と創作の年譜」", "url": "https://md.spb.ru/dostoevskij/biografiya/"}]}, {"title": "軍の技術者から、文学の道へ", "text": "母を亡くしたあと、1837年にペテルブルクへ移り、翌年、工兵学校に入りました。卒業して軍務に就きますが、1844年には退職して文学へ進みます。この年にはバルザックの『ウジェニー・グランデ』をロシア語に翻訳していました。最初から専業の小説家だったのではなく、技術者としての教育や翻訳の仕事を経て、自分の作品を書く道を選んだのです。", "sources": [{"title": "ロシア大統領図書館「ドストエフスキーの誕生」", "url": "https://www.prlib.ru/history/1324583"}, {"title": "サンクトペテルブルク・ドストエフスキー文学記念館「生涯と創作の年譜」", "url": "https://md.spb.ru/dostoevskij/biografiya/"}]}, {"title": "最初の小説が、発表前から評判になる", "text": "『貧しき人々』の原稿は、1845年に作家仲間を通してネクラーソフや批評家ベリンスキーに読まれ、高く評価されました。実際に刊行されたのは1846年です。原稿が評判になった年と、読者に届いた年を分けると、若い作家が注目を集めた経緯が見えてきます。同じ1846年には『分身』、1848年には『白夜』も発表しました。", "sources": [{"title": "サンクトペテルブルク・ドストエフスキー文学記念館「生涯と創作の年譜」", "url": "https://md.spb.ru/dostoevskij/biografiya/"}, {"title": "ロシア大統領図書館「ドストエフスキーの誕生」", "url": "https://www.prlib.ru/history/1324583"}]}, {"title": "逮捕とシベリアでの年月", "text": "社会制度や思想を話し合うペトラシェフスキーの集まりなどに参加し、1849年に逮捕されました。死刑を言い渡されますが、刑は変更され、オムスクで四年間の強制労働、その後はセミパラチンスクでの軍務を経験します。作家としての歩みは長く中断されました。のちに発表した『死の家の記録』を読むうえでも、この服役歴は重要な背景になります。ただし、小説の出来事をすべて本人の実体験と同一視はできません。", "sources": [{"title": "ロシア大統領図書館「ドストエフスキーの誕生」", "url": "https://www.prlib.ru/history/1324583"}, {"title": "サンクトペテルブルク・ドストエフスキー文学記念館「生涯と創作の年譜」", "url": "https://md.spb.ru/dostoevskij/biografiya/"}]}, {"title": "雑誌づくりと、執筆を支える協力", "text": "ペテルブルクへ戻ったあとは兄ミハイルと雑誌づくりに携わりましたが、兄の死後には出版の負債も引き受けました。1866年には『罪と罰』を連載。同年、速記者アンナ・スニートキナの助けを得て『賭博者』を仕上げ、翌年に二人は結婚します。作品は孤独な才能だけで生まれたのではなく、雑誌という発表の場や、原稿を形にする協力にも支えられていました。", "sources": [{"title": "サンクトペテルブルク・ドストエフスキー文学記念館「生涯と創作の年譜」", "url": "https://md.spb.ru/dostoevskij/biografiya/"}, {"title": "ロシア大統領図書館「ドストエフスキーの誕生」", "url": "https://www.prlib.ru/history/1324583"}]}, {"title": "代表作から、人の矛盾を読む", "text": "代表作には『罪と罰』のほか、『白痴』『悪霊』『カラマーゾフの兄弟』があります。『罪と罰』では、自分の理屈を信じる青年が、犯罪後の恐れや他者との関係によって揺さぶられます。人物の主張と、実際の感情や行動のずれを追うと、難しそうな議論にも近づきやすくなります。1881年にペテルブルクで亡くなるまで、人間を単純な善人・悪人に分けきれない物語を書き続けました。", "sources": [{"title": "サンクトペテルブルク・ドストエフスキー文学記念館「生涯と創作の年譜」", "url": "https://md.spb.ru/dostoevskij/biografiya/"}, {"title": "ロシア大統領図書館「ドストエフスキーの誕生」", "url": "https://www.prlib.ru/history/1324583"}, {"title": "Project Gutenberg・『罪と罰』旧英訳原文", "url": "https://www.gutenberg.org/files/2554/2554-h/2554-h.htm"}], "interpretationNote": "後半の読み方は『罪と罰』の確認済み本文に基づく独自の読解案。人物の発言をそのまま作者の主張と断定しない。"}], "dazai": [{"title": "青森で生まれた津島修治", "text": "太宰治は1909年6月19日、青森県の金木村で生まれました。今の五所川原市金木町です。本名は津島修治。家は多くの土地を持つ地主で、父は政治にも関わっていました。少年時代から本を読み、中学校で学ぶころには文章を書く活動にも取り組んでいます。故郷は、後に『津軽』を書くときにも大切な場所となりました。", "sources": [{"title": "国立国会図書館「近代日本人の肖像」太宰治", "url": "https://www.ndl.go.jp/portrait/datas/4149"}, {"title": "五所川原市「太宰治について」", "url": "https://www.city.goshogawara.lg.jp/kyouiku/bunka/dazai.html"}, {"title": "三鷹市「太宰治略年譜」", "url": "https://www.city.mitaka.lg.jp/dazai/dazaitomitaka/nenpu.html"}]}, {"title": "東京へ出て、小説を書く道へ", "text": "1930年に東京帝国大学のフランス文学を学ぶ学科へ入り、上京しました。同じ年に小説家の井伏鱒二を訪ね、教えを受けるようになります。大学は卒業せず、1933年には『列車』を「太宰治」の名で発表。1935年に『逆行』が芥川賞の候補となり、翌年には最初の創作集『晩年』を刊行しました。", "sources": [{"title": "国立国会図書館「近代日本人の肖像」太宰治", "url": "https://www.ndl.go.jp/portrait/datas/4149"}, {"title": "三鷹市「太宰治略年譜」", "url": "https://www.city.mitaka.lg.jp/dazai/dazaitomitaka/nenpu.html"}]}, {"title": "三鷹の暮らしと、さまざまな作品", "text": "1939年、石原美知子と結婚し、その年の秋から三鷹に住みました。1940年には『走れメロス』を発表します。戦争中は家族と疎開し、戦後に三鷹へ戻りました。戦後の作品には『斜陽』『ヴィヨンの妻』『人間失格』があります。1948年6月13日に亡くなり、『グッド・バイ』は未完で残されました。", "sources": [{"title": "三鷹市スポーツと文化財団・太宰治文学サロン「太宰治 紹介」", "url": "https://www.mitaka-sportsandculture.or.jp/dazai/about/"}, {"title": "三鷹市「太宰治略年譜」", "url": "https://www.city.mitaka.lg.jp/dazai/dazaitomitaka/nenpu.html"}, {"title": "国立国会図書館「近代日本人の肖像」太宰治", "url": "https://www.ndl.go.jp/portrait/datas/4149"}]}, {"title": "『走れメロス』から読む", "text": "『走れメロス』は、妹の結婚式を済ませるため、友を王のもとに残して村へ帰る男の話です。約束を守れるかが物語を動かしますが、メロスも友も、一度は心が揺れたことを認めます。二人を最初から迷いのない英雄として読むより、弱さを明かしたうえで信頼を取り戻す過程に注目すると、再会の意味が見えてきます。", "sources": [{"title": "青空文庫・太宰治「走れメロス」本文", "url": "https://www.aozora.gr.jp/cards/000035/files/1567_14913.html"}]}, {"title": "『人間失格』では、誰が語るかを見る", "text": "『人間失格』の大部分は、大庭葉蔵という男の手記です。しかし、最初と最後には、手記を受け取った別の語り手がいます。葉蔵の厳しい自己評価と、彼を知る女性の見方も同じではありません。太宰の体験と関わる作品でも、葉蔵の言葉をすべて作者本人の告白と決めつけず、誰の目で語られているかを分けて読むことが大切です。", "sources": [{"title": "青空文庫・太宰治「人間失格」本文", "url": "https://www.aozora.gr.jp/cards/000035/files/301_14912.html"}]}, {"title": "一つの人物像だけに閉じ込めない", "text": "太宰には、語り手が自分の弱さを打ち明ける作品だけでなく、昔の話を語り直す『お伽草紙』や、故郷を旅する『津軽』もあります。この図鑑では、まず『走れメロス』と『人間失格』を行き来できます。同じ作家でも、人物の関係や語り方が変わると、読後に残る問いや感情も変わる。その違いが、次の作品へ進む入口になります。", "sources": [{"title": "三鷹市「太宰治略年譜」", "url": "https://www.city.mitaka.lg.jp/dazai/dazaitomitaka/nenpu.html"}, {"title": "青空文庫・太宰治「走れメロス」本文", "url": "https://www.aozora.gr.jp/cards/000035/files/1567_14913.html"}, {"title": "青空文庫・太宰治「人間失格」本文", "url": "https://www.aozora.gr.jp/cards/000035/files/301_14912.html"}]}], "andersen": [{"title": "物語に親しんだオーデンセの少年", "text": "ハンス・クリスチャン・アンデルセンは、1805年4月2日、デンマークのオーデンセに生まれました。父は靴直しの職人、母は洗濯の仕事をし、家計は苦しいものでした。それでも父が本を読み聞かせ、町の人々が昔話を語ってくれました。貧しい暮らしの中にも、本や語りを通して別の世界に触れる機会があったのです。", "sources": [{"title": "デンマーク王立図書館・アンデルセンの生涯", "url": "https://www.kb.dk/en/inspiration/hans-christian-andersens-manuscripts-and-letters/life-hans-christian-andersen"}]}, {"title": "十四歳で、舞台を目指す", "text": "1819年、十四歳のアンデルセンは故郷を離れ、コペンハーゲンへ向かいます。初めから童話作家を目指していたのではなく、俳優や歌手、踊り手として劇場で活躍したかったのです。しかし、なかなか道は開けませんでした。舞台への挑戦は成功しませんでしたが、劇場とのつながりは、その後の学びを支える人々との出会いにつながりました。", "sources": [{"title": "南デンマーク大学アンデルセン研究センター・短い伝記", "url": "https://andersen.sdu.dk/liv/biografi/index_e.html"}]}, {"title": "支援を受け、学び直す", "text": "劇場の運営に関わるヨナス・コリンの助けで、1822年から学校へ通います。スラーエルセ、ヘルシンゲルで学んだあと、コペンハーゲンで個人授業を受け、1828年に大学入学資格の試験に合格しました。舞台の仕事に挑戦したあと、もう一度勉強する道を通って、文学を書くための言葉や知識を身につけていきました。", "sources": [{"title": "南デンマーク大学アンデルセン研究センター・教育", "url": "https://andersen.sdu.dk/liv/biografi/skole_e.html"}]}, {"title": "昔話から、自分の童話へ", "text": "1835年には『子どもたちに語る童話』という小冊子の刊行を始めます。これは初めて文章を書いた年ではなく、それ以前にも詩や物語を発表していました。伝え聞いた昔話を語り直す一方、自分で新しい物語も作ったのが特徴です。昔話を集めただけの人ではありません。その後は本の題名から「子どもたちに」を外し、童話と物語を書き続けました。", "sources": [{"title": "南デンマーク大学アンデルセン研究センター・童話", "url": "https://andersen.sdu.dk/liv/biografi/eventyr_e.html"}, {"title": "南デンマーク大学アンデルセン研究センター・短い伝記", "url": "https://andersen.sdu.dk/liv/biografi/index_e.html"}]}, {"title": "旅をし、さまざまな作品を書く", "text": "アンデルセンの仕事は童話だけではありません。小説や詩、戯曲、旅行記にも取り組みました。外国を旅することも多く、イタリアで受けた印象は、1835年の小説『即興詩人』につながります。旅行記にはスウェーデンやスペインを題材にした本もあります。身近な暮らしから遠い国まで、観察の対象を広げた作家でした。", "sources": [{"title": "デンマーク王立図書館・アンデルセンの生涯", "url": "https://www.kb.dk/en/inspiration/hans-christian-andersens-manuscripts-and-letters/life-hans-christian-andersen"}, {"title": "南デンマーク大学アンデルセン研究センター・旅行記", "url": "https://andersen.sdu.dk/liv/biografi/rejseboeger_e.html"}]}, {"title": "三つの童話から、作品の幅を知る", "text": "1875年8月4日、七十歳で亡くなりました。『みにくいアヒルの子』には居場所を失う苦しさ、『人魚姫』には別の世界への願いと伝わらない思いが描かれます。一方、『裸の王様』は、周囲に合わせて本当のことを言えない人々を見つめます。優しい話ばかりでも、悲しい話ばかりでもありません。異なる三作を読むと、人の弱さや願いをさまざまな角度から描いたことが分かります。", "sources": [{"title": "南デンマーク大学アンデルセン研究センター・短い伝記", "url": "https://andersen.sdu.dk/liv/biografi/index_e.html"}, {"title": "Project Gutenberg Canada：M. R. James英訳全文・版情報", "url": "https://www.gutenbergca.gutenbergcanada.ca/ebooks/andersen-ugly/andersen-ugly-00-h.html"}, {"title": "Wikisource・Paull英訳「The Little Mermaid」全文", "url": "https://en.wikisource.org/wiki/Hans_Andersen's_Fairy_Tales/The_Little_Mermaid"}, {"title": "Wikisource・Paull英訳当該話全文", "url": "https://en.wikisource.org/wiki/Hans_Andersen's_Fairy_Tales/The_Emperor's_New_Clothes"}]}], "niimi-nankichi": [{"title": "半田で育った新美正八", "text": "新美南吉は1913年7月30日、愛知県の半田町、今の半田市に生まれました。本名は新美正八です。畳屋の家に育ち、4歳で母を亡くしました。8歳で母の実家の新美家の養子になり、姓が渡辺から新美に変わります。その年のうちに暮らす家は渡辺家へ戻りました。ふるさとの岩滑の生活や自然は、後の物語にも息づいています。", "sources": [{"title": "新美南吉記念館「新美南吉の生涯」", "url": "https://www.nankichi.gr.jp/Nankichi/syogai.html"}, {"title": "新美南吉記念館「南吉Q&A・新美南吉について」", "url": "https://www.nankichi.gr.jp/Nankichi/QA.html"}, {"title": "新美南吉記念館「新美南吉の作品」", "url": "https://www.nankichi.gr.jp/Nankichi/sakuhin.html"}]}, {"title": "雑誌への投稿と、文学の仲間", "text": "中学生のころから童話や童謡を書き、雑誌へ送りました。『赤い鳥』に作品が載るようになり、童謡の指導をした北原白秋の周りで、巽聖歌や与田凖一らと知り合います。特に巽は、東京での暮らしや作品の出版を支えた先輩でした。一人で書くだけでなく、作品を読み合い、発表につなげてくれる人々との関係も大切だったのです。", "sources": [{"title": "新美南吉記念館「新美南吉の生涯」", "url": "https://www.nankichi.gr.jp/Nankichi/syogai.html"}, {"title": "新美南吉記念館「南吉Q&A・新美南吉について」", "url": "https://www.nankichi.gr.jp/Nankichi/QA.html"}, {"title": "国際子ども図書館「児童文学者コーナー 新美南吉」", "url": "https://www.kodomo.go.jp/jcl/person/niimi.html"}]}, {"title": "外国文学を学び、先生として働く", "text": "1932年、東京外国語学校の英語部文科へ入り、英語や海外の文学を学びました。卒業後は東京で働きますが、体調を崩して故郷へ戻ります。小学校の先生や会社員を経て、1938年には安城高等女学校の先生になりました。教える仕事と創作を続け、この時期に『おじいさんのランプ』などを書きました。", "sources": [{"title": "新美南吉記念館「新美南吉の生涯」", "url": "https://www.nankichi.gr.jp/Nankichi/syogai.html"}, {"title": "東京外国語大学文書館・新美南吉展資料", "url": "https://www.tufs.ac.jp/common/archives/pamphlet-niiminankichi.pdf"}]}, {"title": "書いた年と、本になった年", "text": "『ごん狐』は1931年に草稿が書かれ、1932年1月号の『赤い鳥』に載りました。『手袋を買いに』は1933年12月に書かれましたが、発表は死後の1943年です。『おじいさんのランプ』は1942年に書かれ、同じ年に初めての童話集の表題にもなりました。執筆と発表には時間差があり、現在の本の発売年だけでは、作品が生まれた時期は分かりません。", "sources": [{"title": "新美南吉記念館「新美南吉の生涯」", "url": "https://www.nankichi.gr.jp/Nankichi/syogai.html"}, {"title": "東京外国語大学文書館・新美南吉展資料", "url": "https://www.tufs.ac.jp/common/archives/pamphlet-niiminankichi.pdf"}, {"title": "青空文庫「手袋を買いに」図書カード", "url": "https://www.aozora.gr.jp/cards/000121/card637.html"}]}, {"title": "29歳で亡くなったあとも", "text": "南吉は病気のため、1943年3月22日に29歳で亡くなりました。遺された作品は巽聖歌や与田凖一らによって出版され、戦後も読み継がれました。ただし、草稿と雑誌掲載文、後の本で文章が異なる作品もあります。『ごん狐』の語り口を比べるときも、どの版を読んでいるのかを確かめることが大切です。", "sources": [{"title": "新美南吉記念館「新美南吉の生涯」", "url": "https://www.nankichi.gr.jp/Nankichi/syogai.html"}, {"title": "新美南吉記念館「南吉Q&A・新美南吉について」", "url": "https://www.nankichi.gr.jp/Nankichi/QA.html"}, {"title": "国際子ども図書館「児童文学者コーナー 新美南吉」", "url": "https://www.kodomo.go.jp/jcl/person/niimi.html"}]}, {"title": "この図鑑の三作品から読む", "text": "『ごんぎつね』では、相手を思う行動がうまく伝わらないすれ違いが描かれます。『手袋を買いに』では、母狐の怖さと、町で親切にされた子狐の経験が対照になります。『おじいさんのランプ』では、仕事に誇りを持つ人が時代の変化に向き合います。悲しい話だけ、優しい動物の話だけと決めず、人と人との関係や、考えが変わる瞬間に目を向けると、三作品の違いも見えてきます。", "sources": [{"title": "青空文庫「ごん狐」本文", "url": "https://www.aozora.gr.jp/cards/000121/files/628_14895.html"}, {"title": "青空文庫「手袋を買いに」本文", "url": "https://www.aozora.gr.jp/cards/000121/files/637_13341.html"}, {"title": "青空文庫「おじいさんのランプ」本文", "url": "https://www.aozora.gr.jp/cards/000121/files/635_14853.html"}]}], "mori-ogai": [{"title": "津和野の医師の家に生まれる", "text": "森鷗外は1862年2月17日、今の島根県津和野町に生まれました。本名は森林太郎です。家は津和野藩の医師を代々務めており、幼いころから漢文などを学びました。10歳で父と東京へ移り、ドイツ語と医学を学ぶ道へ進みます。学生時代には依田学海から漢文を学び、医学だけでなく言葉や文学にも親しみました。", "sources": [{"title": "国立国会図書館「近代日本人の肖像」森鴎外", "url": "https://www.ndl.go.jp/portrait/datas/342"}, {"title": "文京区立森鴎外記念館「森鴎外について」", "url": "https://moriogai-kinenkan.jp/modules/contents/index.php?content_id=11"}, {"title": "東京大学附属図書館「鴎外の書斎から・若き鴎外」", "url": "https://www.lib.u-tokyo.ac.jp/html/tenjikai/tenjikai2012/tenji1.html"}]}, {"title": "軍医としてドイツへ", "text": "1881年に東京大学医学部を卒業し、陸軍の軍医になりました。軍医とは、軍で医療や衛生に携わる医師です。1884年から1888年までドイツに留学し、衛生学を学びました。同時に多くの本を読み、ヨーロッパの文学にも接します。帰国後は軍医の仕事を続けながら、小説、評論、翻訳に取り組みました。", "sources": [{"title": "国立国会図書館「近代日本人の肖像」森鴎外", "url": "https://www.ndl.go.jp/portrait/datas/342"}, {"title": "東京大学附属図書館「鴎外の書斎から・若き鴎外」", "url": "https://www.lib.u-tokyo.ac.jp/html/tenjikai/tenjikai2012/tenji1.html"}]}, {"title": "『舞姫』と翻訳の仕事", "text": "1890年1月、雑誌『国民之友』に『舞姫』を発表しました。記念館によると、発表直前の1889年末に書いた草稿が残っています。ドイツ留学は創作の背景の一つですが、主人公の太田豊太郎を、そのまま作者と同じ人物と考えることはできません。鷗外はアンデルセンの『即興詩人』なども翻訳し、海外の作品を日本の読者へ紹介しました。", "sources": [{"title": "国立国会図書館「近代日本人の肖像」森鴎外", "url": "https://www.ndl.go.jp/portrait/datas/342"}, {"title": "文京区立森鴎外記念館「小説『舞姫』をよんでみよう！」展示解説", "url": "https://moriogai-kinenkan.jp/modules/event/index.php?action=View&event_id=0000002400&smode=Monthly"}]}, {"title": "観潮楼に集まった文学の仲間", "text": "1892年から、東京の千駄木にある家「観潮楼」で家族と暮らしました。ここでは歌会も開かれ、石川啄木や斎藤茂吉らが訪れました。短歌を作るだけでなく、新しい海外文学の話を伝える場でもありました。鷗外は自分の作品を書く一方で、若い文学者たちと交流し、文学について考える場をつくっていたのです。", "sources": [{"title": "文京区立森鴎外記念館「鴎外と文京区」", "url": "https://moriogai-kinenkan.jp/modules/contents/index.php?content_id=12"}]}, {"title": "歴史を題材にし、晩年まで働く", "text": "後年の代表作には、1915年発表の『山椒大夫』、1916年発表の『高瀬舟』があります。古い説話や記録をもとに、人間の選択や生き方を描く作品です。1916年に軍医の職を退いた後も、翌年から博物館や図書を扱う仕事を続けました。1922年7月9日、60歳で亡くなりました。医師、作家、翻訳家という複数の仕事を持った生涯でした。", "sources": [{"title": "国立国会図書館「近代日本人の肖像」森鴎外", "url": "https://www.ndl.go.jp/portrait/datas/342"}, {"title": "文京区立森鴎外記念館「森鴎外について」", "url": "https://moriogai-kinenkan.jp/modules/contents/index.php?content_id=11"}]}, {"title": "この図鑑の三作品から読む", "text": "『舞姫』では、豊太郎が選んだ進路と、エリスとの約束の食い違いに目を向けられます。『山椒大夫』では、離ればなれになった家族の行方を追いながら、人を売り買いする世界の苦しさが見えてきます。『高瀬舟』では、役人の庄兵衛が喜助の話を聞き、簡単には判断できなくなります。人物の立場や語り手を確かめて読むと、単純な教訓では収まらない問いが残ります。", "sources": [{"title": "青空文庫「舞姫」本文", "url": "https://www.aozora.gr.jp/cards/000129/files/2078_15963.html"}, {"title": "青空文庫・鷗外原文（全編確認）", "url": "https://www.aozora.gr.jp/cards/000129/files/689_23257.html"}, {"title": "青空文庫「高瀬舟」本文", "url": "https://www.aozora.gr.jp/cards/000129/files/45245_22007.html"}]}], "higuchi-ichiyo": [{"title": "東京で育った奈津", "text": "樋口一葉は1872年5月2日、東京の内幸町に生まれました。当時の暦では明治5年3月25日です。本名は奈津で、夏子とも書きました。父は東京府の役人でした。幼いころから読書に親しみ、上野御徒町へ移った後は青海学校で学びます。東京のさまざまな町で暮らした経験が、後の文学の背景になりました。", "sources": [{"title": "国立国会図書館「近代日本人の肖像・樋口一葉」", "url": "https://www.ndl.go.jp/portrait/datas/315/"}, {"title": "千代田区文化財サイト「樋口一葉生誕地」", "url": "https://www.edo-chiyoda.jp/bunkazaihogonotorikumi/bunkazaihogochosain/hogocho2019/1/361.html"}, {"title": "台東区文化探訪「一葉記念館を詠う」学びと育ち", "url": "https://www.culture.city.taito.lg.jp/bunkatanbou/culture/ichiyou/japanese/page_02.html"}]}, {"title": "和歌の学びから小説へ", "text": "1886年、中島歌子の歌塾「萩の舎」に入り、和歌を学びました。同門の田辺花圃が小説を発表したことも刺激になり、1891年には半井桃水に小説の指導を受けます。1892年発表の『うもれ木』で知られるようになり、雑誌『文学界』の仲間たちとの交流も広がりました。和歌と小説、師や仲間との出会いが創作を支えたのです。", "sources": [{"title": "国立国会図書館「近代日本人の肖像・樋口一葉」", "url": "https://www.ndl.go.jp/portrait/datas/315/"}, {"title": "千代田区文化財サイト「樋口一葉生誕地」", "url": "https://www.edo-chiyoda.jp/bunkazaihogonotorikumi/bunkazaihogochosain/hogocho2019/1/361.html"}]}, {"title": "暮らしを支えながら書く", "text": "1889年に父を亡くし、一家の暮らしを支える立場になりました。下谷の龍泉寺町では日用品や駄菓子を売る店も営みます。商いに忙しく、思うように書けない時期もありました。その後暮らした本郷の丸山福山町では、近所の店で働く女性たちの手紙を代筆しています。こうした交流や日々の観察が、人の心と生活を描く作品につながりました。", "sources": [{"title": "国立国会図書館「近代日本人の肖像・樋口一葉」", "url": "https://www.ndl.go.jp/portrait/datas/315/"}, {"title": "台東区文化探訪「一葉記念館を詠う」生活と創作", "url": "https://www.culture.city.taito.lg.jp/bunkatanbou/culture/ichiyou/japanese/page_03.html"}, {"title": "国立国会図書館「本の万華鏡・恋文の名手―樋口一葉をめぐる恋文譚」", "url": "https://www.ndl.go.jp/kaleido/entry/26/2.html"}]}, {"title": "書いた時と、発表した時", "text": "『たけくらべ』は1895年1月から1896年1月まで、雑誌『文学界』に何回かに分けて掲載されました。その後、文章を直し、1896年4月の『文芸倶楽部』にまとめて載せています。『にごりえ』は1895年9月号の『文芸倶楽部』に発表しました。近い時期に発表された代表作でも、作品が読者に届くまでの道筋は異なります。", "sources": [{"title": "近畿大学中央図書館回答・NDLレファレンス協同データベース「たけくらべの初出」", "url": "https://crd.ndl.go.jp/reference/entry/index.php?id=1000049505&page=ref_view"}, {"title": "台東区文化探訪「一葉記念館を詠う」原稿と評価", "url": "https://www.culture.city.taito.lg.jp/bunkatanbou/culture/ichiyou/japanese/page_04.html"}, {"title": "青空文庫「にごりえ」図書カード・初出欄", "url": "https://www.aozora.gr.jp/cards/000064/card56042.html"}]}, {"title": "短い生涯と、残された言葉", "text": "『たけくらべ』は森鷗外らに高く評価されました。しかし一葉は結核を患い、1896年11月23日、24歳で亡くなります。小説だけでなく、和歌や日記、書簡も残しました。日記や手紙は生活と思いを知る大切な手がかりですが、小説の登場人物をそのまま作者自身と決めつけることはできません。", "sources": [{"title": "国立国会図書館「近代日本人の肖像・樋口一葉」", "url": "https://www.ndl.go.jp/portrait/datas/315/"}, {"title": "台東区文化探訪「一葉記念館を詠う」原稿と評価", "url": "https://www.culture.city.taito.lg.jp/bunkatanbou/culture/ichiyou/japanese/page_04.html"}, {"title": "国立国会図書館「本の万華鏡・恋文の名手―樋口一葉をめぐる恋文譚」", "url": "https://www.ndl.go.jp/kaleido/entry/26/2.html"}]}, {"title": "二つの物語を読む入口", "text": "『たけくらべ』では、美登利や信如たちの言えない思いと、家の仕事が将来に及ぼす力に目を向けてみましょう。『にごりえ』では、店で明るく振る舞うお力の内面だけでなく、源七の妻子の暮らしも大切です。悲しい恋の話とまとめず、本人の言葉と周囲の噂の違いをたどると、人物を簡単に裁けない物語の深さが見えてきます。", "sources": [{"title": "青空文庫・樋口一葉「たけくらべ」原文", "url": "https://www.aozora.gr.jp/cards/000064/files/56041_54765.html"}, {"title": "青空文庫・樋口一葉「にごりえ」原文", "url": "https://www.aozora.gr.jp/cards/000064/files/387_15293.html"}]}], "arishima-takeo": [{"title": "東京から札幌へ", "text": "有島武郎は1878年3月4日、東京に生まれました。横浜英和学校や学習院で学んだ後、1896年に札幌農学校へ進みます。札幌での学生生活は、英語や外国の本に親しみ、信仰や社会について考える時期にもなりました。後の作品に北海道が登場しても、北海道生まれの作家というわけではありません。", "sources": [{"title": "有島記念館「有島武郎について」", "url": "https://www.town.niseko.lg.jp/arishima_museum/profile/"}, {"title": "北海道大学附属図書館「有島武郎」", "url": "https://www.lib.hokudai.ac.jp/archive/node/北大の英語教育/北大卒業生の活躍/有島/"}]}, {"title": "留学し、英語を教える", "text": "1903年にアメリカへ留学し、ヨーロッパも巡って1907年に帰国しました。留学中にはキリスト教への信仰が揺らぎ、社会思想にも関心を広げます。帰国後は母校の後身である東北帝国大学農科大学の英語講師に任命され、翌1908年には予科教授となりました。作家として知られる前には、学ぶ側と教える側の両方を経験しています。", "sources": [{"title": "有島記念館「有島武郎について」", "url": "https://www.town.niseko.lg.jp/arishima_museum/profile/"}, {"title": "国立国会図書館「近代日本人の肖像」有島武郎", "url": "https://www.ndl.go.jp/portrait/datas/228/"}, {"title": "北海道大学附属図書館「有島武郎」", "url": "https://www.lib.hokudai.ac.jp/archive/node/北大の英語教育/北大卒業生の活躍/有島/"}]}, {"title": "『白樺』の文学仲間", "text": "1910年、武者小路実篤や志賀直哉らの雑誌『白樺』に参加しました。画家の有島生馬と作家の里見弴は、武郎の弟です。同じ雑誌に集まった人たちは文学や美術に関心を寄せていましたが、全員が同じ考えで書いたわけではありません。武郎も自分の生活と社会のあり方を見つめながら、作品を発表していきます。", "sources": [{"title": "有島記念館「有島武郎について」", "url": "https://www.town.niseko.lg.jp/arishima_museum/profile/"}, {"title": "国立国会図書館「近代日本人の肖像」有島武郎", "url": "https://www.ndl.go.jp/portrait/datas/228/"}]}, {"title": "小説と子どもの物語", "text": "1915年から大学を休職し、1916年に妻と父を失い、1917年に正式に退職しました。その前後から『カインの末裔』『生れ出づる悩み』『或る女』などを発表します。この図鑑の『一房の葡萄』は、1920年8月号の『赤い鳥』に掲載されました。これは発表の年月です。物語の中の子ども時代や、文章を書き終えた日を示すものではありません。", "sources": [{"title": "有島記念館「有島武郎について」", "url": "https://www.town.niseko.lg.jp/arishima_museum/profile/"}, {"title": "国立国会図書館「近代日本人の肖像」有島武郎", "url": "https://www.ndl.go.jp/portrait/datas/228/"}, {"title": "青空文庫「一房の葡萄」図書カード", "url": "https://www.aozora.gr.jp/cards/000025/card211.html"}, {"title": "北海道大学附属図書館「有島武郎」", "url": "https://www.lib.hokudai.ac.jp/archive/node/北大の英語教育/北大卒業生の活躍/有島/"}]}, {"title": "農場の持ち主として考えたこと", "text": "武郎は北海道に農場を持つ立場でもありました。1922年には、借りた土地を耕して暮らす人々が土地を共同で持つことを前提に、農場を無償で手放すと宣言します。考えを文章にするだけでなく、自分の財産をどう扱うかにも向き合った出来事です。翌1923年6月9日、軽井沢で45歳の生涯を終えました。", "sources": [{"title": "有島記念館「有島武郎について」", "url": "https://www.town.niseko.lg.jp/arishima_museum/profile/"}, {"title": "国立国会図書館「近代日本人の肖像」有島武郎", "url": "https://www.ndl.go.jp/portrait/datas/228/"}]}, {"title": "『一房の葡萄』から読む", "text": "『一房の葡萄』では、大人になった「僕」が、絵の具を盗んだ少年時代を振り返ります。先生は盗みをよいことにするのではなく、少年がもう一度学校へ戻れるように接します。何をしたかだけでなく、その後に誰がどう受け止めたかを追うと、葡萄の記憶が残る理由が見えてきます。作品の「僕」を、そのまま作者本人の記録と決めつけずに読む案内です。", "sources": [{"title": "青空文庫「一房の葡萄」本文", "url": "https://www.aozora.gr.jp/cards/000025/files/211_20472.html"}]}], "kajii-motojiro": [{"title": "大阪に生まれ、各地で育つ", "text": "梶井基次郎は1901年2月17日、大阪に生まれました。父の転勤で引っ越しや転校を重ね、少年時代には三重や東京でも暮らしました。のちに大阪の北野中学校で学びます。小説の舞台として京都を思い浮かべる人もいるでしょうが、生まれ育った場所と、学生として過ごした場所は同じではありません。", "sources": [{"title": "国立国会図書館「近代日本人の肖像」梶井基次郎", "url": "https://www.ndl.go.jp/portrait/datas/6239/index.html"}, {"title": "千代田区立図書館「梶井基次郎の手迹」展示解説・略年譜", "url": "https://www.library.chiyoda.tokyo.jp/information/20081120-10517/"}, {"title": "新潮社・梶井基次郎 著者プロフィール", "url": "https://www.shinchosha.co.jp/writer/1147/"}]}, {"title": "理科から文学の道へ", "text": "1919年、京都の第三高等学校の理科に入学しました。当初は技術者を目指していましたが、しだいに文学へ心を引かれていきます。学生時代には劇の研究会に入り、習作を書くようになりました。1924年には東京帝国大学の英文学科へ進みます。ただし、病気のため大学を卒業することはできませんでした。", "sources": [{"title": "千代田区立図書館「梶井基次郎の手迹」展示解説・略年譜", "url": "https://www.library.chiyoda.tokyo.jp/information/20081120-10517/"}, {"title": "新潮社・梶井基次郎 著者プロフィール", "url": "https://www.shinchosha.co.jp/writer/1147/"}]}, {"title": "仲間と雑誌『青空』をつくる", "text": "中谷孝雄や外村繁らと同人雑誌『青空』をつくり、1925年1月の創刊号に『檸檬』を発表しました。同人雑誌は、仲間が集まって作品を発表する雑誌です。『城のある町にて』などもこの雑誌に載せました。『檸檬』の発表年は1925年ですが、そこへ至る前にも習作を書いており、突然一編だけが生まれたわけではありません。", "sources": [{"title": "国立国会図書館「近代日本人の肖像」梶井基次郎", "url": "https://www.ndl.go.jp/portrait/datas/6239/index.html"}, {"title": "千代田区立図書館「梶井基次郎の手迹」展示解説・略年譜", "url": "https://www.library.chiyoda.tokyo.jp/information/20081120-10517/"}, {"title": "青空文庫「檸檬」図書カード（旧字旧仮名）", "url": "https://www.aozora.gr.jp/cards/000074/card46349.html"}]}, {"title": "療養先でも文学者と交流する", "text": "1926年、体調が悪くなり、療養のため伊豆の湯ヶ島へ向かいました。そこで川端康成や広津和郎らと交流し、創作を続けます。病気は生活や進学に影響しましたが、梶井の歩みには、同人誌の仲間や療養先で出会った文学者とのつながりもありました。病気の作家という一面だけでは、その活動全体を捉えきれません。", "sources": [{"title": "国立国会図書館「近代日本人の肖像」梶井基次郎", "url": "https://www.ndl.go.jp/portrait/datas/6239/index.html"}, {"title": "新潮社・梶井基次郎 著者プロフィール", "url": "https://www.shinchosha.co.jp/writer/1147/"}]}, {"title": "一冊の作品集と、三十一歳の死", "text": "1931年、生前唯一の作品集『檸檬』が刊行されました。これは1925年に発表した一編の小説とは別の、作品をまとめた本です。翌1932年には雑誌『中央公論』で『のんきな患者』を発表しました。同年3月24日、肺結核のため31歳で亡くなります。残された作品は、作者の死後に評価が高まっていきました。", "sources": [{"title": "国立国会図書館「近代日本人の肖像」梶井基次郎", "url": "https://www.ndl.go.jp/portrait/datas/6239/index.html"}, {"title": "千代田区立図書館「梶井基次郎の手迹」展示解説・略年譜", "url": "https://www.library.chiyoda.tokyo.jp/information/20081120-10517/"}]}, {"title": "この図鑑の『檸檬』から読む", "text": "『檸檬』では、気持ちが沈んだ「私」が、果実の色や冷たさ、香りに心を動かされます。大事件よりも、物に触れたときの感覚や、想像によって気分が変わる過程が読みどころです。最後の爆発は想像で、実際に店を壊す話ではありません。主人公の病気や暮らしを、そのまま作者の生活の記録と決めつけず、一つの小説として読めます。", "sources": [{"title": "青空文庫・梶井基次郎「檸檬」原文", "url": "https://www.aozora.gr.jp/cards/000074/files/46349_23843.html"}]}], "nakajima-atsushi": [{"title": "漢学の家と、移り住んだ町", "text": "中島敦は1909年5月5日、東京の四谷に生まれました。父は漢文の教師で、祖父や伯父たちも漢学に深く関わる家でした。幼年期には父の実家がある埼玉の久喜で育ちます。その後、父の仕事に伴って奈良、浜松、当時日本の植民地支配下にあった朝鮮の京城へ移りました。一つの町だけで育ったのではなく、土地を移りながら学んだ人です。", "sources": [{"title": "新宿区立図書館「新宿区ゆかりの人物データベース・中島敦」", "url": "https://www.library.shinjuku.tokyo.jp/database/jinbutuyukari/050/post41.html"}, {"title": "久喜市「中島敦ゆかりの地」", "url": "https://www.city.kuki.lg.jp/miryoku/kanko_tokusan/1006001.html"}, {"title": "久喜市立図書館デジタルアーカイブ・村山𠮷廣「中島撫山小伝」作家中島敦の節", "url": "https://adeac.jp/kuki-lib/texthtml/d200020/mp220000-200020/ht000020"}]}, {"title": "学ぶことと、書くこと", "text": "京城の中学校から東京の第一高等学校へ進み、校友会の雑誌に小説を載せました。やがて東京帝国大学の国文学科で学びます。中国の古典だけでなく、西洋の文学にも関心を広げ、神奈川近代文学館にはカフカやハックスリーの翻訳草稿も残っています。後年の短い活躍の前に、長く読書と創作を重ねた時期がありました。", "sources": [{"title": "新宿区立図書館「新宿区ゆかりの人物データベース・中島敦」", "url": "https://www.library.shinjuku.tokyo.jp/database/jinbutuyukari/050/post41.html"}, {"title": "久喜市立図書館デジタルアーカイブ・村山𠮷廣「中島撫山小伝」作家中島敦の節", "url": "https://adeac.jp/kuki-lib/texthtml/d200020/mp220000-200020/ht000020"}, {"title": "神奈川近代文学館「中島敦直筆資料デジタルアーカイブ」資料一覧", "url": "https://www.kanabun.or.jp/nakajima/table.html"}]}, {"title": "横浜で教壇に立つ", "text": "1933年、横浜高等女学校の教師になりました。教える仕事と並行して小説を書き、『虎狩』『狼疾記』『かめれおん日記』などの創作に取り組みます。読書や旅行を楽しむ一方、持病の喘息に悩まされていました。作品に先生の生活が現れても、語り手をそのまま作者と同一視せず、小説として読むことも大切です。", "sources": [{"title": "久喜市「中島敦ゆかりの地」", "url": "https://www.city.kuki.lg.jp/miryoku/kanko_tokusan/1006001.html"}, {"title": "久喜市立図書館デジタルアーカイブ・村山𠮷廣「中島撫山小伝」作家中島敦の節", "url": "https://adeac.jp/kuki-lib/texthtml/d200020/mp220000-200020/ht000020"}]}, {"title": "南洋への赴任と帰国", "text": "1941年には女学校を離れ、南洋庁の国語編修書記としてパラオへ赴任しました。教科書に関わる仕事であり、体調の回復への期待もありました。しかし現地で健康は回復せず、翌1942年に帰国します。残された南洋の日記や、島々を舞台にした作品は、中国の古典を題材にする小説だけではない、創作の広がりを伝えています。", "sources": [{"title": "久喜市「中島敦ゆかりの地」", "url": "https://www.city.kuki.lg.jp/miryoku/kanko_tokusan/1006001.html"}, {"title": "久喜市立図書館デジタルアーカイブ・村山𠮷廣「中島撫山小伝」作家中島敦の節", "url": "https://adeac.jp/kuki-lib/texthtml/d200020/mp220000-200020/ht000020"}, {"title": "神奈川近代文学館「中島敦直筆資料デジタルアーカイブ」資料一覧", "url": "https://www.kanabun.or.jp/nakajima/table.html"}]}, {"title": "原稿が作品として届くまで", "text": "『山月記』は1942年2月の『文學界』に、『文字禍』と合わせて「古譚」という題で掲載されました。この発表年月は、書き始めた年月と同じではありません。同年、『光と風と夢』が芥川賞候補となりますが、敦は12月4日に33歳で亡くなります。『李陵』などは死後の発表です。短い生涯と、作品が読者へ届いた順番を分けて見てみましょう。", "sources": [{"title": "青空文庫「山月記」図書カード623・文學界底本の書誌", "url": "https://www.aozora.gr.jp/cards/000119/card623.html"}, {"title": "久喜市立図書館デジタルアーカイブ・村山𠮷廣「中島撫山小伝」作家中島敦の節", "url": "https://adeac.jp/kuki-lib/texthtml/d200020/mp220000-200020/ht000020"}, {"title": "新宿区立図書館「新宿区ゆかりの人物データベース・中島敦」", "url": "https://www.library.shinjuku.tokyo.jp/database/jinbutuyukari/050/post41.html"}]}, {"title": "『山月記』から読む", "text": "詩人になりたかった李徴は、虎の姿で旧友の袁傪に語ります。自分の才能を信じる気持ちと、実力を知られる怖さ。その振り返りは切実ですが、あくまで李徴自身による説明です。友人に詩を書き留めてもらい、家族の世話を頼む場面にも目を向けると、自尊心の教訓だけではない、人と人とのつながりが見えてきます。", "sources": [{"title": "青空文庫「山月記」本文（新潮文庫底本版）", "url": "https://www.aozora.gr.jp/cards/000119/files/624_14544.html"}]}], "sei-shonagon": [{"title": "名前と生涯には、分からないこともある", "text": "清少納言は、平安時代中期に『枕草子』を書いた人です。父は歌人の清原元輔でした。966年ごろに生まれたという推定がありますが、正確な生没年や本名は分かっていません。「清少納言」は宮仕えの場で使われた呼び名です。本名についての説も、確定した名前として扱うことはできません。", "sources": [{"title": "ジャパンサーチ「枕草子」", "url": "https://jpsearch.go.jp/gallery/ndl-plZ27mlWQ1P"}, {"title": "斎宮歴史博物館・斎宮千話一話 第61話", "url": "https://www.bunka.pref.mie.lg.jp/saiku/senwa/journal385.html"}, {"title": "徳島市立図書館・清少納言の没年月日調査（レファレンス協同データベース）", "url": "https://crd.ndl.go.jp/reference/entry/index.php?id=1000349343&page=ref_view"}]}, {"title": "定子のそばで働く女房", "text": "990年代の初めごろ、一条天皇の中宮定子に仕え始めたと考えられています。出仕年には992年、993年などの説があります。清少納言の役割は女房でした。ここでの女房は、宮廷や貴族の家で働く女性のことです。天皇の妻だった定子と、その定子に仕えた清少納言とは、立場が違います。", "sources": [{"title": "国文学研究資料館「枕草子」", "url": "https://www.nijl.ac.jp/etenji/bungakushi/contents/detail/detail02-02_008.html"}, {"title": "宮城県図書館・清少納言と紫式部の出仕時期調査", "url": "https://crd.ndl.go.jp/reference/entry/index.php?id=1000346756&page=ref_view"}, {"title": "大阪府立中央図書館・女房の仕事と宮仕えに関する調査", "url": "https://crd.ndl.go.jp/reference/entry/index.php?id=1000127497&page=ref_view"}]}, {"title": "宮廷の経験を文章にする", "text": "『枕草子』には、定子や周囲の人とのやり取りが数多く登場します。季節の風景や人のふるまいを見て感じたことも、文章の題材になりました。特別な行事だけでなく、日常の小さな出来事へ目を向けたところにも特徴があります。ただし、宮廷生活を描いているからといって、作者の一生を順番に記録した伝記というわけではありません。", "sources": [{"title": "国文学研究資料館「枕草子」", "url": "https://www.nijl.ac.jp/etenji/bungakushi/contents/detail/detail02-02_008.html"}, {"title": "ジャパンサーチ「枕草子」", "url": "https://jpsearch.go.jp/gallery/ndl-plZ27mlWQ1P"}]}, {"title": "一つの筋ではなく、短い文章の集まり", "text": "『枕草子』は、自然や暮らしについて思ったこと、ある題目に合うものを並べた文章、宮仕えの思い出などからできています。国文学研究資料館は成立を1001年ごろと紹介していますが、執筆や成立の過程には諸説があります。その年に一度に全部を書き上げた、と決めることはできません。伝わった本によって、文章の順序なども異なります。", "sources": [{"title": "国文学研究資料館「枕草子」", "url": "https://www.nijl.ac.jp/etenji/bungakushi/contents/detail/detail02-02_008.html"}, {"title": "ジャパンサーチ「枕草子」", "url": "https://jpsearch.go.jp/gallery/ndl-plZ27mlWQ1P"}]}, {"title": "定子の死と、見えにくい晩年", "text": "1000年に定子が亡くなった後の清少納言の生活には、はっきりしない点が残っています。没年を1025年ごろとする説などもありますが、正確な年月日は確認されていません。また、紫式部とは仕えた相手や時期が異なります。同じ職場でいつも顔を合わせ、言い争っていた二人のように思い描くのは慎重であるべきです。", "sources": [{"title": "徳島市立図書館・清少納言の没年月日調査（レファレンス協同データベース）", "url": "https://crd.ndl.go.jp/reference/entry/index.php?id=1000349343&page=ref_view"}, {"title": "宮城県図書館・清少納言と紫式部の出仕時期調査", "url": "https://crd.ndl.go.jp/reference/entry/index.php?id=1000346756&page=ref_view"}]}, {"title": "この図鑑の『枕草子』から読む", "text": "この図鑑では、四季の風景、小さな子のしぐさ、定子との思い出などを入口にしています。同じ景色のどこへ目を向けるか、何を好ましいと感じるかを追うと、書き手の個性が見えてきます。一方で、その判断を現代の誰にでも当てはまる正解にする必要はありません。宮廷に生きた一人の見方として、自分との違いも含めて読むことができます。", "sources": [{"title": "『枕草紙』原文（1903年『國文大觀』版翻刻・既存作品記事の参照原典）", "url": "https://ja.wikisource.org/wiki/枕草紙_(國文大觀)"}]}], "murasaki-shikibu": [{"title": "名前にも、生涯にも謎がある", "text": "紫式部は、平安時代中期に『源氏物語』を書いた女性です。本名と正確な生没年は分かっていません。「紫式部」は現在私たちが知る呼び名で、現代の作家の本名とは事情が違います。本名を「香子」とする説もありますが、確定はしていません。ドラマなどで付けられた名前や、後世に描かれた姿を、そのまま史実としないことが大切です。", "sources": [{"title": "堺市立中央図書館回答・NDLレファレンス協同データベース「紫式部の本名を知りたい」", "url": "https://crd.ndl.go.jp/reference/entry/index.php?id=1000378169&page=ref_view"}, {"title": "五島美術館「国宝 紫式部日記絵巻」", "url": "https://www.gotoh-museum.or.jp/collection/shikibu/"}]}, {"title": "学問の家から、越前へ", "text": "父は藤原為時で、親族にも学者や歌人がいました。紫式部は和歌だけでなく、中国の書物にも深い教養を持っていました。父の任地である越前に同行して暮らした経験もあります。その後、藤原宣孝と結婚しましたが、夫を亡くします。家で育んだ学問や人生の経験は、物語の背景を考える手がかりになります。ただし、小説をそのまま自伝と見ることはできません。", "sources": [{"title": "京都大学貴重資料デジタルアーカイブ「文学史年表・源氏物語」", "url": "https://rmda.kulib.kyoto-u.ac.jp/item/rb00007030/explanation/genji"}, {"title": "越前市「越前市の歴史」平安時代の節", "url": "https://www.city.echizen.lg.jp/office/090/030/echizennsinobunnkazai/rekisi.html"}]}, {"title": "彰子に仕え、宮廷を記す", "text": "紫式部は、一条天皇の妻である中宮で、藤原道長の娘でもある彰子に仕えました。出仕の正確な年には諸説があり、ここでは一つに決めません。『紫式部日記』には、1008年から1010年にかけての宮廷の出来事が記されています。皇子の誕生を祝う儀式や人々の振る舞いを細やかに観察し、華やかな場の内側にいる人の目で書き留めました。", "sources": [{"title": "五島美術館「国宝 紫式部日記絵巻」", "url": "https://www.gotoh-museum.or.jp/collection/shikibu/"}, {"title": "宮内庁書陵部ギャラリー「紫日記」「源氏物語」", "url": "https://shoryobu.kunaicho.go.jp/Gallery/59634e730b6146df9adfccfd696e0559"}, {"title": "宇治市・越前市・大津市観光ポータル「紫式部と平安時代」年表", "url": "https://murasakishikibu-kanko.jp/murasakishikibu/"}]}, {"title": "1008年は「完成年」なのか", "text": "『紫式部日記』の1008年の記事には、藤原公任が物語の若紫にちなんで紫式部へ声をかける場面があります。『源氏物語』がそのころ知られていたことを示す手がかりです。しかし、それだけで全五十四帖がその年に完成したとは言えません。書き始めた時期や、各巻ができた順序は別の問題です。現代の本の発売日のように、一つの年で表せない成立の歴史があります。", "sources": [{"title": "宮内庁書陵部ギャラリー「紫日記」「源氏物語」", "url": "https://shoryobu.kunaicho.go.jp/Gallery/59634e730b6146df9adfccfd696e0559"}, {"title": "国文学研究資料館「源氏物語～千年のかがやき～」展示趣旨", "url": "https://www.nijl.ac.jp/event/exhibition/2008/10/tenji08-2.html"}]}, {"title": "写され、描かれ、読み継がれる", "text": "『源氏物語』は、人の手で書き写され、注釈や絵巻、翻訳などを通じて伝えられました。現在紹介される古い本も、作者が書いた時代のものとは限りません。たとえば京都大学の中院文庫本は室町時代末期の写本です。『紫式部日記絵巻』も、日記の時代から約二百五十年後の制作です。作品の成立と、目の前の資料が作られた時を区別して見ましょう。", "sources": [{"title": "京都大学貴重資料デジタルアーカイブ「文学史年表・源氏物語」", "url": "https://rmda.kulib.kyoto-u.ac.jp/item/rb00007030/explanation/genji"}, {"title": "五島美術館「国宝 紫式部日記絵巻」", "url": "https://www.gotoh-museum.or.jp/collection/shikibu/"}, {"title": "国文学研究資料館「源氏物語～千年のかがやき～」展示趣旨", "url": "https://www.nijl.ac.jp/event/exhibition/2008/10/tenji08-2.html"}]}, {"title": "作者と登場人物を分けて読む", "text": "紫式部は物語を書いた人で、「紫の上」は物語に登場する人物です。光源氏を中心に読むだけでなく、周りの女性たちが何を望み、何を選べなかったのかにも目を向けてみましょう。後半には薫や匂宮、浮舟たちの世代へ物語が移ります。華やかな恋の話だけではなく、身分や家族、相手を理解しきれない苦しさを描く長い物語として読む入口になります。", "sources": [{"title": "青空文庫・紫式部作品一覧（既存記事の参照版・与謝野晶子訳）", "url": "https://www.aozora.gr.jp/index_pages/person52.html"}]}], "brothers-grimm": [{"title": "一人の作家ではなく、二人の兄弟", "text": "グリム兄弟とは、兄のヤーコプと弟のヴィルヘルムです。ヤーコプは1785年、ヴィルヘルムは1786年に、現在のドイツにあるハーナウで生まれました。幼い頃をシュタイナウで過ごし、父を亡くした後はカッセルで学びます。「グリム」という一人の作者がいたのではなく、二人が協力して研究や出版を進めました。", "sources": [{"title": "GRIMMWELT Kassel「The Brothers Grimm」", "url": "https://www.grimmwelt.de/en/journal/the-brothers-grimm"}, {"title": "ヘッセン州文化ポータル「Jacob und Wilhelm Grimm」", "url": "https://kulturportal.hessen.de/wissen/beruehmte-hessen/literatur/jacob-und-wilhelm-grimm"}]}, {"title": "法律を学ぶところから、言葉の研究へ", "text": "兄は1802年、弟は翌年にマールブルク大学へ進み、法律を学びました。教師サヴィニーとの出会いを通じ、古い資料や文学へ関心を深めます。後に図書館員や大学の教師としても働きました。童話だけを書いた人ではなく、言葉が昔からどのように使われてきたかを調べる研究者でもあったのです。", "sources": [{"title": "GRIMMWELT Kassel「The Brothers Grimm」", "url": "https://www.grimmwelt.de/en/journal/the-brothers-grimm"}, {"title": "ベルリン州立図書館「Aus den Biographien der Brüder Grimm」", "url": "https://staatsbibliothek-berlin.de/die-staatsbibliothek/abteilungen/kinder-und-jugendbuecher/aktuelles/ausstellung/aus-den-biographien"}]}, {"title": "語ってくれた人たちと、編集の仕事", "text": "兄弟は身近な人々から昔話を集めました。ドロテーア・フィーマンやハッセンプフルク家など、多くの語り手や協力者がいました。ただし、聞いた言葉を一字一句そのまま記録しただけではありません。文章を整え、表現を加える仕事も行い、とくにヴィルヘルムが語り方を磨きました。すべての筋を二人が最初から創作した、という意味の作者ではありません。", "sources": [{"title": "ベルリン州立図書館「Aus den Biographien der Brüder Grimm」", "url": "https://staatsbibliothek-berlin.de/die-staatsbibliothek/abteilungen/kinder-und-jugendbuecher/aktuelles/ausstellung/aus-den-biographien"}, {"title": "ヘッセン州文化ポータル「Jacob und Wilhelm Grimm」", "url": "https://kulturportal.hessen.de/wissen/beruehmte-hessen/literatur/jacob-und-wilhelm-grimm"}]}, {"title": "『子どもと家庭の童話』を改め続ける", "text": "童話集の第1巻は1812年、第2巻は1815年の刊記で出版されました。その後も話の入れ替えや書き直しが重ねられ、兄弟が関わった最後の大きな版は1857年です。同じ題名でも、初版と後の版では内容が違うことがあります。昔から動かない一つの文章が伝わったのではなく、集め、選び、改める作業を経て本になったのです。", "sources": [{"title": "ベルリン州立図書館「Aus den Biographien der Brüder Grimm」", "url": "https://staatsbibliothek-berlin.de/die-staatsbibliothek/abteilungen/kinder-und-jugendbuecher/aktuelles/ausstellung/aus-den-biographien"}, {"title": "ベルリン州立図書館「初版から1857年までの童話集」", "url": "https://staatsbibliothek-berlin.de/die-staatsbibliothek/abteilungen/kinder-und-jugendbuecher/aktuelles/ausstellung/erstausgabe"}]}, {"title": "童話のほかに、辞書も残す", "text": "1837年、兄弟は他の教授たちとともに、国王による憲法の廃止に抗議して大学を追われました。その後、ベルリンで研究を続け、ドイツ語辞典の編纂にも取り組みます。ヴィルヘルムは1859年、ヤーコプは1863年に亡くなりました。二人の生前に辞典全体は完成せず、後の人々へ仕事が引き継がれました。", "sources": [{"title": "ベルリン州立図書館「Aus den Biographien der Brüder Grimm」", "url": "https://staatsbibliothek-berlin.de/die-staatsbibliothek/abteilungen/kinder-und-jugendbuecher/aktuelles/ausstellung/aus-den-biographien"}, {"title": "ヘッセン州文化ポータル「Jacob und Wilhelm Grimm」", "url": "https://kulturportal.hessen.de/wissen/beruehmte-hessen/literatur/jacob-und-wilhelm-grimm"}]}, {"title": "この図鑑の三つの童話から読む", "text": "『赤ずきん』では狼の言葉、『ヘンゼルとグレーテル』では兄妹の工夫、『白雪姫』では姿を変えて近づく王妃の企みが、物語を動かします。誰が危険に気づき、誰の助けで先へ進むかを追うと、それぞれの違いが見えてきます。この図鑑は採用したグリム版に沿っています。同じ題名の別の再話や、後の映画の設定を混ぜずに読む案内です。", "sources": [{"title": "既存作品の参照原典：Margaret Hunt英訳グリム童話集", "url": "https://www.gutenberg.org/files/5314/5314-h/5314-h.htm"}]}], "charles-perrault": [{"title": "パリに生まれ、法律を学ぶ", "text": "シャルル・ペローは1628年1月12日、フランスのパリに生まれました。1651年に弁護士の資格を得た後、財政の仕事をしていた兄のもとで働きます。童話作家として知られていますが、初めから物語だけを書く生活をしていたわけではありません。法律や役所の仕事にも関わりながら、文学の活動へ進んだ人です。", "sources": [{"title": "アカデミー・フランセーズ：Charles Perrault", "url": "https://www.academie-francaise.fr/les-immortels/charles-perrault"}, {"title": "ヴェルサイユ宮殿公式：Charles Perrault", "url": "https://www.chateauversailles.fr/decouvrir/histoire/grands-personnages/charles-perrault"}]}, {"title": "王の文化事業に関わる", "text": "1663年、ルイ14世に仕えた政治家コルベールのもとで、芸術や文学に関わる仕事を始めました。王の建築事業にも携わり、ルーヴルやヴェルサイユの工事に関係します。1671年にはアカデミー・フランセーズの会員に選ばれました。物語を書く以外にも、国の文化を支える組織で活動していたのです。", "sources": [{"title": "アカデミー・フランセーズ：Charles Perrault", "url": "https://www.academie-francaise.fr/les-immortels/charles-perrault"}, {"title": "ヴェルサイユ宮殿公式：Charles Perrault", "url": "https://www.chateauversailles.fr/decouvrir/histoire/grands-personnages/charles-perrault"}]}, {"title": "古い作品と新しい作品をめぐる論争", "text": "当時、古代の作品を手本とする立場と、新しい時代の作品を高く評価する立場との間に論争がありました。ペローは後者の代表的な一人です。詩や評論を書き、自分の時代の文学や芸術にも価値があると主張しました。童話だけを残した作家ではなく、何を優れた作品と考えるかを議論した文学者でもありました。", "sources": [{"title": "アカデミー・フランセーズ：Charles Perrault", "url": "https://www.academie-francaise.fr/les-immortels/charles-perrault"}, {"title": "ヴェルサイユ宮殿公式：Charles Perrault", "url": "https://www.chateauversailles.fr/decouvrir/histoire/grands-personnages/charles-perrault"}]}, {"title": "1697年の童話集", "text": "1697年、パリで『過ぎし昔の物語ならびに教訓』が刊行されました。『シンデレラ』『長靴をはいた猫』『赤ずきん』など八つの物語を収めています。この年は、ペロー系統の物語が一冊にまとまった刊行年です。同じ題材の昔話がすべてこの年に初めて生まれた、という意味ではありません。また、後世のグリム版や映画版とは区別して読む必要があります。", "sources": [{"title": "フランス国立図書館：1697年刊 Histoires, ou Contes du temps passé の書誌", "url": "https://catalogue.bnf.fr/ark:/12148/cb31084290g"}]}, {"title": "息子の名前も記された本", "text": "この童話集はペローの作品として伝わっていますが、刊行時の名義には注意が必要です。1697年版の献辞には息子ピエールの名に当たる署名があり、出版を認める特許も同じ名で与えられています。父子それぞれの関与を一言で決めつけず、そうした事情もある本として扱います。ペローは1703年5月16日に亡くなりましたが、童話はその後も読まれ続けました。", "sources": [{"title": "アカデミー・フランセーズ：Charles Perrault", "url": "https://www.academie-francaise.fr/les-immortels/charles-perrault"}, {"title": "ヴェルサイユ宮殿公式：Charles Perrault", "url": "https://www.chateauversailles.fr/decouvrir/histoire/grands-personnages/charles-perrault"}, {"title": "フランス国立図書館：1697年刊 Histoires, ou Contes du temps passé の書誌", "url": "https://catalogue.bnf.fr/ark:/12148/cb31084290g"}]}, {"title": "この図鑑の二作品から読む", "text": "『シンデレラ』では、妖精の助けや舞踏会だけでなく、最後に姉たちを許す対応にも目を向けられます。『長靴をはいた猫』では、猫の知恵が主人の立場を変えますが、その方法にはうそや脅しも含まれます。どちらも単純な「よい子へのごほうび」とは言い切れません。結末まで行動をたどると、成功の裏にある助力や身分、見かけの働きが見えてきます。", "sources": [{"title": "Project Gutenberg：ペロー童話集1922年版旧英訳（既存2記事の参照原典）", "url": "https://www.gutenberg.org/files/29021/29021-h/29021-h.htm"}]}], "miguel-de-cervantes": [{"title": "誕生日と洗礼日を分ける", "text": "ミゲル・デ・セルバンテスは1547年、スペインのアルカラ・デ・エナーレスに生まれました。9月29日生まれという説はありますが、正確な誕生日は未確定です。記録で確認されるのは10月9日の洗礼です。父は外科の治療を仕事にしていました。少年時代の教育には不明な点もあり、作品の登場人物の経験だけから、通った学校を決めることはできません。", "sources": [{"title": "Biblioteca Virtual Miguel de Cervantes・Jean Canavaggioによる伝記 第1頁", "url": "https://www.cervantesvirtual.com/portales/miguel_de_cervantes/autor_biografia/"}]}, {"title": "兵士として、捕虜として", "text": "若いころイタリアへ渡り、兵士になりました。1571年のレパントの海戦で負傷し、左手の自由を失います。1575年、スペインへ帰る途中の船が襲われ、北アフリカのアルジェで捕らわれの身になりました。何度か脱出を試みた末、1580年に身代金で解放されます。自由を奪われた経験は、後の戯曲や小説を考える重要な背景です。", "sources": [{"title": "Biblioteca Virtual Miguel de Cervantes・Jean Canavaggioによる伝記 第1頁", "url": "https://www.cervantesvirtual.com/portales/miguel_de_cervantes/autor_biografia/"}, {"title": "スペイン国立統計局（INE）「Tras los pasos de Cervantes」", "url": "https://www.ine.es/explica/cervantes/"}]}, {"title": "暮らしの仕事と創作", "text": "帰国後は小説や戯曲に取り組み、1585年に『ラ・ガラテア』を刊行しました。しかし作家の仕事だけで暮らしたわけではありません。艦隊の食料調達や税金を集める仕事でアンダルシアを旅し、会計をめぐる問題で投獄もされました。『ドン・キホーテ』の着想と牢獄を結ぶ説明はありますが、全篇を獄中で書いたと断定することはできません。", "sources": [{"title": "Biblioteca Virtual Miguel de Cervantes・Jean Canavaggioによる伝記 第1頁", "url": "https://www.cervantesvirtual.com/portales/miguel_de_cervantes/autor_biografia/"}, {"title": "Biblioteca Virtual Miguel de Cervantes・Jean Canavaggioによる伝記 第2頁", "url": "https://www.cervantesvirtual.com/portales/miguel_de_cervantes/autor_biografia_2/"}]}, {"title": "十年を隔てた二つの本", "text": "『ドン・キホーテ』前編の初版は1605年、後編は1615年です。これは刊行の年であり、両編を書き始めた年を示すものではありません。その間の1614年には、アベジャネーダという名で別人の続編が出ました。セルバンテス自身の後編は、その本の存在も物語へ取り込みます。本を書く人と読む人の関係まで、小説の仕掛けにしたのです。", "sources": [{"title": "スペイン国立統計局（INE）「Tras los pasos de Cervantes」", "url": "https://www.ine.es/explica/cervantes/"}, {"title": "Biblioteca Virtual Miguel de Cervantes・Jean Canavaggioによる伝記 第2頁", "url": "https://www.cervantesvirtual.com/portales/miguel_de_cervantes/autor_biografia_2/"}, {"title": "Biblioteca Virtual Miguel de Cervantes・Jean Canavaggioによる伝記 第3頁", "url": "https://www.cervantesvirtual.com/portales/miguel_de_cervantes/autor_biografia_3/"}]}, {"title": "最後まで書き続ける", "text": "晩年にも短編小説や戯曲を発表し、最後の長編『ペルシーレスとシヒスムンダの苦難』は死後の1617年に刊行されました。セルバンテスがマドリードで亡くなったのは1616年4月22日です。翌23日は埋葬の日で、記録の日付を死亡日と取り違えない注意が必要です。作品が完成した時、本になった時、作者が生きた時を分けてたどりましょう。", "sources": [{"title": "Biblioteca Virtual Miguel de Cervantes・Jean Canavaggioによる伝記 第3頁", "url": "https://www.cervantesvirtual.com/portales/miguel_de_cervantes/autor_biografia_3/"}, {"title": "スペイン国立統計局（INE）「Tras los pasos de Cervantes」", "url": "https://www.ine.es/explica/cervantes/"}, {"title": "スペイン語アカデミー協会（ASALE）「Miguel de Cervantes」", "url": "https://www.asale.org/la-asociacion/conmemoraciones/miguel-de-cervantes"}]}, {"title": "二人の旅から読む", "text": "ドン・キホーテは作者の別名ではなく、セルバンテスが作った人物です。風車を巨人だと思う主人と、現実的な忠告をするサンチョ。同じものをどう違って見るかに注目してみましょう。後編では、冒険を記した本を読んだ人々が二人を迎えます。主人公の思い込みを笑うだけでなく、彼らをからかう周囲の行動も考えると、旅の見え方が変わってきます。", "sources": [{"title": "ドン・キホーテ Ormsby英訳（既存作品記事の主要場面・終章照合出典）", "url": "https://www.gutenberg.org/cache/epub/996/pg996-images.html", "verification": "既存donquixote記事の原典確認を継承。今回新規アクセス・全文再読なし。"}]}], "kusuyama-masao": [{"title": "東京に生まれ、文学を学ぶ", "text": "楠山正雄は1884年11月4日、東京の銀座に生まれました。幼いころに父を亡くし、親戚の家で暮らした時期もあります。早稲田大学では英文学を学び、坪内逍遙や島村抱月に教わりました。物語を書くことだけでなく、外国の文学や演劇にも関心を広げていきます。", "sources": [{"title": "新宿区立図書館：楠山正雄", "url": "https://www.library.shinjuku.tokyo.jp/database/jinbutuyukari/020/post69.html"}, {"title": "青空文庫：楠山正雄の作家情報", "url": "https://www.aozora.gr.jp/index_pages/person329.html"}]}, {"title": "舞台と本の両方で働く", "text": "大学を出た後は、早稲田文学社や読売新聞で働き、出版社の冨山房へ移りました。また、文芸協会や芸術座の活動にも参加します。外国の劇を日本語にしたり、舞台について評論を書いたりした人で、童話だけを専門にしていたわけではありません。", "sources": [{"title": "新宿区立図書館：楠山正雄", "url": "https://www.library.shinjuku.tokyo.jp/database/jinbutuyukari/020/post69.html"}, {"title": "出版社提供・楠山正雄の略歴（版元ドットコム）", "url": "https://www.hanmoto.com/bd/isbn/9784866001135"}]}, {"title": "編集者として物語を届ける", "text": "編集とは、文章や絵を集め、読みやすい一冊の本にまとめていく仕事です。楠山は雑誌や辞典、子供のための本を数多く手がけました。画家の岡本帰一とも協力しています。『世界童話宝玉集』は1919年、『日本童話宝玉集』は1921年に刊行されました。", "sources": [{"title": "青空文庫：楠山正雄の作家情報", "url": "https://www.aozora.gr.jp/index_pages/person329.html"}, {"title": "出版社提供・楠山正雄の略歴（版元ドットコム）", "url": "https://www.hanmoto.com/bd/isbn/9784866001135"}]}, {"title": "昔話を語り直すという仕事", "text": "『桃太郎』や『浦島太郎』は、楠山が一から考え出した物語ではありません。昔から伝わる話を、読者が読める文章に語り直しています。この図鑑では、その楠山版を紹介しています。同じ題名でも、別の人がまとめた本とは、出来事や言葉が違う場合があります。再話した人を知ることは、どの版を読んでいるかを確かめる手がかりになります。", "sources": [{"title": "出版社提供・楠山正雄の略歴（版元ドットコム）", "url": "https://www.hanmoto.com/bd/isbn/9784866001135"}, {"title": "青空文庫：桃太郎の書誌", "url": "https://www.aozora.gr.jp/cards/000329/card18376.html"}, {"title": "青空文庫：浦島太郎の書誌", "url": "https://www.aozora.gr.jp/cards/000329/card3390.html"}]}, {"title": "外国の童話を日本語へ", "text": "楠山はアンデルセンなどの童話も翻訳しました。この図鑑の『雪の女王』では、アンデルセンが原作者、楠山が採用した日本語版の翻訳者です。1950年11月26日に亡くなりましたが、訳した文章はその後も出版されています。青空文庫の『雪の女王』が使った1955年の本は、没後に出た底本で、原作の初刊年ではありません。", "sources": [{"title": "新宿区立図書館：楠山正雄", "url": "https://www.library.shinjuku.tokyo.jp/database/jinbutuyukari/020/post69.html"}, {"title": "青空文庫：雪の女王の著者・翻訳者・底本", "url": "https://www.aozora.gr.jp/cards/000019/card42387.html"}]}, {"title": "この図鑑から読むなら", "text": "『桃太郎』では仲間が加わる順序と帰り道、『浦島太郎』では海の御殿と帰った浜辺の違いをたどってみてください。『雪の女王』では、ゲルダを助ける人や動物が順に変わります。これは作品を読むための案内です。昔話の再話と外国作品の翻訳を分けて見ると、物語を読者に届ける楠山の仕事が見えてきます。", "sources": [{"title": "青空文庫：桃太郎の書誌", "url": "https://www.aozora.gr.jp/cards/000329/card18376.html"}, {"title": "青空文庫：浦島太郎の書誌", "url": "https://www.aozora.gr.jp/cards/000329/card3390.html"}, {"title": "青空文庫：雪の女王の著者・翻訳者・底本", "url": "https://www.aozora.gr.jp/cards/000019/card42387.html"}]}], "oscar-wilde": [{"title": "ダブリンの家庭で育つ", "text": "オスカー・ワイルドは1854年10月16日、アイルランドのダブリンに生まれました。父ウィリアムは医師で、歴史や考古学にも関心を持つ人でした。母ジェーンは詩を書き、外国語の作品を翻訳しました。家庭には芸術や学問に携わる人々が集まっており、ワイルドは文学だけでなく、さまざまな知的活動が身近にある環境で育ちました。", "sources": [{"title": "トリニティ・カレッジ・ダブリン：Oscar Wilde Centre・本人と家族の紹介", "url": "https://www.tcd.ie/owc/history/oscar-wilde/"}, {"title": "ウェストミンスター寺院公式：Oscar Wilde・生没年月日", "url": "https://www.westminster-abbey.org/abbey-commemorations/commemorations/oscar-wilde"}]}, {"title": "二つの大学で古典を学ぶ", "text": "1871年にダブリンのトリニティ・カレッジへ進み、古代ギリシャやローマの文学を中心とする古典を学びました。1874年にはオックスフォード大学のモードリン・カレッジに移ります。1878年には詩で賞を受け、学位を取得しました。人を楽しませる会話の巧みさだけでなく、学生時代から言葉や古い文学に向き合っていた人です。", "sources": [{"title": "トリニティ・カレッジ・ダブリン：Oscar Wilde Centre・本人と家族の紹介", "url": "https://www.tcd.ie/owc/history/oscar-wilde/"}, {"title": "ユニバーシティ・カレッジ・コーク：Oscar Wilde年譜", "url": "https://www.ucc.ie/en/research-sites/celt/resources/writers/wilde/"}]}, {"title": "童話も小説も芝居も書く", "text": "卒業後はロンドンを拠点にし、詩集の出版や北米での講演、雑誌の編集などに取り組みました。1888年には『幸福な王子 その他の物語』を刊行します。小説『ドリアン・グレイの肖像』や、舞台で演じるための喜劇でも知られています。童話だけの作家ではなく、文章の形や読者を変えながら、美しさや人間社会について表現した作家でした。", "sources": [{"title": "トリニティ・カレッジ・ダブリン：Oscar Wilde Centre・本人と家族の紹介", "url": "https://www.tcd.ie/owc/history/oscar-wilde/"}, {"title": "ユニバーシティ・カレッジ・コーク：Oscar Wilde年譜", "url": "https://www.ucc.ie/en/research-sites/celt/resources/writers/wilde/"}]}, {"title": "成功の中で起きた投獄", "text": "1895年、二つの芝居が好評を得た一方、男性との関係をめぐる裁判で、二年間の重労働を伴う刑を受けました。当時のイギリスでは、男性どうしの性的な関係が法律で処罰されていました。家財が競売にかけられ、妻と子供たちの暮らしにも大きな影響が及びました。", "sources": [{"title": "ユニバーシティ・カレッジ・オックスフォード図書館資料紹介：Oscar Wilde’s 1895", "url": "https://www.univ.ox.ac.uk/news/oscar-wildes-1895/"}]}, {"title": "出獄後にも残した言葉", "text": "1897年に刑務所を出た後、ワイルドはフランスなどで暮らしました。1898年には『レディング牢獄の歌』を発表しています。華やかな舞台作品だけでなく、収監の経験に関わる文章や詩も残しました。1900年11月30日、46歳で亡くなりました。生涯を投獄という一つの出来事だけで説明せず、多様な創作活動とともに捉えることが大切です。", "sources": [{"title": "ユニバーシティ・カレッジ・コーク：Oscar Wilde年譜", "url": "https://www.ucc.ie/en/research-sites/celt/resources/writers/wilde/"}, {"title": "ウェストミンスター寺院公式：Oscar Wilde・生没年月日", "url": "https://www.westminster-abbey.org/abbey-commemorations/commemorations/oscar-wilde"}, {"title": "ユニバーシティ・カレッジ・オックスフォード図書館資料紹介：Oscar Wilde’s 1895", "url": "https://www.univ.ox.ac.uk/news/oscar-wildes-1895/"}]}, {"title": "『幸福な王子』から読む", "text": "この図鑑の『幸福な王子』では、像の外見が貧しくなるほど、困っている人々に助けが届きます。一方、市長たちは見栄えを失った像を不要だと考えます。王子とツバメの思いやりだけでなく、誰の苦しみが見落とされ、何が立派とされるかにも注目できます。自己犠牲を無条件に勧める教訓にせず、見た目と行いの価値の違いをたどる読み方です。", "sources": [{"title": "Project Gutenberg：The Happy Prince and Other Tales 英語原著（既存記事の参照原典）", "url": "https://www.gutenberg.org/files/902/902-h/902-h.htm"}]}], "lewis-carroll": [{"title": "本名と筆名を持つ作家", "text": "ルイス・キャロルは、1832年1月27日にイギリスのデアズベリで生まれました。本名はチャールズ・ラトウィッジ・ドジソンです。数学の著作では本名を使い、物語ではキャロルという筆名で知られるようになりました。二人の別人ではなく、一人の人が異なる名前で活動していたのです。作中のアリスも、作者本人ではありません。", "sources": [{"title": "オックスフォード大学 Christ Church：The Lewis Carroll Collections", "url": "https://www.chch.ox.ac.uk/college/library-archives/lewis-carroll-collection"}, {"title": "セント・アンドルーズ大学 MacTutor：Charles Lutwidge Dodgson", "url": "https://mathshistory.st-andrews.ac.uk/Biographies/Dodgson/"}]}, {"title": "オックスフォードで数学を教える", "text": "1851年からオックスフォード大学のクライスト・チャーチで学び、数学で優れた成績を収めました。1856年には数学の講師に任命され、その職を約25年間務めます。幾何学や論理学に関心を持ち、数学の本も書きました。写真や手紙なども多く残されており、童話作家という呼び名だけでは収まらない活動をしていました。", "sources": [{"title": "オックスフォード大学 Christ Church：The Lewis Carroll Collections", "url": "https://www.chch.ox.ac.uk/college/library-archives/lewis-carroll-collection"}, {"title": "セント・アンドルーズ大学 MacTutor：Charles Lutwidge Dodgson", "url": "https://mathshistory.st-andrews.ac.uk/Biographies/Dodgson/"}]}, {"title": "舟遊びから手書きの本へ", "text": "1862年7月4日、リデル家のアリスと姉妹たちが参加した舟遊びで、後の物語につながる話を語りました。アリスに書き留めてほしいと頼まれ、1864年には自分で挿絵も描いた『地下の国のアリス』の手稿を贈ります。舟で語った日、手書きの本を渡した時、公に出版された時は、それぞれ別です。実在の少女と物語の主人公も同一ではありません。", "sources": [{"title": "ヴィクトリア＆アルバート博物館：The real Alice in Wonderland", "url": "https://www.vam.ac.uk/articles/the-real-alice-in-wonderland"}, {"title": "Lewis Carroll Society：Publishing of Alice", "url": "https://lewiscarrollsociety.org.uk/publishing-of-alice/"}]}, {"title": "1865年の出版と刷り直し", "text": "話を広げた『不思議の国のアリス』は、ジョン・テニエルの挿絵とともに1865年に出版されました。ただし、最初の印刷は絵の仕上がりに問題があり回収されます。同じ年に出た刷り直しには、翌1866年の年記が入りました。資料に二つの年が現れるのはこのためです。手稿の挿絵はキャロル、公刊本の挿絵はテニエルと区別します。", "sources": [{"title": "ヴィクトリア州立図書館：Lewis Carroll and his Alice books", "url": "https://guides.slv.vic.gov.au/alice/getstarted"}, {"title": "Lewis Carroll Society：Publishing of Alice", "url": "https://lewiscarrollsociety.org.uk/publishing-of-alice/"}]}, {"title": "もう一つのアリスの物語", "text": "続編『鏡の国のアリス』は1871年末に刊行され、本には1872年と記されました。『不思議の国』とつながる別の作品で、二冊の出来事を一つに混ぜないことが大切です。キャロルは1898年1月14日に亡くなりました。残された物語だけでなく、手紙や数学の著作、出版に関わる資料からも、その仕事をたどることができます。", "sources": [{"title": "オックスフォード大学 Christ Church：The Lewis Carroll Collections", "url": "https://www.chch.ox.ac.uk/college/library-archives/lewis-carroll-collection"}, {"title": "セント・アンドルーズ大学 MacTutor：Charles Lutwidge Dodgson", "url": "https://mathshistory.st-andrews.ac.uk/Biographies/Dodgson/"}, {"title": "Lewis Carroll Society：Publishing of Alice", "url": "https://lewiscarrollsociety.org.uk/publishing-of-alice/"}]}, {"title": "言葉と規則に注目して読む", "text": "この図鑑の『不思議の国のアリス』では、体の大きさが変わる驚きに加え、会話がかみ合わない理由にも注目してみましょう。お茶会や裁判では、言葉や規則が思いがけない使われ方をします。アリスが最後に理不尽な判断へ反論するまでを追うと、不思議な出来事をただ受け入れるだけではない、考え続ける主人公の姿が見えてきます。", "sources": [{"title": "Project Gutenberg：Alice’s Adventures in Wonderland（既存作品記事の参照英語本文）", "url": "https://www.gutenberg.org/files/11/11-h/11-h.htm"}]}], "l-frank-baum": [{"title": "物語を書くまでのさまざまな仕事", "text": "L・フランク・ボームは1856年5月15日、アメリカのニューヨーク州チッテナンゴに生まれました。名前のLはライマンの頭文字です。舞台の仕事や店の経営、新聞の編集などを経験しました。最初から『オズ』だけを書いて暮らしていたのではなく、人に楽しんでもらう仕事や、文章を届ける仕事に広く関わった人です。", "sources": [{"title": "南フロリダ大学 Lit2Go：L. Frank Baum", "url": "https://etc.usf.edu/lit2go/authors/29/l-frank-baum/"}, {"title": "Simon & Schuster公式：L. Frank Baum", "url": "https://www.simonandschuster.net/authors/L-Frank-Baum/1569463"}]}, {"title": "西部での暮らしとシカゴへの移動", "text": "1888年、家族とともに、現在のサウスダコタ州にあるアバディーンへ移りました。そこで開いた店は、地域の不景気の中でうまくいかなくなります。その後は新聞を編集しましたが、1891年に一家はシカゴへ移りました。商売と暮らしを立て直そうとする経験があり、作家としての成功までには回り道がありました。", "sources": [{"title": "ネブラスカ大学：Encyclopedia of the Great Plains・Baum", "url": "https://plainshumanities.unl.edu/encyclopedia/doc/egp.lt.003.html"}]}, {"title": "絵のある子供の本を作る", "text": "1897年に『Mother Goose in Prose』、1899年に『Father Goose, His Book』を出版しました。後者では画家W・W・デンスロウと組み、人気を得ます。文章を書くボームと、絵を描くデンスロウは別の人です。二人の協力は、次の『オズの魔法使い』にも続きました。", "sources": [{"title": "米国議会図書館：To Please a Child・ボームとオズの展示", "url": "https://www.loc.gov/exhibits/oz/ozsect1"}]}, {"title": "1900年に生まれた『オズ』", "text": "『オズの魔法使い』は1900年に刊行されました。少女ドロシーが、かかし、ブリキの木こり、ライオンと旅する物語です。初版にはデンスロウの絵が使われ、色彩も本の魅力になりました。後に舞台や映画でも知られるようになりますが、この図鑑で紹介しているのはボームの英語原作です。後の映像作品の設定とは分けています。", "sources": [{"title": "米国議会図書館：To Please a Child・ボームとオズの展示", "url": "https://www.loc.gov/exhibits/oz/ozsect1"}, {"title": "Project Gutenberg：The Wonderful Wizard of Oz 原著（既存記事の参照本文）", "url": "https://www.gutenberg.org/files/55/55-h/55-h.htm"}]}, {"title": "広がったシリーズと最後の作品", "text": "ボームは1919年5月6日に亡くなりました。『オズ』を舞台にした本は、本人が書いたものだけで十四冊あります。最後の『Glinda of Oz』は1920年、没後に出版されました。その後も別の作者たちがシリーズを続けています。『オズ』の名が付く本を、すべてボーム一人が書いたものと考えないことが大切です。", "sources": [{"title": "南フロリダ大学 Lit2Go：L. Frank Baum", "url": "https://etc.usf.edu/lit2go/authors/29/l-frank-baum/"}, {"title": "米国議会図書館：To Please a Child・ボームとオズの展示", "url": "https://www.loc.gov/exhibits/oz/ozsect1"}]}, {"title": "仲間の行動から読む", "text": "この図鑑の『オズの魔法使い』では、かかしたちは自分に足りないものを求めます。けれど、旅の途中の行動には、考える力や思いやり、勇気がすでに表れています。願いをかなえる物を受け取る場面だけでなく、それ以前に何をしていたかを追うと、仲間の姿が違って見えます。原作のドロシーの靴は銀色です。見覚えのある映像と違う点も、原作を読む入口になります。", "sources": [{"title": "Project Gutenberg：The Wonderful Wizard of Oz 原著（既存記事の参照本文）", "url": "https://www.gutenberg.org/files/55/55-h/55-h.htm"}]}], "robert-louis-stevenson": [{"title": "灯台を造る家に生まれる", "text": "ロバート・ルイス・スティーヴンソンは、1850年11月13日、スコットラン
