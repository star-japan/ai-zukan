<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>知識の大図鑑｜試作品</title><style>:root{font-family:system-ui,'Noto Sans JP',sans-serif;color:#243044;background:#f4f6f9}*{box-sizing:border-box}body{margin:0}header{background:#142d48;color:white;padding:24px 18px}header>div,main{max-width:900px;margin:auto}h1{margin:0;font-size:25px}header p{opacity:.85}main{padding:22px 14px}input{width:100%;padding:14px;border:1px solid #cbd5e1;border-radius:12px;font-size:16px;margin:14px 0}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 22px}button{cursor:pointer;border:1px solid #cad3df;border-radius:22px;padding:10px 16px;background:white;color:#203b59;font-size:14px}.active{background:#1b547c;color:white}section{background:white;border-radius:16px;padding:22px;margin:16px 0;box-shadow:0 2px 12px #182b4210}.muted{color:#64748b}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}.card{border:1px solid #dce4ee;border-radius:13px;padding:17px;cursor:pointer;background:#fafcff}.card:hover{border-color:#4685b0}.tag{font-size:12px;color:#527fa0}.back{margin-bottom:12px}h2{margin-top:4px}.notice{border-left:3px solid #e0ad50;padding-left:12px;color:#59677b}footer{padding:30px;text-align:center;color:#64748b;font-size:12px}</style></head><body><header><div><h1>📚 知識の大図鑑</h1><p>400字から始まる、知識の旅。文学・人物・地域をつなぐ試作品</p></div></header><main><input id="search" placeholder="作品・人物・地域を検索（例：羅生門）" aria-label="検索"><nav class="tabs"><button class="active" data-cat="all">すべて</button><button data-cat="literature">文学</button><button data-cat="person">人物</button><button data-cat="region">川崎区</button></nav><div id="app"></div></main><footer>試作版 v0.1｜広告なし・情報は検証しながら拡充します。画像・地図は今後追加予定。</footer><script>
const items=[{id:'rashomon',cat:'literature',name:'羅生門',sub:'芥川龍之介｜1915年発表',intro:'荒廃した京都の羅生門で、仕事を失った下人が雨宿りをしている。生きるために盗人になるか迷う下人は、楼上で死人の髪を抜く老婆を見つける。老婆は、死んだ女も生前に人を欺いていたことを挙げ、生きるための行為だから許されると弁明する。下人はその理屈を自分にも当てはめ、老婆の着物を奪って闇の中へ去る。',people:'下人：失業して善悪の間で揺れる男。老婆：死人の髪を抜いてかつらにしようとする女。',theme:'生存のための悪は正当化できるのか。老婆の理屈が下人自身の悪事を後押しする逆転が重要。',memory:'悪を責めた男が、同じ理屈で悪を行う。',links:['akutagawa','hana','spider']},{id:'akutagawa',cat:'person',name:'芥川龍之介',sub:'1892–1927｜小説家',intro:'東京に生まれた日本の小説家。短編を中心に『羅生門』『鼻』『地獄変』『河童』などを発表した。古典を題材に人間心理や倫理を鋭く描く作品が多い。',people:'作品の背景、時代と作家の人生を今後拡充。',theme:'古典の再解釈と人間の心理。',memory:'『羅生門』『鼻』『蜘蛛の糸』をつなぐ作家。',links:['rashomon','hana','spider']},{id:'hana',cat:'literature',name:'鼻',sub:'芥川龍之介｜1916年発表',intro:'長い鼻に悩む僧・禅智内供は、鼻を短くする方法を試す。願いはかなうが、人々は以前よりも彼を笑う。やがて鼻が元に戻ると、内供は不思議な安心を覚える。',people:'禅智内供：鼻の長さと他人の視線を気にする僧。',theme:'他人の不幸に安心し、幸福を素直に喜べない心理。',memory:'鼻が短くなったのに、悩みは消えなかった。',links:['akutagawa','rashomon']},{id:'spider',cat:'literature',name:'蜘蛛の糸',sub:'芥川龍之介｜1918年発表',intro:'極楽の釈迦は、地獄の犍陀多がかつて蜘蛛を助けたことを思い出し、一本の蜘蛛の糸を垂らす。犍陀多は糸を登るが、後から続く罪人たちを拒絶した瞬間、糸は切れてしまう。',people:'犍陀多：地獄にいる罪人。釈迦：極楽から蜘蛛の糸を垂らす。',theme:'利己心と救済。',memory:'自分だけ助かろうとして糸を失う。',links:['akutagawa','rashomon']},{id:'kawasaki',cat:'region',name:'川崎区ゆるキャラ大図鑑',sub:'地域の産業・歴史・文化を知る',intro:'川崎区に実在する、または歴史的に存在した産業・港湾・交通・寺社・文化などを調べ、出典を確認したうえでオリジナルキャラクターにするプロジェクト。キャラクターから元になった題材の解説、年表、所在地へ進める構成を予定。',people:'各キャラクターの固有ID・モデル・出典・確認状態を管理する。',theme:'地域の知識を、楽しく学べる入口にする。',memory:'かわいいキャラクターの向こうに、川崎区の本当の歴史がある。',links:[]}];
const app=document.getElementById('app'),search=document.getElementById('search');let category='all';function card(x){return `<article class="card" data-id="${x.id}" tabindex="0" role="button"><div class="tag">${x.cat==='literature'?'文学':x.cat==='person'?'人物':'地域'}</div><h3>${x.name}</h3><div class="muted">${x.sub}</div><p>${x.intro.slice(0,75)}…</p><b>詳しく読む →</b></article>`}function home(){let q=search.value.trim().toLowerCase(),found=items.filter(x=>(category==='all'||x.cat===category)&&[x.name,x.sub,x.intro].join(' ').toLowerCase().includes(q));app.innerHTML=`<section><h2>気になる知識から探す</h2><p class="muted">作品を読んだら、人物や関連作品へ。短い概要から詳しい解説に進めます。</p><div class="cards">${found.map(card).join('')||'該当する記事はありません。'}</div></section>`;bind()}function detail(id){const x=items.find(i=>i.id===id);if(!x)return home();app.innerHTML=`<button class="back" id="back">← 一覧に戻る</button><section><div class="tag">${x.sub}</div><h2>${x.name}</h2><p class="muted">まずは短時間で全体像をつかむ</p><h3>あらすじ・概要</h3><p>${x.intro}</p><button id="expand">もっと深く知る ▾</button><div id="extra" hidden><h3>登場人物・関連情報</h3><p>${x.people}</p><h3>作品が問いかけること</h3><p>${x.theme}</p><h3>記憶に残るポイント</h3><p>${x.memory}</p><p class="notice">詳しい年表・地図・原典比較・出典リンクは次の制作段階で追加します。未確認の執筆地やロケ地は掲載しません。</p></div></section><section><h3>次に読む</h3><div class="cards">${x.links.map(i=>card(items.find(z=>z.id===i))).join('')||'<p>関連項目を準備中です。</p>'}</div></section>`;document.getElementById('back').onclick=home;document.getElementById('expand').onclick=()=>{const e=document.getElementById('extra');e.hidden=!e.hidden};bind();window.scrollTo(0,0)}function bind(){document.querySelectorAll('[data-id]').forEach(e=>{e.onclick=()=>detail(e.dataset.id);e.onkeydown=k=>{if(k.key==='Enter')detail(e.dataset.id)}})}document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{category=b.dataset.cat;document.querySelectorAll('[data-cat]').forEach(x=>x.classList.toggle('active',x===b));home()});search.oninput=home;home();
</script></body></html>
