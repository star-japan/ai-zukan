026-11-01T23:57:20+09:00"}, {"id": "K-000021", "subject": "石油タンク", "subjectReading": "せきゆたんく", "name": "たんくしずね", "category": "エネルギー・貯蔵設備", "timeScope": "2013年末の市港湾台帳を根拠とする歴史題材。現在の内容物・容量・稼働状態は示さない。", "factText": "川崎市の港湾計画資料には、2013年末の水江町の設備として、石油関連の貯蔵施設が記録されています。石油タンクは、石油を貯蔵するための設備です。川崎臨海部の産業を、材料や燃料を蓄える役割から知る題材になります。", "fictionText": "低くどっしりした円筒形の体に、丸い屋根を載せた案内役。慌てず、物を大切に預かる性格です。名前と姿は創作で、特定の施設や実際のタンク形式を正確に再現したものではありません。", "sources": [{"title": "川崎市「川崎港港湾計画資料（その1）改訂」表Ⅷ－4－22 貯油施設等", "url": "https://www.city.kawasaki.jp/580/cmsfiles/contents/0000063/63390/kouwankeikakusiryou1.pdf", "publisher": "川崎市（川崎港港湾管理者）", "supports": "本文122頁／PDF126頁に2013年末現在の水江町の石油関連貯蔵施設を掲載。容量・個別機番・配置はカードには採用しない。", "publishedDate": null, "publicationDateNote": "2014年11月改訂。表の調査時点は2013年末。", "checkedDate": "2026-11-01", "sourceDateText": "2014年11月", "publishedDatePrecision": "month", "pdfPageOneBased": 126}, {"title": "川崎市川崎区「かわさきの工場夜景」", "url": "https://www.city.kawasaki.jp/kawasaki/page/0000027500.html", "publisher": "川崎市川崎区", "supports": "川崎臨海部に石油などの産業が集積する地域背景。観光・文化紹介としてのみ使用。", "publishedDate": null, "publicationDateNote": "発行日未確定。閲覧確認日とは区別。", "checkedDate": "2026-11-01"}], "image": "assets/k-000021.webp", "imageAlt": "石油タンクを題材にした非公式の創作キャラクター案", "imageSha256": "f9055a66418f157208c67500068e632d3d95b00cd7e383b99128dbfdd73b1016", "imageWidth": 900, "imageHeight": 600, "firstPublishedAt": "2026-11-01T23:57:20+09:00", "updatedAt": "2026-11-01T23:57:20+09:00"}, {"id": "K-000022", "subject": "蒸留塔", "subjectReading": "じょうりゅうとう", "name": "とうすみわけ", "category": "石油産業・成分を分ける設備", "timeScope": "現代の地域産業を公開資料で紹介。現在の設備能力・操業状態は記載しない。", "factText": "川崎区水江町の東亜石油・京浜製油所では、公式の設備紹介に蒸留装置が掲載されています。原油にはさまざまな成分が含まれ、蒸留では沸点の違いを利用して成分を分けます。高い塔の形から、材料を分けるものづくりの役割を知る題材です。", "fictionText": "細長い塔の体に、いくつかの丸い帯をまとった案内役。物事の違いを丁寧に見つけるのが得意です。名前、表情、形は創作で、実際の蒸留塔の内部構造や操作方法を示す図ではありません。", "sources": [{"title": "東亜石油「設備紹介」", "url": "https://www.toaoil.co.jp/business/facility.html", "publisher": "東亜石油株式会社", "supports": "京浜製油所の蒸留装置と、沸点の違いで原油の成分を分ける一般的役割。能力・温度等の数値は採用しない。", "publishedDate": null, "publicationDateNote": "発行日未確定。閲覧確認日とは区別。", "checkedDate": "2026-11-02"}, {"title": "川崎市観光協会「東亜石油（株）京浜製油所」", "url": "https://www.k-kankou.jp/study/facility/detail.html?CN=53613", "publisher": "一般社団法人川崎市観光協会", "supports": "所在地が川崎市川崎区水江町であること。見学の受付状況・条件は本文に採用しない。", "publishedDate": null, "publicationDateNote": "発行日未確定。閲覧確認日とは区別。", "checkedDate": "2026-11-02"}], "image": "assets/k-000022.webp", "imageAlt": "蒸留塔を題材にした非公式の創作キャラクター案", "imageSha256": "af4dae4c7f71266d2f6bd2730d4ac8ab38e56c1382313dd2bd822c0ba7bde32a", "imageWidth": 900, "imageHeight": 900, "firstPublishedAt": "2026-11-02T00:18:35+09:00", "updatedAt": "2026-11-02T00:18:35+09:00"}, {"id": "K-000023", "subject": "水素", "subjectReading": "すいそ", "name": "すいそより", "category": "資源循環・化学の素材", "timeScope": "2025年10月の市発表時点の事業紹介に基づく。2030年の計画と実績を区別。", "factText": "川崎区扇町のレゾナック川崎事業所には、使用済みプラスチックを化学原料へ再生する取組があります。川崎市の2025年の発表では、プラスチック由来の水素がアンモニアの原料の一つとして使われていると紹介されています。水素を通して、地域の資源循環と化学産業のつながりを知ることができます。", "fictionText": "同じ大きさの二つの丸がつながった、協力好きの案内役。丸い形は水素分子をイメージした創作表現です。顔と配色は創作で、水素の実際の色や見た目、危険性を示すものではありません。", "sources": [{"title": "川崎市「株式会社レゾナックがプラスチックのケミカルリサイクルによる低炭素アンモニア事業の拡大を決定しました」", "url": "https://www.city.kawasaki.jp/templates/prs/cmsfiles/contents/0000181/181094/20251006_press.pdf", "publisher": "川崎市／別紙：株式会社レゾナック・ホールディングス", "supports": "使用済みプラスチック由来の水素を原料の一つにアンモニアを製造。2030年の原料転換は計画として記載。", "publishedDate": "2025-10-06", "publicationDateNote": "市報道発表・別紙とも2025-10-06。2030年計画を現在の実績とはしない。", "checkedDate": "2026-11-02"}, {"title": "川崎市川崎区「川崎臨海部オープンファクトリー（令和8年事業は終了しました）」", "url": "https://www.city.kawasaki.jp/kawasaki/page/0000183651.html", "publisher": "川崎市川崎区", "supports": "レゾナック川崎事業所の所在地が川崎区扇町であることと、使用済みプラスチックのリサイクル紹介。", "publishedDate": "2026-01-21", "publicationDateNote": "公開日2026-01-21、更新日2026-04-10。終了済み事業の記録。", "checkedDate": "2026-11-02", "updatedDate": "2026-04-10"}], "image": "assets/k-000023.webp", "imageAlt": "水素を題材にした非公式の創作キャラクター案", "imageSha256": "2dc7e64f8d525eec5af74dc9758cfb70729f40074b633efd935864389ac3bdab", "imageWidth": 900, "imageHeight": 600, "firstPublishedAt": "2026-11-02T00:18:35+09:00", "updatedAt": "2026-11-02T00:18:35+09:00"}, {"id": "K-000024", "subject": "PET再生", "subjectReading": "ぺっとさいせい", "name": "ぺともどり", "category": "資源循環・ペットボトル", "timeScope": "現代の企業公開情報による地域産業紹介。回収量・再生率・環境効果の数値や当日の操業は主張しない。", "factText": "川崎区扇町のペットリファインテクノロジーは、使用済みペットボトルをリサイクルし、再生PET樹脂を製造しています。再びペットボトルの原料にする「ボトルtoボトル」の取組です。捨てた後にも資源としてつながる、身近な容器と地域産業の関係を知ることができます。", "fictionText": "無地のボトル形の体に、戻り道をイメージした小さな輪のリボンを持つ案内役。もう一度役立つ方法を考えるのが好きです。名前と姿は創作で、飲料ブランドや企業の公式キャラクターではありません。", "sources": [{"title": "ペットリファインテクノロジー「企業情報」", "url": "https://www.prt.jp/company/", "publisher": "ペットリファインテクノロジー株式会社", "supports": "川崎区扇町への立地、使用済みペットボトルのリサイクルと再生PET樹脂の製造・販売。", "publishedDate": null, "publicationDateNote": "発行日未確定。閲覧確認日とは区別。", "checkedDate": "2026-11-02"}, {"title": "ペットリファインテクノロジー「事業・製品紹介」", "url": "https://www.prt.jp/", "publisher": "ペットリファインテクノロジー株式会社", "supports": "使用済みペットボトルから再びペットボトルの原料となる再生PET樹脂を製造するボトルtoボトルの取組。", "publishedDate": null, "publicationDateNote": "発行日未確定。閲覧確認日とは区別。", "checkedDate": "2026-11-02"}], "image": "assets/k-000024.webp", "imageAlt": "PET再生を題材にした非公式の創作キャラクター案", "imageSha256": "3842e7ac1c3bd4d68ddbbcd4b6fadea0f5d3abceaac6a20fb550dff76ff23659", "imageWidth": 600, "imageHeight": 900, "firstPublishedAt": "2026-11-02T00:18:35+09:00", "updatedAt": "2026-11-02T00:18:35+09:00"}, {"id": "K-000025", "subject": "味の素", "subjectReading": "あじのもと", "name": "うまみひとかけ", "category": "食と産業史・うま味", "timeScope": "1914年の川崎工場での生産開始を紹介する歴史題材。現在の製造品目や製法は主張しない。", "factText": "うま味調味料「味の素」は、1914年に川崎工場での生産が始まりました。川崎区鈴木町にある事業所と、地域の食品産業の歴史に関わる題材です。ここでは商品の公式キャラクターではなく、うま味を伝える結晶のイメージから独自の創作案を考えています。", "fictionText": "細長い結晶を丸くデフォルメした、小さな聞き上手の案内役。料理に関わる人の話を集めるのが好きです。名前と姿は創作で、実際の結晶構造や商品の形、企業の公式キャラクターを再現したものではありません。", "sources": [{"title": "川崎市「川崎臨海部ニュースレター vol.30」味の素株式会社インタビュー", "url": "https://www.city.kawasaki.jp/590/page/0000147062.html", "publisher": "川崎市", "supports": "うま味調味料の事業化と、川崎工場の歴史。創業と川崎への工場進出は別の出来事。", "publishedDate": "2023-01-18", "publicationDateNote": "公開・更新日2023-01-18。工場の歴史を紹介する資料。", "checkedDate": "2026-11-02"}, {"title": "味の素「川崎事業所を再構築」参考：川崎事業所沿革", "url": "https://www.ajinomoto.co.jp/company/jp/presscenter/press/detail/2005_01_31.html", "publisher": "味の素株式会社", "supports": "川崎区鈴木町への立地、1914年の川崎工場での「味の素」生産開始。2005年の投資計画や人数・現行商品は採用しない。", "publishedDate": "2005-01-31", "publicationDateNote": "2005年の発表にある歴史年表のみを利用。現況を保証する資料ではない。", "checkedDate": "2026-11-02"}], "image": "assets/k-000025.webp", "imageAlt": "味の素を題材にした非公式の創作キャラクター案", "imageSha256": "62d4c0315c33f37e82da8cf2b695028c252af5202200e578b22262d0a8c357c6", "imageWidth": 600, "imageHeight": 900, "firstPublishedAt": "2026-11-02T00:27:07+09:00", "updatedAt": "2026-11-02T00:27:07+09:00"}, {"id": "K-000026", "subject": "食塩", "subjectReading": "しょくえん", "name": "しおはましかく", "category": "食と地域史・塩づくり", "timeScope": "塩浜の塩田の歴史と、現在の夜光の企業紹介を分けて扱う。現在も塩浜に塩田があるとはしない。", "factText": "川崎市の展示資料では、川崎区塩浜はかつて塩田があり、塩づくりが盛んだった地域と紹介されています。一方、現在の川崎区夜光には、家庭用や業務用の塩を製造する日本食塩製造があります。昔の塩田と今の製造業を区別しながら、食塩と地域のつながりを知ることができます。", "fictionText": "立方体の塩の結晶をイメージした、角の丸い案内役。昔の海辺の暮らしの話を大切にしています。名前と姿は創作で、現在の製品の原料が川崎の海で採れたという意味ではありません。", "sources": [{"title": "川崎市環境デジタルアーカイブ「1800年以前～1960年ごろ」展示パネル", "url": "https://www.digital-archive-env.city.kawasaki.jp/virtual-exhibition-room/pdf/pdf/1800_1960.pdf", "publisher": "川崎市", "supports": "PDF2頁：川崎区塩浜の塩田と塩づくりの歴史。塩田が1910年になくなったとの記載。", "publishedDate": null, "publicationDateNote": "発行日未確定。閲覧確認日とは区別。", "checkedDate": "2026-11-02", "pdfPageOneBased": 2}, {"title": "日本食塩製造「企業情報」", "url": "https://www.nihon-s-gr.com/company/", "publisher": "日本食塩製造株式会社", "supports": "川崎区夜光への立地、家庭用・業務用塩の製造という事業。", "publishedDate": null, "publicationDateNote": "発行日未確定。閲覧確認日とは区別。", "checkedDate": "2026-11-02"}], "image": "assets/k-000026.webp", "imageAlt": "食塩を題材にした非公式の創作キャラクター案", "imageSha256": "1a7b2fea0a3c00aebed70bbb4407c71acdfc55d04aaa1a3480fd91836a0c4519", "imageWidth": 900, "imageHeight": 769, "firstPublishedAt": "2026-11-02T00:27:07+09:00", "updatedAt": "2026-11-02T00:27:07+09:00"}, {"id": "K-000027", "subject": "ステンレス", "subjectReading": "すてんれす", "name": "すてんつやり", "category": "ものづくり・金属材料", "timeScope": "現在公開されている所在地・事業・材料解説をもとに紹介。設備の稼働状況や製造量は未確認。", "factText": "川崎区小島町の日本冶金工業・川崎製造所は、ステンレス鋼などの製造拠点です。ステンレスはさびにくい特性を持つ金属材料で、用途や使う環境に合わせてさまざまな種類が用いられます。地域のものづくりを、材料の特性から知る題材です。", "fictionText": "くるりと巻いた金属の帯を体にした、手入れを大切にする案内役。光を柔らかく映す姿が目印です。名前と姿は創作で、特定の製品や、絶対にさびない材料を表すものではありません。", "sources": [{"title": "日本冶金工業「国内拠点」", "url": "https://www.nyk.co.jp/about/access.html", "publisher": "日本冶金工業株式会社", "supports": "川崎製造所が川崎市川崎区小島町にあること。", "publishedDate": null, "publicationDateNote": "発行日未確定。閲覧確認日とは区別。", "checkedDate": "2026-11-02"}, {"title": "日本冶金工業「未来へ向けたものづくりの挑戦」", "url": "https://nyk.co.jp/about/stories/future/", "publisher": "日本冶金工業株式会社", "supports": "川崎製造所がステンレス鋼・高機能材の製造拠点であること。", "publishedDate": null, "publicationDateNote": "発行日未確定。閲覧確認日とは区別。", "checkedDate": "2026-11-02"}, {"title": "日本冶金工業「製品情報」", "url": "https://www.nyk.co.jp/products/", "publisher": "日本冶金工業株式会社", "supports": "ステンレスのさびにくさと、使用環境や条件に応じた特性・用途。", "publishedDate": null, "publicationDateNote": "発行日未確定。閲覧確認日とは区別。", "checkedDate": "2026-11-02"}], "image": "assets/k-000027.webp", "imageAlt": "ステンレスを題材にした非公式の創作キャラクター案", "imageSha256": "78efa7660ad2058c9f06ae0b27cca57e4b5594250f06b6886ef099f8cc245b25", "imageWidth": 900, "imageHeight": 750, "firstPublishedAt": "2026-11-02T00:27:07+09:00", "updatedAt": "2026-11-02T00:27:07+09:00"}, {"id": "K-000028", "subject": "コブシの花", "subjectReading": "こぶしのはな", "name": "こぶしほころ", "category": "自然・公園の植物", "timeScope": "2025年3月の公園公式の植栽紹介を根拠にする。現在の開花状況や樹木の状態は未確認。", "factText": "大師公園の公式サイトは、2025年3月、大師こども文化センター前に植えられたコブシを紹介しています。大師公園は川崎区にあり、身近な公園の植物として地域との関係を確認できます。コブシは川崎区の「区の花」「区の木」ではありません。", "fictionText": "白い花びらをふわりと広げ、小さな枝の体で立つ案内役。春の小さな変化を見つけるのが好きです。名前と表情は創作で、公園の公式キャラクターや植物の正確な標本図ではありません。", "sources": [{"title": "大師公園「開花情報（ハクモクレン・コブシ）」", "url": "https://daishi-park.com/shinshuen/post-2178/", "publisher": "大師公園公式サイト", "supports": "大師こども文化センター前のコブシ植栽を2025年3月14日に紹介。開花や植栽の現在状態は保証しない。", "publishedDate": "2025-03-14", "publicationDateNote": "投稿日2025-03-14。当日の観察記録と現在の開花状況は区別。", "checkedDate": "2026-11-02"}, {"title": "川崎市こどもページ「3 大師公園」", "url": "https://www.city.kawasaki.jp/kawasakiu18/page/0000001894.html", "publisher": "川崎市", "supports": "大師公園が川崎区大師公園1に所在し、daishi-park.comを公園ホームページとして案内していること。", "publishedDate": "2011-08-23", "publicationDateNote": "公開日2011-08-23、更新日2024-03-14。", "checkedDate": "2026-11-02", "updatedDate": "2024-03-14"}, {"title": "川崎市川崎区「川崎区の『区の花』『区の木』を制定しました」", "url": "https://www.city.kawasaki.jp/kawasaki/page/0000041570.html", "publisher": "川崎市川崎区", "supports": "区制40周年の区の木としてイチョウと長十郎梨を制定。区の花はひまわりとビオラ。", "publishedDate": "2012-04-01", "publicationDateNote": "公開日2012-04-01、更新日2025-01-17。", "checkedDate": "2026-11-02", "updatedDate": "2025-01-17"}], "image": "assets/k-000028.webp", "imageAlt": "コブシの花を題材にした非公式の創作キャラクター案", "imageSha256": "6a09a81dfab0523bc8886a01090c9dfabbd3c609b1e25f13c54364429c7b564e", "imageWidth": 750, "imageHeight": 900, "firstPublishedAt": "2026-11-02T00:39:10+09:00", "updatedAt": "2026-11-02T00:39:10+09:00"}, {"id": "K-000029", "subject": "イチョウ", "subjectReading": "いちょう", "name": "いちょうしおり", "category": "自然・区のシンボル", "timeScope": "2012年に制定された区の木と、市が紹介する地域の樹木を題材にする。現在の黄葉状態は未確認。", "factText": "イチョウは、長十郎梨とともに川崎区の「区の木」に選ばれています。区制40周年を記念して制定されました。また、川崎市の「まちの樹50選」には、川崎区の稲毛神社のイチョウが掲載されています。地域で親しまれる木を知る題材です。", "fictionText": "扇形の葉を体にした、小さなしおりを持つ案内役。街で見つけた季節の記憶を集めています。名前と姿は創作で、区の木の公式ロゴや、神社の公式キャラクターではありません。", "sources": [{"title": "川崎市川崎区「川崎区の『区の花』『区の木』を制定しました」", "url": "https://www.city.kawasaki.jp/kawasaki/page/0000041570.html", "publisher": "川崎市川崎区", "supports": "区制40周年の区の木としてイチョウと長十郎梨を制定。区の花はひまわりとビオラ。", "publishedDate": "2012-04-01", "publicationDateNote": "公開日2012-04-01、更新日2025-01-17。", "checkedDate": "2026-11-02", "updatedDate": "2025-01-17"}, {"title": "川崎市「まちの樹50選」", "url": "https://www.city.kawasaki.jp/530/page/0000018370.html", "publisher": "川崎市", "supports": "川崎区稲毛神社のイチョウを掲載。", "publishedDate": "2023-12-15", "publicationDateNote": "公開日2023-12-15、更新日2025-11-12。樹勢や当日の見学可否は示さない。", "checkedDate": "2026-11-02", "updatedDate": "2025-11-12"}], "image": "assets/k-000029.webp", "imageAlt": "イチョウを題材にした非公式の創作キャラクター案", "imageSha256": "a46df50f89a5219d896975e2c5feb8fb9a570ce7b5bc707de008ec7d77670367", "imageWidth": 900, "imageHeight": 822, "firstPublishedAt": "2026-11-02T00:39:10+09:00", "updatedAt": "2026-11-02T00:39:10+09:00"}, {"id": "K-000030", "subject": "工場夜景の照明", "subjectReading": "こうじょうやけいのしょうめい", "name": "よあかりぽつり", "category": "産業文化・夜の景観", "timeScope": "区と観光協会の公開紹介による文化題材。特定施設の現在の照明・稼働・観賞条件は示さない。", "factText": "川崎区の公式紹介では、臨海部の工場の夜間照明などが工場夜景を形づくる要素として説明されています。川崎市観光協会も、工場の作業用の明かりが生む景観を紹介しています。働く場所の光から生まれる、地域の産業文化を知る題材です。", "fictionText": "小さな照明器具をイメージした、夜の光の案内役。強く目立つより、そっと周りを照らすのが好きです。名前と姿は創作で、特定の工場の照明器具や配置を再現したものではありません。", "sources": [{"title": "川崎市川崎区「かわさきの工場夜景」", "url": "https://www.city.kawasaki.jp/kawasaki/page/0000027500.html", "publisher": "川崎市川崎区", "supports": "川崎臨海部の工場の夜間照明などが工場夜景を形づくる地域文化紹介。", "publishedDate": "2012-04-10", "publicationDateNote": "公開・更新日2012-04-10。古い資料の現況表現や施設稼働・ツアー状況は引き継がない。", "checkedDate": "2026-11-02"}, {"title": "川崎市観光協会「工場夜景」", "url": "https://www.k-kankou.jp/industrial_night/", "publisher": "一般社団法人川崎市観光協会", "supports": "川崎臨海部の工場の作業用の明かりと工場夜景。点灯時刻・ツアー募集・個別施設の稼働は未確認。", "publishedDate": null, "publicationDateNote": "発行日未確定。閲覧確認日とは区別。", "checkedDate": "2026-11-02"}], "image": "assets/k-000030.webp", "imageAlt": "工場夜景の照明を題材にした非公式の創作キャラクター案", "imageSha256": "348ade551e7e72ab8f6bb1a95f6f8291087f37a61e74909d9990be4b14e0902d", "imageWidth": 900, "imageHeight": 832, "firstPublishedAt": "2026-11-02T00:39:10+09:00", "updatedAt": "2026-11-02T00:39:10+09:00"}];
function mascotDraftSection(){return `<section class="mascot-drafts"><h3>制作中のキャラクター案</h3><p class="subnote">新しい掲載・更新順</p><p class="subnote">川崎区に関わる題材をもとにした、当図鑑独自の創作案です。自治体・施設・企業の公式キャラクターではありません。名称とデザインは仮案で、正式登録済みの件数には含めていません。</p><div class="mascot-grid">${[...mascotDrafts].sort((a,b)=>Math.max(Date.parse(b.updatedAt)||0,Date.parse(b.firstPublishedAt)||0)-Math.max(Date.parse(a.updatedAt)||0,Date.parse(a.firstPublishedAt)||0)).map(m=>`<section class="mascot-draft"><div class="mascot-status">${esc(m.id)} · 制作中・仮称</div><h4>${esc(m.name)}</h4>${m.firstPublishedAt?`<p class="subnote">案の初回掲載：${timestampText(m.firstPublishedAt)}<br>案の更新：${timestampText(m.updatedAt)}</p>`:""}${m.reviewNote?`<p class="subnote">${esc(m.reviewNote)}</p>`:""}<p class="mascot-subject">題材：${m.subject===m.subjectReading?esc(m.subject):rubyText(m.subject,m.subjectReading)}</p>${m.image?`<figure><img src="${esc(m.image)}" alt="${esc(m.imageAlt)}" loading="lazy" width="${m.imageWidth||900}" height="${m.imageHeight||822}"></figure>`:'<p class="subnote">キャラクター画像を制作中です。</p>'}<h5>題材の本当の話</h5><p>${esc(m.factText)}</p><p class="subnote">${esc(m.timeScope)}</p><h5>キャラクターの創作設定</h5><p>${esc(m.fictionText)}</p><p class="background-sources">出典：${m.sources.map(z=>`<a href="${esc(z.url)}" target="_blank" rel="noopener noreferrer">${esc(z.title)} ↗</a>`).join(' ／ ')}</p></section>`).join('')}</div></section>`}
function characterGallery(x){if(!x.characterGallery)return '';return `<section class="character-gallery" aria-labelledby="character-gallery-title"><h3 id="character-gallery-title">登場人物</h3><div class="character-face-grid">${x.characterGallery.map(c=>`<article class="character-face-card${(c.wide||c.portraits.length>2)?' character-face-wide':''}"><div class="character-face-images${c.portraits.length>1?' paired':''}">${c.portraits.map(p=>`<figure><img src="${esc(p.src)}" width="${p.width}" height="${p.height}" alt="${esc(p.alt)}" loading="lazy" decoding="async">${p.label?`<figcaption>${bodyText(x,p.label)}</figcaption>`:''}</figure>`).join('')}</div><h4>${x.characterNamesUseBodyReadings?bodyText(x,c.name):characterName(c.name)}</h4><p>${bodyText(x,c.role)}</p></article>`).join('')}</div></section>`}

function authorPlaceGuide(x){const g=x.placeGuide;if(!g)return '';return `<section class="author-place-guide"><h3>${bodyText(x,g.title)}</h3><ol class="place-orientation" aria-label="地域の位置づけ">${g.orientation.map(v=>`<li>${bodyText(x,v)}</li>`).join('')}</ol><p>${bodyText(x,g.note)}</p><div class="place-guide-grid">${g.places.map(v=>`<section class="place-guide-item"><span class="place-guide-label">${bodyText(x,v.label)}</span><h4>${bodyText(x,v.name)}</h4><p>${bodyText(x,v.note)}</p></section>`).join('')}</div><section class="place-guide-item"><span class="place-guide-label">現在の資料館を地図で見る</span><h4>${bodyText(x,g.museum.name)}</h4><p>${bodyText(x,g.museum.address)}</p><a class="place-guide-map" href="${esc(g.museum.mapUrl)}" target="_blank" rel="noopener noreferrer">Google マップで位置を見る ↗</a><a href="${esc(g.museum.url)}" target="_blank" rel="noopener noreferrer">記念館の公式案内 ↗</a><p class="place-guide-note">${bodyText(x,g.museum.note)}</p></section></section>`}

function introductionText(x){return bodyText(x,x.intro)}
const reflectionPrompts = {"rashomon": ["自分だったら、あの場面でどうするだろう。", "生きるためなら、どこまで許されるのだろう。", "自分に都合のいい理由をつけていないか、考えたくなる。"], "spider": ["自分だけ助かりたいと思う気持ちは、誰にでもあるのかもしれない。", "誰かを思いやるのは、余裕がないときほど難しい。", "一本の糸が希望にも試練にも見える。"], "ginga": ["本当の幸せって何だろう。", "大切な人との時間をもっと大事にしたい。", "美しい旅なのに、少し寂しい気持ちになる。"], "cat": ["猫の目で見ると、人間の行動って不思議だ。", "笑えるけれど、少し自分にも当てはまりそう。", "当たり前だと思うことを疑ってみたくなる。"], "gloves": ["知らない相手にも優しさがあるかもしれない。", "子ぎつねの勇気を応援したくなる。", "親が子を心配する気持ちが伝わってくる。"], "takasebune": ["幸せの形は人によって違うのかもしれない。", "正しいかどうか、簡単には決められない。", "相手の事情を知ることの大切さを感じる。"], "yamanashi": ["水の中の世界を想像するのが楽しい。", "季節が変わると景色も気持ちも変わる。", "説明されない部分を自分で考えるのも面白い。"], "sanshodayu": ["どんなときも優しさを忘れずにいたい。", "家族を思う気持ちが胸に残る。", "苦しんでいる人に気づけるだろうか。"], "crimeandpunishment": ["自分の心からは逃げられないのかもしれない。", "正しさを理屈だけで決めていいのだろうか。", "人は誰かとの関わりで変わることがある。"], "romeoandjuliet": ["周りの争いが二人の未来を奪うのは悲しい。", "気持ちを伝えるタイミングって大切だ。", "好きという気持ちだけでは越えられない壁もある。"], "happyprince": ["本当の美しさは行動に表れるのかもしれない。", "誰かを助けたい気持ちに心を動かされる。", "自分ならどんな小さな親切ができるだろう。"], "momotaro": ["仲間と力を合わせるのは心強い。", "鬼の側から見た物語も気になる。", "子どもの頃と今とでは感じ方が違う。"], "redcap": ["知らない相手を信じる怖さを感じる。", "森の道を歩く気持ちになって読んだ。", "小さな約束にも意味があるのかもしれない。"], "aliceinwonderland": ["常識が通じない世界は面白い。", "次に何が起こるか分からなくてわくわくする。", "当たり前のルールも見方次第で変わる。"], "cinderella": ["希望を持ち続ける強さを感じる。", "幸せは誰かに選ばれることだけだろうか。", "魔法だけでなく日々の暮らしにも目が向く。"], "urashimataro": ["楽しい時間ほどあっという間に過ぎる。", "帰る場所が変わってしまう寂しさを感じる。", "約束の意味を考えたくなる。"], "uglyduckling": ["周りと違っても価値がないわけじゃない。", "見た目で判断していないか振り返る。", "居場所が見つかるまでの時間も大切なのかもしれない。"], "mermaid": ["誰かを好きになることは切ない。", "願いがかなえば幸せとは限らない。", "自分の気持ちも大事にしてほしい。"], "christmas-carol": ["今からでも行動を変えられるかもしれない。", "身近な人にもっと優しくしたい。", "過去と未来を見つめると今が違って見える。"], "little-match-girl": ["少女の見た温かな景色が忘れられない。", "困っている人に気づけるだろうか。", "短い話なのに長く心に残る。"], "hamlet": ["考えすぎて動けなくなる気持ちが分かる。", "疑いが人間関係を壊していくのが怖い。", "正しい決断とは何だろう。"], "melos": ["信じることは、言葉だけでなく行動でも示せるのだろうか。", "友達を信じて待つのも勇気がいる。", "約束を守るために自分ならどこまで頑張れるだろう。"], "restaurant": ["お客さんだと思っていたのに、立場が逆転するのが怖い。", "都合のいい言葉を疑わず信じていないだろうか。", "面白い話なのに、最後はぞっとする。"], "gongitsune": ["気持ちが伝わらないまま終わるのが切ない。", "相手を思うなら、伝え方も大事なのかもしれない。", "ごんと兵十が話せていたら、何か変わっただろうか。"], "goshu": ["苦手なことも、続けるうちに少しずつ変わる。", "教える側と教わる側が入れ替わるのが面白い。", "誰かの言葉に耳を傾ける余裕を持ちたい。"], "toshishun": ["お金があれば本当に幸せになれるのだろうか。", "最後に大切なものが何か気づく場面が心に残る。", "自分なら何を手放せずにいるだろう。"], "yodaka": ["見た目で誰かを傷つけていないだろうか。", "よだかの悲しさを思うと胸が苦しい。", "自分の居場所を探す気持ちは分かる気がする。"], "trolley": ["子どものころ、遠くまで来て急に不安になったことを思い出す。", "楽しかった時間が一瞬で怖さに変わるのが印象的。", "大人になっても忘れられない景色がある。"], "lamp": ["便利になることと、古いものを大切にすることは両立できるだろうか。", "仕事に誇りを持つ気持ちが伝わってくる。", "変化を受け入れるのは簡単ではない。"], "botchan": ["正直でいることと、周りとうまくやることは難しい。", "坊っちゃんのまっすぐさが気持ちいい。", "自分ならあの職場でどう振る舞うだろう。"], "kokoro": ["相手に言えない気持ちが関係を変えてしまう。", "信頼はどうすれば守れるのだろう。", "誰かの心を完全に理解するのは難しい。"], "lemon": ["気分が沈んだとき、小さなものが世界を変えて見せることもある。", "色や形の描写を読むだけで景色が浮かぶ。", "自分にとっての『檸檬』は何だろう。"], "sangetsuki": ["自尊心と臆病さが自分にもある気がする。", "才能があっても、それだけでは苦しいのかもしれない。", "人に弱さを見せる勇気も必要だろうか。"], "yumejuya": ["夢の中では当たり前のことが不思議に感じる。", "意味が分からない場面も、心に残る。", "同じ夢を見ても人によって受け取り方が違いそう。"], "maihime": ["自分の夢と誰かへの責任がぶつかったらどうするだろう。", "選ばなかった道のことも考えてしまう。", "相手の立場から読み直すと印象が変わる。"], "ningen": ["周りに合わせ続ける苦しさを考えた。", "本当の自分を見せるのは怖いこともある。", "人の弱さを簡単に決めつけたくない。"], "hitofusanobudo": ["悪いことをしてしまった後、どう向き合うかが大切なのかもしれない。", "許されることの温かさが心に残る。", "子どものころの後悔を思い出す。"], "donquixote": ["夢を追う姿は滑稽でも、少しうらやましい。", "現実を見ることと理想を持つことは両立できるだろうか。", "周りと違う考えを持つ人をどう受け止めるだろう。"], "orion": ["夜空の星に物語があると、空を見るのが楽しくなる。", "同じ星でも昔の人には別の姿が見えていた。", "強さだけでは語れない人物像が気になる。"], "andromeda": ["星座の形から壮大な物語を想像できるのが面白い。", "誰かを救う話にも、いろいろな立場がある。", "夜空を見るたびに物語を思い出しそう。"], "hansel": ["不安なときに兄妹で助け合う姿が心強い。", "知恵を使って危険から抜け出すところが面白い。", "甘いものにひかれる気持ちが怖さにつながる。"], "wizardofoz": ["探していた力は最初から自分の中にあったのかもしれない。", "仲間と旅をすると、一人では気づけないことがある。", "帰りたい場所があることの大切さを感じる。"], "treasure-island": ["冒険にはわくわくと怖さが一緒にある。", "信用できる人を見分けるのは難しい。", "宝物より旅で得た経験の方が大きいのかもしれない。"], "kaguyahime": ["美しいものを手に入れたい気持ちについて考える。", "別れが決まっているからこそ、一緒の時間が大切に思える。", "かぐや姫自身の望みは何だったのだろう。"], "snow-white": ["親切そうに見える相手にも注意が必要かもしれない。", "見た目の美しさだけで価値は決まらない。", "誰を信じるかが運命を変える物語だと思う。"], "pussinboots": ["知恵と工夫で状況を変えるのが痛快。", "うまくいったからといって、やり方まで正しいのだろうか。", "猫の行動力を少し見習いたい。"], "emperors-new-clothes": ["周りに合わせて本当のことを言えない場面は身近にもある。", "子どもの一言が空気を変えるのが面白い。", "自分なら正直に言えただろうか。"], "amanoiwato": ["誰かが閉じこもったとき、周りに何ができるだろう。", "みんなで工夫する姿に明るさを感じる。", "太陽が戻る場面を想像するとわくわくする。"], "tanabata": ["会える時間が少ないからこそ大切に思えるのかもしれない。", "星空に願いを重ねる気持ちは今も変わらない。", "約束を待つ時間はどんな気持ちだろう。"], "lesmiserables": ["一度の過ちだけで人を判断していいのだろうか。", "誰かの優しさが人生を変えることもある。", "正義と慈悲がぶつかるとき、どう考えるべきだろう。"], "frankenstein": ["生み出したものへの責任はどこまであるのだろう。", "見た目だけで恐れられる悲しさを感じる。", "孤独が人を変えてしまうことを考えた。"], "makuranososhi": ["昔の人も季節の美しさに心を動かされていた。", "何気ない日常を言葉にするのは楽しい。", "自分なら『をかし』と思うものを何と書くだろう。"], "genjimonogatari": ["人の気持ちは時代が違っても複雑だ。", "華やかな暮らしの裏にも寂しさがある。", "登場人物それぞれの立場から読み直してみたい。"], "takekurabe": ["大人になることで失うものもあるのかもしれない。", "周りの環境が未来を決めてしまう切なさを感じる。", "子ども同士の距離が変わる場面が心に残る。"], "nigorie": ["誰かの生き方を外から簡単に評価できない。", "逃げ場の少ない暮らしの苦しさを感じる。", "登場人物の選択を自分ならどう受け止めるだろう。"], "redheadedleague": ["一見おかしな話にも理由が隠れている。", "細かな違和感に気づく観察力がすごい。", "うまい話には裏があるのかもしれない。"], "anne-green-gables": ["想像する力が毎日を豊かにしてくれる。", "失敗しても成長できるところに元気をもらう。", "自分らしさを大切にしたくなる。"], "tom-sawyer": ["子どもの冒険心がまぶしい。", "自由に遊ぶことと責任を持つことは両立できるだろうか。", "友達との思い出を振り返りたくなる。"], "little-princess": ["つらいときでも人への優しさを忘れない姿が心に残る。", "立場が変わっても人の価値は変わらない。", "想像力が心を支えてくれることもある。"], "daddy-long-legs": ["誰かに支えられながら、自分の道を見つけていくのがいい。", "手紙から気持ちの変化が伝わってくる。", "自立することの意味を考えたくなる。"], "snow-queen": ["ゲルダを引き止めたおいはぎの娘が、最後には送り出してくれる。その変化をどう感じましたか。", "カイがゲルダを思い出す場面で、心に残ったことはありますか。", "帰ってきた二人は大きくなっていても、心は子供のままでした。この結びをどう受け取りましたか。"], "jack-and-the-beanstalk": ["一回目と三回目で、ジャックが空へ行く理由はどう変わりましたか。", "巨人の妻に助けられたジャックの行動を、どう考えますか。", "もし金の卵を産む鶏を手に入れたところで終わっていたら、物語はどう違って見えるでしょう。"], "pinocchio": ["ピノキオを本当に助ける人と、利用する人は、どこで見分けられそうでしょう。", "父を捜していたピノキオが、父を支えるようになった変化をどう感じますか。", "約束することと、毎日の行動を変えることには、どんな違いがあるでしょう。"], "pandora": ["災いを送り出したゼウスと、壺を開けたパンドラの役割は、どう違うでしょう。", "エピメテウスが警告を思い出していたら、何が変わったと思いますか。", "希望が壺の中に残ることを、あなたは救いと閉じ込めのどちらに近く感じますか。"], "gakumon-no-susume": ["本を読んで知ることと、実際に使えることには、どんな違いがあるでしょう。", "自分で考えることと、人の助けを借りることは両立できるでしょうか。", "新しいものや昔からの習慣を、どのように比べて判断したいですか。"], "utayomi-ni-atauru-sho": ["有名な人の作品だと知る前と後で、感じ方が変わることはあるでしょうか。", "見た景色をそのまま書くときにも、自分の気持ちは表れるでしょうか。", "新しい言葉を使うことと、新しい表現を作ることは同じでしょうか。"], "time-machine": ["時間旅行者が最初の考えを変えたのは、何を見つけたからでしょう。", "地上と地下の暮らしの違いは、私たちの社会について何を考えさせるでしょう。", "二本の花だけが残る結末を、あなたはどう受け止めますか。"], "oku-no-hosomichi": ["同じ美しい景色でも、場所の歴史を知ると見え方は変わるでしょうか。", "旅先で受けた親切や別れは、風景と同じくらい記憶に残るでしょうか。", "大垣で終わらず次の旅へ出る結びから、どんな気持ちを感じますか。"], "bushido": ["勇気と無謀さは、どこで分かれるのでしょうか。", "礼儀正しい形と、相手を思いやる気持ちがずれることはあるでしょうか。", "昔の考えを受け継ぐとき、残したいものと変えたいものをどう見分けるでしょうか。"], "ichiaku-no-suna": ["同じ場所を思い出すとき、懐かしさとつらさが一緒に生まれることはあるでしょうか。", "いつもの音や匂いが、誰かの記憶を呼び戻すことはあるでしょうか。", "一首を三行に分けて読むと、言葉の間や感じ方はどう変わるでしょうか。"], "kanashiki-gangu": ["同じ日の中で、いらだちと親しさが行き来することはあるでしょうか。", "身近な小さな変化で、何かを始めたくなることはあるでしょうか。", "最後に犬を飼う相談をする一首から、どんな日常を感じるでしょうか。"], "ame-ni-mo-makezu": ["この詩の「負けない」強さは、どんな行動に表れているでしょうか。", "涙を流したり、おろおろしたりする姿を含めて読むと、印象は変わるでしょうか。", "人を助けたいと思うとき、相手のためにまず見聞きしたいことは何でしょうか。"], "tsuru-no-ongaeshi": ["ムサイは、妻が一人で織りたいと言ったことをどう受け止めればよかったでしょうか。", "助けてもらうことと、相手の望みを尊重することは、どうつながるでしょうか。", "母と息子が元の暮らしへ戻る結びから、何が失われたと感じるでしょうか。"], "mikan": ["少女の行動を知る前と後で、「私」の見方はどう変わったのでしょう。", "暗い景色の中に蜜柑の色が現れると、どんな印象が残りますか。", "「わずかに忘れる」という終わり方を、どのように感じますか。"], "fugaku-hyakkei": ["「私」が富士を嫌ったり、頼もしく思ったりするのは、何が変わったからでしょう。", "老女が指した小さな花は、大きな富士とどのように響き合うでしょう。", "最後の写真のいたずらを、あなたはどう受け止めますか。"], "imogayu": ["五位の食べたい気持ちは、どの場面から変わり始めたのでしょう。", "利仁たちのもてなしを、五位はなぜ断りにくかったのでしょう。", "五位が懐かしんだ以前の自分には、何があったのでしょう。"], "joseito": ["人を厳しく見る気持ちと、自分を責める気持ちは、どのようにつながっているでしょう。", "夕空や百合は、少女の気持ちをどのように変えたのでしょう。", "母との会話の後にも迷いが残る結末を、どう感じますか。"], "nogiku-no-haka": ["野菊や竜胆にたとえることで、二人はどんな思いを伝えているでしょう。", "お増の態度が変わることから、周囲の人について何が見えてくるでしょう。", "十年余り後の政夫が語る形は、この物語の読み方をどう変えるでしょう。"], "sakura-no-ki-no-shita-niwa": ["美しい景色を見ても、気持ちが明るくならないことはあるでしょうか。", "「俺」と「おまえ」では、同じ話の受け止め方がどう違って見えますか。", "最後の「花見ができそうな気持ち」は、初めの不安からどう変わったのでしょう。"], "koya-hijiri": ["宗朝は、嫌な相手だった薬売りをなぜ追いかけたのでしょう。", "女性の優しさと恐ろしさは、読み終えるとどう見えてきますか。", "同じ出来事でも、本人の語りと、別の人から聞いた説明では印象が変わるでしょうか。"], "kaze-tachinu": ["同じ夕景を見ている二人が、違う未来を考えているところが心に残るかもしれません。", "相手との生活を書くことと、目の前の相手を気にかけることは、同じとは限らないと感じるかもしれません。", "遠くまで届く小さな明かりから、「私」を支えるものを考えたくなるかもしれません。"], "nisen-doka": ["松村が確かめたことと、想像で補ったことは、どこで分かれるでしょう。", "「私」が初めから知っていたことを思い返すと、前半の行動はどう見えますか。", "頭のよさを競う二人に、別の話し方はあったでしょうか。"], "yagi-no-uta": ["明るい風景なのに、懐かしさや寂しさを感じることもあるかもしれません。", "悲しい気持ちの中にも、やさしい心が残るという表し方が心にとまるかもしれません。", "答えを言い切らずに終わる詩だからこそ、自分の気持ちを重ねられるかもしれません。"], "ushi-o-tsunaida-tsubaki-no-ki": ["よい目的に夢中になるうちに、別の人への思いやりを忘れることがあるのかもしれません。", "海蔵を助ける母の言葉や、地主の心の変化が印象に残るかもしれません。", "その人がいなくなった後にも、日々の暮らしを助ける仕事が残ることを考えるかもしれません。"], "amedama": ["母親が怖いと思った理由と、侍が実際にしたことを比べてみると、結末の驚きが見えてきます。", "一つの飴だまを二人に分けた後、侍がまた眠る終わり方に、どんな印象を受けるでしょう。"]};
function renderArticle(x){if(x.contentType==='protected-introduction'){renderIntroduction(x);return}const literary=x.cat==='literature'||x.cat==='myth';main.innerHTML=`<button class="back" id="back">← 一覧に戻る</button><article class="article"><header class="articleheader${x.authorTextOnly?' author-text-only':''}"><div><span class="label">${esc(x.genreLabel||catNames[x.cat])} / ${literary?'名作を読み解く':x.cat==='person'?'作品と人物をつなぐ':'地域を知る入口'}</span><h2${(x.longTitle||x.id==="goshu"||x.id==="lamp")?' class="long-title"':''}>${titleText(x)}</h2><p class="meta">${byline(x)}</p>${articleDates(x)}${readingTime(x)}${(!literary&&x.textNote)?`<p class="edition-note">${esc(x.textNote)}</p>`:""}</div>${x.image?`<figure class="story-figure">${storyImage(x,'article')}${x.headerCaption?`<figcaption>${bodyText(x,x.headerCaption)}</figcaption>`:x.cat==='person'?'<figcaption>創作イラスト</figcaption>':x.cat==='myth'?'<figcaption>神話のイメージ</figcaption>':''}</figure>`:x.id==='kawasaki'?`<figure class="emblem-figure">${art(x)}<figcaption>図鑑オリジナルマーク<br>工場・港・多摩川をモチーフにした創作です。<br>市・区の公式マークではありません。</figcaption></figure>`:x.authorTextOnly?'':art(x)}</header><div class="content">${literary?(x.characterGallery?characterGallery(x):`<section class="characters"><h3>${esc(x.peopleHeading||"登場人物")}</h3><ul class="people">${x.people.map(([n,d])=>`<li><strong>${characterName(n)}</strong>${bodyText(x,d)}</li>`).join('')}</ul></section>`):''}<section class="synopsis"><h3>${literary?esc(x.introHeading||'あらすじ'):'概要'}${literary?`<span class="badge">${esc(x.introBadge||'物語の入口')}</span>`:''}</h3><p class="bodytext">${introductionText(x)}</p></section>${literary?`<section class="digest"><h3>${esc(x.summaryHeading||"要約")}</h3>${summaryParagraphs(x)}</section>`:`<section class="gist"><h3>要点</h3><p class="summary-text">${x.cat==='person'?bodyText(x,x.gist):esc(x.gist)}</p></section>`}${literary?`<section class="conclusion"><h3>まとめ</h3><p class="bodytext">${bodyText(x,finalThoughts[x.id])}</p><p class="subnote">${esc(x.interpretationNote||"作品の出来事を踏まえた、読み方の一例です。")}</p></section>`:''}${x.astronomyFacts?`<section class="astronomy-facts"><h3>実際の星空では</h3><p class="subnote">ここからは神話とは別に、天文学の情報を紹介します。</p>${x.astronomyFacts.map(t=>`<p class="bodytext">${bodyText(x,t)}</p>`).join("")}</section>`:""}${(x.id==='akutagawa'||personBackground[x.id])?`<section class="author-background"><h3>この人をもっと知る</h3><p class="subnote">生まれた町、育った環境、作家になるまでをたどります。</p>${(personBackground[x.id]||authorBackground).map(b=>`<section class="background-item"><h4>${bodyText(x,b.title)}</h4><p class="bodytext">${bodyText(x,b.text)}</p><p class="background-sources">出典：${b.sources.map(z=>`<a href="${esc(z.url)}" target="_blank" rel="noopener noreferrer">${esc(z.title)} ↗</a>`).join(' ／ ')}</p></section>`).join('')}</section>`:''}${x.placeGuide?authorPlaceGuide(x):''}${x.id==='kawasaki'?mascotDraftSection():''}${literary&&reflectionPrompts[x.id]?`<section class="reflection-prompts"><h3>この作品を読んで、こんなことを感じるかもしれません</h3><div class="reflection-prompts-list">${reflectionPrompts[x.id].map(t=>`<p>${esc(t)}</p>`).join("")}</div><p class="subnote">感想を考えるための問いや視点です。実際の読者投稿ではありません。</p></section>`:""}${literary?`<section class="reader-feedback" aria-label="作品への感想"><h3>この作品を読んでどう感じましたか？</h3><p>感じたことや気づいたことを、気軽にお寄せください。投稿内容は運営者が確認します。</p><a class="feedback-link" href="https://docs.google.com/forms/d/e/1FAIpQLSfbaBP2ImC0gEjd4fm_h4aSxi4X9MPHgRkQtkvKBi3ZroVZUw/viewform?usp=pp_url&amp;entry.1884798641=${encodeURIComponent(x.name)}" target="_blank" rel="noopener noreferrer">感想を投稿する ↗</a><p class="subnote">Googleフォームが別のタブで開きます。作品名の入力が必要な場合があります。</p></section>`:''}${!literary&&x.id!=='akutagawa'&&!personBackground[x.id]?`<details><summary>${literary?'もっと知りたい方へ（補足）':'関連情報をもっと読む'}</summary><div class="deep">${!literary?`<h3>関連情報</h3><ul class="people">${x.people.map(([n,d])=>`<li><strong>${characterName(n)}</strong>${bodyText(x,d)}</li>`).join('')}</ul>`:''}<h3>${literary?'作品の意味・読み方の一例':x.id==='kawasaki'?'制作の考え方':'作品を読む視点'}</h3><p class="bodytext">${esc(x.theme)}</p><h3>記憶に残るポイント</h3><p>${esc(x.memory)}</p>${literary?`<h3>考えるヒント</h3><p class="subnote">読み方の一例です。正解を決めるためではなく、本文の言葉と自分の経験を行き来する問いとして使ってください。</p><ul class="people">${x.questions.map(q=>`<li>${esc(q)}</li>`).join('')}</ul>`:''}</div></details>`:''}${readingTimeNote(x)}<details><summary>出典・確認情報</summary>${(literary&&x.textNote)?`<p class="edition-note">${esc(x.textNote)}</p>`:""}${x.id==='gloves'?'<p class="edition-note">絵本の一例：<a href="https://www.kaiseisha.co.jp/books/9784039633101" target="_blank" rel="noopener noreferrer">偕成社（かいせいしゃ）・黒井健（くろい けん）絵／32ページ ↗</a><span>ページ数は版によって異なります。</span></p>':''}${x.termNote?`<p class="subnote">${bodyText(x,x.termNote)}</p>`:""}${x.portraitNote?`<p class="subnote">${esc(x.portraitNote)}</p>`:x.image?`<p class="subnote">${x.cat==='myth'?'画像は神話をもとにしたAI生成の創作イラストです。史実や星の位置を正確に再現した図ではありません。':'画像は作品をもとにしたAI生成の創作イラストです。実際の写真や、特定の場面を厳密に再現した図ではありません。'}</p>`:""}${x.characterGalleryNote?`<p class="subnote">${esc(x.characterGalleryNote)}</p>`:""}${x.sourceNote?`<p class="subnote">${esc(x.sourceNote)}</p>`:""}<p class="subnote">${x.id==='kawasaki'?'地域の調査に用いる公式情報の入口です。個別の地域記事の検証完了を意味しません。':'以下を確認し、本文は本サイト独自の言葉で要約しています。解釈は原典の事実記述と区別しています。'}</p><ul class="sources">${x.sources.map(s=>`<li><a href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">${esc(s.title)} ↗</a></li>`).join('')}</ul><p class="subnote">確認日：${esc(x.checkedDate||"2026年11月1日")}。第三者の画像・写真の転載は行っていません。</p></details></div></article>${x.links.length?`<section class="related"><div class="sectionhead"><h2>知識をつなぐ、次の一冊・一人</h2></div><div class="grid">${x.links.map(id=>items.find(z=>z.id===id)).filter(Boolean).map(card).join('')}</div></section>`:''}`;document.getElementById('back').onclick=()=>{location.hash=lastListHash}}
function syncControls(){search.value=query;document.querySelectorAll('[data-cat]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.cat===category)))}
const philosophyParagraphs=["知ることから、人生が少し変わる。", "一つの物語が、誰かの考え方を変えることがあります。", "何気なく読んだ作品が、自分のこれまでの行動を振り返るきっかけになることもあります。", "誰かの優しさに気づいたり、相手の気持ちを考え直したり。", "ときには、自分の信じてきたことが間違っていなかったと、勇気をもらうこともあるでしょう。", "同じ作品でも、10歳のとき、20歳のとき、40歳のときでは、感じることが違うかもしれません。", "今は何も感じなかった言葉が、数年後の自分には大切な言葉になっているかもしれません。", "だからこそ、この図鑑は、一度読んで終わる場所ではなく、何度でも戻ってこられる場所でありたいと考えています。", "難しい知識を、できるだけ分かりやすく。", "知らなかった世界を、もっと身近に。", "そして、そこで得た小さな気づきが、誰かの明日を少しだけ変えるきっかけになれば。", "そんな願いを込めて、この図鑑を少しずつ育てていきます。", "知識との出会いが、自分自身との出会いになる。", "それが「知識の大図鑑」の目指す姿です。"];
function renderPhilosophy(){main.innerHTML=`<button class="back" id="back">← 一覧に戻る</button><article class="philosophy-page"><h2>この図鑑に込めた想い</h2><div class="philosophy-copy">${philosophyParagraphs.map((p,i)=>`<p${i===0?' class="opening"':''}>${esc(p)}</p>`).join('')}</div></article>`;document.getElementById('back').onclick=()=>{location.hash=lastListHash};document.title='この図鑑に込めた想い｜知識の大図鑑'}
function route({focus=false}={}){isRouting=true;const hash=location.hash||'#/';if(hash==='#/about'){renderPhilosophy();if(focus){main.focus({preventScroll:true});main.scrollIntoView({behavior:'auto',block:'start'})}isRouting=false;return}if(hash.startsWith('#/article/')){const id=hash.slice(10);const x=items.find(i=>i.id===id);if(x){document.title=x.name+'｜知識の大図鑑';renderArticle(x);if(focus){main.focus({preventScroll:true});main.scrollIntoView({behavior:'auto',block:'start'})}}else{main.innerHTML='<div class="empty"><h2>項目が見つかりません</h2><p>URLを確認するか、一覧へ戻ってください。</p><a href="#/">一覧に戻る</a></div>';document.title='項目が見つかりません｜知識の大図鑑'}}else{const p=new URLSearchParams(hash.includes('?')?hash.split('?').slice(1).join('?'):'');category=p.get('cat')==='literature'?'japanese-literature':Object.keys(browseCategories).includes(p.get('cat'))?p.get('cat'):'all';query=p.get('q')||'';selectedTheme=currentThemeShelves().some(t=>t.id===p.get('theme'))?p.get('theme'):'';lastListHash=listHash();syncControls();renderList();document.title='知識の大図鑑｜わかりやすいから、もっと知りたくなる。';if(focus){main.focus({preventScroll:true});document.getElementById('browse').scrollIntoView({behavior:'auto',block:'start'})}}isRouting=false}
function showList(replace=false){if(!currentThemeShelves().some(t=>t.id===selectedTheme))selectedTheme='';const h=listHash();lastListHash=h;if(replace){history.replaceState(null,'',h);renderList();document.title='知識の大図鑑｜わかりやすいから、もっと知りたくなる。'}else if(location.hash===h)renderList();else location.hash=h;syncControls()}
function reset(){category='all';query='';selectedTheme='';showList();search.focus()}
search.addEventListener('input',()=>{query=search.value;const inArticle=location.hash.startsWith('#/article/')||location.hash==='#/about';if(inArticle)history.pushState(null,'',listHash());showList(true)});
document.getElementById('clear').addEventListener('click',()=>{query='';showList();search.focus()});
document.querySelectorAll('[data-cat]').forEach(b=>b.addEventListener('click',()=>{category=b.dataset.cat;showList()}));
document.querySelector('.skip').addEventListener('click',e=>{e.preventDefault();main.focus({preventScroll:true});main.scrollIntoView({behavior:'auto',block:'start'})});
window.addEventListener('hashchange',()=>route({focus:true}));route();
</script>
