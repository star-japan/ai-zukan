const mascotDrafts=[{"id": "K-000003", "subject": "長十郎梨", "subjectReading": "ちょうじゅうろうなし", "name": "なしふみ", "category": "農業・地域の歴史", "timeScope": "歴史的な発祥の話。現在の栽培・販売状況は未確認", "factText": "長十郎梨は、現在の川崎区にあたる大師河原で生まれた梨の品種です。川崎市の資料では、1893年に当麻辰次郎の梨園で発見されたと伝えられ、当麻家の屋号から名前が付いたと紹介されています。地域の農業の歴史をたどる入口になる題材です。", "fictionText": "赤褐色の丸い梨をイメージした、静かな歴史案内役。無地の小さな本と葉のしおりを持ち、見つけた地域の話を一ページずつ書き留めます。名前、性格、持ち物はこの図鑑の創作です。", "sources": [{"title": "川崎市・かわさき区の宝物シート『長十郎梨のふるさと』", "url": "https://www.city.kawasaki.jp/kawasaki/cmsfiles/contents/0000025/25449/5-2.pdf", "publisher": "川崎市", "supports": "1893年の発見伝承、当麻辰次郎、屋号由来、地域との関係"}], "image": "assets/k-000003.webp", "imageAlt": "長十郎梨を題材にした非公式の創作キャラクター案", "imageSha256": "9810b6c99d2ca43fbddd18f9897ec0e4b338d5c3749eea54d8fd7720695725fe", "firstPublishedAt": "2026-11-01T23:09:38+09:00", "updatedAt": "2026-11-01T23:09:38+09:00"}, {"id": "K-000004", "subject": "奈良茶飯", "subjectReading": "ならちゃめし", "name": "ちゃめしびより", "category": "食文化・川崎宿", "timeScope": "歴史的な川崎宿との関係。現在の店舗・提供状況は未確認", "factText": "奈良茶飯は、東海道の川崎宿で知られた旅籠『万年屋』の名物でした。川崎区の公式紹介では、作品『東海道中膝栗毛』の弥次さん・喜多さんも食べたとされています。旅の道と食事を通して、昔の川崎宿のにぎわいを知る題材です。", "fictionText": "丸い飯椀を体に、やわらかな湯気を前髪にした、おもてなし好きの案内役。歩き疲れた旅人の話を聞くのが得意です。名前、性格、姿は創作で、当時の料理や器を正確に復元したものではありません。", "sources": [{"title": "川崎市川崎区『川崎宿とは』", "url": "https://www.city.kawasaki.jp/kawasaki/category/123-9-2-3-0-0-0-0-0-0.html", "publisher": "川崎市川崎区", "supports": "万年屋の名物、東海道中膝栗毛への言及"}], "image": "assets/k-000004.webp", "imageAlt": "奈良茶飯を題材にした非公式の創作キャラクター案", "imageSha256": "66165a2f06255ab782f092f98b907222c5816a2fda2f0606c3f0512ab1d6eec2", "firstPublishedAt": "2026-11-01T23:09:38+09:00", "updatedAt": "2026-11-01T23:09:38+09:00"}, {"id": "K-000005", "subject": "六郷の渡し舟", "subjectReading": "ろくごうのわたしぶね", "name": "ろくごうこぶね", "category": "交通・多摩川の歴史", "timeScope": "歴史題材。現在運航している渡し舟の案内ではない", "factText": "六郷川、現在の多摩川には1600年に六郷大橋が架けられました。川崎区の公式資料によると、1688年の大洪水で橋が流された後、1874年まで渡しが続けられました。舟で川を越えていた時代の交通を知る題材です。", "fictionText": "小さな木舟を体に、櫂を持ち、さざ波の足で歩く聞き上手。川の両岸で出会った人の話をつなぎます。名前、性格、手足は創作で、歴史上の船体を精密に復元したものではありません。", "sources": [{"title": "川崎市川崎区『01六郷の渡し』", "url": "https://www.city.kawasaki.jp/kawasaki/page/0000024760.html", "publisher": "川崎市川崎区", "supports": "1600年架橋、1688年洪水、1874年までの渡し"}], "image": "assets/k-000005.webp", "imageAlt": "六郷の渡し舟を題材にした非公式の創作キャラクター案", "imageSha256": "9f3c140b7f58bcfe88eec9edd77237e576e93aa4af335522a51e7c9a81d12dda", "firstPublishedAt": "2026-11-01T23:09:38+09:00", "updatedAt": "2026-11-01T23:09:38+09:00"}, {"id": "K-000007", "subject": "アカテガニ", "subjectReading": "アカテガニ", "name": "あかてこもれび", "category": "自然・殿町の生きもの", "timeScope": "2023年12月1日更新の川崎市紹介に基づく生息環境の説明。当日の目撃・個体数は未確認", "factText": "川崎市は、アカテガニを川崎区殿町で夏によく見かける生きものとして紹介しています。水中よりも陸地を好み、木にも登るカニです。キングスカイフロントの敷地で夏に見られるカニの多くがアカテガニとされ、街と水辺がつながる自然を知る入口になります。", "fictionText": "赤いはさみと落ち着いた土色の甲羅を持つ、小さな木陰の案内役。葉の形の小さな肩掛けかばんを持ち、街と水辺の間で見つけた風景を覚えています。名前、かばん、性格は創作です。", "sources": [{"title": "川崎市「多摩川河口干潟の生きもの『アカテガニ』」", "url": "https://www.city.kawasaki.jp/300/page/0000125732.html", "publisher": "川崎市", "publishedDate": "2023-12-01", "updatedDate": "2023-12-01", "checkedDate": "2026-11-01", "supports": "川崎区殿町・キングスカイフロントとの関係、陸上生活と木登り"}], "image": "assets/k-000007.webp", "imageAlt": "アカテガニを題材にした非公式の創作キャラクター案", "imageSha256": "4a8c225dc643980be93dcaa2da25bebe5af13dafb1903704d413faa8d1963289", "imageWidth": 900, "imageHeight": 600, "firstPublishedAt": "2026-11-01T23:22:36+09:00", "updatedAt": "2026-11-01T23:22:36+09:00"}, {"id": "K-000010", "subject": "マハゼ", "subjectReading": "マハゼ", "name": "まはぜしおみ", "category": "自然・多摩川河口の魚", "timeScope": "令和4年度（2022年度）秋季・冬季の調査で川崎側右岸の出現を確認。2026年当日の生息数は未確認", "factText": "殿町羽田空港線に関わる川崎市の環境調査資料には、令和4年度の秋と冬に、計画区の右岸・川崎側でマハゼが確認されたことが記されています。資料では汽水性の魚として扱われています。海と川の境目の環境を知るための題材です。", "fictionText": "砂色の小魚をイメージした、潮の変化に耳をすます案内役。水滴形の小さなバッジと穏やかな表情が目印です。名前、役割、持ち物は創作で、生物同定に使う精密な図ではありません。", "sources": [{"title": "川崎市「第17回 都市計画道路殿町羽田空港線ほか道路改築工事に関わる河川河口の環境アドバイザー会議 概要」魚類", "url": "https://www.city.kawasaki.jp/530/cmsfiles/contents/0000097/97966/No.17adobaiza-gaiyou2.pdf", "publisher": "川崎市", "publishedDate": null, "publicationDateNote": "PDF本文の発行日は今回確定せず。検索エンジンの公開時期推定は採用しない", "dataPeriod": "令和4年度秋季・冬季", "pageReference": "PDF16ページ目、生活史型ごとの出現種数の説明（抽出テキストで確認）", "checkedDate": "2026-11-01", "supports": "計画区右岸＝川崎側、令和4年度秋季・冬季のマハゼ確認、汽水性の分類"}], "image": "assets/k-000010.webp", "imageAlt": "マハゼを題材にした非公式の創作キャラクター案", "imageSha256": "7e31f5d71477c5db0088f3a9f3cb794952ab5f825374f8e134b6a27d7bd1b737", "imageWidth": 900, "imageHeight": 450, "firstPublishedAt": "2026-11-01T23:22:36+09:00", "updatedAt": "2026-11-01T23:22:36+09:00"}, {"id": "K-000011", "subject": "ガントリークレーン", "subjectReading": "ガントリークレーン", "name": "おうぎはこび", "category": "港湾・東扇島の物流", "timeScope": "現代施設の題材。市公式概要の更新日は2024年4月10日。2026年の個別号機の稼働・更新完了は未確認", "factText": "東扇島にある川崎港コンテナターミナルは、1996年4月に供用を開始しました。川崎市の施設概要には、コンテナを扱うガントリークレーンが掲載されています。海から届く荷物と陸の物流をつなぐ、港の設備を知る題材です。", "fictionText": "門の形の脚と長い横梁を持つ、慎重で段取り上手な港の案内役。無地の小さなコンテナを、急がず大切に運ぶ設定です。名前、表情、性格は創作で、特定の号機の設計を再現したものではありません。", "sources": [{"title": "川崎市「川崎港コンテナターミナル」", "url": "https://www.city.kawasaki.jp/580/page/0000022057.html", "publisher": "川崎市港湾局", "publishedDate": "2018-02-17", "updatedDate": "2024-04-10", "checkedDate": "2026-11-01", "supports": "東扇島に立地、1996年4月供用開始、ガントリークレーンの掲載"}], "image": "assets/k-000011.webp", "imageAlt": "ガントリークレーンを題材にした非公式の創作キャラクター案", "imageSha256": "5944d9cb622ba333345824aa25f2cafd9b1c1ec3fb04801499ffc6bc754f492d", "imageWidth": 900, "imageHeight": 822, "firstPublishedAt": "2026-11-01T23:22:36+09:00", "updatedAt": "2026-11-01T23:22:36+09:00"}, {"id": "K-000001", "subject": "川崎大師のだるま", "subjectReading": "かわさきだいしのだるま", "name": "だるまこつこつ", "category": "文化・門前町の縁起物", "timeScope": "現在にも続く文化題材。資料にある店舗数・当年行事日程は現況として採用しない。", "factText": "川崎市の資料では、だるまは川崎大師の土産物の一つとして紹介されています。表参道や仲見世通りには、厄除けや開運を願うだるまを扱う店が並ぶと記されています。願いを込める縁起物を通して、門前町の文化を知る題材です。", "fictionText": "赤茶色の丸いだるまをイメージした、小さな努力を応援する案内役。無地の折りたたみメモを持ち、一日の「できたこと」を大切にします。名前、性格、持ち物は創作で、実物の縁起物や公認キャラクターの複製ではありません。", "sources": [{"title": "川崎市・かわさき区の宝物シート「川崎大師のだるま」", "url": "https://www.city.kawasaki.jp/kawasaki/cmsfiles/contents/0000025/25622/10-16.pdf", "publisher": "川崎市川崎区", "publishedDate": null, "publicationDateNote": "資料本体の発行・更新日を確定できず。閲覧確認日と区別。", "checkedDate": "2026-11-01", "supports": "大師の土産物、表参道・仲見世通り、縁起物としての地域文化"}], "image": "assets/k-000001.webp", "imageAlt": "川崎大師のだるまを題材にした非公式の創作キャラクター案", "imageSha256": "8548c54d9040c0d134652d07a4a8cf8d31ce3bf115ffd569860cb425f6ef528f", "imageWidth": 900, "imageHeight": 860, "reviewNote": "既存候補の仮リデザインです。以前の原案画像との照合は未完了で、旧原案の置き換えや正式登録ではありません。", "firstPublishedAt": "2026-11-01T23:30:23+09:00", "updatedAt": "2026-11-01T23:30:23+09:00"}, {"id": "K-000002", "subject": "久寿餅", "subjectReading": "くずもち", "name": "くずもちこはく", "category": "食文化・川崎大師の土産", "timeScope": "現在にも続く食文化。店舗数・値段・保存条件・商品仕様の現況を示すカードではない。", "factText": "久寿餅は川崎大師の定番土産として知られ、川崎市の資料では表参道や仲見世通りとのつながりが紹介されています。黒蜜ときな粉を合わせて味わう菓子です。小麦のでんぷんを使う川崎大師の久寿餅を、葛粉の菓子と混同しないことも大切です。", "fictionText": "白くやわらかそうな餅の一切れに、黒蜜色の小さなしずく飾りときな粉色の頬を添えた案内役。ゆっくり話を聞くおだやかな性格です。名前、表情、飾りは創作で、特定店舗の包装や商品を再現したものではありません。", "sources": [{"title": "川崎市・かわさき区の宝物シート「川崎大師久寿餅」", "url": "https://www.city.kawasaki.jp/kawasaki/cmsfiles/contents/0000025/25622/10-14.pdf", "publisher": "川崎市川崎区", "publishedDate": null, "publicationDateNote": "資料本体の発行・更新日を確定できず。閲覧確認日と区別。", "checkedDate": "2026-11-01", "supports": "定番土産、表参道と仲見世通り、黒蜜・きな粉、主に小麦粉由来のくず餅の説明"}, {"title": "川崎市「かわさき名産品」和菓子紹介", "url": "https://www.city.kawasaki.jp/280/cmsfiles/contents/0000020/20067/meisanhinP1-P11.pdf", "publisher": "川崎市", "publishedDate": null, "publicationDateNote": "資料本体の発行・更新日を確定できず。閲覧確認日と区別。", "checkedDate": "2026-11-01", "supports": "大師町の久寿餅商品で小麦のでんぷんを発酵し蒸す製法を紹介。特定商品の工程期間は一般化しない"}], "image": "assets/k-000002.webp", "imageAlt": "久寿餅を題材にした非公式の創作キャラクター案", "imageSha256": "469e35d1fc16d427a1383ab3955688bc236e24732e9d570a65181c48869e4d98", "imageWidth": 900, "imageHeight": 600, "reviewNote": "既存候補の仮リデザインです。以前の原案画像との照合は未完了で、旧原案の置き換えや正式登録ではありません。", "firstPublishedAt": "2026-11-01T23:30:23+09:00", "updatedAt": "2026-11-01T23:30:23+09:00"}, {"id": "K-000015", "subject": "京急大師線", "subjectReading": "けいきゅうだいしせん", "name": "だいしみちしおり", "category": "交通・大師地域の鉄道", "timeScope": "現在の路線と1899年の開業史を区別。昔の六郷橋〜大師を現在の全区間と同一視しない。", "factText": "京急の公式駅紹介によると、前身の大師電気鉄道は1899年1月に六郷橋と大師の間を開通させました。このとき大師駅として開業したのが、現在の川崎大師駅です。駅は川崎区大師駅前にあり、大師線と地域の歩みを結ぶ題材になります。", "fictionText": "鉄道をたどる旅のしおりから生まれた、折り地図形の案内役。二本の細い線を道しるべに、昔と今のまちの話をつなぎます。地図の形、名前、性格は創作で、京急の車両・乗車券・路線図や公式マスコットではありません。", "sources": [{"title": "京浜急行電鉄「川崎大師駅」駅の概要", "url": "https://www.keikyu.co.jp/ride/kakueki/KK23.html", "publisher": "京浜急行電鉄株式会社", "publishedDate": null, "publicationDateNote": "資料本体の発行・更新日を確定できず。閲覧確認日と区別。", "checkedDate": "2026-11-01", "supports": "明治32年1月の六郷橋〜大師開通、大師駅として開業、川崎区大師駅前の所在地、現在の大師線案内"}], "image": "assets/k-000015.webp", "imageAlt": "京急大師線を題材にした非公式の創作キャラクター案", "imageSha256": "b83518e42915c3caf6c84e3ef1ca4485ca4a7c468c32d2a94e25b0b9a753f35c", "imageWidth": 900, "imageHeight": 842, "reviewNote": "既存候補の仮リデザインです。以前の原案画像との照合は未完了で、旧原案の置き換えや正式登録ではありません。", "firstPublishedAt": "2026-11-01T23:30:23+09:00", "updatedAt": "2026-11-01T23:30:23+09:00"}, {"id": "K-000012", "subject": "コンテナ船", "subjectReading": "こんてなせん", "name": "はこなみつむぎ", "category": "港湾・海の物流", "timeScope": "現代の港湾物流の題材。2025年の入港記録を根拠にし、現在の便数や運航日程は主張しない。", "factText": "川崎港のコンテナターミナルは東扇島にあります。川崎市は、2025年6月に新たな定期航路のコンテナ船が初入港したことを発表しました。箱型のコンテナを積んで港と港を結ぶ船は、川崎区と海の向こうの物流のつながりを知る題材です。", "fictionText": "短く丸い船体に、無地の小さなコンテナを並べた案内役。荷物に込められた人の思いを大切につなぐ性格です。名前、顔、配色は創作で、実在する船名や船社の公式キャラクターではありません。", "sources": [{"title": "川崎市「川崎港コンテナターミナル」", "url": "https://www.city.kawasaki.jp/580/page/0000022057.html", "publisher": "川崎市港湾局", "publishedDate": null, "checkedDate": "2026-11-01", "supports": "東扇島への立地。施設概要の更新日2024-04-10", "publicationDateNote": "日付なしは発行日未確定。閲覧確認日とは区別。"}, {"title": "川崎市「川崎港に新たなコンテナ定期航路が開設されました」", "url": "https://www.city.kawasaki.jp/templates/prs/cmsfiles/contents/0000177/177826/hatunyuukou.pdf", "publisher": "川崎市港湾局", "publishedDate": "2025-06-23", "checkedDate": "2026-11-01", "supports": "2025年6月22日の川崎港コンテナターミナルへのコンテナ船初入港", "publicationDateNote": "記載された資料日付。現況確認日ではない。"}], "image": "assets/k-000012.webp", "imageAlt": "コンテナ船を題材にした非公式の創作キャラクター案", "imageSha256": "0debea43c2e60f20e11580499e8af14fa66f5f2810d54d07f3cdc10151026956", "imageWidth": 900, "imageHeight": 600, "firstPublishedAt": "2026-11-01T23:39:44+09:00", "updatedAt": "2026-11-01T23:39:44+09:00"}, {"id": "K-000013", "subject": "LNG船", "subjectReading": "えるえぬじーせん", "name": "えるなみ", "category": "エネルギー・海上輸送", "timeScope": "現代設備・船舶の題材。根拠パンフレットは2024年9月作成。現在の年間入船数・受入量・稼働状況は示さない。", "factText": "川崎区東扇島にあるJERAの東扇島火力発電所は、LNG基地としての役割も持ちます。公式パンフレットにはLNG船の入船と燃料ガスの供給が紹介されています。LNG船を入口に、海から届く液化天然ガスと地域のエネルギー施設のつながりを知ることができます。", "fictionText": "淡い青灰色の船体に、丸いタンクカバーを載せた慎重な案内役。あわてず確認してから出発する性格です。名前、顔、配色は創作で、特定のLNG船の構造や運用を再現した模型ではありません。", "sources": [{"title": "JERA「東扇島火力発電所」", "url": "https://www.jera.co.jp/corporate/business/thermal-power/list/higashiogishima", "publisher": "株式会社JERA", "publishedDate": null, "checkedDate": "2026-11-01", "supports": "所在地：神奈川県川崎市川崎区東扇島3", "publicationDateNote": "2024年9月作成。日までは記載なし。閲覧確認日とは区別。"}, {"title": "JERA「東扇島火力発電所」パンフレット", "url": "https://www.jera.co.jp/static/files/corporate/business/thermal-power/list/higashiogishima/pdf/higashiOhgishima_2024_jp.pdf", "publisher": "株式会社JERA", "publishedDate": null, "checkedDate": "2026-11-01", "supports": "LNG基地としての役割、LNG船の入船、燃料ガス供給", "publicationDateNote": "2024年9月作成。日までは記載なし。閲覧確認日とは区別。", "sourceDateText": "2024.9 作成", "publishedDatePrecision": "month"}, {"title": "JERA「東日本地区 液化ガス貯蔵設備の容量等の公表（2025年度）」", "url": "https://www.jera.co.jp/static/files/corporate/business/optimization/lng/pdf/lng-higashi-ekika250324.pdf", "publisher": "株式会社JERA", "publishedDate": null, "checkedDate": "2026-11-01", "supports": "東扇島基地で利用可能な船型にモス型とメンブレン型を記載。船陸整合性確認が必要と注記", "publicationDateNote": "2024年9月作成。日までは記載なし。閲覧確認日とは区別。"}], "image": "assets/k-000013.webp", "imageAlt": "LNG船を題材にした非公式の創作キャラクター案", "imageSha256": "2b227ddfd98c5b1eb88291ce6174d879c2cbdf7aa2e0bbac264b67bf9b257f6e", "imageWidth": 900, "imageHeight": 450, "firstPublishedAt": "2026-11-01T23:39:44+09:00", "updatedAt": "2026-11-01T23:39:44+09:00"}, {"id": "K-000014", "subject": "貨物列車", "subjectReading": "かもつれっしゃ", "name": "しおはまつなぎ", "category": "交通・臨海部の鉄道物流", "timeScope": "現代の鉄道物流の題材。駅所在地と公式輸送案内に基づき、当日の列車時刻・車両編成・取扱量は未確認。", "factText": "JR貨物の公式案内では、川崎貨物駅は川崎区塩浜にあるコンテナ取扱駅です。神奈川臨海鉄道は、川崎貨物駅などを経由して全国の駅へ貨物を送る仕組みを案内しています。人を乗せる電車とは違う、荷物を運ぶ鉄道の役割を知る題材です。", "fictionText": "小さな機関車と無地の貨車がつながった、約束を大切にする案内役。仲間と息を合わせ、荷物を次へ渡すのが得意です。名前、表情、配色は創作で、実在車両や鉄道会社の公式マスコットを再現したものではありません。", "sources": [{"title": "JR貨物「エリア別サービス案内（コンテナ時刻表）」", "url": "https://www.jrfreight.co.jp/service/area", "publisher": "日本貨物鉄道株式会社", "publishedDate": null, "checkedDate": "2026-11-01", "supports": "川崎貨物駅のコンテナ取扱駅掲載、所在地：川崎市川崎区塩浜4丁目1-1", "publicationDateNote": "日付なしは発行日未確定。閲覧確認日とは区別。"}, {"title": "神奈川臨海鉄道「鉄道営業案内」", "url": "https://www.kanarin.co.jp/business.html", "publisher": "神奈川臨海鉄道株式会社", "publishedDate": null, "checkedDate": "2026-11-01", "supports": "川崎貨物駅または根岸駅を経由した全国への連絡運輸、貨物の種類", "publicationDateNote": "日付なしは発行日未確定。閲覧確認日とは区別。"}], "image": "assets/k-000014.webp", "imageAlt": "貨物列車を題材にした非公式の創作キャラクター案", "imageSha256": "3ceb3a9d431f148099435340e257a1a9b022163631be0edd39a334d5b8a8f075", "imageWidth": 900, "imageHeight": 450, "firstPublishedAt": "2026-11-01T23:39:44+09:00", "updatedAt": "2026-11-01T23:39:44+09:00"}, {"id": "K-000016", "subject": "製鉄用クレーン", "subjectReading": "せいてつようくれーん", "name": "はがねもちあげ", "category": "鉄鋼産業・運搬設備", "timeScope": "2013年末の施設台帳をもとにした歴史題材。現存・稼働・台数は未確認。", "factText": "川崎市の港湾計画資料には、2013年末の大川・白石町地区の設備として、JFEスチール東日本製鉄所が管理する倉庫の天井クレーンが記録されています。製鉄に関わる仕事には、材料や製品を運ぶ設備も欠かせません。ここでは当時の記録を入口に、鉄鋼産業の運搬設備を紹介します。", "fictionText": "横長の梁と小さな巻上げ部分を持つ、落ち着いた案内役。何かを動かす前に周りを確かめる性格です。形と表情は創作で、特定の機械の復元や、安全な操作方法を示す図ではありません。", "sources": [{"title": "川崎市「川崎港港湾計画資料（その1）改訂」表Ⅷ－4－18 荷役機械（専用）", "url": "https://www.city.kawasaki.jp/580/cmsfiles/contents/0000063/63390/kouwankeikakusiryou1.pdf", "publisher": "川崎市（川崎港港湾管理者）", "publishedDate": null, "checkedDate": "2026-11-01", "supports": "本文117頁／PDF121頁：2013年末現在の大川・白石町地区にJFEスチール東日本製鉄所管理の池上商品倉庫7・8・9棟天井クレーン等を掲載", "publicationDateNote": "2014年11月改訂。表の調査時点は2013年末。", "sourceDateText": "2014年11月", "publishedDatePrecision": "month", "pdfPageOneBased": 121}], "image": "assets/k-000016.webp", "imageAlt": "製鉄用クレーンを題材にした非公式の創作キャラクター案", "imageSha256": "7d85ec2179a729155f666fde989e62ef46d6cf541f609c248890b2bbdfb3e9e9", "imageWidth": 900, "imageHeight": 360, "firstPublishedAt": "2026-11-01T23:48:33+09:00", "updatedAt": "2026-11-01T23:48:33+09:00"}, {"id": "K-000017", "subject": "圧延ロール", "subjectReading": "あつえんろーる", "name": "ころのばし", "category": "ものづくり・圧延工程", "timeScope": "圧延の仕組みを、1996年に引退した設備由来の川崎区の産業遺産から紹介する。", "factText": "川崎区の富士見公園には、かつて使われた熱間圧延機の歯車モニュメントがあります。区の解説では、圧延機はロールで鋼を薄く延ばす設備として紹介されています。展示されているのは歯車ですが、そこから材料を形づくるロールの働きも学べます。", "fictionText": "上下に並んだ丸いロールをひとつの身体にした、息を合わせるのが得意な案内役。小さな板をまっすぐ整える姿が目印です。名前と姿は創作で、保存されている歯車や実機を再現したものではありません。", "sources": [{"title": "川崎市川崎区「プラネタリー熱間圧延機歯車モニュメント」", "url": "https://www.city.kawasaki.jp/kawasaki/page/0000026764.html", "publisher": "川崎市川崎区", "publishedDate": "2006-05-25", "checkedDate": "2026-11-01", "supports": "川崎区富士見2-1の産業遺産。ロールで鋼を薄く延ばす工程と、1996年に圧延機が引退した歴史", "publicationDateNote": "公開日2006-05-25、更新日2025-11-19。モニュメントの歯車は圧延ロールそのものではない。", "updatedDate": "2025-11-19"}], "image": "assets/k-000017.webp", "imageAlt": "圧延ロールを題材にした非公式の創作キャラクター案", "imageSha256": "38fcf35a61c456ba3cdb1feff9194f15b7312d763f32af7766f6eef05ede8cf3", "imageWidth": 900, "imageHeight": 600, "firstPublishedAt": "2026-11-01T23:48:33+09:00", "updatedAt": "2026-11-01T23:48:33+09:00"}, {"id": "K-000018", "subject": "鋼板", "subjectReading": "こうはん", "name": "いたまもり", "category": "鉄鋼製品・暮らしの材料", "timeScope": "2026年の区公式産業紹介と企業製品案内に基づく。現在の生産量・見学受付・全設備の稼働状況は示さない。", "factText": "川崎区の2026年の産業紹介では、川崎区扇島に所在地を置くJFEスチール東日本製鉄所の厚板工場が取り上げられました。JFEの製品案内では、厚鋼板は船や橋、建物などに使われる材料です。板状の鋼材から、地域のものづくりと暮らしのつながりを知ることができます。", "fictionText": "厚みの見える一枚の鋼板を丸くデフォルメした、支えることが好きな案内役。控えめな銀灰色の体と、まっすぐな姿勢が目印です。名前と姿は創作で、特定メーカーの製品や公式キャラクターの再現ではありません。", "sources": [{"title": "川崎市川崎区「川崎臨海部オープンファクトリー（令和8年事業は終了しました）」", "url": "https://www.city.kawasaki.jp/kawasaki/page/0000183651.html", "publisher": "川崎市川崎区", "publishedDate": "2026-01-21", "checkedDate": "2026-11-01", "supports": "川崎区扇島1-1のJFE東日本製鉄所、厚板工場を含む2026年の地域産業紹介", "publicationDateNote": "公開日2026-01-21、更新日2026-04-10。終了済み事業の資料で、現在の見学募集ではない。", "updatedDate": "2026-04-10"}, {"title": "JFEスチール「製品情報・厚鋼板」", "url": "https://www.jfe-steel.co.jp/products/atuita/index.html", "publisher": "JFEスチール株式会社", "publishedDate": null, "checkedDate": "2026-11-01", "supports": "京浜地区の厚板工場と、厚鋼板の船舶・橋梁・建築などへの用途", "publicationDateNote": "発行日未確定。閲覧確認日とは区別。"}, {"title": "JFEスチール「京浜地区」", "url": "https://www.jfe-steel.co.jp/works/east/keihin/index.html", "publisher": "JFEスチール株式会社", "publishedDate": null, "checkedDate": "2026-11-01", "supports": "扇島が川崎・横浜両市にまたがること、2023年9月の銑鋼部門・熱間圧延ライン休止と厚板・薄板部門の継続を区別", "publicationDateNote": "発行日未確定。閲覧確認日とは区別。"}], "image": "assets/k-000018.webp", "imageAlt": "鋼板を題材にした非公式の創作キャラクター案", "imageSha256": "13e67a76b7aeb774591da2c033989d6c6938c16ff940b4f4073425793f324927", "imageWidth": 600, "imageHeight": 900, "firstPublishedAt": "2026-11-01T23:48:33+09:00", "updatedAt": "2026-11-01T23:48:33+09:00"}, {"id": "K-000019", "subject": "パイプラック", "subjectReading": "ぱいぷらっく", "name": "くだささえ", "category": "工業設備・配管の支え", "timeScope": "2012～2013年の調査を含む市の事例集を根拠にする歴史題材。現在の設備配置や状態は示さない。", "factText": "パイプラックは、工場などの配管を支える骨組みです。川崎市の過去の事例集には、川崎区浮島町の花王川崎工場にあるパイプラックが取り上げられています。目立つ製品だけでなく、その製造を支える設備も地域のものづくりを知る題材になります。", "fictionText": "小さな棚のような骨組みで、三本の丸い管を支える案内役。目立たないところで仲間を助けるのが得意です。名前と姿は創作で、実際の工場の配管や設備配置を再現していません。", "sources": [{"title": "川崎市「事業所における特徴的な取組（事例集）」事例3 花王株式会社川崎工場", "url": "https://www.city.kawasaki.jp/840/cmsfiles/contents/0000051/51556/I_honbun1%2833-70%29.pdf", "publisher": "川崎市", "supports": "2012年11月～2013年1月の調査を含む事例集。本文36頁に花王川崎工場の構内パイプラックを掲載。公開カードには存在と一般的な役割だけを採用。", "publishedDate": null, "publicationDateNote": "発行日未確定。資料冒頭の調査期間は2012-11-19～2013-01-30。", "checkedDate": "2026-11-01", "pdfPageOneBased": 4}, {"title": "花王「川崎工場」", "url": "https://www.kao.com/jp/corporate/outline/location-list/plant-kawasaki/", "publisher": "花王株式会社", "supports": "所在地が川崎市川崎区浮島町であること", "publishedDate": null, "publicationDateNote": "発行日未確定。閲覧確認日とは区別。", "checkedDate": "2026-11-01"}], "image": "assets/k-000019.webp", "imageAlt": "パイプラックを題材にした非公式の創作キャラクター案", "imageSha256": "20445f0380154fe42c7a8243217e82ecef1ab17e2e07e659740b4ed6317d5722", "imageWidth": 900, "imageHeight": 600, "firstPublishedAt": "2026-11-01T23:57:20+09:00", "updatedAt": "2026-11-01T23:57:20+09:00"}, {"id": "K-000020", "subject": "ガスタービン", "subjectReading": "がすたーびん", "name": "たびんくる", "category": "エネルギー・発電設備", "timeScope": "2026年の区の産業紹介とJERAの一般公開解説に基づく。現在の稼働台数・出力・運転状態は示さない。", "factText": "川崎区千鳥町にあるJERA川崎火力発電所は、区の2026年の産業紹介で、ガスタービンを含む設備の見学先として取り上げられました。ガスタービンは燃焼ガスの力を利用して発電機を回す設備です。風を受けて回る風力発電の風車とは仕組みが異なります。", "fictionText": "短い円筒形の体に、丸い羽根模様を持つ案内役。仲間と力を合わせて仕事を進める性格です。羽根模様と顔は創作で、実機の内部構造や運転方法を示す図ではありません。", "sources": [{"title": "川崎市川崎区「川崎臨海部オープンファクトリー（令和8年事業は終了しました）」", "url": "https://www.city.kawasaki.jp/kawasaki/page/0000183651.html", "publisher": "川崎市川崎区", "supports": "JERA川崎火力発電所の川崎区千鳥町への立地と、ガスタービンを含む2026年の見学内容掲載", "publishedDate": "2026-01-21", "publicationDateNote": "公開日2026-01-21、更新日2026-04-10。終了済み事業の記録。", "checkedDate": "2026-11-01", "updatedDate": "2026-04-10"}, {"title": "JERA「火力発電の種類と仕組み」", "url": "https://www.jera.co.jp/corporate/business/thermal-power/type", "publisher": "株式会社JERA", "supports": "ガスタービンは燃焼ガスの力を利用して発電機を回すこと。風力発電の風車とは区別。", "publishedDate": null, "publicationDateNote": "発行日未確定。閲覧確認日とは区別。", "checkedDate": "2026-11-01"}], "image": "assets/k-000020.webp", "imageAlt": "ガスタービンを題材にした非公式の創作キャラクター案", "imageSha256": "b38856a7644f43dc6293b5649f6741d420ec1e1fd66d0c50a8c989d9319ffc01", "imageWidth": 900, "imageHeight": 600, "firstPublishedAt": "2026-11-01T23:57:20+09:00", "updatedAt": "2026-11-01T23:57:20+09:00"}, {"id": "K-000021", "subject": "石油タンク", "subjectReading": "せきゆたんく", "name": "たんくしずね", "category": "エネルギー・貯蔵設備", "timeScope": "2013年末の市港湾台帳を根拠とする歴史題材。現在の内容物・容量・稼働状態は示さない。", "factText": "川崎市の港湾計画資料には、2013年末の水江町の設備として、石油関連の貯蔵施設が記録されています。石油タンクは、石油を貯蔵するための設備です。川崎臨海部の産業を、材料や燃料を蓄える役割から知る題材になります。", "fictionText": "低くどっしりした円筒形の体に、丸い屋根を載せた案内役。慌てず、物を大切に預かる性格です。名前と姿は創作で、特定の施設や実際のタンク形式を正確に再現したものではありません。", "sources": [{"title": "川崎市「川崎港港湾計画資料（その1）改訂」表Ⅷ－4－22 貯油施設等", "url": "https://www.city.kawasaki.jp/580/cmsfiles/contents/0000063/63390/kouwankeikakusiryou1.pdf", "publisher": "川崎市（川崎港港湾管理者）", "supports": "本文122頁／PDF126頁に2013年末現在の水江町の石油関連貯蔵施設を掲載。容量・個別機番・配置はカードには採用しない。", "publishedDate": null, "publicationDateNote": "2014年11月改訂。表の調査時点は2013年末。", "checkedDate": "2026-11-01", "sourceDateText": "2014年11月", "publishedDatePrecision": "month", "pdfPageOneBased": 126}, {"title": "川崎市川崎区「かわさきの工場夜景」", "url": "https://www.city.kawasaki.jp/kawasaki/page/0000027500.html", "publisher": "川崎市川崎区", "supports": "川崎臨海部に石油などの産業が集積する地域背景。観光・文化紹介としてのみ使用。", "publishedDate": null, "publicationDateNote": "発行日未確定。閲覧確認日とは区別。", "checkedDate": "2026-11-01"}], "image": "assets/k-000021.webp", "imageAlt": "石油タンクを題材にした非公式の創作キャラクター案", "imageSha256": "f9055a66418f157208c67500068e632d3d95b00cd7e383b99128dbfdd73b1016", "imageWidth": 900, "imageHeight": 600, "firstPublishedAt": "2026-11-01T23:57:20+09:00", "updatedAt": "2026-11-01T23:57:20+09:00"}, {"id": "K-000022", "subject": "蒸留塔", "subjectReading": "じょうりゅうとう", "name": "とうすみわけ", "category": "石油産業・成分を分ける設備", "timeScope": "現代の地域産業を公開資料で紹介。現在の設備能力・操業状態は記載しない。", "factText": "川崎区水江町の東亜石油・京浜製油所では、公式の設備紹介に蒸留装置が掲載されています。原油にはさまざまな成分が含まれ、蒸留では沸点の違いを利用して成分を分けます。高い塔の形から、材料を分けるものづくりの役割を知る題材です。", "fictionText": "細長い塔の体に、いくつかの丸い帯をまとった案内役。物事の違いを丁寧に見つけるのが得意です。名前、表情、形は創作で、実際の蒸留塔の内部構造や操作方法を示す図ではありません。", "sources": [{"title": "東亜石油「設備紹介」", "url": "https://www.toaoil.co.jp/business/facility.html", "publisher": "東亜石油株式会社", "supports": "京浜製油所の蒸留装置と、沸点の違いで原油の成分を分ける一般的役割。能力・温度等の数値は採用しない。", "publishedDate": null, "publicationDateNote": "発行日未確定。閲覧確認日とは区別。", "checkedDate": "2026-11-02"}, {"title": "川崎市観光協会「東亜石油（株）京浜製油所」", "url": "https://www.k-kankou.jp/study/facility/detail.html?CN=53613", "publisher": "一般社団法人川崎市観光協会", "supports": "所在地が川崎市川崎区水江町であること。見学の受付状況・条件は本文に採用しない。", "publishedDate": null, "publicationDateNote": "発行日未確定。閲覧確認日とは区別。", "checkedDate": "2026-11-02"}], "image": "assets/k-000022.webp", "imageAlt": "蒸留塔を題材にした非公式の創作キャラクター案", "imageSha256": "af4dae4c7f71266d2f6bd2730d4ac8ab38e56c1382313dd2bd822c0ba7bde32a", "imageWidth": 900, "imageHeight": 900, "firstPublishedAt": "2026-11-02T00:18:35+09:00", "updatedAt": "2026-11-02T00:18:35+09:00"}, {"id": "K-000023", "subject": "水素", "subjectReading": "すいそ", "name": "すいそより", "category": "資源循環・化学の素材", "timeScope": "2025年10月の市発表時点の事業紹介に基づく。2030年の計画と実績を区別。", "factText": "川崎区扇町のレゾナック川崎事業所には、使用済みプラスチックを化学原料へ再生する取組があります。川崎市の2025年の発表では、プラスチック由来の水素がアンモニアの原料の一つとして使われていると紹介されています。水素を通して、地域の資源循環と化学産業のつながりを知ることができます。", "fictionText": "同じ大きさの二つの丸がつながった、協力好きの案内役。丸い形は水素分子をイメージした創作表現です。顔と配色は創作で、水素の実際の色や見た目、危険性を示すものではありません。", "sources": [{"title": "川崎市「株式会社レゾナックがプラスチックのケミカルリサイクルによる低炭素アンモニア事業の拡大を決定しました」", "url": "https://www.city.kawasaki.jp/templates/prs/cmsfiles/contents/0000181/181094/20251006_press.pdf", "publisher": "川崎市／別紙：株式会社レゾナック・ホールディングス", "supports": "使用済みプラスチック由来の水素を原料の一つにアンモニアを製造。2030年の原料転換は計画として記載。", "publishedDate": "2025-10-06", "publicationDateNote": "市報道発表・別紙とも2025-10-06。2030年計画を現在の実績とはしない。", "checkedDate": "2026-11-02"}, {"title": "川崎市川崎区「川崎臨海部オープンファクトリー（令和8年事業は終了しました）」", "url": "https://www.city.kawasaki.jp/kawasaki/page/0000183651.html", "publisher": "川崎市川崎区", "supports": "レゾナック川崎事業所の所在地が川崎区扇町であることと、使用済みプラスチックのリサイクル紹介。", "publishedDate": "2026-01-21", "publicationDateNote": "公開日2026-01-21、更新日2026-04-10。終了済み事業の記録。", "checkedDate": "2026-11-02", "updatedDate": "2026-04-10"}], "image": "assets/k-000023.webp", "imageAlt": "水素を題材にした非公式の創作キャラクター案", "imageSha256": "2dc7e64f8d525eec5af74dc9758cfb70729f40074b633efd935864389ac3bdab", "imageWidth": 900, "imageHeight": 600, "firstPublishedAt": "2026-11-02T00:18:35+09:00", "updatedAt": "2026-11-02T00:18:35+09:00"}, {"id": "K-000024", "subject": "PET再生", "subjectReading": "ぺっとさいせい", "name": "ぺともどり", "category": "資源循環・ペットボトル", "timeScope": "現代の企業公開情報による地域産業紹介。回収量・再生率・環境効果の数値や当日の操業は主張しない。", "factText": "川崎区扇町のペットリファインテクノロジーは、使用済みペットボトルをリサイクルし、再生PET樹脂を製造しています。再びペットボトルの原料にする「ボトルtoボトル」の取組です。捨てた後にも資源としてつながる、身近な容器と地域産業の関係を知ることができます。", "fictionText": "無地のボトル形の体に、戻り道をイメージした小さな輪のリボンを持つ案内役。もう一度役立つ方法を考えるのが好きです。名前と姿は創作で、飲料ブランドや企業の公式キャラクターではありません。", "sources": [{"title": "ペットリファインテクノロジー「企業情報」", "url": "https://www.prt.jp/company/", "publisher": "ペットリファインテクノロジー株式会社", "supports": "川崎区扇町への立地、使用済みペットボトルのリサイクルと再生PET樹脂の製造・販売。", "publishedDate": null, "publicationDateNote": "発行日未確定。閲覧確認日とは区別。", "checkedDate": "2026-11-02"}, {"title": "ペットリファインテクノロジー「事業・製品紹介」", "url": "https://www.prt.jp/", "publisher": "ペットリファインテクノロジー株式会社", "supports": "使用済みペットボトルから再びペットボトルの原料となる再生PET樹脂を製造するボトルtoボトルの取組。", "publishedDate": null, "publicationDateNote": "発行日未確定。閲覧確認日とは区別。", "checkedDate": "2026-11-02"}], "image": "assets/k-000024.webp", "imageAlt": "PET再生を題材にした非公式の創作キャラクター案", "imageSha256": "3842e7ac1c3bd4d68ddbbcd4b6fadea0f5d3abceaac6a20fb550dff76ff23659", "imageWidth": 600, "imageHeight": 900, "firstPublishedAt": "2026-11-02T00:18:35+09:00", "updatedAt": "2026-11-02T00:18:35+09:00"}, {"id": "K-000025", "subject": "味の素", "subjectReading": "あじのもと", "name": "うまみひとかけ", "category": "食と産業史・うま味", "timeScope": "1914年の川崎工場での生産開始を紹介する歴史題材。現在の製造品目や製法は主張しない。", "factText": "うま味調味料「味の素」は、1914年に川崎工場での生産が始まりました。川崎区鈴木町にある事業所と、地域の食品産業の歴史に関わる題材です。ここでは商品の公式キャラクターではなく、うま味を伝える結晶のイメージから独自の創作案を考えています。", "fictionText": "細長い結晶を丸くデフォルメした、小さな聞き上手の案内役。料理に関わる人の話を集めるのが好きです。名前と姿は創作で、実際の結晶構造や商品の形、企業の公式キャラクターを再現したものではありません。", "sources": [{"title": "川崎市「川崎臨海部ニュースレター vol.30」味の素株式会社インタビュー", "url": "https://www.city.kawasaki.jp/590/page/0000147062.html", "publisher": "川崎市", "supports": "うま味調味料の事業化と、川崎工場の歴史。創業と川崎への工場進出は別の出来事。", "publishedDate": "2023-01-18", "publicationDateNote": "公開・更新日2023-01-18。工場の歴史を紹介する資料。", "checkedDate": "2026-11-02"}, {"title": "味の素「川崎事業所を再構築」参考：川崎事業所沿革", "url": "https://www.ajinomoto.co.jp/company/jp/presscenter/press/detail/2005_01_31.html", "publisher": "味の素株式会社", "supports": "川崎区鈴木町への立地、1914年の川崎工場での「味の素」生産開始。2005年の投資計画や人数・現行商品は採用しない。", "publishedDate": "2005-01-31", "publicationDateNote": "2005年の発表にある歴史年表のみを利用。現況を保証する資料ではない。", "checkedDate": "2026-11-02"}], "image": "assets/k-000025.webp", "imageAlt": "味の素を題材にした非公式の創作キャラクター案", "imageSha256": "62d4c0315c33f37e82da8cf2b695028c252af5202200e578b22262d0a8c357c6", "imageWidth": 600, "imageHeight": 900, "firstPublishedAt": "2026-11-02T00:27:07+09:00", "updatedAt": "2026-11-02T00:27:07+09:00"}, {"id": "K-000026", "subject": "食塩", "subjectReading": "しょくえん", "name": "しおはましかく", "category": "食と地域史・塩づくり", "timeScope": "塩浜の塩田の歴史と、現在の夜光の企業紹介を分けて扱う。現在も塩浜に塩田があるとはしない。", "factText": "川崎市の展示資料では、川崎区塩浜はかつて塩田があり、塩づくりが盛んだった地域と紹介されています。一方、現在の川崎区夜光には、家庭用や業務用の塩を製造する日本食塩製造があります。昔の塩田と今の製造業を区別しながら、食塩と地域のつながりを知ることができます。", "fictionText": "立方体の塩の結晶をイメージした、角の丸い案内役。昔の海辺の暮らしの話を大切にしています。名前と姿は創作で、現在の製品の原料が川崎の海で採れたという意味ではありません。", "sources": [{"title": "川崎市環境デジタルアーカイブ「1800年以前～1960年ごろ」展示パネル", "url": "https://www.digital-archive-env.city.kawasaki.jp/virtual-exhibition-room/pdf/pdf/1800_1960.pdf", "publisher": "川崎市", "supports": "PDF2頁：川崎区塩浜の塩田と塩づくりの歴史。塩田が1910年になくなったとの記載。", "publishedDate": null, "publicationDateNote": "発行日未確定。閲覧確認日とは区別。", "checkedDate": "2026-11-02", "pdfPageOneBased": 2}, {"title": "日本食塩製造「企業情報」", "url": "https://www.nihon-s-gr.com/company/", "publisher": "日本食塩製造株式会社", "supports": "川崎区夜光への立地、家庭用・業務用塩の製造という事業。", "publishedDate": null, "publicationDateNote": "発行日未確定。閲覧確認日とは区別。", "checkedDate": "2026-11-02"}], "image": "assets/k-000026.webp", "imageAlt": "食塩を題材にした非公式の創作キャラクター案", "imageSha256": "1a7b2fea0a3c00aebed70bbb4407c71acdfc55d04aaa1a3480fd91836a0c4519", "imageWidth": 900, "imageHeight": 769, "firstPublishedAt": "2026-11-02T00:27:07+09:00", "updatedAt": "2026-11-02T00:27:07+09:00"}, {"id": "K-000027", "subject": "ステンレス", "subjectReading": "すてんれす", "name": "すてんつやり", "category": "ものづくり・金属材料", "timeScope": "現在公開されている所在地・事業・材料解説をもとに紹介。設備の稼働状況や製造量は未確認。", "factText": "川崎区小島町の日本冶金工業・川崎製造所は、ステンレス鋼などの製造拠点です。ステンレスはさびにくい特性を持つ金属材料で、用途や使う環境に合わせてさまざまな種類が用いられます。地域のものづくりを、材料の特性から知る題材です。", "fictionText": "くるりと巻いた金属の帯を体にした、手入れを大切にする案内役。光を柔らかく映す姿が目印です。名前と姿は創作で、特定の製品や、絶対にさびない材料を表すものではありません。", "sources": [{"title": "日本冶金工業「国内拠点」", "url": "https://www.nyk.co.jp/about/access.html", "publisher": "日本冶金工業株式会社", "supports": "川崎製造所が川崎市川崎区小島町にあること。", "publishedDate": null, "publicationDateNote": "発行日未確定。閲覧確認日とは区別。", "checkedDate": "2026-11-02"}, {"title": "日本冶金工業「未来へ向けたものづくりの挑戦」", "url": "https://nyk.co.jp/about/stories/future/", "publisher": "日本冶金工業株式会社", "supports": "川崎製造所がステンレス鋼・高機能材の製造拠点であること。", "publishedDate": null, "publicationDateNote": "発行日未確定。閲覧確認日とは区別。", "checkedDate": "2026-11-02"}, {"title": "日本冶金工業「製品情報」", "url": "https://www.nyk.co.jp/products/", "publisher": "日本冶金工業株式会社", "supports": "ステンレスのさびにくさと、使用環境や条件に応じた特性・用途。", "publishedDate": null, "publicationDateNote": "発行日未確定。閲覧確認日とは区別。", "checkedDate": "2026-11-02"}], "image": "assets/k-000027.webp", "imageAlt": "ステンレスを題材にした非公式の創作キャラクター案", "imageSha256": "78efa7660ad2058c9f06ae0b27cca57e4b5594250f06b6886ef099f8cc245b25", "imageWidth": 900, "imageHeight": 750, "firstPublishedAt": "2026-11-02T00:27:07+09:00", "updatedAt": "2026-11-02T00:27:07+09:00"}, {"id": "K-000028", "subject": "コブシの花", "subjectReading": "こぶしのはな", "name": "こぶしほころ", "category": "自然・公園の植物", "timeScope": "2025年3月の公園公式の植栽紹介を根拠にする。現在の開花状況や樹木の状態は未確認。", "factText": "大師公園の公式サイトは、2025年3月、大師こども文化センター前に植えられたコブシを紹介しています。大師公園は川崎区にあり、身近な公園の植物として地域との関係を確認できます。コブシは川崎区の「区の花」「区の木」ではありません。", "fictionText": "白い花びらをふわりと広げ、小さな枝の体で立つ案内役。春の小さな変化を見つけるのが好きです。名前と表情は創作で、公園の公式キャラクターや植物の正確な標本図ではありません。", "sources": [{"title": "大師公園「開花情報（ハクモクレン・コブシ）」", "url": "https://daishi-park.com/shinshuen/post-2178/", "publisher": "大師公園公式サイト", "supports": "大師こども文化センター前のコブシ植栽を2025年3月14日に紹介。開花や植栽の現在状態は保証しない。", "publishedDate": "2025-03-14", "publicationDateNote": "投稿日2025-03-14。当日の観察記録と現在の開花状況は区別。", "checkedDate": "2026-11-02"}, {"title": "川崎市こどもページ「3 大師公園」", "url": "https://www.city.kawasaki.jp/kawasakiu18/page/0000001894.html", "publisher": "川崎市", "supports": "大師公園が川崎区大師公園1に所在し、daishi-park.comを公園ホームページとして案内していること。", "publishedDate": "2011-08-23", "publicationDateNote": "公開日2011-08-23、更新日2024-03-14。", "checkedDate": "2026-11-02", "updatedDate": "2024-03-14"}, {"title": "川崎市川崎区「川崎区の『区の花』『区の木』を制定しました」", "url": "https://www.city.kawasaki.jp/kawasaki/page/0000041570.html", "publisher": "川崎市川崎区", "supports": "区制40周年の区の木としてイチョウと長十郎梨を制定。区の花はひまわりとビオラ。", "publishedDate": "2012-04-01", "publicationDateNote": "公開日2012-04-01、更新日2025-01-17。", "checkedDate": "2026-11-02", "updatedDate": "2025-01-17"}], "image": "assets/k-000028.webp", "imageAlt": "コブシの花を題材にした非公式の創作キャラクター案", "imageSha256": "6a09a81dfab0523bc8886a01090c9dfabbd3c609b1e25f13c54364429c7b564e", "imageWidth": 750, "imageHeight": 900, "firstPublishedAt": "2026-11-02T00:39:10+09:00", "updatedAt": "2026-11-02T00:39:10+09:00"}, {"id": "K-000029", "subject": "イチョウ", "subjectReading": "いちょう", "name": "いちょうしおり", "category": "自然・区のシンボル", "timeScope": "2012年に制定された区の木と、市が紹介する地域の樹木を題材にする。現在の黄葉状態は未確認。", "factText": "イチョウは、長十郎梨とともに川崎区の「区の木」に選ばれています。区制40周年を記念して制定されました。また、川崎市の「まちの樹50選」には、川崎区の稲毛神社のイチョウが掲載されています。地域で親しまれる木を知る題材です。", "fictionText": "扇形の葉を体にした、小さなしおりを持つ案内役。街で見つけた季節の記憶を集めています。名前と姿は創作で、区の木の公式ロゴや、神社の公式キャラクターではありません。", "sources": [{"title": "川崎市川崎区「川崎区の『区の花』『区の木』を制定しました」", "url": "https://www.city.kawasaki.jp/kawasaki/page/0000041570.html", "publisher": "川崎市川崎区", "supports": "区制40周年の区の木としてイチョウと長十郎梨を制定。区の花はひまわりとビオラ。", "publishedDate": "2012-04-01", "publicationDateNote": "公開日2012-04-01、更新日2025-01-17。", "checkedDate": "2026-11-02", "updatedDate": "2025-01-17"}, {"title": "川崎市「まちの樹50選」", "url": "https://www.city.kawasaki.jp/530/page/0000018370.html", "publisher": "川崎市", "supports": "川崎区稲毛神社のイチョウを掲載。", "publishedDate": "2023-12-15", "publicationDateNote": "公開日2023-12-15、更新日2025-11-12。樹勢や当日の見学可否は示さない。", "checkedDate": "2026-11-02", "updatedDate": "2025-11-12"}], "image": "assets/k-000029.webp", "imageAlt": "イチョウを題材にした非公式の創作キャラクター案", "imageSha256": "a46df50f89a5219d896975e2c5feb8fb9a570ce7b5bc707de008ec7d77670367", "imageWidth": 900, "imageHeight": 822, "firstPublishedAt": "2026-11-02T00:39:10+09:00", "updatedAt": "2026-11-02T00:39:10+09:00"}, {"id": "K-000030", "subject": "工場夜景の照明", "subjectReading": "こうじょうやけいのしょうめい", "name": "よあかりぽつり", "category": "産業文化・夜の景観", "timeScope": "区と観光協会の公開紹介による文化題材。特定施設の現在の照明・稼働・観賞条件は示さない。", "factText": "川崎区の公式紹介では、臨海部の工場の夜間照明などが工場夜景を形づくる要素として説明されています。川崎市観光協会も、工場の作業用の明かりが生む景観を紹介しています。働く場所の光から生まれる、地域の産業文化を知る題材です。", "fictionText": "小さな照明器具をイメージした、夜の光の案内役。強く目立つより、そっと周りを照らすのが好きです。名前と姿は創作で、特定の工場の照明器具や配置を再現したものではありません。", "sources": [{"title": "川崎市川崎区「かわさきの工場夜景」", "url": "https://www.city.kawasaki.jp/kawasaki/page/0000027500.html", "publisher": "川崎市川崎区", "supports": "川崎臨海部の工場の夜間照明などが工場夜景を形づくる地域文化紹介。", "publishedDate": "2012-04-10", "publicationDateNote": "公開・更新日2012-04-10。古い資料の現況表現や施設稼働・ツアー状況は引き継がない。", "checkedDate": "2026-11-02"}, {"title": "川崎市観光協会「工場夜景」", "url": "https://www.k-kankou.jp/industrial_night/", "publisher": "一般社団法人川崎市観光協会", "supports": "川崎臨海部の工場の作業用の明かりと工場夜景。点灯時刻・ツアー募集・個別施設の稼働は未確認。", "publishedDate": null, "publicationDateNote": "発行日未確定。閲覧確認日とは区別。", "checkedDate": "2026-11-02"}], "image": "assets/k-000030.webp", "imageAlt": "工場夜景の照明を題材にした非公式の創作キャラクター案", "imageSha256": "348ade551e7e72ab8f6bb1a95f6f8291087f37a61e74909d9990be4b14e0902d", "imageWidth": 900, "imageHeight": 832, "firstPublishedAt": "2026-11-02T00:39:10+09:00", "updatedAt": "2026-11-02T00:39:10+09:00"}];
function cherryCaptionCitationSuffix(d){const suffix=' 出典（説明内容）：'+d.source;return d.caption.endsWith(suffix)?suffix:''}
function cherryCaptionWithoutCitation(d){const suffix=cherryCaptionCitationSuffix(d);return suffix?d.caption.slice(0,-suffix.length):d.caption}
function regionalCitationContexts(x){
 let contents='';
 if(x.id==='kawasaki')contents=[...mascotDrafts].sort((a,b)=>Math.max(Date.parse(b.updatedAt)||0,Date.parse(b.firstPublishedAt)||0)-Math.max(Date.parse(a.updatedAt)||0,Date.parse(a.firstPublishedAt)||0)).map(m=>`<section class="source-context"><h4>${esc(m.name)}：${esc(m.subject)}</h4><p>出典：${m.sources.map(z=>`<a href="${esc(z.url)}" target="_blank" rel="noopener noreferrer">${esc(z.title)} ↗</a>`).join(' ／ ')}</p></section>`).join('');
 if(x.contentType==='cherry-homecoming'){
 contents=x.sections.map(b=>`<section class="source-context"><h4>${bodyText(x,b.heading)}</h4><p>出典：${b.sources.map(u=>`<a href="${esc(u)}" target="_blank" rel="noopener noreferrer">${esc(((x.sources||[]).find(z=>z.url===u)?.title||u))} ↗</a>`).join(' ／ ')}</p></section>`).join('');
 contents+=(x.diagrams||[]).map((d,i)=>`<section class="source-context"><h4>図${i+1}：${bodyText(x,(d.labels||[]).join(' ／ '))}</h4>${cherryCaptionCitationSuffix(d)?`<p>${bodyText(x,cherryCaptionCitationSuffix(d).trim())}</p>`:''}<p><a href="${esc(d.source)}" target="_blank" rel="noopener noreferrer">説明内容の出典 ↗</a></p></section>`).join('');
 }
 return contents?'<!--regional-citation-contexts:start--><div class="source-contexts"><h3>本文・図と出典の対応</h3>'+contents+'</div><!--regional-citation-contexts:end-->':'';
}
function mascotDraftSection(){return `<section class="mascot-drafts"><h3>制作中のキャラクター案</h3><p class="subnote">新しい掲載・更新順</p><p class="subnote">川崎区に関わる題材をもとにした、当図鑑独自の創作案です。自治体・施設・企業の公式キャラクターではありません。名称とデザインは仮案で、正式登録済みの件数には含めていません。</p><div class="mascot-grid">${[...mascotDrafts].sort((a,b)=>Math.max(Date.parse(b.updatedAt)||0,Date.parse(b.firstPublishedAt)||0)-Math.max(Date.parse(a.updatedAt)||0,Date.parse(a.firstPublishedAt)||0)).map(m=>`<section class="mascot-draft"><div class="mascot-status">${esc(m.id)} · 制作中・仮称</div><h4>${esc(m.name)}</h4>${m.firstPublishedAt?`<p class="subnote">案の初回掲載：${timestampText(m.firstPublishedAt)}<br>案の更新：${timestampText(m.updatedAt)}</p>`:""}${m.reviewNote?`<p class="subnote">${esc(m.reviewNote)}</p>`:""}<p class="mascot-subject">題材：${m.subject===m.subjectReading?esc(m.subject):rubyText(m.subject,m.subjectReading)}</p>${m.image?`<figure><img src="${esc(m.image)}" alt="${esc(m.imageAlt)}" loading="lazy" width="${m.imageWidth||900}" height="${m.imageHeight||822}"></figure>`:'<p class="subnote">キャラクター画像を制作中です。</p>'}<h5>題材の本当の話</h5><p>${esc(m.factText)}</p><p class="subnote">${esc(m.timeScope)}</p><h5>キャラクターの創作設定</h5><p>${esc(m.fictionText)}</p></section>`).join('')}</div></section>`}
function characterGallery(x){if(!x.characterGallery)return '';return `<section class="character-gallery" aria-labelledby="character-gallery-title"><h3 id="character-gallery-title">${esc(x.characterGalleryHeading||"登場人物")}</h3><div class="character-face-grid">${x.characterGallery.map(c=>`<article class="character-face-card${(c.wide||c.portraits.length>2)?' character-face-wide':''}"><div class="character-face-images${c.portraits.length>1?' paired':''}">${c.portraits.map(p=>`<figure><img src="${esc(p.src)}" width="${p.width}" height="${p.height}" alt="${esc(p.alt)}" loading="lazy" decoding="async">${p.label?`<figcaption>${bodyText(x,p.label)}</figcaption>`:''}</figure>`).join('')}</div><h4>${x.characterNamesUseBodyReadings?bodyText(x,c.name):characterName(c.name)}</h4><p>${bodyText(x,c.role)}</p></article>`).join('')}</div></section>`}

function authorPlaceGuide(x){const g=x.placeGuide;if(!g)return '';return `<section class="author-place-guide"><h3>${bodyText(x,g.title)}</h3><ol class="place-orientation" aria-label="地域の位置づけ">${g.orientation.map(v=>`<li>${bodyText(x,v)}</li>`).join('')}</ol><p>${bodyText(x,g.note)}</p><div class="place-guide-grid">${g.places.map(v=>`<section class="place-guide-item"><span class="place-guide-label">${bodyText(x,v.label)}</span><h4>${bodyText(x,v.name)}</h4><p>${bodyText(x,v.note)}</p></section>`).join('')}</div><section class="place-guide-item"><span class="place-guide-label">現在の資料館を地図で見る</span><h4>${bodyText(x,g.museum.name)}</h4><p>${bodyText(x,g.museum.address)}</p><a class="place-guide-map" href="${esc(g.museum.mapUrl)}" target="_blank" rel="noopener noreferrer">Google マップで位置を見る ↗</a><a href="${esc(g.museum.url)}" target="_blank" rel="noopener noreferrer">記念館の公式案内 ↗</a><p class="place-guide-note">${bodyText(x,g.museum.note)}</p></section></section>`}

function introductionText(x){return bodyText(x,x.intro)}
const reflectionPrompts = {"rashomon": ["自分だったら、あの場面でどうするだろう。", "生きるためなら、どこまで許されるのだろう。", "自分に都合のいい理由をつけていないか、考えたくなる。"], "spider": ["自分だけ助かりたいと思う気持ちは、誰にでもあるのかもしれない。", "誰かを思いやるのは、余裕がないときほど難しい。", "一本の糸が希望にも試練にも見える。"], "ginga": ["本当の幸せって何だろう。", "大切な人との時間をもっと大事にしたい。", "美しい旅なのに、少し寂しい気持ちになる。"], "cat": ["猫の目で見ると、人間の行動って不思議だ。", "笑えるけれど、少し自分にも当てはまりそう。", "当たり前だと思うことを疑ってみたくなる。"], "gloves": ["知らない相手にも優しさがあるかもしれない。", "子ぎつねの勇気を応援したくなる。", "親が子を心配する気持ちが伝わってくる。"], "takasebune": ["幸せの形は人によって違うのかもしれない。", "正しいかどうか、簡単には決められない。", "相手の事情を知ることの大切さを感じる。"], "yamanashi": ["水の中の世界を想像するのが楽しい。", "季節が変わると景色も気持ちも変わる。", "説明されない部分を自分で考えるのも面白い。"], "sanshodayu": ["どんなときも優しさを忘れずにいたい。", "家族を思う気持ちが胸に残る。", "苦しんでいる人に気づけるだろうか。"], "crimeandpunishment": ["自分の心からは逃げられないのかもしれない。", "正しさを理屈だけで決めていいのだろうか。", "人は誰かとの関わりで変わることがある。"], "romeoandjuliet": ["周りの争いが二人の未来を奪うのは悲しい。", "気持ちを伝えるタイミングって大切だ。", "好きという気持ちだけでは越えられない壁もある。"], "happyprince": ["本当の美しさは行動に表れるのかもしれない。", "誰かを助けたい気持ちに心を動かされる。", "自分ならどんな小さな親切ができるだろう。"], "momotaro": ["仲間と力を合わせるのは心強い。", "鬼の側から見た物語も気になる。", "子どもの頃と今とでは感じ方が違う。"], "redcap": ["知らない相手を信じる怖さを感じる。", "森の道を歩く気持ちになって読んだ。", "小さな約束にも意味があるのかもしれない。"], "aliceinwonderland": ["常識が通じない世界は面白い。", "次に何が起こるか分からなくてわくわくする。", "当たり前のルールも見方次第で変わる。"], "cinderella": ["希望を持ち続ける強さを感じる。", "幸せは誰かに選ばれることだけだろうか。", "魔法だけでなく日々の暮らしにも目が向く。"], "urashimataro": ["楽しい時間ほどあっという間に過ぎる。", "帰る場所が変わってしまう寂しさを感じる。", "約束の意味を考えたくなる。"], "uglyduckling": ["周りと違っても価値がないわけじゃない。", "見た目で判断していないか振り返る。", "居場所が見つかるまでの時間も大切なのかもしれない。"], "mermaid": ["誰かを好きになることは切ない。", "願いがかなえば幸せとは限らない。", "自分の気持ちも大事にしてほしい。"], "christmas-carol": ["今からでも行動を変えられるかもしれない。", "身近な人にもっと優しくしたい。", "過去と未来を見つめると今が違って見える。"], "little-match-girl": ["少女の見た温かな景色が忘れられない。", "困っている人に気づけるだろうか。", "短い話なのに長く心に残る。"], "hamlet": ["考えすぎて動けなくなる気持ちが分かる。", "疑いが人間関係を壊していくのが怖い。", "正しい決断とは何だろう。"], "melos": ["信じることは、言葉だけでなく行動でも示せるのだろうか。", "友達を信じて待つのも勇気がいる。", "約束を守るために自分ならどこまで頑張れるだろう。"], "restaurant": ["お客さんだと思っていたのに、立場が逆転するのが怖い。", "都合のいい言葉を疑わず信じていないだろうか。", "面白い話なのに、最後はぞっとする。"], "gongitsune": ["気持ちが伝わらないまま終わるのが切ない。", "相手を思うなら、伝え方も大事なのかもしれない。", "ごんと兵十が話せていたら、何か変わっただろうか。"], "goshu": ["苦手なことも、続けるうちに少しずつ変わる。", "教える側と教わる側が入れ替わるのが面白い。", "誰かの言葉に耳を傾ける余裕を持ちたい。"], "toshishun": ["お金があれば本当に幸せになれるのだろうか。", "最後に大切なものが何か気づく場面が心に残る。", "自分なら何を手放せずにいるだろう。"], "yodaka": ["見た目で誰かを傷つけていないだろうか。", "よだかの悲しさを思うと胸が苦しい。", "自分の居場所を探す気持ちは分かる気がする。"], "trolley": ["子どものころ、遠くまで来て急に不安になったことを思い出す。", "楽しかった時間が一瞬で怖さに変わるのが印象的。", "大人になっても忘れられない景色がある。"], "lamp": ["便利になることと、古いものを大切にすることは両立できるだろうか。", "仕事に誇りを持つ気持ちが伝わってくる。", "変化を受け入れるのは簡単ではない。"], "botchan": ["正直でいることと、周りとうまくやることは難しい。", "坊っちゃんのまっすぐさが気持ちいい。", "自分ならあの職場でどう振る舞うだろう。"], "kokoro": ["相手に言えない気持ちが関係を変えてしまう。", "信頼はどうすれば守れるのだろう。", "誰かの心を完全に理解するのは難しい。"], "lemon": ["気分が沈んだとき、小さなものが世界を変えて見せることもある。", "色や形の描写を読むだけで景色が浮かぶ。", "自分にとっての『檸檬』は何だろう。"], "sangetsuki": ["自尊心と臆病さが自分にもある気がする。", "才能があっても、それだけでは苦しいのかもしれない。", "人に弱さを見せる勇気も必要だろうか。"], "yumejuya": ["夢の中では当たり前のことが不思議に感じる。", "意味が分からない場面も、心に残る。", "同じ夢を見ても人によって受け取り方が違いそう。"], "maihime": ["自分の夢と誰かへの責任がぶつかったらどうするだろう。", "選ばなかった道のことも考えてしまう。", "相手の立場から読み直すと印象が変わる。"], "ningen": ["周りに合わせ続ける苦しさを考えた。", "本当の自分を見せるのは怖いこともある。", "人の弱さを簡単に決めつけたくない。"], "hitofusanobudo": ["悪いことをしてしまった後、どう向き合うかが大切なのかもしれない。", "許されることの温かさが心に残る。", "子どものころの後悔を思い出す。"], "donquixote": ["夢を追う姿は滑稽でも、少しうらやましい。", "現実を見ることと理想を持つことは両立できるだろうか。", "周りと違う考えを持つ人をどう受け止めるだろう。"], "orion": ["夜空の星に物語があると、空を見るのが楽しくなる。", "同じ星でも昔の人には別の姿が見えていた。", "強さだけでは語れない人物像が気になる。"], "andromeda": ["星座の形から壮大な物語を想像できるのが面白い。", "誰かを救う話にも、いろいろな立場がある。", "夜空を見るたびに物語を思い出しそう。"], "hansel": ["不安なときに兄妹で助け合う姿が心強い。", "知恵を使って危険から抜け出すところが面白い。", "甘いものにひかれる気持ちが怖さにつながる。"], "wizardofoz": ["探していた力は最初から自分の中にあったのかもしれない。", "仲間と旅をすると、一人では気づけないことがある。", "帰りたい場所があることの大切さを感じる。"], "treasure-island": ["冒険にはわくわくと怖さが一緒にある。", "信用できる人を見分けるのは難しい。", "宝物より旅で得た経験の方が大きいのかもしれない。"], "kaguyahime": ["美しいものを手に入れたい気持ちについて考える。", "別れが決まっているからこそ、一緒の時間が大切に思える。", "かぐや姫自身の望みは何だったのだろう。"], "snow-white": ["親切そうに見える相手にも注意が必要かもしれない。", "見た目の美しさだけで価値は決まらない。", "誰を信じるかが運命を変える物語だと思う。"], "pussinboots": ["知恵と工夫で状況を変えるのが痛快。", "うまくいったからといって、やり方まで正しいのだろうか。", "猫の行動力を少し見習いたい。"], "emperors-new-clothes": ["周りに合わせて本当のことを言えない場面は身近にもある。", "子どもの一言が空気を変えるのが面白い。", "自分なら正直に言えただろうか。"], "amanoiwato": ["誰かが閉じこもったとき、周りに何ができるだろう。", "みんなで工夫する姿に明るさを感じる。", "太陽が戻る場面を想像するとわくわくする。"], "tanabata": ["会える時間が少ないからこそ大切に思えるのかもしれない。", "星空に願いを重ねる気持ちは今も変わらない。", "約束を待つ時間はどんな気持ちだろう。"], "lesmiserables": ["一度の過ちだけで人を判断していいのだろうか。", "誰かの優しさが人生を変えることもある。", "正義と慈悲がぶつかるとき、どう考えるべきだろう。"], "frankenstein": ["生み出したものへの責任はどこまであるのだろう。", "見た目だけで恐れられる悲しさを感じる。", "孤独が人を変えてしまうことを考えた。"], "makuranososhi": ["昔の人も季節の美しさに心を動かされていた。", "何気ない日常を言葉にするのは楽しい。", "自分なら『をかし』と思うものを何と書くだろう。"], "genjimonogatari": ["人の気持ちは時代が違っても複雑だ。", "華やかな暮らしの裏にも寂しさがある。", "登場人物それぞれの立場から読み直してみたい。"], "takekurabe": ["大人になることで失うものもあるのかもしれない。", "周りの環境が未来を決めてしまう切なさを感じる。", "子ども同士の距離が変わる場面が心に残る。"], "nigorie": ["誰かの生き方を外から簡単に評価できない。", "逃げ場の少ない暮らしの苦しさを感じる。", "登場人物の選択を自分ならどう受け止めるだろう。"], "redheadedleague": ["一見おかしな話にも理由が隠れている。", "細かな違和感に気づく観察力がすごい。", "うまい話には裏があるのかもしれない。"], "anne-green-gables": ["想像する力が毎日を豊かにしてくれる。", "失敗しても成長できるところに元気をもらう。", "自分らしさを大切にしたくなる。"], "tom-sawyer": ["子どもの冒険心がまぶしい。", "自由に遊ぶことと責任を持つことは両立できるだろうか。", "友達との思い出を振り返りたくなる。"], "little-princess": ["つらいときでも人への優しさを忘れない姿が心に残る。", "立場が変わっても人の価値は変わらない。", "想像力が心を支えてくれることもある。"], "daddy-long-legs": ["誰かに支えられながら、自分の道を見つけていくのがいい。", "手紙から気持ちの変化が伝わってくる。", "自立することの意味を考えたくなる。"], "snow-queen": ["ゲルダを引き止めたおいはぎの娘が、最後には送り出してくれる。その変化をどう感じましたか。", "カイがゲルダを思い出す場面で、心に残ったことはありますか。", "帰ってきた二人は大きくなっていても、心は子供のままでした。この結びをどう受け取りましたか。"], "jack-and-the-beanstalk": ["一回目と三回目で、ジャックが空へ行く理由はどう変わりましたか。", "巨人の妻に助けられたジャックの行動を、どう考えますか。", "もし金の卵を産む鶏を手に入れたところで終わっていたら、物語はどう違って見えるでしょう。"], "pinocchio": ["ピノキオを本当に助ける人と、利用する人は、どこで見分けられそうでしょう。", "父を捜していたピノキオが、父を支えるようになった変化をどう感じますか。", "約束することと、毎日の行動を変えることには、どんな違いがあるでしょう。"], "pandora": ["災いを送り出したゼウスと、壺を開けたパンドラの役割は、どう違うでしょう。", "エピメテウスが警告を思い出していたら、何が変わったと思いますか。", "希望が壺の中に残ることを、あなたは救いと閉じ込めのどちらに近く感じますか。"], "gakumon-no-susume": ["本を読んで知ることと、実際に使えることには、どんな違いがあるでしょう。", "自分で考えることと、人の助けを借りることは両立できるでしょうか。", "新しいものや昔からの習慣を、どのように比べて判断したいですか。"], "utayomi-ni-atauru-sho": ["有名な人の作品だと知る前と後で、感じ方が変わることはあるでしょうか。", "見た景色をそのまま書くときにも、自分の気持ちは表れるでしょうか。", "新しい言葉を使うことと、新しい表現を作ることは同じでしょうか。"], "time-machine": ["時間旅行者が最初の考えを変えたのは、何を見つけたからでしょう。", "地上と地下の暮らしの違いは、私たちの社会について何を考えさせるでしょう。", "二本の花だけが残る結末を、あなたはどう受け止めますか。"], "oku-no-hosomichi": ["同じ美しい景色でも、場所の歴史を知ると見え方は変わるでしょうか。", "旅先で受けた親切や別れは、風景と同じくらい記憶に残るでしょうか。", "大垣で終わらず次の旅へ出る結びから、どんな気持ちを感じますか。"], "bushido": ["勇気と無謀さは、どこで分かれるのでしょうか。", "礼儀正しい形と、相手を思いやる気持ちがずれることはあるでしょうか。", "昔の考えを受け継ぐとき、残したいものと変えたいものをどう見分けるでしょうか。"], "ichiaku-no-suna": ["同じ場所を思い出すとき、懐かしさとつらさが一緒に生まれることはあるでしょうか。", "いつもの音や匂いが、誰かの記憶を呼び戻すことはあるでしょうか。", "一首を三行に分けて読むと、言葉の間や感じ方はどう変わるでしょうか。"], "kanashiki-gangu": ["同じ日の中で、いらだちと親しさが行き来することはあるでしょうか。", "身近な小さな変化で、何かを始めたくなることはあるでしょうか。", "最後に犬を飼う相談をする一首から、どんな日常を感じるでしょうか。"], "ame-ni-mo-makezu": ["この詩の「負けない」強さは、どんな行動に表れているでしょうか。", "涙を流したり、おろおろしたりする姿を含めて読むと、印象は変わるでしょうか。", "人を助けたいと思うとき、相手のためにまず見聞きしたいことは何でしょうか。"], "tsuru-no-ongaeshi": ["ムサイは、妻が一人で織りたいと言ったことをどう受け止めればよかったでしょうか。", "助けてもらうことと、相手の望みを尊重することは、どうつながるでしょうか。", "母と息子が元の暮らしへ戻る結びから、何が失われたと感じるでしょうか。"], "mikan": ["少女の行動を知る前と後で、「私」の見方はどう変わったのでしょう。", "暗い景色の中に蜜柑の色が現れると、どんな印象が残りますか。", "「わずかに忘れる」という終わり方を、どのように感じますか。"], "fugaku-hyakkei": ["「私」が富士を嫌ったり、頼もしく思ったりするのは、何が変わったからでしょう。", "老女が指した小さな花は、大きな富士とどのように響き合うでしょう。", "最後の写真のいたずらを、あなたはどう受け止めますか。"], "imogayu": ["五位の食べたい気持ちは、どの場面から変わり始めたのでしょう。", "利仁たちのもてなしを、五位はなぜ断りにくかったのでしょう。", "五位が懐かしんだ以前の自分には、何があったのでしょう。"], "joseito": ["人を厳しく見る気持ちと、自分を責める気持ちは、どのようにつながっているでしょう。", "夕空や百合は、少女の気持ちをどのように変えたのでしょう。", "母との会話の後にも迷いが残る結末を、どう感じますか。"], "nogiku-no-haka": ["野菊や竜胆にたとえることで、二人はどんな思いを伝えているでしょう。", "お増の態度が変わることから、周囲の人について何が見えてくるでしょう。", "十年余り後の政夫が語る形は、この物語の読み方をどう変えるでしょう。"], "sakura-no-ki-no-shita-niwa": ["美しい景色を見ても、気持ちが明るくならないことはあるでしょうか。", "「俺」と「おまえ」では、同じ話の受け止め方がどう違って見えますか。", "最後の「花見ができそうな気持ち」は、初めの不安からどう変わったのでしょう。"], "koya-hijiri": ["宗朝は、嫌な相手だった薬売りをなぜ追いかけたのでしょう。", "女性の優しさと恐ろしさは、読み終えるとどう見えてきますか。", "同じ出来事でも、本人の語りと、別の人から聞いた説明では印象が変わるでしょうか。"], "kaze-tachinu": ["同じ夕景を見ている二人が、違う未来を考えているところが心に残るかもしれません。", "相手との生活を書くことと、目の前の相手を気にかけることは、同じとは限らないと感じるかもしれません。", "遠くまで届く小さな明かりから、「私」を支えるものを考えたくなるかもしれません。"], "nisen-doka": ["松村が確かめたことと、想像で補ったことは、どこで分かれるでしょう。", "「私」が初めから知っていたことを思い返すと、前半の行動はどう見えますか。", "頭のよさを競う二人に、別の話し方はあったでしょうか。"], "yagi-no-uta": ["明るい風景なのに、懐かしさや寂しさを感じることもあるかもしれません。", "悲しい気持ちの中にも、やさしい心が残るという表し方が心にとまるかもしれません。", "答えを言い切らずに終わる詩だからこそ、自分の気持ちを重ねられるかもしれません。"], "ushi-o-tsunaida-tsubaki-no-ki": ["よい目的に夢中になるうちに、別の人への思いやりを忘れることがあるのかもしれません。", "海蔵を助ける母の言葉や、地主の心の変化が印象に残るかもしれません。", "その人がいなくなった後にも、日々の暮らしを助ける仕事が残ることを考えるかもしれません。"], "amedama": ["母親が怖いと思った理由と、侍が実際にしたことを比べてみると、結末の驚きが見えてきます。", "一つの飴だまを二人に分けた後、侍がまた眠る終わり方に、どんな印象を受けるでしょう。"], "majutsu": ["「欲はない」という自信が変わる：「私」は最初、金貨を自分のものにする気はないと話します。それでも勝ち続ける楽しさと、金を失う怖さが重なると、約束より勝利を優先します。欲が出るまでの順番に注目すると、最後の反転の意味が分かりやすくなります。", "二つの部屋と雨の音：大森の部屋は古い家具と石油ランプのある静かな場所です。銀座のクラブには電灯や立派な椅子があり、外には車や馬車が行き交います。最後には雨の音まで大森のものに戻り、場面が変わったことを知らせます。", "葉巻の灰が示す短い時間：終わりに葉巻の灰が落ちていないことで、「私」が感じた一か月と、実際に過ぎた短い時間との違いが示されます。夢から覚めた後の成功や修業は書かれていません。"], "onnarashisa-toha-nanika": ["まず言葉の中身を確かめる：晶子は相手の結論に反対するだけでなく、「女らしさ」が歩き方の習慣なのか、思いやりなのか、母になることなのかを分け、それぞれについて理由を示します。", "機会を与える前に結果を決めない：教育や職業の自由が不十分なまま、自由を与えたら悪い結果になると決めることの矛盾が、議論の出発点です。", "時代の中の議論として読む：親になる欲求や結婚の理由については、現在そのまま全員に当てはめられない言い切りもあります。同時に本文には、結婚や親になることは義務ではなく、専門的活動に生きる人も肯定する議論があります。両方を省かず読むことが大切です。"], "inutofue": ["三匹それぞれの役目：居場所を知る白犬、そこへ運ぶ黒犬、相手を倒す斑犬の力が順番につながって救出が進みます。一匹ですべてを解決する話ではありません。", "笛は武器とは違う助け方をする：笛の音は神を楽しませ、土蜘蛛を聞きほれさせ、遠くの犬を呼び戻します。同じ道具が違う局面で働くため、侍に盗まれたときの困難も大きくなります。", "先に置かれた櫛が証拠になる：帰り道で姫たちが髪にさした櫛は、その場で髪長彦には気づかれません。最後に姫たち自身が救い主を証言し、櫛が話の裏付けになります。"], "otsugomori": ["二円と五十円の対照：お峯がどうしても必要な二円は断られます。一方、同じ日の夜に石之助には五十円が渡されます。金額の違いに加え、頼む人の立場によって対応が変わることが浮かび上がります。", "お峯が恐れるのは自分の罰だけではない：お峯は盗みの後、伯父まで共犯と疑われることを恐れます。育ててもらった恩に報いたい気持ちが、逆にその伯父を傷つけかねないところに、苦しさがあります。", "石之助の意図を決めつけない：書き置きによってお峯が調べられずに済むことは明らかです。しかし彼が意図して助けたかどうかは、語り手が可能性として問いかけるだけです。石之助を完全な善人へ変えると、この結末の余韻が失われます。"], "kyonen-no-ki": ["約束は形を変えて果たされる：木はもう枝を広げて待ってはいません。それでも小鳥は、木から作られたマッチがともした火へ歌います。相手の姿が変わっても歌を届ける行動に、約束を大切にする気持ちを読むことができます。", "尋ねるたびに、木は遠ざかる：根っこ、工場の門、女の子への問いかけが、物語を先へ進めます。答えを得るたびに行き先は分かりますが、木の元の姿は失われていきます。", "火のゆれと、語られない気持ち：火が喜んでいる「ように」見えるという結末は、木の魂が火へ移ったと断定してはいません。小鳥の気持ちも長く説明されず、歌うことと二度火を見つめることから読者が感じ取る形になっています。"], "shayo": ["同じ家で、違う方向へ進む三人：母の優しさを慕う気持ちは姉弟に共通します。しかし母の死後、かず子は未来を作ろうとし、直治はどこにも属せない苦しさを遺書に残します。強い姉と弱い弟というだけではなく、二人とも出自と生活に苦しんでいる点を読むと、対照が深まります。", "手紙と手記は、誰の言葉なのか：多くはかず子の語りですが、直治の日誌と遺書では彼自身の声が入り、上原宛の手紙ではかず子の訴えが前面に出ます。人間や女性の生き方を断言する文章も、作者や紹介者の普遍的な正解として扱わず、その場の人物の考えとして区別します。", "道徳革命の希望と危うさ：かず子は、結婚の形だけに縛られず、望む子を育てる生き方を自分の革命と呼びます。その決意は切実ですが、上原の妻子の気持ちを置き去りにしかねない面もあります。解放の成功談だけにせず、最後の依頼に残る矛盾まで読む作品です。", "蛇は原因ではなく、繰り返される像：蛇や卵は、父母の死への恐れ、かず子の罪悪感や生命への執着と結びついて現れます。母の病気が蛇の祟りで起きたという客観的な因果を示すのではなく、かず子がどう感じ、語るかを追う手がかりです。", "夕暮れから朝へ、ただし安易な大団円ではない：疲れ切った上原が黄昏を口にする一方、かず子は朝だと返します。しかし直後に直治の死が告げられます。新しい生命への決意も、現実の支えや周囲の同意が確保されたわけではなく、喪失と隣り合っています。"], "kaze-no-matasaburo": ["考えるヒント：一郎と嘉助では、三郎の見方がどう違うと思いますか。", "考えるヒント：三郎が怖がる川辺の場面から、どんなことを感じましたか。", "考えるヒント：最後に二人が顔を見合わせるとき、どんな言葉を言いたかったと思いますか。"], "kanikosen": ["集団が変わっていく物語：仕事も出身地も違う人々の経験と会話がつながり、抵抗する集団が形になります。指導者一人の英雄譚に縮めないことが大切です。", "国のため、会社のため：浅川は利益を国家の使命と結びつけます。漁夫たちが信じていた軍の役割も、ストライキへの対応によって問い直されます。", "小さな抵抗から再出発へ：最初は体を少し楽に使うサボから始まり、ストライキへ進みます。失敗の後に方法を考え直す過程と、附記の二度目の成功を合わせて読みます。", "被害を受ける側の内部にもある暴力：労働者は初めから理想的な仲間ではありません。少年への加害や互いの競争も描かれ、それを含む厳しい現実から連帯が育ちます。"], "ningen-isu": ["恐怖が自分の家へ近づく：遠いホテルの話だと思って読むうちに、椅子が役人の家、作家の書斎へ移り、佳子自身の生活と重なります。", "顔の見えない語り手：告白の男は姿を見せません。読者は手紙の言葉を頼りに人物や出来事を想像し、その信頼を最後に揺さぶられます。", "二通の手紙を区別する：一通目は告白の形、二通目は原稿への批評を求める形です。二通目は創作だったという説明ですが、椅子の検証や差出人の証明まではありません。", "一方的な執着：男が恋と呼ぶものは、相手が知らないままの接近です。容姿への劣等感を語ることと、他人の同意を無視する行為を正当化することは別です。"], "jigokuhen": ["語る人の立場：大殿を立派な人物だと繰り返す語り手の説明と、その語りが伝えてしまう残酷な行為との食い違いに注目できます。", "見るために苦しめること：良秀は見たものしか描けないといい、弟子を危険にさらします。優れた絵を作る力と、他人の苦痛への責任は別の問題です。", "父としての愛情と絵師の姿：娘を取り戻そうとする父、炎の前で苦しむ父、絵に心を奪われたように見える姿が同じ人物に描かれます。一つだけで人物を決めつけられません。", "屏風の完成だけでは終わらない：絶賛された絵の後に良秀の死が語られます。芸術の勝利だけでも、単純な教訓だけでも片づけられない結末です。"], "kusamakura": ["非人情とは何か：画家は、冷たく人を扱うのではなく、いったん利害から離れて眺めたいと考えます。しかし、那美や久一との出会いは、その距離の取り方を揺さぶります。", "那美を語るのは誰か：床屋の悪口、和尚の評価、画家の美的な判断は同じではありません。那美自身の言葉と、人が彼女に重ねる見方を分けると読みやすくなります。", "旅の中にある戦争：久一の出征と元夫の満洲行きによって、静かな温泉宿も世間から切り離されていないことが見えてきます。二人は同じ理由で行くわけではありません。", "最後にできるのは心の中の絵：結末の「完成」は構想の完成です。那美の表情の奥にある思いがすべて説明されたわけでも、画家の理解が唯一正しいと決まったわけでもありません。"], "yabunonaka": ["証言と事実を分ける：目撃したこと、他人から聞いたこと、推測したことを分けると、話の確かさが一様でないことが見えてきます。", "なぜ同じ事件が違って見えるのか：三人が自分や相手をどのように語るかに注目できます。誰が嘘をついたかを一つに決めず、誇り、苦しみ、怒りが語りにどう現れるか考えられます。", "死者の話も解答にはならない：最後の語りだから正しいとは本文に書かれていません。死霊も一人称で自分の経験を述べる立場にあります。", "被害を受けた人への見方：登場人物は真砂を責めたり、自分の行為を正当化したりします。その言葉を作品全体の正しい判断として受け取らず、暴力を受けた責任を被害者に負わせないことが大切です。"], "sanshiro": ["分からないまま、人を好きになる：三四郎は美禰子の視線や言葉を気にします。しかし、彼が感じたことがそのまま美禰子の本心とは限りません。", "三つの世界をどうつなぐか：故郷、学問、都会の暮らし。三四郎はどれにもひかれますが、すべてを一つにする方法はまだ知りません。", "親切でも、相手の考えを聞く：与次郎は広田を助けようとして騒動を起こします。本人が望んでいるかを聞かない行動は、善意だけでは済まないことを示します。", "お金も、迷いを動かす：二十円の貸し借りから、美禰子への三十円の借金、母の援助、教会前の返済へとつながります。恋の場面にも日々の生活が入り込んでいます。", "最後の言葉に答えを決めつけない：「ストレイ・シープ」は、美禰子との思い出と三四郎の迷いを結びます。美禰子を悪者と決めたり、三四郎の成長が完成したと言い切ったりせず、残った問いとして読むことができます。"], "saigo-no-ikku": ["お上を信じる形の言葉が、なぜ役人を驚かせたのか、考えるかもしれません。", "いちと幼いきょうだいたちの反応の違いが、心に残るかもしれません。", "父が助かっても追放と別れが残る結末に、複雑な思いを感じるかもしれません。"]};
function sourceCheckedDateText(x){const value=x.checkedDate;return typeof value==='string'&&value.trim()?`確認日：${esc(value)}`:'確認日の記録なし'}
function renderEvidenceComparison(x){main.innerHTML=`<button class="back" id="back">← 一覧に戻る</button><article class="article evidence-comparison"><header class="articleheader author-text-only"><div><span class="label">${esc(x.genreLabel)} / 資料をくらべて考える</span><h2 class="long-title">${titleText(x)}</h2><p class="meta">${bodyText(x,x.sub)}</p>${articleDates(x)}</div></header><div class="content"><section class="synopsis"><h3>概要</h3><p class="bodytext">${x.introPlaceLink?x.intro.split(x.introPlaceLink.text).map(t=>bodyText(x,t)).join(`<a href="${esc(x.introPlaceLink.url)}" target="_blank" rel="noopener noreferrer">${bodyText(x,x.introPlaceLink.text)} ↗</a>`):bodyText(x,x.intro)}</p>${x.placeLinksInOverview&&x.placeLinks?`<p class="place-links">${x.placeLinks.map(z=>`<a href="${esc(z.url)}" target="_blank" rel="noopener noreferrer">${bodyText(x,z.label)} ↗</a>`).join(' ／ ')}</p>`:''}<p class="subnote">${bodyText(x,x.researchScope)}</p></section><section class="gist"><h3>要点</h3><p class="bodytext">${bodyText(x,x.gist)}</p></section><section class="digest"><h3>${esc(x.summaryHeading)}</h3>${x.sections.map((b,i)=>`<section class="background-item"><h4>${bodyText(x,b.title)}</h4><p class="bodytext">${bodyText(x,b.text)}</p>${i===0&&x.placeLinks&&!x.placeLinksInOverview?`<p class="place-links">${x.placeLinks.map(z=>`<a href="${esc(z.url)}" target="_blank" rel="noopener noreferrer">${bodyText(x,z.label)} ↗</a>`).join(' ／ ')}</p>`:''}${x.diagrams.filter(d=>d.afterSection===i+1).map(d=>`<figure class="inline-illustration">${d.hideSourceFooter?`<div class="medical-drone-footer-window"><img src="${esc(d.src)}" alt="${esc(d.alt)}" width="${d.width}" height="${d.height}" loading="lazy" decoding="async"></div>`:`<img src="${esc(d.src)}" alt="${esc(d.alt)}" width="${d.width}" height="${d.height}" loading="lazy" decoding="async">`}<figcaption>${bodyText(x,d.caption)}</figcaption></figure>`).join('')}${x.sourcesAtEndOnly?'':`<p class="background-sources">出典：${b.sources.map(z=>`<a href="${esc(z.url)}" target="_blank" rel="noopener noreferrer">${esc(z.title)} ↗</a>`).join(' ／ ')}</p>`}</section>`).join('')}</section><section><h3>資料と確認範囲</h3><p class="subnote">${bodyText(x,x.medicalNote)}</p>${x.diagramSourceNote?`<p class="subnote">${bodyText(x,x.diagramSourceNote)}</p>`:''}<ul class="sources">${x.sources.map(z=>`<li><a href="${esc(z.url)}" target="_blank" rel="noopener noreferrer">${esc(z.title)} ↗</a><p>${bodyText(x,z.sourceType)}</p><p>${bodyText(x,z.readScope)}</p><p>${bodyText(x,z.limitations)}</p></li>`).join('')}</ul><p class="subnote">${sourceCheckedDateText(x)}。図は説明用の創作イラストです。</p></section></div></article>`;document.getElementById('back').onclick=()=>{location.hash=lastListHash}}

function personArticleSources(x){

 if(!currentThemeShelves().some(t=>t.id===selectedTheme))selectedTheme='';
 const h=listHash();
 if(location.hash!==h)history.pushState(null,'',h);
 showList(true);
 search.focus();
 searchFocusAfterSync=true;
}
function reset(){category='all';query='';selectedTheme='';showListAndFocusSearch()}
search.addEventListener('input',()=>{query=search.value;const inArticle=location.hash.startsWith('#/article/')||location.hash==='#/about';if(inArticle)history.pushState(null,'',listHash());showList(true)});
document.getElementById('clear').addEventListener('click',()=>{query='';showListAndFocusSearch()});
document.querySelectorAll('[data-cat]').forEach(b=>b.addEventListener('click',()=>{category=b.dataset.cat;showList()}));
document.querySelector('.skip').addEventListener('click',e=>{e.preventDefault();main.focus({preventScroll:true});main.scrollIntoView({behavior:'auto',block:'start'})});
window.addEventListener('popstate',()=>{searchFocusAfterSync=false});
window.addEventListener('hashchange',event=>{
 if(searchFocusAfterSync)return;
 const newURL=event&&event.newURL;
 const newHash=newURL&&newURL.includes('#')?newURL.slice(newURL.indexOf('#')+1):'';
 if(newURL&&(newHash?'#'+newHash:'')!==location.hash)return;
 route({focus:true});
});route();
</script>

<button class="page-scroll-button" id="page-scroll-top" type="button" aria-label="ページの一番上へ戻る" title="ページの一番上へ戻る"><span class="page-scroll-icon" aria-hidden="true">↑</span><span class="page-scroll-label">最上部</span></button>
<button class="page-scroll-button" id="page-scroll-bottom" type="button" aria-label="ページの一番下へ移動" title="ページの一番下へ移動"><span class="page-scroll-icon" aria-hidden="true">↓</span><span class="page-scroll-label">最下部</span></button>
</div>
<script id="page-scroll-script">
(function(){
'use strict';

// page-scroll-pair-v2: read the current page height on every press.
function scrollToPageEdge(edge){
 const page=document.scrollingElement||document.documentElement;
 const bottom=Math.max(0,page.scrollHeight-page.clientHeight);
 const reducedMotion=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
 window.scrollTo({top:edge==='bottom'?bottom:0,left:window.scrollX,behavior:reducedMotion?'auto':'smooth'});
}
document.getElementById('page-scroll-top').addEventListener('click',()=>scrollToPageEdge('top'));
document.getElementById('page-scroll-bottom').addEventListener('click',()=>scrollToPageEdge('bottom'));
})();
</script>
