s": [{"title": "新渡戸稲造 Bushido: The Soul of Japan（1908年第13版英語原著）", "url": "https://www.gutenberg.org/files/12096/12096-h/12096-h.htm"}, {"title": "Project Gutenberg：採用原著の書誌・権利表示", "url": "https://www.gutenberg.org/ebooks/12096"}, {"title": "盛岡市先人記念館：武士道初版本（1900年1月刊）", "url": "https://www.mfca.jp/senjin/nitobe/shiryou"}], "sourceNote": "改訂増補された英語原著第13版（1908年3月25日、丁未出版社）の全17章と両序文を参照した、図鑑独自の日本語解説です。初刊は1900年1月。採用版には1905年第10版の改訂序文があり、初版との全文対校は行っていません。現代の日本語訳を転載・言い換えしたものではありません。", "termNote": "「倫理」は人がどう生き、行動するかについての考え。「忠義」は仕える相手への誠実さや責任、「徳目」は望ましい性質や行動を表す項目です。本文には切腹や仇討ちなどの歴史的な習慣の議論がありますが、ここでは方法を説明していません。著者の歴史解釈・宗教観・身分観と、現在の事実認識や価値判断を区別しています。", "checkedDate": "2026年11月3日", "cat": "literature", "primaryCategory": "japanese-literature", "genreLabel": "日本の思想・評論", "genre": "japanese-nonfiction", "motif": "book", "sub": "新渡戸稲造｜1900年初刊・1908年改訂増補版を参照", "people": [["新渡戸稲造", "本書の著者。武士の倫理を、自分の解釈と外国の思想との比較を通して英語で説明する。"]], "synopsisSummary": ["『武士道』は、新渡戸稲造が海外の読者へ向けて英語で書いた、日本の道徳についての本です。小説ではなく、武士が大切にしたと著者が考える価値を、外国の思想や文学と比べながら説明します。最初に、武士道は一人の人が作った法律ではなく、武士の生活の中で育った、書かれていない教えだと位置づけます。仏教、神道、儒教などから受けた影響を挙げ、知識を持つだけでなく行動に表すことを重視します。", "続いて、正しいことを判断して行う「義」と、そのために必要な勇気を論じます。ただ危険に飛び込むことが勇気なのではありません。力を持つ人には、弱い立場の人を思いやる責任もあると説きます。そこで、強さと優しさを対立させず、詩や音楽によって柔らかな感情を育てる例も取り上げます。戦いに強いことだけでは、著者が描く理想の人には足りないのです。", "礼儀の章では、決まった動作を間違えずに行うだけでなく、相手の気持ちを思うことが大切だと説明します。茶の湯も、静かな場所で心を落ち着け、人と向き合うための営みとして紹介されます。しかし、丁寧な言葉でも、心に誠実さがなければ形だけです。言葉と行動を一致させ、約束を大切にすることへと議論が進みます。", "名誉や忠義にも、行き過ぎの危険があります。評判を傷つけられたと思うたびに争えば、名誉を大切にする気持ちが人を害してしまいます。また、主人に仕えることは、自分の良心を捨てて何でも従うことではないと新渡戸は述べます。主人が間違っているときは意見を伝える必要もあるのです。教育では人格を育てること、感情の扱いでは人への配慮を説く一方、感情を抑えすぎる害も認めています。", "本はさらに、当時の読者には理解しにくい切腹や仇討ち、刀の意味を説明します。新渡戸はそれらを名誉や責任に結びつけて論じますが、命を失う行為が過度にほめられた弊害や、刀の乱用にも触れています。女性の教育については、その強さや働きを評価しつつ、家庭や夫への奉仕を中心に考えています。ここには著者の時代の身分観や男女観があり、現在の読者がそのまま従うための説明ではありません。", "終盤では、武士の物語や振る舞いが、ほかの身分の人々にも影響したと主張します。新渡戸は、日本の近代化にも武士道の力が働いたと考えますが、名誉を気にしすぎることなどの欠点も挙げます。また、勇気や誠実さが日本人だけの性質だとはしません。外国の例と比べてきたこと自体が、国を越えて共通する価値があることを示しているのです。", "最後に、社会の仕組みが変われば、武士の身分を支えた道徳の仕組みも、そのままでは残れないと考えます。それでも、勇気や思いやりなどは、武士以外の暮らしにも受け継げると新渡戸は述べます。自身のキリスト教信仰とも結びつけ、戦うことを中心にした生き方より広い、人を愛する道を見ようとします。本を結ぶのは、散った桜の花の香りが残るように、制度が消えてもよい影響は残るというたとえです。"], "summaryHeading": "論旨をたどる要約", "links": ["nitobe-inazo"], "inlineIllustrations": [{"afterParagraph": 1, "src": "assets/bushido-comparing-ideas-scene.webp", "alt": "日本と外国の考えを比べて説明する本です。異なる本を開く、匿名の読み手による説明イメージ。", "caption": "日本と外国の考えを比べて説明する本です。異なる本を開く、匿名の読み手による説明イメージ。", "width": 1200, "height": 800}, {"afterParagraph": 3, "src": "assets/bushido-tea-consideration-scene.webp", "alt": "形だけでなく、心を落ち着けて相手に向き合う。礼儀の章の茶の湯をもとにした説明イメージです。", "caption": "形だけでなく、心を落ち着けて相手に向き合う。礼儀の章の茶の湯をもとにした説明イメージです。", "width": 1200, "height": 800}, {"afterParagraph": 7, "src": "assets/bushido-cherry-after-bloom-scene.webp", "alt": "仕組みが変わっても、よい影響は残る。結びの「散った桜の香り」というたとえを表す説明イメージです。", "caption": "仕組みが変わっても、よい影響は残る。結びの「散った桜の香り」というたとえを表す説明イメージです。", "width": 1200, "height": 800}], "characterGalleryNote": "挿絵は本文の議論やたとえを伝える説明イメージです。描かれた人は新渡戸稲造ではなく、場所・服・道具の細部も創作です。", "contentType": "nonfiction-guide", "peopleHeading": "著者", "introHeading": "この本について", "introBadge": "論旨の入口", "interpretationNote": "採用原典の議論を踏まえた読み方の一例です。", "credits": [["新渡戸稲造", "にとべいなぞう", "英語原著の著者"]], "image": "assets/bushido-comparing-ideas-scene.webp", "imageAlt": "日本と外国の考えを比べて説明する本です。異なる本を開く、匿名の読み手による説明イメージ。", "headerCaption": "日本と外国の考えを比べて説明する本です。異なる本を開く、匿名の読み手による説明イメージ。"}, {"id": "nitobe-inazo", "name": "新渡戸稲造", "reading": "にとべいなぞう", "cat": "person", "sub": "1862–1933｜日本の教育者・著述家", "motif": "book", "intro": "英語で『武士道』を書き、日本の考え方を海外へ伝えようとした教育者。農学を学び、学校の教育や国際連盟の仕事にも取り組みました。", "gist": "日本と外国を行き来し、学びと対話を重ねた『武士道』の著者。", "people": [], "theme": "", "memory": "", "links": ["bushido"], "sources": [{"title": "国立国会図書館：新渡戸稲造", "url": "https://www.ndl.go.jp/portrait/datas/311/"}, {"title": "北海道大学新渡戸カレッジ：新渡戸稲造", "url": "https://nitobe-college.academic.hokudai.ac.jp/about-nitobe-college/inazo-nitobe"}, {"title": "新渡戸文化学園：新渡戸稲造年表", "url": "https://nitobebunka.ac.jp/nitobe/history/"}, {"title": "盛岡市先人記念館：新渡戸稲造に関する展示資料", "url": "https://www.mfca.jp/senjin/nitobe/shiryou"}, {"title": "東京女子大学：創立期の人々", "url": "https://www.twcu.ac.jp/main/about/history/founder.html"}, {"title": "新渡戸稲造 Bushido: The Soul of Japan（1908年第13版英語原著）", "url": "https://www.gutenberg.org/files/12096/12096-h/12096-h.htm"}], "bodyReadings": {"新渡戸稲造": "にとべいなぞう", "盛岡": "もりおか", "南部藩": "なんぶはん", "札幌農学校": "さっぽろのうがっこう", "内村鑑三": "うちむらかんぞう", "宮部金吾": "みやべきんご", "農学": "のうがく", "武士道": "ぶしどう", "倫理": "りんり", "遠友夜学校": "えんゆうやがっこう", "第一高等学校": "だいいちこうとうがっこう", "国際連盟": "こくさいれんめい", "事務次長": "じむじちょう", "調停": "ちょうてい"}, "checkedDate": "2026年11月3日", "primaryCategory": "person", "genreLabel": "人物", "sourceNote": "生涯は国立国会図書館、大学・学園、盛岡市先人記念館の資料を参照しています。『武士道』は英語原著で、現代の日本語訳とは区別しています。最後の節は図鑑独自の読書案内です。", "authorTextOnly": true, "portraitNote": "この紹介には本人の肖像は掲載していません。", "longTitle": true}, {"id": "ichiaku-no-suna", "name": "一握の砂", "reading": "いちあくのすな", "intro": "働く手、故郷の言葉、窓の光、ふと思い出す人の声。石川啄木が、暮らしの中で揺れる気持ちを三行の短歌に表した歌集です。有名な歌だけでなく、五つの章に集められた寂しさや喜び、矛盾する思いをたどります。", "gist": "何気ない暮らしや記憶の中に、ひとことでは言えない心の揺れを見つける。", "bodyReadings": {"一握の砂": "いちあくのすな", "石川啄木": "いしかわたくぼく", "短歌": "たんか", "歌集": "かしゅう", "一首": "いっしゅ", "三行": "さんぎょう", "自序": "じじょ", "我を愛する歌": "われをあいするうた", "煙": "けむり", "訛": "なまり", "秋風のこころよさに": "あきかぜのこころよさに", "忘れがたき人人": "わすれがたきひとびと", "函館": "はこだて", "札幌": "さっぽろ", "小樽": "おたる", "釧路": "くしろ", "手套を脱ぐ時": "てぶくろをぬぐとき", "献辞": "けんじ", "亡児": "ぼうじ", "真一": "しんいち", "巻末": "かんまつ", "伝記": "でんき", "東雲堂書店": "とううんどうしょてん"}, "sources": [{"title": "青空文庫：一握の砂（新字旧仮名、五章551首）", "url": "https://www.aozora.gr.jp/cards/000153/files/816_15786.html"}, {"title": "青空文庫：一握の砂 図書カードNo.816（初刊・採用底本・著者）", "url": "https://www.aozora.gr.jp/cards/000153/card816.html"}], "sourceNote": "青空文庫No.816の日本語原著、献辞・自序と五章551首を参照した図鑑独自の読書案内です。底本は集英社『日本文学全集12 国木田独歩・石川啄木集』（1967年刊、入力に用いた本は1972年第9版）、親本は1910年12月1日刊『一握の砂』です。献辞と自序は筑摩書房『啄木全集 第一巻』（1970年第4刷）から補われています。現代語訳や底本巻末の注解は使用していません。", "termNote": "「短歌」は五・七・五・七・七の音の形を基本とする詩。この本では一首を三行に分けて書いています。「手套」は手袋、「訛」は地域の言葉の発音などの特徴、「献辞」は本を人にささげる言葉です。歌には苦悩、死や暴力への言及もありますが、この案内では具体的な方法や残酷な場面を説明していません。章の順番を作者の生涯の順番とはせず、実在人物の特定も原文から確認できる範囲にとどめています。", "checkedDate": "2026年11月3日", "cat": "literature", "primaryCategory": "japanese-literature", "genreLabel": "日本文学・歌集", "genre": "japanese-poetry", "motif": "book", "sub": "石川啄木｜1910年刊行", "people": [["石川啄木", "本書の著者。暮らしや記憶を短歌にした。歌に現れる語りを、そのまま全て伝記事実とはしない。"]], "synopsisSummary": ["『一握の砂』は、石川啄木が1910年に刊行した、551首の短歌を収める歌集です。一首を三行に分けて書き、日々の暮らしや記憶の中の、言い切りにくい気持ちを表します。自序によれば、1908年の夏以後に作った千首余りから選び、気持ちの生まれたところが近い歌を五つの章に分けています。以下は各章を代表する題材から全体をたどる案内で、一つの物語のあらすじや、全首の個別解説ではありません。", "最初の「我を愛する歌」は、海辺の砂や涙の歌から始まります。自分を大切に思う気持ちだけでなく、いらだち、見栄、人をうらやむ心も隠しません。たとえば、働き続けても暮らしが楽にならず、じっと自分の手を見る歌があります。一方で、仕事をやり終えた心地よい疲れや、外へ出たときの日光の温かさも歌われます。同じ人の心に、苦しさと小さな安らぎが行き来しているのです。", "次の「煙」では、学校時代の友や教師、故郷の人々を思い出します。駅の人ごみへ、故郷の訛を聞きに行く歌には、離れた土地への思いが声を通して表れます。しかし、故郷は懐かしいだけの場所ではありません。追われるように去ったつらさや、帰っても昔と変わってしまった道や橋への戸惑いもあります。人や場所が変わることと、自分の記憶に残り続けることの両方を見つめる章です。", "「秋風のこころよさに」では、風、雨、空、虫の音などが、心の動きと重なります。秋が来て思いが洗われるように感じる歌も、空の広さが寂しさを強める歌もあります。雨に濡れていく庭を見て、涙を忘れるひとときもあります。題名の通りに心地よい秋だけを集めたのではなく、自然の同じ季節の中に、恋しさ、悲しみ、静けさなど違う感情が現れます。", "「忘れがたき人人」には、函館、札幌、小樽、釧路などの土地と、そこで出会った人々の記憶が重なります。家族や友人、心ひかれた相手が、声や顔、仕草とともによみがえります。助けてくれた友に背いたことを振り返る歌も、憎み合った友と別れに長く手を握る歌もあります。旅の景色をきれいに並べるだけでなく、人を恋しく思いながら傷つけもした、自分自身の複雑さを見せています。", "最後の章「手套を脱ぐ時」は、手袋を外す動作の途中で、ふと記憶が心をよぎる歌から始まります。本を買って読む夜、古い帽子、窓の光、仕事場の電話の音など、普段なら通り過ぎるようなものが気持ちを呼び起こします。ものの匂いや手触りまでが、寂しさにも、懐かしさや喜びにもつながります。大きな出来事でなくても、暮らしの一瞬が歌になることを感じられる章です。", "巻末には、幼い子を亡くした悲しみを表す歌が続きます。冒頭の献辞でも亡児の真一に一冊をささげており、本の入口と結びが響き合います。ただ、最後に問題が解決したり、一つの教訓が示されたりするわけではありません。深く悲しみながら、その悲しみさえ思うようには感じられない戸惑いも残ります。五つの章を通して読むと、人の心は一つの言葉では片づけられないことが伝わってきます。"], "summaryHeading": "五つの章をたどる読書案内", "links": ["ishikawa-takuboku"], "inlineIllustrations": [{"afterParagraph": 2, "src": "assets/ichiaku-looking-at-hands-scene.webp", "alt": "働いても暮らしが楽にならず、自分の手を見る。「我を愛する歌」の一首をもとにした情景です。", "caption": "働いても暮らしが楽にならず、自分の手を見る。「我を愛する歌」の一首をもとにした情景です。", "width": 1200, "height": 800}, {"afterParagraph": 3, "src": "assets/ichiaku-hometown-voices-station-scene.webp", "alt": "故郷の訛を聞きに、人の集まる駅へ行く。「煙」の一首をもとにした情景です。", "caption": "故郷の訛を聞きに、人の集まる駅へ行く。「煙」の一首をもとにした情景です。", "width": 1200, "height": 800}, {"afterParagraph": 6, "src": "assets/ichiaku-glove-memory-scene.webp", "alt": "手袋を外す途中、ふと記憶が心をよぎる。「手套を脱ぐ時」の最初の一首をもとにした情景です。", "caption": "手袋を外す途中、ふと記憶が心をよぎる。「手套を脱ぐ時」の最初の一首をもとにした情景です。", "width": 1200, "height": 800}], "characterGalleryNote": "挿絵は、歌に現れる情景から作ったイメージです。作者本人の容貌や実際の場所を再現したものではありません。人数、服、建物の細部は創作です。", "contentType": "poetry-guide", "peopleHeading": "著者", "introHeading": "この本について", "introBadge": "歌集の入口", "interpretationNote": "採用原典を踏まえた読み方の一例です。", "credits": [["石川啄木", "いしかわたくぼく", "著者"]], "image": "assets/ichiaku-looking-at-hands-scene.webp", "imageAlt": "働いても暮らしが楽にならず、自分の手を見る。「我を愛する歌」の一首をもとにした情景です。", "headerCaption": "働いても暮らしが楽にならず、自分の手を見る。「我を愛する歌」の一首をもとにした情景です。"}, {"id": "ishikawa-takuboku", "name": "石川啄木", "reading": "いしかわたくぼく", "cat": "person", "sub": "1886–1912｜日本の歌人・詩人", "motif": "book", "intro": "故郷への思いや暮らしの中の感情を、短い歌に表した歌人。教員や新聞の仕事をしながら詩や小説も書き、『一握の砂』を残しました。", "gist": "暮らしの実感と心の揺れを、短歌や詩に残した人。", "people": [], "theme": "", "memory": "", "links": ["ichiaku-no-suna", "kanashiki-gangu"], "sources": [{"title": "国立国会図書館：石川啄木", "url": "https://www.ndl.go.jp/portrait/datas/6251/index.html"}, {"title": "石川啄木記念館：「啄木と鉄道」年譜", "url": "https://www.mfca.jp/takuboku/wp-content/uploads/sites/9/2021/12/e968cadd6af5706d1b809452fcc30cd2-1.pdf"}, {"title": "北海道・赤れんが庁舎展示ガイド：石川啄木", "url": "https://akarenga-exhibitionguide.pref.hokkaido.lg.jp/archives/predecessors/49/"}, {"title": "青空文庫：一握の砂（新字旧仮名、五章551首）", "url": "https://www.aozora.gr.jp/cards/000153/files/816_15786.html"}, {"title": "岩手県立図書館：結婚と小天地", "url": "https://www.library.pref.iwate.jp/ex/taku34/takuboku/shougai01.html"}, {"title": "悲しき玩具：採用原著", "url": "https://www.aozora.gr.jp/cards/000153/files/815_20544.html"}, {"title": "石川啄木記念館：施設・アクセス", "url": "https://www.mfca.jp/takuboku/access"}], "bodyReadings": {"石川啄木": "いしかわたくぼく", "石川一": "いしかわはじめ", "日戸": "ひのと", "盛岡": "もりおか", "渋民": "しぶたみ", "明星": "みょうじょう", "与謝野鉄幹": "よさのてっかん", "節子": "せつこ", "函館": "はこだて", "小樽": "おたる", "釧路": "くしろ", "金田一京助": "きんだいちきょうすけ", "校正": "こうせい", "一握の砂": "いちあくのすな", "悲しき玩具": "かなしきがんぐ", "歌集": "かしゅう", "短歌": "たんか", "常光寺": "じょうこうじ", "宝徳寺": "ほうとくじ", "尋常": "じんじょう", "小天地": "しょうてんち", "宮崎郁雨": "みやざきいくう", "真一": "しんいち", "大逆事件": "たいぎゃくじけん", "野村胡堂": "のむらこどう", "晶子": "あきこ", "岩手": "いわて", "東北": "とうほく", "札幌": "さっぽろ", "移築": "いちく"}, "checkedDate": "2026年11月3日", "primaryCategory": "person", "genreLabel": "人物", "sourceNote": "生涯と刊行の年は、国立国会図書館、石川啄木記念館、岩手県立図書館、北海道の資料を参照しています。詩集と歌集、存命中と没後の刊行を区別しています。最後の節は図鑑独自の読書案内です。", "authorTextOnly": true, "portraitNote": "この紹介には本人の肖像は掲載していません。", "longTitle": true, "placeGuide": {"title": "岩手・盛岡から、生涯の場所をたどる", "orientation": ["日本", "東北地方", "岩手県", "盛岡市"], "note": "出生地・育った場所・学校・仕事の場所を分けて見ると、故郷の歌と移動の多い生涯がつながります。", "places": [{"label": "生まれた場所", "name": "日戸村の常光寺", "note": "現在の盛岡市日戸。翌年、家族で渋民へ移りました。"}, {"label": "育った場所", "name": "渋民村の宝徳寺", "note": "現在の盛岡市渋民。日戸の出生地とは別の場所です。"}, {"label": "学んだ学校", "name": "盛岡尋常中学校", "note": "のちの盛岡中学校、現在の盛岡第一高校につながる学校です。現在の校地を当時の通学先と同じとはしていません。"}, {"label": "仕事を求めた町", "name": "渋民 → 函館・札幌・小樽・釧路 → 東京", "note": "教員や新聞の仕事をしながら、文学を続ける道を探しました。"}], "museum": {"name": "石川啄木記念館・盛岡市玉山歴史民俗資料館", "address": "岩手県盛岡市渋民字渋民9", "url": "https://www.mfca.jp/takuboku/", "mapUrl": "https://www.google.com/maps/search/?api=1&query=%E7%9F%B3%E5%B7%9D%E5%95%84%E6%9C%A8%E8%A8%98%E5%BF%B5%E9%A4%A8%20%E5%B2%A9%E6%89%8B%E7%9C%8C%E7%9B%9B%E5%B2%A1%E5%B8%82%E6%B8%8B%E6%B0%91%E5%AD%97%E6%B8%8B%E6%B0%919", "note": "地図リンクは現在の記念館の位置です。啄木の出生地ではありません。敷地内の旧学校などは移築された建物です。"}}}, {"id": "kanashiki-gangu", "name": "悲しき玩具", "reading": "かなしきがんぐ", "intro": "寂しさ、いらだち、家族の声、花を見て書きたくなる朝。石川啄木の第二歌集には、病や生活の重さの中でも動き続ける心が歌われています。194首の中の代表的な題材をたどる読書案内です。", "gist": "苦しい日々にも、家族や身近なものへ動く心を見つめる。", "bodyReadings": {"悲しき玩具": "かなしきがんぐ", "一握の砂": "いちあくのすな", "石川啄木": "いしかわたくぼく", "歌集": "かしゅう", "短歌": "たんか", "一首": "いっしゅ", "三行": "さんぎょう", "玩具": "おもちゃ", "機関車": "きかんしゃ", "湯気": "ゆげ", "主筆": "しゅひつ", "回復": "かいふく", "故郷": "ふるさと", "縁先": "えんさき", "枕元": "まくらもと", "没後": "ぼつご", "東雲堂書店": "とううんどうしょてん"}, "sources": [{"title": "青空文庫：悲しき玩具 ―一握の砂以後―（歌本文194首）", "url": "https://www.aozora.gr.jp/cards/000153/files/815_20544.html"}, {"title": "青空文庫：図書カードNo.815（初刊・底本・著者）", "url": "https://www.aozora.gr.jp/cards/000153/card815.html"}, {"title": "新潮社：石川啄木の著者紹介（友人らの尽力による没後出版）", "url": "https://www.shinchosha.co.jp/book/109303/"}], "sourceNote": "青空文庫No.815の日本語原著の歌本文194首を全篇参照した、図鑑独自の読書案内です。底本は集英社『日本文学全集12 国木田独歩・石川啄木集』（1967年刊、入力本は1972年第9版）、親本は1912年6月20日刊『悲しき玩具』です。初版本全冊の付録評論や跋を通読した案内ではありません。現代語訳や全集の注解は使用していません。", "termNote": "「歌集」は短歌をまとめた本。「主筆」は新聞などの論説や編集の中心となる人です。歌の順番をそのまま作者の生涯の時系列とはせず、実在人物の特定もここでは行っていません。", "checkedDate": "2026年11月3日", "cat": "literature", "primaryCategory": "japanese-literature", "genreLabel": "日本文学・歌集", "genre": "japanese-poetry", "motif": "book", "sub": "石川啄木｜1912年没後刊行", "people": [["石川啄木", "本書の著者。日々の生活や病の中での心の動きを短歌にした。歌の語りをすべてそのまま伝記事実とはしない。"]], "synopsisSummary": ["『悲しき玩具』は、石川啄木が亡くなった後の1912年6月に刊行された第二歌集です。この案内は、採用した青空文庫本文の194首をたどります。前の『一握の砂』と同じく、一首を三行に分けて書いていますが、五つの章を順に読む構成ではありません。暮らしの疲れ、家族への思い、病院での日々などが、短い言葉の間に現れます。", "冒頭には、自分の呼吸の音を寂しく聞き、目を閉じても何も心に浮かばないという歌が並びます。しかし、暗い気持ちだけが続くわけではありません。冬の朝、お湯の湯気が顔に触れる懐かしさや、少し気持ちが明るい朝もあります。遊びに出た子供が帰らない間、その子の玩具の機関車を取り出して走らせる歌もあり、大人の何気ない動作に目がとまります。", "年が改まると、よいことがありそうだと思う一方、同じ生活へ戻っていく気分も表れます。仕事では帰宅の時間を待ち、人の考えがつかめず、おとなしく一日を過ごします。お金を借りに行くつらさも、自分が新聞の主筆なら何をするかという思いもあります。暮らしに疲れていても、仕事や社会への関心が消えたわけではないのです。", "中ほどからは、病院の廊下、医者や看護する人とのやり取り、病みながら過ごす時間が多くなります。元気になりたい思いと、回復を願わない自分への戸惑いまで歌われます。故郷の鳥の声を夢で聞き、昔の林や寺を思い出す歌もあります。これらを一つの病状説明として読むより、そのときどきの心が反対方向へも動くところに目を向けられます。", "家族は、心を支えるだけの存在としては描かれません。妻に言葉をかけ、子を叱り、成長する子を見て寂しくなるなど、近い相手だからこその思いが交わります。子供がそばへ来て座ることや、母に叱られることが心に残る歌もあります。愛情といらだちが同じ暮らしの中にあり、その矛盾をきれいに取り繕ってはいません。", "そんな日々にも、書くことへ心が向く瞬間があります。花瓶の花が新しい朝、何か書いてみたくなってペンを取る歌です。苦しさがすべて解消したから書くのではなく、目の前の小さな変化が動作を生みます。後ろの方には、友から届く送金や、昼寝する子の枕元へ人形を置くことも歌われ、他人とのつながりが一つの気持ちだけでは語れないことが見えてきます。", "最後の二首では、縁先に枕を出して久しぶりに夕空を眺め、庭の外を通る白い犬を見て妻に犬を飼おうかと相談します。ここに作者の死を描く場面や、病気が治ったという結末はありません。苦しみを抱えた生活の中でも、空や動物、人への関心は動いています。全体をたどると、悲しみと日常の小さな明るさを、一つに決めずに読むことができます。"], "summaryHeading": "歌の流れをたどる読書案内", "links": ["ishikawa-takuboku", "ichiaku-no-suna"], "inlineIllustrations": [{"afterParagraph": 2, "src": "assets/kanashiki-toy-train-scene.webp", "alt": "子供が遊びから帰らない間、玩具の機関車を走らせる。冒頭近くの一首をもとにした情景です。", "caption": "子供が遊びから帰らない間、玩具の機関車を走らせる。冒頭近くの一首をもとにした情景です。", "width": 1200, "height": 800}, {"afterParagraph": 6, "src": "assets/kanashiki-fresh-flowers-writing-scene.webp", "alt": "新しい花のある朝、何か書きたくなってペンを取る。一首の情景を表しています。", "caption": "新しい花のある朝、何か書きたくなってペンを取る。一首の情景を表しています。", "width": 1200, "height": 800}, {"afterParagraph": 7, "src": "assets/kanashiki-white-dog-conversation-scene.webp", "alt": "庭の外を通る白い犬を見て、妻に飼おうかと相談する。歌集の最後の一首です。", "caption": "庭の外を通る白い犬を見て、妻に飼おうかと相談する。歌集の最後の一首です。", "width": 1200, "height": 800}], "characterGalleryNote": "挿絵は、それぞれ別の歌の情景から作ったイメージです。作者本人や実在の家族、当時の場所を再現したものではありません。服装や室内の細部は創作です。", "contentType": "poetry-guide", "peopleHeading": "著者", "introHeading": "この本について", "introBadge": "歌集の入口", "interpretationNote": "採用原典を踏まえた読み方の一例です。", "credits": [["石川啄木", "いしかわたくぼく", "著者"]], "image": "assets/kanashiki-toy-train-scene.webp", "imageAlt": "子供が遊びから帰らない間、玩具の機関車を走らせる。冒頭近くの一首をもとにした情景です。", "headerCaption": "子供が遊びから帰らない間、玩具の機関車を走らせる。冒頭近くの一首をもとにした情景です。"}, {"id": "ame-ni-mo-makezu", "name": "雨ニモマケズ", "reading": "あめにもまけず", "intro": "雨や風に負けず、困っている人のところへ出向きたい。強さだけでなく、涙や戸惑いも含みながら、自分がなりたい姿を描いた短い言葉です。手帳に残された願いを、順にたどります。", "gist": "困っている人に心を向ける、そんな自分になりたいという願いを読む。", "bodyReadings": {"雨ニモマケズ": "あめにもまけず", "宮沢賢治": "みやざわけんじ", "玄米": "げんまい", "味噌": "みそ", "稲": "いね", "訴訟": "そしょう", "質素": "しっそ", "菩薩": "ぼさつ", "法華経": "ほけきょう", "題目": "だいもく", "没後": "ぼつご", "手帳": "てちょう", "犠牲": "ぎせい"}, "sources": [{"title": "青空文庫：〔雨ニモマケズ〕（採用した日本語原著本文）", "url": "https://www.aozora.gr.jp/cards/000081/files/45630_23908.html"}, {"title": "青空文庫：図書カードNo.45630（著者・底本）", "url": "https://www.aozora.gr.jp/cards/000081/card45630.html"}, {"title": "岩手県立図書館：手帳の名称と初めての活字掲載について（レファレンス協同データベース）", "url": "https://crd.ndl.go.jp/reference/entry/index.php?id=1000110276&page=ref_view"}, {"title": "新潟市美術館研究紀要：高村光太郎と宮沢賢治に関する論考（手帳の記録時期、詩碑の節）", "url": "https://www.ncam.jp/wp-content/uploads/ncam_nam_blltn_02_01_matsuzawa.pdf"}], "sourceNote": "青空文庫No.45630の新字旧仮名本文を、末尾の仏・菩薩名などを含め全篇参照した独自の案内です。底本は筑摩書房『【新】校本宮澤賢治全集 第十三巻（上）覚書・手帳 本文篇』（1997年）。青空の注記では、本文は写真版を含むこの本に、改行などは第六巻（1996年）にもよっています。1931年の手帳記録と1934年の没後公表、1997年の採用底本は別の時点です。手帳原物や全集紙面の全体を調査したものではありません。", "termNote": "採用本文は「ヒドリ」と記しています。「ヒデリ」とする本文も知られますが、この案内で勝手に置き換えたり、一つの意味に断定したりはしません。「デクノボー」は、人を役に立たない者のように扱う呼び方で、図鑑が誰かをそう評価する言葉ではありません。「訴訟」は裁判で争うこと。本文の食事量は、現代の食生活への推奨ではありません。", "checkedDate": "2026年11月3日", "cat": "literature", "primaryCategory": "japanese-literature", "genreLabel": "日本文学・詩", "genre": "japanese-poetry", "motif": "book", "sub": "宮沢賢治｜1931年の手帳記録・1934年公表", "people": [["宮沢賢治", "本書の著者。手帳に残した願いを、そのまま実際に行った出来事の記録とはしない。"]], "synopsisSummary": ["『雨ニモマケズ』は、宮沢賢治の手帳に残された言葉です。雨、風、雪、夏の暑さに負けない体を願うところから始まります。続くのは、欲張らず、怒らず、静かに笑っていたいという姿です。これは、作者がすでに完成させた生き方の報告ではありません。最後に示される、自分もそうなりたいという願いへ向かう文章です。", "食べるものや住まいも、身近で具体的です。玄米、味噌、少しの野菜を食べ、松林のそばの小さな草ぶきの小屋で暮らす姿が描かれます。そして、自分の損得ばかりを考えず、よく見聞きして理解し、忘れないことが望まれます。生活の質素さと、周りのことに注意を向ける姿勢が並んでいます。", "東に病気の子供がいれば看病し、西に疲れた母がいれば稲の束を背負う。南では死を恐れる人へ声をかけ、北では争いや訴訟をやめるように言います。東西南北への繰り返しによって、困っている相手の方へ出向く動きが見えてきます。強さは、ただ一人で耐えることだけではなく、相手に応じて行動する姿として描かれています。", "しかし、何でも解決できる強い人が描かれるわけではありません。涙を流し、寒い夏にはおろおろ歩く姿もあります。人々から役に立たない者のように呼ばれ、褒められも、気にかけられもしない。それでもそういう者になりたい、という願いで詩の言葉が結ばれます。自信だけでなく、心を痛め、迷う姿もその願いに含まれています。", "採用した本文では、その後に仏や菩薩の名、法華経の題目が続きます。手帳に残された言葉を読むとき、この信仰に関わる部分もあることを知っておけます。助けたいという願いを、誰もが無理をして自分を犠牲にしなければならない命令に変える必要はありません。何を見聞きし、どんな相手に心を向けたいのかを考える読み方もできます。"], "summaryHeading": "言葉の流れをたどる読書案内", "links": ["kenji"], "inlineIllustrations": [{"afterParagraph": 2, "src": "assets/amenimo-small-hut-scene.webp", "alt": "松林のそばの小さな小屋。詩に描かれる、質素な暮らしのイメージです。", "caption": "松林のそばの小さな小屋。詩に描かれる、質素な暮らしのイメージです。", "width": 1200, "height": 800}, {"afterParagraph": 3, "src": "assets/amenimo-helping-rice-bundles-scene.webp", "alt": "疲れた母の代わりに、稲の束を背負う。詩の「西」の助けを表す想像図です。", "caption": "疲れた母の代わりに、稲の束を背負う。詩の「西」の助けを表す想像図です。", "width": 1200, "height": 800}, {"afterParagraph": 4, "src": "assets/amenimo-cold-summer-field-scene.webp", "alt": "寒い夏には、おろおろ歩く。何でも解決できる人ではない姿も詩にあります。", "caption": "寒い夏には、おろおろ歩く。何でも解決できる人ではない姿も詩にあります。", "width": 1200, "height": 800}], "characterGalleryNote": "挿絵は詩の言葉をもとにした想像図です。作者本人の行動や実際の建物、特定の土地を再現したものではありません。人物の容貌や服装、風景の細部は創作です。", "contentType": "poetry-guide", "peopleHeading": "著者", "introHeading": "この本について", "introBadge": "詩の入口", "interpretationNote": "採用原典を踏まえた読み方の一例です。", "credits": [["宮沢賢治", "みやざわけんじ", "著者"]], "image": "assets/amenimo-small-hut-scene.webp", "imageAlt": "松林のそばの小さな小屋。詩に描かれる、質素な暮らしのイメージです。", "headerCaption": "松林のそばの小さな小屋。詩に描かれる、質素な暮らしのイメージです。"}, {"id": "tsuru-no-ongaeshi", "name": "鶴の恩返し（グリフィス再話版）", "reading": "つるのおんがえし", "intro": "傷ついた鶴を助けた若い農夫のムサイ。その後、家へ来た女性と結婚しますが、稲が不作になり、家族の暮らしは苦しくなります。妻は、一人だけで働く部屋があれば特別な布を織れると言います。", "gist": "助けた鶴との結びつきと、守れなかった約束から生まれる別れ。", "bodyReadings": {"鶴の恩返し": "つるのおんがえし", "鶴": "つる", "再話": "さいわ", "農夫": "のうふ", "稲": "いね", "不作": "ふさく", "大名": "だいみょう", "皇后": "こうごう", "京都": "きょうと", "銀貨": "ぎんか", "綿毛": "わたげ", "機織り": "はたおり", "覗く": "のぞく", "覗いて": "のぞいて"}, "sources": [{"title": "Project Gutenberg 19461：The Grateful Crane（グリフィス再話、採用英語本文）", "url": "https://www.gutenberg.org/cache/epub/19461/pg19461-images.html"}, {"title": "Rutgers大学所蔵資料案内：グリフィス年譜（1908年の原収録書刊行）", "url": "https://archives.libraries.rutgers.edu/repositories/11/resources/933"}], "sourceNote": "日本の昔話をグリフィスが英語で再話したThe Grateful Craneを、独自の日本語で紹介しています。採用はProject Gutenberg No.19461のTales of Wonder Every Child Should Know所収本文です。同選集はKate Douglas WigginとNora Archibald Smithの編集、copyright1909表示。電子本文の表題紙には後年の出版社名があり、採用紙本の印刷年は確定していません。元の収録書は1908年刊です。老夫婦の養女となる版や、現代の絵本・戯曲『夕鶴』とは混ぜていません。", "termNote": "「再話」は、伝わってきた話を語り直すこと。グリフィスを昔話そのものの最初の作者とはしません。ムサイは英語本文Musaiの音写で、日本語の漢字名は確認できていません。大名は領主、皇后は天皇のきさきです。本文の当時の日本文化についての説明を、日本全体の確定した実態とは扱いません。", "checkedDate": "2026年11月3日", "cat": "literature", "primaryCategory": "japanese-folktale", "genreLabel": "日本の昔話・英語再話版", "genre": "japanese-folktale", "motif": "book", "sub": "ウィリアム・エリオット・グリフィス（再話）｜1908年の再話集・採用選集は1909年著作権表示", "people": [["ムサイ", "母を支える若い農夫。鶴を助け、後に訪ねてきた女性と結婚する。"], ["ムサイの母", "夫を亡くし、息子と暮らす母。訪ねてきた女性を迎える。"], ["妻／助けられた鶴", "人の姿でムサイの妻となった鶴。同じ存在の二つの姿。家族のために布を織る。"], ["大名", "ムサイの布を受け取り、京都の皇后へ贈る領主。"]], "synopsisSummary": ["ムサイは、夫を亡くした母を支えながら、毎日田で働く若い農夫です。ある日、傷ついた鶴が近くに落ちてきます。ムサイが助けると、鶴は力を取り戻して飛び立ち、彼の周りを回ってから山へ去りました。ムサイはまた田仕事に戻ります。", "秋が近づいたころ、帰宅したムサイは母のそばに若い女性が座っているのを見つけます。女性はムサイとの結婚を望んで来ていました。ムサイは、きれいに育ったように見える人が、自分たちの貧しい暮らしに耐えられるだろうかと心配します。しかし、女性が母に親切に接する姿を見て、不安が消え、二人は結婚しました。", "ところが、その年の稲は実らず、不作になります。税を納めるお金も食べ物も足りず、冬には家族はひどく困りました。妻は、誰にも邪魔されず一人で働ける部屋があれば、特別な布を織れると言います。ムサイが別の部屋を建てると、妻は中にこもり、一週間後に美しい布を持って出てきました。白く輝く布には、ところどころ赤い糸が織り込まれています。", "妻が「鶴の綿毛の布」と呼ぶように言ったその布を、ムサイは土地の大名へ届けます。大名が京都の皇后へ贈ると、とても喜ばれました。ムサイは千枚の銀貨を持ち帰り、母の前に広げ、妻に感謝します。そのお金で家族はしばらく不自由なく暮らせました。", "再び暮らしが苦しくなりかけたころ、ムサイは妻にもう一度織ってくれないかと頼みます。妻は引き受けますが、布を持って出てくるまで中を見ないように念を押しました。それでもムサイは気になり、紙の仕切りから部屋を覗いてしまいます。そこにいたのは女性ではなく、以前助けた白い鶴でした。鶴は自分の羽を糸にして、布を作っていたのです。", "ムサイが見つめていると、母が彼を呼びました。思わず返事をしたため、鶴は驚き、壁の向こうから覗く目に気づきます。鶴は糸と布を置き、戸口から外へ飛び去りました。山を背景に小さく見えていた白い姿も、やがて見えなくなります。母と息子は再び貧しさと寂しさに向き合い、ムサイは田で働く暮らしへ戻りました。"], "summaryHeading": "要約", "links": ["william-elliot-griffis"], "characterGallery": [{"name": "ムサイ", "role": "母を支える若い農夫。鶴を助け、後に訪ねてきた女性と結婚する。", "wide": false, "portraits": [{"src": "assets/tsuru-face-musai.webp", "label": "若い農夫", "alt": "ムサイの人物イメージ", "width": 500, "height": 500}]}, {"name": "ムサイの母", "role": "夫を亡くし、息子と暮らす母。訪ねてきた女性を迎える。", "wide": false, "portraits": [{"src": "assets/tsuru-face-mother.webp", "label": "ムサイの母", "alt": "ムサイの母の人物イメージ", "width": 500, "height": 500}]}, {"name": "妻／助けられた鶴", "role": "人の姿でムサイの妻となった鶴。同じ存在の二つの姿。家族のために布を織る。", "wide": true, "portraits": [{"src": "assets/tsuru-face-wife.webp", "label": "人の姿：ムサイの妻", "alt": "妻／助けられた鶴の人物イメージ", "width": 500, "height": 500}, {"src": "assets/tsuru-face-crane.webp", "label": "同じ存在：白い鶴の姿", "alt": "妻／助けられた鶴の人物イメージ", "width": 500, "height": 500}]}, {"name": "大名", "role": "ムサイの布を受け取り、京都の皇后へ贈る領主。", "wide": false, "portraits": [{"src": "assets/tsuru-face-lord.webp", "label": "布を受け取る領主", "alt": "大名の人物イメージ", "width": 500, "height": 500}]}], "inlineIllustrations": [{"afterParagraph": 1, "src": "assets/tsuru-crane-release-scene.webp", "alt": "ムサイが助けた鶴は、田のそばから飛び立ちます。", "caption": "ムサイが助けた鶴は、田のそばから飛び立ちます。", "width": 1200, "height": 800}, {"afterParagraph": 3, "src": "assets/tsuru-woven-cloth-scene.webp", "alt": "一週間後、妻は白地に赤い糸の入った布を持って出てきます。", "caption": "一週間後、妻は白地に赤い糸の入った布を持って出てきます。", "width": 1200, "height": 800}, {"afterParagraph": 6, "src": "assets/tsuru-crane-departure-scene.webp", "alt": "覗かれたことに気づいた鶴は飛び去り、母と息子が残されます。", "caption": "覗かれたことに気づいた鶴は飛び去り、母と息子が残されます。", "width": 1200, "height": 800}], "characterGalleryNote": "人物の顔、衣服、家や田の細部は、採用した英語再話をもとにした創作です。妻と鶴の識別像は、同じ存在の二つの姿を示しています。", "credits": [["日本の昔話", null, "伝承"], ["ウィリアム・エリオット・グリフィス", "うぃりあむえりおっとぐりふぃす", "英語再話"]], "image": "assets/tsuru-crane-release-scene.webp", "imageAlt": "ムサイが助けた鶴は、田のそばから飛び立ちます。", "headerCaption": "ムサイが助けた鶴は、田のそばから飛び立ちます。"}, {"id": "william-elliot-griffis", "name": "ウィリアム・エリオット・グリフィス", "reading": "うぃりあむえりおっとぐりふぃす", "cat": "person", "sub": "1843–1928｜日本を英語で紹介した教育者・著述家", "motif": "book", "intro": "日本で教え、帰国後も本や講演で日本を紹介したアメリカの著述家。歴史や文化に加え、昔話を英語で語り直しました。この図鑑の『鶴の恩返し（グリフィス再話版）』は、グリフィスの再話をもとにしています。", "gist": "昔話の最初の作者ではなく、日本の話を英語の読者へ伝えた再話者。", "people": [], "theme": "", "memory": "", "links": ["tsuru-no-ongaeshi"], "sources": [{"title": "Rutgers大学文書館：William Elliot Griffis Collection（伝記・年譜）", "url": "https://archives.libraries.rutgers.edu/repositories/11/resources/933"}, {"title": "Rutgers大学図書館：グリフィス・コレクション紹介", "url": "https://www.libraries.rutgers.edu/new-brunswick/visit-study/locations/special-collections-university-archives/divisions-collections/manuscripts/william-elliot-griffis-collection"}, {"title": "Rutgers University Foundation：William Elliot Griffis", "url": "https://support.rutgers.edu/distinguished-alumni/1990/william-elliot-griffis"}, {"title": "Project Gutenberg 19461：The Grateful Crane（採用英語再話）", "url": "https://www.gutenberg.org/cache/epub/19461/pg19461-images.html"}], "bodyReadings": {"日下部太郎": "くさかべたろう", "越前": "えちぜん", "福井": "ふくい", "開成学校": "かいせいがっこう", "来日": "らいにち", "牧師": "ぼくし", "執筆": "しっぴつ", "著述家": "ちょじゅつか", "再話者": "さいわしゃ", "鶴の恩返し": "つるのおんがえし", "昔話": "むかしばなし"}, "checkedDate": "2026年11月3日", "primaryCategory": "person", "genreLabel": "人物", "sourceNote": "生涯と著作はラトガーズ大学の所蔵資料案内・年譜・人物紹介で確認しました。作品への読書案内は、採用した英語再話を参照した図鑑独自の説明です。日記や書簡の全篇を読んだ伝記ではありません。肖像画像は使用していません。", "authorTextOnly": true, "portraitNote": "この紹介には本人の肖像は掲載していません。", "longTitle": true}, {"id": "mikan", "name": "蜜柑", "reading": "みかん", "intro": "冬の夕方、汽車に乗った「私」は、向かいの席の少女を不快に感じています。やがて少女が窓を開けようとし、「私」のいらだちは強まります。短い旅の途中に見た出来事が、人を見る目を変える物語です。", "gist": "少女の行動を知ったとき、同じ姿が違って見える。", "bodyReadings": {"蜜柑": "みかん", "芥川龍之介": "あくたがわりゅうのすけ", "横須賀": "よこすか", "客車": "きゃくしゃ", "二等": "にとう", "三等": "さんとう", "風呂敷": "ふろしき", "切符": "きっぷ", "等級": "とうきゅう", "夕刊": "ゆうかん", "踏切": "ふみきり", "柵": "さく", "奉公先": "ほうこうさき", "嫌悪": "けんお", "頬": "ほお", "倦怠": "けんたい", "萌黄色": "もえぎいろ", "銀杏返し": "いちょうがえし"}, "sources": [{"title": "青空文庫：蜜柑（新字新仮名・採用本文）", "url": "https://www.aozora.gr.jp/cards/000879/files/43017_17431.html"}, {"title": "青空文庫図書カード：初出・底本・著者情報", "url": "https://www.aozora.gr.jp/cards/000879/card43017.html"}], "sourceNote": "青空文庫No.43017の新字新仮名本文を全篇確認し、独自の日本語で紹介しています。底本は新潮文庫『蜘蛛の糸・杜子春』（1968年刊）です。少女が奉公先へ向かうという説明は、原文でも語り手の推測です。人物の顔や車内の細部は創作で、作者本人や実在の列車の厳密な再現ではありません。", "termNote": "二等・三等は、当時の客車や切符の等級。奉公は、他の家などに住み込んで働くこと。", "checkedDate": "2026年11月3日", "cat": "literature", "primaryCategory": "japanese-literature", "genreLabel": "日本文学", "genre": "japanese-fiction", "motif": "book", "sub": "芥川龍之介｜1919年発表", "people": [["私", "汽車の中で出来事を見て語る人。初めは少女を見下しますが、蜜柑を投げる理由を知って見方が変わります。作者本人と同一とは断定しません。"], ["少女", "十三、四歳ほど。風呂敷包みと三等切符を持つ少女。見送りの子供たちへ蜜柑を投げます。"], ["三人の弟たち", "踏切の柵の向こうで汽車を見送る三人の男の子。「私」は少女の弟たちだと理解します。"]], "synopsisSummary": ["曇った冬の夕方、横須賀から出る汽車の二等客車に「私」が座っています。疲れ切った「私」には、窓の外も人生も、暗く退屈に感じられます。発車の直前、十三、四歳ほどの少女が乗り込み、向かいの席に座ります。少女は大きな風呂敷包みを抱え、三等の赤い切符を握っています。", "「私」は、少女の荒れた頬や服装を不快に思い、客車の等級も分からないのだと決めつけます。これは少女について公平に確かめた説明ではなく、「私」の偏った見方です。少女から気をそらそうと夕刊を広げますが、記事にも心は晴れません。「私」は新聞を投げ出し、目を閉じてうとうとします。", "やがて少女は「私」の隣へ移り、重い窓を開けようとします。汽車が次のトンネルに入ろうとしているため、「私」にはその理由が分かりません。ようやく窓が開くと、煙が車内へ入り込み、「私」はせき込みます。それでも少女は進む方向を見つめています。「私」が叱ろうと思ううちに、汽車はトンネルを抜けます。", "町はずれの踏切の柵の向こうには、三人の幼い男の子が並んでいました。子供たちが汽車へ手を上げて声をかけると、少女は窓から五つ、六つの蜜柑を投げます。暗い夕景の中で、その色が鮮やかに見えます。「私」は、少女がおそらく奉公先へ向かう途中で、見送りに来た弟たちへ蜜柑を渡したのだと受け止めます。少女が窓を開けようとした理由が、ここで初めて分かるのです。", "踏切も子供たちも、すぐに窓の外を過ぎ去ります。少女は元の向かいの席へ戻り、同じ風呂敷包みと切符を握っています。姿は変わっていないのに、「私」はまるで別人を見るように少女を見直します。弟たちを思う行動に心が動き、疲れや退屈をわずかな間、忘れられたのでした。少女のその後や、二人の会話は描かれません。"], "summaryHeading": "要約", "links": ["akutagawa"], "characterGallery": [{"name": "私", "role": "汽車の中で出来事を見て語る人。初めは少女を見下しますが、蜜柑を投げる理由を知って見方が変わります。作者本人と同一とは断定しません。", "wide": false, "portraits": [{"src": "assets/mikan-face-narrator.webp", "label": "汽車の中の語り手", "alt": "私の人物イメージ", "width": 500, "height": 500}]}, {"name": "少女", "role": "十三、四歳ほど。風呂敷包みと三等切符を持つ少女。見送りの子供たちへ蜜柑を投げます。", "wide": false, "portraits": [{"src": "assets/mikan-face-girl.webp", "label": "十三、四歳ほどの少女", "alt": "少女の人物イメージ", "width": 500, "height": 500}]}, {"name": "三人の弟たち", "role": "踏切の柵の向こうで汽車を見送る三人の男の子。「私」は少女の弟たちだと理解します。", "wide": false, "portraits": [{"src": "assets/mikan-face-brothers.webp", "label": "見送りに来た三人", "alt": "三人の弟たちの人物イメージ", "width": 500, "height": 500}]}], "inlineIllustrations": [{"afterParagraph": 1, "src": "assets/mikan-opposite-seats-scene.webp", "alt": "少女は、風呂敷包みと切符を持って「私」の向かいに座ります。", "caption": "少女は、風呂敷包みと切符を持って「私」の向かいに座ります。", "width": 1200, "height": 800}, {"afterParagraph": 4, "src": "assets/mikan-oranges-to-brothers-scene.webp", "alt": "少女は、踏切で見送る三人の弟たちへ蜜柑を投げます。", "caption": "少女は、踏切で見送る三人の弟たちへ蜜柑を投げます。", "width": 1200, "height": 800}, {"afterParagraph": 5, "src": "assets/mikan-changed-gaze-scene.webp", "alt": "少女が元の席へ戻ると、「私」は同じ姿を違う目で見つめます。", "caption": "少女が元の席へ戻ると、「私」は同じ姿を違う目で見つめます。", "width": 1200, "height": 800}], "characterGalleryNote": "人物の顔や車内・町の細部は、原文をもとにした創作イラストです。語り手は作者本人の肖像ではありません。", "credits": [["芥川龍之介", "あくたがわりゅうのすけ", "著者"]], "image": "assets/mikan-opposite-seats-scene.webp", "imageAlt": "少女は、風呂敷包みと切符を持って「私」の向かいに座ります。", "headerCaption": "少女は、風呂敷包みと切符を持って「私」の向かいに座ります。"}, {"id": "fugaku-hyakkei", "name": "富嶽百景", "reading": "ふがくひゃっけい", "intro": "富士山の見える峠の茶屋に、仕事をするため滞在した「私」。立派すぎる景色を好めずにいますが、人々との出会いや結婚の話を通して、富士の見え方も揺れ動いていきます。", "gist": "同じ富士も、人との出会いや心の動きによって違って見える。", "bodyReadings": {"富嶽百景": "ふがくひゃっけい", "太宰治": "だざいおさむ", "富士": "ふじ", "井伏鱒二": "いぶせますじ", "御坂峠": "みさかとうげ", "天下茶屋": "てんかぢゃや", "三ツ峠": "みつとうげ", "甲府": "こうふ", "河口湖": "かわぐちこ", "麓": "ふもと", "月見草": "つきみそう", "初秋": "しょしゅう", "外套": "がいとう", "炬燵": "こたつ", "執筆": "しっぴつ", "遊女": "ゆうじょ", "援助": "えんじょ", "滞在": "たいざい"}, "sources": [{"title": "青空文庫：富嶽百景（採用本文）", "url": "https://www.aozora.gr.jp/cards/000035/files/270_14914.html"}, {"title": "青空文庫図書カード：初出・底本・著者情報", "url": "https://www.aozora.gr.jp/cards/000035/card270.html"}, {"title": "山梨県公式観光ネット：天下茶屋（読み確認）", "url": "https://www.yamanashi-kankou.jp/zenryoku/hill-climb/hyakusaka/course/934/index.html"}], "sourceNote": "青空文庫No.270の新字旧仮名本文を全篇確認した独自の読書案内です。底本は筑摩書房『筑摩現代文学大系59 太宰治集』（1975年）。実在の人物や土地が登場しますが、作品の語りをすべて伝記事実と同一視していません。挿絵は作品の場面をもとにした想像図で、本人の容貌や当時の景観の厳密な再現ではありません。", "termNote": "どてらは、綿を入れた防寒用の着物。遊女は、当時、遊郭で客の相手をしていた女性。本文では、その女性たちに同情しながら力になれない語り手の気持ちが描かれます。", "checkedDate": "2026年11月3日", "cat": "literature", "primaryCategory": "japanese-literature", "genreLabel": "日本文学", "genre": "japanese-fiction", "motif": "book", "sub": "太宰治｜1939年発表", "people": [["私", "峠の茶屋に滞在して小説を書く語り手。本文では太宰と呼ばれますが、語りのすべてをそのまま作者の実録とは扱いません。"], ["井伏鱒二", "先に天下茶屋で仕事をしている作家。「私」と山に登り、甲府の見合いにも付き添います。"], ["新田と田辺", "「私」と親しくなる土地の青年たち。新田は郵便局勤めで二十五歳。田辺は短歌が上手な青年です。"], ["茶屋のおかみさんと娘", "天下茶屋で「私」を世話する母娘。十五歳の娘は執筆を励まします。見合い相手とは別人です。"], ["甲府の娘と母", "「私」の結婚相手となる娘と、その母。金銭的な事情を打ち明けられても、愛情と仕事への熱意を大切にします。"], ["バスで隣り合う老女", "富士と反対側の道端に咲く月見草を指す、六十歳くらいの女性。"], ["写真を頼む二人の女性", "下山前日に訪れる、赤い外套を着た若い女性二人。富士と一緒に写してもらおうとします。"]], "synopsisSummary": ["語り手の「私」は、富士山を無条件にほめる人ではありません。絵に描かれた富士と実際の形を比べ、東京から見た富士には苦しい思い出も重ねます。1938年の初秋、心を改めようと山梨へ旅立ち、作家の井伏鱒二が仕事をしている御坂峠の天下茶屋を訪れます。ここに滞在することになりますが、富士と河口湖が整って見える景色は、出来すぎた絵のようで好きになれません。", "井伏と三ツ峠へ登った日は、霧で何も見えません。茶店の老女が富士の写真を掲げ、晴れていればこう見えると懸命に説明すると、二人は笑い、霧を残念に思わなくなります。その後、「私」は井伏に連れられて甲府へ見合いに行きます。相手の家にあった富士山頂の写真を振り返る動きで、娘をちらりと見て、結婚したいと思います。井伏が東京へ帰った後も、「私」は峠に残って仕事を続けます。", "茶屋には、郵便局に勤める新田という青年が訪ねてきます。新田は「私」の評判を恐れていたのに、会うと印象が違ったと話します。人の評価に揺れる「私」には、黙って立つ富士が頼もしく思えます。新田や田辺らと親しくなり、麓の吉田へ出かけた夜は、月光に青く見える富士に心を奪われます。茶屋へ戻ると、十五歳の娘が、雪をかぶった富士の美しさを知らせてくれることもありました。", "郵便物を受け取った帰りのバスでは、隣の老女が富士と反対側を見ています。「私」は勝手に、老女も富士を好まず、深い悩みを抱えているのだと考えます。ところが老女が指したのは、道端に咲く黄色い月見草でした。「私」の心には、大きな富士に負けず立つ小さな花の姿が残ります。そのため茶屋の裏へ月見草の種をまき、来年また見に来ると娘に話すのでした。", "十月になっても、どんな文学を書くべきか悩み、仕事はなかなか進みません。峠を訪れた遊女たちを見て、同情しても何もできないと苦しむこともあります。一方、結婚の費用を実家から援助してもらえないと分かり、甲府の娘とその母に事情を打ち明けます。母は立派な式よりも、愛情と仕事への熱意があればよいと応じます。「私」はその言葉に胸を熱くし、峠へ帰ると、茶屋も自分の家のように感じます。", "茶屋の娘は、毎朝原稿を順番にそろえるのが楽しみなのに、このごろ書けていないと「私」を励まします。「私」は、その言葉を見返りのない声援として受け止めます。ただし、娘が自分を怖がる様子にも気づき、二人きりのときは距離を置くようにします。結婚の話は先輩の助けで進みますが、十一月には峠の寒さが厳しくなります。おかみさんは炬燵まで用意してくれます。それでも「私」は、山を下りることを決めます。", "下山の前日、赤い外套の若い女性二人から、富士を背景に写真を撮ってほしいと頼まれます。「私」は、かしこまった二人がおかしくて笑いをこらえきれず、二人を画面から外して富士だけを撮ります。心の中で富士に別れとお礼を告げますが、二人には撮れたと伝え、礼を言われます。親切な記念撮影で終わるわけではないのです。翌日山を下り、甲府に一泊した「私」は、翌朝、山々の後ろに一部だけ見える富士をまた眺めます。"], "summaryHeading": "要約", "links": ["dazai"], "inlineIllustrations": [{"afterParagraph": 1, "src": "assets/fugaku-teahouse-view-scene.webp", "alt": "「私」は天下茶屋に滞在しますが、整いすぎた富士の景色を好めません。", "caption": "「私」は天下茶屋に滞在しますが、整いすぎた富士の景色を好めません。", "width": 1200, "height": 800}, {"afterParagraph": 4, "src": "assets/fugaku-bus-flower-scene.webp", "alt": "バスの老女が指したのは、富士と反対側の道端に咲く黄色い花でした。", "caption": "バスの老女が指したのは、富士と反対側の道端に咲く黄色い花でした。", "width": 1200, "height": 800}, {"afterParagraph": 7, "src": "assets/fugaku-fuji-only-photo-scene.webp", "alt": "下山の前日、「私」は頼まれた二人を写さず、富士だけを撮ります。", "caption": "下山の前日、「私」は頼まれた二人を写さず、富士だけを撮ります。", "width": 1200, "height": 800}], "characterGalleryNote": "挿絵は作品の場面をもとにした想像図です。人物の容貌や、当時の茶屋・バス・富士の景観を厳密に復元したものではありません。", "contentType": "story-guide", "peopleHeading": "登場人物", "credits": [["太宰治", "だざいおさむ", "著者"]], "image": "assets/fugaku-teahouse-view-scene.webp", "imageAlt": "「私」は天下茶屋に滞在しますが、整いすぎた富士の景色を好めません。", "headerCaption": "「私」は天下茶屋に滞在しますが、整いすぎた富士の景色を好めません。"}, {"id": "imogayu", "name": "芋粥", "reading": "いもがゆ", "intro": "周囲から軽く扱われている侍の五位には、甘い芋粥を飽きるほど飲みたいという願いがあります。それを聞いた豪快な利仁が、御馳走しようと誘います。望みがかなう機会を前に、五位の気持ちは思いがけなく揺れていきます。", "gist": "長く待った望みがかなうとき、心はどう変わるのか。", "bodyReadings": {"芋粥": "いもがゆ", "芥川龍之介": "あくたがわりゅうのすけ", "五位": "ごい", "藤原基経": "ふじわらのもとつね", "藤原利仁": "ふじわらのとしひと", "藤原有仁": "ふじわらのありひと", "利仁": "としひと", "有仁": "ありひと", "甘葛": "あまづら", "敦賀": "つるが", "越前": "えちぜん", "高島": "たかしま", "丹波": "たんば", "従者": "じゅうしゃ", "侍": "さむらい", "椀": "わん", "承諾": "しょうだく", "御馳走": "ごちそう", "大釜": "おおがま", "膳": "ぜん", "軒": "のき", "京": "きょう"}, "sources": [{"title": "青空文庫：芋粥（採用本文）", "url": "https://www.aozora.gr.jp/cards/000879/files/55_14824.html"}, {"title": "青空文庫図書カード：初出・底本・著者情報", "url": "https://www.aozora.gr.jp/cards/000879/card55.html"}], "sourceNote": "青空文庫No.55の新字旧仮名本文を全篇確認した独自の読書案内です。底本は筑摩書房『現代日本文学大系43 芥川龍之介集』（1968年）。古典に同じ題材の話がありますが、この案内は芥川の小説に沿っています。狐の不思議な働きは物語内の出来事であり、歴史上の事実や現実の動物の能力を示すものではありません。人物や道具の細部は作品に基づく創作です。", "termNote": "本文の芋粥は、山の芋を甘葛という甘い汁で煮た食べ物。サツマイモ入りの米粥と決めつけないようにしています。五位は当時の位を表す呼び方で、主人公の姓名は本文でも明らかにされません。", "checkedDate": "2026年11月3日", "cat": "literature", "primaryCategory": "japanese-literature", "genreLabel": "日本文学", "genre": "japanese-fiction", "motif": "book", "sub": "芥川龍之介｜1916年発表", "people": [["五位", "藤原基経に仕える四十歳過ぎの侍。五位は名前ではなく位を表す呼び方。芋粥を十分に飲むことを願っています。"], ["藤原利仁", "五位を敦賀へ連れていく、体の大きな武人。豪快にもてなす一方、五位をからかうところもあります。"], ["藤原有仁", "利仁の妻の父。敦賀の屋敷で、五位へさらに芋粥を勧めます。"], ["狐", "利仁から迎えの手配を言いつけられる狐。伝言が届いた後、最後に屋敷へ姿を現して芋粥を食べます。"], ["若い侍", "丹波から来た、まだ位のない青年。周囲と一緒に五位を軽く見ていましたが、五位の悲しみに気づきます。"]], "synopsisSummary": ["平安時代の京に、藤原基経に仕える、五位と呼ばれる侍がいます。名前は伝えられていません。四十歳を過ぎた五位は、古い衣服や容姿をからかわれ、周囲から軽く扱われています。一人の若い侍だけは、五位がいじめをやめてほしいと訴える声を聞き、その悲しみに気づきます。そんな五位には、山の芋を甘葛の汁で煮た芋粥を、飽きるほど飲んでみたいという願いがありました。", "正月二日、主人の屋敷の宴の後、五位たちも料理を食べます。しかし、楽しみの芋粥は少ししか回ってきません。いつなら十分に飲めるのだろう、と五位がつぶやくと、同じ主人に仕える藤原利仁が、自分が御馳走しようと申し出ます。周囲に笑われながらも五位は承諾し、空の椀を見つめて、これからの楽しみに心を満たします。", "四、五日後、利仁は近くの湯へ行こうと言って五位を誘います。二人は馬に乗り、二人の従者を連れて京を出ますが、近場を過ぎても旅は続きます。実は、行き先は遠い越前の敦賀でした。不安になる五位を、利仁は自分がいれば大丈夫だと言って連れていきます。五位も、芋粥を飲みたいという思いを支えに進みます。", "途中、利仁は一匹の狐を捕まえ、敦賀の屋敷へ迎えの手配を伝えよと命じて放します。翌日、高島に来ると、本当に迎えの者たちがいました。従者によると、前夜、利仁の妻が狐に取りつかれたようになり、同じ伝言を話したというのです。五位は利仁の力に感心し、夕方には敦賀の屋敷へ着きます。温かい衣服や食事でもてなされますが、長く待った願いがすぐかなうことに、楽しみと不安の両方を覚えます。", "その夜、翌朝までに大きな山の芋を持って来るよう、屋敷から命令が出ます。五位は、簡単に願いが実現すると、何年も待った意味がなくなるように感じます。朝、戸を開けると、長い芋が山積みになり、幾つもの大釜で大量の芋粥を作る準備が進んでいました。その規模に圧倒され、五位の食欲は、まだ食べていないうちから薄れてしまいます。", "朝の膳には、大きな銀の容器になみなみと入った芋粥が並びます。利仁と、利仁の妻の父である有仁に勧められ、五位は無理に飲みますが、もう十分だと断ります。そのとき、道中の狐が屋根の軒に現れ、利仁は狐にも芋粥を与えさせます。皆の注意が移ったおかげで、五位はそれ以上飲まずにすみました。庭で食べる狐を見ながら、五位は、つらい暮らしの中にも願いを大事に持っていた以前の自分を懐かしく思います。最後は、寒い敦賀の朝に大きなくしゃみをして終わります。"], "summaryHeading": "要約", "links": ["akutagawa"], "characterGallery": [{"name": "五位", "role": "藤原基経に仕える四十歳過ぎの侍。五位は名前ではなく位を表す呼び方。芋粥を十分に飲むことを願っています。", "wide": false, "portraits": [{"src": "assets/imogayu-face-goi.webp", "label": "四十歳過ぎの侍", "alt": "五位の人物イメージ", "width": 500, "height": 500}]}, {"name": "藤原利仁", "role": "五位を敦賀へ連れていく、体の大きな武人。豪快にもてなす一方、五位をからかうところもあります。", "wide": false, "portraits": [{"src": "assets/imogayu-face-toshihito.webp", "label": "五位を誘う武人", "alt": "藤原利仁の人物イメージ", "width": 500, "height": 500}]}, {"name": "藤原有仁", "role": "利仁の妻の父。敦賀の屋敷で、五位へさらに芋粥を勧めます。", "wide": false, "portraits": [{"src": "assets/imogayu-face-arihito.webp", "label": "利仁の妻の父", "alt": "藤原有仁の人物イメージ", "width": 500, "height": 500}]}, {"name": "狐", "role": "利仁から迎えの手配を言いつけられる狐。伝言が届いた後、最後に屋敷へ姿を現して芋粥を食べます。", "wide": false, "portraits": [{"src": "assets/imogayu-face-fox.webp", "label": "伝言を命じられる狐", "alt": "狐の人物イメージ", "width": 500, "height": 500}]}, {"name": "若い侍", "role": "丹波から来た、まだ位のない青年。周囲と一緒に五位を軽く見ていましたが、五位の悲しみに気づきます。", "wide": false, "portraits": [{"src": "assets/imogayu-face-young-samurai.webp", "label": "五位の悲しみに気づく青年", "alt": "若い侍の人物イメージ", "width": 500, "height": 500}]}], "inlineIllustrations": [{"afterParagraph": 2, "src": "assets/imogayu-empty-bowl-promise-scene.webp", "alt": "利仁に誘われた五位は、空の椀を見つめ、芋粥への期待をふくらませます。", "caption": "利仁に誘われた五位は、空の椀を見つめ、芋粥への期待をふくらませます。", "width": 1200, "height": 800}, {"afterParagraph": 5, "src": "assets/imogayu-massive-preparation-scene.webp", "alt": "敦賀の朝。大量の山の芋と大釜を見て、五位は食べる前から圧倒されます。", "caption": "敦賀の朝。大量の山の芋と大釜を見て、五位は食べる前から圧倒されます。", "width": 1200, "height": 800}, {"afterParagraph": 6, "src": "assets/imogayu-fox-and-refusal-scene.webp", "alt": "狐に芋粥が出されると、五位はこれ以上飲まずにすみ、以前の願いを思い返します。", "caption": "狐に芋粥が出されると、五位はこれ以上飲まずにすみ、以前の願いを思い返します。", "width": 1200, "height": 800}], "characterGalleryNote": "人物や調度の細部は、芥川の小説に基づく創作イラストです。歴史上の本人の顔や当時の料理・建築を厳密に再現したものではありません。", "credits": [["芥川龍之介", "あくたがわりゅうのすけ", "著者"]], "image": "assets/imogayu-empty-bowl-promise-scene.webp", "imageAlt": "利仁に誘われた五位は、空の椀を見つめ、芋粥への期待をふくらませます。", "headerCaption": "利仁に誘われた五位は、空の椀を見つめ、芋粥への期待をふくらませます。"}, {"id": "joseito", "name": "女生徒", "reading": "じょせいと", "intro": "朝、目を覚ましてから夜に眠るまで。学校へ行き、友人と過ごし、母を手伝う少女の一日に、憧れやいらだち、寂しさが絶えず浮かびます。出来事だけでなく、言葉にしにくい心の揺れをたどる小説です。", "gist": "自分らしくありたい気持ちと、人に分かってほしい気持ちが揺れる一日。", "bodyReadings": {"女生徒": "じょせいと", "太宰治": "だざいおさむ", "雨傘": "あまがさ", "登校": "とうこう", "批評": "ひひょう", "図画": "ずが", "小杉": "こすぎ", "伊藤": "いとう", "キン子": "きんこ", "憧れ": "あこがれ", "百合": "ゆり", "夕空": "ゆうぞら", "洗濯": "せんたく", "親しさ": "したしさ", "心遣い": "こころづかい"}, "sources": [{"title": "青空文庫：女生徒（採用本文）", "url": "https://www.aozora.gr.jp/cards/000035/files/275_13903.html"}, {"title": "青空文庫図書カード：初出・底本・著者情報", "url": "https://www.aozora.gr.jp/cards/000035/card275.html"}, {"title": "青森県近代文学館：資料集『有明淑の日記』と関連解説の刊行情報", "url": "https://www.plib.pref.aomori.lg.jp/bungakukan/literature-aomori/publication/materials/"}], "sourceNote": "青空文庫No.275の新字新仮名本文を全篇確認した独自の読書案内です。底本は角川文庫『女生徒』。関連資料として青森県近代文学館が『有明淑の日記』と本作についての解説を刊行していますが、この案内で日記原物を照合したわけではありません。小説の語り手を、作者や日記を書いた実在の人物とそのまま同一視していません。人物の顔や服装の細部は創作です。", "termNote": "図画は、絵を描く学校の授業。『クオレ』は、少女が母に読み聞かせる本の題名です。", "checkedDate": "2026年11月3日", "cat": "literature", "primaryCategory": "japanese-literature", "genreLabel": "日本文学", "genre": "japanese-fiction", "motif": "book", "sub": "太宰治｜1939年発表", "people": [["私", "母と暮らし、学校に通う少女。この一日の気持ちを語ります。名前や正確な年齢は本文では明示されません。"], ["母", "夫を亡くし、娘と二人で暮らす母。人の世話や付き合いに忙しく、娘との距離も揺れ動きます。"], ["父と姉", "父はすでに亡くなり、姉は結婚して家を離れています。少女の記憶に登場する家族です。"], ["小杉先生", "学校の女性教師。少女はその美しさに引かれつつ、話や振る舞いを批判的にも見ています。"], ["伊藤先生", "図画の教師。古い傘を持った少女を、自分の絵のモデルにします。"], ["キン子さん", "寺の娘で、学校では少女の隣の席にいる友人。放課後、一緒に髪を整えに行きます。"], ["今井田一家", "夕方に訪れる夫婦と七歳の良夫。少女はもてなしながら、内心では不満を抱きます。"], ["ジャピイとカア", "家の二匹の犬。ジャピイは白い毛、カアは前足に不自由があります。少女の接し方の違いも心の動きを映します。"]], "synopsisSummary": ["五月の朝、少女の「私」は、すっきりしない気持ちで目を覚まします。父はすでに亡くなり、姉も結婚して家を離れ、今は母との二人暮らしです。鏡や庭を見ながら、自分の顔や心の動きを細かく気にします。二匹の犬のうち、白いジャピイだけをかわいがり、足の不自由なカアへ冷たくする自分にも嫌気が差します。朝から、懐かしさやいらだちが次々と浮かびます。", "母からもらった古い雨傘が気に入り、雨になりそうでもないのに持って登校します。道では嫌な言葉をかけられ、電車では座ろうとした席を取られて、心が落ち着きません。雑誌の若い女性への批評を読みながら、理想を説くだけでなく、今どうすればよいかを具体的に教えてほしいと思います。自分らしくありたい一方、家族や世間の目から外れるのも怖いのです。", "学校では、小杉先生の美しさに引かれながら、その話し方には不満を持ちます。昼は友人たちとの怪談に夢中になります。午後、古い傘が皆の注目を集め、図画の伊藤先生から、傘を持って絵のモデルになるよう頼まれます。誰かの役に立つのは嬉しいのに、先生とのやり取りには疲れます。人の気取りを批判する自分もまた、自然に振る舞えていないのではないかと考えます。", "放課後は、寺の娘のキン子さんと髪を整えに行きますが、仕上がりが気に入りません。帰りのバスでは他の女性に厳しい目を向け、自分が大人になることにも戸惑います。ところが、バスを降りて土の道を歩くと気分が変わります。見慣れた景色を初めて見るつもりで眺め、やがて草原に横になります。亡い父に呼びかけ、夕空の美しさに心を動かされ、みんなを愛し、美しく生きたいと願います。", "家に戻ると、母と来客の今井田一家がいます。「私」は米をとぎながら、父のいない母の寂しさも思い、大切にしたい、もっと信頼してほしいと願います。しかし、見た目を華やかにした夕食を出しても、客への不満は消えません。笑顔でもてなし、ほめられても素直に喜べず、客に合わせる母も恨めしく感じます。人に合わせることと自分を守ることの間で揺れ続けます。", "客と一緒に出かけた母を待つ間、宿題や読書をし、星を眺めて父を思い出します。部屋の百合から、以前、花を取ってくれた人の親切も思い出します。帰ってきた母は、肩をもんでくれたら見たかった映画へ行ってよいと言います。「私」は母の心遣いを喜び、肩をもみながらその疲れを感じます。自然に言葉を交わし、さらに『クオレ』を読み聞かせるうちに、母への親しさが戻ります。", "母が先に寝た後も、「私」は深夜に洗濯をします。遠くにも、同じ月を見ながら悩んでいる少女がいるのではないかと想像します。大人になれば分かる、と待たせるだけでは、今の苦しさは消えないとも考えます。最後に床へ入り、幸福を待つ気持ちと不安の間を揺れながら、庭を歩くカアの足音を聞きます。明日はかわいがろうと思い、眠りへ向かいます。誰かに救われてすべてが解決するのではなく、心の動きとともに一日が閉じるのです。"], "summaryHeading": "要約", "links": ["dazai"], "characterGallery": [{"name": "私", "role": "母と暮らし、学校に通う少女。この一日の気持ちを語ります。名前や正確な年齢は本文では明示されません。", "wide": false, "portraits": [{"src": "assets/joseito-face-narrator.webp", "label": "通学中の少女", "alt": "私の人物イメージ", "width": 500, "height": 500}]}, {"name": "母", "role": "夫を亡くし、娘と二人で暮らす母。人の世話や付き合いに忙しく、娘との距離も揺れ動きます。", "wide": false, "portraits": [{"src": "assets/joseito-face-mother.webp", "label": "少女の母", "alt": "母の人物イメージ", "width": 500, "height": 500}]}, {"name": "父と姉", "role": "父はすでに亡くなり、姉は結婚して家を離れています。少女の記憶に登場する家族です。", "wide": false, "portraits": []}, {"name": "小杉先生", "role": "学校の女性教師。少女はその美しさに引かれつつ、話や振る舞いを批判的にも見ています。", "wide": false, "portraits": [{"src": "assets/joseito-face-kosugi.webp", "label": "学校の女性教師", "alt": "小杉先生の人物イメージ", "width": 500, "height": 500}]}, {"name": "伊藤先生", "role": "図画の教師。古い傘を持った少女を、自分の絵のモデルにします。", "wide": false, "portraits": [{"src": "assets/joseito-face-ito.webp", "label": "図画の教師", "alt": "伊藤先生の人物イメージ", "width": 500, "height": 500}]}, {"name": "キン子さん", "role": "寺の娘で、学校では少女の隣の席にいる友人。放課後、一緒に髪を整えに行きます。", "wide": false, "portraits": [{"src": "assets/joseito-face-kinko.webp", "label": "隣の席の友人", "alt": "キン子さんの人物イメージ", "width": 500, "height": 500}]}, {"name": "今井田一家", "role": "夕方に訪れる夫婦と七歳の良夫。少女はもてなしながら、内心では不満を抱きます。", "wide": false, "portraits": [{"src": "assets/joseito-face-visitors.webp", "label": "左：夫／中央：妻／右：七歳の良夫", "alt": "今井田一家の人物イメージ", "width": 500, "height": 500}]}, {"name": "ジャピイとカア", "role": "家の二匹の犬。ジャピイは白い毛、カアは前足に不自由があります。少女の接し方の違いも心の動きを映します。", "wide": false, "portraits": [{"src": "assets/joseito-face-dogs.webp", "label": "左：ジャピイ／右：カア", "alt": "ジャピイとカアの人物イメージ", "width": 500, "height": 500}]}], "inlineIllustrations": [{"afterParagraph": 2, "src": "assets/joseito-old-umbrella-morning-scene.webp", "alt": "母が若いころに使っていた傘を持ち、少女は学校へ向かいます。", "caption": "母が若いころに使っていた傘を持ち、少女は学校へ向かいます。", "width": 1200, "height": 800}, {"afterParagraph": 4, "src": "assets/joseito-evening-sky-scene.webp", "alt": "帰り道の草原で夕空を見上げると、少女の心が少しほどけます。", "caption": "帰り道の草原で夕空を見上げると、少女の心が少しほどけます。", "width": 1200, "height": 800}, {"afterParagraph": 6, "src": "assets/joseito-mother-shoulder-care-scene.webp", "alt": "帰ってきた母の肩をもみながら、少女は母の心遣いと疲れを感じます。", "caption": "帰ってきた母の肩をもみながら、少女は母の心遣いと疲れを感じます。", "width": 1200, "height": 800}], "characterGalleryNote": "人物や服装、室内・道の細部は小説をもとにした創作イラストです。作者や日記を書いた実在の人物の顔・生活を再現したものではありません。", "credits": [["太宰治", "だざいおさむ", "著者"]], "image": "assets/joseito-old-umbrella-morning-scene.webp", "imageAlt": "母が若いころに使っていた傘を持ち、少女は学校へ向かいます。", "headerCaption": "母が若いころに使っていた傘を持ち、少女は学校へ向かいます。"}, {"id": "nogiku-no-haka", "name": "野菊の墓", "reading": "のぎくのはか", "intro": "親類の民子と仲よく暮らす少年・政夫。周りのうわさが二人の間に隔たりを作る一方、秋の野山では、花にたとえて互いの気持ちを伝えます。後年の政夫が、忘れられない恋と別れを振り返る小説です。", "gist": "気持ちを聞かれないまま引き離された二人を、後年の政夫が思い返す。", "bodyReadings": {"野菊": "のぎく", "伊藤左千夫": "いとうさちお", "政夫": "まさお", "民子": "たみこ", "矢切": "やぎり", "市川": "いちかわ", "千葉": "ちば", "棉": "わた", "竜胆": "りんどう", "蕎麦": "そば", "渡し場": "わたしば", "墓参り": "はかまいり", "回想": "かいそう", "縁談": "えんだん", "兄嫁": "あによめ", "流産": "りゅうざん", "野菊の墓": "のぎくのはか"}, "sources": [{"title": "青空文庫：野菊の墓（採用本文）", "url": "https://www.aozora.gr.jp/cards/000058/files/647_20406.html"}, {"title": "青空文庫図書カード：底本・初出", "url": "https://www.aozora.gr.jp/cards/000058/card647.html"}, {"title": "山武市：伊藤左千夫について（1906年初出を照合）", "url": "https://www.city.sammu.lg.jp/kyouiku/bunkazai-rekishi/siryoukan/page001450.html"}], "sourceNote": "青空文庫No.647の日本語原著全篇を確認した独自の読書案内です。後年の政夫による回想であり、作者本人の一生をそのまま語った実録とは扱っていません。本文の数え年と満年齢を区別しています。人物や景色の細部は創作イラストで、現代の映画・歌・改作は使用していません。", "termNote": "数え年は、生まれた年を一歳とし、年が改まると一歳加える数え方。棉は綿を採る植物。流産は妊娠が途中で終わることをいい、この物語では、その後の回復不良が語られます。", "checkedDate": "2026年11月3日", "cat": "literature", "primaryCategory": "japanese-literature", "genreLabel": "日本文学", "genre": "japanese-fiction", "motif": "book", "sub": "伊藤左千夫｜1906年発表", "people": [["政夫", "十年余り前の恋を語る「僕」。回想の初めは数え十五歳、満十三歳何か月の少年です。"], ["民子", "政夫の家へ手伝いに来る親類の少女。本文で「縁の従妹」とされ、政夫より二歳年上です。"], ["政夫の母", "病気のため民子の助けを受けています。二人をかわいがりながら結婚に反対し、後に自分の言動を悔やみます。"], ["政夫の兄と兄嫁", "家の仕事をする夫婦。二人の仲に厳しい目を向け、特に兄嫁は母へ働きかけます。"], ["お増", "政夫の家で働く女性。初めは二人をからかいますが、政夫の不在中は民子をかばい、その事情を政夫へ伝えます。"], ["民子の家族", "市川に住む両親・祖母・姉。結婚や病気の事情、残された写真と手紙について政夫に話します。"]], "synopsisSummary": ["政夫は、十年余り前の忘れられない恋を振り返ります。矢切の家にいたころ、病気の母を手伝いに来ていた親類の民子と、とても仲よくしていました。当時の年の数え方では政夫が十五、民子が十七。本文は、今の満年齢なら政夫は十三歳何か月、民子は十五歳を少し過ぎたころとも説明します。周囲は二人の仲をうわさし、母も民子に政夫へ近づかないよう注意します。", "二人は人目を気にするようになりますが、互いへの思いは深まります。秋、母に命じられて山の畑へ棉を採りに行く途中、政夫は摘んだ野菊を民子に分けます。民子を野菊にたとえ、その花が好きだと話す政夫。畑では、民子も政夫を竜胆にたとえます。直接は言い切れない気持ちが、花の話を通して伝わるひとときです。", "仕事を終えた帰り道、二人は月に照らされた蕎麦の花を眺め、帰宅が遅くなります。家族の疑いが強まり、政夫は予定より早く千葉の中学校へ行くことになります。出発前に、民子への気持ちは変わらないと手紙に書いて渡します。小雨の朝、民子と家で働くお増が渡し場まで見送りますが、二人は十分に話せないまま別れます。これが、生きている民子との最後の別れになります。", "最初の冬休みに政夫が戻ると、民子はすでに市川の実家へ帰されていました。お増は、政夫のいない間に民子が寂しさを抱え、母に叱られて苦しんだことを伝えます。以前は二人をからかったお増も、今は民子をかばっています。家族は民子が年上であることなどから二人の結婚を認めません。政夫は学校へ戻る途中に民子の家の近くを通っても、ためらって立ち寄れません。", "さらに次の年の正月、政夫は、民子が前年の晩秋にほかの家へ嫁いだと母から聞きます。それでも民子の思いは変わらないと信じ、昔の時間を思い返します。六月、急いで帰れという電報を受けて帰宅すると、母は民子が亡くなったと告げます。親類たちが結婚を強く勧め、政夫の母も二人の結婚は認めないと民子に言い、民子は望まない縁談を受け入れたのでした。結婚後、民子は流産し、その後の体の回復が悪く、亡くなったと説明されます。", "翌朝、政夫は市川へ墓参りに行き、民子の家族から最期まで自分の写真と手紙を大切にしていたと聞きます。大人たちは二人の気持ちを十分に聞かなかったことを悔やみます。政夫も、病気の間に一度でも会いたかったと悲しみます。一方で、自分を責め続ける母を気遣い、母を落ち着かせようと努めます。", "政夫は七日間続けて墓参りし、民子の墓の周りに野菊を植えてから学校へ戻ります。最後に語りは回想を終えた政夫へ戻ります。今の政夫も、自分の望みどおりではない結婚をして生きています。長い年月が過ぎても、民子への思いは消えていないのです。"], "summaryHeading": "要約", "links": ["ito-sachio"], "characterGallery": [{"name": "政夫", "role": "十年余り前の恋を語る「僕」。回想の初めは数え十五歳、満十三歳何か月の少年です。", "wide": false, "portraits": [{"src": "assets/nogiku-face-masao.webp", "label": "回想のころの少年", "alt": "政夫の人物イメージ", "width": 500, "height": 500}]}, {"name": "民子", "role": "政夫の家へ手伝いに来る親類の少女。本文で「縁の従妹」とされ、政夫より二歳年上です。", "wide": false, "portraits": [{"src": "assets/nogiku-face-tamiko.webp", "label": "政夫より二歳年上の少女", "alt": "民子の人物イメージ", "width": 500, "height": 500}]}, {"name": "政夫の母", "role": "病気のため民子の助けを受けています。二人をかわいがりながら結婚に反対し、後に自分の言動を悔やみます。", "wide": false, "portraits": [{"src": "assets/nogiku-face-mother.webp", "label": "政夫の母", "alt": "政夫の母の人物イメージ", "width": 500, "height": 500}]}, {"name": "政夫の兄と兄嫁", "role": "家の仕事をする夫婦。二人の仲に厳しい目を向け、特に兄嫁は母へ働きかけます。", "wide": false, "portraits": [{"src": "assets/nogiku-face-brother-couple.webp", "label": "左：兄／右：兄嫁", "alt": "政夫の兄と兄嫁の人物イメージ", "width": 500, "height": 500}]}, {"name": "お増", "role": "政夫の家で働く女性。初めは二人をからかいますが、政夫の不在中は民子をかばい、その事情を政夫へ伝えます。", "wide": false, "portraits": [{"src": "assets/nogiku-face-omasu.webp", "label": "家で働く女性", "alt": "お増の人物イメージ", "width": 500, "height": 500}]}, {"name": "民子の家族", "role": "市川に住む両親・祖母・姉。結婚や病気の事情、残された写真と手紙について政夫に話します。", "wide": false, "portraits": [{"src": "assets/nogiku-face-tamiko-family.webp", "label": "左から：父／母／祖母／姉", "alt": "民子の家族の人物イメージ", "width": 500, "height": 500}]}], "inlineIllustrations": [{"afterParagraph": 2, "src": "assets/nogiku-wildflowers-path-scene.webp", "alt": "棉を採りに行く道で、政夫は摘んだ野菊を民子に分けます。", "caption": "棉を採りに行く道で、政夫は摘んだ野菊を民子に分けます。", "width": 1200, "height": 800}, {"afterParagraph": 3, "src": "assets/nogiku-rainy-ferry-parting-scene.webp", "alt": "小雨の渡し場で、学校へ向かう政夫を民子とお増が見送ります。", "caption": "小雨の渡し場で、学校へ向かう政夫を民子とお増が見送ります。", "width": 1200, "height": 800}, {"afterParagraph": 7, "src": "assets/nogiku-grave-flowers-scene.webp", "alt": "政夫は七日間墓に通い、民子の好きだった野菊を周りに植えます。", "caption": "政夫は七日間墓に通い、民子の好きだった野菊を周りに植えます。", "width": 1200, "height": 800}], "characterGalleryNote": "人物や衣服、渡し場・墓地などの細部は、小説をもとにした創作イラストです。当時の実景や実在人物の顔を復元したものではありません。", "credits": [["伊藤左千夫", "いとうさちお", "著者"]], "image": "assets/nogiku-wildflowers-path-scene.webp", "imageAlt": "棉を採りに行く道で、政夫は摘んだ野菊を民子に分けます。", "headerCaption": "棉を採りに行く道で、政夫は摘んだ野菊を民子に分けます。"}, {"id": "ito-sachio", "name": "伊藤左千夫", "reading": "いとうさちお", "cat": "person", "sub": "1864–1913｜短歌の場を育て、小説も書いた歌人", "motif": "book", "intro": "牛乳の仕事を営みながら歌を学び、正岡子規の弟子となった歌人・小説家。『野菊の墓』を書き、子規の没後は短歌雑誌や後進の育成にも力を注ぎました。", "gist": "暮らしの仕事と文学を続け、短歌と小説の両方に足跡を残した人。", "people": [], "theme": "", "memory": "", "links": ["nogiku-no-haka", "masaoka-shiki"], "sources": [{"title": "国立国会図書館：伊藤左千夫", "url": "https://www.ndl.go.jp/portrait/datas/6064/index.html"}, {"title": "山武市教育委員会：伊藤左千夫について", "url": "https://www.city.sammu.lg.jp/kyouiku/bunkazai-rekishi/siryoukan/page001450.html"}, {"title": "青空文庫：野菊の墓", "url": "https://www.aozora.gr.jp/cards/000058/files/647_20406.html"}], "bodyReadings": {"伊藤左千夫": "いとうさちお", "山武": "さんむ", "幸次郎": "こうじろう", "歌人": "かじん", "正岡子規": "まさおかしき", "写生": "しゃせい", "馬酔木": "あしび", "斎藤茂吉": "さいとうもきち", "土屋文明": "つちやぶんめい", "野菊": "のぎく", "竜胆": "りんどう", "蕎麦": "そば", "生業": "なりわい", "野菊の墓": "のぎくのはか"}, "checkedDate": "2026年11月3日", "primaryCategory": "person", "genreLabel": "人物", "sourceNote": "生涯と年譜は国立国会図書館・山武市の資料を照合しました。旧暦の誕生日と新暦を区別し、『野菊の墓』の発表は本文奥付と山武市年譜に一致する1906年1月を採用しています。作品の読み方は編集部の独自の案内です。肖像画像は未掲載です。", "authorTextOnly": true, "portraitNote": "この紹介には本人の肖像は掲載していません。", "longTitle": true}, {"id": "sakura-no-ki-no-shita-niwa", "name": "桜の樹の下には", "reading": "さくらのきのしたには", "intro": "満開の桜を前に、語り手は美しさだけでなく、不安や空しさを感じます。「おまえ」への語りかけを通して、花の美しさと暗い空想が結びついていく短い作品です。", "gist": "美しい花を信じられない不安が、死の空想を通して変わっていく。", "bodyReadings": {"桜の樹の下には": "さくらのきのしたには", "梶井基次郎": "かじいもとじろう", "檸檬": "れもん", "満開": "まんかい", "空想": "くうそう", "語り手": "かたりて", "谷川": "たにがわ", "空しさ": "むなしさ", "死骸": "しがい", "養分": "ようぶん", "花見": "はなみ", "宴": "うたげ", "詩と詩論": "しとしろん"}, "sources": [{"title": "梶井基次郎「桜の樹の下には」全本文・底本記録", "url": "https://www.aozora.gr.jp/cards/000074/files/427_19793.html"}, {"title": "青空文庫：図書カード・作者生没年", "url": "https://www.aozora.gr.jp/cards/000074/card427.html"}], "sourceNote": "青空文庫No.427の全本文を確認した独自の読書案内です。語り手の空想、数日前の谷川の回想、結末の気持ちを区別しています。地中の描写や虫についての語りは、植物学・昆虫学の説明ではありません。現代語訳や映像の設定は使用していません。", "termNote": "原文には死体や腐敗、身体に関する強い比喩が登場します。紹介と挿絵では具体的な身体描写を避け、語り手の心の動きに焦点を当てています。", "checkedDate": "2026年11月3日", "cat": "literature", "primaryCategory": "japanese-literature", "genreLabel": "日本文学", "genre": "japanese-fiction", "motif": "book", "sub": "梶井基次郎｜1928年発表", "people": [["「俺」", "桜への不安と、自分の空想や谷川の記憶を語る人。作者本人と同じ人物だとは断定しません。"], ["「おまえ」", "「俺」が呼びかける相手。苦しそうな顔や冷汗に触れられますが、名前・性別・具体的な関係は明示されません。"]], "synopsisSummary": ["語り手の「俺」は、桜があまりに美しく咲くことを素直に信じられず、二、三日の間、不安や空しさを感じていました。そこで「おまえ」と呼ぶ相手に、桜の下には死体が埋まっているのだ、と強く語りかけます。しかし、地面を掘って確かめたという話ではありません。桜の美しさを受け止めるために、語り手が思い描いた空想です。", "「俺」は、地中の死が花の美しさを支えている、と想像を広げます。根が養分を吸い上げ、花へ運ぶ様子まで見えるように感じるのです。「おまえ」は苦しそうな顔をしますが、「俺」は、ようやく桜を落ち着いて見られるようになったと言います。美しさの裏に不気味なものを思い浮かべることで、かえって安心するという、逆向きの心の動きです。", "続いて「俺」は、二、三日前の谷川での出来事を話します。水辺から舞い上がる虫を見たあと、水たまりを覆う虫の死骸が、光を受けて輝いているのを見つけました。「俺」はそこに、胸を突かれるような喜びを感じたと語ります。ただ明るく美しい景色だけでは心がはっきりせず、暗いものもあって初めてつり合うのだ、と自分の感覚を説明するのです。", "最後に、話は桜へ戻ります。「俺」自身にも、その空想がどこから来たのかは分かりません。それでも、死の想像と桜の姿は、もう切り離せなくなっています。いまなら、桜の下で花見をする村人たちと同じように酒を飲めそうだ、と感じて終わります。実際に宴に加わった場面ではなく、美しい花に向き合う気持ちの変化が描かれています。"], "summaryHeading": "要約", "links": ["kajii-motojiro"], "inlineIllustrations": [{"afterParagraph": 1, "src": "assets/sakura-blossoms-unease-scene.webp", "alt": "見事に咲いた桜を見ても、「俺」の心には不安が広がります。", "caption": "見事に咲いた桜を見ても、「俺」の心には不安が広がります。", "width": 1200, "height": 800}, {"afterParagraph": 3, "src": "assets/sakura-valley-memory-scene.webp", "alt": "数日前の谷川の記憶。「俺」は、水辺の美しさと死が重なる光景を語ります。", "caption": "数日前の谷川の記憶。「俺」は、水辺の美しさと死が重なる光景を語ります。", "width": 1200, "height": 800}, {"afterParagraph": 4, "src": "assets/sakura-distant-flower-viewing-scene.webp", "alt": "「俺」は、村人たちと同じように花見の酒が飲めそうだ、と感じます。", "caption": "「俺」は、村人たちと同じように花見の酒が飲めそうだ、と感じます。", "width": 1200, "height": 800}], "characterGalleryNote": "挿絵は、作品の花・谷川・花見の情景をもとにした創作です。語り手の空想を事実として描いたものではなく、人物や景観の細部も特定の実在者・実景を再現していません。", "contentType": "story-guide", "peopleHeading": "登場人物", "credits": [["梶井基次郎", "かじいもとじろう", "著者"]], "image": "assets/sakura-blossoms-unease-scene.webp", "imageAlt": "見事に咲いた桜を見ても、「俺」の心には不安が広がります。", "headerCaption": "見事に咲いた桜を見ても、「俺」の心には不安が広がります。"}, {"id": "koya-hijiri", "name": "高野聖", "reading": "こうやひじり", "intro": "雪の夜、旅先の宿で一人の僧が語る、昔の不思議な山越え。危険な山道を進み、山奥の家に助けを求めた若い僧は、優しくも恐ろしい力を持つ女性に出会います。", "gist": "助けてくれた人への思いと、引き返してはいけないという警告の間で揺れる山の物語。", "bodyReadings": {"高野聖": "こうやひじり", "泉鏡花": "いずみきょうか", "宗朝": "しゅうちょう", "高野山": "こうやさん", "敦賀": "つるが", "飛騨": "ひだ", "富山": "とやま", "次郎": "じろう", "蛭": "ひる", "修行": "しゅぎょう", "経文": "きょうもん", "洪水": "こうずい", "薬売り": "くすりうり", "回想": "かいそう", "天生峠": "あもうとうげ"}, "sources": [{"title": "泉鏡花「高野聖」原著本文・底本と初出", "url": "https://www.aozora.gr.jp/cards/000050/files/521_20583.html"}, {"title": "青空文庫：図書カード", "url": "https://www.aozora.gr.jp/cards/000050/card521.html"}, {"title": "国立国会図書館：泉鏡花の生没年", "url": "https://www.ndl.go.jp/portrait/datas/230"}], "sourceNote": "青空文庫の新字新仮名本文、全二十六節を確認した独自の読書案内です。僧の体験、老人から聞く説明、冬の宿の場面を区別しています。現代語訳や映画の設定は使用していません。解釈は原文の唯一の答えではありません。", "termNote": "「聖」は、ここでは仏道の修行をする僧のことです。原文には障害のある人を侮る言葉や、動物への暴力、身体の描写が含まれます。紹介では人物の役割を平易な言葉で説明し、その評価を事実として受け継がないようにしています。", "checkedDate": "2026年11月3日", "cat": "literature", "primaryCategory": "japanese-literature", "genreLabel": "日本文学", "genre": "japanese-fiction", "motif": "book", "sub": "泉鏡花｜1900年発表", "people": [["宗朝", "冬の宿で昔の体験を話す僧。山越えをした若いころの宗朝と、現在の宗朝は同じ人です。"], ["山の家の女性", "宗朝を助け、次郎と暮らす女性。人を動物に変える力や過去の事情は、老人の話を通して明かされます。"], ["次郎", "山の家の女性と暮らす、足の不自由な男性。女性に支えられ、澄んだ声で歌います。"], ["老人", "山の家へ出入りし、馬を売りに行く男性。翌日、女性の過去を語り、宗朝に戻らないよう警告します。"], ["富山の薬売り", "宗朝より先に危険な道へ入った旅人。後で老人は、馬に変えられたのはこの人だと話します。"], ["聞き手の「私」", "冬の旅で宗朝と出会い、宿でその話を聞く人。昔の山越えを自分で体験した人物ではありません。"]], "synopsisSummary": ["冬の旅で、語り手の「私」は高野山の僧・宗朝と知り合い、敦賀の宿に一緒に泊まります。その夜、宗朝は若いころの山越えを語り始めます。ここからは、冬の宿ではなく、昔の夏の飛騨の山中の話です。", "宗朝は旅の途中で富山の薬売りに出会います。薬売りは、長く使われていない危険な山道へ進んでしまいます。宗朝は相手に嫌な思いをさせられていましたが、危険を知らせようと後を追います。ところが蛇に驚き、林では蛭に襲われて、疲れ果てます。夕方、馬の声を頼りに、山奥の一軒家へたどり着きます。", "家には足の不自由な次郎という男性と、美しい女性が暮らしていました。女性は宗朝を泊めることにし、都の話を求めても聞かせないでほしい、と不思議なお願いをします。女性に谷川へ案内され、体を洗ってもらうと、宗朝の痛みはやわらぎます。親切さと美しさに心を引かれる一方、女性へ近寄る動物たちの様子に、普通ではないものも感じます。", "家へ戻ると、出入りしている老人が馬を売りに出かけます。その馬は宗朝たちの方を見て動こうとせず、女性の不思議な振る舞いの後、ようやく去ります。食事のあと、女性は次郎を優しく助け、歌うよう勧めます。澄んだ歌声と、次郎をいたわる女性の姿に、宗朝は涙を流します。最初に次郎を見て抱いた戸惑いとは、違う気持ちになったのです。", "夜、宗朝が休んでいると、戸の外に多くの動物の気配が集まります。女性の声が聞こえ、宗朝が経文を唱えるうち、外は静まります。翌朝、宗朝は家を出ます。しかし、女性の寂しさと、ここに残ってほしいという誘いを思い返し、修行をやめて戻りたくなります。滝の近くで引き返そうとしたところへ、馬を売って帰る老人が現れます。", "老人は、家の周囲の動物は女性の力で姿を変えられた男たちで、あの馬も薬売りだった、と話します。女性はもともと医者の娘で、父の治療後に歩けなくなった幼い次郎を家まで送りました。その間に洪水が起き、女性も帰る家を失います。以来十三年、次郎の世話を続けているというのです。それでも戻れば宗朝も動物にされる、と老人は止めます。宗朝が助かった理由も、志の強さや女性の情けによるものだ、と老人は説明します。", "老人が山へ戻ると、山の上に雲が湧き、雷が響きます。宗朝は家には戻らず、急いで里へ下ります。里に着くころ、山は激しい雨になりました。ここで語りは冬の敦賀の宿へ戻ります。宗朝は話の意味を教訓として説明しません。翌朝、「私」は雪の中を山へ向かう宗朝の姿を、名残惜しく見送ります。"], "summaryHeading": "要約", "links": ["izumi-kyoka"], "characterGallery": [{"name": "宗朝", "role": "冬の宿で昔の体験を話す僧。山越えをした若いころの宗朝と、現在の宗朝は同じ人です。", "wide": true, "portraits": [{"src": "assets/koya-face-shucho-young.webp", "label": "回想・若いころ", "alt": "宗朝の人物イメージ", "width": 500, "height": 500}, {"src": "assets/koya-face-shucho-older.webp", "label": "冬の旅・四十五、六歳", "alt": "宗朝の人物イメージ", "width": 500, "height": 500}]}, {"name": "山の家の女性", "role": "宗朝を助け、次郎と暮らす女性。人を動物に変える力や過去の事情は、老人の話を通して明かされます。", "wide": false, "portraits": [{"src": "assets/koya-face-woman.webp", "label": "回想・山の家", "alt": "山の家の女性の人物イメージ", "width": 500, "height": 500}]}, {"name": "次郎", "role": "山の家の女性と暮らす、足の不自由な男性。女性に支えられ、澄んだ声で歌います。", "wide": false, "portraits": [{"src": "assets/koya-face-jiro.webp", "label": "回想・山の家", "alt": "次郎の人物イメージ", "width": 500, "height": 500}]}, {"name": "老人", "role": "山の家へ出入りし、馬を売りに行く男性。翌日、女性の過去を語り、宗朝に戻らないよう警告します。", "wide": false, "portraits": [{"src": "assets/koya-face-oldman.webp", "label": "回想・家へ出入りする人", "alt": "老人の人物イメージ", "width": 500, "height": 500}]}, {"name": "富山の薬売り", "role": "宗朝より先に危険な道へ入った旅人。後で老人は、馬に変えられたのはこの人だと話します。", "wide": false, "portraits": [{"src": "assets/koya-face-medicine-seller.webp", "label": "回想・山道に入る前", "alt": "富山の薬売りの人物イメージ", "width": 500, "height": 500}]}, {"name": "聞き手の「私」", "role": "冬の旅で宗朝と出会い、宿でその話を聞く人。昔の山越えを自分で体験した人物ではありません。", "wide": false, "portraits": []}], "inlineIllustrations": [{"afterParagraph": 1, "src": "assets/koya-winter-story-scene.webp", "alt": "冬の敦賀の宿で、「私」は宗朝の昔の話を聞きます。", "caption": "冬の敦賀の宿で、「私」は宗朝の昔の話を聞きます。", "width": 1200, "height": 800}, {"afterParagraph": 4, "src": "assets/koya-jiro-song-scene.webp", "alt": "女性に勧められて次郎が歌い、宗朝は二人の様子に心を動かされます。", "caption": "女性に勧められて次郎が歌い、宗朝は二人の様子に心を動かされます。", "width": 1200, "height": 800}, {"afterParagraph": 6, "src": "assets/koya-oldman-warning-scene.webp", "alt": "家へ戻りかけた宗朝は、老人から女性と動物たちの事情を聞きます。", "caption": "家へ戻りかけた宗朝は、老人から女性と動物たちの事情を聞きます。", "width": 1200, "height": 800}], "characterGalleryNote": "人物の顔や家・山の細部は、作品の記述をもとにした創作です。冬の旅と、僧が語る若いころの体験を描き分けています。", "credits": [["泉鏡花", "いずみきょうか", "著者"]], "image": "assets/koya-winter-story-scene.webp", "imageAlt": "冬の敦賀の宿で、「私」は宗朝の昔の話を聞きます。", "headerCaption": "冬の敦賀の宿で、「私」は宗朝の昔の話を聞きます。"}, {"id": "izumi-kyoka", "name": "泉鏡花", "reading": "いずみきょうか", "cat": "person", "sub": "1873–1939｜人の思いと不思議な世界を描いた小説家", "motif": "book", "intro": "金沢に生まれ、尾崎紅葉に学んだ小説家。本名は泉鏡太郎です。『高野聖』などで、現実の風景と不思議な出来事、人の優しさと恐ろしさが重なる世界を描きました。", "gist": "人の心と幻想を、語りや風景の言葉で描いた作家。", "people": [], "theme": "", "memory": "", "links": ["koya-hijiri"], "sources": [{"title": "国立国会図書館：泉鏡花", "url": "https://www.ndl.go.jp/portrait/datas/230"}, {"title": "泉鏡花記念館：生涯・作品・年譜", "url": "https://kanazawa-museum.jp/kyoka/english/index.html"}, {"title": "「高野聖」原著・初出記録", "url": "https://www.aozora.gr.jp/cards/000050/files/521_20583.html"}, {"title": "泉鏡花記念館：紹介と年表", "url": "https://www.kanazawa-museum.jp/kyoka/kyoka/"}], "bodyReadings": {"泉鏡花": "いずみきょうか", "泉鏡太郎": "いずみきょうたろう", "金沢": "かなざわ", "尾崎紅葉": "おざきこうよう", "冠弥左衛門": "かんむりやざえもん", "夜行巡査": "やこうじゅんさ", "外科室": "げかしつ", "高野聖": "こうやひじり", "婦系図": "おんなけいず", "歌行燈": "うたあんどん", "天守物語": "てんしゅものがたり", "谷崎潤一郎": "たにざきじゅんいちろう", "川端康成": "かわばたやすなり", "次郎": "じろう", "戯曲": "ぎきょく"}, "checkedDate": "2026年11月3日", "primaryCategory": "person", "genreLabel": "人物", "sourceNote": "生涯と作品年は国立国会図書館・泉鏡花記念館の公開資料を確認しています。最後の節は原著に基づく独自の読書案内です。", "authorTextOnly": true, "portraitNote": "この紹介には本人の肖像は掲載していません。", "longTitle": true}, {"id": "kaze-tachinu", "name": "風立ちぬ", "reading": "かぜたちぬ", "intro": "高原で出会った「私」と節子は、やがて婚約し、山の療養所で暮らし始めます。病気への不安の中で、二人は小さな会話や景色を分かち合います。愛する人と生きる時間と、その記憶を見つめる小説です。", "gist": "共に暮らす幸福は、相手の不安を知ることで揺れ、別れた後にも形を変えて残る。", "bodyReadings": {"風立ちぬ": "かぜたちぬ", "堀辰雄": "ほりたつお", "節子": "せつこ", "白樺": "しらかば", "八ヶ岳": "やつがたけ", "婚約": "こんやく", "療養所": "りょうようじょ", "療養": "りょうよう", "病状": "びょうじょう", "院長": "いんちょう", "安静": "あんせい", "構想": "こうそう", "神父": "しんぷ", "死のかげの谷": "しのかげのたに", "序曲": "じょきょく", "鎮魂歌": "ちんこんか"}, "sources": [{"title": "青空文庫：風立ちぬ 全文", "url": "https://www.aozora.gr.jp/cards/001030/files/4803_14204.html"}, {"title": "青空文庫：図書カード・底本と初出", "url": "https://www.aozora.gr.jp/cards/001030/card4803.html"}, {"title": "国立国会図書館：堀辰雄", "url": "https://www.ndl.go.jp/portrait/datas/6234/index.html"}], "sourceNote": "青空文庫の「序曲」「春」「風立ちぬ」「冬」「死のかげの谷」の全五章に基づく独自の読書案内です。雑誌での発表順と単行本の章順は同じではありません。巻頭のヴァレリー、作中のリルケや聖書の引用を含む原文を確認しましたが、本案内ではそれらの詩句を転載していません。映画の人物や出来事は混ぜていません。", "termNote": "サナトリウムは療養のための施設。作中の診療や暮らしは当時の物語の描写であり、現在の治療や看護の勧めではありません。", "checkedDate": "2026年11月3日", "cat": "literature", "primaryCategory": "japanese-literature", "genreLabel": "日本文学・小説", "genre": "japanese-fiction", "motif": "book", "sub": "堀辰雄｜1938年単行本", "people": [["「私」", "節子と婚約し、療養所で付き添う語り手。二人の生活を小説に書こうとします。作者本人とそのまま同一とは扱いません。"], ["節子", "絵を描くことを好む若い女性。「私」の婚約者で、病気を療養しながら、自分の願いや不安も伝えます。"], ["節子の父", "娘の療養と生活を気にかける父親。「私」の仕事のことも心配します。"], ["院長", "山の療養所の医師。節子を診察し、病状や療養について説明します。"]], "synopsisSummary": ["語り手の「私」は、夏の高原で節子と出会います。節子が草原で絵を描き、「私」は白樺の木陰でその姿を眺めていました。二人は親しくなりますが、節子は父と帰っていきます。「私」は一人で仕事を再開し、秋の草原で、いつか節子と一緒に暮らせるだろうと思い描きます。", "出会いから二年近くたった春、二人は婚約しています。病気を抱えた節子は、山のサナトリウムという療養施設へ行くことを望み、「私」も付き添うと決めます。医師から病状を詳しく聞いた「私」は不安になりますが、節子もその気持ちを察します。四月下旬、父に見送られた二人は、八ヶ岳のふもとの療養所へ出発します。", "療養所では、節子は安静にして過ごし、「私」はそばで世話をします。会話や手のぬくもり、窓から一緒に眺める夕景が、二人にとって大切になります。しかし、いつかこの生活を思い出そうと言う「私」に対し、節子は、それほど長く生きられるだろうかと不安を口にします。同じ景色を見ていても、二人の心がいつも同じではないことが表れます。", "夏から秋へ季節が移る中、ほかの患者の死が「私」の不安を強めます。十月には節子の父が訪れますが、娘の回復は思うように進んでいません。父は「私」の仕事も心配します。その後、「私」は二人の生活を小説にしようと考えますが、構想の中で節子の死を美しい結末にしてしまう自分に気づき、恐れと恥ずかしさを覚えます。実際の節子はまだ生きており、「私」がそばにいる暮らしに満足していると伝えます。", "「冬」の章は、1935年十月からの日記の形になります。「私」は二人の幸福を書こうとしながら、仕事や自分の夢に気を取られ、目の前の節子を見失ってはいないかと悩みます。病状が悪化して看護師が付き添うことになり、「私」は別室へ移ります。十二月、節子が山の影に父の横顔を見つけ、少しだけ家へ帰りたいと言うと、「私」は動揺します。今度は節子が、うつむいた「私」の髪をなでます。", "最後の「死のかげの谷」では一年後の1936年十二月へ進み、節子を失った「私」が、かつて二人で過ごした村に一人で滞在します。節子の死の瞬間は直接語られません。雪に包まれた山小屋で、「私」は彼女の記憶を求め、ときにはそばにいるように感じます。それでも寂しさは消えません。神父との会話やリルケの詩を読む経験を通して、亡くなった節子を求め続ける自分の心に向き合います。", "クリスマスの帰り道、「私」は小屋の明かりが、思ったより遠い雪の上まで届いているのに気づきます。近くから見ると小さな光でも、気づかぬところで自分を支えるものがあるのかもしれない、と考えます。年末には、幸福か不幸かを問い詰めるだけではない、少し悲しく、それでも生きていられる気持ちになります。節子の愛を思いながら、静かな谷で遠くの風を聞くところで物語は終わります。"], "summaryHeading": "要約", "links": ["hori-tatsuo"], "inlineIllustrations": [{"afterParagraph": 1, "src": "assets/kaze-meadow-painting-scene.webp", "alt": "夏の高原で、節子は絵を描き、「私」は白樺の木陰からその姿を眺めます。", "caption": "夏の高原で、節子は絵を描き、「私」は白樺の木陰からその姿を眺めます。", "width": 1200, "height": 800}, {"afterParagraph": 5, "src": "assets/kaze-notebook-companionship-scene.webp", "alt": "「私」は二人の暮らしを書こうとしますが、生きている節子との時間に、簡単な結末はつけられません。", "caption": "「私」は二人の暮らしを書こうとしますが、生きている節子との時間に、簡単な結末はつけられません。", "width": 1200, "height": 800}, {"afterParagraph": 7, "src": "assets/kaze-cabin-light-scene.webp", "alt": "節子を失った翌冬、「私」は帰り道で、小屋の光が遠くの雪にも届いていることに気づきます。", "caption": "節子を失った翌冬、「私」は帰り道で、小屋の光が遠くの雪にも届いていることに気づきます。", "width": 1200, "height": 800}], "characterGalleryNote": "挿絵は作品の情景に基づく創作です。作者や実在のモデルの容貌、当時の建物・景観を再現するものではありません。", "contentType": "story-guide", "peopleHeading": "登場人物", "credits": [["堀辰雄", "ほりたつお", "著者"]], "image": "assets/kaze-meadow-painting-scene.webp", "imageAlt": "夏の高原で、節子は絵を描き、「私」は白樺の木陰からその姿を眺めます。", "headerCaption": "夏の高原で、節子は絵を描き、「私」は白樺の木陰からその姿を眺めます。"}, {"id": "hori-tatsuo", "name": "堀辰雄", "reading": "ほりたつお", "cat": "person", "sub": "1904–1953｜高原の風景と、愛・記憶・生の揺れを描いた作家", "motif": "book", "intro": "『風立ちぬ』『美しい村』『菜穂子』などを書いた小説家。西洋文学と日本の古典に学びながら、風景の中で変わっていく心や、人を失った後の記憶を描きました。", "gist": "自分の体験をそのまま語るだけでなく、記憶と心の動きを小説へ組み直した作家。", "people": [], "theme": "", "memory": "", "links": ["kaze-tachinu"], "sources": [{"title": "国立国会図書館：堀辰雄", "url": "https://www.ndl.go.jp/portrait/datas/6234/index.html"}, {"title": "長野県資料：郷土ゆかりの作家紹介", "url": "https://www.knowledge.pref.nagano.lg.jp/documents/22/local_kyoudo.pdf"}, {"title": "高志の国文学館：堀辰雄生誕120年展", "url": "https://www.bunka-toyama.jp/koshibun/eventinfo/detail.php?ev_id=8708"}, {"title": "青空文庫：風立ちぬ", "url": "https://www.aozora.gr.jp/cards/001030/files/4803_14204.html"}], "bodyReadings": {"堀辰雄": "ほりたつお", "麹町": "こうじまち", "神西清": "じんざいきよし", "室生犀星": "むろうさいせい", "芥川龍之介": "あくたがわりゅうのすけ", "小林秀雄": "こばやしひでお", "中野重治": "なかのしげはる", "山繭": "やままゆ", "驢馬": "ろば", "同人誌": "どうじんし", "聖家族": "せいかぞく", "軽井沢": "かるいざわ", "矢野綾子": "やのあやこ", "富士見高原療養所": "ふじみこうげんりょうようじょ", "風立ちぬ": "かぜたちぬ", "美しい村": "うつくしいむら", "菜穂子": "なおこ", "信濃追分": "しなのおいわけ", "書簡": "しょかん", "愛蔵書": "あいぞうしょ"}, "checkedDate": "2026年11月3日", "primaryCategory": "person", "genreLabel": "人物", "sourceNote": "生没年と文学活動は図書館・文学館の公開資料、作品の初出と内容は青空文庫の底本情報と全五章を照合しました。最後の節は作品に基づく独自の読書案内です。本人の肖像画像は掲載していません。", "authorTextOnly": true, "portraitNote": "この紹介には本人の肖像は掲載していません。", "longTitle": true}, {"id": "nisen-doka", "name": "二銭銅貨", "reading": "にせんどうか", "intro": "貧しい部屋で暮らす二人の青年が、行方不明の大金の話をしています。一枚の二銭銅貨をきっかけに、友人の松村は秘密の調べものを始めます。暗号を解く面白さと、人の思い込みが重なる探偵小説です。", "gist": "暗号を解く力と、答えを信じたい気持ちが、思わぬ結末につながる。", "bodyReadings": {"二銭銅貨": "にせんどうか", "江戸川乱歩": "えどがわらんぽ", "紳士盗賊": "しんしとうぞく", "正直堂": "しょうじきどう", "大黒屋商店": "だいこくやしょうてん", "五軒町": "ごけんちょう", "南無阿弥陀仏": "なむあみだぶつ", "点字": "てんじ", "按摩": "あんま", "暗号": "あんごう", "推理": "すいり", "玩具": "がんぐ", "紙片": "しへん", "銅貨": "どうか", "風呂敷": "ふろしき", "御冗談": "ごじょうだん", "復讐": "ふくしゅう", "松村": "まつむら", "圓": "えん", "團": "だん"}, "sources": [{"title": "江戸川乱歩「二銭銅貨」原著本文", "url": "https://www.aozora.gr.jp/cards/001779/files/56647_58167.html"}, {"title": "青空文庫：図書カード・版・作者生没年", "url": "https://www.aozora.gr.jp/cards/001779/card56647.html"}, {"title": "文化庁：保護期間延長Q&A", "url": "https://www.bunka.go.jp/seisaku/chosakuken/hokaisei/kantaiheiyo_chosakuken/1411890.html"}], "sourceNote": "青空文庫No.56647の上・中・下の全本文を確認した独自の案内です。暗号については本文の説明と解読文字を確認しています。別画像の解読表そのものは転載・再現していません。松村の推理と、最後に明かされる事実を分けて紹介しています。", "termNote": "二銭は当時のお金の単位。点字は点の組み合わせで文字を表す仕組みです。ここではそれを手がかりにした架空の暗号が登場します。原文の古い呼称は人物の役割が伝わる言葉で説明しています。 「圓」は「円」の古い字で、玩具の札では別の字の「團」（団）に変えてあります。", "checkedDate": "2026年11月3日", "cat": "literature", "primaryCategory": "japanese-literature", "genreLabel": "日本文学・探偵小説", "genre": "japanese-fiction", "motif": "book", "sub": "江戸川乱歩｜1923年発表", "people": [["「私」", "松村と暮らし、出来事を読者に語る青年。自分だけが知っている事情を、初めは明かしません。"], ["松村武", "「私」の友人で同居人。暗号を調べ、盗まれた金を見つけたと考えます。"], ["紳士盗賊", "新聞記者を装って電気工場の金を盗んだ男。逮捕されても金の隠し場所を明かしません。"], ["点字を教える生徒", "按摩の仕事をする、二人の知り合い。松村に点字の仕組みを教え、解読の助けとなります。"], ["正直堂の印刷屋", "「私」の遠い親戚。大黒屋商店が注文した玩具の札を印刷しています。盗賊の共犯ではありません。"]], "synopsisSummary": ["語り手の「私」と友人の松村武は、お金に困り、下駄屋の二階の六畳一間で暮らしています。二人は普段から、どちらが頭がよいかを競い合っていました。そんなころ、新聞記者を装った男が、電気工場から給料用の約五万円を盗む事件が起きます。刑事は珍しい煙草の吸い殻を手がかりに犯人を捕まえますが、金の行方は分かりません。工場は、金を発見した人へ五千円の賞金を出すと発表します。", "ある日、「私」が置いた二銭銅貨について、松村がしつこく尋ねます。「私」は煙草のつり銭だと答え、煙草屋の娘は監獄への差し入れを扱う店へ嫁いだ、とも話します。松村は考え込み、按摩の仕事をする知り合いの生徒を呼びます。その後は二枚の紙を比べ、新聞紙の余白へ書き込み、借りた東京の地図まで調べます。「私」から十円を受け取って外出した翌朝、松村は商人の姿で戻り、風呂敷には五万円が入っていると得意そうに告げます。", "松村が明かした発端は、二銭銅貨が開く容器になっていたことでした。中には「南無阿弥陀仏」の六字を使った不思議な紙片がありました。松村は、これを盗賊が外の仲間へ送る暗号だと考えたのです。六つの点で文字を表す点字を思いつき、生徒から教わって文字へ置き換えると、五軒町の正直堂で、大黒屋商店を受取人として玩具の札を受け取れ、という指示が読めました。", "松村はさらに、盗賊が本物の金を玩具の札とすり替え、印刷屋に隠したに違いないと推理しました。変装して正直堂へ行き、包みを受け取ったのです。盗賊の復讐を恐れ、賞金と交換せず五万円を自分たちで取っておこう、とも言います。暗号を読めたという事実から、金が本物だという想像まで正しいと思い込み、「私」より自分の方が頭がよいと誇ります。", "ところが「私」は笑い出し、解いた文章をもう一つの読み方で拾うと「御冗談」となることを示します。松村は包みを開きますが、札には「圓」の代わりに「團」の字が印刷されていました。本物ではなく、初めから玩具の札だったのです。松村の喜びは消え、一日中黙り込みます。「私」は、自分のいたずらが友人を深く傷つけたことを悔やみます。", "最後に「私」が読者へ仕掛けを説明します。正直堂は「私」の遠い親戚で、金を借りに行った際に、大黒屋が注文した玩具の札を見たのでした。それを利用して、自分で暗号を作り、松村が発見するよう銅貨を置きました。煙草屋の娘の話も作り話です。銅貨そのものは人からもらったとだけ説明し、詳しい入手事情は伏せます。本当の盗難金が見つかったわけではなく、二人の知恵比べが苦い結果を残して終わります。"], "summaryHeading": "要約", "links": ["edogawa-ranpo"], "characterGallery": [{"name": "「私」", "role": "松村と暮らし、出来事を読者に語る青年。自分だけが知っている事情を、初めは明かしません。", "wide": false, "portraits": [{"src": "assets/nisen-face-narrator.webp", "label": "二人のうちの語り手", "alt": "「私」の人物イメージ", "width": 500, "height": 500}]}, {"name": "松村武", "role": "「私」の友人で同居人。暗号を調べ、盗まれた金を見つけたと考えます。", "wide": false, "portraits": [{"src": "assets/nisen-face-matsumura.webp", "label": "変装する前の青年", "alt": "松村武の人物イメージ", "width": 500, "height": 500}]}, {"name": "紳士盗賊", "role": "新聞記者を装って電気工場の金を盗んだ男。逮捕されても金の隠し場所を明かしません。", "wide": false, "portraits": [{"src": "assets/nisen-face-thief.webp", "label": "記者に変装していたとき", "alt": "紳士盗賊の人物イメージ", "width": 500, "height": 500}]}, {"name": "点字を教える生徒", "role": "按摩の仕事をする、二人の知り合い。松村に点字の仕組みを教え、解読の助けとなります。", "wide": false, "portraits": [{"src": "assets/nisen-face-student.webp", "label": "松村に点字を教える人", "alt": "点字を教える生徒の人物イメージ", "width": 500, "height": 500}]}, {"name": "正直堂の印刷屋", "role": "「私」の遠い親戚。大黒屋商店が注文した玩具の札を印刷しています。盗賊の共犯ではありません。", "wide": false, "portraits": [{"src": "assets/nisen-face-printer.webp", "label": "語り手の親戚", "alt": "正直堂の印刷屋の人物イメージ", "width": 500, "height": 500}]}], "inlineIllustrations": [{"afterParagraph": 2, "src": "assets/nisen-cipher-research-scene.webp", "alt": "松村は二枚の紙を比べ、新聞紙の余白に書き込みながら調べます。", "caption": "松村は二枚の紙を比べ、新聞紙の余白に書き込みながら調べます。", "width": 1200, "height": 800}, {"afterParagraph": 4, "src": "assets/nisen-printshop-pickup-scene.webp", "alt": "商人の姿になった松村は、正直堂で包みを受け取ります。", "caption": "商人の姿になった松村は、正直堂で包みを受け取ります。", "width": 1200, "height": 800}, {"afterParagraph": 5, "src": "assets/nisen-toy-money-silence-scene.webp", "alt": "札が玩具だと分かり、松村は黙り込みます。「私」はいたずらを悔やみます。", "caption": "札が玩具だと分かり、松村は黙り込みます。「私」はいたずらを悔やみます。", "width": 1200, "height": 800}], "characterGalleryNote": "人物や部屋・店の細部は、原著の記述をもとにした創作です。松村は変装前と後で同じ人物です。暗号の表や紙幣を精密に再現した画像ではありません。", "credits": [["江戸川乱歩", "えどがわらんぽ", "著者"]], "image": "assets/nisen-cipher-research-scene.webp", "imageAlt": "松村は二枚の紙を比べ、新聞紙の余白に書き込みながら調べます。", "headerCaption": "松村は二枚の紙を比べ、新聞紙の余白に書き込みながら調べます。"}, {"id": "edogawa-ranpo", "name": "江戸川乱歩", "reading": "えどがわらんぽ", "cat": "person", "sub": "1894–1965｜謎と不思議さを描き、推理文学を育てた作家", "motif": "book", "intro": "『二銭銅貨』で登場し、推理や怪奇、少年向けの物語を広げた小説家。本名は平井太郎です。作品を書くほか、評論や編集、新人の育成にも取り組みました。", "gist": "謎を解く面白さと不思議な想像を広げ、次の書き手も支えた作家。", "people": [], "theme": "", "memory": "", "links": ["nisen-doka"], "sources": [{"title": "立教大学：江戸川乱歩・旧蔵資料", "url": "https://www.rikkyo.ac.jp/research/institute/rampo/"}, {"title": "新宿区立図書館：江戸川乱歩", "url": "https://www.library.shinjuku.tokyo.jp/database/jinbutuyukari/010/post12.html"}, {"title": "新潮社：著者プロフィール", "url": "https://www.shinchosha.co.jp/writer/964/"}, {"title": "「二銭銅貨」原著", "url": "https://www.aozora.gr.jp/cards/001779/files/56647_58167.html"}], "bodyReadings": {"江戸川乱歩": "えどがわらんぽ", "平井太郎": "ひらいたろう", "名張": "なばり", "名古屋": "なごや", "早稲田大学": "わせだだいがく", "二銭銅貨": "にせんどうか", "新青年": "しんせいねん", "人間椅子": "にんげんいす", "屋根裏の散歩者": "やねうらのさんぽしゃ", "怪人二十面相": "かいじんにじゅうめんそう", "少年倶楽部": "しょうねんくらぶ", "探偵": "たんてい", "池袋": "いけぶくろ", "立教大学": "りっきょうだいがく", "評論": "ひょうろん"}, "checkedDate": "2026年11月3日", "primaryCategory": "person", "genreLabel": "人物", "sourceNote": "生涯は大学・公立図書館・出版社の公開資料で確認しました。最後の節は原著をもとにした独自の読書案内です。", "authorTextOnly": true, "portraitNote": "この紹介には本人の肖像は掲載していません。", "longTitle": true}, {"id": "yagi-no-uta", "name": "山羊の歌", "reading": "やぎのうた", "intro": "街の夕暮れ、故郷の風、雪や汽車の音。中原中也の最初の詩集は、身近な風景に、懐かしさや悲しみ、愛する心を重ねます。44編を五つの部に分けて収めた作品です。", "gist": "音や風景の向こうに、悲しみだけでは言い尽くせない心の揺れを感じる詩集。", "bodyReadings": {"山羊": "やぎ", "中原中也": "なかはらちゅうや", "詩篇": "しへん", "帰郷": "ききょう", "向日葵": "ひまわり", "盲目": "もうもく", "木蔭": "こかげ", "更くる": "ふくる", "囲炉裏": "いろり", "湯屋": "ゆや", "生ひ立ち": "おいたち", "羊": "ひつじ", "初刊": "しょかん", "文圃堂": "ぶんぽどう", "山羊の歌": "やぎのうた"}, "sources": [{"title": "青空文庫『山羊の歌』本文", "url": "https://www.aozora.gr.jp/cards/000026/files/894_28272.html"}, {"title": "青空文庫 図書カード", "url": "https://www.aozora.gr.jp/cards/000026/card894.html"}, {"title": "中原中也記念館：初詩集刊行について", "url": "https://chuyakan.jp/news/2021yagi/"}, {"title": "新宿区立図書館：中原中也", "url": "https://www.library.shinjuku.tokyo.jp/database/jinbutuyukari/050/post43.html"}], "sourceNote": "青空文庫の新字旧仮名本文、五部44編を確認して作成した独自の読書案内です。全詩の逐語解説ではありません。紹介する三つの情景は別々の詩の代表例で、続き物の出来事ではありません。", "termNote": "「湯屋」は風呂屋、「囲炉裏」は床を切って火を使う炉です。「山羊の歌」は詩集名、最後の部とその中の詩の題は「羊の歌」です。", "checkedDate": "2026年11月3日", "cat": "literature", "primaryCategory": "japanese-literature", "genreLabel": "日本文学・詩集", "genre": "japanese-poetry", "motif": "book", "sub": "中原中也｜1934年初刊", "people": [["中原中也", "この詩集を書いた詩人。各編の語り手や登場する人を、すべて作者本人や同じ実在人物と決めることはできません。"]], "synopsisSummary": ["『山羊の歌』は、中原中也が1934年に刊行した最初の詩集です。五つの部に44編が収められ、一人の主人公が同じ出来事を順に経験する物語ではありません。街や故郷、恋しい人、過ぎた時間が、それぞれの詩の声や風景になって現れます。以下は全編の筋ではなく、五つの部を読むための案内です。", "最初の「初期詩篇」では、夕暮れや月、サーカスなど、見慣れたものが不思議な姿で描かれます。「帰郷」には、懐かしい場所へ帰っても自分の歩みを問い直してしまう心があります。一方、「夏の日の歌」では、晴れた田舎の駅と向日葵、汽車の音から、母を思わせる懐かしさが広がります。暗さだけでなく、光や音の鮮やかさもこの部の大切な要素です。", "二つ目の「少年時」では、昔の自分や愛する人への思いと、今の自分の心細さが重なります。「盲目の秋」は、相手を待つ気持ちや、愛を失いかけた苦しさを、一つの答えにまとめずに動かしていきます。「木蔭」には、日差しや木の葉を見つめるうちに心がやわらぐ時間もあります。", "三つ目の「みちこ」では、愛情や悲しみに向き合う声が続きます。「汚れつちまつた悲しみに……」の雪と風は、悲しみがすぐには消えない感覚につながります。ただ、この部全体が絶望で閉じるわけではありません。「更くる夜」の語り手は、囲炉裏の前で、近所の湯屋の物音や犬の声を聞きます。そして、自分の中にまだやさしい心が残っていることを感じます。", "四つ目の「秋」には、去っていった人への記憶や、若い日への悔いが響きます。「生ひ立ちの歌」では、幼い頃からの時間が、雪のさまざまな手触りを通して振り返られます。そこには、生きることへの願いもあります。詩の中の死や別れを、すべて作者の同じ体験の記録だと決めつけず、言葉が作る時間の重なりとして読むことができます。", "最後の部は、詩集名とは一字違う「羊の歌」です。祈る気持ち、ひとりでいる苦しさ、人を信じたい願いが並びます。この部と同じ題の詩には、冬の朝、少女がそばにいる静かなひとときもあります。しかし、その後にも孤独や疲れは戻ってきます。安心を一度感じたら、悩みがすべて終わるという展開ではありません。", "詩集の最後は「いのちの声」です。生きることの意味を求め、世の中への怒りややりきれなさも語りながら、末尾には夕方の空の下にいる一人の小さな姿が残ります。明快な成功や救済で締めくくるのではなく、答えを決められないまま生きている心まで、詩の言葉で受け止めようとする作品として読めます。"], "summaryHeading": "詩集の流れと読みどころ", "links": ["nakahara-chuya"], "inlineIllustrations": [{"afterParagraph": 2, "src": "assets/yagi-summer-station-scene.webp", "alt": "「夏の日の歌」の一情景。晴れた田舎の駅に向日葵が咲き、汽車の音が懐かしさを呼びます。", "caption": "「夏の日の歌」の一情景。晴れた田舎の駅に向日葵が咲き、汽車の音が懐かしさを呼びます。", "width": 1200, "height": 800}, {"afterParagraph": 4, "src": "assets/yagi-late-night-hearth-scene.webp", "alt": "「更くる夜」の語り手は、囲炉裏の前で、心に残るやさしさを感じます。", "caption": "「更くる夜」の語り手は、囲炉裏の前で、心に残るやさしさを感じます。", "width": 1200, "height": 800}, {"afterParagraph": 7, "src": "assets/yagi-evening-solitude-scene.webp", "alt": "最後の詩「いのちの声」の末尾。夕方の大きな空の下に、一人の小さな姿が残ります。", "caption": "最後の詩「いのちの声」の末尾。夕方の大きな空の下に、一人の小さな姿が残ります。", "width": 1200, "height": 800}], "characterGalleryNote": "挿絵は、別々の詩に基づく創作の情景です。作者本人の姿や実在の場所を再現したものではなく、三枚で一つの物語を表すものでもありません。", "contentType": "poetry-guide", "peopleHeading": "作者と詩の声", "introHeading": "この本について", "introBadge": "詩集の入口", "credits": [["中原中也", "なかはらちゅうや", "著者"]], "image": "assets/yagi-summer-station-scene.webp", "imageAlt": "「夏の日の歌」の一情景。晴れた田舎の駅に向日葵が咲き、汽車の音が懐かしさを呼びます。", "headerCaption": "「夏の日の歌」の一情景。晴れた田舎の駅に向日葵が咲き、汽車の音が懐かしさを呼びます。"}, {"id": "nakahara-chuya", "name": "中原中也", "reading": "なかはらちゅうや", "cat": "person", "sub": "1907–1937｜音と風景に、心の揺れを重ねた詩人", "motif": "book", "intro": "『山羊の歌』『在りし日の歌』で知られる詩人。短歌から出発し、フランスの詩にも学びながら、懐かしさや悲しみ、愛する気持ちを、独特な音と風景の言葉にしました。", "gist": "説明しきれない気持ちを、言葉の音や身近な風景で感じさせる詩を書いた人。", "people": [], "theme": "", "memory": "", "links": ["yagi-no-uta"], "sources": [{"title": "中原中也記念館：中原中也について", "url": "https://chuyakan.jp/about-chuya/"}, {"title": "国立国会図書館：中原中也", "url": "https://www.ndl.go.jp/portrait/datas/6455"}, {"title": "中原中也記念館：山羊の日", "url": "https://chuyakan.jp/news/2021yagi/"}, {"title": "新宿区立図書館：中原中也", "url": "https://www.library.shinjuku.tokyo.jp/database/jinbutuyukari/050/post43.html"}, {"title": "青空文庫『山羊の歌』", "url": "https://www.aozora.gr.jp/cards/000026/files/894_28272.html"}], "bodyReadings": {"中原中也": "なかはらちゅうや", "湯田温泉": "ゆだおんせん", "短歌": "たんか", "高橋新吉": "たかはししんきち", "富永太郎": "とみながたろう", "小林秀雄": "こばやしひでお", "大岡昇平": "おおおかしょうへい", "河上徹太郎": "かわかみてつたろう", "同人誌": "どうじんし", "白痴群": "はくちぐん", "歴程": "れきてい", "山羊の歌": "やぎのうた", "文圃堂": "ぶんぽどう", "帰郷": "ききょう", "在りし日の歌": "ありしひのうた", "更くる夜": "ふくるよる", "炉辺": "ろへん"}, "checkedDate": "2026年11月3日", "primaryCategory": "person", "genreLabel": "人物", "sourceNote": "生涯と刊行年は記念館・図書館の資料に基づき、最後の節は原著を読んだ図鑑独自の読書案内です。", "authorTextOnly": true, "portraitNote": "この紹介には本人の肖像は掲載していません。", "longTitle": true}, {"id": "ushi-o-tsunaida-tsubaki-no-ki", "name": "牛をつないだ椿の木", "reading": "うしをつないだつばきのき", "intro": "牛が椿の葉を食べてしまった出来事から、海蔵は道ばたに井戸を作ろうと考えます。通りかかる皆が水を飲めるようにするためですが、金を集めることも、土地を使わせてもらうことも、簡単には進みません。", "gist": "みんなのための井戸を願う人が、自分の心も見つめ直し、形ある仕事を残す物語。", "bodyReadings": {"新美南吉": "にいみなんきち", "椿": "つばき", "海蔵": "かいぞう", "利助": "りすけ", "新五郎": "しんごろう", "井戸新": "いどしん", "人力車": "じんりきしゃ", "地主": "じぬし", "井戸": "いど", "寄付": "きふ", "山林": "さんりん", "費用": "ひよう", "出資": "しゅっし", "日露戦争": "にちろせんそう", "喉": "のど", "潤し": "うるおし", "少國民文化": "しょうこくみんぶんか"}, "sources": [{"title": "青空文庫『牛をつないだ椿の木』全本文", "url": "https://www.aozora.gr.jp/cards/000121/files/638_34289.html"}, {"title": "青空文庫 図書カード・初出", "url": "https://www.aozora.gr.jp/cards/000121/card638.html"}], "sourceNote": "青空文庫の新字新仮名本文、全七節を確認した独自の紹介です。底本は講談社『少年少女日本文学館第十五巻 ごんぎつね・夕鶴』1986年初版、1993年第13刷です。作品内の戦争の時代と、1943年の発表を区別しています。", "termNote": "人力車は人がひいて客を運ぶ車です。井戸の三十円は作中の当時の金額で、現在の三十円と同じ価値ではありません。病状や作中のおまじないは、現在の医療上の説明・推奨ではありません。", "checkedDate": "2026年11月3日", "cat": "literature", "primaryCategory": "japanese-literature", "genreLabel": "日本の創作童話", "genre": "japanese-fiction", "motif": "book", "sub": "新美南吉｜1943年発表", "people": [["海蔵", "人力車をひく働き手。母と暮らし、道ばたに井戸を作ろうとする。"], ["利助", "牛をひく働き手。牛が椿の葉を食べてしまう。海蔵から出資を頼まれるが断る。"], ["海蔵の母", "海蔵と暮らす年配の女性。井戸の計画に賛成し、のちに息子の心の変化を指摘する。"], ["新五郎", "井戸掘りの職人。「井戸新」とも呼ばれ、費用や水が出そうな場所を海蔵に話す。"], ["地主の老人", "椿の木と周辺の土地の持ち主。井戸を拒むが、海蔵の謝罪を聞いて考えを変える。"], ["地主の息子", "父の跡を継いだら井戸を許すと海蔵に話す人物。地主本人とは別人。"]], "synopsisSummary": ["牛をひく利助と、人力車をひく海蔵は、山道のそばの椿の木に牛と車を残し、少し離れた泉へ水を飲みに行きます。戻ると、牛が椿の葉をすっかり食べてしまい、土地の持ち主の老人が怒っていました。海蔵も一緒に謝り、ようやくその場を収めます。水場が道から遠くなければ、こんなことにならなかったのに、と二人は思います。", "海蔵は、椿の木の近くに井戸を掘れないかと考えます。井戸掘りの新五郎に聞くと、費用は三十円ほどです。海蔵と暮らす年老いた母も、道を通る働き手や旅人、子どもたちが助かると賛成しました。けれど、二人の家にとっては大金です。", "海蔵は、山林で金をもうけたと聞く利助に費用を出してほしいと頼みます。利助は井戸が便利になることには同意しますが、皆が使う井戸の金を、なぜ自分だけが出すのかと断ります。海蔵は寄付を募る箱も椿の木につけます。しかし、説明の札を読めない人も、感心するだけで通り過ぎる人もいて、金は集まりません。", "そこで海蔵は、好きなお菓子を買うのをやめて、少しずつ自分でため始めます。仲間とお菓子を食べて遊びたい気持ちを我慢し、二年ほどかけて費用をほぼ用意しました。ところが今度は、あの椿の木の持ち主である地主が、井戸を掘ることを許してくれません。海蔵は何度も頼みに通います。", "ある日、地主はしゃっくりが止まらず、弱って寝ていました。それでも井戸を断ります。帰り際、地主の息子が、自分の代になれば許すと約束します。海蔵は、老人が間もなく死ねば井戸を掘れると喜んでしまいました。その話を聞いた母は、目的ばかりを考えて、人の死を待つようになっていると指摘します。", "翌朝、海蔵は地主が生きているうちに会い、死を待った自分の心を謝ります。井戸は別の場所を探すから、生きていてほしいと伝えました。地主はその言葉に心を動かされ、土地を使う許可だけでなく、費用が足りなければ出すと申し出ます。海蔵にとっては、井戸を掘れることに加え、地主の心が変わったことも喜びとなりました。", "春の終わり、道の片側には椿、向かい側には新しい井戸ができています。日露戦争へ出発する海蔵は、井戸の水を飲む二人の子どもを見て微笑み、自分も水を飲みました。人の役に立つものを残せた喜びを胸に、海蔵は出かけます。しかし戦争で命を失い、帰ってきません。最後には、海蔵の残した井戸が、その後も道を行く人々の喉を潤していることが語られます。"], "summaryHeading": "要約", "links": ["niimi-nankichi"], "characterGallery": [{"name": "海蔵", "role": "人力車をひく働き手。母と暮らし、道ばたに井戸を作ろうとする。", "wide": false, "portraits": [{"src": "assets/ushi-face-kaizo.webp", "label": "人力車をひく頃", "alt": "海蔵の人物イメージ", "width": 500, "height": 500}]}, {"name": "利助", "role": "牛をひく働き手。牛が椿の葉を食べてしまう。海蔵から出資を頼まれるが断る。", "wide": false, "portraits": [{"src": "assets/ushi-face-risuke.webp", "label": "牛をひく働き手", "alt": "利助の人物イメージ", "width": 500, "height": 500}]}, {"name": "海蔵の母", "role": "海蔵と暮らす年配の女性。井戸の計画に賛成し、のちに息子の心の変化を指摘する。", "wide": false, "portraits": [{"src": "assets/ushi-face-mother.webp", "label": "海蔵と暮らす母", "alt": "海蔵の母の人物イメージ", "width": 500, "height": 500}]}, {"name": "新五郎", "role": "井戸掘りの職人。「井戸新」とも呼ばれ、費用や水が出そうな場所を海蔵に話す。", "wide": false, "portraits": [{"src": "assets/ushi-face-shingoro.webp", "label": "井戸掘りの職人", "alt": "新五郎の人物イメージ", "width": 500, "height": 500}]}, {"name": "地主の老人", "role": "椿の木と周辺の土地の持ち主。井戸を拒むが、海蔵の謝罪を聞いて考えを変える。", "wide": false, "portraits": [{"src": "assets/ushi-face-landowner.webp", "label": "椿と土地の持ち主", "alt": "地主の老人の人物イメージ", "width": 500, "height": 500}]}, {"name": "地主の息子", "role": "父の跡を継いだら井戸を許すと海蔵に話す人物。地主本人とは別人。", "wide": false, "portraits": [{"src": "assets/ushi-face-son.webp", "label": "地主の跡を継ぐ立場の息子", "alt": "地主の息子の人物イメージ", "width": 500, "height": 500}]}], "inlineIllustrations": [{"afterParagraph": 1, "src": "assets/ushi-camellia-leaves-scene.webp", "alt": "水を飲んで戻ると、牛は椿の葉を食べてしまっていました。海蔵も利助と一緒に地主へ謝ります。", "caption": "水を飲んで戻ると、牛は椿の葉を食べてしまっていました。海蔵も利助と一緒に地主へ謝ります。", "width": 1200, "height": 800}, {"afterParagraph": 6, "src": "assets/ushi-apology-landowner-scene.webp", "alt": "海蔵は井戸の許可を迫るのではなく、地主の死を待った自分の心を謝ります。", "caption": "海蔵は井戸の許可を迫るのではなく、地主の死を待った自分の心を謝ります。", "width": 1200, "height": 800}, {"afterParagraph": 7, "src": "assets/ushi-well-children-scene.webp", "alt": "出発前の海蔵は、新しい井戸の水を飲む二人の子どもを、うれしそうに見守ります。", "caption": "出発前の海蔵は、新しい井戸の水を飲む二人の子どもを、うれしそうに見守ります。", "width": 1200, "height": 800}], "characterGalleryNote": "顔、衣服、道や井戸の細部は、作品に基づく創作です。最後の挿絵は海蔵が出発する前の場面で、戦争から戻った姿ではありません。", "credits": [["新美南吉", "にいみなんきち", "著者"]], "image": "assets/ushi-camellia-leaves-scene.webp", "imageAlt": "水を飲んで戻ると、牛は椿の葉を食べてしまっていました。海蔵も利助と一緒に地主へ謝ります。", "headerCaption": "水を飲んで戻ると、牛は椿の葉を食べてしまっていました。海蔵も利助と一緒に地主へ謝ります。"}, {"id": "amedama", "name": "飴だま", "reading": "あめだま", "intro": "春の渡し舟に、母親と二人の子ども、ひげを生やした侍が乗り合わせます。子どもたちが一つしかない飴だまを欲しがると、侍は目を覚まします。母親は侍が怒ったと思い、心配します。", "gist": "一つの飴だまをめぐり、母親の心配と侍の思いがけない行動を描く短い童話。", "bodyReadings": {"新美南吉": "にいみなんきち", "飴だま": "あめだま", "渡し舟": "わたしぶね", "母親": "ははおや", "二人": "ふたり", "旅人": "たびびと", "侍": "さむらい", "居眠り": "いねむり", "紙袋": "かみぶくろ", "向こう岸": "むこうぎし", "刀": "かたな", "舟": "ふね", "一つ": "ひとつ", "二つ": "ふたつ", "危害": "きがい", "原典": "げんてん", "結末": "けつまつ"}, "sources": [{"title": "青空文庫『飴だま』全本文", "url": "https://www.aozora.gr.jp/cards/000121/files/4723_13209.html"}, {"title": "青空文庫『飴だま』図書カード・底本情報", "url": "https://www.aozora.gr.jp/cards/000121/card4723.html"}], "sourceNote": "青空文庫の新字新仮名本文を冒頭から結末まで確認した独自の紹介です。底本は大日本図書・てのり文庫『ごんぎつね 新美南吉童話作品集1』1988年7月8日第1刷、底本の親本は『校定 新美南吉全集』です。作品の初出年月は今回未確認です。", "termNote": "渡し舟は、川の向こう岸へ人などを運ぶ舟です。子ども①・②は紹介のための区別で、原典の名前や年齢の順番ではありません。", "checkedDate": "2026年11月3日", "cat": "literature", "primaryCategory": "japanese-literature", "genreLabel": "日本の創作童話", "genre": "japanese-fiction", "motif": "book", "sub": "新美南吉｜日本の創作童話", "people": [["侍", "黒いひげを生やした、強そうな男性。舟の中で居眠りをし、のちに飴だまを二つに分ける。"], ["母親", "小さな子どもを二人連れた旅人。侍が怒ったのではないかと心配する。"], ["子ども①", "母親と舟に乗る二人のうち、先に飴だまを欲しがった子ども。"], ["子ども②", "もう一人の子ども。同じように飴だまを欲しがる。"]], "synopsisSummary": ["暖かい春の日、母親が小さな子どもを二人連れて渡し舟に乗ります。出発間際に侍が走ってきて乗り込み、舟の真ん中で居眠りを始めます。黒いひげを生やした強そうな侍がうとうとする姿を見て、子どもたちは笑います。母親は侍を怒らせないよう、静かにするよう伝えます。", "やがて子どもたちは飴だまを欲しがります。しかし、母親の紙袋には一つしか残っていません。向こう岸に着いたら買うと言っても、二人は待てません。侍が目を開けているのを見た母親は、眠りを邪魔されて怒っているのだと思います。", "侍が刀を抜いて近づくと、母親は子どもに危害を加えられると思い、かばいます。ところが侍が求めたのは飴だまでした。舟のへりに置いた飴だまを刀で二つに割り、子どもたちに分けてくれます。その後、侍は元の場所に戻り、また居眠りを始めます。"], "summaryHeading": "要約", "links": ["niimi-nankichi"], "characterGallery": [{"name": "侍", "role": "黒いひげを生やした、強そうな男性。舟の中で居眠りをし、のちに飴だまを二つに分ける。", "wide": false, "portraits": [{"src": "assets/amedama-face-samurai.webp", "label": "舟に乗り合わせた侍", "alt": "侍の人物イメージ", "width"
